河南均州与当地教众策划起事时被捕。XFFL, 4/14a–15a. 嘉庆元年三月二十三日，景安请求从自己麾下九百满洲兵中调四百名到南阳。他还请求从山东兖州调一千名士兵到河南。XFFL, 5/16a–17a.\n嘉庆元年三月二十二日，陕西一千名绿营兵到达襄阳。五百名留驻襄阳，另外五百名前往当阳。XFFL, 6/3a–b, 6/22a–b, 7/1a–3b, 7/10b–11a.\nXFFL, 6/1a–2a.\nXFFL, 6/18a–b.\nXFFL, 6/19b–20a; 8/8b–9a.\nXFFL, 6/20a–21b.\nXFFL, 8/9a–10b. 乾隆的建议被采纳了。1796年，一百七十至一百八十名蒙古盗马贼与盗牛贼参加了战争。到1802年，只剩下二十四人。1803年首捷前夕，他们获赦，被允许返回蒙古。XFFL, 344/23b–29a.\n后来披露，遇袭时温福及其许多部下已酩酊大醉。关于这场惨败，见QSG, 10880–82; QSLQL, 1005/21b–23b. 永保的传记见QSG, 11163–66. 清朝设公、侯、伯、子、男五等爵位，授予功勋卓著的官员。\nQSLJQ, 3/4a.\nXFFL, 154/4b–5a.\nBLJZL, 1:95–97, 100–101.\n13世纪，蒙古军队因中国军队的顽强防守，围攻樊城与襄阳达三年之久。1273年破城后，蒙古军迅速横扫长江流域。明末，李自成与张献忠都曾攻占襄阳。帕森斯（Parsons）Peasant Rebellions, 79–80, 106–13。\n嘉庆元年六月初二日，他们吃了一场败仗，随后向东南方向转移。两周后，他们在枣阳以东的张家垱又遭一场恶战，据说损失叛军三四千人，数千被裹挟的平民则获自由。此后数周，他们在随州附近又连吃败仗。XFFL, 9/40b–41a, 10/27a–29b, 10/39a–42a, 11/22a–24a, 12/14a–15b, 12/32b–36a.\nXFFL, 11/21b–22a, 12/46a–b.\nXFFL, 12/14a–15b, 13/53a–54b, 14/28a–31a.\nXFFL, 15/27a–28b, 15/29b–32a, 15/38b–42a, 16/3a–6a, 16/11a–12a.\nBLJZL, 1:199–201; XFFL, 17/1a–3a.\n嘉庆四年七月十五日，嘉庆称：\"永保当年在钟祥纵贼脱逃，贼遂窜往河南，又窜陕西，延至今日。\"XFFL, 109/33b–34a. 此后嘉庆又多次重申此点。XFFL, 122/9b–10a, 154/5a.\nXFFL, 17/13a–15b, 17/18a–20b, 18/1a–8a, 18/11a–13a.\nXFFL, 17/21b–22a.\n吴熊光1799年底提到，他被任命为河南巡抚之前，就听说过明亮与永保在钟祥不和。XFFL, 118/15b. 嘉庆1800年说，乾隆把明亮派往苗疆战役，是因为他与永保的嫌隙。XFFL, 154/5a–b.\nXFFL, 18/12a–13a, 18/13b–16b.\nXFFL, 18/22a–24b.\n健锐营与火器营的两千名士兵由巴克坦布、阿尔萨朗、讷音与硕云保四名满洲将领统领。XFFL, 22/43b–45a, 20/26b–27a.\nXFFL, 21/35b–40a.\nXFFL, 18/34a–35b, 19/5b–7a.\nQSG, 11175–77.\n恒瑞与舒亮直到次日清晨才来解救景安，使景安在险境中过了一夜，而永保则毫无反应。XFFL, 23/28b–30b, 23/31b–32b.\n乾隆虽然立即下令调回，1797年初却只有王文雄率领的九百余名士兵返回河南。除阵亡的三百六十三人外，还有七百零一名河南兵留在湖北。景安要求毕沅把他们放回。XFFL, 23/34a–35b, 24/18b–20b, 24/41b–42a.\nXFFL, 24/46b–47b, 24/48a–51b.\nXFFL, 22/25b–36a, 23/47b–48b, 24/9a–11a, 24/25a–26a; QSLJQ, 11/25b–26a. 乾隆还革去永保两子的官职，发往伊犁效力，不给俸禄。XFFL, 22/48a–49b.\nXFFL, 22/48a–49b, 24/41a, 26/18a–20a.\n关于这桩丑闻的详情，见第3章。\n1796年春，一些湖北叛军来到大宁，试图煽动当地教众起事，但被大宁知县钟莲驱逐。《大宁县志》（Daning xianzhi）5/7a; XFFL, 5/34a, 7/20a.\n徐天德是孙士凤的弟子。因为孙士凤是宋之清的大弟子，铃木中正认为川东北的教门据点是襄阳收元教运动的延伸。Sennen ōkkuteki, 305–6.\nQSLJQ, 10/5a–6a; KJJFSB, 1/4a.\n王三槐供词，BLJZL, 5:65–72; XFFL, 19/15a–17a, 19/30a, 20/23a–b, 35/27a; KJJFSB, 1/3b–4a.\nXFFL, 20/19a.\nXFFL, 20/36b–38a.\nGZDJQ, 1259.\nXFFL, 19/16a–17a.\n巴州起事的其他首领还有苟文明与鲜大川。罗其清供词，BLJZL, 5:72–73, 74–75; 冉天元供词，第89–91页; XFFL, 26/8a–10a, 27/4a–b, 27/31a–b, 28/29a–b, 60/34a–b.\nBLJZL, 1:214–18; 田多级等人供词，BLJZL, 5:48–50; XFFL, 19/30a–b, 21/3a–7a, 22/36a–41b.\n太平起事的其他首领还有龙绍周与王国贤。XFFL, 26/8b–9b, 27/4a–10b, 40/13a.\n陕西各地教门骚乱被地方官府镇压后，官府要求教众与地方衙门签订保证书，悔过自新，承诺永不再犯。GZDJQ, 2077.\nGZDJQ, 1336, 1612; XFFL, 20/12a, 21/1a–3a, 21/14a–17b, 21/30a–33b.\nGZDJQ, 1507.\nGZDJQ, 1548.\nGZDJQ, 1613.\n宜绵推迟了乾隆命他前往陕豫边界的旨意，坚持打完五座云之战。GZDJQ, 1654, 1538.\nXFFL, 28/30b–36a.\nKJJFSB, 1/9b–10a.\nKJJFSB, 1/7b–8a.\n袁国璜是四川人，参加过乾隆朝晚期的多次战争，其画像有两幅陈列于北京紫光阁。QSG, 11242–43. 何元卿也是四川人，因攻克来凤旗鼓寨叛军据点的功劳晋升总兵。QSG, 11242.\n嘉庆元年十二月十九日，观成与五百名士兵到达四川梁山。XFFL, 23/8a–11a, 23/12a–15b, 25/30b.\nXFFL, 26/8b; JQSYD, 8:491; KJJFSB, 1/10a–b. 佛住的先祖是明朝武将，汉化满洲人，后降清。QSG, 9329–32, 11248; 柯娇燕（Crossley）Translucent Mirror, 112–13, 121–22。\nGZDJQ, 846, 1797, 1877; XFFL, 26/8b–9b, 28/27b–30a.\nGZDJQ, 1938, 2013; XFFL, 29/19b–26a.\nGZDJQ, 2294, 2077.\nXFFL, 29/4b–6a, 29/10b–12a, 29/24b–26a. 乾隆起初命明亮、额勒登保与德楞泰前往四川，后来得知惠龄等人不力，又决定派三位将领前往襄阳战场。听说东乡失陷后，他再次改变主意：让明亮与德楞泰去四川，额勒登保去襄阳。XFFL, 26/10a–12a, 26/26a–27b, 28/11a–b.\n明亮、宜绵、德楞泰，嘉庆二年三月二十六日，GZDJQ, 2200. XFFL, 31/16b–20b, 32/10b–16b.\n明亮署名居首的奏折是GZDJQ, 2200. 宜绵的恳请上于嘉庆二年四月初十日。GZDJQ, 2290; XFFL, 32/19a–20a, 33/44a–b, 35/26b, 35/29a–b.\nGZDJQ, 2294; XFFL, 35/21a–26a.\nGZDJQ, 2343; XFFL, 36/31a–36a.\nXFFL, 37/24b–27b.\nGZDJQ, 2382, 2437; XFFL, 37/20b–23b.\n这位把马让给王三槐的叛军首领郑文礼被清军俘获。GZDJQ, 2472; XFFL, 39/9a–12b.\nGZDJQ, 2438; XFFL, 35/43a–44b, 38/26b–30a.\n宜绵、明亮、德楞泰等，嘉庆二年六月初一日，GZDJQ, 2563; XFFL, 40/27a–31a.\n锡金泰也是紫光阁功臣。苗疆战役期间，他晋升副都统、头等侍卫。QSG, 11248–49.\nGZDJQ, 2595; XFFL, 41/9a–14a, 41/30a, 42/5a–b.\nGZDJQ, 2472.\nXFFL, 89/19b–20a.\nXFFL, 35/32a, 39/15b–17a.\n襄阳叛军以\"万利\"为年号，意为\"万般利市\"。\nXFFL, 172/32b.\n谭正启等人供词，BLJZL, 5:17.\n其中一些名号与1774年山东王伦起事所用者相同。韩书瑞（Naquin）Shantung Rebellion, 111–14。\n在当阳，叛军从他们简陋的枪里只能打出铅块、铁钉与石子，对敌军只造成轻微伤害。XFFL, 4/8a–b. 有些叛军甚至向正在朝他们开火的清军士兵鞠躬，因为他们相信自己的宗教法术能挡子弹。XFFL, 4/3b–4a; QSLJQ, 2/18b–19a.\n铃木中正在《清朝中期史》（Shinchō chūkishi）第148页指出了这一点。\nXFFL, 26/16b–17a.\nXFFL, 1/11a–b, 3/7b, 63/25a–28b.\nXFFL, 67/4a. 晚明叛军把本党记号刺在被裹挟平民的脸上。Parsons, Peasant Rebellions, 230. 太平军也这么干。梅尔清（Meyer-Fong）What Remains, 73–81。\nParsons, Peasant Rebellions, 232.\nXFFL, 9/9b–10a, 51/26a–27b, 57/24a–b.\nXFFL, 1/4a. 乾隆也称他们为\"乌合之众\"。QSLJQ, 2/a–b; XFFL, 20/19a.\n孙士毅攻下小幽的叛军堡寨后俘获了几名叛军首领，他奏报说要把他们碎尸喂狗。BLJZL, 5:85.\n清军攻破枝江灌湾脑的叛军据点后，共俘获二千七百四十九人，惠龄屠杀了其中近二千五百名俘虏，包括据称曾与清军作战的妇女。GZDJQ, 1399. 1796年底，开县黄柏棚也发生了类似的屠杀。XFFL, 22/2b.\nGZDJQ, 2077.\nQSLJQ, 3/2b–3a; XFFL, 3/5b–6a, 8/11b–12b, 9/12b–13a, 18/28a–29b.\nQSLJQ, 3/8b; XFFL, 4/12a–14a, 4/16a.\n孝感起事平定后，祖之望责成地方乡勇搜捕教众，解送官府。但乾隆告诫他不要如此，命他对教众严加监视即可。XFFL, 13/43b–45b. 1796年夏末，襄阳叛军被逐出河南边境后，河南边境地区的大多数居民都回了家。一些教众——尽管其中有些人并未参加起事——被同村人扭送到地方衙门。景安奏报说，他将把那些同村人不愿容留的教众发往新疆或吉林，给旗人为奴。他说自己这样做是依据先前所奉上谕。XFFL, 13/47a–52b.\n嘉庆元年正月十七日，毕沅与惠龄奏报枝江\"大捷\"后，乾隆首次赏全军一个月饷银；XFFL 1/16b–17a. 惠龄率兵前往梁山攻打林之华、覃加耀一支时，尚未建功，乾隆就赏全军一个月饷银；GZDJQ, 1157. 宜绵太平大捷后，乾隆赏率先攻取叛军堡寨的士兵两个月饷银，其余士兵一个月；GZDJQ, 2014. 聂杰人投降时，乾隆又命赏满洲、绿营兵各一个月饷银；XFFL, 2/22a. 此类赏赐更多例子见XFFL, 2/5b–6a, 8/7a, 13/1b, 13/10a, 14/7a, 14/21a, 15/10a–b, 15/41a–b, 16/18a, 21/43b–44b, 23/32b–33a, 27/20b. 当阳失陷时，乾隆赏围攻当阳的满洲、绿营兵各一个月饷银。XFFL, 2/5b–6a.\nXFFL, 6/11b–12a.\n", "sections": [{"level": 2, "title": "通向叛乱之路", "id": "ch1-s0"}, {"level": 2, "title": "湖北的起事", "id": "ch1-s1"}, {"level": 3, "title": "宜都—枝江起事", "id": "ch1-s2"}, {"level": 3, "title": "当阳围城", "id": "ch1-s3"}, {"level": 3, "title": "来凤起事", "id": "ch1-s4"}, {"level": 3, "title": "长阳起事", "id": "ch1-s5"}, {"level": 3, "title": "武当山以南的起事", "id": "ch1-s6"}, {"level": 3, "title": "孝感起事", "id": "ch1-s7"}, {"level": 3, "title": "襄阳起事与永保的主帅之任", "id": "ch1-s8"}, {"level": 2, "title": "四川的起事", "id": "ch1-s9"}, {"level": 2, "title": "陕西的起事", "id": "ch1-s10"}, {"level": 2, "title": "血腥之春", "id": "ch1-s11"}, {"level": 2, "title": "叛军与镇压者", "id": "ch1-s12"}, {"level": 2, "title": "注释", "id": "ch1-s13"}]}, {"id": "c2", "title": "第2章 · 泥潭，1797—1798年", "kicker": null, "part": "第一卷 · 叙事", "html": "<blockquote>\n<p>勒保统率大兵，围困穷蹙之贼已历数月，而毫无进展，因循怠玩，是何居心？……静夜自问，天良安在？</p>\n<p>——已退位的乾隆皇帝，1798年</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释。（出处当为《清高宗实录》嘉庆三年上谕）]</p>\n</blockquote>\n<p>四川起事者为生存而挣扎之际，襄阳叛军长途跋涉，穿越河南与陕西，于1797年夏天渡过汉江，在四川东北部与被击溃的教友会合。乾隆因部队未能阻止他们而震怒，罢免了惠龄，以宜绵接任统帅。然而，襄阳叛军与四川同党的会合并没有像清方所担心的那样，成为这场正趋衰落的叛乱的转折点。姚之富与王聪儿未能在川北立足，不久便率其核心队伍返回湖北。在湖北、陕西、四川辗转作战数月之后，这支或许堪称所有叛军队伍中最强的力量，于1798年春被歼灭。尽管如此，它的覆灭并没有标志着叛乱开始走向终结。战争在川东与陕南继续进行，大多数起事者转而采用游击战。1797年底，永保之兄勒保被任命为新统帅——这是一年之内战役领导层的第三次更迭。然而，勒保很快证明自己是拖延战术的大师。在他主持之下，战役以极度缓慢的速度推进；一些将领想出了拖延的策略，同时借机谋取私利。明亮对勒保的领导大为不满，也故意放慢了脚步。到1798年底乾隆健康开始恶化之时，战役已经陷入了泥潭。</p>\n<h2>襄阳叛军的长征入川</h2>\n<p>尽管1796年底与襄阳叛军作战时表现可悲，清军凭借兵力与武器上的压倒优势，使起事者无法继续留在其家乡地区。约一万两千名叛军在襄阳府与河南南阳府之间穿梭，不断化整为零、又合零为整。他们的游击战术迫使镇压者分散兵力守卫关隘道路，削弱了清军正面迎击叛军的能力。^1 然而，1797年正月，起事者被困在光化以北地区。他们试图分三路突围时，惠龄等人发动了几次全面攻势，使叛军伤亡惨重，人数急剧减少，也许只剩下几千人。陷入混乱的许多叛军抛弃了家属，或开小差回了家。地方官员设立安抚之所，登记安置那些向官府投诚的人。^2（地图2.1）</p>\n<p>人数锐减之际，叛军派出信使，召唤失散与脱队者归队，并煽动新的起事。信使无法进入村镇与人接触，有时就把简短的讯息系在串起来的铜钱上，丢在路旁。然而，他们的努力收效甚微。湖北巡抚汪新声称，他已抓获并处决了派往襄阳一带的所有信使。^3 对武装号召唯一有案可查的响应，是正月里河南淅川与内乡一场未遂的起事——几个教门首领聚集了一千人准备举事。然而，起事尚未发动，景安就赶到现场，逮捕了一百多人。^4</p>\n<p>在湖北没能造出新的声势，襄阳的首领们决定长途跋涉入川，与那里的起事者会合——他们听说四川发生了起事，更重要的是，四川的同党人数众多，而且地形对他们有利：山势险峻，镇压者难以攻取。^5 但襄阳起事者不得不绕一个大弯，因为清军已沿他们在湖北西北部的去路布防。^6 二月下旬，他们向东转移到与河南交界的桐柏山；他们的分遣队最远到达应城、黄陂与黄安——这是叛乱迄今触及的最东端——引起足够的恐慌，使湖北那一带动员起来自卫。^7 襄阳队伍不打算继续东进，开始北上，分三路突入河南，分别由王廷诏、李述与姚之富率领（王聪儿越来越成为设定叛乱方向的关键人物，此时随姚之富一路）。姚之富特别指示各首领：不与清军接仗，专心突围。^8</p>\n<p>三月，三路人马都进入了河南，河南当局如临大敌。^9 景安不得不把有限的兵力拉成一条长长的战线，自己则在一处又一处之间穿梭，试图遏制叛乱在本省的蔓延。景安显然不擅长军事行动，行事谨慎。在与一些将领的欺诈行径作斗争、协助扳倒永保的过程中，景安已与同侪疏远，成了流言中伤的目标。他后来被指责为怯懦，未能阻止叛军经本省窜入陕西。^10 事实上，惠龄与其他将领的表现也好不到哪里去：他们既没能在河南消灭襄阳叛军，也没能阻碍叛军在河南的运动。三路叛军都迅速向豫陕边境推进，尽管途中迂回曲折。^11</p>\n<p>三月底，王廷诏与李述夺取了武关，突入陕西的商州——通往西安的门户。在商州，两路人马会合，数千名当地教众加入了他们。^12 会合壮大后的队伍到达山阳、镇安后，又折向东，进入湖北西北端，或许是为了招募那里的教众。四月初七日，叛军攻占了郧西县城——这座城没有城墙，只有几十名士兵与乡勇把守。不过，他们只守了一天，庆成就把它收复了。^13 姚之富与王聪儿一路——王聪儿在一场战斗中左臂负伤——在河南走了更长的路线，因此比其他两路晚几天进入陕西。^14 他们到达山阳高坝店时，会合后的王、李两路已经折向郧西。从湖北一路追击姚、王一路的恒瑞，此时远远落在叛军后面。^15</p>\n<p>清军远远落在身后，姚、王一路在四月享受了数周的太平时光。尽管起事者沿途不断吸收新血，但哪里都没有像贫困的陕东南那样成功——那里的教门网络根深蒂固，但1797年初兴安的几场起事被平定后，就再没有新的鼓动。许多教众已与地方官府签下保证书，不再参与叛乱。然而，襄阳起事者的到来重新点燃了当地教众的热忱。姚、王队伍派人前去联络时，数千人热烈响应。小股的起事——几十人或几百人——在各地爆发；有些人甚至烧掉了自己的房子，带着全家加入叛乱。当会合的王、李两路从郧西返回、与姚、王一路在月底会师时，他们的人数可能已经超过两万。^16 队伍急剧膨胀之后，起事者进行了一番改组，设立黑、白、黄、蓝四号，各设一名\"元帅\"统领。^17</p>\n<p>河南西南部被围之际，惠龄的多次增援请求终于有了回音。乾隆命从山西调两千名士兵到陕西商州，与秦承恩早先派到那里的四百名陕西满洲旗兵会合。^18 襄阳起事者一进入陕西，省级当局便竭力搜罗一切可用兵力，包括从宁夏与西宁调来的两千名士兵，使与襄阳队伍作战的正规军总数超过了两万。^19 在得知叛军在陕西扩军之前，乾隆一直相信叛乱已近尾声，因为湖北最后几千名起事者已被他的重兵逼到陕东南一隅。被近在眼前的胜利前景所鼓舞，乾隆痛斥了众将。四月中旬的两道上谕中，他逐一驳斥了他们惯用的那些无法歼灭残破起事者、甚至无法阻止其运动的借口：兵力不足、士兵太疲劳、给养匮乏，等等。他困惑不解：他向前线派去了数万军队与三千多万两白银，又为三个战场各指定了主将——襄阳的惠龄、达州的宜绵、黄柏山的额勒登保与福宁——怎么还会出错。乾隆敦促将领们顾念朝廷的形象与民众的苦难——即便巨额的财政花费可以暂置一旁，民众的苦难也随着时间推移而加剧——责令众将给他一个结束战役的明确时间表，或者对办不到给出站得住脚的解释。^20</p>\n<p>老皇帝公开的震怒，给一直密切关注战役的朝官们发出了一个鼓舞人心的信号。年轻的御史宋澍不久上疏，对战役执行中的种种可疑现象作了一番无情的剖析。他质问：如果说已有数万人被杀，一场区区数千人的叛乱怎么可能持续这么久？他讥讽毕沅1796年底过早宣布战后善后（shanhou）开始，话音未落就传来叛军再度横行的消息——先入河南，再入陕西。宋澍援引乾隆朝边疆战争的先例，敦促皇帝任命一位最高统帅总揽全役，并派更能干的将领赴前线，以免再拖延、再互相推诿。宋澍还谴责将领们把战役变成了升官发财的机器，并提议严惩玩忽职守的将领。^21 宋澍不留情面的批评，必定反映了其他官员的意见与议论。显然，在京城已不是秘密：前线的奏报并不都可信，将领们也没有尽力作战，而是利用战役谋取私利。乾隆命人把宋澍奏折的抄本寄给众将，并附上对惠龄的严厉警告，提醒他永保的前车之鉴。^22 此后数周，乾隆继续斥责惠龄，说他比永保还不如。^23</p>\n<p>直到五月初，惠龄才仓促组织了一场对镇安黄龙铺叛军的进攻，声称杀敌三千余人。^24 但这场进攻并没有阻止襄阳队伍向汉江推进。汉江横贯陕南，是叛军入川路上的天然屏障。不过，从勉县到紫阳的上游河段水浅，冬春尤甚。为防止起事者渡江，陕西当局下令把所有船只都停靠到南岸，并派四月间率一千五百名士兵从四川返回的柯藩及其他军官守江巡防。^25 与此同时，从甘肃循化调来两千名撒拉族士兵，又从甘肃庄浪调来一千名土兵。^26 或许对自己的部队能在江北歼灭起事者没有信心，乾隆指示众将：如果不能在江北将他们一网打尽，不如把他们压向川北，与那里的起事者会合，这样清军就能在一处同时对付两股叛军。他的理由是：这可以免得陕西未受惊扰的地区遭到蹂躏。^27 这道指示无异于默许叛军渡过汉江。</p>\n<p>叛军沿山间小路进发，先到旬阳，再到兴安府治安康的北岸，于五月初五日抵达。尽管守城的只有五百名士兵，当晚汉江水涨，救了这座城市。从这里，叛军分为两路。第一路约两万人向西移动，佯装在西乡渡江，随后转而南下，到达紫阳的白马石——汉江在陕西的最南点——那里的江水只有三四尺深。惠龄、庆成、舒亮正缓慢向西乡推进，五月十二日至十九日的一周之间，起事者与他们的马匹在白马石（白马之石）及附近的鲇鱼滩（鲇鱼之岸）涉水过江，并夺取了一些船只，把妇女、儿童与老人渡过去。清军直到渡江的最后一天才赶到白马石，只能攻击最后一批过江的几百名叛军。姚之富与王聪儿率领的第二路五千人沿江向西北移动，不为沿途守江清军所阻，于五月十九日到达紫阳的汉王城。叛军徒步涉水过江，并用几条船载运家属。两次渡江中，叛军都用银锭或衣物付给当地船夫报酬。他们还在汉江谷地留下了一首小调：\"少做庄稼多做鞋，七月不来八月来。\"（Shaozuozhuangjia duozuoxie, qiyuebulai bayuelai；原文据作者拼音转录复原，待核）^28 此后数年的冲突中，陕南的汉江谷地成了各路叛军频繁往还之地——起事者确实回来了，而且是许多次。</p>\n<p>尽管乾隆早先曾建议把叛军压向川北，得知这如今成了现实，他还是又惊又怒，尤其恼怒他的部队迟了一周才赶到白马石。他在两道措辞严厉的上谕中向惠龄及其将领们倾泻怒火，罢免了惠龄的战役统帅之职，还褫夺了他的世袭爵位与翎羽顶戴。乾隆不情愿地任命宜绵接替惠龄。恒瑞、柯藩、庆成、舒亮被摘去翎羽顶戴或巴图鲁名号，有些人还被降了级。乾隆甚至威胁说，如果他们继续这样打仗，就要动用死刑。然而，由于可用将领匮乏，他不得不让他们留任原职。^29 这是乾隆第二次更迭战役的最高领导层——距惠龄出任统帅仅仅五个月。</p>\n<h2>勒保出任统帅</h2>\n<p>扩充后的襄阳队伍向四川进发时，他们在四川的教友处境不佳。在明亮与德楞泰手下连吃几场败仗后，剩下的两千名达州叛军被逼入达州、东乡、新宁之间的山区。在大宁，早春一场新起事之后，当地教门首领陈崇德率其千名信徒在九龙池筑垒自固，但在观成率六百名士兵前来增援地方军队后，很快转移到更为险峻的老木园。^30 连同巴州方山坪冉文俦的蓝号与罗其清的白号，四川的起事者总计大概不超过六千人。</p>\n<p>渡过汉江后，襄阳队伍第一路向西前往西乡，因为经大巴山入川的道路已被当地官府掘断。随后它又分为两股。一股在通江的竹峪关进入四川，与方山坪的蓝号、白号会合。另一股前往太平。与此同时，姚之富与王聪儿率领的第二路在城口进入太平。^31 清军将领又一次没能追上叛军，乾隆痛骂他们\"无耻已极\"（原文待核，见注释32）。^32 在四川，宜绵竭力在太平拦截襄阳叛军，没有成功。^33 叛军很快推进到开县的铅河。随后在方山坪驻足的那一股也到了开县。六月下旬，新到的起事者涌入开县，营帐绵延数里；许多当地居民被裹挟入伙。湖北与四川叛军的总数可能接近三万。^34</p>\n<p>然而，与襄阳首领们的设想相反，徐天德、王三槐麾下的达州叛军并没有热情拥抱他们。经信使联络，襄阳与达州的首领们安排了在东乡中河的一次会面，但会面非正式而短暂——双方都在马背上。^35 襄阳首领们表示希望合并时，四川的同党拒绝了他们。显然，一场地盘之争开始了；本地人对前来他们家乡、自视高人一等的外来者心怀怨恨。正如王三槐所说：\"岂容湖北之人，践我四川之境。\"（原文待核，见注释36）^36 襄阳队伍离开罗其清与冉文俦的方山坪据点，很可能也是出于类似的原因。襄阳起事者到达后不久，清方就察觉他们打算返回湖北。除地盘之争的因素外，襄阳起事者对这片贫瘠的地区也大失所望——这里根本无法与襄阳富庶的乡野和繁华的市镇相比。^37 此外，清军的压力大概也有影响。尾随襄阳队伍入川的湖北清军与四川清军会师，按乾隆的设想，这使他们得以在一处同时了结两股叛军。新任统帅宜绵决定把全部叛军松散地围在四川东北角，因为\"我兵合则力厚，贼分则势孤，合则势众\"（原文待核，见注释38）。^38</p>\n<p>襄阳队伍于闰六月（六月之后）启程返回湖北。他们走了另一条路线：先向南到长江北岸，再沿江而下入鄂。徐天德、王三槐及其他四川首领率兵相送，陪湖北队伍一直到奉节。沿途，他们在开县、云阳、万县与奉节——均属夔州府，川东又一个教门渊薮，但此前大体平静——点燃了新的起事。有些起事吸引了数千追随者。叛军一度攻打云阳县城，没有成功。长江以南，只有奉节铁瓦寺爆发了一场起事，由龚文玉、龚其位兄弟领导。</p>\n<p>这支队伍在当年晚些时候被当地军队在奉节与湖北利川、恩施两县乡勇的协助下击溃。^39 1797年唯一幸存的叛军据点在开县白岩山，由云阳教门中人林亮功领导。舒亮与穆克登阿率六千名清军围困这处据点，成了一场旷日持久的围困。^40</p>\n<p>在奉节，徐天德与王三槐率四川叛军折向北，前往大宁。襄阳队伍分作两路。姚之富与王聪儿率主力前往湖北，而王廷诏、李述、樊人杰、张汉潮、王光祖以及数目不详的湖北、陕西叛军留在四川，随后与徐、王队伍一起去了大宁。这个安排可能是为了留下部分兵力在四川，牵制清军，使其不能尾追姚、王一路。果然，只有明亮与德楞泰追着姚、王一路到了湖北，惠龄、恒瑞、舒亮等人都留在了四川。</p>\n<p>襄阳起事者虽然未能与四川叛军合并，他们的到来却产生了深远的影响——他们向四川的同党传授了游击战术。结果，四川叛军放弃了山顶战术，走出了家乡地区的范围。白莲教战争的态势由此发生了永久性的改变。在大宁，徐、王队伍与留在四川的襄阳叛军计划与老木园据守的叛军会合，并招募更多追随者——他们听说大宁还策划了更多起事。然而，这个计划被观成与湖广提督刘君辅率领的围困老木园据点的清军破坏了。^41 与老木园叛军会合不成，会聚起来的叛军转而攻打太平直隶厅城，没有成功。^42 于是他们向西转移到巴州，打算与方山坪会合的蓝号、白号相见。</p>\n<p>此时，百祥主持的方山坪围困松松垮垮，已经拖了数月。为加强围困，宜绵先于夏末派朱射斗前往，八月又亲赴方山坪。宜绵一如既往地偏爱使用大量文官统领乡勇，与正规军一道发动总攻。经数日激战，他们用火弹点燃叛军主寨，于八月二十一日攻占了山顶。^43 宜绵虽声称杀死叛军数千，罗其清与冉文俦却都逃了出来，率其残部向巴州城移动，在那里与徐天德、王三槐、李述等人会合。</p>\n<p>九月初十日，多股起事者——总数或许有两万——攻占了巴州。^44 随后，十月间，他们又夺取了没有城墙的通江县城，尽管地方当局拼死守城。^45 然而，占据者并不打算据守这两座城。他们很快撤离，转而袭击清军的补给线。显然，起事者正苦于给养短缺。大约此时，李述离开四川前往陕西，很可能是因为获取给养困难。据清朝记载所示，起事者打算渡过汉江，转移到陕西或湖北更适宜生存的地方。由于李述率领着一支可观的队伍，惠龄、恒瑞与庆成尾随他追到了陕西。^46 与此同时，姚、王队伍的先锋已从湖北西北端突入陕南。汉江谷地再次进入高度戒备。</p>\n<p>回到川北，清方不遗余力地保卫连接四川与北京、途经西安的交通大动脉，因为北京拨发的全部军费银锭都经这条漫长而艰苦的路线运输。驿道自成都出发，通往四川北部门户广元。进入陕西后，自褒城起，驿道是凿于悬崖之上的狭窄栈道（zhandao），绵延一百五十英里，止于陕西眉县。随后道路沿秦岭北麓延伸至西安。白莲教战争的大部分时间里，这条命脉都是双方争夺的焦点。为防止叛军接近栈道，1797年底，乾隆先派恒瑞与庆成前往汉中，不久又命他们去广元。在四川，先是陕西的镇总兵保兴、后是英善被派去保卫保宁府城。英善一到，就招募了一千名乡勇，守卫保宁与广元之间的战略要地。^47（地图2.2）</p>\n<p>川陕大动脉的防务加强之后，起事者转而袭扰成都与达州之间的路线。他们以数千人为一股行动，在十、十一月间攻打顺庆府境内沿路或近路的营山、仪陇、广安、邻水诸县城。战斗十分激烈，有时持续数日，数名清军军官阵亡。^48 起事者虽然没能攻下任何一座城，清军在四川的压力却在不断增大——先是明亮、德楞泰离去，接着恒瑞、庆成也走了。得不到有效遏制，各股叛军在毫无武装的当地居民中肆虐，逼得许多人逃亡，妇女尤其多有自杀者。正如一部战争编年史所描述的：\"贼匪四布，官兵乡勇四出搜剿，疲于奔命。贼首之名不可尽知，官民之死于蹂躏者不可胜数。\"（原文待核，见注释49）^49</p>\n<p>宜绵擅长攻破叛军的山顶据点，却不善于对付他们的游击战。^50 抱怨兵力不足，他从甘肃与山东调了更多军队到四川。^51 此外，他赞同雇用更多乡勇，使1797年最后一个季度成为四川乡勇扩张的高峰。雪上加霜的是，姚之富与王聪儿率领的襄阳队伍从陕西突入了川北。与此同时，长阳叛军的残部放弃了又一个山头后，试图突入四川。备受压力的宜绵于十月奏请朝廷另派一名督抚入川主持地方事务，以便他专心军事。^52</p>\n<p>乾隆九月间刚刚表达过对宜绵的不信任：\"宜绵等所带之兵，看来无一可靠。\"（原文待核，见注释53）^53 他对宜绵从未完全信任，便把这一请求当作宜绵的请辞。十月二十六日，他以宜绵\"年迈\"为由将其罢免，任命勒保为统帅，但让宜绵留川主持后勤。^54 一年之内，乾隆第三次更迭战役统帅；勒保成为继永保、惠龄、宜绵之后的第四任统帅。与前任们不同，勒保将一直是战争领导层的核心人物，直到战争结束——尽管前方还有起伏等着他。</p>\n<p>就仕途而言，勒保一直比永保顺利，尽管后者承袭了父亲的世爵。勒保十六岁获得监生身份——很可能是捐纳而来——入仕后文职武职交替，既在京城任职（不止一次在兵部），也出任归化、库伦等边地之职，还多次担任巡抚、总督。然而，直到1791—1792年的第二次廓尔喀之役——他参与的是后勤事务——勒保才第一次接触战争；这次经历让他获得了第一手的经验：如何运作军费，使将领与后勤官员从中获益。1794年，勒保以陕甘总督的身份在查禁教门期间处决了刘松。^55</p>\n<p>1795年初夏，勒保被任命为云贵总督。^56 他以这一身份主持了镇压苗民起义战役的后勤。与福康安、和琳这两位以挥霍与挪用军费臭名昭著的战役主帅搭档，勒保的账目并不干净。有流言说勒保挪用军费结交私人，包括送礼讨好和珅。^57 1797年春，乾隆决定把勒保调往四川。勒保启程赴川之前，一道新旨意抵达，把他的目的地改为湖北黄柏山。然而，勒保于一月中旬到达那里不过数日，乾隆就命他火速返回贵州，因为贵州西南端的南笼刚刚爆发了仲家苗人的又一场起义。这场起义由据信会法术的苗妇王囊仙领导，吸引了可观的人众，正开始蔓延。主要依靠从陕西来的一位能员石进，勒保在数月内平定了这场起义，由此获得一等侯的爵位，也赢得了\"能战之将\"的名声。1797年九月，姚、王队伍返回湖北后，勒保被任命为湖广总督。此后不久的一道谕旨明确：勒保将被授予湖北战场主帅之衔。^58 然而，勒保动身赴任之前，乾隆又改派他去四川，任命他为整个战役的统帅。</p>\n<p>值得一问的是：勒保战历浅薄，其弟永保被革职受审还不到一年（尽管在清代，一位大员的罪责与耻辱很少影响其兄弟的仕途），乾隆何以如此看重勒保？乾隆的选择凸显了清朝国家在乾隆—嘉庆交接之际面临的一个问题：经验丰富的军事统帅匮乏。正如宋澍谏言中所说，镇压战役及时成功的关键在于正确的领导。乾隆虽赞同宋澍，承认永保与惠龄都不适合统帅之位，却坦言可堪统兵之任的人选不多，因为许多宿将新近谢世——福康安、海兰察、孙士毅——而阿桂等一些人年事已高。^59 \"实无可恃之人\"，乾隆叹息道。</p>\n<p>自清朝开国、开疆拓土、频兴边战之初，战争主帅的遴选就形成了一些惯例。起初，一流满洲军事贵族是人选之首。^60 自雍正朝起、直至乾隆朝，往往由一位领班军机大臣出任钦差大臣监军。^61 更多时候，由总督——无论满汉——出任统帅。^62 直到18世纪末，清朝的任何皇帝都不曾想过，物色一位合格的统帅竟会如此困难。然而，嘉庆朝之初时势不同了。开疆拓土一代将领的凋谢，在清军最高层留下了显眼的空缺。与此同时，乾隆又倡导了一条新思路：镇压内乱的战役不应动用精锐旗营，各省绿营驻军足矣。此外，统帅也不应拥有足以指挥对外边疆战争的地位。后来有人问嘉庆，为何他与乾隆都不曾派一位皇子亲领白莲教战争，嘉庆解释说，\"太平\"之时派皇子领兵并不适宜，因为一旦他不能完成任务，就难以惩处。^63 事实上，当时的皇子中没有一个经过战阵。同时，大多数军机大臣是地道的汉人士大夫，不谙军务。</p>\n<p>剩下的唯一选择，是在七位现任总督中遴选统帅。然而，其中三位（直隶总督梁肯堂、两江总督李奉翰、两广总督吉庆）没有多少军事背景或经验，另外两位——宜绵与1797年底出任云贵总督的鄂辉——已经卷入战争，并已证明不适合主帅之位。唯一的选择就在魁伦与勒保之间。^64 二者之中，勒保与朝廷的关系更好，特别是与和珅本人的关系——在漫长的仕途中，勒保在结交权贵、培植门生方面手段娴熟，远不止胜任。^65 性格截然不同的魁伦是闽浙总督，乾隆朝最后一年赢得了反腐斗士的名声（下章将述）。然而，以他耿直自恃的性情，他可能没有足够留意与和珅的关系。</p>\n<p>事实上，开疆拓土一代还有一位高水准的将领在世，且精力充沛。明亮远比勒保等人有资格主持战役。然而，明亮与和珅的头号政敌阿桂的关系，注定了他没有机会。正如我们所见，尽管明亮对苗疆战役与白莲教战役的贡献无可争议，他却频频被找出过失。1797年八月，阿桂去世，享年八十。^66 去世前不久，阿桂处理的最后事务之一，是勒保提出的一个请求：为苗疆战役结束后仍留用的贵州苗区乡勇首领发饷。阿桂驳回了这个请求，因为勒保没有明确说明请求涉及多少首领——这有可能成为挪用经费的借口。^67 阿桂之死，使和珅把自己的亲信安插到关键职位上再无阻碍。鉴于阿桂留下的空缺需要填补——最好由一位有军事资历的人填补——白莲教战争的胜利将为统帅升入军机处铺平道路。可以理解，为明亮敞开大门不符合和珅的利益。总而言之，对乾隆与和珅双方来说，勒保都是主持战役的自然人选。</p>\n<p>然而，勒保从贵州到前线的行进极其缓慢；受命之后，三个月过去，他才到达前线。在这段从容不迫的旅途中，勒保设法挡掉了两道要他改道陕南、与明亮合作攻打襄阳叛军的圣旨。鉴于明亮与永保的宿怨，以及勒保在苗疆战役中与他的恶劣关系，勒保费尽心思避免去陕西。第一道圣旨是在勒保出任统帅后不久下达的，当时襄阳起事者聚集在汉中一带，企图北渡汉江。^68 勒保没有公开表示不悦，而是施展拖延战术；到达川南的泸州时，他停了下来。十一月二十四日，徐天德与王三槐攻占了长寿县城——这座城没有城墙，只有乡勇防守（知县正在别处与叛军作战）。由于长寿邻近重庆，宜绵立即派百祥率一千名士兵增援重庆防务。^69 听说这个消息，勒保立即请求改派他去长寿而不是陕西；乾隆批准了。^70</p>\n<p>但勒保并没有急着去长寿。借口自己没带兵，他留在泸州招募乡勇，等待从附近永宁镇调来的三百名驻军——至少他是这么说的。此外，他还抱怨四川兵力不足，要求增援。^71 事实上，他从贵州铜仁带去了三千名乡勇，而这一点他直到1800年底才告诉朝廷。^72 在泸州闲居期间，勒保上了一道奏折，力陈向四川增兵的必要性。他先分析战役久拖不决的原因，指出叛军的游击战术与裹挟当地民众以扩充人数的伎俩，随后描绘了一幅镇压战役的悲观图景：</p>\n<blockquote>\n<p>川、陕、楚三省犬牙相错，[边境]绵亘数千里，高山峻岭处处皆有，贼匪既可恃险负隅，又有多途逃窜。官兵扼要堵截之时，贼匪转而扰及无兵之处。是以有贼之处无兵，有兵之处无贼。亦有贼过兵未到，或兵到贼已去。官兵击之于东，贼即奔窜于西；官兵击之于北，贼即奔窜于南。欲剿灭贼匪，虽数十路之兵不能合围；欲堵截贼匪，虽数十万之兵不敷分布。^73</p>\n<p>[译者按：原奏自英文直译，文言原文待核，见注释73。]</p>\n</blockquote>\n<p>勒保并不是第一个剖析叛军游击战术的人。宜绵与明亮数月前就讨论过。然而，勒保是第一个强调地形因素的人。他在这道奏折中使用的说辞，在此后漫长的战役中将被众将一遍又一遍地重复，为他们的劳而无功辩护；它也被一些史家接受，用以解释战争的迁延。然而，到1797年底，战役的主战场还没有移到广袤荒蛮的大巴山或秦岭。刚刚采用游击战术的四川叛军，主要袭击的是顺庆府与达州直隶州境内后勤路线上的城镇。勒保强调三省战场地形艰险，声称即便数十万军队也不足以围剿叛军，其实是在抢先为一场旷日持久、耗费巨大的战役辩护。</p>\n<p>眼下，勒保继续催促增援。他抱怨四川的军队少，却要与众多起事者作战，而明亮与德楞泰统率大军，在陕西却只与较小的一股起事者作战。因此，他建议陕西的清军把叛军赶向四川，四川的清军再诱使散处的叛军合并成一股，一举歼灭。不过，为实现这一目标，勒保请求把所有清军都调到他麾下、开赴四川；他说，他所请求的军队不到，他就不会采取任何行动。^74 尽管勒保的口气处处为己，此刻似乎把勒保当作救星的乾隆，还是称赞他一针见血地揭露了战役的通病，并对他寄予厚望：\"勒保既能如此熟悉情形，议论透彻，自必革除积习，大改局面。\"（原文待核，见注释75）^75</p>\n<p>在等待勒保到达前线的漫长日子里，四川的清军继续抵御叛军沿顺庆、达州后勤路线的进攻。几乎所有城镇都只有受雇乡勇防守（只有梁山县城例外，由明兴主持防守），朱射斗与保兴率领的清军正规部队则在一处又一处之间穿梭，击退进攻者。罗其清与冉文俦围攻营山县城两周，恒瑞与庆成赶到、一场激战随之展开后，他们不得不放弃攻势。^76 十二月初，徐天德与王三槐在攻占一周后放弃了长寿城，转而北上攻打梁山、新宁，最后攻打达州，但从陕南赶来的惠龄、富成等人挫败了他们夺取达州的图谋。^77</p>\n<p>攻取这些城镇无一得手，徐、王转而扑向临江市（意为\"临江之市\"）——开县一个繁华的商业市镇。他们与留在四川的襄阳各股协调行动，于1798年新年（2月16日）前几天共同攻占了临江市，因为守城的只有几百名临时拼凑的乡勇。市镇里有数百家店铺商号，叛军过了一个欢快的新年，摆宴席、唱大戏。^78 此时，据守开县白岩山数月之久的一万名起事者放弃了他们的据点。攻打开县县城不下之后，他们于嘉庆三年正月初十日加入了临江市的同伙。^79</p>\n<p>清军在新年庆典期间的无所作为，使起事者得以在临江市停留半个多月；直到正月十五日元宵节——通常标志庆典结束的日子——他们才离开市镇。^80</p>\n<p>临江市陷落时，勒保还远在前线之外。尽管承诺在长寿与叛军交战，勒保却去了重庆，在这个商业枢纽盘桓了一段时间。他可能在那里看了戏——这是他钟爱的消遣——或许还雇了一个戏班随行。勒保最终到达长寿时，这座城已从叛军手中解脱数周。于是，他把任务从驱逐叛军改为\"抚恤\"居民。他又以等待更多军队为借口，为自己滞留长寿辩解。据他说，他在川南招募的两千名新兵未经战阵，所以他加派了部队，不得不等待他们到达。^81 直到新年前数日，贵州的一千名士兵与成都的两千名新兵到达，勒保才离开长寿继续北上。然而，襄阳队伍的一支渡过汉江北去时，乾隆警觉起来，认为姚之富与王聪儿率领的襄阳主力随时可能渡江。正月初八日，在接连几道措辞严厉、斥责明亮的上谕之后，他命勒保火速赶赴陕西，指挥那里的军事行动，并奏报明亮等人的失职。^82</p>\n<p>然而，仅仅十天之后，乾隆就改了主意。与先前一样，勒保想尽一切办法避免去陕西与明亮合作。他不断向皇帝奏报四川的惊险消息。与此同时，仍在湖北的额勒登保与福宁也奏报四川局势危殆，因为他们收到了宜绵与穆克登阿敦促他们入川的信函。正月十八日接到额勒登保与福宁的奏折后，乾隆命勒保留在四川。^83 次日，他任命勒保为四川总督，把宜绵送回原任陕甘总督，又命福宁与英善主持四川后勤。^84 这一新任命显然是对勒保的又一次妥协，或许也是为了催促勒保加快行动。与此同时，乾隆不再命勒保去陕西。</p>\n<p>尽管这是清军把四川几乎所有叛军股团合围在临江市的难得机会，勒保似乎并不打算朝这个方向行动。叛军在年后两周弃守临江市时，勒保还在垫江，此后继续以蜗牛般的速度北上。直到二月初九日，他从英善手中接过印信，才算正式就任四川总督。^85 这距他被任命为战役统帅已经三个多月。连对勒保寄予厚望的乾隆，也对他行动之\"从容\"表示不满。^86 很快将变得清楚的是，勒保是拖延战术的大师：只要符合他的目的，他愿意尽其所能放慢军事行动。到达前线后，他尽量不碰刚刚离开临江市的叛军主力，而是选择对付万县一支新近拼凑起来的小股叛军——这给他带来一场轻松的胜利，赢得了乾隆的高声赞赏。乾隆甚至说，\"勒保一到四川，局面就转向了极为可喜的方向\"（原文待核，见注释87）。^87</p>\n<p>勒保也是长于结网之人，深知该与谁交朋友、该对谁板面孔。一到任，他先把明亮的盟友宜绵送回陕西——尽管他本可以找个借口把宜绵留在四川——因为他留下了惠龄与英善，后者继续主持达州的后勤。^88 与此同时，勒保遵照乾隆一再的指示，严惩不认真作战的将领。^89 他的第一次处分落在了舒亮与穆克登阿头上。他指控二人在白岩山长达六个月的围困中懈怠失职，又未能阻止那里的起事者前往临江市，请求将二人革职、解京受审——此举为他赢得了乾隆对果断处分的赞许。^90</p>\n<p>整个春天，四川起事者继续在顺庆与达州开展游击战。他们分股行动，但有时也相互配合。勒保未能击溃任何一股。二月，保兴在达州阵亡。^91 勒保再次抱怨自己七千人的兵力太少，不足以应付各股起事者，请求从云南、贵州调一万名绿营兵（每省五千）。经乾隆批准，这一万名援军于春末到达——这是战场省份之外最大规模的一次部署。^92 春去夏来，乾隆对勒保毫无保留的信任开始蒸发。他先是批评勒保抓不到叛军首领，对战役进展迟缓漠不关心，只定期向朝廷送些乏味的战况简报，或举荐官员的名单。^93 不久，他又指责勒保纵容麾下的恒瑞、庆成等将把叛军赶入陕西，而不在四川了结他们，说他是\"以邻为壑\"（yilinweihe）。^94 最终，乾隆开始怀疑勒保的才干：\"勒保初到四川，屡获胜仗，声名甚著。近来何以不如从前？\"（原文待核，见注释95）^95 随着时间流逝，他的怀疑将变成绝望与愤怒。</p>\n<h2>湖北叛乱的终结</h2>\n<p>1797年春，襄阳队伍离开湖北前往河南后，湖北北部大体恢复了正常。在襄阳府与郧阳府，地方当局的抚恤工作使居民回返、生产恢复，尽管官府对返乡叛军的搜捕仍在进行。^96 从那时起直到夏天，全省只有林之华、覃加耀领导的长阳叛军一股仍在本省西南角流窜。然而，姚之富与王聪儿的回返在初秋再次把湖北西北部部分地区搅得一片狼藉。直到1798年初，林、覃叛军的最后残部才被肃清。两个月后，姚、王队伍也在陕鄂边界覆灭。尽管如此，对乾隆皇帝而言，这两场胜利都来得太迟了——它们是在无数次申斥与对主将的贬黜之后才取得的。</p>\n<h3>长阳起事的终结</h3>\n<p>1797年六月，林、覃队伍从芭叶山的重围中突围后，先沿湖北西部边界移动，试图与四川的同党会合，没有成功。随后他们返回长乐，在白玉寨的山顶筑垒自固。初秋，从芭叶山一路追击他们的福宁与额勒登保攻占了山顶。幸存的起事者转移到附近的帽子山，再次据守山头。^97 围困循着惯常的模式进行：七八千名清军屡次被叛军击退，而叛军只有敌军一半的人数，手中的家伙不过是石头与滚木。福宁与额勒登保直到姚、王队伍返回湖北才加紧进攻，因为他们担心后者可能与帽子山的起事者会合。然而，姚、王队伍北去之后（详见下文），他们又放慢了节奏。乾隆一再严厉斥责这两位主帅作战不力，但批评毫无效果。八月下旬，给养行将耗尽，起事者又完成了一次不可思议的突围，尽管报给乾隆的奏折声称清军已摧毁其堡寨、杀敌众多。乾隆讥讽两位主帅不过是在起事者撤离后夺取了空寨，除阵亡士兵外不赏任何人。^98</p>\n<p>深秋，林、覃一股突入四川巫山。无法再往前走，他们又回到湖北，在建始、恩施、利川之间漂流，同时抵挡追击的清军。妻子与女儿被清军俘获后不久，林之华战死。^99 覃加耀率领最后几百名起事者返回家乡长阳与长乐。他们在朱里寨的山顶据守了数周。数日战斗之后，清军纵火焚烧了他们的堡寨，但覃加耀与约两百名叛军逃脱。^100 再次逃向四川边境，他们流窜于建始、巴东与归州之间。福宁与额勒登保紧追不舍，却没能赶上他们。1798年正月中旬，汪新前往巴东为川东部队协调后勤时，在归州遭遇了覃加耀及其最后的人马。与汪新小规模交火之后，覃加耀率一小股起事者登上一处名为终报寨（意为\"终报之寨\"）的山顶。福宁与额勒登保这才赶到。^101</p>\n<p>在这场对林、覃队伍旷日持久的作战中，乾隆无数次痛斥福宁与额勒登保，骂他们\"无耻\"\"无心肝\"，还以严惩相威胁。汪新奏报二人行动迟缓，再次激怒了他。他把福宁与额勒登保一并降了官爵。^102 奉命前往四川（他麾下的两千名士兵已先期入川），福宁于正月中旬又率一千名士兵离开湖北。^103 福宁刚一离开，正月十七日，额勒登保就派出三支队伍，架梯挽绳攀上悬崖。登上山顶后，士兵们杀死或俘获了终报寨据点的全部叛军。覃加耀与这场起事的另一位关键首领张正朝被擒。教门师父、很可能是起事谋主的张驯龙则早已被杀。^104</p>\n<p>乾隆一点也不高兴。他的军队花了将近两年才了结长阳起事者——他们从未能攻下任何城镇，却靠着镇压者的怠惰，从一座山头转移到另一座山头。乾隆非但没有嘉奖，反而把福宁与额勒登保都降为副都统，并责令额勒登保向本旗缴回先前所获的一万两赏银，罚福宁向四川军需库缴银四万两。乾隆清楚福宁的责任大于额勒登保，命额勒登保参加四川的战役，却把福宁改派主持四川后勤，不再带兵。^105 后来京城官员闲谈这场战役时，福宁的改任被引作典型例证，说明将领们如何因拖延与失职而获得宽纵。额勒登保并非贵族出身，福宁在场时，他或许无法全力作战，因为福宁家世更高，还当过湖广总督。额勒登保在终报寨干脆利落的胜利，才更像他决心了结敌人时的作战风格。</p>\n<h3>姚、王队伍的覆灭</h3>\n<p>1797年七月初在巴东进入湖北后，姚之富与王聪儿本计划与长阳叛军会合，但长阳叛军已返回长乐，被围于帽子山。于是，姚、王队伍转而北上，目标是返回襄阳。叛军逼近归州州城时，成功骗过了比他们先到、沿长江顺流而下的明亮与德楞泰：他们留下一支小队牵制清军，主力迅速北上，夺取了兴山县城（没有城墙）。随后他们继续向保康进发，同时派出一支分遣队向东，前往远安与当阳。</p>\n<p>此时，姚、王队伍多达两万人，还从当地居民与敌人手中夺取了六七千匹马，而与他们对阵的清军因分兵把守要地与城市而兵力分散。明亮抱怨自己只有四千名可战之兵、六七百匹马。^106 七月初二日，乾隆批准从吉林调一千名旗兵、从黑龙江调两千名旗兵，并命从官马厩中备好八千匹战马，装备这些旗兵。^107 为保障襄阳防务，乾隆从山西调两千名绿营兵前往襄阳，又命驻木兰围场的一百名精锐旗兵由惠伦、阿哈保两位满洲将领率领，火速赶赴襄阳。与此同时，景安也派了一千名河南兵到湖北保康。^108 总计约六千名士兵被部署到湖北——这是这场战役中的第二次大规模动员。（地图2.3）</p>\n<p>八月初，姚、王队伍抵达襄阳近郊（他们在远安—当阳一带的一路人马也被德楞泰与明亮逼得北上了）。德楞泰与明亮会合了惠伦、阿哈保率领的五百名刚出城迎战的新到吉林旗兵，^109 使起事者伤亡惨重。返回襄阳的计划既已落空、人数又已缩减，叛军转而向西进入武当山区，随后向汉江移动，企图渡江入豫。他们的计划是在河南多山的西部边境招募更多追随者。但遭到明亮与德楞泰的攻击、又添伤亡之后，他们未能到达江边。^110</p>\n<p>八月二十九日，在郧县草店的一场恶战中——双方许多人都骑在马上——清军据说杀死一千余人，俘获三百余人（其中近三分之二是妇女），还有数百人跳下悬崖。战斗之后，阿哈保等人追击撤退的起事者到陈家山，又发生了一场残酷的近距离搏斗。混战中，惠伦与一名叛军首领交手，引来一群叛军挺矛攒刺，当场被杀；还有数名高级满洲军官阵亡。阿哈保的战马受伤，多亏部下拼死相救才得以脱身，而那些救他的人付出了生命。^111 这场战斗两周前，高级蒙古旗人丰绅阿已在另一场战斗中阵亡。^112 但惠伦是战争中阵亡的最高级别满洲军官。惠伦与明亮同出显赫的富察氏（明亮是惠伦的叔父），他的养父明瑞在18世纪60年代末的缅甸战争中自杀身亡，惠伦由此承袭了最高爵位一等公。忆起三十年前明瑞的惨死，乾隆伤感地哀悼这个功勋家族又失去了一位英才。^113</p>\n<p>无法渡过汉江，姚、王队伍在无数次失败尝试之后，于十月间突入陕西。湖北再次解除了战事——只有长乐据守的最后几百名长阳叛军除外。^114 湖北再次开始战后重建之时，陕南进入了高度戒备。由于李述一路——或许有两万人——正在西乡，试图渡过汉江，秦承恩不遗余力地加强江防。他把所有船只都停靠到北岸，向汉中增派了数千援军——那里冬季水特别浅——还沿江雇了数千乡勇。^115 乾隆又命把索伦兵派往紫阳，守卫汉江最南点。^116 明亮与德楞泰追着姚、王队伍到了陕西，十月中旬在镇坪与其激战数日，据说杀死五六千人，俘获三百六十五人——其中一半是妇孺——只有四千人逃脱；与往常一样，这些数字可能有所夸大。^117 随后姚、王队伍向汉中移动，途中频频遭到攻击，又添伤亡，还丢下了许多妇孺。^118 与此同时，留在四川的许多襄阳起事者——包括王廷诏——也移到了陕南。在汉江上游谷地会合后，襄阳叛军多次试图渡江，没有一次成功。^119</p>\n<p>为把部分清军从江岸引开，襄阳起事者移向宁羌，随后又到四川广元。他们还袭击了江南的官道，使一处路段无法通行，中断了清方的官方通信。被明亮等人打败后，他们返回汉中，分作两路：姚之富、王聪儿与李述率主力前往四川通江，高均德率另一路向西。^120 清军也分兵应对：明亮去截击高均德，德楞泰追击主力。1798年初，襄阳两路短暂会合，试图与四川叛军会师，没有成功。此时，王聪儿建议她的一路返回陕南，佯装要攻打川陕大动脉，从而为高均德创造渡江机会。^121</p>\n<p>这个计策奏效了。十二月二十四日，正值隆冬，江岸冰雪覆盖，高均德率其数千人马在南郑周家坪涉水渡过了汉江。听说渡江之事，明亮与德楞泰率八千士兵渡江北上，把姚、王队伍留给较弱的将领与五六千名士兵守在南岸，因为他们认为北岸的清军全是步兵，力量单薄。^122 然而，乾隆大为震怒，称他们的举动是\"大错\"（原文待核，见注释123）——因为他相信（事实证明他是对的）高均德的渡江正是为了把清军精锐从江岸引开，好让姚、王队伍渡江。此外，他还怀疑叛军主力可能已经渡江，只是明亮与德楞泰因惧怕严惩而隐瞒不报。乾隆先摘去二人的翎羽顶戴，继而削去世职。他痛骂二人自私——他们带走了全部精锐旗兵——并责令二人以肃清陕西全部叛军来赎罪。^123 乾隆再次求助于勒保，命他火速赶赴汉中，主持江边作战，^124 但勒保如前所述，设法说服乾隆改了主意。</p>\n<p>渡过汉江之后，高均德攻打汉中城——城中兵力并不雄厚——没有攻下。随后他移向陕西与湖北、河南的边境，但很快被明亮、德楞泰与陕西军队紧紧围住。在河南，景安一听说高均德渡江，也加强了边境戒备。</p>\n<p>赢得了乾隆的赞许。^125 到二月，高均德一路已被逼到镇安东南一隅，经数场恶战，人数减到或许只剩两千。^126 然而乾隆并不满意。姚、王队伍仍在南岸，关于它渡江的假消息却一次次传到北京，每次引起一番惊扰，激起乾隆对明亮与德楞泰的怒火。^127 二月十五日，又一次虚惊之后，乾隆革了明亮的职，命将其押解进京受审。他还革去明亮两个儿子的侍卫之职，发往热河充当苦役。明亮的位置由宜绵接任。然而，数日之内，乾隆就退了回去：他先是让明亮留在陕西继续作战，随后又给了明亮一个低微的头衔\"领队\"（lingdui），理由是宜绵既老且病。^128 这是朝廷惯用的手法——革职、惩子、最终留用——意在鞭策明亮及其同僚更认真作战。明亮当然心领神会。</p>\n<p>襄阳主力直到二月初才完成渡江（但消息传到北京时，明亮已被革职）。高均德渡江之后，襄阳主力先从广元移到南江，随后于正月二十四日在西乡碱池坝重入陕西。移师汉江上游谷地后，他们于二月初三日或次日，在城固与南郑之间、距高均德渡江处不远的地方涉水渡过了汉江。柯藩未能阻止他们。^129 渡江之后，李述率七八千名叛军北上，直指西安。他们穿过斜峪关，一路进抵眉县与盩厔，在西安引起极大恐慌。直到叛军逼近西安近郊，他们才被秦承恩与王文雄挡住，柯藩与荆州将军兴肇随后赶到。无法夺取西安，李述于三月初把队伍分作两股：他自率一股先东进、再南下镇安；另一股向西移动，但不久即被歼灭。^130 李述袭扰西安，吸引了部分清军，使姚、王队伍得以向东朝边境移动。二月下旬，姚、王一股与高均德一股在镇安会合，但很快被明亮、德楞泰等人围住，他们突入湖北郧西的所有尝试都被挫败。^131 此时，额勒登保率两千名士兵到达陕西，^132 弥补了骁勇的撒拉族士兵离去的损失——他们自上年秋天起随明亮行军作战，此时已返回家乡。^133</p>\n<p>二月下旬，明亮、德楞泰、额勒登保三位清将把襄阳队伍压向镇安西北。野猪坪一场恶战之后，襄阳起事者再次分作两股，一股由姚之富与王聪儿率领，另一股由高均德率领，都朝豫陕边境移动。相应地，额勒登保追击高均德（李述从西安南下后，他又转而对付李述），明亮与德楞泰则向姚、王队伍施压。^134 三月初五日，明亮与德楞泰把姚、王队伍逼到山阳南缘。经一整天的战斗——姚、王队伍伤亡惨重——叛军连夜分批潜入湖北郧西；其中一些人可能是从把守严密的漫川关强行通过的。次日，在当地军队与乡勇的协助下，明亮与德楞泰对筋疲力尽、仍有数千之众（据德楞泰奏报，有八九千人）的起事者发动夹击，把他们逼到郧西三岔河。姚之富、王聪儿与一些随从在那里找到一处高地攀登。滚木未能阻止清军，姚之富、王聪儿及一些护卫——包括十几名妇女——弃马登上峰顶，跳崖而死。姚之富当场毙命，王聪儿重伤不能言语，但在被杀之前承认自己就是\"齐王氏\"。对剩余叛军的战斗一直持续到次日清晨。^135 德楞泰声称清军杀死七千余人、俘获一千余人，但也承认把搜捕散逃叛军的任务留给了地方当局。显然，许多叛军逃脱了，包括王廷诏。王聪儿死后在民间传说中长存不灭，并在20世纪晚期的中国被塑造为白莲教战争的叛军偶像。然而，她参加叛乱的时间并不长；冲突在她死后还将长久持续。此外，还有数不清的其他妇女对叛乱产生了影响。</p>\n<p>充分利用自己非凡的机动性，襄阳起事者坚持了两年。然而，他们似乎没有健全的战略，常常追随一些模糊甚至一厢情愿的想法。起初，他们盼着与川北的同党会合。这一招不如预期时，他们又起了返回襄阳的念头。这个计划也落空后，他们又在豫西构想了一片新的乐土，却对这个计划如何实现毫无清晰的想法。结果，他们不停地在汉江谷地兜圈子，拼命地想渡江——先是想渡到南岸，后来又想渡到北岸。他们的一根筋给镇压者提供了清晰的指引，使其得以截击并与之交战——这实际上抵消了他们机动性带来的优势。与\"陕南汉水高地是叛军根据地\"的流行看法相反，襄阳起事者并不打算在那里避难。他们嫌恶这个地区的贫瘠，一直想离开汉江谷地，只把它当作通往梦中乐土的通道。</p>\n<h3>明亮放慢脚步</h3>\n<p>1798年春，姚、王队伍渡江一个月后即被歼灭，明亮与德楞泰展示了自己的效能。乾隆把这场胜利归功于他对明亮所施处罚的成效，如今准备宽恕明亮了。他先把明亮的两个儿子从热河召回，安排到上驷院当差，随后又恢复了明亮的副都统衔及其翎羽顶戴。^136 宜绵也为老朋友辩护，强调明亮作战从不示弱，尽管有时可能有点\"过虑\"（原文待核，见注释137）。^137 毕竟，战争还在继续；前线需要这位老练的将军。</p>\n<p>姚、王队伍覆灭之后，明亮、德楞泰与额勒登保转而对付李述与高均德——姚、王最后的时日里，他们二人并不在一起。李、高两路会合后，又收编了数股突入陕南的四川叛军，再次企图前往河南。他们向陕西东南边境推进，试图分成小队进入河南。许多四川与陕西的叛军不愿离开家乡，或投降，或返回四川。洛南两岔河一场血战——战斗中叛军发誓要为姚之富、王聪儿报仇，结果伤亡惨重，高均德的两个兄弟也阵亡了——之后，他们转向西。^138 李、高队伍在汉江北岸来回穿梭，时分时合，初夏时分逼近栈道；一些起事者甚至窜入甘肃。甘肃第一次动员起来，对付境内之贼。^139</p>\n<p>五月二十三日，乾隆责成明亮与德楞泰（额勒登保已派往湖北）在十天内肃清陕西的全部叛军，随后前往四川。^140 叛军突入甘肃不逞、再次分成小队之后，明亮与德楞泰也分了手。德楞泰此后与李、高队伍的主力作战，一路追到四川广元。明亮则留在陕西，搜剿当地四散的叛军。^141 尽管乾隆一再催促明亮了结陕西战事、前往四川，明亮却放慢了脚步。在勉县城，他休整了五天，把士兵散在城中，惹得当地居民怨声载道。^142 显然，明亮不愿去四川与勒保共事。据他所说，第二次金川之役中，他做过勒保之父温福的副手，如今却要受旧同僚之子的节制，实在丢脸——尽管勒保只比他小几岁。^143 明亮与永保的宿怨可能也是另一个因素。既然姚、王残部已经溃散，另一支襄阳队伍进入陕西，就给明亮留在陕西提供了充足的理由。</p>\n<p>这支队伍由张汉潮率领。张汉潮年过七旬，本是襄阳的教门师父，起事开始后成为\"元帅\"之一。1797年张汉潮没有随姚、王离开四川去湖北，但他在四川的行踪难以查考。1798年早春，张汉潮率约一万名叛军，沿姚、王所走路线长途跋涉来到湖北。在湖北巴东，张汉潮的队伍有时以分遣队出击，蹂躏了归州、兴山、东湖、远安、当阳与荆门，把湖北西部再次拖入动荡。叛军不断招募并裹挟当地人，据清朝记载，其人数一度膨胀到三万。汪新与景安——张汉潮突入湖北时，景安被任命为湖广总督——手忙脚乱地搜罗军队保卫各自辖区。他们还向勒保求援，因为四川竟没有一支清军追击张汉潮，令他们大为不安。乾隆一面再次批评勒保把叛军赶入他人辖区，一面命额勒登保与兴肇前往湖北。^144</p>\n<p>与姚之富、王聪儿一样，张汉潮也谋求渡汉江入豫。四月，张汉潮的队伍抵达汉江西岸的宜城，但夺取该城的图谋被景安挫败。随后张汉潮沿江南下。景安率两千名士兵，使张汉潮无法靠近江边，屡次把他从荆门州城击退，并阻止他攻打当阳与荆州，迫使他折返北上。四月下旬到达襄阳的额勒登保与兴肇与景安会合后，五月初在南漳几番交锋，击溃了张汉潮的队伍。然而张汉潮仍企图渡江；被赶到谷城时，他夺取了许多船只。直到张村棚再遭一场惨败——数千人被杀——张汉潮的队伍才于五月下旬分成数股向西逃往陕西；途中数千名被裹挟的村民逃散。^145</p>\n<p>六月十二日，张汉潮及其不下万人的队伍进入陕西平利。明亮立即移师那里，与额勒登保会合对付张汉潮。在陕南无法再进一步，张汉潮于夏末转而南下四川太平。为了在多山的太平快速移动，叛军抛弃了马匹骡子，甚至杀死了部分妇孺。^146 由于额勒登保留在太平养病，明亮接手作战，夏末把张汉潮赶回了陕西。尽管明亮奏报说，在川陕通江边境的一场战斗中杀死叛军数千人，其中包括李槐与詹世爵两位大头目，乾隆却既无褒扬也无赏赐——这与大约同时他对勒保俘获王三槐的欢欣反应形成鲜明对照（见下文）。^147</p>\n<p>此后数月中，明亮不再果断打击敌人，更不用说消灭敌人了——尽管张汉潮已陷入绝望，精力也因年迈而衰退，让几个年轻首领替他带队。^148 张汉潮在陕川之间往返、在汉江以南穿梭，寻找渡江之机，明亮则紧随其后，确保不让他渡过汉江或返回湖北（有一次，张汉潮又从大宁逼近湖北巴东）。^149 八月下旬，乾隆再次摘去明亮的翎羽顶戴，但这一次没有奏效。^150</p>\n<p>十一月初四日，趁明亮正与一些从四川渗入陕西的叛军作战，张汉潮率其队伍——只剩几千人，其中能战者不过千人——在城固渡过了汉江。渡江之后，张汉潮的队伍奔向秦岭，朝豫陕边境移动。1799年初，张汉潮突入河南。攻打卢氏县城不下，张汉潮前往内乡、镇平，再到南召、嵩县、鲁山。1799年新年前夕，他折向南，到了南阳。人手所剩无几，张汉潮不敢再攻打城镇，而是坐着竹椅在山中游走。受到明亮与地方军队的截击，张汉潮无法突入湖北，于除夕返回陕西。^151 尽管张汉潮突入河南的两个月是一段危机时期，明亮却并不着急；他远远地跟着敌人，无意逼得太紧。正如明亮后来向一位同僚官员坦承的，他有意拖延消灭张汉潮一伙，为的是不必去四川向勒保报到。鄙视勒保的明亮，不服从他的指示，也不向他奏报战况。^152 而追逐张汉潮跨越一省又一省，又给了明亮从不止一个省报销经费的机会——换言之，两头吃钱。</p>\n<h3>勒保的拖延战术</h3>\n<p>明亮的拖延并非个例。事实上，1798年见证了朝廷与其前线将领之间一场漫长的拉锯谈判的开始——谈判的主题是战争何时可以结束。随着冲突的中心移向川东，统帅勒保成了这场拉锯中的关键人物。在他主持之下，进展微薄而缓慢，而四川战场的军费开支则超过了陕西与湖北，在1797与1798年消耗了军费的大头。起初，乾隆最感懊恼的是大宁老木园之战——对手是陈崇德领导的万余名叛军。自1797年夏天起，观成与刘君辅攻其堡寨数月不下，尽管到1798年初叛军已减至几千人，给养也已耗尽——据说他们不得不吃野草。^153 乾隆一再批评二将，三月把两人都革了职，但责令他们留任，完成围困。^154 观成与刘君辅最终于四月下旬攻破那些堡寨时，却没能抓住陈崇德——陈崇德率最后的人马滚下悬崖，十天后在大宁北境被乡勇伏击歼灭。^155 类似的一幕也发生在开县开州坪——1798年初林亮功撤离临江市后在此筑垒山顶，但六十七与福森布主持的围困也数月无功。直到勒保请求将二将革职一个月后，他们才于盛夏攻占了这处据点。林亮功却逃走了。^156</p>\n<p>川东的其他军事行动同样不容乐观。1797年秋攻打营山县城不克之后，罗其清的白号留在营山，据守一处山头。1798年春末，其他叛军股团回到了营山。冉文俦的蓝号在罗其清据点附近扎营，王三槐与徐天德则继续东移。不久，惠龄与恒瑞攻破了罗、冉两处堡寨。但罗其清转移到营山境内另一座山——箕山——筑垒，冉文俦则据守邻县渠县的大神山。^157 与此同时，王三槐、徐天德与樊人杰在渠县、垫江与达州之间穿梭。他们试图攻取达州城西南的大竹县，没有成功。初夏在梁山与勒保遭遇之后，徐天德与樊人杰转而南下丰都，王三槐则北上开县与新宁。^158 勒保把对付徐天德的任务交给接替观成的新任成都将军富成，自己则亲率人马追剿王三槐。</p>\n<p>乾隆对四川战役以及对勒保的不耐烦与日俱增。他常说，读到勒保定期送来的冗长而详尽的奏折时\"甚为不悦\"——勒保在奏折中汇总下属的报告，给出叛军被杀伤的数目，动辄成百上千，却总是随时准备强调：他只能一股一股地肃清叛军。每次他许诺很快肃清全部叛军，都会强调横在面前的困难，或者奏报说又突然冒出一股新叛军，他不得不先对付他们，而不是与那些\"既定\"的股团作战。^159 乾隆一再\"严旨申饬\"勒保，面对这个狡猾的统帅，他似乎束手无策。六月陕西肃清叛军后——襄阳起事者残部被赶到了四川或湖北——乾隆设定了七月底结束整个战役的最后期限。^160</p>\n<p>这个期限很快就被打乱了。先是襄阳叛军返回陕西。随后，夏末，高均德与李述前往四川，与大神山的冉文俦会合。^161 对一直追击这一股的德楞泰大为光火，乾隆褫夺了他除副都统之外的一切职衔。但贬黜没有刺激德楞泰；大神山的围困没有迅速推进。^162 六月王三槐到达云阳后，在四面悬崖的安乐坪山顶筑寨，并派副手冷天禄到附近的祖师观另筑一处据点，与己呼应。^163 叛军重拾山顶战术、掘壕自守，数万清军再次陷入他们惯常的松垮围困。乾隆加大压力，批评勒保近半年来未能抓获任何叛军首领、肃清任何股团，只会用空话搪塞拖延，并威胁要罢免勒保的统帅之职。八月初一日，乾隆又设了一个新期限：八月底之前了结所有叛军股团。^164</p>\n<p>为安抚皇帝、争取更多时间，勒保不得不拿出点重大战果。事实上，他手里有一张牌。王三槐看不到继续叛乱的前途，到达安乐坪后，开始与清方谈判投降。王三槐曾试图说服冷天禄与他一同投降，冷天禄拒绝了。勒保派刘清——一位在川东百姓中口碑很好、据说连叛军也信任的地方官——多次进入王三槐的据点与他会面。^165 然而，勒保在奏折中没有透露他与王三槐的往来。相反，他继续详细奏报对王三槐据点的进攻，给人一种他的部下正在全力攻取叛军堡寨的印象。^166</p>\n<p>七月下旬，在勒保确保其人身安全之后，王三槐前往勒保大营投降，手中还挟持着勒保派来的一名乡绅作人质。勒保立即逮捕了王三槐及随他前来的三百多名起事者。然而，在奏报俘获王三槐的奏折中，勒保说的是：他对王三槐的堡寨发动了强攻，同时派一支人马在祖师观牵制冷天禄；又担心王三槐战死或自杀，便让一位名叫刘星渠的乡绅通知叛军：无论首领还是部众，只要投降就给他们一条生路。据勒保说，正是这时，王三槐及其部众来到勒保大营，弃械跪降。然而，勒保并不信守诺言，下令把投降的三百六十七名叛军全部斩首。^167 与福宁在来凤屠杀投降叛军一样，这一事件将在此后数年间阻止其他叛军投降。</p>\n<p>勒保的奏折于八月初九日到达北京时，乾隆与嘉庆两位皇帝正在避暑山庄接见蒙古王公。乾隆对王三槐被擒以及好消息的时机都极为满意——他可以当面向蒙古贵宾炫耀——于是对勒保大加赞许，赏赐无数，与他对明亮、德楞泰歼灭姚之富、王聪儿之后的反应形成鲜明对照。为庆祝这场\"大捷\"而颁发了许多道谕旨。其中一道以已退位的乾隆皇帝——\"太上皇帝\"——的名义颁发，乾隆在此谕中授予勒保最高爵位一等公，还赏赐了军机大臣们——其中和珅与福长安因襄赞拟旨之功获得爵位。^168 这是乾隆退位后少数几次以自己名义颁旨的场合之一——他发号施令时通常假借嘉庆之名。随后乾隆又赦免了永保，允许永保的两个儿子从热河回京，到上驷院当差。^169 然而，这是乾隆漫长一生中最后的一次欢庆。</p>\n<p>这场\"大捷\"之后，乾隆催促勒保及其他将领迅速结束战役。在他看来，冷天禄的数千人已经是四川最后一支大股叛军，王三槐一伙的覆灭应当已经瓦解了他们的士气。他命勒保一旦了结冷天禄一股，就赶去增援明亮。^170 然而，对勒保而言，王三槐的覆灭给了他同朝廷讨价还价的筹码；不把这份功劳全部变现，他不会了结冷天禄。八月下旬，勒保举荐了一批下属升迁，并请求把刚刚获释出狱的永保派到前线，让他在勒保的\"指教\"下将功折罪。勒保说，永保正当盛年，\"身强力壮\"，若闲置在家，他会于心\"不安\"。由于永保不会在没有任何职衔的情况下重返战争，勒保的请求不过是为永保讨一个位置——永保获赦时没有得到任何任命。然而，对勒保围困冷天禄的松松垮垮日益不耐烦的乾隆，驳回了这个提议。^171 毫不意外，祖师观的围困将持续数月。</p>\n<p>与此同时，对罗其清与冉文俦的围困也进展缓慢。直到七月中旬，清军才摧毁大神山的堡寨。冉文俦、李述与高均德率众投奔罗其清在箕山的堡寨避难。然而，由于与冉文俦的冲突，罗其清拒绝接纳他们。于是，冉文俦在罗其清堡寨附近扎营，襄阳起事者则前往陕西，额勒登保尾追而去。^172 不久，在忠州、重庆、顺庆一带游走的徐天德与樊人杰到达营山，在罗、冉附近扎营。清军集中力量先进攻徐、樊队伍，迫使他们撤离。八月下旬，徐天德与樊人杰又回来了。他们先是在罗、冉据点附近扎营，遭到攻击后放弃了自己的堡寨，与罗其清会合于箕山。^173</p>\n<p>四川与湖北大多数残存叛军会聚箕山——总数或许有三万——这可能是有人刻意安排的。零星的证据显示，这个计划的策划者可能是王廷诏——姚之富与王聪儿死后，他似乎成了叛乱的主心骨。王廷诏自己不再独立带队，由数百名</p>\n<p>起事者随行，在各股之间穿梭，试图协调起事者之间的统一行动。随徐天德一股到达罗其清据点后，王廷诏向罗其清展示了几部教门经卷与画像，令后者肃然起敬。王廷诏甚至弄出一个操江南口音、名叫\"刘冷\"的人，把他引见给各位叛军首领，称其为本教最尊的教主，地位比刘之协还高。这位\"刘冷\"随后给叛军首领们封官许愿。^174 极有可能，王廷诏是在设法复兴叛乱：制造一个傀儡领袖，取代刘之协——刘之协的缺席一直损害着这项事业。神秘的是，\"刘冷\"在叛乱此后的岁月里再也没有露过面。</p>\n<p>箕山之围直到额勒登保把高均德与李述赶回箕山、加入围困之后才到达临界点——高、李返回箕山很可能也是事先安排的。清军发动总攻，据说杀死数千人，起事者于十月初弃守堡寨。高均德与王廷诏逃走了。冉文俦率蓝号余部前往通江。罗其清及其数千幸存追随者转移到营山境内另一座山上，强占了山顶上当地居民的堡寨与给养，但很快被镇压者围住。1798年底（十一月初），给养耗尽，罗其清率数千名追随者趁夜冲击清军营垒突围，尽管伤亡数千——包括罗其清的父亲。他们转移到附近另一座山，但这次堡寨没能守多久，十一月下旬就被额勒登保与德楞泰击破。数日后，十二月初二日（1799年1月7日），罗其清与几名亲属在一个山洞里被擒。^175 在这一连串击破叛军据点的战斗中，额勒登保的部队功劳最大。他麾下的一位军官——四川人、副将杨遇春——开始崭露头角，显示出干练之才。罗其清一股覆灭后，他最终晋升总兵。他此前在湖北西南部对林之华、覃加耀一股作战中的贡献，并不总得到承认；额勒登保奏请奖赏升迁时，通常优先满洲军官，而冷落他们的汉人同侪。</p>\n<p>几股叛军在箕山的会聚令乾隆警觉。他一再命令勒保亲自前往箕山，把对冷天禄的围困交给别人。但勒保辩称，自己离开会削弱对冷天禄的压力，而箕山已经兵将充足。^176 愤怒而沮丧的乾隆一次又一次地斥责勒保，指责他\"一味因循\"，\"拥兵养寇\"。他威胁要褫夺勒保刚刚获得的一等公爵位以及承袭自祖父的世爵。^177 然而勒保不为所动，继续按自己的方式打仗。他定期奏报毫无亮点的进展，间隔越来越长，而且总是强调他遇到的困难，包括秋雨与浓雾。最终，给养耗尽，冷天禄与其人马于十二月二十一日突围，北上开县与东乡。尽管勒保把他们的脱逃当作一场胜利来奏报，他的奏折到达北京时，乾隆已经去世数日。^178</p>\n<p>回到家乡通江，冉文俦及其残部——据说有一万人——在麻坝寨的山顶掘壕自守；麻坝寨一面悬崖，其余各面只有险径可通山顶。冬季气候严寒，进攻者进展迟缓。但起事者缺粮，冉文俦不得不派出小队到附近市镇劫掠。俘获罗其清之后，德楞泰与惠龄北上麻坝寨，额勒登保则南下攻打徐天德。十二月三十日，除夕前夜，清军伏击了叛军外出觅粮的小队。随后，在元旦凌晨，他们发动全面攻势，用火弹纵火焚烧堡寨。许多叛军被烧死或杀死，一些人滚下悬崖，一千多名起事者及其家属被俘，其中包括身负重伤的冉文俦——他随后被凌迟处死。^179 然而，冉文俦的许多部下脱了身，其中有他的侄儿冉天元——一员猛将。^180</p>\n<p>显然，德楞泰与惠龄在这场战斗中并不打算把冉文俦的人马一网打尽。事实上，乾隆的新赏功政策也起了作用。乾隆意识到，像战争头两年那样按杀贼数目行赏，会诱使将领们夸大或捏造杀贼数字，或者滥杀被叛军裹挟的平民以邀功，于是把擒获或杀死叛军首领作为新的受赏标准。将领们于是相应地改变了策略。新的套路是——正如嘉庆皇帝后来所说——\"只擒贼首一人，而纵其余贼众逃逸\"。^181 此后，被击败的起事者很快就会重新集结，产生新的首领，这又给军队提供了新的邀功机会。确实，从1798年底起，朝廷听到的叛军首领新名字越来越多。</p>\n<p>1798年四川的围城战——有些延续到1799年初——是这场漫长战争中最后一批此类作战。没能守住所有据点，幸存的起事者再次放弃了山顶战术——这次是永远——此后主要依靠运动战与游击战。从箕山突围后，徐天德与樊人杰率领他们那股堪称四川战场最强的队伍，在达州与重庆之间流窜。^182 1798年底，樊人杰与徐天德分手，率一大队人马前往陕西，再次试图北渡汉江。起事者在川陕之间不停的移动，使汉江谷地始终处于高度戒备。^183 另一支襄阳队伍——王光祖所率——自1798年底起把重庆城当作目标。它在城郊游走，还不止一次突入与重庆隔嘉陵江相望的江北县境。^184 攻不下这座大城，王光祖转而向长江以北的东北方移动，但他的一支分遣队已在1799年初徐天德到达嘉陵江东岸时加入了徐天德。徐天德在定远渡江的尝试被挫败，叛军被地方乡勇击退。然而，他们前往川西的意图——起事者还从未深入过川西——令清方警觉；勒保急忙派额勒登保赶赴嘉陵江下游河谷对付徐天德，自己却留在大州以南地区，继续对冷天禄作徒劳的追击。^185</p>\n<p>姚之富与王聪儿已死数月、王三槐已被擒，叛乱却依然存活。急于看到最后胜利的乾隆设下一个又一个期限，全部落空。即便已年过八旬，退位的乾隆皇帝仍表现出惊人的精力与清醒。^186 他批阅前线送来的所有奏折，为行动的每一步发号施令，三年来一直是战役的掌舵人。他累计着叛军被杀被俘的数目，把奏折中的信息与呈进的地图一一核对。^187 他迅速指出可疑的信息、矛盾之处与荒谬之点，并为此无情地讥讽众将。^188 他深知将领们并未全力作战，也不接受他们惯用的地形阻碍、天时不利、兵力不足等借口。相反，他把这场战役描绘成这个样子：将领们聚集精兵以自保，挥霍军费以自肥；他们行动迟缓，落在叛军后面；叛军行动迅捷，善于跋山涉水，而清军被山岭拖慢，一到河边——哪怕水很浅——就得等船；作战时，清军先放几轮枪炮，然后就用乡勇去与叛军接仗；叛军占优时，清军拔腿就逃，避开苦战；将领们瞒报自己的伤亡，却夸大叛军被杀的数目——而许多被杀被俘者，其实是被裹挟的平民，包括老人、妇女、儿童与残疾人。^189</p>\n<p>乾隆并非看不到战役的可悲状况。然而，他似乎没有扭转局面的手段。他常常听任自己被前线将领们牵着走，轻易改变决定。更严重的是，他不愿对那些行为理应受到惩处的将领采取强硬行动。除了再三\"严旨申饬\"，他什么也不做——尽管他清楚地知道自己的批评没有效果。生命的最后几个月里，八十七岁的乾隆已不如从前那样精力充沛。^190 他仍不肯把大权交给儿子，在前线奏折上写的批语越来越短、越来越少。有时，焦虑与沮丧流露在他写下的\"盼\"（pan）字上，或者更沉痛的\"切盼\"（qiepan）二字上。他盼望的当然是胜利。随着嘉庆三年年末（1799年2月4日）临近，他向勒保表达了日益加深的绝望与愤怒：</p>\n<blockquote>\n<p>现在已是十一月中旬。朕望捷音日益迫切。而各路竟未肃清一股贼匪。若仍如此因循，恬不知耻，不能同心协力，于年内了结所办之事，则尔等真无心肝，罪无可逭。^191</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释191。]</p>\n</blockquote>\n<p>两周之后，乾隆再次斥责勒保：</p>\n<blockquote>\n<p>勒保统率大兵，围困穷蹙之贼已历数月，而毫无进展，因循怠玩，是何居心？若自知不能办，即当据实陈明。乃迁延日久，徒致师老兵疲。静夜自问，天良安在？^192</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释192。]</p>\n</blockquote>\n<p>诉诸良心似乎不奏效。十二月二十八日，新年前三天，接到勒保又一份没有好消息的奏报，乾隆\"深为失望\"\"实为愤懑\"。他再次斥责勒保\"不可信\"——他只会空口许诺，数月毫无建树。然而，他能做的，只是再次给勒保与明亮\"严旨申饬\"——这也是最后一次。^193</p>\n<h2>注释</h2>\n<p>[译者按：文献简称同第1章。]</p>\n<p>题辞：XFFL, 84/25a.</p>\n<ol>\n<li>GZDJQ, 1815, 1831.</li>\n<li>XFFL, 26/29b–34a, 27/10b–14b, 30/32a–b.</li>\n<li>XFFL, 26/21b–22b, 26/34a–36a, 27/14, 30/32a–35a.</li>\n<li>景安获赏伯爵爵位与双眼花翎。XFFL, 28/24b–27b, 28/36b, 28/37b.</li>\n<li>张世虎供词，BLJZL, 5:154.</li>\n<li>XFFL, 28/9a–b.</li>\n<li>罗威廉（Rowe）《腥风血雨》（Crimson Rain），198–99。</li>\n<li>XFFL, 31/4b–5a, 34/12a–13a; Xu Zengzhong, \"Shilun pingjia Wang Conger.\"</li>\n<li>恒瑞、硕云保与富成追击姚之富一路；景安与王文雄尾随王廷诏一路；庆成与巴克坦布追李述一路。XFFL, 33/5a–b. 关于叛军在河南的运动，见XFFL, 31/12b–16a, 32/5a–7a, 33/29a–32b, 34/9b.</li>\n<li>XFFL, 141/1a–2b.</li>\n<li>XFFL, 25/1a–5a, 26/12a–18a, 26/20a–21b.</li>\n<li>清朝文献记载，会合后的襄阳队伍有四千人，商南又有五六千名当地教众加入。XFFL, 35/2a.</li>\n<li>XFFL, 34/36a–37b, 35/2b, 35/4a–b, 35/6a–9b, 36/22a–24b.</li>\n<li>这一路先北上，随后折向西南前往淅川。XFFL, 34/6b–8a, 34/12a–13a.</li>\n<li>XFFL, 35/15b.</li>\n<li>清朝文献估计，共有一万人在陕南加入了襄阳叛军。XFFL, 35/32b–33b, 36/2a, 36/12b, 36/13a–b, 36/16b, 37/17a–b, 39/20b–21b.</li>\n<li>高均德供词，BLJZL, 5:83.</li>\n<li>XFFL, 33/33a–34b.</li>\n<li>XFFL, 36/8b–10a.</li>\n<li>XFFL, 34/28a–30a, 34/32a–34b. 不久，乾隆再次斥责众将总是迟缓误事，听任敌军任意来去。XFFL, 35/12b–13a.</li>\n<li>XFFL, 35/16b–19a. 宋澍是巡视中城的监察御史。</li>\n<li>XFFL, 35/20a–21a.</li>\n<li>XFFL, 36/29a.</li>\n<li>XFFL, 38/10a–17a.</li>\n<li>GZDJQ, 2290, 2475; BLJZL, 1:258–59.</li>\n<li>XFFL, 39/19a. 撒拉族是逊尼派穆 li>\n<li>魏秀梅《清季职官表》，355–80。</li>\n<li>勒保擅长结交私人，上上下下广结善缘。昭梿《啸亭杂录》（Zhaolian, Xiaoting zalu），419。</li>\n<li>JQSYD, 2:243; QSG, 10745.</li>\n<li>JQSYD, 2:151.</li>\n<li>XFFL, 56/25b–26a, 57/16b–17a.</li>\n<li>XFFL, 58/26a–b.</li>\n<li>XFFL, 58/30b–31a.</li>\n<li>XFFL, 59/1a–2b, 59/12a–13a. 派勒保入川时，乾隆以为他已在赴鄂途中，于是命勒保或带额勒登保同往，或从额勒登保处抽调一两千名士兵——如果额勒登保尚未结束与长阳叛军的战斗。XFFL, 54/35b–36a. 但勒保接到新任命时还没离开贵州。</li>\n<li>XFFL, 203/25b–26a.</li>\n<li>XFFL, 59/30b–31a.</li>\n<li>XFFL, 59/31a–32b.</li>\n<li>XFFL, 59/37b.</li>\n<li>XFFL, 60/14a–16a, 63/25a–28b.</li>\n<li>XFFL, 58/29b–27b, 59/14b–16b, 60/4a–6b.</li>\n<li>KJJFSB, 2/11a.</li>\n<li>XFFL, 63/24a–25a. 舒亮十二月下旬曾奏报，白岩山据点约有叛军两万。XFFL, 59/16b–17a. 他的数字可能有所夸大。</li>\n<li>傅月明供词，BLJZL, 5:81; 冉天元供词，第90页。</li>\n<li>XFFL, 61/6a–8a.</li>\n<li>XFFL, 60/29b–30a, 61/12a–15a.</li>\n<li>XFFL, 61/15a–18a, 61/22a–25a. 很可能是勒保写信给额勒登保与福宁，敦促他们向朝廷请命。</li>\n<li>XFFL, 61/25a–b.</li>\n<li>MQDA, A283–23.</li>\n<li>XFFL, 61/5a.</li>\n<li>XFFL, 62/26a–31b, 63/12b–13a.</li>\n<li>XFFL, 62/31b–33a. 宜绵率一千名陕西兵把后勤事务全部移交福宁后，于嘉庆三年二月初七日离开达州。XFFL, 64/28b–29b, 65/38a–b.</li>\n<li>XFFL, 54/36a–b, 59/37b.</li>\n<li>但乾隆命二人都留在前线，降为兵丁，并抄没家产。XFFL, 63/24a–25a, 63/31b–32a, 63/33b–34a.</li>\n<li>XFFL, 66/29b–37b, 67/18a–23b.</li>\n<li>XFFL, 65/24b–29a, 66/37b–39a, 66/41a, 66/43a, 68/32b–33b.</li>\n<li>XFFL, 65/8a–11a.</li>\n<li>XFFL, 67/39b.</li>\n<li>XFFL, 69/22b.</li>\n<li>XFFL, 34/25a–28a, 38/6a–10a.</li>\n<li>XFFL, 卷42–44 各处。</li>\n<li>XFFL, 卷45、48、49 各处。</li>\n<li>XFFL, 卷50、52–54 各处。</li>\n<li>XFFL, 59/5b–8b.</li>\n<li>XFFL, 61/27b–28b.</li>\n<li>XFFL, 卷55–59 各处。福宁被褫夺宫衔与翎羽顶戴。额勒登保的二等伯爵被降为三等，翎羽顶戴也被降格。XFFL, 61/29b–30a.</li>\n<li>XFFL, 61/15a–18a, 61/25b–27b.</li>\n<li>覃加耀与张正朝被押送北京，凌迟处死。其余俘虏全部被额勒登保的部队屠杀。XFFL, 62/1a–4b.</li>\n<li>XFFL, 44/19b–24a, 44/34b–35a, 62/4b–8a.</li>\n<li>XFFL, 45/4b–6a, 45/8a–9b, 47/22b–25b.</li>\n<li>XFFL, 44/10a–11a, 45/15a–b, 46/2a–b.</li>\n<li>XFFL, 45/10b, 47/1a–4b, 47/9b.</li>\n<li>吉林旗兵于嘉庆二年九月初三日全部到达襄阳。XFFL, 50/10a.</li>\n<li>他们的人数已减到大概一万一千至一万三千。XFFL, 32b–33b, 卷45–47与48 各处, 54/14b–15a.</li>\n<li>XFFL, 50/4a–9b.</li>\n<li>XFFL, 49/4a–11a.</li>\n<li>惠伦的遗体被送回北京。乾隆赏银三千两治丧，并让其子承袭公爵。XFFL, 50/18a–b. 惠伦是明瑞的亲侄，因明瑞无子而过继。关于明瑞之死，见Dai, \"Disguised Defeat,\" 158–60。</li>\n<li>只有保康、房县、竹山、竹溪等少数县份与兴山、远安、南漳等少数城市遭受严重破坏。XFFL, 51/21a–25a, 52/14b–16b.</li>\n<li>增援汉中的兵力包括恒瑞、庆成率领的四千名士兵，以及英善从四川带来的两千名士兵。英善还从甘肃调来一千名士兵。XFFL, 卷50、53 各处, 及54/14b–15a.</li>\n<li>XFFL, 54/4b–6a, 54/7b–8a.</li>\n<li>XFFL, 52/7b–11a 及卷54 各处。</li>\n<li>XFFL, 56/5a–10a, 56/16b–20a, 57/12b–13a.</li>\n<li>XFFL, 57/6b, 57/6b–12a, 58/15a–16b, 64/13b.</li>\n<li>高均德三十五六岁，出身襄阳教门世家。嘉庆元年三月初十日，他因在家中窝藏一名教门师父而被捕。1796年六月，永保派高均德前往襄阳叛军中，劝其叔父高成杰投降。但高均德选择留在叛军一边。XFFL, 182/26a–27b; 高均德供词，BLJZL, 5:82–89.</li>\n<li>XFFL, 卷58–59 各处, 60/1a–3b.</li>\n<li>其中包括驻宁羌的五百名山西兵、驻勉县的三百名荆州驻防满洲兵、另五百名荆州满洲兵以及汉中当地士兵与乡勇，还有柯藩与爱星阿沿江及川陕边境巡逻的四千名士兵。明亮还请求惠龄从太平前往西乡。XFFL, 60/21b–24a.</li>\n<li>XFFL, 60/26a–32b.</li>\n<li>XFFL, 61/1a–6a, 61/12a–13b.</li>\n<li>XFFL, 60/24b, 61/1a–2b.</li>\n<li>XFFL, 卷60–62 各处, 64/8b–15.</li>\n<li>嘉庆三年正月十四日，乾隆接到景安奏报：另一股五六千人的叛军——包括数百名骑马妇女——在南郑渡过汉江。XFFL, 60/26a–30a. 随后秦承恩又奏报，叛军后队于正月二十七日在石泉渡江。XFFL, 64/1a–2a.</li>\n<li>XFFL, 64/19b–23a, 64/33b–34b, 65/21a–22a.</li>\n<li>柯藩被摘去顶戴，降为署理提督，还有其他处分。XFFL, 62/14b–16a, 64/12b, 64/27b–28b.</li>\n<li>XFFL, 65/16b–20a, 卷66 各处, 67/1a–3b.</li>\n<li>XFFL, 卷64–65 各处。</li>\n<li>额勒登保先奉命入川，到达川东后又改派陕西。XFFL, 64/18a–19b, 64/29b–30a, 65/31b–33a.</li>\n<li>XFFL, 61/21b–22a, 61/24b–25a.</li>\n<li>XFFL, 66/9a–11b, 66/15a–18b.</li>\n<li>王聪儿之所以被认出，还因为她的头发不长（1794年避居尼庵时削了发），且身着绣衣、戴金耳环。姚、王二人的首级被割下，先悬于襄阳示众，再悬于途经的川陕各地，最后解送北京；尸体则被碎割。GZDJQ, 3786; BLJZL, 1:323–37; XFFL, 67/9a–15b, 175/12b–13a; McCaffrey, \"Living through Rebellion,\" 202–12.</li>\n<li>XFFL, 67/16a–18a, 67/41b.</li>\n<li>XFFL, 67/25a–b.</li>\n<li>XFFL, 67/30b–35a, 68/18a–21b, 69/1a–3b, 71/24b–27b; GZDJQ, 3895.</li>\n<li>XFFL, 71/1a–5b, 72/13a–16b, 72/27a–28b.</li>\n<li>XFFL, 72/20a.</li>\n<li>XFFL, 73/1a–52, 73/9a, 73/10a–11b, 73/34b–38b.</li>\n<li>1799年九月魁伦路过此地时向朝廷奏报了此事。XFFL, 124/6a–b.</li>\n<li>XFFL, 124/6b–7a.</li>\n<li>XFFL, 66/41b–42b, 67/27b–29a, 68/1b–5b, 68/22a–23b, 69/8b–13b; GZDJQ, 3923.</li>\n<li>XFFL, 卷70–73 各处。</li>\n<li>XFFL, 74/20b–22b, 74/26b–29a, 75/8a–11a, 75/13a–15a; GZDJQ, 4055.</li>\n<li>GZDJQ, 4081, 4125.</li>\n<li>张汉潮想到自己可能再也回不了襄阳，一度潸然泪下，试图上吊，被部下劝阻。XFFL, 83/12a; 李潮供词，BLJZL, 5:80.</li>\n<li>XFFL, 卷77–79 各处及卷82; 《大宁县志》（Daning xianzhi）5/9b. 秋天，额勒登保曾短暂与明亮会合，随后前往广元对付高均德。XFFL, 79/12b–14a.</li>\n<li>XFFL, 78/16b–17a.</li>\n<li>XFFL, 卷85–86 各处。</li>\n<li>XFFL, 115/40a–b, 124/6b–7a.</li>\n<li>XFFL, 60/35a–38b, 70/24b–27b.</li>\n<li>XFFL, 57/26b–31b, 59/5a, 66/26a–b, 68/15b–16a; 《大宁县志》（Daning xianzhi）5/7b–9a.</li>\n<li>XFFL, 72/32b–36a.</li>\n<li>XFFL, 73/15b–16a, 73/24b–25a, 74/9a–11a. 林亮功此后的下落一直不明。但勒保把他列为1796年底病故。勒保《平定教匪纪略》（Pingding jiaofei），56b。</li>\n<li>XFFL, 73/5a–8b; 罗其清供词，BLJZL, 5:74; 王三槐供词，第66–67页。</li>\n<li>XFFL, 72/29a–32b.</li>\n<li>XFFL, 71/16b–20b, 73/22b, 75/1a–5a.</li>\n<li>XFFL, 73/18a–19a, 74/7b–16a.</li>\n<li>高均德供词，BLJZL, 5:83; 李槐供词，第79页。</li>\n<li>XFFL, 74/3b–5a, 74/30b–35b, 75/24b, 76/30a–35b.</li>\n<li>王三槐供词，BLJZL, 5:67, 71.</li>\n<li>XFFL, 74/23b–26b, 75/32b–35a, 76/6b–8a, 77/1a–2b.</li>\n<li>战争爆发时刘清是南充知县，1798年初经乾隆提议升任知府。XFFL, 68/15b–16a, 71/21b–22b, 71/24b. 显然，勒保把刘清纳入了自己的羽翼之下。</li>\n<li>XFFL, 76/14a–18b, 76/21b–22a, 76/23b–24a. 勒保在自撰纪略中声称自己\"生擒王三槐\"。勒保《平定教匪纪略》（Pingding jiaofei），19b。</li>\n<li>勒保，嘉庆三年七月二十五日，BLJZL, 1:348–49; XFFL, 77/23b–26b. 勒保，嘉庆三年八月初六日，BLJZL, 1:356.</li>\n<li>QLQJZ, 42:530–31.</li>\n<li>XFFL, 77/30a–b.</li>\n<li>XFFL, 77/30b–32a.</li>\n<li>XFFL, 79/26a, 79/30a–b.</li>\n<li>XFFL, 77/15b–21b.</li>\n<li>XFFL, 78/6b–7a, 78/18a–25b, 79/14a–20a.</li>\n<li>高均德供词，BLJZL, 5:85–89.</li>\n<li>XFFL, 卷81–86 各处。</li>\n<li>XFFL, 78/29b–30a, 80/1a–b, 81/9a–11a.</li>\n<li>XFFL, 80/17a–b.</li>\n<li>XFFL, 78/3b–7a, 79/5a–9a, 79/22a–24b, 82/1a–4b, 84/13b–14b, 87/19a–22a, 94/20a.</li>\n<li>XFFL, 86/24b–26b, 87/1a–5a, 87/25b–30b.</li>\n<li>1799年二月，数千名叛军试图从四川突入宁羌。嘉庆认为他们是冉文俦的残部。XFFL, 91/20b–21a. 同年晚些时候，嘉庆又说，惠龄没有全歼冉文俦一股，只擒其首领邀功。XFFL, 106/14a–b.</li>\n<li>XFFL, 90/15a–b.</li>\n<li>XFFL, 83/5a.</li>\n<li>XFFL, 卷82–86 各处。</li>\n<li>XFFL, 79/8a–9a, 79/24a–b, 82/4b–6b.</li>\n<li>XFFL, 卷84–86 各处。</li>\n<li>正如他嘉庆三年八月初九日所说：\"朕自前年授玺以来，训政未嘗暇逸。邪匪歷年未靖，朕宵旰焦勞。幸精神尚健，凡軍營事宜，隨時指示。\"（原文待核）XFFL, 77/28b. 又见XFFL, 87/10a–11a.</li>\n<li>1796年底，乾隆对成德呈进的黄柏山地图表示不满，责令他重绘，并附彩色签条说明图上的信息。XFFL, 20/32a–b.</li>\n<li>例如，乾隆质问：1796年春的一场战斗中，柯藩及其一百名士兵怎么可能杀死四百多名起事者、俘获数十名。XFFL, 6/8a–9b, 6/11b–12a. 1798年初，他对观成\"老木园叛军已至人相食、吃树皮草根\"的说法提出质疑，问这些东西怎么可能支撑他们这么久。XFFL, 60/39a–b. 他曾纳闷：叛军——包括妇女——都能行走自如的道路，部队为何走不了。XFFL, 60/9a. 1798年秋，他讥讽惠龄以雨为借口解释箕山进展迟缓，问叛军为什么不受雨阻。XFFL, 80/6b. 又见XFFL, 18/22a–b, 36/39b–43a, 37/1a–3a.</li>\n<li>XFFL, 52/20b, 60/32a, 65/11b–12, 67/2a.</li>\n<li>嘉庆后来承认，乾隆的精神状态自1798年底急剧恶化，无法再像从前那样细心指挥战役。XFFLXB, 352/7b–8a.</li>\n<li>XFFL, 83/10a–b.</li>\n<li>XFFL, 84/25a.</li>\n<li>XFFL, 86/34a–35a.</li>\n</ol>", "text": "\n勒保统率大兵，围困穷蹙之贼已历数月，而毫无进展，因循怠玩，是何居心？……静夜自问，天良安在？\n——已退位的乾隆皇帝，1798年\n[译者按：原上谕自英文直译，文言原文待核，见注释。（出处当为《清高宗实录》嘉庆三年上谕）]\n\n四川起事者为生存而挣扎之际，襄阳叛军长途跋涉，穿越河南与陕西，于1797年夏天渡过汉江，在四川东北部与被击溃的教友会合。乾隆因部队未能阻止他们而震怒，罢免了惠龄，以宜绵接任统帅。然而，襄阳叛军与四川同党的会合并没有像清方所担心的那样，成为这场正趋衰落的叛乱的转折点。姚之富与王聪儿未能在川北立足，不久便率其核心队伍返回湖北。在湖北、陕西、四川辗转作战数月之后，这支或许堪称所有叛军队伍中最强的力量，于1798年春被歼灭。尽管如此，它的覆灭并没有标志着叛乱开始走向终结。战争在川东与陕南继续进行，大多数起事者转而采用游击战。1797年底，永保之兄勒保被任命为新统帅——这是一年之内战役领导层的第三次更迭。然而，勒保很快证明自己是拖延战术的大师。在他主持之下，战役以极度缓慢的速度推进；一些将领想出了拖延的策略，同时借机谋取私利。明亮对勒保的领导大为不满，也故意放慢了脚步。到1798年底乾隆健康开始恶化之时，战役已经陷入了泥潭。\n襄阳叛军的长征入川\n尽管1796年底与襄阳叛军作战时表现可悲，清军凭借兵力与武器上的压倒优势，使起事者无法继续留在其家乡地区。约一万两千名叛军在襄阳府与河南南阳府之间穿梭，不断化整为零、又合零为整。他们的游击战术迫使镇压者分散兵力守卫关隘道路，削弱了清军正面迎击叛军的能力。^1 然而，1797年正月，起事者被困在光化以北地区。他们试图分三路突围时，惠龄等人发动了几次全面攻势，使叛军伤亡惨重，人数急剧减少，也许只剩下几千人。陷入混乱的许多叛军抛弃了家属，或开小差回了家。地方官员设立安抚之所，登记安置那些向官府投诚的人。^2（地图2.1）\n人数锐减之际，叛军派出信使，召唤失散与脱队者归队，并煽动新的起事。信使无法进入村镇与人接触，有时就把简短的讯息系在串起来的铜钱上，丢在路旁。然而，他们的努力收效甚微。湖北巡抚汪新声称，他已抓获并处决了派往襄阳一带的所有信使。^3 对武装号召唯一有案可查的响应，是正月里河南淅川与内乡一场未遂的起事——几个教门首领聚集了一千人准备举事。然而，起事尚未发动，景安就赶到现场，逮捕了一百多人。^4\n在湖北没能造出新的声势，襄阳的首领们决定长途跋涉入川，与那里的起事者会合——他们听说四川发生了起事，更重要的是，四川的同党人数众多，而且地形对他们有利：山势险峻，镇压者难以攻取。^5 但襄阳起事者不得不绕一个大弯，因为清军已沿他们在湖北西北部的去路布防。^6 二月下旬，他们向东转移到与河南交界的桐柏山；他们的分遣队最远到达应城、黄陂与黄安——这是叛乱迄今触及的最东端——引起足够的恐慌，使湖北那一带动员起来自卫。^7 襄阳队伍不打算继续东进，开始北上，分三路突入河南，分别由王廷诏、李述与姚之富率领（王聪儿越来越成为设定叛乱方向的关键人物，此时随姚之富一路）。姚之富特别指示各首领：不与清军接仗，专心突围。^8\n三月，三路人马都进入了河南，河南当局如临大敌。^9 景安不得不把有限的兵力拉成一条长长的战线，自己则在一处又一处之间穿梭，试图遏制叛乱在本省的蔓延。景安显然不擅长军事行动，行事谨慎。在与一些将领的欺诈行径作斗争、协助扳倒永保的过程中，景安已与同侪疏远，成了流言中伤的目标。他后来被指责为怯懦，未能阻止叛军经本省窜入陕西。^10 事实上，惠龄与其他将领的表现也好不到哪里去：他们既没能在河南消灭襄阳叛军，也没能阻碍叛军在河南的运动。三路叛军都迅速向豫陕边境推进，尽管途中迂回曲折。^11\n三月底，王廷诏与李述夺取了武关，突入陕西的商州——通往西安的门户。在商州，两路人马会合，数千名当地教众加入了他们。^12 会合壮大后的队伍到达山阳、镇安后，又折向东，进入湖北西北端，或许是为了招募那里的教众。四月初七日，叛军攻占了郧西县城——这座城没有城墙，只有几十名士兵与乡勇把守。不过，他们只守了一天，庆成就把它收复了。^13 姚之富与王聪儿一路——王聪儿在一场战斗中左臂负伤——在河南走了更长的路线，因此比其他两路晚几天进入陕西。^14 他们到达山阳高坝店时，会合后的王、李两路已经折向郧西。从湖北一路追击姚、王一路的恒瑞，此时远远落在叛军后面。^15\n清军远远落在身后，姚、王一路在四月享受了数周的太平时光。尽管起事者沿途不断吸收新血，但哪里都没有像贫困的陕东南那样成功——那里的教门网络根深蒂固，但1797年初兴安的几场起事被平定后，就再没有新的鼓动。许多教众已与地方官府签下保证书，不再参与叛乱。然而，襄阳起事者的到来重新点燃了当地教众的热忱。姚、王队伍派人前去联络时，数千人热烈响应。小股的起事——几十人或几百人——在各地爆发；有些人甚至烧掉了自己的房子，带着全家加入叛乱。当会合的王、李两路从郧西返回、与姚、王一路在月底会师时，他们的人数可能已经超过两万。^16 队伍急剧膨胀之后，起事者进行了一番改组，设立黑、白、黄、蓝四号，各设一名\"元帅\"统领。^17\n河南西南部被围之际，惠龄的多次增援请求终于有了回音。乾隆命从山西调两千名士兵到陕西商州，与秦承恩早先派到那里的四百名陕西满洲旗兵会合。^18 襄阳起事者一进入陕西，省级当局便竭力搜罗一切可用兵力，包括从宁夏与西宁调来的两千名士兵，使与襄阳队伍作战的正规军总数超过了两万。^19 在得知叛军在陕西扩军之前，乾隆一直相信叛乱已近尾声，因为湖北最后几千名起事者已被他的重兵逼到陕东南一隅。被近在眼前的胜利前景所鼓舞，乾隆痛斥了众将。四月中旬的两道上谕中，他逐一驳斥了他们惯用的那些无法歼灭残破起事者、甚至无法阻止其运动的借口：兵力不足、士兵太疲劳、给养匮乏，等等。他困惑不解：他向前线派去了数万军队与三千多万两白银，又为三个战场各指定了主将——襄阳的惠龄、达州的宜绵、黄柏山的额勒登保与福宁——怎么还会出错。乾隆敦促将领们顾念朝廷的形象与民众的苦难——即便巨额的财政花费可以暂置一旁，民众的苦难也随着时间推移而加剧——责令众将给他一个结束战役的明确时间表，或者对办不到给出站得住脚的解释。^20\n老皇帝公开的震怒，给一直密切关注战役的朝官们发出了一个鼓舞人心的信号。年轻的御史宋澍不久上疏，对战役执行中的种种可疑现象作了一番无情的剖析。他质问：如果说已有数万人被杀，一场区区数千人的叛乱怎么可能持续这么久？他讥讽毕沅1796年底过早宣布战后善后（shanhou）开始，话音未落就传来叛军再度横行的消息——先入河南，再入陕西。宋澍援引乾隆朝边疆战争的先例，敦促皇帝任命一位最高统帅总揽全役，并派更能干的将领赴前线，以免再拖延、再互相推诿。宋澍还谴责将领们把战役变成了升官发财的机器，并提议严惩玩忽职守的将领。^21 宋澍不留情面的批评，必定反映了其他官员的意见与议论。显然，在京城已不是秘密：前线的奏报并不都可信，将领们也没有尽力作战，而是利用战役谋取私利。乾隆命人把宋澍奏折的抄本寄给众将，并附上对惠龄的严厉警告，提醒他永保的前车之鉴。^22 此后数周，乾隆继续斥责惠龄，说他比永保还不如。^23\n直到五月初，惠龄才仓促组织了一场对镇安黄龙铺叛军的进攻，声称杀敌三千余人。^24 但这场进攻并没有阻止襄阳队伍向汉江推进。汉江横贯陕南，是叛军入川路上的天然屏障。不过，从勉县到紫阳的上游河段水浅，冬春尤甚。为防止起事者渡江，陕西当局下令把所有船只都停靠到南岸，并派四月间率一千五百名士兵从四川返回的柯藩及其他军官守江巡防。^25 与此同时，从甘肃循化调来两千名撒拉族士兵，又从甘肃庄浪调来一千名土兵。^26 或许对自己的部队能在江北歼灭起事者没有信心，乾隆指示众将：如果不能在江北将他们一网打尽，不如把他们压向川北，与那里的起事者会合，这样清军就能在一处同时对付两股叛军。他的理由是：这可以免得陕西未受惊扰的地区遭到蹂躏。^27 这道指示无异于默许叛军渡过汉江。\n叛军沿山间小路进发，先到旬阳，再到兴安府治安康的北岸，于五月初五日抵达。尽管守城的只有五百名士兵，当晚汉江水涨，救了这座城市。从这里，叛军分为两路。第一路约两万人向西移动，佯装在西乡渡江，随后转而南下，到达紫阳的白马石——汉江在陕西的最南点——那里的江水只有三四尺深。惠龄、庆成、舒亮正缓慢向西乡推进，五月十二日至十九日的一周之间，起事者与他们的马匹在白马石（白马之石）及附近的鲇鱼滩（鲇鱼之岸）涉水过江，并夺取了一些船只，把妇女、儿童与老人渡过去。清军直到渡江的最后一天才赶到白马石，只能攻击最后一批过江的几百名叛军。姚之富与王聪儿率领的第二路五千人沿江向西北移动，不为沿途守江清军所阻，于五月十九日到达紫阳的汉王城。叛军徒步涉水过江，并用几条船载运家属。两次渡江中，叛军都用银锭或衣物付给当地船夫报酬。他们还在汉江谷地留下了一首小调：\"少做庄稼多做鞋，七月不来八月来。\"（Shaozuozhuangjia duozuoxie, qiyuebulai bayuelai；原文据作者拼音转录复原，待核）^28 此后数年的冲突中，陕南的汉江谷地成了各路叛军频繁往还之地——起事者确实回来了，而且是许多次。\n尽管乾隆早先曾建议把叛军压向川北，得知这如今成了现实，他还是又惊又怒，尤其恼怒他的部队迟了一周才赶到白马石。他在两道措辞严厉的上谕中向惠龄及其将领们倾泻怒火，罢免了惠龄的战役统帅之职，还褫夺了他的世袭爵位与翎羽顶戴。乾隆不情愿地任命宜绵接替惠龄。恒瑞、柯藩、庆成、舒亮被摘去翎羽顶戴或巴图鲁名号，有些人还被降了级。乾隆甚至威胁说，如果他们继续这样打仗，就要动用死刑。然而，由于可用将领匮乏，他不得不让他们留任原职。^29 这是乾隆第二次更迭战役的最高领导层——距惠龄出任统帅仅仅五个月。\n勒保出任统帅\n扩充后的襄阳队伍向四川进发时，他们在四川的教友处境不佳。在明亮与德楞泰手下连吃几场败仗后，剩下的两千名达州叛军被逼入达州、东乡、新宁之间的山区。在大宁，早春一场新起事之后，当地教门首领陈崇德率其千名信徒在九龙池筑垒自固，但在观成率六百名士兵前来增援地方军队后，很快转移到更为险峻的老木园。^30 连同巴州方山坪冉文俦的蓝号与罗其清的白号，四川的起事者总计大概不超过六千人。\n渡过汉江后，襄阳队伍第一路向西前往西乡，因为经大巴山入川的道路已被当地官府掘断。随后它又分为两股。一股在通江的竹峪关进入四川，与方山坪的蓝号、白号会合。另一股前往太平。与此同时，姚之富与王聪儿率领的第二路在城口进入太平。^31 清军将领又一次没能追上叛军，乾隆痛骂他们\"无耻已极\"（原文待核，见注释32）。^32 在四川，宜绵竭力在太平拦截襄阳叛军，没有成功。^33 叛军很快推进到开县的铅河。随后在方山坪驻足的那一股也到了开县。六月下旬，新到的起事者涌入开县，营帐绵延数里；许多当地居民被裹挟入伙。湖北与四川叛军的总数可能接近三万。^34\n然而，与襄阳首领们的设想相反，徐天德、王三槐麾下的达州叛军并没有热情拥抱他们。经信使联络，襄阳与达州的首领们安排了在东乡中河的一次会面，但会面非正式而短暂——双方都在马背上。^35 襄阳首领们表示希望合并时，四川的同党拒绝了他们。显然，一场地盘之争开始了；本地人对前来他们家乡、自视高人一等的外来者心怀怨恨。正如王三槐所说：\"岂容湖北之人，践我四川之境。\"（原文待核，见注释36）^36 襄阳队伍离开罗其清与冉文俦的方山坪据点，很可能也是出于类似的原因。襄阳起事者到达后不久，清方就察觉他们打算返回湖北。除地盘之争的因素外，襄阳起事者对这片贫瘠的地区也大失所望——这里根本无法与襄阳富庶的乡野和繁华的市镇相比。^37 此外，清军的压力大概也有影响。尾随襄阳队伍入川的湖北清军与四川清军会师，按乾隆的设想，这使他们得以在一处同时了结两股叛军。新任统帅宜绵决定把全部叛军松散地围在四川东北角，因为\"我兵合则力厚，贼分则势孤，合则势众\"（原文待核，见注释38）。^38\n襄阳队伍于闰六月（六月之后）启程返回湖北。他们走了另一条路线：先向南到长江北岸，再沿江而下入鄂。徐天德、王三槐及其他四川首领率兵相送，陪湖北队伍一直到奉节。沿途，他们在开县、云阳、万县与奉节——均属夔州府，川东又一个教门渊薮，但此前大体平静——点燃了新的起事。有些起事吸引了数千追随者。叛军一度攻打云阳县城，没有成功。长江以南，只有奉节铁瓦寺爆发了一场起事，由龚文玉、龚其位兄弟领导。\n这支队伍在当年晚些时候被当地军队在奉节与湖北利川、恩施两县乡勇的协助下击溃。^39 1797年唯一幸存的叛军据点在开县白岩山，由云阳教门中人林亮功领导。舒亮与穆克登阿率六千名清军围困这处据点，成了一场旷日持久的围困。^40\n在奉节，徐天德与王三槐率四川叛军折向北，前往大宁。襄阳队伍分作两路。姚之富与王聪儿率主力前往湖北，而王廷诏、李述、樊人杰、张汉潮、王光祖以及数目不详的湖北、陕西叛军留在四川，随后与徐、王队伍一起去了大宁。这个安排可能是为了留下部分兵力在四川，牵制清军，使其不能尾追姚、王一路。果然，只有明亮与德楞泰追着姚、王一路到了湖北，惠龄、恒瑞、舒亮等人都留在了四川。\n襄阳起事者虽然未能与四川叛军合并，他们的到来却产生了深远的影响——他们向四川的同党传授了游击战术。结果，四川叛军放弃了山顶战术，走出了家乡地区的范围。白莲教战争的态势由此发生了永久性的改变。在大宁，徐、王队伍与留在四川的襄阳叛军计划与老木园据守的叛军会合，并招募更多追随者——他们听说大宁还策划了更多起事。然而，这个计划被观成与湖广提督刘君辅率领的围困老木园据点的清军破坏了。^41 与老木园叛军会合不成，会聚起来的叛军转而攻打太平直隶厅城，没有成功。^42 于是他们向西转移到巴州，打算与方山坪会合的蓝号、白号相见。\n此时，百祥主持的方山坪围困松松垮垮，已经拖了数月。为加强围困，宜绵先于夏末派朱射斗前往，八月又亲赴方山坪。宜绵一如既往地偏爱使用大量文官统领乡勇，与正规军一道发动总攻。经数日激战，他们用火弹点燃叛军主寨，于八月二十一日攻占了山顶。^43 宜绵虽声称杀死叛军数千，罗其清与冉文俦却都逃了出来，率其残部向巴州城移动，在那里与徐天德、王三槐、李述等人会合。\n九月初十日，多股起事者——总数或许有两万——攻占了巴州。^44 随后，十月间，他们又夺取了没有城墙的通江县城，尽管地方当局拼死守城。^45 然而，占据者并不打算据守这两座城。他们很快撤离，转而袭击清军的补给线。显然，起事者正苦于给养短缺。大约此时，李述离开四川前往陕西，很可能是因为获取给养困难。据清朝记载所示，起事者打算渡过汉江，转移到陕西或湖北更适宜生存的地方。由于李述率领着一支可观的队伍，惠龄、恒瑞与庆成尾随他追到了陕西。^46 与此同时，姚、王队伍的先锋已从湖北西北端突入陕南。汉江谷地再次进入高度戒备。\n回到川北，清方不遗余力地保卫连接四川与北京、途经西安的交通大动脉，因为北京拨发的全部军费银锭都经这条漫长而艰苦的路线运输。驿道自成都出发，通往四川北部门户广元。进入陕西后，自褒城起，驿道是凿于悬崖之上的狭窄栈道（zhandao），绵延一百五十英里，止于陕西眉县。随后道路沿秦岭北麓延伸至西安。白莲教战争的大部分时间里，这条命脉都是双方争夺的焦点。为防止叛军接近栈道，1797年底，乾隆先派恒瑞与庆成前往汉中，不久又命他们去广元。在四川，先是陕西的镇总兵保兴、后是英善被派去保卫保宁府城。英善一到，就招募了一千名乡勇，守卫保宁与广元之间的战略要地。^47（地图2.2）\n川陕大动脉的防务加强之后，起事者转而袭扰成都与达州之间的路线。他们以数千人为一股行动，在十、十一月间攻打顺庆府境内沿路或近路的营山、仪陇、广安、邻水诸县城。战斗十分激烈，有时持续数日，数名清军军官阵亡。^48 起事者虽然没能攻下任何一座城，清军在四川的压力却在不断增大——先是明亮、德楞泰离去，接着恒瑞、庆成也走了。得不到有效遏制，各股叛军在毫无武装的当地居民中肆虐，逼得许多人逃亡，妇女尤其多有自杀者。正如一部战争编年史所描述的：\"贼匪四布，官兵乡勇四出搜剿，疲于奔命。贼首之名不可尽知，官民之死于蹂躏者不可胜数。\"（原文待核，见注释49）^49\n宜绵擅长攻破叛军的山顶据点，却不善于对付他们的游击战。^50 抱怨兵力不足，他从甘肃与山东调了更多军队到四川。^51 此外，他赞同雇用更多乡勇，使1797年最后一个季度成为四川乡勇扩张的高峰。雪上加霜的是，姚之富与王聪儿率领的襄阳队伍从陕西突入了川北。与此同时，长阳叛军的残部放弃了又一个山头后，试图突入四川。备受压力的宜绵于十月奏请朝廷另派一名督抚入川主持地方事务，以便他专心军事。^52\n乾隆九月间刚刚表达过对宜绵的不信任：\"宜绵等所带之兵，看来无一可靠。\"（原文待核，见注释53）^53 他对宜绵从未完全信任，便把这一请求当作宜绵的请辞。十月二十六日，他以宜绵\"年迈\"为由将其罢免，任命勒保为统帅，但让宜绵留川主持后勤。^54 一年之内，乾隆第三次更迭战役统帅；勒保成为继永保、惠龄、宜绵之后的第四任统帅。与前任们不同，勒保将一直是战争领导层的核心人物，直到战争结束——尽管前方还有起伏等着他。\n就仕途而言，勒保一直比永保顺利，尽管后者承袭了父亲的世爵。勒保十六岁获得监生身份——很可能是捐纳而来——入仕后文职武职交替，既在京城任职（不止一次在兵部），也出任归化、库伦等边地之职，还多次担任巡抚、总督。然而，直到1791—1792年的第二次廓尔喀之役——他参与的是后勤事务——勒保才第一次接触战争；这次经历让他获得了第一手的经验：如何运作军费，使将领与后勤官员从中获益。1794年，勒保以陕甘总督的身份在查禁教门期间处决了刘松。^55\n1795年初夏，勒保被任命为云贵总督。^56 他以这一身份主持了镇压苗民起义战役的后勤。与福康安、和琳这两位以挥霍与挪用军费臭名昭著的战役主帅搭档，勒保的账目并不干净。有流言说勒保挪用军费结交私人，包括送礼讨好和珅。^57 1797年春，乾隆决定把勒保调往四川。勒保启程赴川之前，一道新旨意抵达，把他的目的地改为湖北黄柏山。然而，勒保于一月中旬到达那里不过数日，乾隆就命他火速返回贵州，因为贵州西南端的南笼刚刚爆发了仲家苗人的又一场起义。这场起义由据信会法术的苗妇王囊仙领导，吸引了可观的人众，正开始蔓延。主要依靠从陕西来的一位能员石进，勒保在数月内平定了这场起义，由此获得一等侯的爵位，也赢得了\"能战之将\"的名声。1797年九月，姚、王队伍返回湖北后，勒保被任命为湖广总督。此后不久的一道谕旨明确：勒保将被授予湖北战场主帅之衔。^58 然而，勒保动身赴任之前，乾隆又改派他去四川，任命他为整个战役的统帅。\n值得一问的是：勒保战历浅薄，其弟永保被革职受审还不到一年（尽管在清代，一位大员的罪责与耻辱很少影响其兄弟的仕途），乾隆何以如此看重勒保？乾隆的选择凸显了清朝国家在乾隆—嘉庆交接之际面临的一个问题：经验丰富的军事统帅匮乏。正如宋澍谏言中所说，镇压战役及时成功的关键在于正确的领导。乾隆虽赞同宋澍，承认永保与惠龄都不适合统帅之位，却坦言可堪统兵之任的人选不多，因为许多宿将新近谢世——福康安、海兰察、孙士毅——而阿桂等一些人年事已高。^59 \"实无可恃之人\"，乾隆叹息道。\n自清朝开国、开疆拓土、频兴边战之初，战争主帅的遴选就形成了一些惯例。起初，一流满洲军事贵族是人选之首。^60 自雍正朝起、直至乾隆朝，往往由一位领班军机大臣出任钦差大臣监军。^61 更多时候，由总督——无论满汉——出任统帅。^62 直到18世纪末，清朝的任何皇帝都不曾想过，物色一位合格的统帅竟会如此困难。然而，嘉庆朝之初时势不同了。开疆拓土一代将领的凋谢，在清军最高层留下了显眼的空缺。与此同时，乾隆又倡导了一条新思路：镇压内乱的战役不应动用精锐旗营，各省绿营驻军足矣。此外，统帅也不应拥有足以指挥对外边疆战争的地位。后来有人问嘉庆，为何他与乾隆都不曾派一位皇子亲领白莲教战争，嘉庆解释说，\"太平\"之时派皇子领兵并不适宜，因为一旦他不能完成任务，就难以惩处。^63 事实上，当时的皇子中没有一个经过战阵。同时，大多数军机大臣是地道的汉人士大夫，不谙军务。\n剩下的唯一选择，是在七位现任总督中遴选统帅。然而，其中三位（直隶总督梁肯堂、两江总督李奉翰、两广总督吉庆）没有多少军事背景或经验，另外两位——宜绵与1797年底出任云贵总督的鄂辉——已经卷入战争，并已证明不适合主帅之位。唯一的选择就在魁伦与勒保之间。^64 二者之中，勒保与朝廷的关系更好，特别是与和珅本人的关系——在漫长的仕途中，勒保在结交权贵、培植门生方面手段娴熟，远不止胜任。^65 性格截然不同的魁伦是闽浙总督，乾隆朝最后一年赢得了反腐斗士的名声（下章将述）。然而，以他耿直自恃的性情，他可能没有足够留意与和珅的关系。\n事实上，开疆拓土一代还有一位高水准的将领在世，且精力充沛。明亮远比勒保等人有资格主持战役。然而，明亮与和珅的头号政敌阿桂的关系，注定了他没有机会。正如我们所见，尽管明亮对苗疆战役与白莲教战役的贡献无可争议，他却频频被找出过失。1797年八月，阿桂去世，享年八十。^66 去世前不久，阿桂处理的最后事务之一，是勒保提出的一个请求：为苗疆战役结束后仍留用的贵州苗区乡勇首领发饷。阿桂驳回了这个请求，因为勒保没有明确说明请求涉及多少首领——这有可能成为挪用经费的借口。^67 阿桂之死，使和珅把自己的亲信安插到关键职位上再无阻碍。鉴于阿桂留下的空缺需要填补——最好由一位有军事资历的人填补——白莲教战争的胜利将为统帅升入军机处铺平道路。可以理解，为明亮敞开大门不符合和珅的利益。总而言之，对乾隆与和珅双方来说，勒保都是主持战役的自然人选。\n然而，勒保从贵州到前线的行进极其缓慢；受命之后，三个月过去，他才到达前线。在这段从容不迫的旅途中，勒保设法挡掉了两道要他改道陕南、与明亮合作攻打襄阳叛军的圣旨。鉴于明亮与永保的宿怨，以及勒保在苗疆战役中与他的恶劣关系，勒保费尽心思避免去陕西。第一道圣旨是在勒保出任统帅后不久下达的，当时襄阳起事者聚集在汉中一带，企图北渡汉江。^68 勒保没有公开表示不悦，而是施展拖延战术；到达川南的泸州时，他停了下来。十一月二十四日，徐天德与王三槐攻占了长寿县城——这座城没有城墙，只有乡勇防守（知县正在别处与叛军作战）。由于长寿邻近重庆，宜绵立即派百祥率一千名士兵增援重庆防务。^69 听说这个消息，勒保立即请求改派他去长寿而不是陕西；乾隆批准了。^70\n但勒保并没有急着去长寿。借口自己没带兵，他留在泸州招募乡勇，等待从附近永宁镇调来的三百名驻军——至少他是这么说的。此外，他还抱怨四川兵力不足，要求增援。^71 事实上，他从贵州铜仁带去了三千名乡勇，而这一点他直到1800年底才告诉朝廷。^72 在泸州闲居期间，勒保上了一道奏折，力陈向四川增兵的必要性。他先分析战役久拖不决的原因，指出叛军的游击战术与裹挟当地民众以扩充人数的伎俩，随后描绘了一幅镇压战役的悲观图景：\n\n川、陕、楚三省犬牙相错，[边境]绵亘数千里，高山峻岭处处皆有，贼匪既可恃险负隅，又有多途逃窜。官兵扼要堵截之时，贼匪转而扰及无兵之处。是以有贼之处无兵，有兵之处无贼。亦有贼过兵未到，或兵到贼已去。官兵击之于东，贼即奔窜于西；官兵击之于北，贼即奔窜于南。欲剿灭贼匪，虽数十路之兵不能合围；欲堵截贼匪，虽数十万之兵不敷分布。^73\n[译者按：原奏自英文直译，文言原文待核，见注释73。]\n\n勒保并不是第一个剖析叛军游击战术的人。宜绵与明亮数月前就讨论过。然而，勒保是第一个强调地形因素的人。他在这道奏折中使用的说辞，在此后漫长的战役中将被众将一遍又一遍地重复，为他们的劳而无功辩护；它也被一些史家接受，用以解释战争的迁延。然而，到1797年底，战役的主战场还没有移到广袤荒蛮的大巴山或秦岭。刚刚采用游击战术的四川叛军，主要袭击的是顺庆府与达州直隶州境内后勤路线上的城镇。勒保强调三省战场地形艰险，声称即便数十万军队也不足以围剿叛军，其实是在抢先为一场旷日持久、耗费巨大的战役辩护。\n眼下，勒保继续催促增援。他抱怨四川的军队少，却要与众多起事者作战，而明亮与德楞泰统率大军，在陕西却只与较小的一股起事者作战。因此，他建议陕西的清军把叛军赶向四川，四川的清军再诱使散处的叛军合并成一股，一举歼灭。不过，为实现这一目标，勒保请求把所有清军都调到他麾下、开赴四川；他说，他所请求的军队不到，他就不会采取任何行动。^74 尽管勒保的口气处处为己，此刻似乎把勒保当作救星的乾隆，还是称赞他一针见血地揭露了战役的通病，并对他寄予厚望：\"勒保既能如此熟悉情形，议论透彻，自必革除积习，大改局面。\"（原文待核，见注释75）^75\n在等待勒保到达前线的漫长日子里，四川的清军继续抵御叛军沿顺庆、达州后勤路线的进攻。几乎所有城镇都只有受雇乡勇防守（只有梁山县城例外，由明兴主持防守），朱射斗与保兴率领的清军正规部队则在一处又一处之间穿梭，击退进攻者。罗其清与冉文俦围攻营山县城两周，恒瑞与庆成赶到、一场激战随之展开后，他们不得不放弃攻势。^76 十二月初，徐天德与王三槐在攻占一周后放弃了长寿城，转而北上攻打梁山、新宁，最后攻打达州，但从陕南赶来的惠龄、富成等人挫败了他们夺取达州的图谋。^77\n攻取这些城镇无一得手，徐、王转而扑向临江市（意为\"临江之市\"）——开县一个繁华的商业市镇。他们与留在四川的襄阳各股协调行动，于1798年新年（2月16日）前几天共同攻占了临江市，因为守城的只有几百名临时拼凑的乡勇。市镇里有数百家店铺商号，叛军过了一个欢快的新年，摆宴席、唱大戏。^78 此时，据守开县白岩山数月之久的一万名起事者放弃了他们的据点。攻打开县县城不下之后，他们于嘉庆三年正月初十日加入了临江市的同伙。^79\n清军在新年庆典期间的无所作为，使起事者得以在临江市停留半个多月；直到正月十五日元宵节——通常标志庆典结束的日子——他们才离开市镇。^80\n临江市陷落时，勒保还远在前线之外。尽管承诺在长寿与叛军交战，勒保却去了重庆，在这个商业枢纽盘桓了一段时间。他可能在那里看了戏——这是他钟爱的消遣——或许还雇了一个戏班随行。勒保最终到达长寿时，这座城已从叛军手中解脱数周。于是，他把任务从驱逐叛军改为\"抚恤\"居民。他又以等待更多军队为借口，为自己滞留长寿辩解。据他说，他在川南招募的两千名新兵未经战阵，所以他加派了部队，不得不等待他们到达。^81 直到新年前数日，贵州的一千名士兵与成都的两千名新兵到达，勒保才离开长寿继续北上。然而，襄阳队伍的一支渡过汉江北去时，乾隆警觉起来，认为姚之富与王聪儿率领的襄阳主力随时可能渡江。正月初八日，在接连几道措辞严厉、斥责明亮的上谕之后，他命勒保火速赶赴陕西，指挥那里的军事行动，并奏报明亮等人的失职。^82\n然而，仅仅十天之后，乾隆就改了主意。与先前一样，勒保想尽一切办法避免去陕西与明亮合作。他不断向皇帝奏报四川的惊险消息。与此同时，仍在湖北的额勒登保与福宁也奏报四川局势危殆，因为他们收到了宜绵与穆克登阿敦促他们入川的信函。正月十八日接到额勒登保与福宁的奏折后，乾隆命勒保留在四川。^83 次日，他任命勒保为四川总督，把宜绵送回原任陕甘总督，又命福宁与英善主持四川后勤。^84 这一新任命显然是对勒保的又一次妥协，或许也是为了催促勒保加快行动。与此同时，乾隆不再命勒保去陕西。\n尽管这是清军把四川几乎所有叛军股团合围在临江市的难得机会，勒保似乎并不打算朝这个方向行动。叛军在年后两周弃守临江市时，勒保还在垫江，此后继续以蜗牛般的速度北上。直到二月初九日，他从英善手中接过印信，才算正式就任四川总督。^85 这距他被任命为战役统帅已经三个多月。连对勒保寄予厚望的乾隆，也对他行动之\"从容\"表示不满。^86 很快将变得清楚的是，勒保是拖延战术的大师：只要符合他的目的，他愿意尽其所能放慢军事行动。到达前线后，他尽量不碰刚刚离开临江市的叛军主力，而是选择对付万县一支新近拼凑起来的小股叛军——这给他带来一场轻松的胜利，赢得了乾隆的高声赞赏。乾隆甚至说，\"勒保一到四川，局面就转向了极为可喜的方向\"（原文待核，见注释87）。^87\n勒保也是长于结网之人，深知该与谁交朋友、该对谁板面孔。一到任，他先把明亮的盟友宜绵送回陕西——尽管他本可以找个借口把宜绵留在四川——因为他留下了惠龄与英善，后者继续主持达州的后勤。^88 与此同时，勒保遵照乾隆一再的指示，严惩不认真作战的将领。^89 他的第一次处分落在了舒亮与穆克登阿头上。他指控二人在白岩山长达六个月的围困中懈怠失职，又未能阻止那里的起事者前往临江市，请求将二人革职、解京受审——此举为他赢得了乾隆对果断处分的赞许。^90\n整个春天，四川起事者继续在顺庆与达州开展游击战。他们分股行动，但有时也相互配合。勒保未能击溃任何一股。二月，保兴在达州阵亡。^91 勒保再次抱怨自己七千人的兵力太少，不足以应付各股起事者，请求从云南、贵州调一万名绿营兵（每省五千）。经乾隆批准，这一万名援军于春末到达——这是战场省份之外最大规模的一次部署。^92 春去夏来，乾隆对勒保毫无保留的信任开始蒸发。他先是批评勒保抓不到叛军首领，对战役进展迟缓漠不关心，只定期向朝廷送些乏味的战况简报，或举荐官员的名单。^93 不久，他又指责勒保纵容麾下的恒瑞、庆成等将把叛军赶入陕西，而不在四川了结他们，说他是\"以邻为壑\"（yilinweihe）。^94 最终，乾隆开始怀疑勒保的才干：\"勒保初到四川，屡获胜仗，声名甚著。近来何以不如从前？\"（原文待核，见注释95）^95 随着时间流逝，他的怀疑将变成绝望与愤怒。\n湖北叛乱的终结\n1797年春，襄阳队伍离开湖北前往河南后，湖北北部大体恢复了正常。在襄阳府与郧阳府，地方当局的抚恤工作使居民回返、生产恢复，尽管官府对返乡叛军的搜捕仍在进行。^96 从那时起直到夏天，全省只有林之华、覃加耀领导的长阳叛军一股仍在本省西南角流窜。然而，姚之富与王聪儿的回返在初秋再次把湖北西北部部分地区搅得一片狼藉。直到1798年初，林、覃叛军的最后残部才被肃清。两个月后，姚、王队伍也在陕鄂边界覆灭。尽管如此，对乾隆皇帝而言，这两场胜利都来得太迟了——它们是在无数次申斥与对主将的贬黜之后才取得的。\n长阳起事的终结\n1797年六月，林、覃队伍从芭叶山的重围中突围后，先沿湖北西部边界移动，试图与四川的同党会合，没有成功。随后他们返回长乐，在白玉寨的山顶筑垒自固。初秋，从芭叶山一路追击他们的福宁与额勒登保攻占了山顶。幸存的起事者转移到附近的帽子山，再次据守山头。^97 围困循着惯常的模式进行：七八千名清军屡次被叛军击退，而叛军只有敌军一半的人数，手中的家伙不过是石头与滚木。福宁与额勒登保直到姚、王队伍返回湖北才加紧进攻，因为他们担心后者可能与帽子山的起事者会合。然而，姚、王队伍北去之后（详见下文），他们又放慢了节奏。乾隆一再严厉斥责这两位主帅作战不力，但批评毫无效果。八月下旬，给养行将耗尽，起事者又完成了一次不可思议的突围，尽管报给乾隆的奏折声称清军已摧毁其堡寨、杀敌众多。乾隆讥讽两位主帅不过是在起事者撤离后夺取了空寨，除阵亡士兵外不赏任何人。^98\n深秋，林、覃一股突入四川巫山。无法再往前走，他们又回到湖北，在建始、恩施、利川之间漂流，同时抵挡追击的清军。妻子与女儿被清军俘获后不久，林之华战死。^99 覃加耀率领最后几百名起事者返回家乡长阳与长乐。他们在朱里寨的山顶据守了数周。数日战斗之后，清军纵火焚烧了他们的堡寨，但覃加耀与约两百名叛军逃脱。^100 再次逃向四川边境，他们流窜于建始、巴东与归州之间。福宁与额勒登保紧追不舍，却没能赶上他们。1798年正月中旬，汪新前往巴东为川东部队协调后勤时，在归州遭遇了覃加耀及其最后的人马。与汪新小规模交火之后，覃加耀率一小股起事者登上一处名为终报寨（意为\"终报之寨\"）的山顶。福宁与额勒登保这才赶到。^101\n在这场对林、覃队伍旷日持久的作战中，乾隆无数次痛斥福宁与额勒登保，骂他们\"无耻\"\"无心肝\"，还以严惩相威胁。汪新奏报二人行动迟缓，再次激怒了他。他把福宁与额勒登保一并降了官爵。^102 奉命前往四川（他麾下的两千名士兵已先期入川），福宁于正月中旬又率一千名士兵离开湖北。^103 福宁刚一离开，正月十七日，额勒登保就派出三支队伍，架梯挽绳攀上悬崖。登上山顶后，士兵们杀死或俘获了终报寨据点的全部叛军。覃加耀与这场起事的另一位关键首领张正朝被擒。教门师父、很可能是起事谋主的张驯龙则早已被杀。^104\n乾隆一点也不高兴。他的军队花了将近两年才了结长阳起事者——他们从未能攻下任何城镇，却靠着镇压者的怠惰，从一座山头转移到另一座山头。乾隆非但没有嘉奖，反而把福宁与额勒登保都降为副都统，并责令额勒登保向本旗缴回先前所获的一万两赏银，罚福宁向四川军需库缴银四万两。乾隆清楚福宁的责任大于额勒登保，命额勒登保参加四川的战役，却把福宁改派主持四川后勤，不再带兵。^105 后来京城官员闲谈这场战役时，福宁的改任被引作典型例证，说明将领们如何因拖延与失职而获得宽纵。额勒登保并非贵族出身，福宁在场时，他或许无法全力作战，因为福宁家世更高，还当过湖广总督。额勒登保在终报寨干脆利落的胜利，才更像他决心了结敌人时的作战风格。\n姚、王队伍的覆灭\n1797年七月初在巴东进入湖北后，姚之富与王聪儿本计划与长阳叛军会合，但长阳叛军已返回长乐，被围于帽子山。于是，姚、王队伍转而北上，目标是返回襄阳。叛军逼近归州州城时，成功骗过了比他们先到、沿长江顺流而下的明亮与德楞泰：他们留下一支小队牵制清军，主力迅速北上，夺取了兴山县城（没有城墙）。随后他们继续向保康进发，同时派出一支分遣队向东，前往远安与当阳。\n此时，姚、王队伍多达两万人，还从当地居民与敌人手中夺取了六七千匹马，而与他们对阵的清军因分兵把守要地与城市而兵力分散。明亮抱怨自己只有四千名可战之兵、六七百匹马。^106 七月初二日，乾隆批准从吉林调一千名旗兵、从黑龙江调两千名旗兵，并命从官马厩中备好八千匹战马，装备这些旗兵。^107 为保障襄阳防务，乾隆从山西调两千名绿营兵前往襄阳，又命驻木兰围场的一百名精锐旗兵由惠伦、阿哈保两位满洲将领率领，火速赶赴襄阳。与此同时，景安也派了一千名河南兵到湖北保康。^108 总计约六千名士兵被部署到湖北——这是这场战役中的第二次大规模动员。（地图2.3）\n八月初，姚、王队伍抵达襄阳近郊（他们在远安—当阳一带的一路人马也被德楞泰与明亮逼得北上了）。德楞泰与明亮会合了惠伦、阿哈保率领的五百名刚出城迎战的新到吉林旗兵，^109 使起事者伤亡惨重。返回襄阳的计划既已落空、人数又已缩减，叛军转而向西进入武当山区，随后向汉江移动，企图渡江入豫。他们的计划是在河南多山的西部边境招募更多追随者。但遭到明亮与德楞泰的攻击、又添伤亡之后，他们未能到达江边。^110\n八月二十九日，在郧县草店的一场恶战中——双方许多人都骑在马上——清军据说杀死一千余人，俘获三百余人（其中近三分之二是妇女），还有数百人跳下悬崖。战斗之后，阿哈保等人追击撤退的起事者到陈家山，又发生了一场残酷的近距离搏斗。混战中，惠伦与一名叛军首领交手，引来一群叛军挺矛攒刺，当场被杀；还有数名高级满洲军官阵亡。阿哈保的战马受伤，多亏部下拼死相救才得以脱身，而那些救他的人付出了生命。^111 这场战斗两周前，高级蒙古旗人丰绅阿已在另一场战斗中阵亡。^112 但惠伦是战争中阵亡的最高级别满洲军官。惠伦与明亮同出显赫的富察氏（明亮是惠伦的叔父），他的养父明瑞在18世纪60年代末的缅甸战争中自杀身亡，惠伦由此承袭了最高爵位一等公。忆起三十年前明瑞的惨死，乾隆伤感地哀悼这个功勋家族又失去了一位英才。^113\n无法渡过汉江，姚、王队伍在无数次失败尝试之后，于十月间突入陕西。湖北再次解除了战事——只有长乐据守的最后几百名长阳叛军除外。^114 湖北再次开始战后重建之时，陕南进入了高度戒备。由于李述一路——或许有两万人——正在西乡，试图渡过汉江，秦承恩不遗余力地加强江防。他把所有船只都停靠到北岸，向汉中增派了数千援军——那里冬季水特别浅——还沿江雇了数千乡勇。^115 乾隆又命把索伦兵派往紫阳，守卫汉江最南点。^116 明亮与德楞泰追着姚、王队伍到了陕西，十月中旬在镇坪与其激战数日，据说杀死五六千人，俘获三百六十五人——其中一半是妇孺——只有四千人逃脱；与往常一样，这些数字可能有所夸大。^117 随后姚、王队伍向汉中移动，途中频频遭到攻击，又添伤亡，还丢下了许多妇孺。^118 与此同时，留在四川的许多襄阳起事者——包括王廷诏——也移到了陕南。在汉江上游谷地会合后，襄阳叛军多次试图渡江，没有一次成功。^119\n为把部分清军从江岸引开，襄阳起事者移向宁羌，随后又到四川广元。他们还袭击了江南的官道，使一处路段无法通行，中断了清方的官方通信。被明亮等人打败后，他们返回汉中，分作两路：姚之富、王聪儿与李述率主力前往四川通江，高均德率另一路向西。^120 清军也分兵应对：明亮去截击高均德，德楞泰追击主力。1798年初，襄阳两路短暂会合，试图与四川叛军会师，没有成功。此时，王聪儿建议她的一路返回陕南，佯装要攻打川陕大动脉，从而为高均德创造渡江机会。^121\n这个计策奏效了。十二月二十四日，正值隆冬，江岸冰雪覆盖，高均德率其数千人马在南郑周家坪涉水渡过了汉江。听说渡江之事，明亮与德楞泰率八千士兵渡江北上，把姚、王队伍留给较弱的将领与五六千名士兵守在南岸，因为他们认为北岸的清军全是步兵，力量单薄。^122 然而，乾隆大为震怒，称他们的举动是\"大错\"（原文待核，见注释123）——因为他相信（事实证明他是对的）高均德的渡江正是为了把清军精锐从江岸引开，好让姚、王队伍渡江。此外，他还怀疑叛军主力可能已经渡江，只是明亮与德楞泰因惧怕严惩而隐瞒不报。乾隆先摘去二人的翎羽顶戴，继而削去世职。他痛骂二人自私——他们带走了全部精锐旗兵——并责令二人以肃清陕西全部叛军来赎罪。^123 乾隆再次求助于勒保，命他火速赶赴汉中，主持江边作战，^124 但勒保如前所述，设法说服乾隆改了主意。\n渡过汉江之后，高均德攻打汉中城——城中兵力并不雄厚——没有攻下。随后他移向陕西与湖北、河南的边境，但很快被明亮、德楞泰与陕西军队紧紧围住。在河南，景安一听说高均德渡江，也加强了边境戒备。\n赢得了乾隆的赞许。^125 到二月，高均德一路已被逼到镇安东南一隅，经数场恶战，人数减到或许只剩两千。^126 然而乾隆并不满意。姚、王队伍仍在南岸，关于它渡江的假消息却一次次传到北京，每次引起一番惊扰，激起乾隆对明亮与德楞泰的怒火。^127 二月十五日，又一次虚惊之后，乾隆革了明亮的职，命将其押解进京受审。他还革去明亮两个儿子的侍卫之职，发往热河充当苦役。明亮的位置由宜绵接任。然而，数日之内，乾隆就退了回去：他先是让明亮留在陕西继续作战，随后又给了明亮一个低微的头衔\"领队\"（lingdui），理由是宜绵既老且病。^128 这是朝廷惯用的手法——革职、惩子、最终留用——意在鞭策明亮及其同僚更认真作战。明亮当然心领神会。\n襄阳主力直到二月初才完成渡江（但消息传到北京时，明亮已被革职）。高均德渡江之后，襄阳主力先从广元移到南江，随后于正月二十四日在西乡碱池坝重入陕西。移师汉江上游谷地后，他们于二月初三日或次日，在城固与南郑之间、距高均德渡江处不远的地方涉水渡过了汉江。柯藩未能阻止他们。^129 渡江之后，李述率七八千名叛军北上，直指西安。他们穿过斜峪关，一路进抵眉县与盩厔，在西安引起极大恐慌。直到叛军逼近西安近郊，他们才被秦承恩与王文雄挡住，柯藩与荆州将军兴肇随后赶到。无法夺取西安，李述于三月初把队伍分作两股：他自率一股先东进、再南下镇安；另一股向西移动，但不久即被歼灭。^130 李述袭扰西安，吸引了部分清军，使姚、王队伍得以向东朝边境移动。二月下旬，姚、王一股与高均德一股在镇安会合，但很快被明亮、德楞泰等人围住，他们突入湖北郧西的所有尝试都被挫败。^131 此时，额勒登保率两千名士兵到达陕西，^132 弥补了骁勇的撒拉族士兵离去的损失——他们自上年秋天起随明亮行军作战，此时已返回家乡。^133\n二月下旬，明亮、德楞泰、额勒登保三位清将把襄阳队伍压向镇安西北。野猪坪一场恶战之后，襄阳起事者再次分作两股，一股由姚之富与王聪儿率领，另一股由高均德率领，都朝豫陕边境移动。相应地，额勒登保追击高均德（李述从西安南下后，他又转而对付李述），明亮与德楞泰则向姚、王队伍施压。^134 三月初五日，明亮与德楞泰把姚、王队伍逼到山阳南缘。经一整天的战斗——姚、王队伍伤亡惨重——叛军连夜分批潜入湖北郧西；其中一些人可能是从把守严密的漫川关强行通过的。次日，在当地军队与乡勇的协助下，明亮与德楞泰对筋疲力尽、仍有数千之众（据德楞泰奏报，有八九千人）的起事者发动夹击，把他们逼到郧西三岔河。姚之富、王聪儿与一些随从在那里找到一处高地攀登。滚木未能阻止清军，姚之富、王聪儿及一些护卫——包括十几名妇女——弃马登上峰顶，跳崖而死。姚之富当场毙命，王聪儿重伤不能言语，但在被杀之前承认自己就是\"齐王氏\"。对剩余叛军的战斗一直持续到次日清晨。^135 德楞泰声称清军杀死七千余人、俘获一千余人，但也承认把搜捕散逃叛军的任务留给了地方当局。显然，许多叛军逃脱了，包括王廷诏。王聪儿死后在民间传说中长存不灭，并在20世纪晚期的中国被塑造为白莲教战争的叛军偶像。然而，她参加叛乱的时间并不长；冲突在她死后还将长久持续。此外，还有数不清的其他妇女对叛乱产生了影响。\n充分利用自己非凡的机动性，襄阳起事者坚持了两年。然而，他们似乎没有健全的战略，常常追随一些模糊甚至一厢情愿的想法。起初，他们盼着与川北的同党会合。这一招不如预期时，他们又起了返回襄阳的念头。这个计划也落空后，他们又在豫西构想了一片新的乐土，却对这个计划如何实现毫无清晰的想法。结果，他们不停地在汉江谷地兜圈子，拼命地想渡江——先是想渡到南岸，后来又想渡到北岸。他们的一根筋给镇压者提供了清晰的指引，使其得以截击并与之交战——这实际上抵消了他们机动性带来的优势。与\"陕南汉水高地是叛军根据地\"的流行看法相反，襄阳起事者并不打算在那里避难。他们嫌恶这个地区的贫瘠，一直想离开汉江谷地，只把它当作通往梦中乐土的通道。\n明亮放慢脚步\n1798年春，姚、王队伍渡江一个月后即被歼灭，明亮与德楞泰展示了自己的效能。乾隆把这场胜利归功于他对明亮所施处罚的成效，如今准备宽恕明亮了。他先把明亮的两个儿子从热河召回，安排到上驷院当差，随后又恢复了明亮的副都统衔及其翎羽顶戴。^136 宜绵也为老朋友辩护，强调明亮作战从不示弱，尽管有时可能有点\"过虑\"（原文待核，见注释137）。^137 毕竟，战争还在继续；前线需要这位老练的将军。\n姚、王队伍覆灭之后，明亮、德楞泰与额勒登保转而对付李述与高均德——姚、王最后的时日里，他们二人并不在一起。李、高两路会合后，又收编了数股突入陕南的四川叛军，再次企图前往河南。他们向陕西东南边境推进，试图分成小队进入河南。许多四川与陕西的叛军不愿离开家乡，或投降，或返回四川。洛南两岔河一场血战——战斗中叛军发誓要为姚之富、王聪儿报仇，结果伤亡惨重，高均德的两个兄弟也阵亡了——之后，他们转向西。^138 李、高队伍在汉江北岸来回穿梭，时分时合，初夏时分逼近栈道；一些起事者甚至窜入甘肃。甘肃第一次动员起来，对付境内之贼。^139\n五月二十三日，乾隆责成明亮与德楞泰（额勒登保已派往湖北）在十天内肃清陕西的全部叛军，随后前往四川。^140 叛军突入甘肃不逞、再次分成小队之后，明亮与德楞泰也分了手。德楞泰此后与李、高队伍的主力作战，一路追到四川广元。明亮则留在陕西，搜剿当地四散的叛军。^141 尽管乾隆一再催促明亮了结陕西战事、前往四川，明亮却放慢了脚步。在勉县城，他休整了五天，把士兵散在城中，惹得当地居民怨声载道。^142 显然，明亮不愿去四川与勒保共事。据他所说，第二次金川之役中，他做过勒保之父温福的副手，如今却要受旧同僚之子的节制，实在丢脸——尽管勒保只比他小几岁。^143 明亮与永保的宿怨可能也是另一个因素。既然姚、王残部已经溃散，另一支襄阳队伍进入陕西，就给明亮留在陕西提供了充足的理由。\n这支队伍由张汉潮率领。张汉潮年过七旬，本是襄阳的教门师父，起事开始后成为\"元帅\"之一。1797年张汉潮没有随姚、王离开四川去湖北，但他在四川的行踪难以查考。1798年早春，张汉潮率约一万名叛军，沿姚、王所走路线长途跋涉来到湖北。在湖北巴东，张汉潮的队伍有时以分遣队出击，蹂躏了归州、兴山、东湖、远安、当阳与荆门，把湖北西部再次拖入动荡。叛军不断招募并裹挟当地人，据清朝记载，其人数一度膨胀到三万。汪新与景安——张汉潮突入湖北时，景安被任命为湖广总督——手忙脚乱地搜罗军队保卫各自辖区。他们还向勒保求援，因为四川竟没有一支清军追击张汉潮，令他们大为不安。乾隆一面再次批评勒保把叛军赶入他人辖区，一面命额勒登保与兴肇前往湖北。^144\n与姚之富、王聪儿一样，张汉潮也谋求渡汉江入豫。四月，张汉潮的队伍抵达汉江西岸的宜城，但夺取该城的图谋被景安挫败。随后张汉潮沿江南下。景安率两千名士兵，使张汉潮无法靠近江边，屡次把他从荆门州城击退，并阻止他攻打当阳与荆州，迫使他折返北上。四月下旬到达襄阳的额勒登保与兴肇与景安会合后，五月初在南漳几番交锋，击溃了张汉潮的队伍。然而张汉潮仍企图渡江；被赶到谷城时，他夺取了许多船只。直到张村棚再遭一场惨败——数千人被杀——张汉潮的队伍才于五月下旬分成数股向西逃往陕西；途中数千名被裹挟的村民逃散。^145\n六月十二日，张汉潮及其不下万人的队伍进入陕西平利。明亮立即移师那里，与额勒登保会合对付张汉潮。在陕南无法再进一步，张汉潮于夏末转而南下四川太平。为了在多山的太平快速移动，叛军抛弃了马匹骡子，甚至杀死了部分妇孺。^146 由于额勒登保留在太平养病，明亮接手作战，夏末把张汉潮赶回了陕西。尽管明亮奏报说，在川陕通江边境的一场战斗中杀死叛军数千人，其中包括李槐与詹世爵两位大头目，乾隆却既无褒扬也无赏赐——这与大约同时他对勒保俘获王三槐的欢欣反应形成鲜明对照（见下文）。^147\n此后数月中，明亮不再果断打击敌人，更不用说消灭敌人了——尽管张汉潮已陷入绝望，精力也因年迈而衰退，让几个年轻首领替他带队。^148 张汉潮在陕川之间往返、在汉江以南穿梭，寻找渡江之机，明亮则紧随其后，确保不让他渡过汉江或返回湖北（有一次，张汉潮又从大宁逼近湖北巴东）。^149 八月下旬，乾隆再次摘去明亮的翎羽顶戴，但这一次没有奏效。^150\n十一月初四日，趁明亮正与一些从四川渗入陕西的叛军作战，张汉潮率其队伍——只剩几千人，其中能战者不过千人——在城固渡过了汉江。渡江之后，张汉潮的队伍奔向秦岭，朝豫陕边境移动。1799年初，张汉潮突入河南。攻打卢氏县城不下，张汉潮前往内乡、镇平，再到南召、嵩县、鲁山。1799年新年前夕，他折向南，到了南阳。人手所剩无几，张汉潮不敢再攻打城镇，而是坐着竹椅在山中游走。受到明亮与地方军队的截击，张汉潮无法突入湖北，于除夕返回陕西。^151 尽管张汉潮突入河南的两个月是一段危机时期，明亮却并不着急；他远远地跟着敌人，无意逼得太紧。正如明亮后来向一位同僚官员坦承的，他有意拖延消灭张汉潮一伙，为的是不必去四川向勒保报到。鄙视勒保的明亮，不服从他的指示，也不向他奏报战况。^152 而追逐张汉潮跨越一省又一省，又给了明亮从不止一个省报销经费的机会——换言之，两头吃钱。\n勒保的拖延战术\n明亮的拖延并非个例。事实上，1798年见证了朝廷与其前线将领之间一场漫长的拉锯谈判的开始——谈判的主题是战争何时可以结束。随着冲突的中心移向川东，统帅勒保成了这场拉锯中的关键人物。在他主持之下，进展微薄而缓慢，而四川战场的军费开支则超过了陕西与湖北，在1797与1798年消耗了军费的大头。起初，乾隆最感懊恼的是大宁老木园之战——对手是陈崇德领导的万余名叛军。自1797年夏天起，观成与刘君辅攻其堡寨数月不下，尽管到1798年初叛军已减至几千人，给养也已耗尽——据说他们不得不吃野草。^153 乾隆一再批评二将，三月把两人都革了职，但责令他们留任，完成围困。^154 观成与刘君辅最终于四月下旬攻破那些堡寨时，却没能抓住陈崇德——陈崇德率最后的人马滚下悬崖，十天后在大宁北境被乡勇伏击歼灭。^155 类似的一幕也发生在开县开州坪——1798年初林亮功撤离临江市后在此筑垒山顶，但六十七与福森布主持的围困也数月无功。直到勒保请求将二将革职一个月后，他们才于盛夏攻占了这处据点。林亮功却逃走了。^156\n川东的其他军事行动同样不容乐观。1797年秋攻打营山县城不克之后，罗其清的白号留在营山，据守一处山头。1798年春末，其他叛军股团回到了营山。冉文俦的蓝号在罗其清据点附近扎营，王三槐与徐天德则继续东移。不久，惠龄与恒瑞攻破了罗、冉两处堡寨。但罗其清转移到营山境内另一座山——箕山——筑垒，冉文俦则据守邻县渠县的大神山。^157 与此同时，王三槐、徐天德与樊人杰在渠县、垫江与达州之间穿梭。他们试图攻取达州城西南的大竹县，没有成功。初夏在梁山与勒保遭遇之后，徐天德与樊人杰转而南下丰都，王三槐则北上开县与新宁。^158 勒保把对付徐天德的任务交给接替观成的新任成都将军富成，自己则亲率人马追剿王三槐。\n乾隆对四川战役以及对勒保的不耐烦与日俱增。他常说，读到勒保定期送来的冗长而详尽的奏折时\"甚为不悦\"——勒保在奏折中汇总下属的报告，给出叛军被杀伤的数目，动辄成百上千，却总是随时准备强调：他只能一股一股地肃清叛军。每次他许诺很快肃清全部叛军，都会强调横在面前的困难，或者奏报说又突然冒出一股新叛军，他不得不先对付他们，而不是与那些\"既定\"的股团作战。^159 乾隆一再\"严旨申饬\"勒保，面对这个狡猾的统帅，他似乎束手无策。六月陕西肃清叛军后——襄阳起事者残部被赶到了四川或湖北——乾隆设定了七月底结束整个战役的最后期限。^160\n这个期限很快就被打乱了。先是襄阳叛军返回陕西。随后，夏末，高均德与李述前往四川，与大神山的冉文俦会合。^161 对一直追击这一股的德楞泰大为光火，乾隆褫夺了他除副都统之外的一切职衔。但贬黜没有刺激德楞泰；大神山的围困没有迅速推进。^162 六月王三槐到达云阳后，在四面悬崖的安乐坪山顶筑寨，并派副手冷天禄到附近的祖师观另筑一处据点，与己呼应。^163 叛军重拾山顶战术、掘壕自守，数万清军再次陷入他们惯常的松垮围困。乾隆加大压力，批评勒保近半年来未能抓获任何叛军首领、肃清任何股团，只会用空话搪塞拖延，并威胁要罢免勒保的统帅之职。八月初一日，乾隆又设了一个新期限：八月底之前了结所有叛军股团。^164\n为安抚皇帝、争取更多时间，勒保不得不拿出点重大战果。事实上，他手里有一张牌。王三槐看不到继续叛乱的前途，到达安乐坪后，开始与清方谈判投降。王三槐曾试图说服冷天禄与他一同投降，冷天禄拒绝了。勒保派刘清——一位在川东百姓中口碑很好、据说连叛军也信任的地方官——多次进入王三槐的据点与他会面。^165 然而，勒保在奏折中没有透露他与王三槐的往来。相反，他继续详细奏报对王三槐据点的进攻，给人一种他的部下正在全力攻取叛军堡寨的印象。^166\n七月下旬，在勒保确保其人身安全之后，王三槐前往勒保大营投降，手中还挟持着勒保派来的一名乡绅作人质。勒保立即逮捕了王三槐及随他前来的三百多名起事者。然而，在奏报俘获王三槐的奏折中，勒保说的是：他对王三槐的堡寨发动了强攻，同时派一支人马在祖师观牵制冷天禄；又担心王三槐战死或自杀，便让一位名叫刘星渠的乡绅通知叛军：无论首领还是部众，只要投降就给他们一条生路。据勒保说，正是这时，王三槐及其部众来到勒保大营，弃械跪降。然而，勒保并不信守诺言，下令把投降的三百六十七名叛军全部斩首。^167 与福宁在来凤屠杀投降叛军一样，这一事件将在此后数年间阻止其他叛军投降。\n勒保的奏折于八月初九日到达北京时，乾隆与嘉庆两位皇帝正在避暑山庄接见蒙古王公。乾隆对王三槐被擒以及好消息的时机都极为满意——他可以当面向蒙古贵宾炫耀——于是对勒保大加赞许，赏赐无数，与他对明亮、德楞泰歼灭姚之富、王聪儿之后的反应形成鲜明对照。为庆祝这场\"大捷\"而颁发了许多道谕旨。其中一道以已退位的乾隆皇帝——\"太上皇帝\"——的名义颁发，乾隆在此谕中授予勒保最高爵位一等公，还赏赐了军机大臣们——其中和珅与福长安因襄赞拟旨之功获得爵位。^168 这是乾隆退位后少数几次以自己名义颁旨的场合之一——他发号施令时通常假借嘉庆之名。随后乾隆又赦免了永保，允许永保的两个儿子从热河回京，到上驷院当差。^169 然而，这是乾隆漫长一生中最后的一次欢庆。\n这场\"大捷\"之后，乾隆催促勒保及其他将领迅速结束战役。在他看来，冷天禄的数千人已经是四川最后一支大股叛军，王三槐一伙的覆灭应当已经瓦解了他们的士气。他命勒保一旦了结冷天禄一股，就赶去增援明亮。^170 然而，对勒保而言，王三槐的覆灭给了他同朝廷讨价还价的筹码；不把这份功劳全部变现，他不会了结冷天禄。八月下旬，勒保举荐了一批下属升迁，并请求把刚刚获释出狱的永保派到前线，让他在勒保的\"指教\"下将功折罪。勒保说，永保正当盛年，\"身强力壮\"，若闲置在家，他会于心\"不安\"。由于永保不会在没有任何职衔的情况下重返战争，勒保的请求不过是为永保讨一个位置——永保获赦时没有得到任何任命。然而，对勒保围困冷天禄的松松垮垮日益不耐烦的乾隆，驳回了这个提议。^171 毫不意外，祖师观的围困将持续数月。\n与此同时，对罗其清与冉文俦的围困也进展缓慢。直到七月中旬，清军才摧毁大神山的堡寨。冉文俦、李述与高均德率众投奔罗其清在箕山的堡寨避难。然而，由于与冉文俦的冲突，罗其清拒绝接纳他们。于是，冉文俦在罗其清堡寨附近扎营，襄阳起事者则前往陕西，额勒登保尾追而去。^172 不久，在忠州、重庆、顺庆一带游走的徐天德与樊人杰到达营山，在罗、冉附近扎营。清军集中力量先进攻徐、樊队伍，迫使他们撤离。八月下旬，徐天德与樊人杰又回来了。他们先是在罗、冉据点附近扎营，遭到攻击后放弃了自己的堡寨，与罗其清会合于箕山。^173\n四川与湖北大多数残存叛军会聚箕山——总数或许有三万——这可能是有人刻意安排的。零星的证据显示，这个计划的策划者可能是王廷诏——姚之富与王聪儿死后，他似乎成了叛乱的主心骨。王廷诏自己不再独立带队，由数百名\n起事者随行，在各股之间穿梭，试图协调起事者之间的统一行动。随徐天德一股到达罗其清据点后，王廷诏向罗其清展示了几部教门经卷与画像，令后者肃然起敬。王廷诏甚至弄出一个操江南口音、名叫\"刘冷\"的人，把他引见给各位叛军首领，称其为本教最尊的教主，地位比刘之协还高。这位\"刘冷\"随后给叛军首领们封官许愿。^174 极有可能，王廷诏是在设法复兴叛乱：制造一个傀儡领袖，取代刘之协——刘之协的缺席一直损害着这项事业。神秘的是，\"刘冷\"在叛乱此后的岁月里再也没有露过面。\n箕山之围直到额勒登保把高均德与李述赶回箕山、加入围困之后才到达临界点——高、李返回箕山很可能也是事先安排的。清军发动总攻，据说杀死数千人，起事者于十月初弃守堡寨。高均德与王廷诏逃走了。冉文俦率蓝号余部前往通江。罗其清及其数千幸存追随者转移到营山境内另一座山上，强占了山顶上当地居民的堡寨与给养，但很快被镇压者围住。1798年底（十一月初），给养耗尽，罗其清率数千名追随者趁夜冲击清军营垒突围，尽管伤亡数千——包括罗其清的父亲。他们转移到附近另一座山，但这次堡寨没能守多久，十一月下旬就被额勒登保与德楞泰击破。数日后，十二月初二日（1799年1月7日），罗其清与几名亲属在一个山洞里被擒。^175 在这一连串击破叛军据点的战斗中，额勒登保的部队功劳最大。他麾下的一位军官——四川人、副将杨遇春——开始崭露头角，显示出干练之才。罗其清一股覆灭后，他最终晋升总兵。他此前在湖北西南部对林之华、覃加耀一股作战中的贡献，并不总得到承认；额勒登保奏请奖赏升迁时，通常优先满洲军官，而冷落他们的汉人同侪。\n几股叛军在箕山的会聚令乾隆警觉。他一再命令勒保亲自前往箕山，把对冷天禄的围困交给别人。但勒保辩称，自己离开会削弱对冷天禄的压力，而箕山已经兵将充足。^176 愤怒而沮丧的乾隆一次又一次地斥责勒保，指责他\"一味因循\"，\"拥兵养寇\"。他威胁要褫夺勒保刚刚获得的一等公爵位以及承袭自祖父的世爵。^177 然而勒保不为所动，继续按自己的方式打仗。他定期奏报毫无亮点的进展，间隔越来越长，而且总是强调他遇到的困难，包括秋雨与浓雾。最终，给养耗尽，冷天禄与其人马于十二月二十一日突围，北上开县与东乡。尽管勒保把他们的脱逃当作一场胜利来奏报，他的奏折到达北京时，乾隆已经去世数日。^178\n回到家乡通江，冉文俦及其残部——据说有一万人——在麻坝寨的山顶掘壕自守；麻坝寨一面悬崖，其余各面只有险径可通山顶。冬季气候严寒，进攻者进展迟缓。但起事者缺粮，冉文俦不得不派出小队到附近市镇劫掠。俘获罗其清之后，德楞泰与惠龄北上麻坝寨，额勒登保则南下攻打徐天德。十二月三十日，除夕前夜，清军伏击了叛军外出觅粮的小队。随后，在元旦凌晨，他们发动全面攻势，用火弹纵火焚烧堡寨。许多叛军被烧死或杀死，一些人滚下悬崖，一千多名起事者及其家属被俘，其中包括身负重伤的冉文俦——他随后被凌迟处死。^179 然而，冉文俦的许多部下脱了身，其中有他的侄儿冉天元——一员猛将。^180\n显然，德楞泰与惠龄在这场战斗中并不打算把冉文俦的人马一网打尽。事实上，乾隆的新赏功政策也起了作用。乾隆意识到，像战争头两年那样按杀贼数目行赏，会诱使将领们夸大或捏造杀贼数字，或者滥杀被叛军裹挟的平民以邀功，于是把擒获或杀死叛军首领作为新的受赏标准。将领们于是相应地改变了策略。新的套路是——正如嘉庆皇帝后来所说——\"只擒贼首一人，而纵其余贼众逃逸\"。^181 此后，被击败的起事者很快就会重新集结，产生新的首领，这又给军队提供了新的邀功机会。确实，从1798年底起，朝廷听到的叛军首领新名字越来越多。\n1798年四川的围城战——有些延续到1799年初——是这场漫长战争中最后一批此类作战。没能守住所有据点，幸存的起事者再次放弃了山顶战术——这次是永远——此后主要依靠运动战与游击战。从箕山突围后，徐天德与樊人杰率领他们那股堪称四川战场最强的队伍，在达州与重庆之间流窜。^182 1798年底，樊人杰与徐天德分手，率一大队人马前往陕西，再次试图北渡汉江。起事者在川陕之间不停的移动，使汉江谷地始终处于高度戒备。^183 另一支襄阳队伍——王光祖所率——自1798年底起把重庆城当作目标。它在城郊游走，还不止一次突入与重庆隔嘉陵江相望的江北县境。^184 攻不下这座大城，王光祖转而向长江以北的东北方移动，但他的一支分遣队已在1799年初徐天德到达嘉陵江东岸时加入了徐天德。徐天德在定远渡江的尝试被挫败，叛军被地方乡勇击退。然而，他们前往川西的意图——起事者还从未深入过川西——令清方警觉；勒保急忙派额勒登保赶赴嘉陵江下游河谷对付徐天德，自己却留在大州以南地区，继续对冷天禄作徒劳的追击。^185\n姚之富与王聪儿已死数月、王三槐已被擒，叛乱却依然存活。急于看到最后胜利的乾隆设下一个又一个期限，全部落空。即便已年过八旬，退位的乾隆皇帝仍表现出惊人的精力与清醒。^186 他批阅前线送来的所有奏折，为行动的每一步发号施令，三年来一直是战役的掌舵人。他累计着叛军被杀被俘的数目，把奏折中的信息与呈进的地图一一核对。^187 他迅速指出可疑的信息、矛盾之处与荒谬之点，并为此无情地讥讽众将。^188 他深知将领们并未全力作战，也不接受他们惯用的地形阻碍、天时不利、兵力不足等借口。相反，他把这场战役描绘成这个样子：将领们聚集精兵以自保，挥霍军费以自肥；他们行动迟缓，落在叛军后面；叛军行动迅捷，善于跋山涉水，而清军被山岭拖慢，一到河边——哪怕水很浅——就得等船；作战时，清军先放几轮枪炮，然后就用乡勇去与叛军接仗；叛军占优时，清军拔腿就逃，避开苦战；将领们瞒报自己的伤亡，却夸大叛军被杀的数目——而许多被杀被俘者，其实是被裹挟的平民，包括老人、妇女、儿童与残疾人。^189\n乾隆并非看不到战役的可悲状况。然而，他似乎没有扭转局面的手段。他常常听任自己被前线将领们牵着走，轻易改变决定。更严重的是，他不愿对那些行为理应受到惩处的将领采取强硬行动。除了再三\"严旨申饬\"，他什么也不做——尽管他清楚地知道自己的批评没有效果。生命的最后几个月里，八十七岁的乾隆已不如从前那样精力充沛。^190 他仍不肯把大权交给儿子，在前线奏折上写的批语越来越短、越来越少。有时，焦虑与沮丧流露在他写下的\"盼\"（pan）字上，或者更沉痛的\"切盼\"（qiepan）二字上。他盼望的当然是胜利。随着嘉庆三年年末（1799年2月4日）临近，他向勒保表达了日益加深的绝望与愤怒：\n\n现在已是十一月中旬。朕望捷音日益迫切。而各路竟未肃清一股贼匪。若仍如此因循，恬不知耻，不能同心协力，于年内了结所办之事，则尔等真无心肝，罪无可逭。^191\n[译者按：原上谕自英文直译，文言原文待核，见注释191。]\n\n两周之后，乾隆再次斥责勒保：\n\n勒保统率大兵，围困穷蹙之贼已历数月，而毫无进展，因循怠玩，是何居心？若自知不能办，即当据实陈明。乃迁延日久，徒致师老兵疲。静夜自问，天良安在？^192\n[译者按：原上谕自英文直译，文言原文待核，见注释192。]\n\n诉诸良心似乎不奏效。十二月二十八日，新年前三天，接到勒保又一份没有好消息的奏报，乾隆\"深为失望\"\"实为愤懑\"。他再次斥责勒保\"不可信\"——他只会空口许诺，数月毫无建树。然而，他能做的，只是再次给勒保与明亮\"严旨申饬\"——这也是最后一次。^193\n注释\n[译者按：文献简称同第1章。]\n题辞：XFFL, 84/25a.\n\nGZDJQ, 1815, 1831.\nXFFL, 26/29b–34a, 27/10b–14b, 30/32a–b.\nXFFL, 26/21b–22b, 26/34a–36a, 27/14, 30/32a–35a.\n景安获赏伯爵爵位与双眼花翎。XFFL, 28/24b–27b, 28/36b, 28/37b.\n张世虎供词，BLJZL, 5:154.\nXFFL, 28/9a–b.\n罗威廉（Rowe）《腥风血雨》（Crimson Rain），198–99。\nXFFL, 31/4b–5a, 34/12a–13a; Xu Zengzhong, \"Shilun pingjia Wang Conger.\"\n恒瑞、硕云保与富成追击姚之富一路；景安与王文雄尾随王廷诏一路；庆成与巴克坦布追李述一路。XFFL, 33/5a–b. 关于叛军在河南的运动，见XFFL, 31/12b–16a, 32/5a–7a, 33/29a–32b, 34/9b.\nXFFL, 141/1a–2b.\nXFFL, 25/1a–5a, 26/12a–18a, 26/20a–21b.\n清朝文献记载，会合后的襄阳队伍有四千人，商南又有五六千名当地教众加入。XFFL, 35/2a.\nXFFL, 34/36a–37b, 35/2b, 35/4a–b, 35/6a–9b, 36/22a–24b.\n这一路先北上，随后折向西南前往淅川。XFFL, 34/6b–8a, 34/12a–13a.\nXFFL, 35/15b.\n清朝文献估计，共有一万人在陕南加入了襄阳叛军。XFFL, 35/32b–33b, 36/2a, 36/12b, 36/13a–b, 36/16b, 37/17a–b, 39/20b–21b.\n高均德供词，BLJZL, 5:83.\nXFFL, 33/33a–34b.\nXFFL, 36/8b–10a.\nXFFL, 34/28a–30a, 34/32a–34b. 不久，乾隆再次斥责众将总是迟缓误事，听任敌军任意来去。XFFL, 35/12b–13a.\nXFFL, 35/16b–19a. 宋澍是巡视中城的监察御史。\nXFFL, 35/20a–21a.\nXFFL, 36/29a.\nXFFL, 38/10a–17a.\nGZDJQ, 2290, 2475; BLJZL, 1:258–59.\nXFFL, 39/19a. 撒拉族是逊尼派穆斯林，元代迁居甘肃。与藏人等他族通婚，到明代中期人口达一万。雍正年间，他们的两位头人纳入清朝行政体系，但保留了自己的士兵。《循化厅志》（Xunhua tingzhi）5/28–38。\nXFFL, 38/44a–45a.\nXFFL, 卷38–40 各处, 43/8a–9b; BLJZL, 1:258–61, 263–65.\nXFFL, 39/27a–32b, 40/6b–9a.\nGZDJQ, 2564; XFFL, 40/6a–8a, 42/1a–3a, 43/1a–3a; 《大宁县志》（Daning xianzhi）5/7b–8b。\nGZDJQ, 2597; XFFL, 41/14a–15a.\nXFFL, 41/27b–28b.\n宜绵派川北镇总兵朱射斗率两千名士兵前往太平，并命翘首以盼的撒拉族士兵开赴太平——他们分批到达西乡时，叛军已全部渡过汉江。GZDJQ, 2563; XF 5a.\nXFFL, 62/26a–31b, 63/12b–13a.\nXFFL, 62/31b–33a. 宜绵率一千名陕西兵把后勤事务全部移交福宁后，于嘉庆三年二月初七日离开达州。XFFL, 64/28b–29b, 65/38a–b.\nXFFL, 54/36a–b, 59/37b.\n但乾隆命二人都留在前线，降为兵丁，并抄没家产。XFFL, 63/24a–25a, 63/31b–32a, 63/33b–34a.\nXFFL, 66/29b–37b, 67/18a–23b.\nXFFL, 65/24b–29a, 66/37b–39a, 66/41a, 66/43a, 68/32b–33b.\nXFFL, 65/8a–11a.\nXFFL, 67/39b.\nXFFL, 69/22b.\nXFFL, 34/25a–28a, 38/6a–10a.\nXFFL, 卷42–44 各处。\nXFFL, 卷45、48、49 各处。\nXFFL, 卷50、52–54 各处。\nXFFL, 59/5b–8b.\nXFFL, 61/27b–28b.\nXFFL, 卷55–59 各处。福宁被褫夺宫衔与翎羽顶戴。额勒登保的二等伯爵被降为三等，翎羽顶戴也被降格。XFFL, 61/29b–30a.\nXFFL, 61/15a–18a, 61/25b–27b.\n覃加耀与张正朝被押送北京，凌迟处死。其余俘虏全部被额勒登保的部队屠杀。XFFL, 62/1a–4b.\nXFFL, 44/19b–24a, 44/34b–35a, 62/4b–8a.\nXFFL, 45/4b–6a, 45/8a–9b, 47/22b–25b.\nXFFL, 44/10a–11a, 45/15a–b, 46/2a–b.\nXFFL, 45/10b, 47/1a–4b, 47/9b.\n吉林旗兵于嘉庆二年九月初三日全部到达襄阳。XFFL, 50/10a.\n他们的人数已减到大概一万一千至一万三千。XFFL, 32b–33b, 卷45–47与48 各处, 54/14b–15a.\nXFFL, 50/4a–9b.\nXFFL, 49/4a–11a.\n惠伦的遗体被送回北京。乾隆赏银三千两治丧，并让其子承袭公爵。XFFL, 50/18a–b. 惠伦是明瑞的亲侄，因明瑞无子而过继。关于明瑞之死，见Dai, \"Disguised Defeat,\" 158–60。\n只有保康、房县、竹山、竹溪等少数县份与兴山、远安、南漳等少数城市遭受严重破坏。XFFL, 51/21a–25a, 52/14b–16b.\n增援汉中的兵力包括恒瑞、庆成率领的四千名士兵，以及英善从四川带来的两千名士兵。英善还从甘肃调来一千名士兵。XFFL, 卷50、53 各处, 及54/14b–15a.\nXFFL, 54/4b–6a, 54/7b–8a.\nXFFL, 52/7b–11a 及卷54 各处。\nXFFL, 56/5a–10a, 56/16b–20a, 57/12b–13a.\nXFFL, 57/6b, 57/6b–12a, 58/15a–16b, 64/13b.\n高均德三十五六岁，出身襄阳教门世家。嘉庆元年三月初十日，他因在家中窝藏一名教门师父而被捕。1796年六月，永保派高均德前往襄阳叛军中，劝其叔父高成杰投降。但高均德选择留在叛军一边。XFFL, 182/26a–27b; 高均德供词，BLJZL, 5:82–89.\nXFFL, 卷58–59 各处, 60/1a–3b.\n其中包括驻宁羌的五百名山西兵、驻勉县的三百名荆州驻防满洲兵、另五百名荆州满洲兵以及汉中当地士兵与乡勇，还有柯藩与爱星阿沿江及川陕边境巡逻的四千名士兵。明亮还请求惠龄从太平前往西乡。XFFL, 60/21b–24a.\nXFFL, 60/26a–32b.\nXFFL, 61/1a–6a, 61/12a–13b.\nXFFL, 60/24b, 61/1a–2b.\nXFFL, 卷60–62 各处, 64/8b–15.\n嘉庆三年正月十四日，乾隆接到景安奏报：另一股五六千人的叛军——包括数百名骑马妇女——在南郑渡过汉江。XFFL, 60/26a–30a. 随后秦承恩又奏报，叛军后队于正月二十七日在石泉渡江。XFFL, 64/1a–2a.\nXFFL, 64/19b–23a, 64/33b–34b, 65/21a–22a.\n柯藩被摘去顶戴，降为署理提督，还有其他处分。XFFL, 62/14b–16a, 64/12b, 64/27b–28b.\nXFFL, 65/16b–20a, 卷66 各处, 67/1a–3b.\nXFFL, 卷64–65 各处。\n额勒登保先奉命入川，到达川东后又改派陕西。XFFL, 64/18a–19b, 64/29b–30a, 65/31b–33a.\nXFFL, 61/21b–22a, 61/24b–25a.\nXFFL, 66/9a–11b, 66/15a–18b.\n王聪儿之所以被认出，还因为她的头发不长（1794年避居尼庵时削了发），且身着绣衣、戴金耳环。姚、王二人的首级被割下，先悬于襄阳示众，再悬于途经的川陕各地，最后解送北京；尸体则被碎割。GZDJQ, 3786; BLJZL, 1:323–37; XFFL, 67/9a–15b, 175/12b–13a; McCaffrey, \"Living through Rebellion,\" 202–12.\nXFFL, 67/16a–18a, 67/41b.\nXFFL, 67/25a–b.\nXFFL, 67/30b–35a, 68/18a–21b, 69/1a–3b, 71/24b–27b; GZDJQ, 3895.\nXFFL, 71/1a–5b, 72/13a–16b, 72/27a–28b.\nXFFL, 72/20a.\nXFFL, 73/1a–52, 73/9a, 73/10a–11b, 73/34b–38b.\n1799年九月魁伦路过此地时向朝廷奏报了此事。XFFL, 124/6a–b.\nXFFL, 124/6b–7a.\nXFFL, 66/41b–42b, 67/27b–29a, 68/1b–5b, 68/22a–23b, 69/8b–13b; GZDJQ, 3923.\nXFFL, 卷70–73 各处。\nXFFL, 74/20b–22b, 74/26b–29a, 75/8a–11a, 75/13a–15a; GZDJQ, 4055.\nGZDJQ, 4081, 4125.\n张汉潮想到自己可能再也回不了襄阳，一度潸然泪下，试图上吊，被部下劝阻。XFFL, 83/12a; 李潮供词，BLJZL, 5:80.\nXFFL, 卷77–79 各处及卷82; 《大宁县志》（Daning xianzhi）5/9b. 秋天，额勒登保曾短暂与明亮会合，随后前往广元对付高均德。XFFL, 79/12b–14a.\nXFFL, 78/16b–17a.\nXFFL, 卷85–86 各处。\nXFFL, 115/40a–b, 124/6b–7a.\nXFFL, 60/35a–38b, 70/24b–27b.\nXFFL, 57/26b–31b, 59/5a, 66/26a–b, 68/15b–16a; 《大宁县志》（Daning xianzhi）5/7b–9a.\nXFFL, 72/32b–36a.\nXFFL, 73/15b–16a, 73/24b–25a, 74/9a–11a. 林亮功此后的下落一直不明。但勒保把他列为1796年底病故。勒保《平定教匪纪略》（Pingding jiaofei），56b。\nXFFL, 73/5a–8b; 罗其清供词，BLJZL, 5:74; 王三槐供词，第66–67页。\nXFFL, 72/29a–32b.\nXFFL, 71/16b–20b, 73/22b, 75/1a–5a.\nXFFL, 73/18a–19a, 74/7b–16a.\n高均德供词，BLJZL, 5:83; 李槐供词，第79页。\nXFFL, 74/3b–5a, 74/30b–35b, 75/24b, 76/30a–35b.\n王三槐供词，BLJZL, 5:67, 71.\nXFFL, 74/23b–26b, 75/32b–35a, 76/6b–8a, 77/1a–2b.\n战争爆发时刘清是南充知县，1798年初经乾隆提议升任知府。XFFL, 68/15b–16a, 71/21b–22b, 71/24b. 显然，勒保把刘清纳入了自己的羽翼之下。\nXFFL, 76/14a–18b, 76/21b–22a, 76/23b–24a. 勒保在自撰纪略中声称自己\"生擒王三槐\"。勒保《平定教匪纪略》（Pingding jiaofei），19b。\n勒保，嘉庆三年七月二十五日，BLJZL, 1:348–49; XFFL, 77/23b–26b. 勒保，嘉庆三年八月初六日，BLJZL, 1:356.\nQLQJZ, 42:530–31.\nXFFL, 77/30a–b.\nXFFL, 77/30b–32a.\nXFFL, 79/26a, 79/30a–b.\nXFFL, 77/15b–21b.\nXFFL, 78/6b–7a, 78/18a–25b, 79/14a–20a.\n高均德供词，BLJZL, 5:85–89.\nXFFL, 卷81–86 各处。\nXFFL, 78/29b–30a, 80/1a–b, 81/9a–11a.\nXFFL, 80/17a–b.\nXFFL, 78/3b–7a, 79/5a–9a, 79/22a–24b, 82/1a–4b, 84/13b–14b, 87/19a–22a, 94/20a.\nXFFL, 86/24b–26b, 87/1a–5a, 87/25b–30b.\n1799年二月，数千名叛军试图从四川突入宁羌。嘉庆认为他们是冉文俦的残部。XFFL, 91/20b–21a. 同年晚些时候，嘉庆又说，惠龄没有全歼冉文俦一股，只擒其首领邀功。XFFL, 106/14a–b.\nXFFL, 90/15a–b.\nXFFL, 83/5a.\nXFFL, 卷82–86 各处。\nXFFL, 79/8a–9a, 79/24a–b, 82/4b–6b.\nXFFL, 卷84–86 各处。\n正如他嘉庆三年八月初九日所说：\"朕自前年授玺以来，训政未嘗暇逸。邪匪歷年未靖，朕宵旰焦勞。幸精神尚健，凡軍營事宜，隨時指示。\"（原文待核）XFFL, 77/28b. 又见XFFL, 87/10a–11a.\n1796年底，乾隆对成德呈进的黄柏山地图表示不满，责令他重绘，并附彩色签条说明图上的信息。XFFL, 20/32a–b.\n例如，乾隆质问：1796年春的一场战斗中，柯藩及其一百名士兵怎么可能杀死四百多名起事者、俘获数十名。XFFL, 6/8a–9b, 6/11b–12a. 1798年初，他对观成\"老木园叛军已至人相食、吃树皮草根\"的说法提出质疑，问这些东西怎么可能支撑他们这么久。XFFL, 60/39a–b. 他曾纳闷：叛军——包括妇女——都能行走自如的道路，部队为何走不了。XFFL, 60/9a. 1798年秋，他讥讽惠龄以雨为借口解释箕山进展迟缓，问叛军为什么不受雨阻。XFFL, 80/6b. 又见XFFL, 18/22a–b, 36/39b–43a, 37/1a–3a.\nXFFL, 52/20b, 60/32a, 65/11b–12, 67/2a.\n嘉庆后来承认，乾隆的精神状态自1798年底急剧恶化，无法再像从前那样细心指挥战役。XFFLXB, 352/7b–8a.\nXFFL, 83/10a–b.\nXFFL, 84/25a.\nXFFL, 86/34a–35a.\n", "sections": [{"level": 2, "title": "襄阳叛军的长征入川", "id": "ch2-s0"}, {"level": 2, "title": "勒保出任统帅", "id": "ch2-s1"}, {"level": 2, "title": "湖北叛乱的终结", "id": "ch2-s2"}, {"level": 3, "title": "长阳起事的终结", "id": "ch2-s3"}, {"level": 3, "title": "姚、王队伍的覆灭", "id": "ch2-s4"}, {"level": 3, "title": "明亮放慢脚步", "id": "ch2-s5"}, {"level": 3, "title": "勒保的拖延战术", "id": "ch2-s6"}, {"level": 2, "title": "注释", "id": "ch2-s7"}]}, {"id": "c3", "title": "第3章 · 改革，1799年", "kicker": null, "part": "第一卷 · 叙事", "html": "<blockquote>\n<p>勒保自任统帅以来，一无布置。朕自愧知人不明，以之命为经略大臣。当引以为戒，以免再蹈覆辙。</p>\n<p>——嘉庆皇帝，1799年</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释（章首题辞，XFFL, 108/40a）。]</p>\n</blockquote>\n<p>结果，战役未能打破僵局。与父亲在位时一样，嘉庆结束战争的期限随着这一年的推进被一次次错过。</p>\n<h2>清除和珅</h2>\n<p>正月初三日——新年后两天——乾隆颁下他一生中最后一道上谕，再次表达他渴望看到镇压叛乱之役的最后胜利，同时以\"大军数日内即可奏凯\"的想法安慰自己。^1 他于当天晚些时候驾崩。乾隆之死解除了儿子嘉庆的束缚——他立即亲揽大政，得以施行自己的政策。然而，要确立自己作为新君、从而成为镇压战争中最高权威的地位，嘉庆首先必须面对和珅——和珅从未对嘉庆表示应有的尊敬，许多高级官员对和珅的敬畏更甚于对年轻皇帝的敬畏，以至于一位总督在乾隆驾崩后竟把唁慰送给了和珅，而不是嘉庆。^2 在前线，卷入战争管理事务的许多人也都把和珅当作靠山与保护人。</p>\n<p>乾隆驾崩当天，嘉庆忙于繁重的丧仪。在他所颁的众多谕旨中，他只能简短地告诫前线全体将领：顾念乾隆皇帝的恩宠、信任与训示，振作精神，迅速剿灭叛军。^3 然而，次日，嘉庆向勒保、惠龄、恒瑞、富成、宜绵、景安、秦承恩、倭什布（景安的河南巡抚继任者）、额勒登保、明亮与德楞泰颁发了一道措辞严厉的上谕——这可以说是他能够自由表达自己意见与感受的第一份文件。^4 嘉庆倾泻积压已久的愤怒与沮丧，痛斥文武官员把战役变成了升官发财的阶梯，侵吞军费，以谎报胜仗欺骗朝廷，讳败为胜。他斩钉截铁、毫不宽宥地指出，\"无耻\"\"自私\"的将领们故意拖延战役的结束，其原因是谋利。嘉庆还指责京中那些寻求机会奔赴前线的官员胥吏借战役谋利。他说，那些回来的人无不立刻发了财——哪怕是原先家资微薄之人——而且常常请假回乡置产。接着，嘉庆责备父亲乾隆晚年对将领们过于宽纵：小有战功便常常给赏，失职却只给轻微的或象征性的处分——连这点轻处分也很快撤销。嘉庆愤怒地指出，许多将领罪责相当、甚至更重，却只有永保一人被交付审讯，而且很快获释出狱。嘉庆设定了新的期限——当年春天——责令众将结束战役。他警告说，在赏罚上他会比父亲更严格，并立誓对不能如期完成任务的将领施以严惩。</p>\n<p>次日，嘉庆在批复宜绵的一道奏折时继续抨击众将。他批评他们不亲自督战，而是坐在远离战场的大营里享宴作乐，只派低级军官去打仗，然后让幕僚们每隔几天根据那些军官的呈报拼凑奏折。他指责他们不关心部队，致使下属侵吞空额兵饷，造成兵员短缺、国帑虚耗。他还质疑雇用如此众多乡勇的做法，称之为又一个黑洞。^5 显然，嘉庆对战役中种种弊端与滥行的了解比父亲更透彻——很可能他另有官场文书之外的耳目。这些谕旨异乎寻常的严厉语气，预示了嘉庆的雷霆之举。</p>\n<p>乾隆驾崩五天后，正月初八日，嘉庆罢免和珅一切职务并将其逮捕。户部侍郎、和珅的左右手福长安也被罢免逮捕。和珅被指控的二十大\"罪状\"中，大多数涉及违制逾礼、对乾隆皇帝不敬，以及贪婪敛取、占有钱财珍宝——包括某些只有皇室方可拥有的珠玉奢侈品。^6 然而，嘉庆所强调的最重之\"罪\"，是和珅阻碍了镇压战役——他拖延向朝廷呈递前线奏报，应对战役的迟缓与不力负责。嘉庆一再重申这一点。其中一段话是这样说的：</p>\n<blockquote>\n<p>邪匪滋事三年，尚未剿净。推原其故，实因和珅压抑军报，专擅用事，致误军务。各路军营不敢据实奏闻，观望迁延，故拖延至今，久未蒇事。^7</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释7。]</p>\n</blockquote>\n<p>所发生的情形是：奏折若带来坏消息——败仗、重伤亡——将领们就会附一封信给和珅，求他不要把奏折呈上，或者延迟呈递。^8 这不是白干的；将领们必须为这恩惠付钱。乾隆对这些勾当一无所知，极为看重和珅处理军报的表现，以致在勒保擒获王三槐之后赏了和珅一个公爵。用乾隆自己的话说，和珅\"参赞机宜，撰拟谕旨，一手经理，夙夜宣勤\"（原文待核，见注释9）。^9 而在分享前线信息方面显然被和珅忽视的嘉庆，把这定为这位领班军机大臣最大的\"罪状\"。^10</p>\n<p>和珅的贪得无厌与巨额家产——尽管被大大夸张了——助长了人们的一种普遍看法：嘉庆除掉他是为了他的贪腐。^11 然而，嘉庆明确表示这不是他的重点：\"朕之所以严惩和珅，实因其贻误军机之罪，而其种种贪赃自利之罪，尚属小事。\"（原文待核，见注释12）^12 为强调嘉庆的这番话，在对和珅的一长串指控中，没有一处明里暗里责备他导致战役经费过滥。尽管和珅私下贪婪，对礼物贿赂来者不拒，他在公开场合却始终维持着一副严厉、守法的重臣形象，即使对待自己的门生也不例外。他主持过几次财政整顿，查办过几桩著名的贪腐案。作为《军需则例》的主要编纂者之一，和珅在则例颁布后力图执行它，这常常使他与将领们发生冲突。^13 德楞泰在白莲教战役中提出的许多请款要求，和珅逐一驳回——因为它们不见于《军需则例》——并裁定德楞泰退缴多领之款。^14 被捕三周前，和珅还驳回了河南的一项请求：将近八万五千两银子，用于支付五万六千多名乡勇的饷银。他的理由是，没有证据表明所有这些乡勇服役时间相同，也没有证据表明他们按所报时间领过饷。^15 诚然，和珅的两面性使人难以估量他对战役财政的影响。一方面，他可能乐于收受官员与将领的贿赂，有时还为他们提供庇护。^16 另一方面，勒保等人在和珅被清除后抱怨和珅不近人情，对军费开支与升迁举荐都过于严苛，不容违反规则。嘉庆赞同勒保对和珅的抱怨，向勒保保证，他的政府会根据需要给战役更多财政支持。^17</p>\n<p>为把奸臣定为镇压战役陷入僵局的罪魁，嘉庆把和珅比作康熙皇帝幼年时的摄政鳌拜、雍正皇帝长期的亲信年羹尧，以及乾隆皇帝的第一位领班军机大臣讷亲，指出三人都身居与和珅相似的位置。三者之中，嘉庆认为和珅的案子最像讷亲，尽管他断言和珅的罪行比三人加在一起还重。讷亲深得乾隆信任，在第一次金川之役中奉命赴前线监军而身败名裂。他未能如乾隆所望迅速结束战争，又没有如实奏报前线局势，被命押解金川，在军前自尽。为让他自尽，乾隆特地送去一把其祖父遏必隆留下的匕首。^18 把和珅比作讷亲，嘉庆试图为自己清除和珅辩护：这是父亲开创的传统所认可的——凡是阻碍战役走向胜利的人，谁也不能得到宽恕。然而，在刑罚上，嘉庆退了回去。他说理道：爵位与皇室姻亲应当予以考虑，于是判和珅自缢——这比朝臣们提议的凌迟已是从轻。嘉庆还把朝臣们对福长安提议的斩立决减为斩监候。^19</p>\n<p>然而，嘉庆除掉和珅的动机还有另一条线索，只是他不愿公开。鉴于和珅在嘉庆即位前后都对他不敬，清除和珅更像康熙清除鳌拜。事实上，清朝大多数君主都表现出摆脱先朝跋扈权臣的倾向——或罢其官职，或公开使其身败名裂。^20 可以理解，这种心思需要隐藏。对嘉庆而言，让和珅充当战役受阻的替罪羊是方便的。正如前几章所揭示的，对僵局更应负责的其实是前线的将领们。此外，鉴于京城与前线之间的距离（普通邮驿在京城与战场诸省之间要走一两周），中枢政府处理军报的速度对战役结果影响甚微。和珅在战争中的主要作用，除为乾隆出谋划策、起草谕旨外，或许在于影响乾隆对统帅及前线其他关键职位的任命。或许意识到自己指控的站不住脚，嘉庆想尽快结案，宣布清除仅限于和珅与福长安二人。^21</p>\n<p>嘉庆信守了诺言。他没有清除或惩处中枢官僚体系中许多和珅的门生。^22 不过，他改组了内阁与军机处，把信任的人安插进去。他行动迅速，却一丝不苟。总的来说，嘉庆表现出倚重曾受和珅压制之人的倾向，例如阿桂的同僚。嘉庆任命蒙古旗人松筠执掌户部——户部已被和珅、福长安把持多年。松筠曾入军机处，但1794年自请出任驻藏大臣，以与和珅保持距离。^23 吏部尚书一职，嘉庆先任书麟——另一位阿桂同僚、和珅的政敌——随后又任命以反腐斗士闻名、时任闽浙总督的魁伦。^24 嘉庆让他的两个兄弟永瑆与永璇入值军机处并掌管几个重要部院，尽管时间不长。^25 他把老师朱珪从南方召回京城，任其首席顾问，并起复了那些或请假或外任的军机大臣，如庆桂与王杰。^26 嘉庆清除和珅，发出了一个强烈的信号：他可能整顿权贵门生把持的朝政，使它更能吸纳正直而有远见的官员的意见。然而，嘉庆并不想中止乾隆依赖一位领班军机大臣的做法；他试图扶植阿桂之孙、军机处的年轻成员那彦成，填补和珅留下的空缺。那彦成的火箭式擢升是和珅倒台后中枢政府最引人注目的特点，本章稍后将详述。</p>\n<p>对川陕针对起事者仍在进行的战争，嘉庆似乎手腕强硬；他立即着手整顿战争领导层。和珅被捕当天，在批复勒保\"已摧毁冷天禄堡寨、冷天禄脱逃\"的奏折时，嘉庆毫不留情地斥责勒保：\"勒保督办军务将近两年，从不肯实力奋勉，迅速擒拿贼首。其意不过使军务迁延，以便不断请领军费。所恃者，和珅之庇护回护，故敢因循玩延。\"（原文待核，见注释27）^27 嘉庆告知勒保和珅已被革职逮捕，同时提醒他先帝乾隆对他的信任与恩宠，敦促他悔过自新，加倍努力，迅速结束战役。他特别警告——以处分相威胁——不许再每隔数日上一道毫无建树的奏报来拖延时日。^28</p>\n<p>嘉庆似乎相信，和珅的倒台向将领们发出了一个清晰而强烈的信号：新君即便对最高级的人物也下得了狠手，因此他们不会等闲视之那个当年春天结束战役的期限。与此同时，面对与困扰乾隆相同的宿将匮乏问题，嘉庆决定保留勒保的战役统帅之位。痛斥勒保的次日，嘉庆宣布了这一决定，举出勒保在苗疆战役的贡献与擒获王三槐之功。^29 十天之后，嘉庆更进一步：授予勒保\"经略大臣\"（jinglüe dachen）之衔——这是为统帅一方的钦差大臣所保留的最高临时职衔。同时，嘉庆任命明亮与额勒登保为副统帅，授予他们\"参赞大臣\"（canzan dachen）之衔——尽管他十分清楚明亮对张汉潮作战的拖沓。^30 他的理由是：勒保的新头衔将使他对各战场所有将领拥有更高的权威，从而改善他们之间的协调。他期望这份恩宠能激励勒保更加卖力。嘉庆援引以往成功的经略大臣——第一次金川之役的傅恒、镇压贵州苗乱的鄂尔泰（事实上，经略大臣是张广泗，不是鄂尔泰）——敦促勒保以他们为榜样，并为他父亲在第二次金川之役中不光彩的惨败赎罪。为赢得勒保的忠心，他格外加恩：派永保——上年秋天刚被乾隆释放出狱——把经略大臣印信送交勒保。永保还奉命加入勒保的幕府，协助指挥战争——这正是勒保擒获王三槐后所请求、而被乾隆拒绝的。^31</p>\n<p>亲政数周之内，嘉庆就显露了性格中反复无常的一面——他常常对自己的判断没有把握，倾向于否定自己早先的决定。年长嘉庆二十岁、年近六十的勒保，必定把嘉庆对他的自相矛盾的处置——先痛斥，接着留用、乃至升擢——解读为新君缺乏经验、拿不定主意的表现。回应皇帝的批评与更高的封授，勒保上了一道深思熟虑的长篇奏折，激烈地为自己的战争指挥方式辩护，并对皇帝春天结束战争的期限提出异议。他再次罗列叛军的优势与清军的劣势，抱怨清军兵力不足，因为叛军股团不断分裂成更多股团（他声称四川有十至二十股之多），从而为自己不遵期限制造理由。一如既往，他声称自己一次只能专注一股；以他有限的兵力，不可能与所有股团作战。^32</p>\n<p>回应皇帝对开支过滥的批评，勒保不仅否认自己或任何将领浪费、侵吞过军费，还反戈一击，抱怨和珅主持下的户部对军费开支过于僵硬，有些规则不切实际。他极力为自己的财务清白辩护：\"臣虽至愚，断不肯为此糜费之罪，致累身家。\"（原文待核，见注释33）^33 这种大胆的立场或许有两个目的：挡开皇帝的批评，并使自己免于卷入和珅案。在断然拒绝皇帝的批评时，勒保似乎很有把握：皇帝没有办法惩处战役中所有的将领与督抚（他们几乎人人都犯过这样那样的错）。尽管嘉庆不相信勒保的话——众所周知，将领们在前线以军费宴饮享乐，嘉庆在回应勒保的自辩时也指出了这一点——他并没有硬起心肠，因为他已经确认了勒保的战役领导地位。相反，他转而诉诸对勒保及其同伙的道德规劝，敦促勒保听从自己的良心（liangxin），不要因为未能实现乾隆临终前迅速结束战役的遗愿，而使嘉庆成为不孝之子。^34</p>\n<h2>嘉庆的心理战</h2>\n<p>去世之前，乾隆曾一再重申：投降的叛军与被裹挟的平民不应被杀，甚至许诺奖赏那些在战场上倒戈或协助擒拿首领的人。他还明确表示，不愿迫害所有教门中人，因为许多人并没有参加起事。在四川，他曾警告当局不要搜捕所有啯噜匪徒与私盐贩子，免得把他们逼入叛军。^35 然而，这些指示并未被认真执行。有些官员确实试图区分被裹挟的平民与真正的叛军，从而拯救了数千人的性命，^36 但大多数将领不分青红皂白地冷酷屠杀俘虏，其影响压过了有限的招抚行动。^37 另一个障碍是：一些叛军的房屋与土地已被邻居或地方官府侵占；后者往往把它们卖掉，将所得中饱私囊。^38 结果，叛军很少投降——要么怕被杀，要么无家可归。</p>\n<p>1798年底在北京受审时，王三槐声称，他与许多人之叛乱，是因为地方官搜捕教众使他们别无出路。他本人就是父母与妻子被地方官府关押之后才被逼起事的。王三槐没有提起到处煽动起事的湖北教门信使，把自己描绘成一个受害者。然而，根据现存的审讯记录，他并没有说出\"官逼民反\"（guanbiminfan）这句口头禅。乾隆与嘉庆两位皇帝听取王三槐审讯汇报时，乾隆对王三槐的说法产生了兴趣：徐天德、罗其清与冉文俦也怀有投降之意，只是清朝官员置之不理。乾隆随即命勒保查办，并明确表示：只要他们真心投降，他就接受，并给他们一条活路——因为这比与之作战划算。^39</p>\n<p>但嘉庆从王三槐的供词中看到了不同的价值。正月二十日给勒保的谕旨中，嘉庆把\"官逼民反\"一词放到了起事者的口中，声称他们中许多人把地方官的勒索当作加入起事的理由。他特别说，因为王三槐在描述自己决定起事的原因时使用了这个词，他一直犹豫是否处死王三槐。^40 铸就了叛乱根源的这一说法之后，嘉庆为大多数叛军开脱，宣布他们是\"赤子\"（chizi）——忠于皇帝的无辜之民——只是走投无路才加入叛乱。更重要的是，嘉庆把地方官盘剥百姓的行为归咎于和珅：地方官正是为了满足和珅无穷的贪欲，才压榨普通百姓，然后把钱送给和珅。如今奸臣已除，皇帝准备对所有被迫或受诱加入叛乱的人普施大赦，给所有人悔过自新、重新开始生活的机会——用皇帝的话说，就是\"咸与维新\"（xianyuweixin）。^41</p>\n<p>嘉庆认为招抚是瓦解叛乱的关键之一，对之倾注了极大的关注。他把自己的新策略概括为\"剿抚兼施\"（jiaofu jianshi，或称\"剿抚并用\"，jiaofu bingyong），在1799年头几个月发动了一场心理战。在众多谕旨中，他阐明了这种胡萝卜加大棒的策略，号召部队停止滥杀俘虏，并充分表达自己对普通百姓的同情——他们或在战斗中充当叛军的人盾而死，或成为他的部队事后滥杀的牺牲品。为使那些被裹挟的平民知晓他的新政策，嘉庆指示广为宣示。^42 刑部侍郎汪承霈建议：除其他事项外，严惩那些继续屠杀投降叛军的将领。嘉庆采纳了这一建议。^43 嘉庆清楚地知道，安置流离失所的平民将是新政策的关键部分，于是寻求有效的实施办法。然而，这是一项昂贵而复杂的工程，既需要经费，也需要人手。中枢政府审议了几项方案，但对应如何、能如何安置流民，没有得出定论。^44</p>\n<p>抚慰普通百姓是嘉庆心理战的一翼，另一翼则是惩办几个对起事负有责任的\"恶\"官。在湖北，武昌府同知常丹葵被指定为一个恶官。弹劾者御史谷际岐在和珅被清除后不久，对常丹葵提出了耸人听闻的指控。谷际岐指斥常丹葵1796年被派往
