省督抚招募新兵补缺，使营伍充实、巡防有兵。然民人往往情愿充乡勇而不愿当兵，因兵须守营规、受约束，不能如乡勇之去留自由。加之[乡勇]盐菜口粮高于兵丁。故募乡勇易而募兵难。^220\n[译者按：原上谕自英文直译，文言原文待核，见注释220。]\n\n与此同时，绿营兵被调出的各省对提前补缺的号召响应并不积极——中枢政府没有为这项工程拨钱。此外，乾隆最后一年精力日衰，无法密切督导他视为重要的一切事务。因此，他补缺之令与宜绵三万备战兵的提议都没有落实。据军机处1799年春的一份报告，只有四个省招募了新兵：广东一千九百、云南七千一百、贵州一万零一百、四川二万三千四百。^221\n四省之中，四川招新兵最多。显然，宜绵1798年初返陕之前，是四川招兵的推动力量。^222 事实上，军机处的报告可能不完整；其他省份——例如湖北与河南——也招了新兵。在河南，景安与吴熊光招了七千四百名新兵，并把开封的一千一百四十三名乡勇转为巡抚直辖镇的正规军。^223 然而，尽管1797年有这些加强正规军的讨论与倡议，1797—1798年见证的却是战区乡勇的扩张——四川与湖北的受雇乡勇都达到了数十万，如前所述。\n嘉庆接手镇压战役的指挥后，也在正规军与非常规军之间权衡。他对乡勇权宜之计的所有问题了然于胸——很可能比父亲更清楚——亲政头几个月，他一再表达对过度使用受雇乡勇的愤怒，认为它是战役最大的陷阱之一，应对巨额财政代价负责。正如他所说：\"朕恐乡勇亦不过虚应故事，以图冒领经费。\"（原文待核，见注释224）^224 同时，他不断批评绿营军官侵吞士兵饷银、把士兵当私人跟班杂役，希望根除绿营中的劣习。^225 出于强化正规军的倾向，嘉庆起初敦促战役领导层削减乡勇。受嘉庆\"倚重正规军\"立场的鼓舞，四年二月二十五日，宜绵再次呈上\"在川陕甘鄂豫五省等额招募三万备战兵\"的提议——再次得到嘉庆的认可。^226\n鉴于1797年河南只招了五百名新兵——仅为批准五千名的十分之一——嘉庆于1799年秋命吴熊光用乡勇补河南绿营之缺。到1800年初，河南已招五千名新兵，陕西只招了一千八百零四名。嘉庆随后指示山西与河南再招新兵，补满所有空缺，另招数千名调往战役。更重要的是，嘉庆表示：这两省超过绿营编制的新兵，战后可以保留。然而，嘉庆没有给任何一省拨钱。急于扩充河南军事力量的吴熊光立即又招了一千名士兵，并计划裁乡勇、用省下的钱发饷——嘉庆同意了。到1800年初，河南共招七千四百名新兵——其中三千八百多名后来被调往湖北与陕西。^227 山西却没有跟进这个项目。\n在短暂的前线改革期间，嘉庆对强化与改革绿营怀有若干宏大的想法。回望王朝开国时代，1799年底，嘉庆反思了林起龙1659年\"重质而非重量\"的绿营建议。这道著名的奏疏出自户部侍郎林起龙之手，主张建立一支更小而更强的绿营，解除其维护地方治安之责，专注于作战技能，这样一旦需要调兵，就不必再依赖满洲旗兵。他提议把近六十万的绿营裁减三分之二，只留二十万，同时把军饷翻倍、加强训练。^228 事实上，林起龙的意图是把绿营打造成一支能征善战的机动军队，与旗兵比肩。林起龙的想法虽然没有实施，这个计划当时打动了顺治皇帝，此后数十年又令怀有远见者着迷。诚然，嘉庆被林起龙的建议吸引，不是因为削减绿营规模的建议。相反，吸引他的是林起龙\"建立精锐打击野战军\"的计划。同时，他惊异于：绿营在自己时代的问题与开国初年如此相似——包括军官吞空饷、把士兵当私人仆役。^229\n松筠虽然与台布一道在陕西雇用了乡勇、甚至提议提高其待遇以激励他们更好表现，^230 却主张扩充绿营作为清朝军事困局的根本之策。1800年初，松筠提出了一个激进的提议：废除乾隆1781年取消绿营军官\"武职名粮\"的决定。松筠请求恢复\"武职名粮\"，但取消给绿营军官的\"养廉银\"。因为前者保证了军官役使的人员——尽管大多数军官侵吞了一部分名粮——军官们就不会再盘剥士兵及其饷银。松筠建议把军官的\"养廉银\"改拨为士兵的饷银。这样，绿营的规模就能扩大（被私占的士兵归队），而无需增加军事预算。^231 然而，这个提议没有得到朝廷的支持。嘉庆身边围着一群普遍保守的顾问，无论他自己的还是官员们那些会带来如此激进改变的提议（如松筠此议），都得不到多少鼓励性的反馈。^232 更重要的是，1800年战争进入第五个年头时，嘉庆已经处于从改革上后退的边缘。\n嘉庆后退的关键决定因素之一是财政困难。乾隆驾崩时，户部库银已大幅缩减，嘉庆1799年仍设法拨了一千二百四十万两支撑战役——其中八百九十万两出自户部——这进一步抽干了户部之库。随着战争拖延，嘉庆开始怀疑自己的改革以及改革者们。在设法削减开支的同时，嘉庆开始把重心从正规军转向非常规军。结果，宜绵三万备战兵的提议被搁置；1800年之后，皇帝与任何省级领导人都没有再推动它。^233\n退回乡勇\n1800年新年后数日，嘉庆罢免了主持四川战争财政改革的广兴。广兴为削减乡勇人数尽了最大努力，但他一刀切的做法与魁伦对立——后者在裁乡勇上更审慎、更有选择性。然而，魁伦已经没有时间重新雇回先被福宁、后被广兴大批裁掉的乡勇——叛军就在此时抵达了定远的嘉陵江岸，而那里自1799年夏以来一直太平无事。听说叛军朝自己这边来时，定远知县请求拨款多雇乡勇，但为时已晚。^234\n1800年初叛军渡嘉陵江，使嘉庆对乡勇的立场来了个一百八十度大转弯——从低调认可转为坚定倡导。嘉庆认为嘉陵江守江乡勇的削减是叛军渡江的原因之一，立即号召\n号召江西居民组织自卫。^235 一周后，他坚决批准了长麟与台布的一项提议：在陕西每乡（xiang）设一名首领，把迄今分散的乡勇集中管理。^236 数日后，在一道长谕中，嘉庆劝勉战区所有督抚多雇乡勇，作为远调军队的替代。他论证说：尽管乡勇的饷银高于绿营兵，用他们仍划算——从北方调一名旗兵的钱，可以在当地雇十名乡勇。嘉庆再次告诫督抚们：乡勇的贡献要如实奏报、妥善奖赏；并告诉他们不必过分担心战后安置——遣散的乡勇可以补绿营之缺。此后数月，嘉庆重申了这些观点。^237\n嘉庆对招募使用受雇乡勇立场的急剧转变，带来了1800年整个战区的又一波雇乡勇高峰。在四川，乡勇总数迅速膨胀到至少十万。^238 在河南，吴熊光虽鄙夷乡勇，仍在豫西南边境多雇了乡勇，还从开封调去练勇（lianyong）——理由是湖北已被几股叛军突入。^239 湖北1797年底遣散了大部分乡勇，1800年初急忙再雇——尤其在襄阳与郧阳两府（每府各雇一千五百名）。尽管嘉庆警告不要过快膨胀受雇乡勇的名册，到年中，鄂西北至少有一万名受雇乡勇——不算不领饷的。^240\n嘉陵江溃败之后，嘉庆立即向四川调了五千名贵州兵及湖南、广东、广西的其他援军。但对费用的关切很快又攫住了他。他不仅不再派援军，还命把伤病兵遣回本营，只留精壮在战役中。^241 陕西按察使文成惠建议：从原营挑选健壮的士兵填补伤病留下的空缺。文成惠论证说：这一措施虽等于增加战役中的正规军，却有助于加快战役，最终是划算的。嘉庆认为战争数月内就可能结束，不为所动；他只是把文成惠的奏折转给额勒登保与那彦成，让他们决定是否需要新兵。^242\n不久，嘉庆从直隶、山东调了两千名绿营兵到河南加强防务。他让吴熊光用河南省库的钱支付开支，如果河南经费不足，他会从北京拨一些。然而，援军到达时，吴熊光抱怨：那些士兵以及先前从山西调的士兵都是新兵，不会打仗。嘉庆为此光火，批评直隶、山东、山西把新兵送上战场，命他们返回。^243 这成了朝廷最后一次从战区之外调遣正规军。\n随着1800年推进，清朝国家面临日益严峻的财政压力。嘉陵江之败与其他紧急事态迫使中枢政府在上半年向战场省份投入更多钱款，加深了中枢政府的财政困境。春末各战场叛军都被遏制后，嘉庆似乎决心让战役脱离国家的财政资源，让各省接管重担。他从四川开始——夏天开始时，四川只剩少量叛军残部。闰四月二十八日，嘉庆把户部库与内务府库的最后四十万两拨给四川，并告诉勒保：此后战役经费是省政府的责任——如第4章所述。\n皇帝虽然几乎不可能再坚持早先\"扩充并倚重正规军\"的偏好，嘉庆也难以坚持对受雇乡勇的认可。春末夏初，嘉庆急剧改变了立场。两个月里颁发的众多谕旨中，他说他并不赞成受雇乡勇——xiangyong。呼应他常听到的抱怨，嘉庆给他们贴了标签：大多是居无定所、无业可依的流民，不会打仗、难以管束。他们不仅不全力作战，也守不住地方——因为他们守的不是自己的家乡。最重要的是，雇他们的费用太大——他们的待遇高于绿营正规军。此外，嘉庆对他们的战后安置深表忧虑。因此，他告诫战争主持者们：不再招募他们，也不再让他们随正规军行动。^244\n嘉庆如今全力支持传统类型的乡勇——不领饷的自愿乡勇——视之为受雇乡勇的理想替代。^245 事实上，乾隆皇帝也时常呼吁依靠由地方精英或地方官组织的自愿乡勇。^246 尽管有人呼吁把受雇乡勇转为自愿乡勇，许多自愿乡勇很快还是被编入了受雇乡勇。^247 与庞大的受雇乡勇相比，剩下的自愿乡勇只是少数。1799、1800年朝廷与战争领导人们开始推动筑堡时，自愿乡勇重新出现；他们从堡民中招募，守卫堡寨。1800年中，勒保解释了两类乡勇的区别：\n\n团勇与乡勇不同。随官军征战、守卡守要、领饷领赏、可随处调遣者，是乡勇。地方百姓自出己财筑堡，挑选精壮、自备器械守卫其堡、由居民捐粮供养者，是团勇。团勇只顾及自家性命身家，不能责令其出堡奋勇杀贼。^248\n[译者按：原奏自英文直译，文言原文待核，见注释248。]\n\n在嘉庆看来，自愿乡勇——团勇——应当守卡守要，但不该随军远离家乡。他认为组织乡勇是地方官员——从督抚到知县——的任务，军事领导人应当远离此事——他们的职责是作战。地方官员不称职就换人，从外地调人来。嘉庆设想每个县最终会有数万自愿乡勇，敦促地方官员订立规章、定期训练。嘉庆对不领饷乡勇的迷恋竟至于称他们为\"最得力\"。他总结道：\n\n本地之民编为乡勇，守其本土。贼来则人人出而捍卫，贼去则各归本业。无战事时不领盐菜口粮。即便地方政府必要时提供一些财力支持，其花费也无法与雇乡勇的高额相比。^249\n[译者按：原上谕自英文直译，文言原文待核，见注释249。]\n\n正是低成本使自愿乡勇对财务压力日益沉重的皇帝如此有吸引力。嘉庆在谕旨中明确表示：中枢政府不支付自愿乡勇的费用，至少目前不；乡勇若由地方政府出资，战后报销；若由当地居民组织出资，那些地方可以奏请蠲免赋税。嘉庆知道这样自愿乡勇得到的补偿将远低于受雇乡勇，便强调：他会授他们顶戴与荣衔，给奋勇作战者实职，对阵亡者加倍抚恤。他期望这些恩典能弥补受雇与自愿乡勇之间的待遇差距，还希望它们加上地方政府供给的粮食，能吸引边缘人群，防止他们投奔叛军。^250\n与白莲教战争的流行看法——把地方精英描绘为组织自筹乡勇的推动力量——相反，在战役中期苦苦摆脱财政困境之际，力主此议的正是嘉庆皇帝。^251 从此，为区分自愿乡勇与受雇乡勇，前者常被称为\"练勇\"（lianyong）或\"义勇\"（yiyong），其头目称\"义首\"（yishou）。守卫平民堡寨的自愿乡勇称\"寨勇\"（zhaiyong），其头目称\"寨首\"（zhaishou）。这项计划注定在战场省份不受欢迎——它把供养乡勇的负担转嫁给了地方政府。地方官员与军事领导人的强烈抵制，很快压倒了皇帝\"倚靠不领饷乡勇\"的提议。\n战区地方官员厌恶这个主意：他们得监督乡勇，却得不到财政支持。曾在著述中大声倡导地方社群自卫的龚景瀚，任陕南知府时却道出了他的怨气：\n\n至于招募乡勇，皆为无业游棍，不可倚恃。府县衙门遂须厚赏严惩，以资约束。然此不啻责令庖人作炊而不与以米——如今府县衙门并无实权，徒有空架子。且又受[上司]监视，如防贼然。无权何以服众？无钱何以募人？^252\n[译者按：原文自英文直译，文言原文待核，见注释252。]\n\n正如台布所奏报的，地方官员\"不以为意，事到临头才仓促招募[乡勇]\"，然后\"凡持矛而来者，无论老弱，皆给口粮\"。^253\n对皇帝\"以事实上的无偿乡勇取代受雇乡勇\"的推动同样不满的，还有省级官员与将领们。勒保、台布、吴熊光、长麟、陆有仁、额勒登保与那彦成都大声而明确地抱怨自愿乡勇，认为他们比受雇的还不可靠——既无纪律，又无动力，很少表现出色。叛军来时，鸣锣相召，他们却等叛军过了才到。战斗中，一遇叛军、稍有伤亡就溃散。更糟的是，一旦溃散就无法重新集结。^254 在湖北，地方官组织的无偿\"义勇\"比陕川两省多。^255 但吴熊光认为，除郧西县的自愿乡勇外，其余都是乌合之众、毫无用处。^256 就连以得力闻名的郧西乡勇，有时也会出错。1800年初夏，他们擅离哨卡回家收割，给了叛军突入湖北的机会。^257 在陕西，平民一旦筑了堡，招募守卡的自愿乡勇就难了，官员们不得不发口粮来给些激励。为更好地指挥那些乡勇，长麟提议从外省挑选官员派到陕西；他认为最好由军队率领他们，但军队不够。^258\n督抚之中，没有谁比勒保更直言不讳。过去就曾违抗圣旨的勒保，激烈抵制削减受雇乡勇。他论证说：他们虽然不算非常得力，却对侦察、守卫嘉陵江等要地不可或缺。勒保还告诫：遣散安置他们很难；处理不当，可能把他们推向叛军。作为替代，勒保提议把遣散的乡勇编入自愿乡勇队伍，但延续其饷银。至于饷银经费，勒保建议在1800年春末已恢复太平的川西征收附加费——所谓的民间帮贴（minjian bangtie）。^259 勒保\"把自愿乡勇变成受雇乡勇\"的企图，与他维持军费开支规模的愿望一脉相承。同时，在他的辖区征收附加费，可以弥补四川军费的削减。效法勒保，湖北省级官员也请求给自愿乡勇发饷，并对表现突出者加发犒赏。^260 勒保一面重申不愿裁减受雇乡勇，一面继续在四川雇乡勇——尽管他承诺过不再招募新的。^261 从1801年初起，勒保甚至不再口头上敷衍\"把受雇乡勇转为自愿乡勇\"，论证说：后者在剿贼中只起边缘作用——他们不过是平民。^262 他坚持用受雇乡勇守嘉陵江，并再次提到将用川西的附加费支付他们。^263\n1801年初，新任湖广总督书麟到达湖北前线。与许多人一样，书麟对非常规兵员不以为然。但与其他人不同，书麟试图劝皇帝摆脱对乡勇的迷恋，把注意力转回正规军。他与倭什布提议：在鄂西北要地设六个营汛，各驻兵两千，这样清军就不必疲于在山中追剿叛军。他们将专注于守卫城市与其他人口稠密地区，迫使敌人进入人烟稀少之地，在那里断其给养。这个提议的主旨是：以正规军为主力，非常规兵员辅助。为凑齐该方案所需的一万二千名士兵，他们请求从湖北所调绿营兵的家乡省份调新兵填补伤亡空缺——这与文成惠一年前为陕西战场所提议的相似。^264 嘉庆虽赞同其中一些想法，却拒绝了调新兵的请求——他怕各省只会派新募的兵、而非精锐。他指示书麟与倭什布改雇更多自愿乡勇。^265\n然而，书麟很坚持。与许多人一样，他抱怨自愿乡勇无能——他们\"御敌则不足，扰民则有余\"（原文待核，见注释265）——并担心遣散他们时既无地可耕、又无军缺可补。此外，鄂西北边境人口稀少、又搞了筑堡工程，招募平民入乡勇变得困难。为凑足守卫六个要地营汛的兵力，书麟未经奏报就先请江西派三千名备战兵（beizhanbing）入鄂——因为吴熊光表示不愿再派河南兵入鄂。嘉庆虽未责备书麟此举，却怀疑江西的备战兵不顶用。^266 这次往还之后不久，书麟就去世了。他\"倚重正规军\"的倡导，成了战役主要领导人沿此路线的最后一次呼吁。\n听够了自愿乡勇的负面言论、又急于收束战役，嘉庆并不总坚持使用自愿乡勇。1801年初给长麟、陆有仁\"加强陕西防务\"的谕旨中，嘉庆指示他们用新兵替换伤病兵、雇新乡勇替换老弱者——这一立场与他回应书麟提议时的态度自相矛盾。他甚至告诉他们不必担心费用——迅速取胜能省更多钱。^267 有时，嘉庆设想：乡勇的又一波扩充或许能加快战役的清剿。\n1801年夏，倭星额与邱兴健奏报陕西视察之行的见闻时，估计战争中有八万多名正规军、约两万名受雇乡勇，合计十万兵力，而在逃叛军只有两万。两位钦差对受雇乡勇全盘批评，称他们乌合之众、不会打仗、守御无用，并把一些败仗归咎于他们缺乏纪律。他们声称：除额勒登保与德楞泰率领的随征乡勇外，其余都毫无价值。此外，他们指出：使用乡勇给后勤人员制造了侵吞经费的机会。为堵漏洞，他们建议登记所有乡勇，未经批准不得再雇。^268 然而，嘉庆已无意根除前线腐败，只指示额勒登保让地方官员更好地管理乡勇——他说他深知受雇乡勇的问题，但全部登记有困难。^269 由于嘉庆的放任态度，战役最后阶段整个战区雇了更多乡勇——他们有时被称为\"新勇\"（xinyong）。到1802年中，三省受雇乡勇或许有六七万，初秋时减到四万五千至五万。^270 当然，自愿乡勇——人数可能多出数倍——一旦发饷，就转为受雇乡勇。显然，许多人转了。\n雇佣兵的结局\n如第5章所述，清朝管理受雇乡勇的失败，是白莲教战争收尾阶段迁延的重要因素——战时的权宜之计成了巨大的包袱。尽管嘉庆自亲政以来就对受雇乡勇的危险有清醒的认识，他却没有有效的手段及时、平安地完成清算他们的复杂而艰巨的任务。乡勇充分利用机会索取最大限度的安置待遇，同时抵制被编为士兵——正规军的待遇更低、生活更受约束。战争领导人们则不愿一次性失去他们——庞大的乡勇队伍是他们索款的谈判筹码，也是开支过滥的主要借口。\n尽管对这个战时权宜之计摇摆不定，1802年夏末——只有几百名叛军残部在逃、久盼的奏凯在望时——嘉庆再也藏不住对乡勇的愤怒与厌恶。他直截了当地批评了过度使用受雇乡勇：\n\n[成例]以兵民分途为要。民以务农为业，不许习武，连持有武器都在禁止之列，以免其逞凶。如今三省受雇乡勇（xiangyong）如此之多，虽目前有些帮助，终究是件坏事——招募容易，遣散难。至于地方自愿团练（tuanlian）守堡之勇，皆有恒产恒业，不会沦为盗匪。但受雇乡勇乃无业流民。招募时其饷银甚至高于兵丁。且久随军队，用于杀贼。因此，很难去除他们的凶暴好斗之性。^271\n[译者按：原上谕自英文直译，文言原文待核，见注释271。]\n\n嘉庆随后责成将领们找到可行的办法，妥善而迅速地遣散安置他们。同时，他告诫军队磨砺自身能力，使将来不必再雇乡勇。^272 从此，他再也没有摆回青睐乡勇的一面。\n1804年初——漫长战役结束前数月——一些朝官建议修改《军需则例》，增加受雇乡勇的补偿规则，以免将来再出现滥行。或许是知道嘉庆的立场，军机处与兵部、户部、工部否决了这一提议。他们反而建议：将来不再使用受雇乡勇。除批准这一决定外，皇帝颁发了一道情感充沛的谕旨，痛斥战争中雇用乡勇的做法，明确表示要终止这一做法：\n\n国家养兵，所以卫民。驻防腹地之八旗劲旅与驻守各省之绿营，皆以备缓急之需。我朝兵制本有定章。以往平定准噶尔、回部、金川诸边役，及剿办王伦、苏四十三等内地叛乱，皆以官兵克敌奏功。从未有雇募乡勇之事。台湾贼匪林爽文滋事时，台湾远隔重洋，当地居民激于公义，自愿随军助剿，故准其从征。然而此次剿办邪匪，前线将领与地方官员招募众多乡勇，使之与官军同行。结果乡勇越来越多，达数万之众。地方有事，居民出于道义自行团练守家，理所当然。但官府招募平民充作战兵，还把他们外调他省数年，这算什么道理？朕闻所未闻……军队竟然不能保国安民，反要仰赖从未受过训练的平民上阵作战，那么养常备军还有什么意义？^273\n[译者按：原上谕自英文直译，文言原文待核，见注释273。]\n\n此后，嘉庆劝勉军官们认真训练军队。在他看来，这场战争大规模使用乡勇的异常做法之所以出现，是因为绿营兵荒废训练、被上司雇为跟班或学手艺挣钱，一旦有战事就无法履职。^274 整个白莲教战争期间，清朝国家对受雇乡勇的政策摇摆不定、充满矛盾，尽管并非不知其弊端与危险。然而，在上面这段谕旨中，嘉庆坚定而明确地否定了\"无限制雇用平民作战\"，给将来恢复这一方案几乎没有留下余地。因此，官修战役方略的编纂者们强调：战争中使用受雇乡勇只是\"权宜之计\"，淡化其分量与影响：\n\n我国家兵制严明，简练劲旅。凡有征调，本无藉乡勇（xiangyong）等类。此次邪匪起于鄂北，同时多起，官军不敷分布，地方士绅遂自发团练，各守其家其乡。随后各知县乃雇用之，以资其力。然亦不过权宜之计。^275\n[译者按：方略原文自英文直译，文言原文待核，见注释275。]\n\n说\"地方官员后来才接管乡勇\"并不准确（事实上，战役一开始许多地方就是官员牵头），而且这段话也没有提及：数万乡勇在战场上作战了多年。显然，这不是清朝军事史上光彩的一章。\n然而，官方的谴责并不能抹去一个事实：或许还有一万多名前乡勇被编在陕西、四川的驻防中——尤其是战役期间与战后新设的营汛。嘉庆视他们为王朝的隐患，频繁表达关切。德楞泰奏报最后叛军被消灭、标志冲突结束一年后，1806年夏末，陕西宁陕镇的两百来名前乡勇哗变。几个月后，1807年初，四川绥定（原达州）与陕西瓦石坪又发生了两场兵变。^276（地图6.1）\n宁陕镇1800年设立时，意在给秦岭要地五郎增加军事存在。按计划，它将有六千名新兵——百分之六十是从其他部队调来的绿营兵，百分之四十是无家可归的乡勇。^277 然而，多年来该镇一直兵员不足。除把乡勇转为新兵的困难外，\n鉴于他们参军意愿低，陕西领导人们——主要是额勒登保——并不积极补足其编制，而是专注于与朝廷谈判提高该镇官兵的待遇。^278 直到1804年夏，额勒登保仓促遣散了陕西全部乡勇，该镇编制才补齐——六千名士兵中大多数是被遣散的乡勇。^279 那些乡勇被定为\"守兵\"（shoubing），许多人还得从余丁当起，他们的饷银远低于当乡勇时的收入。此外，他们受到新上司的不敬对待。\n十一年七月初五日子夜，在陈达顺与陈先伦的率领下，两三百名新兵哗变——他们即将失去每月四钱的补贴——发给头三年新兵的\"米折银\"（mizheyin）。他们洗劫焚烧了宁陕镇的官署。拂晓，镇外一场小规模战斗中，哗变者杀死了署理宁陕镇总兵杨之震与另一名军官。随后他们西进，裹挟平民，招引其他营汛的\"乡勇变士兵\"加入，聚众三四千。然而，他们似乎没有计划。八月初攻占洋县县城后，他们折回宁陕方向，随后北移，但被阻止接近西安，被迫进入秦岭。为对付他们，从陕西、四川、甘肃、湖北、河南动员了约两万名清军，从满洲派了一百多名旗兵。九月二十四日，德楞泰、扎克塔尔、杨遇春、杨芳、薛大烈、丰绅与文春——白莲教战役将领名录的半壁——在栈道附近的江口方柴关与叛军遭遇。然而，陕西、四川其他营汛的许多新兵因经历相似而不愿与哗变者作战，有些人甚至逃跑了。此时，两名叛军头目蒲大芳与王文龙率部向德楞泰投降，随后擒获了陈达顺与陈先伦。与此同时，另一群不肯投降的哗变者被制服。兵变开始两个半月后宣告结束。^280\n1807年初，与宁陕兵变无关、但或许受了它的启发，绥定镇的几十名新兵——白莲教战役结束时该镇收编了八十多名乡勇——于十一年十二月二十二日黎明前在绥定城里哗变，起因是对微薄收入的怨恨。在王德先、孔传世与刘金鼎——前两人是前乡勇——的率领下，哗变者烧了衙门、打开监狱、洗劫府库，并试图杀死他们的总兵王国雄——据说他对部下苛刻至极。兵变很快被桂涵率领的四川军队镇压；两百多名哗变者在一周内或被杀或被擒。^281\n不久，十二年正月十二日，西乡协所属瓦石坪汛的三十多名新兵——全是前乡勇——又发动了一场兵变，他们相信上司侵吞了士兵的饷银。在周士贵的率领下，哗变者夺取汛库银两、劫掠奸淫平民后，逃入大巴山。十天内的两场战斗中，清军粉碎了这一伙，杀俘了该股全部五百多人。^282\n那些兵变只是清史上士兵第二次以暴力方式为自身利益抗议——第一次兵变发生在17世纪末，康熙皇帝在吴三桂之乱后裁减绿营之时。^283 三场兵变虽都没有升级为重大冲突，却向国家发出了警告，进一步强化了它对前乡勇的不信任与厌恶。兵变之后，嘉庆颁发谕旨安抚未参加哗变的\"乡勇变士兵\"，向他们保证：只要忠于朝廷，就不会受到歧视。^284 然而，听说德楞泰把两百多名投降的哗变者送回宁陕镇时，嘉庆几乎掩饰不住对前乡勇的感情。在一连串措辞严厉的谕旨中，他批评德楞泰的安排，要求解决。在皇帝的催逼下，陕西当局决定把他们与另外三百名新兵发往新疆驻防——嘉庆又补充：那两百多名哗变者永远不得离开新疆，即使服役期满。^285 然而，他们远未服满役期，1809年初，时任伊犁将军的松筠怀疑其中一些前哗变者在密谋骚乱。除处决了那些表示不服者外，松筠还下令把其余人一并杀死。一百九十五名前乡勇命丧新疆，为19世纪之交\"雇平民打仗\"这一章画上了一个悲惨的句号。公开场合，嘉庆谴责松筠滥杀显然无辜之人，过于残忍。^286 私下里，他或许大大松了一口气。毕竟，那些前乡勇正是他笔下曾说过的\"渣滓\"。^287\n注释\n[译者按：文献简称同前各章。]\n题辞：嘉庆九年正月二十五日上谕，NGDK, 125650.\n\n魏源《圣武记》（Wei Yuan, Shengwuji），457–65。本章及本章最后几节的部分内容，取材于作者2009年发表于《泰东》（Asia Major）的\"平民上战场\"（\"Civilians Go into Battle\"）一文。\n孔飞力《中华帝国晚期的叛乱及其敌人》（Kuhn, Rebellion and Its Enemies），41–50。孔飞力之前，铃木中正已描绘了战争中的大规模乡勇现象，包括随征乡勇（suizheng xiangyong）这类雇佣型乡勇，并强调其自发性质与地方精英的作用。Shinchō chūkishi, 189–96.\n此前，乡勇只是零星使用，且多在边疆地区。例如，1731年，甘肃河州知州顾尔昌组织了一支九千人的乡勇守卫二十四个关卡。但该乡勇很快被解散。《循化厅志》（Xunhua tingzhi），2/34、2/37。\n小县各雇八九百人，大县各雇五六千人；远离战场之地每日发钱六十文，近战场之地八十文。福康安，乾隆四十九年七月二十二日，《军机档》（Junjidang），37669。\n关于台湾战役，见罗友枝（Lococo）\"Military Campaign\"；庄吉发《清高宗》（Zhuang, Qing Gaozong），183–267。\n1802年，德楞泰把台湾战役指为战争中用乡勇之始。XFFL 329/17b–18b. 嘉庆此后呼应了这一看法。NGDK, 125650.\n数月之内，他们用掉了八十万两，又向国家请求追加一百万两。福康安，乾隆六十年七月十七日，《军机档》（Junjidang），47104。\nQSLJQ, 70/29a–30a.\n昭梿《啸亭杂录》（Zhaolian, Xiaoting zalu），351；蔡冠洛《清史列传》（Cai, Qingshi liezhuan），328。\nBLJZL, 1:56–58.\nBLJZL, 1:60; XFFL, 1/11a.\n孝感三汊埠——盐业枢纽——的地方士绅与商人招募了数千人为乡勇，一再击退叛军。祖之望授他们顶戴，一名地方官捐米供其口粮。XFFL, 13/14b–15a. 在当阳与荆州之间的富庶市镇河溶，当阳陷落后，几名生员捐产雇乡勇，设了三道关卡。XFFL, 2/12b–14a. 湖北郧县，包括一些生员与武生在内的当地居民1797年组织了乡勇。XFFL, 7/17b–18a, 8/26b–27a.\n惠龄在1796年三月的奏折中指出了这一点。XFFL, 5/14b–15a. 荆州知府手忙脚乱地拼凑了数百名乡勇守御地方。XFFL, 2/12b–14a. 咸丰知县与士绅招募了两千来人，设卡杀贼一百多。XFFL, 3/17a–b. 郧阳知府许以奖赏，招募了两千六百多名乡勇；他们参加了郧阳的战斗。XFFL, 6/3b–4a. 房县与保康招募了五千多名乡勇参战。XFFL, 6/5a–6a. 明亮说：\"湖北邪匪滋事，蔓延多处。官军未至之前，各府县皆集结乡勇守御。殷实士绅与有力之家亦参与守村，奋勇杀贼，助官军之威。\"XFFL, 13/31a–32a.\n《剿捕档》（Jiaobudang），嘉庆二年八月，135–38；BLJZL, 1:72–75; XFFL, 5/14b–15a, 10/26a. 当阳方面，毕沅招募三四千名乡勇参加围城，当地每村各雇八百至一千名乡勇。XFFL, 4/9b–10a. 汪新奏报：襄阳城附近的夹河洲与黄龙垱招募了一万多名乡勇。XFFL, 34/48a. 1796年八月，起事者盘踞榔坪时，宜昌府官员号召多雇乡勇，加强所有关卡路口的防务。XFFL, 13/50a–b.\nXFFL, 10/16a–b, 18/11a–12a.\nXFFL, 11/8a–9a.\nXFFL 3/6b–9a, 3/13a–b, 17/22a–b.\nMQDA, A306–75.\nXFFL, 33/43a–b.\n达州人杜茂才——安徽的低阶候选官——护送经费入川后回乡探亲，留了下来，组织了一支千人的乡勇。杜茂才于1801年春末升任知县。XFFL, 20/24b, 311/17a–b, 311/19a–b. 奉节方面，刘谦与其两兄弟组织居民在老木园与叛军作战。《奉节县志》（Fengjie xianzhi），28/36b–37b。大宁方面，饶明初捐资组织乡勇；该乡勇参加了老木园之战。《大宁县志》（Daning xianzhi），7/1b–2a。又见KJJFSB, 1/4a–5b。\nXFFL, 19/16a–17a.\nXFFL, 22/36b, 22/42a, 28/13b–14a; GZDJQ, 1454.\n他们还从附近挑选杰出乡勇充当守卫，腾出士兵作战。XFFL, 13/21a–b.\nXFFL, 18/33a–34a.\n在陕西，陆有仁用他们护送军费与给养运输。XFFL, 330/20a–b.\n1796年初，毕沅让湖北乡勇佩符，或在衣内缝一块红布或白布作标识。XFFL, 4/9b–10a, 22/16b; BLJZL, 1:74. 秦承恩为他1796年初在陕南招募的乡勇备了制服与帽子，并上书\"良民\"（liangmin）二字。XFFL, 11/8a–9a. 1797年初，惠龄让襄阳乡勇在衣襟内缝一块黄布，写明姓名、年龄与上司的印记。XFFL, 24/45b–46a. 1799年，松筠为陕西乡勇配了制服与帽子。XFFL, 121/12b–13a.\n据德楞泰说，他的一些乡勇是从苗疆战役带来的，其余大多1797、1798年雇的。XFFLXB, 22/44a–b.\n他们领大额口粮，另有银钱奖赏。XFFL, 18/33a–35a.\nXFFL, 28/4a, 38/28b.\nXFFL, 39/25b–26a, 39/32b–33a.\nXFFL, 107/24b–25a, 107/29b–30b.\nXFFL, 25/14b–15a.\n1797年，陕西商州几名生员率领的八百名自愿乡勇请求加入正规军剿贼。其中六百人获准。XFFL, 36/14b–15a.\n在陕南，秦承恩给乡勇发饷，用社仓粮供其口粮。XFFL, 11/8a–9a.\nXFFL, 1/24a–b. 他在嘉庆元年三月十一日的谕旨中重申了这一点。XFFL, 4/8b.\nXFFL, 8/4b.\nXFFL, 5/5b, 5/15a.\nXFFL, 5/14b–15a.\n石峰堡的先例——远离前线之地每日六十文、交战之地每日八十文——似乎被陕西沿用多年。NGDK, 108467.\nXFFL, 51/14a. 1797年秋，宜绵开始在月饷之外给四川乡勇发口粮。XFFL, 47/6a–b, 126/16b–18a.\nXFFL, 143/19b–22b.\nXFFL, 121/12b–13a.\nXFFL, 61/22a–23b.\n嘉庆元年二月二十一日的谕旨提到此事后，乾隆又在三月初三日的另一道谕旨中让毕沅挑选奋勇作战的乡勇予以奖赏。XFFL, 3/13b.\nXFFL, 5/14b–15a, 6/10b.\nGZDJQ, 2014.\nXFFL, 47/14b–15a.\nXFFL, 127/1a–b.\nXFFL, 132/23a–25b.\n只有河南的乡勇伤亡不重。XFFL, 46/2b–4a.\n1796年春末，乾隆指示给死伤乡勇发抚恤银。XFFL, 10/26a–b. 1797年初，乾隆批准了永保的请求：授阵亡有功乡勇千总之衔。XFFL, 23/19b–20a; 23/22a–b. 大约同时，乾隆命杰出阵亡乡勇按绿营最低阶军官的标准领取抚恤。QSLJQ, 13/3a–4a.\n这些案例中包括秦承恩1798年初为几名阵亡乡勇家属请抚恤。XFFL, 59/18b–19a.\nXFFL, 90/27b–28a.\n松筠还请求准许奖赏与叛军作战的文官。XFFL, 112/17b–24a.\n潘绍经的建议见嘉庆元年九月初八日的谕旨所引。XFFL, 17/12a–b.\nXFFL, 19/3a–4b.\nXFFL, 21/23b, 13/43b, 39/16a.\nXFFL, 11/8a–9a, 20/11b–12a; GZDJQ, 2077.\nXFFL, 126/16b–18a.\nXFFL, 164/35.\nXFFL, 22/31b, 34/37b, 35/5a–b.\nXFFL, 22/26a, 24/45b–46a, 30/3a.\n起初，他们不定期领饷。秦承恩给他们送去总计两万两银子，外加火炮弹药——因为他们大多贫穷，难以自备口粮。XFFL, 47/6b–7a.\nXFFL, 52/16a, 59/19a–b.\nJQSYD, 11:966; QSLJQ, 172/17b–19a.\nXFFL, 49/7a, 50/18b–21b, 62/9b–12a, 63/1a–2b, 64/2a–b, 65/35a–36a, 70/16a–b.\nSHD, 嘉庆八年五月上谕, 99; QSLJQ, 22/3b, 113/26b; XFFL, 49/15b, 72/18b.\nXFFL, 77/12b.\nXFFL, 24/26b–27a, 27/9b.\n五月共雇四千五百名乡勇。其中三千名受训后被选去参战。GZDJQ, 2472; XFFL, 33/38b–39a, 37/24a–b, 39/9a–b.\n罗思举率一队乡勇与士兵扮成叛军，1797年夏在云阳、万县一带杀死了四百名策划起事的教众。XFFL, 43/20a–24a, 43/26a–b. 桂涵1798年春仪陇一场战斗中率先攻入叛军堡寨。XFFL, 70/36a. 又见魏源《圣武记》（Wei Yuan, Shengwuji），457–64。\n襄阳队伍到达之前，太平已募四千至五千名乡勇。XFFL, 37/24a–b. 1797年秋，石作瑞、刘清及其他后勤官员雇了一万多名乡勇，率之参战。XFFL, 48/6b, 49/1b. 宜绵攻打方山坪叛军据点时使用了大量乡勇——受雇与自愿皆有。BLJZL, 1:280–83.\nGZDJQ, 6208, 10082; XFFL, 79/9b–10a. 但德楞泰1802年声称：1796—1797年四川有三十七万乡勇。XFFL 329/18b–19a.\nXFFL, 79/9b–11a, 93/5a–b, 126/16b–17b; GZDJQ, 10082.\n据吴熊光说，他任河南巡抚时只招募身世清白者。XFFLXB, 3/29a. 又见嘉庆八年正月初九日上谕，SHD, 58。\nXFFL, 333/12b–13a; XFFLXB, 3/29a–30b. 1797年初夏，达州的乡勇回家收割庄稼。XFFL, 39/13b.\n德楞泰1803年初奏报：湖北巴东与四川巫山、大宁的大多数受雇乡勇有家有业。SHD, 嘉庆八年二月二十五日, 91. 据勒保说，四川一地1797—1799年阵亡的九千多名乡勇中，只有四百四十七人有家属。NGDK, 114654.\nQSLJQ, 116/41b. 1803年，惠龄与祖之望说：陕西的防守乡勇大多是本地人，但大多数随征乡勇来自四川与湖北。XFFLXB, 14/3a–b.\nXFFLXB, 3/29a–30b.\n此事发生在1797年春夏的东乡、新宁与开县。XFFL, 43/7a.\n1698年，云贵总督王继文调土司兵镇压非汉地区的当地盗匪。《大清历朝实录》康熙朝，88/12a–b。\n1718年，松潘总兵路振扬动员土司兵，用他们协助守卡、充当民夫。路振扬请求准许供给他们口粮，得到中枢政府认可。《大清历朝实录》康熙朝，277/2b–3b。1720年，松潘游击岳钟琪从松潘征募藏兵及其他族群士兵，组成六百人的队伍随他进抵拉萨。岳钟琪传，《清国史馆传稿》（Zhuan'gao），6409 (1–3)。\n《大清历朝实录》康熙朝，299/5b–6a。\n绿营正规兵的年饷为六两，金川土兵只有三两。QSLQL, 1459/43b–44b. 阵亡绿营兵家属的抚恤为五十两，金川土兵只有二十五两。QSLQL, 1425/19a–b.\n土兵领三两\"衣装银\"，而满洲旗兵领二十两、绿营兵最低六两。旗兵与绿营人员还可以向国家借支，土兵则无此特权。JXZL, 户部，卷1、3。\n金川的军屯结果耗资巨大；国家不得不拨巨款供养绿营兵与土兵。土兵的调遣或许有助于论证保留军屯的正当性。\n《廓尔喀档》（Kuoerka dang），乾隆五十六年十月二十七日，152–53；十一月二十六日，168–69；五十七年四月初三日，3–13。\n台湾战役期间，乾隆给金川兵送去羊等礼物。1794年，乾隆称赞他们在第二次廓尔喀之役中的贡献，命金川一千五百名土兵每年各赏三两，其新垦之地免税。QLSYD, 18:168–69.\n马世嘉（McMahon）\"Identity and Conflict\"。\n1797年初夏，乾隆赏所有与长阳叛军作战的部队——包括土兵——一个月饷银。他还追赠一名阵亡土官为土游击，由其子承袭，并赏其家二百两。XFFL, 41/36b–37b.\nXFFL, 37/36b–37a, 37/39a.\nGZDJQ, 2291.\nXFFL, 130/32b–33a, 140/3a–b. 只有二百零二名金川兵回了家，其中九十名生病。很可能许多人战死或病死。XFFL, 201/14b–22a.\n其中一百零六名来自金川军屯，一百零一名来自金川其他地方。XFFL, 141/30b.\n士兵从巴塘、里塘、明正、木坪、绰斯甲、梭磨等地调来。XFFL, 152/14a.\n吴熊光1800年春如是说。XFFL, 165/17a–18a.\n《循化厅志》（Xunhua tingzhi），5/33。\nGZDJQ, 2290; XFFL, 35/28b, 37/37b, 38/15b, 38/29b, 38/33b, 39/14a–15a, 39/18a–20b.\n朝廷给死难撒拉官兵的家属发了高额抚恤。XFFL, 38/15b, 49/10b, 49/18b, 55/26b–27b; QSLJQ, 49/10b, 61/21a–22a, 61/24b–25a.\nXFFL, 102/5a, 103/27b–29a.\nXFFL, 102/3a–5a, 102/8a–b, 103/27b–29a, 107/6b–8b.\nXFFL, 111/16a–17b, 111/19a.\nXFFL, 123/19a–b, 123/20b.\nXFFL, 129/14b–15b.\nXFFL, 129/23a–25b.\nXFFL, 132/3a–b, 132/9b–10b, 136/6b.\nXFFL, 154/1a–ab, 154/2b–3b.\n1797年春，乾隆拒绝了甘肃庄浪一名土司\"派三百名士兵参战\"的请求——因为这会搅扰该土司的邻里。XFFL, 34/52a, 34/53a.\n一个例子是岳钟琪利用与金川土司的交情结束了1749年的第一次金川之役。戴（Dai）Sichuan Frontier, 128–29。\n文《坚壁清野议》见龚景瀚《澹静斋文钞》（Gong, Danjingzhai wenchao），外篇，1/3a–12b。\nQSG, 13042. 孔飞力甚至称龚景瀚为白莲教战争中的\"谋士\"。Rebellion and Its Enemies, 45–47.\n高（Gao）\"Shou Yun jilüe\"；《郧县志》（Yunxian zhi），10/85b–86a；日比野（Hibino）\"Gōson bōei\"；罗威廉（Rowe）《腥风血雨》（Crimson Rain），128–33。\n今天川东、陕南与鄂西北的一些堡寨仍可见。\nXFFL, 32/1a–2a.\nXFFL, 47/25b–26a; 《襄阳县志》（Xiangyang xianzhi），1/28b, 4/61b–62a。\nXFFL, 52/20a–23a, 52/29a–30b; QSLJQ, 23/3a–6a.\n1797年底，四川广安数万居民据山顶自固，地方官员雇乡勇用滚木礌石挫败叛军进攻。XFFL, 58/18b–19a. 1798年夏，景安与高杞协调在湖北筑城墙、掘壕。XFFL, 74/37a–39b. 陕西留坝，1799年春已在山上筑了堡。XFFL, 100/6b.\nJQSYD, 4:23.\nXFFL, 100/1a–4a.\nXFFL, 104/11b–12b. 据《随州志》，随州唯一修筑的堡在官庄店，由当地居民王明德所建。然而，1797年初三千名襄阳叛军从应山经堡而过时，王明德与一百多名乡勇被叛军杀死，堡似乎也被毁。《随州志》（Suizhou zhi），25/4b–5a。嘉庆或许把随州误当成了别的地方。\nXFFL, 104/12b–13b.\n那彦成建议订立规章，责成地方官员监督，并给迁入堡中的贫户发补贴。XFFL, 125/9b–10b.\nXFFL, 25/29b–30a.\nXFFL, 128/21a–23b, 128/28b.\nXFFL, 133/47b–48a.\nXFFL, 154/20b–22a.\n台布还打算用堡作军需仓库，以削减运输费用。XFFL, 161/12b–14a, 162/11b–14a, 168/27b–30b, 168/32b–33a.\nQSLJQ, 70/8b–12a; XFFL, 186/1a–5b.\nXFFL, 107/27b–28b.\nXFFL 144/36a–38b, 147/43b–44a, 162/11b–14a, 168/27b–30b, 175/22a–23b.\n陆有仁把小堡居民迁入大堡，并帮助留下的人组织乡勇——他观察到：高峰之上容纳数千户的大堡安全，而低丘或其他不安全之处的小堡易受叛军攻击。XFFL, 216/4a–7b. 陆有仁传见QSG, 11339–41。\nXFFL, 123/18b–19a.\nXFFL, 123/16b–17a, 125/9b–10b, 133/13b, 144/36a–38b. 嘉庆称赞了捐资的官员，并许诺给捐钱的官员与富户奖赏升迁。XFFL, 144/39b–40b, 154/16b–20b, 162/11b–14a, 168/27b–30b, 175/22a–23b, 229/6b–14a, 230/19b–20a.\nXFFL, 304/3b–7b.\nXFFL, 235/6b–9b, 235/15a–16b.\nXFFL, 180/23a–b, 202/14b–18b, 215/24a–26a, 217/19b–20a, 218/45b–47b. 当阳修了四十多座堡（许多到19世纪中叶仍可用）。《当阳县志》（Dangyang xianzhi），6/3a–4b, 16/3a–4b。房县的堡主要修于1800、1801年。《房县志》（Fangxian zhi），3/12a–16a。\nXFFL, 226/22b–23b, 231/6b–15a, 238/25a–28b.\nXFFL, 259/26b.\nXFFL, 333/13b–14a. 吴熊光多年后解释说，他从不相信此策有用。《伊江笔录》（Yijiang bilu），1/16b。\n魁伦说\"四川全省堡寨极多\"。XFFL, 144/28a. 明亮与德楞泰1797年底关于筑堡的奏折中建议：四川民众可以利用那些旧堡。XFFL, 52/20a–23a. 大宁方面，士绅沈英牵头筑堡，在大宁州城以西修建了\"保宁寨\"。《大宁县志》（Daning xianzhi），7/3a。达县磐石乡，两百户人家在山顶建了一座称为\"天保寨\"的设防聚落。《达县磐石乡志》（Daxian Panshixiang zhi），1/36a–b。\n1798年底，明亮与兴肇追击张汉潮到川北时发现：大多数居民已迁入\"山寨\"，张汉潮难以获取足够的粮食。XFFL, 80/20b–21a. 1799年底，明兴奏报了川东北的类似情形。XFFL, 128/21a–23b.\nXFFL, 139/20a, 139/22a–b, 143/19b–20a, 144/28a–29b, 152/16a–19b.\nXFFL, 134/4b-5a, 215/7b-12a, 224/5b-6a, 226/17b-21b.\nXFFL, 186/3a-b, 224/22b-25a, 238/28b-30b.\nXFFL, 261/17a-25b.\n嘉庆同意：筑堡只在条件许可之处施行，他不想处处推行。XFFL, 108/10b–14b.\n1801年初，嘉庆告诉额勒登保：他急于奏凯，等不了陕西再花一两个月完成筑堡。他还认为湖北没有时间筑堡了。XFFL, 223/36a–b, 226/4b–6b.\nXFFL, 223/24a–30a, 230/16a–22b.\n1801年夏，额勒登保再次推荐筑堡为剿灭叛军的最佳办法之一。他称赞陆有仁，并荐赏在陕西筑堡有功的军官官员。XFFL, 262/5b–11b.\nSHD, 嘉庆八年三月初十日, 39–46; 三月初十日, 47–50; XFFLXB, 8/28b–29a.\n吴熊光《伊江笔录》（Wu, Yijiang bilu），1/16b。\n明亮1800年指出了这一点。XFFL, 196/26a–27b. 勒保1802年初也承认：过去几年里，堡中平民与叛军作战的可能性只有\"百分之一二\"。GZDJQ, 7059.\n1802年春，陆有仁奏报有几十起此类事例。嘉庆指示以擒贼数目作为奖赏地方官员的标准。XFFL, 304/22a–23a, 304/33b–34b. 1803、1804年，此类事例很多。XFFLXB, 卷12–16。\n1799年底，起事者在太平、东乡、开县四次袭击清军运输队，抢米杀夫。XFFL, 133/38b–39a. 德楞泰1802年初奏报：鄂西的叛军占据民房以及山中的洞穴或堡寨，夺取给养。XFFL, 303/5a–b. 1802年夏，蒲天宝一股夺取了湖北兴山的几处堡寨。XFFL, 325/10b–11a. 1802年底，吴熊光警告：叛军可能占据平民堡寨为己用——如覃加耀1796—1797年在长阳、罗其清1798年在营山所为。XFFL, 333/13b.\n吴熊光《伊江笔录》（Wu, Yijiang bilu），1/16b。1802年夏，额勒登保奏报：陕西一些堡民高价卖粮给叛军，还为钱庇护受伤的叛军。额勒登保惩处了数人，其中一人处死。XFFL, 323/4b–5b.\n1800年初在东乡被擒的一名叛军供认：他们不敢攻打大堡，只威胁小堡。XFFL, 140/1b–2a, 141/6b–7a. 1803年中，数十名叛军在房县绑架了二十四名男女，堡寨付了赎金后放人。XFFLXB, 12/10a–11b.\nXFFL, 140/7b–8a.\nXFFL, 144/9a–b.\n一名被俘叛军供称：他们从四川、陕西移往湖北，是因为两省收成不好。XFFL, 234/19b–20b.\nXFFL, 215/16b–24a.\nXFFL, 165/17a–19b.\n只有一个例外：1798年秋，冷天禄据守云阳祖师观时，勒保派清兵抢收庄稼，并命冷天禄的人马冲出堡寨抢粮时烧田。XFFL, 79/7a–b.\nXFFL, 226/17b–21b.\n在陕西，一些堡民没有把所有粮食带进堡里，而是存在留下的空屋里——那些粮食常被起事者夺去。陆有仁没收其粮以示惩处。XFFL, 340/19b–20a.\nQSG, 13040–42; XFFL, 63/9a–b. 宜绵1798年初返陕时，龚景瀚显然随行。宜绵1799年初奏报：龚景瀚率乡勇参加了陕南一场战斗。XFFL, 86/10b–11a.\n嘉庆元年五月十二日，宜绵请把龚景瀚升为知府，并准其在得缺前先换顶戴。GZDJQ, 608. 嘉庆元年八月十八日，宜绵举荐龚景瀚任庆阳府知府。GZDJQ, 1032. 1797年初，宜绵把龚景瀚列入肃清陕南叛军有功人员名单。结果，龚景瀚获赏花翎顶戴。XFFL, 25/21a.\nXFFL, 89/10a.\nXFFL, 110/26a–27a.\nXFFL, 144/32a–b.\nXFFL, 189/6a–11b.\nXFFL, 228/19b–20a. 1804年夏，他在一道奏折中再次提到：他1797年冬就开始了这项工程。XFFLXB, 28/33a–b.\nJQQJZ, 10:219.\n召见勒保之后，嘉庆显然向白莲教官方方略的编纂委员会索要了支持这一说法的证据。随后呈给他的，是勒保1799年三月一道提到四川筑堡工程的奏折。JQQJZ, 10:219.\n勒保《平定教匪纪事》（Lebao, Pingding jiaofei），17b–18a, 22a。然而，白莲教战争时任重庆知府、勒保门生的石韫玉，在勒保的小传中只字未提勒保在四川筑堡的努力。《独学庐五稿》（Duxuelu wugao），22a–29b。\n他们大多是头三年调遣的。正如乾隆所宣布的，到1798年夏，共已调遣八万多名士兵。XFFL, 75/33a–b.\n嘉庆三年八月初八日上谕，BLJZL, 2:263.\nXFFL, 271/10b–12b.\nXFFL, 331/18a–19a, 331/23b–24a.\n1803年初，额勒登保送回一百五十名盛京旗兵。XFFLXB, 5/13a–15a. 1803年三月，勒保送回七十三名伤病旗兵，在四川留下八十四名健壮者。XFFLXB, 10/13a–b; 最后旗兵的撤出，见13/17b–18a, 15/23a–24a, 15/29b–30a。\nXFFL, 132/27b, 133/5b–7b.\n1800年秋，王文雄在陕西阵亡的消息使嘉庆想起惠伦与安禄之死。他哀伤地说：王这样一个一品大员死于与叛军作战，太不值得。XFFL, 169/21b–22a.\nXFFLXB, 8/5b–8a. 另一位阵亡的高级旗人是副都统丰绅阿——他于惠伦死前不久在湖北阵亡。另两名高级旗人永德与舒亮1798年底病死于四川。\nJXZL, 户部, 4/1a–7a.\n1799年秋，湖北为三千名满洲旗兵从河南、陕西、山东采购了马与骡（骡替代骆驼）。XFFL, 118/25b–30a, 118/34a–b, 119/7a–8b, 120/24b–27a, 122/20b–21a. 1799年底，四川从绿营各镇调了五百匹马，以满足额勒登保\"川滇黔各送五百匹马到其陕西部队\"的请求。嘉庆同意，并命云南、贵州或从本省驻防调马、或从市场购买。XFFL, 132/20b–22b, 132/32a–b, 132/39a. 不久，四川又从松潘、建昌、成都的绿营各镇调了五百匹马给新调来的三千名满洲旗兵。XFFL, 141/30a–b.\nXFFL, 164/30a–32a, 164/35a.\nXFFL, 118/29b–30a.\nXFFL, 260/36b–38a. 嘉庆六年六月初十日，嘉庆命河南巡抚颜检送三百五十匹马、一百五十头骡到湖北。XFFL, 260/39b. 1802年春末，吴熊光从河南买了一百头骡，从襄阳、郧阳两府买了二百匹本地马，替换湖北军队疲惫的马。XFFL, 313/25b–26a.\n铃木中正认为满洲旗兵在击败叛军中作用最大，但其证据主要是关于索伦兵的。铃木承认：北京两营来的旗兵纪律差、不顶用。Shinchō chūkishi, 172–73, 179.\n事实上，旗兵还有另一个名声：行军途中骚扰勒索地方官员与百姓。广兴被派往四川时，嘉庆先让二十几名宫中旗兵护送军费入川，把广兴滞留数日再出发——好让广兴看看旗兵沿途的作派。QSLJQ, 40/3b.\n嘉庆四年三月十二日，嘉庆命他们返回，并褫夺了其统领讷音的副都统之职。XFFL, 90/17b, 92/29b–30a, 106/7a–b, 111/45b, 124/9b–10b.\n1799年底，明兴请求再从成都驻防调四百名旗兵，以便他能作战。XFFL, 128/33b–34b.\nXFFL 144/5b–6a. 1799年底，八百二十五名伤病旗兵被遣返，达州还有一千三百五十六名伤病旗兵。\nXFFL 133/40a–b.\n九百五十名广东兵被派往四川替换先前部署的广东兵时，1800年初只有三百八十五人到达四川。额勒登保请求准许罢免其统领七格——他声称在战斗中受伤，其实只是背部与膝盖轻微肿胀；嘉庆批准了请求。XFFL, 142/5a–6a, 142/9a–b. 嘉庆1799年初指出：他完全清楚军中名册虚报的问题。QSLJQ, 37/22b–23a; XFFL, 87/15a–b.\n1802年底，额勒登保为几名部下未按时归队的军官请求宽恕。嘉庆指示额勒登保逐案核查：士兵确实逃亡者惩处军官，情有可原者宽宥。XFFL, 347/9b–13b.\nXFFL, 144/5b–6a, 192/9a–12b.\nXFFL, 8/8b. 当阳围城期间，一些乡勇把硝石、硫磺、盐等物资卖给城内的叛军，还替他们传递消息。他们虽然是为钱，但其中有些人是同情者，也并非完全不可能。彭氏《当阳避难记》（Peng, Dangyang bi'nanji），无页码。\n秦承恩禁止他们杀死任何叛军俘虏，责令把所有俘虏解送官府。XFFL, 11/8a–9a.\nXFFL, 13/31a–32a.\nXFFL, 13/32a–b. 然而，明亮把三汊埠的乡勇单独挑出来，认为他们没资格再领补偿——他们已领过一名地方官捐的口粮。XFFL, 13/41a.\nQSLJQ, 7/5b–6a; XFFL, 13/38b.\n明亮多次使用这一招。其他满洲将领也用过。恒瑞1798年初试图阻止叛军在汉中渡汉江时，让撒拉兵扮成乡勇。XFFL, 54/24b–25a, 57/22a–23b, 59/34b–35b.\nXFFL, 54/29b–30a.\nXFFL, 20/25a–b, 21/30b, 55/5a. 一位目击者生动记述了当阳乡勇肆无忌惮的劫掠与暴行，声称论劫掠，\"邪匪如梳，乡勇如篦\"。彭氏《当阳避难记》（Peng, Dangyang bi'nanji），无页码。\nXFFL, 104/27b–28a.\n该谕旨见宜绵奏折所引，GZDJQ, 2381; XFFL, 33/34b–35b.\n战役方略的编纂者们称赞乾隆的决定有远见。XFFL, 33/35b–36b.\n景安的奏折日期为嘉庆二年四月十六日。XFFL, 34/40b–42a.\nXFFL, 34/45b–46b.\n《剿捕档》（Jiaobudang），嘉庆二年八月，135–38。\nXFFL 53/30b–32a, 53/33a.\nXFFL, 47/8b–10a.\nXFFL, 47/22b–23a.\nXFFL, 47/22b–25b.\nXFFL, 47/27a–b.\nGZDJQ, 3022.\nGZDJQ, 3022.\n乾隆命宜绵主持四川的招募；勒保（时任新任湖广总督）与汪新主持湖北；秦承恩与柯藩主持陕西；景安主持河南；英善主持甘肃。XFFL, 51/18a–20a; QSLJQ, 22/15a–16a.\n1799年秋，吴熊光奏报：不仅乡勇不愿参军，绿营兵之子也不愿补军缺。嘉庆认为原因是军官将领们没有足够关心他们的福祉。XFFL, 116/13b–14b.\nXFFL, 169/13b–14a. 新兵在正式补入正规军缺额之前只领部分饷银。\nXFFL, 93/9a–10a.\n宜绵1798年七月提到：一些人已可随时调遣。XFFL, 45/19b. 据七十五说，到1800年春，重庆府已募四千五百名新兵，其中一千六百四十八名已调出，二千一百八十名被派往营汛要地，只剩六百七十二名留重庆。XFFL, 164/6a–7a. 1799年秋，勒保抱怨经费短缺时提到：四川新募之兵每年耗资三十多万两。XFFL, 110/27b–28a.\nXFFLXB, 18/11a–12b. 湖北房县1797年募了三百名新兵；九十名驻房县县城，二百一十名驻均州。《房县志》（Fangxian zhi），6/3a。\nQSLJQ, 37/23a; XFFL, 87/15b.\nJQSYD, 4:151.\nQSLJQ, 39/29a.\nSHD, 嘉庆八年九月初八日, 91–95; XFFL, 114/21a–23a, 117/17a–b, 146/31b–32b, 150/27b–30b.\n《大清历朝实录》顺治朝，127/23b–29a。\nQSLJQ, 50/37a–39b.\nXFFL, 121/10a–13a, 188/22a–25b.\nXFFL, 139/1a–6a.\n关文发认为：嘉庆的朝臣缺乏原创性与创造力，导致嘉庆朝政的平庸。关文发《嘉庆帝》（Guan, Jiaqingdi），228。\n嘉庆1804年承认：这一方案已搁置多年。XFFLXB 27/30a–31b.\n福宁把乡勇从三千裁到一千八百，广兴又继续裁减。XFFL, 152/7b–9a, 160/7b–9a.\nXFFL, 147/49b–51a. 此前不久，嘉庆开始更多谈论乡勇的好处——如吸纳无业流民，使社会少些潜在叛军。更重要的是，他希望乡勇有助于早日收束战役，使雇他们的高昂代价物有所值——因为战争拖长就得调更多正规军，花费更大。XFFL, 142/20b, 143/11a–12b, 143/11a–12a.\nGZDJQ, 4941; XFFL, 149/6b–7a.\nXFFL, 149/13a–17a, 158/18b–19a, 161/20a–b, 162/20a–21b.\nGZDJQ, 10082. 仅重庆府一地，1800年春就迅速雇了五千五百八十名乡勇。XFFL, 164/7a.\nXFFL, 145/24a, 149/37b–38a, 162/1a–5b, 165/17a–19b, 169/9a–12a. 吴熊光对乡勇的不信任，见XFFL, 110/5a–b.\nXFFL, 148/9a, 149/29b–33b, 150/4b–10a, 151/19b–23a, 153/11a–b, 154/41b–42a, 154/43b–44a, 156/5a–b, 162/1a–5b, 162/10b–11a, 174/25b–26a, 192/1a–3b, 202/14b–18b. 实际数字会更大；仅谷城一县就按户抽丁，募了二千七百名乡勇。\nXFFL, 150/24a–25b, 154/44a–b. 1800年夏，台布遣返了六百六十九名伤病士兵。XFFL, 188/22a–25b, 188/27a–28b. 事实上，嘉庆1799年底就开始谈遣返伤病兵以省钱。XFFL, 130/18b–19a.\n文成惠的计划是：把正规军只集中于关键要地，用作机动力量，哪里叛军去哪里，但不疲于追击。这样也便于补给。XFFL, 155/12b–17b, 155/20a–b.\nXFFL, 168/6a–7a, 168/8a–10b, 178/12a–14b, 178/15b–17b, 178/18b–20a. 战役领导人一致认为新兵不顶用。额勒登保1800年初抱怨上年到达的新兵（XFFL, 144/7a–b），陆有仁1801年初也抱怨（XFFL, 235/6b–12b）。\nXFFL, 163/30b–31b, 169/13b–17b.\n初夏（闰月）的几道谕旨——有些很长——中，嘉庆敦促所有战场省份多雇不领饷乡勇、削减受雇乡勇。他强调：给有功者授六、七、八品顶戴与陛见之荣。XFFL, 172/31b–35b, 172/38b–39a, 175/27a–33a, 177/3b–7b, 179/14a–15a.\n嘉庆二年七月二十二日，乾隆号召所有村庄组织乡勇，鼓励士绅招募义勇、协助官军御贼。XFFL, 45/10a. 又见XFFL, 4/67a–8a。\n四川按察使先福1797年初就建议过这一点。他的计划是：乡勇只在征调时领饷领粮，叛军一被击溃逐走，就各归本业、自担费用。XFFL, 126/16b–18a. 该计划显然没有被执行。\nXFFL, 184/25b–26a; QSLJQ, 69/16b. 1800年底，陆有仁对两者的区别作了类似解释，不过他称受雇乡勇为\"官勇\"（guanyong）、自愿乡勇为\"民勇\"（minyong）。XFFL, 216/5a–6a.\nXFFL, 177/5b–6b.\nXFFL, 172/38b–39a, 174/31a–b, 177/5b–6b, 215/9a–b. 此前不久，应松筠之请，嘉庆追赠了南漳一名被杀\"义勇\"官职——此人原有官衔，曾自费组织乡勇。XFFL, 162/1a–5b, 162/8a–b.\n《钦定剿平三省邪匪方略》的编纂者们称赞嘉庆是发起乡勇与筑堡的谋主，并把战役的最后胜利归功于嘉庆\"远见\"而\"英明\"的决定。XFFL, 169/18b.\n龚景瀚\"平贼议\"，《澹静斋文钞》（Danjingzhai wenchao），外篇，1/18a。\nXFFL, 158/16a–b.\nXFFL, 144/8b–9a, 154/40b, 157/7b–8b, 158/16a, 173/3a–5b, 173/6b, 180/4b–6a, 235/6b–12b. 也有少数例外。1800年夏，署理陇州知州率领的五千名自愿乡勇挫败了高马股北渡渭河的企图。XFFL, 198/23a–24b.\n1800年底，姜晟招募了数万名\"义勇\"，协助正规军守郧县、竹山、竹溪边境的关卡。他们只在当值时领口粮。XFFL, 206/12b–18a, 209/15a–17b, 217/16a–20a.\nXFFL, 173/3a–5b; 吴熊光《伊江笔录》（Wu, Yijiang bilu），1/16a–b。\nXFFL, 175/12b–13a.\n嘉庆批准了这一提议。XFFL, 211/4a, 229/6b–14a.\nXFFL, 184/25a–29a; QSLJQ, 69/16a–18b. 关于附加费的更多讨论，见\"结论\"。\nQSLJQ, 70/12a–14b.\n勒保与德楞泰奏报：他们已在一些地方把受雇乡勇转为自愿乡勇，但在另一些地方保留了一半或全部。勒保指出：他从贵州带来约一千名乡勇在夔州、巫山服役，他们必须用军费发饷。XFFL, 203/24a–26a.\nGZDJQ, 7059; XFFL, 228/19b–20a, 231/36b–41a. 但勒保也奏报过自愿乡勇协助作战，赢得嘉庆的一再称赞。XFFL, 189/17b.\nXFFL, 236/8b–9b, 236/15b–16a.\nXFFL, 231/6b–15a. 陆有仁呼应了文成惠的提议，呼吁在要地驻军，以自愿乡勇守川陕边境的关卡。XFFL, 216/4a–7b.\nXFFL, 231/19b–20b.\nXFFL, 232/26a–31b, 232/31b–33a, 241/1a–8a, 241/15b–17b; QSLJQ, 80/4a–b. 书麟还拒绝把二百五十二名河南兵送回家——他们强壮娴熟。XFFL, 234/16a–17a.\nXFFL, 229/30a–32a.\nXFFL, 253/5a–15a.\nXFFL, 253/16b–17a.\n据额勒登保说，投降的叛军也被编为\"新勇\"。XFFL, 328/8b–16a.\nXFFL, 328/16a–19a.\nXFFL, 328/19a–20a.\n嘉庆九年正月二十五日上谕，NGDK, 125650。\nXFFL, 328/20a–21b.\nXFFL, 1/2a–b.\n关于宁陕兵变，见Atwill（艾特威）\"Tyranny of Reasonableness\"及\"Ambivalent\"；关于瓦石坪兵变，见XFFLXB, 36/20b–21b。\n嘉庆同意该镇征募乡勇与无业流民，并指示该镇总兵善待他们。XFFLXB, 17/1a–6a.\nXFFLXB, 17/1a–6a, 22/44a–b. 额勒登保等所请的宁陕镇官兵待遇，包括提高饷银、增加骑驮、赏恤等。XFFLXB, 23/5a–8a.\nXFFLXB, 31/9a–10a.\nXFFLXB, 35/23a–30b, 35/30b–35a, 36/1a–6b, 36/8a–12b; 嘉庆十一年上谕档（SHD），8/29a–30a; 关文发《嘉庆帝》（Guan, Jiaqingdi），320–22。\nXFFLXB, 36/6b–10b, 36/14a–17a.\nXFFLXB, 36/17a–23b.\n第一次兵变发生在1680年，即吴三桂之乱后三藩裁军期间。\nXFFLXB, 35/30b–35a.\nXFFLXB, 36/17a–23b.\n松筠因此被降职。QSLJQ, 208/20a–22b.\n嘉庆在一道关于此事的谕旨中用了这个词。QSLJQ, 207/26a–29a.\n", "sections": [{"level": 2, "title": "从权宜之计到自成体系，1796—1799年", "id": "ch6-s0"}, {"level": 2, "title": "族群士兵", "id": "ch6-s1"}, {"level": 2, "title": "\"坚壁清野\"", "id": "ch6-s2"}, {"level": 2, "title": "夭折的改革", "id": "ch6-s3"}, {"level": 2, "title": "退回乡勇", "id": "ch6-s4"}, {"level": 2, "title": "雇佣兵的结局", "id": "ch6-s5"}, {"level": 2, "title": "注释", "id": "ch6-s6"}]}, {"id": "c7", "title": "第7章 · 耗费", "kicker": null, "part": "第二卷 · 专题", "html": "<blockquote>\n<p>他们知道：成功结束战役，最多不过得五等爵位之一，俸禄有定。这与统兵经过地方时收取成千上万两的厚礼相比，何啻天壤。所以他们被诱惑着留贼养寇，以自肥身家，虚耗国帑以中饱私囊。</p>\n<p>——嘉庆皇帝，1799年</p>\n<p>[译者按：原上谕自英文直译，文言原文待核。（出处见章末注释）]</p>\n</blockquote>\n<p>财政上，白莲教战争对清朝是一场空前的灾难。国家声称其耗费高达一亿二千万两白银——是漫长的乾隆朝最昂贵的战争、第二次金川之役耗费的两倍。到1799年——战争爆发三年后——中枢政府的国库丰盈储备已几乎耗尽，且永远不会恢复。白莲教战争巨额耗费的主因是前线腐败——军事将领与地方官员大胆而熟练地从中枢政府慷慨供给的军费中抽钱。战区发生的一切，使清朝国家18世纪晚期遏制战时开支与腐败的努力化为乌有，也永久损害了清朝国家的财政活力。前线腐败也是镇压这场孱弱叛乱的战役迁延不决的关键因素——侵吞军费的机会驱使将领与地方官员把战役拖着不完结、把叛军残部留着不消灭。乾隆与嘉庆两位皇帝虽然都清醒地意识到财政崩溃的危险，却谁也没能遏制住军费开支。嘉庆的前线改革只持续了几个月，1800年初就流产了。战争余下的岁月里，前线的乱花与侵吞仍在继续，而国家四处搜刮经费，既要支撑战役，又要应付日常国家开支。战争期间的官方档案与战后对军费的审计，揭示了战争财政的机制与动态，以及普遍腐败的手法与模式。清朝国家虽然躲过了财政制度的崩溃，王朝的财政充裕与灵活性却一去不返了。</p>\n<h2>经费</h2>\n<p>鉴于战争的性质——一种以暴力行使政治权力的方式，其轨迹常由前线的偶然因素支配——准确预算战争开支是困难的。无论现代还是前现代，国家因意外漫长而昂贵的战争耗尽财政资源，都不罕见。然而，白莲教战争的特殊之处在于：叛军构成的军事挑战之低微，与财政代价之巨大，形成鲜明对照。清史上从未有任何一场战争、公共工程或其他事业吞掉过如此巨大的钱款——如清朝国家所声称的一亿二千万两。这个数目是漫长乾隆朝国家年收入（五千万两）的两倍半，约是同期户部年均开支（一千一百万两）的十一倍。^1 然而，令清史研究者遗憾的是，现存清朝档案中没有一份完整账目详载经费的拨发。^2 要重建军费的拨发与分配，只能拼合散见于编修档案与原始档案中的信息。表7.1汇总了作者这一努力的成果。</p>\n<p><strong>表7.1　1796—1804年战场各省的经费拨发（单位：两）</strong></p>\n<table>\n<thead>\n<tr>\n<th>年份</th>\n<th>湖北</th>\n<th>陕西</th>\n<th>四川</th>\n<th>河南</th>\n<th>甘肃</th>\n<th>总计</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1796</td>\n<td>4,500,000</td>\n<td>0</td>\n<td>0</td>\n<td>2,000,000</td>\n<td>0</td>\n<td>6,500,000</td>\n</tr>\n<tr>\n<td>1797</td>\n<td>8,000,000</td>\n<td>4,000,000</td>\n<td>10,000,000</td>\n<td>1,000,000</td>\n<td>400,000</td>\n<td>23,400,000</td>\n</tr>\n<tr>\n<td>1798</td>\n<td>2,000,000</td>\n<td>6,000,000</td>\n<td>7,000,000</td>\n<td>800,000</td>\n<td>600,000</td>\n<td>16,400,000</td>\n</tr>\n<tr>\n<td>1799</td>\n<td>1,000,000</td>\n<td>2,900,000</td>\n<td>7,000,000</td>\n<td>500,000</td>\n<td>1,000,000</td>\n<td>12,400,000</td>\n</tr>\n<tr>\n<td>1800</td>\n<td>1,820,000</td>\n<td>7,406,000</td>\n<td>3,150,000</td>\n<td>100,000</td>\n<td>2,100,000</td>\n<td>14,576,000</td>\n</tr>\n<tr>\n<td>1801</td>\n<td>700,000</td>\n<td>3,683,000</td>\n<td>900,000</td>\n<td>0</td>\n<td>0</td>\n<td>5,283,000</td>\n</tr>\n<tr>\n<td>1802</td>\n<td>1,650,000</td>\n<td>3,400,000</td>\n<td>3,300,000</td>\n<td>0</td>\n<td>0</td>\n<td>8,350,000</td>\n</tr>\n<tr>\n<td>1803</td>\n<td>600,000</td>\n<td>500,000</td>\n<td>1,250,000</td>\n<td>0</td>\n<td>0</td>\n<td>2,350,000</td>\n</tr>\n<tr>\n<td>1804</td>\n<td>200,000</td>\n<td>1,200,000</td>\n<td>1,000,000</td>\n<td>0</td>\n<td>0</td>\n<td>2,400,000</td>\n</tr>\n<tr>\n<td>总计</td>\n<td>20,470,000</td>\n<td>29,089,000</td>\n<td>33,600,000</td>\n<td>4,400,000</td>\n<td>4,100,000</td>\n<td>91,659,000</td>\n</tr>\n</tbody>\n</table>\n<p>资料来源：据附录\"1796—1804年军费拨发\"整理。</p>\n<p>显而易见，各年数字加起来不到一亿二千万。它们也与皇帝明确说过的几个里程碑数字不符：到1797年四月，已向战区拨发三千多万两；^3 到1799年初，七千万两；^4 到1800年，一亿两。^5 然而，表中所列一些省份收到的军费数额，有省级官员奏折的印证，说明表7.1的信息近乎准确。^6 若干因素可能造成了\"所称总数一亿二千万\"与\"表列总数九千一百六十五万九千\"之间的出入。其一，所谓的协济银——从富省所征税款中例行解往四川及其他战场省份的款项——或许被计入了那一亿二千万。鉴于1796年解交中枢政府的白银收入异常之低，很可能除蠲免赋税外，更多收入被留在省里，然后同时拨给了苗疆战役与白莲教战役。^7 其二，战区之外各省供应过境军队、向战役输送给养的开支，可能被计入了总数。那些省份虽不从中枢政府领取军费，但通常请求报销——报销的形式通常是从它们应解京的税款中扣减。^8 其三，整个战役期间，中枢政府一再为受战乱蹂躏的地区蠲免、减免赋税——有些地方多次。一亿二千万这个数字是否把收入损失算进去、当作战争开支，不清楚。最后，皇帝可能被误导，或自己弄错了。从皇帝不同时期关于战争耗费的自相矛盾的说法、以及他的数字常常是粗略的——基于印象而非精确统计——来看，皇帝的不准确是\"一亿二千万\"与档案数字不符的最可能原因。</p>\n<p>一亿二千万两虽然很可能是个夸大的估计，但如表7.1所示，拨往战区的经费总额超过九千一百万两，绝非小数。战后，战役官方方略的编纂者们不得不为开支辩护，论证说：战区地形艰险、叛军游击战术使军需运输不畅，朝廷不得不提前解送大笔经费。然而，他们仍忍不住惊叹此役经费之空前铺张：\"从来军需未有如此之充裕而应手者。\"（原文待核，见注释9）^9</p>\n<p>清朝国家清醒地意识到乾隆朝晚期战时开支失控的危险，曾试图加以遏制。这一努力在白莲教战争中化为乌有。以往的战争中，中枢政府多应前线统帅之请拨发经费，并警惕不让统帅们误导自己。然而，为这场战役供款时，几乎没有谨慎可言——尤其是乾隆主政的头三年。他盘算着：只要全力支持将领们，叛军就会很快被消灭，于是常常在接到将领请求之前就拨款，且总是大手笔——通常是二百万至四百万两。利用乾隆供款的慷慨，前线领导人每次都索要数百万两，有时上一次请款的经费刚到不久就再请。^10</p>\n<p>讽刺的是，中枢政府给得越多，战场省份越容易出现经费短缺。四川在这方面最为臭名昭著。1797年底，应宜绵之请，乾隆又给四川拨了四百万两，使1797年一年拨给四川的总额达到一千万两——约等于乾隆朝中枢政府年均开支。^11 1798年春四百万刚到四川，英善与福宁又请四百万两——因为新到的经费已快用完。乾隆别无选择，只能再批四百万。^12 然而，新的四百万两比上一笔也撑不了多久。1798年夏四百万到达才两个月，福宁又请四百万两——只剩约一百万，只能撑两个月——至少福宁这么说。这一次乾隆犹豫了，没有批准，而是劝勉四川领导人们迅速收束战役。然而，勒保、英善与福宁不久联名再请，重申需求的紧迫——包括战后重建——福宁又同时另上一折详述供军的困难，乾隆让步了，批了三百万，同时再次斥责他们没有了结战事，并警告下次不会如此大方。^13 生命最后几个月里，从数百万两的请款中砍掉一百万，已是乾隆为省钱所能做的最大努力。^14</p>\n<p>四川对付区区几万名起事者，真的需要如此巨额经费吗？1800年初——嘉陵江之败之前——广兴估计：十万到二十万两就足以支撑四川所有部队一个月。即便把最昂贵的开支算进去——运输给养与乡勇饷银——广兴估计四川一年也只需要三百万两。^15 主持达州军需局的短暂任期内，广兴设法大幅削减了开支，尽管令许多人沮丧。^16 1800年的乡勇人数虽然少于头三年，各项开支之间的巨大落差证明：1797至1799年间四川存在大规模侵吞——那段时间至少有二千四百万两在四川蒸发了。</p>\n<p>战役初期，乾隆在花钱上粗心大意，有时近乎鲁莽。如第1章所述，他常常给参加某场战斗——只要被奏报为胜利——的所有部队赏一个月饷银，有时赏两个月。旗兵每人赏银高达一百两，军官数百两。赏一月饷银的做法过去用过——例如第二次金川之役——但从未如此慷慨。大手笔的犒赏事实上打消了军队迅速结束战役的动力——战争拖得越久，犒赏的机会就越多。由于部队常常跨省调动，那些一月饷银的犒赏很可能被领了不止一次——既在驻地领，又从本省军需库领。^17 然而，从1797年春末起，朝廷全面赏一月饷银越来越罕见。很可能，国库经费的快速流失与御史宋澍\"将领们借战争邀功请赏\"的批评起了一些作用。^18 此后，一月饷银的犒赏只留给擒杀叛军首领之时与战斗中负伤者。^19</p>\n<p>头三年漫不经心的花费，造成了清史上国库银储备最急剧的下降。庆祝乾隆退休的普免钱粮加重了财政负担。按计划，蠲免在嘉庆朝头三年——1796至1798年——实施。因此，中枢政府在应付空前军费的同时，其收入因蠲免下降了至少三分之一。1796与1797年，大部分军费从\"内库\"（Neiku）——户部两库之一——拨发。内库储备通常充当应急经费，很少用于日常开支；中枢政府官员的俸禄与京城全体旗兵的饷银通常从另一库——\"外库\"（Waiku）或\"部库\"（Buku）——拨发，那是户部的主库。^20 两年间——从1796年四月到1798年底——从内库拨给战役二千七百八十万两。从1799年起，只拨部库的经费。显然，内库储备已近枯竭、甚至空了。^21</p>\n<p>到1796年底，乾隆朝累积在部库里的近七千万两白银已缩至五千六百六十万两。1797年，从北京拨给战役至少二千一百四十万两。同时，仍在向收尾阶段的苗疆战役拨款。加上日常开支，1797年共拨出三千五百多万两——清史最高纪录。此前此后，中枢政府的年开支从未达到三千万两的门槛，超过两千万两的年头也只有寥寥几次。结果，部库银储备1797年降到二千七百九十万两。到1798年底，只剩约一千九百二十万两——17世纪末以来的最低点。^22 最重要的是，部库巨额储备的流失被证明是永久性的。嘉庆朝余下的岁月里，银储备从未远超三千万两。随后的道光朝（1821—1850），储备在一千万至三千三百万两之间波动。^23 王朝的财政黄金时代就此终结。风烛残年的乾隆在最后的日子里亲眼见证了它。（图7.1）</p>\n<p>父亲死后，嘉庆在最初的几道谕旨中说：这场战役已花费七千万两，他深感不安。^24 然而，他没有解释七千万两这个数字是怎么来的。如下面表7.2所示，头三年，至少四千三百二十万两从户部库解往战役。同时，国库还支付中枢政府的日常开支（乾隆朝年均一千一百万两，三年三千三百万两）与苗疆战役。或许嘉庆把三年间户部库拨出的总额七千八百九十万两误当成了解往白莲教战争的经费总数。当然，国库仅仅三年就拨出七千八百九十万两，这本身就令人警觉，^25 它几乎是乾隆朝年均开支的两倍半。嘉庆的不安是有道理的。^26</p>\n<p><strong>表7.2　拨往战区的经费来源（单位：两）</strong></p>\n<table>\n<thead>\n<tr>\n<th>年份</th>\n<th>户部库</th>\n<th>内务府库</th>\n<th>各省</th>\n<th>关税</th>\n<th>商人捐输</th>\n<th>监生捐纳收入</th>\n<th>盐课</th>\n<th>不明</th>\n<th>当年总计</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1796</td>\n<td>6,000,000</td>\n<td>0</td>\n<td>500,000</td>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n<td>不明</td>\n<td>6,500,000</td>\n</tr>\n<tr>\n<td>1797</td>\n<td>21,400,000</td>\n<td>0</td>\n<td>2,000,000</td>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n<td>不明</td>\n<td>23,400,000</td>\n</tr>\n<tr>\n<td>1798</td>\n<td>15,800,000</td>\n<td>0</td>\n<td>600,000</td>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n<td>不明</td>\n<td>16,400,000</td>\n</tr>\n<tr>\n<td>1799</td>\n<td>8,900,000</td>\n<td>400,000</td>\n<td>500,000</td>\n<td>1,000,000</td>\n<td>1,600,000</td>\n<td>0</td>\n<td>0</td>\n<td>不明</td>\n<td>12,400,000</td>\n</tr>\n<tr>\n<td>1800</td>\n<td>6,000,000</td>\n<td>1,300,000</td>\n<td>5,126,000</td>\n<td>550,000</td>\n<td>1,200,000</td>\n<td>400,000</td>\n<td>0</td>\n<td>不明</td>\n<td>14,576,000</td>\n</tr>\n<tr>\n<td>1801</td>\n<td>400,000</td>\n<td>200,000</td>\n<td>1,800,000</td>\n<td>0</td>\n<td>1,033,000</td>\n<td>450,000</td>\n<td>1,400,000</td>\n<td>不明</td>\n<td>5,283,000</td>\n</tr>\n<tr>\n<td>1802</td>\n<td>200,000</td>\n<td>0</td>\n<td>3,071,540</td>\n<td>1,250,000</td>\n<td>1,500,000</td>\n<td>938,460</td>\n<td>1,050,000</td>\n<td>340,000</td>\n<td>8,350,000</td>\n</tr>\n<tr>\n<td>1803</td>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n<td>1,950,000</td>\n<td>0</td>\n<td>0</td>\n<td>400,000</td>\n<td>2,350,000</td>\n</tr>\n<tr>\n<td>1804</td>\n<td>0</td>\n<td>0</td>\n<td>100,000</td>\n<td>1,500,000</td>\n<td>400,000</td>\n<td>200,000</td>\n<td>200,000</td>\n<td>不明</td>\n<td>2,400,000</td>\n</tr>\n<tr>\n<td>总计</td>\n<td>58,700,000</td>\n<td>1,900,000</td>\n<td>13,697,540</td>\n<td>4,300,000</td>\n<td>7,683,000</td>\n<td>1,988,460</td>\n<td>2,650,000</td>\n<td>740,000</td>\n<td>91,659,000</td>\n</tr>\n</tbody>\n</table>\n<p>资料来源：据附录\"1796—1804年军费拨发\"整理。</p>\n<p>然而，嘉庆从未公开批评父亲头三年的挥霍。他也没有为此归咎和珅——和珅众多\"罪状\"中没有一条与向战役拨发过多经费有关。但他决心削减开支。在改组战争领导层、开启短暂前线改革的同时，嘉庆废除了父亲大量使用的\"赏一月饷银\"做法。相反，他开始给部队颁发一两与五钱重的银牌（yinpai）——需要犒赏时。起初，他向每个重量各送五百面到前线，把受赏人数限制在一千人。后来每个重量送二百面、甚至一百面。最后，他掺入一些银锞（yinluo）——每枚不足五钱。结果，他把犒赏的费用从数千乃至数万两降到七百五十两，再到三百两，再到一百五十两或更少。</p>\n<p>一如他的典型作派，嘉庆在削减开支与\"为换取速胜而大手笔花钱\"之间不断摇摆。更常见的是，他刚表达削减开支的决心，就补充说：只要有助于迅速收束战役，他不介意高昂的财政代价。他甚至说：战役所需时，愿意违反后勤规章、支付超过则例所许之数。^27 他虽担心巨额开支与违反后勤规章招致批评，却盘算着：一场迅速的最终胜利足以让批评噤声。^28 正是这种心态促使他在1800年初转变了对受雇乡勇的态度。^29 得知叛军渡嘉陵江那天，他告诉额勒登保：不必\"顾及财政代价之高。贼匪早灭一日，所省之钱甚巨；若迁延数日，终将多费更多钱\"。^30 战争余下的岁月里，这一点被一再重申。^31</p>\n<p>结果，1800年白莲教战争的总开支为一千四百六十万两，比1799年的一千二百四十万多出二百一十八万。鉴于嘉庆缺乏决心，他无力把战争财政从父亲主持下设定的路径上扭开，也就不足为奇了。与乾隆一样，嘉庆被不断的巨额请款所淹没。有时，战场各省督抚还想方设法加大对他的压力。他们告诉他已向当地商人借钱时，嘉庆不愿盘剥民众，就批准请求，并催促他们经费一到就还钱给商人。^32 督抚们还声称已向本省藩库或邻省借钱，以推进其请款。^33 另一个方便的借口，是奏报叛军攻击已恢复太平之地，向朝廷示警。1799年徐天德突入湖北时，倭什布夸大危险，请求一百万两边防经费，立即获准。^34 1800年初，湖北又以数千叛军侵入为由请求八十万两。嘉庆虽恼怒，仍批了四十万两。^35</p>\n<p>起初，嘉庆对派往战争的新领导人——如松筠与魁伦——寄予厚望，希望他们能刹住过度的前线开支。^36 然而，新领导人们没有魔杖可以瞬间改变前线文化。他们也频频请款。^37 中枢政府收紧钱袋时，三个战场省份为经费相互竞争。在陕西，松筠一再扣留拨给四川的经费中过境的部分。^38 台布从松筠手中接管战争后勤后，也效法松筠截留四川的经费——因为陕西的军需库空了——但他的请款并不总获批准。^39 到1800年春末，陕西共截留了拨给四川的一百七十五万两。毫不奇怪，四川大为光火。广兴大声抱怨：陕西不截留，四川的经费本会充足。^40 新领导人们争抢经费耗尽了嘉庆的耐心与信任。嘉庆不止一次批评松筠与台布截留四川的钱，指责他们\"以邻为壑\"（yilinweihe）。^41 松筠被罢免仅半年后，台布也被打发走了。然而，1801、1802年，他们的继任者继续截留四川或甘肃的经费——包括普通的\"协饷\"。结果，嘉庆不得不定期给陕西拨款。1799与1800年，嘉庆总共向战役拨了约二千七百万两。1801至1804年，又给了一千八百四十万两。与乾隆掌舵头三年拨的四千六百三十万两相比，年耗费下降了。然而，嘉庆接手后军事行动的规模已经越来越小，四千五百四十多万两的开支几乎说不过去。</p>\n<p>与\"一次批数百万两连眼都不眨\"的乾隆不同，嘉庆没有这样做的本钱——他面临的财政状况严峻。1799年之后，嘉庆很少一次拨超过一百万两。从1800年起，他一次拨款不得不动用不止一个来源。乾隆主持下，头三年的军费大部分出自户部库。嘉庆起初也如此。1799年，他从户部库拨了八百九十万两给战役。然而，1800年，只从户部库拨了六百万两——比上年大幅下降——另有八百六十万两来自其他来源。1801年夏，北京及近畿连降暴雨数日，永定河决口。救灾与修堤进一步加深了国家的财政困境。部库储备进一步降到只剩一千六百九十万两（见图7.1）。1801年，户部库最后一次向战争拨款，只有四十万两。^42 1799至1801年，嘉庆还从内务府库——广储司（Guangchusi）——拨款，但总额只有一百九十万两。1801年之后，拨给战役的所有经费都来自京外来源。^43 数以百万两计的银锭由北京解往中原的大队人马景象一去不返，而其他省份与战场省份之间的钱款往来成倍增加——嘉庆转向各省与私人部门来支撑进行中的白莲教战争。（表7.2）</p>\n<p>京外来源的钱款来源多样。从1800年起，嘉庆用盐课与内地关税支付战役。1801至1804年，二百六十五万两盐课从盐政衙门解往战区。还从全国几个税关解去四百三十万两关税。盐课与关税合计六百九十五万两，属于中枢政府的收入；而更大一部分经费来自动用省库。1799至1804年间拨发经费的约百分之二十三——一千零六十多万两——来自各省。整个战争期间，至少有二千三百七十万两取自这一来源，其中百分之七十七以上是在嘉庆主持下。清朝，省级收入——以地丁税为主——的很大一部分不解京，而是留在各省支付行政开支、供养驻省军队。^44 一些较富的省份还有义务向收入不足以应付自身开支的省份解送\"协饷\"。战争或重大工程时，</p>\n<p>中枢政府向各省索捐也很平常。这场战争中，数省不得不从本省\"封贮银\"（fengzhuyin）中掏钱，执行皇帝\"支援战役\"的命令，尽管也动用了其他经费——包括存储于各省的中枢政府收入。</p>\n<p>除供应过境军队、向战争输送给养的开支外，各省并不能总把解往战争的经费从以后年度应解京的收入中扣减。弥补财政缺口，得各省自己想办法。有些省份设法挡开北京的要求。1800年初，山东与河南告诉中枢政府：经费已尽，无法再履行向陕甘解送\"协饷\"的义务。^45 年中，江苏、安徽与浙江也奏报藩库枯竭。^46 河南18世纪在国家财政平衡中一直扮演重要角色——它地丁收入大、供养的驻军又少——^47 却先受叛乱冲击，又卷入供应过境军队与运输队。河南无力或不愿再出钱，嘉庆便用山西来顶替。</p>\n<p>凭借可观的收入与繁荣的商业——包括与蒙古、俄罗斯利润丰厚的边境贸易——同时驻军也少，山西成了中枢政府与战场省份寻求资源时的自然之选。^48 1798年夏，乾隆命山西、河南从新征税收中各拨三十万两给甘肃作军费——乾隆不打算报销这笔钱。^49 嘉庆接手后，战场省份频频向山西索捐，总能获皇家批准。同时，嘉庆自己也一再向该省开口。^50 在从战区之外各省提取的全部经费——一千三百七十万两——中，超过百分之五十（七百万两）来自山西。除白银外，山西还向战争输送粮食。^51 嘉庆不便把经费直接交给战区后勤大员时，就把山西当作他拨给战役经费的储库。^52 但从1802年初起，这一职能由河南接替——河南那时已脱离战事数年。^53 1802年春，山西或许已到了财政能力的极限。嘉庆命山西送二十万两给陕西、不久又命再送一百万两给四川时，山西踌躇了；巡抚伯麟通知陕西：他得等征够税收才能解款。^54 这成了对山西的最后一次此类要求。1802年之后，随着军费减少，各省不再被索款，尽管它们继续向战役输送粮食与其他物资。河南再次首当其冲地承担实物征调。^55</p>\n<p>从私人部门筹集的款项中，两个来源在战役后期地位突出：售卖监生（jiansheng）头衔的收入与商人的捐输，合计约九百七十万两——占1799年以来拨给战争全部经费的百分之二十以上。售卖头衔是近乎常规的生财之道，清朝太平时期也举行。除中枢政府外，嘉庆允许各省售卖头衔以补充枯竭的藩库。四年十二月十五日，嘉庆批准了户部草拟的各省售卖监生头衔的方案。^56 结果令人瞩目。广东到1800年八月已筹得三十九万一千六百两。广东请求把售卖再延长一年时，嘉庆欣然批准。^57 不久，山东也以本省响应热烈——已筹三十四万一千两，远超二十五万两的目标——获得一年延期。^58 1800至1804年四年间，这笔收入共有近二百万两解往白莲教战争。^59</p>\n<p>众所周知，国家急需现银时——如战争或大型公共、皇家工程——清朝国家会积极动用商人财富，形式是所谓的\"商捐\"（shangjuan；亦称\"报效\"，baoxiao，字面义为\"贡献\"）。那些场合，商人们被敦促捐款，尽管其中一些人不待吩咐就知道何时该出手。^60 1799年春，直隶的一群盐商捐了六十六万两，山东的一些商人捐了三十四万两。显然，两拨人被协调成凑出一百万两的整数。嘉庆每组各接受百分之六十——直隶商人三十九万六千两，山东商人二十万四千两。^61 此后，越来越多的商人提出\"捐输\"。^62 嘉庆知道山西富商众多，1800年初几次写信给伯麟，让他\"劝说\"一些富商捐款。然而，为凑齐他向皇帝承诺的二百万两，伯麟发动了一场向全民摊派的行动——给所有州县设定额。一些未能凑够钱的商人被关押殴打。听说商人们的投诉，嘉庆训斥了伯麟，命他召回其爪牙。然而，山西官员对居民的勒索并没有完全停止。^63 1799至1804年，商人\"捐输\"中共有七百七十万两拨给了战役，但他们的捐输总额可能更大。^64</p>\n<p>除白银外，还从战区之外征调其他物资。这包括粮食、武器（弓矛等冷兵器，以及鸟枪、大炮等火器）、弹药（包括铅、硝石等火药原料），以及马、骡、骆驼等牲口。最大宗的是粮食——主要是米——从河南、湖南、江西、江苏、安徽、甘肃、广东与广西运来。战役开始时，动用的是战场内外\"常平仓\"（changpingcang）——全国各地设立的官方义仓——的存粮。然而，那些粮仓很快空了——有些没有维持规定的储备，有些储备已解往苗疆战役。18世纪四川一直向其他地区大量出口余米，但到世纪末，人口过重的压力已侵蚀了这一优势。^65 白莲教战争开始后，四川战乱地区及其附近的仓储备最先耗尽。全省范围，到1798年夏只剩总储备的百分之二十三——主要在本省西北、西南的边缘地带。^66 此后，四川不得不请求外省运粮支援战役，尽管收成好的年份——如1798、1799年——也努力补充粮仓。^67 直到战争最后阶段，四川才重新成为供应者，向陕西运米。^68</p>\n<p>冲突开始时，陕西是物资的给予者而非接受者。1797年初宜绵入川时，从陕西向四川送去了米、麦、豆与弹药。^69 这很快就变了。从1797年晚些时候起，襄阳起事者经陕入川之后，陕南成了主战场。越来越多的清军开赴陕西——1800年初有十万士兵与乡勇——对粮食的需求激增。到1800年春，陕西仓储备已经用尽。^70 粮荒日益严重，把粮价推到极高。^71 1800年，陕西几次从外省购米，每次数十万石。^72 战争余下的岁月里，陕西继续依赖外粮——尽管士兵与乡勇的人数在递减。^73 湖北状况虽好——只有西北角不断受战事影响——也需要外粮。有时，湖北截留经汉江运往北京的漕粮，也拦截他省运往陕西的米。^74</p>\n<p>整个战争期间，运往战区的米、麦、豆很可能不少于一百万石，而三个主战场省份粮仓用米三百五十万石。^75 通常，运输费用超过粮食本身的价钱——尤其是运进秦岭的物资。为控制运输开支，嘉庆在1800年底的谕旨中命军队米麦兼收，并自带一部分口粮，不要完全依赖后勤队伍。^76 战役收尾阶段，陕西改从川北而非河南购米，以省运输费用。^77 然而，谁来支付粮食与运输的费用，是个复杂的问题。朝廷命外省运粮入战区时，各省可能从以后年度应解京的收入中扣减费用。但是，战场省份督抚向他省请粮时，通常用军费支付运输。有时，他们也支付那些省份补充粮仓的费用，但并非总是如此——这不总是清楚的。为查明这项工程的总花费，户部1802年秋提议对这场战役消耗的粮食进行一次审计。这注定是极其艰难的过程，嘉庆把户部建议的两个月期限延到四个月。^78 然而，这道命令似乎没有被执行或完成。至少，购置（包括补充粮仓的费用）与运输粮食到战区，必定花了几百万两。部分费用可能已由拨给战场省份的军费覆盖。其余部分——仍是个未知数——可能在拨给战争的九千一百六十五万九千两之外。</p>\n<h2>后勤</h2>\n<p>清朝，文官系统例行参与战争中的军事支援。省级官员常常被任命为战争的统帅或后勤主管。白莲教战役中，战场各省历任总督都奉命主持军事行动或后勤。他们与军队将领一起构成事实上的前线当局，就战役进展与战争财政联名奏报。同时，从省到县的文官也被动员起来支援后勤。其一，知府、知县——包括候补者——与书吏被招募充任临时军需局（Junxuju）的职员。军需局成型于雍正朝对准噶尔蒙古人的战争，负责收发军费、雇平民充当挑夫向导、主持修桥筑路以便军行或毁之阻敌。军需局的构成没有固定格式。有时，它不过一名主管加几名助手，尽管通常受总督或巡抚的密切监督。^79 冲突涉及两省时，两省的后勤人员相互配合。此外，战区所有其他地方官府人员都有义务在本辖区支援战役：运送给养、维护通信线路、安置伤病士兵、接待过境的后勤运输队与委员、组织乡勇、筑堡、保城守卡、赈济安置流民与前起事者。这些负担虽然沉重，也代表着机会。</p>\n<p>1796年初首当其冲的湖北，率先建立了后勤网络。毕沅主持下，在荆州、郧阳、襄阳与武昌设了四个军需局。前三个靠近热点，省城武昌的那个负责采购弹药、给养与经费并运往前线。毕沅在当阳指挥围城，便任命自己的门生主持各军需局。起初，候补道台双庆担任湖北后勤主管。然而，毕沅很快以襄阳知府胡齐仑取代了双庆。胡齐仑治下，襄阳局成了湖北战场的后勤神经中枢——尽管该局只有胡齐仑与一名助手两人，局的办公室与仓库就设在胡齐仑自己家里。^80 由于湖北的战事断断续续，一些军需局关了又开。^81 战役最后阶段，宜昌、房县与襄阳充当后勤中心，武昌局继续运转。^82</p>\n<p>随着叛乱蔓延到更多省份，河南、陕西、四川与甘肃都设立了后勤机构（表7.3）。河南方面，1796年初，景安任命南阳知府完颜岱监督后勤。^83 1797年初襄阳起事者赴陕之后，河南大体脱离战事，该省的后勤运作有限，主要服务过境军队。与河南一样，甘肃只在1798至1802年间东南角被起事者侵入时才卷入冲突。只在省城兰州设了一个军需局。陕西方面，秦承恩头三年主持后勤。1799年中松筠接手时，汉中的军需局充当陕西后勤总部，另有兴安府与西安两个军需局。四川方面，达州、保宁与成都设了三个军需局。^84 三者之中，达州局最重要——它经手拨给四川巨额军费的大部分——因此被称为\"军需总局\"（Junxu zongju）。远离前线的成都局主要负责采购粮食、军服、弹药、马匹等，通常不参与向军队分发经费、向乡勇民夫发饷。^85</p>\n<p><strong>表7.3　战场各省后勤领导人</strong></p>\n<table>\n<thead>\n<tr>\n<th>湖北</th>\n<th>陕西</th>\n<th>四川</th>\n<th>河南</th>\n<th>甘肃</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>毕沅、汪新，1796—1798</td>\n<td>秦承恩，1796—1799</td>\n<td>英善，1796—1798</td>\n<td>景安，1796—1798</td>\n<td>杨揆，1797—1799</td>\n</tr>\n<tr>\n<td>景安，1798—1799</td>\n<td>松筠，1799—1800</td>\n<td>福宁，1798—1799</td>\n<td>倭什布，1798—1799</td>\n<td>广厚，1799—1801</td>\n</tr>\n<tr>\n<td>倭什布，1799—1800</td>\n<td>台布，1800—1801</td>\n<td>魁伦、广兴，1799—1800年初</td>\n<td>吴熊光，1799—1801</td>\n<td>王文涌，1801—1804</td>\n</tr>\n<tr>\n<td>吴熊光，1801—1805</td>\n<td>陆有仁，1801—1802</td>\n<td>托津、广兴，1800年春</td>\n<td>颜检，1801—1802</td>\n<td></td>\n</tr>\n<tr>\n<td></td>\n<td>祖之望，1802—1803</td>\n<td>勒保，1800—1805</td>\n<td>马慧裕，1802—1805</td>\n<td></td>\n</tr>\n<tr>\n<td></td>\n<td>方维甸，1803—1805</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>资料来源：据XFFL、GZDJQ、QSLJQ、NGDK等处相关记载整理。</p>\n<p>在军需局与战场之间，粮台（liangtai）——由知府或知县主持——星罗棋布于物资运输的路线上。^86 四川方面，达州局之下，在营山与忠州设了两个总运台（zongyuntai），各自辖一串中转站。^87 1797年夏，襄阳叛军入川、战场扩至开县时，新宁与东乡设了新粮台。由于当地无足够的精壮可雇，清军带来的民夫被用来充实那些粮台。宜绵任命江西督粮道陈兰森——德楞泰从苗疆战役带来的——与陕西按察使先福——惠龄带到四川的——监督那些新粮台。^88 使用外地——特别是北京来的——官员、更多时候是候补官员，充任军需局与粮台职员，在整个战役的所有战场都是惯例。到1799年，战区后勤网络中雇用了众多外地人。^89 他们继续到来，直到战役最后阶段——那时他们还被派去监督筑堡。</p>\n<p>《军需则例》虽规定两站间距为一百里，这规则并不总被遵守。以山区地形与邻近叛军攻击危险为由，四川常常每六十至七十里、甚至四十至五十里就设一处粮台。战役早期，大多数粮台雇数百至一千名挑夫，但少数大粮台有数千名挑夫——如达州附近的重要粮台文重溪。^90 在陕鄂两省，水位够高可以通航时，汉江也被用作陆路之外的运输线。^91 运输路线被起事者阻断时，后勤人员有时把银锭分给乡勇或民夫，经便道送交军队。^92 然而，嘉庆对这种危险的办法皱眉——银子很容易丢失。他偏爱一种办法：后勤机构在叛军常出没之地附近预先囤粮与其他给养。当地居民在山顶修了更多堡寨时，堡寨也被用来储给养。^93</p>\n<p>与以往的战争一样，这场战役需要庞大的军事民夫队伍，为军队运送给养弹药、从战场抬下伤员。由于军事民夫队伍是乾隆朝诸战争所有开支中最昂贵、最易滋弊的一项，《军需则例》细致规定了民夫的报酬，几乎没留下操纵空间。^94 然而，白莲教战争中，那些规则很快被突破。在湖北，民夫被多付——尽管细节不清楚。在四川，民夫起初按《军需则例》的标准付酬。他们受雇时都领\"安家银\"（anjiayin）——一次性安家费——与盘缠；受雇期间领口粮与工钱（没有差使或出勤归来时只领口粮、不领工钱）。每三十名民夫搭一座棚。随军行进的民夫，每十人配一顶帐篷。^95 然而，民夫队伍的规模迅速而大幅地增长。正如1797年初在川北协调后勤的秦承恩所解释的：大巴山小径狭窄陡峭，无法使用牲口。挑夫每人只能背两斗米，其中一半自己吃掉，两万军队就需要两万挑夫。^96 到1797年初夏，大批清军会聚川东北时，据说雇了近十万民夫。^97</p>\n<p>白莲教战争的一个新问题，是军事民夫队伍的人手长期短缺。不仅条件危险、有时危及性命，^98 而且精壮男子宁愿加入乡勇——待遇更好。^99 为吸引人加入民夫队伍，后勤当局不得不提高工钱、加甜头。^100 战役开始后不久，军队雇用了所谓的\"长夫\"（changfu）——长期附属于军队的民夫。这是违反则例的；使用长夫被证明是这场战役最昂贵、问题最多的开支之一——下文将考察。</p>\n<p>随着战役推进，军需局的作用显著下降，将领们更多地依赖\"随营粮员\"（suiying liangyuan）处理后勤需求。起初，那些粮员——大多是低阶文官——由军需局派往军队充当联络。然而，将领们很快更喜欢品级更高的官员充任此职——因为军队移动时，他们要与知县及地方社会打交道。1799年底，魁伦派知府李鋐到额勒登保处，替换他原来的粮员崔特峰——崔只是个州同。1800年初额勒登保赴陕后，陕安道道员朱勋成了他的粮员，一直当到战役结束。^101 至于后勤需求格外苛刻、甚至刁蛮的德楞泰，派对人去替他办事最为关键。1800年春德楞泰从陕西回川后，与勒保一道请求起复石作瑞——他已被魁伦罢免并立案查办。石作瑞洗清罪名、复职后，德楞泰任命他为自己的粮员，替换通判吴文森——吴品级低，权威不足。^102 1802年春德楞泰赴鄂时，吴熊光派陈兰森——他曾侍奉德楞泰，时任湖北道员——在德楞泰留鄂期间充当其粮员。^103</p>\n<p>粮员承担了大部分工作，省级督抚便倾向于撤销军需局。1800年勒保回川后，重建了后勤机构。他无视嘉庆\"托津、广兴回京后为达州局任命新主管\"的指示，反而在夏末把保宁、达州两局都撤销了，任命在达州局工作过的永宁道道员陈预主持川东后勤、李鋐主持川北后勤。结果，只有成都局收发军费。正如勒保所论证的，这一变动省了达州、保宁两局的运转费用，且只设一局使军费审计更简单。^104 毫无疑问，这一安排使四川省政府更能从军费中取利（战役最后阶段勒保驻节成都）。湖北战场，1801年吴熊光出任总督后，把襄阳局改为武昌局的分支，派道员张道源主持襄阳局，并命湖北所有知县与粮员向张道源汇报。^105 陕西战场，后勤机构更加集中。历任总督驻节汉中——陕西后勤总部——对军费与后勤严密掌控。可以说，到1801年，军需局已被边缘化；督抚们对本辖区后勤事务的监督更紧密、更直接了。</p>\n<h2>漏洞、滥行与侵吞</h2>\n<p>把战时后勤外包给文官系统与地方社会，证明了清朝国家动员广泛社会层面支援军事行动的能力。然而，临时性的后勤制度注定昂贵——国家得为平民提供的服务付钱。不仅开支容易失控，这个制度还产生了众多漏洞，成为腐败的沃土——乾隆朝诸战争已经暴露了这一点。白莲教战争中，不仅被《军需则例》禁止的旧做法死灰复燃；新的滥行也出现并蔓延开来。乾隆虽然不时斥责前线官员浪费军费、表达对王朝财政健康的关切，^106 但他死后，嘉庆才不懈而反复地痛击前线腐败。嘉庆批评将领们用军费宴饮娱乐、招\"歌童舞女\"（getong wunü），并指责福康安立了坏榜样。他说：\"将领们皆效法福康安、和琳之行径，饮食歌舞，</p>\n<p>在军中饮酒作乐。我很清楚，他们用的是国家的钱来支付自己的享乐。\"^107 他还清楚：京城官员渴望被派往战区；回来时，原先家产微薄者都成了暴发户，许多人赶回家乡用从前线带回的钱置办田产。^108 证据表明，他的话并非夸大。</p>\n<p>然而，现实更加复杂。滥行与侵吞的机会多种多样，有些是公开的，另一些则微妙而隐蔽。文武两套官僚都参与了对战役慷慨经费的蚕食。局外人——如中枢政府的官员与御史——总是认定军费被大量窃取；而局内人——包括一些被派往前线之前自己就是批评者的人——有时却为那些违规滥行辩护，称其必要。多亏嘉庆短暂的前线改革，1799与1800年的一些奏折——尤其是魁伦与广兴这两位直言改革者的——详细揭露了战争财政乃至整个清朝财政制度的漏洞与弊端。还有助于拼出前线腐败马赛克的，是旷日持久的军费审计记录。下文或许不是一幅完整的图景，却包含了这场战役中乱花与侵吞的主要成分。</p>\n<h3>借\"短平银\"侵吞军费</h3>\n<p>和珅被清除后的短暂沸腾期里，御史谷际岐在一道奏折中痛切地哀叹前线腐败：\"数年以来，拨发军费数千万两。前线军中，妇女、绸缎、珠玉等宝物充盈，而士兵口粮却常常短缺。不义之财解送回家时，道路上车马络绎，蔚为壮观，以致有讽刺之言：'与其拨发经费[银锭]，不如直接开写会票（huipiao）[给将领们]。'\"（原文待核，见注释109）^109</p>\n<p>谷际岐说得对：如果相当一部分经费与货物最终被送回将领官员们——他们许多人在北京——家中，那么费那么大劲把数百万两银锭运到战区有什么意义？路途遥远——北京经费到四川要走三个月——姑且不论，运输队通过眉县与汉中之间狭窄曲折的山间栈道尤为艰难。每个木箱装三千两银子，用两根杠子架在一对骡子上，而栈道有些路段两骡无法并行，那些路段就得雇挑夫扛箱，之后再重新装上骡背。尽管辛苦，军费以银锭而非会票解送这一事实，给了前线官员侵吞经费的第一道门户。</p>\n<p>众所周知，不同的秤常导致银子重量的出入。这些出入在清代成了官员灰色收入的一大来源。征税时，知县以\"补足缺耗\"为名征收臭名昭著的\"火耗\"（huohao）。^110 然而，中枢政府向各省发银、经费在各省之间转运时，利用银重出入的机制不同。接收端的官员声称经费短重——或全额声称短缺、或短缺不如所称——便可把一部分银子装进腰包，或放进他们的应急小金库，用于官方预算无法覆盖的项目。所称的重量短缺被称为\"短平银\"（duanpingyin）。当银子的实际重量多于拨发之数时，多出的部分——所谓\"长平银\"（changpingyin）——或可被侵吞，或存为应急金，称为\"平余\"（pingyu），以补充常规预算。^111 白银从京城流向各省、或在省际间流动，此前很少达到白莲教战争这样的规模，因此短平银从未像\"火耗\"那样引人注目。然而，这场战役解运了数千万两，短平银的一个小百分比就意味着巨额金钱——有时，百分比还不小。</p>\n<p>清朝国家努力保护军费在运输交接中不被抽走。它常常派一两名大员加宫中侍卫护送运输队到达目的地——广兴就执行过两次这样的任务。沿途各省派官员护送运输队通过本辖区。省界上，两省官员不开箱称重，在每个箱子上标出毛重。^112 运输队到达目的地时，所有箱子当着参与交接各方的面打开，从每箱中取几锭称重，以确定银锭是否足色。为准确称量，户部通常在运输队中附上自己的秤——所谓的\"库平\"（kuping）。然而，交接时并非每一锭都称重，这给后勤人员以\"短平银\"为名侵吞经费留了余地。</p>\n<p>官面上，经费从户部库等处拨发给战争时，不允许短缺。私下里，后勤人员向军队发饷或采购物资时，可以扣留百分之一作为\"平余\"。^113 然而，这一做法很快在白莲教战争中被滥用。始于湖北。毕沅主持下，胡齐仑把比例从百分之一提高到百分之四，再到百分之八。他在审讯中虽然坚称银子到达湖北时明显短重——即短缺百分之四至八——胡齐仑后来承认：他需要经费犒赏湖北战场的军队，也需要弥补市场采购时市价与《军需则例》定价之间的差额。除那八两外，胡齐仑还从每一百两中另取二两自肥。换言之，经胡齐仑之手的军费，有百分之十以\"短平银\"之名被他扣留。鉴于胡齐仑经手的经费超过四百二十万两，他被捕时家中搜出五万两，他的账册又记录了近十万两非法送给将领的馈赠，他侵吞的总额可能有数十万两。然而，胡齐仑只承认侵吞了近十万两（扣留百分之八军费得七万多两，另扣百分之二得二万九千多两）。^114</p>\n<p>四川战场，1799年魁伦与广兴接管战争财政之前，军费一直被悄无声息地例行以\"短平银\"为掩护侵吞。北京或外省经费一到，就一再宣布短缺。然而，历任后勤主管——福宁、英善与勒保——并不立即奏报短缺。外省解款时，他们也不一贯要求补足差额。通常，北京的经费在神宣驿——川陕大道进入四川的第一个驿站——交给四川的后勤人员。通常，派通判纳山去接款。^115 纳山常常奏报收到的经费短缺，他自己可能也拿了一些。有一次，除所称短缺外，经费到达达州时又蒸发了近八百两。当然，纳山不承认任何侵吞，归咎于所用之秤不准。^116 魁伦接手后，与广兴一道罢免并审讯了纳山，责令他缴还八百两，并请刑部议处。他们还怀疑福宁与石作瑞是同伙，试图掩盖纳山可能的侵吞。^116 魁伦与广兴都离去之后，此案显然不了了之。到1802年秋，纳山仍在主持川北后勤。^117</p>\n<p>经费在四川军需局分发时，除例行扣除的百分之一外，人员在支付运输与其他开支（不清楚是否包括乡勇饷银）时还要再扣百分之二至四，尽管向军队发饷发津贴的经费不这样做。结果，一些领取者本应得一百两、实际只拿到九十五至九十七两。随后，知府知县们在自己辖区分发军费时，如法炮制。1799年神秘死亡的署理夔州知府曹相业，每百两自留三两七钱。他声称从达州局领到的是每百两只有九十八两五钱，实际只发九十四两八钱。有一次，他从达州局领了四万两，就私吞了一千四百八十两。曹相业在夔州任内共经手十八万多两军费。如果按同样的比例扣留，仅此一项他就可能侵吞了六千六百六十两。^118</p>\n<p>然而，魁伦到川之后，从北京或外省解来的经费不再有短缺。此外，三个军需局称重时，经费常常多于拨发之数——也就是出现了\"长平银\"。1799年底，山西拨来的四十万两到达时，全部银锭称重得四十万四千一百五十二两，长出四千一百五十二两。江西的经费也出现了类似情形。^119 1800年初，广兴与托津从北京护送二百万两入川。三个军需局到达称重时，总重为二百零一万一千零九十六两，长出十一万零九十六两……^120 毫不奇怪，从短缺到长余的剧变，恰与四川后勤主管的更换相呼应。这一转变引起了嘉庆的怀疑：此前的短缺或许是伪造的，过去的长余银或许被侵吞了。^121 然而，前线改革流产、魁伦与广兴被除之后，战役余下的岁月里，经费短缺的问题再也没有被提起。^122 很可能，后勤官员继续以\"短平银\"之名悄悄扣钱。</p>\n<h3>将领们的滥行</h3>\n<p>\"短平银\"被扣之后，军费头几年在军需局分发，战役后期则由粮员分发。这一阶段，军队将领走上前台，从军费中取利。他们提出无理请款——被称为\"滥支\"（lanzhi）。后勤人员既无权力也无意愿遏制他们的滥请，便不问缘由地满足其无理要求——被称为\"滥应\"（lanying）。正如乾隆1798年底所描述的：</p>\n<blockquote>\n<p>将领们剿贼已两年有余，已知贼首尚未全获。他们只知索取国帑，然后[向后勤机构]滥请滥支，虚报冒领以自肥。尔等[后勤领导人]一再请拨之国帑，必系将领违例滥支，或粮员曲意滥应，满足其无据之请。^123</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释123。]</p>\n</blockquote>\n<p>将领们的滥行，在1796年国家动员镇压湖北首轮起事时就开始了——那时毕沅主持湖北后勤。毕沅参加过第二次金川之役的后勤，或许早已谙熟利用战时后勤制度漏洞的门道。效法福康安在苗疆战役中铺张花费的先例，毕沅以高于《军需则例》的标准补偿军队、乡勇与民夫，公然挪用军费，并经胡齐仑之手或亲自把不义之银送给将领们。湖北的所作所为成了其他战场省份的标尺。松筠曾抱怨：要一下子削减超额支付与非法福利而不伤军队士气，谈何容易——他指责毕沅开了违反后勤则例的先河。^124 四川方面，领导人们起初遵循\"楚省成例\"（Chusheng chengli）。^125 然而，数年之内数百万两解入四川后，湖北\"成例\"很快被超越。1799年春，福宁为洗清自己，指责宜绵在支付军队、乡勇、民夫与牲口时不合规章，并说自己已把账目与前者的分开——尽管他承认自己任内也发生过违规。^126 随着战争推进，其他省份请求破例时，用的已是四川立的先例。^127</p>\n<p>然而，在军需局，就连虚高的标准也不总被遵守。后勤人员大多由低阶官员、候补官员与衙门书吏组成，任凭军队将领与督抚摆布——后者能影响他们的升迁，也能让他们丢官受罚。^128 因此，后勤人员通常选择满足将领与督抚的任何要求——无论多么无理，也无论是否违规。就连当过总督的福宁，也不敢顶撞将领们——他怕他们以\"贻误军机\"为名追究他。^129 1799年初，时任陕甘学政的宋澍观察到：陕西的后勤官员受将领施压以满足其要求，还不得不讨好将领——唯恐被指责阻碍军事行动。^130 乾隆也认为：战争财政中众多滥行的责任，将领大于后勤人员——\"但将领皆自朝廷派出，故粮员不敢拒绝其超额请款\"。^131 嘉庆同意父亲，但两方都责备：\"将领滥支，主事[后勤]之人不敢诘问。难怪积弊日深。\"（原文待核，见注释132）^132</p>\n<p>战区横跨数省，各省军需局平行、又无一个中央权威统筹，军队很容易钻空子。有时，部队由本省后勤供应。另一些时候，由作战所在省的后勤供应。还有时，补给来自第三省。^133 借此之机，将领们可以从不止一个省请款。1798年夏末，明亮离开陕西赴川三周，据称从陕川两省为其一千八百名士兵共领了十四万五千两。^134</p>\n<p>所有将领中，德楞泰以请款花钱最胆大妄为、最难伺候闻名——不满意就闹。^135 1798年初夏，德楞泰率七八千人入川追击姚、王残部时，一个月内经达州派来的粮员、汉中知府谭光典之手领了九万两。谭光典向其上司英善报告后，案件上报北京，引发军机处对德楞泰开支的调查。军机大臣们审查德楞泰的开销后发现：四万多两的支出违反《军需则例》之规。他们把德楞泰的月开支从九万两减到一万三千九百两，并责令德楞泰缴还超额经费。^136</p>\n<p>然而，德楞泰继续随意支领、花费军费。1799年头几个月，除米外，德楞泰从达州领了三十万两。到1799年夏，十三个半月里，他共支领六十六万一千一百两，其中许多开支不合法。德楞泰及其部将的跟班到粮台领饷领津贴时，没有任何文书手续。^137 然而，勒保为德楞泰辩护，说德楞泰理应多领——他带走了一些部队，麾下最终有一万两千人。事实上，勒保在花钱上超过了德楞泰。十六个月里，他从福宁处领了二百四十三万两（按福宁的说法是二百零五万两），每月超过十五万两。勒保辩称：他领的经费不仅用于自己与五千名士兵，还用于额勒登保等其他将领、所有粮台以及运输费用。^138 嘉庆不信勒保这软弱无力的自辩，此后视勒保为贪腐嫌疑——这在他1799年底决定罢免逮捕勒保时起了作用。</p>\n<p>为自己过度开支辩护时，将领们常常指向部队人数的波动。确实，后勤人员几乎不可能始终核实军队规模——它们不断移动，常常分了又合，还有伤亡与遣返。正如那彦成与台布赴陕途中所观察到的：将领们虚报兵数、以领更多经费，是常见的伎俩，后勤人员通常照数发款。^139 就连目光敏锐的广兴，在达州六个月任期内也从未弄准四川正规军的规模。回京时，广兴向皇帝抱怨：他例行发款的六万多名士兵中，大多数很久不见作战，一些人闲居城镇领饷。然而，大约此时，嘉庆从勒保与德楞泰处得知：四川有两万八千九百多名士兵。如此巨大的出入令嘉庆吃惊，命勒保与德楞泰解释。^140 两人花了几周拼出辩护。把一切可能算作正规军的人都加起来，他们得出三万七千七百四十四人的总数，说广兴的数字把候补兵与跟班算进去了——他们本来也在名册上。知道承认四川正规军更少会导致军费削减，他们论证说：运输费用不随军队规模缩小而下降；每月高达二十万至三十万两。^141</p>\n<p>自1800年初额勒登保以陕南为基地以来，陕西的正规军多于其他战场，其开支迅速上升，最终超过了1800年后战事零散而有限的四川。正如台布1800年初所估计的：陕西每月需四十万两，额勒登保从甘肃返回后则需每月五十万两——一年合计六百万两。^142 1803年初第一次宣布胜利后，只剩几千名起事者，陕川两省的开支仍居高不下。嘉庆震怒，命三省领导人奏报本辖区军队人数、一年来所领军费如何使用、还需多少。为安抚皇帝，额勒登保给出了一些缩水的估计：三个战场合计每月需三十三万至三十六万两（陕西十五至十六万、四川十一至十二万、湖北七至八万）。^143 然而，祖之望随后的一道奏折反驳了额勒登保的说法。祖之望说：陕西的月开支在1802年底遣返一些部队后已从五十万两降到三十万多一点。然而，1803年陕西每月仍需二十五万八千两。^144 直到1804年底最终胜利，陕西的开支据称一直维持在那个水平。</p>\n<p>将领们请求更多经费的另一个常见而方便的借口，是犒赏部队——所谓的\"赏号\"做法。此做法始于18世纪初，乾隆朝晚期被大肆滥用。尽管《军需则例》禁止此做法，一些将领——最著名的是福康安——在18世纪80、90年代的几场战争（包括苗疆战役）中继续花费巨额军费犒军。嘉庆常常指责福康安开创了此做法。为筹钱，福康安还勒索省级官员、盐政与内关税监。^145 尽管嘉庆坚决反对，福康安的门生们——包括额勒登保——仍视犒赏不可或缺。额勒登保承认：他遵循福康安所立先例，犒赏有功士兵与为军队服务的平民，且一向经其粮员请拨此款。^146</p>\n<p>白莲教战争中，犒赏虽然普遍，但发银而非绸缎等物料越来越常见。广兴奏报：以犒赏之名，宜绵、英善、惠龄、勒保与福宁从军费中领了数万两。^147 除自己请款外，将领们还收受地方官员与后勤人员的\"馈赠\"。正如庆成受松筠审讯时所供认的：他不仅收过胡齐仑与毕沅的银子，他到过的战场各省督抚——例如景安、秦承恩与宜绵——都送过他一百至两千两不等的银礼。但庆成坚称：他收到的一切银子都用于犒赏部队——他自己分文未取。^148</p>\n<p>嘉庆虽然不高兴，起初却怕挫伤军队士气而选择沉默。^149 但随着战役似乎接近尾声，他强硬起来。1801年底，额勒登保请求经费犒赏其部队与对零散起事者作战的平民时，嘉庆表达不悦，再次谴责福康安开创此做法——尽管他同意额勒登保可以从他刚拨给陕西的二十万两军费中取十万两作此用。^150 1802年初，在认可并称赞陕西官员捐出\"养廉银\"为部队置办冬衣鞋时，嘉庆裁定：胜利在望，不必再犒赏部队。^151 十个月后，嘉庆七年十月十四日，嘉庆正式禁止此做法——他支持户部\"不得从军费中拨发犒赏\"的裁定，援引乾隆1776年禁止此做法，并重申对福康安的批评。此外，嘉庆提醒将领们：军费审计时不得把犒赏列为军费开支。^152 如第5章所示，嘉庆在财务上的强硬路线，可能无意中助长了战役的拖延——战争领导人们不得不为巨额开支另找借口。</p>\n<p>其他违规行为众多而普遍。1799年初，福宁含蓄地承认：惠龄、额勒登保、德楞泰等将领的许多开支违规。^153 1800年四月，额勒登保把陕西所有绿营兵的战时津贴\"盐菜银\"从每月九钱提高到一两三钱。按《军需则例》，一两三钱是边疆——\"口外\"（kouwai）——的标准，而陕南是\"口内\"（kounei）。后来，额勒登保的幕僚胡世贤请求把绿营兵每日口粮从八合三勺米提高到一升时，军机大臣与户部支持提口粮，但裁定其\"盐菜银\"降回九钱。由于士兵更喜欢多拿现钱而非口粮，陆有仁恳求保留一两三钱的津贴而非提高口粮。嘉庆支持陆有仁的恳求，一两三钱的标准对陕西所有部队实际上成了官方的。^154</p>\n<p>就连改革派领导人也向既成事实低头，不时让步。1799年底，广兴弹劾朱射斗的粮员周国枢：他为朱的部队申请一万两时多请五千两，且两个月没有向军需局报账。广兴允许周国枢留任粮员，但请求褫夺其顶戴。然而，魁伦为周国枢辩护：额勒登保已同意周国枢\"预支\"的请求，周随军行进时没有时间报账。魁伦批评广兴过分严苛、轻率弹劾。^155 显然，麾下一旦有了军队，魁伦再也无法坚持早先的承诺。</p>\n<p>事实上，所有将领都设法最大限度地多领经费——包括以财务操守受称赞的额勒登保。据福宁说，从1798年九月到川到1799年五月，额勒登保八个月间从达州局领了二十七万二千两。同时，勒保声称额勒登保还从他那里领了十六万二千两。以他的军队规模——起初只有三千人，后来超过九千——他的花费绝非俭省。^156 那彦成也被证明是个大手笔。1800年初五十万两军费到达陕西时，松筠把最大的一份——三十三万二千三百多两——拨给了那彦成。^157</p>\n<p>将领们索取超额经费时虽常以\"部队福祉\"为借口，以发饷犒赏之名领来的钱却不总交到士兵手里。1800年初，广兴揭露了这一点：</p>\n<p>\"过去，每次军费解到军营，先支付的是规章所不许的项目，而士兵的津贴与口粮却迟迟不发。随后[将领们]就有了借口：经费已不足清偿欠款。于是士兵忍饥受寒，将领们却以犒军之名支领经费、中饱私囊。到头来，士兵从经费中分文未得。\"（原文待核，见注释158）^158</p>\n<p>讽刺的是，整个战役期间司空见惯的是：士兵与乡勇数月领不到饷银津贴，装备简陋，有时还缺粮——尽管装备他们本不该花太多钱。^159 就连德楞泰的部队也装备不足，许多士兵赤着脚。^160 正如嘉庆所承认的，一些士兵因前线条件悲惨而逃亡回了本营。^161 军队的可悲状态，于是成了将领们向朝廷请领新经费的完美筹码。听了众多这方面的奏报，嘉庆只能哀叹：\"军队开支虽巨，经费却常常拖延不发[给士兵与乡勇]，以致他们缺衣少食地投入行动。\"（原文待核，见注释162）^162</p>\n<h3>借乡勇饷银之名</h3>\n<p>到达州几周后，魁伦就指出了战争中两大开支：雇长骡长夫为军队运送给养（下文讨论）与雇乡勇。^163 最终，据称的乡勇补偿费用超过了雇牲口与民夫的费用，成为这场战争单项最大的开支。数十万乡勇固然确实被雇了，但可以肯定：以他们的名义的开支有相当大的部分是欺诈——雇乡勇是指挥官与地方官员为乱花钱辩护、掩盖普遍侵吞军费的最方便借口之一。</p>\n<p>由于受雇乡勇不受《军需则例》规制，而皇帝1796年初准许补偿乡勇的谕旨又含糊，滥行的空间相当大。湖北与陕西1796年初次使用乡勇时，遵循的是石峰堡战役的先例：临敌雇用的乡勇每日八十文，不在前线的每日六十文——折合月饷分别为二两四钱与一两八钱。然而，由于前线不断移动，很难为某一地区某一时段确定正确的标准。最终，二两四钱的标准被广泛采用，随后又提高到每月三至四两。^164 随着战争推进，乡勇获得更多福利，如口粮、一次性\"安家银\"（通常每人三至五两）、犒赏与抚恤。随征乡勇还被配给民夫——为他们挑给养、做杂务、从战场抬回阵亡乡勇的遗体。这通常以\"夫价\"（fujia）津贴的形式发放。^165 遣散时，他们应当领取安置津贴。在战役漫长的收尾阶段，标准从二至五两大提高到十至十五两。总体而言，乡勇的待遇好于绿营正规军——后者的战时月饷平均约二两（战役期间临时提高到二两四钱）。鉴于优厚的待遇，许多乡勇拒绝入伍当正规兵——当机会摆在他们面前时。只在战争后期，剩余随征乡勇的饷银才降到二两以下，但同时领口粮。1804年，应额勒登保等将领之请，其饷银又提到二两，另加口粮。^166</p>\n<p>然而，乡勇与正规军一样，常常装备简陋、供应不足、饷银不能按时领取。正规军与乡勇之间，后者的饷银更容易被将领侵吞。此外，将领与地方官员虚报乡勇人数多于实雇之数，或虚报服役时间长于实际。乡勇名单本应报户部备案，但户部几乎无法核实：那些名字是否只是\"稻草乡勇\"，受雇日期是否准确。从1800年嘉庆号召更多依靠自愿乡勇以省开支起，很可能自愿乡勇的名字有时被混入受雇乡勇名册以充数。审计中发现：一项\"四川派乡勇赴鄂助战\"的开支申报中，有六百四十五个名字是伪造的。^167 1807年初，嘉庆毫不留情地痛斥此类伎俩：</p>\n<blockquote>\n<p>审计中发现的欺诈，大多是借[雇]乡勇为名掩护滥支。与各省正规军——其名字在营伍名册中——不同，乡勇没有定额，人数可以任意添加。此外，其受雇与遣散没有固定日期，服役长短总是由地方官员按需捏造。这些都无法核查。于是滋生众多欺诈。军队所有无法在审计中获准的不合理或超额开支，都被申报为雇乡勇的花费。^168</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释168。]</p>\n</blockquote>\n<p>另一个欺诈的温床是抚恤。湖北叛乱爆发、乡勇被雇参战后不久，朝廷就批准给阵亡有功乡勇的家属发抚恤。随后，负伤乡勇也被纳入抚恤。^169 1799年春，嘉庆把此福利扩展到所有阵亡乡勇，不论其贡献。他还宣布：打算给此前——战争头三年——死亡的乡勇家属发抚恤。^170 由于核实抚恤申报——通常由将领或官员提出——很困难，这一机会助长了欺诈，包括既从乡勇阵亡所在省的后勤机构、又从乡勇出征的家乡省份双重领取抚恤。^171 同时，抚恤标准不断攀升。最终，达到二十五两——与绿营兵抚恤相同。如果乡勇持有监生头衔或在地方衙门有职位，标准更高（前者三十五两，后者一百两）。最终，此福利还扩展到了非乡勇的死亡平民。1803年初，额勒登保与德楞泰奏请朝廷复议兵部的一项裁定：不给二百七十多名阵亡、或立功后病故、或负伤的\"民壮\"（minzhuang）发放伤亡抚恤，而让将领们自掏腰包犒赏。兵部的理由是：他们不是乡勇。然而，额勒登保与德楞泰辩称：那些\"民壮\"承担着与乡勇相同的任务。嘉庆让步了，命给所有死伤的\"民壮\"以及此后病故者发放恤赏（xushang）。^172 对无家属领取抚恤的阵亡乡勇，按每人二两发放所谓\"致祭银\"（zhijiyin）给其军中上司，由上司祭奠死者。^173 毫无疑问，这些钱落入了那些军官的腰包。</p>\n<p>1804年初，兵部颁布了乡勇抚恤新规，把阵亡乡勇分为三类、分级抚恤。守城守镇者以及参战或随军行进者——如果杀贼众多——按阵亡正规兵标准抚恤。如果杀贼不多或功绩无凭，只领正规兵抚恤的一半。保卫村庄堡寨而死的平民没有金钱补偿，但其名字将入\"昭忠祠\"（zhaozhongci），事迹送翰林院立传。^174 然而，吴熊光抱怨：谁杀贼多、谁没杀，无法确定——因为一些招募率领那些乡勇的官员后来也在冲突中死了。湖北方面，到1804年夏，八千一百一十三名阵亡乡勇已按正规军标准获得抚恤——经兵部批准。加上一千三百五十四名负伤乡勇的抚恤，共发四十万一千六百八十五两五钱。然而，湖北还有八千四百多名乡勇伤亡（阵亡六千四百五十九、负伤一千九百四十一）等待报部。担心新规阻碍其抚恤获批，吴熊光建议给所有死伤乡勇每人发二十五两。吴熊光的修正案获中枢政府与皇帝批准，实际上废止了兵部早先的规定。^175 然而，湖北申报的近一万八千名伤亡中，到1803年只有八百六十七名（阵亡七百一十一、负伤一百五十七）得到核实。阵亡者远远多于负伤者，也令人生疑。^176</p>\n<p>战役早期，将领们选择不上报乡勇伤亡——乾隆与嘉庆都为此斥责过他们——而战争结束前不久，这类申报却激增。很可能，领取抚恤的机会促成了这种激增。一些方志中极长的名单，通常抄自这场战争阵亡者纪念祠的碑文。显然，一些假名被混入其中。^177 伪造乡勇伤亡虽然帮了将领与官员，真正死伤者却不总得到抚恤。1804年，湖北孝感一名乡勇之子赴京申诉：他父亲组织乡勇、1796年阵亡，家里至今分文抚恤未得。^178 1811年，常明接替勒保任四川总督后不久奏报：1797至1799年间四川三千多名死伤乡勇应得的抚恤没有送到其家属或本人手中。^179 很可能，勒保挪用了、或侵吞了这笔钱。</p>\n<p>为刹住不受约束的——真实或伪造的——雇募，1799年夏，四川后勤官员规定：较大的州县最多雇两千名乡勇，较小的最多三百至一千名。这些定额此后似乎被其他省份采纳，但注定难以执行。因为让几千名乡勇留在名册上是维持银流流向自己的方便办法——每月可抵数千两——许多知县拒绝裁减乡勇。1800年初，川北南部县知县突然拒绝魁伦与广兴\"把该县乡勇从二千五百多名减到一千名\"的要求。此外，他还请求经费供养全部二千五百名乡勇。广兴虽想驳回请求，魁伦却倾向于拨款——担心被裁乡勇半年生计无着会闹事。广兴被说服了，给知县拨了一万二千二百两，但附信让他裁减。知县收了钱，却无视广兴的信。不久，他又提出请款，促使广兴把此案奏报皇帝——希望皇帝支持对知县的处分。然而，被嘉陵江前线的溃败压得喘不过气的嘉庆，刚把对受雇乡勇的立场从不赞成转为全力支持。嘉庆反而训斥广兴过于挑剔。^180</p>\n<p>1801年春，一小股叛军侵入甘肃东南时，甘肃二十多个县雇乡勇守城镇。警报虽只持续了几个月，开支却不小：约三万九千五百两用于支付那些受雇乡勇。如表7.4所示，六个县雇的乡勇超过定额，且全部按每日八十文的高标准支付。后来认定：总额二万九千七百三十四两中，约五分之一是超额的。^181</p>\n<p><strong>表7.4　1801年（二、三月）甘肃超额雇用乡勇</strong></p>\n<table>\n<thead>\n<tr>\n<th>州县</th>\n<th>定额（人）</th>\n<th>实雇（人）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>秦州</td>\n<td>2,000</td>\n<td>4,000</td>\n</tr>\n<tr>\n<td>清水</td>\n<td>1,000</td>\n<td>2,000</td>\n</tr>\n<tr>\n<td>陇西</td>\n<td>1,000</td>\n<td>1,300</td>\n</tr>\n<tr>\n<td>平凉</td>\n<td>1,000</td>\n<td>1,200</td>\n</tr>\n<tr>\n<td>西和</td>\n<td>300</td>\n<td>1,000</td>\n</tr>\n<tr>\n<td>隆德</td>\n<td>300</td>\n<td>1,000</td>\n</tr>\n<tr>\n<td>总计</td>\n<td>5,600</td>\n<td>10,500</td>\n</tr>\n</tbody>\n</table>\n<p>资料来源：NGDK, 109909.</p>\n<p>即使在战役最后阶段——在逃叛军只剩几千、继而几百人时——以乡勇饷银之名的开支仍相当可观。四川雇乡勇发饷持续最久——从1796年秋到1805年春。^182 四川蓬溪县——除1800年初外并非热点——共花七万四千六百七十五两补偿乡勇。^183 达州方面，尽管1800年底恢复太平，1803至1805年间与乡勇相关的开支仍达二十五万两。^184 然而，1805年四月——四川最后一批乡勇被裁两个月后——勒保与德楞泰仍试图从他们身上取利。在战后重建提案中，他们请求中枢政府拨款，支付欠士兵与前乡勇的饷银。这一次，军机大臣与战役的两位前将领额勒登保、明亮否决了提案——理由是它可能招来欺诈性申报。^185</p>\n<p>额勒登保主持下，陕西支付乡勇的开支也不俭省。如表7.5所示，兴安府1800至1805年间花了近二十五万两支付乡勇——尽管1801年中以后那里没有发生过严重的战事。陕南方面，1800至1805年支付地方防务乡勇的总费用为九十二万二千二百零五两。同时，如表7.6所示，包括额勒登保在内的陕西清军将领以\"支付所辖随征乡勇\"之名申报了七十九万三千三百九十六两。^186 加上地方政府支付乡勇的钱，陕西战场战争漫长尾声的总花费超过一百七十万两。</p>\n<p><strong>表7.5　1800—1805年陕西兴安府雇乡勇的费用</strong></p>\n<table>\n<thead>\n<tr>\n<th>兴安府属</th>\n<th>金额（两）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>兴安府（知府直辖）</td>\n<td>42,530</td>\n</tr>\n<tr>\n<td>安康</td>\n<td>46,462</td>\n</tr>\n<tr>\n<td>旬阳</td>\n<td>33,888</td>\n</tr>\n<tr>\n<td>平利</td>\n<td>18,391</td>\n</tr>\n<tr>\n<td>紫阳</td>\n<td>27,427</td>\n</tr>\n<tr>\n<td>石泉</td>\n<td>27,376</td>\n</tr>\n<tr>\n<td>白河</td>\n<td>34,668</td>\n</tr>\n<tr>\n<td>汉阴</td>\n<td>18,502</td>\n</tr>\n<tr>\n<td>总计</td>\n<td>249,284</td>\n</tr>\n</tbody>\n</table>\n<p>资料来源：NGDK, 56763-001.</p>\n<p><strong>表7.6　1800—1805年陕西将领申报的雇乡勇费用</strong></p>\n<table>\n<thead>\n<tr>\n<th>姓名</th>\n<th>职位</th>\n<th>金额（两）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>额勒登保</td>\n<td>战役经略大臣</td>\n<td>402,188</td>\n</tr>\n<tr>\n<td>庆成</td>\n<td>总兵、提督</td>\n<td>79,765</td>\n</tr>\n<tr>\n<td>刘之仁、杨芳</td>\n<td>宁陕镇总兵</td>\n<td>123,896</td>\n</tr>\n<tr>\n<td>胡定泰</td>\n<td>河州镇总兵</td>\n<td>43,179</td>\n</tr>\n<tr>\n<td>穆克登布</td>\n<td>太原镇总兵</td>\n<td>144,368</td>\n</tr>\n<tr>\n<td>总计</td>\n<td></td>\n<td>793,396</td>\n</tr>\n</tbody>\n</table>\n<p>资料来源：NGDK, 4724.</p>\n<p>1806年审计期间，湖北向户部报告：战争头三年，为三十六万六千七百多名乡勇花了四百七十多万两白银与二十三万多石米。嘉庆听取简报后，忍不住反驳这些数字\"显然系捏造\"。他于是裁定：四川与陕西先行自我审查、把数字砍到合理水平，再提交乡勇费用申报供审计。^187 然而，四川提交户部审计的数字仍令人咋舌。虽然没有全省总数，一项申报开列：头三年四川太平厅与开县共花三十二万七千六百二十二两支付乡勇，达州的总费用为四十六万七千六百九十七两。三地合计申报近八十万两。^188 以四川此期雇乡勇的规模——超过三十四万——总费用必定不比湖北低多少。^189</p>\n<p>如1808年审计所揭示的，与乡勇相关的费用总计超过两千万两。^190 这个数字可能是各省砍掉一些露骨欺诈申报、审计者又驳回更多之后的\"净化版\"。然而，两千万两仍惊人地巨大——约占拨往战区经费总额的百分之二十二。嘉庆震怒，拒绝认可这笔开支，认为它过滥。然而，要准确评估两千万两中有多少被非法花费或侵吞，几乎不可能——就连审计者们经过数年的核查、统计与造册，也无法确定。因此，嘉庆命战场各省参与后勤系统的官员缴还：随军作战的随征乡勇所报费用的百分之十，参与战事之地防守乡勇费用的百分之二十，远离战事之地乡勇费用的百分之三十。四川方面，应缴还者超过一百七十一万七千两白银与约八万石粮的价值。^191 但对任何战场省份涉及雇乡勇发饷的人，都没有采取纪律或法律行动。</p>\n<h3>长骡与长夫</h3>\n<p>正如魁伦1799年所指出的，与乡勇费用并驾的另一项巨额开支，是雇\"长骡\"（changluo）与\"长夫\"（changfu）为军队运粮运物。^192 按《军需则例》的规定，牲口主要由粮台用于运输粮食、军服与弹药，按里程付酬。所有军官、旗兵与绿营骑兵都有权拥有骑乘马——所谓\"例马\"（lima）——并领\"马干\"（magan）——养马津贴。军队出征时，本应使用那些\"例马\"，只在途中与战区领草料。没有例马的部队，只允许在赴集结地途中雇牲口或民夫挑运行李；牲口与民夫的数量按行李重量定。军队到达目的地后，每一百名满洲兵配五十名跟役，每一百名绿营骑兵配三十名余丁（yuding）与二十名随营夫（suiyingfu），每一百名绿营步兵（shoubing）配三十名民夫。^193 这样，本无必要另雇牲口或挑夫。因此，\"长骡\"与\"长夫\"都不在《军需则例》之内。</p>\n<p>然而，现实并不如此简单。清军两支力量——八旗与绿营——的例马数量自乾隆朝晚期起急剧下降。由于经济压力，许多军官骑兵卖掉了马，却继续领马干作为额外收入。出征时，他们不得不四处找马。结果，军队不得不雇马与其他牲口，去做本应由自己例马承担的工作。第二次廓尔喀之役中，马与其他牲口的花费远超所许——这是那场战争开支高昂的主要原因之一。^194 1795年湖北军队调往苗疆战役时，毕沅动议修改规则：给每一百名绿营步兵配三十名余丁，与绿营骑兵相同。户部批准了。^195 然而，苗疆战役中的将领们雇了超过允许数量的马与民夫——因为本该有例马的人员没有把马带到前线。结果，许多人两头吃——既在家乡本营领马干，又在前线领雇马雇骡的钱。同时，战役中雇的民夫也超过允许数量。开支申报提交户部审计时，目光敏锐的和珅察觉了滥行，在他自己倒台前不久逐一驳回。^196</p>\n<p>白莲教战争中，雇长夫在冲突一爆发就开始了。1796年春，宜绵前往商南、试图阻止叛乱从湖北蔓延到陕西时，陕西布政使姚学瑛雇民夫修秦岭的道路，并雇了数千头长骡向商南运输给养。^197 河南方面，景安1796年底雇了数千头骡与骆驼为军队运送给养。^198 1796年春，孙士毅率数百名四川兵前往川鄂边境时，也雇了数百名长夫。^199 湖北方面，战争进入第二年之前，汪新就雇了长夫随军行进。他付他们每月六两银子、三十升米。在粮台之间运粮，汪新倾向于减少民夫数量、用省下的钱提高剩余民夫的工钱，同时多雇牲口——因为一头健骡能驮两倍于一名民夫的重量。^200</p>\n<p>多用牲口的理由虽然是省钱，战区却不盛产骡马。汪新与景安都不得不派员到邻近地区与其他省份采购。^201 自然，高需求低供应推高了价格。很快，购买或雇用牲口都比用人便宜不了多少。但这没有阻止将领们使用它们。1797年初宜绵入川时，带去了长骡。1797年夏清军追击襄阳起事者入川时也如此，但价格已飙到每骡每月十五至十八两。由于每百名士兵据说给五十头骡，而四川有约两万名士兵，需要数万头骡。即使价格后来降到每月十二两，仅此一项每月就要花十二万两。</p>\n<p>鉴于巨大的花费与公然违规，后勤人员抱怨并试图削减长骡数量。然而，已成为战役统帅的宜绵为此做法辩护，拒绝接受后勤人员的提议——给每百名士兵十头长骡或二十名长夫——他认为骡数不足以服务部队。最终达成妥协：每百名满洲旗兵配二十五头长骡，每百名绿营兵配二十头骡或三十名长夫。民夫月付三两、口粮三十升米；雇长骡每月可花九两，赶骡者不领口粮。^202 仅此一项开支每年就可能有数百万两。</p>\n<p>然而，就连妥协也没有被遵守。1798年夏明亮在川三周的巡剿中，他申报了一万五千五百零三两——用于雇两千二百多名民夫（月付三两）与一千三百多头骡（每月十两八钱至十二两）。^203 德楞泰同样大方。十三个月里，他的部队据称在骡与民夫上花了二十二万六千九百六十多两。他虽然没有超过旗兵的骡数标准，却据称给每一百名绿营兵四十名、而非三十名民夫。此外，他的军官、幕僚及其跟班都配了民夫，他还另雇骡与民夫运送大炮与弹药。与受雇乡勇——其名单须报户部备案——不同，受雇的民夫与骡不受任何规制。更具体地说，军需局并不直接雇他们，只是按将领请求发款，然后由后者自行雇民夫或雇骡。很可能，这笔开支的很大一部分变成了将领们的战时外快。正如魁伦所揭露的：每次军费到达，长骡长夫的费用立即拨给军队，而士兵的饷银总被拖延。^204 就连勒保也承认：此做法自陕鄂创始起就被滥用（为了把批评的矛头从自己身上引开）。^205</p>\n<p>或许指望与和珅的关系，勒保采取了不同的方式把自己从则例中解放出来。到川之后，</p>\n<p>1798年初到川后，勒保让英善与福宁草拟了一份开支清单——不在《军需则例》之内、却\"绝对必要\"。1798年夏，勒保与福宁把它提交户部，请求把所列开支批准为《军需则例》的修订。然而，和珅逐项驳回，并坚持：则例中的规则本应满足军队的需要，另雇长骡长夫是多余的。裁定到达四川时，勒保抱怨和珅的一些决定\"断难遵行\"。他只是把户部的答复分发给各军需局与粮员，却没有督促他们照办。因此，尽管中枢政府明令反对，四川继续雇长骡长夫。^206 和珅死后，四川更闹腾了，抱怨运输费用飙升——因为躲避叛军绕路，民夫工钱不得不提高。1799年夏，勒保与福宁向户部呈上一项提案，请求批准给每百名士兵雇二十头长骡、每骡每月九两。然而，嘉庆警告他们：如果和珅已驳回他们所请的修订，户部不会撤销和珅的裁定。^207 勒保第二次让长骡长夫合法化的努力失败了。</p>\n<p>短暂的前线改革期间，这个问题成了魁伦与额勒登保公开而激烈失和的导火索。额勒登保论证说：则例配给军队的民夫与余丁不足——只够挑装备弹药，没有民夫挑军服行李——于是给每百名士兵配四十名民夫。此外，他让粮员李鋐雇了五百头长骡，执行\"长运\"（changyun）。这支驮队由一名知县率领，每骡每月九两七钱。^208 魁伦清楚这些雇募是最被滥用的做法之一，却承认：由于起事者的游击战迫使军队不断移动，一些长骡或许确有必要。然而，他仍不认为额勒登保在增加长夫之外另雇五百头骡、且每骡付价甚至高于勒保所请的每月九两，是合理的。奏报此事的奏折中，魁伦提议保留此做法——因为苗疆战役中曾出现并获认可——但降低牲口的费率。然而，嘉庆愤怒地彻底拒绝了此做法，说苗区是边疆，而川陕是腹地。他尤其恼火的是：费率竟比勒保治下还高——怀疑魁伦被后勤人员蒙了，他们用这个名目掩盖侵吞经费或填补早先舞弊造成的账目窟窿——但他完全没有责备额勒登保。^208 在朝廷与将领的双重压力下，魁伦试图找中间道路。他与在此问题上看法一致的广兴提议：允许每百名绿营兵——骑兵步兵一样——雇四十名长夫，每夫每月二两四钱。按此标准，四川全部军队每月需五万二千八百两，一年六十三万两。军队可以用这笔钱或雇挑夫、或雇骡。他们论证说：虽然数字超过了《军需则例》的规定，但与勒保、福宁\"每百名士兵二十骡、每骡月九两\"的方案相比，开支从每百名士兵一百八十两砍到了九十六两。同时，他们提议遏制旗兵与军官的两头吃——把他们的例马津贴减半，把付给他们雇马雇骡的钱——所谓\"驮折\"（tuozhe）——减半。以赶骡者在前线面临的危险为由，他们与皇帝讨价还价：把每骡每月费率从则例规定的四两五钱提高到九两，把粮台间运粮牲口的费率从户部裁定的每匹一钱五分提高到三钱。两人警告：他们所提的是底线，再低会有不良后果。两位改革派官员转向要求对规章的妥协，必定影响了皇帝——他这次让步了：同意每百名士兵四十名长夫，也同意关于旗兵军官马匹福利的妥协。然而，他没有正式修订《军需则例》，只说：军费审计时如果户部驳回那些开支的申报，他会亲自干预。^209</p>\n<p>就这样，皇帝一边试图预防中枢官僚的批评，一边安抚战争中的将领们。事实上，嘉庆对魁伦—广兴建议的决定，实际上确认了旗兵与绿营军官的一项新战时福利。它被称为\"驮折夫价\"（tuozhe fujia）或\"驮折夫马\"（tuozhe fuma），很快被所有战场省份采纳。^210 以\"驮\"（字面义为骆驼，这里泛指驮畜）代替\"马\"，费率被大幅提高——因为雇骡的价格远高于马。然而，没有任何机制核实旗兵与军官这两个群体是否用经费雇了驮畜，更不用说所提议的削减是否落实。^211 战争余下的岁月里，据称的民夫与驮畜费用持续居高不下。督抚们不时请求提高民夫工钱与雇驮畜的费率。^212 1800年秋，勒保与德楞泰声称：四川运输给养的费用每月二十万至三十万两——超过四川所有已部署部队的饷银。^213 倭星额与邱兴健1801年中在前线视察后提出建议时，承认运输费用高于物资本身。然而，他们认为高费用有前线的紧急与危险作某种程度的辩护。^214 这两位钦差很可能被前线将领与地方官员游说、甚至贿赂了，自愿替他们说话。</p>\n<p>直到战役收尾阶段，各战场领导人才着手削减给军队的额外津贴，包括\"驮折夫价\"。^215 令人惊讶的是，现存军费审计档案中涉及\"长骡\"或\"驮折夫价\"的案例如此之少。换言之，审计所反映的军费，并不印证魁伦1799年\"雇驮畜与民夫是战争两大最昂贵开支之一（另一是雇乡勇）\"的观察。可能嘉庆没有兑现\"让户部给那些项目开绿灯\"的承诺。结果，参与战争后勤的各方不得不四处寻找正当开支——这可能造成了乡勇相关费用的虚高。</p>\n<h3>地方政府从中取利</h3>\n<p>与\"军费主要用于支援军队\"的普遍认知相反，白莲教战争中军队的消耗——包括将领们的侵吞——只占战争总成本的较小部分。军费的更大部分，被战场省份各级地方政府抽走。一定程度上，清朝财政制度的设置助成了这一结果。1796年白莲教战争的爆发，恰逢庆祝乾隆退休的普免钱粮开始——蠲免要在三年内完成。湖北、继而四川、陕西起事爆发后不久，朝廷就给受战事影响的州县蠲免、减免或缓征赋税。随着战役推进，一些地区反复获得税收优惠。^216 一些州县因蠲免缓征失去了整整一年或更久的收入，其省政府也损失了一部分收入。总体而言，清朝政策对\"地方政府因灾荒或蠲免蒙受收入损失时可以怎样弥补\"含糊其辞。^217 由于中枢政府不提供任何补贴，地方政府不得不从一切可能的来源搜刮钱款，包括向省藩库\"借\"、向当地商人及其他居民\"借\"——尽管皇帝严格禁止他们勒索百姓。白莲教战争两三年后，战场省份的府库空了；省级官员大声而频繁地抱怨。^218</p>\n<p>战区地方政府虽不因参与战役而领一笔总款，地方官员却可以就战争相关项目——包括雇乡勇与驮畜——向后勤机构请款。每次军费到达，官员们就涌向军需局，报销他们已花的钱、为其他项目请款。然后，他们轻而易举地把军费挪用于日常开支，如官员俸禄、\"养廉银\"津贴与驻军饷银——包括未被调往战争的驻军。^219 1798年夏，解释湖北军费为何消耗如此之快时，景安与高杞向朝廷坦言：湖北受叛乱影响的州县，因赋税被蠲免缓征、无钱可用，全靠军费维持日常运作。^220 1799年底，勒保奏报：供养战役中正规军与随征乡勇的费用并非最大的军费开支。相反，分发给地方官员、由他们花掉的军费才是巨大的。勒保虽开列了一些战争相关开支——如雇民夫驮畜向军队运物、支付各粮台人员的工钱、制造军服弹药——却承认：军费也被用于满足所有州县的需要。他指出：省藩库已空、四川一半以上的赋税已蠲免、关税与盐课收入低于往常，声称：\"[我们]入不敷出。不得不挪用军费支付军队饷银、官员俸禄与'养廉银'，以及供养驻藏与川藏大道沿线军队的开支。\"（原文待核，见注释221）^221</p>\n<p>1799年底魁伦一到四川，就观察到了这一现象。除证实其他人的奏报外，魁伦还揭露：解到成都的军费最容易被挪用。正如他所说：\"官员俸禄与军队饷银，皆从成都军需局所存[军]费中支放。因此，军费虽被使用，却被用于支付本省开支，与战役需要毫不相干。\"（原文待核，见注释222）^222 由于三个主战场省份都在省城——武昌、西安与成都——设了一个军需局，省政府取用军费很方便。四川方面，头几年大部分军费解到达州，但解往成都的经费数量也不小。1800年初叛军渡嘉陵江后，随着战场西移，更多经费解往成都。^223 托津深知给成都过大的财政余量有隐患，警告成都局人员把战争后勤与地方事务划清界限、不得用军费支付日常事务。川西恢复太平后，托津指示成都把一些经费转送达州，但命令是否被执行不清楚。^224 然而，勒保撤销达州、保宁两局、把战争财政集中于成都后，四川挪用军费就更方便了。战争余下岁月里到达的经费虽仍在成都、达州、保宁三处分发，成都领到的份额越来越大。^225 陕西方面，西安军需局有独一无二的取用经费机会——北京解往战区的所有经费都要经西安。有时，西安局截留拨给其他局的经费。^226</p>\n<p>尽管嘉庆不断告诫\"军费只能用于军队、不得用于地方事务\"，战场省份的军费总是一到就快速消失。^227 当然，挪用侵吞军费不只限于省级。正如广兴1800年初所指出的，各级政府——省、府、县——都急于从军费中取利。^228 事实上，府、厅、州、县官员可能更咄咄逼人。众所周知，帝制晚期的知县俸禄微薄、衙署人手不足，职责却无所不包、大体繁重。人们常道知县通过摊派附加费盘剥百姓以补经费，但他们仍难收支相抵。^229 然而，当他们受命处理临时任务——如战时任务与上司或中枢政府发起的公共工程（例如水利工程与赈灾）——时，知府知县可以接触到从外部拨来的经费——数额通常远大于他们微薄的常规预算——这使此类场合成为经费不足的地方官员的财政机会，尽管他们的职责成倍增加、日常变得复杂。</p>\n<p>白莲教战争期间，战区地方政府全都卷入军事与后勤运作，因而能接触到异常巨额的军费。除被招募进后勤系统的地方官员与书吏——或在军需局工作、或随军——外，其他地方官府人员也被责成向战役提供各种服务与协助。与后勤系统中任上司与将领摆布的人不同，留在本辖区的知府知县在利用战役上拥有更多自由与余地。鉴于这场战役地方社会卷入之空前，先例与规章不足以指导后勤人员应对涌上门来索款的知府、知县及其爪牙。被战时责任所鼓舞、所赋权，知府知县若得不到所请，就威胁要弹劾后勤人员贻误军机。通常，后勤人员屈服于他们的要求，每次不核实申报就发数万两。正如广兴所揭露的：\"四川如今普遍存在奸猾府县官员从军费中牟利的现象。军需局若不满足其请，他们便[威胁说]军需局搅乱其辖区，要报总督。若给了经费，他们便随意花用，借口支援战役而早有的亏空。\"（原文待核，见注释230）^230</p>\n<p>广兴一再告诫后勤人员认真履职，警告要弹劾任何违规者。然而，他的话被当作耳旁风，毫无改进。1800年初，直言敢谏的广兴把三起严重滥行案件提请嘉庆注意，为他打击前线腐败的圣战争取皇家支持。事实上，广兴嘉庆五年正月十四日的奏折，是现存唯一详细提供府县两级军费滥用丑闻信息的档案。^231</p>\n<p>第一个被弹劾的是夔州知府严朝标。1799年夏末上任三个月，他就从达州军需局领了十四万多两——尽管他负责供应的只有驻扎夔州城的七十五那几千人，而夔州东部几乎无战事。夔州开支之不成比例令广兴震惊，他劝严朝标谨慎节俭。严朝标不听，两个月内又从达州请了四万九千两，使其所领经费总额超过十八万九千两。然而，严朝标并没有支付本府乡勇的饷银。据广兴说，原来严朝标用这笔钱填补夔关税额的亏空——他把所收关税侵吞了。严朝标不否认侵吞所收关税，却辩称：关税用于供养成都驻防旗兵，所以必须补上——即使用军费。^232 作为长江进入四川的门户，夔关的关税年额为十八万三千七百四十两。但1799年只收了十一万三千四百四十两——战争使过夔州的商旅减少。^233 然而，到1800年底，七万零三百三十七两二钱的亏空仍未结清，^234 这意味着严朝标没有说实话——那十八万九千两军费的去向另有别处。有意思的是，严朝标的前任曹相业——借\"短平银\"侵吞军费者——在被查办、死于回重庆途中之前，一直留在夔州\"协助\"严朝标处理财务；曹相业在此案中可能扮演了什么角色，不清楚。^235</p>\n<p>第二起涉及阆中知县李元。阆中地处川北战区的边缘，也是保宁府治所在，就在保宁军需局门口。有时，李元一边当阆中知县、一边受雇于军需局——战役期间地方官员身兼两任是常事。到1798年底，李元已从保宁局领了二十九万多两——是阆中这种规模的县衙年度预算的一百五十多倍。广兴赴达州途经阆中时，查问经费用途。李元拿不出一份可信的逐项开支账目。广兴立即写信给魁伦，请查办该知县。广兴上奏时，魁伦尚未审理此案。然而，保宁的一名署理道员向广兴报告：李元处理军费的方式并没有改。^236</p>\n<p>第三起的主角是广元署理知县马鸣銮——广元也属保宁府。马鸣銮1799年八月署理知县——许多知府知县被吸纳入后勤系统，其衙署常由他人代理。1799年底，额勒登保在该地区作战时，让马鸣銮雇骡为其部队运送给养。额勒登保离开后，马鸣銮裁掉了一些雇骡——因为广兴警告他遣散所有骡。然而，马鸣銮请求准许把仍在服役的骡转为衙门\"长骡\"，用军费按每骡每月九两支付。马鸣銮辩称：本县已在战役上花了一万多两，他想用军费弥补衙门的财政缺口。广兴认为这是滥用军费，还奏报马鸣銮的账目含混、有无法核实的项目。^237 事实上，雇\"长骡\"并不限于军队。战场省份的后勤人员与地方政府都采用了此做法——它成了一些官员扩大财政余地或中饱私囊的方便借口。</p>\n<p>带着批评魁伦\"处理滥行态度松弛\"的弦外之音，广兴提议：责令这三名官员到达州，在达州军需局接受全面查账。即便他们不曾侵吞军费，也应责令缴还非法或超支的那部分经费，广兴坚持。^238 嘉庆批准了这些行动，指示魁伦查办各案——如果广兴所报属实，予以必要惩处。然而，此后不久的嘉陵江危机改变了嘉庆的优先次序。魁伦很快被清除，广兴被召回。三名官员谁也没有受到任何惩处。^239 战役余下的岁月里，无论将领还是后勤官员，谁都没有再呈上堪与广兴相比的揭发——尽管滥行肯定在继续。</p>\n<p>战区地方政府必须拿出正当开支以通过审计。除支付乡勇与运输给养外——这是滥行与侵吞最方便的掩护——还有几项开支也被用于此目的。其一是购粮补充已空的常平仓。地方政府确实从市场购粮——或供军，或补仓。^240 然而，在四川，这是把一大部分军费解往远离前线的成都军需局的主要借口。1799年接手指挥后不久，嘉庆就对四川\"用军费购二百万石粮\"的请求表示怀疑，认为这是侵吞经费的隐蔽方式。^241 即便他派去的新领导人在位，他的警惕仍在继续。</p>\n<p>1799年秋，二百万两军费从北京到达时，魁伦与福宁指定其中一百万两解往成都局，用于全省补仓。但广兴皱眉了——他怀疑所购之粮不会用于战役军队，疑心这只是为维持粮仓储备定额——在他看来这是侵吞。^242 嘉庆赞同广兴，裁定军需优先，尽管他说理解魁伦的用意——他必定担心：不给钱补仓，知县就会向纳税人摊派。此外，嘉庆怀疑补仓可能是地方官员为战后通过审计而自保的方案之一——他们需要为所有被抽走的经费提供理由。^243</p>\n<p>然而，嘉庆选择了向四川让步——他拿不准自己判断的毛病再次占了上风。他先拨五十万两给成都购粮，又拨二百万两给四川作军费。^244 魁伦与广兴大喜过望，立誓所购之粮确实供军（他们奏报林俊已向商人征购粮食、正等款付账），并保证不把军费开支与省费混在一起。广兴立场出现了有趣的变化：他加入魁伦，恳请解九十万两到成都——因为五十万两不够，成都局除补仓外还承担众多任务。^245 尽管他们作了承诺，四川的许多粮仓——尤其是战场附近者——在战役余下的岁月里一直空着。^246</p>\n<p>地方政府使用的另一个方便借口，是赈济流离平民。整个战役期间，随着战事蔓延、以及某地恢复太平之后，地方政府都请求赈济经费，为流民提供粮食、住所与农事援助——如种子、耕牛与农具。^247 然而，实际做了什么是很难核实的。1799年春末，二百五十万两到达四川时，勒保指定其中五十万两作赈济。他开列了川东、川北三十多个最急需赈济的地方。勒保计划：用十万两供养从叛军处逃出的难民，四十万两为那些地方最贫者提供两个月口粮。他将挑选以\"清廉\"著称的知府知县，让他们甄别最贫困之家、发放赈银。其余居民，如勒保所解释的，得等新经费到来——他刚向朝廷又请了五十万两。如果五十万两只够选定人家撑两个月，这项工程的总花费将极其巨大。更具体地说，很难确认所有地区最贫困之家是否都领到了钱。嘉庆对勒保的提议大为光火，谴责勒保用赈济掩盖可能的军费侵吞。^248 魁伦与广兴到川后，也对勒保赈济工作的可信度表示怀疑。^249 然而，他们在达州短暂停留期间没有机会调查。</p>\n<p>然而，赈济不能拖延——皇帝不断强调安置流民的重要性，以釜底抽薪、断叛军兵源。^250 勒保复职回川后，继续施压，为此项工作争取更大余地。1800年底一份引起争议的提案中，勒保坚持每天向流民提供食物与现钱，把福利扩及无户籍的外省客商客农。1799年春，中枢政府已拒绝向客民提供赈济。嘉庆这次虽选择不那么严厉——前线改革夭折后，他再无整顿战争领导层的意愿——却把\"客民问题\"的决定推迟，把提案送户部审议。^250</p>\n<p>赈济平民的一个久已有之的办法，是以工代赈方案。政府不向受赈者发钱发粮，而是招募他们参加建筑工程、付给工钱。白莲教战役中，毕沅1797年初首次使用此法；他招募难民与失去生计的当地居民修筑樊城城墙。毕沅估计总费用在十万至二十万两之间，计划先用军费、再以变卖叛军财产所得偿还湖北军需库。显然，这是地方官员充实账本的机会。更具体地说，毕沅让不是别人、正是胡齐仑监督这项工程。^251</p>\n<p>漫长战役早期，这一方案不常用——或许因为地方官员还有</p>\n<p>其他许多从军费中取利的途径。直到1803年早春，此法才再次被援用。如第5章所述，额勒登保提议从军费中拨四十万两，雇用被遣散的乡勇修城筑堡。嘉庆被这提案激怒，毫不留情地痛斥额勒登保：干预民政、把遣散乡勇留在名册上以制造请款借口、拖延战争。尽管嘉庆愤怒，此方案在战役尾声及战后可能被战场省份广泛使用。除筑堡修墙外，地方官员还掀起了一波小型工程：修缮或新建城墙、衙门、寺庙、祠堂与书院。^252 实际需要之外，那些工程暂时缓解了安置骤失生计的乡勇与军事民夫的负担，也让许多官员——尤其是来到战区后勤网络服务的候补者——有事可做。最重要的是，那些工程为地方官员提供了急需的借口，为其辖区消耗的大量军费辩护。尽管如档案所称，一些工程部分由官员与居民捐资，其他经费——很可能是军费——也会被用上。</p>\n<h2>难有对策</h2>\n<p>如果说文官系统在太平时期盘剥其治民、为其衙门与自身攫取额外收入，那么战时，当中枢政府拨来巨额经费时，它盘剥的就是国家。对军人而言，战争是向国家夺取外快的最佳时机——他们收入的双重结构保证了这一点。当然，还有其他欺诈有待发掘，也还需要更多量化工作来分析上述现象。然而，可以稳妥地得出结论：所拨军费的很大一部分——很可能超过一半——被不必要地、非法地花费，或被文武各级官员侵吞。判处胡齐仑死刑的谕旨中，嘉庆清楚陈述了将领们不及时结束战争的理由：</p>\n<blockquote>\n<p>明亮、永保等将领剿贼迁延，无意了结战役。他们知道：成功结束战役，最多不过得五等爵位之一，俸禄有定。这与统兵经过地方时收取成千上万两的厚礼相比，何啻天壤。所以他们被诱惑着留贼养寇，以自肥身家，虚耗国帑以中饱私囊。这就是贼匪蔓延远近、久未荡平的原因。^253</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释253。]</p>\n</blockquote>\n<p>清朝国家管理这场战役财政的失败几乎无可置疑，但应当指出：鉴于战时后勤制度的结构与行动的规模复杂性，漏洞一出现就堵上，确实是极其困难的任务。与18世纪大多数战争不同，这场战争对付的是中原地区众多股团的叛军，他们在漫长冲突的大部分时间里打游击战。军队从一省追到另一省时，有权从其他省份的后勤机构领取经费与其他后勤支持。于是，军队有机会既从家乡省、又从作战省双重领取饷银、津贴与犒赏。战场星散于地方社群之间，而非边疆或异域，地方社会的卷入规模自17世纪末吴三桂之乱以来所未见。战区知府知县们积极牟取最大利益时，后勤人员没有任何机制核实他们的请款。粮员与粮台的请求也是如此。请款数额大到不合理时，后勤人员能做的只是发款前稍砍一点。结果，申请者们故意多报，以防被砍。^254</p>\n<p>1799年春，恒瑞承认：从军需局向州县分发经费是有问题的：</p>\n<blockquote>\n<p>叛乱初起时，军队仓促调遣，后勤诸事皆草草办理。因此，无法每笔申报都按规章发款。[经费]随请随发，未立章程。结果，雇驮畜民夫、盐菜银、雇乡勇、赈济难民、购粮供军等各项，所付之数案案不同。有时军费先由西安军需局分发[到]汉中、兴安两府，再分发州县。有时州县知县径赴西安军需局直接领款。西安局与[汉中、兴安]的道府衙门只知各自拨出之总数，短期内拿不出逐项账目。^255</p>\n<p>[译者按：原奏自英文直译，文言原文待核，见注释255。]</p>\n</blockquote>\n<p>此时，拨给陕西的军费已超过一千万两。然而，正如恒瑞所奏报的，没有正规的簿记。他认为核查过去所有账目是难事，请求皇帝派高级官员到汉中清账、订立章程。嘉庆闻之震惊，同时也松了口气——因为松筠正赴陕途中。^256 到任近一年后，松筠为陕西战场订立了一些后勤规章，一些地方予以遵行。^257 然而，松筠不久离去之后，规章显然被弃置了。战役将近结束时，又曝出陕西没有正规簿记来交代近三千万两的花费。^258 1801年中，吴熊光就任湖广总督时，发现恒瑞描述的情形在湖北也存在：拨发军费没有精确的规章可循，几个军需局——包括武昌局——向军队与知县发款时相互重叠。检查襄阳军需局的账目后，吴熊光惊讶地发现：拨给各方的钱数有记录，钱的去向却毫无记录。^259</p>\n<p>后勤人员——包括主管们——在监督州县花费军费上完全束手无策。1798年底，福宁承认滥行普遍。然而，他不认为在战役结束前厘清所有欺诈案件是可行的——届时所有账册会由粮员与地方官员提交审计。^260 嘉庆也知道：掩盖或揭露漏洞与欺诈的关键在于账册：\"军中财务之弊，向来皆因开支混杂、[报账]拖延而生。加之，一项不能获准，便与他项混杂。于是事事纠缠，便于作弊。\"（原文待核，见注释261）^261</p>\n<p>对嘉庆而言，最后的办法似乎也只剩战后通常开始的审计。清朝自开国之初就建立了多层次的审计制度——所谓\"奏销\"（zouxiao）——既管日常开支，也管战争与水利工程等临时开支。^262 军费审计中，开支按类型编目：如发给军队的津贴、犒赏、乡勇饷银、运输费用、弹药装备费用等。每类之下，按地点与时间分多个\"案\"（an）——多则数十、甚至上百案。申报提交户部时，由官员书吏对照规章审查。开支若合乎规章，其数额从所拨经费中扣除、申报获准。开支若违规，退回申报人重做。这个制度虽是国家财政健康的安全阀，却有办法绕过它。最常见的做法，是申报官员贿赂审计官员。^263 审计官员只负责核查开支是否合乎规章；他们不可能知道某一案件实际付了多少钱。例如，申报\"为便利军队通行修了一座桥、花了多少钱\"——只要费用与某长某宽的桥相符，审计官员就会批准。但他们不要求任何证据来证明这笔钱是否真是修桥的实际费用、桥是否真修了。</p>\n<p>因此，只要花钱的人能编出正当用途，审计就几乎伤不到前线腐败的作恶者。然而，寻找或捏造借口需要时间——这很可能正是战争无法更早结束的原因。战役拖得越长，侵吞者煮账本、凑理由的时间就越多。正如嘉庆1799年秋所指出的：</p>\n<blockquote>\n<p>试想：国库储备本有定数。迄今尔等已糜费国帑七千万两，且不以军务为先。如此，贼匪何以平定？尔等之心，不过反复请款、虚报开支，以弥补战争早先造成的[账目]窟窿。因此，尔等迁延时日，不愿收束战役——唯恐战事一完，欺诈尽露，[所欠之钱]无从缴还。^264</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释264。]</p>\n</blockquote>\n<p>1801年初，受各战场叛军人数大幅减少的鼓舞，皇帝准备再次在财政前线采取行动。元旦，嘉庆颁发谕旨，命开始审计战役头三年的开支——因为时间越久，账目越难厘清——鉴于开支规模之巨、性质之杂。他盘算着：揭露那几年的欺诈应当没有障碍——那一时期主持后勤的官员几乎全被罢免或惩处了。然而，他裁定：乱花与侵吞的钱要由责任人缴还。^265 由于过去很少在战争结束前审计，这是不同寻常之举。显然，嘉庆急于从前线腐败的作恶者手中讨回一些钱——尽管他无意让任何人承担政治或法律责任。</p>\n<p>这道谕旨在战场省份遭到沉默的抵制。嘉庆严正的指令之后，1801与1802年只有零星的申报。勒保这两年提交的少数案件中，大多来自第二次廓尔喀之役或苗疆战役；只有几案来自白莲教战争，且都是1796年初孙士毅署理四川总督时期的。毫无疑问，精明的勒保尽量避开更浑浊、问题更多的年份。同时，陕西在嘉庆审计令之后一年半只提交了十案。嘉庆不悦，1802年夏末训斥陕西如蜗牛般的反应，坚持陕西两个月内提交全部案件。^266 要求再次落空，尽管它促使陕西此后数月提交了更多案件。直到1804年底最后一次宣布胜利之后，战场各省的申报才大批涌来。^267 对嘉庆号召的明显迟缓回应，为他的上述论断作了注脚：想办法在审计中过关的时间，确实是战役拖延的一个因素。围绕账册的较量远比战争本身长久。审计的结果是：许多在战争中任职的官员被责令缴还乱花或侵吞的军费，但一些黑洞永远没有揭开。^268 到1814年——战争结束十年后——陕西战争头三年所花的五百多万两仍无交代，湖北、四川与曾解\"协饷\"的各省所花的二百五十多万两仍未结清。^269 换言之，拖延战术对战争暴利者的用处，在审计中与在战争中一样。</p>\n<h2>注释</h2>\n<p>[译者按：文献简称同前各章。XFFLFB即《钦定剿平三省邪匪方略续编》。]</p>\n<p>题辞：XFFL, 127/23b–24a.</p>\n<ol>\n<li>嘉庆朝总收入降至四千七百至四千八百万两。史志宏《清代户部银库收支和库存统计》（Shi Zhihong, Qingdai Hubu），41–42, 148–70。</li>\n<li>此前的战争也是如此。托伊费尔（Theobald）War Finance, 29–36。</li>\n<li>XFFL, 34/32b. 据表7.1，到1797年底实际解往战争的经费为二千九百九十万两。</li>\n<li>QSLJQ, 39/6b–7a; XFFL, 89/14a, 90/18b, 123/12b, 128/32b–33a, 162/17a–18a. 据表7.1，各来源合计约四千六百三十万两。</li>\n<li>嘉庆多次说此话，首次在1800年三月，随后在1800年中、1800年底与1801年初。XFFL, 162/17a–18a, 177/3b–4b. 但据表7.1，到1799年底只有五千八百七十万两，到1800年底为七千三百三十万两。</li>\n<li>陕西官员不止一次提到：到1799年春，本省已收到一千一百多万两。XFFL, 97/8b-9a, 112/12a. 据1803年呈户部的报告，陕西在战争头三年收到一千万两。NGDK, 225425. 1799年底，魁伦说该省到那时已收到一千九百五十万两。XFFL, 126/12a.</li>\n<li>户部库1796年只收到五百七十三万四千四百九十六两。乾隆朝平均为一千二百一十二万三千五百九十七两，嘉庆朝为一千一百零五万三千零五十五两。史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），147, 175, 184。</li>\n<li>1801年初陆有仁请湖南送十五万石米到陕西时，嘉庆让湖南从应解税款中扣减运输费用。XFFL, 233/8a–11a.</li>\n<li>XFFL, 352/24b–25a.</li>\n<li>1796年十月，毕沅与汪新在四百万两刚拨给鄂豫之后不久，又请二百万两——理由是雇乡勇、赈济难民、救灾与六千名援军的到来。XFFL, 20/4a–b.</li>\n<li>XFFL, 55/15a–b.</li>\n<li>1798年初四百万两到达时，已欠付三百万两——包括军队与乡勇的饷银、雇驮畜、采购给养弹药。XFFL, 68/23b–24a, 68/27b.</li>\n<li>四百万两到达时，二百万解往成都，但很快只剩四十三万二千两——三十九万六千两用于弹药、军服与运输，五十九万两购粮，五十八万二千两偿还拨给四川绿营驻防与驻藏官军的经费。还有其他欠款：军队饷银津贴、赈济经费、犒赏与抚恤。解往保宁、达州军需局的二百万两中，支付四川所有已部署部队的津贴与所有粮台民夫的工钱之后，只剩七十万两。XFFL, 79/9a–12b, 81/1a–b.</li>\n<li>1798年夏，景安与高杞请一百五十万两赈济湖北难民、修复基础设施。乾隆给了他们一百万两。XFFL, 74/39b–42a. 年底，乾隆批准了陕西所请三百万两中的二百万两——陕西六个月前刚收到二百万两。XFFL, 83/24b–27a.</li>\n<li>按广兴的估计，额勒登保与德楞泰每月需十万至二十万两（shi yu wan liang），七十五与朱射斗每月需三万多两。GZDJQ, 4753; XFFL, 145/10b–11a.</li>\n<li>从嘉庆四年十一月到五年正月，广兴拨出四十五万两，约每月十五万两。XFFL, 147/29b–30a. 1800年春，广兴奏报他四个月花了一百四十六万两，包括给魁伦的十八万两与解往成都的八万两。XFFL, 159/16b–17a.</li>\n<li>1802年，户部驳回了长麟\"为在甘肃境外作战的甘肃军队赏一月饷银三万二千五百两\"的申报。驳回理由是：难以确认那些军队是否已在作战省份领过犒赏。卢康（Lukang），嘉庆七年七月初二日，NGDK, 111164。</li>\n<li>1797年春东乡香炉坪之战据称杀死一万名叛军之后，乾隆只赏部队荷包等小礼物。XFFL, 40/33a–34b. 但他给攻下芭叶山叛军据点的福宁、额勒登保部队——包括土兵——赏了一个月饷银。XFFL, 41/36b–37b.</li>\n<li>1797年夏，孙老五被杀、徐天德与王三槐之母被擒时，乾隆赏部队一个月饷银、乡勇一个月口粮。他还给负伤士兵赏了一个月饷银。XFFL, 41/17a–19b.</li>\n<li>关于两类库藏，见史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），6–7。</li>\n<li>据史家史志宏，内库储备通常总计超过一百万两。看起来数额应当更高——1796与1797年从内库的几次拨发，每次高达四百万两。</li>\n<li>户部库1796年拨出一千八百五十四万一千七百六十二两，1797年三千五百一十六万八千零四十九两，1798年二千五百一十四万七千九百六十五两。史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），78–79, 184–85, 259–60。加上全国性蠲免，亏空创纪录：1796年一千二百八十万七千二百六十六两，1798年八百七十三万四千零三十九两（1797年无记录，可能更高）。史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），197。</li>\n<li>史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），110–11。</li>\n<li>QSLJQ, 37/18b–19b; XFFL, 87/8a–9b. 此后他反复提到这个数字。XFFL, 89/14a–b, 90/18b–20a.</li>\n<li>即1796年一千八百五十四万一千七百六十二两、1797年三千五百一十六万八千零四十九两、1798年二千五百一十四万七千九百六十五两。史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），184–86。</li>\n<li>1800年初，嘉庆写信给在陕西的那彦成，表达了对银储备快速流失的深切担忧。XFFL, 124/13b–14a. 年底，嘉庆又向新任陕西巡抚陆有仁表达了关切。XFFL, 209/19a–20a.</li>\n<li>QSLJQ, 39/7a–b; XFFL, 89/14b, 108/40b.</li>\n<li>听松筠说一些士兵因军服鞋子早已穿破而用牛皮裹脚后，嘉庆于嘉庆四年七月初五日指示：规章虽须遵守，但不必过苛，鉴于士兵所历的危险艰辛，给养与犒赏应当充裕。XFFL, 108/24b–24a.</li>\n<li>XFFL, 143/11a–12a.</li>\n<li>XFFL, 147/12a. 又见XFFL, 143/11b, 161/20b。</li>\n<li>XFFL, 162/20a–21b.</li>\n<li>1799年春，林俊向成都的商人店主借了六万两。林俊承认四川不止一次这样做。XFFL, 90/18a–b, 105/3a–4b, 113/25b–26a, 118/31a. 1800年春，台布向汉中的店主借了五千两购粮。XFFL, 156/36b–38a, 158/15a–b.</li>\n<li>1799年夏末，倭什布写信给安徽、江西巡抚，请每省各出五十万两——或从省藩库、或从关税——因为湖北军费已尽，他不得不向湖北藩库借了六十六万两来守边御川匪。XFFL, 109/27a–28a, 109/29a–b. 倭什布声称1800年已向湖北藩库借八十六万两。XFFL, 221/12b. 台布1800年底承认向陕西藩库借过钱。XFFL, 204/12a–b. 1801年初，陆有仁奏报已向陕西藩库借六十二万两，嘉庆批准了他\"从河南请三十万两\"的请求。XFFL, 225/26b–27b, 225/31a–b. 三周后，陆有仁又以同样借口、加上所拨经费未到，再请六十万两——也获准。XFFL, 230/31a–36a. 1800年夏末，姜晟以湖北当年只收到五十二万两军费为由，向湖南借了十五万两。XFFL, 189/25b–26a. 1800年底，姜晟奏报他一直在用省费支撑战役，若襄阳、郧西出现紧急事态，将向河南求助。XFFL, 218/45b–47b.</li>\n<li>XFFL, 109/27a–28a.</li>\n<li>XFFL, 146/16a.</li>\n<li>嘉庆1799年底说：\"魁伦与松筠皆正直、为国忧心。朕绝不可怀疑他们会侵吞经费。若不能深信此二人，军国大事经费之任，还能信谁？\"XFFL, 126/30a.</li>\n<li>到川后，魁伦数月间收到三百五十万两，尽管他请求的更多。XFFL, 126/18b–22b. 1799年底，松筠在一百五十万两解陕五个月后又请二百万两——他偿还了陕西藩库六十六万两，但余款不够所有开支，只好再向陕西藩库借五万两。嘉庆只给了他一百万两。XFFL, 123/9a, 123/11b–12a. 1800年初，松筠在收到五十万两后不久又请山西、山东、河南、江苏、安徽各出一百万两，嘉庆驳回并严厉斥责了他。但他允许松筠从拨给四川的一百万两中扣留二十万两。XFFL, 128/5b–6b, 138/7b–12a.</li>\n<li>1799年底，松筠奏报马慧裕从拨给甘肃的军费中扣留了四十万六千两。XFFL, 132/5a. 1800年春，额勒登保与德楞泰的到来使陕西开支上涨，松筠两次截留拨给四川的经费近一百万两。XFFL, 144/20a, 153/23b–24b, 165/23b–24b.</li>\n<li>1800年春末，台布以陕西每月需约五十万两为由再请二百万两，嘉庆震怒，在一道长谕中倾泻沮丧。XFFL, 162/11b–14a, 162/16b–22a. 不久，台布又请一百五十万两。嘉庆不仅驳回，还给了台布\"严旨申饬\"。XFFL, 166/27–29a, 166/30a–32b.</li>\n<li>最终，台布请求把松筠截留的近一百万两在审计中算作拨给陕西的经费——嘉庆批准了。XFFL, 155/35b–36b, 155/38b–40b, 159/16b–19a, 165/23b–24b, 165/29b–30a, 166/27a–29a.</li>\n<li>XFFL, 156/36b–40a, 158/15a–b, 159/20b–22b.</li>\n<li>关于1801年北京水灾及其善后，见李明珠（Lillian Li）《同饥荒作斗争》（Fighting Famine）第9章\"The 1801 Flood\"。</li>\n<li>表7.1中1802年虽列有户部库的二十万两，但那笔钱是江西的地丁税、由江西直接解往湖北。</li>\n<li>据史志宏，乾隆朝只有百分之二十四点八的总收入解交中枢政府，嘉庆朝百分之二十三点二，而更早时期比例更高。《清代户部》（Qingdai Hubu），40–42。因此，百分之七十五以上的收入留在各省。又见邓斯坦（Dunstan）\"Finance of Imperial Munificence,\" 180。</li>\n<li>JQSYD, 5:18. 1800年，河南还无法履行另一项例行义务：为江苏修大运河提供材料经费。JQSYD, 5:379.</li>\n<li>JQSYD, 5:243, 365.</li>\n<li>邓斯坦（Dunstan）\"Finance of Imperial Munificence,\" 207, 234–35. 河南的年现金收入定额自18世纪中叶起为三百三十万两。梁方仲《中国历代》（Liang, Zhongguo lidai），387。</li>\n<li>山西的年现金收入为三百万两。梁方仲《中国历代》（Liang, Zhongguo lidai），387。山西商人专营盐、铁、茶、丝、棉织品、粮、油、染料与木材，也经营当铺。黄鉴晖《明清山西商人研究》（Huang Jianhui, Ming Qing Shanxi），72–147。关于山西商人参与边境贸易，见赖惠敏（Lai Huimin）\"清政府对恰克图商人的管理\"。</li>\n<li>GZDJQ, 4029; XFFL, 73/39b–41a.</li>\n<li>1799年夏，勒保请求向山西\"借\"五十万两。嘉庆指示山西送四十万两到四川。XFFL, 110/29a–b, 112/1a–2b. 1799年底，那彦成赴前线途中向山西请一千匹马。山西巡抚伯麟用自己与山西其他官员的\"捐输\"购马。XFFL, 130/20a–21a. 1800年夏末，应台布之请，嘉庆指示伯麟给陕西五十万两。后来湖北截留了拨给陕西的二十万两，嘉庆便请山西送二十万两给陕西。伯麟送了三万两……送陕西三十万两，但对另外四十万两犹豫。然而，被嘉庆斥责后，伯麟又送了四十万两到陕西。XFFL, 194/16a–17a, 194/20b, 218/9a–b; JQSYD, 5:453, 461. 1801年初，嘉庆让伯麟从山西藩库取十万两，交给赴陕的两位钦差倭星额与邱兴健。XFFL, 230/15a–b.</li>\n<li>1803年春陕西向山西请三万石粮时，嘉庆告诉伯麟：多送些到陕西更好。XFFLXB, 25/18b–19a.</li>\n<li>1800年初，嘉庆命解一百万两到山西，以备川陕急需时支用。不久，嘉庆命送五十万两到陕西、另五十万两到四川。XFFL, 151/12b–14a, 155/35b–36b, 155/38a–b. 1800年底，嘉庆命把向商人筹集的二十万两解陕、存入陕西藩库备将来之用。JQSYD, 5:461.</li>\n<li>1802年初，嘉庆把内地关税、江苏盐课与商人\"捐输\"解到河南，以备战场省份之需。XFFL, 32719b–20a; XFFLXB, 4/1a. 同年晚些时候，应吴熊光之请，嘉庆命解五十万两到南阳，备额勒登保赴鄂之需。XFFL, 342/33b–36a, 342/38b–40a.</li>\n<li>XFFL, 304/7b–8b.</li>\n<li>1803年春，嘉庆让河南巡抚马慧裕为陕西备粟麦。马慧裕立即送五万石粟到陕西。XFFLXB, 8/39b, 9/26a–27a.</li>\n<li>JQSYD, 4:532. 关于监生头衔对持有者的价值，见邓斯坦（Dunstan）State or Merchant, 192。关于过去售卖监生头衔补仓之事，见濮德培（Perdue）China Marches West, 367–70。</li>\n<li>JQSYD, 5:411–12.</li>\n<li>JQSYD, 5:465.</li>\n<li>嘉庆六年十一月初九日，嘉庆裁定：各省售卖学衔的收入达一万两，即解京。然而，他允许陕西把钱放入军需库，战后解京。XFFL, 283/35a–b.</li>\n<li>曾小萍（Zelin）Magistrate's Tael, 65。此做法始于顺治朝，康熙朝普及，但乾隆、嘉庆朝最频繁——仅盐商就被收取了六千五百多万两。陈锋《清代盐政》（Chen, Qingdai yanzheng），215–26。</li>\n<li>JQSYD, 4:98–99.</li>\n<li>1799年春，两淮盐商捐一百五十万两，嘉庆只接受了一百万。JQSYD, 4:158. 到1800年春，浙江盐商已捐一百五十万两，又认捐一百万两。JQSYD, 5:316.</li>\n<li>JQSYD, 5:370–71. 1800年晚些时候，一些富户向战役捐了二百一十八万两（接受一百五十万两）之后，其知府知县们又向他们\"借\"十万两。嘉庆命罢免那些官员，并禁止在战区之外为战役向当地居民募捐。JQSYD, 5:459.</li>\n<li>1799至1803年间，山西盐商捐了八百万两。黄鉴晖《明清山西商人研究》（Huang Jianhui, Ming Qing Shanxi），469–70。史家陈锋认为：嘉庆朝盐商为历次战役共捐一千八百六十三万两。陈锋《清代盐政》（Qingdai yanzheng），220。</li>\n<li>戴（Dai）Sichuan Frontier, 197–216。</li>\n<li>四川常平仓储备总额原定为二百八十二万七千七百石。1796年底以来，解往苗疆战役四十二万六千三百七十石、支援四川本省战役一百七十四万三千五百石之后，到1798年夏只剩六十五万七千八百三十石。达州方面，1796年底至1797年二月消耗了三十万石。XFFL, 35/30a–b. 万县方面，据广兴说，1800年初只剩一万二千石米。XFFL, 153/29a–20b.</li>\n<li>1798年，英善与福宁向甘肃请十万石麦。XFFL, 66/22b, 72/9b–11b, 73/39b–40a. 不久，四川请湖北送三万石米。由于解川之米本是拨给荆州驻防旗兵的，景安从湖南调三万石米给荆州驻防。XFFL, 43/7b–8a, 71/14a–b及16a–b, 84/26b–28a. 即便收成不好、粮价高企——如1800年——广兴仍让达州后勤人员就地购粮。XFFL, 153/29a–20b.</li>\n<li>1802年晚些时候陆有仁请四川送米到陕西时，川西的一万石米解到了陕西。XFFL, 335/20b–21b. 1803年，勒保同意让陕西派员向川北居民购米。XFFLXB, 10/10a–11b. 1804年初夏，勒保通知方维甸：陕西可以派员到四川顺庆、重庆两府购粮。XFFLXB, 27/1a, 27/3a–4a.</li>\n<li>陕西为四川备了一万石米、三千石麦豆与弹药。清军从湖北追击襄阳起事者入川时，陕西又分两批送一万六千石米到四川。XFFL, 42/22a–23b, 43/7b–8a.</li>\n<li>XFFL, 166/28a–29a.</li>\n<li>1800年因旱收成不好，汉中米价达每石九至十两。XFFL, 230/31b–32b, 233/4a–11a.</li>\n<li>台布春末从湖北郧阳购了三千石米。XFFL, 166/28a–29a. 随后，应台布之请，湖北从数处粮仓送两万石米到陕西（陕西支付运输费与湖北补仓费）。XFFL, 166/28a–29a, 166/30a–32b, 174/27b–32a. 夏天，台布请江西送十万石米到兴安。他估计陕西军队每月耗米一两万石。XFFL, 184/4a–5b. 秋天，陕西收到江苏、广东、广西的米。XFFL, 187/11a. 1800年底，嘉庆拨十万石米给陕西。XFFL, 230/31b.</li>\n<li>1801年初，陆有仁因陕南严重粮荒向湖南请十五万石米。XFFL, 230/31b–32b, 233/4a–11a. 1802年春，江西六千石、湖南两万石米解到陕西。XFFL, 315/29b–31a, 319/15b. 不久，又从江西解八万石米到陕西。XFFL, 327/13b–14b.</li>\n<li>1801年初，湖北截留六万石漕米。随后书麟截留了江西解陕途中经过的一万石米。XFFL. 224/13a–14a, 226/1b. 1802年秋，湖北从安徽、湖南、河南、四川共采购十万石米粟及其他粮秣。XFFL, 331/1b–4a, 331/29a–30a, 331/31b–32b.</li>\n<li>三百五十万石之数见于嘉庆庆祝战役最终完成的长诗注释。然而，那里所给外省运粮之数——约六十三万六千石——并不准确。XFFL, 卷首, 53a。</li>\n<li>台布曾奏报：军队喜欢米胜过麦，但他说这是因为陕西潮湿气候下麦易变质。XFFL, 166/28a–29a, 206/5a–6b.</li>\n<li>从四川保宁到陕西边境，一石米的包装运输费为一两四钱至一两五钱（夏季二两）。随后运到汉中每石一两四钱，经汉江到兴安不足五钱。但从潼关到汉中每石三两七钱——还不包括河南陕州到潼关的费用（河南支付）。XFFLXB, 12/7b–9a.</li>\n<li>XFFL, 336/3b–4a.</li>\n<li>关于军需局的起源，见陈锋《清代军费》（Chen, Qingdai junfei），265。关于两次金川之役中的军需局，见戴（Dai）\"Qing State,\" 45–48，及托伊费尔（Theobald）War Finance, 34–36。</li>\n<li>XFFL, 14/28b, 22/10b–12a, 226/1b.</li>\n<li>1799年秋，高杞提到：荆州、襄阳的军需局已关闭，武昌的仍在。XFFL, 115/26a–b.</li>\n<li>XFFL, 312/25b–26a.</li>\n<li>XFFL, 10/15b–16a.</li>\n<li>1798年，布政使林俊主持成都局；川北道李鋐与知府吉胜保主持保宁局；石作瑞监督达州局。XFFL, 126/23a.</li>\n<li>XFFL, 107/19b–20a. 叛军渡嘉陵江后，广兴让重庆为川东、川北采购弹药，成都局只为川西提供弹药，但他计划道路肃清后恢复成都局的全部职能。XFFL, 153/30b–31a.</li>\n<li>XFFL, 66/23a, 107/19b–20a.</li>\n<li>XFFL, 63/16a–17a.</li>\n<li>XFFL, 43/6b–7b.</li>\n<li>JQSYD, 4:56, 143.</li>\n<li>XFFL, 35/29b–3
