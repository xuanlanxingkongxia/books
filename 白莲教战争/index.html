期恢复财政平衡的有限成功，打消了清朝大幅改造其战争供款方式——更重要的是其财政结构——的紧迫感。^69 同时，财政危机的结束，减轻了嘉庆强力要求军事将领迅速结束战争的压力。嘉庆朝余下的岁月与随后的道光朝（1826—1850），清朝国家反复使用白莲教战争期间的应急筹款措施，为紧急或特殊项目筹钱。^70 同时，嘉庆皇帝诉诸节俭的修辞，煞费苦心地把自已描绘成对利益与铺张无兴趣。^71 其子、继任者道光皇帝接过了这一修辞，在展示节俭癖好上更进一步。与从不掩饰追逐财富、炫耀财富的乾隆不同，嘉庆与道光都不得不把节制开支列为优先。普免钱粮——清朝黄金时代的标志之一——再也没有出现过。或许更关键的是，清朝国家大大背弃了自开国之初就奉行的\"财政上优先保障军队\"的政策。就连在南方、东南沿海剿海盗的水师，也没有获得足够经费升级船队——自乾隆朝末年起，他们有时租用商船作战，因为商船比清朝水师那些老旧、缓慢、装备简陋的战船更快、火器更好。^72</p>\n<p>艰难时世迫使身陷困境的嘉庆皇帝反思财政灾难的根源。亲政才一年多，嘉庆就确信：中枢政府如此慷慨地为镇压教门叛军的战役供款，可能是不明智的——他们不过是恼人而微末的地方之患，不值得动用中枢政府的资源。^73 确实，各省都有自己的驻军，由各省军事预算供养。如果驻军尽到职责、迅速消灭起事者，中枢政府本不必为战役付钱。对嘉庆而言，这个简单的道理是吃了苦头才学到的。然而，他与战役撇清干系的尝试完全失败。如第4章所述，1800年春从北京拨四十万两给四川之后，嘉庆告诉四川战役事实上的主持者勒保与德楞泰：此后他们必须用四川的钱支撑战役。^74 然而，仅仅几天他就投降了，很快恢复为四川战役供款——因为勒保与德楞泰不断施压。^75</p>\n<p>在与战场省份的经费角力中失败，中枢政府战后也未能收回其在各省财政关系中的杠杆。更具体地说，它在向各省获取资源上无能为力。战后，欠税与关税短缺变得更大、更普遍，各省还清欠款的时间更长——如果不说干脆被无视的话。^76 对某些省份而言，这或许是对嘉庆政府白莲教战争期间——尤其是最后几年，户部库分文未拨给战争时——的勒索的反冲。受战役影响的各省，公共粮仓战后多年仍是空的——尽管据称花了那么多钱购粮补仓。社仓（shecang）也是如此。^77 事实上，其他省份保持粮仓充盈也没好到哪里去。中枢政府也未能收齐对许多战争中任职、被控乱花或侵吞军费的官员所课的罚银。到1811年，四川官员仍在缴付廓尔喀之役的罚银，更不用说白莲教战争的了。^78</p>\n<p>同时，各省在与中枢政府的财政关系中变得更加主动。所有以这样那样方式为战役出过力的省份，都主动要求中枢政府报销它们支援战争的一切开支——无论多小。^79 更精于算计的省级官员——如勒保——采取了更咄咄逼人的步骤。1804年，勒保以\"四川为战役动用了太多省库资金\"为由，请求中枢政府给四川一些补贴。曾在户部四川司任职的御史严天培驳斥了勒保的说法，说他了解四川的财政状况。^80 确实，四川战役期间收到数千万两、到头来却抱怨经费短缺，实在荒谬。</p>\n<p>北京当时以及此后多年都不知道的是：四川政府一直以\"支援战役\"为名继续向纳税人征收附加费。四川地税被压得异常之低、民众相对富裕，官员们在战争等紧急事态时有时征收附加费——\"民间帮贴\"（minjian bangtie）或称\"里民津贴\"（limin jintie）。^81 征收附加费或许不只四川有，但四川最为臭名昭著。^82 深知四川的这一做法、又担心知县及其差役把此事变成对纳税人的勒索狂欢，嘉庆1800年初告诫魁伦不要征收附加费。^83 数月后，复职的勒保请求以\"犒赏自愿乡勇\"为名征收附加费。嘉庆起初勉强同意，很快又改了主意，告诉勒保：如果四川军费够撑一年，就暂停征收。^84 但勒保还是征收了，而且毫不手软。1801年初的一个月里，就收了十五万四千多两——接近四川年地税六十六万两的百分之二十五。^85 随后1802年，勒保又征收了一次。^86 为减轻自己给纳税人增负的不安，嘉庆两次都给受征收影响之地蠲免赋税，同时警告勒保下不为例。1802年之后勒保虽没有再奏请，却继续在四川征收附加费——即便战役结束之后。中枢政府多年来被蒙在鼓里。^87</p>\n<p>显然，财政分权在19世纪头几十年已成为现实，它将在19世纪50年代太平天国起义震动全国时达到危机点。归根结底，它表明中枢政府对各省控制力的削弱——这是政治分权的一个症状。正如本研究力图展示的：中枢政府无力指挥与约束战争领导层，指向了一场严重的政治危机。乾隆与嘉庆两位皇帝都清楚前线的腐败与将领、地方官员的自利行为，却没有有效手段加以约束，更不用说根除普遍的滥行。嘉庆1799年接手后虽试图推行前线改革，这项事业很快被根深蒂固的前线文化与既得利益击败。为安抚旧班底，他牺牲了魁伦——一位认真的改革者、前线腐败的局外人。^88 漫长战役余下的岁月里，嘉庆政府对\"清剿数千、继而数百名叛军残部\"的时间表完全无能为力。皇帝不得不就完成军事行动进行谈判、甚至恳求。指挥链的断裂，造成了堪称清史上最放荡的军事战役。</p>\n<p>近代早期的一些欧洲国家，战争在强化国家机器、提升其效能上扮演了关键角色。清朝早期，与准噶尔蒙古人较量时，为在极西北边疆的战争动员，迫使国家改造革新其行政、军事与后勤制度——以战胜凶悍的准噶尔蒙古人，后者对清朝拥有某些优势。^89 然而，白莲教战争被证明是完全不同的案例。敌人组织涣散、装备简陋，既无明确政治纲领、又无有效的军事战略，远未对王朝构成严重挑战；镇压者即便不拼命迅速消灭他们，也不会冒真正的危险。换言之，机会成本极低。于是，一个巨大的讽刺产生了：正是因为叛乱的孱弱，清朝才花了许多年扑灭它——战役各方（无论军人还是文官）的优先事项不是消灭叛乱，而是个人利益最大化。更糟的是，漫长的战役证明：嘉庆政府既没有勇气、也没有手段在战争结束后改造现状。19世纪头几十年的发展——至少在与命脉相关的军事与财政领域，没有任何实质改革——不支持\"清朝不仅挺过了白莲教战争、还因处理它而焕发新生\"的看法。</p>\n<h2>缩写对照</h2>\n<p>CMOR　户部库（Buku）\nICMOR　户部内库（Neiku）\nIHD　内务府库（广储司，Guangchusi）</p>\n<h2>注释</h2>\n<p>题辞：QSLJQ, 64/10b.</p>\n<ol>\n<li>XFFL, 352/4b; XFFLXB, 16/39b–40a, 32/16a–21b.</li>\n<li>QSG, 11251.</li>\n<li>战争中病故的官员包括毕沅、鄂辉、舒亮、汪新、恒瑞、书麟、陆有仁与惠龄。</li>\n<li>关于昭忠祠，见邦克（Bonk）\"Loyal Souls,\" 75–96。</li>\n<li>XFFL, 242/38b–39b.</li>\n<li>关于天理教八卦起义，见韩书瑞（Naquin）Millenarian Rebellion。</li>\n<li>嘉庆称赞长龄、杨遇春与赛冲阿的速胜。JQSYD, 19:110–11.</li>\n<li>QSLJQ, 24/15b–17a.</li>\n<li>《四川通志》（Sichuan tongzhi），卷首, 11/58b–60a, 12/5b–7b。</li>\n<li>只有河南一县雇了乡勇。韩书瑞（Naquin）Millenarian Rebellion, 236–37, 353。</li>\n<li>孔飞力（Kuhn）Rebellion and Its Enemies, 49–50。</li>\n<li>XFFLXB, 27/30a–31b. 为奖励他的明智建议，嘉庆恢复了被罢免的宜绵。QSLJQ, 129/21a–23a.</li>\n<li>XFFL, 333/14a–16a.</li>\n<li>XFFL, 333/22b–23a.</li>\n<li>勒保还收揽了马朝瑞。但马朝瑞不久就退休了。XFFL, 156/8b–12b.</li>\n<li>赛冲阿1800年底虽升任固原提督，仍作为德楞泰随从之一留在四川。XFFL, 203/22b–28b.</li>\n<li>关于杨遇春不寻常的仕途，见邦克（Bonk）\"Patronage and Personal Bonds\"。</li>\n<li>XFFLXB, 36/13b–16b.</li>\n<li>宁陕兵变后，嘉庆命不补空缺、裁撤秦岭新设营伍或以老兵充之。德楞泰与方维甸遂提议在陕西裁两千名士兵，宁陕镇只留三千多名。XFFLFB, 4/32b–34b, 6/34b–38b, 8/16b–17b.</li>\n<li>例如，河南方面，那些新兵到1803年只剩二千五百名——一些填补了河南驻防空缺，另一些被裁。SHD, 嘉庆八年九月初八日, 91–95。</li>\n<li>JQSYD, 19:278; QSLJQ, 288/18b–20b; 罗尔纲《绿营兵志》（Luo, Lüying），86–88, 95–97。</li>\n<li>史家马若孟（Ramon Myers）曾假定：\"它从巨额积累中支出，因此这些大规模开支必定对就业与生产产生了有利而刺激的作用。只有受战争不利影响的地区生产下降。\"Chinese Economy, 72.</li>\n<li>QSLJQ, 64/10b.</li>\n<li>XFFL, 140/31b.</li>\n<li>XFFL 219/17b–18a.</li>\n<li>JQ 册子。《燕台再游录》（Yantai zaiyoulu），18a。关于清代卖官的机制，见卡斯克（Kaske）\"Fund-Raising Wars\"。</li>\n<li>JQSYD, 4:158.</li>\n<li>JQSYD, 4:259.</li>\n<li>据户部尚书成德说，总数为二千一百五十二万三千二百八十两。MQDA, A306-32.</li>\n<li>按新规：欠款不足一千两者免还，一千至两千两者还百分之五十，两千以上者还百分之七十。JQSYD, 4:196.</li>\n<li>JQSYD, 5:416–17. 不久，嘉庆命已故官员的子弟限期还清父债。JQSYD, 5:446.</li>\n<li>1799年底，嘉庆因两淮盐政瑞征还钱迟缓而将其罢免，命其出钱自赎。JQSYD, 4:329–30.</li>\n<li>JQSYD, 4:530.</li>\n<li>嘉庆的原谕见吴熊光嘉庆五年二月初九日奏折所引，其他来源未见。GZDJQ, 5005. 其在豫陕的实施，见GZDJQ, 5005, 5416, 5402。1801年吴熊光任湖广总督后，恳请湖北官员捐款。XFFL, 326/21b–23a; XFFLXB 12/24a–b.</li>\n<li>JQSYD, 5:305.</li>\n<li>嘉庆写信给乌里雅苏台将军绵佐，让他暗示宜绵捐输。JQSYD, 5:28–29.</li>\n<li>宜绵承诺：除任陕甘总督时未领的一万三千至一万四千两\"养廉银\"外，再交出卖房卖地的钱。JQSYD, 5:74–75, 95–96, 125, 144. 他最终被罚两万两。QSG, 11172.</li>\n<li>JQSYD, 5:232–33.</li>\n<li>JQSYD, 9:186.</li>\n<li>JQSYD, 5:112; QSLJQ, 61/12a–14b. 1809年，清朝国家为提高大运河维修经费加盐价。此后整个19世纪，它反复加盐价以获额外收入。陈锋《清代盐政》（Chen, Qingdai yanzheng），138–40。</li>\n<li>史志宏《清代户部银库收支和库存统计》（Shi Zhihong, Qingdai Hubu），79, 197, 278。</li>\n<li>巴特利特（Bartlett）提到嘉庆朝的\"杂七杂八的小经济改革\"，但没有具体说明。Monarchs, 232.</li>\n<li>1800至1820年间，十六省（除直隶、山西）售卖监生头衔筹得四千多万两。此措施在道光朝继续以较小规模使用。汤（Tang）\"道光朝捐监\"。1814年，嘉庆勉强批准又一轮卖官，为镇压豫陕两场起义与一项水利工程筹款。JQSYD, 19:6.</li>\n<li>JQSYD, 5:530; JQQJZ, 6:178. 关于嘉庆节俭的倾向，见关文发《嘉庆帝》（Guan, Jiaqingdi），14, 86–103。</li>\n<li>QLSYD, 18:708–10.</li>\n<li>1800年春末，陕南叛军离开豫陕边境时，嘉庆指示吴熊光：把因叛军威胁拨给河南的五十万两转送陕西或湖北。他补充说：吴熊光可以从这笔钱中支付外省调来的三千名士兵的开支，但不应用于河南军队驻守的边防——他们已领饷银与其他补偿，不必再给额外补偿。XFFL, 173/20b–22a.</li>\n<li>XFFL, 177/3b–7b.</li>\n<li>数日后，五月初一日，嘉庆在另一道谕旨中退了一步：解释此前所说意在限制无度开支，但如果德楞泰与勒保确实能在四川取得进展，他愿意供一些钱。XFFL, 178/7a–8b.</li>\n<li>史志宏《清代户部银库收支和库存统计》（Shi Zhihong, Qingdai Hubu），45, 109–11；陈锋（Chen Feng）\"清代财政支出\"，139–43, 145–47。嘉庆朝后期，清理欠款成为北京与各省最重要的问题之一。JQSYD, 19:600–601, 603. 又见朱（Zhu）\"嘉庆朝整顿钱粮\"——其结论是嘉庆清欠运动失败。</li>\n<li>《达县志》（Daxian zhi），11/32b；《大宁县志》（Daning xianzhi），3/1b, 6/8a；《房县志》（Fangxian zhi），4/10b。</li>\n<li>嘉庆十六年十一月初四日，常明请求把未缴清罚银者的\"养廉银\"扣缴比例从百分之五十降到百分之三十，嘉庆同意。JQSYD, 16:627.</li>\n<li>NGDK数据库档案中此类案例众多。例如，几个省开列了向战场省份运粮所用粮袋的费用。甘肃政府甚至要求报销在甘肃为迎送过境军队而设路边棚子的费用。</li>\n<li>NGDK, 217799.</li>\n<li>关于四川低税的理由，见戴（Dai）Sichuan Frontier。第二次金川之役与第二次廓尔喀之役期间，四川曾征收附加费。QLSYD, 18:780, 784–85, 802–4.</li>\n<li>陈锋认为这是乾隆、嘉庆、道光朝为战争筹款的途径之一，但他没有点出四川以外的省份。\"清代财政收入\"，104。白莲教战争期间，似乎只有四川征收了附加费。据吴熊光说，湖北没有征收。XFFL, 304/24b–25b.</li>\n<li>嘉庆指示魁伦严惩作恶者，甚至将任何已征收的官员绳之以法。XFFL, 138/19a–20a.</li>\n<li>XFFL, 184/25a–29a, 185/13b–14b.</li>\n<li>XFFL, 237/24b–25b.</li>\n<li>XFFL, 308/11b–12a, 308/20a–21b.</li>\n<li>直到1811年——勒保卸任四川总督后不久——御史韩鼎晋才揭露此事。韩鼎晋奏报：附加费已被改称\"夫马价\"（fumajia），知县们把这名义下收的钱挪作衙门开支。JQSYD, 16:207.</li>\n<li>广兴的结局与魁伦相似。回京后，广兴在中枢政府数部任职，包括内务府大臣与户部尚书。然而，他耿直的性格树敌众多。1809年，广兴因\"违例\"被判处自缢。QSG, 11301–2.</li>\n<li>濮德培（Peter C. Perdue）在《中国西进》（China Marches West）中雄辩地证明了这一点。</li>\n</ol>\n<h2>文献缩写全表</h2>\n<table>\n<thead>\n<tr>\n<th>缩写</th>\n<th>全称</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>BLJZL</td>\n<td>Qing zhongqi wusheng Bailianjiao qiyi ziliao</td>\n<td>《清代中期五省白莲教起义资料》</td>\n</tr>\n<tr>\n<td>GZDJQ</td>\n<td>Gongzhongdang, Jiaqing period</td>\n<td>《宫中档·嘉庆朝》</td>\n</tr>\n<tr>\n<td>JQQJZ</td>\n<td>Jiaqingdi qijuzhu</td>\n<td>《嘉庆帝起居注》</td>\n</tr>\n<tr>\n<td>JQSYD</td>\n<td>Jiaqingchao shangyudang</td>\n<td>《嘉庆朝上谕档》</td>\n</tr>\n<tr>\n<td>JXZL</td>\n<td>Qinding Hubu Bingbu Gongbu junxu zeli</td>\n<td>《钦定户部兵部工部军需则例》</td>\n</tr>\n<tr>\n<td>KJJFSB</td>\n<td>Shixiangcunjushi. Kanjing jiaofei shubian</td>\n<td>石香村居士《戡靖教匪述编》</td>\n</tr>\n<tr>\n<td>MQDA</td>\n<td>Ming Qing dang'an</td>\n<td>《明清档案》</td>\n</tr>\n<tr>\n<td>NGDK</td>\n<td>Neigedaku dang'an</td>\n<td>《内阁大库档案》</td>\n</tr>\n<tr>\n<td>QLQJZ</td>\n<td>Qianlongdi qijuzhu</td>\n<td>《乾隆帝起居注》</td>\n</tr>\n<tr>\n<td>QLSYD</td>\n<td>Qianlongchao shangyudang</td>\n<td>《乾隆朝上谕档》</td>\n</tr>\n<tr>\n<td>QSG</td>\n<td>Zhao Erxun. Qingshigao</td>\n<td>赵尔巽《清史稿》</td>\n</tr>\n<tr>\n<td>QSLJQ</td>\n<td>Da Qing lichao shilu, Jiaqing period</td>\n<td>《大清历朝实录》嘉庆朝</td>\n</tr>\n<tr>\n<td>QSLQL</td>\n<td>Da Qing lichao shilu, Qianlong period</td>\n<td>《大清历朝实录》乾隆朝</td>\n</tr>\n<tr>\n<td>SHD</td>\n<td>Chuan Shaan Chu shanhou shiyi dang</td>\n<td>《川陕楚善后事宜档》</td>\n</tr>\n<tr>\n<td>XFFL</td>\n<td>Qinding jiaoping sansheng xiefei fanglüe, vols. 1–60</td>\n<td>《钦定剿平三省邪匪方略》卷1–60</td>\n</tr>\n<tr>\n<td>XFFLFB</td>\n<td>Qinding jiaoping sansheng xiefei fanglüe, fubian, vols. 68–69</td>\n<td>《钦定剿平三省邪匪方略》附编，卷68–69</td>\n</tr>\n<tr>\n<td>XFFLXB</td>\n<td>Qinding jiaoping sansheng xiefei fanglüe, xubian, vols. 61–67</td>\n<td>《钦定剿平三省邪匪方略》续编，卷61–67</td>\n</tr>\n</tbody>\n</table>", "text": "\n国库经费耗尽，并非大事……虽然已拨军费一亿[两]，但这些钱不过散在民间，故不必大为惋惜。\n——嘉庆皇帝，1800年\n[译者按：原上谕自英文直译，文言原文待核，见注释23。]\n\n清朝打了大约十年的仗。支撑这场战争的巨额开支虽然永久损害了王朝财政的可持续性，敌人却危险到不足以配得上这个代价。正如战役领导层在第一份报捷折中所声称的，约二十万名\"匪徒\"被杀。到1803年夏第二次胜利时，又消灭了两千名。此后到1805年中的冲突最后阶段，总数又添了数百名起事者与其他\"匪徒\"——很可能是前乡勇。^1 被杀者中，很大一部分无疑是被裹挟的平民。\n清朝的伤亡相对较轻。清朝档案虽未给出正规军与受雇乡勇伤亡的总数，但表明：战役中约四百二十名军官阵亡，包括王文雄与穆克登布两位提督，以及满洲贵族惠伦与安禄。^2 事实上，死于自然原因的高级官员多于战死者。^3 嘉庆清楚这不是一场光荣的战争，他与其政府淡化了1804年底的最后胜利。除编纂官方方略、让地方政府设立\"昭忠祠\"纪念战争死难者外，^4 国家没有隆重纪念这场战役。嘉庆在战役期间为每场\"胜利\"以及几乎每一个波折写过众多诗作，此后他统治的岁月里，却很少回望此事。\n一定程度上，国家在冲突期间及之后不愿对教门社团采取严厉措施，反映了它对叛乱的评估。国家视这些事件为几个教门师父煽动的地方骚乱，其追随者不过乌合之众。嘉庆政府认识到根除社会中的教门网络是不可能的，于是采取了现实的态度。嘉庆几次重申容忍奉公守法教门社团的决定。从被俘的王廷诏处得知豫鄂两省有许多教众后，嘉庆再次警告两省：不得对和平教众采取任何行动，只惩处从事颠覆活动者。为强调立场，他附上了自己的《邪教说》。^5 即便1813年天理教八卦起义震动京城、攻入紫禁城之后，嘉庆也没有改变这一立场，尽管他煞费苦心地升级了京城安保。^6\n影响任何叛乱轨迹与后果的因素，要从冲突双方去找。起事的组织者能力固然总是重要，镇压者的效能同样是重要决定因素。归根结底，任何起事能造成多大损害，主要取决于国家调动军事力量的速度、以及这些力量镇压叛乱的有效程度。白莲教起事组织涣散、却长期无法扑灭这一事实，印证了稻叶1914年首次提出的\"清军已失活力\"的推断。然而，本研究表明：1796年与1797年初，清军是有效的——它在早期阶段扼杀了起事，数日或数周内就消灭了整个股团。清军在人力、武器与财政支持上的优势，决定了这场冲突始终是不对称的。即便战争后期，只要有理由，将领们在许多战斗中都能轻而易举地消灭敌人。1813、1814年，陕南因经济压力爆发另一场起义时，长龄与杨遇春率领的清军仅仅两个月就消灭了全部数千名叛军——尽管秦岭地形艰险，而那正是白莲教战争中常被用来为拖延辩护的借口之一。^7 将领们有动力履职时，清军仍是有用的。然而，它那有缺陷的军事财政制度造成了巨大的两难：平时报酬菲薄的军人，一旦被派赴战争，就指望发财。白莲教战争中，将领们——即便较有操守者——都毫不羞于利用机会，而猖獗的前线腐败在阻碍战役及时结束上起了很大作用，同时抵消了国家自乾隆朝晚期以来限制军队从军费中过度牟利的努力。\n白莲教战争中\"大量随征乡勇代替军队作战\"的现象，暴露了清朝军事制度中战时腐败之外的另一个严重问题。满洲八旗与绿营都事实上实行军事户制——士兵空缺常由士兵的子弟亲属填补，不论是否合格、有时还靠行贿——社会上的精壮青年几乎没有机会参军。国家虽关注保障士兵的经济福祉，士兵供养全家的负担却日益加重，与清朝的努力背道而驰，不可避免地导致旗兵、绿营兵的双重贫困化。白莲教战争期间，这么多精壮男子愿意被雇为乡勇多年、其中许多人表现胜过正规军——这证明社会上有一个庞大的合格职业军人后备池。\n某种意义上，随征乡勇是胚胎期的职业军人。他们从社会招募、又送回社会。受雇期间，他们由国家发饷，但国家无义务供养其家口。遣散时，他们领了遣散费，与国家的关系即告终止。事实上，18世纪晚期族群士兵使用的增加，已是变化的先声。把乡勇编入绿营——先是在苗疆战役、随后在白莲教战争——是清朝军事制度改革的重要一步。^8 然而，白莲教战争结束时，仅仅把最后一批乡勇编为余丁，种下了麻烦的种子。面对上司的歧视与苛待，其中一些\"乡勇变士兵\"1806、1807年哗变了。试验就此倾覆——三场兵变向国家证实了它一直以来的担忧：那些桀骜不驯之人天性危险。1807年底，川西南一些族群社群反叛时，嘉庆指示仍任四川总督的勒保：镇压所需一切开支严格按《军需则例》办理，从而不给他重新使用乡勇方案的机会——尽管情况与苗疆战役并非不相像。^9 平定八卦教起义时，嘉庆援引白莲教战争的教训，坚决拒绝了雇乡勇的建议。^10\n嘉庆终止战争中使用乡勇的决定，是福祸参半的。一方面，它是明智的——正如孔飞力所指出的、本研究也证明了：这个方案确实是\"昂贵而危险的权宜之计\"。^11 另一方面，三场兵变后对军户之外者的不信任更深了，它成了从社会招募新血从军的心理障碍，注定了解散军事户制的前景。回首往事，嘉庆痛悔自己在白莲教战役中没有更多依靠正规军。1804年，他重提宜绵1797年\"招募三万备战兵扩充绿营\"的提议。他称赞宜绵的提议——它本可有助于限制乡勇的使用——并称赞乾隆\"以选定乡勇补缺\"的指示，同时责备战场各省督抚没有执行这一措施。然而，提议七年之后，他仍在哀叹：自己没能找到安置最后乡勇的办法——因为他们许多人抵制参军。^12 乡勇拒绝转正规兵的两个理由——饷银低、正规兵受纪律约束——中，补偿是关键。假设性地，提高绿营兵饷银本可以把乡勇吸引入军队。而这一步可能触发清朝军事制度的改造。\n然而，战役后期国家严峻的财政状况，阻碍了任何带来开支增加的事业。1796年叛乱爆发时，中枢政府国库充盈，乾隆皇帝非常愿意为行动付钱。然而，战场省份不受约束的花费——最大份额在雇乡勇与\"长骡\"名下——很快把国库银储备耗到历史低位。1799年初嘉庆接手时，不得不把大量注意力放在削减开支与增加收入上。然而，即便清朝财政状况允许提高正规军收入，结构性制约也是巨大的。1802年秋，吴熊光建议：通过剥夺伤病兵的待遇、把他们遣回本省，来提高健壮绿营兵的饷银。^13 但嘉庆坚决否决：\"若把遣回本营伤病兵的饷银夺来加给[健壮者]，便是在定额之外另加饷银。将来又如何能降回原额？\"（原文待核，见注释14）^14\n确实，正规军收入的任何变动都会引发连锁反应。士兵加饷早已拖延太久，战役结束时很难在没有骚动或更糟情形下取消任何临时性战时加饷。如果国家允许那些部队保留加饷，紧迫的问题就是：未调赴战役的绿营兵是否也应加饷。如果绿营兵全面加饷，国家又会觉得有义务更新旗兵的待遇——旗兵的财政困境长期以来是朝廷的头痛。改造这个自开国之初就存在的军队补偿制度，其影响对嘉庆政府来说太过沉重，难以应付。鉴于嘉庆优柔寡断的性格与其主要顾问们保守的心态，采用更稳妥的解决方案就不奇怪了：皇帝只是嘴上劝勉全体军官更加关注部队的训练与福祉，确保一旦需要打新敌人时他们靠得住。当然，没几个人会听他的指示。\n白莲教战争中，几乎所有最高将领与大多数省级督抚都是旗人。那些旗人中，大多数是满洲人——包括永保、鄂辉、福宁、恒瑞、明亮、额勒登保、英善、景安、勒保、魁伦、那彦成、倭什布、长麟与书麟；一些是蒙古人——如惠龄、德楞泰、松筠、台布与长龄；只有孙士毅与庆成是汉军旗人。可以说，这是旗人主导领导层的最后一场战争。旗人大体分为两派。恒瑞、明亮与长龄代表满洲传统的守旧派——强调骑射。战场上，他们总是亲自率领战斗。此外，明亮表现出对绿营与乡勇的不信任与鄙夷。他使用乡勇时，只把他们当诱饵或猎物——把起事者诱入其伏击圈，却不把乡勇当作战力量。相反，其他许多旗人——典型的如勒保、额勒登保与德楞泰——更喜欢扶植出色的低级将领——其中许多是汉人——并把战斗交给他们，尽管他们瞧不起后者。1800年初移驻陕西后，额勒登保很少亲自上阵，而是依靠杨遇春与穆克登布作战。杨、穆率各自独立分队离开时，一有战事，额勒登保就倚重一直随侍的两名金川孤儿扎克塔尔与桑吉斯塔尔，以及另一位汉人军官杨芳。勒保本人不是战将，他可能开创了\"扶植并利用汉人军官\"的做法。苗疆战役中，勒保依靠两名汉人军官——石进与马瑜（康熙朝名将马良柱的曾孙）。1800年石进阵亡、马瑜被拨给德楞泰后，勒保扶植并依靠另一位出色的汉人军官薛大烈。^15 战役最后阶段，勒保还大量使用桂涵与罗思举——两名由乡勇起家的绿营军官。德楞泰虽在战役早期亲自打过许多仗，漫长尾声期间主要让马瑜与旗人军官赛冲阿承担战斗主力。^16 汉人军官在作战中作用关键，却不总得到应得的功劳与奖赏。旗军将领们不愿把他们的贡献奏报朝廷，战后请功请赏时却总是列上一大堆旗人的名字。只在战役后期，杨遇春才升任提督。^17 杨遇春登上绿营顶层（后来官至陕甘总督）虽标志着汉人在军事制度中日渐重要，却没有引发旗汉关系的正式重新调整。\n白莲教战争为清朝提供了改革军队的机会。然而，嘉庆政府选择暂时继续用非常规兵员对付起事者，长期则维持军队的现状。战役刚结束，为巩固三省交界地区采取了一些修补措施——增设营汛、建立新的巡逻与联合演习。然而，那些措施很快被打了折扣。巡逻因费用高昂于1805年取消。^18 随后，三场兵变之后，许多前乡勇被清洗，其空缺被裁撤，一些新设营汛被降格。^19 战争期间，由于18世纪90年代招募新兵，绿营总规模扩大了数万，但那些扩编很快蒸发了。^20 1814年，主要由于财政制约，清朝国家决定把绿营规模削减到乾隆朝初年的水平——尽管削减要到几十年后的19世纪中叶才完成。^21 这些削减，加上继续大量虚悬名缺不补，使绿营在面临空前内外危机时处于规模最小、状况最差的状态。\n经济上，战争给战场省份与整个帝国留下了长期影响。数年间，银锭军费被解往战场省份的后勤总部——汉中、襄阳、达州与保宁——以及武昌、西安、成都的省城。无论经费总数是一亿二千万还是九千一百六十五万九千两，白银流量之大都是空前的。银锭在目的地交付后，有两条渠道可以散失：被花掉或被侵吞。既然总拨发的相当一部分在本地花掉了，它们本应有益于地方经济。^22 事实上，这正是嘉庆皇帝选择相信的。\"钱可能最终富了地方民众\"的假设，给了嘉庆一些安慰——他尽责地表达了一位好儒君对民间疾苦的关切：\n\n国库经费耗尽，并非大事……虽然已拨军费一亿[两]，但这些钱不过散在民间，故不必大为惋惜。令朕寝食难安者，是念及[战场]各省被焚掠之地，无数生灵涂炭。^23\n[译者按：原上谕自英文直译，文言原文待核，见注释23。]\n\n确实，大量军费进入了社会。钱付给了乡勇、军事民夫与驮畜的主人——尽管欺诈与侵吞屡见不鲜。数十万乡勇与民夫中，许多人来自社会底层，几无财产、无可靠生计，有些人本来就是匪徒；战时的雇用——即便只是暂时——帮助缓解了\"无家无业流民群体扩大\"这个日益尖锐的社会问题。正如松筠1800年初所观察到的：陕南汉江谷地山区的穷人被雇去筑堡、掘壕、运给养，或被招募为乡勇守城守卡。关注社会问题的松筠认识到：尽管冲突扰乱了正常生活，战役帮助了这一群体获得生计。^24 勒保1800年底也提到：无家无业者通过充当军事民夫或乡勇获得了生计。^25 然而，战时的雇用是否帮助赤贫者长期改变生活——例如获得一块土地或开个小买卖——是另一个问题。显然，其中一些人在被遣散时很难重新适应平民生活——数百、也许数千名被遣散的乡勇与军事民夫加入了叛军或沦为匪徒。四川战后，其中许多人以劫掠或贩私盐为生，成为社会秩序的持续挑战。^26\n军费还被用于采购战区内外物资。大宗购买各种货物几乎肯定刺激了地方经济。1799年春，勒保一次就在太平与大宁为德楞泰的军队买了一万多双鞋——对这两个人烟稀少的地方来说，这是一笔相当大的交易。^27 除后勤人员的大宗采购外，后勤队伍跟不上军队时，军队、乡勇、民夫、赶骡者与军中其他人员不得不向当地市场或当地居民购买粮食与其他给养。与乾隆朝诸战争一样，军队的大规模消费也有副作用。起初，由于当地大多数零售交易用铜钱进行，军队与乡勇不得不在当地市场把银子换成铜钱，铜钱短缺不时出现，导致银价下跌。1800年，陕南一两银只值七八百文。为满足军队需要，战场各省铸造、分配了更多铜钱。^28 粮秣与其他货物消费骤增的更严重后果是通货膨胀。双方频繁出入的地区，物价——尤其是粮价——陡涨。给养极其匮乏的陕南，通货膨胀最严重。^29 战区一直短缺的马、骡与其他驮畜价格也剧烈上涨。供需之间的巨大缺口，为投机商人提供了最佳环境。\n现存档案中大体缺位、因而模糊不清的，是商人扮演的角色。然而，档案中的痕迹表明：他们积极与军队贸易、逢迎将领与后勤官员、利用战争创造的其他机会。^30 战区的商业起初虽受战事重创——外埠商人犹豫不敢涉险——解往前线的巨额经费无疑会吸引更大胆者。此外，战事限于局部——1798年起事者人数已大幅减少，战区大部分地区相对安全。谷际岐揭露了前线宝物奢侈品如何充盈；一位朝官也证实：赴前线公干时，达州后勤大员石作瑞除用山珍海味宴请外，还赠他珍珠三斛、锦缎一万匹。^31 对丝绸、珠宝、珍馐等奢侈品的需求，会促使商人与手头有现银的军队、地方官员及后勤人员贸易。由于冲突，国家对四川盐的专卖不得不放宽——这成了许多人的机会。事实上，一些被战争伤害的商人从盐贸易中得到了救赎、发了大财。^32 四川方面，商人会馆——所谓\"会馆\"（huiguan）——大多建于嘉庆朝或之后，这暗示白莲教战争之后涌现了许多暴发户。^33 陕西汉中、兴安两府，漫长战役——更准确地说，战役带来的机会——吸引了各色人等涌入，推高了人口密度。^34\n当然，并非所有解往战区的银子都在本地花掉。军费的很大一部分被官员与旗人带回了北京与满洲。就连一些急切奔赴战争的朝官，如嘉庆所指出的，短暂服役后也急忙回乡用不义之财置地买房。正如谷际岐所描述的，满载货物白银的大车挤满了从中原通往京城的大道——把费力运往前线的白银又运了回来。事实上，经济史家们提出：旷日持久的战役可能启发了汇兑业。鉴于正常运输路线常被战事阻断、携带现金又不安全，一些商人——尤其是山西商人——被迫发展了一套汇款的信用制度。^35 战役后期，一部分被侵吞的军费很可能就是以此方式送回北京的。\n清律规定：官员侵吞超过一千两白银者处死。然而，嘉庆乐于把这条法律撇在一边——即便许多将领在他眼皮底下的京城公然花销不义之财，即便其中一些官员因贪污被捕受控。战役一结束，皇帝就再无动力把任何涉嫌窃取军费者绳之以法；没有下令抄家，也没有开展调查。^36 1805年底之前，额勒登保去世——很可能是多年心脏问题所致。1809年，德楞泰也病逝。三巨头中，只有勒保在战后又活了十五年。尽管有流言说他在四川继续侵吞公款，勒保一直当四川总督到1810年。^37 1819年去世之前，勒保在中枢政府担任过数个要职，是军机大臣。^38 他再也没有被查办。他从苗疆战役、白莲教战争以及漫长的四川总督任期中究竟非法获取了多少钱，至今不得而知。死后，勒保被嘉庆皇帝称赞为忠勤老臣，他在白莲教战争及其他战役中不正当开支所欠的罚款被豁免。此后编纂的众多勒保传记中，他被记以\"在四川发起筑堡工程\"之功——这被视为镇压叛军的关键之一。^39 一个恶人就这样被改造成了英雄。\n如果说高级军事将领与文官大体上逃过了对其拖延与窃款的重罚，战争中低阶文官与衙门书吏的经历则是苦乐参半的。一方面，众多知府知县因服务军队或后勤而获得奖赏升迁，与常常是显赫政治人物的战争领导人建立了交情，还挪用军费填补衙门预算缺口、中饱私囊、或两者兼而有之。有些人还用战争中赚的钱捐了更高的官职。候补官员——本可能要等多年才能得实缺——通过在后勤系统服务，可以更快实现职业目标。^40 对达州——四川第一场起事的发源地、多年四川战场后勤总部——的官员而言，战役的一个持久好处，是1801年底达州直隶州升为绥定府——\"绥定\"意为\"安抚平定\"。^41 这一加强地方控制的措施，给那里所有官员带来了全面升迁。\n另一方面，低阶官员在战争期间更容易被批评或处分。他们常常被责令赔偿运输给养中因盗窃、匪徒或叛军袭击造成的损失。^42 军官们可以向地方官员——无论是否在后勤系统内——索取\"馈赠\"或\"借钱\"。^43 战后审计中，地方官员更容易被责令自掏腰包填补账目窟窿。最重要的是，贪污指控提出时，他们有时被用作替罪羊——尽管他们并非总无过失。战役结束时，勒保的左右手、曾为勒保与德楞泰两人主持后勤的石作瑞突然死亡。^44 他随后被勒保等人顺理成章地指控侵吞了五十万两军费。讽刺的是，石作瑞死时没有留下大笔财产——连像样的葬礼都不够。^45 战争中任职的中低阶文官的神秘死亡——包括石作瑞、曹相业以及1799年死在达州军需局的两名后勤官员——凸显了一个两难：战役戏剧性地改变了低阶文官与大量寄生于地方政府者的沉闷日常，给了他们获取奖赏、职位、升迁与财富的罕见机会，却也使他们暴露于麻烦与风险——有些是致命的。^46\n最大的输家是清朝的中枢政府。首先也是最重要的，乾隆长朝积累的丰厚银储备，因苗疆战役与白莲教战争的前所未有开支而大幅缩减。这一损失是永久而影响深远的——尽管嘉庆皇帝声称：只要钱到了百姓手里，他就不后悔。清朝余下的岁月里，中枢政府国库的银储备再未接近乾隆末年七千万两的水平。因此，中枢政府失去了发起与资助常规开支之外项目的能力——史家们基于清财政史宏观研究已令人信服地论证了这一点。^47 如本研究所证明的，中央府库的耗尽并非因为叛乱的规模。相反，它是镇压者阵营各方共同作用的结果。中枢政府无法准确评估战役的财政需求、严密监控后勤网络末梢军费的分配与花费，只能任凭前线将领与督抚摆布——后者充分利用战争，公然蚕食中枢政府。乾隆对前线猖獗的腐败并非完全盲目，却没有意愿或精力与之斗争，而是指望一场速胜来止住钱的流失。嘉庆这方面，起初打了一场精神抖擞的战斗，但不久就放弃了。\n从1799年底起，清朝国家拼命筹措经费支撑旷日持久而昂贵的战役，同时维持京城及帝国其他地方的日常与紧急开支。为省钱，嘉庆自我克制，暂停了一些非必要的项目——如宫殿翻修与皇陵修缮。^48 就连对待旗人他也不得不吝啬。^49 深知中枢政府财政困境，一些省级官员不愿奏报本辖区灾情、不愿请求救灾经费。^50 为弥补巨额财政缺口，清朝国家别无选择，只能超越常规渠道筹款。乾隆死前虽已采取一些措施，但筹钱进入高速档，是在嘉庆接手之后。\n在试图把支撑战役的负担转嫁给各省、要求它们动用自己的储备金（封贮银，fengzhuyin）解往战争的同时，国家采取了许多筹款措施——包括向商人募捐与售卖监生头衔，如第7章所述。或许由于各省的呼声，1800年初，嘉庆允许各省售卖监生头衔以补充枯竭的藩库。^51 嘉庆虽警告各省：藩库储备恢复正常后应停止售卖，各省却难以放手。为分享其利，1801年底，嘉庆裁定：各省售卖头衔的收入每达十万两即解京——这也等于默认此做法继续。^52 另一个久已有之的筹款办法是卖官。乾隆此前用过多次，1798年又以\"战后重建川陕鄂\"为借口再次启用。^53 嘉庆虽在乾隆死后以\"于义有亏\"为由叫停，^54 鉴于大量白银涌入中枢国库，卖官很难刹车。1799年夏末，嘉庆妥协：允许那些动身赴京、尚未闻知停售之令的人到京后买官——事实上推翻了他早先的裁定。^55 1801年底最终叫停时，这项计划已为中枢政府带来总计两千一百多万两。^56\n同时，国家转向自己的官僚筹钱。到1799年中，它已订立新规，征收官员所欠的欠款——总计超过五百八十万两。^57 或许因为进展缓慢，1800年秋，嘉庆颁发谕旨，点名敦促一些官员一年内还清欠款——因为镇压战役接近尾声，国家急需战后重建经费。^58 嘉庆还对获罪官员处以罚款。这个由和珅开创的方案——所谓\"议罪银\"（yizuiyin）——曾是和珅与其主子乾隆皇帝敛财的途径之一。嘉庆在和珅被清除后虽正式停用，却很快暗中恢复。不再用\"议罪银\"一词，嘉庆动员被惩处的特定官员\"出资自赎\"（chuzizishu）。^59\n嘉庆知道几乎所有卷入白莲教战争的官员都点石成金，便特别瞄准这个群体——尽管他不让他们为滥用与侵吞军费承担政治或法律责任。他先挑出已去世多时的毕沅，裁定其家必须全额缴清毕沅未缴的罚银两万多两。^60 1800年初，嘉庆采取了更咄咄逼人的一步：命扣发四川、湖北、陕西、河南四省官员——从督抚到道员——的一部分\"养廉银\"，以偿还他们以乡勇、军事民夫之名乱花的部分经费；并命四省被罢免的官员或其家属为自赎\"捐\"一些钱。然而，只有吴熊光主持的河南与台布主持的陕西积极响应了这一号召。^61\n1800年初，嘉庆命重审永保与景安案。虽然给出的理由是发现了新指控，未明言的动机很可能是劝\"捐\"。新判决宣布才几个月，永保就出狱了。永保很可能缴了罚银赎身。但景安——财务记录清白——可能没有钱自赎。因此，他坐牢直到1803年。1800年中蒙羞倒台后，那彦成向朝廷交出北京城郊一座乾隆赐给阿桂的宅第。交宅很可能出自嘉庆之命。^62 最有趣的案例是宜绵——1799年初被罢免、发往乌里雅苏台。找不到借口再治其罪，1800年初，嘉庆怂恿他捐些钱。^63 对宜绵的认捐不满意，嘉庆继续施压要他多出——甚至提到勒保1799年被捕时认捐的三万两。宜绵要么没钱可付、要么不愿付，反而请求上前线服役。结果，宜绵被免去乌里雅苏台之职，流放伊犁。^64\n筹钱热潮中，其他可能性也被提出并斟酌。1800年春末，内务府大臣建议拍卖开国以来购藏的古玩珍宝，嘉庆没有批准。^65 1804年，一个山西平民提议向富人加征，也被驳回。^66 一些提议没有立即被接受，数年后被采纳——如盐价的提高。^67 即便在绝望的筹钱中，清朝国家也没有直接或间接加征田赋。嘉庆虔诚地坚守\"藏富于民\"（cangfuyumin）的信条，任何加税都不在考虑之列——即便在最艰难的1799至1801年。或许是知道皇帝的心思，官场中无人提出加税。\n统治国家的头几年，嘉庆不得不同时打两场仗：一场收束对白莲教叛军的迁延镇压，另一场筹款以实现财政平衡。两场战役环环相扣——战争结束得越早，国家的财政状况就越好。然而，嘉庆及其政府未能迅速结束战争，听任对少量叛军残部的军事行动迁延多年。而重振财政活力这条战线上，嘉庆的成绩值得称道。通过把支撑战役的财政重担转给各省与私人部门，中枢政府的国库在数年内恢复了平衡——尽管从未恢复丰盈。1801年夏，北京大水之后，国家不得不资助一项修复永定河的昂贵工程，这进一步把国库银储备降到一千六百九十万两的历史最低点。此后，银储备稳步增长，1805年达二千四百五十万两——标志着镇压战争终于叫停时，清朝国家已走出财政危机最糟的阶段。^68\n中枢政府层面短期恢复财政平衡的有限成功，打消了清朝大幅改造其战争供款方式——更重要的是其财政结构——的紧迫感。^69 同时，财政危机的结束，减轻了嘉庆强力要求军事将领迅速结束战争的压力。嘉庆朝余下的岁月与随后的道光朝（1826—1850），清朝国家反复使用白莲教战争期间的应急筹款措施，为紧急或特殊项目筹钱。^70 同时，嘉庆皇帝诉诸节俭的修辞，煞费苦心地把自已描绘成对利益与铺张无兴趣。^71 其子、继任者道光皇帝接过了这一修辞，在展示节俭癖好上更进一步。与从不掩饰追逐财富、炫耀财富的乾隆不同，嘉庆与道光都不得不把节制开支列为优先。普免钱粮——清朝黄金时代的标志之一——再也没有出现过。或许更关键的是，清朝国家大大背弃了自开国之初就奉行的\"财政上优先保障军队\"的政策。就连在南方、东南沿海剿海盗的水师，也没有获得足够经费升级船队——自乾隆朝末年起，他们有时租用商船作战，因为商船比清朝水师那些老旧、缓慢、装备简陋的战船更快、火器更好。^72\n艰难时世迫使身陷困境的嘉庆皇帝反思财政灾难的根源。亲政才一年多，嘉庆就确信：中枢政府如此慷慨地为镇压教门叛军的战役供款，可能是不明智的——他们不过是恼人而微末的地方之患，不值得动用中枢政府的资源。^73 确实，各省都有自己的驻军，由各省军事预算供养。如果驻军尽到职责、迅速消灭起事者，中枢政府本不必为战役付钱。对嘉庆而言，这个简单的道理是吃了苦头才学到的。然而，他与战役撇清干系的尝试完全失败。如第4章所述，1800年春从北京拨四十万两给四川之后，嘉庆告诉四川战役事实上的主持者勒保与德楞泰：此后他们必须用四川的钱支撑战役。^74 然而，仅仅几天他就投降了，很快恢复为四川战役供款——因为勒保与德楞泰不断施压。^75\n在与战场省份的经费角力中失败，中枢政府战后也未能收回其在各省财政关系中的杠杆。更具体地说，它在向各省获取资源上无能为力。战后，欠税与关税短缺变得更大、更普遍，各省还清欠款的时间更长——如果不说干脆被无视的话。^76 对某些省份而言，这或许是对嘉庆政府白莲教战争期间——尤其是最后几年，户部库分文未拨给战争时——的勒索的反冲。受战役影响的各省，公共粮仓战后多年仍是空的——尽管据称花了那么多钱购粮补仓。社仓（shecang）也是如此。^77 事实上，其他省份保持粮仓充盈也没好到哪里去。中枢政府也未能收齐对许多战争中任职、被控乱花或侵吞军费的官员所课的罚银。到1811年，四川官员仍在缴付廓尔喀之役的罚银，更不用说白莲教战争的了。^78\n同时，各省在与中枢政府的财政关系中变得更加主动。所有以这样那样方式为战役出过力的省份，都主动要求中枢政府报销它们支援战争的一切开支——无论多小。^79 更精于算计的省级官员——如勒保——采取了更咄咄逼人的步骤。1804年，勒保以\"四川为战役动用了太多省库资金\"为由，请求中枢政府给四川一些补贴。曾在户部四川司任职的御史严天培驳斥了勒保的说法，说他了解四川的财政状况。^80 确实，四川战役期间收到数千万两、到头来却抱怨经费短缺，实在荒谬。\n北京当时以及此后多年都不知道的是：四川政府一直以\"支援战役\"为名继续向纳税人征收附加费。四川地税被压得异常之低、民众相对富裕，官员们在战争等紧急事态时有时征收附加费——\"民间帮贴\"（minjian bangtie）或称\"里民津贴\"（limin jintie）。^81 征收附加费或许不只四川有，但四川最为臭名昭著。^82 深知四川的这一做法、又担心知县及其差役把此事变成对纳税人的勒索狂欢，嘉庆1800年初告诫魁伦不要征收附加费。^83 数月后，复职的勒保请求以\"犒赏自愿乡勇\"为名征收附加费。嘉庆起初勉强同意，很快又改了主意，告诉勒保：如果四川军费够撑一年，就暂停征收。^84 但勒保还是征收了，而且毫不手软。1801年初的一个月里，就收了十五万四千多两——接近四川年地税六十六万两的百分之二十五。^85 随后1802年，勒保又征收了一次。^86 为减轻自己给纳税人增负的不安，嘉庆两次都给受征收影响之地蠲免赋税，同时警告勒保下不为例。1802年之后勒保虽没有再奏请，却继续在四川征收附加费——即便战役结束之后。中枢政府多年来被蒙在鼓里。^87\n显然，财政分权在19世纪头几十年已成为现实，它将在19世纪50年代太平天国起义震动全国时达到危机点。归根结底，它表明中枢政府对各省控制力的削弱——这是政治分权的一个症状。正如本研究力图展示的：中枢政府无力指挥与约束战争领导层，指向了一场严重的政治危机。乾隆与嘉庆两位皇帝都清楚前线的腐败与将领、地方官员的自利行为，却没有有效手段加以约束，更不用说根除普遍的滥行。嘉庆1799年接手后虽试图推行前线改革，这项事业很快被根深蒂固的前线文化与既得利益击败。为安抚旧班底，他牺牲了魁伦——一位认真的改革者、前线腐败的局外人。^88 漫长战役余下的岁月里，嘉庆政府对\"清剿数千、继而数百名叛军残部\"的时间表完全无能为力。皇帝不得不就完成军事行动进行谈判、甚至恳求。指挥链的断裂，造成了堪称清史上最放荡的军事战役。\n近代早期的一些欧洲国家，战争在强化国家机器、提升其效能上扮演了关键角色。清朝早期，与准噶尔蒙古人较量时，为在极西北边疆的战争动员，迫使国家改造革新其行政、军事与后勤制度——以战胜凶悍的准噶尔蒙古人，后者对清朝拥有某些优势。^89 然而，白莲教战争被证明是完全不同的案例。敌人组织涣散、装备简陋，既无明确政治纲领、又无有效的军事战略，远未对王朝构成严重挑战；镇压者即便不拼命迅速消灭他们，也不会冒真正的危险。换言之，机会成本极低。于是，一个巨大的讽刺产生了：正是因为叛乱的孱弱，清朝才花了许多年扑灭它——战役各方（无论军人还是文官）的优先事项不是消灭叛乱，而是个人利益最大化。更糟的是，漫长的战役证明：嘉庆政府既没有勇气、也没有手段在战争结束后改造现状。19世纪头几十年的发展——至少在与命脉相关的军事与财政领域，没有任何实质改革——不支持\"清朝不仅挺过了白莲教战争、还因处理它而焕发新生\"的看法。\n缩写对照\nCMOR　户部库（Buku）\nICMOR　户部内库（Neiku）\nIHD　内务府库（广储司，Guangchusi）\n注释\n题辞：QSLJQ, 64/10b.\n\nXFFL, 352/4b; XFFLXB, 16/39b–40a, 32/16a–21b.\nQSG, 11251.\n战争中病故的官员包括毕沅、鄂辉、舒亮、汪新、恒瑞、书麟、陆有仁与惠龄。\n关于昭忠祠，见邦克（Bonk）\"Loyal Souls,\" 75–96。\nXFFL, 242/38b–39b.\n关于天理教八卦起义，见韩书瑞（Naquin）Millenarian Rebellion。\n嘉庆称赞长龄、杨遇春与赛冲阿的速胜。JQSYD, 19:110–11.\nQSLJQ, 24/15b–17a.\n《四川通志》（Sichuan tongzhi），卷首, 11/58b–60a, 12/5b–7b。\n只有河南一县雇了乡勇。韩书瑞（Naquin）Millenarian Rebellion, 236–37, 353。\n孔飞力（Kuhn）Rebellion and Its Enemies, 49–50。\nXFFLXB, 27/30a–31b. 为奖励他的明智建议，嘉庆恢复了被罢免的宜绵。QSLJQ, 129/21a–23a.\nXFFL, 333/14a–16a.\nXFFL, 333/22b–23a.\n勒保还收揽了马朝瑞。但马朝瑞不久就退休了。XFFL, 156/8b–12b.\n赛冲阿1800年底虽升任固原提督，仍作为德楞泰随从之一留在四川。XFFL, 203/22b–28b.\n关于杨遇春不寻常的仕途，见邦克（Bonk）\"Patronage and Personal Bonds\"。\nXFFLXB, 36/13b–16b.\n宁陕兵变后，嘉庆命不补空缺、裁撤秦岭新设营伍或以老兵充之。德楞泰与方维甸遂提议在陕西裁两千名士兵，宁陕镇只留三千多名。XFFLFB, 4/32b–34b, 6/34b–38b, 8/16b–17b.\n例如，河南方面，那些新兵到1803年只剩二千五百名——一些填补了河南驻防空缺，另一些被裁。SHD, 嘉庆八年九月初八日, 91–95。\nJQSYD, 19:278; QSLJQ, 288/18b–20b; 罗尔纲《绿营兵志》（Luo, Lüying），86–88, 95–97。\n史家马若孟（Ramon Myers）曾假定：\"它从巨额积累中支出，因此这些大规模开支必定对就业与生产产生了有利而刺激的作用。只有受战争不利影响的地区生产下降。\"Chinese Economy, 72.\nQSLJQ, 64/10b.\nXFFL, 140/31b.\nXFFL 219/17b–18a.\nJQSYD, 16:207.\nXFFL, 98/9b–10a.\n正常比率为一两银兑一千文。1797与1800年，数万串铜钱从西安解往兴安府以应军需。XFFL, 54/26b–27b, 208/10a–11b.\n1800年秋收之前，米价涨到每石五两。当地居民卖面粉食品，每两（一或二两）卖八分至一钱二分；一双布鞋卖四至五钱。XFFL, 144/7a, 174/1a. 1802年夏，汉中、兴安两府米价涨到每石五至六两。XFFL, 327/18a. 同年晚些时候，秋季干旱使通胀加剧。汉中米价高达每石九至十两，玉米五两。XFFL, 233/4a–5b.\n机会包括向其他省份贩卖在动荡中失去家庭的四川妇女。战争期间，四川当局截住了顺长江而下满载妇女的船只。这门生意至少持续到19世纪10年代初。JQSYD, 16:207.\n昭梿《啸亭杂录》（Zhaolian, Xiaoting zalu），258–59。\n例如，湖北房县一些被战事逼停业的当铺老板与掮客去四川贩 2a–14b. 1809年，清朝国家为提高大运河维修经费加盐价。此后整个19世纪，它反复加盐价以获额外收入。陈锋《清代盐政》（Chen, Qingdai yanzheng），138–40。\n史志宏《清代户部银库收支和库存统计》（Shi Zhihong, Qingdai Hubu），79, 197, 278。\n巴特利特（Bartlett）提到嘉庆朝的\"杂七杂八的小经济改革\"，但没有具体说明。Monarchs, 232.\n1800至1820年间，十六省（除直隶、山西）售卖监生头衔筹得四千多万两。此措施在道光朝继续以较小规模使用。汤（Tang）\"道光朝捐监\"。1814年，嘉庆勉强批准又一轮卖官，为镇压豫陕两场起义与一项水利工程筹款。JQSYD, 19:6.\nJQSYD, 5:530; JQQJZ, 6:178. 关于嘉庆节俭的倾向，见关文发《嘉庆帝》（Guan, Jiaqingdi），14, 86–103。\nQLSYD, 18:708–10.\n1800年春末，陕南叛军离开豫陕边境时，嘉庆指示吴熊光：把因叛军威胁拨给河南的五十万两转送陕西或湖北。他补充说：吴熊光可以从这笔钱中支付外省调来的三千名士兵的开支，但不应用于河南军队驻守的边防——他们已领饷银与其他补偿，不必再给额外补偿。XFFL, 173/20b–22a.\nXFFL, 177/3b–7b.\n数日后，五月初一日，嘉庆在另一道谕旨中退了一步：解释此前所说意在限制无度开支，但如果德楞泰与勒保确实能在四川取得进展，他愿意供一些钱。XFFL, 178/7a–8b.\n史志宏《清代户部银库收支和库存统计》（Shi Zhihong, Qingdai Hubu），45, 109–11；陈锋（Chen Feng）\"清代财政支出\"，139–43, 145–47。嘉庆朝后期，清理欠款成为北京与各省最重要的问题之一。JQSYD, 19:600–601, 603. 又见朱（Zhu）\"嘉庆朝整顿钱粮\"——其结论是嘉庆清欠运动失败。\n《达县志》（Daxian zhi），11/32b；《大宁县志》（Daning xianzhi），3/1b, 6/8a；《房县志》（Fangxian zhi），4/10b。\n嘉庆十六年十一月初四日，常明请求把未缴清罚银者的\"养廉银\"扣缴比例从百分之五十降到百分之三十，嘉庆同意。JQSYD, 16:627.\nNGDK数据库档案中此类案例众多。例如，几个省开列了向战场省份运粮所用粮袋的费用。甘肃政府甚至要求报销在甘肃为迎送过境军队而设路边棚子的费用。\nNGDK, 217799.\n关于四川低税的理由，见戴（Dai）Sichuan Frontier。第二次金川之役与第二次廓尔喀之役期间，四川曾征收附加费。QLSYD, 18:780, 784–85, 802–4.\n陈锋认为这是乾隆、嘉庆、道光朝为战争筹款的途径之一，但他没有点出四川以外的省份。\"清代财政收入\"，104。白莲教战争期间，似乎只有四川征收了附加费。据吴熊光说，湖北没有征收。XFFL, 304/24b–25b.\n嘉庆指示魁伦严惩作恶者，甚至将任何已征收的官员绳之以法。XFFL, 138/19a–20a.\nXFFL, 184/25a–29a, 185/13b–14b.\nXFFL, 237/24b–25b.\nXFFL, 308/11b–12a, 308/20a–21b.\n直到1811年——勒保卸任四川总督后不久——御史韩鼎晋才揭露此事。韩鼎晋奏报：附加费已被改称\"夫马价\"（fumajia），知县们把这名义下收的钱挪作衙门开支。JQSYD, 16:207.\n广兴的结局与魁伦相似。回京后，广兴在中枢政府数部任职，包括内务府大臣与户部尚书。然而，他耿直的性格树敌众多。1809年，广兴因\"违例\"被判处自缢。QSG, 11301–2.\n濮德培（Peter C. Perdue）在《中国西进》（China Marches West）中雄辩地证明了这一点。\n\n文献缩写全表\n\n\n\n缩写\n全称\n说明\n\n\n\n\nBLJZL\nQing zhongqi wusheng Bailianjiao qiyi ziliao\n《清代中期五省白莲教起义资料》\n\n\nGZDJQ\nGongzhongdang, Jiaqing period\n《宫中档·嘉庆朝》\n\n\nJQQJZ\nJiaqingdi qijuzhu\n《嘉庆帝起居注》\n\n\nJQSYD\nJiaqingchao shangyudang\n《嘉庆朝上谕档》\n\n\nJXZL\nQinding Hubu Bingbu Gongbu junxu zeli\n《钦定户部兵部工部军需则例》\n\n\ 月十一日\n1,000,000\n陕西\n陆有仁\n存河南经费三十四万、浙江二十六万、广东四十万（商人捐输二十万、海关关税二十万）\nXFFL, 332/1b–3b\n\n\n七年十月十九日\n500,000\n四川\n杨揆\n两淮盐课三十万、广东关税二十万\nXFFL 346/22b–25b\n\n\n八年二月初一日\n500,000（请三十至四十万）\n陕西\n吴熊光⁴\n两淮商人捐输二十二万与浙江商人捐输二十八万；先到河南、再解陕西\nXFFL, 342/33b–36a, 342/38b–40a; XFFLXB, 4/1a\n\n\n八年二月十八日\n400,000\n湖北\n嘉庆\n存河南经费三十万。但嘉庆三月十一日提到本年已给湖北四十万，吴熊光证实。\nXFFLXB, 5/8a, 8/35a–36a, 9/34b\n\n\n八年闰二月十八日\n700,000\n四川\n嘉庆\n两淮商人捐输\nXFFLXB, 7/8b\n\n\n八年五月二十九日\n550,000\n四川、陕西\n嘉庆\n解河南的两淮商人捐输中，三十万到四川、二十五万到陕西\nXFFLXB, 8/35a–37a, 13/40b–41\n\n\n八年六月初五日\n200,000\n湖北\n嘉庆\n两淮商人捐输。解鄂同日，嘉庆命福建、广东、江苏、浙江等关各解五万或十万到河南。\nXFFLXB, 13/41a, 14/15a–b\n\n\n九年正月初八日\n1,000,000\n四川\n嘉庆\n广东关税\nXFFLXB, 23/14b–15a\n\n\n九年二月二十四日\n600,000\n陕西\n嘉庆\n广东外贸商人及盐商捐输四十万、两淮盐课二十万\nXFFLXB, 24/29b–30b\n\n\n九年四月二十六日\n200,000\n湖北\n嘉庆\n湖南、湖北监生捐纳收入各十万\nXFFLXB, 26/38b–39a\n\n\n九年六月十一日\n600,000\n陕西\n户部（奉嘉庆之命）\n九江、龙江、淮安、浒墅关等关税五十万，陕西藩库十万\nXFFLXB, 28/36b\n\n\n\n\n仅此笔与随后两笔的经费来源列为\"内帑\"（neitang）。据上下文与数额判断，作者认为应指中枢政府库藏，最可能是\"内库\"。\n但陆有仁后来说：陕西从甘肃\"协饷\"中留的是三十万而非二十万。XFFL, 279/4b. 因该款于1801年十一月广东二十万到达陕西后归还甘肃（XFFL, 288/26b），故未计入表7.1、7.2。\n广东经费到达时陕西应归还甘肃此数，故未计入表7.1、7.2。\n起初系备额勒登保赴鄂之需。\n", "sections": []}, {"id": "c10", "title": "全书术语表", "kicker": null, "part": "第三卷 · 结语", "html": "<p>[译者按：本表汇总全书译名，供校核统一。人物、地名以首次出现体例为准：首次出现附原文，此后仅用译名。]</p>\n<h2>一、人名</h2>\n<table>\n<thead>\n<tr>\n<th>原文</th>\n<th>译名</th>\n<th>备注</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Jiaqing (Yongyan)</td>\n<td>嘉庆（颙琰）</td>\n<td>清仁宗，1796—1820年在位</td>\n</tr>\n<tr>\n<td>Qianlong</td>\n<td>乾隆</td>\n<td>清高宗，1736—1796年在位</td>\n</tr>\n<tr>\n<td>Hešen</td>\n<td>和珅</td>\n<td>满语名</td>\n</tr>\n<tr>\n<td>Lebao</td>\n<td>勒保</td>\n<td></td>\n</tr>\n<tr>\n<td>Eldemboo</td>\n<td>额勒登保</td>\n<td></td>\n</tr>\n<tr>\n<td>Delengtai</td>\n<td>德楞泰</td>\n<td></td>\n</tr>\n<tr>\n<td>Mingliang</td>\n<td>明亮</td>\n<td></td>\n</tr>\n<tr>\n<td>Yongbao</td>\n<td>永保</td>\n<td>勒保之弟</td>\n</tr>\n<tr>\n<td>Huiling</td>\n<td>惠龄</td>\n<td>蒙古旗人</td>\n</tr>\n<tr>\n<td>Yimian</td>\n<td>宜绵</td>\n<td></td>\n</tr>\n<tr>\n<td>Fun <script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('book-data').textContent);
  var chapters = DATA.chapters, parts = DATA.parts, notes = DATA.notes;
  var cur = -1, results = [], searchTerm = '', marks = [], markIdx = 0;
  var $ = function (id) { return document.getElementById(id); };
  var toc = $('toc'), content = $('content'), fnPop = $('fn-pop');

  /* ---------- 偏好 ---------- */
  var THEMES = ['sepia', 'light', 'green', 'dark'];
  function applyPrefs() {
    var t = localStorage.getItem('lxr.theme');
    if (t && THEMES.indexOf(t) >= 0) document.body.dataset.theme = t;
    var fs = parseInt(localStorage.getItem('lxr.fs'), 10);
    if (fs >= 14 && fs <= 32) document.documentElement.style.setProperty('--fs', fs + 'px');
    if (window.innerWidth < 860) document.body.classList.add('side-hide');
  }
  function setFs(delta) {
    var fs = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'), 10) || 19;
    fs = Math.max(14, Math.min(32, fs + delta));
    document.documentElement.style.setProperty('--fs', fs + 'px');
    localStorage.setItem('lxr.fs', String(fs));
  }
  function cycleTheme() {
    var i = THEMES.indexOf(document.body.dataset.theme);
    document.body.dataset.theme = THEMES[(i + 1) % THEMES.length];
    localStorage.setItem('lxr.theme', document.body.dataset.theme);
  }

  /* ---------- 目录 ---------- */
  function renderToc() {
    toc.innerHTML = '';
    parts.forEach(function (p) {
      var pl = document.createElement('div');
      pl.className = 'part-label';
      pl.textContent = p.name;
      toc.appendChild(pl);
      p.chapters.forEach(function (cid) {
        var i = parseInt(cid.slice(1), 10);
        var btn = document.createElement('button');
        btn.className = 'ch-item' + (i === cur ? ' active' : '');
        btn.textContent = chapters[i].title;
        if (localStorage.getItem('lxr.last') === cid) {
          var dot = document.createElement('span');
          dot.className = 'ch-read-dot';
          dot.textContent = '●';
          btn.appendChild(dot);
        }
        btn.onclick = function () { clearSearch(); loadChapter(i); };
        toc.appendChild(btn);
        var sec = document.createElement('div');
        sec.className = 'sec-list' + (i === cur ? ' open' : '');
        chapters[i].sections.forEach(function (s, si) {
          var a = document.createElement('div');
          a.className = 'sec-link';
          a.textContent = s.title;
          a.onclick = function () {
            clearSearch(); loadChapter(i, false);
            var el = content.querySelector('#' + s.id);
            if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
          };
          sec.appendChild(a);
        });
        if (chapters[i].sections.length) toc.appendChild(sec);
      });
    });
  }

  /* ---------- 章节加载 ---------- */
  function loadChapter(i, doScroll) {
    if (i < 0 || i >= chapters.length) return;
    if (cur >= 0) savePos();
    cur = i;
    var c = chapters[i];
    content.innerHTML = c.html;
    $('chapter-title').textContent = c.title;
    $('kicker').textContent = c.kicker || '';
    $('ch-pos').textContent = (i + 1) + ' / ' + chapters.length;
    document.title = c.title + ' — 宗教改革：一部历史';
    $('prev-ch').disabled = $('prev-top').disabled = $('prev-bottom').disabled = (i === 0);
    $('next-ch').disabled = $('next-top').disabled = $('next-bottom').disabled = (i === chapters.length - 1);
    localStorage.setItem('lxr.last', 'c' + i);
    clearMarks();
    renderToc();
    window.scrollTo(0, 0);
    if (doScroll !== false) {
      var y = parseInt(localStorage.getItem('lxr.pos.c' + i), 10) || 0;
      requestAnimationFrame(function () { window.scrollTo(0, y); });
    }
  }
  function savePos() {
    if (cur < 0) return;
    localStorage.setItem('lxr.pos.c' + cur, String(window.scrollY));
  }
  function go(d) {
    clearSearch();
    loadChapter(cur + d);
  }

  /* ---------- 进度条 / 回顶 ---------- */
  var saveTimer = null;
  window.addEventListener('scroll', function () {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    $('progress-bar').style.width = (max > 0 ? (window.scrollY / max * 100) : 0) + '%';
    $('top-btn').classList.toggle('hidden', window.scrollY < 600);
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(savePos, 400);
    hideFn();
    spySections();
  }, { passive: true });

  function spySections() {
    var best = null, bestTop = -1;
    content.querySelectorAll('h2[id],h3[id]').forEach(function (el) {
      var top = el.getBoundingClientRect().top;
      if (top <= 120 && top > bestTop) { bestTop = top; best = el.id; }
    });
    toc.querySelectorAll('.sec-link').forEach(function (l) { l.classList.remove('active'); });
    if (best && cur >= 0) {
      var sec = null;
      for (var i = 0; i < chapters[cur].sections.length; i++) {
        if (chapters[cur].sections[i].id === best) sec = chapters[cur].sections[i];
      }
      if (sec) {
        toc.querySelectorAll('.sec-link').forEach(function (l) {
          if (l.textContent === sec.title) l.classList.add('active');
        });
      }
    }
  }

  /* ---------- 注释浮窗 ---------- */
  content.addEventListener('click', function (e) {
    var sup = e.target.closest ? e.target.closest('sup.fn') : null;
    if (!sup || !sup.dataset.note) return;
    var txt = notes[sup.dataset.note];
    if (!txt) return;
    e.stopPropagation();
    var r = sup.getBoundingClientRect();
    var left = Math.min(r.left + 10, window.innerWidth - 460);
    fnPop.innerHTML = '<b>注释 ' + sup.textContent + '</b><br>' + txt;
    fnPop.style.display = 'block';
    fnPop.style.left = left + 'px';
    if (r.bottom + 40 > window.innerHeight) {
      fnPop.style.bottom = (window.innerHeight - r.top + 8) + 'px';
      fnPop.style.top = 'auto';
    } else {
      fnPop.style.top = (r.bottom + 8) + 'px';
      fnPop.style.bottom = 'auto';
    }
  });
  function hideFn() { fnPop.style.display = 'none'; }
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('#fn-pop')) hideFn();
  });

  /* ---------- 检索 ---------- */
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  $('search').addEventListener('input', function () {
    var q = this.value.trim();
    searchTerm = q;
    clearMarks();
    if (!q) { renderToc(); $('search-nav').style.display = 'none'; return; }
    results = [];
    for (var i = 0; i < chapters.length && results.length < 120; i++) {
      var idx = 0, text = chapters[i].text;
      while (idx < text.length && results.length < 120) {
        var p = text.indexOf(q, idx);
        if (p < 0) break;
        results.push({ ch: i, pos: p });
        idx = p + q.length;
      }
    }
    toc.innerHTML = '';
    var div = document.createElement('div');
    div.id = 'results';
    var shown = 0, qEsc = escapeHtml(q), qRe = new RegExp(escapeRegExp(qEsc), 'g');
    for (var r = 0; r < results.length && shown < 100; r++) {
      var it = results[r], c = chapters[it.ch];
      var p0 = Math.max(0, it.pos - 30), p1 = Math.min(c.text.length, it.pos + q.length + 30);
      var snipText = escapeHtml(c.text.slice(p0, p1));
      var snip = (p0 > 0 ? '…' : '') + snipText.replace(qRe, '<mark>' + qEsc + '</mark>') + (p1 < c.text.length ? '…' : '');
      var item = document.createElement('div');
      item.className = 'res-item';
      item.innerHTML = '<div class="res-ch">' + c.title + '</div><div class="res-snip">' + snip + '</div>';
      item.onclick = (function (i2, pos) {
        return function () {
          loadChapter(i2, false);
          highlightAndGo(pos);
        };
      })(it.ch, it.pos);
      div.appendChild(item);
      shown++;
    }
    if (!shown) div.innerHTML = '<div class="part-label">未找到相关内容</div>';
    toc.appendChild(div);
    $('search-nav').style.display = 'none';
  });
  $('search').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && results.length) {
      var it = results[0];
      loadChapter(it.ch, false);
      highlightAndGo(it.pos);
    }
    if (e.key === 'Escape') { this.value = ''; this.dispatchEvent(new Event('input')); this.blur(); }
  });

  function highlightAndGo(charPos) {
    clearMarks();
    var q = searchTerm;
    if (!q) return;
    var found = [];
    var pos = { p: 0 };
    (function walk(node) {
      if (node.nodeType === 3) {
        var t = node.nodeValue;
        var local = -1;
        while ((local = t.indexOf(q, local + 1)) >= 0) {
          found.push({ node: node, local: local, global: pos.p + local });
        }
        pos.p += t.length;
        return;
      }
      if (node.nodeType !== 1) return;
      for (var c = node.firstChild; c; c = c.nextSibling) {
        if (c.nodeType === 1 && c.tagName === 'MARK') { pos.p += c.textContent.length; continue; }
        walk(c);
      }
    })(content);
    if (!found.length) { $('search-nav').style.display = 'none'; return; }
    var byNode = new Map();
    found.forEach(function (f) {
      if (!byNode.has(f.node)) byNode.set(f.node, []);
      byNode.get(f.node).push(f);
    });
    byNode.forEach(function (list, node) {
      list.sort(function (a, b) { return b.local - a.local; });
      list.forEach(function (f) {
        var range = document.createRange();
        range.setStart(f.node, f.local);
        range.setEnd(f.node, f.local + q.length);
        try {
          var mark = document.createElement('mark');
          mark.dataset.pos = String(f.global);
          range.surroundContents(mark);
          marks.push(mark);
        } catch (err) { /* 忽略跨节点情况 */ }
      });
    });
    marks.sort(function (a, b) { return parseInt(a.dataset.pos, 10) - parseInt(b.dataset.pos, 10); });
    markIdx = 0;
    for (var i = 0; i < marks.length; i++) {
      if (parseInt(marks[i].dataset.pos, 10) >= charPos) { markIdx = i; break; }
    }
    $('sn-info').textContent = (markIdx + 1) + ' / ' + marks.length + ' 处';
    $('search-nav').style.display = 'flex';
    goMark(markIdx);
  }
  function goMark(i) {
    if (!marks.length) return;
    markIdx = (i + marks.length) % marks.length;
    marks.forEach(function (m, k) { m.classList.toggle('cur', k === markIdx); });
    marks[markIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
    $('sn-info').textContent = (markIdx + 1) + ' / ' + marks.length + ' 处';
  }
  function clearMarks() {
    marks.forEach(function (m) {
      var p = m.parentNode;
      while (m.firstChild) p.insertBefore(m.firstChild, m);
      p.removeChild(m);
    });
    marks = [];
    markIdx = 0;
    $('search-nav').style.display = 'none';
  }
  function clearSearch() {
    $('search').value = '';
    searchTerm = '';
    clearMarks();
    if (toc.querySelector('#results')) renderToc();
  }
  $('sn-prev').onclick = function () { goMark(markIdx - 1); };
  $('sn-next').onclick = function () { goMark(markIdx + 1); };
  $('sn-close').onclick = clearSearch;

  /* ---------- 按钮与键盘 ---------- */
  $('prev-ch').onclick = $('prev-top').onclick = $('prev-bottom').onclick = function () { go(-1); };
  $('next-ch').onclick = $('next-top').onclick = $('next-bottom').onclick = function () { go(1); };
  $('fs-dec').onclick = function () { setFs(-1); };
  $('fs-inc').onclick = function () { setFs(1); };
  $('theme-btn').onclick = cycleTheme;
  $('top-btn').onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('toc-btn').onclick = toggleSide;
  $('scrim').onclick = toggleSide;
  function toggleSide() {
    if (window.innerWidth < 860) {
      document.body.classList.toggle('side-open-mobile');
      document.body.classList.toggle('side-hide');
    } else {
      document.body.classList.toggle('side-hide');
    }
  }

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 's' || e.key === 'S') { e.preventDefault(); $('search').focus(); }
    else if (e.key === 't' || e.key === 'T') toggleSide();
    else if (e.key === 'Escape') clearSearch();
  });

  /* ---------- 启动 ---------- */
  applyPrefs();
  var start = parseInt((localStorage.getItem('lxr.last') || 'c0').slice(1), 10);
  loadChapter(isNaN(start) ? 0 : start);
})();
</script>
</body>
