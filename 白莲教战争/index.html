宜都查办教众后，勒索聂杰人及数百人的钱财。常丹葵只释放付了钱的人，而拷打、杀害了数百人——有些人的头被钉在墙上，有些人被成批锤杀。常丹葵还把许多人押往武昌审讯，数百人挤在一条船上，许多人饥寒而死，尸体漂浮在长江上。谷际岐附和皇帝的论调，声称常丹葵是宜都起事的罪魁，而起事者即便反了，对皇帝也没有恶感。^45 谷际岐绘声绘色的指控令嘉庆震惊，他命将常丹葵解京审讯。^46 至于四川，嘉庆责成勒保查办达州前知州戴如煌——他听说戴如煌是个恶官。^47</p>\n<p>然而，随后的调查未能把二人定为恶官之尤。常丹葵在刑部受审，面对刑讯，几乎否认了全部指控。常丹葵虽然1794年参加过襄阳查办教众，1796年却从未踏足宜都。^48 聂杰人在北京受审时，也没有提及自己在决定起事之前受过地方官的任何压力。谷际岐的情报得自前线之人，显然把未经证实的流言当成了事实。戴如煌的案子也有问题。年过七旬、因中风而半身不遂的戴如煌，已不能亲理政务，而由属员胥役打理衙门。据说他手下的胥役队伍庞大，总数超过四千人，分四班轮值。1797年初宜绵入川时，因戴如煌不能任事而将其罢免，遣送回重庆家中。^49 那些众多的胥役很可能曾假借戴如煌之名勒索百姓，但要把起事之责钉在衰朽的戴如煌身上，谈何容易。达州被俘的十几名叛军中，除王三槐等少数人外，无人在受审时提及地方衙门的勒索或其他恶行。^50 然而，嘉庆执意坚持自己\"恶官致乱\"的理论，催促刑部与勒保继续调查，寻找更多、更确凿的证据。20世纪，一些史家津津乐道地引用这两位官员的所谓暴行，作为清朝剥削压迫的完美例证。^51</p>\n<h2>向旧班底开刀</h2>\n<p>京内外许多密切关注叛乱进程的官僚，更愿意把手指指向未能迅速平乱的将领，而不是据说对叛乱爆发负有责任的地方官。响应嘉庆征求意见、批评国政的号召，一些人选择站出来说话。1797年曾公开批评前线将领的年轻御史宋澍——当时已任陕甘学政，得以近距离观察战役——再次发声。他指责陕西的将领与省级官员常常谎报军情，尤其讳败为胜、向后勒官员索贿、故意勒兵不进、不彻底消灭敌人。^52 对军队低劣表现的又一尖锐批评来自谷际岐。谷际岐向朝廷奏报了几首流传于战区的讽刺民谣：\"贼来不见官兵面，贼去官兵才出现。何时才得见官兵与贼相见面？\"\"贼来无官兵，贼去官兵出。\"（原文待核，见注释53）^53 还有人批评军队只擒叛军首领、不顾普通叛众的倾向——这使叛军得以迅速重组。^54</p>\n<p>嘉庆接受了这些批评，对其中暴露的两个问题尤为恼火：军情奏报的不实，以及乾隆犒赏军队的方式。他不断斥责将领们讳败为胜、谎报战功，责令他们悔过，只讲真话。与此同时，嘉庆意识到，父亲只在擒获叛军首领时才大加赏赐的做法，可能使部队不愿全歼叛军股团——尽管他也怀疑那些被擒的\"首领\"是否真是首领。因此，他敦促将领们全歼整个股团，而不是只取首领首级。^55</p>\n<p>为平息\"朝廷对将领过于宽纵\"的强烈批评，嘉庆需要惩办领导层中的几个人。谷际岐再次点名宜绵、惠龄、秦承恩与景安（毕沅与汪新已去世），认为他们对未能按时结束战役负有最大责任。^56 嘉庆赞同谷际岐，在1799年头几个月采取了一系列处分。他先罢免了宜绵，指责宜绵作战时总是待在安全的地方——尽管宜绵1798年初返回陕西后已不再参与军事行动。嘉庆任命仍从拉萨赴京途中的松筠为新任陕甘总督。^57</p>\n<p>随后嘉庆转向惠龄。惠龄被免去统帅之职后一直留在四川。嘉庆称他是所有领导人中\"最懈弛\"的一个，初夏惠龄母亲去世时让他回家守制，但没有进一步惩处他——因为惠龄参加过几场擒获多名叛军首领的战斗。^58 接着，秦承恩母亲去世时，嘉庆免去了他的陕西巡抚之职。不久，有人奏报1798年初西安城受叛军威胁时，秦承恩拒纳难民入城，导致许多难民溺死；秦承恩随即被正式革职，解京受审。^59 秦承恩留下的位置，嘉庆任命了刚刚复职、被派往四川加入勒保的永保——不是别人。嘉庆还从伊犁召回永保的两个儿子，都授了侍卫之衔。作为陕西的新巡抚，永保将与他宿怨已久的明亮面对面打交道。^60</p>\n<p>在四川战场，嘉庆瞄准了成都将军富成。乾隆虽然曾高度评价富成，称赞他是\"最勇\"的将领，富成1798年春就任以来却没有打过一场真正的仗。^61 1799年春，他追击从四川窜入甘肃的一股襄阳起事者时，其七千名士兵与乡勇远远落在敌人后面，沿途还严重骚扰当地居民。嘉庆罢免了富成，下令对他查办。勒保起初保护富成，后来改变了立场——因为富成受责后并无改观，更重要的是，嘉庆决心拿富成做儆戒。尽管考虑过死刑，嘉庆顾及处决富成有损军队声誉，只把富成降为兵丁，让他在前线戴罪立功。^62</p>\n<p>最严厉的申斥落在了景安头上。景安是战役领导人中的异数：不贪钱财，却把职责看得重。此外，他批评同侪直言不讳——1796年永保垮台，他起了关键作用。然而，景安的父亲是和珅的远房侄子，这一点如今使他变得易受攻击。嘉庆三番五次地痛斥景安，骂他怯懦，指责他总是避敌、不讲真话，等等。^63 三月，嘉庆罢免景安，派他去四川主持战争后勤——因为皇帝承认景安在财务上是清白的。^64 然而，不久嘉庆又听到了更多对景安的指控：张汉潮窜扰湖北期间，景安为避敌而频频移营，他的士兵每天都要穿坏一双鞋；他还无理地惩处了军官广福——因为广福批评景安频繁移营。结果，嘉庆免去了景安的后勤之职，下令查办。尽管旷日持久的调查未能取得证实指控的过硬证据，嘉庆还是（按勒保的建议）褫夺了景安的伯爵爵位，把他流放伊犁。^65 据说，嘉庆曾向朱珪坦言：他需要惩办一个高级人物来震动令人失望的战役，于是选中了景安。^66</p>\n<h2>勒保的去职</h2>\n<p>挺过了新皇帝第一波的斥责，又手握更高的头衔，勒保本该感到安稳。遵照嘉庆\"不要只追一股叛军，而要坐镇中央、统筹川陕两战场\"的指示，他于1799年二月下旬移驻达州白塔坝，把作战留给额勒登保、德楞泰等按他的命令新近会聚川东的将领。^67 坐镇新大营的勒保，一方面专注于应付朝廷，另一方面继续与将领和地方官们联络感情。他热情称赞额勒登保与德楞泰，替他们挡开批评——更多是为德楞泰。^68 他抱怨和珅常常砍掉前线领导人举荐的升迁名单，请求允许他继续举荐文武官员。^69 一接到皇帝的答复，勒保立即为刘清请升——刘清在擒获王三槐时起了关键作用，尽管勒保没有提这一点。^70 与此同时，勒保努力维持自己严厉主帅的形象。他公开批评明亮，尤其在水保入陕与明亮发生冲突之后（下文将述）。^71 他随意惩处下级军官，往往不先奏报朝廷：摘其顶戴、降其官职，或处以鞭笞、枷号等体罚。^72 起初相信勒保能有所作为的嘉庆，把批评战役、献计献策的奏折都转发给勒保。嘉庆把许多建议斥为\"空谈\"\"无益\"，放手让勒保自行采纳或置之不理。^73</p>\n<p>1799年初，襄阳的两支队伍——张世龙、张世虎兄弟率领的蓝号与杨开甲等人率领的白号——合计一万余人，从四川突入甘肃，把甘肃第二次拖入冲突。尽管甘肃已向湖北、四川派了两万五千至两万六千名士兵，按察使广厚与年近七旬的总兵吉兰泰率领的剩余兵力，在早春两次击退了起事者。后来，一些起事者北窜秦州与平凉，甘肃军队挫败了他们对巩昌城的进攻，把他们逐向陕西陇州。^74 初夏，襄阳两支队伍又回到甘肃与四川接壤的南境。为援助吃紧的甘肃军队，恒瑞被派往甘肃；近五百名撒拉族士兵也被动员起来。^75 到六月下旬，两支队伍都经略阳被赶回川北，尽管他们仍在边境两边穿梭。^76</p>\n<p>在川东，徐天德的黑号1799年初游荡于梁山与垫江。它与冷天禄短暂会合，随后徐天德前往达州，冷天禄前往邻水。^77 三月初，额勒登保病愈复出。他先消灭了两个叛军股团——据说各有数千人——随后在战斗中杀死冷天禄，接着又在广安消灭了冷天禄麾下的数千人，其中包括从徐天德那里要来的一千名战兵。额勒登保的胜利令嘉庆欢欣鼓舞，大加赞赏，称他是\"诚实出力之大将\"，除赏全军一个月饷银外——这已有很久没有过了——还授了他男爵爵位。^78</p>\n<p>然而，冷天禄覆灭之后，四川数月没有取得突破。额勒登保先对付达州以南的一些小股叛军，随后前往北境拦截从甘肃、陕西返回的叛军；德楞泰则追击徐天德到夔州，再到太平。^79 作为统帅，勒保没有向他们施加任何加快进度的压力。一如既往，勒保定期上奏，向朝廷简报战况，试图造成部队正在苦战的印象，只是叛军太顽强、人数太多。他还质疑皇帝的作战方略与战术，尤其挑战嘉庆的新招抚政策——勒保宣称，他一向主张杀尽起事者，而不是给投降者一条生路。^80</p>\n<p>重新确认勒保战役领导地位后还不到一个月，嘉庆就开始抱怨勒保的懒惰与拖延：</p>\n<blockquote>\n<p>勒保自贵州来川剿办邪匪，已一年有余，不可谓为时不久。从前身为统帅，近又授为经略大臣，并非未授以事权。而其奏折不过铺叙战事，从未立有全局方略。偶有条陈，亦无非贼匪行踪、如何追击——事事跟在贼后，从未居高统筹，立有制胜之策。^81</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释81。]</p>\n</blockquote>\n<p>夏天到来，嘉庆设定的第一个期限已过，他陷入了悲观，担心战役秋天之前结束不了——因为叛军可能躲进山里避暑。^82 但勒保的保证安慰了他：胜利已近，除已在途中的两千名云南兵外，无需再派援军。鉴于这是勒保入川以来第一次谈到战争结束，而且他没有抱怨兵力不足，皇帝认真对待了勒保的话。他说自己正数着日子等捷报，拒绝了蒙古王公参战的提议，暂停了为筹款而开的捐纳，还谢绝了江苏盐商的捐款。^83</p>\n<p>然而，整个夏天，四川几乎没有发生战斗。额勒登保没有取得新胜利；德楞泰追着徐天德到太平后也停了下来——尽管嘉庆不悦。^84 表面平静之下，一些起事者——尤其是冉文俦的残部——正在重新集结。从初夏起，勒保乐观的腔调变为日益犹豫悲观。他不再作承诺，更多谈论障碍。在希望与绝望之间摇摆的嘉庆，除了口头斥责勒保，只能多给兵。^85 与战役早期不同，一些将领不再渴望增援，因为在当地雇乡勇等手段更有利。事实上，军队太庞大反而可能是个累赘；勒保一直是北京官员圈流传的战争谣言中的谈资——因为四川的兵比别的战场都多，却没有突破。^86 因此，勒保起初谢绝了增援，还把健锐营与火器营的旗兵送回北京。^87 然而，仲夏嘉庆再次问他是否需要增援时，勒保选择了闪烁其词、暗藏机锋。他虽然抱怨战役中七八万清军严重不足，认为还需要一两万人，却没有开口要——因为他知道，一旦要了兵，他就没有借口不结束战争了。相反，他论证不该增兵：没有好将领可带，新兵不顶用，而且费钱；同时暗示，即使有了援军，一两个月内也赢不了。然而，他不求增援，反而给了嘉庆一线渺茫的希望。嘉庆同意把期限延到夏末，并可能再宽限几个月以肃清叛军余部。^88</p>\n<p>夏末，两件事促使皇帝对勒保采取行动。其一，四川的后勤大员福宁上了两道奏折，披露四川的军事行动与战争财政，令朝廷震惊。福宁开列了二十来个叛军首领的名字——其中许多是新名字——报告说更多的叛军股团正在出现，每股从一千人到一万多人不等，而且比以往更凶悍：劫掠集市，攻打平民堡寨，裹挟百姓。更耸人听闻的是，福宁披露：勒保在十六个月里向他索取了二百零五万两白银，德楞泰在十一个月里索取了五十三万五千两。福宁解释说自己早先没有奏报勒保，是因为勒保身为统帅，可能需要手头有资源以备不虞；而他无法抗拒将领们的要求，因为若不满足他们，他们就会以贻误军机为名追究他的责任。福宁称赞额勒登保是唯一在财务上通情达理的将领，从不抱怨，但说额勒登保在不到一年里也向他索取了二十七万二千两。^89 这些都是骇人的数目，与军队的规模完全不成比例。</p>\n<p>显然，勒保没能和每一个人都交上朋友。更重要的是，福宁自己也不干净，当他察觉到新皇帝打击前线腐败的决心时，急于寻找替罪羊。福宁的披露令嘉庆惊怒交加，他推测：勒保一再拒绝增援，是出于延长战争的欲望，好继续占据统帅之位，从而吞掉更多钱。嘉庆把福宁奏折的抄本转发给勒保，命他明确回奏自己能否指挥这场战争——这无异于最后通牒。^90 至于战争财政，皇帝正等着广兴的查报——广兴是他派往四川的御史。广兴是书麟的同父异母弟，才三十八九岁，已在监察系统供职数年。和珅被捕时，他是第一个揭发其劣迹的人。他的正式任务是护送二百五十万两军费入川——这是嘉庆亲政后拨给四川的第一笔经费——但他还有另一项使命：短期考察福宁的工作。^91 因此，嘉庆既没有表示惊讶，也没有发怒，只是告诉福宁：三位将领索取的经费数额不同，是因为他们兵力规模不同；他认为其中不可能有欺诈。但他称赞了福宁的揭露，鼓励他不要害怕，继续奏报勒保的情况。^92</p>\n<p>数日之后，朝廷再次震惊：倭什布奏报，徐天德与李述（李述可能初夏在大宁与徐天德会合）率领的一万多名叛军突入湖北，威胁竹溪县城，而德楞泰没有追击他们。湖北虽然挫败了叛军在西北边境的多次渗透企图，这一次徐、李队伍猛攻关卡数日之后，它失败了。享受了不久太平的湖北，重新进入戒备与动员状态。嘉庆一面允许倭什布招募新兵、多雇乡勇，一面命三千名山西兵开赴湖北，并按新任河南巡抚吴熊光的请求，派一千六百名直隶兵前往河南。^93 然而，嘉庆最恼火的，是没有从勒保那里听到关于这一紧急事态的任何消息。</p>\n<p>倭什布关于徐、李队伍侵入湖北的令人不安的奏报到达朝廷一天后，勒保的三道奏折到了。一如既往，勒保对各战场的战况作了一番乏味的叙述，却只字不提湖北的紧急事态，声称湖北防御稳固，起事者不敢前往，还说德楞泰已把徐天德赶进大宁的深山老林。勒保以轻松的心情奏报：他正从白塔坝大营前往达州，接收新到的二百五十万两军费。对福宁关于开支严重过滥的批评，勒保激烈反击。他辩称所有开支都是必要的，且都清楚入账。他补充说，额勒登保其实从他那里领过钱，他不是只为自己索取了巨额经费。勒保承认德楞泰对徐天德作战迟缓，但为他辩护说，德楞泰是比明亮更好的将领，财务上也没有问题；鉴于良将匮乏，他恳求让德楞泰留任。勒保还指责福宁因与德楞泰不和而诬陷德楞泰。^94</p>\n<p>勒保咄咄逼人的自辩令嘉庆不快，他讥讽勒保急于奔往达州接钱，却对湖北的紧急事态一无所知。骂勒保\"梦呓\"\"无耻\"，嘉庆再也按捺不住对勒保的怒火，以及对自己信任此人的懊悔：</p>\n<blockquote>\n<p>勒保已沦为书办，安坐军需局中，只处理各路禀报。如此岂堪为经略大臣？他还说自己对各将领的功过留心体察，凡事以国事为先。朕不能信此等语。勒保自任统帅以来，一无布置。朕自愧知人不明，以之命为经略大臣。当引以为戒，以免再蹈覆辙。^95</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释95。]</p>\n</blockquote>\n<p>不再相信勒保\"无需增援\"的说法，嘉庆从盛京调两千名旗兵入川——这是第三次从北方调派旗兵。如果将领们能迅速结束冲突，他还愿意支付后勤规则所不认可的支出。^96 然而，他并没有罢免勒保，因为在他写下上述对勒保的严厉批评的次日，一条好消息到了：朱射斗几乎全歼了重庆以北的一股叛军，杀死了其首领包正洪。勒保公然把这场胜利记在自己账上，还奏报说他已号召被裹挟者脱离叛军——这也平息了皇帝的怒火，因为它表明勒保如今愿意使用招抚手段，一改他此前强调杀尽叛军的立场。^97</p>\n<p>但勒保的垮台只推迟了十天。七月十七日，倭什布奏报徐天德两万多人的队伍正向襄阳移动，嘉庆闻报震惊，罢免了勒保的经略大臣与四川总督之职，任命明亮为新统帅——授他经略大臣之衔与满洲红旗副都统之职。嘉庆再次痛斥勒保失职，甚至提到：如果湖北局势继续恶化，有可能将勒保军前正法。然而，嘉庆对明亮也不热心，为自己的决定辩护的理由是可堪任用的将领稀缺。与此同时，他任命新任吏部尚书魁伦为四川总督——魁伦扭转战役局面的决心给皇帝留下了深刻印象。^98</p>\n<p>嘉庆宣布罢免勒保两天后，勒保的五道奏折到达朝廷。在这些奏折中，勒保在一切战线上为自己激烈辩护——从不请增援的决定，到巨额开支。他反驳福宁\"叛军增多\"的指控，论证说起事者的总数减少了，只是股团数目增多了，每股的人数少了。他重申自己在开支上没有做任何不当之事，他索取的经费与其他将领分享了。为变守为攻，勒保请求朝廷派人入川，填补景安被解京查办后留下的空缺。最令人吃惊的是，勒保请求再拨五百万两军费——尽管他数周前刚收到二百五十万两。他论证说，新到的经费已用于偿债，他需要三百万两支付军费，二百万两用于地方抚恤与支付守卫四川各堡寨的乡勇。最后，他又呈上了一份战场省份军职空缺的任命名单，请予批准。^99</p>\n<p>勒保顽固的回应进一步激怒了嘉庆，他颁发了一道措辞严厉的长谕，驳回了勒保的全部辩驳，指责他\"无耻之极\"\"纯属梦呓\"。最令嘉庆惊骇的是，勒保对湖北的紧急事态只字不提，反倒为自己的御敌于鄂境之外的安排辩护。同样令嘉庆恼怒的是勒保再要五百万两的请求；他认为勒保是在用地方抚恤作新借口，掩盖自己挪用军费。^100 直到七月二十四日接到罢免谕旨，勒保才降低了言辞的火药味。但他仍坚称：接到倭什布关于紧急事态的信后，他立即派德楞泰前往湖北——尽管他可能直到写奏折前几天才这样做。^101 勒保对湖北局势并不太担心，说援军全部到达后湖北应当兵力充足，而起事者惯常在川鄂之间穿梭。他再次为自己\"逐股剿办\"的战术辩护。^102</p>\n<p>与其他将领、或他之前的历任统帅不同，勒保与朝廷打交道的方式异乎寻常地强硬，公开挑战圣旨与上意。相比之下，嘉庆常常犹豫而谨慎。罢免勒保之后，嘉庆责成魁伦查办勒保：他对湖北紧急事态的处理、他在战争财政上可能的欺诈，以及他在增援问题上的一再反复。即便湖北危机缓和之后，嘉庆仍对魁伦施压，要他认真对待此案。然而，在勒保自己的地盘上查办他，很快被证明是困难的。</p>\n<h2>明亮的倒台与那彦成在前线的登场</h2>\n<p>明亮受命执掌镇压战役帅印之时，他与新任陕西巡抚永保已经紧张对峙了一段时间。朋友宜绵被罢免，自己却不得不再次与永保合作，明亮很不痛快，于是继续拖延对付张汉潮——张汉潮只有不足两千人，其中能战者不过五六百。短暂窜入河南之后，张汉潮一股返回陕西，随后在陕豫边境与陕甘边境之间来回穿梭。他们一度突入甘肃的成县、徽县与两当，但很快被广厚与吉兰泰赶回陕西。^103 与此同时，</p>\n<p>其他叛军股团——包括樊人杰、高均德两股——在川陕边境游走，拼命试图渡过汉江，与张汉潮会合。二月，一支大股叛军攻打紫阳的一处关卡，杀死数百名士兵，包括十几名军官。^104</p>\n<p>四月初，永保动身赴陕。勒保让永保给明亮带去两千名士兵——因为明亮抱怨过兵力不足。同时，勒保授予永保调度陕西全部军队之权。^105 到达汉中后，永保冲入秦岭与张汉潮作战。在华阳，永保遭遇张汉潮，大败。多亏绿营军官马朝瑞冲击张汉潮的人马，战局才扭转过来。次日明亮才赶到，与永保对张汉潮形成夹击。战后二人在留坝县城相见时，发生了激烈的争吵：永保指责明亮没有早点来救他，明亮则责备永保被叛军打败。^106 此后两人各干各的。永保不敢再与叛军接仗，留在凤县，声称要保障军费经陕西西部栈道运往四川的通道，并协助供应明亮的军队。明亮与永保在联名奏折中描绘了一幅悲观图景，强调在山区与张汉潮作战的困难。^107 嘉庆确信需要更多兵力，派新任成都将军庆成率八百名士兵前去增援。庆成起初奉命协助明亮，夏天到达陕西后又被皇帝改派加入永保。^108</p>\n<p>五月，张汉潮再次分两路出击河南：一路渗入西平，另一路突入卢氏。吴熊光与明亮都急忙赶去，把叛军赶回了陕西。^109 此后，鉴于嘉庆一再警告：如果张汉潮越过省界，就要严惩——明亮实际上停止了军事行动，只派乡勇把张汉潮困在陕西境内。他甚至放过了不止一次全歼张汉潮一股的机会。^110 为给自己的拖延辩解，明亮抱怨兵力太少，新到的援军不顶用；他建议在每个山口都驻兵，而落实这一点既费时间，又需要更多援军。嘉庆清楚地知道明亮与永保都没有全力作战，继续批评他们，并讥讽他们：以一万三千人的兵力，竟抓不住受伤的张汉潮、剿不灭他的两千人。^111</p>\n<p>仲夏张汉潮再次西转时，永保与庆成在他到达陕西西部栈道之前与他交战，但他们向皇帝抱怨明亮没有追击张汉潮。明亮与荆州将军兴肇——兴肇自1798年夏天起就与明亮在一起——出现后，四人达成了协议：明亮与兴肇先期赶往商州，阻止叛军入豫；永保与庆成在秦岭自西北向东南进军，防止叛军再次逼近栈道。他们指派被罢免的成都将军富成率两千名士兵紧追张汉潮一股。然而，这份协议并不能保证他们的合作，皇帝的反复告诫与警告也不行。^112 相反，明亮与永保变本加厉地互相中伤。为给自己留证据，永保把他们之间的所有书信都存档，甚至派了一名密探监视明亮，同时自己缓慢移动，有时一停数日。^113 夏末，张汉潮试图抵达湖北郧西，但被赶到的明亮赶回陕西。随后明亮奏报朝廷：永保与庆成不见踪影——这促使嘉庆命松筠查办永保与明亮之争。^114 此后两周里，双方都上奏折指责对方失职。嘉庆一面痛斥二人行径可耻，一面更倾向于相信明亮——他刚刚任命明亮为经略大臣；他怀疑永保与庆成嫉妒明亮即将消灭张汉潮。他撤销了先前让明亮赴鄂、由永保与庆成了结张汉潮一股的决定，随后指示明亮如实奏报各人的表现，并告诫明亮：如果永保与庆成不可靠，就不要离开陕西。^115</p>\n<p>然而，数日之内，皇帝对明亮的看法就变了。八月中旬，广兴从四川返回，告诉嘉庆：明亮故意拖延行动，是因为他不愿在张汉潮被解决之后去四川——明亮认为受勒保——他旧日同僚温福之子——的节制是耻辱。^116 不久，嘉庆又得知：明亮是接受胡齐仑贿赂的将领之一——胡齐仑是湖北的军需局主管，正因挪用军费而受到调查。嘉庆大为震惊，命魁伦与吴熊光进一步查明永保、明亮与庆成的不端行为，密奏于他。^117 八月十七日——任命明亮为经略大臣一个月后——嘉庆罢免了明亮，把此职交给了额勒登保。嘉庆素来对额勒登保评价很高，广兴奏报额勒登保没有收受胡齐仑的贿赂后，嘉庆更加确信他的品格。授他统帅之职时，嘉庆再次称赞额勒登保的自律与敬业，并准许他以满文具奏——因为他不识汉文。^118 额勒登保是第六任统帅，他将在这个位置上一直待到1803年——漫长战争结束前一年。</p>\n<p>明亮接到罢免旨意之前，他与永保的争斗已达白热化。八月，张汉潮在商州与河南淅川——两地都是教门渊薮——招募新叛军失败后，从商州朝西安方向移动。^119 永保与庆成虽然承诺参加夹击，却按兵不动三周多，只派富成与马朝瑞率兵追击张汉潮的小股队伍。明亮与兴肇在镇安与张汉潮交战时，永保的人马没有一个前来相助。被俘叛军供称没有清军追击过他们，盛怒的明亮据此指控永保与庆成失职。明亮的奏折到达朝廷时，永保与庆成的奏折也到了——他们解释说是连日大雨等因素耽搁了行程——这反而印证了明亮的指控。^120</p>\n<p>此时松筠已开始调查二人的冲突。松筠虽然努力保持公正，却偏向明亮而非永保——他认为永保无能、自私、器量狭小：不但带不了兵，做文官也不称职。但嘉庆逼他把话说得更明确、更坚决。^121 在北京朝廷上，舆论也站在明亮一边（永保名声不佳姑且不论，勒保最近的罢免也可能影响了舆论）。八月二十三日，嘉庆把永保与庆成双双罢免——这是永保在这场战役中第二次被罢免，他从此再未回到战役中来。明亮虽然幸免，嘉庆却任命政治新贵那彦成为钦差大臣（qinchai dachen），督催明亮了结张汉潮。^122</p>\n<p>对明亮而言，受那彦成督催比受勒保节制更难堪——那彦成比他小三十多岁，又是他曾与之共事的阿桂之孙。嘉庆或许希望那彦成的到来能刺激明亮加快对张汉潮的作战，以免被置于那彦成的节制之下。不久，松筠终于呈上罢免永保、庆成与明亮、将三人一并解京受审的建议（他写奏折时尚不知朝廷的决定），皇帝删去了明亮的名字，并强调：如果明亮能在那彦成到达之前消灭张汉潮，就给他记功。^123</p>\n<p>然而，那彦成的使命还不止于此。与许多捐纳功名装点门面的满洲贵族子弟不同，那彦成二十五岁就考中了进士。随后他在翰林院待了几年，1792年被任命到南书房——皇帝的机要顾问机构——供职。1797年底阿桂去世后，那彦成以军机大臣上行走——军机处的年轻成员——身份入值，协助和珅处理白莲教战役的军报。王三槐被擒后，他是受到乾隆嘉奖的人之一。^124 然而，和珅被清除之后，那彦成平步青云。嘉庆任命他担任中枢政府的众多要职，使这个三十五岁的年轻人处于与倒台的和珅平行的位置。那彦成先后执掌翰林院、户部、工部、兵部、国史馆、实录馆、京中关税、内务府营造司与内务府，^125 还被任命为几个旗的都统或副都统。^126 和珅1776年发迹之后还花了好几年才集齐他那一大堆兼职，那彦成不同——他仅仅七个月就头衔加身。就连那彦成平庸的叔父阿迪斯，也被先任命为兵部侍郎，随后在庆成被罢免时出任成都将军。^127 那彦成动身赴陕之前，嘉庆还授予那彦成的母亲诰命之衔，表彰她在丈夫阿思达1767年去世后独力抚育那彦成——当时那彦成只有三岁。^128</p>\n<p>正如嘉庆后来承认的，他打算把那彦成培养成领班大臣。换言之，嘉庆计划用那彦成填补和珅留下的空缺。显然，嘉庆此刻并不打算改变父亲在处理国家大事上依赖一位首席军机大臣的做法。乾隆曾先后派他的三位首席军机大臣讷亲、傅恒与和珅监临至少一场战争，嘉庆或许认为，那彦成也应当经历一次前线实习。^129 命和珅自尽时，嘉庆援引了讷亲之死，表达了一个希望：那彦成能成为又一个傅恒，结束眼前这场对白莲教叛军的战役，而战场的历练将使那彦成有资格成为军机处新的第一人。那彦成动身前，嘉庆特别指示他亲自参与军事行动——或与明亮一同，或自领一军——并告诫他不要学勒保：躲在安全的地方，汇编别人的战报。^130</p>\n<p>九月初，那彦成启程赴陕。与他同行的有新任陕西巡抚、蒙古旗人台布。^131 赴陕途中，二人约谈地方官员、士兵及其家属，甚至仆役跟班，试图查明陕西战场进展迟缓的原因。他们得出的结论是：将领们并未尽心与起事者作战——离敌人远远的，追击迟缓，同僚需要时又不肯伸手相助——而士兵则疲惫不堪、供应不足。他们还奏报了一条流言：四月至七月间，清军根本没有与张汉潮交过手——这意味着明亮与永保可能在奏报中捏造了战斗。那彦成请求皇帝授予他先斩后奏之权：一旦查实严重劣迹，可就地处决任何将领。他论证说，这个请求不是出于年轻气盛或桀骜不驯，而是为了根除积重难返的前线积弊。他还请求从满洲增调旗兵，每人配三匹马，以便移动更快、少依赖后勤。事实上，他已经命山西巡抚伯麟备好了一千匹马。^132</p>\n<p>那彦成的自命不凡没有给嘉庆留下好印象；他直截了当地驳回了这两个请求。他告诉那彦成：官员的性命不可轻率处置；即便经略大臣，在战争中也没有过处决官员之权，何况钦差大臣。他虽同意\"陕西军队数月不战\"若属实是重罪，但责成那彦成先查实真假。至于援兵与马匹，嘉庆坚持陕西的兵力已经足够——盛京与吉林的三千名旗兵和一千名撒拉兵已经派往那里。^133 尽管继续信任那彦成，这番往还还是让皇帝对门生的使命心存忧虑。</p>\n<p>被解除战役统帅之职后，明亮在与永保的争斗中变得更加咄咄逼人，在几道奏折中揭露了对手更多劣迹。为自己辩护时，明亮搬出与阿桂的交情，说他一直以阿桂为楷模，遵循阿桂往日的教诲。^134 嘉庆一面批评明亮借阿桂自保，一面也试图利用这一点。他告诉明亮：如果他能成功协助那彦成完成第一次军事使命，就可以将功折罪；并警告明亮不要因为那彦成是阿桂之孙而轻视或嫉妒他。与此同时，嘉庆把即将到来的冬天定为肃清陕川两省全部叛军的新期限。^135</p>\n<p>但明亮并不愿意给那彦成当导师。相反，他加快了对张汉潮的作战——张汉潮再次前往甘肃。九月初五日，张汉潮进入甘肃两当。在恒瑞与广厚——广厚此时已是甘肃布政使，再次部署了撒拉兵——的协助下，明亮与兴肇在成县一连击败张汉潮数场，逼得许多起事者上吊自杀，随后把残部围在一座大山三间山上，许诺数日内擒获张汉潮及其最后的人马。然而，九月十三日，张汉潮几番避开清军，从唯一无兵把守的一面攀着长满藤蔓的悬崖缒下，成功逃脱。经秦州，他与部众回到陕西，重入秦岭。^136</p>\n<p>明亮进展带来的鼓舞使嘉庆准备给那彦成另派差事。然而，永保的几道奏折到达，再次激起他对明亮的怒火。永保奏报：八月明亮在镇安与张汉潮交战时，曾数次写信给永保，请他不要行动，事后却指责永保怯懦失职。永保的揭露使嘉庆怀疑明亮是故意设局陷害永保。^137 再加上张汉潮在甘肃逃脱的消息，嘉庆下令查办明亮、兴肇与恒瑞，并褫夺了明亮仅剩的参赞大臣之职。尽管痛斥三人，嘉庆还是许诺：如果这道谕旨送达时他们已擒获张汉潮，就不交付审讯；否则那彦成与松筠将逮捕他们。^138</p>\n<p>在压力之下，又不愿引起正从西安赶来秦岭的那彦成的鄙夷，明亮再次展现了他的效能。他先在秦岭腹地的五郎与江口与张汉潮作战，随后把部队分成小队，尾随张汉潮一股进入密林。十月初三日，清军追上了张汉潮。损失二百余人——包括张汉潮的副手李潮——之后，被长矛刺中的张汉潮跳下悬崖，随后在树上自缢身亡，尽管他还有数百名追随者仍在逃。^139 张汉潮之死使明亮振作起来，作了最后一次自我辩护。他坚称自己在财务上并不贪婪，他与额勒登保是叛军最畏惧的两员将领，真正的懦夫嫉妒他、企图陷害他。他还立誓要在那彦成麾下不遗余力地作战。^140 然而，张汉潮的死讯还没到达朝廷，那彦成与台布关于审讯永保的奏报先到了。永保所披露的——明亮夸大战功，更严重的是，在奏折中捏造并未发生的战斗——令嘉庆大为震惊，尽管那彦成提醒皇帝：永保的指控是一面之词，他的证人是按永保的授意作证的。^141</p>\n<p>终于决定舍弃明亮的嘉庆，连张汉潮的死讯也动摇不了他。他怀疑明亮并未参与导致张汉潮之死的战斗，因此不赏他与兴肇。^142 嘉庆虽然对自己的\"用那彦成激励明亮\"之计颇为得意，那彦成却同情明亮。在京城时替明亮说过话的那彦成，张汉潮死后又替他求情，请求把他留在前线。但嘉庆态度坚决，声称明亮\"苍猾\"（canghua，老于世故而奸猾），可能不会尊敬那彦成。^143 结果，那彦成与台布罢免了明亮与兴肇，把他们解交松筠审讯。根据松筠的调查与建议，永保与明亮被处以斩监候；庆成与兴肇流放新疆。^144</p>\n<p>明亮既除，嘉庆完成了对战役领导层的改组；战争开始时的主要领导人除一人外全部被替换（表3.1）。唯一留下的，是西安将军、那彦成的岳父恒瑞（额勒登保与德楞泰被留用，但他们是1797年春才参战的）。</p>\n<p><strong>表3.1　战区主要人事变动，1796—1799年</strong></p>\n<table>\n<thead>\n<tr>\n<th>职位</th>\n<th>任职者</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>统帅</td>\n<td>永保，1796—1797；惠龄，1797；宜绵，1797—1798；勒保，1798—1799；明亮，1799；额勒登保，1799—1803</td>\n</tr>\n<tr>\n<td>湖广总督</td>\n<td>毕沅，1795—1797；景安，1798—1799；倭什布，1799—1800</td>\n</tr>\n<tr>\n<td>四川总督</td>\n<td>孙士毅，1795—1796；英善，1797；宜绵，1797—1798；勒保，1798—1799；魁伦，1799—1800</td>\n</tr>\n<tr>\n<td>陕甘总督</td>\n<td>宜绵，1795—1799；松筠，1799—1800</td>\n</tr>\n<tr>\n<td>湖北巡抚</td>\n<td>汪新，1796—1798；高杞，1798—1800</td>\n</tr>\n<tr>\n<td>陕西巡抚</td>\n<td>秦承恩，1789—1799；永保，1799；台布，1799—1800</td>\n</tr>\n<tr>\n<td>河南巡抚</td>\n<td>景安，1795—1798；倭什布，1798—1799；吴熊光，1799—1801</td>\n</tr>\n<tr>\n<td>成都将军</td>\n<td>观成，1793—1798；富成，1798—1799；庆成，1799；阿迪斯，1799—1800</td>\n</tr>\n<tr>\n<td>西安将军</td>\n<td>恒瑞，1795—1801</td>\n</tr>\n<tr>\n<td>荆州将军</td>\n<td>兴肇，1793—1799；弘丰，1799—1802</td>\n</tr>\n</tbody>\n</table>\n<p>资料来源：GZDJQ、XFFL、QSLJQ 及魏秀梅《清季职官表》，362, 365, 371, 399, 423, 430, 655, 664, 667。</p>\n<p>恒瑞因张汉潮在甘肃逃脱而受责，张汉潮死后得以免罪，奉命与那彦成联手肃清张汉潮残部，从而接替明亮，成为那彦成前线实习的导师。为大规模更换战争领导人辩护时，嘉庆论证说：他无意把自己的门生安插到领导位置上，而是按素质遴选——入选者必须正直勤勉。无论以何种标准衡量，尽管犹疑不定、时有失着，嘉庆皇帝在亲政第一年，确实尽了最大努力，试图扭转镇压战役的局势，使之有利于清朝。^145</p>\n<h2>战争财政的受阻整顿</h2>\n<p>战争领导层近乎彻底的大换血，与嘉庆遏制军费、打击（即便不能根除）前线腐败的努力的高潮相伴而来。据嘉庆说，到1799年初，镇压战役已耗费清朝国家七千余万两白银，使这场战争成为清史上最昂贵的一场，也令中枢政府陷入亏空。嘉庆对前线滥用与侵吞军费的了解显然比父亲更透彻，他对此深感不安，把纠正战争财政之弊列为自己的优先事项之一。与此同时，他立誓不为这场战役加税。^146 然而，这场斗争注定艰难。</p>\n<h3>风暴眼的达州</h3>\n<p>由于四川自1797年起比别的战场省份索取了更多经费，嘉庆首先着手整顿四川的后勤事务。至此为止，四川的主要后勤机构（军需总局）一直设在达州州城。1797年初，宜绵接替英善署理四川总督时，英善开始主持该局。^147 1798年初，福宁从湖北被派到达州。这虽然是对他在湖北拙劣战役的惩罚，福宁却被委托与英善共同主持达州的后勤局。亲政才数周，嘉庆——他早就听说过四川后勤问题的传闻——就以明亮之兄、镇总兵明兴取代了英善。明兴随后被提升为成都驻防副都统，意在使他面对福宁时拥有更大的权威。^148 这一调动在达州引起了不安；福宁如坐针毡。明兴任命后不久，福宁就上了一道奏折，解释四川的高额开支。他说：</p>\n<blockquote>\n<p>[惠龄、额勒登保、德楞泰]先后经过达州，臣曾就[开支]与他们会商。他们都说，近来开支已大为减少，但仍有不尽合例之处。鉴于诸将所带索伦、吉林及绿营兵皆骁勇善战，而眼下正是进剿贼匪的紧要关头，[臣]不得不对例所未载之处变通办理。^149</p>\n<p>[译者按：原奏自英文直译，文言原文待核，见注释149。]</p>\n</blockquote>\n<p>但他这种闪烁其词的自辩，只引起了皇帝更多的怀疑。嘉庆斥责福宁说：四川的开支日增一日，而那里的士兵却常常不能按时领到饷银与给养；将领们任意向后勤官员索款时，谁也不敢核查其用途。^150 鉴于福宁素有贪腐之名（他任湖广总督时得了个绰号\"富四要\"，Fu Siyao，意为\"贪得无厌的福某\"），^151 嘉庆不禁推断：四川后勤管理的问题既多且重。两周后，二月底，嘉庆决定派广兴入川——如前所述。怀疑陕西的后勤事务也有问题，嘉庆把松筠的任命改为陕甘总督。仍在从拉萨赴京途中的松筠，于是改赴陕西。^152</p>\n<p>广兴直到六月下旬才到达达州，因为嘉庆更改了他的行程，让他押送第二批经费，而不是第一批。^153 广兴到达之前，嘉庆于三月中旬送走了明兴，认为他不适合这项工作。接替明兴的不是别人，正是新近被罢免的湖广总督景安。^154 景安在四川的任期极其短暂。他刚到任，就于四月二十一日因前文所述的新指控而被革职。^155 尽管关于景安在四川短暂任职的记载很少，这一系列的人事变动已使福宁警觉起来。</p>\n<p>周围的变化使福宁警觉起来。他作了更多自我辩护的尝试，包括夏天上的那两道指向勒保的奏折——它们帮助扳倒了勒保。然而，福宁越是想洗清自己，嘉庆的怀疑就越深。嘉庆虽然利用福宁对勒保的指控，却同样不信任指控者本人。任命魁伦为新任四川总督时，嘉庆指示他彻查福宁的财务账目，查其有无欺诈、挪用与向将领行贿。^156</p>\n<h3>胡齐仑丑闻</h3>\n<p>嘉庆对四川、陕西的战争财政只是怀疑，对湖北却手里有一个案子：襄阳军需局主管胡齐仑被控欺诈、挪用军费。胡齐仑是浙江绍兴人，叛乱爆发时任襄阳知府。他被毕沅招募主持鄂北后勤，两年半间经手发放了四百二十万两白银。然而，他的军需局只有他本人和一名助手——同样来自浙江的朱谟，胡齐仑之兄的门生。所有经费都存在胡齐仑的衙门里。1796—1797年，鄂北是主要战场之一，军队云集，胡齐仑频繁给将领们——包括永保与明亮——送去馈赠。胡齐仑的善意得到了回报；将领们反过来热情赞扬胡齐仑，为他请功请赏，使他得了花翎。^157 1798年底，景安以湖广总督的身份弹劾胡齐仑与朱谟欺诈、挪用军费，并下令搜查其家。胡齐仑家中搜出五万两银子，两人都被革职查办。^158 然而，此案很快搁置下来，随后景安本人也在和珅倒台后遭到申斥。</p>\n<p>1799年二月，嘉庆重提此案。湖北的调查让他恼火：胡齐仑被留下独自核对账目单据，没有人被指派监督他。嘉庆怀疑接替景安主持此案的布政使祖之望试图庇护胡齐仑，命将胡齐仑与朱谟一并解京，并彻底清查胡齐仑的家产。^159 然而，初夏二人解到北京后，审讯收效甚微。直到祖之望来京、八月十六日觐见皇帝，嘉庆才查明缘由。因为胡齐仑详细记录了1796—1797年间他送给鄂北主要将领的馈赠——大多是白银（偶尔有贵重绸缎衣物）——包括数额多少、以何种形式（银锭或银盘）、送给谁、何时送、由谁经手；景安的继任者倭什布从祖之望手中接过这本账册后，没有把它呈交中枢政府，因为它牵连到许多高级官员（表3.2）。^160</p>\n<p><strong>表3.2　胡齐仑1796—1797年间向湖北战争领导人所送白银馈赠</strong></p>\n<table>\n<thead>\n<tr>\n<th>收受者</th>\n<th>总额</th>\n<th>时间跨度</th>\n<th>次数</th>\n<th>备注</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>永保</td>\n<td>26,310两</td>\n<td>嘉庆元年三月十九日—十二月二十六日</td>\n<td>至少15次</td>\n<td>另有银盘280个，重量不详</td>\n</tr>\n<tr>\n<td>毕沅</td>\n<td>45,724两</td>\n<td>仅记录一次：嘉庆元年十二月二十五日</td>\n<td>不详</td>\n<td>其中11,000两与惠龄共同收受</td>\n</tr>\n<tr>\n<td>鄂辉</td>\n<td>5,660两</td>\n<td>嘉庆元年三月二十四日—九月二十日</td>\n<td>16次</td>\n<td>另有银盘350个，重量不详</td>\n</tr>\n<tr>\n<td>庆成</td>\n<td>3,950两</td>\n<td>嘉庆元年五月二十四日—十二月初六日</td>\n<td>8次</td>\n<td>另加19,149两军装银</td>\n</tr>\n<tr>\n<td>惠龄</td>\n<td>10,657两</td>\n<td>嘉庆二年二月十二日</td>\n<td>1次</td>\n<td>用于犒赏兵丁</td>\n</tr>\n<tr>\n<td>明亮</td>\n<td>6,341两</td>\n<td>嘉庆元年五月初三日—二年二月二十一日</td>\n<td>8次</td>\n<td></td>\n</tr>\n<tr>\n<td>恒瑞</td>\n<td>860两</td>\n<td>嘉庆元年五月初三日—十月初十日</td>\n<td>11次</td>\n<td>另有银盘200个，重量不详</td>\n</tr>\n<tr>\n<td>总计</td>\n<td>99,502两</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>资料来源：JQSYD, 4:348–50. 账册移交北京的审讯者之后，胡齐仑才放弃顽抗。他承认自己挪用公款八万余两——从他所发放的经费中扣留了8%至10%——还承认他与毕沅一道给湖北的将领们送过钱。然而，他侵吞的可能远不止此数。^161</p>\n<p>胡齐仑的账册与供词震惊了朝廷与官场。鄂北的所有主要将领都有过错，其中一些人收受非法馈赠频繁到每两周一次。与他一贯的学者型大员形象相反，1797年夏病故的毕沅在这桩丑闻中分量很重。毕沅从胡齐仑那里收了四万五千多两——是所有人之最——用途没有记录。此外，毕沅常常亲自把胡齐仑的馈赠转交将领。更令人震惊的是：1796年底永保被革职押解北京受审时，毕沅让胡齐仑给他两千两。永保被押走时没带这笔钱，毕沅便把这笔钱——胡齐仑又添了六千两——送到了北京。永保在狱中收到八千两，用其中三千两在北京买了一所宅子。^162</p>\n<p>嘉庆得知胡齐仑账册的当天，接见了刚从四川返回的广兴。广兴是位善于观察的御史，沿途与达州都搜集了关键情报——尽管勒保在经费解到后立刻就打发他回去。如前所述，他向皇帝报告了明亮与永保的争斗、明亮不愿在勒保节制下去四川，以及额勒登保的良好声誉——这促使嘉庆以额勒登保取代明亮出任统帅。关于战争财政，广兴披露：尽管开支浩大，许多士兵已数月领不到饷银，装备也差——这印证了松筠早先的奏报：陕西军队供应不足——有些人没有鞋穿，只能用牛皮裹脚。^163 此外，广兴可能还披露了王三槐被擒的真相——王三槐是向勒保投降的，而不是如勒保所称在战斗中被擒。</p>\n<p>与此同时，仍在赴川途中的魁伦又有一道奏折到达朝廷。^164 进入陕西后，魁伦听到了更多关于四川后勤问题的说法：四川的后勤官员胥吏侵吞军费，用以向上司邀功买好，或者干脆中饱私囊，而部队却不能及时领到饷银与赏赐。不过，这一次魁伦把矛头对准了勒保。他指责勒保带了个坏头，列举勒保任陕甘总督时以及苗疆战役期间如何讨好和珅。魁伦还批评勒保没有制胜之策，不能驾驭部属——这或许暗指明亮与勒保的不和。他还指出，皇帝的招抚政策收效不大，因为人们还记得上年勒保欺骗王三槐之事。准备彻底大扫除的魁伦，请求从京城派官员协助他查办勒保与福宁。此外，他请求拨二百六十万两军费——因为勒保已把最近到达四川的二百五十万两大多用于偿债及其他用途。^165</p>\n<p>几天之内接踵而至的这些揭露，坚定了嘉庆改革的决心。八月十七日，他颁布了一系列措施。他以额勒登保取代明亮。他下令搜查受贿于胡齐仑的永保、庆成与鄂辉的家，并抄没其家产。他没有对明亮与恒瑞这样做，因为二人仍在前线作战，但他责成魁伦查明明亮是否还有其他财务劣迹。嘉庆清晰而坚定地表示：他决心彻查四川的任何欺诈与挪用。他论证说：鄂北的后勤尚且如此欺诈，四川的规模大得多，福宁与英善的品级又高于胡齐仑——更不用说福宁素有贪腐恶名、且是和珅的党羽之一——四川的问题必定更严重。嘉庆再次把战役进展迟缓归咎于前线普遍存在的财务舞弊：将领们拖延结束战役，是为了避免审计——一旦审计，他们的滥用与侵吞就会暴露。^166</p>\n<p>同一天，嘉庆从户部库拨五十万两给四川。他派广兴与另一位满洲旗人托津护送经费。这一次广兴将留驻达州主持军需局——这回应了魁伦请求京城派员的奏请。托津则充当皇家耳目——经费解到后他就返回北京。为协助广兴，嘉庆还命刘清——那位口碑甚好、曾劝降王三槐的地方官——加入达州军需局。嘉庆虽然把魁伦请求的二百六十万两减为五十万两，他却已有安排。当月早些时候，嘉庆已把一百五十万两托付松筠解往陕西，以备四川之需——因为他不信任福宁。随后他指示松筠把这笔经费转解四川。这样，四川新的财务管理将有二百万两可资运作，符合新规章。^167</p>\n<h3>洪亮吉的挑战</h3>\n<p>嘉庆吹响打击前线腐败号角一周后，八月二十五日，嘉庆之弟永瑆转呈了五十三岁学者官员洪亮吉的一封长信。洪亮吉虽然屡试不第、直到1790年才中进士，对官场却不陌生。他多年供职于包括毕沅在内的几位大员的幕府，在京城名流圈中为人所知。1799年上半年，洪亮吉以翰林院编修的身份在实录馆参与编纂已故乾隆皇帝的\"实录\"，但在他把长信的几份抄本寄给京城权要前不久辞了职。^168 信中，洪亮吉对嘉庆纵容和珅门生、以及在白莲教战役中面对三心二意的将领时犹疑不决，提出了尖锐而爆炸性的批评。或许，最近编纂乾隆实录的工作，使他对先帝的怀念加深了，于是他把嘉庆的所谓优柔与乾隆惩处不称职官员将领时的果决作了对比。^169</p>\n<p>事实上，1798年，洪亮吉就在翰林院的特科考试中指责地方官应对叛乱爆发负责、批评镇压战役的执行，令官场震惊。^170 洪亮吉固然道德感强烈、自以为是，但在这两次场合，他都站在法家的立场上，主张严惩一切恶官，以重树政府的权威。洪亮吉正确地察觉到战役已经脱轨——官场内外的许多人也指出了这一点——但他对镇压战争的把握，无论在广度还是深度上都很有限。他接触不到将领与中枢政府之间的官方文书，只能依靠闲谈、流言、邸报，以及与最近从战区返回、却不在指挥核心的人交谈。显然，洪亮吉没有跟踪嘉庆整顿战役的最新举措。他不知道胡齐仑案——此案牵连他的老东主毕沅；也不知道勒保被罢免，更不用说达州对战争财政的彻查。</p>\n<p>在改革紧锣密鼓之际，洪亮吉直言不讳、毫不圆滑的批评触怒了嘉庆。嘉庆有条不紊地为自己对和珅案及白莲教战争渎职领导人的处置作了辩护，宣布洪亮吉的指控毫无根据。洪亮吉随即被捕。两天后，军机处与刑部判他死刑，但嘉庆把刑罚改为流放伊犁。洪亮吉刺耳的批评虽使嘉庆不安，嘉庆或许仍欣赏洪亮吉对改革的热切，并注意到了他的一些指控。确实，他没有收回征求意见与批评的号召，而是向官场保证他仍然欢迎。他虽命销毁洪亮吉长信的其他所有抄本，自己却留了一份在手边。^171</p>\n<h3>清廉的魁伦</h3>\n<p>洪亮吉因直言而身陷囹圄之际，新任四川总督、直言敢谏的高级满洲官员魁伦，正走近四川——他仕途起步的地方。1777年，魁伦得到了他出京后的第一份差事：在四川松潘——原属西藏康区——担任绿营军官。在四川多个绿营职位上任职后，1788年，乾隆任命他为福州将军——福建旗制中的最高职位。^172 对这位当时只是四川建昌镇总兵、在旗制内未任过要职的三十六岁年轻人来说，这是极大的跳跃。乾隆承认魁伦资历不够，抬出了他的家世：他的祖父、兵部尚书查弼纳在1731年的准噶尔之役中阵亡。但乾隆很快补充说，魁伦本人似乎很聪明。^173 在福州，魁伦的职责之一是掌管福建海关——一份可能油水丰厚的差事。1795年，他在福州本来平淡的任期发生剧变：魁伦弹劾两位同僚——闽浙总督伍拉纳与福建巡抚浦霖——掩盖地方仓廪府库的亏空，此案发展成为乾隆朝晚期最轰动的贪腐案之一。伍拉纳与浦霖不仅因贪赃被判处死刑，福建许多下级官员也被牵连受罚，另有十人被处决。^174 由于伍拉纳不仅是皇室爱新觉罗氏成员，还是和珅的姻亲，魁伦由此声名鹊起，被视为正直而有胆识。他很快被任命为闽浙总督。^175</p>\n<p>和珅倒台后，嘉庆任命魁伦执掌吏部——这只是嘉庆把正直之士安插到关键位置的若干举措之一。令皇帝大为意外的是，魁伦离开福州之任，竟给他个人招来一桩难事。由于福建海关的税收不及往年（魁伦解释说是海盗导致来闽货物减少），魁伦被要求自掏腰包补上十九万四千两的缺额。当时他只付了八千两，于是提出抵押自己的几处房产，其余用\"养廉银\"补缴。魁伦掌管海关多年而家产微薄——与伍拉纳被捕时家中有四十多万两、浦霖家中有二十八万多两形成鲜明对比——令嘉庆啧啧称奇，大加称赞魁伦的清廉，说就连他在福建的政敌也找不到借口攻击他。^176 魁伦还给皇帝留下了深刻印象的是他迅速结束战役的信心——这在嘉庆选择他取代勒保时同样重要。</p>\n<p>新官上任，雷厉风行，魁伦毫不迟疑地行使权力。在广元入川时，他罢免了游击游涵宇——此人从未执行其守卫关卡的受命任务，一直躲在广元城墙后面。^177 九月初九日到达达州后，魁伦立即罢免并逮捕了勒保。^178 魁伦擅长画扇，除了十几年前在四川搜捕啯噜匪徒外并无作战经验，急于证明自己的军事才能。赴川途中，他就提议：逐步收紧对起事者的包围，通过设置陷阱、地雷与投毒水源，把他们挤出生存圈。^179 到达达州时，魁伦惊讶地发现：这座城市太平无事，战场在数百里之外。在胡齐仑案与洪亮吉信的推动下，到魁伦抵达达州时，嘉庆打击前线腐败的心情更加迫切。嘉庆坚持四川很可能存在更多财务欺诈，指示魁伦只专注于后勤以及查办勒保、福宁、英善与宜绵，但免去他的军事职责。嘉庆还命四川布政使林俊配合魁伦与广兴，以便免于\"隐瞒积弊多年\"的追究。^180</p>\n<p>然而，很快就被证明：起诉老辣的勒保与起诉胡齐仑完全是两回事——胡齐仑无意中为起诉者备好了证据。达州军需局的账目完美无瑕、细致清晰，显示勒保所领取的二百六十万两全部用于正当用途，主要是发放官兵饷银与定期犒赏。他也没有虚报兵额以多领经费。至于勒保的个人开支，军需人员替他购置一切，但勒保每月都用\"养廉银\"结清全部开销。事实上，勒保的养廉银还有一千五百余两的结余。魁伦虽然在军费中发现的漏洞越来越多，他对勒保与福宁的审讯却毫无成果。勒保只承认几项与经济无关的指控：对部队福祉关心不够、没有及时奏报叛军突入湖北、没有管束骚扰百姓的旗兵，等等，却断然否认任何财务罪行。^181 福宁也不承认在战争财政上有任何过错。很可能二人在应对调查时串了供。据说勒保的下属对勒保被罢免不满，曾向魁伦请愿，求他替勒保申诉，尽管魁伦在奏折中没有提及。与此同时，魁伦不得不继续使用勒保的一些旧人管理后勤，因为他没有人手替换他们。^182</p>\n<p>惊讶、困惑、又有些沮丧，魁伦发现无法把任何经济罪名钉在勒保身上。在第一份调查报告里，魁伦降低了调门，向皇帝解释对勒保的某些指控不能成立。然而，魁伦毫不含糊地表达了自己的深切怀疑。他认为，勒保与福宁有充足的时间修补账目漏洞——因为勒保早在七月就提出让京城派人来川查账，而他们又对魁伦查账的使命心知肚明。^183 无法以财务罪名起诉勒保，魁伦便于十月中旬建议：以勒保故意拖延军事行动、阻碍战争进程为由，处以立即死刑。按大清律，此种行径应处死刑。^184</p>\n<p>嘉庆虽然赞同魁伦不相信勒保完美无瑕的账目，怀疑勒保、福宁等人做了假账，却从早先牺牲勒保以换战役风清气正的意图上退了回去。他一面催促魁伦继续挖掘证据，一面把注意力转向对勒保的非财务指控。^185 但他仍想摆出严厉君主的姿态。十月十二日，军机处与刑部提议将胡齐仑判斩监候、待来年秋审，嘉庆改判立即绞决，声明：既然前线腐败始于湖北，胡齐仑就应严惩，以儆正在进行的战役中的全体将领与后勤人员。^186 这是这场战役中第一个被处死的官员；胡齐仑之死或许有助于平息\"皇帝对渎职官员过于宽纵\"的批评——正如洪亮吉信中所说。</p>\n<p>胡齐仑之死也帮助勒保免于死刑——一个例子已足以成就嘉庆的形象。同时，嘉庆或许通过秘密渠道听到了前线抗议勒保被罢免、不满魁伦的呼声。此外，勒保被捕时向国家认\"捐\"三万两，并当即交出两万两现银。^187 接到魁伦处死勒保的建议后，嘉庆把刑罚减为斩监候。他宣称勒保的罪行不如明亮严重，转而列举勒保在苗疆战役与白莲教战役中的贡献，包括擒获王三槐与冷天禄——尽管他补充说二人并非勒保亲手所擒，他只是在擒获二人的战斗中督战而已——他避而不提勒保在王三槐被擒一案中的欺诈行径，而单单这一条就足以让勒保获死罪。嘉庆还为勒保坐镇达州辩护，说这是对自己\"坐镇各战场中央\"的指示的误解。与此同时，嘉庆下令不搜查勒保的家——因为这种措施只适用于已被定罪的贪官。^188 结果，对勒保的贪腐指控被撤销，勒保迄今侵吞军费数额成了谜。除勒保的三万两之外，勒保友人的游说或许也在嘉庆态度的急转中起了作用。</p>\n<p>然而，饶过勒保并不意味着嘉庆软化了整顿战争财政的决心。下令处死胡齐仑几天后，嘉庆告诉松筠，他打算对河南与陕西两省的军费开支进行调查。^189 同时，嘉庆继续对魁伦施压，要他继续核查达州的后勤账目，因为他仍怀疑勒保与后勤人员篡改了账册。但他告诫魁伦：如果确实没有证据，就不要追逼。^190 审讯福宁未能打破僵局之后，^191 魁伦下令逮捕两名后勤官员——曹相业与石作瑞，二人都是勒保的门生——希望从他们那里取得更多证据。</p>\n<p>泸州知州曹相业可能是1798年初勒保路过泸州时带入战役的。勒保随后派曹相业署理夔州知府，主持夔州后勤。曹相业经手发放了十八万多两银子，魁伦入川后他请假养病。与胡齐仑一样，曹相业也侵吞了军费，给包括勒保在内的将领送礼。魁伦的人赶到夔州逮捕他之前，曹相业已经登船，逆流驶向他重庆的家乡。魁伦的人截住船只时，发现曹相业刚刚死去，却在二十四箱面条里发现了藏匿的一万五千两白银。重庆知府石韫玉——勒保的另一位门生——前来验尸，随后宣布曹相业系正常死亡。曹相业的家属、书吏与仆人都坚称，这些钱是曹相业多年任知府攒下的积蓄。勒保的家人则说，勒保的夫人只收过曹相业的食物，退回了他送的绸缎与一千两银子等其他礼物。^192 就这样，曹相业之死掐断了魁伦调查中有价值的线索，永远成了一个谜。事实上，达州军需局的两名后勤官员——程勋与李宪宜，都是道员——也在魁伦到达前不久死于\"疾病\"。^193 这些神秘的死亡虽然无法证明，或许与达州军需局完美无瑕的账目不无关系。</p>\n<p>石作瑞是四川的另一位道员，叛乱爆发时投入英善麾下，先组织乡勇，随后加入达州军需局。勒保到达后，石作瑞成了勒保处理战争财政的左右手。王三槐被擒后，勒保呈上长长的请功请赏名单时，举荐石作瑞升任布政使。^194 后来才披露：石作瑞挥霍军费，频频盛宴款待将领，礼物堆积如山（例如，他曾一次送给一位京官珍珠三斛、绸缎一万匹）。^195 与勒保、福宁一样，石作瑞也没有如实招供。嘉庆批准了魁伦对这二人的逮捕，并告诉魁伦：把已死的两名后勤官员程勋与李宪宜当作替罪羊（即宣布一切劣迹皆此二人所为），以此诱使后勤人员讲真话。^196 或许是因为嘉庆对勒保的态度转变使魁伦有所顾虑，他变得更谨慎、更少锋芒。他转而指望年轻的、无所畏惧的特立独行之士广兴的到来，好继续查办。</p>\n<p>好继续查办。^197</p>\n<p>在啃查办勒保与福宁这块硬骨头的同时，魁伦在另一条战线上行动：设法堵住后勤漏洞、削减开支。这项行动注定不受将领们欢迎；就连公认财务楷模的额勒登保，也公开表示不满。额勒登保一面反复告诉皇帝魁伦不谙军事，一面三番五次催促魁伦尽快结束调查、投入战斗——尽管嘉庆已声明魁伦不负军事之责。每一次，嘉庆都耐心而坚决地挡开额勒登保的怂恿，坚持让魁伦留驻达州，主持后勤与调查。^198</p>\n<p>与总是确保自己手边兵力充足的勒保不同，魁伦起初没有认识到这点的重要性。到达达州后，魁伦立即派百祥率勒保的一千六百名士兵去给额勒登保送经略大臣印信。随后魁伦又把随他入川的四名侍卫中的三名派给额勒登保。直到发现达州二千六百名士兵中约有二千名是伤病员，魁伦才请求额勒登保拨给他一些军队。^199 额勒登保随后拨给魁伦两千名士兵，并派百祥回来统领。然而，在皇帝最后一次提醒魁伦不必作战之后，额勒登保改派百祥与这两千人去守卫达州与太平之间的运输线，并把随魁伦入川的最后一名侍卫春宁也调走了。嘉庆没有看出这些安排使魁伦陷入易受攻击的境地，予以了认可。^200</p>\n<p>显然，统帅与新任后勤大员关系不睦。他们之间的一大冲突，围绕着长期雇用骡马驮运给养的开支——称为\"长骡\"（changluo）——这项开支不为《军需则例》所认可。勒保治下，达州局为每头牲口每月付九两。由于据说雇了数万头牲口，这成了最昂贵的开支之一，每月达数十万两。魁伦虽然知道这项开支被严重滥用，却仍对废除\"长骡\"犹豫不决，因为额勒登保向他抱怨过前线给养短缺。因此，魁伦提议保留这一做法——理由是\"长骡\"在苗疆战役中就已存在并获认可——但把额勒登保后勤人员要求的费率降到每头每月九两七钱。^201 然而，嘉庆毫不妥协；他驳回了魁伦的提议，理由是苗疆是边疆，而川陕是腹地。此外，魁伦提议的费率竟比勒保治下还高，嘉庆颇为恼怒，怀疑魁伦被后勤人员蒙骗了——他们用这个名目掩盖侵吞经费，或填补战争前期舞弊造成的账目窟窿。在朝廷的催逼下，魁伦废除了长骡。为安抚将领们，他定了一条规则：每一百名士兵雇四十名长夫。虽然这超出了《军需则例》的规定，却把开支减了一半。^202</p>\n<p>嘉庆不顾魁伦的艰难处境，继续敦促他坚持高标准、进行彻底的大扫除。他禁止魁伦用新经费偿还欠款，要求他优先保障部队需要。他指示魁伦与额勒登保协调，把伤病兵遣回原营，以节省开支。^203 十一月初，魁伦呈上了一份关于四川战争财政管理不善与漏洞的长篇报告，提出了一套新规章。除其他事项外，他要求后勤人员每旬呈报、每月清账。除废除长骡外，魁伦还打算以额勒登保部队的开支为基准，使各项开支标准化。^204 大约此时广兴到达达州，他迅速行动，查出更多漏洞与不法行径。他挑出雇募乡勇的开支，视为又一项极为昂贵且欺诈性的支出，随后努力裁减过大的乡勇队伍（1797—1798年四川领饷乡勇曾超过二十万）。嘉庆欣然批准了这些新规章与改革。虽然他说自己可以灵活处理，甚至为最后胜利而破例——因为结束战争意味着省下大笔钱财，拖延战争则耗费更多——但定下的调子是：开支要更严格。总之，能砍的他都会砍。^205</p>\n<p>四川采取的某些措施，可能受了松筠在陕西所定新规章的影响。魁伦入川之前，嘉庆就指示他留意松筠整顿后勤的做法，并把松筠提案的抄本随指示附寄给魁伦。^206 但有一项改革魁伦没有从陕西照搬：废止\"赏号\"——将领定期犒赏部队的做法，这场战役中主要以现银发放。初夏松筠到达汉中、接管陕西后勤时，请求用自己的\"养廉银\"——每年二千两——犒赏陕西的士兵与乡勇。^207 那彦成与台布到任后，也相继提议从自己的收入中拿钱作此用途。嘉庆同意了台布的请求，让他预支两年的养廉银，却驳回了那彦成的请求，说他还要赡养寡母与家人。再次对新贵示以恩宠，嘉庆赏那彦成六千两犒军银——从陕西省库支出，而非军费。^208</p>\n<p>新到川陕官员们的这些举措给嘉庆带来了希望：他们个个清廉、勤勉、锐意改革，没有故意拖延战役结束的隐衷。^209 十一月二十四日，嘉庆亲自处理四川的赏号问题。他赏额勒登保一万两、德楞泰五千两用于犒军，并指示这笔钱从四川省库支取，而非达州军需局——意在关上将领们用军费支付这项开支的大门。^210 与将领们先前所得相比，这些皇家赏赐吝啬得不足以令他们感恩。而且，时机使这一打击雪上加霜：距新年只有一个月，部队本指望特别丰厚的年赏。军人们苦涩的反应过了一段时间才传到中枢，而魁伦——这场削减他们战时收入的改革的化身——将首当其冲（广兴程度较轻，因为他到得晚，又忙于裁减乡勇）。魁伦垮台的种子已经种下。</p>\n<h2>未破的僵局</h2>\n<p>回到军事前线，1799年的战事并不像嘉庆希望的那样顺利。在湖北，倭什布确实夸大了夏天前往湖北的徐天德、李述队伍的规模——它只有几千人，而不是他所声称的两万。然而，几支襄阳队伍——包括张添伦、樊人杰与辛聪——大约同时从四川突入湖北巴东，随后北上，目标显然是襄阳。^211 听说湖北告急，嘉庆不遗余力地保障该省，从吉林与黑龙江再调两千名旗兵入鄂（此前已从盛京调去两千名旗兵），并催促明亮与额勒登保前往湖北。^212 然而，湖北局势很快向有利于清方的方向转变：八月初，倭什布与副将孙清元在南漳击溃了徐、李队伍，据说杀俘两千余人。前往襄阳的计划既已落空，徐、李队伍转而向西南，从巴东返回四川。途中李述伤重而死。^213</p>\n<p>襄阳起事者又在湖北盘桓了一个月。七月下旬到达湖北后，德楞泰与朱射斗先在竹溪击破了只有两千人的线号，俘获龚文玉；龚其位跳崖而死。^214 随后他们把樊人杰逐回大宁，把张添伦与辛聪逐回平利。^215 到九月，湖北再次解除了战事；破坏有限，因为受波及地区多为山区、人烟稀少。^216 倭什布虽然因平定湖北之功获得世职，却因夸大事件严重性而遭到皇帝的严厉批评。^217 官员夸大本辖区危险以获取援兵、更多经费与赋税减免，本是战时的通例。但这一事件产生了不同寻常的反响：它帮助扳倒了勒保。额勒登保对勒保被罢免本就不满，对倭什布的夸大也极为恼火。^218</p>\n<p>此时，许多最早的叛军首领已经死去，幸存的起事者在挣扎。被逐出甘肃后，张世虎的蓝号与杨开甲的白号在川北漂流，各只剩几百人。张添伦与辛聪从湖北返回四川后，也只剩千把人。^219 但真正坚定的起事者重新集结，结成新的股团，拥立新的首领。一群襄阳起事者接过了王聪儿的衣钵，把新队伍称为\"齐家营\"（Qijiaying）。然而，夏末在川陕边境被额勒登保击败时，他们损失了数千人——包括王聪儿的侄女齐四姑，即\"四姑奶奶\"——只剩数百人。^220 襄阳出身的最著名新队伍是\"高家营\"（Gaojiaying）。高均德虽然是其谋主，却用化名郝一知退隐幕后，让叔父高成杰——人称高二——与马朝礼——人称马五——公开带队。^221 另一支新队伍\"戴家营\"（Daijiaying）由戴仕杰——人称戴四——统领，他二十出头，是张汉潮的追随者。教门叛军事实上的教宗王廷诏常常或随高家营、或随戴家营行动，并设法隐瞒自己的行踪。正是王廷诏建议高均德使用化名以避开敌人注意。^222 这两支队伍常常协同行动。</p>\n<p>襄阳与四川的起事者有时虽也混处，大体上两个群体还是各走各的。在四川起事者中，徐天德一股仍是最大的，从湖北返回四川时或许有五六千人——这很可能是因为徐天德对襄阳群体敞开大门。^223 徐天德的弟子王登廷自领一股，在家乡一带游走。与此同时，罗其清与冉文俦的残部也组成了新队伍。冉文俦之侄、天赋过人的统帅冉天元复兴了蓝号——这支队伍很快将以凶悍震惊清军。罗其清的两名追随者——苟文明（其妹嫁与罗其清之弟）与鲜大川，都是巴州人——各自立了队伍，活跃于四川多山的东北边境。</p>\n<p>嘉庆常常痛斥将领们只擒叛军首领，使叛军残部有充分的机会复兴；任命额勒登保为新统帅时，他重申：将领们击败某股叛军时，还应设法擒获其首领的全部亲属。^224 受命之时，额勒登保正在川北对付几个股团。或许受晋升的鼓舞，额勒登保再次展现了他的效能。九月中旬，额勒登保在广元几乎全歼了一支千人的队伍——它吸收了许多齐家营的残部——并杀死了其首领。^225 到九月底，额勒登保已按计划把陕西的大多数叛军股团压向四川通江与南江；朱射斗与总兵李绍祖、战功卓著的满洲旗人、四川提督七十五一起，把徐天德及其数千人逼向东乡。^226</p>\n<p>德楞泰或许受到了额勒登保执掌帅印的刺激。正如松筠所指出的，德楞泰\"论杀贼，可称勇猛\"（原文待核，见注释227）。^227 确实，德楞泰想干的时候是很有本事的。仲秋，德楞泰从湖北追辛聪到陕西，在那里遭遇了新建的高家营。十月初六日，他在西乡与高家营交战，据说杀死一千余人，俘获高均德、高成杰、马五之妻及其他几名首领，以及数百名起事者及其家属。为这场胜利，嘉庆授予德楞泰二等男爵，并任命他为参赞大臣，成为额勒登保的副帅。^228 急于再立新功，德楞泰此后数周作战更勤。然而，他在可信的战功里掺了假。^229 最令朝廷欣慰的是德楞泰的估计：仍在逃的起事者只剩一万几千人，他们已被逼入绝境、筋疲力尽，常常衣不蔽体、赤着脚——因为四川许多居民已把粮食藏进堡寨，起事者获取给养越来越难。\"贼数日减，官兵愈奋\"，德楞泰如此奏报，尽管他也承认新的股团正在出现。^230</p>\n<p>额勒登保同样乐观。十月初作为统帅所上的第一道奏折中，他强调起事者已是强弩之末，尽管他知道新队伍、新首领在成倍增加。他坚持把所有叛军赶向四川，同时阻止他们进入湖北与陕西。为实施这一计划，他要求那彦成与大部分新到的旗兵前往四川。^231 额勒登保的这些提议——尤其是对那彦成发号施令——意在宣示他作为统帅的全部权威，因为嘉庆早先曾表示：额勒登保不必照管所有战场，只对自己负责即可。^232 尽管额勒登保暗示了他与那彦成可能不和，嘉庆还是对他的乐观前景感到高兴。这加上张汉潮之死与德楞泰的胜利，使皇帝又有了希望；他设定了新的期限，给军队两个半月时间，在嘉庆四年内结束战役。^233 十一月中旬他虽很快修改了期限，延长两三个月以肃清叛军余部，心情仍然昂扬。他对那彦成肃清张汉潮残部的进展有些担心，指示额勒登保与那彦成合作，不要只限于本省——意在敦促额勒登保完成自己的任务后帮助那彦成。^234</p>\n<p>嘉庆又太乐观了。到1799年底，许多叛军股团会师川东北，冉天元、樊人杰、徐天德与王登廷之间形成了一个松散的联盟。四股队伍协同行动，有时合而为一，目标直指清军的运输线。尽管人数减少，留下来的人大多是坚定的，并将一再证明他们的实力。^235 十一月初的一场战斗中，他们杀死了安禄——一位承袭其父一等公最高爵位的侍卫。安禄的父亲海兰察是乾隆朝晚期的杰出将领。与1797年乾隆对惠伦之死的反应相似，嘉庆深感悲痛，认为让旗人贵族与\"幺么小丑\"的匪徒交锋，是不值得的牺牲。^236 不久，在巴州何家院的一场血战中，叛军联盟使额勒登保的部队伤亡惨重；数名高级满洲军官——包括春宁与格布舍——负伤，尽管额勒登保声称他的部队杀死一千余名叛军、俘获数百。^237</p>\n<p>何家院之战后，起事者似乎正在实施一个新计划：徐天德与樊人杰再次前往湖北，冉天元与王登廷留在四川——这可以分散额勒登保的注意力。他们很可能在十一月中旬通江一场战斗之前分了手。^238 徐、樊移出额勒登保视野的同时，冉天元率其蓝号向西前往苍溪。十一月底、1799年结束前几天，额勒登保遭受了一场惨败。在苍溪青子垭一场彻夜战斗中，冉天元的人马从阿哈保与穆克登布两名满洲军官手中夺下一座山冈，随后从山顶向下冲锋。清晨冉天元率部撤离时，留下三百多名清军士兵乡勇与十三名老练军官的尸体。^239 这堪称额勒登保在这场战役中最惨的一败；1800年初消息传到北京时，将严重影响嘉庆对战役的看法。</p>\n<p>在汉江以北，那彦成对张汉潮数百残部的追剿毫无成果。^240 接管明亮与兴肇的部队后，又有三千名盛京、吉林旗兵加入，^241 那彦成手握一万多名士兵，大多是旗兵。嘉庆责成他先肃清张汉潮残部，再到汉江以南与其他起事者作战。尽管已是十一月，皇帝仍坚持那彦成在年底前完成战役的期限。^242 尽管手握重兵，那彦成对在秦岭深处完成任务却没有信心。在前线的第一批奏报中——他到任数周后才上第一道奏折，很可能是在设法理清方略——那彦成坦率地表达了他的顾虑乃至沮丧。他惊叹于群山的荒蛮，详述了遇到的种种困难。他抱怨部队与笨重的后勤队伍在山中行动不快——那里终年冰雪覆盖，常常无路可走——而起事者几度穿越群山，更熟悉山中情况；他们没有后勤之累，只需劫掠山中的居民与难民获取给养。就作战而言，不可能包围叛军、实施夹击；树木灌木的茂密又削弱了火器与弓箭的效力。显然束手无策的那彦成请求增调旗兵——他的兵力因分兵把守各个山口而越来越少。^243</p>\n<p>那彦成的悲观令嘉庆失望又恼怒，他批评了那彦成所做所建议的一切，包括他对秦岭风光诗意的描绘，并在谕旨结尾罕见地用了\"含泪训谕\"（原文待核，见注释244）一词。^244 嘉庆的高期望反过来使那彦成更急于建功。然而，到达前线后的十天里，他与起事者八次遭遇，除每次杀死数十名叛军外，没有取得决定性胜利——起事者一见清军就遁入林中。确信对付敌人游击战的唯一办法是自己也采用游击战，那彦成让部队轻装简行，分遣队进入森林。他亲率一支，凡马匹不能通行之处就徒步而行。^245</p>\n<p>嘉庆又不赞成那彦成的决定，认为他或任何主帅进入森林追剿叛军纯属鲁莽。他要那彦成挑选精兵入林，把叛军赶出来，好让清军主力在林外了结他们。他甚至建议可以烧林以达此目的。^246 但那彦成不肯退让，论证说自己的在场能鼓舞士气，并能在出现意外时及时调整，尽管他继续抱怨重重障碍：林中能见度差、各分遣队之间联络不畅、叛军残部决心死战到底。随后，那彦成恳求给更多时间以实现自己的计划。^247 1800年初，嘉庆再次命那彦成撤出，封锁入林通道，等额勒登保结束四川战事后前来。嘉庆还让那彦成拨一千名旗兵给额勒登保——鉴于他兵多。但那彦成拒绝了，坚称这些旗兵——耐得住山地寒冬、精于骑射——对他不可或缺。他再次抱怨汉江以北一万四千名正规军还不够。^248</p>\n<p>在汉江以南，1799年下半年，襄阳与四川的起事者反复拼命地试图接近并渡过汉江。有些是想与张汉潮残部会合，或前往湖北、河南；有些则只是被大巴山中给养匮乏所迫。战斗有时十分激烈。夏末兴安一场持续三天的战斗中，清方损失了十名军官与三百多名士兵乡勇。^249 为加强江防，清方雇了更多乡勇，并从山西调两千名士兵到江边。在驻节西乡的固原提督王文雄督率下，清军挫败了各股叛军的所有渡江企图。^250</p>\n<p>在江边打不破清军防线，叛军就向东西两面另寻出路。徐天德、樊人杰、辛聪等人从四川与陕西两路向湖北移动。虽然被击退，三省边境的压力却在累积。^251 与此同时，高家营的余部——如今由马五与新的\"高二\"统领，此人名叫高天升，队伍因此开始被称为\"高马股\"——向西移往甘肃。在四川，冉天元即将成为新的有号召力的首领。青子垭大捷之后，他吸引其他股团投到他的旗帜之下。^252 嘉庆发动瓦解叛乱的心理战将近一年之后，几乎没有叛军投降——尽管嘉庆每次任命新统帅时都重申他的新政策。1799年走到尽头时，叛乱并未奄奄一息，而嘉庆打击前线腐败的改革却开始适得其反——这很快将给镇压者带来严重的挫折。</p>\n<h2>注释</h2>\n<p>[译者按：文献简称对照——除前章所列外，另有：JQQJZ《嘉庆朝起居注册》；QLQJZ《乾隆朝起居注册》；MQDA《明清档案》；NGDK《内阁大库档》；XFFLXB《钦定剿平三省邪匪方略续编》。]</p>\n<p>题辞：嘉庆四年七月初六日批语，XFFL, 108/40a.</p>\n<ol>\n<li>JQSYD, 4:3.</li>\n<li>此人是山东巡抚伊江阿。嘉庆震怒，将他革职，流放伊犁。JQQJZ, 4:28, 62.</li>\n<li>QSLJQ, 37/6b.</li>\n<li>QSLJQ, 37/18b–19b.</li>\n<li>QSLJQ, 37/22b–23a.</li>\n<li>QSLJQ, 37/32a–36a.</li>\n<li>XFFL, 88/4a. 类似表述见QSLJQ, 38/3a–b, JQSYD, 4:16.</li>\n<li>QSG, 11316.</li>\n<li>XFFL, 77/29a.</li>\n<li>此点在既往研究中被忽视。巴特利特（Bartlett）认为，是政治权力的垄断与贪腐决定了和珅的垮台，却未提及白莲教战役。Monarchs and Ministers, 232–39. 曼素恩（Mann）与孔飞力（Kuhn）在\"Dynastic Decline\"中也没有提到；见第108页。</li>\n<li>冯佐哲在《和珅评传》（Heshen pingzhuan）269–314中驳斥了对其家产的夸大。</li>\n<li>JQSYD, 4:33–34. 嘉庆确实批评过和珅向官员索贿，导致官员转而盘剥百姓以获取额外收入。XFFL, 88/7a–b.</li>\n<li>不过，和珅在认为必要时也能破例。1797年，他批准支付军事民夫从广西向贵州运送大炮与装备（为苗疆战役）所用帐篷的费用——尽管《军需则例》不认可。剿捕档，嘉庆二年九月，27–30。</li>\n<li>XFFL, 103/8a-9a, 14b. 关键问题是\"长夫\"（changfu）与\"长骡\"（changluo）。关于这些开支，见第7章。</li>\n<li>MQDA, A288-1.</li>\n<li>嘉庆一再指出，战争领导人滥支经费，是因为他们指望和珅庇护。XFFL, 90/18b-19a, 91/25a, 116/11b.</li>\n<li>XFFL, 89/14a–b.</li>\n<li>XFFL, 103/8a-11b. 鳌拜于1669年康熙亲政时被清除。年羹尧于1726年以四川总督身份被清除。讷亲于1749年因战争已近结束而被处死于解往金川途中。</li>\n<li>嘉庆命福长安观看和珅自尽。QSLJQ, 37/50b–51b; 38/2b–5a.</li>\n<li>乾隆即位后，很快把父亲信任的两位大臣鄂尔泰与张廷玉边缘化。</li>\n<li>JQSYD, 4:33–34.</li>\n<li>嘉庆勒令和珅的几名门生致仕或降职，惩处了他的几名管家，并追夺了和珅已故之弟和琳的恤典。QSLJQ, 38/5a–7a; Nivison, \"Ho-shen and His Accusers,\" 241; 关文发《嘉庆帝》（Guan, Jiaqingdi），254–55。</li>\n<li>QSLJQ, 37/27b–28b, 37/30b–31a. 松筠1785至1792年任库伦办事大臣，主持对俄边境贸易。1793年，他参与接待马戛尔尼使团。关于松筠在拉萨的经历与建树，见达布林豪斯（Dabringhaus）Qing Imperium。</li>\n<li>书麟是满洲旗人，以武职起家，后转文官系统。和珅倒台时，书麟正流放新疆。QSG, 11125–27. 嘉庆四年三月初五日，嘉庆对调了书麟与魁伦的职位。QSLJQ, 40/10a–b, 40/16b.</li>\n<li>QSLJQ, 37/27b–28a, 39/5b–6a, 53/22a–b.</li>\n<li>朱珪于嘉庆四年正月初三日奉诏进京，入直南书房。JQQJZ, 4:9; 关文发《嘉庆帝》（Guan, Jiaqingdi），219–22。1797年，和珅曾阻挠朱珪回京。Nivison, \"Ho-shen and His Accusers,\" 240.</li>\n<li>XFFL, 87/22a–b.</li>\n<li>XFFL, 87/22b–23a.</li>\n<li>QSLJQ, 37/28b–29b.</li>\n<li>嘉庆认为明亮的动机是索取更多经费。他以严惩相威胁，指示明亮迅速消灭张汉潮一股。QSLJQ, 38/10b.</li>\n<li>QSLJQ, 38/14a–15b; 88/17b–18b. 永保被升为头等侍卫。XFFL, 88/25a.</li>\n<li>XFFL, 89/5a–10b.</li>\n<li>XFFL, 89/9b.</li>\n<li>XFFL, 89/14a–b; QSLJQ, 38/34a–b; 39/6b–7b.</li>\n<li>XFFL, 35/35b, 46/11b–12b, 56/24b–25b.</li>\n<li>XFFL, 23/6b–7a. 秦承恩曾告诫部下不要杀死所有脸上刺有\"白莲教\"字样的俘虏。他甄别所有投降与被俘者，处死\"真\"叛军，遣返被裹挟的平民。XFFL, 67/4a–5a, 45/18a. 在四川时，宜绵把甄别俘虏的任务交给幕僚龚景瀚。龚景瀚处决了那些自愿参与烧杀者，释放了大多数被裹挟的平民。XFFL, 63/9a–10a.</li>\n<li>一个体现过分残忍的例子：额勒登保把林之华的妻子及其九岁的女儿一并凌迟处死。XFFL, 52/3b–4a.</li>\n<li>QSG, 11317.</li>\n<li>王三槐可能是为保命而编造了这套说辞：他说，若让他活命，其他人就会受到鼓舞而投降。王三槐供词，BLJZL, 5:65–68, 68–72, 73–74; XFFL, 81/20a–21b. 确有几位叛军首领在受审时用\"官逼民反\"这句口头禅作为叛乱的理由。覃加耀与张正谟供词，BLJZL, 5:63; 张正朝供词，第62–64页。</li>\n<li>JQQJZ, 4:60–61. 二月，王三槐与罗其清、罗其书一道被凌迟处死。JQQJZ, 4:91.</li>\n<li>QSLJQ, 38/16a–18a; XFFL, 86/6a–9a, 87/6b–7a, 89/2b–4a; Nivison, \"Ho-shen and His Accusers,\" 216–17.</li>\n<li>JQQJZ, 4:80–81; QSLJQ, 38/23a–b; XFFL, 卷88–89、92–94 各处。同时，嘉庆毫不含糊地表示：任何叛军首领都不得宽赦，应就地正法，以震慑其他叛军。XFFL, 91/25b–26a.</li>\n<li>XFFL, 90/20a–22a, 92/10b–12b.</li>\n<li>XFFL, 91/17a–18b, 92/29a–b, 94/5a–18a, 95/1a–13a.</li>\n<li>QSG, 11316–17.</li>\n<li>JQSYD, 4:62.</li>\n<li>嘉庆听说达州有两个恶官，其一是戴如煌，另一个的名字他想不起来了。XFFL, 93/28b–30a.</li>\n<li>JQSYD, 4:132–35. 事实上，常丹葵参加了当阳围城，当阳收复后还获了升迁。XFFL, 8/35b.</li>\n<li>GZDJQ, 3422; XFFL, 210/15a–19b. 关于清代知县的众多书吏差役，见里德（Reed）《爪牙》（Talons and Teeth），特别是122–59。</li>\n<li>据德楞泰与勒保说，被俘的达州叛军中，除李仕怀外，无人提及受过戴如煌勒索——李仕怀1796年秋曾给戴如煌的两名书吏二十两银子以脱干系。XFFL, 210/16a. 达州的两名叛军只提到1796年有过对教众的迫害。傅月明供词，BLJZL, 5:81; 庹向瑶供词，第137页。尽管德楞泰与勒保为戴如煌辩护，戴如煌后来仍被流放伊犁，其子孙被禁止入仕。XFFL, 195/15b–17a, 210/15a–19b, 210/25a–26a.</li>\n<li>20世纪80年代前中华人民共和国出版的少数几种关于白莲教战争的著作几乎都引用他们。又见铃木中正Sennen ōkkuteki, 306–8。</li>\n<li>QSLJQ, 39/25b–26a.</li>\n<li>QSLJQ, 27/42b.</li>\n<li>QSLJQ, 39/19b–20a.</li>\n<li>QSLJQ, 37/41a–b, 38/29a–b.</li>\n<li>为奖赏谷际岐提供情报之功，嘉庆把他升为\"掌礼科给事中\"。QSG, 11316.</li>\n<li>松筠任命之前，恒瑞奉命署理宜绵之职。QSLJQ, 38/25b–26b, 39/2a. 嘉庆召见宜绵后，命他自费赴乌里雅苏台效力。JQSYD, 4:114.</li>\n<li>JQSYD, 4:142.</li>\n<li>QSLJQ, 38/25a–b, 39/13a–b. 秦承恩后来获释，被抄没的家产也发还——因为查明许多对他的指控并不属实。XFFL, 90/6a–7a, 102/1a–3a, 102/9a–11a; JQSYD, 4:169, 175–76.</li>\n<li>QSLJQ, 41/27b–28a.</li>\n<li>XFFL, 68/15b–16a.</li>\n<li>XFFL, 卷96–98、100–104 各处。</li>\n<li>XFFL, 88/31b, 91/27b–29a, 92/3b–4a, 92/30b–31a; QSLJQ, 40/7b–8b.</li>\n<li>QSLJQ, 40/25a–27a; XFFL, 93/3a–4a; JQSYD, 4:86–87.</li>\n<li>倭什布为景安辩护，反驳\"怯懦\"的指控，并指出广福脾气急躁。连广福本人也不同意景安曾试图避战的说法。XFFL, 96/27b–31b, 101/20b–24b, 110/35b–41a.</li>\n<li>QSG, 11177.</li>\n<li>XFFL, 88/10a–13b, 88/15a–16a, 89/10b–14a, 91/6b–8a, 92/12b–19a.</li>\n<li>XFFL, 89/10a. 他为百祥与朱射斗在方山坪作战迟缓辩护，又为惠龄、德楞泰未能肃清冉文俦全部部众辩护。XFFL, 92/23b–26a.</li>\n<li>QSLJQ, 39/7a; XFFL, 89/9b–10a, 110/35a–b.</li>\n<li>刘清被升为忠州直隶州知州，仍带知府衔。XFFL, 91/8a–9a, 91/11b–12a.</li>\n<li>XFFL, 106/6a–b, 106/11b–12b.</li>\n<li>XFFL, 101/8a–b.</li>\n<li>QSLJQ, 38/15b–16a.</li>\n<li>XFFL 卷92–96 各处, 100/26b–30b; QSLJQ, 39/14a–15a.</li>\n<li>XFFL, 102/3a–5a, 103/27b–29a.</li>\n<li>XFFL, 105/8b–11b, 106/24b–27b, 107/1a–2a.</li>\n<li>XFFL, 卷88–92 各处。</li>\n<li>额勒登保先获二等男爵，消灭冷天禄一股后升为一等。他还被免缴此前因拖延剿灭湖北林、覃队伍而被罚的一万两银子。XFFL, 93/17a–24b, 94/18a–22b, 94/29a–31a; QSLJQ, 41/7b–9b; 41/25b–27a.</li>\n<li>XFFL, 96/1a–5a.</li>\n<li>XFFL, 93/27b–28b, 94/28a.</li>\n<li>QSLJQ, 40/4a. 又见QSLJQ, 38/20a–b.</li>\n<li>QSLJQ, 40/4a–5a; XFFL, 92/1b–2a.</li>\n<li>XFFL, 96/7b, 96/10b–13a; QSLJQ, 44/13b, 44/21b–22a.</li>\n<li>XFFL, 102/23a, 103/1a–8a, 103/12a–13a.</li>\n<li>XFFL, 96/29b–30a, 98/1a–11a, 98/15a, 98/16a, 98/20a, 101/1a–5b, 101/10b–12b, 103/1a–8a.</li>\n<li>XFFL, 99/13a–b.</li>\n<li>勒保说那些旗兵训练无素、纪律松弛。XFFL, 106/7a–b.</li>\n<li>XFFL, 106/7b–15b.</li>\n<li>XFFL, 107/13b–20b.</li>\n<li>XFFL, 107/20b–24b.</li>\n<li>广兴随后由监察御史升为副都御史（fuduyushi）。XFFL, 91/29b–31a; QSLJQ, 407a–b.</li>\n<li>XFFL, 107/23b–24b.</li>\n<li>XFFL, 卷96–100、106–8 各处。</li>\n<li>XFFL, 108/35a–38a.</li>\n<li>XFFL, 108/39b–40a.</li>\n<li>XFFL, 108/38a–41b.</li>\n<li>朱射斗获授世职，其部队赏一个月饷银。XFFL, 109/1a–3b, 109/8b. 勒保在自撰战役纪略中把包正洪列为他自己剿灭的叛军首领之一。勒保《平定教匪纪略》（Pingding jiaofei），157。</li>\n<li>魁伦由四名侍卫陪同，先停陕西，向明亮宣布其新任命，再赴四川罢免勒保。QSLJQ, 49/2b–4b; XFFL, 110/7a–11a, 110/12b–17b.</li>\n<li>XFFL, 110/18a–30b.</li>\n<li>XFFL, 110/30b–35b.</li>\n<li>德楞泰于嘉庆四年七月二十一日接到勒保的信，七月二十六日进入湖北。XFFL, 117/1a–4a.</li>\n<li>XFFL, 113/6b–9b.</li>\n<li>XFFL, 卷88–91 各处, 93/11a–16a, 95/25a–32a, 97/22a–26a.</li>\n<li>XFFL, 卷87–90 各处, 121/14a–b.</li>\n<li>XFFL, 94/22b–26a, 97/5b–8a.</li>\n<li>XFFL, 95/15b–17a, 99/1a–5b, 99/18a–20a. 广兴八月回京时向嘉庆奏报了永保此战败绩。但永保否认败绩，也否认与明亮的冲突。XFFL, 116/9a–10a, 120/19a–b, 122/6a–9b.</li>\n<li>XFFL, 100/6a–10a.</li>\n<li>XFFL, 100/14a–16b, 106/22b–23a.</li>\n<li>XFFL 卷102、104 各处。</li>\n<li>有一次，张汉潮的部下食物中毒；又有一次，张汉潮及其人马喝醉了酒，睡在一个村子里。每次明亮都得到消息，却不行动。还有一次，叛军北上时，明亮故意南下。XFFL, 116/10a–b.</li>\n<li>XFFL, 95/25a–32a, 105/13b, 105/16b–23a; QSLJQ, 46/26b–29a.</li>\n<li>XFFL, 109/12a–15b, 109/29b–31a, 109/32b–34b, 118/14b–20b.</li>\n<li>XFFL, 117/20a–21b, 117/24a–41a.</li>\n<li>XFFL, 111/27a–30a, 114/1a–5b, 114/14b–16a.</li>\n<li>XFFL, 111/30a–32b, 114/11b–14b, 115/8b–13b, 115/29a–35a, 116/27b–29b.</li>\n<li>XFFL, 115/40a–b, 116/8b–9a.</li>\n<li>XFFL, 115/40a–43b, 116/10b–13b.</li>\n<li>嘉庆还把额勒登保升为都统，并指示魁伦把原赏给明亮的经略大臣印信与荷包转交额勒登保。XFFL, 116/13b–15b, 116/17b–19a. 任命前嘉庆对额勒登保的称赞，见XFFL, 103/15a–b, 114/19a, 116/13a–b. 事实上，额勒登保之所以没有收到胡齐仑的\"馈赠\"，是因为他不在鄂北作战，而是一直随福宁在鄂西南；那里的后勤由福宁本人主持。</li>\n<li>张汉潮的招募计划一经泄露，地方官府就逮捕了许多教众。XFFL, 122/4a–6a, 123/7b–8a.</li>\n<li>XFFL, 116/24a–26a, 117/27a–29a, 120/1a–5b.</li>\n<li>吴熊光与松筠看法一致，恳请让永保与明亮都留在前线，调查推迟到战后。XFFL, 117/20a–21b, 117/24a–26b, 118/14b–16a, 120/15b.</li>\n<li>XFFL, 117/34a–41a; QSLJQ, 50/31a. 不久，嘉庆撤掉了当年早些时候给永保两个儿子的任命，并终止了庆成之弟在宫中当差。XFFL, 119/20a–b. 本章及后续各章关于那彦成的讨论，部分取材于戴（Dai）\"Broken Passage\"。</li>\n<li>XFFL, 117/40b–41a, 119/14b–20a.</li>\n<li>XFFL, 77/29a–b.</li>\n<li>嘉庆四年正月初八日，他先被任命为翰林院掌院学士。JQSYD, 4:13. 数日后，正月二十一日，那彦成被任命为工部尚书（第37页）。随后他又加崇文门监督之衔（第40页）。接着奉命署理兵部尚书（第46页）。二月十九日，那彦成被任命为国史馆副总裁（第59页）。五月二十七日，奉命兼管内务府营造司（第182页）。七月二十五日，被任命为内务府总管之一，尽管其翰林院掌院学士被免（第259页）。</li>\n<li>那彦成被任命为蒙古黄旗副都统与汉军镶白旗都统。QSLJQ, 39/4a; NGDK, 62.</li>\n<li>JQSYD, 4:44.</li>\n<li>JQSYD, 4:158–59.</li>\n<li>讷亲因未能速胜被清除后，乾隆派年轻的军机大臣傅恒赴第一次金川之役。傅恒成功把战争带向令人满意的结局，为其擢升领班军机大臣铺平了道路。1781年，和珅被派去主持镇压甘肃回民起事的战役。他未能取胜后，阿桂被派去，帮助和珅赢得了战役。</li>\n<li>XFFL, 120/20a–b.</li>\n<li>永保被罢免后不久，台布被任命为陕西巡抚。XFFL, 117/34a–41a; QSLJQ, 50/31a.</li>\n<li>XFFL, 121/1a–5a.</li>\n<li>QSLJQ, 52/4a–5a; XFFL, 121/5a–9a. 那三千名旗兵起初派往湖北，湖北危机结束后改派陕西。</li>\n<li>XFFL, 120/1a–5b, 120/12a–13a.</li>\n<li>XFFL, 120/9a–11a.</li>\n<li>XFFL, 122/14b–19b, 123/17a–18b, 135/8b–12a.</li>\n<li>XFFL, 122/1a–4a, 122/9b–13a.</li>\n<li>嘉庆还把明亮汉军红旗都统之职降为副都统。XFFL, 123/21b–30b.</li>\n<li>XFFL, 125/7a–9a, 127/4a–10b, 128/3b–8b, 131/13b–14a. 李潮是襄阳的老叛军，声称1797年与张汉潮合并后，他一直是张汉潮一股的实际首领。李潮供词，BLJZL, 5:79–80.</li>\n<li>XFFL, 127/10b–12b.</li>\n<li>嘉庆尤其恼怒的是：他顶着盛夏酷暑披阅批复明亮的奏折，而奏折里报的却全是假仗。XFFL, 120/5b–9a, 122/1a–4a, 122/6a–13b, 122/19b–20b, 125/1a–7a, 125/17a–21b, 125/23a–b. 但他后来对永保指控的真实性产生了怀疑，于是让松筠当面对质，判断谁在说谎。XFFL, 127/16a–17b.</li>\n<li>嘉庆赏了一些官职，并给士兵赏了一个月饷银。XFFL, 127/13a–16a, 127/17b–18a.</li>\n<li>XFFL, 125/10b–11a, 125/12a–13b, 125/28a–30a, 128/1a–8b, 133/44a–45a.</li>\n<li>松筠为明亮挡掉了永保的一些严重指控——如设局陷害永保、捏造三场战斗——并声称永保怯懦拖延。XFFL, 135/1a–14b.</li>\n<li>XFFL, 119/19a, 123/28b–29a.</li>\n<li>QSLJQ, 39/6b–7b; XFFL, 87/8a.</li>\n<li>GZDJQ, 2231; XFFL, 33/41b.</li>\n<li>XFFL, 88/19a. 英善被派往西藏，接替松筠任驻藏大臣。QSLJQ, 38/19a; JQQJZ, 4:71.</li>\n<li>XFFL, 90/15a–18b. 不久，福宁又上了一道奏折，再次试图撇清自己与四川开支过滥的关系。XFFL, 93/4a–7a.</li>\n<li>XFFL, 90/18b–20a.</li>\n<li>昭梿《啸亭杂录》（Zhaolian, Xiaoting zalu），342。</li>\n<li>松筠于嘉庆四年四月二十五日到达陕西，五月初三日前赴甘肃成县，从恒瑞手中接过总督印信。XFFL, 101/26b.</li>\n<li>QSLJQ, 40/3b.</li>\n<li>QSLJQ, 40/29a–b.</li>\n<li>景安离开后，嘉庆命勒保暂时挑一名文官或旗军将领协助福宁。XFFL, 96/29b–31b.</li>\n<li>XFFL, 112/27b–30a; QSLJQ, 40/32a–b.</li>\n<li>XFFL, 14/27a, 14/31b.</li>\n<li>JQSYD 3:139, 186–87.</li>\n<li>JQSYD, 4:58–59, 62. 对胡齐仑的另一项指控是：1797年春，他捏造了一份报告，称襄阳一带返乡的叛军正在密谋新的起事。胡齐仑随后率兵与乡勇攻打那些所谓的叛军，杀死并逮捕了数百人。胡齐仑因此被升为按察使，但后来查明，那些人是难民。XFFL, 32/29a–35b, 32/38a–39a; JQSYD, 4:161–65, 344.</li>\n<li>嘉庆直言斥责倭什布不呈胡齐仑的账册，并警告他不得试图篡改或销毁记录。JQSYD, 4:185–86.</li>\n<li>据胡齐仑被处决后的奏报，总额为83,961两。JQSYD, 4:347–51, 429. 但他的账册记录的馈赠超过99,000两，被捕时家中又搜出50,000两。</li>\n<li>嘉庆命褫夺毕沅两个儿子的世袭职衔。JQSYD, 4:353.</li>\n<li>XFFL, 108/23b.</li>\n<li>此前，魁伦在陕西郿县与广兴会面后，曾就四川后勤问题上过一道奏折。嘉庆的答复是重申指示：到任后彻查勒保与福宁。XFFL, 114/23a–27a.</li>\n<li>XFFL, 116/2b–8b.</li>\n<li>XFFL, 116/8b–16a, 123/12a–14a.</li>\n<li>嘉庆把刘清升为道员，并告诉魁伦：四川一旦有缺，就任命刘清。XFFL, 115/15b–16a, 116/11b, 116/20b–21b; JQSYD, 4:290.</li>\n<li>关于洪亮吉的生平与仕途，见琼斯（Jones）\"Hung Liang-Chi\"。</li>\n<li>信见《洪亮吉集》（Hong Liangji ji），223–30。关于此事，见Jones, \"Hung Liang-Chi,\" 156–202，及艾尔曼（Elman）Classicism, 284–90。</li>\n<li>Jones, \"Hung Liang-Chi,\" 139–41.</li>\n<li>JQSYD, 4:305–10. 正如倪德卫（Nivison）所指出的，洪亮吉试图与皇帝沟通的方式——把信的抄本寄给京城权要，而不是直接上奏——加深了嘉庆的不安。Nivison, \"Ho-shen and His Accusers,\" 241–43.</li>\n<li>QSG, 11299.</li>\n<li>乾隆把查弼纳误当成了魁伦的曾祖父。QSLQL, 1297/15b.</li>\n<li>QSG, 11081–84, 11299–300; QLSYD, 18:656–912 各处。</li>\n<li>魁伦于1796年初开始署理总督，数月后正式任命。</li>\n<li>嘉庆把魁伦所欠186,000两中的96,000两蠲免，允许魁伦用养廉银缴还其余90,000两，但把房产还给了他。JQSYD, 4:75–76.</li>\n<li>广兴先揭发了游涵宇的渎职，嘉庆遂责成魁伦进一步查办。除魁伦建议的\"留广元效力、不给俸禄\"外，嘉庆还命将游涵宇枷号三个月。XFFL, 115/28b–29a, 119/23a–26a.</li>\n<li>到达达州之前，魁伦已于嘉庆四年九月初一日接到勒保送来的总督印信。XFFL, 121/16b–18a.</li>\n<li>XFFL, 116/7b–8a. 关于魁伦的画艺，见裕瑞《滦阳录》（Yu, Luanyang lu），2/13a–b。</li>\n<li>嘉庆此前曾让魁伦去攻打达州叛军王登廷所率的一股。XFFL, 118/33a–34a, 122/23b–28b, 123/14b–16b.</li>\n<li>XFFL, 124/1a–7a, 130/21a–22b.</li>\n<li>魁伦留用了刘清与严士鋐。XFFL, 126/18a–b; QSG, 11300.</li>\n<li>魁伦以更同情的口吻奏报：勒保也曾不时作战，击退逼近达州的叛军（因此他并非全然闲居）；勒保关于叛军总数减少的说法也不算错。魁伦还认为，勒保与福宁不大可能串通侵吞经费，尽管二人之间并无嫌隙。XFFL, 124/1a–6a.</li>\n<li>XFFL, 130/22a–23b.</li>\n<li>XFFL, 124/7b–12a, 126/12b.</li>\n<li>XFFL, 127/18a–25a.</li>\n<li>JQSYD, 5:74.</li>\n<li>XFFL, 130/21a–27a.</li>\n<li>他想让吴熊光主持河南的调查，松筠主持陕西的调查。XFFL, 129/28b–29a.</li>\n<li>XFFL, 130/26b–27a.</li>\n<li>遵皇帝之命，福宁于1800年初被捕。QSLJQ, 56/15b–18b.</li>\n<li>曹相业从他所发放的每百两中扣出三两七钱。魁伦、广兴，嘉庆五年正月初八日，GZDJQ, 4712; XFFL, 131/30a–34a.</li>\n<li>XFFL, 126/12b.</li>\n<li>XFFL, 22/36b, 22/42a, 79/31b.</li>\n<li>收礼者把这事告诉了《啸亭杂录》的作者昭梿；见该书258–59。</li>\n<li>XFFL, 131/35b–37b.</li>\n<li>XFFL, 131/28a–30b.</li>\n<li>魁伦到任后，额勒登保试图把四川战场在自己与魁伦之间划分：自己留川北，让魁伦对付川东叛军。九月底，额勒登保提议给魁伦配备两千多名士兵，并派春宁与百祥到魁伦处报到。十月初，额勒登保又指望魁伦在调查结束后参战。XFFL, 123/3b–7b, 126/2b–3a, 126/6a–b, 128/17a.</li>\n<li>XFFL, 122/23b–27a.</li>\n<li>额勒登保命春宁率领四百五十名金川土兵。XFFL, 130/30b–33a.</li>\n<li>XFFL, 130/11a–16b. 关于\"长骡\"的进一步讨论，见第7章。</li>\n<li>XFFL, 130/16b–19b, 133/32a–42b.</li>\n<li>XFFL, 130/16b–19b.</li>\n<li>XFFL, 133/20b–42b.</li>\n<li>XFFL, 133/42b–44a.</li>\n<li>XFFL, 112/12a–15a, 112/27b–30a.</li>\n<li>XFFL, 112/12a–15a.</li>\n<li>那彦成请求预支五年的工部尚书俸禄（每年360两）与他众多\"养廉银\"中的一份（每年600两），共计4,800两。鉴于他兼职众多，4,800两对他的家庭影响不大；而对台布来说，两年的养廉银是一笔可观的数目。XFFL, 131/10a–12a, 133/14b–20a.</li>\n<li>XFFL, 133/45b–46a.</li>\n<li>XFFL, 135/16a–17b.</li>\n<li>XFFL, 114/6a–11b, 128/19b–21a, 129/33b–34b.</li>\n<li>两省各一千名。XFFL, 111/32b–42a, 114/18a–20b. 但倭什布说，不必让明亮与额勒登保来湖北。XFFL, 114/6a–b, 115/16a–21a.</li>\n<li>嘉庆四年八月初九日，徐、李队伍攻占了没有城墙的归州城，但没有据守。XFFL, 121/23b–24a, 122/23b–25a.</li>\n<li>德楞泰获授世职\"骑都尉\"（qiduwei）。该股的另一位首领卜三聘后来被擒。XFFL, 115/1a–5b, 117/1a–3a; 《大宁县志》（Daning xianzhi）5/10b–11a。</li>\n<li>XFFL, 117/1a–4a, 118/1a–6b, 119/1a–5a, 121/19a–23a.</li>\n<li>唯一遭受一些破坏的城市是归州——它被徐、李队伍烧毁了一部分。倭什布没有奏报，但嘉庆从\"另一渠道\"得知。XFFL, 122/21b–22a, 129/33a, 129/34b.</li>\n<li>倭什布获授\"云骑尉\"（yunqiwei）世职，孙清元升为总兵。XFFL, 115/23a–b, 121/24b–30a, 124/9a–b.</li>\n<li>XFFL, 128/20a.</li>\n<li>XFFL, 112/25a–26b, 113/5a–6a, 113/16a–19a, 117/6a–7b, 125/16a–17a.</li>\n<li>XFFL, 116/29b–32b, 117/7b–9b.</li>\n<li>高均德、高成杰供词，BLJZL, 5:82–88.</li>\n<li>崔宗和与胡明远——都是张汉潮的追随者——另立了一股，但随后与戴家营合并。XFFL, 342/25a–b, 346/2b–4b.</li>\n<li>XFFL, 122/23b–25a.</li>\n<li>XFFL, 117/10b–12b.</li>\n<li>额勒登保又获汉军白旗都统之衔。XFFL, 120/29a–35a, 123/1a–3b, 123/6a–b.</li>\n<li>XFFL, 126/1a–5a, 126/21b–22a, 128/11a. 七十五参加过乾隆朝晚期的多次边疆战争，1796年加入白莲教战争，1798年升任四川提督。QSG, 11187–89.</li>\n<li>松筠说这话，是暗示他对德楞泰的其他品质不以为然。XFFL, 120/16a.</li>\n<li>奇怪的是，德楞泰奏报此战只有几名清兵负伤。BLJZL, 1:436–40. XFFL, 122/28b–33b, 124/14a–19b, 129/1a–11b.</li>\n<li>德楞泰声称他的部下在西乡杀死了张世虎，并俘获了襄阳的一名教门师父。XFFL, 131/22a–27a. 随后德楞泰把汉江南岸的一股叛军击退回四川，并追到广元。沿途一系列战斗中，德楞泰杀敌众多、俘获数百，包括东乡叛军首领傅月明。XFFL, 134/19a–25b. 然而，张世虎并未被杀；他1802年才被擒。德楞泰后来为谎报张世虎死讯道歉。XFFLXB, 11/30b–32a.</li>\n<li>XFFL, 129/8a–b, 134/23b–24a.</li>\n<li>额勒登保写这道奏折时还不知道明亮与永保被罢免，他计划让二人留陕守边。XFFL, 128/12b–19b.</li>\n<li>嘉庆曾命明亮、那彦成、魁伦、德楞泰与倭什布各自奏报本处战况，不必经由额勒登保。XFFL, 120/35a–36b.</li>\n<li>XFFL, 128/25a, 129/11b–12b.</li>\n<li>XFFL, 130/8b–9a, 132/27b–28a, 133/45b–48b.</li>\n<li>XFFL, 132/13a–18a, 136/15b.</li>\n<li>安禄1799年初护送军费入川后加入战役。他率数骑追击溃退的起事者时中伏被杀。XFFL, 132/18a–19a, 132/27b, 133/5b–7b; QSG, 11247–48.</li>\n<li>XFFL, 134/25b–31a.</li>\n<li>XFFL, 136/6b–7a.</li>\n<li>XFFL, 137/10b–17a; QSLJQ, 55/6b.</li>\n<li>那彦成在十月初六日的奏折中估计，张汉潮的残部只剩几百人。XFFL, 127/21b–22a.</li>\n<li>XFFL, 128/3b–8b, 129/14b–16b, 130/27b–30b.</li>\n<li>XFFL, 130/3a–8b.</li>\n<li>XFFL, 130/31a–32a, 131/7b–10a.</li>\n<li>XFFL, 130/31a–32a.</li>\n<li>XFFL, 131/10a–11a.</li>\n<li>XFFL, 133/9a–12b.</li>\n<li>XFFL, 135/18a–22b.</li>\n<li>XFFL, 137/1a–6b.</li>\n<li>XFFL, 129/15a–16a.</li>\n<li>XFFL, 131/22b, 132/5b–6a, 134/2b–3b.</li>\n<li>XFFL, 133/1a–9a, 135/26a–28a.</li>\n<li>XFFL, 132/16a, 133/17a, 135/24b–25a, 136/25a–26b.</li>\n</ol>", "text": "\n勒保自任统帅以来，一无布置。朕自愧知人不明，以之命为经略大臣。当引以为戒，以免再蹈覆辙。\n——嘉庆皇帝，1799年\n[译者按：原上谕自英文直译，文言原文待核，见注释（章首题辞，XFFL, 108/40a）。]\n\n结果，战役未能打破僵局。与父亲在位时一样，嘉庆结束战争的期限随着这一年的推进被一次次错过。\n清除和珅\n正月初三日——新年后两天——乾隆颁下他一生中最后一道上谕，再次表达他渴望看到镇压叛乱之役的最后胜利，同时以\"大军数日内即可奏凯\"的想法安慰自己。^1 他于当天晚些时候驾崩。乾隆之死解除了儿子嘉庆的束缚——他立即亲揽大政，得以施行自己的政策。然而，要确立自己作为新君、从而成为镇压战争中最高权威的地位，嘉庆首先必须面对和珅——和珅从未对嘉庆表示应有的尊敬，许多高级官员对和珅的敬畏更甚于对年轻皇帝的敬畏，以至于一位总督在乾隆驾崩后竟把唁慰送给了和珅，而不是嘉庆。^2 在前线，卷入战争管理事务的许多人也都把和珅当作靠山与保护人。\n乾隆驾崩当天，嘉庆忙于繁重的丧仪。在他所颁的众多谕旨中，他只能简短地告诫前线全体将领：顾念乾隆皇帝的恩宠、信任与训示，振作精神，迅速剿灭叛军。^3 然而，次日，嘉庆向勒保、惠龄、恒瑞、富成、宜绵、景安、秦承恩、倭什布（景安的河南巡抚继任者）、额勒登保、明亮与德楞泰颁发了一道措辞严厉的上谕——这可以说是他能够自由表达自己意见与感受的第一份文件。^4 嘉庆倾泻积压已久的愤怒与沮丧，痛斥文武官员把战役变成了升官发财的阶梯，侵吞军费，以谎报胜仗欺骗朝廷，讳败为胜。他斩钉截铁、毫不宽宥地指出，\"无耻\"\"自私\"的将领们故意拖延战役的结束，其原因是谋利。嘉庆还指责京中那些寻求机会奔赴前线的官员胥吏借战役谋利。他说，那些回来的人无不立刻发了财——哪怕是原先家资微薄之人——而且常常请假回乡置产。接着，嘉庆责备父亲乾隆晚年对将领们过于宽纵：小有战功便常常给赏，失职却只给轻微的或象征性的处分——连这点轻处分也很快撤销。嘉庆愤怒地指出，许多将领罪责相当、甚至更重，却只有永保一人被交付审讯，而且很快获释出狱。嘉庆设定了新的期限——当年春天——责令众将结束战役。他警告说，在赏罚上他会比父亲更严格，并立誓对不能如期完成任务的将领施以严惩。\n次日，嘉庆在批复宜绵的一道奏折时继续抨击众将。他批评他们不亲自督战，而是坐在远离战场的大营里享宴作乐，只派低级军官去打仗，然后让幕僚们每隔几天根据那些军官的呈报拼凑奏折。他指责他们不关心部队，致使下属侵吞空额兵饷，造成兵员短缺、国帑虚耗。他还质疑雇用如此众多乡勇的做法，称之为又一个黑洞。^5 显然，嘉庆对战役中种种弊端与滥行的了解比父亲更透彻——很可能他另有官场文书之外的耳目。这些谕旨异乎寻常的严厉语气，预示了嘉庆的雷霆之举。\n乾隆驾崩五天后，正月初八日，嘉庆罢免和珅一切职务并将其逮捕。户部侍郎、和珅的左右手福长安也被罢免逮捕。和珅被指控的二十大\"罪状\"中，大多数涉及违制逾礼、对乾隆皇帝不敬，以及贪婪敛取、占有钱财珍宝——包括某些只有皇室方可拥有的珠玉奢侈品。^6 然而，嘉庆所强调的最重之\"罪\"，是和珅阻碍了镇压战役——他拖延向朝廷呈递前线奏报，应对战役的迟缓与不力负责。嘉庆一再重申这一点。其中一段话是这样说的：\n\n邪匪滋事三年，尚未剿净。推原其故，实因和珅压抑军报，专擅用事，致误军务。各路军营不敢据实奏闻，观望迁延，故拖延至今，久未蒇事。^7\n[译者按：原上谕自英文直译，文言原文待核，见注释7。]\n\n所发生的情形是：奏折若带来坏消息——败仗、重伤亡——将领们就会附一封信给和珅，求他不要把奏折呈上，或者延迟呈递。^8 这不是白干的；将领们必须为这恩惠付钱。乾隆对这些勾当一无所知，极为看重和珅处理军报的表现，以致在勒保擒获王三槐之后赏了和珅一个公爵。用乾隆自己的话说，和珅\"参赞机宜，撰拟谕旨，一手经理，夙夜宣勤\"（原文待核，见注释9）。^9 而在分享前线信息方面显然被和珅忽视的嘉庆，把这定为这位领班军机大臣最大的\"罪状\"。^10\n和珅的贪得无厌与巨额家产——尽管被大大夸张了——助长了人们的一种普遍看法：嘉庆除掉他是为了他的贪腐。^11 然而，嘉庆明确表示这不是他的重点：\"朕之所以严惩和珅，实因其贻误军机之罪，而其种种贪赃自利之罪，尚属小事。\"（原文待核，见注释12）^12 为强调嘉庆的这番话，在对和珅的一长串指控中，没有一处明里暗里责备他导致战役经费过滥。尽管和珅私下贪婪，对礼物贿赂来者不拒，他在公开场合却始终维持着一副严厉、守法的重臣形象，即使对待自己的门生也不例外。他主持过几次财政整顿，查办过几桩著名的贪腐案。作为《军需则例》的主要编纂者之一，和珅在则例颁布后力图执行它，这常常使他与将领们发生冲突。^13 德楞泰在白莲教战役中提出的许多请款要求，和珅逐一驳回——因为它们不见于《军需则例》——并裁定德楞泰退缴多领之款。^14 被捕三周前，和珅还驳回了河南的一项请求：将近八万五千两银子，用于支付五万六千多名乡勇的饷银。他的理由是，没有证据表明所有这些乡勇服役时间相同，也没有证据表明他们按所报时间领过饷。^15 诚然，和珅的两面性使人难以估量他对战役财政的影响。一方面，他可能乐于收受官员与将领的贿赂，有时还为他们提供庇护。^16 另一方面，勒保等人在和珅被清除后抱怨和珅不近人情，对军费开支与升迁举荐都过于严苛，不容违反规则。嘉庆赞同勒保对和珅的抱怨，向勒保保证，他的政府会根据需要给战役更多财政支持。^17\n为把奸臣定为镇压战役陷入僵局的罪魁，嘉庆把和珅比作康熙皇帝幼年时的摄政鳌拜、雍正皇帝长期的亲信年羹尧，以及乾隆皇帝的第一位领班军机大臣讷亲，指出三人都身居与和珅相似的位置。三者之中，嘉庆认为和珅的案子最像讷亲，尽管他断言和珅的罪行比三人加在一起还重。讷亲深得乾隆信任，在第一次金川之役中奉命赴前线监军而身败名裂。他未能如乾隆所望迅速结束战争，又没有如实奏报前线局势，被命押解金川，在军前自尽。为让他自尽，乾隆特地送去一把其祖父遏必隆留下的匕首。^18 把和珅比作讷亲，嘉庆试图为自己清除和珅辩护：这是父亲开创的传统所认可的——凡是阻碍战役走向胜利的人，谁也不能得到宽恕。然而，在刑罚上，嘉庆退了回去。他说理道：爵位与皇室姻亲应当予以考虑，于是判和珅自缢——这比朝臣们提议的凌迟已是从轻。嘉庆还把朝臣们对福长安提议的斩立决减为斩监候。^19\n然而，嘉庆除掉和珅的动机还有另一条线索，只是他不愿公开。鉴于和珅在嘉庆即位前后都对他不敬，清除和珅更像康熙清除鳌拜。事实上，清朝大多数君主都表现出摆脱先朝跋扈权臣的倾向——或罢其官职，或公开使其身败名裂。^20 可以理解，这种心思需要隐藏。对嘉庆而言，让和珅充当战役受阻的替罪羊是方便的。正如前几章所揭示的，对僵局更应负责的其实是前线的将领们。此外，鉴于京城与前线之间的距离（普通邮驿在京城与战场诸省之间要走一两周），中枢政府处理军报的速度对战役结果影响甚微。和珅在战争中的主要作用，除为乾隆出谋划策、起草谕旨外，或许在于影响乾隆对统帅及前线其他关键职位的任命。或许意识到自己指控的站不住脚，嘉庆想尽快结案，宣布清除仅限于和珅与福长安二人。^21\n嘉庆信守了诺言。他没有清除或惩处中枢官僚体系中许多和珅的门生。^22 不过，他改组了内阁与军机处，把信任的人安插进去。他行动迅速，却一丝不苟。总的来说，嘉庆表现出倚重曾受和珅压制之人的倾向，例如阿桂的同僚。嘉庆任命蒙古旗人松筠执掌户部——户部已被和珅、福长安把持多年。松筠曾入军机处，但1794年自请出任驻藏大臣，以与和珅保持距离。^23 吏部尚书一职，嘉庆先任书麟——另一位阿桂同僚、和珅的政敌——随后又任命以反腐斗士闻名、时任闽浙总督的魁伦。^24 嘉庆让他的两个兄弟永瑆与永璇入值军机处并掌管几个重要部院，尽管时间不长。^25 他把老师朱珪从南方召回京城，任其首席顾问，并起复了那些或请假或外任的军机大臣，如庆桂与王杰。^26 嘉庆清除和珅，发出了一个强烈的信号：他可能整顿权贵门生把持的朝政，使它更能吸纳正直而有远见的官员的意见。然而，嘉庆并不想中止乾隆依赖一位领班军机大臣的做法；他试图扶植阿桂之孙、军机处的年轻成员那彦成，填补和珅留下的空缺。那彦成的火箭式擢升是和珅倒台后中枢政府最引人注目的特点，本章稍后将详述。\n对川陕针对起事者仍在进行的战争，嘉庆似乎手腕强硬；他立即着手整顿战争领导层。和珅被捕当天，在批复勒保\"已摧毁冷天禄堡寨、冷天禄脱逃\"的奏折时，嘉庆毫不留情地斥责勒保：\"勒保督办军务将近两年，从不肯实力奋勉，迅速擒拿贼首。其意不过使军务迁延，以便不断请领军费。所恃者，和珅之庇护回护，故敢因循玩延。\"（原文待核，见注释27）^27 嘉庆告知勒保和珅已被革职逮捕，同时提醒他先帝乾隆对他的信任与恩宠，敦促他悔过自新，加倍努力，迅速结束战役。他特别警告——以处分相威胁——不许再每隔数日上一道毫无建树的奏报来拖延时日。^28\n嘉庆似乎相信，和珅的倒台向将领们发出了一个清晰而强烈的信号：新君即便对最高级的人物也下得了狠手，因此他们不会等闲视之那个当年春天结束战役的期限。与此同时，面对与困扰乾隆相同的宿将匮乏问题，嘉庆决定保留勒保的战役统帅之位。痛斥勒保的次日，嘉庆宣布了这一决定，举出勒保在苗疆战役的贡献与擒获王三槐之功。^29 十天之后，嘉庆更进一步：授予勒保\"经略大臣\"（jinglüe dachen）之衔——这是为统帅一方的钦差大臣所保留的最高临时职衔。同时，嘉庆任命明亮与额勒登保为副统帅，授予他们\"参赞大臣\"（canzan dachen）之衔——尽管他十分清楚明亮对张汉潮作战的拖沓。^30 他的理由是：勒保的新头衔将使他对各战场所有将领拥有更高的权威，从而改善他们之间的协调。他期望这份恩宠能激励勒保更加卖力。嘉庆援引以往成功的经略大臣——第一次金川之役的傅恒、镇压贵州苗乱的鄂尔泰（事实上，经略大臣是张广泗，不是鄂尔泰）——敦促勒保以他们为榜样，并为他父亲在第二次金川之役中不光彩的惨败赎罪。为赢得勒保的忠心，他格外加恩：派永保——上年秋天刚被乾隆释放出狱——把经略大臣印信送交勒保。永保还奉命加入勒保的幕府，协助指挥战争——这正是勒保擒获王三槐后所请求、而被乾隆拒绝的。^31\n亲政数周之内，嘉庆就显露了性格中反复无常的一面——他常常对自己的判断没有把握，倾向于否定自己早先的决定。年长嘉庆二十岁、年近六十的勒保，必定把嘉庆对他的自相矛盾的处置——先痛斥，接着留用、乃至升擢——解读为新君缺乏经验、拿不定主意的表现。回应皇帝的批评与更高的封授，勒保上了一道深思熟虑的长篇奏折，激烈地为自己的战争指挥方式辩护，并对皇帝春天结束战争的期限提出异议。他再次罗列叛军的优势与清军的劣势，抱怨清军兵力不足，因为叛军股团不断分裂成更多股团（他声称四川有十至二十股之多），从而为自己不遵期限制造理由。一如既往，他声称自己一次只能专注一股；以他有限的兵力，不可能与所有股团作战。^32\n回应皇帝对开支过滥的批评，勒保不仅否认自己或任何将领浪费、侵吞过军费，还反戈一击，抱怨和珅主持下的户部对军费开支过于僵硬，有些规则不切实际。他极力为自己的财务清白辩护：\"臣虽至愚，断不肯为此糜费之罪，致累身家。\"（原文待核，见注释33）^33 这种大胆的立场或许有两个目的：挡开皇帝的批评，并使自己免于卷入和珅案。在断然拒绝皇帝的批评时，勒保似乎很有把握：皇帝没有办法惩处战役中所有的将领与督抚（他们几乎人人都犯过这样那样的错）。尽管嘉庆不相信勒保的话——众所周知，将领们在前线以军费宴饮享乐，嘉庆在回应勒保的自辩时也指出了这一点——他并没有硬起心肠，因为他已经确认了勒保的战役领导地位。相反，他转而诉诸对勒保及其同伙的道德规劝，敦促勒保听从自己的良心（liangxin），不要因为未能实现乾隆临终前迅速结束战役的遗愿，而使嘉庆成为不孝之子。^34\n嘉庆的心理战\n去世之前，乾隆曾一再重申：投降的叛军与被裹挟的平民不应被杀，甚至许诺奖赏那些在战场上倒戈或协助擒拿首领的人。他还明确表示，不愿迫害所有教门中人，因为许多人并没有参加起事。在四川，他曾警告当局不要搜捕所有啯噜匪徒与私盐贩子，免得把他们逼入叛军。^35 然而，这些指示并未被认真执行。有些官员确实试图区分被裹挟的平民与真正的叛军，从而拯救了数千人的性命，^36 但大多数将领不分青红皂白地冷酷屠杀俘虏，其影响压过了有限的招抚行动。^37 另一个障碍是：一些叛军的房屋与土地已被邻居或地方官府侵占；后者往往把它们卖掉，将所得中饱私囊。^38 结果，叛军很少投降——要么怕被杀，要么无家可归。\n1798年底在北京受审时，王三槐声称，他与许多人之叛乱，是因为地方官搜捕教众使他们别无出路。他本人就是父母与妻子被地方官府关押之后才被逼起事的。王三槐没有提起到处煽动起事的湖北教门信使，把自己描绘成一个受害者。然而，根据现存的审讯记录，他并没有说出\"官逼民反\"（guanbiminfan）这句口头禅。乾隆与嘉庆两位皇帝听取王三槐审讯汇报时，乾隆对王三槐的说法产生了兴趣：徐天德、罗其清与冉文俦也怀有投降之意，只是清朝官员置之不理。乾隆随即命勒保查办，并明确表示：只要他们真心投降，他就接受，并给他们一条活路——因为这比与之作战划算。^39\n但嘉庆从王三槐的供词中看到了不同的价值。正月二十日给勒保的谕旨中，嘉庆把\"官逼民反\"一词放到了起事者的口中，声称他们中许多人把地方官的勒索当作加入起事的理由。他特别说，因为王三槐在描述自己决定起事的原因时使用了这个词，他一直犹豫是否处死王三槐。^40 铸就了叛乱根源的这一说法之后，嘉庆为大多数叛军开脱，宣布他们是\"赤子\"（chizi）——忠于皇帝的无辜之民——只是走投无路才加入叛乱。更重要的是，嘉庆把地方官盘剥百姓的行为归咎于和珅：地方官正是为了满足和珅无穷的贪欲，才压榨普通百姓，然后把钱送给和珅。如今奸臣已除，皇帝准备对所有被迫或受诱加入叛乱的人普施大赦，给所有人悔过自新、重新开始生活的机会——用皇帝的话说，就是\"咸与维新\"（xianyuweixin）。^41\n嘉庆认为招抚是瓦解叛乱的关键之一，对之倾注了极大的关注。他把自己的新策略概括为\"剿抚兼施\"（jiaofu jianshi，或称\"剿抚并用\"，jiaofu bingyong），在1799年头几个月发动了一场心理战。在众多谕旨中，他阐明了这种胡萝卜加大棒的策略，号召部队停止滥杀俘虏，并充分表达自己对普通百姓的同情——他们或在战斗中充当叛军的人盾而死，或成为他的部队事后滥杀的牺牲品。为使那些被裹挟的平民知晓他的新政策，嘉庆指示广为宣示。^42 刑部侍郎汪承霈建议：除其他事项外，严惩那些继续屠杀投降叛军的将领。嘉庆采纳了这一建议。^43 嘉庆清楚地知道，安置流离失所的平民将是新政策的关键部分，于是寻求有效的实施办法。然而，这是一项昂贵而复杂的工程，既需要经费，也需要人手。中枢政府审议了几项方案，但对应如何、能如何安置流民，没有得出定论。^44\n抚慰普通百姓是嘉庆心理战的一翼，另一翼则是惩办几个对起事负有责任的\"恶\"官。在湖北，武昌府同知常丹葵被指定为一个恶官。弹劾者御史谷际岐在和珅被清除后不久，对常丹葵提出了耸人听闻的指控。谷际岐指斥常丹葵1796年被派往宜都查办教众后，勒索聂杰人及数百人的钱财。常丹葵只释放付了钱的人，而拷打、杀害了数百人——有些人的头被钉在墙上，有些人被成批锤杀。常丹葵还把许多人押往武昌审讯，数百人挤在一条船上，许多人饥寒而死，尸体漂浮在长江上。谷际岐附和皇帝的论调，声称常丹葵是宜都起事的罪魁，而起事者即便反了，对皇帝也没有恶感。^45 谷际岐绘声绘色的指控令嘉庆震惊，他命将常丹葵解京审讯。^46 至于四川，嘉庆责成勒保查办达州前知州戴如煌——他听说戴如煌是个恶官。^47\n然而，随后的调查未能把二人定为恶官之尤。常丹葵在刑部受审，面对刑讯，几乎否认了全部指控。常丹葵虽然1794年参加过襄阳查办教众，1796年却从未踏足宜都。^48 聂杰人在北京受审时，也没有提及自己在决定起事之前受过地方官的任何压力。谷际岐的情报得自前线之人，显然把未经证实的流言当成了事实。戴如煌的案子也有问题。年过七旬、因中风而半身不遂的戴如煌，已不能亲理政务，而由属员胥役打理衙门。据说他手下的胥役队伍庞大，总数超过四千人，分四班轮值。1797年初宜绵入川时，因戴如煌不能任事而将其罢免，遣送回重庆家中。^49 那些众多的胥役很可能曾假借戴如煌之名勒索百姓，但要把起事之责钉在衰朽的戴如煌身上，谈何容易。达州被俘的十几名叛军中，除王三槐等少数人外，无人在受审时提及地方衙门的勒索或其他恶行。^50 然而，嘉庆执意坚持自己\"恶官致乱\"的理论，催促刑部与勒保继续调查，寻找更多、更确凿的证据。20世纪，一些史家津津乐道地引用这两位官员的所谓暴行，作为清朝剥削压迫的完美例证。^51\n向旧班底开刀\n京内外许多密切关注叛乱进程的官僚，更愿意把手指指向未能迅速平乱的将领，而不是据说对叛乱爆发负有责任的地方官。响应嘉庆征求意见、批评国政的号召，一些人选择站出来说话。1797年曾公开批评前线将领的年轻御史宋澍——当时已任陕甘学政，得以近距离观察战役——再次发声。他指责陕西的将领与省级官员常常谎报军情，尤其讳败为胜、向后勒官员索贿、故意勒兵不进、不彻底消灭敌人。^52 对军队低劣表现的又一尖锐批评来自谷际岐。谷际岐向朝廷奏报了几首流传于战区的讽刺民谣：\"贼来不见官兵面，贼去官兵才出现。何时才得见官兵与贼相见面？\"\"贼来无官兵，贼去官兵出。\"（原文待核，见注释53）^53 还有人批评军队只擒叛军首领、不顾普通叛众的倾向——这使叛军得以迅速重组。^54\n嘉庆接受了这些批评，对其中暴露的两个问题尤为恼火：军情奏报的不实，以及乾隆犒赏军队的方式。他不断斥责将领们讳败为胜、谎报战功，责令他们悔过，只讲真话。与此同时，嘉庆意识到，父亲只在擒获叛军首领时才大加赏赐的做法，可能使部队不愿全歼叛军股团——尽管他也怀疑那些被擒的\"首领\"是否真是首领。因此，他敦促将领们全歼整个股团，而不是只取首领首级。^55\n为平息\"朝廷对将领过于宽纵\"的强烈批评，嘉庆需要惩办领导层中的几个人。谷际岐再次点名宜绵、惠龄、秦承恩与景安（毕沅与汪新已去世），认为他们对未能按时结束战役负有最大责任。^56 嘉庆赞同谷际岐，在1799年头几个月采取了一系列处分。他先罢免了宜绵，指责宜绵作战时总是待在安全的地方——尽管宜绵1798年初返回陕西后已不再参与军事行动。嘉庆任命仍从拉萨赴京途中的松筠为新任陕甘总督。^57\n随后嘉庆转向惠龄。惠龄被免去统帅之职后一直留在四川。嘉庆称他是所有领导人中\"最懈弛\"的一个，初夏惠龄母亲去世时让他回家守制，但没有进一步惩处他——因为惠龄参加过几场擒获多名叛军首领的战斗。^58 接着，秦承恩母亲去世时，嘉庆免去了他的陕西巡抚之职。不久，有人奏报1798年初西安城受叛军威胁时，秦承恩拒纳难民入城，导致许多难民溺死；秦承恩随即被正式革职，解京受审。^59 秦承恩留下的位置，嘉庆任命了刚刚复职、被派往四川加入勒保的永保——不是别人。嘉庆还从伊犁召回永保的两个儿子，都授了侍卫之衔。作为陕西的新巡抚，永保将与他宿怨已久的明亮面对面打交道。^60\n在四川战场，嘉庆瞄准了成都将军富成。乾隆虽然曾高度评价富成，称赞他是\"最勇\"的将领，富成1798年春就任以来却没有打过一场真正的仗。^61 1799年春，他追击从四川窜入甘肃的一股襄阳起事者时，其七千名士兵与乡勇远远落在敌人后面，沿途还严重骚扰当地居民。嘉庆罢免了富成，下令对他查办。勒保起初保护富成，后来改变了立场——因为富成受责后并无改观，更重要的是，嘉庆决心拿富成做儆戒。尽管考虑过死刑，嘉庆顾及处决富成有损军队声誉，只把富成降为兵丁，让他在前线戴罪立功。^62\n最严厉的申斥落在了景安头上。景安是战役领导人中的异数：不贪钱财，却把职责看得重。此外，他批评同侪直言不讳——1796年永保垮台，他起了关键作用。然而，景安的父亲是和珅的远房侄子，这一点如今使他变得易受攻击。嘉庆三番五次地痛斥景安，骂他怯懦，指责他总是避敌、不讲真话，等等。^63 三月，嘉庆罢免景安，派他去四川主持战争后勤——因为皇帝承认景安在财务上是清白的。^64 然而，不久嘉庆又听到了更多对景安的指控：张汉潮窜扰湖北期间，景安为避敌而频频移营，他的士兵每天都要穿坏一双鞋；他还无理地惩处了军官广福——因为广福批评景安频繁移营。结果，嘉庆免去了景安的后勤之职，下令查办。尽管旷日持久的调查未能取得证实指控的过硬证据，嘉庆还是（按勒保的建议）褫夺了景安的伯爵爵位，把他流放伊犁。^65 据说，嘉庆曾向朱珪坦言：他需要惩办一个高级人物来震动令人失望的战役，于是选中了景安。^66\n勒保的去职\n挺过了新皇帝第一波的斥责，又手握更高的头衔，勒保本该感到安稳。遵照嘉庆\"不要只追一股叛军，而要坐镇中央、统筹川陕两战场\"的指示，他于1799年二月下旬移驻达州白塔坝，把作战留给额勒登保、德楞泰等按他的命令新近会聚川东的将领。^67 坐镇新大营的勒保，一方面专注于应付朝廷，另一方面继续与将领和地方官们联络感情。他热情称赞额勒登保与德楞泰，替他们挡开批评——更多是为德楞泰。^68 他抱怨和珅常常砍掉前线领导人举荐的升迁名单，请求允许他继续举荐文武官员。^69 一接到皇帝的答复，勒保立即为刘清请升——刘清在擒获王三槐时起了关键作用，尽管勒保没有提这一点。^70 与此同时，勒保努力维持自己严厉主帅的形象。他公开批评明亮，尤其在水保入陕与明亮发生冲突之后（下文将述）。^71 他随意惩处下级军官，往往不先奏报朝廷：摘其顶戴、降其官职，或处以鞭笞、枷号等体罚。^72 起初相信勒保能有所作为的嘉庆，把批评战役、献计献策的奏折都转发给勒保。嘉庆把许多建议斥为\"空谈\"\"无益\"，放手让勒保自行采纳或置之不理。^73\n1799年初，襄阳的两支队伍——张世龙、张世虎兄弟率领的蓝号与杨开甲等人率领的白号——合计一万余人，从四川突入甘肃，把甘肃第二次拖入冲突。尽管甘肃已向湖北、四川派了两万五千至两万六千名士兵，按察使广厚与年近七旬的总兵吉兰泰率领的剩余兵力，在早春两次击退了起事者。后来，一些起事者北窜秦州与平凉，甘肃军队挫败了他们对巩昌城的进攻，把他们逐向陕西陇州。^74 初夏，襄阳两支队伍又回到甘肃与四川接壤的南境。为援助吃紧的甘肃军队，恒瑞被派往甘肃；近五百名撒拉族士兵也被动员起来。^75 到六月下旬，两支队伍都经略阳被赶回川北，尽管他们仍在边境两边穿梭。^76\n在川东，徐天德的黑号1799年初游荡于梁山与垫江。它与冷天禄短暂会合，随后徐天德前往达州，冷天禄前往邻水。^77 三月初，额勒登保病愈复出。他先消灭了两个叛军股团——据说各有数千人——随后在战斗中杀死冷天禄，接着又在广安消灭了冷天禄麾下的数千人，其中包括从徐天德那里要来的一千名战兵。额勒登保的胜利令嘉庆欢欣鼓舞，大加赞赏，称他是\"诚实出力之大将\"，除赏全军一个月饷银外——这已有很久没有过了——还授了他男爵爵位。^78\n然而，冷天禄覆灭之后，四川数月没有取得突破。额勒登保先对付达州以南的一些小股叛军，随后前往北境拦截从甘肃、陕西返回的叛军；德楞泰则追击徐天德到夔州，再到太平。^79 作为统帅，勒保没有向他们施加任何加快进度的压力。一如既往，勒保定期上奏，向朝廷简报战况，试图造成部队正在苦战的印象，只是叛军太顽强、人数太多。他还质疑皇帝的作战方略与战术，尤其挑战嘉庆的新招抚政策——勒保宣称，他一向主张杀尽起事者，而不是给投降者一条生路。^80\n重新确认勒保战役领导地位后还不到一个月，嘉庆就开始抱怨勒保的懒惰与拖延：\n\n勒保自贵州来川剿办邪匪，已一年有余，不可谓为时不久。从前身为统帅，近又授为经略大臣，并非未授以事权。而其奏折不过铺叙战事，从未立有全局方略。偶有条陈，亦无非贼匪行踪、如何追击——事事跟在贼后，从未居高统筹，立有制胜之策。^81\n[译者按：原上谕自英文直译，文言原文待核，见注释81。]\n\n夏天到来，嘉庆设定的第一个期限已过，他陷入了悲观，担心战役秋天之前结束不了——因为叛军可能躲进山里避暑。^82 但勒保的保证安慰了他：胜利已近，除已在途中的两千名云南兵外，无需再派援军。鉴于这是勒保入川以来第一次谈到战争结束，而且他没有抱怨兵力不足，皇帝认真对待了勒保的话。他说自己正数着日子等捷报，拒绝了蒙古王公参战的提议，暂停了为筹款而开的捐纳，还谢绝了江苏盐商的捐款。^83\n然而，整个夏天，四川几乎没有发生战斗。额勒登保没有取得新胜利；德楞泰追着徐天德到太平后也停了下来——尽管嘉庆不悦。^84 表面平静之下，一些起事者——尤其是冉文俦的残部——正在重新集结。从初夏起，勒保乐观的腔调变为日益犹豫悲观。他不再作承诺，更多谈论障碍。在希望与绝望之间摇摆的嘉庆，除了口头斥责勒保，只能多给兵。^85 与战役早期不同，一些将领不再渴望增援，因为在当地雇乡勇等手段更有利。事实上，军队太庞大反而可能是个累赘；勒保一直是北京官员圈流传的战争谣言中的谈资——因为四川的兵比别的战场都多，却没有突破。^86 因此，勒保起初谢绝了增援，还把健锐营与火器营的旗兵送回北京。^87 然而，仲夏嘉庆再次问他是否需要增援时，勒保选择了闪烁其词、暗藏机锋。他虽然抱怨战役中七八万清军严重不足，认为还需要一两万人，却没有开口要——因为他知道，一旦要了兵，他就没有借口不结束战争了。相反，他论证不该增兵：没有好将领可带，新兵不顶用，而且费钱；同时暗示，即使有了援军，一两个月内也赢不了。然而，他不求增援，反而给了嘉庆一线渺茫的希望。嘉庆同意把期限延到夏末，并可能再宽限几个月以肃清叛军余部。^88\n夏末，两件事促使皇帝对勒保采取行动。其一，四川的后勤大员福宁上了两道奏折，披露四川的军事行动与战争财政，令朝廷震惊。福宁开列了二十来个叛军首领的名字——其中许多是新名字——报告说更多的叛军股团正在出现，每股从一千人到一万多人不等，而且比以往更凶悍：劫掠集市，攻打平民堡寨，裹挟百姓。更耸人听闻的是，福宁披露：勒保在十六个月里向他索取了二百零五万两白银，德楞泰在十一个月里索取了五十三万五千两。福宁解释说自己早先没有奏报勒保，是因为勒保身为统帅，可能需要手头有资源以备不虞；而他无法抗拒将领们的要求，因为若不满足他们，他们就会以贻误军机为名追究他的责任。福宁称赞额勒登保是唯一在财务上通情达理的将领，从不抱怨，但说额勒登保在不到一年里也向他索取了二十七万二千两。^89 这些都是骇人的数目，与军队的规模完全不成比例。\n显然，勒保没能和每一个人都交上朋友。更重要的是，福宁自己也不干净，当他察觉到新皇帝打击前线腐败的决心时，急于寻找替罪羊。福宁的披露令嘉庆惊怒交加，他推测：勒保一再拒绝增援，是出于延长战争的欲望，好继续占据统帅之位，从而吞掉更多钱。嘉庆把福宁奏折的抄本转发给勒保，命他明确回奏自己能否指挥这场战争——这无异于最后通牒。^90 至于战争财政，皇帝正等着广兴的查报——广兴是他派往四川的御史。广兴是书麟的同父异母弟，才三十八九岁，已在监察系统供职数年。和珅被捕时，他是第一个揭发其劣迹的人。他的正式任务是护送二百五十万两军费入川——这是嘉庆亲政后拨给四川的第一笔经费——但他还有另一项使命：短期考察福宁的工作。^91 因此，嘉庆既没有表示惊讶，也没有发怒，只是告诉福宁：三位将领索取的经费数额不同，是因为他们兵力规模不同；他认为其中不可能有欺诈。但他称赞了福宁的揭露，鼓励他不要害怕，继续奏报勒保的情况。^92\n数日之后，朝廷再次震惊：倭什布奏报，徐天德与李述（李述可能初夏在大宁与徐天德会合）率领的一万多名叛军突入湖北，威胁竹溪县城，而德楞泰没有追击他们。湖北虽然挫败了叛军在西北边境的多次渗透企图，这一次徐、李队伍猛攻关卡数日之后，它失败了。享受了不久太平的湖北，重新进入戒备与动员状态。嘉庆一面允许倭什布招募新兵、多雇乡勇，一面命三千名山西兵开赴湖北，并按新任河南巡抚吴熊光的请求，派一千六百名直隶兵前往河南。^93 然而，嘉庆最恼火的，是没有从勒保那里听到关于这一紧急事态的任何消息。\n倭什布关于徐、李队伍侵入湖北的令人不安的奏报到达朝廷一天后，勒保的三道奏折到了。一如既往，勒保对各战场的战况作了一番乏味的叙述，却只字不提湖北的紧急事态，声称湖北防御稳固，起事者不敢前往，还说德楞泰已把徐天德赶进大宁的深山老林。勒保以轻松的心情奏报：他正从白塔坝大营前往达州，接收新到的二百五十万两军费。对福宁关于开支严重过滥的批评，勒保激烈反击。他辩称所有开支都是必要的，且都清楚入账。他补充说，额勒登保其实从他那里领过钱，他不是只为自己索取了巨额经费。勒保承认德楞泰对徐天德作战迟缓，但为他辩护说，德楞泰是比明亮更好的将领，财务上也没有问题；鉴于良将匮乏，他恳求让德楞泰留任。勒保还指责福宁因与德楞泰不和而诬陷德楞泰。^94\n勒保咄咄逼人的自辩令嘉庆不快，他讥讽勒保急于奔往达州接钱，却对湖北的紧急事态一无所知。骂勒保\"梦呓\"\"无耻\"，嘉庆再也按捺不住对勒保的怒火，以及对自己信任此人的懊悔：\n\n勒保已沦为书办，安坐军需局中，只处理各路禀报。如此岂堪为经略大臣？他还说自己对各将领的功过留心体察，凡事以国事为先。朕不能信此等语。勒保自任统帅以来，一无布置。朕自愧知人不明，以之命为经略大臣。当引以为戒，以免再蹈覆辙。^95\n[译者按：原上谕自英文直译，文言原文待核，见注释95。]\n\n不再相信勒保\"无需增援\"的说法，嘉庆从盛京调两千名旗兵入川——这是第三次从北方调派旗兵。如果将领们能迅速结束冲突，他还愿意支付后勤规则所不认可的支出。^96 然而，他并没有罢免勒保，因为在他写下上述对勒保的严厉批评的次日，一条好消息到了：朱射斗几乎全歼了重庆以北的一股叛军，杀死了其首领包正洪。勒保公然把这场胜利记在自己账上，还奏报说他已号召被裹挟者脱离叛军——这也平息了皇帝的怒火，因为它表明勒保如今愿意使用招抚手段，一改他此前强调杀尽叛军的立场。^97\n但勒保的垮台只推迟了十天。七月十七日，倭什布奏报徐天德两万多人的队伍正向襄阳移动，嘉庆闻报震惊，罢免了勒保的经略大臣与四川总督之职，任命明亮为新统帅——授他经略大臣之衔与满洲红旗副都统之职。嘉庆再次痛斥勒保失职，甚至提到：如果湖北局势继续恶化，有可能将勒保军前正法。然而，嘉庆对明亮也不热心，为自己的决定辩护的理由是可堪任用的将领稀缺。与此同时，他任命新任吏部尚书魁伦为四川总督——魁伦扭转战役局面的决心给皇帝留下了深刻印象。^98\n嘉庆宣布罢免勒保两天后，勒保的五道奏折到达朝廷。在这些奏折中，勒保在一切战线上为自己激烈辩护——从不请增援的决定，到巨额开支。他反驳福宁\"叛军增多\"的指控，论证说起事者的总数减少了，只是股团数目增多了，每股的人数少了。他重申自己在开支上没有做任何不当之事，他索取的经费与其他将领分享了。为变守为攻，勒保请求朝廷派人入川，填补景安被解京查办后留下的空缺。最令人吃惊的是，勒保请求再拨五百万两军费——尽管他数周前刚收到二百五十万两。他论证说，新到的经费已用于偿债，他需要三百万两支付军费，二百万两用于地方抚恤与支付守卫四川各堡寨的乡勇。最后，他又呈上了一份战场省份军职空缺的任命名单，请予批准。^99\n勒保顽固的回应进一步激怒了嘉庆，他颁发了一道措辞严厉的长谕，驳回了勒保的全部辩驳，指责他\"无耻之极\"\"纯属梦呓\"。最令嘉庆惊骇的是，勒保对湖北的紧急事态只字不提，反倒为自己的御敌于鄂境之外的安排辩护。同样令嘉庆恼怒的是勒保再要五百万两的请求；他认为勒保是在用地方抚恤作新借口，掩盖自己挪用军费。^100 直到七月二十四日接到罢免谕旨，勒保才降低了言辞的火药味。但他仍坚称：接到倭什布关于紧急事态的信后，他立即派德楞泰前往湖北——尽管他可能直到写奏折前几天才这样做。^101 勒保对湖北局势并不太担心，说援军全部到达后湖北应当兵力充足，而起事者惯常在川鄂之间穿梭。他再次为自己\"逐股剿办\"的战术辩护。^102\n与其他将领、或他之前的历任统帅不同，勒保与朝廷打交道的方式异乎寻常地强硬，公开挑战圣旨与上意。相比之下，嘉庆常常犹豫而谨慎。罢免勒保之后，嘉庆责成魁伦查办勒保：他对湖北紧急事态的处理、他在战争财政上可能的欺诈，以及他在增援问题上的一再反复。即便湖北危机缓和之后，嘉庆仍对魁伦施压，要他认真对待此案。然而，在勒保自己的地盘上查办他，很快被证明是困难的。\n明亮的倒台与那彦成在前线的登场\n明亮受命执掌镇压战役帅印之时，他与新任陕西巡抚永保已经紧张对峙了一段时间。朋友宜绵被罢免，自己却不得不再次与永保合作，明亮很不痛快，于是继续拖延对付张汉潮——张汉潮只有不足两千人，其中能战者不过五六百。短暂窜入河南之后，张汉潮一股返回陕西，随后在陕豫边境与陕甘边境之间来回穿梭。他们一度突入甘肃的成县、徽县与两当，但很快被广厚与吉兰泰赶回陕西。^103 与此同时，\n其他叛军股团——包括樊人杰、高均德两股——在川陕边境游走，拼命试图渡过汉江，与张汉潮会合。二月，一支大股叛军攻打紫阳的一处关卡，杀死数百名士兵，包括十几名军官。^104\n四月初，永保动身赴陕。勒保让永保给明亮带去两千名士兵——因为明亮抱怨过兵力不足。同时，勒保授予永保调度陕西全部军队之权。^105 到达汉中后，永保冲入秦岭与张汉潮作战。在华阳，永保遭遇张汉潮，大败。多亏绿营军官马朝瑞冲击张汉潮的人马，战局才扭转过来。次日明亮才赶到，与永保对张汉潮形成夹击。战后二人在留坝县城相见时，发生了激烈的争吵：永保指责明亮没有早点来救他，明亮则责备永保被叛军打败。^106 此后两人各干各的。永保不敢再与叛军接仗，留在凤县，声称要保障军费经陕西西部栈道运往四川的通道，并协助供应明亮的军队。明亮与永保在联名奏折中描绘了一幅悲观图景，强调在山区与张汉潮作战的困难。^107 嘉庆确信需要更多兵力，派新任成都将军庆成率八百名士兵前去增援。庆成起初奉命协助明亮，夏天到达陕西后又被皇帝改派加入永保。^108\n五月，张汉潮再次分两路出击河南：一路渗入西平，另一路突入卢氏。吴熊光与明亮都急忙赶去，把叛军赶回了陕西。^109 此后，鉴于嘉庆一再警告：如果张汉潮越过省界，就要严惩——明亮实际上停止了军事行动，只派乡勇把张汉潮困在陕西境内。他甚至放过了不止一次全歼张汉潮一股的机会。^110 为给自己的拖延辩解，明亮抱怨兵力太少，新到的援军不顶用；他建议在每个山口都驻兵，而落实这一点既费时间，又需要更多援军。嘉庆清楚地知道明亮与永保都没有全力作战，继续批评他们，并讥讽他们：以一万三千人的兵力，竟抓不住受伤的张汉潮、剿不灭他的两千人。^111\n仲夏张汉潮再次西转时，永保与庆成在他到达陕西西部栈道之前与他交战，但他们向皇帝抱怨明亮没有追击张汉潮。明亮与荆州将军兴肇——兴肇自1798年夏天起就与明亮在一起——出现后，四人达成了协议：明亮与兴肇先期赶往商州，阻止叛军入豫；永保与庆成在秦岭自西北向东南进军，防止叛军再次逼近栈道。他们指派被罢免的成都将军富成率两千名士兵紧追张汉潮一股。然而，这份协议并不能保证他们的合作，皇帝的反复告诫与警告也不行。^112 相反，明亮与永保变本加厉地互相中伤。为给自己留证据，永保把他们之间的所有书信都存档，甚至派了一名密探监视明亮，同时自己缓慢移动，有时一停数日。^113 夏末，张汉潮试图抵达湖北郧西，但被赶到的明亮赶回陕西。随后明亮奏报朝廷：永保与庆成不见踪影——这促使嘉庆命松筠查办永保与明亮之争。^114 此后两周里，双方都上奏折指责对方失职。嘉庆一面痛斥二人行径可耻，一面更倾向于相信明亮——他刚刚任命明亮为经略大臣；他怀疑永保与庆成嫉妒明亮即将消灭张汉潮。他撤销了先前让明亮赴鄂、由永保与庆成了结张汉潮一股的决定，随后指示明亮如实奏报各人的表现，并告诫明亮：如果永保与庆成不可靠，就不要离开陕西。^115\n然而，数日之内，皇帝对明亮的看法就变了。八月中旬，广兴从四川返回，告诉嘉庆：明亮故意拖延行动，是因为他不愿在张汉潮被解决之后去四川——明亮认为受勒保——他旧日同僚温福之子——的节制是耻辱。^116 不久，嘉庆又得知：明亮是接受胡齐仑贿赂的将领之一——胡齐仑是湖北的军需局主管，正因挪用军费而受到调查。嘉庆大为震惊，命魁伦与吴熊光进一步查明永保、明亮与庆成的不端行为，密奏于他。^117 八月十七日——任命明亮为经略大臣一个月后——嘉庆罢免了明亮，把此职交给了额勒登保。嘉庆素来对额勒登保评价很高，广兴奏报额勒登保没有收受胡齐仑的贿赂后，嘉庆更加确信他的品格。授他统帅之职时，嘉庆再次称赞额勒登保的自律与敬业，并准许他以满文具奏——因为他不识汉文。^118 额勒登保是第六任统帅，他将在这个位置上一直待到1803年——漫长战争结束前一年。\n明亮接到罢免旨意之前，他与永保的争斗已达白热化。八月，张汉潮在商州与河南淅川——两地都是教门渊薮——招募新叛军失败后，从商州朝西安方向移动。^119 永保与庆成虽然承诺参加夹击，却按兵不动三周多，只派富成与马朝瑞率兵追击张汉潮的小股队伍。明亮与兴肇在镇安与张汉潮交战时，永保的人马没有一个前来相助。被俘叛军供称没有清军追击过他们，盛怒的明亮据此指控永保与庆成失职。明亮的奏折到达朝廷时，永保与庆成的奏折也到了——他们解释说是连日大雨等因素耽搁了行程——这反而印证了明亮的指控。^120\n此时松筠已开始调查二人的冲突。松筠虽然努力保持公正，却偏向明亮而非永保——他认为永保无能、自私、器量狭小：不但带不了兵，做文官也不称职。但嘉庆逼他把话说得更明确、更坚决。^121 在北京朝廷上，舆论也站在明亮一边（永保名声不佳姑且不论，勒保最近的罢免也可能影响了舆论）。八月二十三日，嘉庆把永保与庆成双双罢免——这是永保在这场战役中第二次被罢免，他从此再未回到战役中来。明亮虽然幸免，嘉庆却任命政治新贵那彦成为钦差大臣（qinchai dachen），督催明亮了结张汉潮。^122\n对明亮而言，受那彦成督催比受勒保节制更难堪——那彦成比他小三十多岁，又是他曾与之共事的阿桂之孙。嘉庆或许希望那彦成的到来能刺激明亮加快对张汉潮的作战，以免被置于那彦成的节制之下。不久，松筠终于呈上罢免永保、庆成与明亮、将三人一并解京受审的建议（他写奏折时尚不知朝廷的决定），皇帝删去了明亮的名字，并强调：如果明亮能在那彦成到达之前消灭张汉潮，就给他记功。^123\n然而，那彦成的使命还不止于此。与许多捐纳功名装点门面的满洲贵族子弟不同，那彦成二十五岁就考中了进士。随后他在翰林院待了几年，1792年被任命到南书房——皇帝的机要顾问机构——供职。1797年底阿桂去世后，那彦成以军机大臣上行走——军机处的年轻成员——身份入值，协助和珅处理白莲教战役的军报。王三槐被擒后，他是受到乾隆嘉奖的人之一。^124 然而，和珅被清除之后，那彦成平步青云。嘉庆任命他担任中枢政府的众多要职，使这个三十五岁的年轻人处于与倒台的和珅平行的位置。那彦成先后执掌翰林院、户部、工部、兵部、国史馆、实录馆、京中关税、内务府营造司与内务府，^125 还被任命为几个旗的都统或副都统。^126 和珅1776年发迹之后还花了好几年才集齐他那一大堆兼职，那彦成不同——他仅仅七个月就头衔加身。就连那彦成平庸的叔父阿迪斯，也被先任命为兵部侍郎，随后在庆成被罢免时出任成都将军。^127 那彦成动身赴陕之前，嘉庆还授予那彦成的母亲诰命之衔，表彰她在丈夫阿思达1767年去世后独力抚育那彦成——当时那彦成只有三岁。^128\n正如嘉庆后来承认的，他打算把那彦成培养成领班大臣。换言之，嘉庆计划用那彦成填补和珅留下的空缺。显然，嘉庆此刻并不打算改变父亲在处理国家大事上依赖一位首席军机大臣的做法。乾隆曾先后派他的三位首席军机大臣讷亲、傅恒与和珅监临至少一场战争，嘉庆或许认为，那彦成也应当经历一次前线实习。^129 命和珅自尽时，嘉庆援引了讷亲之死，表达了一个希望：那彦成能成为又一个傅恒，结束眼前这场对白莲教叛军的战役，而战场的历练将使那彦成有资格成为军机处新的第一人。那彦成动身前，嘉庆特别指示他亲自参与军事行动——或与明亮一同，或自领一军——并告诫他不要学勒保：躲在安全的地方，汇编别人的战报。^130\n九月初，那彦成启程赴陕。与他同行的有新任陕西巡抚、蒙古旗人台布。^131 赴陕途中，二人约谈地方官员、士兵及其家属，甚至仆役跟班，试图查明陕西战场进展迟缓的原因。他们得出的结论是：将领们并未尽心与起事者作战——离敌人远远的，追击迟缓，同僚需要时又不肯伸手相助——而士兵则疲惫不堪、供应不足。他们还奏报了一条流言：四月至七月间，清军根本没有与张汉潮交过手——这意味着明亮与永保可能在奏报中捏造了战斗。那彦成请求皇帝授予他先斩后奏之权：一旦查实严重劣迹，可就地处决任何将领。他论证说，这个请求不是出于年轻气盛或桀骜不驯，而是为了根除积重难返的前线积弊。他还请求从满洲增调旗兵，每人配三匹马，以便移动更快、少依赖后勤。事实上，他已经命山西巡抚伯麟备好了一千匹马。^132\n那彦成的自命不凡没有给嘉庆留下好印象；他直截了当地驳回了这两个请求。他告诉那彦成：官员的性命不可轻率处置；即便经略大臣，在战争中也没有过处决官员之权，何况钦差大臣。他虽同意\"陕西军队数月不战\"若属实是重罪，但责成那彦成先查实真假。至于援兵与马匹，嘉庆坚持陕西的兵力已经足够——盛京与吉林的三千名旗兵和一千名撒拉兵已经派往那里。^133 尽管继续信任那彦成，这番往还还是让皇帝对门生的使命心存忧虑。\n被解除战役统帅之职后，明亮在与永保的争斗中变得更加咄咄逼人，在几道奏折中揭露了对手更多劣迹。为自己辩护时，明亮搬出与阿桂的交情，说他一直以阿桂为楷模，遵循阿桂往日的教诲。^134 嘉庆一面批评明亮借阿桂自保，一面也试图利用这一点。他告诉明亮：如果他能成功协助那彦成完成第一次军事使命，就可以将功折罪；并警告明亮不要因为那彦成是阿桂之孙而轻视或嫉妒他。与此同时，嘉庆把即将到来的冬天定为肃清陕川两省全部叛军的新期限。^135\n但明亮并不愿意给那彦成当导师。相反，他加快了对张汉潮的作战——张汉潮再次前往甘肃。九月初五日，张汉潮进入甘肃两当。在恒瑞与广厚——广厚此时已是甘肃布政使，再次部署了撒拉兵——的协助下，明亮与兴肇在成县一连击败张汉潮数场，逼得许多起事者上吊自杀，随后把残部围在一座大山三间山上，许诺数日内擒获张汉潮及其最后的人马。然而，九月十三日，张汉潮几番避开清军，从唯一无兵把守的一面攀着长满藤蔓的悬崖缒下，成功逃脱。经秦州，他与部众回到陕西，重入秦岭。^136\n明亮进展带来的鼓舞使嘉庆准备给那彦成另派差事。然而，永保的几道奏折到达，再次激起他对明亮的怒火。永保奏报：八月明亮在镇安与张汉潮交战时，曾数次写信给永保，请他不要行动，事后却指责永保怯懦失职。永保的揭露使嘉庆怀疑明亮是故意设局陷害永保。^137 再加上张汉潮在甘肃逃脱的消息，嘉庆下令查办明亮、兴肇与恒瑞，并褫夺了明亮仅剩的参赞大臣之职。尽管痛斥三人，嘉庆还是许诺：如果这道谕旨送达时他们已擒获张汉潮，就不交付审讯；否则那彦成与松筠将逮捕他们。^138\n在压力之下，又不愿引起正从西安赶来秦岭的那彦成的鄙夷，明亮再次展现了他的效能。他先在秦岭腹地的五郎与江口与张汉潮作战，随后把部队分成小队，尾随张汉潮一股进入密林。十月初三日，清军追上了张汉潮。损失二百余人——包括张汉潮的副手李潮——之后，被长矛刺中的张汉潮跳下悬崖，随后在树上自缢身亡，尽管他还有数百名追随者仍在逃。^139 张汉潮之死使明亮振作起来，作了最后一次自我辩护。他坚称自己在财务上并不贪婪，他与额勒登保是叛军最畏惧的两员将领，真正的懦夫嫉妒他、企图陷害他。他还立誓要在那彦成麾下不遗余力地作战。^140 然而，张汉潮的死讯还没到达朝廷，那彦成与台布关于审讯永保的奏报先到了。永保所披露的——明亮夸大战功，更严重的是，在奏折中捏造并未发生的战斗——令嘉庆大为震惊，尽管那彦成提醒皇帝：永保的指控是一面之词，他的证人是按永保的授意作证的。^141\n终于决定舍弃明亮的嘉庆，连张汉潮的死讯也动摇不了他。他怀疑明亮并未参与导致张汉潮之死的战斗，因此不赏他与兴肇。^142 嘉庆虽然对自己的\"用那彦成激励明亮\"之计颇为得意，那彦成却同情明亮。在京城时替明亮说过话的那彦成，张汉潮死后又替他求情，请求把他留在前线。但嘉庆态度坚决，声称明亮\"苍猾\"（canghua，老于世故而奸猾），可能不会尊敬那彦成。^143 结果，那彦成与台布罢免了明亮与兴肇，把他们解交松筠审讯。根据松筠的调查与建议，永保与明亮被处以斩监候；庆成与兴肇流放新疆。^144\n明亮既除，嘉庆完成了对战役领导层的改组；战争开始时的主要领导人除一人外全部被替换（表3.1）。唯一留下的，是西安将军、那彦成的岳父恒瑞（额勒登保与德楞泰被留用，但他们是1797年春才参战的）。\n表3.1　战区主要人事变动，1796—1799年\n\n\n\n职位\n任职者\n\n\n\n\n统帅\n永保，1796—1797；惠龄，1797；宜绵，1797—1798；勒保，1798—1799；明亮，1799；额勒登保，1799—1803\n\n\n湖广总督\n毕沅，1795—1797；景安，1798—1799；倭什布，1799—1800\n\n\n四川总督\n孙士毅，1795—1796；英善，1797；宜绵，1797—1798；勒保，1798—1799；魁伦，1799—1800\n\n\n陕甘总督\n宜绵，1795—1799；松筠，1799—1800\n\n\n湖北巡抚\n汪新，1796—1798；高杞，1798—1800\n\n\n陕西巡抚\n秦承恩，1789—1799；永保，1799；台布，1799—1800\n\n\n河南巡抚\n景安，1795—1798；倭什布，1798—1799；吴熊光，1799—1801\n\n\n成都将军\n观成，1793—1798；富成，1798—1799；庆成，1799；阿迪斯，1799—1800\n\n\n西安将军\n恒瑞，1795—1801\n\n\n荆州将军\n兴肇，1793—1799；弘丰，1799—1802\n\n\n\n资料来源：GZDJQ、XFFL、QSLJQ 及魏秀梅《清季职官表》，362, 365, 371, 399, 423, 430, 655, 664, 667。\n恒瑞因张汉潮在甘肃逃脱而受责，张汉潮死后得以免罪，奉命与那彦成联手肃清张汉潮残部，从而接替明亮，成为那彦成前线实习的导师。为大规模更换战争领导人辩护时，嘉庆论证说：他无意把自己的门生安插到领导位置上，而是按素质遴选——入选者必须正直勤勉。无论以何种标准衡量，尽管犹疑不定、时有失着，嘉庆皇帝在亲政第一年，确实尽了最大努力，试图扭转镇压战役的局势，使之有利于清朝。^145\n战争财政的受阻整顿\n战争领导层近乎彻底的大换血，与嘉庆遏制军费、打击（即便不能根除）前线腐败的努力的高潮相伴而来。据嘉庆说，到1799年初，镇压战役已耗费清朝国家七千余万两白银，使这场战争成为清史上最昂贵的一场，也令中枢政府陷入亏空。嘉庆对前线滥用与侵吞军费的了解显然比父亲更透彻，他对此深感不安，把纠正战争财政之弊列为自己的优先事项之一。与此同时，他立誓不为这场战役加税。^146 然而，这场斗争注定艰难。\n风暴眼的达州\n由于四川自1797年起比别的战场省份索取了更多经费，嘉庆首先着手整顿四川的后勤事务。至此为止，四川的主要后勤机构（军需总局）一直设在达州州城。1797年初，宜绵接替英善署理四川总督时，英善开始主持该局。^147 1798年初，福宁从湖北被派到达州。这虽然是对他在湖北拙劣战役的惩罚，福宁却被委托与英善共同主持达州的后勤局。亲政才数周，嘉庆——他早就听说过四川后勤问题的传闻——就以明亮之兄、镇总兵明兴取代了英善。明兴随后被提升为成都驻防副都统，意在使他面对福宁时拥有更大的权威。^148 这一调动在达州引起了不安；福宁如坐针毡。明兴任命后不久，福宁就上了一道奏折，解释四川的高额开支。他说：\n\n[惠龄、额勒登保、德楞泰]先后经过达州，臣曾就[开支]与他们会商。他们都说，近来开支已大为减少，但仍有不尽合例之处。鉴于诸将所带索伦、吉林及绿营兵皆骁勇善战，而眼下正是进剿贼匪的紧要关头，[臣]不得不对例所未载之处变通办理。^149\n[译者按：原奏自英文直译，文言原文待核，见注释149。]\n\n但他这种闪烁其词的自辩，只引起了皇帝更多的怀疑。嘉庆斥责福宁说：四川的开支日增一日，而那里的士兵却常常不能按时领到饷银与给养；将领们任意向后勤官员索款时，谁也不敢核查其用途。^150 鉴于福宁素有贪腐之名（他任湖广总督时得了个绰号\"富四要\"，Fu Siyao，意为\"贪得无厌的福某\"），^151 嘉庆不禁推断：四川后勤管理的问题既多且重。两周后，二月底，嘉庆决定派广兴入川——如前所述。怀疑陕西的后勤事务也有问题，嘉庆把松筠的任命改为陕甘总督。仍在从拉萨赴京途中的松筠，于是改赴陕西。^152\n广兴直到六月下旬才到达达州，因为嘉庆更改了他的行程，让他押送第二批经费，而不是第一批。^153 广兴到达之前，嘉庆于三月中旬送走了明兴，认为他不适合这项工作。接替明兴的不是别人，正是新近被罢免的湖广总督景安。^154 景安在四川的任期极其短暂。他刚到任，就于四月二十一日因前文所述的新指控而被革职。^155 尽管关于景安在四川短暂任职的记载很少，这一系列的人事变动已使福宁警觉起来。\n周围的变化使福宁警觉起来。他作了更多自我辩护的尝试，包括夏天上的那两道指向勒保的奏折——它们帮助扳倒了勒保。然而，福宁越是想洗清自己，嘉庆的怀疑就越深。嘉庆虽然利用福宁对勒保的指控，却同样不信任指控者本人。任命魁伦为新任四川总督时，嘉庆指示他彻查福宁的财务账目，查其有无欺诈、挪用与向将领行贿。^156\n胡齐仑丑闻\n嘉庆对四川、陕西的战争财政只是怀疑，对湖北却手里有一个案子：襄阳军需局主管胡齐仑被控欺诈、挪用军费。胡齐仑是浙江绍兴人，叛乱爆发时任襄阳知府。他被毕沅招募主持鄂北后勤，两年半间经手发放了四百二十万两白银。然而，他的军需局只有他本人和一名助手——同样来自浙江的朱谟，胡齐仑之兄的门生。所有经费都存在胡齐仑的衙门里。1796—1797年，鄂北是主要战场之一，军队云集，胡齐仑频繁给将领们——包括永保与明亮——送去馈赠。胡齐仑的善意得到了回报；将领们反过来热情赞扬胡齐仑，为他请功请赏，使他得了花翎。^157 1798年底，景安以湖广总督的身份弹劾胡齐仑与朱谟欺诈、挪用军费，并下令搜查其家。胡齐仑家中搜出五万两银子，两人都被革职查办。^158 然而，此案很快搁置下来，随后景安本人也在和珅倒台后遭到申斥。\n1799年二月，嘉庆重提此案。湖北的调查让他恼火：胡齐仑被留下独自核对账目单据，没有人被指派监督他。嘉庆怀疑接替景安主持此案的布政使祖之望试图庇护胡齐仑，命将胡齐仑与朱谟一并解京，并彻底清查胡齐仑的家产。^159 然而，初夏二人解到北京后，审讯收效甚微。直到祖之望来京、八月十六日觐见皇帝，嘉庆才查明缘由。因为胡齐仑详细记录了1796—1797年间他送给鄂北主要将领的馈赠——大多是白银（偶尔有贵重绸缎衣物）——包括数额多少、以何种形式（银锭或银盘）、送给谁、何时送、由谁经手；景安的继任者倭什布从祖之望手中接过这本账册后，没有把它呈交中枢政府，因为它牵连到许多高级官员（表3.2）。^160\n表3.2　胡齐仑1796—1797年间向湖北战争领导人所送白银馈赠\n\n\n\n收受者\n总额\n时间跨度\n次数\n备注\n\n\n\n\n永保\n26,310两\n嘉庆元年三月十九日—十二月二十六日\n至少15次\n另有银盘280个，重量不详\n\n\n毕沅\n45,724两\n仅记录一次：嘉庆元年十二月二十五日\n不详\n其中11,000两与惠龄共同收受\n\n\n鄂辉\n5,660两\n嘉庆元年三月二十四日—九月二十日\n16次\n另有银盘350个，重量不详\n\n\n庆成\n3,950两\n嘉庆元年五月二十四日—十二月初六日\n8次\n另加19,149两军装银\n\n\n惠龄\n10,657两\n嘉庆二年二月十二日\n1次\n用于犒赏兵丁\n\n\n明亮\n6,341两\n嘉庆元年五月初三日—二年二月二十一日\n8次\n\n\n\n恒瑞\n860两\n嘉庆元年五月初三日—十月初十日\n11次\n另有银盘200个，重量不详\n\n\n总计\n99,502两\n\n\n\n\n\n\n资料来源：JQSYD, 4:348–50. 账册移交北京的审讯者之后，胡齐仑才放弃顽抗。他承认自己挪用公款八万余两——从他所发放的经费中扣留了8%至10%——还承认他与毕沅一道给湖北的将领们送过钱。然而，他侵吞的可能远不止此数。^161\n胡齐仑的账册与供词震惊了朝廷与官场。鄂北的所有主要将领都有过错，其中一些人收受非法馈赠频繁到每两周一次。与他一贯的学者型大员形象相反，1797年夏病故的毕沅在这桩丑闻中分量很重。毕沅从胡齐仑那里收了四万五千多两——是所有人之最——用途没有记录。此外，毕沅常常亲自把胡齐仑的馈赠转交将领。更令人震惊的是：1796年底永保被革职押解北京受审时，毕沅让胡齐仑给他两千两。永保被押走时没带这笔钱，毕沅便把这笔钱——胡齐仑又添了六千两——送到了北京。永保在狱中收到八千两，用其中三千两在北京买了一所宅子。^162\n嘉庆得知胡齐仑账册的当天，接见了刚从四川返回的广兴。广兴是位善于观察的御史，沿途与达州都搜集了关键情报——尽管勒保在经费解到后立刻就打发他回去。如前所述，他向皇帝报告了明亮与永保的争斗、明亮不愿在勒保节制下去四川，以及额勒登保的良好声誉——这促使嘉庆以额勒登保取代明亮出任统帅。关于战争财政，广兴披露：尽管开支浩大，许多士兵已数月领不到饷银，装备也差——这印证了松筠早先的奏报：陕西军队供应不足——有些人没有鞋穿，只能用牛皮裹脚。^163 此外，广兴可能还披露了王三槐被擒的真相——王三槐是向勒保投降的，而不是如勒保所称在战斗中被擒。\n与此同时，仍在赴川途中的魁伦又有一道奏折到达朝廷。^164 进入陕西后，魁伦听到了更多关于四川后勤问题的说法：四川的后勤官员胥吏侵吞军费，用以向上司邀功买好，或者干脆中饱私囊，而部队却不能及时领到饷银与赏赐。不过，这一次魁伦把矛头对准了勒保。他指责勒保带了个坏头，列举勒保任陕甘总督时以及苗疆战役期间如何讨好和珅。魁伦还批评勒保没有制胜之策，不能驾驭部属——这或许暗指明亮与勒保的不和。他还指出，皇帝的招抚政策收效不大，因为人们还记得上年勒保欺骗王三槐之事。准备彻底大扫除的魁伦，请求从京城派官员协助他查办勒保与福宁。此外，他请求拨二百六十万两军费——因为勒保已把最近到达四川的二百五十万两大多用于偿债及其他用途。^165\n几天之内接踵而至的这些揭露，坚定了嘉庆改革的决心。八月十七日，他颁布了一系列措施。他以额勒登保取代明亮。他下令搜查受贿于胡齐仑的永保、庆成与鄂辉的家，并抄没其家产。他没有对明亮与恒瑞这样做，因为二人仍在前线作战，但他责成魁伦查明明亮是否还有其他财务劣迹。嘉庆清晰而坚定地表示：他决心彻查四川的任何欺诈与挪用。他论证说：鄂北的后勤尚且如此欺诈，四川的规模大得多，福宁与英善的品级又高于胡齐仑——更不用说福宁素有贪腐恶名、且是和珅的党羽之一——四川的问题必定更严重。嘉庆再次把战役进展迟缓归咎于前线普遍存在的财务舞弊：将领们拖延结束战役，是为了避免审计——一旦审计，他们的滥用与侵吞就会暴露。^166\n同一天，嘉庆从户部库拨五十万两给四川。他派广兴与另一位满洲旗人托津护送经费。这一次广兴将留驻达州主持军需局——这回应了魁伦请求京城派员的奏请。托津则充当皇家耳目——经费解到后他就返回北京。为协助广兴，嘉庆还命刘清——那位口碑甚好、曾劝降王三槐的地方官——加入达州军需局。嘉庆虽然把魁伦请求的二百六十万两减为五十万两，他却已有安排。当月早些时候，嘉庆已把一百五十万两托付松筠解往陕西，以备四川之需——因为他不信任福宁。随后他指示松筠把这笔经费转解四川。这样，四川新的财务管理将有二百万两可资运作，符合新规章。^167\n洪亮吉的挑战\n嘉庆吹响打击前线腐败号角一周后，八月二十五日，嘉庆之弟永瑆转呈了五十三岁学者官员洪亮吉的一封长信。洪亮吉虽然屡试不第、直到1790年才中进士，对官场却不陌生。他多年供职于包括毕沅在内的几位大员的幕府，在京城名流圈中为人所知。1799年上半年，洪亮吉以翰林院编修的身份在实录馆参与编纂已故乾隆皇帝的\"实录\"，但在他把长信的几份抄本寄给京城权要前不久辞了职。^168 信中，洪亮吉对嘉庆纵容和珅门生、以及在白莲教战役中面对三心二意的将领时犹疑不决，提出了尖锐而爆炸性的批评。或许，最近编纂乾隆实录的工作，使他对先帝的怀念加深了，于是他把嘉庆的所谓优柔与乾隆惩处不称职官员将领时的果决作了对比。^169\n事实上，1798年，洪亮吉就在翰林院的特科考试中指责地方官应对叛乱爆发负责、批评镇压战役的执行，令官场震惊。^170 洪亮吉固然道德感强烈、自以为是，但在这两次场合，他都站在法家的立场上，主张严惩一切恶官，以重树政府的权威。洪亮吉正确地察觉到战役已经脱轨——官场内外的许多人也指出了这一点——但他对镇压战争的把握，无论在广度还是深度上都很有限。他接触不到将领与中枢政府之间的官方文书，只能依靠闲谈、流言、邸报，以及与最近从战区返回、却不在指挥核心的人交谈。显然，洪亮吉没有跟踪嘉庆整顿战役的最新举措。他不知道胡齐仑案——此案牵连他的老东主毕沅；也不知道勒保被罢免，更不用说达州对战争财政的彻查。\n在改革紧锣密鼓之际，洪亮吉直言不讳、毫不圆滑的批评触怒了嘉庆。嘉庆有条不紊地为自己对和珅案及白莲教战争渎职领导人的处置作了辩护，宣布洪亮吉的指控毫无根据。洪亮吉随即被捕。两天后，军机处与刑部判他死刑，但嘉庆把刑罚改为流放伊犁。洪亮吉刺耳的批评虽使嘉庆不安，嘉庆或许仍欣赏洪亮吉对改革的热切，并注意到了他的一些指控。确实，他没有收回征求意见与批评的号召，而是向官场保证他仍然欢迎。他虽命销毁洪亮吉长信的其他所有抄本，自己却留了一份在手边。^171\n清廉的魁伦\n洪亮吉因直言而身陷囹圄之际，新任四川总督、直言敢谏的高级满洲官员魁伦，正走近四川——他仕途起步的地方。1777年，魁伦得到了他出京后的第一份差事：在四川松潘——原属西藏康区——担任绿营军官。在四川多个绿营职位上任职后，1788年，乾隆任命他为福州将军——福建旗制中的最高职位。^172 对这位当时只是四川建昌镇总兵、在旗制内未任过要职的三十六岁年轻人来说，这是极大的跳跃。乾隆承认魁伦资历不够，抬出了他的家世：他的祖父、兵部尚书查弼纳在1731年的准噶尔之役中阵亡。但乾隆很快补充说，魁伦本人似乎很聪明。^173 在福州，魁伦的职责之一是掌管福建海关——一份可能油水丰厚的差事。1795年，他在福州本来平淡的任期发生剧变：魁伦弹劾两位同僚——闽浙总督伍拉纳与福建巡抚浦霖——掩盖地方仓廪府库的亏空，此案发展成为乾隆朝晚期最轰动的贪腐案之一。伍拉纳与浦霖不仅因贪赃被判处死刑，福建许多下级官员也被牵连受罚，另有十人被处决。^174 由于伍拉纳不仅是皇室爱新觉罗氏成员，还是和珅的姻亲，魁伦由此声名鹊起，被视为正直而有胆识。他很快被任命为闽浙总督。^175\n和珅倒台后，嘉庆任命魁伦执掌吏部——这只是嘉庆把正直之士安插到关键位置的若干举措之一。令皇帝大为意外的是，魁伦离开福州之任，竟给他个人招来一桩难事。由于福建海关的税收不及往年（魁伦解释说是海盗导致来闽货物减少），魁伦被要求自掏腰包补上十九万四千两的缺额。当时他只付了八千两，于是提出抵押自己的几处房产，其余用\"养廉银\"补缴。魁伦掌管海关多年而家产微薄——与伍拉纳被捕时家中有四十多万两、浦霖家中有二十八万多两形成鲜明对比——令嘉庆啧啧称奇，大加称赞魁伦的清廉，说就连他在福建的政敌也找不到借口攻击他。^176 魁伦还给皇帝留下了深刻印象的是他迅速结束战役的信心——这在嘉庆选择他取代勒保时同样重要。\n新官上任，雷厉风行，魁伦毫不迟疑地行使权力。在广元入川时，他罢免了游击游涵宇——此人从未执行其守卫关卡的受命任务，一直躲在广元城墙后面。^177 九月初九日到达达州后，魁伦立即罢免并逮捕了勒保。^178 魁伦擅长画扇，除了十几年前在四川搜捕啯噜匪徒外并无作战经验，急于证明自己的军事才能。赴川途中，他就提议：逐步收紧对起事者的包围，通过设置陷阱、地雷与投毒水源，把他们挤出生存圈。^179 到达达州时，魁伦惊讶地发现：这座城市太平无事，战场在数百里之外。在胡齐仑案与洪亮吉信的推动下，到魁伦抵达达州时，嘉庆打击前线腐败的心情更加迫切。嘉庆坚持四川很可能存在更多财务欺诈，指示魁伦只专注于后勤以及查办勒保、福宁、英善与宜绵，但免去他的军事职责。嘉庆还命四川布政使林俊配合魁伦与广兴，以便免于\"隐瞒积弊多年\"的追究。^180\n然而，很快就被证明：起诉老辣的勒保与起诉胡齐仑完全是两回事——胡齐仑无意中为起诉者备好了证据。达州军需局的账目完美无瑕、细致清晰，显示勒保所领取的二百六十万两全部用于正当用途，主要是发放官兵饷银与定期犒赏。他也没有虚报兵额以多领经费。至于勒保的个人开支，军需人员替他购置一切，但勒保每月都用\"养廉银\"结清全部开销。事实上，勒保的养廉银还有一千五百余两的结余。魁伦虽然在军费中发现的漏洞越来越多，他对勒保与福宁的审讯却毫无成果。勒保只承认几项与经济无关的指控：对部队福祉关心不够、没有及时奏报叛军突入湖北、没有管束骚扰百姓的旗兵，等等，却断然否认任何财务罪行。^181 福宁也不承认在战争财政上有任何过错。很可能二人在应对调查时串了供。据说勒保的下属对勒保被罢免不满，曾向魁伦请愿，求他替勒保申诉，尽管魁伦在奏折中没有提及。与此同时，魁伦不得不继续使用勒保的一些旧人管理后勤，因为他没有人手替换他们。^182\n惊讶、困惑、又有些沮丧，魁伦发现无法把任何经济罪名钉在勒保身上。在第一份调查报告里，魁伦降低了调门，向皇帝解释对勒保的某些指控不能成立。然而，魁伦毫不含糊地表达了自己的深切怀疑。他认为，勒保与福宁有充足的时间修补账目漏洞——因为勒保早在七月就提出让京城派人来川查账，而他们又对魁伦查账的使命心知肚明。^183 无法以财务罪名起诉勒保，魁伦便于十月中旬建议：以勒保故意拖延军事行动、阻碍战争进程为由，处以立即死刑。按大清律，此种行径应处死刑。^184\n嘉庆虽然赞同魁伦不相信勒保完美无瑕的账目，怀疑勒保、福宁等人做了假账，却从早先牺牲勒保以换战役风清气正的意图上退了回去。他一面催促魁伦继续挖掘证据，一面把注意力转向对勒保的非财务指控。^185 但他仍想摆出严厉君主的姿态。十月十二日，军机处与刑部提议将胡齐仑判斩监候、待来年秋审，嘉庆改判立即绞决，声明：既然前线腐败始于湖北，胡齐仑就应严惩，以儆正在进行的战役中的全体将领与后勤人员。^186 这是这场战役中第一个被处死的官员；胡齐仑之死或许有助于平息\"皇帝对渎职官员过于宽纵\"的批评——正如洪亮吉信中所说。\n胡齐仑之死也帮助勒保免于死刑——一个例子已足以成就嘉庆的形象。同时，嘉庆或许通过秘密渠道听到了前线抗议勒保被罢免、不满魁伦的呼声。此外，勒保被捕时向国家认\"捐\"三万两，并当即交出两万两现银。^187 接到魁伦处死勒保的建议后，嘉庆把刑罚减为斩监候。他宣称勒保的罪行不如明亮严重，转而列举勒保在苗疆战役与白莲教战役中的贡献，包括擒获王三槐与冷天禄——尽管他补充说二人并非勒保亲手所擒，他只是在擒获二人的战斗中督战而已——他避而不提勒保在王三槐被擒一案中的欺诈行径，而单单这一条就足以让勒保获死罪。嘉庆还为勒保坐镇达州辩护，说这是对自己\"坐镇各战场中央\"的指示的误解。与此同时，嘉庆下令不搜查勒保的家——因为这种措施只适用于已被定罪的贪官。^188 结果，对勒保的贪腐指控被撤销，勒保迄今侵吞军费数额成了谜。除勒保的三万两之外，勒保友人的游说或许也在嘉庆态度的急转中起了作用。\n然而，饶过勒保并不意味着嘉庆软化了整顿战争财政的决心。下令处死胡齐仑几天后，嘉庆告诉松筠，他打算对河南与陕西两省的军费开支进行调查。^189 同时，嘉庆继续对魁伦施压，要他继续核查达州的后勤账目，因为他仍怀疑勒保与后勤人员篡改了账册。但他告诫魁伦：如果确实没有证据，就不要追逼。^190 审讯福宁未能打破僵局之后，^191 魁伦下令逮捕两名后勤官员——曹相业与石作瑞，二人都是勒保的门生——希望从他们那里取得更多证据。\n泸州知州曹相业可能是1798年初勒保路过泸州时带入战役的。勒保随后派曹相业署理夔州知府，主持夔州后勤。曹相业经手发放了十八万多两银子，魁伦入川后他请假养病。与胡齐仑一样，曹相业也侵吞了军费，给包括勒保在内的将领送礼。魁伦的人赶到夔州逮捕他之前，曹相业已经登船，逆流驶向他重庆的家乡。魁伦的人截住船只时，发现曹相业刚刚死去，却在二十四箱面条里发现了藏匿的一万五千两白银。重庆知府石韫玉——勒保的另一位门生——前来验尸，随后宣布曹相业系正常死亡。曹相业的家属、书吏与仆人都坚称，这些钱是曹相业多年任知府攒下的积蓄。勒保的家人则说，勒保的夫人只收过曹相业的食物，退回了他送的绸缎与一千两银子等其他礼物。^192 就这样，曹相业之死掐断了魁伦调查中有价值的线索，永远成了一个谜。事实上，达州军需局的两名后勤官员——程勋与李宪宜，都是道员——也在魁伦到达前不久死于\"疾病\"。^193 这些神秘的死亡虽然无法证明，或许与达州军需局完美无瑕的账目不无关系。\n石作瑞是四川的另一位道员，叛乱爆发时投入英善麾下，先组织乡勇，随后加入达州军需局。勒保到达后，石作瑞成了勒保处理战争财政的左右手。王三槐被擒后，勒保呈上长长的请功请赏名单时，举荐石作瑞升任布政使。^194 后来才披露：石作瑞挥霍军费，频频盛宴款待将领，礼物堆积如山（例如，他曾一次送给一位京官珍珠三斛、绸缎一万匹）。^195 与勒保、福宁一样，石作瑞也没有如实招供。嘉庆批准了魁伦对这二人的逮捕，并告诉魁伦：把已死的两名后勤官员程勋与李宪宜当作替罪羊（即宣布一切劣迹皆此二人所为），以此诱使后勤人员讲真话。^196 或许是因为嘉庆对勒保的态度转变使魁伦有所顾虑，他变得更谨慎、更少锋芒。他转而指望年轻的、无所畏惧的特立独行之士广兴的到来，好继续查办。\n好继续查办。^197\n在啃查办勒保与福宁这块硬骨头的同时，魁伦在另一条战线上行动：设法堵住后勤漏洞、削减开支。这项行动注定不受将领们欢迎；就连公认财务楷模的额勒登保，也公开表示不满。额勒登保一面反复告诉皇帝魁伦不谙军事，一面三番五次催促魁伦尽快结束调查、投入战斗——尽管嘉庆已声明魁伦不负军事之责。每一次，嘉庆都耐心而坚决地挡开额勒登保的怂恿，坚持让魁伦留驻达州，主持后勤与调查。^198\n与总是确保自己手边兵力充足的勒保不同，魁伦起初没有认识到这点的重要性。到达达州后，魁伦立即派百祥率勒保的一千六百名士兵去给额勒登保送经略大臣印信。随后魁伦又把随他入川的四名侍卫中的三名派给额勒登保。直到发现达州二千六百名士兵中约有二千名是伤病员，魁伦才请求额勒登保拨给他一些军队。^199 额勒登保随后拨给魁伦两千名士兵，并派百祥回来统领。然而，在皇帝最后一次提醒魁伦不必作战之后，额勒登保改派百祥与这两千人去守卫达州与太平之间的运输线，并把随魁伦入川的最后一名侍卫春宁也调走了。嘉庆没有看出这些安排使魁伦陷入易受攻击的境地，予以了认可。^200\n显然，统帅与新任后勤大员关系不睦。他们之间的一大冲突，围绕着长期雇用骡马驮运给养的开支——称为\"长骡\"（changluo）——这项开支不为《军需则例》所认可。勒保治下，达州局为每头牲口每月付九两。由于据说雇了数万头牲口，这成了最昂贵的开支之一，每月达数十万两。魁伦虽然知道这项开支被严重滥用，却仍对废除\"长骡\"犹豫不决，因为额勒登保向他抱怨过前线给养短缺。因此，魁伦提议保留这一做法——理由是\"长骡\"在苗疆战役中就已存在并获认可——但把额勒登保后勤人员要求的费率降到每头每月九两七钱。^201 然而，嘉庆毫不妥协；他驳回了魁伦的提议，理由是苗疆是边疆，而川陕是腹地。此外，魁伦提议的费率竟比勒保治下还高，嘉庆颇为恼怒，怀疑魁伦被后勤人员蒙骗了——他们用这个名目掩盖侵吞经费，或填补战争前期舞弊造成的账目窟窿。在朝廷的催逼下，魁伦废除了长骡。为安抚将领们，他定了一条规则：每一百名士兵雇四十名长夫。虽然这超出了《军需则例》的规定，却把开支减了一半。^202\n嘉庆不顾魁伦的艰难处境，继续敦促他坚持高标准、进行彻底的大扫除。他禁止魁伦用新经费偿还欠款，要求他优先保障部队需要。他指示魁伦与额勒登保协调，把伤病兵遣回原营，以节省开支。^203 十一月初，魁伦呈上了一份关于四川战争财政管理不善与漏洞的长篇报告，提出了一套新规章。除其他事项外，他要求后勤人员每旬呈报、每月清账。除废除长骡外，魁伦还打算以额勒登保部队的开支为基准，使各项开支标准化。^204 大约此时广兴到达达州，他迅速行动，查出更多漏洞与不法行径。他挑出雇募乡勇的开支，视为又一项极为昂贵且欺诈性的支出，随后努力裁减过大的乡勇队伍（1797—1798年四川领饷乡勇曾超过二十万）。嘉庆欣然批准了这些新规章与改革。虽然他说自己可以灵活处理，甚至为最后胜利而破例——因为结束战争意味着省下大笔钱财，拖延战争则耗费更多——但定下的调子是：开支要更严格。总之，能砍的他都会砍。^205\n四川采取的某些措施，可能受了松筠在陕西所定新规章的影响。魁伦入川之前，嘉庆就指示他留意松筠整顿后勤的做法，并把松筠提案的抄本随指示附寄给魁伦。^206 但有一项改革魁伦没有从陕西照搬：废止\"赏号\"——将领定期犒赏部队的做法，这场战役中主要以现银发放。初夏松筠到达汉中、接管陕西后勤时，请求用自己的\"养廉银\"——每年二千两——犒赏陕西的士兵与乡勇。^207 那彦成与台布到任后，也相继提议从自己的收入中拿钱作此用途。嘉庆同意了台布的请求，让他预支两年的养廉银，却驳回了那彦成的请求，说他还要赡养寡母与家人。再次对新贵示以恩宠，嘉庆赏那彦成六千两犒军银——从陕西省库支出，而非军费。^208\n新到川陕官员们的这些举措给嘉庆带来了希望：他们个个清廉、勤勉、锐意改革，没有故意拖延战役结束的隐衷。^209 十一月二十四日，嘉庆亲自处理四川的赏号问题。他赏额勒登保一万两、德楞泰五千两用于犒军，并指示这笔钱从四川省库支取，而非达州军需局——意在关上将领们用军费支付这项开支的大门。^210 与将领们先前所得相比，这些皇家赏赐吝啬得不足以令他们感恩。而且，时机使这一打击雪上加霜：距新年只有一个月，部队本指望特别丰厚的年赏。军人们苦涩的反应过了一段时间才传到中枢，而魁伦——这场削减他们战时收入的改革的化身——将首当其冲（广兴程度较轻，因为他到得晚，又忙于裁减乡勇）。魁伦垮台的种子已经种下。\n未破的僵局\n回到军事前线，1799年的战事并不像嘉庆希望的那样顺利。在湖北，倭什布确实夸大了夏天前往湖北的徐天德、李述队伍的规模——它只有几千人，而不是他所声称的两万。然而，几支襄阳队伍——包括张添伦、樊人杰与辛聪——大约同时从四川突入湖北巴东，随后北上，目标显然是襄阳。^211 听说湖北告急，嘉庆不遗余力地保障该省，从吉林与黑龙江再调两千名旗兵入鄂（此前已从盛京调去两千名旗兵），并催促明亮与额勒登保前往湖北。^212 然而，湖北局势很快向有利于清方的方向转变：八月初，倭什布与副将孙清元在南漳击溃了徐、李队伍，据说杀俘两千余人。前往襄阳的计划既已落空，徐、李队伍转而向西南，从巴东返回四川。途中李述伤重而死。^213\n襄阳起事者又在湖北盘桓了一个月。七月下旬到达湖北后，德楞泰与朱射斗先在竹溪击破了只有两千人的线号，俘获龚文玉；龚其位跳崖而死。^214 随后他们把樊人杰逐回大宁，把张添伦与辛聪逐回平利。^215 到九月，湖北再次解除了战事；破坏有限，因为受波及地区多为山区、人烟稀少。^216 倭什布虽然因平定湖北之功获得世职，却因夸大事件严重性而遭到皇帝的严厉批评。^217 官员夸大本辖区危险以获取援兵、更多经费与赋税减免，本是战时的通例。但这一事件产生了不同寻常的反响：它帮助扳倒了勒保。额勒登保对勒保被罢免本就不满，对倭什布的夸大也极为恼火。^218\n此时，许多最早的叛军首领已经死去，幸存的起事者在挣扎。被逐出甘肃后，张世虎的蓝号与杨开甲的白号在川北漂流，各只剩几百人。张添伦与辛聪从湖北返回四川后，也只剩千把人。^219 但真正坚定的起事者重新集结，结成新的股团，拥立新的首领。一群襄阳起事者接过了王聪儿的衣钵，把新队伍称为\"齐家营\"（Qijiaying）。然而，夏末在川陕边境被额勒登保击败时，他们损失了数千人——包括王聪儿的侄女齐四姑，即\"四姑奶奶\"——只剩数百人。^220 襄阳出身的最著名新队伍是\"高家营\"（Gaojiaying）。高均德虽然是其谋主，却用化名郝一知退隐幕后，让叔父高成杰——人称高二——与马朝礼——人称马五——公开带队。^221 另一支新队伍\"戴家营\"（Daijiaying）由戴仕杰——人称戴四——统领，他二十出头，是张汉潮的追随者。教门叛军事实上的教宗王廷诏常常或随高家营、或随戴家营行动，并设法隐瞒自己的行踪。正是王廷诏建议高均德使用化名以避开敌人注意。^222 这两支队伍常常协同行动。\n襄阳与四川的起事者有时虽也混处，大体上两个群体还是各走各的。在四川起事者中，徐天德一股仍是最大的，从湖北返回四川时或许有五六千人——这很可能是因为徐天德对襄阳群体敞开大门。^223 徐天德的弟子王登廷自领一股，在家乡一带游走。与此同时，罗其清与冉文俦的残部也组成了新队伍。冉文俦之侄、天赋过人的统帅冉天元复兴了蓝号——这支队伍很快将以凶悍震惊清军。罗其清的两名追随者——苟文明（其妹嫁与罗其清之弟）与鲜大川，都是巴州人——各自立了队伍，活跃于四川多山的东北边境。\n嘉庆常常痛斥将领们只擒叛军首领，使叛军残部有充分的机会复兴；任命额勒登保为新统帅时，他重申：将领们击败某股叛军时，还应设法擒获其首领的全部亲属。^224 受命之时，额勒登保正在川北对付几个股团。或许受晋升的鼓舞，额勒登保再次展现了他的效能。九月中旬，额勒登保在广元几乎全歼了一支千人的队伍——它吸收了许多齐家营的残部——并杀死了其首领。^225 到九月底，额勒登保已按计划把陕西的大多数叛军股团压向四川通江与南江；朱射斗与总兵李绍祖、战功卓著的满洲旗人、四川提督七十五一起，把徐天德及其数千人逼向东乡。^226\n德楞泰或许受到了额勒登保执掌帅印的刺激。正如松筠所指出的，德楞泰\"论杀贼，可称勇猛\"（原文待核，见注释227）。^227 确实，德楞泰想干的时候是很有本事的。仲秋，德楞泰从湖北追辛聪到陕西，在那里遭遇了新建的高家营。十月初六日，他在西乡与高家营交战，据说杀死一千余人，俘获高均德、高成杰、马五之妻及其他几名首领，以及数百名起事者及其家属。为这场胜利，嘉庆授予德楞泰二等男爵，并任命他为参赞大臣，成为额勒登保的副帅。^228 急于再立新功，德楞泰此后数周作战更勤。然而，他在可信的战功里掺了假。^229 最令朝廷欣慰的是德楞泰的估计：仍在逃的起事者只剩一万几千人，他们已被逼入绝境、筋疲力尽，常常衣不蔽体、赤着脚——因为四川许多居民已把粮食藏进堡寨，起事者获取给养越来越难。\"贼数日减，官兵愈奋\"，德楞泰如此奏报，尽管他也承认新的股团正在出现。^230\n额勒登保同样乐观。十月初作为统帅所上的第一道奏折中，他强调起事者已是强弩之末，尽管他知道新队伍、新首领在成倍增加。他坚持把所有叛军赶向四川，同时阻止他们进入湖北与陕西。为实施这一计划，他要求那彦成与大部分新到的旗兵前往四川。^231 额勒登保的这些提议——尤其是对那彦成发号施令——意在宣示他作为统帅的全部权威，因为嘉庆早先曾表示：额勒登保不必照管所有战场，只对自己负责即可。^232 尽管额勒登保暗示了他与那彦成可能不和，嘉庆还是对他的乐观前景感到高兴。这加上张汉潮之死与德楞泰的胜利，使皇帝又有了希望；他设定了新的期限，给军队两个半月时间，在嘉庆四年内结束战役。^233 十一月中旬他虽很快修改了期限，延长两三个月以肃清叛军余部，心情仍然昂扬。他对那彦成肃清张汉潮残部的进展有些担心，指示额勒登保与那彦成合作，不要只限于本省——意在敦促额勒登保完成自己的任务后帮助那彦成。^234\n嘉庆又太乐观了。到1799年底，许多叛军股团会师川东北，冉天元、樊人杰、徐天德与王登廷之间形成了一个松散的联盟。四股队伍协同行动，有时合而为一，目标直指清军的运输线。尽管人数减少，留下来的人大多是坚定的，并将一再证明他们的实力。^235 十一月初的一场战斗中，他们杀死了安禄——一位承袭其父一等公最高爵位的侍卫。安禄的父亲海兰察是乾隆朝晚期的杰出将领。与1797年乾隆对惠伦之死的反应相似，嘉庆深感悲痛，认为让旗人贵族与\"幺么小丑\"的匪徒交锋，是不值得的牺牲。^236 不久，在巴州何家院的一场血战中，叛军联盟使额勒登保的部队伤亡惨重；数名高级满洲军官——包括春宁与格布舍——负伤，尽管额勒登保声称他的部队杀死一千余名叛军、俘获数百。^237\n何家院之战后，起事者似乎正在实施一个新计划：徐天德与樊人杰再次前往湖北，冉天元与王登廷留在四川——这可以分散额勒登保的注意力。他们很可能在十一月中旬通江一场战斗之前分了手。^238 徐、樊移出额勒登保视野的同时，冉天元率其蓝号向西前往苍溪。十一月底、1799年结束前几天，额勒登保遭受了一场惨败。在苍溪青子垭一场彻夜战斗中，冉天元的人马从阿哈保与穆克登布两名满洲军官手中夺下一座山冈，随后从山顶向下冲锋。清晨冉天元率部撤离时，留下三百多名清军士兵乡勇与十三名老练军官的尸体。^239 这堪称额勒登保在这场战役中最惨的一败；1800年初消息传到北京时，将严重影响嘉庆对战役的看法。\n在汉江以北，那彦成对张汉潮数百残部的追剿毫无成果。^240 接管明亮与兴肇的部队后，又有三千名盛京、吉林旗兵加入，^241 那彦成手握一万多名士兵，大多是旗兵。嘉庆责成他先肃清张汉潮残部，再到汉江以南与其他起事者作战。尽管已是十一月，皇帝仍坚持那彦成在年底前完成战役的期限。^242 尽管手握重兵，那彦成对在秦岭深处完成任务却没有信心。在前线的第一批奏报中——他到任数周后才上第一道奏折，很可能是在设法理清方略——那彦成坦率地表达了他的顾虑乃至沮丧。他惊叹于群山的荒蛮，详述了遇到的种种困难。他抱怨部队与笨重的后勤队伍在山中行动不快——那里终年冰雪覆盖，常常无路可走——而起事者几度穿越群山，更熟悉山中情况；他们没有后勤之累，只需劫掠山中的居民与难民获取给养。就作战而言，不可能包围叛军、实施夹击；树木灌木的茂密又削弱了火器与弓箭的效力。显然束手无策的那彦成请求增调旗兵——他的兵力因分兵把守各个山口而越来越少。^243\n那彦成的悲观令嘉庆失望又恼怒，他批评了那彦成所做所建议的一切，包括他对秦岭风光诗意的描绘，并在谕旨结尾罕见地用了\"含泪训谕\"（原文待核，见注释244）一词。^244 嘉庆的高期望反过来使那彦成更急于建功。然而，到达前线后的十天里，他与起事者八次遭遇，除每次杀死数十名叛军外，没有取得决定性胜利——起事者一见清军就遁入林中。确信对付敌人游击战的唯一办法是自己也采用游击战，那彦成让部队轻装简行，分遣队进入森林。他亲率一支，凡马匹不能通行之处就徒步而行。^245\n嘉庆又不赞成那彦成的决定，认为他或任何主帅进入森林追剿叛军纯属鲁莽。他要那彦成挑选精兵入林，把叛军赶出来，好让清军主力在林外了结他们。他甚至建议可以烧林以达此目的。^246 但那彦成不肯退让，论证说自己的在场能鼓舞士气，并能在出现意外时及时调整，尽管他继续抱怨重重障碍：林中能见度差、各分遣队之间联络不畅、叛军残部决心死战到底。随后，那彦成恳求给更多时间以实现自己的计划。^247 1800年初，嘉庆再次命那彦成撤出，封锁入林通道，等额勒登保结束四川战事后前来。嘉庆还让那彦成拨一千名旗兵给额勒登保——鉴于他兵多。但那彦成拒绝了，坚称这些旗兵——耐得住山地寒冬、精于骑射——对他不可或缺。他再次抱怨汉江以北一万四千名正规军还不够。^248\n在汉江以南，1799年下半年，襄阳与四川的起事者反复拼命地试图接近并渡过汉江。有些是想与张汉潮残部会合，或前往湖北、河南；有些则只是被大巴山中给养匮乏所迫。战斗有时十分激烈。夏末兴安一场持续三天的战斗中，清方损失了十名军官与三百多名士兵乡勇。^249 为加强江防，清方雇了更多乡勇，并从山西调两千名士兵到江边。在驻节西乡的固原提督王文雄督率下，清军挫败了各股叛军的所有渡江企图。^250\n在江边打不破清军防线，叛军就向东西两面另寻出路。徐天德、樊人杰、辛聪等人从四川与陕西两路向湖北移动。虽然被击退，三省边境的压力却在累积。^251 与此同时，高家营的余部——如今由马五与新的\"高二\"统领，此人名叫高天升，队伍因此开始被称为\"高马股\"——向西移往甘肃。在四川，冉天元即将成为新的有号召力的首领。青子垭大捷之后，他吸引其他股团投到他的旗帜之下。^252 嘉庆发动瓦解叛乱的心理战将近一年之后，几乎没有叛军投降——尽管嘉庆每次任命新统帅时都重申他的新政策。1799年走到尽头时，叛乱并未奄奄一息，而嘉庆打击前线腐败的改革却开始适得其反——这很快将给镇压者带来严重的挫折。\n注释\n[译者按：文献简称对照——除前章所列外，另有：JQQJZ《嘉庆朝起居注册》；QLQJZ《乾隆朝起居注册》；MQDA《明清档案》；NGDK《内阁大库档》；XFFLXB《钦定剿平三省邪匪方略续编》。]\n题辞：嘉庆四年七月初六日批语，XFFL, 108/40a.\n\nJQSYD, 4:3.\n此人是山东巡抚伊江阿。嘉庆震怒，将他革职，流放伊犁。JQQJZ, 4:28, 62.\nQSLJQ, 37/6b.\nQSLJQ, 37/18b–19b.\nQSLJQ, 37/22b–23a.\nQSLJQ, 37/32a–36a.\nXFFL, 88/4a. 类似表述见QSLJQ, 38/3a–b, JQSYD, 4:16.\nQSG, 11316.\nXFFL, 77/29a.\n此点在既往研究中被忽视。巴特利特（Bartlett）认为，是政治权力的垄断与贪腐决定了和珅的垮台，却未提及白莲教战役。Monarchs and Ministers, 232–39. 曼素恩（Mann）与孔飞力（Kuhn）在\"Dynastic Decline\"中也没有提到；见第108页。\n冯佐哲在《和珅评传》（Heshen pingzhuan）269–314中驳斥了对其家产的夸大。\nJQSYD, 4:33–34. 嘉庆确实批评过和珅向官员索贿，导致官员转而盘剥百姓以获取额外收入。XFFL, 88/7a–b.\n不过，和珅在认为必要时也能破例。1797年，他批准支付军事民夫从广西向贵州运送大炮与装备（为苗疆战役）所用帐篷的费用——尽管《军需则例》不认可。剿捕档，嘉庆二年九月，27–30。\nXFFL, 103/8a-9a, 14b. 关键问题是\"长夫\"（changfu）与\"长骡\"（changluo）。关于这些开支，见第7章。\nMQDA, A288-1.\n嘉庆一再指出，战争领导人滥支经费，是因为他们指望和珅庇护。XFFL, 90/18b-19a, 91/25a, 116/11b.\nXFFL, 89/14a–b.\nXFFL, 103/8a-11b. 鳌拜于1669年康熙亲政时被清除。年羹尧于1726年以四川总督身份被清除。讷亲于1749年因战争已近结束而被处死于解往金川途中。\n嘉庆命福长安观看和珅自尽。QSLJQ, 37/50b–51b; 38/2b–5a.\n乾隆即位后，很快把父亲信任的两位大臣鄂尔泰与张廷玉边缘化。\nJQSYD, 4:33–34.\n嘉庆勒令和珅的几名门生致仕或降职，惩处了他的几名管家，并追夺了和珅已故之弟和琳的恤典。QSLJQ, 38/5a–7a; Nivison, \"Ho-shen and His Accusers,\" 241; 关文发《嘉庆帝》（Guan, Jiaqingdi），254–55。\nQSLJQ, 37/27b–28b, 37/30b–31a. 松筠1785至1792年任库伦办事大臣，主持对俄边境贸易。1793年，他参与接待马戛尔尼使团。关于松筠在拉萨的经历与建树，见达布林豪斯（Dabringhaus）Qing Imperium。\n书麟是满洲旗人，以武职起家，后转文官系统。和珅倒台时，书麟正流放新疆。QSG, 11125–27. 嘉庆四年三月初五日，嘉庆对调了书麟与魁伦的职位。QSLJQ, 40/10a–b, 40/16b.\nQSLJQ, 37/27b–28a, 39/5b–6a, 53/22a–b.\n朱珪于嘉庆四年正月初三日奉诏进京，入直南书房。JQQJZ, 4:9; 关文发《嘉庆帝》（Guan, Jiaqingdi），219–22。1797年，和珅曾阻挠朱珪回京。Nivison, \"Ho-shen and His Accusers,\" 240.\nXFFL, 87/22a–b.\nXFFL, 87/22b–23a.\nQSLJQ, 37/28b–29b.\n嘉庆认为明亮的动机是索取更多经费。他以严惩相威胁，指示明亮迅速消灭张汉潮一股。QSLJQ, 38/10b.\nQSLJQ, 38/14a–15b; 88/17b–18b. 永保被升为头等侍卫。XFFL, 88/25a.\nXFFL, 89/5a–10b.\nXFFL, 89/9b.\nXFFL, 89/14a–b; QSLJQ, 38/34a–b; 39/6b–7b.\nXFFL, 35/35b, 46/11b–12b, 56/24b–25b.\nXFFL, 23/6b–7a. 秦承恩曾告诫部下不要杀
