1b, 56/2a.</li>\n<li>XFFL, 75/15a–16a.</li>\n<li>1798年夏，英善与福宁让一百名乡勇各背四百两银子，经便道解往太平前线。XFFL, 76/26a–27b. 1799年春，福宁让四百名强壮挑夫各背一百两，解往大宁、开县、太平交界的山区给德楞泰。XFFL, 97/1b–2b.</li>\n<li>XFFL, 135/17a–18a. 1798年底，福宁在川东北数县储粮。XFFL, 90/15b–16b. 1799年春，福宁在叛军难至之处的平民堡寨囤粮。XFFL, 101/14a–b. 广兴也在靠近前线的平民堡寨储银储米。XFFL, 138/15b–16b, 146/32b–33a.</li>\n<li>关于两次金川之役中借雇民夫之名的滥行，见戴（Dai）\"Qing State,\" 48–52。</li>\n<li>XFFL, 35/29b–31b.</li>\n<li>XFFL, 41/38a.</li>\n<li>XFFL, 41/37b.</li>\n<li>1799年春末，叛军袭击四川云阳一处粮台，三十多名民夫被杀。XFFL, 101/15a–b. 不久，福宁奏报运输队频繁遭袭，粮失人亡。XFFL, 107/13b–14a. 1802年春，陆有仁奏报秦岭中挑夫被杀。XFFL, 304/20b–21a.</li>\n<li>1797年春东乡发生此事时，英善从外地招民夫。XFFL, 35/29b–31b. 1797年夏太平亦然。XFFL, 41/38a. 1799年春末，福宁抱怨在四川雇民夫之难。XFFL, 101/14b.</li>\n<li>1800年底，陆有仁提高陕西挑夫工钱——因为粮价数倍于前，且起事者近在咫尺、威胁挑夫。XFFL, 230/32a–b. 1802年多雨的夏季，陆有仁再次提价雇挑夫，向秦岭追剿苟文明的军队运米。XFFL, 319/15b–16a.</li>\n<li>XFFL, 130/11a–b.</li>\n<li>XFFL, 171/12a–b.</li>\n<li>XFFL, 312/26a.</li>\n<li>XFFL, 182/7b–10b, 186/19a–b, 189/14b–16a.</li>\n<li>XFFL, 259/24b–26a.</li>\n<li>1798年夏末，乾隆清楚表达了对勒保处置战争财政不当的愤慨。XFFL, 76/29b.</li>\n<li>QSLJQ 39/17b–18a; XFFL, 90/18b–19a.</li>\n<li>QSLJQ, 37/16b–19b, 37/22b–23a, 38/34a–b, 39/6b–7b; XFFL, 87/15a–b, 89/14a–b, 105/4b.</li>\n<li>QSG, 11316.</li>\n<li>关于雍正帝对火耗的改革，见曾小萍（Zelin）Magistrate's Tael。</li>\n<li>例如，广兴请求每月从达州局\"平余\"中支三百两，支付其助手书吏的工钱与一切运转开支，以其兄弟的\"养廉银\"偿还——他被罢免后没有俸禄。XFFL, 137/15a–16b.</li>\n<li>只有一次，那些箱子在途中被打开。1799年春，永保在运输队进入陕西栈道之前拦下了押解四川的三百万两，命打开所有箱子、把银锭改装入每箱两千两的小箱，这样一头骡可以驮两个小箱（共四千两）单独行进。永保论证说这可省百分之二十五的骡力。XFFL, 100/10a–12a, 126/23a–24a. 以永保贪婪的名声，此过程中可能有些银子被偷了。</li>\n<li>这在一些中枢官员为胡齐仑案准备的报告中提到。JQSYD, 4:163. 然而，户部的规章与则例中并没有此规定。</li>\n<li>XFFL, 127/18a–20a; JQSYD, 4:347–51. 胡齐仑被处决后，奏报其侵吞的精确数额为八万三千九百六十一两。JQSYD, 4:429.</li>\n<li>1797年陕西解一百零一万两到四川时，发现短缺五万五千零四十两——短缺百分之五点四。四川请陕西补足时，陕西说他们把户部解来的照数转解了。1798年底，北京的二百万两到达时，四川申报短缺十一万三千二百四十多两。1799年初，户部库的三百万两到达时，纳山接款。他用库平从数十箱中取锭称重后，声称那些银锭只重百分之九十六至九十八，所以他收到的是二百九十万而非三百万两。1799年春，纳山接收了陕西早先扣留的四十万两，声称银子重三十八万零七百五十六两——短缺百分之四点八。XFFL, 126/22b–25b, 132/33b–37b.</li>\n<li>纳山本应缴还此数，但福宁与勒保都没有催缴。福宁只把八百两算作短缺了事。XFFL, 132/38a–39a, 139/24b–28a.</li>\n<li>陕西向四川购米时，纳山曾参与向陕西官员交米。XFFL, 335/21a.</li>\n<li>然而，曹相业受查时，其府属知县们都坚称：曹相业按原比例发银时都有短缺。XFFL, 131/30a–34a.</li>\n<li>XFFL, 131/34a–35b. 1800年初江西的三十四万二千六百两到达州时，广兴与后勤人员用库平称重，长出三千一百八十两。广兴把钱入了军费。XFFL, 146/35a–b.</li>\n<li>解达州的七十万两长出三千六百六十九两，解保宁的四十万两长出三千一百二十六两，解成都的九十万两长出四千三百两。长余银并入军费总数。XFFL, 141/12b–14a.</li>\n<li>XFFL, 141/16a–b, 146/37a–b. 1799年秋，嘉庆撤销了对户部库人员\"向四川解款短缺\"的调查。JQSYD, 4:322.</li>\n<li>1801年初，嘉庆提到：短缺只出现在头三年，此后有时只报长余。XFFL, 229/1b–2a.</li>\n<li>XFFL, 81/4a–b.</li>\n<li>XFFL, 120/16a–17a, 20b–21a.</li>\n<li>GZDJQ, 2596.</li>\n<li>XFFL, 93/4a–7a.</li>\n<li>1803年初，吴熊光请求批准给绿营最低阶军官的跟班每月五钱\"盐菜银\"——则例中无此项——他援引的是四川的先例。XFFLXB, 10/39b–40a.</li>\n<li>1797年底，额勒登保弹劾一名后勤官员未能保障其部队供应，朝廷命将该官员罢免、解京受审。XFFL, 55/31b.</li>\n<li>XFFL, 93/5b–6a.</li>\n<li>QSLJQ, 39/25b–26a.</li>\n<li>XFFL, 82/23b.</li>\n<li>XFFL, 90/19b; QSLJQ, 39/18b.</li>\n<li>例如，河南曾给1796年底在鄂北作战的健锐营、火器营送皮裘。XFFL, 23/30b.</li>\n<li>陕西后勤给了他十万两，但他又向四川后勤要四万五千两。明亮辩称：他虽带一千八百名士兵入川，但额勒登保生病时其部队也归他统带。因此他在川时有五千多名士兵——尽管并非所有士兵一直随他。他声称自己没领够应得之数。QSLJQ, 35/14b–15a; XFFL, 82/20b–24a, 85/18b–20b.</li>\n<li>1798年中，德楞泰大声而反复地抱怨四川后勤，同时索取超额经费。福宁试图更严格地发款时，包括德楞泰在内的一些将领抱怨。XFFL, 126/17b–18a. 1799年秋赴鄂时，德楞泰责备倭什布未能按时给他的军队送补给。XFFL, 128/20a. 1801年春，德楞泰痛斥湖北后勤——如第5章所述，这导致倭什布被罢免。</li>\n<li>QSLJQ, 32/8b–9a; 35/2b–3b; XFFL, 80/3b–4b, 80/7a–b, 81/4a–b, 103/8a–9a, 103/14b–15a, 133/20b–28a.</li>\n<li>据福宁说，德楞泰在1798—1799年一年间领了五十三万五千两。魁伦后来奏报：德楞泰所领经费中，五十二万八千八百六十一两用于军队饷银津贴与运输补给，十三万二千二百三十九两是军队借支的军服装备费。XFFL, 133/20b–28a.</li>\n<li>XFFL, 97/1a–5b, 103/8a–11b, 105/1b–2a, 3b–4a, 107/16a–20b, 108/35a–38a, 110/25a–26a. 据谭光典说，德楞泰1798年中入川时有八千多人，其部队通常规模为七至八千人，尽管在川期间某些时点超过一万。XFFL, 133/27b–28a.</li>\n<li>XFFL, 131/10b–12a.</li>\n<li>XFFL, 192/9a–12b.</li>\n<li>勒保与德楞泰说：广兴回京后，一些军队已派往甘肃，一些伤病兵已裁，一些四川驻防兵已回本营、不再由军费发饷。XFFL, 203/22b–27a.</li>\n<li>XFFL, 161/11b–12a, 204/12a–b.</li>\n<li>XFFLXB, 8/26b–27b; SHD, 嘉庆八年三月, 57–58.</li>\n<li>XFFLXB, 10/30b–31b; SHD, 嘉庆八年四月初六日, 37–38.</li>\n<li>XFFL, 135/16b–17a, 344/14b–15a.</li>\n<li>XFFL, 140/6a–7a.</li>\n<li>勒保还用四川的盐茶税报销了这笔开支。XFFL, 138/14b–15a. 1799年春，恒瑞从汉中粮台领了一千两犒军。他认为不够，请求加四百枚银锞与二百五十面银牌——共三百七十五两。XFFL, 135/12a.</li>\n<li>XFFL, 129/20b–22b.</li>\n<li>XFFL, 140/10a–b.</li>\n<li>XFFL, 284/15b–17b, 284/20b–23a.</li>\n<li>XFFL, 288/24a–b.</li>\n<li>户部的裁定，是回应陆有仁起草并提交的一组《军需则例》修订案——其中犒赏只能从\"平余\"军费中支付。XFFL, 344/14a–15b.</li>\n<li>福宁补充说：鉴于旗兵、绿营都作战勇猛、战役正处于关键时刻，他不得不妥协，连则例未准的开支也供给，且帐篷、武器、弹药等项通常多给。XFFL, 90/16b–17b.</li>\n<li>XFFL, 235/12b–15a, 235/16b–17a.</li>\n<li>周国枢是纳溪县的典史。XFFL, 146/32b–34b, 146/38a, 148/22a–23a.</li>\n<li>XFFL, 97/1a–5b, 103/8a–11b, 107/16a–20b.</li>\n<li>XFFL, 138/5b–6a.</li>\n<li>XFFL, 138/14a–b. 广兴不久后重申了这一点。XFFL, 146/33a.</li>\n<li>1801年底，额勒登保与一些陕西官员捐出\"养廉银\"，为额勒登保的部队置办冬衣。他们花二万二千一百五十两，购得一万一千六百五十件棉袄、一千一百件棉衣、四千八百九十五顶冬帽、四千八百七十九条棉裤与四千九百二十四双棉鞋。XFFL, 288/18b–19b. 1802年秋，竹山知县范继昌捐钱为德楞泰的部队备了一千件棉袄、一千双棉鞋与一千双草鞋。XFFL, 336/20a–b. 看来让部队穿暖并不费钱——一个知县闲钱就够买几千件秋衣。</li>\n<li>1799年初，刑部侍郎汪承霈批评将领们有时数月不发士兵与乡勇应得的津贴，却继续请求提高津贴。XFFL, 90/20a–21b. 魁伦到川时，惊讶地发现：解川经费如此之多，士兵却数月领不到饷、装备简陋。如前所述，一些士兵没鞋穿，用牛皮裹脚。XFFL, 114/22a–27a, 116/2b–6b, 126/15b–16b, 133/20b–32a. 车森保1800年初押解高均德进京后向嘉庆奏报：陕西的清军有时缺粮，不得不吃死骡死马的肉。XFFL, 136/39a.</li>\n<li>XFFL, 206/4a.</li>\n<li>QSLJQ, 39/18b, 90/19b.</li>\n<li>XFFL, 126/12b–13a, 126/16b–18a.</li>\n<li>正如额勒登保1804年所说：他1799年底任统帅之前，外省乡勇月饷三至四两。XFFLXB, 28/5a–7b. 乡勇被派往外省作战时，饷银常提高。川陕乡勇被派往甘肃时，其饷银定为每日一钱、即每月三两。NGDK, 1133812. 又见QSLJQ, 172/17b–19a, 183/23b–25a.</li>\n<li>四川方面，每一百名乡勇配二十名领薪民夫。NGDK, 027561.</li>\n<li>1799年底，额勒登保把随征乡勇的月饷定为一点三八两，但给口粮与雇挑夫的津贴（fujia），并把防守乡勇的月饷定为三两、不发口粮。XFFLXB, 28/5a–7b. 同时，湖北乡勇领二两四钱、无口粮。陕西乡勇月领一点四六两、每日口粮零点零一石米。吴熊光请求按陕西模式支付湖北最后两千名随征乡勇。SHD, 嘉庆八年四月十一日, 61–62; XFFLXB, 10/40a–b. 1804年夏，额勒登保与德楞泰请求给最后乡勇加六钱二分、使月饷达二两。嘉庆同意。SHD, 嘉庆九年六月初一日, 51–55. 但1804年早些时候，嘉庆曾驳回类似的请求。SHD, 嘉庆九年四月二十五日, 201–7.</li>\n<li>卢康（Lukang），嘉庆十年三月初十日，NGDK, 113312。</li>\n<li>JQSYD, 11:966. 嘉庆多次重复这一看法。又见MQDA, A318–83。</li>\n<li>湖北负伤乡勇早在1796年夏就获得抚恤。XFFL, 10/24a.</li>\n<li>XFFL, 93/1a–b. 数月后，嘉庆在给战争领导人的另一道谕旨中重申了新政策。XFFL, 113/19.</li>\n<li>1805年，贵州巡抚福庆向中枢政府请六万九千四百五十三两，抚恤从贵州派往战役、或负伤、或阵亡、或伤病死、或失踪的两千二百九十九名士兵、军官与乡勇。他承诺核查是否有人或其家属已在他省领过抚恤、或无家属可领。若有此类情形，他说会在审计时从总额中扣除。福庆，嘉庆十年正月二十二日，NGDK, 115529。这表明双重领取抚恤并非闻所未闻。</li>\n<li>XFFLXB, 3/15b–17b, 3/19a–b.</li>\n<li>MQDA, A301–96.</li>\n<li>吴熊光奏折所引，XFFLXB, 28/20a–b。</li>\n<li>XFFLXB, 28/18b–22a.</li>\n<li>XFFLXB, 28/19b–20a.</li>\n<li>例如，湖北保康纪念阵亡官兵乡勇的祠中列有一千九百四十个名字。《保康县志》（Baokang xianzhi），3/102–13。</li>\n<li>吴熊光，嘉庆九年十二月二十三日，NGDK, 188734。</li>\n<li>常明，嘉庆十六年七月二十日，NGDK, 114654。</li>\n<li>广兴没有透露其名。XFFL, 151/9b–13a.</li>\n<li>卢康（Lukang）等，嘉庆十二年十一月二十九日，NGDK, 109909。</li>\n<li>特清额（Teqing'e），嘉庆十二年二月初九日，NGDK, 41220。</li>\n<li>勒保，嘉庆十二年五月二十七日，NGDK, 64130。</li>\n<li>勒保，嘉庆十一年二月二十五日，MQDA, A318–34。</li>\n<li>他们论证说：许多参与雇乡勇带乡勇者已死或已离去，乡勇被遣散时及此后无人抱怨欠饷。他们裁定：德楞泰拟一份无漏洞的方案再呈。嘉庆支持他们的裁定。XFFLFB, 36/7a–9a.</li>\n<li>方维甸，嘉庆十二年四月初八日，NGDK, 64114。</li>\n<li>JQSYD, 11:966.</li>\n<li>特清额（Teqing'e），嘉庆十二年二月初九日，NGDK, 41220。</li>\n<li>宜绵，嘉庆二年六月（无日），GZDJQ, 2680; 宜绵，嘉庆二年十月十九日，GZDJQ, 3287。</li>\n<li>JQSYD, 12:374–75; 卢康（Lukang）等，嘉庆十三年六月十六日，NGDK, 113812。</li>\n<li>勒保，嘉庆十三年二月二十五日，GZDJQ, 82。</li>\n<li>XFFL, 126/12b–13a.</li>\n<li>JXZL, 户部, 卷4。</li>\n<li>魁伦1800年曾提到此事——他试图用廓尔喀之役的先例论证雇驮畜高费用的正当性。XFFL, 164/30a–32a.</li>\n<li>和珅，嘉庆三年十二月十三日，NGDK, 2052。</li>\n<li>MQDA, A287-114, A287-115.</li>\n<li>XFFL, 6/17a–b.</li>\n<li>XFFL, 21/41a.</li>\n<li>XFFL, 4/1a–2b.</li>\n<li>汪新建议把民夫工钱提到每日二钱、无差使时每日一钱。XFFL, 17/10a–11b, 30/23b–25a.</li>\n<li>XFFL, 30/23b–25a, 48/13b–14a.</li>\n<li>XFFL, 103/8a–9a, 126/13a–14b.</li>\n<li>明亮的粮员田文旭暗示：明亮可能不知道骡与民夫的数量——他从没问过。XFFL, 82/22a, 133/28a–32a.</li>\n<li>XFFL, 133/25b–32a.</li>\n<li>XFFL, 103/8a–9a.</li>\n<li>XFFL, 103/8a–9a, 133/32a–43b.</li>\n<li>XFFL, 66/24a–b, 93/4b–6a, 103/14b–15a, 107/18b–19a, 126/14b–15b.</li>\n<li>XFFL, 126/15b–16b, 130/11a–17b.</li>\n<li>魁伦与广兴指出：《军需则例》规定每百里运一石粮的工价为三钱，他们辩称户部所给\"雇骡每日一钱五分\"之数是金川之役中雇马用的——那些马是地方政府调拨的、而非市场雇用。XFFL, 133/32a–44a.</li>\n<li>额勒登保1800年初必定把此做法带到了陕西。湖北方面，吴熊光1801年采纳。户部拒绝认可时，吴熊光辩称湖北遵循四川先例已有时日。1803年春，吴熊光恳请嘉庆批准。XFFLXB, 10/38b–39b.</li>\n<li>1800年初，广兴奏报：额勒登保与魁伦都没有遵循准则、执行商定的削减。额勒登保让官员全额保留马干、只把\"驮折夫价\"减半。满洲士兵方面，他把马干预减半，但允许全额保留\"驮折夫价\"。广兴责备魁伦与额勒登保沟通不畅。同时，魁伦允许官员全额领马干、所有满洲旗兵全额领\"驮折夫价\"。广兴估计：支付那些津贴的总费用每月将超过十万两。然而，嘉庆站在魁伦一边，无视广兴的抱怨。XFFL, 153/31a–34a.</li>\n<li>1802年初夏，陆有仁奏报：他不得不提高秦岭运米挑夫的工钱。XFFL, 319/15b–16a. 此前，湖北已向军队拨发雇民夫的经费（每一百名骑兵七十名民夫、每一百名步兵五十名、每一百名守兵四十名）。XFFL, 203/26a–b.</li>\n<li>XFFL, 203/26b.</li>\n<li>XFFL, 253/5a–15a.</li>\n<li>1803年底，额勒登保砍掉\"驮折夫价\"，只给官员军官发原\"马干\"；士兵只给足其应配民夫数的雇费。XFFLXB, 23/21b–22a. 然而，额勒登保回京后不久，方维甸1804年初请求恢复额勒登保取消的一些津贴——包括\"驮折夫价\"——因为一些部队仍在行动。嘉庆同意。XFFLXB, 23/21b–23b. 1804年底，吴熊光承诺：本省肃清叛军残部后，废除一切额外津贴——包括给官员军官的\"驮折夫价\"与给士兵的\"长夫\"雇费。XFFLXB, 33/31b–32a.</li>\n<li>自1796年正月起，湖北受起事冲击的地区获准缓征蠲免。1796年豫南一些地区也获准。从1797年初起，川东州县多次获蠲免。房县1796至1799年与1802年获蠲免，1800、1801年获缓征。《房县志》（Fangxian zhi），4/12b–13a。大宁1797至1804年间（除1798年）获蠲免或减免七次。《大宁县志》（Daning xianzhi），3/2b–4a。</li>\n<li>陈锋承认：这方面的记录极少。\"清代'康乾盛世'\"（\"Qingdai 'Kang Qian shengshi'\"），345–46。史家邓斯坦在\"The Finance of Imperial Munificence\"中探讨了蠲免时省政府如何应对收入损失，但没有讨论省以下层级。</li>\n<li>据福宁与英善说，四川省藩库1797年底已空。XFFL, 66/23b–24a. 1798年夏，宜绵奏报：甘肃藩库经费已尽——甘肃出资派两万士兵参战、又出资送十万石粮到四川。XFFL, 73/39b–40a. 1798年底，宜绵与秦承恩抱怨：陕西藩库因蠲免缓征——包括1796年起西安府普免——几乎空了。XFFL, 83/24b–25b. 到1800年秋，陕西藩库已空。XFFL, 204/12a–b. 1800年初，张汉潮突入豫西时，倭什布抱怨：河南已用尽本省地丁与其他税收来弥补预算缺口。XFFL, 85/30b–31b.</li>\n<li>这是广兴揭露的。XFFL, 145/11a–b.</li>\n<li>XFFL, 74/40a.</li>\n<li>XFFL, 110/27b–28a.</li>\n<li>XFFL, 126/20a–b.</li>\n<li>魁伦虽计划从达州局拨二十万两给成都、十万给重庆、十万给顺庆，广兴只同意送十万到顺庆、五万到重庆，并让先福在成都先用省军费垫支。XFFL, 147/3b–4a, 147/29b–32a. 但北京与浙江的八十二万四千五百两到达时，托津拨四十五万四千五百两给成都、十九万给保宁、十八万给达州。XFFL, 168/35a–37a.</li>\n<li>XFFL, 177/1a–b.</li>\n<li>1801年初，广东的二十五万两到达时，十万到达州、六万到夔州与重庆、九万到成都——成都又拨一些给保宁与潼川。北京与浙江的六十万两到达时，十八万送达州、十二万送保宁、三十万送成都。XFFL, 237/24a–b.</li>\n<li>1800年初，一百五十万两（七十万拨陕西、八十万拨四川）经西安时，主持西安军需局的马慧裕恳请把二十万两留在西安——而不是把全部七十万两送汉中——因为他手头没有经费。嘉庆同意。XFFL, 146/27a–29a.</li>\n<li>XFFL, 145/17a–b, 206/4a–5a.</li>\n<li>GZDJQ, 4753; XFFL, 145/10b–11a.</li>\n<li>曾小萍（Zelin）Magistrate's Tael, 26–46。</li>\n<li>GZDJQ, 4753.</li>\n<li>GZDJQ, 4753; XFFL, 145/11a–b.</li>\n<li>GZDJQ, 4753; XFFL, 138/16b, 145/12a–13a.</li>\n<li>GZDJQ, 8042.</li>\n<li>JQSYD, 5:541.</li>\n<li>XFFL, 131/30a–b.</li>\n<li>GZDJQ, 4753.</li>\n<li>GZDJQ, 4753.</li>\n<li>GZDJQ, 4753.</li>\n<li>马鸣銮后来升任开县知县。XFFL, 290/20b.</li>\n<li>1799年中，林俊从当地市场购了六十万石谷。XFFL, 66/22b. 1798年秋，四川收成好时，成都军需局拨款购粮。XFFL, 79/11a. 1799年底，林俊奏报他1797、1798年已购一百六十万石粮补仓。XFFL, 118/30a–31a.</li>\n<li>XFFL, 110/28a–b, 128/31b.</li>\n<li>XFFL, 128/29a–31a.</li>\n<li>XFFL, 128/31a–34a.</li>\n<li>嘉庆还表示：战后四川若确需财政援助，愿意再拨一次。XFFL, 128/33a–34a.</li>\n<li>XFFL, 133/41b–42b.</li>\n<li>1802年春末，勒保奏报：四川军队多年来一直由川南、川西供米——因为川东、川北的储备已用尽。XFFL, 313/22a–23b.</li>\n<li>1796年春，秦承恩在兴安府为湖北难民搭棚供饭。XFFL, 4/4a–b. 大约同时，孙士毅也在四川酉阳赈济湖北难民。XFFL, 4/13a–b. 1796年夏，湖北郧阳府的难民获一个月口粮、修房补贴与种子。XFFL, 11/6a–7a. 1797年春末，英善为达州、新宁、东乡、太平、巴州等上年秋天受起事冲击之地请赈济经费。XFFL, 35/31b–32b.</li>\n<li>勒保后来奏报：他给每个难民每天零点零五石米、零点零三两银。XFFL, 101/10a–b, 110/28b, 110/33b–35a.</li>\n<li>魁伦怀疑：如果军队供应不充足，勒保不可能划出这么大一笔钱赈济难民。XFFL, 116/5b, 126/18b. 广兴也认为勒保会把钱挪作他用。XFFL, 128/29b.</li>\n<li>XFFL, 219/17a–27b.</li>\n<li>XFFL, 24/17a–18b.</li>\n<li>兴安府城1798至1800年间修城墙，据称由\"捐输\"出资——包括兴安知府的四千八百两。XFFL, 165/25b–26b. 达州方面，地方书院汉章书院在战争期间被征用作高官的官邸衙门。1802年，达州后勤主管陈预修缮后，书院重开。陈预与达州其他官员据称捐钱聘师置田。此后数年，书院建筑又经翻修。《达县志》（Daxian zhi），13/17a。1803至1815年任奉节知县的蔡星捐三千多两修文庙。《奉节县志》（Fengjie xianzhi），25/4b。1799至1800年任夔州知府的严朝标，在奉节县城为儒学署建了六间新房。1807年，严的继任者周景福重建之。《奉节县志》（Fengjie xianzhi），6/3b。也有地方士绅发起并出资的情形，尽管不多。例如，他们1797年募五六百名民夫修奉节城墙。随后1798年底、1799年初又组织地方防务——包括用居民捐款造三十门铁炮。《奉节县志》（Fengjie xianzhi），28/35b–36a。</li>\n<li>XFFL, 127/23b–24a. 最高爵位一等公的年俸为七百两、三百五十石米。较低爵位的俸禄递减，最低的三等男为二百六十两、一百三十石米。《钦定户部则例》（Qinding Hubu zeli）1865年版，73/7a–8a。</li>\n<li>XFFL, 133/32b–33a.</li>\n<li>XFFL, 97/8a–b.</li>\n<li>XFFL, 97/8a–9b, 97/10b–11b.</li>\n<li>XFFL, 153/14b, 155/35b–36b.</li>\n<li>SHD, 嘉庆八年七月十六日, 125–28.</li>\n<li>XFFL, 259/24b–29b.</li>\n<li>XFFL, 82/22a–b. 1799年夏，福宁重申这些观点，强调：银锭离开达州、解往军队与地方衙门之后，钱的去向他无法控制——所有州县离达州数百里至数千里，他与勒保只是每十天核查三个局的报告。XFFL, 107/19a–20b.</li>\n<li>XFFL, 112/16b–17a.</li>\n<li>关于此制度的简介，见陈锋（Chen Feng）\"清代前期的奏销\"。关于军费审计，见陈锋《清代军费》（Qingdai junfei），176–89。</li>\n<li>陈锋（Chen Feng）\"清代前期的奏销\"，202, 212–13。</li>\n<li>XFFL, 116/11b–12a.</li>\n<li>XFFL, 229/1a–2b.</li>\n<li>嘉庆七年六月二十一日上谕，NGDK, 171522。</li>\n<li>基于NGDK现存档案的观察。河南与山西因卷入战争较浅，自1798年起已向户部提交军费。</li>\n<li>1803年底，许多战役期间在陕西任职的官员被责令缴还军费。秦承恩被责令缴还十万两。NGDK, 225422. 1805年，查出陕西战场至少七十万两被滥用或侵吞。卢康（Lukang），嘉庆十年五月十二日，NGDK, 108467。</li>\n<li>那些省份包括直隶、甘肃、云南、贵州、广东、福建。</li>\n</ol>", "text": "\n他们知道：成功结束战役，最多不过得五等爵位之一，俸禄有定。这与统兵经过地方时收取成千上万两的厚礼相比，何啻天壤。所以他们被诱惑着留贼养寇，以自肥身家，虚耗国帑以中饱私囊。\n——嘉庆皇帝，1799年\n[译者按：原上谕自英文直译，文言原文待核。（出处见章末注释）]\n\n财政上，白莲教战争对清朝是一场空前的灾难。国家声称其耗费高达一亿二千万两白银——是漫长的乾隆朝最昂贵的战争、第二次金川之役耗费的两倍。到1799年——战争爆发三年后——中枢政府的国库丰盈储备已几乎耗尽，且永远不会恢复。白莲教战争巨额耗费的主因是前线腐败——军事将领与地方官员大胆而熟练地从中枢政府慷慨供给的军费中抽钱。战区发生的一切，使清朝国家18世纪晚期遏制战时开支与腐败的努力化为乌有，也永久损害了清朝国家的财政活力。前线腐败也是镇压这场孱弱叛乱的战役迁延不决的关键因素——侵吞军费的机会驱使将领与地方官员把战役拖着不完结、把叛军残部留着不消灭。乾隆与嘉庆两位皇帝虽然都清醒地意识到财政崩溃的危险，却谁也没能遏制住军费开支。嘉庆的前线改革只持续了几个月，1800年初就流产了。战争余下的岁月里，前线的乱花与侵吞仍在继续，而国家四处搜刮经费，既要支撑战役，又要应付日常国家开支。战争期间的官方档案与战后对军费的审计，揭示了战争财政的机制与动态，以及普遍腐败的手法与模式。清朝国家虽然躲过了财政制度的崩溃，王朝的财政充裕与灵活性却一去不返了。\n经费\n鉴于战争的性质——一种以暴力行使政治权力的方式，其轨迹常由前线的偶然因素支配——准确预算战争开支是困难的。无论现代还是前现代，国家因意外漫长而昂贵的战争耗尽财政资源，都不罕见。然而，白莲教战争的特殊之处在于：叛军构成的军事挑战之低微，与财政代价之巨大，形成鲜明对照。清史上从未有任何一场战争、公共工程或其他事业吞掉过如此巨大的钱款——如清朝国家所声称的一亿二千万两。这个数目是漫长乾隆朝国家年收入（五千万两）的两倍半，约是同期户部年均开支（一千一百万两）的十一倍。^1 然而，令清史研究者遗憾的是，现存清朝档案中没有一份完整账目详载经费的拨发。^2 要重建军费的拨发与分配，只能拼合散见于编修档案与原始档案中的信息。表7.1汇总了作者这一努力的成果。\n表7.1　1796—1804年战场各省的经费拨发（单位：两）\n\n\n\n年份\n湖北\n陕西\n四川\n河南\n甘肃\n总计\n\n\n\n\n1796\n4,500,000\n0\n0\n2,000,000\n0\n6,500,000\n\n\n1797\n8,000,000\n4,000,000\n10,000,000\n1,000,000\n400,000\n23,400,000\n\n\n1798\n2,000,000\n6,000,000\n7,000,000\n800,000\n600,000\n16,400,000\n\n\n1799\n1,000,000\n2,900,000\n7,000,000\n500,000\n1,000,000\n12,400,000\n\n\n1800\n1,820,000\n7,406,000\n3,150,000\n100,000\n2,100,000\n14,576,000\n\n\n1801\n700,000\n3,683,000\n900,000\n0\n0\n5,283,000\n\n\n1802\n1,650,000\n3,400,000\n3,300,000\n0\n0\n8,350,000\n\n\n1803\n600,000\n500,000\n1,250,000\n0\n0\n2,350,000\n\n\n1804\n200,000\n1,200,000\n1,000,000\n0\n0\n2,400,000\n\n\n总计\n20,470,000\n29,089,000\n33,600,000\n4,400,000\n4,100,000\n91,659,000\n\n\n\n资料来源：据附录\"1796—1804年军费拨发\"整理。\n显而易见，各年数字加起来不到一亿二千万。它们也与皇帝明确说过的几个里程碑数字不符：到1797年四月，已向战区拨发三千多万两；^3 到1799年初，七千万两；^4 到1800年，一亿两。^5 然而，表中所列一些省份收到的军费数额，有省级官员奏折的印证，说明表7.1的信息近乎准确。^6 若干因素可能造成了\"所称总数一亿二千万\"与\"表列总数九千一百六十五万九千\"之间的出入。其一，所谓的协济银——从富省所征税款中例行解往四川及其他战场省份的款项——或许被计入了那一亿二千万。鉴于1796年解交中枢政府的白银收入异常之低，很可能除蠲免赋税外，更多收入被留在省里，然后同时拨给了苗疆战役与白莲教战役。^7 其二，战区之外各省供应过境军队、向战役输送给养的开支，可能被计入了总数。那些省份虽不从中枢政府领取军费，但通常请求报销——报销的形式通常是从它们应解京的税款中扣减。^8 其三，整个战役期间，中枢政府一再为受战乱蹂躏的地区蠲免、减免赋税——有些地方多次。一亿二千万这个数字是否把收入损失算进去、当作战争开支，不清楚。最后，皇帝可能被误导，或自己弄错了。从皇帝不同时期关于战争耗费的自相矛盾的说法、以及他的数字常常是粗略的——基于印象而非精确统计——来看，皇帝的不准确是\"一亿二千万\"与档案数字不符的最可能原因。\n一亿二千万两虽然很可能是个夸大的估计，但如表7.1所示，拨往战区的经费总额超过九千一百万两，绝非小数。战后，战役官方方略的编纂者们不得不为开支辩护，论证说：战区地形艰险、叛军游击战术使军需运输不畅，朝廷不得不提前解送大笔经费。然而，他们仍忍不住惊叹此役经费之空前铺张：\"从来军需未有如此之充裕而应手者。\"（原文待核，见注释9）^9\n清朝国家清醒地意识到乾隆朝晚期战时开支失控的危险，曾试图加以遏制。这一努力在白莲教战争中化为乌有。以往的战争中，中枢政府多应前线统帅之请拨发经费，并警惕不让统帅们误导自己。然而，为这场战役供款时，几乎没有谨慎可言——尤其是乾隆主政的头三年。他盘算着：只要全力支持将领们，叛军就会很快被消灭，于是常常在接到将领请求之前就拨款，且总是大手笔——通常是二百万至四百万两。利用乾隆供款的慷慨，前线领导人每次都索要数百万两，有时上一次请款的经费刚到不久就再请。^10\n讽刺的是，中枢政府给得越多，战场省份越容易出现经费短缺。四川在这方面最为臭名昭著。1797年底，应宜绵之请，乾隆又给四川拨了四百万两，使1797年一年拨给四川的总额达到一千万两——约等于乾隆朝中枢政府年均开支。^11 1798年春四百万刚到四川，英善与福宁又请四百万两——因为新到的经费已快用完。乾隆别无选择，只能再批四百万。^12 然而，新的四百万两比上一笔也撑不了多久。1798年夏四百万到达才两个月，福宁又请四百万两——只剩约一百万，只能撑两个月——至少福宁这么说。这一次乾隆犹豫了，没有批准，而是劝勉四川领导人们迅速收束战役。然而，勒保、英善与福宁不久联名再请，重申需求的紧迫——包括战后重建——福宁又同时另上一折详述供军的困难，乾隆让步了，批了三百万，同时再次斥责他们没有了结战事，并警告下次不会如此大方。^13 生命最后几个月里，从数百万两的请款中砍掉一百万，已是乾隆为省钱所能做的最大努力。^14\n四川对付区区几万名起事者，真的需要如此巨额经费吗？1800年初——嘉陵江之败之前——广兴估计：十万到二十万两就足以支撑四川所有部队一个月。即便把最昂贵的开支算进去——运输给养与乡勇饷银——广兴估计四川一年也只需要三百万两。^15 主持达州军需局的短暂任期内，广兴设法大幅削减了开支，尽管令许多人沮丧。^16 1800年的乡勇人数虽然少于头三年，各项开支之间的巨大落差证明：1797至1799年间四川存在大规模侵吞——那段时间至少有二千四百万两在四川蒸发了。\n战役初期，乾隆在花钱上粗心大意，有时近乎鲁莽。如第1章所述，他常常给参加某场战斗——只要被奏报为胜利——的所有部队赏一个月饷银，有时赏两个月。旗兵每人赏银高达一百两，军官数百两。赏一月饷银的做法过去用过——例如第二次金川之役——但从未如此慷慨。大手笔的犒赏事实上打消了军队迅速结束战役的动力——战争拖得越久，犒赏的机会就越多。由于部队常常跨省调动，那些一月饷银的犒赏很可能被领了不止一次——既在驻地领，又从本省军需库领。^17 然而，从1797年春末起，朝廷全面赏一月饷银越来越罕见。很可能，国库经费的快速流失与御史宋澍\"将领们借战争邀功请赏\"的批评起了一些作用。^18 此后，一月饷银的犒赏只留给擒杀叛军首领之时与战斗中负伤者。^19\n头三年漫不经心的花费，造成了清史上国库银储备最急剧的下降。庆祝乾隆退休的普免钱粮加重了财政负担。按计划，蠲免在嘉庆朝头三年——1796至1798年——实施。因此，中枢政府在应付空前军费的同时，其收入因蠲免下降了至少三分之一。1796与1797年，大部分军费从\"内库\"（Neiku）——户部两库之一——拨发。内库储备通常充当应急经费，很少用于日常开支；中枢政府官员的俸禄与京城全体旗兵的饷银通常从另一库——\"外库\"（Waiku）或\"部库\"（Buku）——拨发，那是户部的主库。^20 两年间——从1796年四月到1798年底——从内库拨给战役二千七百八十万两。从1799年起，只拨部库的经费。显然，内库储备已近枯竭、甚至空了。^21\n到1796年底，乾隆朝累积在部库里的近七千万两白银已缩至五千六百六十万两。1797年，从北京拨给战役至少二千一百四十万两。同时，仍在向收尾阶段的苗疆战役拨款。加上日常开支，1797年共拨出三千五百多万两——清史最高纪录。此前此后，中枢政府的年开支从未达到三千万两的门槛，超过两千万两的年头也只有寥寥几次。结果，部库银储备1797年降到二千七百九十万两。到1798年底，只剩约一千九百二十万两——17世纪末以来的最低点。^22 最重要的是，部库巨额储备的流失被证明是永久性的。嘉庆朝余下的岁月里，银储备从未远超三千万两。随后的道光朝（1821—1850），储备在一千万至三千三百万两之间波动。^23 王朝的财政黄金时代就此终结。风烛残年的乾隆在最后的日子里亲眼见证了它。（图7.1）\n父亲死后，嘉庆在最初的几道谕旨中说：这场战役已花费七千万两，他深感不安。^24 然而，他没有解释七千万两这个数字是怎么来的。如下面表7.2所示，头三年，至少四千三百二十万两从户部库解往战役。同时，国库还支付中枢政府的日常开支（乾隆朝年均一千一百万两，三年三千三百万两）与苗疆战役。或许嘉庆把三年间户部库拨出的总额七千八百九十万两误当成了解往白莲教战争的经费总数。当然，国库仅仅三年就拨出七千八百九十万两，这本身就令人警觉，^25 它几乎是乾隆朝年均开支的两倍半。嘉庆的不安是有道理的。^26\n表7.2　拨往战区的经费来源（单位：两）\n\n\n\n年份\n户部库\n内务府库\n各省\n关税\n商人捐输\n监生捐纳收入\n盐课\n不明\n当年总计\n\n\n\n\n1796\n6,000,000\n0\n500,000\n0\n0\n0\n0\n不明\n6,500,000\n\n\n1797\n21,400,000\n0\n2,000,000\n0\n0\n0\n0\n不明\n23,400,000\n\n\n1798\n15,800,000\n0\n600,000\n0\n0\n0\n0\n不明\n16,400,000\n\n\n1799\n8,900,000\n400,000\n500,000\n1,000,000\n1,600,000\n0\n0\n不明\n12,400,000\n\n\n1800\n6,000,000\n1,300,000\n5,126,000\n550,000\n1,200,000\n400,000\n0\n不明\n14,576,000\n\n\n1801\n400,000\n200,000\n1,800,000\n0\n1,033,000\n450,000\n1,400,000\n不明\n5,283,000\n\n\n1802\n200,000\n0\n3,071,540\n1,250,000\n1,500,000\n938,460\n1,050,000\n340,000\n8,350,000\n\n\n1803\n0\n0\n0\n0\n1,950,000\n0\n0\n400,000\n2,350,000\n\n\n1804\n0\n0\n100,000\n1,500,000\n400,000\n200,000\n200,000\n不明\n2,400,000\n\n\n总计\n58,700,000\n1,900,000\n13,697,540\n4,300,000\n7,683,000\n1,988,460\n2,650,000\n740,000\n91,659,000\n\n\n\n资料来源：据附录\"1796—1804年军费拨发\"整理。\n然而，嘉庆从未公开批评父亲头三年的挥霍。他也没有为此归咎和珅——和珅众多\"罪状\"中没有一条与向战役拨发过多经费有关。但他决心削减开支。在改组战争领导层、开启短暂前线改革的同时，嘉庆废除了父亲大量使用的\"赏一月饷银\"做法。相反，他开始给部队颁发一两与五钱重的银牌（yinpai）——需要犒赏时。起初，他向每个重量各送五百面到前线，把受赏人数限制在一千人。后来每个重量送二百面、甚至一百面。最后，他掺入一些银锞（yinluo）——每枚不足五钱。结果，他把犒赏的费用从数千乃至数万两降到七百五十两，再到三百两，再到一百五十两或更少。\n一如他的典型作派，嘉庆在削减开支与\"为换取速胜而大手笔花钱\"之间不断摇摆。更常见的是，他刚表达削减开支的决心，就补充说：只要有助于迅速收束战役，他不介意高昂的财政代价。他甚至说：战役所需时，愿意违反后勤规章、支付超过则例所许之数。^27 他虽担心巨额开支与违反后勤规章招致批评，却盘算着：一场迅速的最终胜利足以让批评噤声。^28 正是这种心态促使他在1800年初转变了对受雇乡勇的态度。^29 得知叛军渡嘉陵江那天，他告诉额勒登保：不必\"顾及财政代价之高。贼匪早灭一日，所省之钱甚巨；若迁延数日，终将多费更多钱\"。^30 战争余下的岁月里，这一点被一再重申。^31\n结果，1800年白莲教战争的总开支为一千四百六十万两，比1799年的一千二百四十万多出二百一十八万。鉴于嘉庆缺乏决心，他无力把战争财政从父亲主持下设定的路径上扭开，也就不足为奇了。与乾隆一样，嘉庆被不断的巨额请款所淹没。有时，战场各省督抚还想方设法加大对他的压力。他们告诉他已向当地商人借钱时，嘉庆不愿盘剥民众，就批准请求，并催促他们经费一到就还钱给商人。^32 督抚们还声称已向本省藩库或邻省借钱，以推进其请款。^33 另一个方便的借口，是奏报叛军攻击已恢复太平之地，向朝廷示警。1799年徐天德突入湖北时，倭什布夸大危险，请求一百万两边防经费，立即获准。^34 1800年初，湖北又以数千叛军侵入为由请求八十万两。嘉庆虽恼怒，仍批了四十万两。^35\n起初，嘉庆对派往战争的新领导人——如松筠与魁伦——寄予厚望，希望他们能刹住过度的前线开支。^36 然而，新领导人们没有魔杖可以瞬间改变前线文化。他们也频频请款。^37 中枢政府收紧钱袋时，三个战场省份为经费相互竞争。在陕西，松筠一再扣留拨给四川的经费中过境的部分。^38 台布从松筠手中接管战争后勤后，也效法松筠截留四川的经费——因为陕西的军需库空了——但他的请款并不总获批准。^39 到1800年春末，陕西共截留了拨给四川的一百七十五万两。毫不奇怪，四川大为光火。广兴大声抱怨：陕西不截留，四川的经费本会充足。^40 新领导人们争抢经费耗尽了嘉庆的耐心与信任。嘉庆不止一次批评松筠与台布截留四川的钱，指责他们\"以邻为壑\"（yilinweihe）。^41 松筠被罢免仅半年后，台布也被打发走了。然而，1801、1802年，他们的继任者继续截留四川或甘肃的经费——包括普通的\"协饷\"。结果，嘉庆不得不定期给陕西拨款。1799与1800年，嘉庆总共向战役拨了约二千七百万两。1801至1804年，又给了一千八百四十万两。与乾隆掌舵头三年拨的四千六百三十万两相比，年耗费下降了。然而，嘉庆接手后军事行动的规模已经越来越小，四千五百四十多万两的开支几乎说不过去。\n与\"一次批数百万两连眼都不眨\"的乾隆不同，嘉庆没有这样做的本钱——他面临的财政状况严峻。1799年之后，嘉庆很少一次拨超过一百万两。从1800年起，他一次拨款不得不动用不止一个来源。乾隆主持下，头三年的军费大部分出自户部库。嘉庆起初也如此。1799年，他从户部库拨了八百九十万两给战役。然而，1800年，只从户部库拨了六百万两——比上年大幅下降——另有八百六十万两来自其他来源。1801年夏，北京及近畿连降暴雨数日，永定河决口。救灾与修堤进一步加深了国家的财政困境。部库储备进一步降到只剩一千六百九十万两（见图7.1）。1801年，户部库最后一次向战争拨款，只有四十万两。^42 1799至1801年，嘉庆还从内务府库——广储司（Guangchusi）——拨款，但总额只有一百九十万两。1801年之后，拨给战役的所有经费都来自京外来源。^43 数以百万两计的银锭由北京解往中原的大队人马景象一去不返，而其他省份与战场省份之间的钱款往来成倍增加——嘉庆转向各省与私人部门来支撑进行中的白莲教战争。（表7.2）\n京外来源的钱款来源多样。从1800年起，嘉庆用盐课与内地关税支付战役。1801至1804年，二百六十五万两盐课从盐政衙门解往战区。还从全国几个税关解去四百三十万两关税。盐课与关税合计六百九十五万两，属于中枢政府的收入；而更大一部分经费来自动用省库。1799至1804年间拨发经费的约百分之二十三——一千零六十多万两——来自各省。整个战争期间，至少有二千三百七十万两取自这一来源，其中百分之七十七以上是在嘉庆主持下。清朝，省级收入——以地丁税为主——的很大一部分不解京，而是留在各省支付行政开支、供养驻省军队。^44 一些较富的省份还有义务向收入不足以应付自身开支的省份解送\"协饷\"。战争或重大工程时，\n中枢政府向各省索捐也很平常。这场战争中，数省不得不从本省\"封贮银\"（fengzhuyin）中掏钱，执行皇帝\"支援战役\"的命令，尽管也动用了其他经费——包括存储于各省的中枢政府收入。\n除供应过境军队、向战争输送给养的开支外，各省并不能总把解往战争的经费从以后年度应解京的收入中扣减。弥补财政缺口，得各省自己想办法。有些省份设法挡开北京的要求。1800年初，山东与河南告诉中枢政府：经费已尽，无法再履行向陕甘解送\"协饷\"的义务。^45 年中，江苏、安徽与浙江也奏报藩库枯竭。^46 河南18世纪在国家财政平衡中一直扮演重要角色——它地丁收入大、供养的驻军又少——^47 却先受叛乱冲击，又卷入供应过境军队与运输队。河南无力或不愿再出钱，嘉庆便用山西来顶替。\n凭借可观的收入与繁荣的商业——包括与蒙古、俄罗斯利润丰厚的边境贸易——同时驻军也少，山西成了中枢政府与战场省份寻求资源时的自然之选。^48 1798年夏，乾隆命山西、河南从新征税收中各拨三十万两给甘肃作军费——乾隆不打算报销这笔钱。^49 嘉庆接手后，战场省份频频向山西索捐，总能获皇家批准。同时，嘉庆自己也一再向该省开口。^50 在从战区之外各省提取的全部经费——一千三百七十万两——中，超过百分之五十（七百万两）来自山西。除白银外，山西还向战争输送粮食。^51 嘉庆不便把经费直接交给战区后勤大员时，就把山西当作他拨给战役经费的储库。^52 但从1802年初起，这一职能由河南接替——河南那时已脱离战事数年。^53 1802年春，山西或许已到了财政能力的极限。嘉庆命山西送二十万两给陕西、不久又命再送一百万两给四川时，山西踌躇了；巡抚伯麟通知陕西：他得等征够税收才能解款。^54 这成了对山西的最后一次此类要求。1802年之后，随着军费减少，各省不再被索款，尽管它们继续向战役输送粮食与其他物资。河南再次首当其冲地承担实物征调。^55\n从私人部门筹集的款项中，两个来源在战役后期地位突出：售卖监生（jiansheng）头衔的收入与商人的捐输，合计约九百七十万两——占1799年以来拨给战争全部经费的百分之二十以上。售卖头衔是近乎常规的生财之道，清朝太平时期也举行。除中枢政府外，嘉庆允许各省售卖头衔以补充枯竭的藩库。四年十二月十五日，嘉庆批准了户部草拟的各省售卖监生头衔的方案。^56 结果令人瞩目。广东到1800年八月已筹得三十九万一千六百两。广东请求把售卖再延长一年时，嘉庆欣然批准。^57 不久，山东也以本省响应热烈——已筹三十四万一千两，远超二十五万两的目标——获得一年延期。^58 1800至1804年四年间，这笔收入共有近二百万两解往白莲教战争。^59\n众所周知，国家急需现银时——如战争或大型公共、皇家工程——清朝国家会积极动用商人财富，形式是所谓的\"商捐\"（shangjuan；亦称\"报效\"，baoxiao，字面义为\"贡献\"）。那些场合，商人们被敦促捐款，尽管其中一些人不待吩咐就知道何时该出手。^60 1799年春，直隶的一群盐商捐了六十六万两，山东的一些商人捐了三十四万两。显然，两拨人被协调成凑出一百万两的整数。嘉庆每组各接受百分之六十——直隶商人三十九万六千两，山东商人二十万四千两。^61 此后，越来越多的商人提出\"捐输\"。^62 嘉庆知道山西富商众多，1800年初几次写信给伯麟，让他\"劝说\"一些富商捐款。然而，为凑齐他向皇帝承诺的二百万两，伯麟发动了一场向全民摊派的行动——给所有州县设定额。一些未能凑够钱的商人被关押殴打。听说商人们的投诉，嘉庆训斥了伯麟，命他召回其爪牙。然而，山西官员对居民的勒索并没有完全停止。^63 1799至1804年，商人\"捐输\"中共有七百七十万两拨给了战役，但他们的捐输总额可能更大。^64\n除白银外，还从战区之外征调其他物资。这包括粮食、武器（弓矛等冷兵器，以及鸟枪、大炮等火器）、弹药（包括铅、硝石等火药原料），以及马、骡、骆驼等牲口。最大宗的是粮食——主要是米——从河南、湖南、江西、江苏、安徽、甘肃、广东与广西运来。战役开始时，动用的是战场内外\"常平仓\"（changpingcang）——全国各地设立的官方义仓——的存粮。然而，那些粮仓很快空了——有些没有维持规定的储备，有些储备已解往苗疆战役。18世纪四川一直向其他地区大量出口余米，但到世纪末，人口过重的压力已侵蚀了这一优势。^65 白莲教战争开始后，四川战乱地区及其附近的仓储备最先耗尽。全省范围，到1798年夏只剩总储备的百分之二十三——主要在本省西北、西南的边缘地带。^66 此后，四川不得不请求外省运粮支援战役，尽管收成好的年份——如1798、1799年——也努力补充粮仓。^67 直到战争最后阶段，四川才重新成为供应者，向陕西运米。^68\n冲突开始时，陕西是物资的给予者而非接受者。1797年初宜绵入川时，从陕西向四川送去了米、麦、豆与弹药。^69 这很快就变了。从1797年晚些时候起，襄阳起事者经陕入川之后，陕南成了主战场。越来越多的清军开赴陕西——1800年初有十万士兵与乡勇——对粮食的需求激增。到1800年春，陕西仓储备已经用尽。^70 粮荒日益严重，把粮价推到极高。^71 1800年，陕西几次从外省购米，每次数十万石。^72 战争余下的岁月里，陕西继续依赖外粮——尽管士兵与乡勇的人数在递减。^73 湖北状况虽好——只有西北角不断受战事影响——也需要外粮。有时，湖北截留经汉江运往北京的漕粮，也拦截他省运往陕西的米。^74\n整个战争期间，运往战区的米、麦、豆很可能不少于一百万石，而三个主战场省份粮仓用米三百五十万石。^75 通常，运输费用超过粮食本身的价钱——尤其是运进秦岭的物资。为控制运输开支，嘉庆在1800年底的谕旨中命军队米麦兼收，并自带一部分口粮，不要完全依赖后勤队伍。^76 战役收尾阶段，陕西改从川北而非河南购米，以省运输费用。^77 然而，谁来支付粮食与运输的费用，是个复杂的问题。朝廷命外省运粮入战区时，各省可能从以后年度应解京的收入中扣减费用。但是，战场省份督抚向他省请粮时，通常用军费支付运输。有时，他们也支付那些省份补充粮仓的费用，但并非总是如此——这不总是清楚的。为查明这项工程的总花费，户部1802年秋提议对这场战役消耗的粮食进行一次审计。这注定是极其艰难的过程，嘉庆把户部建议的两个月期限延到四个月。^78 然而，这道命令似乎没有被执行或完成。至少，购置（包括补充粮仓的费用）与运输粮食到战区，必定花了几百万两。部分费用可能已由拨给战场省份的军费覆盖。其余部分——仍是个未知数——可能在拨给战争的九千一百六十五万九千两之外。\n后勤\n清朝，文官系统例行参与战争中的军事支援。省级官员常常被任命为战争的统帅或后勤主管。白莲教战役中，战场各省历任总督都奉命主持军事行动或后勤。他们与军队将领一起构成事实上的前线当局，就战役进展与战争财政联名奏报。同时，从省到县的文官也被动员起来支援后勤。其一，知府、知县——包括候补者——与书吏被招募充任临时军需局（Junxuju）的职员。军需局成型于雍正朝对准噶尔蒙古人的战争，负责收发军费、雇平民充当挑夫向导、主持修桥筑路以便军行或毁之阻敌。军需局的构成没有固定格式。有时，它不过一名主管加几名助手，尽管通常受总督或巡抚的密切监督。^79 冲突涉及两省时，两省的后勤人员相互配合。此外，战区所有其他地方官府人员都有义务在本辖区支援战役：运送给养、维护通信线路、安置伤病士兵、接待过境的后勤运输队与委员、组织乡勇、筑堡、保城守卡、赈济安置流民与前起事者。这些负担虽然沉重，也代表着机会。\n1796年初首当其冲的湖北，率先建立了后勤网络。毕沅主持下，在荆州、郧阳、襄阳与武昌设了四个军需局。前三个靠近热点，省城武昌的那个负责采购弹药、给养与经费并运往前线。毕沅在当阳指挥围城，便任命自己的门生主持各军需局。起初，候补道台双庆担任湖北后勤主管。然而，毕沅很快以襄阳知府胡齐仑取代了双庆。胡齐仑治下，襄阳局成了湖北战场的后勤神经中枢——尽管该局只有胡齐仑与一名助手两人，局的办公室与仓库就设在胡齐仑自己家里。^80 由于湖北的战事断断续续，一些军需局关了又开。^81 战役最后阶段，宜昌、房县与襄阳充当后勤中心，武昌局继续运转。^82\n随着叛乱蔓延到更多省份，河南、陕西、四川与甘肃都设立了后勤机构（表7.3）。河南方面，1796年初，景安任命南阳知府完颜岱监督后勤。^83 1797年初襄阳起事者赴陕之后，河南大体脱离战事，该省的后勤运作有限，主要服务过境军队。与河南一样，甘肃只在1798至1802年间东南角被起事者侵入时才卷入冲突。只在省城兰州设了一个军需局。陕西方面，秦承恩头三年主持后勤。1799年中松筠接手时，汉中的军需局充当陕西后勤总部，另有兴安府与西安两个军需局。四川方面，达州、保宁与成都设了三个军需局。^84 三者之中，达州局最重要——它经手拨给四川巨额军费的大部分——因此被称为\"军需总局\"（Junxu zongju）。远离前线的成都局主要负责采购粮食、军服、弹药、马匹等，通常不参与向军队分发经费、向乡勇民夫发饷。^85\n表7.3　战场各省后勤领导人\n\n\n\n湖北\n陕西\n四川\n河南\n甘肃\n\n\n\n\n毕沅、汪新，1796—1798\n秦承恩，1796—1799\n英善，1796—1798\n景安，1796—1798\n杨揆，1797—1799\n\n\n景安，1798—1799\n松筠，1799—1800\n福宁，1798—1799\n倭什布，1798—1799\n广厚，1799—1801\n\n\n倭什布，1799—1800\n台布，1800—1801\n魁伦、广兴，1799—1800年初\n吴熊光，1799—1801\n王文涌，1801—1804\n\n\n吴熊光，1801—1805\n陆有仁，1801—1802\n托津、广兴，1800年春\n颜检，1801—1802\n\n\n\n\n祖之望，1802—1803\n勒保，1800—1805\n马慧裕，1802—1805\n\n\n\n\n方维甸，1803—1805\n\n\n\n\n\n\n资料来源：据XFFL、GZDJQ、QSLJQ、NGDK等处相关记载整理。\n在军需局与战场之间，粮台（liangtai）——由知府或知县主持——星罗棋布于物资运输的路线上。^86 四川方面，达州局之下，在营山与忠州设了两个总运台（zongyuntai），各自辖一串中转站。^87 1797年夏，襄阳叛军入川、战场扩至开县时，新宁与东乡设了新粮台。由于当地无足够的精壮可雇，清军带来的民夫被用来充实那些粮台。宜绵任命江西督粮道陈兰森——德楞泰从苗疆战役带来的——与陕西按察使先福——惠龄带到四川的——监督那些新粮台。^88 使用外地——特别是北京来的——官员、更多时候是候补官员，充任军需局与粮台职员，在整个战役的所有战场都是惯例。到1799年，战区后勤网络中雇用了众多外地人。^89 他们继续到来，直到战役最后阶段——那时他们还被派去监督筑堡。\n《军需则例》虽规定两站间距为一百里，这规则并不总被遵守。以山区地形与邻近叛军攻击危险为由，四川常常每六十至七十里、甚至四十至五十里就设一处粮台。战役早期，大多数粮台雇数百至一千名挑夫，但少数大粮台有数千名挑夫——如达州附近的重要粮台文重溪。^90 在陕鄂两省，水位够高可以通航时，汉江也被用作陆路之外的运输线。^91 运输路线被起事者阻断时，后勤人员有时把银锭分给乡勇或民夫，经便道送交军队。^92 然而，嘉庆对这种危险的办法皱眉——银子很容易丢失。他偏爱一种办法：后勤机构在叛军常出没之地附近预先囤粮与其他给养。当地居民在山顶修了更多堡寨时，堡寨也被用来储给养。^93\n与以往的战争一样，这场战役需要庞大的军事民夫队伍，为军队运送给养弹药、从战场抬下伤员。由于军事民夫队伍是乾隆朝诸战争所有开支中最昂贵、最易滋弊的一项，《军需则例》细致规定了民夫的报酬，几乎没留下操纵空间。^94 然而，白莲教战争中，那些规则很快被突破。在湖北，民夫被多付——尽管细节不清楚。在四川，民夫起初按《军需则例》的标准付酬。他们受雇时都领\"安家银\"（anjiayin）——一次性安家费——与盘缠；受雇期间领口粮与工钱（没有差使或出勤归来时只领口粮、不领工钱）。每三十名民夫搭一座棚。随军行进的民夫，每十人配一顶帐篷。^95 然而，民夫队伍的规模迅速而大幅地增长。正如1797年初在川北协调后勤的秦承恩所解释的：大巴山小径狭窄陡峭，无法使用牲口。挑夫每人只能背两斗米，其中一半自己吃掉，两万军队就需要两万挑夫。^96 到1797年初夏，大批清军会聚川东北时，据说雇了近十万民夫。^97\n白莲教战争的一个新问题，是军事民夫队伍的人手长期短缺。不仅条件危险、有时危及性命，^98 而且精壮男子宁愿加入乡勇——待遇更好。^99 为吸引人加入民夫队伍，后勤当局不得不提高工钱、加甜头。^100 战役开始后不久，军队雇用了所谓的\"长夫\"（changfu）——长期附属于军队的民夫。这是违反则例的；使用长夫被证明是这场战役最昂贵、问题最多的开支之一——下文将考察。\n随着战役推进，军需局的作用显著下降，将领们更多地依赖\"随营粮员\"（suiying liangyuan）处理后勤需求。起初，那些粮员——大多是低阶文官——由军需局派往军队充当联络。然而，将领们很快更喜欢品级更高的官员充任此职——因为军队移动时，他们要与知县及地方社会打交道。1799年底，魁伦派知府李鋐到额勒登保处，替换他原来的粮员崔特峰——崔只是个州同。1800年初额勒登保赴陕后，陕安道道员朱勋成了他的粮员，一直当到战役结束。^101 至于后勤需求格外苛刻、甚至刁蛮的德楞泰，派对人去替他办事最为关键。1800年春德楞泰从陕西回川后，与勒保一道请求起复石作瑞——他已被魁伦罢免并立案查办。石作瑞洗清罪名、复职后，德楞泰任命他为自己的粮员，替换通判吴文森——吴品级低，权威不足。^102 1802年春德楞泰赴鄂时，吴熊光派陈兰森——他曾侍奉德楞泰，时任湖北道员——在德楞泰留鄂期间充当其粮员。^103\n粮员承担了大部分工作，省级督抚便倾向于撤销军需局。1800年勒保回川后，重建了后勤机构。他无视嘉庆\"托津、广兴回京后为达州局任命新主管\"的指示，反而在夏末把保宁、达州两局都撤销了，任命在达州局工作过的永宁道道员陈预主持川东后勤、李鋐主持川北后勤。结果，只有成都局收发军费。正如勒保所论证的，这一变动省了达州、保宁两局的运转费用，且只设一局使军费审计更简单。^104 毫无疑问，这一安排使四川省政府更能从军费中取利（战役最后阶段勒保驻节成都）。湖北战场，1801年吴熊光出任总督后，把襄阳局改为武昌局的分支，派道员张道源主持襄阳局，并命湖北所有知县与粮员向张道源汇报。^105 陕西战场，后勤机构更加集中。历任总督驻节汉中——陕西后勤总部——对军费与后勤严密掌控。可以说，到1801年，军需局已被边缘化；督抚们对本辖区后勤事务的监督更紧密、更直接了。\n漏洞、滥行与侵吞\n把战时后勤外包给文官系统与地方社会，证明了清朝国家动员广泛社会层面支援军事行动的能力。然而，临时性的后勤制度注定昂贵——国家得为平民提供的服务付钱。不仅开支容易失控，这个制度还产生了众多漏洞，成为腐败的沃土——乾隆朝诸战争已经暴露了这一点。白莲教战争中，不仅被《军需则例》禁止的旧做法死灰复燃；新的滥行也出现并蔓延开来。乾隆虽然不时斥责前线官员浪费军费、表达对王朝财政健康的关切，^106 但他死后，嘉庆才不懈而反复地痛击前线腐败。嘉庆批评将领们用军费宴饮娱乐、招\"歌童舞女\"（getong wunü），并指责福康安立了坏榜样。他说：\"将领们皆效法福康安、和琳之行径，饮食歌舞，\n在军中饮酒作乐。我很清楚，他们用的是国家的钱来支付自己的享乐。\"^107 他还清楚：京城官员渴望被派往战区；回来时，原先家产微薄者都成了暴发户，许多人赶回家乡用从前线带回的钱置办田产。^108 证据表明，他的话并非夸大。\n然而，现实更加复杂。滥行与侵吞的机会多种多样，有些是公开的，另一些则微妙而隐蔽。文武两套官僚都参与了对战役慷慨经费的蚕食。局外人——如中枢政府的官员与御史——总是认定军费被大量窃取；而局内人——包括一些被派往前线之前自己就是批评者的人——有时却为那些违规滥行辩护，称其必要。多亏嘉庆短暂的前线改革，1799与1800年的一些奏折——尤其是魁伦与广兴这两位直言改革者的——详细揭露了战争财政乃至整个清朝财政制度的漏洞与弊端。还有助于拼出前线腐败马赛克的，是旷日持久的军费审计记录。下文或许不是一幅完整的图景，却包含了这场战役中乱花与侵吞的主要成分。\n借\"短平银\"侵吞军费\n和珅被清除后的短暂沸腾期里，御史谷际岐在一道奏折中痛切地哀叹前线腐败：\"数年以来，拨发军费数千万两。前线军中，妇女、绸缎、珠玉等宝物充盈，而士兵口粮却常常短缺。不义之财解送回家时，道路上车马络绎，蔚为壮观，以致有讽刺之言：'与其拨发经费[银锭]，不如直接开写会票（huipiao）[给将领们]。'\"（原文待核，见注释109）^109\n谷际岐说得对：如果相当一部分经费与货物最终被送回将领官员们——他们许多人在北京——家中，那么费那么大劲把数百万两银锭运到战区有什么意义？路途遥远——北京经费到四川要走三个月——姑且不论，运输队通过眉县与汉中之间狭窄曲折的山间栈道尤为艰难。每个木箱装三千两银子，用两根杠子架在一对骡子上，而栈道有些路段两骡无法并行，那些路段就得雇挑夫扛箱，之后再重新装上骡背。尽管辛苦，军费以银锭而非会票解送这一事实，给了前线官员侵吞经费的第一道门户。\n众所周知，不同的秤常导致银子重量的出入。这些出入在清代成了官员灰色收入的一大来源。征税时，知县以\"补足缺耗\"为名征收臭名昭著的\"火耗\"（huohao）。^110 然而，中枢政府向各省发银、经费在各省之间转运时，利用银重出入的机制不同。接收端的官员声称经费短重——或全额声称短缺、或短缺不如所称——便可把一部分银子装进腰包，或放进他们的应急小金库，用于官方预算无法覆盖的项目。所称的重量短缺被称为\"短平银\"（duanpingyin）。当银子的实际重量多于拨发之数时，多出的部分——所谓\"长平银\"（changpingyin）——或可被侵吞，或存为应急金，称为\"平余\"（pingyu），以补充常规预算。^111 白银从京城流向各省、或在省际间流动，此前很少达到白莲教战争这样的规模，因此短平银从未像\"火耗\"那样引人注目。然而，这场战役解运了数千万两，短平银的一个小百分比就意味着巨额金钱——有时，百分比还不小。\n清朝国家努力保护军费在运输交接中不被抽走。它常常派一两名大员加宫中侍卫护送运输队到达目的地——广兴就执行过两次这样的任务。沿途各省派官员护送运输队通过本辖区。省界上，两省官员不开箱称重，在每个箱子上标出毛重。^112 运输队到达目的地时，所有箱子当着参与交接各方的面打开，从每箱中取几锭称重，以确定银锭是否足色。为准确称量，户部通常在运输队中附上自己的秤——所谓的\"库平\"（kuping）。然而，交接时并非每一锭都称重，这给后勤人员以\"短平银\"为名侵吞经费留了余地。\n官面上，经费从户部库等处拨发给战争时，不允许短缺。私下里，后勤人员向军队发饷或采购物资时，可以扣留百分之一作为\"平余\"。^113 然而，这一做法很快在白莲教战争中被滥用。始于湖北。毕沅主持下，胡齐仑把比例从百分之一提高到百分之四，再到百分之八。他在审讯中虽然坚称银子到达湖北时明显短重——即短缺百分之四至八——胡齐仑后来承认：他需要经费犒赏湖北战场的军队，也需要弥补市场采购时市价与《军需则例》定价之间的差额。除那八两外，胡齐仑还从每一百两中另取二两自肥。换言之，经胡齐仑之手的军费，有百分之十以\"短平银\"之名被他扣留。鉴于胡齐仑经手的经费超过四百二十万两，他被捕时家中搜出五万两，他的账册又记录了近十万两非法送给将领的馈赠，他侵吞的总额可能有数十万两。然而，胡齐仑只承认侵吞了近十万两（扣留百分之八军费得七万多两，另扣百分之二得二万九千多两）。^114\n四川战场，1799年魁伦与广兴接管战争财政之前，军费一直被悄无声息地例行以\"短平银\"为掩护侵吞。北京或外省经费一到，就一再宣布短缺。然而，历任后勤主管——福宁、英善与勒保——并不立即奏报短缺。外省解款时，他们也不一贯要求补足差额。通常，北京的经费在神宣驿——川陕大道进入四川的第一个驿站——交给四川的后勤人员。通常，派通判纳山去接款。^115 纳山常常奏报收到的经费短缺，他自己可能也拿了一些。有一次，除所称短缺外，经费到达达州时又蒸发了近八百两。当然，纳山不承认任何侵吞，归咎于所用之秤不准。^116 魁伦接手后，与广兴一道罢免并审讯了纳山，责令他缴还八百两，并请刑部议处。他们还怀疑福宁与石作瑞是同伙，试图掩盖纳山可能的侵吞。^116 魁伦与广兴都离去之后，此案显然不了了之。到1802年秋，纳山仍在主持川北后勤。^117\n经费在四川军需局分发时，除例行扣除的百分之一外，人员在支付运输与其他开支（不清楚是否包括乡勇饷银）时还要再扣百分之二至四，尽管向军队发饷发津贴的经费不这样做。结果，一些领取者本应得一百两、实际只拿到九十五至九十七两。随后，知府知县们在自己辖区分发军费时，如法炮制。1799年神秘死亡的署理夔州知府曹相业，每百两自留三两七钱。他声称从达州局领到的是每百两只有九十八两五钱，实际只发九十四两八钱。有一次，他从达州局领了四万两，就私吞了一千四百八十两。曹相业在夔州任内共经手十八万多两军费。如果按同样的比例扣留，仅此一项他就可能侵吞了六千六百六十两。^118\n然而，魁伦到川之后，从北京或外省解来的经费不再有短缺。此外，三个军需局称重时，经费常常多于拨发之数——也就是出现了\"长平银\"。1799年底，山西拨来的四十万两到达时，全部银锭称重得四十万四千一百五十二两，长出四千一百五十二两。江西的经费也出现了类似情形。^119 1800年初，广兴与托津从北京护送二百万两入川。三个军需局到达称重时，总重为二百零一万一千零九十六两，长出十一万零九十六两……^120 毫不奇怪，从短缺到长余的剧变，恰与四川后勤主管的更换相呼应。这一转变引起了嘉庆的怀疑：此前的短缺或许是伪造的，过去的长余银或许被侵吞了。^121 然而，前线改革流产、魁伦与广兴被除之后，战役余下的岁月里，经费短缺的问题再也没有被提起。^122 很可能，后勤官员继续以\"短平银\"之名悄悄扣钱。\n将领们的滥行\n\"短平银\"被扣之后，军费头几年在军需局分发，战役后期则由粮员分发。这一阶段，军队将领走上前台，从军费中取利。他们提出无理请款——被称为\"滥支\"（lanzhi）。后勤人员既无权力也无意愿遏制他们的滥请，便不问缘由地满足其无理要求——被称为\"滥应\"（lanying）。正如乾隆1798年底所描述的：\n\n将领们剿贼已两年有余，已知贼首尚未全获。他们只知索取国帑，然后[向后勤机构]滥请滥支，虚报冒领以自肥。尔等[后勤领导人]一再请拨之国帑，必系将领违例滥支，或粮员曲意滥应，满足其无据之请。^123\n[译者按：原上谕自英文直译，文言原文待核，见注释123。]\n\n将领们的滥行，在1796年国家动员镇压湖北首轮起事时就开始了——那时毕沅主持湖北后勤。毕沅参加过第二次金川之役的后勤，或许早已谙熟利用战时后勤制度漏洞的门道。效法福康安在苗疆战役中铺张花费的先例，毕沅以高于《军需则例》的标准补偿军队、乡勇与民夫，公然挪用军费，并经胡齐仑之手或亲自把不义之银送给将领们。湖北的所作所为成了其他战场省份的标尺。松筠曾抱怨：要一下子削减超额支付与非法福利而不伤军队士气，谈何容易——他指责毕沅开了违反后勤则例的先河。^124 四川方面，领导人们起初遵循\"楚省成例\"（Chusheng chengli）。^125 然而，数年之内数百万两解入四川后，湖北\"成例\"很快被超越。1799年春，福宁为洗清自己，指责宜绵在支付军队、乡勇、民夫与牲口时不合规章，并说自己已把账目与前者的分开——尽管他承认自己任内也发生过违规。^126 随着战争推进，其他省份请求破例时，用的已是四川立的先例。^127\n然而，在军需局，就连虚高的标准也不总被遵守。后勤人员大多由低阶官员、候补官员与衙门书吏组成，任凭军队将领与督抚摆布——后者能影响他们的升迁，也能让他们丢官受罚。^128 因此，后勤人员通常选择满足将领与督抚的任何要求——无论多么无理，也无论是否违规。就连当过总督的福宁，也不敢顶撞将领们——他怕他们以\"贻误军机\"为名追究他。^129 1799年初，时任陕甘学政的宋澍观察到：陕西的后勤官员受将领施压以满足其要求，还不得不讨好将领——唯恐被指责阻碍军事行动。^130 乾隆也认为：战争财政中众多滥行的责任，将领大于后勤人员——\"但将领皆自朝廷派出，故粮员不敢拒绝其超额请款\"。^131 嘉庆同意父亲，但两方都责备：\"将领滥支，主事[后勤]之人不敢诘问。难怪积弊日深。\"（原文待核，见注释132）^132\n战区横跨数省，各省军需局平行、又无一个中央权威统筹，军队很容易钻空子。有时，部队由本省后勤供应。另一些时候，由作战所在省的后勤供应。还有时，补给来自第三省。^133 借此之机，将领们可以从不止一个省请款。1798年夏末，明亮离开陕西赴川三周，据称从陕川两省为其一千八百名士兵共领了十四万五千两。^134\n所有将领中，德楞泰以请款花钱最胆大妄为、最难伺候闻名——不满意就闹。^135 1798年初夏，德楞泰率七八千人入川追击姚、王残部时，一个月内经达州派来的粮员、汉中知府谭光典之手领了九万两。谭光典向其上司英善报告后，案件上报北京，引发军机处对德楞泰开支的调查。军机大臣们审查德楞泰的开销后发现：四万多两的支出违反《军需则例》之规。他们把德楞泰的月开支从九万两减到一万三千九百两，并责令德楞泰缴还超额经费。^136\n然而，德楞泰继续随意支领、花费军费。1799年头几个月，除米外，德楞泰从达州领了三十万两。到1799年夏，十三个半月里，他共支领六十六万一千一百两，其中许多开支不合法。德楞泰及其部将的跟班到粮台领饷领津贴时，没有任何文书手续。^137 然而，勒保为德楞泰辩护，说德楞泰理应多领——他带走了一些部队，麾下最终有一万两千人。事实上，勒保在花钱上超过了德楞泰。十六个月里，他从福宁处领了二百四十三万两（按福宁的说法是二百零五万两），每月超过十五万两。勒保辩称：他领的经费不仅用于自己与五千名士兵，还用于额勒登保等其他将领、所有粮台以及运输费用。^138 嘉庆不信勒保这软弱无力的自辩，此后视勒保为贪腐嫌疑——这在他1799年底决定罢免逮捕勒保时起了作用。\n为自己过度开支辩护时，将领们常常指向部队人数的波动。确实，后勤人员几乎不可能始终核实军队规模——它们不断移动，常常分了又合，还有伤亡与遣返。正如那彦成与台布赴陕途中所观察到的：将领们虚报兵数、以领更多经费，是常见的伎俩，后勤人员通常照数发款。^139 就连目光敏锐的广兴，在达州六个月任期内也从未弄准四川正规军的规模。回京时，广兴向皇帝抱怨：他例行发款的六万多名士兵中，大多数很久不见作战，一些人闲居城镇领饷。然而，大约此时，嘉庆从勒保与德楞泰处得知：四川有两万八千九百多名士兵。如此巨大的出入令嘉庆吃惊，命勒保与德楞泰解释。^140 两人花了几周拼出辩护。把一切可能算作正规军的人都加起来，他们得出三万七千七百四十四人的总数，说广兴的数字把候补兵与跟班算进去了——他们本来也在名册上。知道承认四川正规军更少会导致军费削减，他们论证说：运输费用不随军队规模缩小而下降；每月高达二十万至三十万两。^141\n自1800年初额勒登保以陕南为基地以来，陕西的正规军多于其他战场，其开支迅速上升，最终超过了1800年后战事零散而有限的四川。正如台布1800年初所估计的：陕西每月需四十万两，额勒登保从甘肃返回后则需每月五十万两——一年合计六百万两。^142 1803年初第一次宣布胜利后，只剩几千名起事者，陕川两省的开支仍居高不下。嘉庆震怒，命三省领导人奏报本辖区军队人数、一年来所领军费如何使用、还需多少。为安抚皇帝，额勒登保给出了一些缩水的估计：三个战场合计每月需三十三万至三十六万两（陕西十五至十六万、四川十一至十二万、湖北七至八万）。^143 然而，祖之望随后的一道奏折反驳了额勒登保的说法。祖之望说：陕西的月开支在1802年底遣返一些部队后已从五十万两降到三十万多一点。然而，1803年陕西每月仍需二十五万八千两。^144 直到1804年底最终胜利，陕西的开支据称一直维持在那个水平。\n将领们请求更多经费的另一个常见而方便的借口，是犒赏部队——所谓的\"赏号\"做法。此做法始于18世纪初，乾隆朝晚期被大肆滥用。尽管《军需则例》禁止此做法，一些将领——最著名的是福康安——在18世纪80、90年代的几场战争（包括苗疆战役）中继续花费巨额军费犒军。嘉庆常常指责福康安开创了此做法。为筹钱，福康安还勒索省级官员、盐政与内关税监。^145 尽管嘉庆坚决反对，福康安的门生们——包括额勒登保——仍视犒赏不可或缺。额勒登保承认：他遵循福康安所立先例，犒赏有功士兵与为军队服务的平民，且一向经其粮员请拨此款。^146\n白莲教战争中，犒赏虽然普遍，但发银而非绸缎等物料越来越常见。广兴奏报：以犒赏之名，宜绵、英善、惠龄、勒保与福宁从军费中领了数万两。^147 除自己请款外，将领们还收受地方官员与后勤人员的\"馈赠\"。正如庆成受松筠审讯时所供认的：他不仅收过胡齐仑与毕沅的银子，他到过的战场各省督抚——例如景安、秦承恩与宜绵——都送过他一百至两千两不等的银礼。但庆成坚称：他收到的一切银子都用于犒赏部队——他自己分文未取。^148\n嘉庆虽然不高兴，起初却怕挫伤军队士气而选择沉默。^149 但随着战役似乎接近尾声，他强硬起来。1801年底，额勒登保请求经费犒赏其部队与对零散起事者作战的平民时，嘉庆表达不悦，再次谴责福康安开创此做法——尽管他同意额勒登保可以从他刚拨给陕西的二十万两军费中取十万两作此用。^150 1802年初，在认可并称赞陕西官员捐出\"养廉银\"为部队置办冬衣鞋时，嘉庆裁定：胜利在望，不必再犒赏部队。^151 十个月后，嘉庆七年十月十四日，嘉庆正式禁止此做法——他支持户部\"不得从军费中拨发犒赏\"的裁定，援引乾隆1776年禁止此做法，并重申对福康安的批评。此外，嘉庆提醒将领们：军费审计时不得把犒赏列为军费开支。^152 如第5章所示，嘉庆在财务上的强硬路线，可能无意中助长了战役的拖延——战争领导人们不得不为巨额开支另找借口。\n其他违规行为众多而普遍。1799年初，福宁含蓄地承认：惠龄、额勒登保、德楞泰等将领的许多开支违规。^153 1800年四月，额勒登保把陕西所有绿营兵的战时津贴\"盐菜银\"从每月九钱提高到一两三钱。按《军需则例》，一两三钱是边疆——\"口外\"（kouwai）——的标准，而陕南是\"口内\"（kounei）。后来，额勒登保的幕僚胡世贤请求把绿营兵每日口粮从八合三勺米提高到一升时，军机大臣与户部支持提口粮，但裁定其\"盐菜银\"降回九钱。由于士兵更喜欢多拿现钱而非口粮，陆有仁恳求保留一两三钱的津贴而非提高口粮。嘉庆支持陆有仁的恳求，一两三钱的标准对陕西所有部队实际上成了官方的。^154\n就连改革派领导人也向既成事实低头，不时让步。1799年底，广兴弹劾朱射斗的粮员周国枢：他为朱的部队申请一万两时多请五千两，且两个月没有向军需局报账。广兴允许周国枢留任粮员，但请求褫夺其顶戴。然而，魁伦为周国枢辩护：额勒登保已同意周国枢\"预支\"的请求，周随军行进时没有时间报账。魁伦批评广兴过分严苛、轻率弹劾。^155 显然，麾下一旦有了军队，魁伦再也无法坚持早先的承诺。\n事实上，所有将领都设法最大限度地多领经费——包括以财务操守受称赞的额勒登保。据福宁说，从1798年九月到川到1799年五月，额勒登保八个月间从达州局领了二十七万二千两。同时，勒保声称额勒登保还从他那里领了十六万二千两。以他的军队规模——起初只有三千人，后来超过九千——他的花费绝非俭省。^156 那彦成也被证明是个大手笔。1800年初五十万两军费到达陕西时，松筠把最大的一份——三十三万二千三百多两——拨给了那彦成。^157\n将领们索取超额经费时虽常以\"部队福祉\"为借口，以发饷犒赏之名领来的钱却不总交到士兵手里。1800年初，广兴揭露了这一点：\n\"过去，每次军费解到军营，先支付的是规章所不许的项目，而士兵的津贴与口粮却迟迟不发。随后[将领们]就有了借口：经费已不足清偿欠款。于是士兵忍饥受寒，将领们却以犒军之名支领经费、中饱私囊。到头来，士兵从经费中分文未得。\"（原文待核，见注释158）^158\n讽刺的是，整个战役期间司空见惯的是：士兵与乡勇数月领不到饷银津贴，装备简陋，有时还缺粮——尽管装备他们本不该花太多钱。^159 就连德楞泰的部队也装备不足，许多士兵赤着脚。^160 正如嘉庆所承认的，一些士兵因前线条件悲惨而逃亡回了本营。^161 军队的可悲状态，于是成了将领们向朝廷请领新经费的完美筹码。听了众多这方面的奏报，嘉庆只能哀叹：\"军队开支虽巨，经费却常常拖延不发[给士兵与乡勇]，以致他们缺衣少食地投入行动。\"（原文待核，见注释162）^162\n借乡勇饷银之名\n到达州几周后，魁伦就指出了战争中两大开支：雇长骡长夫为军队运送给养（下文讨论）与雇乡勇。^163 最终，据称的乡勇补偿费用超过了雇牲口与民夫的费用，成为这场战争单项最大的开支。数十万乡勇固然确实被雇了，但可以肯定：以他们的名义的开支有相当大的部分是欺诈——雇乡勇是指挥官与地方官员为乱花钱辩护、掩盖普遍侵吞军费的最方便借口之一。\n由于受雇乡勇不受《军需则例》规制，而皇帝1796年初准许补偿乡勇的谕旨又含糊，滥行的空间相当大。湖北与陕西1796年初次使用乡勇时，遵循的是石峰堡战役的先例：临敌雇用的乡勇每日八十文，不在前线的每日六十文——折合月饷分别为二两四钱与一两八钱。然而，由于前线不断移动，很难为某一地区某一时段确定正确的标准。最终，二两四钱的标准被广泛采用，随后又提高到每月三至四两。^164 随着战争推进，乡勇获得更多福利，如口粮、一次性\"安家银\"（通常每人三至五两）、犒赏与抚恤。随征乡勇还被配给民夫——为他们挑给养、做杂务、从战场抬回阵亡乡勇的遗体。这通常以\"夫价\"（fujia）津贴的形式发放。^165 遣散时，他们应当领取安置津贴。在战役漫长的收尾阶段，标准从二至五两大提高到十至十五两。总体而言，乡勇的待遇好于绿营正规军——后者的战时月饷平均约二两（战役期间临时提高到二两四钱）。鉴于优厚的待遇，许多乡勇拒绝入伍当正规兵——当机会摆在他们面前时。只在战争后期，剩余随征乡勇的饷银才降到二两以下，但同时领口粮。1804年，应额勒登保等将领之请，其饷银又提到二两，另加口粮。^166\n然而，乡勇与正规军一样，常常装备简陋、供应不足、饷银不能按时领取。正规军与乡勇之间，后者的饷银更容易被将领侵吞。此外，将领与地方官员虚报乡勇人数多于实雇之数，或虚报服役时间长于实际。乡勇名单本应报户部备案，但户部几乎无法核实：那些名字是否只是\"稻草乡勇\"，受雇日期是否准确。从1800年嘉庆号召更多依靠自愿乡勇以省开支起，很可能自愿乡勇的名字有时被混入受雇乡勇名册以充数。审计中发现：一项\"四川派乡勇赴鄂助战\"的开支申报中，有六百四十五个名字是伪造的。^167 1807年初，嘉庆毫不留情地痛斥此类伎俩：\n\n审计中发现的欺诈，大多是借[雇]乡勇为名掩护滥支。与各省正规军——其名字在营伍名册中——不同，乡勇没有定额，人数可以任意添加。此外，其受雇与遣散没有固定日期，服役长短总是由地方官员按需捏造。这些都无法核查。于是滋生众多欺诈。军队所有无法在审计中获准的不合理或超额开支，都被申报为雇乡勇的花费。^168\n[译者按：原上谕自英文直译，文言原文待核，见注释168。]\n\n另一个欺诈的温床是抚恤。湖北叛乱爆发、乡勇被雇参战后不久，朝廷就批准给阵亡有功乡勇的家属发抚恤。随后，负伤乡勇也被纳入抚恤。^169 1799年春，嘉庆把此福利扩展到所有阵亡乡勇，不论其贡献。他还宣布：打算给此前——战争头三年——死亡的乡勇家属发抚恤。^170 由于核实抚恤申报——通常由将领或官员提出——很困难，这一机会助长了欺诈，包括既从乡勇阵亡所在省的后勤机构、又从乡勇出征的家乡省份双重领取抚恤。^171 同时，抚恤标准不断攀升。最终，达到二十五两——与绿营兵抚恤相同。如果乡勇持有监生头衔或在地方衙门有职位，标准更高（前者三十五两，后者一百两）。最终，此福利还扩展到了非乡勇的死亡平民。1803年初，额勒登保与德楞泰奏请朝廷复议兵部的一项裁定：不给二百七十多名阵亡、或立功后病故、或负伤的\"民壮\"（minzhuang）发放伤亡抚恤，而让将领们自掏腰包犒赏。兵部的理由是：他们不是乡勇。然而，额勒登保与德楞泰辩称：那些\"民壮\"承担着与乡勇相同的任务。嘉庆让步了，命给所有死伤的\"民壮\"以及此后病故者发放恤赏（xushang）。^172 对无家属领取抚恤的阵亡乡勇，按每人二两发放所谓\"致祭银\"（zhijiyin）给其军中上司，由上司祭奠死者。^173 毫无疑问，这些钱落入了那些军官的腰包。\n1804年初，兵部颁布了乡勇抚恤新规，把阵亡乡勇分为三类、分级抚恤。守城守镇者以及参战或随军行进者——如果杀贼众多——按阵亡正规兵标准抚恤。如果杀贼不多或功绩无凭，只领正规兵抚恤的一半。保卫村庄堡寨而死的平民没有金钱补偿，但其名字将入\"昭忠祠\"（zhaozhongci），事迹送翰林院立传。^174 然而，吴熊光抱怨：谁杀贼多、谁没杀，无法确定——因为一些招募率领那些乡勇的官员后来也在冲突中死了。湖北方面，到1804年夏，八千一百一十三名阵亡乡勇已按正规军标准获得抚恤——经兵部批准。加上一千三百五十四名负伤乡勇的抚恤，共发四十万一千六百八十五两五钱。然而，湖北还有八千四百多名乡勇伤亡（阵亡六千四百五十九、负伤一千九百四十一）等待报部。担心新规阻碍其抚恤获批，吴熊光建议给所有死伤乡勇每人发二十五两。吴熊光的修正案获中枢政府与皇帝批准，实际上废止了兵部早先的规定。^175 然而，湖北申报的近一万八千名伤亡中，到1803年只有八百六十七名（阵亡七百一十一、负伤一百五十七）得到核实。阵亡者远远多于负伤者，也令人生疑。^176\n战役早期，将领们选择不上报乡勇伤亡——乾隆与嘉庆都为此斥责过他们——而战争结束前不久，这类申报却激增。很可能，领取抚恤的机会促成了这种激增。一些方志中极长的名单，通常抄自这场战争阵亡者纪念祠的碑文。显然，一些假名被混入其中。^177 伪造乡勇伤亡虽然帮了将领与官员，真正死伤者却不总得到抚恤。1804年，湖北孝感一名乡勇之子赴京申诉：他父亲组织乡勇、1796年阵亡，家里至今分文抚恤未得。^178 1811年，常明接替勒保任四川总督后不久奏报：1797至1799年间四川三千多名死伤乡勇应得的抚恤没有送到其家属或本人手中。^179 很可能，勒保挪用了、或侵吞了这笔钱。\n为刹住不受约束的——真实或伪造的——雇募，1799年夏，四川后勤官员规定：较大的州县最多雇两千名乡勇，较小的最多三百至一千名。这些定额此后似乎被其他省份采纳，但注定难以执行。因为让几千名乡勇留在名册上是维持银流流向自己的方便办法——每月可抵数千两——许多知县拒绝裁减乡勇。1800年初，川北南部县知县突然拒绝魁伦与广兴\"把该县乡勇从二千五百多名减到一千名\"的要求。此外，他还请求经费供养全部二千五百名乡勇。广兴虽想驳回请求，魁伦却倾向于拨款——担心被裁乡勇半年生计无着会闹事。广兴被说服了，给知县拨了一万二千二百两，但附信让他裁减。知县收了钱，却无视广兴的信。不久，他又提出请款，促使广兴把此案奏报皇帝——希望皇帝支持对知县的处分。然而，被嘉陵江前线的溃败压得喘不过气的嘉庆，刚把对受雇乡勇的立场从不赞成转为全力支持。嘉庆反而训斥广兴过于挑剔。^180\n1801年春，一小股叛军侵入甘肃东南时，甘肃二十多个县雇乡勇守城镇。警报虽只持续了几个月，开支却不小：约三万九千五百两用于支付那些受雇乡勇。如表7.4所示，六个县雇的乡勇超过定额，且全部按每日八十文的高标准支付。后来认定：总额二万九千七百三十四两中，约五分之一是超额的。^181\n表7.4　1801年（二、三月）甘肃超额雇用乡勇\n\n\n\n州县\n定额（人）\n实雇（人）\n\n\n\n\n秦州\n2,000\n4,000\n\n\n清水\n1,000\n2,000\n\n\n陇西\n1,000\n1,300\n\n\n平凉\n1,000\n1,200\n\n\n西和\n300\n1,000\n\n\n隆德\n300\n1,000\n\n\n总计\n5,600\n10,500\n\n\n\n资料来源：NGDK, 109909.\n即使在战役最后阶段——在逃叛军只剩几千、继而几百人时——以乡勇饷银之名的开支仍相当可观。四川雇乡勇发饷持续最久——从1796年秋到1805年春。^182 四川蓬溪县——除1800年初外并非热点——共花七万四千六百七十五两补偿乡勇。^183 达州方面，尽管1800年底恢复太平，1803至1805年间与乡勇相关的开支仍达二十五万两。^184 然而，1805年四月——四川最后一批乡勇被裁两个月后——勒保与德楞泰仍试图从他们身上取利。在战后重建提案中，他们请求中枢政府拨款，支付欠士兵与前乡勇的饷银。这一次，军机大臣与战役的两位前将领额勒登保、明亮否决了提案——理由是它可能招来欺诈性申报。^185\n额勒登保主持下，陕西支付乡勇的开支也不俭省。如表7.5所示，兴安府1800至1805年间花了近二十五万两支付乡勇——尽管1801年中以后那里没有发生过严重的战事。陕南方面，1800至1805年支付地方防务乡勇的总费用为九十二万二千二百零五两。同时，如表7.6所示，包括额勒登保在内的陕西清军将领以\"支付所辖随征乡勇\"之名申报了七十九万三千三百九十六两。^186 加上地方政府支付乡勇的钱，陕西战场战争漫长尾声的总花费超过一百七十万两。\n表7.5　1800—1805年陕西兴安府雇乡勇的费用\n\n\n\n兴安府属\n金额（两）\n\n\n\n\n兴安府（知府直辖）\n42,530\n\n\n安康\n46,462\n\n\n旬阳\n33,888\n\n\n平利\n18,391\n\n\n紫阳\n27,427\n\n\n石泉\n27,376\n\n\n白河\n34,668\n\n\n汉阴\n18,502\n\n\n总计\n249,284\n\n\n\n资料来源：NGDK, 56763-001.\n表7.6　1800—1805年陕西将领申报的雇乡勇费用\n\n\n\n姓名\n职位\n金额（两）\n\n\n\n\n额勒登保\n战役经略大臣\n402,188\n\n\n庆成\n总兵、提督\n79,765\n\n\n刘之仁、杨芳\n宁陕镇总兵\n123,896\n\n\n胡定泰\n河州镇总兵\n43,179\n\n\n穆克登布\n太原镇总兵\n144,368\n\n\n总计\n\n793,396\n\n\n\n资料来源：NGDK, 4724.\n1806年审计期间，湖北向户部报告：战争头三年，为三十六万六千七百多名乡勇花了四百七十多万两白银与二十三万多石米。嘉庆听取简报后，忍不住反驳这些数字\"显然系捏造\"。他于是裁定：四川与陕西先行自我审查、把数字砍到合理水平，再提交乡勇费用申报供审计。^187 然而，四川提交户部审计的数字仍令人咋舌。虽然没有全省总数，一项申报开列：头三年四川太平厅与开县共花三十二万七千六百二十二两支付乡勇，达州的总费用为四十六万七千六百九十七两。三地合计申报近八十万两。^188 以四川此期雇乡勇的规模——超过三十四万——总费用必定不比湖北低多少。^189\n如1808年审计所揭示的，与乡勇相关的费用总计超过两千万两。^190 这个数字可能是各省砍掉一些露骨欺诈申报、审计者又驳回更多之后的\"净化版\"。然而，两千万两仍惊人地巨大——约占拨往战区经费总额的百分之二十二。嘉庆震怒，拒绝认可这笔开支，认为它过滥。然而，要准确评估两千万两中有多少被非法花费或侵吞，几乎不可能——就连审计者们经过数年的核查、统计与造册，也无法确定。因此，嘉庆命战场各省参与后勤系统的官员缴还：随军作战的随征乡勇所报费用的百分之十，参与战事之地防守乡勇费用的百分之二十，远离战事之地乡勇费用的百分之三十。四川方面，应缴还者超过一百七十一万七千两白银与约八万石粮的价值。^191 但对任何战场省份涉及雇乡勇发饷的人，都没有采取纪律或法律行动。\n长骡与长夫\n正如魁伦1799年所指出的，与乡勇费用并驾的另一项巨额开支，是雇\"长骡\"（changluo）与\"长夫\"（changfu）为军队运粮运物。^192 按《军需则例》的规定，牲口主要由粮台用于运输粮食、军服与弹药，按里程付酬。所有军官、旗兵与绿营骑兵都有权拥有骑乘马——所谓\"例马\"（lima）——并领\"马干\"（magan）——养马津贴。军队出征时，本应使用那些\"例马\"，只在途中与战区领草料。没有例马的部队，只允许在赴集结地途中雇牲口或民夫挑运行李；牲口与民夫的数量按行李重量定。军队到达目的地后，每一百名满洲兵配五十名跟役，每一百名绿营骑兵配三十名余丁（yuding）与二十名随营夫（suiyingfu），每一百名绿营步兵（shoubing）配三十名民夫。^193 这样，本无必要另雇牲口或挑夫。因此，\"长骡\"与\"长夫\"都不在《军需则例》之内。\n然而，现实并不如此简单。清军两支力量——八旗与绿营——的例马数量自乾隆朝晚期起急剧下降。由于经济压力，许多军官骑兵卖掉了马，却继续领马干作为额外收入。出征时，他们不得不四处找马。结果，军队不得不雇马与其他牲口，去做本应由自己例马承担的工作。第二次廓尔喀之役中，马与其他牲口的花费远超所许——这是那场战争开支高昂的主要原因之一。^194 1795年湖北军队调往苗疆战役时，毕沅动议修改规则：给每一百名绿营步兵配三十名余丁，与绿营骑兵相同。户部批准了。^195 然而，苗疆战役中的将领们雇了超过允许数量的马与民夫——因为本该有例马的人员没有把马带到前线。结果，许多人两头吃——既在家乡本营领马干，又在前线领雇马雇骡的钱。同时，战役中雇的民夫也超过允许数量。开支申报提交户部审计时，目光敏锐的和珅察觉了滥行，在他自己倒台前不久逐一驳回。^196\n白莲教战争中，雇长夫在冲突一爆发就开始了。1796年春，宜绵前往商南、试图阻止叛乱从湖北蔓延到陕西时，陕西布政使姚学瑛雇民夫修秦岭的道路，并雇了数千头长骡向商南运输给养。^197 河南方面，景安1796年底雇了数千头骡与骆驼为军队运送给养。^198 1796年春，孙士毅率数百名四川兵前往川鄂边境时，也雇了数百名长夫。^199 湖北方面，战争进入第二年之前，汪新就雇了长夫随军行进。他付他们每月六两银子、三十升米。在粮台之间运粮，汪新倾向于减少民夫数量、用省下的钱提高剩余民夫的工钱，同时多雇牲口——因为一头健骡能驮两倍于一名民夫的重量。^200\n多用牲口的理由虽然是省钱，战区却不盛产骡马。汪新与景安都不得不派员到邻近地区与其他省份采购。^201 自然，高需求低供应推高了价格。很快，购买或雇用牲口都比用人便宜不了多少。但这没有阻止将领们使用它们。1797年初宜绵入川时，带去了长骡。1797年夏清军追击襄阳起事者入川时也如此，但价格已飙到每骡每月十五至十八两。由于每百名士兵据说给五十头骡，而四川有约两万名士兵，需要数万头骡。即使价格后来降到每月十二两，仅此一项每月就要花十二万两。\n鉴于巨大的花费与公然违规，后勤人员抱怨并试图削减长骡数量。然而，已成为战役统帅的宜绵为此做法辩护，拒绝接受后勤人员的提议——给每百名士兵十头长骡或二十名长夫——他认为骡数不足以服务部队。最终达成妥协：每百名满洲旗兵配二十五头长骡，每百名绿营兵配二十头骡或三十名长夫。民夫月付三两、口粮三十升米；雇长骡每月可花九两，赶骡者不领口粮。^202 仅此一项开支每年就可能有数百万两。\n然而，就连妥协也没有被遵守。1798年夏明亮在川三周的巡剿中，他申报了一万五千五百零三两——用于雇两千二百多名民夫（月付三两）与一千三百多头骡（每月十两八钱至十二两）。^203 德楞泰同样大方。十三个月里，他的部队据称在骡与民夫上花了二十二万六千九百六十多两。他虽然没有超过旗兵的骡数标准，却据称给每一百名绿营兵四十名、而非三十名民夫。此外，他的军官、幕僚及其跟班都配了民夫，他还另雇骡与民夫运送大炮与弹药。与受雇乡勇——其名单须报户部备案——不同，受雇的民夫与骡不受任何规制。更具体地说，军需局并不直接雇他们，只是按将领请求发款，然后由后者自行雇民夫或雇骡。很可能，这笔开支的很大一部分变成了将领们的战时外快。正如魁伦所揭露的：每次军费到达，长骡长夫的费用立即拨给军队，而士兵的饷银总被拖延。^204 就连勒保也承认：此做法自陕鄂创始起就被滥用（为了把批评的矛头从自己身上引开）。^205\n或许指望与和珅的关系，勒保采取了不同的方式把自己从则例中解放出来。到川之后，\n1798年初到川后，勒保让英善与福宁草拟了一份开支清单——不在《军需则例》之内、却\"绝对必要\"。1798年夏，勒保与福宁把它提交户部，请求把所列开支批准为《军需则例》的修订。然而，和珅逐项驳回，并坚持：则例中的规则本应满足军队的需要，另雇长骡长夫是多余的。裁定到达四川时，勒保抱怨和珅的一些决定\"断难遵行\"。他只是把户部的答复分发给各军需局与粮员，却没有督促他们照办。因此，尽管中枢政府明令反对，四川继续雇长骡长夫。^206 和珅死后，四川更闹腾了，抱怨运输费用飙升——因为躲避叛军绕路，民夫工钱不得不提高。1799年夏，勒保与福宁向户部呈上一项提案，请求批准给每百名士兵雇二十头长骡、每骡每月九两。然而，嘉庆警告他们：如果和珅已驳回他们所请的修订，户部不会撤销和珅的裁定。^207 勒保第二次让长骡长夫合法化的努力失败了。\n短暂的前线改革期间，这个问题成了魁伦与额勒登保公开而激烈失和的导火索。额勒登保论证说：则例配给军队的民夫与余丁不足——只够挑装备弹药，没有民夫挑军服行李——于是给每百名士兵配四十名民夫。此外，他让粮员李鋐雇了五百头长骡，执行\"长运\"（changyun）。这支驮队由一名知县率领，每骡每月九两七钱。^208 魁伦清楚这些雇募是最被滥用的做法之一，却承认：由于起事者的游击战迫使军队不断移动，一些长骡或许确有必要。然而，他仍不认为额勒登保在增加长夫之外另雇五百头骡、且每骡付价甚至高于勒保所请的每月九两，是合理的。奏报此事的奏折中，魁伦提议保留此做法——因为苗疆战役中曾出现并获认可——但降低牲口的费率。然而，嘉庆愤怒地彻底拒绝了此做法，说苗区是边疆，而川陕是腹地。他尤其恼火的是：费率竟比勒保治下还高——怀疑魁伦被后勤人员蒙了，他们用这个名目掩盖侵吞经费或填补早先舞弊造成的账目窟窿——但他完全没有责备额勒登保。^208 在朝廷与将领的双重压力下，魁伦试图找中间道路。他与在此问题上看法一致的广兴提议：允许每百名绿营兵——骑兵步兵一样——雇四十名长夫，每夫每月二两四钱。按此标准，四川全部军队每月需五万二千八百两，一年六十三万两。军队可以用这笔钱或雇挑夫、或雇骡。他们论证说：虽然数字超过了《军需则例》的规定，但与勒保、福宁\"每百名士兵二十骡、每骡月九两\"的方案相比，开支从每百名士兵一百八十两砍到了九十六两。同时，他们提议遏制旗兵与军官的两头吃——把他们的例马津贴减半，把付给他们雇马雇骡的钱——所谓\"驮折\"（tuozhe）——减半。以赶骡者在前线面临的危险为由，他们与皇帝讨价还价：把每骡每月费率从则例规定的四两五钱提高到九两，把粮台间运粮牲口的费率从户部裁定的每匹一钱五分提高到三钱。两人警告：他们所提的是底线，再低会有不良后果。两位改革派官员转向要求对规章的妥协，必定影响了皇帝——他这次让步了：同意每百名士兵四十名长夫，也同意关于旗兵军官马匹福利的妥协。然而，他没有正式修订《军需则例》，只说：军费审计时如果户部驳回那些开支的申报，他会亲自干预。^209\n就这样，皇帝一边试图预防中枢官僚的批评，一边安抚战争中的将领们。事实上，嘉庆对魁伦—广兴建议的决定，实际上确认了旗兵与绿营军官的一项新战时福利。它被称为\"驮折夫价\"（tuozhe fujia）或\"驮折夫马\"（tuozhe fuma），很快被所有战场省份采纳。^210 以\"驮\"（字面义为骆驼，这里泛指驮畜）代替\"马\"，费率被大幅提高——因为雇骡的价格远高于马。然而，没有任何机制核实旗兵与军官这两个群体是否用经费雇了驮畜，更不用说所提议的削减是否落实。^211 战争余下的岁月里，据称的民夫与驮畜费用持续居高不下。督抚们不时请求提高民夫工钱与雇驮畜的费率。^212 1800年秋，勒保与德楞泰声称：四川运输给养的费用每月二十万至三十万两——超过四川所有已部署部队的饷银。^213 倭星额与邱兴健1801年中在前线视察后提出建议时，承认运输费用高于物资本身。然而，他们认为高费用有前线的紧急与危险作某种程度的辩护。^214 这两位钦差很可能被前线将领与地方官员游说、甚至贿赂了，自愿替他们说话。\n直到战役收尾阶段，各战场领导人才着手削减给军队的额外津贴，包括\"驮折夫价\"。^215 令人惊讶的是，现存军费审计档案中涉及\"长骡\"或\"驮折夫价\"的案例如此之少。换言之，审计所反映的军费，并不印证魁伦1799年\"雇驮畜与民夫是战争两大最昂贵开支之一（另一是雇乡勇）\"的观察。可能嘉庆没有兑现\"让户部给那些项目开绿灯\"的承诺。结果，参与战争后勤的各方不得不四处寻找正当开支——这可能造成了乡勇相关费用的虚高。\n地方政府从中取利\n与\"军费主要用于支援军队\"的普遍认知相反，白莲教战争中军队的消耗——包括将领们的侵吞——只占战争总成本的较小部分。军费的更大部分，被战场省份各级地方政府抽走。一定程度上，清朝财政制度的设置助成了这一结果。1796年白莲教战争的爆发，恰逢庆祝乾隆退休的普免钱粮开始——蠲免要在三年内完成。湖北、继而四川、陕西起事爆发后不久，朝廷就给受战事影响的州县蠲免、减免或缓征赋税。随着战役推进，一些地区反复获得税收优惠。^216 一些州县因蠲免缓征失去了整整一年或更久的收入，其省政府也损失了一部分收入。总体而言，清朝政策对\"地方政府因灾荒或蠲免蒙受收入损失时可以怎样弥补\"含糊其辞。^217 由于中枢政府不提供任何补贴，地方政府不得不从一切可能的来源搜刮钱款，包括向省藩库\"借\"、向当地商人及其他居民\"借\"——尽管皇帝严格禁止他们勒索百姓。白莲教战争两三年后，战场省份的府库空了；省级官员大声而频繁地抱怨。^218\n战区地方政府虽不因参与战役而领一笔总款，地方官员却可以就战争相关项目——包括雇乡勇与驮畜——向后勤机构请款。每次军费到达，官员们就涌向军需局，报销他们已花的钱、为其他项目请款。然后，他们轻而易举地把军费挪用于日常开支，如官员俸禄、\"养廉银\"津贴与驻军饷银——包括未被调往战争的驻军。^219 1798年夏，解释湖北军费为何消耗如此之快时，景安与高杞向朝廷坦言：湖北受叛乱影响的州县，因赋税被蠲免缓征、无钱可用，全靠军费维持日常运作。^220 1799年底，勒保奏报：供养战役中正规军与随征乡勇的费用并非最大的军费开支。相反，分发给地方官员、由他们花掉的军费才是巨大的。勒保虽开列了一些战争相关开支——如雇民夫驮畜向军队运物、支付各粮台人员的工钱、制造军服弹药——却承认：军费也被用于满足所有州县的需要。他指出：省藩库已空、四川一半以上的赋税已蠲免、关税与盐课收入低于往常，声称：\"[我们]入不敷出。不得不挪用军费支付军队饷银、官员俸禄与'养廉银'，以及供养驻藏与川藏大道沿线军队的开支。\"（原文待核，见注释221）^221\n1799年底魁伦一到四川，就观察到了这一现象。除证实其他人的奏报外，魁伦还揭露：解到成都的军费最容易被挪用。正如他所说：\"官员俸禄与军队饷银，皆从成都军需局所存[军]费中支放。因此，军费虽被使用，却被用于支付本省开支，与战役需要毫不相干。\"（原文待核，见注释222）^222 由于三个主战场省份都在省城——武昌、西安与成都——设了一个军需局，省政府取用军费很方便。四川方面，头几年大部分军费解到达州，但解往成都的经费数量也不小。1800年初叛军渡嘉陵江后，随着战场西移，更多经费解往成都。^223 托津深知给成都过大的财政余量有隐患，警告成都局人员把战争后勤与地方事务划清界限、不得用军费支付日常事务。川西恢复太平后，托津指示成都把一些经费转送达州，但命令是否被执行不清楚。^224 然而，勒保撤销达州、保宁两局、把战争财政集中于成都后，四川挪用军费就更方便了。战争余下岁月里到达的经费虽仍在成都、达州、保宁三处分发，成都领到的份额越来越大。^225 陕西方面，西安军需局有独一无二的取用经费机会——北京解往战区的所有经费都要经西安。有时，西安局截留拨给其他局的经费。^226\n尽管嘉庆不断告诫\"军费只能用于军队、不得用于地方事务\"，战场省份的军费总是一到就快速消失。^227 当然，挪用侵吞军费不只限于省级。正如广兴1800年初所指出的，各级政府——省、府、县——都急于从军费中取利。^228 事实上，府、厅、州、县官员可能更咄咄逼人。众所周知，帝制晚期的知县俸禄微薄、衙署人手不足，职责却无所不包、大体繁重。人们常道知县通过摊派附加费盘剥百姓以补经费，但他们仍难收支相抵。^229 然而，当他们受命处理临时任务——如战时任务与上司或中枢政府发起的公共工程（例如水利工程与赈灾）——时，知府知县可以接触到从外部拨来的经费——数额通常远大于他们微薄的常规预算——这使此类场合成为经费不足的地方官员的财政机会，尽管他们的职责成倍增加、日常变得复杂。\n白莲教战争期间，战区地方政府全都卷入军事与后勤运作，因而能接触到异常巨额的军费。除被招募进后勤系统的地方官员与书吏——或在军需局工作、或随军——外，其他地方官府人员也被责成向战役提供各种服务与协助。与后勤系统中任上司与将领摆布的人不同，留在本辖区的知府知县在利用战役上拥有更多自由与余地。鉴于这场战役地方社会卷入之空前，先例与规章不足以指导后勤人员应对涌上门来索款的知府、知县及其爪牙。被战时责任所鼓舞、所赋权，知府知县若得不到所请，就威胁要弹劾后勤人员贻误军机。通常，后勤人员屈服于他们的要求，每次不核实申报就发数万两。正如广兴所揭露的：\"四川如今普遍存在奸猾府县官员从军费中牟利的现象。军需局若不满足其请，他们便[威胁说]军需局搅乱其辖区，要报总督。若给了经费，他们便随意花用，借口支援战役而早有的亏空。\"（原文待核，见注释230）^230\n广兴一再告诫后勤人员认真履职，警告要弹劾任何违规者。然而，他的话被当作耳旁风，毫无改进。1800年初，直言敢谏的广兴把三起严重滥行案件提请嘉庆注意，为他打击前线腐败的圣战争取皇家支持。事实上，广兴嘉庆五年正月十四日的奏折，是现存唯一详细提供府县两级军费滥用丑闻信息的档案。^231\n第一个被弹劾的是夔州知府严朝标。1799年夏末上任三个月，他就从达州军需局领了十四万多两——尽管他负责供应的只有驻扎夔州城的七十五那几千人，而夔州东部几乎无战事。夔州开支之不成比例令广兴震惊，他劝严朝标谨慎节俭。严朝标不听，两个月内又从达州请了四万九千两，使其所领经费总额超过十八万九千两。然而，严朝标并没有支付本府乡勇的饷银。据广兴说，原来严朝标用这笔钱填补夔关税额的亏空——他把所收关税侵吞了。严朝标不否认侵吞所收关税，却辩称：关税用于供养成都驻防旗兵，所以必须补上——即使用军费。^232 作为长江进入四川的门户，夔关的关税年额为十八万三千七百四十两。但1799年只收了十一万三千四百四十两——战争使过夔州的商旅减少。^233 然而，到1800年底，七万零三百三十七两二钱的亏空仍未结清，^234 这意味着严朝标没有说实话——那十八万九千两军费的去向另有别处。有意思的是，严朝标的前任曹相业——借\"短平银\"侵吞军费者——在被查办、死于回重庆途中之前，一直留在夔州\"协助\"严朝标处理财务；曹相业在此案中可能扮演了什么角色，不清楚。^235\n第二起涉及阆中知县李元。阆中地处川北战区的边缘，也是保宁府治所在，就在保宁军需局门口。有时，李元一边当阆中知县、一边受雇于军需局——战役期间地方官员身兼两任是常事。到1798年底，李元已从保宁局领了二十九万多两——是阆中这种规模的县衙年度预算的一百五十多倍。广兴赴达州途经阆中时，查问经费用途。李元拿不出一份可信的逐项开支账目。广兴立即写信给魁伦，请查办该知县。广兴上奏时，魁伦尚未审理此案。然而，保宁的一名署理道员向广兴报告：李元处理军费的方式并没有改。^236\n第三起的主角是广元署理知县马鸣銮——广元也属保宁府。马鸣銮1799年八月署理知县——许多知府知县被吸纳入后勤系统，其衙署常由他人代理。1799年底，额勒登保在该地区作战时，让马鸣銮雇骡为其部队运送给养。额勒登保离开后，马鸣銮裁掉了一些雇骡——因为广兴警告他遣散所有骡。然而，马鸣銮请求准许把仍在服役的骡转为衙门\"长骡\"，用军费按每骡每月九两支付。马鸣銮辩称：本县已在战役上花了一万多两，他想用军费弥补衙门的财政缺口。广兴认为这是滥用军费，还奏报马鸣銮的账目含混、有无法核实的项目。^237 事实上，雇\"长骡\"并不限于军队。战场省份的后勤人员与地方政府都采用了此做法——它成了一些官员扩大财政余地或中饱私囊的方便借口。\n带着批评魁伦\"处理滥行态度松弛\"的弦外之音，广兴提议：责令这三名官员到达州，在达州军需局接受全面查账。即便他们不曾侵吞军费，也应责令缴还非法或超支的那部分经费，广兴坚持。^238 嘉庆批准了这些行动，指示魁伦查办各案——如果广兴所报属实，予以必要惩处。然而，此后不久的嘉陵江危机改变了嘉庆的优先次序。魁伦很快被清除，广兴被召回。三名官员谁也没有受到任何惩处。^239 战役余下的岁月里，无论将领还是后勤官员，谁都没有再呈上堪与广兴相比的揭发——尽管滥行肯定在继续。\n战区地方政府必须拿出正当开支以通过审计。除支付乡勇与运输给养外——这是滥行与侵吞最方便的掩护——还有几项开支也被用于此目的。其一是购粮补充已空的常平仓。地方政府确实从市场购粮——或供军，或补仓。^240 然而，在四川，这是把一大部分军费解往远离前线的成都军需局的主要借口。1799年接手指挥后不久，嘉庆就对四川\"用军费购二百万石粮\"的请求表示怀疑，认为这是侵吞经费的隐蔽方式。^241 即便他派去的新领导人在位，他的警惕仍在继续。\n1799年秋，二百万两军费从北京到达时，魁伦与福宁指定其中一百万两解往成都局，用于全省补仓。但广兴皱眉了——他怀疑所购之粮不会用于战役军队，疑心这只是为维持粮仓储备定额——在他看来这是侵吞。^242 嘉庆赞同广兴，裁定军需优先，尽管他说理解魁伦的用意——他必定担心：不给钱补仓，知县就会向纳税人摊派。此外，嘉庆怀疑补仓可能是地方官员为战后通过审计而自保的方案之一——他们需要为所有被抽走的经费提供理由。^243\n然而，嘉庆选择了向四川让步——他拿不准自己判断的毛病再次占了上风。他先拨五十万两给成都购粮，又拨二百万两给四川作军费。^244 魁伦与广兴大喜过望，立誓所购之粮确实供军（他们奏报林俊已向商人征购粮食、正等款付账），并保证不把军费开支与省费混在一起。广兴立场出现了有趣的变化：他加入魁伦，恳请解九十万两到成都——因为五十万两不够，成都局除补仓外还承担众多任务。^245 尽管他们作了承诺，四川的许多粮仓——尤其是战场附近者——在战役余下的岁月里一直空着。^246\n地方政府使用的另一个方便借口，是赈济流离平民。整个战役期间，随着战事蔓延、以及某地恢复太平之后，地方政府都请求赈济经费，为流民提供粮食、住所与农事援助——如种子、耕牛与农具。^247 然而，实际做了什么是很难核实的。1799年春末，二百五十万两到达四川时，勒保指定其中五十万两作赈济。他开列了川东、川北三十多个最急需赈济的地方。勒保计划：用十万两供养从叛军处逃出的难民，四十万两为那些地方最贫者提供两个月口粮。他将挑选以\"清廉\"著称的知府知县，让他们甄别最贫困之家、发放赈银。其余居民，如勒保所解释的，得等新经费到来——他刚向朝廷又请了五十万两。如果五十万两只够选定人家撑两个月，这项工程的总花费将极其巨大。更具体地说，很难确认所有地区最贫困之家是否都领到了钱。嘉庆对勒保的提议大为光火，谴责勒保用赈济掩盖可能的军费侵吞。^248 魁伦与广兴到川后，也对勒保赈济工作的可信度表示怀疑。^249 然而，他们在达州短暂停留期间没有机会调查。\n然而，赈济不能拖延——皇帝不断强调安置流民的重要性，以釜底抽薪、断叛军兵源。^250 勒保复职回川后，继续施压，为此项工作争取更大余地。1800年底一份引起争议的提案中，勒保坚持每天向流民提供食物与现钱，把福利扩及无户籍的外省客商客农。1799年春，中枢政府已拒绝向客民提供赈济。嘉庆这次虽选择不那么严厉——前线改革夭折后，他再无整顿战争领导层的意愿——却把\"客民问题\"的决定推迟，把提案送户部审议。^250\n赈济平民的一个久已有之的办法，是以工代赈方案。政府不向受赈者发钱发粮，而是招募他们参加建筑工程、付给工钱。白莲教战役中，毕沅1797年初首次使用此法；他招募难民与失去生计的当地居民修筑樊城城墙。毕沅估计总费用在十万至二十万两之间，计划先用军费、再以变卖叛军财产所得偿还湖北军需库。显然，这是地方官员充实账本的机会。更具体地说，毕沅让不是别人、正是胡齐仑监督这项工程。^251\n漫长战役早期，这一方案不常用——或许因为地方官员还有\n其他许多从军费中取利的途径。直到1803年早春，此法才再次被援用。如第5章所述，额勒登保提议从军费中拨四十万两，雇用被遣散的乡勇修城筑堡。嘉庆被这提案激怒，毫不留情地痛斥额勒登保：干预民政、把遣散乡勇留在名册上以制造请款借口、拖延战争。尽管嘉庆愤怒，此方案在战役尾声及战后可能被战场省份广泛使用。除筑堡修墙外，地方官员还掀起了一波小型工程：修缮或新建城墙、衙门、寺庙、祠堂与书院。^252 实际需要之外，那些工程暂时缓解了安置骤失生计的乡勇与军事民夫的负担，也让许多官员——尤其是来到战区后勤网络服务的候补者——有事可做。最重要的是，那些工程为地方官员提供了急需的借口，为其辖区消耗的大量军费辩护。尽管如档案所称，一些工程部分由官员与居民捐资，其他经费——很可能是军费——也会被用上。\n难有对策\n如果说文官系统在太平时期盘剥其治民、为其衙门与自身攫取额外收入，那么战时，当中枢政府拨来巨额经费时，它盘剥的就是国家。对军人而言，战争是向国家夺取外快的最佳时机——他们收入的双重结构保证了这一点。当然，还有其他欺诈有待发掘，也还需要更多量化工作来分析上述现象。然而，可以稳妥地得出结论：所拨军费的很大一部分——很可能超过一半——被不必要地、非法地花费，或被文武各级官员侵吞。判处胡齐仑死刑的谕旨中，嘉庆清楚陈述了将领们不及时结束战争的理由：\n\n明亮、永保等将领剿贼迁延，无意了结战役。他们知道：成功结束战役，最多不过得五等爵位之一，俸禄有定。这与统兵经过地方时收取成千上万两的厚礼相比，何啻天壤。所以他们被诱惑着留贼养寇，以自肥身家，虚耗国帑以中饱私囊。这就是贼匪蔓延远近、久未荡平的原因。^253\n[译者按：原上谕自英文直译，文言原文待核，见注释253。]\n\n清朝国家管理这场战役财政的失败几乎无可置疑，但应当指出：鉴于战时后勤制度的结构与行动的规模复杂性，漏洞一出现就堵上，确实是极其困难的任务。与18世纪大多数战争不同，这场战争对付的是中原地区众多股团的叛军，他们在漫长冲突的大部分时间里打游击战。军队从一省追到另一省时，有权从其他省份的后勤机构领取经费与其他后勤支持。于是，军队有机会既从家乡省、又从作战省双重领取饷银、津贴与犒赏。战场星散于地方社群之间，而非边疆或异域，地方社会的卷入规模自17世纪末吴三桂之乱以来所未见。战区知府知县们积极牟取最大利益时，后勤人员没有任何机制核实他们的请款。粮员与粮台的请求也是如此。请款数额大到不合理时，后勤人员能做的只是发款前稍砍一点。结果，申请者们故意多报，以防被砍。^254\n1799年春，恒瑞承认：从军需局向州县分发经费是有问题的：\n\n叛乱初起时，军队仓促调遣，后勤诸事皆草草办理。因此，无法每笔申报都按规章发款。[经费]随请随发，未立章程。结果，雇驮畜民夫、盐菜银、雇乡勇、赈济难民、购粮供军等各项，所付之数案案不同。有时军费先由西安军需局分发[到]汉中、兴安两府，再分发州县。有时州县知县径赴西安军需局直接领款。西安局与[汉中、兴安]的道府衙门只知各自拨出之总数，短期内拿不出逐项账目。^255\n[译者按：原奏自英文直译，文言原文待核，见注释255。]\n\n此时，拨给陕西的军费已超过一千万两。然而，正如恒瑞所奏报的，没有正规的簿记。他认为核查过去所有账目是难事，请求皇帝派高级官员到汉中清账、订立章程。嘉庆闻之震惊，同时也松了口气——因为松筠正赴陕途中。^256 到任近一年后，松筠为陕西战场订立了一些后勤规章，一些地方予以遵行。^257 然而，松筠不久离去之后，规章显然被弃置了。战役将近结束时，又曝出陕西没有正规簿记来交代近三千万两的花费。^258 1801年中，吴熊光就任湖广总督时，发现恒瑞描述的情形在湖北也存在：拨发军费没有精确的规章可循，几个军需局——包括武昌局——向军队与知县发款时相互重叠。检查襄阳军需局的账目后，吴熊光惊讶地发现：拨给各方的钱数有记录，钱的去向却毫无记录。^259\n后勤人员——包括主管们——在监督州县花费军费上完全束手无策。1798年底，福宁承认滥行普遍。然而，他不认为在战役结束前厘清所有欺诈案件是可行的——届时所有账册会由粮员与地方官员提交审计。^260 嘉庆也知道：掩盖或揭露漏洞与欺诈的关键在于账册：\"军中财务之弊，向来皆因开支混杂、[报账]拖延而生。加之，一项不能获准，便与他项混杂。于是事事纠缠，便于作弊。\"（原文待核，见注释261）^261\n对嘉庆而言，最后的办法似乎也只剩战后通常开始的审计。清朝自开国之初就建立了多层次的审计制度——所谓\"奏销\"（zouxiao）——既管日常开支，也管战争与水利工程等临时开支。^262 军费审计中，开支按类型编目：如发给军队的津贴、犒赏、乡勇饷银、运输费用、弹药装备费用等。每类之下，按地点与时间分多个\"案\"（an）——多则数十、甚至上百案。申报提交户部时，由官员书吏对照规章审查。开支若合乎规章，其数额从所拨经费中扣除、申报获准。开支若违规，退回申报人重做。这个制度虽是国家财政健康的安全阀，却有办法绕过它。最常见的做法，是申报官员贿赂审计官员。^263 审计官员只负责核查开支是否合乎规章；他们不可能知道某一案件实际付了多少钱。例如，申报\"为便利军队通行修了一座桥、花了多少钱\"——只要费用与某长某宽的桥相符，审计官员就会批准。但他们不要求任何证据来证明这笔钱是否真是修桥的实际费用、桥是否真修了。\n因此，只要花钱的人能编出正当用途，审计就几乎伤不到前线腐败的作恶者。然而，寻找或捏造借口需要时间——这很可能正是战争无法更早结束的原因。战役拖得越长，侵吞者煮账本、凑理由的时间就越多。正如嘉庆1799年秋所指出的：\n\n试想：国库储备本有定数。迄今尔等已糜费国帑七千万两，且不以军务为先。如此，贼匪何以平定？尔等之心，不过反复请款、虚报开支，以弥补战争早先造成的[账目]窟窿。因此，尔等迁延时日，不愿收束战役——唯恐战事一完，欺诈尽露，[所欠之钱]无从缴还。^264\n[译者按：原上谕自英文直译，文言原文待核，见注释264。]\n\n1801年初，受各战场叛军人数大幅减少的鼓舞，皇帝准备再次在财政前线采取行动。元旦，嘉庆颁发谕旨，命开始审计战役头三年的开支——因为时间越久，账目越难厘清——鉴于开支规模之巨、性质之杂。他盘算着：揭露那几年的欺诈应当没有障碍——那一时期主持后勤的官员几乎全被罢免或惩处了。然而，他裁定：乱花与侵吞的钱要由责任人缴还。^265 由于过去很少在战争结束前审计，这是不同寻常之举。显然，嘉庆急于从前线腐败的作恶者手中讨回一些钱——尽管他无意让任何人承担政治或法律责任。\n这道谕旨在战场省份遭到沉默的抵制。嘉庆严正的指令之后，1801与1802年只有零星的申报。勒保这两年提交的少数案件中，大多来自第二次廓尔喀之役或苗疆战役；只有几案来自白莲教战争，且都是1796年初孙士毅署理四川总督时期的。毫无疑问，精明的勒保尽量避开更浑浊、问题更多的年份。同时，陕西在嘉庆审计令之后一年半只提交了十案。嘉庆不悦，1802年夏末训斥陕西如蜗牛般的反应，坚持陕西两个月内提交全部案件。^266 要求再次落空，尽管它促使陕西此后数月提交了更多案件。直到1804年底最后一次宣布胜利之后，战场各省的申报才大批涌来。^267 对嘉庆号召的明显迟缓回应，为他的上述论断作了注脚：想办法在审计中过关的时间，确实是战役拖延的一个因素。围绕账册的较量远比战争本身长久。审计的结果是：许多在战争中任职的官员被责令缴还乱花或侵吞的军费，但一些黑洞永远没有揭开。^268 到1814年——战争结束十年后——陕西战争头三年所花的五百多万两仍无交代，湖北、四川与曾解\"协饷\"的各省所花的二百五十多万两仍未结清。^269 换言之，拖延战术对战争暴利者的用处，在审计中与在战争中一样。\n注释\n[译者按：文献简称同前各章。XFFLFB即《钦定剿平三省邪匪方略续编》。]\n题辞：XFFL, 127/23b–24a.\n\n嘉庆朝总收入降至四千七百至四千八百万两。史志宏《清代户部银库收支和库存统计》（Shi Zhihong, Qingdai Hubu），41–42, 148–70。\n此前的战争也是如此。托伊费尔（Theobald）War Finance, 29–36。\nXFFL, 34/32b. 据表7.1，到1797年底实际解往战争的经费为二千九百九十万两。\nQSLJQ, 39/6b–7a; XFFL, 89/14a, 90/18b, 123/12b, 128/32b–33a, 162/17a–18a. 据表7.1，各来源合计约四千六百三十万两。\n嘉庆多次说此话，首次在1800年三月，随后在1800年中、1800年底与1801年初。XFFL, 162/17a–18a, 177/3b–4b. 但据表7.1，到1799年底只有五千八百七十万两，到1800年底为七千三百三十万两。\n陕西官员不止一次提到：到1799年春，本省已收到一千一百多万两。XFFL, 97/8b-9a, 112/12a. 据1803年呈户部的报告，陕西在战争头三年收到一千万两。NGDK, 225425. 1799年底，魁伦说该省到那时已收到一千九百五十万两。XFFL, 126/12a.\n户部库1796年只收到五百七十三万四千四百九十六两。乾隆朝平均为一千二百一十二万三千五百九十七两，嘉庆朝为一千一百零五万三千零五十五两。史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），147, 175, 184。\n1801年初陆有仁请湖南送十五万石米到陕西时，嘉庆让湖南从应解税款中扣减运输费用。XFFL, 233/8a–11a.\nXFFL, 352/24b–25a.\n1796年十月，毕沅与汪新在四百万两刚拨给鄂豫之后不久，又请二百万两——理由是雇乡勇、赈济难民、救灾与六千名援军的到来。XFFL, 20/4a–b.\nXFFL, 55/15a–b.\n1798年初四百万两到达时，已欠付三百万两——包括军队与乡勇的饷银、雇驮畜、采购给养弹药。XFFL, 68/23b–24a, 68/27b.\n四百万两到达时，二百万解往成都，但很快只剩四十三万二千两——三十九万六千两用于弹药、军服与运输，五十九万两购粮，五十八万二千两偿还拨给四川绿营驻防与驻藏官军的经费。还有其他欠款：军队饷银津贴、赈济经费、犒赏与抚恤。解往保宁、达州军需局的二百万两中，支付四川所有已部署部队的津贴与所有粮台民夫的工钱之后，只剩七十万两。XFFL, 79/9a–12b, 81/1a–b.\n1798年夏，景安与高杞请一百五十万两赈济湖北难民、修复基础设施。乾隆给了他们一百万两。XFFL, 74/39b–42a. 年底，乾隆批准了陕西所请三百万两中的二百万两——陕西六个月前刚收到二百万两。XFFL, 83/24b–27a.\n按广兴的估计，额勒登保与德楞泰每月需十万至二十万两（shi yu wan liang），七十五与朱射斗每月需三万多两。GZDJQ, 4753; XFFL, 145/10b–11a.\n从嘉庆四年十一月到五年正月，广兴拨出四十五万两，约每月十五万两。XFFL, 147/29b–30a. 1800年春，广兴奏报他四个月花了一百四十六万两，包括给魁伦的十八万两与解往成都的八万两。XFFL, 159/16b–17a.\n1802年，户部驳回了长麟\"为在甘肃境外作战的甘肃军队赏一月饷银三万二千五百两\"的申报。驳回理由是：难以确认那些军队是否已在作战省份领过犒赏。卢康（Lukang），嘉庆七年七月初二日，NGDK, 111164。\n1797年春东乡香炉坪之战据称杀死一万名叛军之后，乾隆只赏部队荷包等小礼物。XFFL, 40/33a–34b. 但他给攻下芭叶山叛军据点的福宁、额勒登保部队——包括土兵——赏了一个月饷银。XFFL, 41/36b–37b.\n1797年夏，孙老五被杀、徐天德与王三槐之母被擒时，乾隆赏部队一个月饷银、乡勇一个月口粮。他还给负伤士兵赏了一个月饷银。XFFL, 41/17a–19b.\n关于两类库藏，见史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），6–7。\n据史家史志宏，内库储备通常总计超过一百万两。看起来数额应当更高——1796与1797年从内库的几次拨发，每次高达四百万两。\n户部库1796年拨出一千八百五十四万一千七百六十二两，1797年三千五百一十六万八千零四十九两，1798年二千五百一十四万七千九百六十五两。史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），78–79, 184–85, 259–60。加上全国性蠲免，亏空创纪录：1796年一千二百八十万七千二百六十六两，1798年八百七十三万四千零三十九两（1797年无记录，可能更高）。史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），197。\n史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），110–11。\nQSLJQ, 37/18b–19b; XFFL, 87/8a–9b. 此后他反复提到这个数字。XFFL, 89/14a–b, 90/18b–20a.\n即1796年一千八百五十四万一千七百六十二两、1797年三千五百一十六万八千零四十九两、1798年二千五百一十四万七千九百六十五两。史志宏《清代户部》（Shi Zhihong, Qingdai Hubu），184–86。\n1800年初，嘉庆写信给在陕西的那彦成，表达了对银储备快速流失的深切担忧。XFFL, 124/13b–14a. 年底，嘉庆又向新任陕西巡抚陆有仁表达了关切。XFFL, 209/19a–20a.\nQSLJQ, 39/7a–b; XFFL, 89/14b, 108/40b.\n听松筠说一些士兵因军服鞋子早已穿破而用牛皮裹脚后，嘉庆于嘉庆四年七月初五日指示：规章虽须遵守，但不必过苛，鉴于士兵所历的危险艰辛，给养与犒赏应当充裕。XFFL, 108/24b–24a.\nXFFL, 143/11a–12a.\nXFFL, 147/12a. 又见XFFL, 143/11b, 161/20b。\nXFFL, 162/20a–21b.\n1799年春，林俊向成都的商人店主借了六万两。林俊承认四川不止一次这样做。XFFL, 90/18a–b, 105/3a–4b, 113/25b–26a, 118/31a. 1800年春，台布向汉中的店主借了五千两购粮。XFFL, 156/36b–38a, 158/15a–b.\n1799年夏末，倭什布写信给安徽、江西巡抚，请每省各出五十万两——或从省藩库、或从关税——因为湖北军费已尽，他不得不向湖北藩库借了六十六万两来守边御川匪。XFFL, 109/27a–28a, 109/29a–b. 倭什布声称1800年已向湖北藩库借八十六万两。XFFL, 221/12b. 台布1800年底承认向陕西藩库借过钱。XFFL, 204/12a–b. 1801年初，陆有仁奏报已向陕西藩库借六十二万两，嘉庆批准了他\"从河南请三十万两\"的请求。XFFL, 225/26b–27b, 225/31a–b. 三周后，陆有仁又以同样借口、加上所拨经费未到，再请六十万两——也获准。XFFL, 230/31a–36a. 1800年夏末，姜晟以湖北当年只收到五十二万两军费为由，向湖南借了十五万两。XFFL, 189/25b–26a. 1800年底，姜晟奏报他一直在用省费支撑战役，若襄阳、郧西出现紧急事态，将向河南求助。XFFL, 218/45b–47b.\nXFFL, 109/27a–28a.\nXFFL, 146/16a.\n嘉庆1799年底说：\"魁伦与松筠皆正直、为国忧心。朕绝不可怀疑他们会侵吞经费。若不能深信此二人，军国大事经费之任，还能信谁？\"XFFL, 126/30a.\n到川后，魁伦数月间收到三百五十万两，尽管他请求的更多。XFFL, 126/18b–22b. 1799年底，松筠在一百五十万两解陕五个月后又请二百万两——他偿还了陕西藩库六十六万两，但余款不够所有开支，只好再向陕西藩库借五万两。嘉庆只给了他一百万两。XFFL, 123/9a, 123/11b–12a. 1800年初，松筠在收到五十万两后不久又请山西、山东、河南、江苏、安徽各出一百万两，嘉庆驳回并严厉斥责了他。但他允许松筠从拨给四川的一百万两中扣留二十万两。XFFL, 128/5b–6b, 138/7b–12a.\n1799年底，松筠奏报马慧裕从拨给甘肃的军费中扣留了四十万六千两。XFFL, 132/5a. 1800年春，额勒登保与德楞泰的到来使陕西开支上涨，松筠两次截留拨给四川的经费近一百万两。XFFL, 144/20a, 153/23b–24b, 165/23b–24b.\n1800年春末，台布以陕西每月需约五十万两为由再请二百万两，嘉庆震怒，在一道长谕中倾泻沮丧。XFFL, 162/11b–14a, 162/16b–22a. 不久，台布又请一百五十万两。嘉庆不仅驳回，还给了台布\"严旨申饬\"。XFFL, 166/27–29a, 166/30a–32b.\n最终，台布请求把松筠截留的近一百万两在审计中算作拨给陕西的经费——嘉庆批准了。XFFL, 155/35b–36b, 155/38b–40b, 159/16b–19a, 165/23b–24b, 165/29b–30a, 166/27a–29a.\nXFFL, 156/36b–40a, 158/15a–b, 159/20b–22b.\n关于1801年北京水灾及其善后，见李明珠（Lillian Li）《同饥荒作斗争》（Fighting Famine）第9章\"The 1801 Flood\"。\n表7.1中1802年虽列有户部库的二十万两，但那笔钱是江西的地丁税、由江西直接解往湖北。\n据史志宏，乾隆朝只有百分之二十四点八的总收入解交中枢政府，嘉庆朝百分之二十三点二，而更早时期比例更高。《清代户部》（Qingdai Hubu），40–42。因此，百分之七十五以上的收入留在各省。又见邓斯坦（Dunstan）\"Finance of Imperial Munificence,\" 180。\nJQSYD, 5:18. 1800年，河南还无法履行另一项例行义务：为江苏修大运河提供材料经费。JQSYD, 5:379.\nJQSYD, 5:243, 365.\n邓斯坦（Dunstan）\"Finance of Imperial Munificence,\" 207, 234–35. 河南的年现金收入定额自18世纪中叶起为三百三十万两。梁方仲《中国历代》（Liang, Zhongguo lidai），387。\n山西的年现金收入为三百万两。梁方仲《中国历代》（Liang, Zhongguo lidai），387。山西商人专营盐、铁、茶、丝、棉织品、粮、油、染料与木材，也经营当铺。黄鉴晖《明清山西商人研究》（Huang Jianhui, Ming Qing Shanxi），72–147。关于山西商人参与边境贸易，见赖惠敏（Lai Huimin）\"清政府对恰克图商人的管理\"。\nGZDJQ, 4029; XFFL, 73/39b–41a.\n1799年夏，勒保请求向山西\"借\"五十万两。嘉庆指示山西送四十万两到四川。XFFL, 110/29a–b, 112/1a–2b. 1799年底，那彦成赴前线途中向山西请一千匹马。山西巡抚伯麟用自己与山西其他官员的\"捐输\"购马。XFFL, 130/20a–21a. 1800年夏末，应台布之请，嘉庆指示伯麟给陕西五十万两。后来湖北截留了拨给陕西的二十万两，嘉庆便请山西送二十万两给陕西。伯麟送了三万两……送陕西三十万两，但对另外四十万两犹豫。然而，被嘉庆斥责后，伯麟又送了四十万两到陕西。XFFL, 194/16a–17a, 194/20b, 218/9a–b; JQSYD, 5:453, 461. 1801年初，嘉庆让伯麟从山西藩库取十万两，交给赴陕的两位钦差倭星额与邱兴健。XFFL, 230/15a–b.\n1803年春陕西向山西请三万石粮时，嘉庆告诉伯麟：多送些到陕西更好。XFFLXB, 25/18b–19a.\n1800年初，嘉庆命解一百万两到山西，以备川陕急需时支用。不久，嘉庆命送五十万两到陕西、另五十万两到四川。XFFL, 151/12b–14a, 155/35b–36b, 155/38a–b. 1800年底，嘉庆命把向商人筹集的二十万两解陕、存入陕西藩库备将来之用。JQSYD, 5:461.\n1802年初，嘉庆把内地关税、江苏盐课与商人\"捐输\"解到河南，以备战场省份之需。XFFL, 32719b–20a; XFFLXB, 4/1a. 同年晚些时候，应吴熊光之请，嘉庆命解五十万两到南阳，备额勒登保赴鄂之需。XFFL, 342/33b–36a, 342/38b–40a.\nXFFL, 304/7b–8b.\n1803年春，嘉庆让河南巡抚马慧裕为陕西备粟麦。马慧裕立即送五万石粟到陕西。XFFLXB, 8/39b, 9/26a–27a.\nJQSYD, 4:532. 关于监生头衔对持有者的价值，见邓斯坦（Dunstan）State or Merchant, 192。关于过去售卖监生头衔补仓之事，见濮德培（Perdue）China Marches West, 367–70。\nJQSYD, 5:411–12.\nJQSYD, 5:465.\n嘉庆六年十一月初九日，嘉庆裁定：各省售卖学衔的收入达一万两，即解京。然而，他允许陕西把钱放入军需库，战后解京。XFFL, 283/35a–b.\n曾小萍（Zelin）Magistrate's Tael, 65。此做法始于顺治朝，康熙朝普及，但乾隆、嘉庆朝最频繁——仅盐商就被收取了六千五百多万两。陈锋《清代盐政》（Chen, Qingdai yanzheng），215–26。\nJQSYD, 4:98–99.\n1799年春，两淮盐商捐一百五十万两，嘉庆只接受了一百万。JQSYD, 4:158. 到1800年春，浙江盐商已捐一百五十万两，又认捐一百万两。JQSYD, 5:316.\nJQSYD, 5:370–71. 1800年晚些时候，一些富户向战役捐了二百一十八万两（接受一百五十万两）之后，其知府知县们又向他们\"借\"十万两。嘉庆命罢免那些官员，并禁止在战区之外为战役向当地居民募捐。JQSYD, 5:459.\n1799至1803年间，山西盐商捐了八百万两。黄鉴晖《明清山西商人研究》（Huang Jianhui, Ming Qing Shanxi），469–70。史家陈锋认为：嘉庆朝盐商为历次战役共捐一千八百六十三万两。陈锋《清代盐政》（Qingdai yanzheng），220。\n戴（Dai）Sichuan Frontier, 197–216。\n四川常平仓储备总额原定为二百八十二万七千七百石。1796年底以来，解往苗疆战役四十二万六千三百七十石、支援四川本省战役一百七十四万三千五百石之后，到1798年夏只剩六十五万七千八百三十石。达州方面，1796年底至1797年二月消耗了三十万石。XFFL, 35/30a–b. 万县方面，据广兴说，1800年初只剩一万二千石米。XFFL, 153/29a–20b.\n1798年，英善与福宁向甘肃请十万石麦。XFFL, 66/22b, 72/9b–11b, 73/39b–40a. 不久，四川请湖北送三万石米。由于解川之米本是拨给荆州驻防旗兵的，景安从湖南调三万石米给荆州驻防。XFFL, 43/7b–8a, 71/14a–b及16a–b, 84/26b–28a. 即便收成不好、粮价高企——如1800年——广兴仍让达州后勤人员就地购粮。XFFL, 153/29a–20b.\n1802年晚些时候陆有仁请四川送米到陕西时，川西的一万石米解到了陕西。XFFL, 335/20b–21b. 1803年，勒保同意让陕西派员向川北居民购米。XFFLXB, 10/10a–11b. 1804年初夏，勒保通知方维甸：陕西可以派员到四川顺庆、重庆两府购粮。XFFLXB, 27/1a, 27/3a–4a.\n陕西为四川备了一万石米、三千石麦豆与弹药。清军从湖北追击襄阳起事者入川时，陕西又分两批送一万六千石米到四川。XFFL, 42/22a–23b, 43/7b–8a.\nXFFL, 166/28a–29a.\n1800年因旱收成不好，汉中米价达每石九至十两。XFFL, 230/31b–32b, 233/4a–11a.\n台布春末从湖北郧阳购了三千石米。XFFL, 166/28a–29a. 随后，应台布之请，湖北从数处粮仓送两万石米到陕西（陕西支付运输费与湖北补仓费）。XFFL, 166/28a–29a, 166/30a–32b, 174/27b–32a. 夏天，台布请江西送十万石米到兴安。他估计陕西军队每月耗米一两万石。XFFL, 184/4a–5b. 秋天，陕西收到江苏、广东、广西的米。XFFL, 187/11a. 1800年底，嘉庆拨十万石米给陕西。XFFL, 230/31b.\n1801年初，陆有仁因陕南严重粮荒向湖南请十五万石米。XFFL, 230/31b–32b, 233/4a–11a. 1802年春，江西六千石、湖南两万石米解到陕西。XFFL, 315/29b–31a, 319/15b. 不久，又从江西解八万石米到陕西。XFFL, 327/13b–14b.\n1801年初，湖北截留六万石漕米。随后书麟截留了江西解陕途中经过的一万石米。XFFL. 224/13a–14a, 226/1b. 1802年秋，湖北从安徽、湖南、河南、四川共采购十万石米粟及其他粮秣。XFFL, 331/1b–4a, 331/29a–30a, 331/31b–32b.\n三百五十万石之数见于嘉庆庆祝战役最终完成的长诗注释。然而，那里所给外省运粮之数——约六十三万六千石——并不准确。XFFL, 卷首, 53a。\n台布曾奏报：军队喜欢米胜过麦，但他说这是因为陕西潮湿气候下麦易变质。XFFL, 166/28a–29a, 206/5a–6b.\n从四川保宁到陕西边境，一石米的包装运输费为一两四钱至一两五钱（夏季二两）。随后运到汉中每石一两四钱，经汉江到兴安不足五钱。但从潼关到汉中每石三两七钱——还不包括河南陕州到潼关的费用（河南支付）。XFFLXB, 12/7b–9a.\nXFFL, 336/3b–4a.\n关于军需局的起源，见陈锋《清代军费》（Chen, Qingdai junfei），265。关于两次金川之役中的军需局，见戴（Dai）\"Qing State,\" 45–48，及托伊费尔（Theobald）War Finance, 34–36。\nXFFL, 14/28b, 22/10b–12a, 226/1b.\n1799年秋，高杞提到：荆州、襄阳的军需局已关闭，武昌的仍在。XFFL, 115/26a–b.\nXFFL, 312/25b–26a.\nXFFL, 10/15b–16a.\n1798年，布政使林俊主持成都局；川北道李鋐与知府吉胜保主持保宁局；石作瑞监督达州局。XFFL, 126/23a.\nXFFL, 107/19b–20a. 叛军渡嘉陵江后，广兴让重庆为川东、川北采购弹药，成都局只为川西提供弹药，但他计划道路肃清后恢复成都局的全部职能。XFFL, 153/30b–31a.\nXFFL, 66/23a, 107/19b–20a.\nXFFL, 63/16a–17a.\nXFFL, 43/6b–7b.\nJQSYD, 4:56, 143.\nXFFL, 35/29b–31b, 56/2a.\nXFFL, 75/15a–16a.\n1798年夏，英善与福宁让一百名乡勇各背四百两银子，经便道解往太平前线。XFFL, 76/26a–27b. 1799年春，福宁让四百名强壮挑夫各背一百两，解往大宁、开县、太平交界的山区给德楞泰。XFFL, 97/1b–2b.\nXFFL, 135/17a–18a. 1798年底，福宁在川东北数县储粮。XFFL, 90/15b–16b. 1799年春，福宁在叛军难至之处的平民堡寨囤粮。XFFL, 101/14a–b. 广兴也在靠近前线的平民堡寨储银储米。XFFL, 138/15b–16b, 146/32b–33a.\n关于两次金川之役中借雇民夫之名的滥行，见戴（Dai）\"Qing State,\" 48–52。\nXFFL, 35/29b–31b.\nXFFL, 41/38a.\nXFFL, 41/37b.\n1799年春末，叛军袭击四川云阳一处粮台，三十多名民夫被杀。XFFL, 101/15a–b. 不久，福宁奏报运输队频繁遭袭，粮失人亡。XFFL, 107/13b–14a. 1802年春，陆有仁奏报秦岭中挑夫被杀。XFFL, 304/20b–21a.\n1797年春东乡发生此事时，英善从外地招民夫。XFFL, 35/29b–31b. 1797年夏太平亦然。XFFL, 41/38a. 1799年春末，福宁抱怨在四川雇民夫之难。XFFL, 101/14b.\n1800年底，陆有仁提高陕西挑夫工钱——因为粮价数倍于前，且起事者近在咫尺、威胁挑夫。XFFL, 230/32a–b. 1802年多雨的夏季，陆有仁再次提价雇挑夫，向秦岭追剿苟文明的军队运米。XFFL, 319/15b–16a.\nXFFL, 130/11a–b.\nXFFL, 171/12a–b.\nXFFL, 312/26a.\nXFFL, 182/7b–10b, 186/19a–b, 189/14b–16a.\nXFFL, 259/24b–26a.\n1798年夏末，乾隆清楚表达了对勒保处置战争财政不当的愤慨。XFFL, 76/29b.\nQSLJQ 39/17b–18a; XFFL, 90/18b–19a.\nQSLJQ, 37/16b–19b, 37/22b–23a, 38/34a–b, 39/6b–7b; XFFL, 87/15a–b, 89/14a–b, 105/4b.\nQSG, 11316.\n关于雍正帝对火耗的改革，见曾小萍（Zelin）Magistrate's Tael。\n例如，广兴请求每月从达州局\"平余\"中支三百两，支付其助手书吏的工钱与一切运转开支，以其兄弟的\"养廉银\"偿还——他被罢免后没有俸禄。XFFL, 137/15a–16b.\n只有一次，那些箱子在途中被打开。1799年春，永保在运输队进入陕西栈道之前拦下了押解四川的三百万两，命打开所有箱子、把银锭改装入每箱两千两的小箱，这样一头骡可以驮两个小箱（共四千两）单独行进。永保论证说这可省百分之二十五的骡力。XFFL, 100/10a–12a, 126/23a–24a. 以永保贪婪的名声，此过程中可能有些银子被偷了。\n这在一些中枢官员为胡齐仑案准备的报告中提到。JQSYD, 4:163. 然而，户部的规章与则例中并没有此规定。\nXFFL, 127/18a–20a; JQSYD, 4:347–51. 胡齐仑被处决后，奏报其侵吞的精确数额为八万三千九百六十一两。JQSYD, 4:429.\n1797年陕西解一百零一万两到四川时，发现短缺五万五千零四十两——短缺百分之五点四。四川请陕西补足时，陕西说他们把户部解来的照数转解了。1798年底，北京的二百万两到达时，四川申报短缺十一万三千二百四十多两。1799年初，户部库的三百万两到达时，纳山接款。他用库平从数十箱中取锭称重后，声称那些银锭只重百分之九十六至九十八，所以他收到的是二百九十万而非三百万两。1799年春，纳山接收了陕西早先扣留的四十万两，声称银子重三十八万零七百五十六两——短缺百分之四点八。XFFL, 126/22b–25b, 132/33b–37b.\n纳山本应缴还此数，但福宁与勒保都没有催缴。福宁只把八百两算作短缺了事。XFFL, 132/38a–39a, 139/24b–28a.\n陕西向四川购米时，纳山曾参与向陕西官员交米。XFFL, 335/21a.\n然而，曹相业受查时，其府属知县们都坚称：曹相业按原比例发银时都有短缺。XFFL, 131/30a–34a.\nXFFL, 131/34a–35b. 1800年初江西的三十四万二千六百两到达州时，广兴与后勤人员用库平称重，长出三千一百八十两。广兴把钱入了军费。XFFL, 146/35a–b.\n解达州的七十万两长出三千六百六十九两，解保宁的四十万两长出三千一百二十六两，解成都的九十万两长出四千三百两。长余银并入军费总数。XFFL, 141/12b–14a.\nXFFL, 141/16a–b, 146/37a–b. 1799年秋，嘉庆撤销了对户部库人员\"向四川解款短缺\"的调查。JQSYD, 4:322.\n1801年初，嘉庆提到：短缺只出现在头三年，此后有时只报长余。XFFL, 229/1b–2a.\nXFFL, 81/4a–b.\nXFFL, 120/16a–17a, 20b–21a.\nGZDJQ, 2596.\nXFFL, 93/4a–7a.\n1803年初，吴熊光请求批准给绿营最低阶军官的跟班每月五钱\"盐菜银\"——则例中无此项——他援引的是四川的先例。XFFLXB, 10/39b–40a.\n1797年底，额勒登保弹劾一名后勤官员未能保障其部队供应，朝廷命将该官员罢免、解京受审。XFFL, 55/31b.\nXFFL, 93/5b–6a.\nQSLJQ, 39/25b–26a.\nXFFL, 82/23b.\nXFFL, 90/19b; QSLJQ, 39/18b.\n例如，河南曾给1796年底在鄂北作战的健锐营、火器营送皮裘。XFFL, 23/30b.\n陕西后勤给了他十万两，但他又向四川后勤要四万五千两。明亮辩称：他虽带一千八百名士兵入川，但额勒登保生病时其部队也归他统带。因此他在川时有五千多名士兵——尽管并非所有士兵一直随他。他声称自己没领够应得之数。QSLJQ, 35/14b–15a; XFFL, 82/20b–24a, 85/18b–20b.\n1798年中，德楞泰大声而反复地抱怨四川后勤，同时索取超额经费。福宁试图更严格地发款时，包括德楞泰在内的一些将领抱怨。XFFL, 126/17b–18a. 1799年秋赴鄂时，德楞泰责备倭什布未能按时给他的军队送补给。XFFL, 128/20a. 1801年春，德楞泰痛斥湖北后勤——如第5章所述，这导致倭什布被罢免。\nQSLJQ, 32/8b–9a; 35/2b–3b; XFFL, 80/3b–4b, 80/7a–b, 81/4a–b, 103/8a–9a, 103/14b–15a, 133/20b–28a.\n据福宁说，德楞泰在1798—1799年一年间领了五十三万五千两。魁伦后来奏报：德楞泰所领经费中，五十二万八千八百六十一两用于军队饷银津贴与运输补给，十三万二千二百三十九两是军队借支的军服装备费。XFFL, 133/20b–28a.\nXFFL, 97/1a–5b, 103/8a–11b, 105/1b–2a, 3b–4a, 107/16a–20b, 108/35a–38a, 110/25a–26a. 据谭光典说，德楞泰1798年中入川时有八千多人，其部队通常规模为七至八千人，尽管在川期间某些时点超过一万。XFFL, 133/27b–28a.\nXFFL, 131/10b–12a.\nXFFL, 192/9a–12b.\n勒保与德楞泰说：广兴回京后，一些军队已派往甘肃，一些伤病兵已裁，一些四川驻防兵已回本营、不再由军费发饷。XFFL, 203/22b–27a.\nXFFL, 161/11b–12a, 204/12a–b.\nXFFLXB, 8/26b–27b; SHD, 嘉庆八年三月, 57–58.\nXFFLXB, 10/30b–31b; SHD, 嘉庆八年四月初六日, 37–38.\nXFFL, 135/16b–17a, 344/14b–15a.\nXFFL, 140/6a–7a.\n勒保还用四川的盐茶税报销了这笔开支。XFFL, 138/14b–15a. 1799年春，恒瑞从汉中粮台领了一千两犒军。他认为不够，请求加四百枚银锞与二百五十面银牌——共三百七十五两。XFFL, 135/12a.\nXFFL, 129/20b–22b.\nXFFL, 140/10a–b.\nXFFL, 284/15b–17b, 284/20b–23a.\nXFFL, 288/24a–b.\n户部的裁定，是回应陆有仁起草并提交的一组《军需则例》修订案——其中犒赏只能从\"平余\"军费中支付。XFFL, 344/14a–15b.\n福宁补充说：鉴于旗兵、绿营都作战勇猛、战役正处于关键时刻，他不得不妥协，连则例未准的开支也供给，且帐篷、武器、弹药等项通常多给。XFFL, 90/16b–17b.\nXFFL, 235/12b–15a, 235/16b–17a.\n周国枢是纳溪县的典史。XFFL, 146/32b–34b, 146/38a, 148/22a–23a.\nXFFL, 97/1a–5b, 103/8a–11b, 107/16a–20b.\nXFFL, 138/5b–6a.\nXFFL, 138/14a–b. 广兴不久后重申了这一点。XFFL, 146/33a.\n1801年底，额勒登保与一些陕西官员捐出\"养廉银\"，为额勒登保的部队置办冬衣。他们花二万二千一百五十两，购得一万一千六百五十件棉袄、一千一百件棉衣、四千八百九十五顶冬帽、四千八百七十九条棉裤与四千九百二十四双棉鞋。XFFL, 288/18b–19b. 1802年秋，竹山知县范继昌捐钱为德楞泰的部队备了一千件棉袄、一千双棉鞋与一千双草鞋。XFFL, 336/20a–b. 看来让部队穿暖并不费钱——一个知县闲钱就够买几千件秋衣。\n1799年初，刑部侍郎汪承霈批评将领们有时数月不发士兵与乡勇应得的津贴，却继续请求提高津贴。XFFL, 90/20a–21b. 魁伦到川时，惊讶地发现：解川经费如此之多，士兵却数月领不到饷、装备简陋。如前所述，一些士兵没鞋穿，用牛皮裹脚。XFFL, 114/22a–27a, 116/2b–6b, 126/15b–16b, 133/20b–32a. 车森保1800年初押解高均德进京后向嘉庆奏报：陕西的清军有时缺粮，不得不吃死骡死马的肉。XFFL, 136/39a.\nXFFL, 206/4a.\nQSLJQ, 39/18b, 90/19b.\nXFFL, 126/12b–13a, 126/16b–18a.\n正如额勒登保1804年所说：他1799年底任统帅之前，外省乡勇月饷三至四两。XFFLXB, 28/5a–7b. 乡勇被派往外省作战时，饷银常提高。川陕乡勇被派往甘肃时，其饷银定为每日一钱、即每月三两。NGDK, 1133812. 又见QSLJQ, 172/17b–19a, 183/23b–25a.\n四川方面，每一百名乡勇配二十名领薪民夫。NGDK, 027561.\n1799年底，额勒登保把随征乡勇的月饷定为一点三八两，但给口粮与雇挑夫的津贴（fujia），并把防守乡勇的月饷定为三两、不发口粮。XFFLXB, 28/5a–7b. 同时，湖北乡勇领二两四钱、无口粮。陕西乡勇月领一点四六两、每日口粮零点零一石米。吴熊光请求按陕西模式支付湖北最后两千名随征乡勇。SHD, 嘉庆八年四月十一日, 61–62; XFFLXB, 10/40a–b. 1804年夏，额勒登保与德楞泰请求给最后乡勇加六钱二分、使月饷达二两。嘉庆同意。SHD, 嘉庆九年六月初一日, 51–55. 但1804年早些时候，嘉庆曾驳回类似的请求。SHD, 嘉庆九年四月二十五日, 201–7.\n卢康（Lukang），嘉庆十年三月初十日，NGDK, 113312。\nJQSYD, 11:966. 嘉庆多次重复这一看法。又见MQDA, A318–83。\n湖北负伤乡勇早在1796年夏就获得抚恤。XFFL, 10/24a.\nXFFL, 93/1a–b. 数月后，嘉庆在给战争领导人的另一道谕旨中重申了新政策。XFFL, 113/19.\n1805年，贵州巡抚福庆向中枢政府请六万九千四百五十三两，抚恤从贵州派往战役、或负伤、或阵亡、或伤病死、或失踪的两千二百九十九名士兵、军官与乡勇。他承诺核查是否有人或其家属已在他省领过抚恤、或无家属可领。若有此类情形，他说会在审计时从总额中扣除。福庆，嘉庆十年正月二十二日，NGDK, 115529。这表明双重领取抚恤并非闻所未闻。\nXFFLXB, 3/15b–17b, 3/19a–b.\nMQDA, A301–96.\n吴熊光奏折所引，XFFLXB, 28/20a–b。\nXFFLXB, 28/18b–22a.\nXFFLXB, 28/19b–20a.\n例如，湖北保康纪念阵亡官兵乡勇的祠中列有一千九百四十个名字。《保康县志》（Baokang xianzhi），3/102–13。\n吴熊光，嘉庆九年十二月二十三日，NGDK, 188734。\n常明，嘉庆十六年七月二十日，NGDK, 114654。\n广兴没有透露其名。XFFL, 151/9b–13a.\n卢康（Lukang）等，嘉庆十二年十一月二十九日，NGDK, 109909。\n特清额（Teqing'e），嘉庆十二年二月初九日，NGDK, 41220。\n勒保，嘉庆十二年五月二十七日，NGDK, 64130。\n勒保，嘉庆十一年二月二十五日，MQDA, A318–34。\n他们论证说：许多参与雇乡勇带乡勇者已死或已离去，乡勇被遣散时及此后无人抱怨欠饷。他们裁定：德楞泰拟一份无漏洞的方案再呈。嘉庆支持他们的裁定。XFFLFB, 36/7a–9a.\n方维甸，嘉庆十二年四月初八日，NGDK, 64114。\nJQSYD, 11:966.\n特清额（Teqing'e），嘉庆十二年二月初九日，NGDK, 41220。\n宜绵，嘉庆二年六月（无日），GZDJQ, 2680; 宜绵，嘉庆二年十月十九日，GZDJQ, 3287。\nJQSYD, 12:374–75; 卢康（Lukang）等，嘉庆十三年六月十六日，NGDK, 113812。\n勒保，嘉庆十三年二月二十五日，GZDJQ, 82。\nXFFL, 126/12b–13a.\nJXZL, 户部, 卷4。\n魁伦1800年曾提到此事——他试图用廓尔喀之役的先例论证雇驮畜高费用的正当性。XFFL, 164/30a–32a.\n和珅，嘉庆三年十二月十三日，NGDK, 2052。\nMQDA, A287-114, A287-115.\nXFFL, 6/17a–b.\nXFFL, 21/41a.\nXFFL, 4/1a–2b.\n汪新建议把民夫工钱提到每日二钱、无差使时每日一钱。XFFL, 17/10a–11b, 30/23b–25a.\nXFFL, 30/23b–25a, 48/13b–14a.\nXFFL, 103/8a–9a, 126/13a–14b.\n明亮的粮员田文旭暗示：明亮可能不知道骡与民夫的数量——他从没问过。XFFL, 82/22a, 133/28a–32a.\nXFFL, 133/25b–32a.\nXFFL, 103/8a–9a.\nXFFL, 103/8a–9a, 133/32a–43b.\nXFFL, 66/24a–b, 93/4b–6a, 103/14b–15a, 107/18b–19a, 126/14b–15b.\nXFFL, 126/15b–16b, 130/11a–17b.\n魁伦与广兴指出：《军需则例》规定每百里运一石粮的工价为三钱，他们辩称户部所给\"雇骡每日一钱五分\"之数是金川之役中雇马用的——那些马是地方政府调拨的、而非市场雇用。XFFL, 133/32a–44a.\n额勒登保1800年初必定把此做法带到了陕西。湖北方面，吴熊光1801年采纳。户部拒绝认可时，吴熊光辩称湖北遵循四川先例已有时日。1803年春，吴熊光恳请嘉庆批准。XFFLXB, 10/38b–39b.\n1800年初，广兴奏报：额勒登保与魁伦都没有遵循准则、执行商定的削减。额勒登保让官员全额保留马干、只把\"驮折夫价\"减半。满洲士兵方面，他把马干预减半，但允许全额保留\"驮折夫价\"。广兴责备魁伦与额勒登保沟通不畅。同时，魁伦允许官员全额领马干、所有满洲旗兵全额领\"驮折夫价\"。广兴估计：支付那些津贴的总费用每月将超过十万两。然而，嘉庆站在魁伦一边，无视广兴的抱怨。XFFL, 153/31a–34a.\n1802年初夏，陆有仁奏报：他不得不提高秦岭运米挑夫的工钱。XFFL, 319/15b–16a. 此前，湖北已向军队拨发雇民夫的经费（每一百名骑兵七十名民夫、每一百名步兵五十名、每一百名守兵四十名）。XFFL, 203/26a–b.\nXFFL, 203/26b.\nXFFL, 253/5a–15a.\n1803年底，额勒登保砍掉\"驮折夫价\"，只给官员军官发原\"马干\"；士兵只给足其应配民夫数的雇费。XFFLXB, 23/21b–22a. 然而，额勒登保回京后不久，方维甸1804年初请求恢复额勒登保取消的一些津贴——包括\"驮折夫价\"——因为一些部队仍在行动。嘉庆同意。XFFLXB, 23/21b–23b. 1804年底，吴熊光承诺：本省肃清叛军残部后，废除一切额外津贴——包括给官员军官的\"驮折夫价\"与给士兵的\"长夫\"雇费。XFFLXB, 33/31b–32a.\n自1796年正月起，湖北受起事冲击的地区获准缓征蠲免。1796年豫南一些地区也获准。从1797年初起，川东州县多次获蠲免。房县1796至1799年与1802年获蠲免，1800、1801年获缓征。《房县志》（Fangxian zhi），4/12b–13a。大宁1797至1804年间（除1798年）获蠲免或减免七次。《大宁县志》（Daning xianzhi），3/2b–4a。\n陈锋承认：这方面的记录极少。\"清代'康乾盛世'\"（\"Qingdai 'Kang Qian shengshi'\"），345–46。史家邓斯坦在\"The Finance of Imperial Munificence\"中探讨了蠲免时省政府如何应对收入损失，但没有讨论省以下层级。\n据福宁与英善说，四川省藩库1797年底已空。XFFL, 66/23b–24a. 1798年夏，宜绵奏报：甘肃藩库经费已尽——甘肃出资派两万士兵参战、又出资送十万石粮到四川。XFFL, 73/39b–40a. 1798年底，宜绵与秦承恩抱怨：陕西藩库因蠲免缓征——包括1796年起西安府普免——几乎空了。XFFL, 83/24b–25b. 到1800年秋，陕西藩库已空。XFFL, 204/12a–b. 1800年初，张汉潮突入豫西时，倭什布抱怨：河南已用尽本省地丁与其他税收来弥补预算缺口。XFFL, 85/30b–31b.\n这是广兴揭露的。XFFL, 145/11a–b.\nXFFL, 74/40a.\nXFFL, 110/27b–28a.\nXFFL, 126/20a–b.\n魁伦虽计划从达州局拨二十万两给成都、十万给重庆、十万给顺庆，广兴只同意送十万到顺庆、五万到重庆，并让先福在成都先用省军费垫支。XFFL, 147/3b–4a, 147/29b–32a. 但北京与浙江的八十二万四千五百两到达时，托津拨四十五万四千五百两给成都、十九万给保宁、十八万给达州。XFFL, 168/35a–37a.\nXFFL, 177/1a–b.\n1801年初，广东的二十五万两到达时，十万到达州、六万到夔州与重庆、九万到成都——成都又拨一些给保宁与潼川。北京与浙江的六十万两到达时，十八万送达州、十二万送保宁、三十万送成都。XFFL, 237/24a–b.\n1800年初，一百五十万两（七十万拨陕西、八十万拨四川）经西安时，主持西安军需局的马慧裕恳请把二十万两留在西安——而不是把全部七十万两送汉中——因为他手头没有经费。嘉庆同意。XFFL, 146/27a–29a.\nXFFL, 145/17a–b, 206/4a–5a.\nGZDJQ, 4753; XFFL, 145/10b–11a.\n曾小萍（Zelin）Magistrate's Tael, 26–46。\nGZDJQ, 4753.\nGZDJQ, 4753; XFFL, 145/11a–b.\nGZDJQ, 4753; XFFL, 138/16b, 145/12a–13a.\nGZDJQ, 8042.\nJQSYD, 5:541.\nXFFL, 131/30a–b.\nGZDJQ, 4753.\nGZDJQ, 4753.\nGZDJQ, 4753.\n马鸣銮后来升任开县知县。XFFL, 290/20b.\n1799年中，林俊从当地市场购了六十万石谷。XFFL, 66/22b. 1798年秋，四川收成好时，成都军需局拨款购粮。XFFL, 79/11a. 1799年底，林俊奏报他1797、1798年已购一百六十万石粮补仓。XFFL, 118/30a–31a.\nXFFL, 110/28a–b, 128/31b.\nXFFL, 128/29a–31a.\nXFFL, 128/31a–34a.\n嘉庆还表示：战后四川若确需财政援助，愿意再拨一次。XFFL, 128/33a–34a.\nXFFL, 133/41b–42b.\n1802年春末，勒保奏报：四川军队多年来一直由川南、川西供米——因为川东、川北的储备已用尽。XFFL, 313/22a–23b.\n1796年春，秦承恩在兴安府为湖北难民搭棚供饭。XFFL, 4/4a–b. 大约同时，孙士毅也在四川酉阳赈济湖北难民。XFFL, 4/13a–b. 1796年夏，湖北郧阳府的难民获一个月口粮、修房补贴与种子。XFFL, 11/6a–7a. 1797年春末，英善为达州、新宁、东乡、太平、巴州等上年秋天受起事冲击之地请赈济经费。XFFL, 35/31b–32b.\n勒保后来奏报：他给每个难民每天零点零五石米、零点零三两银。XFFL, 101/10a–b, 110/28b, 110/33b–35a.\n魁伦怀疑：如果军队供应不充足，勒保不可能划出这么大一笔钱赈济难民。XFFL, 116/5b, 126/18b. 广兴也认为勒保会把钱挪作他用。XFFL, 128/29b.\nXFFL, 219/17a–27b.\nXFFL, 24/17a–18b.\n兴安府城1798至1800年间修城墙，据称由\"捐输\"出资——包括兴安知府的四千八百两。XFFL, 165/25b–26b. 达州方面，地方书院汉章书院在战争期间被征用作高官的官邸衙门。1802年，达州后勤主管陈预修缮后，书院重开。陈预与达州其他官员据称捐钱聘师置田。此后数年，书院建筑又经翻修。《达县志》（Daxian zhi），13/17a。1803至1815年任奉节知县的蔡星捐三千多两修文庙。《奉节县志》（Fengjie xianzhi），25/4b。1799至1800年任夔州知府的严朝标，在奉节县城为儒学署建了六间新房。1807年，严的继任者周景福重建之。《奉节县志》（Fengjie xianzhi），6/3b。也有地方士绅发起并出资的情形，尽管不多。例如，他们1797年募五六百名民夫修奉节城墙。随后1798年底、1799年初又组织地方防务——包括用居民捐款造三十门铁炮。《奉节县志》（Fengjie xianzhi），28/35b–36a。\nXFFL, 127/23b–24a. 最高爵位一等公的年俸为七百两、三百五十石米。较低爵位的俸禄递减，最低的三等男为二百六十两、一百三十石米。《钦定户部则例》（Qinding Hubu zeli）1865年版，73/7a–8a。\nXFFL, 133/32b–33a.\nXFFL, 97/8a–b.\nXFFL, 97/8a–9b, 97/10b–11b.\nXFFL, 153/14b, 155/35b–36b.\nSHD, 嘉庆八年七月十六日, 125–28.\nXFFL, 259/24b–29b.\nXFFL, 82/22a–b. 1799年夏，福宁重申这些观点，强调：银锭离开达州、解往军队与地方衙门之后，钱的去向他无法控制——所有州县离达州数百里至数千里，他与勒保只是每十天核查三个局的报告。XFFL, 107/19a–20b.\nXFFL, 112/16b–17a.\n关于此制度的简介，见陈锋（Chen Feng）\"清代前期的奏销\"。关于军费审计，见陈锋《清代军费》（Qingdai junfei），176–89。\n陈锋（Chen Feng）\"清代前期的奏销\"，202, 212–13。\nXFFL, 116/11b–12a.\nXFFL, 229/1a–2b.\n嘉庆七年六月二十一日上谕，NGDK, 171522。\n基于NGDK现存档案的观察。河南与山西因卷入战争较浅，自1798年起已向户部提交军费。\n1803年底，许多战役期间在陕西任职的官员被责令缴还军费。秦承恩被责令缴还十万两。NGDK, 225422. 1805年，查出陕西战场至少七十万两被滥用或侵吞。卢康（Lukang），嘉庆十年五月十二日，NGDK, 108467。\n那些省份包括直隶、甘肃、云南、贵州、广东、福建。\n", "sections": [{"level": 2, "title": "经费", "id": "ch7-s0"}, {"level": 2, "title": "后勤", "id": "ch7-s1"}, {"level": 2, "title": "漏洞、滥行与侵吞", "id": "ch7-s2"}, {"level": 3, "title": "借\"短平银\"侵吞军费", "id": "ch7-s3"}, {"level": 3, "title": "将领们的滥行", "id": "ch7-s4"}, {"level": 3, "title": "借乡勇饷银之名", "id": "ch7-s5"}, {"level": 3, "title": "长骡与长夫", "id": "ch7-s6"}, {"level": 3, "title": "地方政府从中取利", "id": "ch7-s7"}, {"level": 2, "title": "难有对策", "id": "ch7-s8"}, {"level": 2, "title": "注释", "id": "ch7-s9"}]}, {"id": "c8", "title": "结论", "kicker": null, "part": "第三卷 · 结语", "html": "<blockquote>\n<p>国库经费耗尽，并非大事……虽然已拨军费一亿[两]，但这些钱不过散在民间，故不必大为惋惜。</p>\n<p>——嘉庆皇帝，1800年</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释23。]</p>\n</blockquote>\n<p>清朝打了大约十年的仗。支撑这场战争的巨额开支虽然永久损害了王朝财政的可持续性，敌人却危险到不足以配得上这个代价。正如战役领导层在第一份报捷折中所声称的，约二十万名\"匪徒\"被杀。到1803年夏第二次胜利时，又消灭了两千名。此后到1805年中的冲突最后阶段，总数又添了数百名起事者与其他\"匪徒\"——很可能是前乡勇。^1 被杀者中，很大一部分无疑是被裹挟的平民。</p>\n<p>清朝的伤亡相对较轻。清朝档案虽未给出正规军与受雇乡勇伤亡的总数，但表明：战役中约四百二十名军官阵亡，包括王文雄与穆克登布两位提督，以及满洲贵族惠伦与安禄。^2 事实上，死于自然原因的高级官员多于战死者。^3 嘉庆清楚这不是一场光荣的战争，他与其政府淡化了1804年底的最后胜利。除编纂官方方略、让地方政府设立\"昭忠祠\"纪念战争死难者外，^4 国家没有隆重纪念这场战役。嘉庆在战役期间为每场\"胜利\"以及几乎每一个波折写过众多诗作，此后他统治的岁月里，却很少回望此事。</p>\n<p>一定程度上，国家在冲突期间及之后不愿对教门社团采取严厉措施，反映了它对叛乱的评估。国家视这些事件为几个教门师父煽动的地方骚乱，其追随者不过乌合之众。嘉庆政府认识到根除社会中的教门网络是不可能的，于是采取了现实的态度。嘉庆几次重申容忍奉公守法教门社团的决定。从被俘的王廷诏处得知豫鄂两省有许多教众后，嘉庆再次警告两省：不得对和平教众采取任何行动，只惩处从事颠覆活动者。为强调立场，他附上了自己的《邪教说》。^5 即便1813年天理教八卦起义震动京城、攻入紫禁城之后，嘉庆也没有改变这一立场，尽管他煞费苦心地升级了京城安保。^6</p>\n<p>影响任何叛乱轨迹与后果的因素，要从冲突双方去找。起事的组织者能力固然总是重要，镇压者的效能同样是重要决定因素。归根结底，任何起事能造成多大损害，主要取决于国家调动军事力量的速度、以及这些力量镇压叛乱的有效程度。白莲教起事组织涣散、却长期无法扑灭这一事实，印证了稻叶1914年首次提出的\"清军已失活力\"的推断。然而，本研究表明：1796年与1797年初，清军是有效的——它在早期阶段扼杀了起事，数日或数周内就消灭了整个股团。清军在人力、武器与财政支持上的优势，决定了这场冲突始终是不对称的。即便战争后期，只要有理由，将领们在许多战斗中都能轻而易举地消灭敌人。1813、1814年，陕南因经济压力爆发另一场起义时，长龄与杨遇春率领的清军仅仅两个月就消灭了全部数千名叛军——尽管秦岭地形艰险，而那正是白莲教战争中常被用来为拖延辩护的借口之一。^7 将领们有动力履职时，清军仍是有用的。然而，它那有缺陷的军事财政制度造成了巨大的两难：平时报酬菲薄的军人，一旦被派赴战争，就指望发财。白莲教战争中，将领们——即便较有操守者——都毫不羞于利用机会，而猖獗的前线腐败在阻碍战役及时结束上起了很大作用，同时抵消了国家自乾隆朝晚期以来限制军队从军费中过度牟利的努力。</p>\n<p>白莲教战争中\"大量随征乡勇代替军队作战\"的现象，暴露了清朝军事制度中战时腐败之外的另一个严重问题。满洲八旗与绿营都事实上实行军事户制——士兵空缺常由士兵的子弟亲属填补，不论是否合格、有时还靠行贿——社会上的精壮青年几乎没有机会参军。国家虽关注保障士兵的经济福祉，士兵供养全家的负担却日益加重，与清朝的努力背道而驰，不可避免地导致旗兵、绿营兵的双重贫困化。白莲教战争期间，这么多精壮男子愿意被雇为乡勇多年、其中许多人表现胜过正规军——这证明社会上有一个庞大的合格职业军人后备池。</p>\n<p>某种意义上，随征乡勇是胚胎期的职业军人。他们从社会招募、又送回社会。受雇期间，他们由国家发饷，但国家无义务供养其家口。遣散时，他们领了遣散费，与国家的关系即告终止。事实上，18世纪晚期族群士兵使用的增加，已是变化的先声。把乡勇编入绿营——先是在苗疆战役、随后在白莲教战争——是清朝军事制度改革的重要一步。^8 然而，白莲教战争结束时，仅仅把最后一批乡勇编为余丁，种下了麻烦的种子。面对上司的歧视与苛待，其中一些\"乡勇变士兵\"1806、1807年哗变了。试验就此倾覆——三场兵变向国家证实了它一直以来的担忧：那些桀骜不驯之人天性危险。1807年底，川西南一些族群社群反叛时，嘉庆指示仍任四川总督的勒保：镇压所需一切开支严格按《军需则例》办理，从而不给他重新使用乡勇方案的机会——尽管情况与苗疆战役并非不相像。^9 平定八卦教起义时，嘉庆援引白莲教战争的教训，坚决拒绝了雇乡勇的建议。^10</p>\n<p>嘉庆终止战争中使用乡勇的决定，是福祸参半的。一方面，它是明智的——正如孔飞力所指出的、本研究也证明了：这个方案确实是\"昂贵而危险的权宜之计\"。^11 另一方面，三场兵变后对军户之外者的不信任更深了，它成了从社会招募新血从军的心理障碍，注定了解散军事户制的前景。回首往事，嘉庆痛悔自己在白莲教战役中没有更多依靠正规军。1804年，他重提宜绵1797年\"招募三万备战兵扩充绿营\"的提议。他称赞宜绵的提议——它本可有助于限制乡勇的使用——并称赞乾隆\"以选定乡勇补缺\"的指示，同时责备战场各省督抚没有执行这一措施。然而，提议七年之后，他仍在哀叹：自己没能找到安置最后乡勇的办法——因为他们许多人抵制参军。^12 乡勇拒绝转正规兵的两个理由——饷银低、正规兵受纪律约束——中，补偿是关键。假设性地，提高绿营兵饷银本可以把乡勇吸引入军队。而这一步可能触发清朝军事制度的改造。</p>\n<p>然而，战役后期国家严峻的财政状况，阻碍了任何带来开支增加的事业。1796年叛乱爆发时，中枢政府国库充盈，乾隆皇帝非常愿意为行动付钱。然而，战场省份不受约束的花费——最大份额在雇乡勇与\"长骡\"名下——很快把国库银储备耗到历史低位。1799年初嘉庆接手时，不得不把大量注意力放在削减开支与增加收入上。然而，即便清朝财政状况允许提高正规军收入，结构性制约也是巨大的。1802年秋，吴熊光建议：通过剥夺伤病兵的待遇、把他们遣回本省，来提高健壮绿营兵的饷银。^13 但嘉庆坚决否决：\"若把遣回本营伤病兵的饷银夺来加给[健壮者]，便是在定额之外另加饷银。将来又如何能降回原额？\"（原文待核，见注释14）^14</p>\n<p>确实，正规军收入的任何变动都会引发连锁反应。士兵加饷早已拖延太久，战役结束时很难在没有骚动或更糟情形下取消任何临时性战时加饷。如果国家允许那些部队保留加饷，紧迫的问题就是：未调赴战役的绿营兵是否也应加饷。如果绿营兵全面加饷，国家又会觉得有义务更新旗兵的待遇——旗兵的财政困境长期以来是朝廷的头痛。改造这个自开国之初就存在的军队补偿制度，其影响对嘉庆政府来说太过沉重，难以应付。鉴于嘉庆优柔寡断的性格与其主要顾问们保守的心态，采用更稳妥的解决方案就不奇怪了：皇帝只是嘴上劝勉全体军官更加关注部队的训练与福祉，确保一旦需要打新敌人时他们靠得住。当然，没几个人会听他的指示。</p>\n<p>白莲教战争中，几乎所有最高将领与大多数省级督抚都是旗人。那些旗人中，大多数是满洲人——包括永保、鄂辉、福宁、恒瑞、明亮、额勒登保、英善、景安、勒保、魁伦、那彦成、倭什布、长麟与书麟；一些是蒙古人——如惠龄、德楞泰、松筠、台布与长龄；只有孙士毅与庆成是汉军旗人。可以说，这是旗人主导领导层的最后一场战争。旗人大体分为两派。恒瑞、明亮与长龄代表满洲传统的守旧派——强调骑射。战场上，他们总是亲自率领战斗。此外，明亮表现出对绿营与乡勇的不信任与鄙夷。他使用乡勇时，只把他们当诱饵或猎物——把起事者诱入其伏击圈，却不把乡勇当作战力量。相反，其他许多旗人——典型的如勒保、额勒登保与德楞泰——更喜欢扶植出色的低级将领——其中许多是汉人——并把战斗交给他们，尽管他们瞧不起后者。1800年初移驻陕西后，额勒登保很少亲自上阵，而是依靠杨遇春与穆克登布作战。杨、穆率各自独立分队离开时，一有战事，额勒登保就倚重一直随侍的两名金川孤儿扎克塔尔与桑吉斯塔尔，以及另一位汉人军官杨芳。勒保本人不是战将，他可能开创了\"扶植并利用汉人军官\"的做法。苗疆战役中，勒保依靠两名汉人军官——石进与马瑜（康熙朝名将马良柱的曾孙）。1800年石进阵亡、马瑜被拨给德楞泰后，勒保扶植并依靠另一位出色的汉人军官薛大烈。^15 战役最后阶段，勒保还大量使用桂涵与罗思举——两名由乡勇起家的绿营军官。德楞泰虽在战役早期亲自打过许多仗，漫长尾声期间主要让马瑜与旗人军官赛冲阿承担战斗主力。^16 汉人军官在作战中作用关键，却不总得到应得的功劳与奖赏。旗军将领们不愿把他们的贡献奏报朝廷，战后请功请赏时却总是列上一大堆旗人的名字。只在战役后期，杨遇春才升任提督。^17 杨遇春登上绿营顶层（后来官至陕甘总督）虽标志着汉人在军事制度中日渐重要，却没有引发旗汉关系的正式重新调整。</p>\n<p>白莲教战争为清朝提供了改革军队的机会。然而，嘉庆政府选择暂时继续用非常规兵员对付起事者，长期则维持军队的现状。战役刚结束，为巩固三省交界地区采取了一些修补措施——增设营汛、建立新的巡逻与联合演习。然而，那些措施很快被打了折扣。巡逻因费用高昂于1805年取消。^18 随后，三场兵变之后，许多前乡勇被清洗，其空缺被裁撤，一些新设营汛被降格。^19 战争期间，由于18世纪90年代招募新兵，绿营总规模扩大了数万，但那些扩编很快蒸发了。^20 1814年，主要由于财政制约，清朝国家决定把绿营规模削减到乾隆朝初年的水平——尽管削减要到几十年后的19世纪中叶才完成。^21 这些削减，加上继续大量虚悬名缺不补，使绿营在面临空前内外危机时处于规模最小、状况最差的状态。</p>\n<p>经济上，战争给战场省份与整个帝国留下了长期影响。数年间，银锭军费被解往战场省份的后勤总部——汉中、襄阳、达州与保宁——以及武昌、西安、成都的省城。无论经费总数是一亿二千万还是九千一百六十五万九千两，白银流量之大都是空前的。银锭在目的地交付后，有两条渠道可以散失：被花掉或被侵吞。既然总拨发的相当一部分在本地花掉了，它们本应有益于地方经济。^22 事实上，这正是嘉庆皇帝选择相信的。\"钱可能最终富了地方民众\"的假设，给了嘉庆一些安慰——他尽责地表达了一位好儒君对民间疾苦的关切：</p>\n<blockquote>\n<p>国库经费耗尽，并非大事……虽然已拨军费一亿[两]，但这些钱不过散在民间，故不必大为惋惜。令朕寝食难安者，是念及[战场]各省被焚掠之地，无数生灵涂炭。^23</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释23。]</p>\n</blockquote>\n<p>确实，大量军费进入了社会。钱付给了乡勇、军事民夫与驮畜的主人——尽管欺诈与侵吞屡见不鲜。数十万乡勇与民夫中，许多人来自社会底层，几无财产、无可靠生计，有些人本来就是匪徒；战时的雇用——即便只是暂时——帮助缓解了\"无家无业流民群体扩大\"这个日益尖锐的社会问题。正如松筠1800年初所观察到的：陕南汉江谷地山区的穷人被雇去筑堡、掘壕、运给养，或被招募为乡勇守城守卡。关注社会问题的松筠认识到：尽管冲突扰乱了正常生活，战役帮助了这一群体获得生计。^24 勒保1800年底也提到：无家无业者通过充当军事民夫或乡勇获得了生计。^25 然而，战时的雇用是否帮助赤贫者长期改变生活——例如获得一块土地或开个小买卖——是另一个问题。显然，其中一些人在被遣散时很难重新适应平民生活——数百、也许数千名被遣散的乡勇与军事民夫加入了叛军或沦为匪徒。四川战后，其中许多人以劫掠或贩私盐为生，成为社会秩序的持续挑战。^26</p>\n<p>军费还被用于采购战区内外物资。大宗购买各种货物几乎肯定刺激了地方经济。1799年春，勒保一次就在太平与大宁为德楞泰的军队买了一万多双鞋——对这两个人烟稀少的地方来说，这是一笔相当大的交易。^27 除后勤人员的大宗采购外，后勤队伍跟不上军队时，军队、乡勇、民夫、赶骡者与军中其他人员不得不向当地市场或当地居民购买粮食与其他给养。与乾隆朝诸战争一样，军队的大规模消费也有副作用。起初，由于当地大多数零售交易用铜钱进行，军队与乡勇不得不在当地市场把银子换成铜钱，铜钱短缺不时出现，导致银价下跌。1800年，陕南一两银只值七八百文。为满足军队需要，战场各省铸造、分配了更多铜钱。^28 粮秣与其他货物消费骤增的更严重后果是通货膨胀。双方频繁出入的地区，物价——尤其是粮价——陡涨。给养极其匮乏的陕南，通货膨胀最严重。^29 战区一直短缺的马、骡与其他驮畜价格也剧烈上涨。供需之间的巨大缺口，为投机商人提供了最佳环境。</p>\n<p>现存档案中大体缺位、因而模糊不清的，是商人扮演的角色。然而，档案中的痕迹表明：他们积极与军队贸易、逢迎将领与后勤官员、利用战争创造的其他机会。^30 战区的商业起初虽受战事重创——外埠商人犹豫不敢涉险——解往前线的巨额经费无疑会吸引更大胆者。此外，战事限于局部——1798年起事者人数已大幅减少，战区大部分地区相对安全。谷际岐揭露了前线宝物奢侈品如何充盈；一位朝官也证实：赴前线公干时，达州后勤大员石作瑞除用山珍海味宴请外，还赠他珍珠三斛、锦缎一万匹。^31 对丝绸、珠宝、珍馐等奢侈品的需求，会促使商人与手头有现银的军队、地方官员及后勤人员贸易。由于冲突，国家对四川盐的专卖不得不放宽——这成了许多人的机会。事实上，一些被战争伤害的商人从盐贸易中得到了救赎、发了大财。^32 四川方面，商人会馆——所谓\"会馆\"（huiguan）——大多建于嘉庆朝或之后，这暗示白莲教战争之后涌现了许多暴发户。^33 陕西汉中、兴安两府，漫长战役——更准确地说，战役带来的机会——吸引了各色人等涌入，推高了人口密度。^34</p>\n<p>当然，并非所有解往战区的银子都在本地花掉。军费的很大一部分被官员与旗人带回了北京与满洲。就连一些急切奔赴战争的朝官，如嘉庆所指出的，短暂服役后也急忙回乡用不义之财置地买房。正如谷际岐所描述的，满载货物白银的大车挤满了从中原通往京城的大道——把费力运往前线的白银又运了回来。事实上，经济史家们提出：旷日持久的战役可能启发了汇兑业。鉴于正常运输路线常被战事阻断、携带现金又不安全，一些商人——尤其是山西商人——被迫发展了一套汇款的信用制度。^35 战役后期，一部分被侵吞的军费很可能就是以此方式送回北京的。</p>\n<p>清律规定：官员侵吞超过一千两白银者处死。然而，嘉庆乐于把这条法律撇在一边——即便许多将领在他眼皮底下的京城公然花销不义之财，即便其中一些官员因贪污被捕受控。战役一结束，皇帝就再无动力把任何涉嫌窃取军费者绳之以法；没有下令抄家，也没有开展调查。^36 1805年底之前，额勒登保去世——很可能是多年心脏问题所致。1809年，德楞泰也病逝。三巨头中，只有勒保在战后又活了十五年。尽管有流言说他在四川继续侵吞公款，勒保一直当四川总督到1810年。^37 1819年去世之前，勒保在中枢政府担任过数个要职，是军机大臣。^38 他再也没有被查办。他从苗疆战役、白莲教战争以及漫长的四川总督任期中究竟非法获取了多少钱，至今不得而知。死后，勒保被嘉庆皇帝称赞为忠勤老臣，他在白莲教战争及其他战役中不正当开支所欠的罚款被豁免。此后编纂的众多勒保传记中，他被记以\"在四川发起筑堡工程\"之功——这被视为镇压叛军的关键之一。^39 一个恶人就这样被改造成了英雄。</p>\n<p>如果说高级军事将领与文官大体上逃过了对其拖延与窃款的重罚，战争中低阶文官与衙门书吏的经历则是苦乐参半的。一方面，众多知府知县因服务军队或后勤而获得奖赏升迁，与常常是显赫政治人物的战争领导人建立了交情，还挪用军费填补衙门预算缺口、中饱私囊、或两者兼而有之。有些人还用战争中赚的钱捐了更高的官职。候补官员——本可能要等多年才能得实缺——通过在后勤系统服务，可以更快实现职业目标。^40 对达州——四川第一场起事的发源地、多年四川战场后勤总部——的官员而言，战役的一个持久好处，是1801年底达州直隶州升为绥定府——\"绥定\"意为\"安抚平定\"。^41 这一加强地方控制的措施，给那里所有官员带来了全面升迁。</p>\n<p>另一方面，低阶官员在战争期间更容易被批评或处分。他们常常被责令赔偿运输给养中因盗窃、匪徒或叛军袭击造成的损失。^42 军官们可以向地方官员——无论是否在后勤系统内——索取\"馈赠\"或\"借钱\"。^43 战后审计中，地方官员更容易被责令自掏腰包填补账目窟窿。最重要的是，贪污指控提出时，他们有时被用作替罪羊——尽管他们并非总无过失。战役结束时，勒保的左右手、曾为勒保与德楞泰两人主持后勤的石作瑞突然死亡。^44 他随后被勒保等人顺理成章地指控侵吞了五十万两军费。讽刺的是，石作瑞死时没有留下大笔财产——连像样的葬礼都不够。^45 战争中任职的中低阶文官的神秘死亡——包括石作瑞、曹相业以及1799年死在达州军需局的两名后勤官员——凸显了一个两难：战役戏剧性地改变了低阶文官与大量寄生于地方政府者的沉闷日常，给了他们获取奖赏、职位、升迁与财富的罕见机会，却也使他们暴露于麻烦与风险——有些是致命的。^46</p>\n<p>最大的输家是清朝的中枢政府。首先也是最重要的，乾隆长朝积累的丰厚银储备，因苗疆战役与白莲教战争的前所未有开支而大幅缩减。这一损失是永久而影响深远的——尽管嘉庆皇帝声称：只要钱到了百姓手里，他就不后悔。清朝余下的岁月里，中枢政府国库的银储备再未接近乾隆末年七千万两的水平。因此，中枢政府失去了发起与资助常规开支之外项目的能力——史家们基于清财政史宏观研究已令人信服地论证了这一点。^47 如本研究所证明的，中央府库的耗尽并非因为叛乱的规模。相反，它是镇压者阵营各方共同作用的结果。中枢政府无法准确评估战役的财政需求、严密监控后勤网络末梢军费的分配与花费，只能任凭前线将领与督抚摆布——后者充分利用战争，公然蚕食中枢政府。乾隆对前线猖獗的腐败并非完全盲目，却没有意愿或精力与之斗争，而是指望一场速胜来止住钱的流失。嘉庆这方面，起初打了一场精神抖擞的战斗，但不久就放弃了。</p>\n<p>从1799年底起，清朝国家拼命筹措经费支撑旷日持久而昂贵的战役，同时维持京城及帝国其他地方的日常与紧急开支。为省钱，嘉庆自我克制，暂停了一些非必要的项目——如宫殿翻修与皇陵修缮。^48 就连对待旗人他也不得不吝啬。^49 深知中枢政府财政困境，一些省级官员不愿奏报本辖区灾情、不愿请求救灾经费。^50 为弥补巨额财政缺口，清朝国家别无选择，只能超越常规渠道筹款。乾隆死前虽已采取一些措施，但筹钱进入高速档，是在嘉庆接手之后。</p>\n<p>在试图把支撑战役的负担转嫁给各省、要求它们动用自己的储备金（封贮银，fengzhuyin）解往战争的同时，国家采取了许多筹款措施——包括向商人募捐与售卖监生头衔，如第7章所述。或许由于各省的呼声，1800年初，嘉庆允许各省售卖监生头衔以补充枯竭的藩库。^51 嘉庆虽警告各省：藩库储备恢复正常后应停止售卖，各省却难以放手。为分享其利，1801年底，嘉庆裁定：各省售卖头衔的收入每达十万两即解京——这也等于默认此做法继续。^52 另一个久已有之的筹款办法是卖官。乾隆此前用过多次，1798年又以\"战后重建川陕鄂\"为借口再次启用。^53 嘉庆虽在乾隆死后以\"于义有亏\"为由叫停，^54 鉴于大量白银涌入中枢国库，卖官很难刹车。1799年夏末，嘉庆妥协：允许那些动身赴京、尚未闻知停售之令的人到京后买官——事实上推翻了他早先的裁定。^55 1801年底最终叫停时，这项计划已为中枢政府带来总计两千一百多万两。^56</p>\n<p>同时，国家转向自己的官僚筹钱。到1799年中，它已订立新规，征收官员所欠的欠款——总计超过五百八十万两。^57 或许因为进展缓慢，1800年秋，嘉庆颁发谕旨，点名敦促一些官员一年内还清欠款——因为镇压战役接近尾声，国家急需战后重建经费。^58 嘉庆还对获罪官员处以罚款。这个由和珅开创的方案——所谓\"议罪银\"（yizuiyin）——曾是和珅与其主子乾隆皇帝敛财的途径之一。嘉庆在和珅被清除后虽正式停用，却很快暗中恢复。不再用\"议罪银\"一词，嘉庆动员被惩处的特定官员\"出资自赎\"（chuzizishu）。^59</p>\n<p>嘉庆知道几乎所有卷入白莲教战争的官员都点石成金，便特别瞄准这个群体——尽管他不让他们为滥用与侵吞军费承担政治或法律责任。他先挑出已去世多时的毕沅，裁定其家必须全额缴清毕沅未缴的罚银两万多两。^60 1800年初，嘉庆采取了更咄咄逼人的一步：命扣发四川、湖北、陕西、河南四省官员——从督抚到道员——的一部分\"养廉银\"，以偿还他们以乡勇、军事民夫之名乱花的部分经费；并命四省被罢免的官员或其家属为自赎\"捐\"一些钱。然而，只有吴熊光主持的河南与台布主持的陕西积极响应了这一号召。^61</p>\n<p>1800年初，嘉庆命重审永保与景安案。虽然给出的理由是发现了新指控，未明言的动机很可能是劝\"捐\"。新判决宣布才几个月，永保就出狱了。永保很可能缴了罚银赎身。但景安——财务记录清白——可能没有钱自赎。因此，他坐牢直到1803年。1800年中蒙羞倒台后，那彦成向朝廷交出北京城郊一座乾隆赐给阿桂的宅第。交宅很可能出自嘉庆之命。^62 最有趣的案例是宜绵——1799年初被罢免、发往乌里雅苏台。找不到借口再治其罪，1800年初，嘉庆怂恿他捐些钱。^63 对宜绵的认捐不满意，嘉庆继续施压要他多出——甚至提到勒保1799年被捕时认捐的三万两。宜绵要么没钱可付、要么不愿付，反而请求上前线服役。结果，宜绵被免去乌里雅苏台之职，流放伊犁。^64</p>\n<p>筹钱热潮中，其他可能性也被提出并斟酌。1800年春末，内务府大臣建议拍卖开国以来购藏的古玩珍宝，嘉庆没有批准。^65 1804年，一个山西平民提议向富人加征，也被驳回。^66 一些提议没有立即被接受，数年后被采纳——如盐价的提高。^67 即便在绝望的筹钱中，清朝国家也没有直接或间接加征田赋。嘉庆虔诚地坚守\"藏富于民\"（cangfuyumin）的信条，任何加税都不在考虑之列——即便在最艰难的1799至1801年。或许是知道皇帝的心思，官场中无人提出加税。</p>\n<p>统治国家的头几年，嘉庆不得不同时打两场仗：一场收束对白莲教叛军的迁延镇压，另一场筹款以实现财政平衡。两场战役环环相扣——战争结束得越早，国家的财政状况就越好。然而，嘉庆及其政府未能迅速结束战争，听任对少量叛军残部的军事行动迁延多年。而重振财政活力这条战线上，嘉庆的成绩值得称道。通过把支撑战役的财政重担转给各省与私人部门，中枢政府的国库在数年内恢复了平衡——尽管从未恢复丰盈。1801年夏，北京大水之后，国家不得不资助一项修复永定河的昂贵工程，这进一步把国库银储备降到一千六百九十万两的历史最低点。此后，银储备稳步增长，1805年达二千四百五十万两——标志着镇压战争终于叫停时，清朝国家已走出财政危机最糟的阶段。^68</p>\n<p>中枢政府层面短
