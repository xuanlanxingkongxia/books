<script id="book-data" type="application/json">{"chapters": [{"id": "c0", "title": "导论（试译）", "kicker": null, "part": "卷首", "html": "<blockquote>\n<p>凡军国重务、用人行政之大端，朕尚未至于倦勤，不敢自图安逸。</p>\n<p>——乾隆皇帝，1796年</p>\n<p>原文（已核）：\"凡軍國重務，用人行政大端，朕未至倦勤，不敢自逸。\"（《清仁宗睿皇帝实录》卷一，嘉庆元年正月一日传位诏书；QSLJQ 1/14b）</p>\n</blockquote>\n<p>1796年是中国十二生肖纪年中的龙年。^1 农历新年正月初一（公历2月9日），御极已六十年的八十四岁乾隆皇帝（1736—1796年在位）举行大典，将皇帝玺印亲手交给其子颙琰，开启新的嘉庆朝（1796—1820）。^2 龙年自然使这一时刻平添祥瑞，因为龙历来是\"天子\"的象征。然而，中国历史上的异见者也利用这一象征煽动叛乱。龙年之前数月，远离京城、居于帝国腹地一隅的教门首领们便已认定：龙年、龙月、龙日、龙时（辰年辰月辰日辰时）是起兵推翻清朝、建立新朝的吉时。这一\"龙时\"落在嘉庆元年三月初十（01/03/10）。^3</p>\n<p>然而，第一次起事爆发于湖北西南部，时在嘉庆元年正月初十（01/01/10）——嘉庆即位大典后九天、三重龙时之前两个月，因为起事计划泄露于地方官府，迫使教门众人提前动手。此后数周，湖北西南、西北部（以及湖北中部一处）又相继爆发数次起事，不过其中大多数只持续了数月乃至数周。是年稍晚，四川东北部与陕西南部亦有数处起事，但只有四川的起事撑过了1796年；陕西的起事则不出两月便被完全扑灭。诸多叛军从未统一起来，此后多年大体各自为战，在四川、陕西、湖北交界的山区往来穿梭，彼此协调有限——只有寥寥数次结成了短命的联合。与清朝统治精英的预期相反，这场征讨竟拖延长近十年，尽管叛军总数到1800年底已减至约两万人，1801年后更只有数千人。直到1804年秋，清朝国家才得以宣布最终胜利。而对最后几股叛军余部的零星战斗，则到1805年中方才完全停息。这些起事与清朝为镇压它们而进行的军事征讨——本书统称之为白莲教战争——标志着清朝黄金时代的终结与多事之秋的开端，历来被视为一个分水岭。（地图I.1）</p>\n<p>然而，这一里程碑式的事件，所得的学术关注与其公认的重要性并不相称。迄今没有一部专著专门讨论这一事件，无论中文或其他语言。即便在\"研究'农民起义'蔚为时尚\"的中国文化大革命期间（1966—1976），关于白莲教战争的著述也寥寥无几，与有关太平天国起义的大量论著形成反差——尽管这两次起义同被视为\"伟大的\"农民起义。^4 在西方，尽管学界对中华帝国晚期的教门运动不乏关注，但由此产生的众多出版物中，只有少数几种论及白莲教起事所由滋生的教门网络。^5 鲜有人尝试重述并分析起事本身及清朝的镇压努力。^6 《剑桥中国史》第10卷中的一节，以及孔飞力（Philip A. Kuhn）《中华帝国晚期的叛乱及其敌人：1796—1864年的军事化与社会结构》中的一章，长期以来一直是英语文献中有关这一事件的主要参考，尽管两者都未尝试提供一段堪用的叙事。^7</p>\n<p>关于这场战争最详细的叙述，出自19世纪学者魏源的《圣武记》。^8 魏源虽对白莲教战争着墨甚多，但其记述不过是1800年代朝廷任命的一个委员会所编官方方略的缩写本。^9 因此，在魏源笔下，清朝军队——无论将帅还是士卒——都为抗击来势汹汹的叛军而奋力苦战，以致这场征讨堪称清朝漫长而辉煌的军事史上又一大功业。为达成此目的，魏源剪裁掉一些自相矛盾的事实，淡化乃至删去乾隆、嘉庆两帝对统兵将领往往尖锐直率的批评。令清史研究者深感遗憾的是，魏源的这种回护立场，以及他对清朝在边疆与内地所行战争的缺乏批判的处理，从未受到认真的质疑。若说魏源对白莲教战争的记述有什么新意，那就是他对乡勇的使用与\"坚壁清野\"（jianbi qingye）之策的注意——后者指在战区修筑堡寨或设防聚落，庇护当地居民及其财产，使叛军得不到人力和给养。^10 尽管魏源并未将清朝镇压叛军的成功归功于这两项措施，他的记述却清楚地表明，这场征讨富于创举。或许连魏源自己都未曾料到，他的这番阐发竟会回响逾一个世纪。</p>\n<p>20世纪初，魏源的观察首先得到日本史家稻叶岩吉（Inaba Iwakichi）的呼应。稻叶在清朝灭亡数年后的1914年出版了《清朝全史》（Shinchō zenshi）。^11 作为第一部此类通史，稻叶之作其实不过是他对清入关前满洲史研究的仓促扩展，延展到清朝的整个存续期。在全书八十四章的一章中讨论白莲教战争时，稻叶聚焦于清朝无力剿灭叛军这一点，援引若干重要文献证明：由于制度上的积弊与腐败，清军已然腐化。不过，他显然未能利用关键材料——包括魏源叙事所依据的官方方略，更遑论当时尚未对公众开放的档案。稻叶虽然在明确指出清军武力之衰败上反驳了魏源，却也把《圣武记》所凸显的两项策略结晶为定论，主张清朝唯有依靠地方乡勇与乡村堡寨才能赢得这场征讨。^12</p>\n<p>稻叶之书旋即被译成中文，1915年在上海出版。^13 一位年轻的清史学者萧一山注意到稻叶研究中的大量事实错误与误解，遂另撰清史，即《清代通史》，并于20世纪20年代出版其前两卷。尽管萧一山以纠正稻叶之误为鹄的，他却欣然采纳了稻叶关于白莲教战争的观点。萧一山在稻叶对清军可悲状况的分析基础上加以发挥，同样指出乡勇与筑寨是清朝获胜的关键。^14 事实上，就这一论题而言，萧一山在使用原始资料方面并未比稻叶走得更远。</p>\n<p>萧一山的清史此后在中国的影响超过了稻叶之作，但另有一位中国学者李剑农，帮助把稻叶一系的观点传播于中国与西方。李剑农是孙中山革命组织同盟会的成员，1910年正在日本早稻田大学就读，其时稻叶在该校任教（但次年革命爆发，李剑农即返回中国）。二人是否在早稻田大学见过面，今已难考，但李剑农显然熟悉稻叶之书。在1930年一部关于19世纪末以来中国政治史的著作中，李剑农简略讨论了白莲教战争，以缩写的形式复述了稻叶清史中的记述。^15 1956年，该书修订本被译成英文出版时，两位译者邓嗣禹（Ssu-yü Teng）与杰里米·英戈尔斯（Jeremy Ingalls）为控制译本篇幅，选择不逐字全译。于是，他们把白莲教战争的部分加以浓缩改写，将\"稻叶—李剑农\"一系的观点凝练如下：</p>\n<blockquote>\n<p>白莲教之乱中，满洲政权的一大缺陷暴露无遗。由八旗与绿营组成的常备军已腐败到难堪大用。地方乡勇被征召起来镇压叛乱。……镇压白莲教叛乱的不是常备军，而是地方乡勇，他们采用的是被称为\"清野\"的焦土之策，即不给叛军留下任何食物与栖身之所。^16</p>\n</blockquote>\n<p>[译者按：此段系邓嗣禹、杰里米·英戈尔斯据李剑农中文原著《最近三十年中国政治史》浓缩改写的英文，此处自英文直译；原书为现代中文著作，不附原文。]</p>\n<p>这一简单而颇具吸引力的解释，此后直接或间接地影响了一代又一代学者，鲜有人质疑其来源与有效性。它被中华帝国史与中国近代史的通史作者们采用，也充当过若干有影响之作的事实依据。尽管越来越多的中国史研究者对如此重大的事件竟只有如此单薄的学术积累表示不满，许多人仍抱持这一陈说，因为尚无替代性的解释取而代之。^17</p>\n<p>既然没有关于这一事件的扎实知识，就无法驳难并推翻公认的成说，本书因此对清朝与一群群叛军之间近十年的冲突作一实证研究。更具体地说，本叙事聚焦于清朝镇压起事的努力，以及清朝战争领导层——由武职官员与省级文官（通常是总督与巡抚）共同组成——内部往往龃龉不断的人际关系，和他们与朝廷之间的关系。叛乱的教门性质以及起事对教门运动的影响，不是本研究的重心所在。相反，叛军一方的政治与军事战略战术将得到仔细的观察与分析。本研究的目标有三：重建并叙述战争的过程与动态，以历史事实重新检验此前的种种论断，并重新评估这一事件的意义。后两个目标离不开第一个。总体而言，本书试图对这一事件及其在中华帝国晚期历史上的意义作出全新的解释。</p>\n<p>与那种认为白莲教战争严重动摇了清朝的流行看法相反——鉴于其持续时间、地理范围与耗费似乎都不辱\"大白莲教起义\"之名，这种看法并不罕见^18——本研究表明，18世纪90年代末发生在湖北西部、四川东北部与陕西南部的起事，远未强大到足以对清朝构成严重威胁。事实上，叛乱领导层从一开始就极度涣散，缺乏有前景的战略目标，与半个世纪后强大得多的太平天国起义形成鲜明对照。叛乱的原始策划者们虽然曾隐约怀有称帝的野心——从他们择定龙年龙月龙日龙时起事等种种迹象中可见一斑——但不仅其政治纲领迅速消散，连叛乱的教门性质也随着冲突的展开而大体褪色。叛军缺乏技能、装备与协调，无力攻取他们活动区域内的重要政治经济中心。除开1796年这头一年——其间湖北与四川的叛军夺取了数座县城（但只有一座能长期据守）——他们几乎从未攻占任何城市或像样的市镇（1796年后仅占领过一座市镇数周），而主要是在四川、陕西、湖北交界的山区辗转，并数次闯入甘肃境内一些地方，而那些地方无一例外人烟稀少。同样与流行看法相反——那种看法认为民众是因地方官的压迫盘剥而加入起事——起事在最初几年里除教门社群之外并没有得到广泛的响应。为扩充队伍，叛军不得不频频胁迫当地居民入伙。到1800年底，幸存的叛军已沦为几股漫无目的、挣扎求生的匪帮。</p>\n<p>既然战事之所以旷日持久并非由于叛军强大，人们就不得不向战争中的另一方——清军——寻求答案。与前述\"腐败的清军已无力迅速平定叛乱\"的看法相反，一些清军将领与地方官在征讨的早期阶段表现出色，以致大部分起事在爆发后不久即被彻底扑灭，其余也被牢牢压制。然而，战役的许多其他主持者——无论文武——却有意拖延剿灭叛军。对他们来说，更具吸引力的是充分利用这场战争牟取私利，诸如升迁与物质好处，无论正当还是不正当。与此同时，战争领导层内部的个人争斗，也被证明是令真心作战的将领们士气低落的关键因素。嘉庆皇帝虽然在1799年初乾隆驾崩后亲政，表现出让脱轨的战役重上正轨的决心，却未能贯彻其改革议程，且频频向统兵大员让步。结果，清除叛军余部的最后阶段战争变得令人烦恼地迁延不决，一拖数年。皇帝虽屡次催促各路统帅与督抚结束战争，且1803年初与同年秋两度宣布获胜，但每一次\"胜利\"之后冲突旋即再起。总而言之，这场战役不是在中央政府的注视下进行的，而是按前线统帅们的节拍进行的。</p>\n<p>既然导致战役旷日持久的是军方不愿、而非无力迅速消灭全部叛军，那么也就不难看出，那两项广为人知的策略——使用乡勇与\"坚壁清野\"——并不值得它们所获得的赞誉。与\"这些策略直到战事后期清军不济时才被采用\"的看法相反，两者从一开始就都已就位，其时一些镇压者仍在有效地作战。但两项策略在战事中都未发挥关键作用。此外，帮助发起这两项举措的地方精英也从未居于舞台中央，因为战争当局很快就接管了两项事业的领导权。事实上，对这两项策略的强调，反而掩盖了这场战争一个引人注目的特点：清方雇用了数十万平民协助其军事行动。这些平民被称为乡勇（字面义\"乡村勇壮\"），在英语中最接近的对应词是\"militias\"（民兵），但其功能更像雇佣兵。受雇乡勇与地方乡勇的关键区别在于：前者由战争当局支饷，而地方乡勇是来自本地社区的自愿者。</p>\n<p>清军使用此类雇佣兵，是18世纪晚期的新办法，是对乾隆皇帝削减日益膨胀的军费开支这一努力的回应。由于发现雇佣平民充作战兵是规避清廷18世纪晚期所颁战时开支条例的便捷途径，各路统帅在白莲教战争中把这一做法推到了极度滥用的地步。它成为这场战争耗费惊人的主要原因之一，因为受雇乡勇的人数常常超过所调正规部队的人数（至少在纸面上如此），其饷银在早期阶段还高于正规兵。更关键的是，战争当局对他们遣散事务的处理失当，是战争旷日持久的一个重要因素：许多被遣散的乡勇最终投了叛军，而统帅们又抵制遣散余下的乡勇。当中枢政府催促裁减乡勇时，战争领导层便接管地方筑堡工程与地方乡勇，用它们作借口，替代雇佣兵，从中枢政府套取军费。</p>\n<p>征讨中大量使用受雇平民，在清朝统治精英中激起了一场关于现有正规军改革的激烈（虽然时断时续）的辩论，这场辩论迄今未引起学界注意。鉴于满洲八旗部署起来过于笨重昂贵，而绿营又过于分散、地方化，一些人提议并论证建立一支新的机动部队，必要时可以随时调往帝国任何地方。改革的核心接近于以职业兵取代事实上世袭的兵员——而世袭正是八旗与绿营的共同现实。尽管在战争的前半段（1796至1800年），支持改革的声音占据上风，但嘉庆皇帝此前虽对新机动部队的想法表现出兴趣，到1800年中期却转向维持现状，因为一旦批准这一提议，将可能对八旗制度造成剧烈冲击，且耗资巨大。尽管嘉庆对雇佣兵深怀疑虑与厌恶，他仍调整立场，接受使用非常规兵员，并中止了关于可能的军事改革的讨论。从历史的后见之明看，清朝由此错失了在半个世纪后面临更严峻挑战之前重组并强化其军事体系的机会。</p>\n<p>嘉庆皇帝固然担心军事改革可能带来的高昂代价，但在约束征讨战役骇人的巨额开支上，他同样无能为力。清朝的战争财政制度漏洞百出，为将领与后勤官员滥用规则、侵吞军费提供了绝佳的环境。18世纪，清朝在边疆进行了多次大规模战争，其中最昂贵的是四川西部边地的第二次金川之役（1771—1776）。然而，那场战争六千余万两白银的花费，与白莲教战争据称耗费的一亿二千万两相比，显得相形见绌。在后一场战役中，统兵将领与地方官员都贪婪地借支付乡勇、脚夫与牲口的饷银等名目，从军费中渔利。结果，军费中相当大的一部分被挪用或侵吞。战区的严重腐败并非无人察觉；文官系统的批评之声贯穿战役始终。1799年，嘉庆皇帝试图以削减不必要的开支、杜绝侵吞来整饬战争财政，作出了一次大胆的尝试。然而，这一尝试很快适得其反，在军方与地方政府的顽强抵制下夭折。在战争的余下时间里，中枢政府继续屈从于战争领导人的要求，无力约束他们。由于中枢政府的国库几近空虚，国家不得不向各省与民间四处筹措经费，同时削减其他项目，从京城到各省厉行节俭。</p>\n<p>揭示白莲教战争全面而细致的动态，将有助于重新评估其意义。这场近十年的战争虽然是清朝国家的一场严重政治危机，但危机不在于国家受到了来自社会底层的叛军的严重挑战。相反，它是一场政治危机，其含义是：清朝中枢政府不再能在需要的时候开动其军事机器。尽管朝廷一再试图夺回对战争的控制权，它最终还是败给了将领与总督们——后者将自己的意志强加于中枢政府，劫持战役为自己的目的服务。从长远看，这一发展预示了清朝中央权力的瓦解。对清军而言，白莲教战争的后果同样不利。国家在战争中耗尽了财政活力，又担心再次被军界蒙蔽，于是在供养军队上退缩到保守路线，逆转了自开国以来一直奉行的政策——将军队福祉置于高度优先的地位。由于缺乏足够的财政支持与皇帝的关注，清军在白莲教战争之后急转直下，不出数十年便无力应对内外危机。由此着眼，人们可以从一个新的视角看待清朝帝国秩序的瓦解：即清军财政体系的演变在不知不觉间培育出一个战时利益集团，它悍然挑战中枢政府的政治权威，耗尽了国家的财政实力。随后，国家撤回优待军队的承诺，又加深了清军体系早在战前便已积压的困境。</p>\n<p>1796年初叛乱爆发时，尽管乾隆已禅位于其第十五子颙琰，他依然是清朝的掌舵人。乾隆自封\"太上皇帝\"（taishang huangdi），并不掩饰自己并未将国政大权交给儿子。正如他在禅位诏书中公开宣称的：\"凡军国重务、用人行政之大端，朕尚未至于倦勤，不敢自图安逸。\"^19（原文见注释19） 事实上，他不仅主持大事，连日常政务也一并处理。结果，嘉庆朝的头三年（1796—1799）成了乾隆时代的延续，以至于如那位退位皇帝所愿，紫禁城内继续使用\"乾隆\"年号。^20 政治与政策因此并无断裂，人事亦无重大变动。唯一可见的差别是：乾隆现在把新君留在身边，从早到晚加以训导。</p>\n<p>颙琰生于妃嫔，并非乾隆钟爱的儿子。1736年，即乾隆即位之年，他密立孝贤皇后所出、当时唯一的儿子永琏为皇太子。但永琏仅仅三年后便因病夭折。此后直到1773年，乾隆才重新考虑继承人的问题，而他当时决定立颙琰为皇太子，很可能不过是一个不置可否的选择。只是乾隆在仅存的几个儿子中找不到更好的人选而已。^21 颙琰对自己的入选或许有所察觉，但这一决定直到1795年底才公之于众，其时乾隆宣布将于次年禅位。^22</p>\n<p>乾隆的退休史无前例——有清一代，此前没有哪位皇帝生前让出皇位——而他持续把持权力，使乾隆—嘉庆的权力交接变得复杂微妙。受影响最深的人莫过于颙琰，即嘉庆皇帝本人。嘉庆完全处于父亲的支配之下，只被允许履行仪典职责、批阅奏章，却不能自作批复。然而，他表现出政治上的成熟与精明。他坚忍尽职，在三年\"见习期\"里，无论公开场合还是私下，都没有流露出任何不满或野心的迹象。这样一来，他不仅赢得了父亲的认可，还使乾隆的首席助手、权势最盛的内廷大臣和珅（Hešen）确信：这位新君没有胆气自行其是，从而促使和珅对嘉庆倨傲无礼。^23</p>\n<p>和珅虽被广泛视为乾隆朝晚期腐败的根源与化身，事实上却是一位高超的首席大臣与乾隆皇帝的助手。他的飞黄腾达，很大程度上与18世纪70年代的政治形势有关。孝贤皇后之弟、自18世纪40年代末起担任首席军机大臣的傅恒于1770年去世后，乾隆经历了一段危机时期，其间性情乖张反复。^24 乾隆在侍卫和珅身上找到了一位可以托付政务与私事的新首席助手，这帮助皇帝恢复了从容与活力。作为回报，乾隆在短短数年间便将和珅擢升至领班军机大臣的高位，并兼领众多职衔。^25 和珅固然贪婪，向官员索贿受贿以聚敛财富，但他也是一位尽职的得力助手，协助皇帝遏制朝内外的腐败与弊端。把和珅钉为官场腐败丛生的总根源，固然省事，却无助于充分把握乾隆朝晚期错综复杂的宫廷政治。^26</p>\n<p>晚近的研究提出，乾隆扶植和珅，背后是朝中的派系斗争。按这种看法，让和珅占据傅恒留下的位置，可能是为了制衡朝中一个根深蒂固的派系——该派系由乾隆朝早期的两位重臣阿克敦与刘统勋所开创。^27 尽管18世纪晚期清朝朝中各政治派系之间的界线有时难以划清，从道德化视角剖析和珅问题无疑是不智的。不过，白莲教战争前夕，朝野内外对和珅的反对尚未达到政治危机的程度。相反，鉴于乾隆—嘉庆权力交接的独特进行方式，朝廷上弥漫着大量的不确定与悬而未决之感。随着那个不可避免的结局日益临近——乾隆虽然精力充沛、尚能任事，毕竟已届风烛残年——朝中许多人都盘算着：当那位看似谦抑寡言的新君最终接掌大权时，自己的前程将会如何。因此，无论是呼吁改革还是激化朝中的政治纷争，当时都不是搅动现状的最佳时机。就本研究而言，和珅问题并没有反映在中原城镇乡村的教门鼓动之中，下文将详述。</p>\n<p>1795年决定退休时，乾隆想必踌躇满志，认定自己的帝国拥有足够的军事力量应对任何规模的起事。他的王朝拥有当时世界上规模最大的常备军之一（八旗与绿营合计约七八十万人）。尽管已经出现一些衰落的早期迹象，18世纪末的清军仍是一支令人生畏、切实有效的力量。18世纪90年代初，在最后一次远征边疆、征讨廓尔喀（尼泊尔）的战争中，清军先是进军西藏驱逐廓尔喀入侵者，随后攻入尼泊尔，兵锋直指其首都加德满都，展示了在极端险恶的环境中为远程远征调集资源的能力。尽管伤亡惨重、耗资巨大，入侵尼泊尔还是给尼泊尔的廓尔喀人与印度的英国人都留下了强烈印象。结果，尼泊尔同意与清朝建立朝贡关系。只要有合适的统帅与条件，清军依然能够完成艰巨的任务。然而，清朝的军事财政制度存在先天缺陷。天长日久，这些缺陷演变成积重难返、癌变性的痼疾。清朝未能将其根除，就不得不在镇压白莲教叛军的战役中承受其最严重的后果。</p>\n<p>清朝供养军队的制度是双重的。首先，两支军队——由满洲、蒙古、汉军组成的八旗，以及兵员全为汉人的绿营——作为两个等级获得不同的待遇。八旗被视为精锐的机动野战部队，只驻扎在京城、满洲以及若干重要城市和战略要地。旗兵的俸饷、津贴、赏银等高于绿营官兵；绿营则驻扎全国，承担着维护地方治安的职责。其次，军人的平时收入与战时收入之间存在显著差距。有清一代，两支军队的常俸几乎保持不变，但所有派赴战场的部队都能在平时常俸之外获得补偿。^28 更重要的是，战时补偿要优厚灵活得多，也易于滋生弊端。结果，不满足于平时收入的军人把派赴前线视为梦寐以求的额外收入机会，此外还有升迁与立功纪录的机会——对旗兵而言，功绩越多，退役时所得的优待就越多。由于这一制度，常备军有几分像雇佣兵：一经部署，即为丰厚的钱财利益而战。</p>\n<p>18世纪，清朝在边疆与内地进行了多次战争，包括在极西北与准噶尔蒙古人的长期战争、数次进军西藏、平定边境与台湾的叛乱，以及入侵缅甸、越南、尼泊尔等邻国。18世纪上半叶，军费开支大体尚能控制；但到了下半叶，统帅们动辄以战场上的紧急需要为名，要求越来越高的军费——而在战争环境下，此类需要并不难找到。结果，军费开支持续大幅攀升。18世纪50年代，清军在东突厥斯坦进攻并消灭了强大的准噶尔汗国，随后又平定了当地穆斯林头领的叛乱。尽管前线与内地相距遥远，1754至1760年六年间，战争总耗费为二千七百万两。^29 然而，1774年，镇压山东王伦所领导教门起事的一场历时一个月的战役，竟耗银一百万两，令人瞠目。^30 与此同时，为征服嘉绒土司而在四川西陲进行的第二次金川之役，五年间（1771—1776）耗银逾六千万两，成为清朝到那时为止所打的最昂贵的战争。^31</p>\n<p>18世纪晚期推高军费的主要因素，是发给官兵的战时津贴与奖赏，以及支付给受雇运送补给辎重、修筑军事设施与基础设施的民工的工资与赏钱。尽管这两类开支都极随意、难以规制，后者——对民工的补偿——比前者更甚，因而耗费也更大。有清一代，战时物资运输方式不断演变。起初，运输常常由军队自行承担。^32 整个18世纪，战时后勤日益向私人部门开放；补给与辎重主要由受雇的劳工与牲口运输。部队不仅不再承担任何后勤工作，甚至还有权让雇来的民夫替他们挑运武器、装备与个人物品（有些情形下，他们还让民夫抬轿而行）。在第二次金川之役中，运输费用占军费总开支的大头，尽管以犒赏兵丁为名的滥支也同样普遍而严重。^33</p>\n<p>清朝国家此前虽曾尝试规制军费开支，^34 但促使乾隆及其廷臣采取行动的，是第二次金川之役的巨额耗费。第二次金川之役甫一结束，乾隆便任命一个临时委员会，责其编纂一套规则，将战时开支的标准规范化，以根除战时腐败，把军费限定在合理规模。^35 委员会以阿桂与和珅为首，成员包括一百余名高级朝官，以及涉及军事财政的户部、兵部、工部三部堂官。这被证明是一项繁难而琐细的工程：委员会必须翻阅档案中的大量卷帙，从以往战争中各类开支里梳理出先例，并为每一项支出定出合理的标准，还要考虑可能影响开支的各种变数。直到1784年，即项目启动八年后，一部三部分合编的则例——《钦定户部兵部工部军需则例》（Qinding Hubu Bingbu Gongbu junxu zeli；Imperially Sanctioned Statute of Wartime Expenditures Concerning the Ministries of Revenue, War, and Works；下文简称《军需则例》）——才颁布施行。这部近一百二十条的则例，规范了军人的战时奖赏、津贴与伤亡抚恤；军需民夫、牲口以及医生、兽医、工匠等专业人员的报酬；以及军火购置与筑路、架桥等作战基础设施建设的费用。^36</p>\n<p>《军需则例》堪称清朝军事财政制度演进中的一个里程碑，它代表着清朝国家诉诸立法手段来约束不断攀升的军费开支的一次认真努力。尽管这部则例认可了以往战争中形成并沿用的某些非正式做法与权宜之计——考虑到主要编纂者中不少人都以借战争之机从国家榨取更多经费而闻名——它也废除了某些最为恶劣的做法，包括臭名昭著的\"赏号\"（shanghao）：一种非正式做法，统帅动用军费购买绸缎等物料赏赐部队，有时干脆直接赏银。同时，则例对以往战争中出现的各项开支作了细致的规定，使军队与掌管战争后勤的文官挪用经费的空间大为缩小。此外，它授权文官系统对军费开支进行监督。户部官员在审核军费时，一旦发现任何不合常规的开支，便援引《军需则例》加以驳斥。事实上，和珅在掌管户部时，执行则例十分严格，无情地裁削缺乏依据或过高的报销。</p>\n<p>然而，新法典并未消除八旗与绿营在战时补偿上的差距，反而进一步确认甚至提高了旗兵的战时待遇。例如，绿营兵丁被派赴前线时，只能领到六两\"行装银\"（xingzhuangyin）——以置办行装装备为名发给出征部队的津贴——而从满洲征调的普通旗兵可以领四十两（京城满洲旗兵领二十两，驻省旗兵领十五两）。^37 结果，调遣旗兵参战变得更加昂贵费事。事实上，准噶尔蒙古人覆灭后，帝国边疆大体安定，清朝国家越来越不愿动用旗兵。1776年中，乾隆在启动编纂《军需则例》工程的上谕中，斥责山东当局对镇压王伦起事的战役处置失当。他分析说，这场战役的目的不过是\"廓清内地匪类\"（原文待核，见注释38），而主持后勤的官员却误把它当成一场大战来办。显然，在乾隆看来，讨伐内乱的战争不应动用精锐旗兵，以免耗费更多。^38 《军需则例》颁布后，乾隆更进一步：在他余下的统治期内，对在边疆战争中部署旗兵一直犹犹豫豫。征讨廓尔喀（尼泊尔）之役中，一万五千至一万六千人的远征军中，只有一千一百人是来自满洲的旗兵（巴图鲁一百名、索伦兵一千名），其余为绿营兵与四川西部、西藏的土兵。^39 这些被称为\"土兵\"或\"番兵\"（tubing或fanbing）的族群士兵，是西北与西南边疆非汉社群的武装力量。土兵花费低廉而颇有效力，清朝国家此前就曾征调，但在乾隆朝的最后几十年里，这一做法变得更为制度化。</p>\n<p>清朝不愿动用其精锐军队，自然把作为二线部队的绿营推到了前台。按清朝开国君臣的设定，绿营本不应充当机动的打击力量，而是用于守御地方，尽管其部队也常随八旗出征。^40 与八旗一样，绿营全体官兵的俸饷自开国以来基本未变。旗兵享受着皇帝不时给予的种种赏赐，绿营官兵——尤其是兵丁——则承受着更大的经济困难。18世纪中有约五十年时间，由于雍正皇帝（1723—1735年在位）的倡导，朝廷向八旗与绿营提供本钱，供其投资经商，绿营兵丁得以依靠所获利润，补贴婚丧这两件人生中最费钱的大事。然而，1781年乾隆废除了这一做法，改为在常额军费之外每年拨银一百万两，以应兵丁的这些需要。同年，乾隆又废除了绿营军官的\"武职名粮\"（wuzhi mingliang）——事实上是军官的一笔额外收入——改而赏给他们\"养廉银\"（yanglianyin），这一恩典此前仅限于文官。为此，清朝国家每年须再支付二百万两。^41 显然，乾隆试图为绿营的军官与兵丁提供一些有保障的经费，以缓解他们平时的窘境。</p>\n<p>然而，这些措施并未收到乾隆预期的效果。拨给兵丁补贴的一百万两并未全部发到他们手中，许多钱款在流经军事官僚系统时被耗散。把\"养廉银\"扩展到武职官员，同样未能阻止他们盘剥兵丁。许多军官没有用新增的津贴雇请仆从——诸如跟班、厨子、轿夫、工匠、杂役、马夫、乐师等等——而是把钱装进自己腰包，继续克扣兵丁饷银以支应个人开销。在一种被称为\"吃空额\"（chikonge）的普遍做法中，军官向上级隐瞒空缺名额，把空额的饷银私吞。军中名册上充斥着大量\"空额\"（虚挂名籍的兵员），绿营的实际规模已大大低于其六十万的理论员额。按照清朝承自明朝的军户制度，兵丁子弟本应在出缺时优先补入。然而，18世纪晚期人口增长扩大了候补者的队伍，竞争一个名额变得愈发激烈；行贿于是成了家常便饭。及至国家允许无法在旗制内谋得差使的满洲旗兵补入绿营，情况便更加恶化。^42 与此同时，整个社会变得富裕得多。奢侈品琳琅满目，娱乐场所成倍增加，只会加剧军人内心的失落与错位。</p>\n<p>尽管中枢政府关注军人的福祉，对军事财政制度的根本性整顿显然不在考虑之列，因为18世纪晚期的情势没有产生足够的紧迫感，不足以使这一潜在风险极大的步骤成为必要并具有正当性——它势必带来重大而复杂的后果。不过，朝廷虽然希望约束战时开支，却也清楚地意识到军人的财政困境。在《军需则例》颁布后的几次用兵中，乾隆皇帝都倾向于给部队提供一些财政上的激励。由于《军需则例》的宗旨只是为战后通常才进行的军费审核提供标准，它并没有为战费的拨付提供指导。因此，为战争拨款仍然取决于皇帝。此外，户部也没有任何机制可以质疑或阻止皇帝所要求的拨款。经费一经拨付并送抵前线，统帅与后勤官员们就不难想出办法规避《军需则例》中的规则，以通过户部的审核。最好的办法似乎是制造新的名目——《军需则例》尚未规制、却留足腾挪空间的名目。在白莲教战争中，中枢政府慷慨的财政支持，加上应对叛军游击战的特殊情势，点燃了战区的腐败，使这场战役成为清史上最不堪的一役。</p>\n<p>远离紫禁城的下层世界，自有其关切、执念与行动节律。18世纪后半叶，教门信仰的声势迅猛高涨。与清朝早期相比，乾隆时代堪称教门虔诚的\"黄金时代\"。新出的教门达一百余种，尽管许多旋起旋灭，而教门活动的地理范围也扩展到全国大部分地区。^43 与此同时，新的教义相继出现，大量经卷（jing）与宝卷（baojuan）得到编纂、刊印与流通。教门的组织技巧与传布手段日益成熟多样。^44 这些教派名目繁多，但官府与许多教门中人都以\"白莲\"作为总称，指代其中大多数教派（不过有些教派刻意回避这一名号）。^45 何以此时会出现教门信仰的如此激增？归根结底，这同样是一个关于白莲教战争根源的问题，因为叛乱首先是从乾隆朝晚期蔓生的教门运动中滋生出来的。与关于叛乱起源的流行看法相反——那种看法强调社会弊病与一部分人口的错位——证据表明，教门信仰的显著增长，反映的恰恰是民众财富水平的提高。理解这一动态的关键，在于教门运动的经济维度。</p>\n<p>在现有的关于中华帝国晚期教门信仰的学术成果中，居主导地位的注意力一直放在教门的信仰与教义上，其次（在较小程度上）是其组织结构与网络，而教门的经济则从未得到仔细的考察。^46 然而，财政机制是教门信仰不可分割的一部分；几乎所有教门都有一套筹钱的办法，依靠会费与宗教服务收费的收入维持并壮大自身。在向教门成员与信众收取的种种费用中，最重要也最常见的收费之一是入教费。许多教门称之为\"根基钱\"（genjiqian），即入教时缴纳的款项。虽然各教门入教费的标准已无从一一查考，但有限的记载显示，数额并不算小。^47 除这笔一次性收费外，成员与信众还须承担名目繁多、因教而异的其他费用与财务义务。信众须为诵经念咒等服务付费；为仪式所用纸、香、烛等物料付费；为教门执业者的旅费付费；还要在节庆等特殊场合向师父们赠送礼金；如此等等。鉴于人们被教门教义吸引的首要原因，是今生避灾去病免祸、来世升入天堂，许多教门声称只要收费，就能帮助这些人达成所愿。一种常见的做法是：师父把求告者的姓名及其他个人信息写在黄纸上——有时也写明其付款数额——再边诵经边将黄纸焚化。这样，神明就会将福佑与庇护照拂黄纸所书之人。这项服务的收费常被称为\"升单银\"或\"达单银\"（shengdanyin或dadanyin，意即\"通神报名之银\"）。与天主教会售卖\"赎罪券\"相似，教门也售卖通往死后世界的通行证，即所谓的阴间护照\"阴照\"（yinzhao），据说能使持有者免遭地狱的残酷折磨。此外，一些教门还向信众出售印制的经卷、歌诀、传单以及种种券符。^48</p>\n<p>理论上，一切收费所得都用作教门的运作经费，支付宗教设施与物料的费用，并充当成员与邻里的救济慈善基金。但实际上，经费完全由师父们掌控，他们往往设一名或数名财务管事代为保管钱财、管理账目。据记载所示，一些教门首领手中握有相当可观的经费。除其他用途外，他们把钱财用于成员卷入诉讼或被捕时的打点与赎取，还派人看望获罪流放远边的教众并给予接济。除为教门开销之外，教门首领本人也靠教门经费过活，他们往来于各教门据点之间，为自己、家人与随从随意挥霍。^49 诚然，也有真正虔信的教门师父——1796年白莲教起事的首领中，许多人属于此类——但毫无疑问，另一些人把宗教活动当作一桩生计，一桩可能获利丰厚、却也不无风险的营生。他们挑选有发展潜力的对象加以传教——不去优先招揽那些勉强度日的赤贫者或游民无产者，对他们来说是顺理成章的——由此给教门运动增添了一个生意的维度。信众的大多数虽非来自上层阶级，许多人也不富裕，但他们同样并非赤贫。鉴于民众整体上比本朝早期富裕得多，就连下层阶级也负担得起自己的宗教需要。这并不是说人们只有在满足了生存需要之后才会照料宗教需要，因为宗教热忱往往正产生于困厄的处境。然而，18世纪晚期教门信仰的滋长，并不仅仅是这类宗教需要的结果，也是教门从业者精心经营的结果。</p>\n<p>收取入教费与其他费用不仅对教门及其首领的财政状况至关重要，还被用作招募新成员的诱饵。许多师父向有望入教者许诺：他们入教后只消很短时间，便可自行收纳弟子。新入教者在教门等级中地位的迅速跃升，使他们得以向他人收钱，这成为一些人加入教门的重大激励。由于弟子有义务把自己向徒众收费所得的一部分上缴师父，一些人便想与师父决裂，自创新教。师徒关系的不断复制，是18世纪晚期教门社团如雨后春笋般涌现的一个重要因素。这一动态又反过来造成母教与子教之间在教义、经卷与仪式上的诸多相似。</p>\n<p>在清朝的官方记载中，皇帝与官员们一致指出教门活动的经济动机。所用的词是\"敛钱\"（lianqian）与\"蛊惑骗钱\"（guhuo pianqian）。官府虽然倾向于淡化民众中真实的宗教渴求，但他们把握住教门运动的经济维度，这一点并没有错。的确，一些自封的教门师父，其经济动机更甚于信仰的感召。虽然还需要个案研究来进一步阐明经济因素在教门信仰扩展与演变中的作用，但可以确定的是，进出教门网络的钱流数量相当可观。换言之，构成18世纪晚期教门信仰扩张之社会基础的，是较为富裕的人口，而不是被剥夺了基本生计的人口。</p>\n<p>在关于白莲教战争的有限学术成果中，似乎存在一种共识：叛乱至少部分地源于社会中日益尖锐的困苦与危机。教门鼓动虽然被承认为一个因素，但社会问题通常被看得更为重要。^50 乍看之下，这种看法似乎站得住脚。整个18世纪，全国人口的迅速增长导致可耕地严重短缺，使大量人口失去土地，生计无着。乾隆朝晚期，数以百万计的此类人口离乡背井，到他处寻找机会。在中原地区，两大山系——横贯陕西南部的秦岭，以及位于川陕边界、延至湖北西北部的大巴山——成为移民的目的地。到18世纪末，这两大山区的移民已达数十万，也许逾百万。他们在清朝记载中被称为\"棚民\"（pengmin）——因其住所简陋而得名——其中许多人为教门信仰所吸引。^51 在20世纪产生的学术成果中，这两大山系被合称为\"汉水高地\"（Han River highlands），被视为白莲教战争的温床，棚民则被认定是叛乱的骨干。不仅马克思主义史学家完全接受了这一对叛乱起因的解释，它在马克思主义阵营之外也保持着吸引力，至今仍引起共鸣。^52</p>\n<p>然而，陕西南部的棚民并不是叛军的主力。事实上，大多数棚民已在这片崎岖的内地边疆找到了生计。许多人定居下来务农，在山中开垦荒地，建起新的村落，或独居在孤零零的棚屋之中。^53 同时，还有许多人受雇于邻近省份（主要是山西与湖北）商人在山中设立的众多厂坊。从伐木到造纸再到种耳，这些厂坊容纳了大量新来者。更有经营头脑的人则自创基业，或为店主，或为长途贩运的行商。^54 尽管他们的生活并不富裕，许多人辗转于一份又一份零工，有些人还靠劫掠与其他非法手段求生，但若断言这一群体整体上到18世纪末已面临严重的生存危机，在历史上并不准确。^55 1796年初叛乱爆发时，起事的主要地点在湖北西部，参加者多为有产者，或是农民，或是小商人。河南南部的教门成员构成与此相似，尽管那里的教门鼓动没有发展为公开起事。在陕西南部，1796年底只有兴安府发生了几起小规模起事，且都迅速被省内征调来的驻军彻底扑灭。此后，只有1797年初湖北叛军经过陕南时，才有大批教众被鼓动加入了叛乱。在冲突迁延不决的其余时间里，各股叛军在汉水两岸来回穿梭，并多次出入秦岭。然而，尽管一些当地居民对叛军并不特别敌视，叛军在当地招揽新血却收效甚微。在白莲教全部叛军中，只有极少数来自陕西。可以说，汉水高地新移民的绝大多数并没有张开双臂拥抱叛乱。^56</p>\n<p>与大多数移民已找到新生计的陕南不同，在四川，人口过剩早已导致社会秩序恶化。整个18世纪，大批移民为种种真实或虚幻的机会所吸引，涌向四川。^57 到乾隆朝晚期，不仅肥沃的成都平原已住满了人，四川东部与南部的山区也同样如此，山坡丘陵上布满了小块而形状不整的农田。随着移民继续涌入这个普遍富裕的省份，无业游民的数量急剧增加，落草为匪成了许多人的自然选择。啯噜（Guolu）这一匪帮群体可能形成于雍正年间，在乾隆朝晚期大为扩张，其成员靠劫掠与绑架勒索为生，对社会秩序构成严重威胁。与此同时，大批乞丐四处游荡，冲击婚丧之家，强行勒索施舍。18世纪80年代初，福康安被任命为四川总督，受命清剿匪徒。在两年的任期内，福康安对匪徒采取了严厉措施，包括判处大量死刑。^58 然而局势似乎未见好转。除匪徒与乞丐之外，四川的富庶与高度的商业化还助长了另外两种非法活动：私盐贩卖与伪造钱币。乾隆朝晚期，盐价上涨导致盐销量下降，迫使四川许多盐坊关闭。这些盐坊的许多失业雇工转而以贩私盐为生，使省内原有的私盐贩子队伍扩大到数万人。由于从江苏向中原指定销售区运盐通常十分迟缓，四川的私盐贩子趁机填补空缺，把盐运往陕西南部与湖北西部。18世纪80年代，四川盐在邻省尤其是湖北的私销引起了朝廷的注意。尽管中枢政府一再催促四川当局处理这一问题，乾隆朝余下的时间里却进展甚微。与此同时，在四川，伪造贬值的铜钱\"小钱\"（xiaoqian）之风蔓延开来。虽然伪造钱币在许多省份都很猖獗，但在四川、贵州、云南尤为严重，因为这三省较易获得铜——当时全国铸钱所需的大部分铜产自云南。在乾隆朝的最后十年中，对伪造钱币的持续打击使更多人加入不法之徒的行列，因为他们为求生而饥不择食，抓住一切机会。^59</p>\n<p>尽管存在大量边缘人群，四川的教门运动直到1796年底起事前不久才与他们产生交集。在四川东北部（保宁、达州、太平与夔州等府或直隶州），教门网络最初由来自湖北的传教者建立，从而成为以湖北襄阳为中心的教门教区的边缘地带。然而，此后它们自行演化，形成了若干地方特色（例如，达州的教众仪式服装不用白布，而着黑衣）。与湖北、河南一样，四川的教门师父并不主动招募不法之徒。相反，其信众的核心由殷实人家或有产者构成，一些教门首领极为富有。直到准备叛乱时，首领们才向不法之徒敞开大门，把匪徒、乞丐、私盐贩子、伪造钱币者等收罗到麾下。两类人群的合流并非自然而然、早早发生，这一事实印证了：教门运动并非源于贫困。尽管起事在四川爆发后，叛军能够招募边缘人群以扩充队伍，但同一个蓄水池也为镇压者提供了人力——后者组建乡勇、招募民夫为军队效力，迅速抽干了叛乱的兵源。1796年第一波起事之后，胁迫便成为叛军在四川补充新血的主要手段。</p>\n<p>既然生存危机不是叛乱爆发的驱动力，其原因便只能从教门信仰内部寻找。在从蒙古入侵之前直到清代的漫长演变中，白莲教教义融合了佛教、道教、儒教、摩尼教及其他成分，尽管佛教对其教义与仪式的影响始终最为强大。^60 明代中期，教门运动蓬勃发展，很大程度上得益于当时的思想激荡。^61 此后，众多教门都采用\"真空家乡、无生父母\"（zhenkongjiaxiang, wushengfumu）作为主要教义。\"真空家乡\"字面上既指人们所从来之处，又指人们最终所归之处，其实质则暗示死后注定回归天堂。\"无生父母\"成为诸神之中他们的主神，但许多教门后来以\"无生老母\"（wushenglaomu）取代了\"无生父母\"。^62 这一转变与女性在教门运动中地位的提升相应，尽管教门社团从一开始就对女性开放。^63 教门首领为女性尤其是寡妇的情形并不少见。有些教门甚至完全由女性组成。教门教义的另一个新增的重要内容，是对弥勒佛——未来佛——的强调。正如弥勒佛崇拜所昭示的：必须否定现存的政治秩序与权威，为一个全新的时代开辟道路。这给大体和平、不涉对抗的教门运动注入了政治维度，使其具有潜在的颠覆性。^64 久而久之，一些教门把更加清晰的末世论注入弥勒佛崇拜之中，其中包括佛将降世、建立其新朝的说法。毫不奇怪，这常常导致谋反。</p>\n<p>然而，大多数教门都有意无意地试图不顺着弥勒佛崇拜带来的千禧年倾向走得更远。与明朝教门鼓动出众多起事与动荡时期形成对照，清朝在1796年之前此类事件并不多——唯一的大规模起事是1774年王伦在山东临清领导的起义。^65 其中一个重要原因是，清朝国家时刻保持警惕，且卓有成效。有清一代，国家不断更新镇压教门的法律，这些法律绝不宽仁。^66 每当官府获知某一教门的消息，便突袭其据点，逮捕其成员，施以鞭笞、监禁、流放与处决等惩罚。自1788年起，被定罪的教门成员被流放到新疆穆斯林居民居多的地方，因为在穆斯林中间传播其信仰似乎不太可能。^67 国家也清楚民间宗教的无处不在，认识到清除所有教门社团十分困难。更重要的是，它担心严厉的迫害可能适得其反。因此，清朝也不时运用灵活手段与安抚政策。1791年，山东一个教门社团被查获并遭到迫害时，乾隆明确表示：如果涉案者的活动只是吃斋、诵经、向信众收钱，而没有公开传达任何颠覆性讯息，他不希望对每一起教门案件中的牵连者都严加惩处。^68 在某种程度上，国家与教门之间对界线划在哪里有一种心照不宣的理解。然而，处置教门时想强硬到什么程度，最终仍取决于国家，这给国家与教门之间的互动造成了巨大的不确定性。^69</p>\n<p>尽管如此，本研究的重点不在于起事何以在18世纪90年代发生，而在于起事一旦爆发，清朝为何没有（或不能）迅速将其平定。因此，与许多关于中华帝国晚期政治史的研究不同，本书不强调国家与社会的二元对立，而是聚焦于\"国家\"内部的分裂。^70 清军是国家的重要机关，它在白莲教战争中执行了国家消灭叛军的意志——这一简单的事实，并不妨碍我们关注这一特定国家机器与国家整体之间的争斗与冲突。临时的战时当局由负有指挥战役或掌管后勤之责的高级武官与省级大员组成，他们充分利用战争为自身利益服务。为牟取最大的好处，他们作为一个战时利益集团，巧妙地向上层施加压力，迫使中枢政府按照他们的时间表进行战役，并认可他们耗费军费的方式。因此，就这场战争的持续时间与耗费而言，中枢政府与战争管理当局之间的斗争，比清军与叛军之间的战斗更具决定性。与此同时，战争领导层内部沿着道德原则或私人关系展开的冲突，使这个战时利益集团错综复杂、耐人寻味的政治进一步纠缠不清。尽管冲突有时发生在\"贪腐\"官员与\"正直\"官员之间，有时却更加个人化，超越了政治与伦理的取向。嘉庆皇帝反复无常、优柔寡断，尽管也采取了一些严厉的措施，最终却未能管束住他的战争领导人，未能迫使他们把王朝的利益置于一己私利之上。</p>\n<p>鉴于关于这一事件的二手文献十分稀缺，本书主要依据原始资料写成。关于白莲教战争的学术积累之所以有限，原因并不在于资料匮乏。事实上，原始资料的浩繁本身就足以让研究者望而却步。研究镇压白莲教叛军之役的最重要资料之一，是清廷在战役结束后立即编纂的一部鸿篇巨帙——《钦定剿平三省邪匪方略》（Qinding jiaoping sansheng xiefei fanglüe；Imperially Sanctioned Chronicle of the Campaign to Suppress the Heretical Bandits in Three Provinces），其中收录了近两千件奏折与数量略少的上谕，涉及这场战争及清朝的其他镇压行动。其影印本共有六十九卷，总计两万七千余页。尽管许多奏折原件尚存，分藏于台北故宫博物院与北京的中国第一历史档案馆，这部方略还是完整保存了清朝与这一事件直接相关的全部记载。换言之，原件已佚的文献，只能在这部方略中查阅。^71 此外，近年出版的几种其他汇编，如嘉庆皇帝上谕的档案汇编及其起居注，对本书也颇为重要。不消说，出自叛军之手的记载少而又少，且很可能已不存于世。^72 然而，数十份被捕叛军审讯记录存留至今，其中许多藏于北京的中国第一历史档案馆，并于20世纪80年代初在中国出版。^73 本书充分利用了这些被称作\"自述\"（zishu）的供词记录。要重建战争的动态、反驳那些因缺乏对原始资料的深入考察而产生的成见，除了对现存资料进行彻底的爬梳，别无捷径。诚然，官方文书与文件中有大量的夸大、歪曲、捏造与宣传。尽管如此，对它们的梳理仍然带来了许多发现与洞见。</p>\n<h2>注释</h2>\n<p>[译者按：注释序号与原文对应。文献条目中的书名、刊名、文章名保留原文（首次出现附中译），人名按通用译名处理。]</p>\n<ol>\n<li>1796年按中国历法是丙辰年：丙为天干第三位，辰为地支中的龙。</li>\n<li>这是有清一代在世皇帝禅位于继任者的唯一一次。新嘉庆皇帝的年号始于1796年元旦。即位大典见QSLJQ, 1/8a–18a。</li>\n<li>每个农历月有两三个辰日。辰时为上午九时至十时左右。</li>\n<li>白莲教战争在当代得到颂扬的唯一片段，是王聪儿的故事——这位女叛军后来成为湖北襄阳叛军的一名首领。</li>\n<li>关于中华帝国晚期教门运动最重要的著作包括欧大年（Overmyer）的《民间佛教》（Folk Buddhist Religion），以及韩书瑞（Naquin）的《千禧年叛乱》（Millenarian Rebellion）与《山东叛乱》（Shantung Rebellion）。关于白莲教起事的教门背景，见郭士达（Gaustad）\"Religious Sectarianism\"。</li>\n<li>麦卡弗里（McCaffrey）\"Living through Rebellion\"考察了湖北的几次起事。</li>\n<li>Jones and Kuhn, \"Dynastic Decline,\" 136–44.</li>\n<li>《圣武记》的编纂意图，是在鸦片战争之后激励清军重振雄风；它记录了清朝自开国以来所进行的所有重大战争。</li>\n<li>这部官方方略的全名为《钦定剿平三省邪匪方略》（Imperially Sanctioned Chronicle of the Campaign to Suppress the Heretical Bandits）。</li>\n<li>魏源用一卷的篇幅记述乡勇，即《嘉庆川湖陕乡兵记》，不过他只集中记述了其中几位最杰出的乡勇首领。关于筑堡，见384–85, 419–20, 433–36。</li>\n<li>此书最初由早稻田大学出版社出版。稻叶于20世纪初任教于早稻田大学，后赴朝鲜，在日本殖民政府中担任史官。他后来的著作主要关于朝鲜史。</li>\n<li>Inaba, Qingchao quanshi, 2:18–34.（稻叶岩吉：《清朝全史》第2卷，第18–34页）</li>\n<li>中文译本初版于1915年在上海出版，由多人合译，编者为但焘——孙中山革命的参与者、民国时期的高级官员。</li>\n<li>Xiao Yishan, Qingdai tongshi, 2:294–335.（萧一山：《清代通史》第2卷，第294–335页）</li>\n<li>该书名为《最近三十年中国政治史》（1898—1928）。李剑农虽大段引用稻叶之书并有所 ：正文\"廓清内地匪类\"系自英文\"clearing bandits in an interior area\"直译；此为上谕原句，文言原文待核，见于《钦定户部兵部工部军需则例》卷首上谕。]</li>\n<li>Dai, \"Reaching the Empire's Limits.\"</li>\n<li>绿营在17世纪晚期镇压吴三桂之乱中作出了出人意料的贡献，地位有所提高，而满洲旗兵则显出几分疲态与不力。</li>\n<li>关于军队经商，见Dai, \"Yingyun Shengxi\"，该文也讨论了乾隆把\"养廉银\"扩展到武职官员的问题。</li>\n<li>虽然非旗籍的汉人不可能在旗制内任职，旗人却经常被任命为绿营的高级军官。Ding, \"Youguan Qingdai Baqi,\" 及Fu, \"Baqi guanbing.\"</li>\n<li>Chu, \"Introductory Study,\" 148–49; Zhuang, Zhenkongjiaxiang, 161–64. 这些教门包括白莲、罗、黄天、红阳、闻香与八卦诸教，其中又衍生出更多教派。</li>\n<li>Naquin, \"Transmission of White Lotus Sectarianism.\"</li>\n<li>尽管许多学者认为以\"白莲\"作为明清众多教派的总称是有用的，一些学者也批评了这种用法。参见，例如，Overmyer, Folk Buddhist Religion, 73, 109–29; Ma, Zhongguo minjian zongjiao jianshi, 63–65.</li>\n<li>关于教门信仰与教义的最重要著作包括欧大年、韩书瑞、田海（ter Haar）、喻松青、马西沙等人的作品。关于18世纪晚期中原教门网络最重要的著作是Gaustad, \"Religious Sectarianism and the State.\" 只有少数学者写过教门运动的财政方面；参见，例如，Naquin, Millenarian Rebellion, 49–53, 280; Suzuki, Shinchō chūkishi, 113–15. 关于清代教门收支最详细的记述见Zhuang, Zhenkongjiaxiang, 449–90.</li>\n<li>据韩书瑞，入教费从一百文到数百文不等。Millenarian Rebellion, 280. 但乾隆朝晚期湖北房县的教众缴纳入教费高达白银一两。齐仲耀供词，BLJZL, 5:25。</li>\n<li>Zhuang, Zhenkongjiaxiang, 449–69.</li>\n<li>QLSYD, 16:405–6; Zhuang, Zhenkongjiaxiang, 473–75. 韩书瑞提到，这些钱还用于起事的准备，但也指出首领们从成员所缴钱财中获得了可观的收入。Millenarian Rebellion, 50–52.</li>\n<li>在中华人民共和国，几乎所有关于白莲教战争的论著都视社会危机为叛乱的主因。最早的例子是董蔡时\"试论川楚白莲教\"一文。在中国之外，铃木中正首先在《清朝中期史》（Shinchō chūkishi, 29–96）中倡导这一观点，其后又在《中国史》（Chūgoku shi, 152–66）中重申。</li>\n<li>吴熊光于1800年指出，陕南棚民遍布，且有入教倾向。XFFL, 150/27a–b.</li>\n<li>Dong, \"Shilun Chuan Chu Bailianjiao\"; Feng, Heshen pingzhuan, 233–36.</li>\n<li>陕西兴安府的情形便是如此。为维持汉水以南的秩序，清朝设立了一支新的绿营——兴汉镇。XFFL, 28/42b–43a.</li>\n<li>He, Huangchao jingshi, 85/27.</li>\n<li>白莲教战争期间，这些厂坊一直维持运转，只有1802年有几个月例外——当时陕西省级当局下令暂时停工。</li>\n<li>\"棚民危险、易受教门鼓动\"的看法，最初形成于白莲教战争期间，其后在战后时期延续下来。自1800年起任陕南知府的严如熤是倡导这一看法最力者。然而，严如熤并没有充分的第一手证据证明棚民是叛乱的骨干。关于严如熤及其在战后时代地方重建中的努力，见McMahon, Rethinking the Decline, 第三部分：\"Management of Southern Shaanxi Highlands.\"</li>\n<li>Dai, Sichuan Frontier, 190–98.</li>\n<li>NGDK, 119616, 147575. 福康安是乾隆第一位皇后的侄儿，乾隆朝晚期的主要将领之一。Hummel, Eminent Chinese, 253–55.</li>\n<li>18世纪80年代与90年代，关于此问题的上谕为数众多。QLSYD, vols. 16–18. 在乾隆朝最后几年，教门活动与减重小钱被视为四川的两大问题。QLSYD, 18:132–33, 166–67, 176–77, 198–99.</li>\n<li>Overmyer, Folk Buddhist Religion, 45, 48, 73–108, 130–45; Suzuki, Chūgoku shi, 56–60.</li>\n<li>思想方面的发展包括王阳明儒学在社会上的普及，以及佛学理论的新发展。Yu, Ming Qing Bailianjiao, 108–9.</li>\n<li>Chu, \"Introductory Study,\" 69–70; Yu, Ming Qing Bailianjiao, 34–35.</li>\n<li>允许男女自由混杂，甚至允许性关系，引起了国家与正统佛教徒的敌意。然而，这对男性参加者却具有巨大的吸引力。Yu, Ming Qing Bailianjiao, 3.</li>\n<li>Overmyer, Folk Buddhist Religion, 48; Yu, Ming Qing Bailianjiao, 91, 108; Chu, \"Introductory Study,\" 35–36, 55–56, 81–82.</li>\n<li>Naquin, Shantung Rebellion.</li>\n<li>从17世纪40年代到19世纪30年代，清廷至少修订扩充了二十七次惩治邪教的法律。Zhuang, Zhenkongjiaxiang, 27–59, 65–191.</li>\n<li>QLSYD, 16:370–71. 但这一措施并未阻止教门中人在流放地传播其教义。</li>\n<li>该教名为龙天门，创立于山东新城。乾隆指示官员：对已捕获的教众以枷号示众或鞭笞惩处，将其主谋发遣流放，但不必大范围搜捕。QLSYD, 16:341.</li>\n<li>例如，在上述案件中，乾隆谕令官员从轻处置教众仅仅十八天后，当他得知被流放新疆的案犯寥寥无几时便勃然大怒，下令将刑罚升级为待秋后绞决。QLSYD, 16:377.</li>\n<li>波拉切克（Polachek）在《内部的鸦片战争》（The Inner Opium War）中叙述了类似的动态。不过，他的案例与本案之间存在着显著差异。</li>\n<li>由于台北故宫博物院与中央研究院近代史研究所的努力，数以万计的嘉庆朝档案已经数字化，可在互联网上查阅。</li>\n<li>据清朝记载，一名识字的叛军曾充任某叛军首领的军师，写下了所有教门师父的姓名以及所历战斗的日期与地点。XFFL, 261/1a–b.</li>\n<li>这些供词收录于五卷本汇编《清代中期五省白莲教起义资料》（BLJZL）之中。</li>\n</ol>\n<h2>试译译名对照</h2>\n<table>\n<thead>\n<tr>\n<th>原文</th>\n<th>译名</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>White Lotus War</td>\n<td>白莲教战争</td>\n<td>书名译名</td>\n</tr>\n<tr>\n<td>sect / sectarianism / sectarian</td>\n<td>教门 / 教门信仰 / 教门中人</td>\n<td>以\"教门\"译sect，对应清代官方用语\"邪教\"语境</td>\n</tr>\n<tr>\n<td>jianbi qingye</td>\n<td>坚壁清野</td>\n<td></td>\n</tr>\n<tr>\n<td>xiangyong</td>\n<td>乡勇</td>\n<td>受雇者，功能近雇佣兵</td>\n</tr>\n<tr>\n<td>Green Standard Army</td>\n<td>绿营</td>\n<td></td>\n</tr>\n<tr>\n<td>Eight Banners</td>\n<td>八旗</td>\n<td>满洲、蒙古、汉军八旗</td>\n</tr>\n<tr>\n<td>War-time Expenditures Statute</td>\n<td>《军需则例》</td>\n<td>全称《钦定户部兵部工部军需则例》</td>\n</tr>\n<tr>\n<td>Hešen</td>\n<td>和珅</td>\n<td>满语名</td>\n</tr>\n<tr>\n<td>Yongyan</td>\n<td>颙琰</td>\n<td>嘉庆帝名讳</td>\n</tr>\n<tr>\n<td>Shengwuji</td>\n<td>《圣武记》</td>\n<td>魏源</td>\n</tr>\n<tr>\n<td>Shinchō zenshi</td>\n<td>《清朝全史》</td>\n<td>稻叶岩吉</td>\n</tr>\n<tr>\n<td>Qingdai tongshi</td>\n<td>《清代通史》</td>\n<td>萧一山</td>\n</tr>\n<tr>\n<td>Qinding jiaoping sansheng xiefei fanglüe</td>\n<td>《钦定剿平三省邪匪方略》</td>\n<td>官方方略</td>\n</tr>\n<tr>\n<td>pengmin</td>\n<td>棚民</td>\n<td></td>\n</tr>\n<tr>\n<td>Guolu</td>\n<td>啯噜</td>\n<td>四川匪帮</td>\n</tr>\n<tr>\n<td>wushenglaomu</td>\n<td>无生老母</td>\n<td></td>\n</tr>\n<tr>\n<td>zhenkongjiaxiang</td>\n<td>真空家乡</td>\n<td></td>\n</tr>\n<tr>\n<td>genjiqian</td>\n<td>根基钱</td>\n<td>入教费</td>\n</tr>\n<tr>\n<td>shengdanyin / dadanyin</td>\n<td>升单银 / 达单银</td>\n<td>汉字写法暂定，待核原书</td>\n</tr>\n<tr>\n<td>yinzhao</td>\n<td>阴照</td>\n<td>阴间通行证</td>\n</tr>\n<tr>\n<td>lianqian / guhuo pianqian</td>\n<td>敛钱 / 蛊惑骗钱</td>\n<td></td>\n</tr>\n<tr>\n<td>xiaoqian</td>\n<td>小钱</td>\n<td>贬值铜钱</td>\n</tr>\n<tr>\n<td>chikonge</td>\n<td>吃空额</td>\n<td></td>\n</tr>\n<tr>\n<td>shanghao</td>\n<td>赏号</td>\n<td></td>\n</tr>\n<tr>\n<td>xingzhuangyin</td>\n<td>行装银</td>\n<td></td>\n</tr>\n<tr>\n<td>yanglianyin</td>\n<td>养廉银</td>\n<td></td>\n</tr>\n<tr>\n<td>wuzhi mingliang</td>\n<td>武职名粮</td>\n<td></td>\n</tr>\n<tr>\n<td>Han River highlands</td>\n<td>汉水高地</td>\n<td>附原文</td>\n</tr>\n</tbody>\n</table>\n<p>[译者按：乾隆语原文已据\"汉籍电子文献资料库\"（中央研究院）《清仁宗睿皇帝实录》核实，见注释19；\"升单银/达单银\"汉字写法暂按学界通行用法，待核。]</p>\n<p>[体例说明：凡正文引用中文文献处，均给出直译，并于相应注释附文言原文与出处。标\"待核\"者系据通行引用复原、尚须核对原书；标\"待补\"者暂缺原文。后续各章照此办理。]</p>", "text": "\n凡军国重务、用人行政之大端，朕尚未至于倦勤，不敢自图安逸。\n——乾隆皇帝，1796年\n原文（已核）：\"凡軍國重務，用人行政大端，朕未至倦勤，不敢自逸。\"（《清仁宗睿皇帝实录》卷一，嘉庆元年正月一日传位诏书；QSLJQ 1/14b）\n\n1796年是中国十二生肖纪年中的龙年。^1 农历新年正月初一（公历2月9日），御极已六十年的八十四岁乾隆皇帝（1736—1796年在位）举行大典，将皇帝玺印亲手交给其子颙琰，开启新的嘉庆朝（1796—1820）。^2 龙年自然使这一时刻平添祥瑞，因为龙历来是\"天子\"的象征。然而，中国历史上的异见者也利用这一象征煽动叛乱。龙年之前数月，远离京城、居于帝国腹地一隅的教门首领们便已认定：龙年、龙月、龙日、龙时（辰年辰月辰日辰时）是起兵推翻清朝、建立新朝的吉时。这一\"龙时\"落在嘉庆元年三月初十（01/03/10）。^3\n然而，第一次起事爆发于湖北西南部，时在嘉庆元年正月初十（01/01/10）——嘉庆即位大典后九天、三重龙时之前两个月，因为起事计划泄露于地方官府，迫使教门众人提前动手。此后数周，湖北西南、西北部（以及湖北中部一处）又相继爆发数次起事，不过其中大多数只持续了数月乃至数周。是年稍晚，四川东北部与陕西南部亦有数处起事，但只有四川的起事撑过了1796年；陕西的起事则不出两月便被完全扑灭。诸多叛军从未统一起来，此后多年大体各自为战，在四川、陕西、湖北交界的山区往来穿梭，彼此协调有限——只有寥寥数次结成了短命的联合。与清朝统治精英的预期相反，这场征讨竟拖延长近十年，尽管叛军总数到1800年底已减至约两万人，1801年后更只有数千人。直到1804年秋，清朝国家才得以宣布最终胜利。而对最后几股叛军余部的零星战斗，则到1805年中方才完全停息。这些起事与清朝为镇压它们而进行的军事征讨——本书统称之为白莲教战争——标志着清朝黄金时代的终结与多事之秋的开端，历来被视为一个分水岭。（地图I.1）\n然而，这一里程碑式的事件，所得的学术关注与其公认的重要性并不相称。迄今没有一部专著专门讨论这一事件，无论中文或其他语言。即便在\"研究'农民起义'蔚为时尚\"的中国文化大革命期间（1966—1976），关于白莲教战争的著述也寥寥无几，与有关太平天国起义的大量论著形成反差——尽管这两次起义同被视为\"伟大的\"农民起义。^4 在西方，尽管学界对中华帝国晚期的教门运动不乏关注，但由此产生的众多出版物中，只有少数几种论及白莲教起事所由滋生的教门网络。^5 鲜有人尝试重述并分析起事本身及清朝的镇压努力。^6 《剑桥中国史》第10卷中的一节，以及孔飞力（Philip A. Kuhn）《中华帝国晚期的叛乱及其敌人：1796—1864年的军事化与社会结构》中的一章，长期以来一直是英语文献中有关这一事件的主要参考，尽管两者都未尝试提供一段堪用的叙事。^7\n关于这场战争最详细的叙述，出自19世纪学者魏源的《圣武记》。^8 魏源虽对白莲教战争着墨甚多，但其记述不过是1800年代朝廷任命的一个委员会所编官方方略的缩写本。^9 因此，在魏源笔下，清朝军队——无论将帅还是士卒——都为抗击来势汹汹的叛军而奋力苦战，以致这场征讨堪称清朝漫长而辉煌的军事史上又一大功业。为达成此目的，魏源剪裁掉一些自相矛盾的事实，淡化乃至删去乾隆、嘉庆两帝对统兵将领往往尖锐直率的批评。令清史研究者深感遗憾的是，魏源的这种回护立场，以及他对清朝在边疆与内地所行战争的缺乏批判的处理，从未受到认真的质疑。若说魏源对白莲教战争的记述有什么新意，那就是他对乡勇的使用与\"坚壁清野\"（jianbi qingye）之策的注意——后者指在战区修筑堡寨或设防聚落，庇护当地居民及其财产，使叛军得不到人力和给养。^10 尽管魏源并未将清朝镇压叛军的成功归功于这两项措施，他的记述却清楚地表明，这场征讨富于创举。或许连魏源自己都未曾料到，他的这番阐发竟会回响逾一个世纪。\n20世纪初，魏源的观察首先得到日本史家稻叶岩吉（Inaba Iwakichi）的呼应。稻叶在清朝灭亡数年后的1914年出版了《清朝全史》（Shinchō zenshi）。^11 作为第一部此类通史，稻叶之作其实不过是他对清入关前满洲史研究的仓促扩展，延展到清朝的整个存续期。在全书八十四章的一章中讨论白莲教战争时，稻叶聚焦于清朝无力剿灭叛军这一点，援引若干重要文献证明：由于制度上的积弊与腐败，清军已然腐化。不过，他显然未能利用关键材料——包括魏源叙事所依据的官方方略，更遑论当时尚未对公众开放的档案。稻叶虽然在明确指出清军武力之衰败上反驳了魏源，却也把《圣武记》所凸显的两项策略结晶为定论，主张清朝唯有依靠地方乡勇与乡村堡寨才能赢得这场征讨。^12\n稻叶之书旋即被译成中文，1915年在上海出版。^13 一位年轻的清史学者萧一山注意到稻叶研究中的大量事实错误与误解，遂另撰清史，即《清代通史》，并于20世纪20年代出版其前两卷。尽管萧一山以纠正稻叶之误为鹄的，他却欣然采纳了稻叶关于白莲教战争的观点。萧一山在稻叶对清军可悲状况的分析基础上加以发挥，同样指出乡勇与筑寨是清朝获胜的关键。^14 事实上，就这一论题而言，萧一山在使用原始资料方面并未比稻叶走得更远。\n萧一山的清史此后在中国的影响超过了稻叶之作，但另有一位中国学者李剑农，帮助把稻叶一系的观点传播于中国与西方。李剑农是孙中山革命组织同盟会的成员，1910年正在日本早稻田大学就读，其时稻叶在该校任教（但次年革命爆发，李剑农即返回中国）。二人是否在早稻田大学见过面，今已难考，但李剑农显然熟悉稻叶之书。在1930年一部关于19世纪末以来中国政治史的著作中，李剑农简略讨论了白莲教战争，以缩写的形式复述了稻叶清史中的记述。^15 1956年，该书修订本被译成英文出版时，两位译者邓嗣禹（Ssu-yü Teng）与杰里米·英戈尔斯（Jeremy Ingalls）为控制译本篇幅，选择不逐字全译。于是，他们把白莲教战争的部分加以浓缩改写，将\"稻叶—李剑农\"一系的观点凝练如下：\n\n白莲教之乱中，满洲政权的一大缺陷暴露无遗。由八旗与绿营组成的常备军已腐败到难堪大用。地方乡勇被征召起来镇压叛乱。……镇压白莲教叛乱的不是常备军，而是地方乡勇，他们采用的是被称为\"清野\"的焦土之策，即不给叛军留下任何食物与栖身之所。^16\n\n[译者按：此段系邓嗣禹、杰里米·英戈尔斯据李剑农中文原著《最近三十年中国政治史》浓缩改写的英文，此处自英文直译；原书为现代中文著作，不附原文。]\n这一简单而颇具吸引力的解释，此后直接或间接地影响了一代又一代学者，鲜有人质疑其来源与有效性。它被中华帝国史与中国近代史的通史作者们采用，也充当过若干有影响之作的事实依据。尽管越来越多的中国史研究者对如此重大的事件竟只有如此单薄的学术积累表示不满，许多人仍抱持这一陈说，因为尚无替代性的解释取而代之。^17\n既然没有关于这一事件的扎实知识，就无法驳难并推翻公认的成说，本书因此对清朝与一群群叛军之间近十年的冲突作一实证研究。更具体地说，本叙事聚焦于清朝镇压起事的努力，以及清朝战争领导层——由武职官员与省级文官（通常是总督与巡抚）共同组成——内部往往龃龉不断的人际关系，和他们与朝廷之间的关系。叛乱的教门性质以及起事对教门运动的影响，不是本研究的重心所在。相反，叛军一方的政治与军事战略战术将得到仔细的观察与分析。本研究的目标有三：重建并叙述战争的过程与动态，以历史事实重新检验此前的种种论断，并重新评估这一事件的意义。后两个目标离不开第一个。总体而言，本书试图对这一事件及其在中华帝国晚期历史上的意义作出全新的解释。\n与那种认为白莲教战争严重动摇了清朝的流行看法相反——鉴于其持续时间、地理范围与耗费似乎都不辱\"大白莲教起义\"之名，这种看法并不罕见^18——本研究表明，18世纪90年代末发生在湖北西部、四川东北部与陕西南部的起事，远未强大到足以对清朝构成严重威胁。事实上，叛乱领导层从一开始就极度涣散，缺乏有前景的战略目标，与半个世纪后强大得多的太平天国起义形成鲜明对照。叛乱的原始策划者们虽然曾隐约怀有称帝的野心——从他们择定龙年龙月龙日龙时起事等种种迹象中可见一斑——但不仅其政治纲领迅速消散，连叛乱的教门性质也随着冲突的展开而大体褪色。叛军缺乏技能、装备与协调，无力攻取他们活动区域内的重要政治经济中心。除开1796年这头一年——其间湖北与四川的叛军夺取了数座县城（但只有一座能长期据守）——他们几乎从未攻占任何城市或像样的市镇（1796年后仅占领过一座市镇数周），而主要是在四川、陕西、湖北交界的山区辗转，并数次闯入甘肃境内一些地方，而那些地方无一例外人烟稀少。同样与流行看法相反——那种看法认为民众是因地方官的压迫盘剥而加入起事——起事在最初几年里除教门社群之外并没有得到广泛的响应。为扩充队伍，叛军不得不频频胁迫当地居民入伙。到1800年底，幸存的叛军已沦为几股漫无目的、挣扎求生的匪帮。\n既然战事之所以旷日持久并非由于叛军强大，人们就不得不向战争中的另一方——清军——寻求答案。与前述\"腐败的清军已无力迅速平定叛乱\"的看法相反，一些清军将领与地方官在征讨的早期阶段表现出色，以致大部分起事在爆发后不久即被彻底扑灭，其余也被牢牢压制。然而，战役的许多其他主持者——无论文武——却有意拖延剿灭叛军。对他们来说，更具吸引力的是充分利用这场战争牟取私利，诸如升迁与物质好处，无论正当还是不正当。与此同时，战争领导层内部的个人争斗，也被证明是令真心作战的将领们士气低落的关键因素。嘉庆皇帝虽然在1799年初乾隆驾崩后亲政，表现出让脱轨的战役重上正轨的决心，却未能贯彻其改革议程，且频频向统兵大员让步。结果，清除叛军余部的最后阶段战争变得令人烦恼地迁延不决，一拖数年。皇帝虽屡次催促各路统帅与督抚结束战争，且1803年初与同年秋两度宣布获胜，但每一次\"胜利\"之后冲突旋即再起。总而言之，这场战役不是在中央政府的注视下进行的，而是按前线统帅们的节拍进行的。\n既然导致战役旷日持久的是军方不愿、而非无力迅速消灭全部叛军，那么也就不难看出，那两项广为人知的策略——使用乡勇与\"坚壁清野\"——并不值得它们所获得的赞誉。与\"这些策略直到战事后期清军不济时才被采用\"的看法相反，两者从一开始就都已就位，其时一些镇压者仍在有效地作战。但两项策略在战事中都未发挥关键作用。此外，帮助发起这两项举措的地方精英也从未居于舞台中央，因为战争当局很快就接管了两项事业的领导权。事实上，对这两项策略的强调，反而掩盖了这场战争一个引人注目的特点：清方雇用了数十万平民协助其军事行动。这些平民被称为乡勇（字面义\"乡村勇壮\"），在英语中最接近的对应词是\"militias\"（民兵），但其功能更像雇佣兵。受雇乡勇与地方乡勇的关键区别在于：前者由战争当局支饷，而地方乡勇是来自本地社区的自愿者。\n清军使用此类雇佣兵，是18世纪晚期的新办法，是对乾隆皇帝削减日益膨胀的军费开支这一努力的回应。由于发现雇佣平民充作战兵是规避清廷18世纪晚期所颁战时开支条例的便捷途径，各路统帅在白莲教战争中把这一做法推到了极度滥用的地步。它成为这场战争耗费惊人的主要原因之一，因为受雇乡勇的人数常常超过所调正规部队的人数（至少在纸面上如此），其饷银在早期阶段还高于正规兵。更关键的是，战争当局对他们遣散事务的处理失当，是战争旷日持久的一个重要因素：许多被遣散的乡勇最终投了叛军，而统帅们又抵制遣散余下的乡勇。当中枢政府催促裁减乡勇时，战争领导层便接管地方筑堡工程与地方乡勇，用它们作借口，替代雇佣兵，从中枢政府套取军费。\n征讨中大量使用受雇平民，在清朝统治精英中激起了一场关于现有正规军改革的激烈（虽然时断时续）的辩论，这场辩论迄今未引起学界注意。鉴于满洲八旗部署起来过于笨重昂贵，而绿营又过于分散、地方化，一些人提议并论证建立一支新的机动部队，必要时可以随时调往帝国任何地方。改革的核心接近于以职业兵取代事实上世袭的兵员——而世袭正是八旗与绿营的共同现实。尽管在战争的前半段（1796至1800年），支持改革的声音占据上风，但嘉庆皇帝此前虽对新机动部队的想法表现出兴趣，到1800年中期却转向维持现状，因为一旦批准这一提议，将可能对八旗制度造成剧烈冲击，且耗资巨大。尽管嘉庆对雇佣兵深怀疑虑与厌恶，他仍调整立场，接受使用非常规兵员，并中止了关于可能的军事改革的讨论。从历史的后见之明看，清朝由此错失了在半个世纪后面临更严峻挑战之前重组并强化其军事体系的机会。\n嘉庆皇帝固然担心军事改革可能带来的高昂代价，但在约束征讨战役骇人的巨额开支上，他同样无能为力。清朝的战争财政制度漏洞百出，为将领与后勤官员滥用规则、侵吞军费提供了绝佳的环境。18世纪，清朝在边疆进行了多次大规模战争，其中最昂贵的是四川西部边地的第二次金川之役（1771—1776）。然而，那场战争六千余万两白银的花费，与白莲教战争据称耗费的一亿二千万两相比，显得相形见绌。在后一场战役中，统兵将领与地方官员都贪婪地借支付乡勇、脚夫与牲口的饷银等名目，从军费中渔利。结果，军费中相当大的一部分被挪用或侵吞。战区的严重腐败并非无人察觉；文官系统的批评之声贯穿战役始终。1799年，嘉庆皇帝试图以削减不必要的开支、杜绝侵吞来整饬战争财政，作出了一次大胆的尝试。然而，这一尝试很快适得其反，在军方与地方政府的顽强抵制下夭折。在战争的余下时间里，中枢政府继续屈从于战争领导人的要求，无力约束他们。由于中枢政府的国库几近空虚，国家不得不向各省与民间四处筹措经费，同时削减其他项目，从京城到各省厉行节俭。\n揭示白莲教战争全面而细致的动态，将有助于重新评估其意义。这场近十年的战争虽然是清朝国家的一场严重政治危机，但危机不在于国家受到了来自社会底层的叛军的严重挑战。相反，它是一场政治危机，其含义是：清朝中枢政府不再能在需要的时候开动其军事机器。尽管朝廷一再试图夺回对战争的控制权，它最终还是败给了将领与总督们——后者将自己的意志强加于中枢政府，劫持战役为自己的目的服务。从长远看，这一发展预示了清朝中央权力的瓦解。对清军而言，白莲教战争的后果同样不利。国家在战争中耗尽了财政活力，又担心再次被军界蒙蔽，于是在供养军队上退缩到保守路线，逆转了自开国以来一直奉行的政策——将军队福祉置于高度优先的地位。由于缺乏足够的财政支持与皇帝的关注，清军在白莲教战争之后急转直下，不出数十年便无力应对内外危机。由此着眼，人们可以从一个新的视角看待清朝帝国秩序的瓦解：即清军财政体系的演变在不知不觉间培育出一个战时利益集团，它悍然挑战中枢政府的政治权威，耗尽了国家的财政实力。随后，国家撤回优待军队的承诺，又加深了清军体系早在战前便已积压的困境。\n1796年初叛乱爆发时，尽管乾隆已禅位于其第十五子颙琰，他依然是清朝的掌舵人。乾隆自封\"太上皇帝\"（taishang huangdi），并不掩饰自己并未将国政大权交给儿子。正如他在禅位诏书中公开宣称的：\"凡军国重务、用人行政之大端，朕尚未至于倦勤，不敢自图安逸。\"^19（原文见注释19） 事实上，他不仅主持大事，连日常政务也一并处理。结果，嘉庆朝的头三年（1796—1799）成了乾隆时代的延续，以至于如那位退位皇帝所愿，紫禁城内继续使用\"乾隆\"年号。^20 政治与政策因此并无断裂，人事亦无重大变动。唯一可见的差别是：乾隆现在把新君留在身边，从早到晚加以训导。\n颙琰生于妃嫔，并非乾隆钟爱的儿子。1736年，即乾隆即位之年，他密立孝贤皇后所出、当时唯一的儿子永琏为皇太子。但永琏仅仅三年后便因病夭折。此后直到1773年，乾隆才重新考虑继承人的问题，而他当时决定立颙琰为皇太子，很可能不过是一个不置可否的选择。只是乾隆在仅存的几个儿子中找不到更好的人选而已。^21 颙琰对自己的入选或许有所察觉，但这一决定直到1795年底才公之于众，其时乾隆宣布将于次年禅位。^22\n乾隆的退休史无前例——有清一代，此前没有哪位皇帝生前让出皇位——而他持续把持权力，使乾隆—嘉庆的权力交接变得复杂微妙。受影响最深的人莫过于颙琰，即嘉庆皇帝本人。嘉庆完全处于父亲的支配之下，只被允许履行仪典职责、批阅奏章，却不能自作批复。然而，他表现出政治上的成熟与精明。他坚忍尽职，在三年\"见习期\"里，无论公开场合还是私下，都没有流露出任何不满或野心的迹象。这样一来，他不仅赢得了父亲的认可，还使乾隆的首席助手、权势最盛的内廷大臣和珅（Hešen）确信：这位新君没有胆气自行其是，从而促使和珅对嘉庆倨傲无礼。^23\n和珅虽被广泛视为乾隆朝晚期腐败的根源与化身，事实上却是一位高超的首席大臣与乾隆皇帝的助手。他的飞黄腾达，很大程度上与18世纪70年代的政治形势有关。孝贤皇后之弟、自18世纪40年代末起担任首席军机大臣的傅恒于1770年去世后，乾隆经历了一段危机时期，其间性情乖张反复。^24 乾隆在侍卫和珅身上找到了一位可以托付政务与私事的新首席助手，这帮助皇帝恢复了从容与活力。作为回报，乾隆在短短数年间便将和珅擢升至领班军机大臣的高位，并兼领众多职衔。^25 和珅固然贪婪，向官员索贿受贿以聚敛财富，但他也是一位尽职的得力助手，协助皇帝遏制朝内外的腐败与弊端。把和珅钉为官场腐败丛生的总根源，固然省事，却无助于充分把握乾隆朝晚期错综复杂的宫廷政治。^26\n晚近的研究提出，乾隆扶植和珅，背后是朝中的派系斗争。按这种看法，让和珅占据傅恒留下的位置，可能是为了制衡朝中一个根深蒂固的派系——该派系由乾隆朝早期的两位重臣阿克敦与刘统勋所开创。^27 尽管18世纪晚期清朝朝中各政治派系之间的界线有时难以划清，从道德化视角剖析和珅问题无疑是不智的。不过，白莲教战争前夕，朝野内外对和珅的反对尚未达到政治危机的程度。相反，鉴于乾隆—嘉庆权力交接的独特进行方式，朝廷上弥漫着大量的不确定与悬而未决之感。随着那个不可避免的结局日益临近——乾隆虽然精力充沛、尚能任事，毕竟已届风烛残年——朝中许多人都盘算着：当那位看似谦抑寡言的新君最终接掌大权时，自己的前程将会如何。因此，无论是呼吁改革还是激化朝中的政治纷争，当时都不是搅动现状的最佳时机。就本研究而言，和珅问题并没有反映在中原城镇乡村的教门鼓动之中，下文将详述。\n1795年决定退休时，乾隆想必踌躇满志，认定自己的帝国拥有足够的军事力量应对任何规模的起事。他的王朝拥有当时世界上规模最大的常备军之一（八旗与绿营合计约七八十万人）。尽管已经出现一些衰落的早期迹象，18世纪末的清军仍是一支令人生畏、切实有效的力量。18世纪90年代初，在最后一次远征边疆、征讨廓尔喀（尼泊尔）的战争中，清军先是进军西藏驱逐廓尔喀入侵者，随后攻入尼泊尔，兵锋直指其首都加德满都，展示了在极端险恶的环境中为远程远征调集资源的能力。尽管伤亡惨重、耗资巨大，入侵尼泊尔还是给尼泊尔的廓尔喀人与印度的英国人都留下了强烈印象。结果，尼泊尔同意与清朝建立朝贡关系。只要有合适的统帅与条件，清军依然能够完成艰巨的任务。然而，清朝的军事财政制度存在先天缺陷。天长日久，这些缺陷演变成积重难返、癌变性的痼疾。清朝未能将其根除，就不得不在镇压白莲教叛军的战役中承受其最严重的后果。\n清朝供养军队的制度是双重的。首先，两支军队——由满洲、蒙古、汉军组成的八旗，以及兵员全为汉人的绿营——作为两个等级获得不同的待遇。八旗被视为精锐的机动野战部队，只驻扎在京城、满洲以及若干重要城市和战略要地。旗兵的俸饷、津贴、赏银等高于绿营官兵；绿营则驻扎全国，承担着维护地方治安的职责。其次，军人的平时收入与战时收入之间存在显著差距。有清一代，两支军队的常俸几乎保持不变，但所有派赴战场的部队都能在平时常俸之外获得补偿。^28 更重要的是，战时补偿要优厚灵活得多，也易于滋生弊端。结果，不满足于平时收入的军人把派赴前线视为梦寐以求的额外收入机会，此外还有升迁与立功纪录的机会——对旗兵而言，功绩越多，退役时所得的优待就越多。由于这一制度，常备军有几分像雇佣兵：一经部署，即为丰厚的钱财利益而战。\n18世纪，清朝在边疆与内地进行了多次战争，包括在极西北与准噶尔蒙古人的长期战争、数次进军西藏、平定边境与台湾的叛乱，以及入侵缅甸、越南、尼泊尔等邻国。18世纪上半叶，军费开支大体尚能控制；但到了下半叶，统帅们动辄以战场上的紧急需要为名，要求越来越高的军费——而在战争环境下，此类需要并不难找到。结果，军费开支持续大幅攀升。18世纪50年代，清军在东突厥斯坦进攻并消灭了强大的准噶尔汗国，随后又平定了当地穆斯林头领的叛乱。尽管前线与内地相距遥远，1754至1760年六年间，战争总耗费为二千七百万两。^29 然而，1774年，镇压山东王伦所领导教门起事的一场历时一个月的战役，竟耗银一百万两，令人瞠目。^30 与此同时，为征服嘉绒土司而在四川西陲进行的第二次金川之役，五年间（1771—1776）耗银逾六千万两，成为清朝到那时为止所打的最昂贵的战争。^31\n18世纪晚期推高军费的主要因素，是发给官兵的战时津贴与奖赏，以及支付给受雇运送补给辎重、修筑军事设施与基础设施的民工的工资与赏钱。尽管这两类开支都极随意、难以规制，后者——对民工的补偿——比前者更甚，因而耗费也更大。有清一代，战时物资运输方式不断演变。起初，运输常常由军队自行承担。^32 整个18世纪，战时后勤日益向私人部门开放；补给与辎重主要由受雇的劳工与牲口运输。部队不仅不再承担任何后勤工作，甚至还有权让雇来的民夫替他们挑运武器、装备与个人物品（有些情形下，他们还让民夫抬轿而行）。在第二次金川之役中，运输费用占军费总开支的大头，尽管以犒赏兵丁为名的滥支也同样普遍而严重。^33\n清朝国家此前虽曾尝试规制军费开支，^34 但促使乾隆及其廷臣采取行动的，是第二次金川之役的巨额耗费。第二次金川之役甫一结束，乾隆便任命一个临时委员会，责其编纂一套规则，将战时开支的标准规范化，以根除战时腐败，把军费限定在合理规模。^35 委员会以阿桂与和珅为首，成员包括一百余名高级朝官，以及涉及军事财政的户部、兵部、工部三部堂官。这被证明是一项繁难而琐细的工程：委员会必须翻阅档案中的大量卷帙，从以往战争中各类开支里梳理出先例，并为每一项支出定出合理的标准，还要考虑可能影响开支的各种变数。直到1784年，即项目启动八年后，一部三部分合编的则例——《钦定户部兵部工部军需则例》（Qinding Hubu Bingbu Gongbu junxu zeli；Imperially Sanctioned Statute of Wartime Expenditures Concerning the Ministries of Revenue, War, and Works；下文简称《军需则例》）——才颁布施行。这部近一百二十条的则例，规范了军人的战时奖赏、津贴与伤亡抚恤；军需民夫、牲口以及医生、兽医、工匠等专业人员的报酬；以及军火购置与筑路、架桥等作战基础设施建设的费用。^36\n《军需则例》堪称清朝军事财政制度演进中的一个里程碑，它代表着清朝国家诉诸立法手段来约束不断攀升的军费开支的一次认真努力。尽管这部则例认可了以往战争中形成并沿用的某些非正式做法与权宜之计——考虑到主要编纂者中不少人都以借战争之机从国家榨取更多经费而闻名——它也废除了某些最为恶劣的做法，包括臭名昭著的\"赏号\"（shanghao）：一种非正式做法，统帅动用军费购买绸缎等物料赏赐部队，有时干脆直接赏银。同时，则例对以往战争中出现的各项开支作了细致的规定，使军队与掌管战争后勤的文官挪用经费的空间大为缩小。此外，它授权文官系统对军费开支进行监督。户部官员在审核军费时，一旦发现任何不合常规的开支，便援引《军需则例》加以驳斥。事实上，和珅在掌管户部时，执行则例十分严格，无情地裁削缺乏依据或过高的报销。\n然而，新法典并未消除八旗与绿营在战时补偿上的差距，反而进一步确认甚至提高了旗兵的战时待遇。例如，绿营兵丁被派赴前线时，只能领到六两\"行装银\"（xingzhuangyin）——以置办行装装备为名发给出征部队的津贴——而从满洲征调的普通旗兵可以领四十两（京城满洲旗兵领二十两，驻省旗兵领十五两）。^37 结果，调遣旗兵参战变得更加昂贵费事。事实上，准噶尔蒙古人覆灭后，帝国边疆大体安定，清朝国家越来越不愿动用旗兵。1776年中，乾隆在启动编纂《军需则例》工程的上谕中，斥责山东当局对镇压王伦起事的战役处置失当。他分析说，这场战役的目的不过是\"廓清内地匪类\"（原文待核，见注释38），而主持后勤的官员却误把它当成一场大战来办。显然，在乾隆看来，讨伐内乱的战争不应动用精锐旗兵，以免耗费更多。^38 《军需则例》颁布后，乾隆更进一步：在他余下的统治期内，对在边疆战争中部署旗兵一直犹犹豫豫。征讨廓尔喀（尼泊尔）之役中，一万五千至一万六千人的远征军中，只有一千一百人是来自满洲的旗兵（巴图鲁一百名、索伦兵一千名），其余为绿营兵与四川西部、西藏的土兵。^39 这些被称为\"土兵\"或\"番兵\"（tubing或fanbing）的族群士兵，是西北与西南边疆非汉社群的武装力量。土兵花费低廉而颇有效力，清朝国家此前就曾征调，但在乾隆朝的最后几十年里，这一做法变得更为制度化。\n清朝不愿动用其精锐军队，自然把作为二线部队的绿营推到了前台。按清朝开国君臣的设定，绿营本不应充当机动的打击力量，而是用于守御地方，尽管其部队也常随八旗出征。^40 与八旗一样，绿营全体官兵的俸饷自开国以来基本未变。旗兵享受着皇帝不时给予的种种赏赐，绿营官兵——尤其是兵丁——则承受着更大的经济困难。18世纪中有约五十年时间，由于雍正皇帝（1723—1735年在位）的倡导，朝廷向八旗与绿营提供本钱，供其投资经商，绿营兵丁得以依靠所获利润，补贴婚丧这两件人生中最费钱的大事。然而，1781年乾隆废除了这一做法，改为在常额军费之外每年拨银一百万两，以应兵丁的这些需要。同年，乾隆又废除了绿营军官的\"武职名粮\"（wuzhi mingliang）——事实上是军官的一笔额外收入——改而赏给他们\"养廉银\"（yanglianyin），这一恩典此前仅限于文官。为此，清朝国家每年须再支付二百万两。^41 显然，乾隆试图为绿营的军官与兵丁提供一些有保障的经费，以缓解他们平时的窘境。\n然而，这些措施并未收到乾隆预期的效果。拨给兵丁补贴的一百万两并未全部发到他们手中，许多钱款在流经军事官僚系统时被耗散。把\"养廉银\"扩展到武职官员，同样未能阻止他们盘剥兵丁。许多军官没有用新增的津贴雇请仆从——诸如跟班、厨子、轿夫、工匠、杂役、马夫、乐师等等——而是把钱装进自己腰包，继续克扣兵丁饷银以支应个人开销。在一种被称为\"吃空额\"（chikonge）的普遍做法中，军官向上级隐瞒空缺名额，把空额的饷银私吞。军中名册上充斥着大量\"空额\"（虚挂名籍的兵员），绿营的实际规模已大大低于其六十万的理论员额。按照清朝承自明朝的军户制度，兵丁子弟本应在出缺时优先补入。然而，18世纪晚期人口增长扩大了候补者的队伍，竞争一个名额变得愈发激烈；行贿于是成了家常便饭。及至国家允许无法在旗制内谋得差使的满洲旗兵补入绿营，情况便更加恶化。^42 与此同时，整个社会变得富裕得多。奢侈品琳琅满目，娱乐场所成倍增加，只会加剧军人内心的失落与错位。\n尽管中枢政府关注军人的福祉，对军事财政制度的根本性整顿显然不在考虑之列，因为18世纪晚期的情势没有产生足够的紧迫感，不足以使这一潜在风险极大的步骤成为必要并具有正当性——它势必带来重大而复杂的后果。不过，朝廷虽然希望约束战时开支，却也清楚地意识到军人的财政困境。在《军需则例》颁布后的几次用兵中，乾隆皇帝都倾向于给部队提供一些财政上的激励。由于《军需则例》的宗旨只是为战后通常才进行的军费审核提供标准，它并没有为战费的拨付提供指导。因此，为战争拨款仍然取决于皇帝。此外，户部也没有任何机制可以质疑或阻止皇帝所要求的拨款。经费一经拨付并送抵前线，统帅与后勤官员们就不难想出办法规避《军需则例》中的规则，以通过户部的审核。最好的办法似乎是制造新的名目——《军需则例》尚未规制、却留足腾挪空间的名目。在白莲教战争中，中枢政府慷慨的财政支持，加上应对叛军游击战的特殊情势，点燃了战区的腐败，使这场战役成为清史上最不堪的一役。\n远离紫禁城的下层世界，自有其关切、执念与行动节律。18世纪后半叶，教门信仰的声势迅猛高涨。与清朝早期相比，乾隆时代堪称教门虔诚的\"黄金时代\"。新出的教门达一百余种，尽管许多旋起旋灭，而教门活动的地理范围也扩展到全国大部分地区。^43 与此同时，新的教义相继出现，大量经卷（jing）与宝卷（baojuan）得到编纂、刊印与流通。教门的组织技巧与传布手段日益成熟多样。^44 这些教派名目繁多，但官府与许多教门中人都以\"白莲\"作为总称，指代其中大多数教派（不过有些教派刻意回避这一名号）。^45 何以此时会出现教门信仰的如此激增？归根结底，这同样是一个关于白莲教战争根源的问题，因为叛乱首先是从乾隆朝晚期蔓生的教门运动中滋生出来的。与关于叛乱起源的流行看法相反——那种看法强调社会弊病与一部分人口的错位——证据表明，教门信仰的显著增长，反映的恰恰是民众财富水平的提高。理解这一动态的关键，在于教门运动的经济维度。\n在现有的关于中华帝国晚期教门信仰的学术成果中，居主导地位的注意力一直放在教门的信仰与教义上，其次（在较小程度上）是其组织结构与网络，而教门的经济则从未得到仔细的考察。^46 然而，财政机制是教门信仰不可分割的一部分；几乎所有教门都有一套筹钱的办法，依靠会费与宗教服务收费的收入维持并壮大自身。在向教门成员与信众收取的种种费用中，最重要也最常见的收费之一是入教费。许多教门称之为\"根基钱\"（genjiqian），即入教时缴纳的款项。虽然各教门入教费的标准已无从一一查考，但有限的记载显示，数额并不算小。^47 除这笔一次性收费外，成员与信众还须承担名目繁多、因教而异的其他费用与财务义务。信众须为诵经念咒等服务付费；为仪式所用纸、香、烛等物料付费；为教门执业者的旅费付费；还要在节庆等特殊场合向师父们赠送礼金；如此等等。鉴于人们被教门教义吸引的首要原因，是今生避灾去病免祸、来世升入天堂，许多教门声称只要收费，就能帮助这些人达成所愿。一种常见的做法是：师父把求告者的姓名及其他个人信息写在黄纸上——有时也写明其付款数额——再边诵经边将黄纸焚化。这样，神明就会将福佑与庇护照拂黄纸所书之人。这项服务的收费常被称为\"升单银\"或\"达单银\"（shengdanyin或dadanyin，意即\"通神报名之银\"）。与天主教会售卖\"赎罪券\"相似，教门也售卖通往死后世界的通行证，即所谓的阴间护照\"阴照\"（yinzhao），据说能使持有者免遭地狱的残酷折磨。此外，一些教门还向信众出售印制的经卷、歌诀、传单以及种种券符。^48\n理论上，一切收费所得都用作教门的运作经费，支付宗教设施与物料的费用，并充当成员与邻里的救济慈善基金。但实际上，经费完全由师父们掌控，他们往往设一名或数名财务管事代为保管钱财、管理账目。据记载所示，一些教门首领手中握有相当可观的经费。除其他用途外，他们把钱财用于成员卷入诉讼或被捕时的打点与赎取，还派人看望获罪流放远边的教众并给予接济。除为教门开销之外，教门首领本人也靠教门经费过活，他们往来于各教门据点之间，为自己、家人与随从随意挥霍。^49 诚然，也有真正虔信的教门师父——1796年白莲教起事的首领中，许多人属于此类——但毫无疑问，另一些人把宗教活动当作一桩生计，一桩可能获利丰厚、却也不无风险的营生。他们挑选有发展潜力的对象加以传教——不去优先招揽那些勉强度日的赤贫者或游民无产者，对他们来说是顺理成章的——由此给教门运动增添了一个生意的维度。信众的大多数虽非来自上层阶级，许多人也不富裕，但他们同样并非赤贫。鉴于民众整体上比本朝早期富裕得多，就连下层阶级也负担得起自己的宗教需要。这并不是说人们只有在满足了生存需要之后才会照料宗教需要，因为宗教热忱往往正产生于困厄的处境。然而，18世纪晚期教门信仰的滋长，并不仅仅是这类宗教需要的结果，也是教门从业者精心经营的结果。\n收取入教费与其他费用不仅对教门及其首领的财政状况至关重要，还被用作招募新成员的诱饵。许多师父向有望入教者许诺：他们入教后只消很短时间，便可自行收纳弟子。新入教者在教门等级中地位的迅速跃升，使他们得以向他人收钱，这成为一些人加入教门的重大激励。由于弟子有义务把自己向徒众收费所得的一部分上缴师父，一些人便想与师父决裂，自创新教。师徒关系的不断复制，是18世纪晚期教门社团如雨后春笋般涌现的一个重要因素。这一动态又反过来造成母教与子教之间在教义、经卷与仪式上的诸多相似。\n在清朝的官方记载中，皇帝与官员们一致指出教门活动的经济动机。所用的词是\"敛钱\"（lianqian）与\"蛊惑骗钱\"（guhuo pianqian）。官府虽然倾向于淡化民众中真实的宗教渴求，但他们把握住教门运动的经济维度，这一点并没有错。的确，一些自封的教门师父，其经济动机更甚于信仰的感召。虽然还需要个案研究来进一步阐明经济因素在教门信仰扩展与演变中的作用，但可以确定的是，进出教门网络的钱流数量相当可观。换言之，构成18世纪晚期教门信仰扩张之社会基础的，是较为富裕的人口，而不是被剥夺了基本生计的人口。\n在关于白莲教战争的有限学术成果中，似乎存在一种共识：叛乱至少部分地源于社会中日益尖锐的困苦与危机。教门鼓动虽然被承认为一个因素，但社会问题通常被看得更为重要。^50 乍看之下，这种看法似乎站得住脚。整个18世纪，全国人口的迅速增长导致可耕地严重短缺，使大量人口失去土地，生计无着。乾隆朝晚期，数以百万计的此类人口离乡背井，到他处寻找机会。在中原地区，两大山系——横贯陕西南部的秦岭，以及位于川陕边界、延至湖北西北部的大巴山——成为移民的目的地。到18世纪末，这两大山区的移民已达数十万，也许逾百万。他们在清朝记载中被称为\"棚民\"（pengmin）——因其住所简陋而得名——其中许多人为教门信仰所吸引。^51 在20世纪产生的学术成果中，这两大山系被合称为\"汉水高地\"（Han River highlands），被视为白莲教战争的温床，棚民则被认定是叛乱的骨干。不仅马克思主义史学家完全接受了这一对叛乱起因的解释，它在马克思主义阵营之外也保持着吸引力，至今仍引起共鸣。^52\n然而，陕西南部的棚民并不是叛军的主力。事实上，大多数棚民已在这片崎岖的内地边疆找到了生计。许多人定居下来务农，在山中开垦荒地，建起新的村落，或独居在孤零零的棚屋之中。^53 同时，还有许多人受雇于邻近省份（主要是山西与湖北）商人在山中设立的众多厂坊。从伐木到造纸再到种耳，这些厂坊容纳了大量新来者。更有经营头脑的人则自创基业，或为店主，或为长途贩运的行商。^54 尽管他们的生活并不富裕，许多人辗转于一份又一份零工，有些人还靠劫掠与其他非法手段求生，但若断言这一群体整体上到18世纪末已面临严重的生存危机，在历史上并不准确。^55 1796年初叛乱爆发时，起事的主要地点在湖北西部，参加者多为有产者，或是农民，或是小商人。河南南部的教门成员构成与此相似，尽管那里的教门鼓动没有发展为公开起事。在陕西南部，1796年底只有兴安府发生了几起小规模起事，且都迅速被省内征调来的驻军彻底扑灭。此后，只有1797年初湖北叛军经过陕南时，才有大批教众被鼓动加入了叛乱。在冲突迁延不决的其余时间里，各股叛军在汉水两岸来回穿梭，并多次出入秦岭。然而，尽管一些当地居民对叛军并不特别敌视，叛军在当地招揽新血却收效甚微。在白莲教全部叛军中，只有极少数来自陕西。可以说，汉水高地新移民的绝大多数并没有张开双臂拥抱叛乱。^56\n与大多数移民已找到新生计的陕南不同，在四川，人口过剩早已导致社会秩序恶化。整个18世纪，大批移民为种种真实或虚幻的机会所吸引，涌向四川。^57 到乾隆朝晚期，不仅肥沃的成都平原已住满了人，四川东部与南部的山区也同样如此，山坡丘陵上布满了小块而形状不整的农田。随着移民继续涌入这个普遍富裕的省份，无业游民的数量急剧增加，落草为匪成了许多人的自然选择。啯噜（Guolu）这一匪帮群体可能形成于雍正年间，在乾隆朝晚期大为扩张，其成员靠劫掠与绑架勒索为生，对社会秩序构成严重威胁。与此同时，大批乞丐四处游荡，冲击婚丧之家，强行勒索施舍。18世纪80年代初，福康安被任命为四川总督，受命清剿匪徒。在两年的任期内，福康安对匪徒采取了严厉措施，包括判处大量死刑。^58 然而局势似乎未见好转。除匪徒与乞丐之外，四川的富庶与高度的商业化还助长了另外两种非法活动：私盐贩卖与伪造钱币。乾隆朝晚期，盐价上涨导致盐销量下降，迫使四川许多盐坊关闭。这些盐坊的许多失业雇工转而以贩私盐为生，使省内原有的私盐贩子队伍扩大到数万人。由于从江苏向中原指定销售区运盐通常十分迟缓，四川的私盐贩子趁机填补空缺，把盐运往陕西南部与湖北西部。18世纪80年代，四川盐在邻省尤其是湖北的私销引起了朝廷的注意。尽管中枢政府一再催促四川当局处理这一问题，乾隆朝余下的时间里却进展甚微。与此同时，在四川，伪造贬值的铜钱\"小钱\"（xiaoqian）之风蔓延开来。虽然伪造钱币在许多省份都很猖獗，但在四川、贵州、云南尤为严重，因为这三省较易获得铜——当时全国铸钱所需的大部分铜产自云南。在乾隆朝的最后十年中，对伪造钱币的持续打击使更多人加入不法之徒的行列，因为他们为求生而饥不择食，抓住一切机会。^59\n尽管存在大量边缘人群，四川的教门运动直到1796年底起事前不久才与他们产生交集。在四川东北部（保宁、达州、太平与夔州等府或直隶州），教门网络最初由来自湖北的传教者建立，从而成为以湖北襄阳为中心的教门教区的边缘地带。然而，此后它们自行演化，形成了若干地方特色（例如，达州的教众仪式服装不用白布，而着黑衣）。与湖北、河南一样，四川的教门师父并不主动招募不法之徒。相反，其信众的核心由殷实人家或有产者构成，一些教门首领极为富有。直到准备叛乱时，首领们才向不法之徒敞开大门，把匪徒、乞丐、私盐贩子、伪造钱币者等收罗到麾下。两类人群的合流并非自然而然、早早发生，这一事实印证了：教门运动并非源于贫困。尽管起事在四川爆发后，叛军能够招募边缘人群以扩充队伍，但同一个蓄水池也为镇压者提供了人力——后者组建乡勇、招募民夫为军队效力，迅速抽干了叛乱的兵源。1796年第一波起事之后，胁迫便成为叛军在四川补充新血的主要手段。\n既然生存危机不是叛乱爆发的驱动力，其原因便只能从教门信仰内部寻找。在从蒙古入侵之前直到清代的漫长演变中，白莲教教义融合了佛教、道教、儒教、摩尼教及其他成分，尽管佛教对其教义与仪式的影响始终最为强大。^60 明代中期，教门运动蓬勃发展，很大程度上得益于当时的思想激荡。^61 此后，众多教门都采用\"真空家乡、无生父母\"（zhenkongjiaxiang, wushengfumu）作为主要教义。\"真空家乡\"字面上既指人们所从来之处，又指人们最终所归之处，其实质则暗示死后注定回归天堂。\"无生父母\"成为诸神之中他们的主神，但许多教门后来以\"无生老母\"（wushenglaomu）取代了\"无生父母\"。^62 这一转变与女性在教门运动中地位的提升相应，尽管教门社团从一开始就对女性开放。^63 教门首领为女性尤其是寡妇的情形并不少见。有些教门甚至完全由女性组成。教门教义的另一个新增的重要内容，是对弥勒佛——未来佛——的强调。正如弥勒佛崇拜所昭示的：必须否定现存的政治秩序与权威，为一个全新的时代开辟道路。这给大体和平、不涉对抗的教门运动注入了政治维度，使其具有潜在的颠覆性。^64 久而久之，一些教门把更加清晰的末世论注入弥勒佛崇拜之中，其中包括佛将降世、建立其新朝的说法。毫不奇怪，这常常导致谋反。\n然而，大多数教门都有意无意地试图不顺着弥勒佛崇拜带来的千禧年倾向走得更远。与明朝教门鼓动出众多起事与动荡时期形成对照，清朝在1796年之前此类事件并不多——唯一的大规模起事是1774年王伦在山东临清领导的起义。^65 其中一个重要原因是，清朝国家时刻保持警惕，且卓有成效。有清一代，国家不断更新镇压教门的法律，这些法律绝不宽仁。^66 每当官府获知某一教门的消息，便突袭其据点，逮捕其成员，施以鞭笞、监禁、流放与处决等惩罚。自1788年起，被定罪的教门成员被流放到新疆穆斯林居民居多的地方，因为在穆斯林中间传播其信仰似乎不太可能。^67 国家也清楚民间宗教的无处不在，认识到清除所有教门社团十分困难。更重要的是，它担心严厉的迫害可能适得其反。因此，清朝也不时运用灵活手段与安抚政策。1791年，山东一个教门社团被查获并遭到迫害时，乾隆明确表示：如果涉案者的活动只是吃斋、诵经、向信众收钱，而没有公开传达任何颠覆性讯息，他不希望对每一起教门案件中的牵连者都严加惩处。^68 在某种程度上，国家与教门之间对界线划在哪里有一种心照不宣的理解。然而，处置教门时想强硬到什么程度，最终仍取决于国家，这给国家与教门之间的互动造成了巨大的不确定性。^69\n尽管如此，本研究的重点不在于起事何以在18世纪90年代发生，而在于起事一旦爆发，清朝为何没有（或不能）迅速将其平定。因此，与许多关于中华帝国晚期政治史的研究不同，本书不强调国家与社会的二元对立，而是聚焦于\"国家\"内部的分裂。^70 清军是国家的重要机关，它在白莲教战争中执行了国家消灭叛军的意志——这一简单的事实，并不妨碍我们关注这一特定国家机器与国家整体之间的争斗与冲突。临时的战时当局由负有指挥战役或掌管后勤之责的高级武官与省级大员组成，他们充分利用战争为自身利益服务。为牟取最大的好处，他们作为一个战时利益集团，巧妙地向上层施加压力，迫使中枢政府按照他们的时间表进行战役，并认可他们耗费军费的方式。因此，就这场战争的持续时间与耗费而言，中枢政府与战争管理当局之间的斗争，比清军与叛军之间的战斗更具决定性。与此同时，战争领导层内部沿着道德原则或私人关系展开的冲突，使这个战时利益集团错综复杂、耐人寻味的政治进一步纠缠不清。尽管冲突有时发生在\"贪腐\"官员与\"正直\"官员之间，有时却更加个人化，超越了政治与伦理的取向。嘉庆皇帝反复无常、优柔寡断，尽管也采取了一些严厉的措施，最终却未能管束住他的战争领导人，未能迫使他们把王朝的利益置于一己私利之上。\n鉴于关于这一事件的二手文献十分稀缺，本书主要依据原始资料写成。关于白莲教战争的学术积累之所以有限，原因并不在于资料匮乏。事实上，原始资料的浩繁本身就足以让研究者望而却步。研究镇压白莲教叛军之役的最重要资料之一，是清廷在战役结束后立即编纂的一部鸿篇巨帙——《钦定剿平三省邪匪方略》（Qinding jiaoping sansheng xiefei fanglüe；Imperially Sanctioned Chronicle of the Campaign to Suppress the Heretical Bandits in Three Provinces），其中收录了近两千件奏折与数量略少的上谕，涉及这场战争及清朝的其他镇压行动。其影印本共有六十九卷，总计两万七千余页。尽管许多奏折原件尚存，分藏于台北故宫博物院与北京的中国第一历史档案馆，这部方略还是完整保存了清朝与这一事件直接相关的全部记载。换言之，原件已佚的文献，只能在这部方略中查阅。^71 此外，近年出版的几种其他汇编，如嘉庆皇帝上谕的档案汇编及其起居注，对本书也颇为重要。不消说，出自叛军之手的记载少而又少，且很可能已不存于世。^72 然而，数十份被捕叛军审讯记录存留至今，其中许多藏于北京的中国第一历史档案馆，并于20世纪80年代初在中国出版。^73 本书充分利用了这些被称作\"自述\"（zishu）的供词记录。要重建战争的动态、反驳那些因缺乏对原始资料的深入考察而产生的成见，除了对现存资料进行彻底的爬梳，别无捷径。诚然，官方文书与文件中有大量的夸大、歪曲、捏造与宣传。尽管如此，对它们的梳理仍然带来了许多发现与洞见。\n注释\n[译者按：注释序号与原文对应。文献条目中的书名、刊名、文章名保留原文（首次出现附中译），人名按通用译名处理。]\n\n1796年按中国历法是丙辰年：丙为天干第三位，辰为地支中的龙。\n这是有清一代在世皇帝禅位于继任者的唯一一次。新嘉庆皇帝的年号始于1796年元旦。即位大典见QSLJ avid S. Nivison）对\"和珅一人应对清朝国运之失负责\"的看法表示怀疑。Nivison, \"Ho-shen and His Accusers,\" 217. 冯佐哲在《和珅评传》中呼应了这一看法。\nYoon, \"Prosperity with the Help of 'Villains.'\"\n绿营官兵出征时，其常俸由本省全额发给家属。《钦定户部则例》1865年版，73/41a。旗兵出征时，其俸饷与口粮可按其意愿交给亲属，或存贮待其归来发放。旗兵若因公差赴前线，其俸可径送本人。同上书，79/26a–b。\nQLSYD, 16:316.\nNaquin, Shantung Rebellion, 146.\nTheobald, War Finance, 36–43.\n康熙皇帝（1662—1722年在位）于17世纪90年代率师远征草原与准噶尔蒙古人作战时，指派数名朝官主持后勤事务，并指定一支绿营部队护卫后勤队伍。\nDai, \"Qing State.\"\n1760年，消灭准噶尔汗国、征服东突厥斯坦穆斯林各部落之后，户部制定了军费审核条例。JXZL, 3b–4a.\n在启动这一工程的上谕中，乾隆无情地批评了战争中的种种弊端，尤其是对兵丁的滥赏、对庞大军事劳役队伍的高额报酬，以及滥授后勤系统低级官员荣衔。JXZL, 1a–b.\n这部则例的三个部分为：《户部军需则例》（关于户部的战时开支则例）、《兵部军需则例》与《工部军需则例》。\n但绿营兵可在出征前\"借支\"六至十两，此款在此后数年间从其俸饷中扣还。JXZL, Hubu, j. 1.\nJXZL, 1a–b. [译按：正文\"廓清内地匪类\"系自英文\"clearing bandits in an interior area\"直译；此为上谕原句，文言原文待核，见于《钦定户部兵部工部军需则例》卷首上谕。]\nDai, \"Reaching the Empire's Limits.\"\n绿营在17世纪晚期镇压吴三桂之乱中作出了出人意料的贡献，地位有所提高，而满洲旗兵则显出几分疲态与不力。\n关于军队经商，见Dai, \"Yingyun Shengxi\"，该文也讨论了乾隆把\"养廉银\"扩展到武职官员的问题。\n虽然非旗籍的汉人不可能在旗制内任职，旗人却经常被任命为绿营的高级军官。Ding, \"Youguan Qingdai Baqi,\" 及Fu, \"Baqi guanbing.\"\nChu, \"Introductory Study,\" 148–49; Zhuang, Zhenkongjiaxiang, 161–64. 这些教门包括白莲、罗、黄天、红阳、闻香与八卦诸教，其中又衍生出更多教派。\nNaquin, \"Transmission of White Lotus Sectarianism.\"\n尽管许多学者认为以\"白莲\"作为明清众多教派的总称是有用的，一些学者也批评了这种用法。参见，例如，Overmyer, Folk Buddhist Religion, 73, 109–29; Ma, Zhongguo minjian zongjiao jianshi, 63–65.\n关于教门信仰与教义的最重要著作包括欧大年、韩书瑞、田海（ter Haar）、喻松青、马西沙等人的作品。关于18世纪晚期中原教门网络最重要的著作是Gaustad, \"Religious Sectarianism and the State.\" 只有少数学者写过教门运动的财政方面；参见，例如，Naquin, Millenarian Rebellion, 49–53, 280; Suzuki, Shinchō chūkishi, 113–15. 关于清代教门收支最详细的记述见Zhuang, Zhenkongjiaxiang, 449–90.\n据韩书瑞，入教费从一百文到数百文不等。Millenarian Rebellion, 280. 但乾隆朝晚期湖北房县的教众缴纳入教费高达白银一两。齐仲耀供词，BLJZL, 5:25。\nZhuang, Zhenkongjiaxiang, 449–69.\nQLSYD, 16:405–6; Zhuang, Zhenkongjiaxiang, 473–75. 韩书瑞提到，这些钱还用于起事的准备，但也指出首领们从成员所缴钱财中获得了可观的收入。Millenarian Rebellion, 50–52.\n在中华人民共和国，几乎所有关于白莲教战争的论著都视社会危机为叛乱的主因。最早的例子是董蔡时\"试论川楚白莲教\"一文。在中国之外，铃木中正首先在《清朝中期史》（Shinchō chūkishi, 29–96）中倡导这一观点，其后又在《中国史》（Chūgoku shi, 152–66）中重申。\n吴熊光于1800年指出，陕南棚民遍布，且有入教倾向。XFFL, 150/27a–b.\nDong, \"Shilun Chuan Chu Bailianjiao\"; Feng, Heshen pingzhuan, 233–36.\n陕西兴安府的情形便是如此。为维持汉水以南的秩序，清朝设立了一支新的绿营——兴汉镇。XFFL, 28/42b–43a.\nHe, Huangchao jingshi, 85/27.\n白莲教战争期间，这些厂坊一直维持运转，只有1802年有几个月例外——当时陕西省级当局下令暂时停工。\n\"棚民危险、易受教门鼓动\"的看法，最初形成于白莲教战争期间，其后在战后时期延续下来。自1800年起任陕南知府的严如熤是倡导这一看法最力者。然而，严如熤并没有充分的第一手证据证明棚民是叛乱的骨干。关于严如熤及其在战后时代地方重建中的努力，见McMahon, Rethinking the Decline, 第三部分：\"Management of Southern Shaanxi Highlands.\"\nDai, Sichuan Frontier, 190–98.\nNGDK, 119616, 147575. 福康安是乾隆第一位皇后的侄儿，乾隆朝晚期的主要将领之一。Hummel, Eminent Chinese, 253–55.\n18世纪80年代与90年代，关于此问题的上谕为数众多。QLSYD, vols. 16–18. 在乾隆朝最后几年，教门活动与减重小钱被视为四川的两大问题。QLSYD, 18:132–33, 166–67, 176–77, 198–99.\nOvermyer, Folk Buddhist Religion, 45, 48, 73–108, 130–45; Suzuki, Chūgoku shi, 56–60.\n思想方面的发展包括王阳明儒学在社会上的普及，以及佛学理论的新发展。Yu, Ming Qing Bailianjiao, 108–9.\nChu, \"Introductory Study,\" 69–70; Yu, Ming Qing Bailianjiao, 34–35.\n允许男女自由混杂，甚至允许性关系，引起了国家与正统佛教徒的敌意。然而，这对男性参加者却具有巨大的吸引力。Yu, Ming Qing Bailianjiao, 3.\nOvermyer, Folk Buddhist Religion, 48; Yu, Ming Qing Bailianjiao, 91, 108; Chu, \"Introductory Study,\" 35–36, 55–56, 81–82.\nNaquin, Shantung Rebellion.\n从17世纪40年代到19世纪30年代，清廷至少修订扩充了二十七次惩治邪教的法律。Zhuang, Zhenkongjiaxiang, 27–59, 65–191.\nQLSYD, 16:370–71. 但这一措施并未阻止教门中人在流放地传播其教义。\n该教名为龙天门，创立于山东新城。乾隆指示官员：对已捕获的教众以枷号示众或鞭笞惩处，将其主谋发遣流放，但不必大范围搜捕。QLSYD, 16:341.\n例如，在上述案件中，乾隆谕令官员从轻处置教众仅仅十八天后，当他得知被流放新疆的案犯寥寥无几时便勃然大怒，下令将刑罚升级为待秋后绞决。QLSYD, 16:377.\n波拉切克（Polachek）在《内部的鸦片战争》（The Inner Opium War）中叙述了类似的动态。不过，他的案例与本案之间存在着显著差异。\n由于台北故宫博物院与中央研究院近代史研究所的努力，数以万计的嘉庆朝档案已经数字化，可在互联网上查阅。\n据清朝记载，一名识字的叛军曾充任某叛军首领的军师，写下了所有教门师父的姓名以及所历战斗的日期与地点。XFFL, 261/1a–b.\n这些供词收录于五卷本汇编《清代中期五省白莲教起义资料》（BLJZL）之中。\n\n试译译名对照\n\n\n\n原文\n译名\n说明\n\n\n\n\nWhite Lotus War\n白莲教战争\n书名译名\n\n\nsect / sectarianism / sectarian\n教门 / 教门信仰 / 教门中人\n以\"教门\"译sect，对应清代官方用语\"邪教\"语境\n\n\njianbi qingye\n坚壁清野\n\n\n\nxiangyong\n乡勇\n受雇者，功能近雇佣兵\n\n\nGreen Standard Army\n绿营\n\n\n\nEight Banners\n八旗\n满洲、蒙古、汉军八旗\n\n\nWar-time Expenditures Statute\n《军需则例》\n全称《钦定户部兵部工部军需则例》\n\n\nHešen\n和珅\n满语名\n\n\nYongyan\n颙琰\n嘉庆帝名讳\n\n\nShengwuji\n《圣武记》\n魏源\n\n\nShinchō zenshi\n《清朝全史》\n稻叶岩吉\n\n\nQingdai tongshi\n《清代通史》\n萧一山\n\n\nQinding jiaoping sansheng xiefei fanglüe\n《钦定剿平三省邪匪方略》\n官方方略\n\n\npengmin\n棚民\n\n\n\nGuolu\n啯噜\n四川匪帮\n\n\nwushenglaomu\n无生老母\n\n\n\nzhenkongjiaxiang\n真空家乡\n\n\n\ngenjiqian\n根基钱\n入教费\n\n\nshengdanyin / dadanyin\n升单银 / 达单银\n汉字写法暂定，待核原书\n\n\nyinzhao\n阴照\n阴间通行证\n\n\nlianqian / guhuo pianqian\n敛钱 / 蛊惑骗钱\n\n\n\nxiaoqian\n小钱\n贬值铜钱\n\n\nchikonge\n吃空额\n\n\n\nshanghao\n赏号\n\n\n\nxingzhuangyin\n行装银\n\n\n\nyanglianyin\n养廉银\n\n\n\nwuzhi mingliang\n武职名粮\n\n\n\nHan River highlands\n汉水高地\n附原文\n\n\n\n[译者按：乾隆语原文已据\"汉籍电子文献资料库\"（中央研究院）《清仁宗睿皇帝实录》核实，见注释19；\"升单银/达单银\"汉字写法暂按学界通行用法，待核。]\n[体例说明：凡正文引用中文文献处，均给出直译，并于相应注释附文言原文与出处。标\"待核\"者系据通行引用复原、尚须核对原书；标\"待补\"者暂缺原文。后续各章照此办理。]", "sections": [{"level": 2, "title": "注释", "id": "ch0-s0"}, {"level": 2, "title": "试译译名对照", "id": "ch0-s1"}]}, {"id": "c1", "title": "第1章 · 叛乱，1796—1797年", "kicker": null, "part": "第一卷 · 叙事", "html": "<blockquote>\n<p>自从你离开\"灵山\"，流落迷失在外，\n落在这\"苦海\"尘世，受尽煎熬；\n无生老母传下信来：\n\"诚邀你重返真家。\"</p>\n<p>——刘之协</p>\n<p>[译者按：原歌谣出自刘之协供词，此处自英文直译；文言原文待核，通行引录作\"自从离了灵山，失散迷家；落在苦海，受尽煎熬。无生老母差人传书，请你回真家。\"（教簿档，05/08/07）]</p>\n</blockquote>\n<p>大多数教门的教义并不包含末世论——末世论通常包括一个以暴力毁灭现存世界秩序的阶段——但那些包含末世论的教门，往往对有望入教者特别有吸引力。鉴于教门之间的竞争日益激烈，一些教门师父按捺不住，把直白的末世预言掺入教义之中，尽管他们清楚地知道，这样做的后果可能是杀头之罪。不过，由于官僚网络单薄，基层的监视可能漏洞百出，这就给教门社群留出了时间与空间上的回旋余地，使它们得以在活动被官府察觉之前滋生、扩张、分裂并相互竞争。白莲教战争爆发前二十余年，一个新教门——混元教——的创立，启动了那条漫长而曲折的轨迹，最终导向1796年在\"三重龙时\"举事的决定。</p>\n<p>然而，起事者未能等到预定的日子。吉日之前两个月、嘉庆皇帝即位后仅仅数日，湖北西部便爆发了一波起事，紫禁城为之惊震不安。对清朝而言，在腹心之地同时镇压多股起事，将考验其权威，更具体地说，考验其军事体系的力量与效能。事实表明，湖北的大部分起事都短命而终。半年之内，清军便平定了其中大多数，并把来自襄阳地区的最大一支叛军赶出了省境。到1797年初，湖北大体归于平静。湖北首次起事八个月后，四川东北部又爆发了数起起事，陕西东南部随后也发生了几起。与湖北的同类起事一样，四川与陕西的这些起事似乎并未对清朝构成真正的挑战。陕西的起事迅速全被平定；到1797年夏天，四川的叛军也濒于覆灭。</p>\n<p>尽管如此，冲突还是远远超出了1797年，并演变成清朝入关以来耗费最大的战争。诚然，叛军异常坚韧，湖北、陕西、四川境内广泛的教门网络也是叛乱在这一阶段的重要兵源与供养地。但叛乱之所以迁延不绝，更关键的原因在于清军进行镇压战役的方式。少数清军将领固然颇有成效，大多数却表现出不愿将叛乱迅速了结的倾向。战役的首任统帅永保表现不济，令乾隆皇帝震怒，于1796年底将其革职——这预示着这场战争将祸患重重，了结无期。</p>\n<h2>通向叛乱之路</h2>\n<p>1774年，河南鹿邑人樊明德皈依了一种染有末世预言的教门教义。樊明德本是农民，也懂些医术。1774年初他自己染病，一位朋友推荐了教门中人杨吉为他治病。杨吉据说治好了樊明德的病，随后便劝樊明德随他一起奉教，以求死后转世投生得好。樊明德接受了杨吉的传教，开始焚香，念诵杨吉传给他的经卷。杨吉不久后去世，樊明德便自立一教，以他从杨吉处得到的两部经卷之一的题名，命名其教为\"混元\"教，即\"混沌之初\"——这部经卷就是《混元点化经》。樊明德定下一年中的几天，让信徒到他家聚会，念诵经文以及他自己编的咒语。与许多其他教门一样，樊明德允许弟子自行收纳徒众。一年之后，这个新生的教门已越过省界，扩展到安徽的亳州。^1（地图1.1）</p>\n<p>然而，1775年春，这个教门进入了地方官府的视野，随之而来的是查禁。上一年王伦起事的余悸未消，乾隆皇帝对樊明德经卷中的末世讯息尤为警觉。经卷中除提及\"末劫年\"（mojienian）外，还有\"换乾坤\"（huan qiankun）、\"换世界\"（huan shijie）、\"反乱年\"（fanluannian）之类的语句。乾隆下令缉拿这一危险教门的全部成员，樊明德与近百人在鹿邑、亳州被捕。不久，樊明德被处以\"千刀万剐\"之刑——凌迟，^2 另有十余人也被处死，其中包括樊明德的几名亲属。杨吉的坟墓奉旨被掘开，尸骨被毁。^3 樊明德的弟子刘松，以及该教另一重要成员王怀玉之子王法僧，都是鹿邑人，被流放到甘肃隆德。王怀玉却逃脱了搜捕。^4</p>\n<p>1777年，亳州的几名混元教成员以丁洪度为谋主，复兴了该教，他们相信官府已不再注意这个教门。在此期间，教门扩展到了山东。1782年，他们的活动再次被地方政府察觉。一场新的查禁随之展开，丁洪度及数十名成员被捕，或被处死，或被流放。^5 查禁之后，混元教在河南鹿邑、安徽亳州与山东西南角交界的边区大体转入沉寂，不过一些信徒仍坚持信仰，暗中活动。丁洪度曾借其名敛钱的王怀玉，再次躲过了迫害，继续藏匿。</p>\n<p>在混元教诞生地及其原有范围之外，维系该教存续的是刘之协。刘之协约生于1740年，是安徽太和人，家乡在鹿邑以南五十余里，以贩棉为业。他是混元教成员，由刘松引入教门（二人同姓，并无亲属关系）；他先后躲过了1775年与1782年的两次查禁，因为1775年刘松未向官府供出之协，而丁洪度主持的复教活动之协也未参与。刘松被捕后，之协继续向信徒念诵经文，并收取服务之费，不过他在教名前加了一个前缀，改称\"清净混元教\"，即\"清静混沌之初教\"。因经商所需而四处奔走，之协多次前往樊城——这是与襄阳隔江相望的市镇，而襄阳是湖北西北部的主要商业枢纽。除襄阳一带外，他还在河南南部传教，在豫鄂交界一带发展信徒，建立了若干据点。^6</p>\n<p>急于进一步扩充信徒，刘之协迈出了冒险的一步。1788年春，他长途跋涉来到隆德，探望已在那里服刑十三年、靠开杂货铺为生的刘松。^7 两位刘姓之人会面时，决定将教名由\"混元\"改为\"三阳\"——\"三个太阳\"——以激起有望入教者的兴趣。此外，他们还改换了一部经卷的题名，并确定在传教中使用更隐晦的咒语与歌谣。^8 最重要的是，之协策划把该教的千禧年纲领加以强化。混元教的经卷虽一再提及世界的\"末日\"与剧烈而暴烈的变革，其讯息却一直含混不明，以至于樊明德受审时坚称，这些词句指的是自然灾害。为使新教更具末日色彩、因而更有吸引力，之协提议，把1783年赴隆德随父服刑的刘松之子刘四儿，指定为弥勒佛的化身。刘四儿在尘世的使命，是辅佐\"牛八\"——据称是明朝皇室的后裔（\"牛\"与\"八\"两字相合，正是明朝皇姓\"朱\"字）。弥勒佛既已降世，那将终结世界的大灾变即将来临、必须立即行动以求生存，便成了不容置疑之事。在两位刘姓之人为新教义打造的整套说辞里，得救的唯一途径就是加入他们的教门。之协传教所用歌谣有一首如下：</p>\n<blockquote>\n<p>自从你离开\"灵山\"，流落迷失在外，\n落在这\"苦海\"尘世，受尽煎熬；\n无生老母传下信来：\n\"诚邀你重返真家。\"^9</p>\n</blockquote>\n<p>\"重返真家\"是一个有力的譬喻，暗示着投生天堂的新生。当它被用力宣讲时，便能把信徒引向那注定的大灾变到来时不可避免的流血厮杀。因此，新教三阳教代表着与旧版混元教的决裂，开启了一个极具颠覆性的纲领。然而，1788年时，两位刘姓之人谁也没有料想到它的滚雪球效应。极有可能，他们当时谁也不曾打算举事叛乱。换言之，新教的政治维度主要源于其末世论，而非对清朝的仇视。与先前的汉人民族主义者或19世纪中期的反满叛乱者不同，刘之协及其同侪没有表现出对清朝的丝毫愤慨。他们也不关心自己时代的政治与社会问题——诸如和珅的专擅、官场的腐败、流民日众——这些问题萦绕在同时代许多忧心国事的官宦士人心中。因此，援引明朝乃是教门千禧年教义所必需，而不是教门创立者政治抱负的产物。</p>\n<p>从此后数年间教门社群所发生的一切来看，之协改造教门的举动，与其说是政治决定，不如说更像商业决定。换言之，他所挂怀的，多半是扩充教门成员——这反过来会为教门和他自己带来更多收入。^10 有趣的是，王法僧1776年被流放隆德后，就住在刘松近旁，却没有获邀参加两位刘姓之人的会面。王法僧的父亲王怀玉躲过了官府的缉捕，是混元教中德高望重的领袖，一直住在樊城，直到1794年中寿终正寝。之协虽然显然知道怀玉的下落，却没有让他卷入此事。相反，之协尊刘松为新教门的最高教主，称其为\"老教主\"（laojiaozhu）。^11 刘松在教众中威望并不甚高，又远离鄂豫交界地带的教门社群，注定只能充当一个挂名的头面人物。他不在场时，之协便可代为行事，拥有全部实权，却不必顶着教主之名——万一官府来查禁，这或许对他有利。王怀玉后来得知这个新教门时，选择了不加入。^12</p>\n<p>返回襄阳一带后，刘之协起初把改头换面的教门经营得有声有色，招募新成员，收取\"入教钱\"。1788年晚些时候，襄阳人、之协新收的弟子之一宋之清前往隆德，向刘松敬献了五十两白银。此后数年（1789—1793），刘松先后六次接待这样的来访。每次收下银钱之后，他都焚化一张黄纸，念诵几段经文，为出资者祈祷。1794年底刘松被捕时，人们在他的卧室里搜出了二千两白银。^13 刘松所收到的，只占教门总收入的一小部分；其余的钱都留在刘之协及其他有权收纳新成员的首领手中。1800年，教门的管事之一（可能是之协雇用的）张小元被捕，他供认，此前数年间仅四川一地的年收入就超过一万两。^14</p>\n<p>钱的流动对宋之清想必是莫大的诱惑。或许是动了自创一教的念头，宋之清不再与刘松或刘之协分享收入。^15 事实上，加入三阳教之前，宋之清于1782年由堂兄宋文高引入襄阳一带活动的另一个教门——收元教。收元教的经卷是《太阳经》，其千禧年色彩不如混元教经卷那样鲜明。^16 1792年，宋之清与另一位襄阳人樊学鸣联手，创立了新教——西天大乘教。新教虽以《太阳经》为主要经卷，却也借用了刘之协注入三阳教义的内容——弥勒佛降世与大灾变将至——并且采用与刘之协三阳教相同的劝化手法，声称躲过大灾变的唯一途径是入教。如今成了自己教门的创立者与领袖，宋之清与刘之协断绝了关系，不再视后者为师为尊。^17 凭借收元教的基层网络与新的末世教义，宋之清很快压过了刘之协：争夺新成员，挖走刘的信徒，还把势力扩展到陕西南部。^18 之协不是襄阳本地人，宋之清的竞争想必使他损失了大批主顾与收入。</p>\n<p>1792年春，刘之协前往甘肃，再次探望刘松。会面的细节不得而知，但刘松允许之协把其子刘四儿——所谓的弥勒佛化身——带到襄阳，试图向宋之清证明，\"弥勒佛转世\"这一教义的归属权在三阳教。然而，宋之清拒绝承认刘四儿是弥勒佛化身，讥讽四儿不像佛。宋之清宣称，弥勒佛已转世为河南南阳的李三瞎子，而牛八则是李三瞎子的儿子毛金刀（\"毛金刀\"三字隐含\"刘\"字，因为卯、金、刀都是\"劉\"字的部件）。宋之清还声称，李三瞎子此时虽双目失明，到了适当的时刻自会复明。宋之清拒不接受刘之协所选的弥勒佛，刘四儿也抱怨在襄阳期间没能见到牛八。于是，之协把刘四儿送回隆德后，回到安徽，请他的一个弟子刘胜洲允许他给其十一岁的侄儿改名\"王双喜\"——意为\"双喜临门\"——随后把男孩和他的叔父一起带往隆德。^19</p>\n<p>1793年初到达隆德后，刘之协把\"王双喜\"作为牛八引见给刘松与刘四儿，但后二人对之协所选牛八作何反应，不得而知。在隆德逗留了约一个月后，来客们在过了旧历新年后动身返乡。就刘松所知，之协想把这位牛八展示给宋之清，试图从宋之清那里夺回一些旧日的信徒。然而，到达湖北后，刘之协付给男孩与其叔父十两银子和五十文钱，打发他们回家，自己却留在了湖北。为反驳刘之协关于弥勒佛与牛八的说法，宋之清修正了自己的说法。如今他宣称，弥勒佛转世在河南\"无影山\"（Wujingshan）一户张姓人家，而牛八实为名叫朱红桃的人，也在河南。^20 直接使用明朝皇室的姓氏，宋之清无意中跨过了红线，把他的教门引入了险境。与此同时，宋之清此举加深了他与刘之协的嫌隙。1793年春至1794年秋，关于二人裂痕的记载很少，但一些教门中人认为，正是这场分裂使他们的活动暴露于官府，招致了一场波及甚广、处置严厉的查禁。^21</p>\n<p>查禁从四川东北部开始。1794年秋，四川即将离任的总督福康安捣毁了与湖北竹溪交界的大宁县一个收元教据点，逮捕了二十余名教众，其中包括他们的首领、大宁本地人谢添绣。谢添绣由竹溪教门中人陈金玉引入教门，此后在家乡收纳新成员。到1794年底，弥勒佛与牛八的故事已在当地教众中广为传布。乾隆一眼就破解了\"牛八\"意指明朝朱家，对这条颠覆性的预言大为警觉。更令他吃惊的消息是：陈金玉在湖北他处被捕后，在押解回竹溪途中，一群教众伏击了地方官府的解差队伍，陈金玉被同教救走，混战中还打死了一名衙役。乾隆对教门运动素有经验，由此意识到，这或许不是一桩寻常的教门案件，背后可能潜伏着一个危险的图谋。乾隆五十九年八月二十日，乾隆颁下一道措辞严厉的上谕，命有关各省督抚将涉案人员一体缉拿。^22</p>\n<p>1794年剩下的时间里，河南、湖北、陕西、四川、安徽、甘肃都展开了搜捕。皇帝对这些省份不断施压，使查禁愈演愈烈，范围愈扩愈大。^23 一两个月内，各省数百人被捕受罚，包括教众与他们的师父，宋之清与樊学鸣也在其中。^24 经审讯，宋之清与另外几名首领——包括襄阳的衙役齐林——被处死。有意思的是，宋之清没有向官府供出刘松与刘之协，而是坚持自己的收元教身份，声称自己是引他入收元教的宋文高的弟子。^25 与此同时，乾隆令陕甘总督勒保在隆德逮捕并处决了年近八十的刘松及其子刘四儿。^26 查禁进行一个月后，乾隆从他最初的强硬立场上退了回来：在得知被捕者的审讯所供不过\"骗钱惑众\"（pianqian huozhong）而已之后，他承认此案并不像他起初所想的那样严重、那样波及广泛。但各省的地方政府仍在继续搜捕。^27</p>\n<p>不可思议的是，刘之协又一次逃脱了。刘松被捕后，向官府供认了他与刘之协、宋之清的关系，以及二人在各自教门中的角色。乾隆五十九年十月初八日，乾隆命安徽当局缉拿刘之协。^28 然而，之协并不在家。查禁之前不久，之协本打算把王怀玉从樊城接到太和，却不知王怀玉已经去世。他派亲戚、同教中人刘起荣给河南的另一名教门中人送去二百两银子，作为王怀玉的路费。^29 然而，起荣到达河南扶沟时发生了一桩窃案，被窃走的恰是二百两。因为起荣身上带着同额的银子，他成了嫌疑人。在扶沟知县面前为自己辩解时，起荣说，这钱是刘之协交给他到河南买棉花用的。于是，扶沟知县请太和的同僚护送之协到扶沟作证。之协动身前往扶沟——他借口要先处理一些私事，把行程拖后了几天——刚一出发，他的兄弟就被捕了，家里也遭到搜查，但没有搜出任何能证明他参与教门活动的东西（很可能之协正是利用这拖延的几天做了安排）。不过，之协的侄儿逃了出来，赶到扶沟向之协示警。之协到扶沟已一周，一直未受严密监视，便于乾隆五十九年十月十五日立刻逃走了。^30</p>\n<p>尽管搜捕十分严密，刘之协还是先回到了太和。他没有回到元乡集的家，而是住在另一个镇上的教门中人家中。1795年初，他动身前往襄阳，此后官府便失去了他的踪迹。^31 1794年剩下的日子以及1795年初，乾隆一直催促中原各省的督抚缉捕他。^32 乾隆推断，刘之协必定藏在河南、湖北、陕西乃至甘肃的同教家中；而之协确实辗转于河南南部与襄阳一带之间，藏在教众家中（在河南，他曾在泌阳县住过一段时间）。尽管刘之协与宋之清有裂痕，宋的弟子们仍敬重刘之协，称他为\"老师父\"（laoshifu）。事实上，宋之清与其他几名收元教首领被处决后，之协在他们中间的地位反而提高了。尤其重要的是，刘之协与姚之富过从甚密。姚之富是竹山人，襄阳一带颇有影响的收元教师父。1794年查禁之后，姚之富走到了前台，接掌了幸存教众的领导权。1795年初逗留湖北期间，之协曾在襄阳城郊姚之富家中藏身了一段时间。他白天躲在夹墙里，夜里才出来与姚之富交谈。^33 极有可能，正是在这些黑暗中的谈话里，作出了在龙年龙月龙日龙时（1796年农历三月初十）举事叛乱的决定。这一决定也很可能是在1795年早春——之协到达湖北后不久——作出的。</p>\n<p>这一决定并不令人意外，也不是什么断裂。正如关于中华帝国晚期教门运动的研究所阐明的：来自国家的压力骤然升高，往往成为扭转局势的关键，促使走投无路的教门中人在诸多选项中选择叛乱。^34 就本案而言，1794年的查禁及其后的持续搜捕，确实是叛乱的催化剂。刘之协1788年对混元教的改头换面虽已预示着暴力阶段的到来，但真正印证\"末世大灾变\"即将来临——正如千禧年末世论所预言的那样——的，是宋之清、刘松、齐林等人被处决，以及数百教众被捕。要想活下去、在新世界中获得重生，就必须抓住时机，起而反抗官府。无独有偶，1795年初，贵州东北部与湖南西北部的苗民把他们对汉人涌入其家乡的持续抗议，发展为公开起义。清朝不得不从其他数省（包括湖北、四川）调兵镇压。到是年秋天，清军首战未能平定叛乱，起义演变成一场大战。乾隆任命福康安为统帅，主持这场战役，并从中枢政府拨出经费，支援日益强化的军事行动。^35 对正在中原策划起事的教门中人来说，苗民起义来得正是时候——西南的战事进一步印证了他们的预言：末日时刻迫在眉睫。从实际层面看，清军开赴苗疆作战，使各原驻省份防卫空虚，这也进一步鼓舞了密谋者。</p>\n<p>举事的决定作出之后，刘之协离开襄阳前往河南，藏匿起来，与姚之富不再联系。1800年被捕后，之协在受审时供认：在龙年龙月龙日龙时起事的主意是他想出来的，因为他认为这些巧合在动员信徒时会有吸引力。^36 之协在这件事上不大可能说谎，因为以他的处境，理性的选择本该是尽量撇清自己与叛乱的关系。然而，之协本人是否曾准备亲自参与行动，则是另一回事。之协自己从来不是真正的信徒，他一直是把教门活动当作一桩生计——一桩有利可图、却也充满危险的营生。1795年初，他面临的却想必是入行以来最危险的处境。中原其他教门头目大多已落网，被安徽当局缺席判处\"凌迟\"的刘之协成了官府搜捕的焦点。在北京的压力下，各省地方衙门屡屡错捕无辜，刑讯逼供。^37</p>\n<p>他选择留在查禁的风暴中心，表面上显得镇定，内心想必时时惴惴不安。在他看来，一场起事或许能帮他摆脱困境，因为官府的注意力会被吸引到对付叛乱者上去。再者，姚之富及其他急于举事的首领大多是宋之清的追随者；一旦叛乱爆发，他们的网络与据点暴露于官府，之协并不在乎——毕竟宋之清阵营是之协长期以来的竞争对手。把他们从舞台上清除掉，就意味着之协的教门有了开阔的市场。这些推测听来冷酷而阴险，但有两件事为这一判断提供了支撑：刘之协在最后关头突然退出了叛乱；河南南部三阳教与混元教的大多数信徒在龙时到来时并未举事——很可能是因为之协没有召唤他们行动。如前所述，叛乱的头几年里，之协的教门在经济上一直经营得不错：仅四川一地，就从信徒那里收取了一万多两。</p>\n<p>归根结底，刘之协帮助策划叛乱的真实动机变得不那么重要了。与之协对其教门信仰那种貌似不诚、机会主义的态度相反，大量其他教门中人——无论师父还是普通教众——都更忠于信仰，准备在命定的时刻到来时赴汤蹈火。对一些人来说，复仇可能也是一个因素。王聪儿（人称齐王氏，即本姓王的齐家之妇）本是流浪杂技艺人，是齐林十八岁的遗孀；丈夫被处决后，她削发为尼，避入佛寺。叛乱一旦酝酿起来，王聪儿立刻挺身而出，不过直到叛乱爆发一年后，她才成为关键首领。^38 其他一些教门中人的经历与此相似。^39</p>\n<p>自1795年春起，姚之富及其在襄阳的同谋者派出信使，携带书信前往湖北西部、河南南部、陕西南部与四川东北部的其他教门据点，煽动各处在龙日同时举事。对许多教门信徒来说，这个简单而不容置疑的预言——举事的时刻即将到来——是无法抗拒的。在有些地方，地方官府对教门中人持续不断的骚扰与勒索，无意中帮了密谋者的忙，把许多人——教众与非教众——都推向响应武装召唤的一边。^40</p>\n<h2>湖北的起事</h2>\n<p>\"龙日\"计划一经启动，它的任何一位策划者都无法再驾驭其后果。于是，叛乱并不是以一个首领或一个核心领导层所领导的单一举事开始的，而是展开为一簇起事，每一场有数千人参与，多的达一两万人。^41 在湖北，起事主要爆发于两个区域。在湖北西北部，起事从武当山脉东端一直蔓延到湖北的西北端。在湖北西南部，荆州、宜昌、施南三府是数场起事的发源地，其中包括发生在荆州府宜都、枝江两县的第一场起事。清朝对这些起事的反应起初只限于本地，但很快便转变为一场协调一致、全国性的努力，从其他省份调来军队。（地图1.2）</p>\n<h3>宜都—枝江起事</h3>\n<p>宜都与枝江都位于长江西岸，同属荆州府，与宜昌府往来密切——宜昌府境内居住着许多毕兹卡人。清朝官府称他们为\"土苗\"，今天的中华人民共和国则正式称其为\"土家族\"。毕兹卡人世代居住于长江上游河谷，即湖北西部、四川东南部（今重庆市）与湖南西北部。雍正年间改土归流之后，许多汉人迁入。18世纪晚期，许多毕兹卡人皈依了教门教义，成为热忱的信徒。</p>\n<p>宜都起事的策划者们偏离了混元教与收元教的通行预言——那种预言以据称的明室后裔牛八为主角。他们另造了一个新的预言人物\"李犬儿\"（Li Quaner），据说他是不知何时的天将转世。据说，当命定的龙日到来时，李犬儿将从他的家乡山西出发，前往河南，在那里建立新朝，刘之协将充当他的军师。这个故事极有可能是两位教门师父张正谟与刘盛才编造的，尽管张正谟后来声称，这个预言是他从自己的师父白培相那里得来的。^42</p>\n<p>1795年中，三十五六岁的张正谟从家乡长阳迁到宜都。与宜都本地人刘盛才一道，张正谟开始利用李犬儿的预言，在教门成员内外网罗可能的起事者。为使说辞更具说服力，他们声称张正谟曾亲眼见过这位李犬儿，还从他那里领受了一柄佩剑，常常带在身边。据他们所讲，只有向李犬儿捐了钱、并随他起事的人，才能躲过龙日降临的大灾变。那一刻到来时，湖北西北部的\"武仙\"（wuxian）将下凡来与湖北西南部的\"文仙\"（wenxian）会合，从而开启一场大规模的杀戮。为度过这场大灾变，他们传给信徒一道咒语，令其记诵：</p>\n<blockquote>\n<p>黑风骤起，吹一日一夜，\n吹死多人；\n白骨堆成山，\n血涌而成海。^43</p>\n<p>[译者按：原咒语出自教门供词，此处自英文直译；文言原文待核，通行引录作\"黑风骤起，一日一夜吹死多人，白骨堆山，血水成海。\"]</p>\n</blockquote>\n<p>据说，这道咒语原本藏于李犬儿所住村庄的一块巨石之中，某日巨石忽然开裂，咒语方才显露。刘盛才告诉教众，李犬儿的手掌上可见\"日\"\"月\"二字。^44 日、月相合正是\"明\"字——既可以指明朝，也可以指\"光明\"，暗示着某些教门教义所预言的那个最终太平极乐的世界。然而，策划者们并没有进一步透露改朝换代的计划。</p>\n<p>在宜都，张正谟与刘盛才同另一位教门中人张宗文密切合作。张宗文的儿子娶了聂池的女儿；聂池曾随张宗文习教，他的父亲聂杰人是一位殷实的地主。策划者们与聂池一道，向年近七旬的聂杰人描述了一番万物毁灭的预言景象，又许以新朝高官之位，说服他加入他们的事业。聂杰人捐出了一百两银子，还献出自己深藏山中的大宅作为他们的据点。起事发动时，聂杰人被推为旗手，策划者们则隐于幕后——他们希望这位年长而富有的聂杰人能在乡民中赢得更多的敬重与影响力。^45 从1795年底起，策划者们让铁匠在山洞里锻造兵器，并派出信使——包括刘盛才本人——前往湖北西部其他地方煽动起事，尽管这些信使从此再无回音。与此同时，枝江的教众利用当地教门首领刘盛明的宅子准备起事。^46</p>\n<p>1796年元旦乾隆禅位于嘉庆后约一周，张正谟带着数百名手持白旗、黄符与武器的教众来到聂杰人家中，告诉聂杰人：地方官府已加紧查禁教门，他们必须立即行动。正月初十日，宜都、枝江两县的官员——他们已获悉两县的教门活动——前往聂家与刘家捉拿可能的叛乱者。在聂家，一千余名教众与官员及其兵丁发生冲突，点燃了第一场起事。几天之后，两县的起事者向江家垱山区进发，那里距枝江、宜都县城约二百里。以约两千教众为核心，叛众很快通过劝说或胁迫扩展到一万多人。尽管他们的分遣队曾攻打宜都、枝江县城——两城各仅剩数十名清军——他们却没有表现出夺取县城的强烈意图，而是集中精力掳掠给养，据守江家垱。^47</p>\n<p>接到起事的奏报后，署理湖北巡抚惠龄——一位驻守荆州、为苗疆战役协调后勤的蒙古旗人——火速赶赴现场。然而，他只凑起了一百名士兵，因为该地区的大部分军队已调往苗疆战役。^48 惠龄关于起事的奏折于正月二十五日抵达北京——距第一次冲突已两周——却没有引起紫禁城的严重关切：朝廷正全神贯注于苗疆战役，把它当作一桩地方痞棍的小骚动，一掠而过。得不到北京任何支援，湖北官员只能调度本省有限的兵力。直到起事爆发一个月后，一千四百名清军——包括三百名荆州驻防旗兵——才赶到现场。^49 与此同时，湖北当局号召当地居民武装起来协助正规军作战，由此开启了一个前所未有的现象：此后数年间，战区数十万平民被编为乡勇，与正规军并肩作战。</p>\n<p>随着清军压力的增大，江家垱不宜长期据守，起事者——此时可能已达两万人，包括起事者的家属与许多被裹挟的当地居民——于二月中旬转移到枝江境内更为险峻的灌湾脑。叛军如何在被围之中完成这次转移，未见详报于朝廷。显然，从四面八方赶到那里的湖北军队未能察觉并截击敌方的行动。然而，看不到其他起事者来援的希望，一些起事者变得幻灭。转移到灌湾脑后数日，名义上的首领聂杰人——他的三个儿子中有一个刚刚阵亡——与另外数人向清军投诚。^50</p>\n<p>普通的起事者似乎更为坚定。在灌湾脑，他们以石墙与地雷封锁山顶，制造枪、炮与弓弩（甚至给箭头涂了毒）。数千人挤在堡寨之中，每天为食物、饮水与其他给养而挣扎，卫生也是难题。初夏时节，一场疫病爆发，夺去了数千人的性命。^51 尽管如此，他们在灌湾脑坚守了五个多月。主持围困的惠龄被证明是无能的。他虽然在西宁、伊犁等几个重要边地任过职，还曾以四川总督的身份参与第二次廓尔喀之役的后勤事务，但四十年的仕途中从未有过统兵作战的经验。^52 正如乾隆所评论的，他\"虽曾历戎行，恐未娴军旅\"。（原文待核，见注释53）^53</p>\n<p>在灌湾脑的对峙中，惠龄常常无所事事，进攻时断时续，却更热衷于上报自己与部下遇到的种种困难，诸如兵力不足、天气恶劣、地形险阻之类。围困想必处处漏洞，因为叛军似乎并未遭受粮荒——尽管他们转移时只带了一个月的口粮^54——他们必定找到了办法，为数千人从外面筹措给养。夏末，惠龄发动了一场大规模攻势，炮轰叛军堡寨。清军炮火摧毁外层工事之后，惠龄却没有乘势进攻退入内堡的叛军。^55 当阳于七月中旬被清军收复后，乾隆对惠龄施加了更大压力。七月二十四日，清军诱使叛军出堡攻营，然后设伏俘获了部分出击者，其中包括张宗文。^56 尽管受此挫折，剩下的起事者仍设法坚持了数周。直到八月中旬，在被乾隆一再训斥之后，惠龄才发起一场持续数日的决战。八月十七日，清军使用火弹与喷火器点燃了叛军最后的堡寨。据报道，近一万名叛军及其亲属或在战斗中阵亡，或葬身火海，或逃生时溺毙于壕沟。近三千人被俘，其中包括张正谟与另外几名首领，以及聂杰人的另外两个儿子。惠龄屠杀了近二千五百名俘虏，其中包括妇女（据说她们曾与清军作战），把其余约二百人——大多是妇孺——赏给旗人为奴。^57</p>\n<p>湖北的第一场起事就这样在爆发七个月后走向了终结。此时，其后爆发的大多数其他起事也已被扑灭。惠龄虽然因这场迟到的胜利而获得荣衔，他平庸的表现却没有逃过新君嘉庆的眼睛——嘉庆一直在父亲的影子里密切关注着这场战役。后来，嘉庆这样评论惠龄：\"各路带兵打仗之人，皆可谓之懈怠，而惠龄为尤甚。\"（原文待核，见注释58）^58</p>\n<h3>当阳围城</h3>\n<p>起初不愿向湖北增兵，北京在宜都起事爆发五周多之后，于二月中旬下令河南、陕西四千军队开赴湖北。^59 这些军队到达之前，又爆发了更多起事。响应襄阳教门首领的武装号召，东湖、远安、当阳的教众相继起事。二月十五日，他们涌向只有数十名兵丁把守的当阳县城。城内的教众——其中许多是衙门书吏——从里面发难，把同教之人放进城来。次日，他们杀死了当阳知县，占据了县城。^60</p>\n<p>当阳是湖北西部重要的商业枢纽，也是整个白莲教战争中叛军一度占据的仅有的两座城市之一（另一座是四川的临江市，下一章将讨论）。当阳陷落加重了叛乱的严重性，使中枢政府确信必须增派军队。朝廷向当阳派出了三位高级满洲将领：鄂辉、恒瑞与永保。鄂辉长期担任福康安的副手，参加过乾隆朝晚期的多次边疆战争，当时任热河避暑山庄总管大臣。^61 恒瑞是西安将军，也是湖北之外距此最近的旗军统帅，他于二月二十九日率两千满洲兵从西安出发。^62 乾隆拒绝了湖广总督毕沅调派京城精锐旗兵的请求，理由是：两千旗兵固然不足以守御湖北各地，但调遣他们会在从北京到湖北的长途上引起太多骚扰，而且他找不到合适的将领来统领这支队伍。</p>\n<p>相反，乾隆又向湖北派出一位满洲将领：永保。永保是乌鲁木齐都统，正进京陛见途中在西安停留，被乾隆改派湖北。此外，乾隆还指定永保与毕沅共同主持湖北的战役。^63 然而，三位将领谁也没能到达当阳——他们都被湖北北部的其他起事缠住了。</p>\n<p>当阳的围城牵动着湖北当局最大的注意力。县城陷落后，毕沅立刻从宜都—枝江前线赶去，亲自指挥围困。^64 毕沅是典型的科举士大夫，乾隆二十五年（1760）殿试一甲第一名进士，尽管在18世纪晚期的几次战争中参与过后勤事务，却没有指挥军事行动的经验。18世纪80年代初，他因卷入甘肃冒赈案而被革职，但很快复职——或许是因为他与和珅关系融洽。^65 出任湖广总督后不久，毕沅就得了个\"毕不管\"的绰号，因为他办起公务来并不卖力。不过，这场战役中，毕沅对战费的态度可一点不随性：他乐于利用机会挪用军费，来取悦来鄂作战的各位将领，或许也中饱私囊——这一点后文再谈。^66</p>\n<p>在毕沅的主持下，围城数月没有进展。清军只是炮轰城池、诱叛军出击、然后加以杀伤，却从不想方设法攻取城池。毕沅与其同僚将领不断抱怨兵力不足，可援兵到了之后，局面几乎原封不动。乾隆对这场没完没了的围城越来越不耐烦，毫不留情地斥责毕沅，指出其奏报中的种种矛盾之处，并把批评扩展到湖北的其他将领，包括惠龄。随着北京压力的增大，毕沅与将领们于五月中旬对县城发动进攻。炮火在城墙上轰开了缺口，但试图登城的士兵被叛军击退，这又招来乾隆的一顿严斥。^67 当阳的一位士人以讽刺的笔调，写下了这样几句诗，讥嘲清军的围城：</p>\n<blockquote>\n<p>将军奉命扫贼寇，\n各路兵马齐会集；\n大军围城攻打急，\n犒赏勇兵不惜钱；\n日上炮台轰城池，\n日日可把赏来领。^68</p>\n<p>[译者按：原诗出自当阳士人之手，此处自英文直译；文言原文待核。]</p>\n</blockquote>\n<p>毕沅或许指望城内的给养耗尽——这并非不切实际的盘算。叛军的作战兵力并不大，尽管他们胁迫了数千当地居民入伙。他们的首领杨起元是远安人，教门师父出身，把两三千名精壮分作五营，但随着伤亡增加，人数不断减少。整个围城期间，叛军多次试图送出文书，与别处的同党联络，都没有成功。外边的同党也曾试图派援军入城接应，也都失败了。孤立无援、深陷重围，从四月起，叛军的给养短缺日益严重，房屋被拆作柴烧。不久，城内饥馑蔓延。从五月下旬起，起事者一再绝望地试图突围，没有一次成功。^69</p>\n<p>最后，在盛夏时节，清军将领设计了一个先除叛军首领的计策。他们派一名乡勇潜入城中，联络他的旧识王志良——杨起元的属下。王志良是四川人，1774年因罪流放当阳，此后卷入教门活动；他同意倒戈。六月二十日拂晓，王志良杀死了杨起元，携其首级，带着六名家眷缒城而下，向清军投降。^70 杨起元既除，毕沅与舒亮——舒亮曾任黑龙江将军，时为正三品侍卫——加强了攻势。但他们先又雇了数千乡勇，因为据他们抱怨，一千四百名士兵兵力太少，不足以破城。从六月二十五日起，清军从几个方向进攻当阳，二十八日凌晨从东门破城而入。数千居民逃出城外，但许多人随即死于饥饿与衰竭。剩下的叛军退入加固的大宅，又坚持战斗了两周。直到七月十一日及次日，清军以炮轰与投掷火弹，才最终摧毁了叛军最后的据点。据报道，三千名叛军在这场决战中被杀，杨起元遇害后成为叛军首领的陈德本被生擒。^71</p>\n<h3>来凤起事</h3>\n<p>来凤县地处湖北西南端，境内居住着若干少数民族，其中以毕兹卡人为主；到18世纪晚期，这里已成为一处教门据点。^72 与宜都的情形一样，来凤小幽一位名叫陈启明的殷实地主是当地教门社群的招牌人物，尽管陈启明背后是否另有真正的谋主，不得而知。^73 1794年查禁期间，来凤的教众曾以暴力抗争官府，震惊北京。由于来凤与四川酉阳州接壤，酉阳的地方官来到来凤，逮捕了六名教众。被捕教众押解往酉阳途中，来凤教众袭击了押送队伍，救出被捕者，还打伤了衙役。结果，湖广总督福宁派兵前来，逮捕了参与事件的二十余人。^74 这是1794年查禁中唯一一次公开抗法的案例。</p>\n<p>1796年初，龙年将至之际，一名教门信使王子俊从襄阳来到来凤，号召举事。不过，王子俊把行动之日定在二月十五日——比龙日提前了二十五天。很可能，襄阳的密谋者想让这场起事早些发动，把清方的注意力吸引到本省南缘，从而削弱湖北其他地区的清军力量。王子俊在煽动时没有使用任何末世预言，讯息简单得很：举事的时机已经成熟。王子俊过完新年就返回了襄阳。来凤的教众热切地响应了他即将举事的号召；二月十五日起事发动时，数以万计的人加入其中，包括许多来自邻近的龙山及湖南其他县份的人。首领虽有一大批——包括陈启明在内——最受敬重的却是一个名叫胡正中的来凤本地人。叛军称他为\"胡三师父\"（Hu San Shifu），他本是当地巫师，二十五六岁，直到1794年才入教。起事者攻占了来凤县城，杀死了知县。然而，来凤县城没有城墙，难以据守。与其他起事的同侪一样，起事者们撤入山中，筑起了几处堡寨。^75</p>\n<p>此时，署理四川总督孙士毅——一位久历边疆的封疆大吏——刚刚抵达与来凤接壤的四川苗峒，以阻止湖北叛军渗入四川，因为宜都—枝江起事之后，湖北难民正涌入四川。^76 孙士毅立即接下征剿来凤起事者的任务。三月，他攻打了他们在小幽的堡寨，杀敌千余，把其余人打得四散而逃。^77 四月十五日，孙士毅攻破茶园溪的堡寨，接着又破红岩堡的寨子，来凤境内便只剩下旗鼓寨一处叛军据点了。^78 然而，孙士毅很快病重——他已年过七旬——于六月去世。^79 孙士毅死后，带着湖南兵来到来凤的福宁被任命署理四川总督，主持来凤的军事行动。^80</p>\n<p>叛军全部退入旗鼓寨后，给养日渐匮乏，内部摩擦四起。一些人——包括一些首领——盘算着逃跑或向清军投降。六月中旬，福宁对旗鼓寨发动进攻。凭借一名叛军变节者提供的情报，清军俘获了胡正中、他的弟弟和他们的母亲。胡正中供认，他本也打算逃出旗鼓寨，前往邻近的咸丰、宣恩两县组织更多起事。^81 胡正中随即被处死。胡正中被俘三周后，即七月十一日至十六日，在北京日增的压力下，福宁发动了强有力的攻势。清军炮击叛军堡寨，纵火焚烧，夷平了旗鼓寨据点，俘获了胡正中被俘后接任主首领的田谷墩及其他头目。数千人被杀或自杀，另有二三千人——其中包括许多老人、妇女与儿童——向清军投降。^82</p>\n<p>来凤起事行将扑灭之际，宣恩龙马山又爆发了一场起事。初夏时节，旗鼓寨的首领们曾派信使前往宣恩，联络当地教众。当地教门中人李登鳌动员了一千多人，于六月十一日举事，试图声援旗鼓寨的教友。他们击退了当地清军的数次进攻，并多次转移。旗鼓寨陷落之后，福宁率兵前往宣恩，对付这场起事。听说来凤起事已经结束，许多起事者自杀了。八月，李登鳌与另外几名头目下山到田里弄粮时被擒。此后，剩下的四千余人——大多是被裹挟者——于九月向福宁投降。^83</p>\n<p>使来凤起事在白莲教战争此后数年间余响不绝的，是福宁攻克旗鼓寨之后的暴行。一千七百至两千名被认为顽固不化的精壮俘虏，让福宁担心他们可能再度叛乱，于是将他们全部屠杀，手段冷酷。他先是哄骗俘虏，让他们相信自己已被收编入清军，要到与来凤接壤的湖南龙山县城内领取军装与口粮。当俘虏分批进入城门时，埋伏在城墙内的清兵一拥而上，将他们一一砍杀。这一骇人听闻的事件传遍远近，成了阻止叛军向清方投降的一道心理障碍。1799年初，嘉庆皇帝试图整顿误入歧途的战役时，此案被立案调查，福宁因此受到惩处。^84</p>\n<h3>长阳起事</h3>\n<p>宜都首起事爆发后不久，宜昌府长阳县的榔坪也举行了一场起事。长阳的人口以毕兹卡人居多，教门网络十分稠密。这场起事的谋主是张驯龙，他原住房县，1795年春迁到长阳。张驯龙住在林之华家中——林之华是长阳本地人，曾师从白培相，而白培相也是宜都起事首领张正谟的教门师父。张驯龙很可能是襄阳密谋者派出的信使；张正谟1795年迁居宜都，也很可能是奉张驯龙之命。在长阳，张驯龙与林之华说服了榔坪的教门中人覃加耀——一个二十五六岁的毕兹卡人——加入起事。林之华与覃加耀被推为旗手，张驯龙则像宜都—枝江起事中的张正谟一样隐于幕后。1796年二月，覃加耀先率数千当地人举事，接着林之华也率众起事。两股起事者合计一万余人，在榔坪建立了基地。湖北当局被枝江与当阳的围城缠住，只能调派两千名安徽兵来对付这场起事。围剿行动有气无力，叛军得以派出人马攻打长阳附近地区及其他县份，一度甚至威胁要攻打长阳县城。初秋，来凤起事被镇压、数万起事者被杀的消息传来，使榔坪的叛军警觉到：从来凤战事中腾出手来的清军，随时可能被调来对付他们，于是他们决定分散。八月，他们分作两路撤离榔坪：林之华率一路前往资丘，据守山头；覃加耀率另一路前往巴东县的谭家村。^85</p>\n<p>由于长阳起事是与宜都—枝江起事协同策划的，而张正谟转移到灌湾脑后曾多次派人到长阳求援，长阳的首领们在放弃榔坪基地前不久，派出一支九百人的队伍连同家属，前往长阳与宜都交界的梁山。这支队伍伪装成难民，起初的打算是：如果灌湾脑被围的教友突围而出，就把他们接应到安全地带。当灌湾脑的教友突围无望已显而易见时，长阳的叛军便据守梁山的山头。他们在那里杀死了一座寺庙里的和尚，还胁迫当地几十户人家入伙。惠龄扑灭灌湾脑的叛军后，亲自赶赴梁山，同时派前成都将军成德与陕南兴汉镇总兵文图前往资丘攻打林之华，又派七百名江西兵前往巴东攻打覃加耀。在梁山，惠龄又放慢了节奏，借口下雨、路滑、地势险阻，还说自己的肩膀被石头砸伤。直到十月下旬，多亏几名叛军变节者被派回堡寨纵火，惠龄才攻破他们的山顶营寨，歼灭了数百名叛军及其家属。^86</p>\n<p>离开来凤后，福宁前往巴东对付覃加耀。成德稍早于他被派往那里。得到增援的清军使覃加耀在谭家村战败——覃加耀在战斗中负伤——被迫放弃谭家村的堡寨；面对大批清军，覃加耀从巴东奇迹般脱身，前往资丘与林之华会合。在资丘，会合后的叛军——大概有一万五六千人——进行了一番改组。他们设立了五个营，并给头目们封授了都督、总先锋、先锋、提巡、提点之类的官号。这些官号独一无二，不同于许多其他叛军队伍所用的名目。更重要的是，他们采用了一个新年号\"天运\"——意为\"上天的时运\"——尽管这个年号很快便弃置不用。^87 福宁与成德追着覃加耀来到资丘后，加强了围困，并试图切断叛军的水源，迫使他们谋划撤离。叛军在资丘山南的清江上秘密架了一座桥，于十月中旬从重围中成功突围，令人惊愕。如此众多的人——包括妇女与儿童——从眼皮底下溜走而未被察觉拦截，乾隆对众将勃然大怒，革去了成德与文图的巴图鲁名号与顶戴，但二人把责任推给了一名驻扎在叛军架桥处的小军官。^88</p>\n<p>从资丘奇迹般撤出后，林之华、覃加耀的队伍前往黄柏山——清江以南的一座大山，北面濒江，悬崖陡峭。他们在山顶以及山南的高地四方台修筑堡寨；四方台扼守着通往山顶的唯一道路。在黄柏山，起事者们坚守了五个多月，尽管获取给养困难重重。1796年底，惠龄在扑灭梁山的叛军后赶到，但很快又去了襄阳。随后成德被调往川东，围剿的任务留给了福宁。^89</p>\n<p>离开之前，惠龄曾加强攻势，夺取了几处堡寨，但此后的几个月里，福宁没有取得任何真正的进展。^90 他的围剿松松垮垮，与他在来凤相对迅速的胜利形成鲜明对比——而来凤的胜利是建立在孙士毅病逝前的功业之上的。在黄柏山，福宁只专注于阻止起事者获取给养，而不主动进攻。^91 然而，他奏报起事者给养将尽——尽管山中泉水丰沛——数周之后，仍无法取得任何进展。乾隆尖锐地斥责福宁的围剿三心二意，并一眼看穿其奏报中的荒谬之处：如果叛军弹药不足，他们怎么可能打出\"枪炮如雨\"（qiangpaoruyu）？意识到自己对军队的犒赏可能过于大方，乾隆停止了不论战绩人人有赏的做法，只给伤员加发一个月的饷银。^92</p>\n<p>对福宁失去信心的乾隆，把云贵总督勒保派往黄柏山。然而，勒保于嘉庆二年正月十四日刚到黄柏山，就被派回贵州，去对付仲家苗人的一场起事。^93 乾隆随后把满洲正黄旗的额勒登保派到那里。额勒登保家在吉林，世代以采珠为业，不过他的舅舅福德是朝廷高官。乾隆朝晚期的多次战争中，额勒登保冲锋陷阵，得以擢升到旗制层级的最高层。1792年入侵尼泊尔之后，他升为副都统，很快又晋升都统。他虽然识得满文，汉语却不敷用，凡以汉文写奏折，总要靠幕僚代笔。^94 四十九岁的他身体并不太好，但勇猛一如往昔。不过，在福宁的节制之下，额勒登保在白莲教战争中的首秀有失水准。</p>\n<p>1797年三月初，额勒登保到达黄柏山。他很快加强了攻势，认真地试图与叛军交手。^95 不久，三月二十一日，清军攻占了四方台堡寨，打开了通往山顶主寨的门户。^96 再也撑不下去的林之华与覃加耀再次出逃，在一个雾气弥漫的日子，率部穿过无路可寻的深山离去。他们先向南转移到长乐的白玉寨，随后又前往宜昌与施南交界的芭叶山。^97 芭叶山（Bayeshan，意为\"棕叶山\"）同样险峻，林之华、覃加耀的队伍再次在山顶筑寨自固。</p>\n<p>在黄柏山，清军占领了空荡荡的堡寨，奏报说终于荡平了这一叛军据点。乾隆大为恼怒：他的军队又一次放叛军逃到了又一座山上，因为他太清楚，这可能导致又一场旷日持久、耗费惊人的围困。他讥讽福宁与额勒登保，说他们声称部队受大雾与雨水所阻、须等待给养，而叛军却从一座山迅速转移到另一座山。他对战役奏报的怀疑由来已久，尤其恼火的是：他无数次被告知每战杀死叛军几十甚至几百人，可叛军队伍仍有八九千人之众。^98</p>\n<p>正如乾隆所料，芭叶山的围困持续了数月。起事者深知自己给养有限，多次试图突围，没有一次成功。清军这边，即使攻破了山外围的堡寨，也无法接近山顶的主寨。懊丧的乾隆扣下了给所有部队的犒赏，连伤员也不例外，以此逼迫将领们尽快拿下山头、歼灭叛军。^99 六月，福宁与额勒登保加紧进攻，攻取了更多叛军堡寨。然而，六月二十日，林之华、覃加耀的队伍在突围中击破数座清军堡寨，再次令人惊愕地成功出逃，尽管突围中损失了数百人。幸存的起事者迅速转移到建始，试图突入四川，与那里的同党会合。^100 尽管人数已大为减少，叛乱仍在继续。</p>\n<h3>武当山以南的起事</h3>\n<p>在湖北西北部，南漳、保康、房县、竹山、竹溪诸县夹处于武当山与大巴山之间，是收元教的渊薮。宜都—枝江首起事之后，姚之富之子、这一地区首屈一指的教门师父姚文学动员了他的信徒。与来凤起事一样，姚文学举事的理由并不复杂，只是告诉教众：劫数到了（jieshu daole），别处的同党已经动手了。不过，姚文学所定的起事日期不是三月的龙日，而是</p>\n<p>二月二十日——比来凤起事的日期晚五天，却比龙日早二十天。</p>\n<p>利用该地区清军兵力单薄，教众们二月下旬一经起事，旗开得胜。二月二十日，叛军攻占了保康县城。两天后，竹山县城也落入他们手中，知县自缢身亡。两座县城都没有城墙，各只有几十名士兵把守。与此同时，竹溪、房县、南漳的教众也相继起事，每处都有几千人被卷入叛乱。^101 房县县城同样空虚，只有百来名士兵和少量鸟枪火炮，但这座有城墙的城市早有准备。在知县与属吏的率领下，居民参与了守城，连妇女儿童也帮着往城墙脚下搬运石头。从二月十九日起，叛军数次攻城，都被击退。^102</p>\n<p>此时，文图正应毕沅之邀，从陕西东南部的驻地赶往湖北西部。他一过边界进入竹溪，便与当地叛军迎面遭遇，被缠住了，但很快恒瑞、永保及两千名陕西兵赶来会合。肃清竹溪的叛军后，文图急赴房县县城，恒瑞与永保则前往竹山。在房县城外，文图先于三月初七日驱逐了围城的叛军，随后在数千名当地受雇乡勇的协助下将其消灭。战斗中，姚文学被乡勇杀死。三月十六日，恒瑞经一夜激战，收复竹山县城。三月二十四日，保康的地方乡勇经数日战斗，收复了县城。到四月底，陕西的军队已经扑灭了武当山以南的全部起事。随后恒瑞前往襄阳（永保已于本月初襄阳城遭叛军进攻时先期赶去），文图则前往资丘，协助攻打长阳起事。^103</p>\n<p>在湖北西北端，山区郧县又爆发了一场起事。郧县教门师父徐良虽然已被县官逮捕处决，他动员起来的教众听说竹山落入起事者之手，便于三月初四日举事。他们以随徐良习教的王全礼及其四兄弟为首，两千名起事者在山头筑起四座堡寨。鉴于郧县毗邻陕西，自湖北叛乱爆发以来一直驻节商州的陕甘总督宜绵立即派出部分军队前去对付这些起事者。在从邻近白河雇来的乡勇协助下，延绥镇署理总兵百祥率领的陕西军队荡平了四座堡寨中的三座。^104 四月初，乾隆命宜绵亲赴郧县，肃清那里的叛军。^105</p>\n<p>于是，宜绵与固原提督柯藩越过边界进入郧县，攻打距郧县县城二百里的最后一处叛军据点泥河口。与他们一同行军的还有另一位满洲将领明亮——新任署理广州将军，正奉旨从伊犁前往苗疆战役。^106 四月十二日，他们抵达泥河口。叛军的堡寨筑于悬崖之顶，只有一条窄径可通，但夺取堡寨的战斗进行得极其迅速。清军先派一支小队去切断叛军的水源，意在转移起事者的注意力。当大批叛军前去保护水源时，一小队精兵匍匐至堡寨脚下，投入火弹（huodan），纵火焚寨。趁乱，清军冲入寨中，杀死或俘获了从火中逃生的全部叛军。王全礼也在被俘之列。^107</p>\n<p>宜绵在奏折中虽未明言，这场胜仗的主将必定是明亮，因为他的作战经验远比宜绵与柯藩丰富。明亮出身于镶黄旗满洲显赫的富察氏——他的姑母是乾隆的第一位皇后，他的伯父傅恒担任乾隆的首席军机大臣二十年，直到1770年去世——军旅生涯漫长而辉煌，参加过乾隆朝晚期的多次战争，历任黑龙江将军、伊犁将军。^108 他的堂兄弟福康安与福长安都是和珅的同伙，他自己又尚了公主，但明亮却无意中被划入了和珅政敌的阵营，因为明亮曾在多次战争中担任阿桂的副手。事实上，1784年明亮因对一名流放新疆的高级官员处置失当（导致后者自杀）而被捕、判处斩监候时，正是阿桂奏请将他释放，让他参加镇压甘肃第二次回民起事的战役。^109 然而，到1796年，阿桂已因年事已高、也出于自己的选择，在朝政中被边缘化了。朝中再无有力靠山，明亮动辄受到乾隆的批评与惩处。1795年，明亮又因多年前的一桩过失被参劾：他任黑龙江将军时，曾听任部队私贩兽皮。他因此被褫夺一切职衔，于1795年流放乌鲁木齐，随后才被起复，派去参加苗疆战役。^110</p>\n<p>泥河口大捷之后，乾隆升赏了宜绵与柯藩，对明亮却只赏了\"头等侍卫\"之衔，并让他出任绿营署理总兵——待有缺出时补用——这个位置比他现任的署理广州将军还低。就连这点吝啬的恩典，也得有个说法。按乾隆的解释，理由是明亮\"曾任大员，久历戎行\"（原文待核，见注释111），且是泥河口之战的统兵将领之一。^111 明亮是六十岁的旧派满洲军人，恪守传统的满洲战法：崇尚骑射，重视旗兵，轻视汉兵，更别说临时招募的乡勇了。然而，他对满洲军事专业主义的固执坚守，反而使他与一些态度不同的同侪隔离开来。尽管明亮很快将证明自己是镇压战役初期唯一的雄狮，一个接一个地荡平起事者的据点，他的贡献却常常被贬低或无视。</p>\n<h3>孝感起事</h3>\n<p>直到1796年初夏，教门起事还只发生在湖北西部，湖北中部与东部大体未受惊扰。有些教门首领曾计划在首轮起事之后于湖北中部举事，例如京山与随州，但这些计划无一成功；策划者不是被捕，就是自杀。^112 然而初夏时节，湖北中部被孝感的一场起事所惊动——孝感在省城武昌西北三十七英里处。</p>\n<p>1796年初，教门中人刘世珍兄弟——他们是孝感人，但在襄阳住了二十多年——回到了孝感。不久，襄阳的教门师父孙在恭也来到孝感与刘氏兄弟会合。直到四月下旬，当地官府在孝感搜捕教众，他们才开始为起事而动员。他们策划的几次起事都被官府在乡勇与乡绅协助下阻止了，最终在五月初六日成事。以刘氏兄弟与孙在恭为首，数千名起事者聚集起来，在孝感城西二十二英里的胡家寨一处山冈上筑寨自固，并击退了当地军队的几次进攻。^113 由于本府驻军大多已调往湖南参加苗疆战役，湖北布政使祖之望请江西派一千名士兵前来，保障武昌的防务。^114</p>\n<p>鉴于孝感的起事直接威胁武昌——武昌街头已发现叛军揭帖，谣言四起——乾隆把正赶往长阳协助围剿林之华、覃加耀队伍的明亮改派孝感。^115 同时，乾隆又命江西再派一千名士兵增援明亮。六月二十一日到达孝感后，明亮把包括江西兵在内的两千多名清军编为四队，开始在胡家寨附近修筑营垒。^116 六月二十六日，清军还在筑营，叛军三次前来攻打，都被击退。次日，数千叛军再次冲击清营。战斗中，明亮派出两支人马夺取叛军堡寨附近的两处高地。叛军惊慌失措，退入以两层木栅环绕的堡寨。此时，明亮下令用火箭（huojian）与火弹焚烧叛军堡寨。恰逢大风，堡寨大半被烧毁。许多叛军及其家属葬身火海，还有许多人投入壕沟溺死。次日火势自熄，清军俘获了数百名起事者及其亲属，其中包括刘世珍（他的兄长与孙在恭已在堡寨被毁时丧生）；许多人是从壕沟里捞出来的。^117 孝感起事——这场唯一能对湖北政治中心构成直接危险的起事——就这样在明亮到达一周后走向终结。这场速胜日后将有助于明亮在战役中身处逆境之时：每当皇帝需要为他留在战争中找理由时，它就会被一再引用，算作明亮的功绩之一。对明亮本人而言，孝感的成功是一段珍贵的记忆，是他晚年爱讲的故事。^118</p>\n<h3>襄阳起事与永保的主帅之任</h3>\n<p>襄阳的起事比别处的起事晚了数周，其首领们似乎想恪守预定的龙日。二三月间，几处地方爆发了几场小规模起事，随后起事者聚集到襄阳城与汉江以东的黄龙垱，汇成一支万人的队伍，其中一些人来自河南。^119 起事一开始，首领们就派信使到河南寻找刘之协——刘之协此时藏在南阳——但没有找到。不过，首领们有意对刘之协是否与他们在一起秘而不宣，这使清方一度大惑不解，后来才查明刘之协并不在起事者之中。^120</p>\n<p>刘之协不在，姚之富与另外几人便走上前台，给其中几人封了\"元帅\"（yuanshuai）之号，不过他们之间的等级次序并不清楚。^121 王聪儿离开了1794年丈夫被处决后她所居的尼庵，加入了起事。然而，包括被俘叛军供词在内的各种记载都表明，1796年的她并不拥有任何领导权。^122 在那些\"元帅\"之中，只有王廷诏属于混元教，其余诸人皆与收元教有关。王廷诏五十出头，襄阳教众称他为\"王大叔\"（Wang Dashu）。王廷诏是河南西华人——西华距鹿邑不远——他家与鹿邑王家菜园的王姓教门家族有些渊源。据王廷诏向审讯者供述，他的祖父曾是教门社群中的显要人物，直到1801年被捕，王廷诏一直随身带着祖父的画像。^123 王廷诏可能是在1775年查禁混元教期间离开家乡的。他没有告诉审讯者此后直到1796年他身在何处，并坚称自己不曾从事任何传教活动；但极有可能，他一直活动于南阳与襄阳交界的地区，以教门为业谋生，尽管他同时也可能做点小生意——这是他向审讯者的说法。那些年里，王廷诏想必与刘之协打过交道，尽管他即使在刑讯之下也没有吐露这一点。尽管笼罩在他身上的谜团重重，有一点是清楚的：王廷诏是襄阳教门社群核心领导层的一员，且备受敬重。^124</p>\n<p>武当山以南诸起事的迅速崩溃，断送了襄阳叛军西进的机会。于是，他们转而向北。在襄阳东北的双沟筑垒自固后，他们于四月派出斥候，前往河南邓州与新野之间的边境地区侦察。^125 河南教门网络虽然稠密，湖北西部动荡之时，河南大体保持了秩序，这在某种程度上要归功于河南巡抚景安采取的预防性措施。湖北首起事之后，景安迅速逮捕了他认为可能煽动起事的教众，并加强了襄阳边境沿线的军事力量。^126 襄阳叛军骚扰其边境地区时，景安增派了军队，并在当地招募乡勇，同时恳请朝廷增援。陕西的五百名绿营兵已经到达襄阳，但景安想要的是北京健锐营与火器营的精锐之师。尽管担心叛乱可能蔓延到河南，乾隆对动用这些精锐旗营一直犹豫不决，理由是难以找到统领他们的将领——当阳陷落后他拒绝毕沅调京旗之请时，说的也是这个理由。^127 在乾隆的言辞中，旗兵应当留作与外敌进行的边疆战争之用，让他们去同乌合之众的叛军作战是丢脸的事。</p>\n<p>对乾隆而言，更紧迫也更重要的，是一位得力的统帅。四月初一日，他改派鄂辉去襄阳，而不是去当阳。^128 然而，鄂辉到达襄阳后，并不打算迅速消灭叛军；他只打了一天就收兵了，尽管他兵力充足。失望的景安向朝廷诉苦，说他无法理解鄂辉的道理。^129 鄂辉并不认真与起事者作战，而更专注于请求增援。他执意要求向湖北调派满洲旗兵或索伦兵，理由无非叛军人数众多、绿营兵与受雇乡勇不堪一战。^130 乾隆不为所动，只同意从直隶南部调两千绿营兵，并从北京派二十名带巴图鲁名号的侍卫前往统领。^131 乾隆甚至向鄂辉建议，可以起用流放湖北、河南的蒙古盗马贼——他们骑术高超，又渴望赎罪后重返蒙古，可以成为好兵。^132 然而，乾隆很快决定把襄阳战场的指挥权交给永保。</p>\n<p>永保出身满洲贵族家庭，镶红旗费莫氏。他的父亲温福是第二次金川之役的主帅，1773年在一场夜袭中阵亡。乾隆起初以忠烈褒恤温福，后来又因那场数千清军覆没的败仗而归咎于他，从而褫夺了永保承袭自温福的一等伯爵之位。^133 不过，温福身后之辱并没有影响其子们的仕途。永保是兄弟二人中的弟弟，曾随温福出征金川。那个致命的夜晚，他冒着敌军的飞矢，抢回了父亲的遗体。然而，此后的任官大多是文职。直到乾隆朝最后几年，他才被调任新疆的军职。进京途中听说当阳陷落，永保恳请朝廷准他参加湖北的战役。尽管永保军功寥寥，乾隆却认为他\"于军务尚为谙习\"（原文待核，见注释134）。^134 福康安想必是在第二次金川之役中结识永保的，也举荐他主持襄阳的战役。^135</p>\n<p>永保于夏天接掌襄阳军事指挥权时，起事者在这一带扎下根来的图谋正节节败退。四月初，他们焚毁了没有城墙的樊城，随后试图夺取襄阳城，没有成功。在鄂辉麾下的数千清军凭借火器，击退了大队叛军从三个方向的进攻，叛军方面伤亡数千。^136 历史上，襄阳城因控扼长江上游河谷与中原的战略地位，常常成为交战各方激烈争夺之地。^137 因此，叛军夺城之败并非小事。恒瑞与永保到达后，双沟的叛军陷入了困境。然而，他们很快展示出胜过湖北其他地方同侪的长处：他们不在一处死守，而擅长运动。五月十六日，清军对双沟的叛军总部发动强攻，却发现数以万计的叛军主力早在几天前就已撤离，转移到东面十三英里的官庄。此后数周，襄阳的队伍不断迅速移动，先向东到枣阳，随后陡然折向南。七月初，他们逼近汉江东岸的中等城市钟祥。途中虽然遭受了一些挫折，叛军还是成功击退了清军的拦截，完成了被围的家乡地区之外的第一次长途跋涉。^138 从钟祥出发，他们既可与当阳、枝江的叛军会合，也可与孝感的叛军会合，从而对武昌构成威胁。</p>\n<p>此时，乾隆再也按捺不住对毕沅与惠龄的怒火——他们在当阳、枝江的围城旷日持久。六月初九日，他任命永保为湖北全军统帅，不久又让永保署理湖广总督。^139 然而，永保就任统帅后的第一件事，是停下重大军事行动，同朝廷讨价还价。他声称打算对钟祥的襄阳叛军发动总攻，为此请求从苗疆战役调两三万军队到湖北。当阳最终收复后，永保于七月底赶赴当阳，与毕沅会面。随后他请求让毕沅复任总督、继续主持后勤事务，而自己只保留战役统帅之职，因为他无法同时应付两个职位带来的职责。急切盼望永保在钟祥决战，乾隆批准了永保的全部请求。此外，他还加授永保\"太子太保\"荣衔，并授永保麾下将领庆成\"太子少保\"之衔。同时，乾隆几乎掩饰不住对永保的不满乃至恼怒——永保行动迟缓，拖得太久了。^140</p>\n<p>行动开始之前，永保又提出了一个请求：把正赶往宜都—枝江战场参战的明亮改派钟祥。八月初明亮到达钟祥前线时，那里已经集结了一万多名清军。^141 按照永保的计划，清军将对据守钟祥城北的五至六万名襄阳叛军发起南北夹击。然而，明亮很快发现，永保把九千多名士兵布在北翼，却只在南翼摆了明亮与另一位将领德光所率的四千人。明亮气愤地抱怨之后，乾隆一再批评永保自私，并下令推迟战役，直到各方向都布置好足够的兵力，以便在这场决战中一举歼灭襄阳叛军。</p>\n<p>八月二十四日，清军发动强攻。激烈的战斗直到次日清晨才结束。这对叛军是一场彻底的灾难，数千人被杀，数千人被俘，其中包括许多妇女与儿童。尽管如此，清军未能全歼叛军。叛军及其家属按战前计划分成小队撤离。^142 明亮再次显示出他的干练，从南面一路穷追猛打。永保却没有完成他那一路的夹击，听任叛军向北逃去——尽管北翼配备了最重的兵力。事后，永保在奏报中贬低了明亮的贡献。结果，除明亮之外的所有主将都获得了升迁或奖赏。明亮咽不下这口气，上了一道密折，指控永保纵敌脱逃——这道密折直到1799年才公之于众。</p>\n<p>直到1799年嘉庆皇帝第二次将永保革职时才公之于众。在嘉庆看来，钟祥之战未能全歼襄阳起事者，导致叛乱蔓延到陕西与四川，使之迁延如此之久，永保对此负有责任。^143</p>\n<p>钟祥惨败之后，襄阳起事者分批撤回襄阳，在双沟重新集结。但清军很快赶到，从几个方向进攻，叛军伤亡数千。为打破双沟之围，襄阳队伍兵分两路：姚之富率一路向东，前往枣阳，再入河南唐县；张汉潮率另一路向西北，逼近河南邓州——两路的目标都是进入河南。然而，勤勉的景安在起事者返回襄阳一带后，早已加强了河南边境的戒备。九月初，湖北军队截击了姚之富一路。战斗中，姚之富的母亲、儿媳与孙辈被擒。张汉潮一路渡过了白河，逼近吕堰驿，也未能突入河南，转而南下，与姚之富会合。^144</p>\n<p>八月三十日，苗疆战役的统帅和琳病逝（福康安已于当年早些时候去世）。乾隆急于结束苗疆战役，以便腾出军队对付湖北的教门叛军，决定把明亮与鄂辉从襄阳战场调往苗疆战役。^145 明亮与永保之间的龃龉也是明亮被调走的一个因素——连北京的官员都有所耳闻。^146 明亮的离去削弱了湖北的战役，那里只剩下永保、惠龄之类的平庸将领。不过，这也给了他们要求更多兵力的更强借口；永保、毕沅、景安都恳请朝廷向湖北增派援军。^147 大概确信明亮的空缺只有用更多更好的军队来填补，乾隆让步了。他批准了景安的请求，从山西调一千名士兵到豫鄂边境，阻止叛军窜入河南。对湖北，乾隆不仅同意调派永保所请的四千名绿营兵（直隶、山东各两千），还决定从京城两大精锐营——健锐营与火器营——各派一千名旗兵，而不是湖北将领们所请的五百名吉林旗兵。^148</p>\n<p>这七千名援军是叛乱爆发以来最大规模的一次部署。更重要的是，这是满洲旗兵第一次从战区之外被调派（此前只动用了荆州、西安驻防的数千满洲旗兵）。鉴于湖北西部的大多数起事已被平定——幸存的只有襄阳队伍与被围于长阳的林之华、覃加耀队伍——乾隆一改早先坚决不用旗兵的立场，凸显出他急于尽快了结战役，希望大兵压境能解决问题。这也表明，他开始被前线的将领们所动摇，屈从于他们大声而反复的请求。不可避免的是，从北方调派大批军队会大大推高军费。这次部署之后的数月之内，数百万两白银被解往湖北（其中一小部分解往河南）。湖北的战役由此变成王朝的一场重大而昂贵的行动。同样，战区的腐败也将日益猖獗。</p>\n<p>到1796年底，一万五千至一万六千名清军——包括两千名来自京城的精锐旗兵，全部骑马——已经聚集在襄阳一带。^149 然而，攻势毫无起色；永保及其同伙未能阻止起事者的运动，而起事者的人数——包括家属在内——已减少到也许不足一万。十一月初，叛军渡过滚河，转而向西，目标指向光化与谷城。西进与入豫的图谋都失败后，他们又折回黄龙垱——他们叛乱的发源地。^150 令乾隆大失所望的是，永保没有表现出在可预见的将来消灭叛军的决心，甚至没有这样的打算。相反，他的策略是：以庞大的兵力松松垮垮地围住叛军，零敲碎打地发动攻势，却总是听任叛军破围而出，转移到另一个地方。如果说乾隆此前曾相信，永保在襄阳战场的可怜战绩主要应归咎于兵力不足，那么现在他再也不信永保的借口了。精明的乾隆一眼就看出，永保及其同伙是在拖延。然而，除了严厉而反复地斥责他们不肯全力作战，他也做不了更多。^151</p>\n<p>对清朝国家而言幸运的是，战区里有一位不肯对此类行为视而不见的督抚。景安是和珅的远亲，这或许使他更有胆量揭露同僚们的不端行径。不过，与和珅不同，景安博得了\"不贪财\"的名声。^152 有时，景安关于豫鄂边境战事的奏折比永保等人的还先到北京。景安频频揭露永保及其他将领的欺诈行径，使自己成了他们的眼中钉。景安身陷危局时，他们也不会伸出援手。1796年的最后几天，数千名叛军试图攻打邓州。景安与数百名士兵在邓州附近被叛军围困时，永保与恒瑞虽然都在近旁，却没有派出一兵一卒救援。^153 此事发生后，景安立即奏请朝廷，把调到湖北、隶属永保麾下的两千名河南兵调回——他明白，除了自己，谁都指望不上。^154</p>\n<p>到嘉庆元年年底，乾隆对永保的耐心与信心已荡然无存。他确信，当初选择永保担任统帅是个错误；只要永保留任，镇压战役就不可能很快结束。^155 乾隆先给了襄阳前线的四位将领——永保、恒瑞、庆成、舒亮——一个象征性的处分：摘去他们翎羽顶戴。随后，乾隆命当时正在黄柏山前线攻打林之华、覃加耀队伍的惠龄赶赴襄阳，接替永保出任统帅，从而成为第一位以总督兼任的统帅。不过，他还是给了永保一个将功折罪的机会：如果永保能在惠龄到达之前全歼襄阳叛军，就可以得到宽恕。1797年初，景安奏报永保又未能拦截叛军，乾隆遂下令：惠龄一到，立即将永保革职。1797年新年（1月28日）过后不久，永保被逮捕，押送北京受审。^156</p>\n<p>然而，与乾隆的期望相反，永保的去职——这场战役的第一次更换统帅——没有激励襄阳的其他将领，反而令他们泄气。惠龄于十二月十九日到达襄阳后开始查办永保，恒瑞、庆成、舒亮都不肯配合。惠龄很快掉转立场，为永保辩护，声称永保兵力不足，叛军又更熟悉当地情形。同时，惠龄又试图为那些因永保拖延战事时未曾干预而遭到乾隆严厉批评的将领开脱。^157 后来披露的事实表明，这些将领以及湖北的一些省级官员早已抱成一团，从拨往襄阳的大笔军费中渔利。通过操纵襄阳的军需局主管胡齐仑，将领与官员们——包括明亮与鄂辉——频频以犒赏士兵为名，或者干脆作为馈赠，从胡齐仑那里收取银两（此类馈赠以永保所得最多）。 或许是为了让永保对朝廷此时尚不知情的这些勾当保持沉默，襄阳的小圈子在永保被捕后仍继续讨好他。永保囚禁北京、家产被抄之际，毕沅还从军需库中给他送去数千两银子。毫不奇怪，新任统帅惠龄很快也加入了这个小圈子，从胡齐仑那里收钱。^158 在河南一界之隔的地方，襄阳战役唯一的批评者、与军费丑闻无涉的景安，则彻底孤立了。尽管景安成功揭发并扳倒了永保，战区的那套风气依旧如故——有没有永保都一样。</p>\n<h2>四川的起事</h2>\n<p>1796年上半年，湖北西部陷入起事浪潮之时，四川却出奇地平静。尽管襄阳的教门中人曾派\"通会人\"（tonghuiren）前往川东，传达他们关于龙日起事的决定，达州直隶州的同党直到秋天才有所行动。^159 那里的许多教门信徒是啯噜匪徒、私盐贩子、伪钱制造者与无业流民，托庇于富有的教门东主家中；他们对混元教、收元教教义中根深蒂固的末世论，未必像虔诚的信徒那样热衷。直到湖北起事的高潮过去、许多湖北叛军投奔达州教众避难之时，达州的叛军才被催逼着行动起来。九月，两场起事在相隔不远的地方相继发生。第一场于九月十五日爆发于距达州州城三十一英里的亭子铺，由达州教首徐天德领导。^160 据说一万多人加入了起事，包括家属与来自湖北的人。^161 由于起事者执黑旗、着黑衣——而不是像湖北那样用白色——他们的队伍被称为\"青号\"（Qinghao，即黑号）。几天之后，王三槐又领导了东乡莲池沟的一场起事。王三槐是算命先生，习教已有数年；地方官员搜捕教众时把他母亲等家人关押起来，使他变得激进了。东乡起事的另一位关键人物是冷天禄，东乡本地人，王三槐的教门师父。他们聚集了约七百人，于九月二十二日率众前往丰城，在那里筑寨自固。^162（地图1.3）</p>\n<p>四川省级当局对起事的应对十分被动。他们的大批驻军虽已调往湘西参加苗疆战役，孙士毅又带着剩余的一千多名士兵去到来凤作战。来凤起事平定后，成都将军观成率领的那些军队又被派往黄柏山。达州城里只剩几十名绿营兵。尽管如此，乾隆于十月初五日听说达州首场起事时，并不太担心，把它当作一桩小事打发了：\"达州匪徒不过乌合之众，无须张皇。\"（原文待核，见注释163）^163 他只是催促福宁与观成把一部分四川军队调回，并同意派一些陕西兵前往达州。^164 与此同时，四川官员也恳请明亮及苗疆战役的其他将领，把重庆镇总兵袁国璜及其五百名士兵放回。这一请求虽获允准，那些四川士兵到达达州前线却需要时间。^165 署理四川总督英善只能拼凑一支五百人的远征军，并在前往达州途中雇了两千名平民充当乡勇。十月初一日抵达达州后，英善号召当地居民组织乡勇，与起事者作战。^166 事实上，一些当地的绅士——文武生员——早已组织乡勇自卫。官员们很快介入，征调了许多乡勇协助正规军，随后给他们发饷银与津贴。尽管湖北开创了收编乡勇为非常规兵员的先例，四川很快就在这一做法的规模与开支上超过了湖北。</p>\n<p>十月，巴州与通江又爆发了两场起事。通江与巴州地处大巴山南麓，多山而耕地匮乏，但教门网络分布极广。达州两场起事之后，地方官府加紧在这两县搜捕教众。经徐天德信使联络，巴州教门首领罗其清——一个织布匠（起义前不久，因近来的旱灾折损了织布手艺，他开了一家饭馆）——聚集了一千多人，在方山坪举事。罗其清用白旗，其队伍被称为\"白号\"（Baihao）。几乎同时，通江的冉文俦与其侄冉天元发动了另一场起事。他们用蓝旗，其队伍被称为\"蓝号\"（Lanhao）。^167 此后的岁月将证明，这两支队伍中的许多叛军，是叛乱中最强悍、最能战的一部分。</p>\n<p>在乡勇的协助下，四川的军队把叛军挡在了外面。到达达州四天后，英善从叛军手中夺回亭子铺，随后接连荡平了叛军的堡寨。徐天德的儿子在守卫一处要地时阵亡，徐天德随后转移到东乡。徐天德的计划是与王三槐会合，退入太平的山中，尽管他们也曾考虑与湖北的同党会师。^168 太平地处四川东北角，多山而人烟稀少。达州、东乡起事之后，来自湖北的教门师父孙士凤——人称孙老五——又在太平发动了一场起事。^169 四川的叛军随后派信使前往陕西的兴安府煽动叛乱。兴安是教门重镇，1796年早些时候曾爆发几场小规模起事，都被迅速扑灭。^170 陕西巡抚秦承恩与柯藩立即赶赴兴安，对付新起的叛乱（二人此前已前往太平，阻止四川的叛乱蔓延到陕西）。与此同时，陕甘总督宜绵计划率二千七百五十人的远征军前往达州，支援四川的同僚，因为那里的动荡威胁着本省的稳定。不过，宜绵很快改变了行程：他不得不在兴安停下，帮助陕西同僚镇压刚刚爆发的几场起事。^171</p>\n<h2>陕西的起事</h2>\n<p>与湖北、四川的战役相比，兴安的战斗速战速决；五场起事在两个月内全部被平定。与湖北的大多数叛军一样，兴安的叛军撤上山头，修筑堡寨木栅。兴安的山属大巴山系，比湖北西南部的山更高、更陡、更险。宜绵与秦承恩、柯藩会合后，陕西军队先攻打安岭的叛军，因为安岭靠近兴安府城。他们从几个方向发起进攻，用火弹焚毁叛军堡寨。十一月中旬的短短两天里，清军就荡平了这处叛军据点，战斗中杀死数百人，又俘获数百人——俘虏随后也被处死。^172</p>\n<p>这场战斗一结束，陕西军队就转攻将军山的叛军山头。将军山在汉江北岸，靠近一条通往西安的孔道。与安岭之战一样，清军沿着陡峭狭窄的山路强行攻到叛军堡寨前，用火弹与大炮（大炮已运上山）摧毁叛军堡寨。数名叛军首领被炮弹击毙后，剩下的一千名叛军投降了。投降者中有许多人被处死，因为官府认为他们曾与清军作战，只是迫不得已才投降。^173</p>\n<p>宜绵等人攻打将军山堡寨的同时，甘肃肃州镇总兵索费英阿率领的一支人马正在汉江北岸紫阳的米溪与叛军作战——那里的叛军把堡寨筑在四周环绕稻田的山丘上。数日激战之后，幸存的叛军焚毁了堡寨，退到一座山顶作最后的抵抗。清军切断了他们的水源，并击退了汉江南岸派来的一支叛军援军。十一月二十六日，剩下的七百余名叛军投降。投降者中又有许多人被处死。^174</p>\n<p>米溪之战后，宜绵与柯藩前往汉江以南的五座云——米溪之战中叛军曾从这里派兵援救教友。五座云格外险峻：这个山间小镇为五座陡山所环绕，山的东、南、西三面又有三条河流——洞河、汝河与大道河。五座云不仅地处险要，叛军还在通往五山之间山丘总部的一切可能通道上修筑了许多堡寨，构成一套复杂的防御体系。连日的大雪使清军无法发动进攻。然而，他们却选在雪下得更大的十二月十六日发起决战，令叛军措手不及。凭借火器——尤其是随身运上山的大炮——清军得以一个接一个地扫平敌方堡寨。火弹够不到叛军总部，士兵们便用火箭把叛军总部付之一炬。四天之内，陕西军队会同数百名湖北竹溪的乡勇，几乎全歼了这一据点中的起事者，数千人或被烧死，或被杀。只有少数人逃脱，其中包括这场起事的一个首领、四川人王子坚。^175</p>\n<p>这场战斗之后，宜绵与索费英阿前往太平，把对付兴安最后一场起事的战斗留给了秦承恩与柯藩。叛军最后的据点在安康与太平交界的光头山（意为\"光秃的山\"）。在群峰之中，一座高峰四面峭壁，顶部是一块巨大的盆地，叛军在那里修筑了多重防御设施和半地下式的土墙居所。叛军首领是王刘氏——一位姓刘、嫁入王家的女子。</p>\n<p>她的信徒相信她就是\"无生老母\"。由于宜绵已率部分陕西军队入川，秦承恩与柯藩在当地招募了更多乡勇。为降雪所阻，这场战斗持续了约两周。士兵与乡勇先攻取了叛军的哨卡，随后在光头山对面的山丘上架起大炮，轰燃叛军的木制堡寨。嘉庆二年正月二十五日，清军攻破了叛军总部。据报道，两千多名叛军及其家属——包括王刘氏本人——或死于战斗，或葬身火海。另有二百余人被捕，其中包括王刘氏的几名副手，他们随后被凌迟处死。^176 陕西南部由此肃清了起事。</p>\n<h2>血腥之春</h2>\n<p>与此同时，四川的局势对镇压者而言正日益恶化。在巴州与通江，蓝号与白号轻松地在山顶筑垒自固，因为清方没有多余的兵力去对付他们。1797年初，罗其清率众攻打巴州城。他们未能破城，但杀死了几名下级军官。^177 达州的起事者保持着势头。十一月下旬，他们在东乡的横山子与清军激战数日，随后在一个清晨对清军营垒发动突袭，几乎全歼了营中数百名士兵，并杀死了战功卓著的袁国璜与兴汉镇新任总兵何元卿。^178 二人刚刚抵达川东（袁国璜从苗疆战役归来，何元卿从黄柏山前线赶来），是这场战役中最先阵亡的高级军官。^179</p>\n<p>这场惨败使乾隆警觉到川东北冲突的严重性，也使他意识到需要派一位比英善更有经验的将领。乾隆命在陕西屡战屡胜、深得其赞许的宜绵主持四川的战役，并催促福宁与观成尽快结束黄柏山的围困，随后赶赴四川。不久，乾隆改了主意：他命观成率五百名士兵立即返回四川。^180 然而，援军到达之前，徐天德与王三槐于十二月二十九日——新年前两天——攻占了东乡县城。数名从外省征调来协助战役的清军军官与书吏被杀。最令清朝震惊的是：成都驻防旗兵的前副都统佛住——他在赴新疆新任途中，自请返回四川与叛军作战——被叛军俘获杀害，成为战争中第一位阵亡的高级旗人。^181</p>\n<p>尽管知道东乡失陷，宜绵在元旦次日进入四川时，还是决定先肃清太平的数千名起事者。在太平，孙老五的弟子何如惠所领导的起事者——孙老五听说宜绵从陕西逼近，已前往东乡求援——据守三处相距不远的据点。由于宜绵已派索费英阿率一千名士兵前往东乡，而他所调的甘肃援军尚未到达，他便招募了更多乡勇，并指派幕中的文官统领他们。正月初七日，宜绵同时攻打三处叛军据点。士兵与乡勇炮击叛军筑于陡崖上的壁垒，并向其中投掷火弹。堡寨起火、叛军大乱之际，清军破寨而入。一周之内，三处据点全部被荡平，大多数起事者或被杀，或被俘（何如惠在战斗数日后被擒）。^182 太平暂时恢复了平静。</p>\n<p>二月初五日到达东乡后，宜绵与侍卫明兴——明亮之兄——及其五百名士兵会合。东乡县城没有城墙，叛军已在几处山头筑垒自固。宜绵与明兴逼近时，他们放弃了其中两座堡寨，把主力集中到城附近的三处据点。大约同时，冉文俦率其数千名起事者在王家寨的山顶修筑壁垒；王家寨距罗其清方山坪的据点不远。于是，宜绵派百祥率数千名士兵前往王家寨。为援救教友，徐天德率其数千人马前往王家寨，这削弱了张家观——一处俯瞰东乡的高地——的叛军力量。二月初十日，宜绵攻打张家观，用火箭引燃叛军的弹药库，引发爆炸，迫使叛军弃守这处据点，四散而去。宜绵与明兴随后收复了东乡县城。与此同时，徐天德在驰援冉文俦途中遭清军截击。得知张家观失守，徐天德率部退回东乡的另外两处据点。^183 其中一处据点位于清溪场，可容纳数千人；另一处金峨寺（意为\"金顶之寺\"）更加宽敞，可容纳更多人，且三面悬崖，极难接近。起事者顽强抵抗，有时甚至反攻敌方大营，清军攻取这两处据点因此并不顺利。^184</p>\n<p>此时，由于明亮1796年底的加入，湘黔两省针对苗民叛乱的两年战役已近尾声，那里的军队被调往川东。四川川北镇总兵朱射斗及其两千名士兵率先返回，正好赶上收复东乡之战。三月初，明亮与德楞泰——一位蒙古旗人、宫廷侍卫——率三千名四川兵与三千名云南兵抵达达州。^185 柯藩及其陕西军队在平定陕南最后一场起事后也赶到了。清军合计约两万人，对叛军据点发起决战。^186</p>\n<p>尽管乾隆对明亮委以重任，在两场战役之间让他辗转于各个
