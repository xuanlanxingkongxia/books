居民建立的乡勇转变成了官府发饷的乡勇。从成都赴达州途中，英善招募了两千多名乡勇，加强他那只有五百名士兵的小部队。^21 在达州，英善幕中的石作瑞挑选了一千名精壮乡勇，训练其作战技能。他们很快投入了战斗。后来，石作瑞又挑选装备了一千多名强壮的军事民夫，守卫达州的清军营盘。这些努力为石作瑞赢得了越来越大的名声与皇家的赏赐顶戴，使他跃升为四川有权势的后勤大员。^22</p>\n<p>四川战场使用乡勇作战并非特例。毕沅在当阳招募乡勇时，允许他们在守村与随军作战之间选择。结果，越来越多的乡勇选择参战。当阳围城最后阶段，毕沅与舒亮抱怨兵力不足，许以\"重赏\"、辅以\"教化激励\"，三天内雇了两千多名乡勇；一半守卫清军营盘，一半投入战斗。^23 在河南，1796年九月，完颜岱指挥的乡勇\"自愿\"参加战斗，击退了湖北来的叛军。^24 在陕南，1797年初攻打安康光头山叛军据点的战斗中，秦承恩多雇了乡勇——因为宜绵带走了大批陕西军队入川。</p>\n<p>最终，\"官募乡勇\"（gumu xiangyong）分为两类。更熟练能干的乡勇被编入随清军行动的营队——远离家乡——称为\"随征乡勇\"（suizheng xiangyong）。他们的营队由乡勇同伴或清军军官带领。无论哪种情形，他们都受所附部队军官的指挥。许多乡勇随同一支部队作战多年。留在家乡守卫村庄、城镇与关卡者被称为\"防守乡勇\"（fangshou xiangyong，或fangka xiangyong）；其人数远多于随征乡勇。他们若不同正规军一起守某地，就由自己的头目带领——头目有时称为\"卡首\"（kashou）。同时，知县知府及其他地方官员招募并指挥自己的乡勇。战役后期，一些地方的防守乡勇也被用作军事民夫。^25 两类受雇乡勇合称\"征防乡勇\"（zhengfang xiangyong），或简称\"乡勇\"（xiangyong）。乡勇没有制式服装，但有些人配发了衣帽；或者只佩带标识乡勇身份的标牌。^26 为与正规军区分、并区分不同的乡勇队伍，乡勇使用不同的旗帜——例如，湖北乡勇用红旗，四川乡勇用绘有八卦图案的旗帜。德楞泰的随征乡勇编为三队，使用三面不同的旗帜：阵阵得胜旗（zhenzhendeshengqi）、如意旗（ruyiqi）与花蜈蚣旗（huawugongqi）。^27</p>\n<p>冲突第一年还没结束，受雇乡勇就被调往他省。1796年秋，永保把河南邓州的数千名乡勇调到湖北——他们显然领饷，被永保用作作战人员。乾隆认可了调动，但指示派军官率领他们。^28 1797年春，清军围攻东乡县城时，从四川其他地方与湖北竹溪调去了乡勇。^29 1797年春末，襄阳叛军逼近陕西汉江时，汪新从湖北郧阳府调数千名乡勇入陕。然而，这一次乾隆不赞成，认为此举是\"大错\"——因为乡勇只善于守御家乡，上不得战场。他对湖北已恢复太平、乡勇仍被留用也不满，于是命他们无论走到哪里都返回家乡，并命作此调动的官员自付所费。^30 但这一指示没有被遵守。数月后，明亮与德楞泰离川追击襄阳叛军时，很可能带走了四川乡勇，尽管他们从未奏报。1799年，富成率两千名川豫乡勇在陕西作战。富成被罢免后，这些乡勇移交给了王文雄。^31 1800年初额勒登保撤出四川时，带走了数千名四川乡勇。到那时，随征乡勇是机动力量、可随正规军调往任何地方，已成惯例。</p>\n<p>为与受雇乡勇区分，以社群为基础的自愿乡勇在清朝档案中通常被称为\"团练乡勇\"（tuanlian xiangyong，简称\"团勇\"，tuanyong）。更长的表述解释了两者的区别，称他们为\"民间自行团练之勇\"（minjian zixing tuanlian zhi yong）。总体而言，\"团\"或\"团练\"从不与受雇乡勇关联，而\"乡勇\"一词则含糊，两类皆可指。事实上，两者之间的界限有时是模糊的。前线人手紧缺时，自愿乡勇可能被军队征用。^32 也有自愿乡勇随正规军参加行动、此后随军而行、领取饷银口粮的情形。^33 自愿乡勇一旦开始用军费发饷，就转变为受雇乡勇。自愿乡勇虽从地方精英与富户筹款中获得一些补偿，但与受雇乡勇丰厚的饷银犒赏相比，不值一提。因此，随着战役推进，各地都面临靠私人资金维持社群乡勇的难题。</p>\n<p>起初，受雇乡勇的报酬常常是临机决定的。^34 听说惠龄等人在湖北补偿乡勇的做法后，乾隆于嘉庆元年二月二十一日认可了这一做法：\"帮同守御、协助官军之乡勇，自应奖赏。若实系出力杀贼、擒获贼首者，应给予盐菜口粮，并照官兵一体奖赏。如此，则乡勇知所激励，踊跃出力，于剿捕更为得力。\"（原文待核，见注释35）^35</p>\n<p>这道谕旨虽然不精确，此后却被湖北的战争主持者们用来提高乡勇的待遇。他们在奏折中总是说，乡勇\"遵旨发给盐菜口粮\"。^36 毕沅甚至把这道圣谕抄在黄纸上广为张贴，以招募更多乡勇——惠龄也照做了。^37 确实，报酬激励了很多人。三月，惠龄奏报：湖北一些州县各有七八千名乡勇，其他至少有二三千名，全部\"按兵丁标准\"发饷。^38 由于乡勇的补偿不见于《军需则例》，湖北官员以石峰堡战役与同时进行的苗疆战役为先例作标尺。湖北树立的样板很快被陕西效法。^39 在四川，乡勇起初只按湖北的标准领饷——换言之，与正规军同饷。粮价上涨时，又加发口粮。^40</p>\n<p>渐渐地，乡勇的补偿更加结构化。除\"盐菜银\"外，乡勇还领口粮与其他福利。平均而言，他们的月饷超过二两——高于绿营兵一两半至二两的月饷。乡勇调往他省时，月饷高达三至四两。受雇时，他们还会领五两\"安家银\"（anjiayin）——补偿他们离乡别业造成的经济损失。若调离家乡地区，标准更高。^41 乡勇的饷银在整个战役期间波动。主事官员们往往倾向于请求加薪。1799年秋，由于粮价上涨，松筠请求：无论是否临敌，乡勇的口粮都从每日八十文提高到一钱银子。^42 习惯了优厚待遇的乡勇，很少容忍削减或拖欠。1797年底，由于达州的清军补给线被叛军阻断，四川白岩山前线的乡勇数月领不到饷，就开了小差。^43</p>\n<p>遵照乾隆\"乡勇有功应赏\"的指示，^44 将领们在每次所谓胜利之后都赏乡勇银钱，尽管通常少于赏正规军的。然而，最普遍的做法是授乡勇官帽顶戴。早在1796年三月，惠龄就给有功乡勇授过七八品的官帽顶戴，并承诺：再立新功就为他们请授\"实职\"。授顶戴很快成为湖北战场的标准做法，尽管事先要请得皇帝的认可。^45 在四川，乡勇获授顶戴的第一例出现在1797年初宜绵指挥平定太平三处叛军据点之战后。^46 1797年晚些时候，乾隆在一道谕旨中附上一些花翎（hualing）与蓝翎（lanling）交给将领们，让他们自行授予有功军官以及已有五、六、七品顶戴的乡勇，无需事先奏请。^47</p>\n<p>顶戴授得滥了，将领们便开始给乡勇授低品荣衔。随后，一些荣衔成了实职。1799年秋，接到罗昂\"将领们没有妥善奖赏乡勇\"的批评后，嘉庆皇帝进一步更新了对乡勇的奖赏。他担心荣衔不够——战役结束后，乡勇回乡仍可能被知县蔑视欺辱——于是命将领们为贡献卓著的乡勇奏请实职。^48 回应嘉庆的裁定、也间接回应罗昂的批评，额勒登保奏报说：为普通乡勇及其头目奏请实职早就是惯例。他以桂涵与刘星渠为例——二人分别被任命为都司（dusi）与通判——并说\"众多\"乡勇已被任命为把总（bazong）与千总（qianzong），获蓝翎。^49</p>\n<p>战斗中，乡勇总是被摆在正规军前面，他们的伤亡远比正规军惨重。^50 乾隆并非对此视而不见，曾警告不要拿乡勇当先锋。为表关怀，从1796年中起，乾隆为阵亡的杰出乡勇发放抚恤，并明确表示打算把抚恤推广为整个战区的通则。^51 然而，他的指示没有得到统一执行；阵亡乡勇获得抚恤的记录很少。^52 嘉庆接手后，继续批评正规军躲在乡勇后面，并哀叹：叛军也把被裹挟平民摆在自己前面，结果官军很少与叛军遭遇，杀死的只有平民。^53 1799年夏末，松筠请求：准许对陕南两场战斗中阵亡的九名乡勇头目按绿营最低阶军官\"外委把总\"的标准发放抚恤，并对四百八十多名死伤乡勇发放伤亡抚恤——嘉庆批准了。此外，他命所有阵亡乡勇都获得抚恤，作为通则，而不只是有功者。数日后，在给其他战场将领的谕旨中，嘉庆告知了这一新政策，责成他们不要忽视乡勇的贡献。^54 当然，对受雇乡勇补偿的升级，将进一步推高飞涨的军费，并为腐败提供更多机会——下一章将讨论。</p>\n<p>受雇乡勇虽然随战争推进而制度化，清朝却从未打算让他们正式进入军事制度。相反，遣散他们的呼声出现得很早、很频繁。1796年秋，湖北大多数起事被扑灭、其余被遏制时，御史潘绍经弹劾乡勇滥杀平民、向平民勒索钱粮，请求除仍守关卡要地者外，在湖北解散乡勇。乾隆同意潘绍经的意见，命永保及其部属落实。乾隆说，雇用乡勇只是正规军不足时的权宜之计；他担心叛军肃清之后，乡勇会闹事。^55 毕沅虽然为乡勇辩护、反驳潘绍经的指控，却承诺：一地一旦平靖就遣散他们。^56 这——堪称第一次——遣散乡勇的呼吁之后，每多一处战火平息，乾隆就颁发同样的指示。</p>\n<p>然而，鉴于地方官员的普遍抵制，遣散乡勇注定命途多舛。他们在此地解散乡勇，在彼地又以自卫之名保留，或者把难民编入乡勇或军事民夫队伍，作为安置流民的办法。^57 随着冲突继续，很快证明专注于遣散为时过早。在陕西，秦承恩刚解散兴安的乡勇，达州起事爆发、襄阳队伍又从河南向他逼近，他不得不招募更多乡勇守卫汉江与川豫边境。^58 如上所述，汪新派乡勇入陕协助攻打襄阳队伍时，他正在湖北解散乡勇。</p>\n<p>派其中一些入陕，正是让他们继续受雇的办法。正如魁伦1799年底所说：\"贼匪往来无定，此裁彼增，或裁而复募。\"（原文待核，见注释59）^59 正如嘉庆1800年中承认的，这在所有战场都是反复出现的情形。^60</p>\n<p>事实上，高潮还在后面。主要由于襄阳叛军的流动，中枢政府与省级当局都呼吁多雇乡勇，推动乡勇在整个战区的大扩张——从1796年底到1798年初。^61 在湖北，永保、继而惠龄在与襄阳叛军作战时招募了大量乡勇。为防止起事者裹挟平民，惠龄把襄阳一带的居民迁到汉江东岸，把精壮男子编入乡勇守江。1797年春，胡齐仑率领一支六千人的乡勇大军守卫关卡。^62 1797年秋姚、王队伍返回湖北时，又掀起一波招募乡勇的浪潮。例如，竹山与竹溪各雇了一万多名乡勇。^63 姚、王队伍离开湖北赴陕后，汪新与景安解散了汉江以东鄂豫两省的全部乡勇，但保留了一支三千人的乡勇协助守汉江。然而，郧阳府保留了百分之七十的乡勇。^64 到1798年底，湖北据说累计雇用了三十六万六千七百名乡勇。^65</p>\n<p>在陕南，从1797年底到1798年春，大量乡勇被雇用于地方防务与守卫汉江——尤其是汉中府境内水浅而窄的上游河谷。乡勇大多由地方官员率领，一再挫败了叛军北渡汉江的企图。1798年初，高均德渡过汉江、李述逼近栈道后，秦岭山区——包括栈道沿线——又雇了更多乡勇。^66 陕西乡勇总数从1797年底的一两万迅速增加到四五万甚至更多。^67 1798年春姚、王队伍被消灭后，扩张并未停止。张汉潮在秦岭穿梭，汉江两岸的受雇乡勇大体保留了下来。此外，川鄂边境沿线还雇了更多。仅西乡一县就雇了三万多名乡勇。到1799年底，陕西的受雇乡勇总数可能超过十万。^68</p>\n<p>在四川，1797年同样是雇乡勇的高峰。年初，英善鼓励地方精英组织更多乡勇守卫本社与要地。宜绵到来后——鉴于他在陕南成功使用乡勇——呼吁多雇乡勇。毫不奇怪，只有十几个士绅响应，他们招募了一千多名乡勇，但大多数新乡勇是官员雇用、由军费发饷的。^69 春天激烈的战斗中，明亮与德楞泰使用了数千名乡勇——他们由乡勇头目与军官共同带领，有时与正规军混编。^70 两名乡勇桂涵与罗思举在战斗中表现突出，后来被称颂为乡勇英雄的楷模。^71 同年晚些时候，乡勇队伍至少两次大幅膨胀：先是襄阳队伍从陕西逼近四川时，随后是明亮与德楞泰率清军精锐离川追击襄阳叛军入鄂、使四川成为叛军游击战的最佳场所之后。^72 结果，许多县——包括远离热点的——都雇了乡勇，人数从数千到一万多不等。全省范围，1797年某些时点乡勇总数据说超过三十四万。^73 并非巧合的是，四川当年吞掉了一千万两军费。1798年初勒保与福宁先后到川后，不得不收敛雇用、进行裁减，把远离战场的乡勇移出军饷名册。据勒保说，名册上的乡勇从1798年初的十万至二十万降到1799年的四万左右，^74 但真实数字可能更高。</p>\n<p>受高额报酬、官帽顶戴乃至官职，以及战利品——战役早期起事者财物较多、尤为丰厚——的诱惑，许多人急于受雇。然而，乡勇的构成因地而异，并在漫长战争中不断变化。在河南，大多数乡勇是农民；1803年遣散时他们回了家，惹的麻烦最少。^75 在湖北与陕西，1799年之前，大多数乡勇是本地招募的，也主要是农民。四川冲突早期也是如此。^76 随着战争拖延，四川越来越多的无业流民、有前科者与不法之徒——如啯噜匪徒、私铸钱币者与私盐贩子——加入了乡勇，因为四川此类人比邻省更多；档案印证了这一点：四川阵亡乡勇的绝大多数没有家属领取抚恤——尽管有些名字可能是后勤人员伪造的。^77 四川难以受雇后，许多此类人去了陕西与湖北。战争后期，陕西随征乡勇的很大一部分是四川人。^78 1799年之后，清军把四川、陕西的乡勇带到湖北，一些乡勇被编入绿营——这吸引了许多流民到湖北寻找机会。正如吴熊光一再抱怨的，湖北的外籍乡勇——大多来自四川——在被遣散时是闹事的主力。^79 然而，通过把大量流氓无产者吸纳入乡勇，受雇乡勇方案实际上釜底抽薪，切断了叛乱的兵源。有些地方，连雇作军事民夫的壮丁都没有了——这在18世纪以前的战争中从未发生过。^80</p>\n<h2>族群士兵</h2>\n<p>除乡勇外，白莲教战争中还有另一类非常规兵员：族群士兵。他们通常被称为\"土兵\"（tubing）、\"番兵\"（fanbing）或\"土练\"（tulian），是帝国边缘非汉土司的武装力量。土司臣服清朝时，常常被允许保留自己的军队。清朝初年有时招募族群士兵协助驻守边疆，但除满洲外，不倾向把他们投入战争。^81 从18世纪初扩张到西藏开始，清朝更多地使用族群士兵。第一次入藏驱逐准噶尔蒙古人——他们1717年侵入西藏、占据拉萨——的远征中，清军从康区（西藏东部）招募了藏人及其他族群的士兵加入行动，其中一些随清军进抵拉萨。^82 此役之后，土兵被招募来充实川藏大道沿线新设的哨所。这是维持清朝在这一新领地军事存在的划算办法。^83</p>\n<p>雍正年间，把青海（Kokonor）与西南土司领地并入的战役，使更多土兵武装处于清朝庇护之下。其中一些族群士兵被编入地方驻防；其头目被授以绿营官衔，但加\"土\"字前缀，如\"土游击\"\"土把总\"。他们被用于镇压当地族群起事的战役，但很少被调出家乡地区。乾隆年间，金川地区的嘉绒士兵被征召参加两次金川之役。1765至1770年间，云南边境的土兵被招募参加清朝对缅甸的入侵。土兵出动时通常领饷，但标准总低于旗兵与绿营兵，^84 尽管皇帝不时随兴赏赐他们。</p>\n<p>征募族群士兵参加边疆战争虽已成为清朝向西、向西南扩张的固定做法，国家却直到《军需则例》才试图把这一做法制度化——则例包含了对参战土兵补偿的具体规则。土兵如今有权获得旗兵与绿营兵几十年来所领的几乎所有战时津贴与犒赏，尽管部分福利的标准降低。口粮与\"盐菜银\"，他们按绿营兵的标准领取（前者每日八合三勺，后者每月一两三钱）。^85 土兵待遇的显著提升，标志着清朝军事战略中一个重要而微妙的变化。清朝不再把他们当作维持家乡秩序方便而廉价的工具，而是可以拿他们当雇佣兵用了。鉴于他们的战斗力与耐力常常超过包括旗兵在内的正规军，即使补偿提高，用他们打仗仍比部署正规军划算。</p>\n<p>确实，18世纪最后二十年里，土兵更多地被调遣，常常离开家乡地区。以勇猛著称的嘉绒士兵在此期间一再被征调。第二次金川之役后，数千名归顺的嘉绒士兵被编入金川设立的军屯。他们由国家发饷，被称为\"屯番\"（tunfan）。^86 18世纪80年代初，他们被派往甘肃镇压两场回民起义。几年后，他们被派往台湾镇压林爽文起义。紧接着，金川兵又参加了平定越南叛乱的战役。1792年清朝最后一次远疆战争——入侵廓尔喀王国——中，乾隆皇帝不愿远调满洲兵与绿营兵。结果，嘉绒与藏兵占所调一万五千至一万六千名军队的一半；只有一千一百名旗兵（巴图鲁一百名、索伦兵一千名）从满洲派出。^87 在所有那些战争中，嘉绒兵都证明了自身的价值，尽管他们有时难以适应当地条件。乾隆为他们的勇猛所动，称赞他们，授衔赏物。^88</p>\n<p>乾隆—嘉庆交接之际，这一做法延续下来。镇压苗民起义的战役中，贵州的仡佬人被征募。^89 白莲教战争中，多种族群士兵被调遣。在鄂西南，毕兹卡士兵被用来攻打长阳的叛军。^90 1797年春，时任陕西按察使的倭什布指示西安的几位穆斯林头人挑选三百名精壮穆斯林，送他们加入清军。倭什布本打算雇更多穆斯林，但乾隆反对从西安穆斯林社群中雇太多。^91 川西的嘉绒与藏兵多次被调遣。第一次是1797年初，绰斯甲的土兵被派往达州。^92 1799年，勒保在他被罢免前不久征调了四百五十名金川兵。那些金川兵被额勒登保带走，追随他约一年，1800年秋被遣返。^93 1799年底，阿迪斯调了两百名金川土兵，把他们带到大宁。^94 叛军渡嘉陵江之后，魁伦下令调三千六百名川西土兵，尽管实际有多少到达前线不清楚。^95 人数虽少，嘉绒与藏兵却备受珍视；他们与吉林来的索伦兵一道，被称赞为最有效的兵员。^96</p>\n<p>一次新的经验是调遣甘肃循化厅的撒拉族穆斯林士兵。他们虽然被清朝用于几场本地战役——包括镇压两场回民起义——撒拉兵此前从未被调出家乡。^97 1797年春，襄阳叛军经陕西入川时，宜绵在达州除其他援军外，调了两千名撒拉兵入陕。将领们焦急地等待着那些撒拉兵。然而，他们直到夏末才到；署理陕甘总督陆有仁因延误被归咎而遭罢免。^98 然而，延误暗示撒拉一方有所抵制。到达后，由\"土游击\"韩光祖率领的撒拉兵立即被派往四川，随后被明亮带往湖北追击襄阳叛军。他们作战勇猛，尤其擅长山地行动。然而，据说他们桀骜难管，造成纪律问题。同时，不适应中原炎热的夏天（循化几乎全年气候宜人），许多人染病，死亡四百多人，包括韩光祖本人。1798年初，远征的余部被送回循化。^99</p>\n<p>1799年春末，两股叛军——蓝号与白号——从四川逼近甘肃南境时，撒拉兵再次被调遣。从官方档案拼合的故事如下：撒拉头目韩四个一再请求赴前线，攻打侵入其本省的叛军。韩四个对撒拉兵前一年的提前返回感到懊悔，立誓这次要挽回声誉。鉴于他们过去的桀骜，广厚拒绝了他的请求。然而，韩四个与其子韩三个率领一队撒拉兵自行开赴前线。得知此事，广厚与松筠都派官员——包括一名穆斯林专家——护送他们。五月中旬，四百九十八名撒拉兵——而不是韩四个所称的一千名——到达广厚大营，参加了阶州之战。^100</p>\n<p>撒拉人是否真的自愿参战无法确知，但到达前线的撒拉兵不足五百这一事实，透露出故事中的裂痕。更可能的是：广厚与松筠怀疑嘉庆未必批准调遣，便造成既成事实。嘉庆向回京改任的陆有仁询问之后，认可了这次调遣——因为这次是为\"保卫本省\"。但他指示松筠与恒瑞认真管束、慷慨犒赏。事实上，松筠与广厚都已赏他们银两，并报销了韩四个垫付的旅费。1799年夏甘肃肃清叛军后，嘉庆命广厚暂时留用他们，并因韩四个及其他撒拉头目作战有功、纪律良好，授他们低阶绿营军官顶戴——尽管广厚已经用银钱与羊、茶等礼物赏过他们。^101</p>\n<p>据说，撒拉人表示愿意暂留，但表示不愿被派往陕西、四川——在那里容易染病。广厚派一名熟悉撒拉事务的地方官员监督他们。^102 数月后，九月，韩四个去见广厚，以甘肃秦州、徽州气候湿热、许多士兵染病为由请求返乡。请求先经广厚、再经朝廷批准；广厚备了盘缠、安排了食宿护送。^103 然而，他们的返程被耽搁了——松筠命他们赶赴陕南守卫汉江。十月初撒拉兵到达汉中时，松筠会见了他们，赏了冬衣冬帽。由于他要前往汉江更远的上游河谷，松筠让被押解来受审的庆成率领那些撒拉兵。^104</p>\n<p>嘉庆对松筠的安排极为恼怒。其一，他认为在已向陕西派了其他援军的情况下，违背撒拉兵意愿强行动员这批桀骜之师并不明智。其二，更重要的是，嘉庆认为让庆成——一个正在受查的罢职官员——率领他们尤其不可接受，因为撒拉兵会轻视庆成。然而，撒拉人既已到陕，嘉庆没有命他们撤回。相反，他告诫不得强迫他们作战，并指示：一旦可能就送他们回家。^105 接到嘉庆的谕旨，松筠立即把撒拉兵召回汉中，随后派官员护送他们回循化。嘉庆再次被松筠的反应激怒，斥责他前后不一。此事进一步败坏了嘉庆对松筠本已日益负面的印象；松筠不久就被罢免了。为安抚撒拉人，他们平安到家后，嘉庆赏了他们银钱礼物，并蠲免了他们所欠的三千两银子。^106</p>\n<p>1800年初，广厚还从西南蒙古调了七百名阿拉善蒙古兵入甘，但嘉庆命他们立即返回，并责备了广厚。^107 唯恐触动西北边疆新的动荡——那里族群间的仇隙并不罕见——乾隆与嘉庆在使用该地区族群士兵上一直谨慎。^108 在战役漫长的收尾阶段，清朝没有再调遣族群士兵。</p>\n<p>与受雇乡勇不同，族群士兵是作为帝国的臣服成员被征召参战的。一旦出动，他们就处于严密监视之下——包括往返前线的途中——尽管他们获得慷慨的补偿与犒赏。过去曾发生过土兵武装一时为清帝国而战、一时又反清而战的情形。有时，他们与清朝边疆官员的关系是其顺从与效力的一个因素。^109 因此，族群士兵是另一类对清朝构成两难的非常规兵员；他们既是宝贵的士兵，又是潜在的麻烦制造者。白莲教战争中，他们人数不多，大多数早早遣返。然而，他们并非孤例，而是延续到19世纪的清朝军事战略变化的一个指标。</p>\n<h2>\"坚壁清野\"</h2>\n<p>关于白莲教战争的另一个广为流传的陈词滥调，是\"坚壁清野\"（jianbi qingye）之策的神奇效果。断言是：直到战区平民筑起堡寨、藏好粮食、家畜与其他财物，使叛军断了给养，叛乱才被扑灭。关于此策的始作俑者，有两种说法。一种推龚景瀚——陕西知府，1797年撰文倡导此策。^110 他的一些传记声称，他的建议被采纳，成为镇压叛军的关键。这一说法被20世纪的史家们所呼应。^111 另一种说法不如龚景瀚的出名，把勒保当作此策的发明者。然而，战争档案揭示的是另一种图景，不支持二者中的任何一个是此策的发起者。</p>\n<p>事实上，动荡时期在山顶筑堡以庇护民众及其财物，是源远流长的做法，远在这场叛乱之前就已使用。它在中原尤为普遍——那里众多山脉为设防提供了最佳条件。蒙古征服与明清易代期间，平民在秦岭、大巴山与武当山区修筑了众多堡寨——这些山脉在白莲教战争期间全都成了战场。^112 所谓的堡（baozhai或zhaibao）基本上是山顶或其他险要处的石墙。墙内为各家各户建有小屋与储物间；大堡可容纳数千户。堡通常有具体名称——或以所在之地命名，如\"五峰寨\"（Wufengzhai）；或以创建者命名，如\"王家寨\"（Wangjiazhai）；或取吉祥之意，如\"天保寨\"（Tianbaozhai）。白莲教战争时，其中一些堡仍可使用，尤其在川东。^113</p>\n<p>白莲教战争中，筑堡始于湖北。1797年春，襄阳南山的居民登上山顶，筑墙、搭草棚、掘壕。每座山顶堡寨庇护数百至数千户。只用刀矛守堡的居民无力与叛军作战。相反，叛军逼近堡寨索取给养时，他们把粮食牲口给了叛军。应平民之请，惠龄派一名千总率二十名士兵到每座堡寨帮助他们。^114 同年秋天，姚、王队伍返回湖北、企图夺取襄阳时，襄阳人梁友谷——一位在家养病的广西知县——与其子在襄阳城附近的城哨渡发起筑堡，据说庇护了十万多人。梁氏父子还组织乡勇守卫堡寨周围的关卡。^115 幸运的是，明亮与德楞泰很快把姚、王队伍逐离襄阳一带，秩序得以恢复。</p>\n<p>然而，梁氏父子的义举启发了两位将领。赴陕追击叛军途中，明亮与德楞泰上奏朝廷，建议在大城镇与乡村都建立设防聚落，每处可容纳几十个村庄——包括散居附近地区的住户——合计三四万人。他们计划每处派几名官员——由士绅与耆老协助——主持，从每户招募\"壮丁\"，并从难民中雇乡勇守卫。这样，叛军的物资与人力补给都会被切断，居民中的少数教门中人也能置于监视之下。乾隆虽然承认其动议有某些价值，却担心筑堡与迁移会给已受动荡折磨的百姓增加负担。他斥此计划\"窒碍难行\"，批评两位将领越权干预民政，给了他们\"严旨申饬\"。明亮与德楞泰虽已指示汪新与秦承恩在鄂西北与陕东南着手此事，乾隆的不以为然显然使这第一次筑堡呼吁搁浅。^116 然而，在饱受战乱的地方，平民继续筑堡自保，有时从省到县的官员也主动或干预其事。^117</p>\n<p>乾隆驾崩后，嘉庆皇帝对筑堡表现出的前后不一，与他对乡勇的态度并无二致——下文将述。1799年初，一个名叫李积的平民向朝廷呈上三篇关于镇压战役的策论。李积的建议迂阔，复述民间兵书中的陈词滥调，包括并小村为大村。军机处斥其\"窒碍难行\"，全部驳回。^118 直到松筠倡导，嘉庆政府才对筑堡产生兴趣。1799年春末到陕后，松筠大力推动筑堡，认为这是粉碎叛军的关键措施。他认为起事者没有多大潜力，建议组织堡中居民与之作战，以早日取得最后胜利，并奖赏杀贼擒首者。^119 不久，六月初三日，嘉庆向勒保、松筠与吴熊光颁发谕旨，号召在四川、陕西与河南实行\"坚壁清野\"——他使用了这个说法（此时湖北已无起事者）。他说，他受湖北一个故事的启发：襄阳叛军经过随州时，当地居民掘深壕、筑土墙守卫村庄，得以免遭蹂躏。他说，筑堡\"乃守御良法，行之有效\"（原文待核，见注释120），号召凡条件许可之处皆筑堡。^120 官修战役方略的编纂者们称赞嘉庆的决定，称此谕是对叛军取得最后胜利的关键因素：\"此后三省筑堡，大有成效，遂以坚壁清野之法，扫荡数十万强悍之贼。\"（原文待核，见注释121）^121</p>\n<p>如果单独看这道谕旨，它确实支持编纂者们\"嘉庆应被推为此策发起者\"的说法。然而，并不罕见地，嘉庆很快就对此表示怀疑。数月后，十月，那彦成动议：命秦岭山区居民筑墙建堡、掘壕——因为军队不足以守卫广大山区的所有通道，此举也有助于防止新的起事。^122 嘉庆除对此策将信将疑外，还责备那彦成越权——令人想起两年前乾隆对明亮、德楞泰动议的反应：\"至于筑堡掘壕之法，虽为御贼之计，然贼若拼死狂奔，虽峻岭平原亦不能阻，区区壕堑岂能御之？此事由地方官办理则可，将领仍当以剿贼为正务。\"</p>\n<p>勿为此分心。\"（原文待核，见注释123）^123 大约同时，嘉庆还否掉了明兴的一项提议。明兴主持开县城防半年，他建议：订立规章，支持四川居民自发的筑堡；以授衔、赏赐与伤亡抚恤调动乡勇守堡；每堡派一名低级军官与几名士兵协助御贼。但嘉庆认为他的主意\"无益\"、\"劳民\"，并说没有足够的兵可以派往所有这些地方。^124</p>\n<p>然而，不到一个月，嘉庆就转变了态度。1799年底，他对最后胜利更乐观时，对筑堡也热忱起来，称之为削弱起事者的\"最佳办法\"。他指示额勒登保与那彦成鼓励民众筑堡，尽管他并不指望他们参战。^125 然而，不久，又以战争已近尾声为由，他告诉新任陕甘总督长麟：不必过分强调筑堡。^126 1800年春末，嘉庆否掉了台布\"在栈道地区建大堡、让平民在堡内自建住房\"的倡议，称\"非目前急务\"——因为起事者远离陕西西部。他对台布倾向动用军费搞这个工程也不满——台布承诺资助较贫者。^127 直到1800年夏，嘉庆试图赶在冬天前完成战争的新期限时，他才称赞四川的筑堡，敦促陕西效法四川筑堡、组织乡勇守堡。^128</p>\n<p>尽管朝廷的指示自相矛盾，松筠仍在陕甘主持筑堡。他鼓励订立规章，指示地方官员帮助居民选址，提供设备、技术与信息。^129 那彦成与台布到任后，都分享了松筠的热忱。作为陕西巡抚，台布把筑堡列为他的优先事项之一，一年的任期内常在奏折中讨论。尽管嘉庆如前所述并不赞成，那彦成仍敦促秦岭山区居民筑堡，尤其在五郎、孝义与镇安——镇安的一些堡寨至今可见。^130 松筠与台布的继任者长麟与陆有仁继续了这项工作。^131 在甘肃东南部，广厚主持下修筑了许多储粮堡寨，但1800年夏末高马股与伍家营离开本省后，甘肃大体太平。^132</p>\n<p>然而，陕西的筑堡从未成功。没有经费拨给这项工程，地方官员既无手段也无动力实施，当地居民也不热心。台布主持时，设法让一些富户与地方官为筑堡工程出钱，但不受欢迎。到1801年初，陕南干道沿线与汉江以南，以及西安、同州、凤翔各府——通常的战乱范围之外——修了一些堡，但五郎以西的秦岭山区——人口稀少，却是各股起事者常出没之地——几乎没修。^133 更具体地说，山中众多厂坊的厂主不愿参加筑堡。因此，那些厂坊为雇工——大多是所谓的棚民，每个厂坊常有数百人——储存的大量给养，仍可能落入起事者之手。^134 1801年初，陆有仁提议：强迫山中散居人家迁出，由地方官员安置他们，使叛军失去这一补给来源。嘉庆坚决反对——居民会流离失所，衙门的书吏差役则有机会骚扰勒索他们。他质问陆有仁：安置难民已属不易，他如何安置这些人？并告诫：如果安置不当，流离的山民会加入起事者。他给了陆有仁一个\"所奏无益\"的申饬。^135</p>\n<p>在湖北，省级当局直到1800年姜晟出任总督才开始推动筑堡。然而，省里没有余钱支持这项工程，进展缓慢；姜晟估计，鄂西只有约一半居民响应筑堡号召。在西北边境地区，郧西与竹山的堡寨尚属可用——多亏那里两位能干的知县孔继干与范继昌——但竹溪漏洞很多，因为它与陕川的边境漫长。^136 1801年初接替姜晟的书麟似乎对筑堡并不热心，尽管他拨了些钱，并责成地方官员监督工程（他还打算把小堡居民迁入大堡）。然而，据书麟说，人口稀少的地区难以施行。^137 1801年中吴熊光接手时，注意到郧阳府几乎没修什么堡。^138 一年后，吴熊光再次表达对这项工程的悲观，说：郧阳与宜昌的许多居民是佃种山坡地为生的移民，筑不起堡，而政府又无钱支持。^139</p>\n<p>战场诸省中，四川在筑堡上最为突出——主要是因为那里留存着大量旧堡，称为\"山寨\"（shanzhai）或\"寨洞\"（zhaidong）。四川乡民不住村庄，而在田边建屋，因此易受叛军袭击劫掠。战争之初，他们就登上山顶，或利用旧堡，或建新堡。^140 到1798年底，许多居民已据山自固，把粮食家当搬进堡中。有些堡可容纳一万多人。为守堡，居民组织了乡勇，推选了头目。^141 正如魁伦1800年初所奏报的，筑堡使叛军更难获取给养，以致他们不得不前往陕西、湖北。魁伦虽试图炫耀自己在鼓励筑堡上的努力，却也承认：大而设防完善的堡能保住居民的生命财产，小堡中的居民却不敢与叛军作战，只能抛出粮食打发他们，或与之交易。他还抱怨：当局如今很难雇到精壮乡勇——他们得守自己的堡了。^142</p>\n<p>到1800年底，四川只剩几百名起事者，退入与陕鄂交界的山区。四川大体太平，嘉庆接受了\"四川民众自发的筑堡使叛军无法立足、不得不转往湖北或陕西\"的看法。他一再称赞四川，批评陕西筑堡与组织乡勇不力。随后他动了\"把各股起事者全部赶入四川围歼\"的念头。^143 因此，1801与1802年间，嘉庆不断催促陕西与湖北加强筑堡，准备从外地调能干的知府知县来迎接挑战——如果本地官员不胜任的话。他甚至命陕西在秦岭各山口掘壕断路——这正是那彦成一年前所建议、被他斥责过的。^144 长麟提出担心：太平恢复后，堡中武器会成为安全隐患，建议登记造册以便战后裁军；嘉庆同意其见，却不认可这项提议——唯恐激起新的动荡。相反，他告诫长麟把此意藏在心里，同时悄悄控制武器。^145 唯一从未在筑堡上花力气的省是河南——因为吴熊光任河南巡抚时说服了嘉庆：豫西南边境居民太少，难以施行。^146</p>\n<p>随着皇帝越来越相信筑堡的好处、并坚持不懈地推动实施，他有时也忍不住纳闷：胜利在望，还有没有时间做。^147 然而，将领们各有盘算。如第4、5章所述，额勒登保自1800年底起更加消极。他不设法迅速围剿最后的叛军，只是嘴上敷衍。1801年初，额勒登保大谈把所有叛军逼到一处、一鼓聚歼，同时在川陕鄂三省筑堡。他建议从外省挑选地方官主持工程，好让所有战场省份在数月内完成设防。^148 此后数月，额勒登保继续用筑堡作为了结最后叛军进展迟缓的借口之一，尽管嘉庆对战役的迁延沮丧。^149 最终，1803年初额勒登保提出\"以筑堡工程代赈、安置难民与遣散乡勇\"的方案时，愤怒的皇帝倾泻了大堆严斥。除批评额勒登保用此方案为自己拖延时间外，嘉庆再次对设防聚落的效用表示怀疑——叛军从未试图攻取城镇，而居民迁入聚落后，却把家园田地丢给了叛军。^150</p>\n<p>总之，战争中筑堡起初是对动荡的临时反应，战争早期是一场草根运动。据吴熊光说，一些人躲进堡寨，讽刺的是，是为了逃避清军与乡勇的骚扰劫掠——他们以缺乏纪律臭名昭著。^151 几位战争领导人认识到它有助于军事行动，倡导筑堡。1799年以来，松筠、台布与那彦成认真努力在陕西推广这一做法，尽管没有达到最佳效果。与\"此策直到战役后期才被采纳、一旦采纳叛乱即被平定\"的流行看法相反，筑堡几乎伴随了整个战役。嘉庆到1799年中正式号召采纳此策。尽管摇摆不定——这与他主持战役的风格一脉相承——1800年之后，嘉庆推动此策变得坚定不移。然而，战役几年之后才告结束，这反驳了此策的神奇效果。</p>\n<p>筑堡之策主要旨在断叛军补给，对与叛军作战并无多少实质帮助。^152 只在1802年开始的战役最后阶段，平民才鼓起勇气走出堡寨，擒捕零星的起事者。^153 然而，筑堡并没有完全断绝起事者的给养。为获取粮食与其他必需品，叛军袭击清军运输队、破堡、或冲击当地集市。^154 更常见的是，他们威胁攻打堡寨——尤其是小堡——勒索给养。堡内没有水源者，无法承受围困。为换取安全，平民通常抛出粮食或卖给叛军——尤其在四川。有时叛军甚至试图与堡中居民达成互不伤害的交易。^155 堡民下山赶集、营生、下田时，起事者就有机会劫掠他们，或把他们从堡中绑去勒索赎金——这在叛军人数已很少的最后阶段甚至都发生过。^156 对民众向叛军抛粮深恶痛绝，嘉庆指示官员劝诫他们不要这样做，尽管他无意为此惩罚他们。^157 但劝诫无效。1800年初，额勒登保描述了四川的情形：</p>\n<blockquote>\n<p>各厅州县民人自筑之堡，大堡可保身家，小堡不能抵御[贼攻]。虽有以公事为先、杀贼擒贼者，究属少数……坚壁清野之法，徒为纸上良策。然民人须求生计，不能一日废贸。虽于山中筑堡，仍须下山耕作。贼猝至，仍被裹掠。勒保与臣屡次出示晓谕，仍不能禁。至于抛粮与贼，臣每遇一处即当面劝诫。但小堡居民总以恐堡被毁为辞。故此陋习终不能除。^158</p>\n<p>[译者按：原奏自英文直译，文言原文待核，见注释158。]</p>\n</blockquote>\n<p>到1800年底，据一些叛军所报，由于在四川难以获取给养，几股叛军曾试图移往湖北或陕西。这固然可以被当作四川筑堡成功的证据，但吴熊光在1800年春末指出：川东北的粮荒主要应归因于多年战乱对农业的破坏。^159 事实上，叛军在陕南也难以获取粮食——那里1800年筑堡并未充分实施。^160 随后，1801年，一些起事者又回了四川——这证明筑堡并没有使四川无法立足。他们的移动主要受自身战略目标与清军压力支配。^161</p>\n<p>整个战役期间，此策只有前半部分——\"坚壁\"——被采纳；\"清野\"很少受到关注。平民迁入堡寨时，带走了可动的家当，却无法把田地围起来。收获季节，叛军可以轻易劫掠田地与晒场上的庄稼；清方很少采取任何措施阻止。^162 1801年初，嘉庆批评陕甘川鄂四省督抚没有认真\"清野\"。他还斥责地方官与将领们：总是把自己关在城墙之内，听任叛军劫掠焚烧集市村庄、裹挟百姓以补充损耗的队伍。^163 即使筑堡实施之后，也不可能把所有乡民都圈进堡寨。在广阔的大巴山与秦岭中尤其困难——那里居民分散，常常轻易被叛军劫掠。^164 从1800年起，大多数叛军股团大幅缩减，他们的生存反而更容易了——他们不再需要大量给养。有些人在山中密林里靠野生动植物生活了数月。知道荒野中的植被为起事者提供了天然补给，每年春天嘉庆都哀叹：起事者又有办法活下去了，至少再活一年。</p>\n<p>战役档案中没有记录支持\"筑堡始于龚景瀚1797年之文\"的说法。龚景瀚是福建人，家族几代出知县知府。1784年他任甘肃平凉知县，1792年短暂署理循化同知。在循化近十年的任期内，龚景瀚主持了对撒拉人的民族学研究，协助编纂了循化第一部方志《循化厅志》——这是关于撒拉人及其与清朝关系的重要史料。1796年初，他以陕西彬州直隶州知州的身份，因有效查办洛南教众而赢得宜绵的注意。龚景瀚随后被招入宜绵幕府，1797年初随宜绵入川。返回陕西后，龚景瀚留驻陕南，直到1800年赴兰州任新职。两年后，他去世了。^165 战争期间，龚景瀚是个不起眼的人物。整个战役期间，战争领导层上层没有任何人在奏折中提及他的想法——包括他的恩主宜绵与宜绵的继任者松筠。关于龚景瀚的记录，只有宜绵为他请功请赏的几道奏折，但没有一次是因他对战役的建议。^166 龚景瀚很可能是战后时代同侪们反思这场动荡时被称颂为\"儒臣谋士\"的，战役期间却几乎毫无影响。</p>\n<p>档案同样没有证实勒保\"此策发起人\"的说法。第一次任四川总督期间，勒保在往往冗长的奏折中很少提到筑堡。鉴于他特别善于揽功，如果他确实发起了此策，他不会忽视它。1799年初，勒保在被任命为经略大臣后的第一道奏折中说：他将指示各地百姓把粮食藏入\"山寨\"、到那里藏身——这是他为加快战役所计划的事项之一。^167 这里勒保显然指的是利用现存的堡寨；这段话读不出他曾在四川努力实施筑堡。1799年夏——他被罢免逮捕前不久——勒保又奏报说：他已指示地方官员敦促民众上山\"聚险扎寨、团聚而居\"（juxianzhazhai tuanjuerju），为聚落订立规章、推选头目，并供给他们一些武器。^168 这似乎就是他在此事上的全部作为。由于没听到多少四川筑堡的消息，勒保被清除后，嘉庆不得不于1799年秋查问此事。^169 出狱回川后，勒保对自己在筑堡上的努力仍少有奏报，只在1800年夏提到他把小堡居民并入了大堡。^170 直到1800年底嘉庆热衷于筑堡——一再提到四川筑堡实施得如此周密、以致叛军离开四川去了湖北或陕西——勒保才在1801年初的一道奏折中宣称：他1798年就在四川开始筑堡，1800年他与德楞泰又作了更多努力，敦促民众筑堡、并巡视各堡。然而，他承认四川的\"地形\"是一大便利——这暗指叛乱爆发时许多堡寨已经存在。^171</p>\n<p>此外，为三次胜利所颁的谕旨，都没有提到勒保在四川实施筑堡的贡献，也没有把它指为镇压叛军的关键。这条说法直到1805年初夏——最后胜利宣布八个月后、嘉庆召见勒保之后（德楞泰与额勒登保已分别于1803、1804年陛见）——才铸造出来。召见一周后，五月二十五日，嘉庆颁发谕旨，把勒保的世职从太子少保升为太子太保，理由是他最先号召四川百姓实行\"坚壁清野\"之策，而这成了三省最终彻底肃清叛军的原因。^172 尽管战役期间频繁而尖刻地批评勒保，嘉庆愿意翻篇。他既不想让勒保为四川蒸发掉的军费负责，也允许勒保保住四川总督之位。因此，粉饰勒保在这场多次激怒皇帝的战役中的表现，只是政治上的需要。最可能是：召见时，勒保向皇帝提醒了自己这件\"可嘉\"的事迹，并灌输\"这是战役成功关键\"的想法。^173 随后，勒保写了一篇八千字的纪略《平定教匪纪事》（Pingding jiaofei jishi）。文中他把自己塑造为\"坚壁清野\"之策的发明者，试图就此定格：他是白莲教战争胜利的重要贡献者。^174</p>\n<h2>夭折的改革</h2>\n<p>与数十万受雇乡勇相比，战争中部署的正规军是少数。旗兵更是那些正规军中的一小部分。鉴于乾隆\"对内乱之战不应像边疆战争那样从北京与满洲大规模调遣精锐旗兵\"的新学说，整个战争期间，绿营兵是主要的正规力量。总计超过十万名绿营兵从五个战场省份——湖北、陕西、四川、河南、甘肃——以及其他省份如江西、广东、广西、云南、贵州、湖南、山东、山西与直隶调来。^175 任何时候，三个主要战场通常各有兵一万至三万。整个战争期间，从北京与满洲分批调来的旗兵只有九千五百名（包括两千来名索伦兵）（表6.1），此外还有西安、成都、荆州驻防的数千名旗兵。</p>\n<p><strong>表6.1　北方旗兵的调遣</strong></p>\n<table>\n<thead>\n<tr>\n<th>调遣时间</th>\n<th>人数</th>\n<th>原驻地</th>\n<th>返回时间</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1796年秋</td>\n<td>2,000</td>\n<td>北京</td>\n<td>1799年夏</td>\n</tr>\n<tr>\n<td>1797年夏</td>\n<td>3,000</td>\n<td>吉林、黑龙江</td>\n<td>1801年秋</td>\n</tr>\n<tr>\n<td>1799年夏</td>\n<td>2,000</td>\n<td>盛京</td>\n<td>1801年秋</td>\n</tr>\n<tr>\n<td>1799年夏</td>\n<td>1,000*</td>\n<td>吉林</td>\n<td>1801年秋</td>\n</tr>\n<tr>\n<td>1800年夏</td>\n<td>1,500</td>\n<td>吉林、黑龙江</td>\n<td>1802年秋至1803年初</td>\n</tr>\n<tr>\n<td>总计</td>\n<td>9,500</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>起初调遣两千名，其中黑龙江的一千名被取消。</li>\n</ul>\n<p>战争头三年，乾隆两次派了五千名满洲兵。尽管前线大声而反复地恳请旗兵增援，乾隆直到1796年秋——明亮调往苗疆战役使湖北战场出现空缺时——才派了第一批两千名北京旗兵。那两千人来自北京的两支精锐营：健锐营与火器营。第二次调遣发生在1797年夏末——姚、王队伍返回湖北、威胁襄阳之时。这一次乾隆向湖北派了三千名旗兵（吉林一千、黑龙江两千）。嘉庆接手后，命从三个满洲地区调兵三次。1799年夏末，勒保把第一批北京旗兵大部分送回后不久，嘉庆从盛京调了两千名旗兵，随后又从吉林、黑龙江调两千名（但黑龙江的一千名被留下）。1800年夏，嘉庆命最后一次调遣——从吉林、黑龙江调一千五百名旗兵，替换先前部署中伤病者。</p>\n<p>正如乾隆所坚持的：精锐满洲部队本不该用于镇压内部叛乱；即便不得不调，也不应在战争中滞留过久——延长部署会被视为无能的表现，玷污满洲\"不可战胜\"的名声，损害王朝的威望。^176 如表6.1所示，九千五百名旗兵中的大多数只部署了两三年。1801年深秋，经额勒登保之请，满洲来的旗兵大多被遣返。^177 1802年秋，苟文明刚被杀，额勒登保就送回七百五十名满洲旗兵，留下七百五十名（盛京一百五十、吉林三百、黑龙江三百）与六十多名旗军军官在陕西清剿。^178 剩余旗兵继续被送回；最后数百名吉林、黑龙江旗兵于1803年夏——第二次胜利宣布前不久——撤出。^179 被部署的旗兵大多获得升迁、巴图鲁等名号与众多赏赐礼物。回乡时，他们带走一车车的战利品，有些人还带走战争孤儿。</p>\n<p>按比例而言，旗兵的伤亡很轻。约二十名高级汉族军官丧命，高级旗人却很少阵亡。其一是惠伦——明瑞的养子、1797年吉林黑龙江调兵的特领之一。到达湖北前线才数日，惠伦就在与襄阳叛军的战斗中阵亡。另一位阵亡的高级旗人是安禄——海兰察之子，1799年底在川北被杀。两次，皇帝都动情地表达了悲痛。正如乾隆所解释的：与东突厥斯坦、金川、缅甸、安南、尼泊尔等边疆战争——那里敌军由各自的大首领统领——相比，在与乌合之众的教门叛军作战中失去宝贵的旗兵——更不用说贵族旗兵——是极不值得的。担心别国听说\"显赫旗军将领的后嗣竟不能消灭可憎的起事者、反被后者杀死\"后会轻视大清，安禄死后，嘉庆命：旗兵不再分散于绿营单位中，而单独成队，只在适当时机使用。^180 此后战争余下的时间里，惠伦与安禄之死一直提醒着人们：乾隆\"边疆战争之外少用旗兵\"学说的正确性。^181 1803年初，穆克登布在川北与几十名叛军残部的一场小规模战斗中阵亡时，嘉庆再次认为这太\"不值\"。^182</p>\n<p>傲慢言辞的表象背后，有两个因素很突出。其一，18世纪80年代初《军需则例》颁布后，从满洲或北京调遣旗兵变得更加昂贵、更加费力。除旗兵所享的优厚战时津贴外，《军需则例》还</p>\n<p>规定：每个普通旗兵配三匹马，每三名旗兵配一头骆驼；军官配得更多（将军每人配二十四五匹马、五头骆驼）。^183 为满足这一要求，每次调遣旗兵，都得动员数省供马，还要供给草料、马具、临时马厩与马夫。由于湖北、河南、四川不大量养马，白莲教战争中调遣旗兵时，督抚们弄到足够的马是个挑战。1797年秋，从吉林、黑龙江调遣三千名旗兵时，还从官马厩为他们调了八千匹战马。但这是国家最后一次能做到——马厩里可调的马已不多了。此后几年，每次调遣旗兵都给战区省级官员带来巨大挑战——他们不得不从几个不同来源拼凑足够的马匹：先调当地驻防的马，再买马补缺。^184 万不得已时，他们直接从战区内外的地方市场买马。结果，马价被大幅推高。1800年，魁伦请求中枢政府允许四川后勤按每匹十二两的价格买马——这违反了规则，因为《军需则例》规定每匹八两。嘉庆不得不批准。^185 然而，旗兵仍常常缺马。1799年底，嘉庆指示湖北：不必给每名旗兵配三匹马。^186 结果每人只领到一匹。正如吴熊光1801年所奏报的，湖北的满洲旗兵只有百分之四五十有马。最终，骡子被混进来装备湖北的旗兵与绿营骑兵。^187</p>\n<p>其二，除索伦兵外，旗兵未必是更优秀的战士。^188 战役早期，一些旗军将领与部队作战勇猛——如明亮与恒瑞率领的、主要由西安驻防旗兵组成的军团——但从北方调来的却没有名实相符。^189 战争头几年，战役统帅们一次又一次地奏请调旗兵上前线，指望大批旗兵的到来能最终解救他们。然而，随着战争推进，他们不再热衷于请调，反而急于送走已部署的满洲兵。从健锐营与火器营来的两千名旗兵到川后，大多数在开县城里闲度数月。他们占住民房、茶馆、酒楼，饮酒唱曲、喧哗扰民，同时领取战时津贴与犒赏。1798年底被派去攻打冷天禄时，他们迟迟到不了前线。正如勒保所抱怨的，他们吃不了在川北山地行军作战的苦。请求遣返他们时，勒保说：除浪费经费外，他担心他们留在战区无所事事，会被绿营兵瞧不起。1799年夏，那些旗兵奉嘉庆之命返回北京。^190 1799年，明兴及其来自成都驻防的六百名旗兵也在开城县城里驻扎数月，叛军数次逼近也不出城应战。正如明兴自己所承认的，他的兵力太小，无法作战。^191 到1800年初，1797年从满洲调来的三千名旗兵中，只有约一半活跃在前线，其余或留在某处养伤治病，或因伤残被送回家，另有少数死亡。伤病很可能只是逃避作战或逃避徒步进山的借口——旗兵以厌恶徒步行军臭名昭著。^192 正如那彦成所抱怨的，绿营兵与旗兵都不太顶用。^193</p>\n<p>事实上，对大多为满蒙旗人的前线将领们来说，部队里旗兵太多并不方便——因为克扣或削减旗兵的饷银更难。相反，绿营兵与乡勇是侵吞饷银犒赏的容易目标——这两个群体比精锐旗兵处境不利得多。绿营军官长期普遍虚悬名缺以吞空饷，白莲教战争期间，外省调来的绿营兵实际人数常常远低于纸面人数——这对朝廷不是秘密。^194 到达前线者中，逃亡司空见惯。^195 与旗兵一样，众多绿营兵留在城镇村庄养伤治病，痊愈后不归队，有些人甚至变卖了装备。结果，据额勒登保说，到1800年初，绿营人员一半以上成了\"病废\"。^196</p>\n<p>结果，受雇乡勇成了战役的主要作战力量。然而，过度使用平民从一开始就受到挑战。1796年春末，鄂辉表达了担忧：教门中人可能伪装身份混入乡勇，实则替叛军做事。^197 秦承恩曾暗示：陕西的乡勇可能借机滥杀无辜以报私仇。^198 更有力的批评来自明亮。1796年夏孝感速胜——他只用了正规军，尽管当地招募了大量乡勇——之后，明亮抱怨乡勇纪律涣散得可悲，担心其中一些人可能私下与叛军有联系，并害怕战役结束后他们会成为麻烦制造者：</p>\n<blockquote>\n<p>地方官仓促招募[乡勇]，以为多多益善，于是众多无家流民、老幼充斥其间。加之教匪传教四方，网络广泛，难以察觉。因此，无法确保乡勇中无怀二心之人，也无法辨别良莠——莠者或伪装其间……即便良善村民，持矛挽弓数月之后，也已弃本业而习于杀戮，且以领饷领粮为乐。上司可以赏赐激励他们，却无法管束他们。[臣]恐战后安置稍有疏忽，他们就会酿成更多祸患。^199</p>\n<p>[译者按：原奏自英文直译，文言原文待核，见注释199。]</p>\n</blockquote>\n<p>于是，明亮请求解散孝感的乡勇。他建议给所有乡勇发赏，并为庄稼房屋被毁者提供安家之本。^200 乾隆虽似赞同明亮的所有警告，却不愿放弃这个权宜之计：\"明亮所言甚是。但如今正赖乡勇剿贼。若露出一丝疑心，他们必生疑虑恐惧，事态就严重了……待完全奏凯之后，再设法处置[乡勇]吧。\"（原文待核，见注释201）^201 显然预想着速胜，乾隆或许以为：叛乱一旦平定，与受雇乡勇相关的一切问题都会迎刃而解。</p>\n<p>明亮一直珍视旗军骑兵。战役早期，他主要使用旗兵与旗军军官作战。1797年底三千名吉林、黑龙江旗兵到达时，明亮与德楞泰带走了大部分。明亮后来虽然自己也用了乡勇——或许他抵挡不住乡勇入列带来的经济利益的诱惑——却从未失去对那些前平民的鄙视。有时，他让正规兵扮成乡勇引诱叛军——以为叛军会乐于与他们接仗，因为打他们更容易。^202 或许是为了与乡勇的缺乏纪律形成对照，明亮曾夸耀自己正规军的良好纪律：他们总是按市价购买当地居民的货物与馈赠，从田间摘菜、掰玉米、取秸秆都照价补偿业主。^203 想必，乡勇做的恰恰是这一切的反面。</p>\n<p>明亮之后，战区各地的将领与督抚对乡勇提出了更多批评。与明亮一样，大多数人抱怨乡勇的放荡：他们常常牵涉劫掠、强奸与滥杀；他们也不可靠，常常一见叛军就逃跑。^204 麾下有数千名乡勇的富成1799年中奏报说：乡勇领不到给养时，就劫掠、强征平民财物，为此富成惩处了他们——割耳、当众鞭笞。他甚至处决了几个。^205</p>\n<p>大量未经训练的平民被用于作战、有时还摆在正规军前面，乾隆为此忧心，试图强化战争中主要的正规力量——绿营——尽管他似乎没有清晰的议程，容易从一个主意摇摆到另一个。1797年春末，四月初六日，乾隆命直隶、山东、河南、江西、湖北、四川、陕西、甘肃、云南、贵州各省官员补齐因白莲教战争调兵而出现的绿营空缺的百分之六十至七十。由于在调出部队返回之前补缺非同寻常，乾隆解释说：一些士兵可能回不来了——升了官、战死或伤残；更重要的是，他不想让那些省份的驻防空虚太久。^206 这项决定虽然含糊，却表明了乾隆对正规军规模缩减的关切，为进一步的步骤留了门。^207</p>\n<p>恰在此时，景安提出了一个扩大河南绿营规模的建议。景安呼应其他人对乡勇的抱怨，也认为他们不可靠。此外，他奏报说：乡勇的饷银高于正规军——这是朝廷第一次听说此事。随后，景安奏请允许招募三千名丁男（dingnan）充当战兵（zhanbing）。他计划训练他们，按绿营步兵的标准发饷，然后分到河南的三个镇——包括他直辖的那个。景安论证说：河南驻军不足（官方数字只有九千九百九十九名绿营兵），本地多兵比从外省调兵更经济——他显然打算把这些新兵永久化，这样就不必再向邻省求援了。当然，鉴于他在战役领导层中的孤立，向邻省求援从来都不是令人愉快的经历。^208</p>\n<p>然而，乾隆对景安的提议不悦。其一，他认为景安刚在补缺之令后提出此议，颇为不妥。但他更恼火的是景安暗藏的议程：试图变相增加河南的绿营编制。乾隆警告说：若他省效法河南，将是绿营的\"更易旧制\"（gengyi jiuzhi）。在乾隆看来，湖南苗区有必要设新驻防以守新征服之地，河南却是腹地省份——只因\"几个\"教门叛军闹事就要作如此激进的改变，是没有根据的。乾隆斥景安之议\"实为不当\"，命对他\"严旨申饬\"。然而，他允许景安招募新兵。乾隆不放弃\"编制不可改\"的立场，计划用新兵填补因升迁与伤亡出现的空缺，其余留待出缺。^209 换言之，河南获得了皇家许可，可以进行一些预招——这很可能导致该省绿营规模的扩大。</p>\n<p>1797年晚些时候，乾隆对乡勇的看法转向了有利的一面——他开始在乡勇中看到未来的新兵，战役之后可以补绿营之缺。署理湖广总督姜晟提议为湖北因调兵而出的绿营空缺招募更多士兵时，乾隆拒绝了请求，让他等战事结束、用乡勇补缺。^210 不久，汪新奏报他在湖北整训乡勇的努力——当时湖北已肃清叛军——乾隆表示了兴趣与认可。汪新从鄂西北数县挑选了一万数千名健勇（jianyong），发制服装备，与正规军一起训练。沿湖北西部边境，汪新驻扎了军队与乡勇，让有作战经验的当地士绅率领后者。在竹溪、竹山、房县、归州、巴东、建始、利川这些战场县份，汪新指派地方官员与军官监督乡勇。认可汪新的努力时，乾隆看到了对桀骜乡勇加强控制的益处：它有助于防止他们被叛军拉拢，同时为战后补绿营之缺作准备。^211</p>\n<p>1797年秋，急于看到湖北战场的突破，乾隆指示将领们不要分兵各自追击叛军，而要集结优势兵力，逐股消灭。^212 回应此令，明亮、德楞泰与景安联名上奏，先指出叛军已转向游击战：</p>\n<blockquote>\n<p>[叛乱]之初，贼据险聚处，尚可合兵围剿。近来改为奔走流窜，不据一地，不居一隅。专恃劫掠为生，行不携粮，止不设帐。所过村镇，裹胁居民，从者日众，可分数股横行，官军难以应付。加之鄂北襄阳、郧阳、荆门、宜昌四府犬牙交错，道路众多，歧路纷出。难以一一拦截。^213</p>\n<p>[译者按：原奏自英文直译，文言原文待核，见注释213。]</p>\n</blockquote>\n<p>随后他们讨论了如何应对叛军的高机动性。按照乾隆\"围歼而非分头追击\"的计划，他们建议设立一支四千人的骑兵军团——从旗兵、绿营兵与撒拉兵中挑选吃苦耐劳的骑手。他们自带十天的给养（景安承诺为他们备好肉干炒米），可以快速移动，不依赖笨重的后勤队伍。^214 这个\"由不同族群士兵组成机动军团、以游击战对付叛军游击战\"的提议，指向了一支新野战军的方向。然而，乾隆并不十分动心，认为\"为时已晚\"，尽管他勉强认可了这一提议。^215 然而，战场很快转向了更适于骑兵的陕南多山地区以外……这个计划从未实现。</p>\n<p>宜绵在重振正规军上走得更远。他对陕川两战场的清军与乡勇有第一手信息，担心四川与陕西都已耗尽了正规军——四川已动员一万九千多名绿营兵参战，陕甘已从其驻防调出两万多名。最近向湖北调遣三千名黑龙江、吉林旗兵之后，中枢政府不大可能再向四川或陕西派旗兵。宜绵虽然曾呼吁雇乡勇、自己也用过，却不信任他们作为作战力量。1797年九月——他被解除战役统帅之职前不久——宜绵向朝廷上了一个重要动议。首先，他表达了对受雇乡勇的不满：\"乡勇守御本乡，尚能同心出力。调赴数百里之外，则多迟疑不进，虽有出力之人，究属少数。此辈赏之则骄，惩之则逃。\"（原文待核，见注释216）^216</p>\n<p>因此，宜绵主张扩充正规军，而非倚靠非常规兵员。他建议在战区招募三万备战兵（beizhanbing）（四川一万、陕甘一万、湖北五千、河南五千），在乾隆所命补缺之外。宜绵计划让新兵由文官或绿营军官训练两个月，掌握基本作战技能——如刀矛——宜绵务实，不指望他们精通鸟枪或弓箭——然后派往战场省份填补绿营空缺、协助守御地方。^217 这一次乾隆支持。然而，考虑到从社会上招募三万备战兵可能不现实，乾隆命从受雇乡勇中征募。他希望正规军的身份有助于约束他们，同时乡勇的人数也能减少。^218</p>\n<p>乾隆的修改虽与宜绵的初衷有所偏离，但如果这一动议得到充分实施，将是对那些省份积弱的绿营的相当可观的提升。新血将扩大其规模、稀释绿营半世袭的性质——这可能预示着向职业军人的转变。更重要的是，备战兵可以用作机动野战力量，比北方旗兵更快、更省力地投入前线。然而，很快证明该计划难以实施。战区官员对把乡勇转为正规军三心二意；主要障碍是许多乡勇不愿参军——他们作为受雇乡勇享有更好的待遇与自由。^219 正如嘉庆后来所说：</p>\n<blockquote>\n<p>自剿办邪匪以来，屡次颁发谕旨，令出兵各省督抚招募新兵补缺，使营伍充实、巡防有兵。然民人往往情愿充乡勇而不愿当兵，因兵须守营规、受约束，不能如乡勇之去留自由。加之[乡勇]盐菜口粮高于兵丁。故募乡勇易而募兵难。^220</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释220。]</p>\n</blockquote>\n<p>与此同时，绿营兵被调出的各省对提前补缺的号召响应并不积极——中枢政府没有为这项工程拨钱。此外，乾隆最后一年精力日衰，无法密切督导他视为重要的一切事务。因此，他补缺之令与宜绵三万备战兵的提议都没有落实。据军机处1799年春的一份报告，只有四个省招募了新兵：广东一千九百、云南七千一百、贵州一万零一百、四川二万三千四百。^221</p>\n<p>四省之中，四川招新兵最多。显然，宜绵1798年初返陕之前，是四川招兵的推动力量。^222 事实上，军机处的报告可能不完整；其他省份——例如湖北与河南——也招了新兵。在河南，景安与吴熊光招了七千四百名新兵，并把开封的一千一百四十三名乡勇转为巡抚直辖镇的正规军。^223 然而，尽管1797年有这些加强正规军的讨论与倡议，1797—1798年见证的却是战区乡勇的扩张——四川与湖北的受雇乡勇都达到了数十万，如前所述。</p>\n<p>嘉庆接手镇压战役的指挥后，也在正规军与非常规军之间权衡。他对乡勇权宜之计的所有问题了然于胸——很可能比父亲更清楚——亲政头几个月，他一再表达对过度使用受雇乡勇的愤怒，认为它是战役最大的陷阱之一，应对巨额财政代价负责。正如他所说：\"朕恐乡勇亦不过虚应故事，以图冒领经费。\"（原文待核，见注释224）^224 同时，他不断批评绿营军官侵吞士兵饷银、把士兵当私人跟班杂役，希望根除绿营中的劣习。^225 出于强化正规军的倾向，嘉庆起初敦促战役领导层削减乡勇。受嘉庆\"倚重正规军\"立场的鼓舞，四年二月二十五日，宜绵再次呈上\"在川陕甘鄂豫五省等额招募三万备战兵\"的提议——再次得到嘉庆的认可。^226</p>\n<p>鉴于1797年河南只招了五百名新兵——仅为批准五千名的十分之一——嘉庆于1799年秋命吴熊光用乡勇补河南绿营之缺。到1800年初，河南已招五千名新兵，陕西只招了一千八百零四名。嘉庆随后指示山西与河南再招新兵，补满所有空缺，另招数千名调往战役。更重要的是，嘉庆表示：这两省超过绿营编制的新兵，战后可以保留。然而，嘉庆没有给任何一省拨钱。急于扩充河南军事力量的吴熊光立即又招了一千名士兵，并计划裁乡勇、用省下的钱发饷——嘉庆同意了。到1800年初，河南共招七千四百名新兵——其中三千八百多名后来被调往湖北与陕西。^227 山西却没有跟进这个项目。</p>\n<p>在短暂的前线改革期间，嘉庆对强化与改革绿营怀有若干宏大的想法。回望王朝开国时代，1799年底，嘉庆反思了林起龙1659年\"重质而非重量\"的绿营建议。这道著名的奏疏出自户部侍郎林起龙之手，主张建立一支更小而更强的绿营，解除其维护地方治安之责，专注于作战技能，这样一旦需要调兵，就不必再依赖满洲旗兵。他提议把近六十万的绿营裁减三分之二，只留二十万，同时把军饷翻倍、加强训练。^228 事实上，林起龙的意图是把绿营打造成一支能征善战的机动军队，与旗兵比肩。林起龙的想法虽然没有实施，这个计划当时打动了顺治皇帝，此后数十年又令怀有远见者着迷。诚然，嘉庆被林起龙的建议吸引，不是因为削减绿营规模的建议。相反，吸引他的是林起龙\"建立精锐打击野战军\"的计划。同时，他惊异于：绿营在自己时代的问题与开国初年如此相似——包括军官吞空饷、把士兵当私人仆役。^229</p>\n<p>松筠虽然与台布一道在陕西雇用了乡勇、甚至提议提高其待遇以激励他们更好表现，^230 却主张扩充绿营作为清朝军事困局的根本之策。1800年初，松筠提出了一个激进的提议：废除乾隆1781年取消绿营军官\"武职名粮\"的决定。松筠请求恢复\"武职名粮\"，但取消给绿营军官的\"养廉银\"。因为前者保证了军官役使的人员——尽管大多数军官侵吞了一部分名粮——军官们就不会再盘剥士兵及其饷银。松筠建议把军官的\"养廉银\"改拨为士兵的饷银。这样，绿营的规模就能扩大（被私占的士兵归队），而无需增加军事预算。^231 然而，这个提议没有得到朝廷的支持。嘉庆身边围着一群普遍保守的顾问，无论他自己的还是官员们那些会带来如此激进改变的提议（如松筠此议），都得不到多少鼓励性的反馈。^232 更重要的是，1800年战争进入第五个年头时，嘉庆已经处于从改革上后退的边缘。</p>\n<p>嘉庆后退的关键决定因素之一是财政困难。乾隆驾崩时，户部库银已大幅缩减，嘉庆1799年仍设法拨了一千二百四十万两支撑战役——其中八百九十万两出自户部——这进一步抽干了户部之库。随着战争拖延，嘉庆开始怀疑自己的改革以及改革者们。在设法削减开支的同时，嘉庆开始把重心从正规军转向非常规军。结果，宜绵三万备战兵的提议被搁置；1800年之后，皇帝与任何省级领导人都没有再推动它。^233</p>\n<h2>退回乡勇</h2>\n<p>1800年新年后数日，嘉庆罢免了主持四川战争财政改革的广兴。广兴为削减乡勇人数尽了最大努力，但他一刀切的做法与魁伦对立——后者在裁乡勇上更审慎、更有选择性。然而，魁伦已经没有时间重新雇回先被福宁、后被广兴大批裁掉的乡勇——叛军就在此时抵达了定远的嘉陵江岸，而那里自1799年夏以来一直太平无事。听说叛军朝自己这边来时，定远知县请求拨款多雇乡勇，但为时已晚。^234</p>\n<p>1800年初叛军渡嘉陵江，使嘉庆对乡勇的立场来了个一百八十度大转弯——从低调认可转为坚定倡导。嘉庆认为嘉陵江守江乡勇的削减是叛军渡江的原因之一，立即号召</p>\n<p>号召江西居民组织自卫。^235 一周后，他坚决批准了长麟与台布的一项提议：在陕西每乡（xiang）设一名首领，把迄今分散的乡勇集中管理。^236 数日后，在一道长谕中，嘉庆劝勉战区所有督抚多雇乡勇，作为远调军队的替代。他论证说：尽管乡勇的饷银高于绿营兵，用他们仍划算——从北方调一名旗兵的钱，可以在当地雇十名乡勇。嘉庆再次告诫督抚们：乡勇的贡献要如实奏报、妥善奖赏；并告诉他们不必过分担心战后安置——遣散的乡勇可以补绿营之缺。此后数月，嘉庆重申了这些观点。^237</p>\n<p>嘉庆对招募使用受雇乡勇立场的急剧转变，带来了1800年整个战区的又一波雇乡勇高峰。在四川，乡勇总数迅速膨胀到至少十万。^238 在河南，吴熊光虽鄙夷乡勇，仍在豫西南边境多雇了乡勇，还从开封调去练勇（lianyong）——理由是湖北已被几股叛军突入。^239 湖北1797年底遣散了大部分乡勇，1800年初急忙再雇——尤其在襄阳与郧阳两府（每府各雇一千五百名）。尽管嘉庆警告不要过快膨胀受雇乡勇的名册，到年中，鄂西北至少有一万名受雇乡勇——不算不领饷的。^240</p>\n<p>嘉陵江溃败之后，嘉庆立即向四川调了五千名贵州兵及湖南、广东、广西的其他援军。但对费用的关切很快又攫住了他。他不仅不再派援军，还命把伤病兵遣回本营，只留精壮在战役中。^241 陕西按察使文成惠建议：从原营挑选健壮的士兵填补伤病留下的空缺。文成惠论证说：这一措施虽等于增加战役中的正规军，却有助于加快战役，最终是划算的。嘉庆认为战争数月内就可能结束，不为所动；他只是把文成惠的奏折转给额勒登保与那彦成，让他们决定是否需要新兵。^242</p>\n<p>不久，嘉庆从直隶、山东调了两千名绿营兵到河南加强防务。他让吴熊光用河南省库的钱支付开支，如果河南经费不足，他会从北京拨一些。然而，援军到达时，吴熊光抱怨：那些士兵以及先前从山西调的士兵都是新兵，不会打仗。嘉庆为此光火，批评直隶、山东、山西把新兵送上战场，命他们返回。^243 这成了朝廷最后一次从战区之外调遣正规军。</p>\n<p>随着1800年推进，清朝国家面临日益严峻的财政压力。嘉陵江之败与其他紧急事态迫使中枢政府在上半年向战场省份投入更多钱款，加深了中枢政府的财政困境。春末各战场叛军都被遏制后，嘉庆似乎决心让战役脱离国家的财政资源，让各省接管重担。他从四川开始——夏天开始时，四川只剩少量叛军残部。闰四月二十八日，嘉庆把户部库与内务府库的最后四十万两拨给四川，并告诉勒保：此后战役经费是省政府的责任——如第4章所述。</p>\n<p>皇帝虽然几乎不可能再坚持早先\"扩充并倚重正规军\"的偏好，嘉庆也难以坚持对受雇乡勇的认可。春末夏初，嘉庆急剧改变了立场。两个月里颁发的众多谕旨中，他说他并不赞成受雇乡勇——xiangyong。呼应他常听到的抱怨，嘉庆给他们贴了标签：大多是居无定所、无业可依的流民，不会打仗、难以管束。他们不仅不全力作战，也守不住地方——因为他们守的不是自己的家乡。最重要的是，雇他们的费用太大——他们的待遇高于绿营正规军。此外，嘉庆对他们的战后安置深表忧虑。因此，他告诫战争主持者们：不再招募他们，也不再让他们随正规军行动。^244</p>\n<p>嘉庆如今全力支持传统类型的乡勇——不领饷的自愿乡勇——视之为受雇乡勇的理想替代。^245 事实上，乾隆皇帝也时常呼吁依靠由地方精英或地方官组织的自愿乡勇。^246 尽管有人呼吁把受雇乡勇转为自愿乡勇，许多自愿乡勇很快还是被编入了受雇乡勇。^247 与庞大的受雇乡勇相比，剩下的自愿乡勇只是少数。1799、1800年朝廷与战争领导人们开始推动筑堡时，自愿乡勇重新出现；他们从堡民中招募，守卫堡寨。1800年中，勒保解释了两类乡勇的区别：</p>\n<blockquote>\n<p>团勇与乡勇不同。随官军征战、守卡守要、领饷领赏、可随处调遣者，是乡勇。地方百姓自出己财筑堡，挑选精壮、自备器械守卫其堡、由居民捐粮供养者，是团勇。团勇只顾及自家性命身家，不能责令其出堡奋勇杀贼。^248</p>\n<p>[译者按：原奏自英文直译，文言原文待核，见注释248。]</p>\n</blockquote>\n<p>在嘉庆看来，自愿乡勇——团勇——应当守卡守要，但不该随军远离家乡。他认为组织乡勇是地方官员——从督抚到知县——的任务，军事领导人应当远离此事——他们的职责是作战。地方官员不称职就换人，从外地调人来。嘉庆设想每个县最终会有数万自愿乡勇，敦促地方官员订立规章、定期训练。嘉庆对不领饷乡勇的迷恋竟至于称他们为\"最得力\"。他总结道：</p>\n<blockquote>\n<p>本地之民编为乡勇，守其本土。贼来则人人出而捍卫，贼去则各归本业。无战事时不领盐菜口粮。即便地方政府必要时提供一些财力支持，其花费也无法与雇乡勇的高额相比。^249</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释249。]</p>\n</blockquote>\n<p>正是低成本使自愿乡勇对财务压力日益沉重的皇帝如此有吸引力。嘉庆在谕旨中明确表示：中枢政府不支付自愿乡勇的费用，至少目前不；乡勇若由地方政府出资，战后报销；若由当地居民组织出资，那些地方可以奏请蠲免赋税。嘉庆知道这样自愿乡勇得到的补偿将远低于受雇乡勇，便强调：他会授他们顶戴与荣衔，给奋勇作战者实职，对阵亡者加倍抚恤。他期望这些恩典能弥补受雇与自愿乡勇之间的待遇差距，还希望它们加上地方政府供给的粮食，能吸引边缘人群，防止他们投奔叛军。^250</p>\n<p>与白莲教战争的流行看法——把地方精英描绘为组织自筹乡勇的推动力量——相反，在战役中期苦苦摆脱财政困境之际，力主此议的正是嘉庆皇帝。^251 从此，为区分自愿乡勇与受雇乡勇，前者常被称为\"练勇\"（lianyong）或\"义勇\"（yiyong），其头目称\"义首\"（yishou）。守卫平民堡寨的自愿乡勇称\"寨勇\"（zhaiyong），其头目称\"寨首\"（zhaishou）。这项计划注定在战场省份不受欢迎——它把供养乡勇的负担转嫁给了地方政府。地方官员与军事领导人的强烈抵制，很快压倒了皇帝\"倚靠不领饷乡勇\"的提议。</p>\n<p>战区地方官员厌恶这个主意：他们得监督乡勇，却得不到财政支持。曾在著述中大声倡导地方社群自卫的龚景瀚，任陕南知府时却道出了他的怨气：</p>\n<blockquote>\n<p>至于招募乡勇，皆为无业游棍，不可倚恃。府县衙门遂须厚赏严惩，以资约束。然此不啻责令庖人作炊而不与以米——如今府县衙门并无实权，徒有空架子。且又受[上司]监视，如防贼然。无权何以服众？无钱何以募人？^252</p>\n<p>[译者按：原文自英文直译，文言原文待核，见注释252。]</p>\n</blockquote>\n<p>正如台布所奏报的，地方官员\"不以为意，事到临头才仓促招募[乡勇]\"，然后\"凡持矛而来者，无论老弱，皆给口粮\"。^253</p>\n<p>对皇帝\"以事实上的无偿乡勇取代受雇乡勇\"的推动同样不满的，还有省级官员与将领们。勒保、台布、吴熊光、长麟、陆有仁、额勒登保与那彦成都大声而明确地抱怨自愿乡勇，认为他们比受雇的还不可靠——既无纪律，又无动力，很少表现出色。叛军来时，鸣锣相召，他们却等叛军过了才到。战斗中，一遇叛军、稍有伤亡就溃散。更糟的是，一旦溃散就无法重新集结。^254 在湖北，地方官组织的无偿\"义勇\"比陕川两省多。^255 但吴熊光认为，除郧西县的自愿乡勇外，其余都是乌合之众、毫无用处。^256 就连以得力闻名的郧西乡勇，有时也会出错。1800年初夏，他们擅离哨卡回家收割，给了叛军突入湖北的机会。^257 在陕西，平民一旦筑了堡，招募守卡的自愿乡勇就难了，官员们不得不发口粮来给些激励。为更好地指挥那些乡勇，长麟提议从外省挑选官员派到陕西；他认为最好由军队率领他们，但军队不够。^258</p>\n<p>督抚之中，没有谁比勒保更直言不讳。过去就曾违抗圣旨的勒保，激烈抵制削减受雇乡勇。他论证说：他们虽然不算非常得力，却对侦察、守卫嘉陵江等要地不可或缺。勒保还告诫：遣散安置他们很难；处理不当，可能把他们推向叛军。作为替代，勒保提议把遣散的乡勇编入自愿乡勇队伍，但延续其饷银。至于饷银经费，勒保建议在1800年春末已恢复太平的川西征收附加费——所谓的民间帮贴（minjian bangtie）。^259 勒保\"把自愿乡勇变成受雇乡勇\"的企图，与他维持军费开支规模的愿望一脉相承。同时，在他的辖区征收附加费，可以弥补四川军费的削减。效法勒保，湖北省级官员也请求给自愿乡勇发饷，并对表现突出者加发犒赏。^260 勒保一面重申不愿裁减受雇乡勇，一面继续在四川雇乡勇——尽管他承诺过不再招募新的。^261 从1801年初起，勒保甚至不再口头上敷衍\"把受雇乡勇转为自愿乡勇\"，论证说：后者在剿贼中只起边缘作用——他们不过是平民。^262 他坚持用受雇乡勇守嘉陵江，并再次提到将用川西的附加费支付他们。^263</p>\n<p>1801年初，新任湖广总督书麟到达湖北前线。与许多人一样，书麟对非常规兵员不以为然。但与其他人不同，书麟试图劝皇帝摆脱对乡勇的迷恋，把注意力转回正规军。他与倭什布提议：在鄂西北要地设六个营汛，各驻兵两千，这样清军就不必疲于在山中追剿叛军。他们将专注于守卫城市与其他人口稠密地区，迫使敌人进入人烟稀少之地，在那里断其给养。这个提议的主旨是：以正规军为主力，非常规兵员辅助。为凑齐该方案所需的一万二千名士兵，他们请求从湖北所调绿营兵的家乡省份调新兵填补伤亡空缺——这与文成惠一年前为陕西战场所提议的相似。^264 嘉庆虽赞同其中一些想法，却拒绝了调新兵的请求——他怕各省只会派新募的兵、而非精锐。他指示书麟与倭什布改雇更多自愿乡勇。^265</p>\n<p>然而，书麟很坚持。与许多人一样，他抱怨自愿乡勇无能——他们\"御敌则不足，扰民则有余\"（原文待核，见注释265）——并担心遣散他们时既无地可耕、又无军缺可补。此外，鄂西北边境人口稀少、又搞了筑堡工程，招募平民入乡勇变得困难。为凑足守卫六个要地营汛的兵力，书麟未经奏报就先请江西派三千名备战兵（beizhanbing）入鄂——因为吴熊光表示不愿再派河南兵入鄂。嘉庆虽未责备书麟此举，却怀疑江西的备战兵不顶用。^266 这次往还之后不久，书麟就去世了。他\"倚重正规军\"的倡导，成了战役主要领导人沿此路线的最后一次呼吁。</p>\n<p>听够了自愿乡勇的负面言论、又急于收束战役，嘉庆并不总坚持使用自愿乡勇。1801年初给长麟、陆有仁\"加强陕西防务\"的谕旨中，嘉庆指示他们用新兵替换伤病兵、雇新乡勇替换老弱者——这一立场与他回应书麟提议时的态度自相矛盾。他甚至告诉他们不必担心费用——迅速取胜能省更多钱。^267 有时，嘉庆设想：乡勇的又一波扩充或许能加快战役的清剿。</p>\n<p>1801年夏，倭星额与邱兴健奏报陕西视察之行的见闻时，估计战争中有八万多名正规军、约两万名受雇乡勇，合计十万兵力，而在逃叛军只有两万。两位钦差对受雇乡勇全盘批评，称他们乌合之众、不会打仗、守御无用，并把一些败仗归咎于他们缺乏纪律。他们声称：除额勒登保与德楞泰率领的随征乡勇外，其余都毫无价值。此外，他们指出：使用乡勇给后勤人员制造了侵吞经费的机会。为堵漏洞，他们建议登记所有乡勇，未经批准不得再雇。^268 然而，嘉庆已无意根除前线腐败，只指示额勒登保让地方官员更好地管理乡勇——他说他深知受雇乡勇的问题，但全部登记有困难。^269 由于嘉庆的放任态度，战役最后阶段整个战区雇了更多乡勇——他们有时被称为\"新勇\"（xinyong）。到1802年中，三省受雇乡勇或许有六七万，初秋时减到四万五千至五万。^270 当然，自愿乡勇——人数可能多出数倍——一旦发饷，就转为受雇乡勇。显然，许多人转了。</p>\n<h2>雇佣兵的结局</h2>\n<p>如第5章所述，清朝管理受雇乡勇的失败，是白莲教战争收尾阶段迁延的重要因素——战时的权宜之计成了巨大的包袱。尽管嘉庆自亲政以来就对受雇乡勇的危险有清醒的认识，他却没有有效的手段及时、平安地完成清算他们的复杂而艰巨的任务。乡勇充分利用机会索取最大限度的安置待遇，同时抵制被编为士兵——正规军的待遇更低、生活更受约束。战争领导人们则不愿一次性失去他们——庞大的乡勇队伍是他们索款的谈判筹码，也是开支过滥的主要借口。</p>\n<p>尽管对这个战时权宜之计摇摆不定，1802年夏末——只有几百名叛军残部在逃、久盼的奏凯在望时——嘉庆再也藏不住对乡勇的愤怒与厌恶。他直截了当地批评了过度使用受雇乡勇：</p>\n<blockquote>\n<p>[成例]以兵民分途为要。民以务农为业，不许习武，连持有武器都在禁止之列，以免其逞凶。如今三省受雇乡勇（xiangyong）如此之多，虽目前有些帮助，终究是件坏事——招募容易，遣散难。至于地方自愿团练（tuanlian）守堡之勇，皆有恒产恒业，不会沦为盗匪。但受雇乡勇乃无业流民。招募时其饷银甚至高于兵丁。且久随军队，用于杀贼。因此，很难去除他们的凶暴好斗之性。^271</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释271。]</p>\n</blockquote>\n<p>嘉庆随后责成将领们找到可行的办法，妥善而迅速地遣散安置他们。同时，他告诫军队磨砺自身能力，使将来不必再雇乡勇。^272 从此，他再也没有摆回青睐乡勇的一面。</p>\n<p>1804年初——漫长战役结束前数月——一些朝官建议修改《军需则例》，增加受雇乡勇的补偿规则，以免将来再出现滥行。或许是知道嘉庆的立场，军机处与兵部、户部、工部否决了这一提议。他们反而建议：将来不再使用受雇乡勇。除批准这一决定外，皇帝颁发了一道情感充沛的谕旨，痛斥战争中雇用乡勇的做法，明确表示要终止这一做法：</p>\n<blockquote>\n<p>国家养兵，所以卫民。驻防腹地之八旗劲旅与驻守各省之绿营，皆以备缓急之需。我朝兵制本有定章。以往平定准噶尔、回部、金川诸边役，及剿办王伦、苏四十三等内地叛乱，皆以官兵克敌奏功。从未有雇募乡勇之事。台湾贼匪林爽文滋事时，台湾远隔重洋，当地居民激于公义，自愿随军助剿，故准其从征。然而此次剿办邪匪，前线将领与地方官员招募众多乡勇，使之与官军同行。结果乡勇越来越多，达数万之众。地方有事，居民出于道义自行团练守家，理所当然。但官府招募平民充作战兵，还把他们外调他省数年，这算什么道理？朕闻所未闻……军队竟然不能保国安民，反要仰赖从未受过训练的平民上阵作战，那么养常备军还有什么意义？^273</p>\n<p>[译者按：原上谕自英文直译，文言原文待核，见注释273。]</p>\n</blockquote>\n<p>此后，嘉庆劝勉军官们认真训练军队。在他看来，这场战争大规模使用乡勇的异常做法之所以出现，是因为绿营兵荒废训练、被上司雇为跟班或学手艺挣钱，一旦有战事就无法履职。^274 整个白莲教战争期间，清朝国家对受雇乡勇的政策摇摆不定、充满矛盾，尽管并非不知其弊端与危险。然而，在上面这段谕旨中，嘉庆坚定而明确地否定了\"无限制雇用平民作战\"，给将来恢复这一方案几乎没有留下余地。因此，官修战役方略的编纂者们强调：战争中使用受雇乡勇只是\"权宜之计\"，淡化其分量与影响：</p>\n<blockquote>\n<p>我国家兵制严明，简练劲旅。凡有征调，本无藉乡勇（xiangyong）等类。此次邪匪起于鄂北，同时多起，官军不敷分布，地方士绅遂自发团练，各守其家其乡。随后各知县乃雇用之，以资其力。然亦不过权宜之计。^275</p>\n<p>[译者按：方略原文自英文直译，文言原文待核，见注释275。]</p>\n</blockquote>\n<p>说\"地方官员后来才接管乡勇\"并不准确（事实上，战役一开始许多地方就是官员牵头），而且这段话也没有提及：数万乡勇在战场上作战了多年。显然，这不是清朝军事史上光彩的一章。</p>\n<p>然而，官方的谴责并不能抹去一个事实：或许还有一万多名前乡勇被编在陕西、四川的驻防中——尤其是战役期间与战后新设的营汛。嘉庆视他们为王朝的隐患，频繁表达关切。德楞泰奏报最后叛军被消灭、标志冲突结束一年后，1806年夏末，陕西宁陕镇的两百来名前乡勇哗变。几个月后，1807年初，四川绥定（原达州）与陕西瓦石坪又发生了两场兵变。^276（地图6.1）</p>\n<p>宁陕镇1800年设立时，意在给秦岭要地五郎增加军事存在。按计划，它将有六千名新兵——百分之六十是从其他部队调来的绿营兵，百分之四十是无家可归的乡勇。^277 然而，多年来该镇一直兵员不足。除把乡勇转为新兵的困难外，</p>\n<p>鉴于他们参军意愿低，陕西领导人们——主要是额勒登保——并不积极补足其编制，而是专注于与朝廷谈判提高该镇官兵的待遇。^278 直到1804年夏，额勒登保仓促遣散了陕西全部乡勇，该镇编制才补齐——六千名士兵中大多数是被遣散的乡勇。^279 那些乡勇被定为\"守兵\"（shoubing），许多人还得从余丁当起，他们的饷银远低于当乡勇时的收入。此外，他们受到新上司的不敬对待。</p>\n<p>十一年七月初五日子夜，在陈达顺与陈先伦的率领下，两三百名新兵哗变——他们即将失去每月四钱的补贴——发给头三年新兵的\"米折银\"（mizheyin）。他们洗劫焚烧了宁陕镇的官署。拂晓，镇外一场小规模战斗中，哗变者杀死了署理宁陕镇总兵杨之震与另一名军官。随后他们西进，裹挟平民，招引其他营汛的\"乡勇变士兵\"加入，聚众三四千。然而，他们似乎没有计划。八月初攻占洋县县城后，他们折回宁陕方向，随后北移，但被阻止接近西安，被迫进入秦岭。为对付他们，从陕西、四川、甘肃、湖北、河南动员了约两万名清军，从满洲派了一百多名旗兵。九月二十四日，德楞泰、扎克塔尔、杨遇春、杨芳、薛大烈、丰绅与文春——白莲教战役将领名录的半壁——在栈道附近的江口方柴关与叛军遭遇。然而，陕西、四川其他营汛的许多新兵因经历相似而不愿与哗变者作战，有些人甚至逃跑了。此时，两名叛军头目蒲大芳与王文龙率部向德楞泰投降，随后擒获了陈达顺与陈先伦。与此同时，另一群不肯投降的哗变者被制服。兵变开始两个半月后宣告结束。^280</p>\n<p>1807年初，与宁陕兵变无关、但或许受了它的启发，绥定镇的几十名新兵——白莲教战役结束时该镇收编了八十多名乡勇——于十一年十二月二十二日黎明前在绥定城里哗变，起因是对微薄收入的怨恨。在王德先、孔传世与刘金鼎——前两人是前乡勇——的率领下，哗变者烧了衙门、打开监狱、洗劫府库，并试图杀死他们的总兵王国雄——据说他对部下苛刻至极。兵变很快被桂涵率领的四川军队镇压；两百多名哗变者在一周内或被杀或被擒。^281</p>\n<p>不久，十二年正月十二日，西乡协所属瓦石坪汛的三十多名新兵——全是前乡勇——又发动了一场兵变，他们相信上司侵吞了士兵的饷银。在周士贵的率领下，哗变者夺取汛库银两、劫掠奸淫平民后，逃入大巴山。十天内的两场战斗中，清军粉碎了这一伙，杀俘了该股全部五百多人。^282</p>\n<p>那些兵变只是清史上士兵第二次以暴力方式为自身利益抗议——第一次兵变发生在17世纪末，康熙皇帝在吴三桂之乱后裁减绿营之时。^283 三场兵变虽都没有升级为重大冲突，却向国家发出了警告，进一步强化了它对前乡勇的不信任与厌恶。兵变之后，嘉庆颁发谕旨安抚未参加哗变的\"乡勇变士兵\"，向他们保证：只要忠于朝廷，就不会受到歧视。^284 然而，听说德楞泰把两百多名投降的哗变者送回宁陕镇时，嘉庆几乎掩饰不住对前乡勇的感情。在一连串措辞严厉的谕旨中，他批评德楞泰的安排，要求解决。在皇帝的催逼下，陕西当局决定把他们与另外三百名新兵发往新疆驻防——嘉庆又补充：那两百多名哗变者永远不得离开新疆，即使服役期满。^285 然而，他们远未服满役期，1809年初，时任伊犁将军的松筠怀疑其中一些前哗变者在密谋骚乱。除处决了那些表示不服者外，松筠还下令把其余人一并杀死。一百九十五名前乡勇命丧新疆，为19世纪之交\"雇平民打仗\"这一章画上了一个悲惨的句号。公开场合，嘉庆谴责松筠滥杀显然无辜之人，过于残忍。^286 私下里，他或许大大松了一口气。毕竟，那些前乡勇正是他笔下曾说过的\"渣滓\"。^287</p>\n<h2>注释</h2>\n<p>[译者按：文献简称同前各章。]</p>\n<p>题辞：嘉庆九年正月二十五日上谕，NGDK, 125650.</p>\n<ol>\n<li>魏源《圣武记》（Wei Yuan, Shengwuji），457–65。本章及本章最后几节的部分内容，取材于作者2009年发表于《泰东》（Asia Major）的\"平民上战场\"（\"Civilians Go into Battle\"）一文。</li>\n<li>孔飞力《中华帝国晚期的叛乱及其敌人》（Kuhn, Rebellion and Its Enemies），41–50。孔飞力之前，铃木中正已描绘了战争中的大规模乡勇现象，包括随征乡勇（suizheng xiangyong）这类雇佣型乡勇，并强调其自发性质与地方精英的作用。Shinchō chūkishi, 189–96.</li>\n<li>此前，乡勇只是零星使用，且多在边疆地区。例如，1731年，甘肃河州知州顾尔昌组织了一支九千人的乡勇守卫二十四个关卡。但该乡勇很快被解散。《循化厅志》（Xunhua tingzhi），2/34、2/37。</li>\n<li>小县各雇八九百人，大县各雇五六千人；远离战场之地每日发钱六十文，近战场之地八十文。福康安，乾隆四十九年七月二十二日，《军机档》（Junjidang），37669。</li>\n<li>关于台湾战役，见罗友枝（Lococo）\"Military Campaign\"；庄吉发《清高宗》（Zhuang, Qing Gaozong），183–267。</li>\n<li>1802年，德楞泰把台湾战役指为战争中用乡勇之始。XFFL 329/17b–18b. 嘉庆此后呼应了这一看法。NGDK, 125650.</li>\n<li>数月之内，他们用掉了八十万两，又向国家请求追加一百万两。福康安，乾隆六十年七月十七日，《军机档》（Junjidang），47104。</li>\n<li>QSLJQ, 70/29a–30a.</li>\n<li>昭梿《啸亭杂录》（Zhaolian, Xiaoting zalu），351；蔡冠洛《清史列传》（Cai, Qingshi liezhuan），328。</li>\n<li>BLJZL, 1:56–58.</li>\n<li>BLJZL, 1:60; XFFL, 1/11a.</li>\n<li>孝感三汊埠——盐业枢纽——的地方士绅与商人招募了数千人为乡勇，一再击退叛军。祖之望授他们顶戴，一名地方官捐米供其口粮。XFFL, 13/14b–15a. 在当阳与荆州之间的富庶市镇河溶，当阳陷落后，几名生员捐产雇乡勇，设了三道关卡。XFFL, 2/12b–14a. 湖北郧县，包括一些生员与武生在内的当地居民1797年组织了乡勇。XFFL, 7/17b–18a, 8/26b–27a.</li>\n<li>惠龄在1796年三月的奏折中指出了这一点。XFFL, 5/14b–15a. 荆州知府手忙脚乱地拼凑了数百名乡勇守御地方。XFFL, 2/12b–14a. 咸丰知县与士绅招募了两千来人，设卡杀贼一百多。XFFL, 3/17a–b. 郧阳知府许以奖赏，招募了两千六百多名乡勇；他们参加了郧阳的战斗。XFFL, 6/3b–4a. 房县与保康招募了五千多名乡勇参战。XFFL, 6/5a–6a. 明亮说：\"湖北邪匪滋事，蔓延多处。官军未至之前，各府县皆集结乡勇守御。殷实士绅与有力之家亦参与守村，奋勇杀贼，助官军之威。\"XFFL, 13/31a–32a.</li>\n<li>《剿捕档》（Jiaobudang），嘉庆二年八月，135–38；BLJZL, 1:72–75; XFFL, 5/14b–15a, 10/26a. 当阳方面，毕沅招募三四千名乡勇参加围城，当地每村各雇八百至一千名乡勇。XFFL, 4/9b–10a. 汪新奏报：襄阳城附近的夹河洲与黄龙垱招募了一万多名乡勇。XFFL, 34/48a. 1796年八月，起事者盘踞榔坪时，宜昌府官员号召多雇乡勇，加强所有关卡路口的防务。XFFL, 13/50a–b.</li>\n<li>XFFL, 10/16a–b, 18/11a–12a.</li>\n<li>XFFL, 11/8a–9a.</li>\n<li>XFFL 3/6b–9a, 3/13a–b, 17/22a–b.</li>\n<li>MQDA, A306–75.</li>\n<li>XFFL, 33/43a–b.</li>\n<li>达州人杜茂才——安徽的低阶候选官——护送经费入川后回乡探亲，留了下来，组织了一支千人的乡勇。杜茂才于1801年春末升任知县。XFFL, 20/24b, 311/17a–b, 311/19a–b. 奉节方面，刘谦与其两兄弟组织居民在老木园与叛军作战。《奉节县志》（Fengjie xianzhi），28/36b–37b。大宁方面，饶明初捐资组织乡勇；该乡勇参加了老木园之战。《大宁县志》（Daning xianzhi），7/1b–2a。又见KJJFSB, 1/4a–5b。</li>\n<li>XFFL, 19/16a–17a.</li>\n<li>XFFL, 22/36b, 22/42a, 28/13b–14a; GZDJQ, 1454.</li>\n<li>他们还从附近挑选杰出乡勇充当守卫，腾出士兵作战。XFFL, 13/21a–b.</li>\n<li>XFFL, 18/33a–34a.</li>\n<li>在陕西，陆有仁用他们护送军费与给养运输。XFFL, 330/20a–b.</li>\n<li>1796年初，毕沅让湖北乡勇佩符，或在衣内缝一块红布或白布作标识。XFFL, 4/9b–10a, 22/16b; BLJZL, 1:74. 秦承恩为他1796年初在陕南招募的乡勇备了制服与帽子，并上书\"良民\"（liangmin）二字。XFFL, 11/8a–9a. 1797年初，惠龄让襄阳乡勇在衣襟内缝一块黄布，写明姓名、年龄与上司的印记。XFFL, 24/45b–46a. 1799年，松筠为陕西乡勇配了制服与帽子。XFFL, 121/12b–13a.</li>\n<li>据德楞泰说，他的一些乡勇是从苗疆战役带来的，其余大多1797、1798年雇的。XFFLXB, 22/44a–b.</li>\n<li>他们领大额口粮，另有银钱奖赏。XFFL, 18/33a–35a.</li>\n<li>XFFL, 28/4a, 38/28b.</li>\n<li>XFFL, 39/25b–26a, 39/32b–33a.</li>\n<li>XFFL, 107/24b–25a, 107/29b–30b.</li>\n<li>XFFL, 25/14b–15a.</li>\n<li>1797年，陕西商州几名生员率领的八百名自愿乡勇请求加入正规军剿贼。其中六百人获准。XFFL, 36/14b–15a.</li>\n<li>在陕南，秦承恩给乡勇发饷，用社仓粮供其口粮。XFFL, 11/8a–9a.</li>\n<li>XFFL, 1/24a–b. 他在嘉庆元年三月十一日的谕旨中重申了这一点。XFFL, 4/8b.</li>\n<li>XFFL, 8/4b.</li>\n<li>XFFL, 5/5b, 5/15a.</li>\n<li>XFFL, 5/14b–15a.</li>\n<li>石峰堡的先例——远离前线之地每日六十文、交战之地每日八十文——似乎被陕西沿用多年。NGDK, 108467.</li>\n<li>XFFL, 51/14a. 1797年秋，宜绵开始在月饷之外给四川乡勇发口粮。XFFL, 47/6a–b, 126/16b–18a.</li>\n<li>XFFL, 143/19b–22b.</li>\n<li>XFFL, 121/12b–13a.</li>\n<li>XFFL, 61/22a–23b.</li>\n<li>嘉庆元年二月二十一日的谕旨提到此事后，乾隆又在三月初三日的另一道谕旨中让毕沅挑选奋勇作战的乡勇予以奖赏。XFFL, 3/13b.</li>\n<li>XFFL, 5/14b–15a, 6/10b.</li>\n<li>GZDJQ, 2014.</li>\n<li>XFFL, 47/14b–15a.</li>\n<li>XFFL, 127/1a–b.</li>\n<li>XFFL, 132/23a–25b.</li>\n<li>只有河南的乡勇伤亡不重。XFFL, 46/2b–4a.</li>\n<li>1796年春末，乾隆指示给死伤乡勇发抚恤银。XFFL, 10/26a–b. 1797年初，乾隆批准了永保的请求：授阵亡有功乡勇千总之衔。XFFL, 23/19b–20a; 23/22a–b. 大约同时，乾隆命杰出阵亡乡勇按绿营最低阶军官的标准领取抚恤。QSLJQ, 13/3a–4a.</li>\n<li>这些案例中包括秦承恩1798年初为几名阵亡乡勇家属请抚恤。XFFL, 59/18b–19a.</li>\n<li>XFFL, 90/27b–28a.</li>\n<li>松筠还请求准许奖赏与叛军作战的文官。XFFL, 112/17b–24a.</li>\n<li>潘绍经的建议见嘉庆元年九月初八日的谕旨所引。XFFL, 17/12a–b.</li>\n<li>XFFL, 19/3a–4b.</li>\n<li>XFFL, 21/23b, 13/43b, 39/16a.</li>\n<li>XFFL, 11/8a–9a, 20/11b–12a; GZDJQ, 2077.</li>\n<li>XFFL, 126/16b–18a.</li>\n<li>XFFL, 164/35.</li>\n<li>XFFL, 22/31b, 34/37b, 35/5a–b.</li>\n<li>XFFL, 22/26a, 24/45b–46a, 30/3a.</li>\n<li>起初，他们不定期领饷。秦承恩给他们送去总计两万两银子，外加火炮弹药——因为他们大多贫穷，难以自备口粮。XFFL, 47/6b–7a.</li>\n<li>XFFL, 52/16a, 59/19a–b.</li>\n<li>JQSYD, 11:966; QSLJQ, 172/17b–19a.</li>\n<li>XFFL, 49/7a, 50/18b–21b, 62/9b–12a, 63/1a–2b, 64/2a–b, 65/35a–36a, 70/16a–b.</li>\n<li>SHD, 嘉庆八年五月上谕, 99; QSLJQ, 22/3b, 113/26b; XFFL, 49/15b, 72/18b.</li>\n<li>XFFL, 77/12b.</li>\n<li>XFFL, 24/26b–27a, 27/9b.</li>\n<li>五月共雇四千五百名乡勇。其中三千名受训后被选去参战。GZDJQ, 2472; XFFL, 33/38b–39a, 37/24a–b, 39/9a–b.</li>\n<li>罗思举率一队乡勇与士兵扮成叛军，1797年夏在云阳、万县一带杀死了四百名策划起事的教众。XFFL, 43/20a–24a, 43/26a–b. 桂涵1798年春仪陇一场战斗中率先攻入叛军堡寨。XFFL, 70/36a. 又见魏源《圣武记》（Wei Yuan, Shengwuji），457–64。</li>\n<li>襄阳队伍到达之前，太平已募四千至五千名乡勇。XFFL, 37/24a–b. 1797年秋，石作瑞、刘清及其他后勤官员雇了一万多名乡勇，率之参战。XFFL, 48/6b, 49/1b. 宜绵攻打方山坪叛军据点时使用了大量乡勇——受雇与自愿皆有。BLJZL, 1:280–83.</li>\n<li>GZDJQ, 6208, 10082; XFFL, 79/9b–10a. 但德楞泰1802年声称：1796—1797年四川有三十七万乡勇。XFFL 329/18b–19a.</li>\n<li>XFFL, 79/9b–11a, 93/5a–b, 126/16b–17b; GZDJQ, 10082.</li>\n<li>据吴熊光说，他任河南巡抚时只招募身世清白者。XFFLXB, 3/29a. 又见嘉庆八年正月初九日上谕，SHD, 58。</li>\n<li>XFFL, 333/12b–13a; XFFLXB, 3/29a–30b. 1797年初夏，达州的乡勇回家收割庄稼。XFFL, 39/13b.</li>\n<li>德楞泰1803年初奏报：湖北巴东与四川巫山、大宁的大多数受雇乡勇有家有业。SHD, 嘉庆八年二月二十五日, 91. 据勒保说，四川一地1797—1799年阵亡的九千多名乡勇中，只有四百四十七人有家属。NGDK, 114654.</li>\n<li>QSLJQ, 116/41b. 1803年，惠龄与祖之望说：陕西的防守乡勇大多是本地人，但大多数随征乡勇来自四川与湖北。XFFLXB, 14/3a–b.</li>\n<li>XFFLXB, 3/29a–30b.</li>\n<li>此事发生在1797年春夏的东乡、新宁与开县。XFFL, 43/7a.</li>\n<li>1698年，云贵总督王继文调土司兵镇压非汉地区的当地盗匪。《大清历朝实录》康熙朝，88/12a–b。</li>\n<li>1718年，松潘总兵路振扬动员土司兵，用他们协助守卡、充当民夫。路振扬请求准许供给他们口粮，得到中枢政府认可。《大清历朝实录》康熙朝，277/2b–3b。1720年，松潘游击岳钟琪从松潘征募藏兵及其他族群士兵，组成六百人的队伍随他进抵拉萨。岳钟琪传，《清国史馆传稿》（Zhuan'gao），6409 (1–3)。</li>\n<li>《大清历朝实录》康熙朝，299/5b–6a。</li>\n<li>绿营正规兵的年饷为六两，金川土兵只有三两。QSLQL, 1459/43b–44b. 阵亡绿营兵家属的抚恤为五十两，金川土兵只有二十五两。QSLQL, 1425/19a–b.</li>\n<li>土兵领三两\"衣装银\"，而满洲旗兵领二十两、绿营兵最低六两。旗兵与绿营人员还可以向国家借支，土兵则无此特权。JXZL, 户部，卷1、3。</li>\n<li>金川的军屯结果耗资巨大；国家不得不拨巨款供养绿营兵与土兵。土兵的调遣或许有助于论证保留军屯的正当性。</li>\n<li>《廓尔喀档》（Kuoerka dang），乾隆五十六年十月二十七日，152–53；十一月二十六日，168–69；五十七年四月初三日，3–13。</li>\n<li>台湾战役期间，乾隆给金川兵送去羊等礼物。1794年，乾隆称赞他们在第二次廓尔喀之役中的贡献，命金川一千五百名土兵每年各赏三两，其新垦之地免税。QLSYD, 18:168–69.</li>\n<li>马世嘉（McMahon）\"Identity and Conflict\"。</li>\n<li>1797年初夏，乾隆赏所有与长阳叛军作战的部队——包括土兵——一个月饷银。他还追赠一名阵亡土官为土游击，由其子承袭，并赏其家二百两。XFFL, 41/36b–37b.</li>\n<li>XFFL, 37/36b–37a, 37/39a.</li>\n<li>GZDJQ, 2291.</li>\n<li>XFFL, 130/32b–33a, 140/3a–b. 只有二百零二名金川兵回了家，其中九十名生病。很可能许多人战死或病死。XFFL, 201/14b–22a.</li>\n<li>其中一百零六名来自金川军屯，一百零一名来自金川其他地方。XFFL, 141/30b.</li>\n<li>士兵从巴塘、里塘、明正、木坪、绰斯甲、梭磨等地调来。XFFL, 152/14a.</li>\n<li>吴熊光1800年春如是说。XFFL, 165/17a–18a.</li>\n<li>《循化厅志》（Xunhua tingzhi），5/33。</li>\n<li>GZDJQ, 2290; XFFL, 35/28b, 37/37b, 38/15b, 38/29b, 38/33b, 39/14a–15a, 39/18a–20b.</li>\n<li>朝廷给死难撒拉官兵的家属发了高额抚恤。XFFL, 38/15b, 49/10b, 49/18b, 55/26b–27b; QSLJQ, 49/10b, 61/21a–22a, 61/24b–25a.</li>\n<li>XFFL, 102/5a, 103/27b–29a.</li>\n<li>XFFL, 102/3a–5a, 102/8a–b, 103/27b–29a, 107/6b–8b.</li>\n<li>XFFL, 111/16a–17b, 111/19a.</li>\n<li>XFFL, 123/19a–b, 123/20b.</li>\n<li>XFFL, 129/14b–15b.</li>\n<li>XFFL, 129/23a–25b.</li>\n<li>XFFL, 132/3a–b, 132/9b–10b, 136/6b.</li>\n<li>XFFL, 154/1a–ab, 154/2b–3b.</li>\n<li>1797年春，乾隆拒绝了甘肃庄浪一名土司\"派三百名士兵参战\"的请求——因为这会搅扰该土司的邻里。XFFL, 34/52a, 34/53a.</li>\n<li>一个例子是岳钟琪利用与金川土司的交情结束了1749年的第一次金川之役。戴（Dai）Sichuan Frontier, 128–29。</li>\n<li>文《坚壁清野议》见龚景瀚《澹静斋文钞》（Gong, Danjingzhai wenchao），外篇，1/3a–12b。</li>\n<li>QSG, 13042. 孔飞力甚至称龚景瀚为白莲教战争中的\"谋士\"。Rebellion and Its Enemies, 45–47.</li>\n<li>高（Gao）\"Shou Yun jilüe\"；《郧县志》（Yunxian zhi），10/85b–86a；日比野（Hibino）\"Gōson bōei\"；罗威廉（Rowe）《腥风血雨》（Crimson Rain），128–33。</li>\n<li>今天川东、陕南与鄂西北的一些堡寨仍可见。</li>\n<li>XFFL, 32/1a–2a.</li>\n<li>XFFL, 47/25b–26a; 《襄阳县志》（Xiangyang xianzhi），1/28b, 4/61b–62a。</li>\n<li>XFFL, 52/20a–23a, 52/29a–30b; QSLJQ, 23/3a–6a.</li>\n<li>1797年底，四川广安数万居民据山顶自固，地方官员雇乡勇用滚木礌石挫败叛军进攻。XFFL, 58/18b–19a. 1798年夏，景安与高杞协调在湖北筑城墙、掘壕。XFFL, 74/37a–39b. 陕西留坝，1799年春已在山上筑了堡。XFFL, 100/6b.</li>\n<li>JQSYD, 4:23.</li>\n<li>XFFL, 100/1a–4a.</li>\n<li>XFFL, 104/11b–12b. 据《随州志》，随州唯一修筑的堡在官庄店，由当地居民王明德所建。然而，1797年初三千名襄阳叛军从应山经堡而过时，王明德与一百多名乡勇被叛军杀死，堡似乎也被毁。《随州志》（Suizhou zhi），25/4b–5a。嘉庆或许把随州误当成了别的地方。</li>\n<li>XFFL, 104/12b–13b.</li>\n<li>那彦成建议订立规章，责成地方官员监督，并给迁入堡中的贫户发补贴。XFFL, 125/9b–10b.</li>\n<li>XFFL, 25/29b–30a.</li>\n<li>XFFL, 128/21a–23b, 128/28b.</li>\n<li>XFFL, 133/47b–48a.</li>\n<li>XFFL, 154/20b–22a.</li>\n<li>台布还打算用堡作军需仓库，以削减运输费用。XFFL, 161/12b–14a, 162/11b–14a, 168/27b–30b, 168/32b–33a.</li>\n<li>QSLJQ, 70/8b–12a; XFFL, 186/1a–5b.</li>\n<li>XFFL, 107/27b–28b.</li>\n<li>XFFL 144/36a–38b, 147/43b–44a, 162/11b–14a, 168/27b–30b, 175/22a–23b.</li>\n<li>陆有仁把小堡居民迁入大堡，并帮助留下的人组织乡勇——他观察到：高峰之上容纳数千户的大堡安全，而低丘或其他不安全之处的小堡易受叛军攻击。XFFL, 216/4a–7b. 陆有仁传见QSG, 11339–41。</li>\n<li>XFFL, 123/18b–19a.</li>\n<li>XFFL, 123/16b–17a, 125/9b–10b, 133/13b, 144/36a–38b. 嘉庆称赞了捐资的官员，并许诺给捐钱的官员与富户奖赏升迁。XFFL, 144/39b–40b, 154/16b–20b, 162/11b–14a, 168/27b–30b, 175/22a–23b, 229/6b–14a, 230/19b–20a.</li>\n<li>XFFL, 304/3b–7b.</li>\n<li>XFFL, 235/6b–9b, 235/15a–16b.</li>\n<li>XFFL, 180/23a–b, 202/14b–18b, 215/24a–26a, 217/19b–20a, 218/45b–47b. 当阳修了四十多座堡（许多到19世纪中叶仍可用）。《当阳县志》（Dangyang xianzhi），6/3a–4b, 16/3a–4b。房县的堡主要修于1800、1801年。《房县志》（Fangxian zhi），3/12a–16a。</li>\n<li>XFFL, 226/22b–23b, 231/6b–15a, 238/25a–28b.</li>\n<li>XFFL, 259/26b.</li>\n<li>XFFL, 333/13b–14a. 吴熊光多年后解释说，他从不相信此策有用。《伊江笔录》（Yijiang bilu），1/16b。</li>\n<li>魁伦说\"四川全省堡寨极多\"。XFFL, 144/28a. 明亮与德楞泰1797年底关于筑堡的奏折中建议：四川民众可以利用那些旧堡。XFFL, 52/20a–23a. 大宁方面，士绅沈英牵头筑堡，在大宁州城以西修建了\"保宁寨\"。《大宁县志》（Daning xianzhi），7/3a。达县磐石乡，两百户人家在山顶建了一座称为\"天保寨\"的设防聚落。《达县磐石乡志》（Daxian Panshixiang zhi），1/36a–b。</li>\n<li>1798年底，明亮与兴肇追击张汉潮到川北时发现：大多数居民已迁入\"山寨\"，张汉潮难以获取足够的粮食。XFFL, 80/20b–21a. 1799年底，明兴奏报了川东北的类似情形。XFFL, 128/21a–23b.</li>\n<li>XFFL, 139/20a, 139/22a–b, 143/19b–20a, 144/28a–29b, 152/16a–19b.</li>\n<li>XFFL, 134/4b-5a, 215/7b-12a, 224/5b-6a, 226/17b-21b.</li>\n<li>XFFL, 186/3a-b, 224/22b-25a, 238/28b-30b.</li>\n<li>XFFL, 261/17a-25b.</li>\n<li>嘉庆同意：筑堡只在条件许可之处施行，他不想处处推行。XFFL, 108/10b–14b.</li>\n<li>1801年初，嘉庆告诉额勒登保：他急于奏凯，等不了陕西再花一两个月完成筑堡。他还认为湖北没有时间筑堡了。XFFL, 223/36a–b, 226/4b–6b.</li>\n<li>XFFL, 223/24a–30a, 230/16a–22b.</li>\n<li>1801年夏，额勒登保再次推荐筑堡为剿灭叛军的最佳办法之一。他称赞陆有仁，并荐赏在陕西筑堡有功的军官官员。XFFL, 262/5b–11b.</li>\n<li>SHD, 嘉庆八年三月初十日, 39–46; 三月初十日, 47–50; XFFLXB, 8/28b–29a.</li>\n<li>吴熊光《伊江笔录》（Wu, Yijiang bilu），1/16b。</li>\n<li>明亮1800年指出了这一点。XFFL, 196/26a–27b. 勒保1802年初也承认：过去几年里，堡中平民与叛军作战的可能性只有\"百分之一二\"。GZDJQ, 7059.</li>\n<li>1802年春，陆有仁奏报有几十起此类事例。嘉庆指示以擒贼数目作为奖赏地方官员的标准。XFFL, 304/22a–23a, 304/33b–34b. 1803、1804年，此类事例很多。XFFLXB, 卷12–16。</li>\n<li>1799年底，起事者在太平、东乡、开县四次袭击清军运输队，抢米杀夫。XFFL, 133/38b–39a. 德楞泰1802年初奏报：鄂西的叛军占据民房以及山中的洞穴或堡寨，夺取给养。XFFL, 303/5a–b. 1802年夏，蒲天宝一股夺取了湖北兴山的几处堡寨。XFFL, 325/10b–11a. 1802年底，吴熊光警告：叛军可能占据平民堡寨为己用——如覃加耀1796—1797年在长阳、罗其清1798年在营山所为。XFFL, 333/13b.</li>\n<li>吴熊光《伊江笔录》（Wu, Yijiang bilu），1/16b。1802年夏，额勒登保奏报：陕西一些堡民高价卖粮给叛军，还为钱庇护受伤的叛军。额勒登保惩处了数人，其中一人处死。XFFL, 323/4b–5b.</li>\n<li>1800年初在东乡被擒的一名叛军供认：他们不敢攻打大堡，只威胁小堡。XFFL, 140/1b–2a, 141/6b–7a. 1803年中，数十名叛军在房县绑架了二十四名男女，堡寨付了赎金后放人。XFFLXB, 12/10a–11b.</li>\n<li>XFFL, 140/7b–8a.</li>\n<li>XFFL, 144/9a–b.</li>\n<li>一名被俘叛军供称：他们从四川、陕西移往湖北，是因为两省收成不好。XFFL, 234/19b–20b.</li>\n<li>XFFL, 215/16b–24a.</li>\n<li>XFFL, 165/17a–19b.</li>\n<li>只有一个例外：1798年秋，冷天禄据守云阳祖师观时，勒保派清兵抢收庄稼，并命冷天禄的人马冲出堡寨抢粮时烧田。XFFL, 79/7a–b.</li>\n<li>XFFL, 226/17b–21b.</li>\n<li>在陕西，一些堡民没有把所有粮食带进堡里，而是存在留下的空屋里——那些粮食常被起事者夺去。陆有仁没收其粮以示惩处。XFFL, 340/19b–20a.</li>\n<li>QSG, 13040–42; XFFL, 63/9a–b. 宜绵1798年初返陕时，龚景瀚显然随行。宜绵1799年初奏报：龚景瀚率乡勇参加了陕南一场战斗。XFFL, 86/10b–11a.</li>\n<li>嘉庆元年五月十二日，宜绵请把龚景瀚升为知府，并准其在得缺前先换顶戴。GZDJQ, 608. 嘉庆元年八月十八日，宜绵举荐龚景瀚任庆阳府知府。GZDJQ, 1032. 1797年初，宜绵把龚景瀚列入肃清陕南叛军有功人员名单。结果，龚景瀚获赏花翎顶戴。XFFL, 25/21a.</li>\n<li>XFFL, 89/10a.</li>\n<li>XFFL, 110/26a–27a.</li>\n<li>XFFL, 144/32a–b.</li>\n<li>XFFL, 189/6a–11b.</li>\n<li>XFFL, 228/19b–20a. 1804年夏，他在一道奏折中再次提到：他1797年冬就开始了这项工程。XFFLXB, 28/33a–b.</li>\n<li>JQQJZ, 10:219.</li>\n<li>召见勒保之后，嘉庆显然向白莲教官方方略的编纂委员会索要了支持这一说法的证据。随后呈给他的，是勒保1799年三月一道提到四川筑堡工程的奏折。JQQJZ, 10:219.</li>\n<li>勒保《平定教匪纪事》（Lebao, Pingding jiaofei），17b–18a, 22a。然而，白莲教战争时任重庆知府、勒保门生的石韫玉，在勒保的小传中只字未提勒保在四川筑堡的努力。《独学庐五稿》（Duxuelu wugao），22a–29b。</li>\n<li>他们大多是头三年调遣的。正如乾隆所宣布的，到1798年夏，共已调遣八万多名士兵。XFFL, 75/33a–b.</li>\n<li>嘉庆三年八月初八日上谕，BLJZL, 2:263.</li>\n<li>XFFL, 271/10b–12b.</li>\n<li>XFFL, 331/18a–19a, 331/23b–24a.</li>\n<li>1803年初，额勒登保送回一百五十名盛京旗兵。XFFLXB, 5/13a–15a. 1803年三月，勒保送回七十三名伤病旗兵，在四川留下八十四名健壮者。XFFLXB, 10/13a–b; 最后旗兵的撤出，见13/17b–18a, 15/23a–24a, 15/29b–30a。</li>\n<li>XFFL, 132/27b, 133/5b–7b.</li>\n<li>1800年秋，王文雄在陕西阵亡的消息使嘉庆想起惠伦与安禄之死。他哀伤地说：王这样一个一品大员死于与叛军作战，太不值得。XFFL, 169/21b–22a.</li>\n<li>XFFLXB, 8/5b–8a. 另一位阵亡的高级旗人是副都统丰绅阿——他于惠伦死前不久在湖北阵亡。另两名高级旗人永德与舒亮1798年底病死于四川。</li>\n<li>JXZL, 户部, 4/1a–7a.</li>\n<li>1799年秋，湖北为三千名满洲旗兵从河南、陕西、山东采购了马与骡（骡替代骆驼）。XFFL, 118/25b–30a, 118/34a–b, 119/7a–8b, 120/24b–27a, 122/20b–21a. 1799年底，四川从绿营各镇调了五百匹马，以满足额勒登保\"川滇黔各送五百匹马到其陕西部队\"的请求。嘉庆同意，并命云南、贵州或从本省驻防调马、或从市场购买。XFFL, 132/20b–22b, 132/32a–b, 132/39a. 不久，四川又从松潘、建昌、成都的绿营各镇调了五百匹马给新调来的三千名满洲旗兵。XFFL, 141/30a–b.</li>\n<li>XFFL, 164/30a–32a, 164/35a.</li>\n<li>XFFL, 118/29b–30a.</li>\n<li>XFFL, 260/36b–38a. 嘉庆六年六月初十日，嘉庆命河南巡抚颜检送三百五十匹马、一百五十头骡到湖北。XFFL, 260/39b. 1802年春末，吴熊光从河南买了一百头骡，从襄阳、郧阳两府买了二百匹本地马，替换湖北军队疲惫的马。XFFL, 313/25b–26a.</li>\n<li>铃木中正认为满洲旗兵在击败叛军中作用最大，但其证据主要是关于索伦兵的。铃木承认：北京两营来的旗兵纪律差、不顶用。Shinchō chūkishi, 172–73, 179.</li>\n<li>事实上，旗兵还有另一个名声：行军途中骚扰勒索地方官员与百姓。广兴被派往四川时，嘉庆先让二十几名宫中旗兵护送军费入川，把广兴滞留数日再出发——好让广兴看看旗兵沿途的作派。QSLJQ, 40/3b.</li>\n<li>嘉庆四年三月十二日，嘉庆命他们返回，并褫夺了其统领讷音的副都统之职。XFFL, 90/17b, 92/29b–30a, 106/7a–b, 111/45b, 124/9b–10b.</li>\n<li>1799年底，明兴请求再从成都驻防调四百名旗兵，以便他能作战。XFFL, 128/33b–34b.</li>\n<li>XFFL 144/5b–6a. 1799年底，八百二十五名伤病旗兵被遣返，达州还有一千三百五十六名伤病旗兵。</li>\n<li>XFFL 133/40a–b.</li>\n<li>九百五十名广东兵被派往四川替换先前部署的广东兵时，1800年初只有三百八十五人到达四川。额勒登保请求准许罢免其统领七格——他声称在战斗中受伤，其实只是背部与膝盖轻微肿胀；嘉庆批准了请求。XFFL, 142/5a–6a, 142/9a–b. 嘉庆1799年初指出：他完全清楚军中名册虚报的问题。QSLJQ, 37/22b–23a; XFFL, 87/15a–b.</li>\n<li>1802年底，额勒登保为几名部下未按时归队的军官请求宽恕。嘉庆指示额勒登保逐案核查：士兵确实逃亡者惩处军官，情有可原者宽宥。XFFL, 347/9b–13b.</li>\n<li>XFFL, 144/5b–6a, 192/9a–12b.</li>\n<li>XFFL, 8/8b. 当阳围城期间，一些乡勇把硝石、硫磺、盐等物资卖给城内的叛军，还替他们传递消息。他们虽然是为钱，但其中有些人是同情者，也并非完全不可能。彭氏《当阳避难记》（Peng, Dangyang bi'nanji），无页码。</li>\n<li>秦承恩禁止他们杀死任何叛军俘虏，责令把所有俘虏解送官府。XFFL, 11/8a–9a.</li>\n<li>XFFL, 13/31a–32a.</li>\n<li>XFFL, 13/32a–b. 然而，明亮把三汊埠的乡勇单独挑出来，认为他们没资格再领补偿——他们已领过一名地方官捐的口粮。XFFL, 13/41a.</li>\n<li>QSLJQ, 7/5b–6a; XFFL, 13/38b.</li>\n<li>明亮多次使用这一招。其他满洲将领也用过。恒瑞1798年初试图阻止叛军在汉中渡汉江时，让撒拉兵扮成乡勇。XFFL, 54/24b–25a, 57/22a–23b, 59/34b–35b.</li>\n<li>XFFL, 54/29b–30a.</li>\n<li>XFFL, 20/25a–b, 21/30b, 55/5a. 一位目击者生动记述了当阳乡勇肆无忌惮的劫掠与暴行，声称论劫掠，\"邪匪如梳，乡勇如篦\"。彭氏《当阳避难记》（Peng, Dangyang bi'nanji），无页码。</li>\n<li>XFFL, 104/27b–28a.</li>\n<li>该谕旨见宜绵奏折所引，GZDJQ, 2381; XFFL, 33/34b–35b.</li>\n<li>战役方略的编纂者们称赞乾隆的决定有远见。XFFL, 33/35b–36b.</li>\n<li>景安的奏折日期为嘉庆二年四月十六日。XFFL, 34/40b–42a.</li>\n<li>XFFL, 34/45b–46b.</li>\n<li>《剿捕档》（Jiaobudang），嘉庆二年八月，135–38。</li>\n<li>XFFL 53/30b–32a, 53/33a.</li>\n<li>XFFL, 47/8b–10a.</li>\n<li>XFFL, 47/22b–23a.</li>\n<li>XFFL, 47/22b–25b.</li>\n<li>XFFL, 47/27a–b.</li>\n<li>GZDJQ, 3022.</li>\n<li>GZDJQ, 3022.</li>\n<li>乾隆命宜绵主持四川的招募；勒保（时任新任湖广总督）与汪新主持湖北；秦承恩与柯藩主持陕西；景安主持河南；英善主持甘肃。XFFL, 51/18a–20a; QSLJQ, 22/15a–16a.</li>\n<li>1799年秋，吴熊光奏报：不仅乡勇不愿参军，绿营兵之子也不愿补军缺。嘉庆认为原因是军官将领们没有足够关心他们的福祉。XFFL, 116/13b–14b.</li>\n<li>XFFL, 169/13b–14a. 新兵在正式补入正规军缺额之前只领部分饷银。</li>\n<li>XFFL, 93/9a–10a.</li>\n<li>宜绵1798年七月提到：一些人已可随时调遣。XFFL, 45/19b. 据七十五说，到1800年春，重庆府已募四千五百名新兵，其中一千六百四十八名已调出，二千一百八十名被派往营汛要地，只剩六百七十二名留重庆。XFFL, 164/6a–7a. 1799年秋，勒保抱怨经费短缺时提到：四川新募之兵每年耗资三十多万两。XFFL, 110/27b–28a.</li>\n<li>XFFLXB, 18/11a–12b. 湖北房县1797年募了三百名新兵；九十名驻房县县城，二百一十名驻均州。《房县志》（Fangxian zhi），6/3a。</li>\n<li>QSLJQ, 37/23a; XFFL, 87/15b.</li>\n<li>JQSYD, 4:151.</li>\n<li>QSLJQ, 39/29a.</li>\n<li>SHD, 嘉庆八年九月初八日, 91–95; XFFL, 114/21a–23a, 117/17a–b, 146/31b–32b, 150/27b–30b.</li>\n<li>《大清历朝实录》顺治朝，127/23b–29a。</li>\n<li>QSLJQ, 50/37a–39b.</li>\n<li>XFFL, 121/10a–13a, 188/22a–25b.</li>\n<li>XFFL, 139/1a–6a.</li>\n<li>关文发认为：嘉庆的朝臣缺乏原创性与创造力，导致嘉庆朝政的平庸。关文发《嘉庆帝》（Guan, Jiaqingdi），228。</li>\n<li>嘉庆1804年承认：这一方案已搁置多年。XFFLXB 27/30a–31b.</li>\n<li>福宁把乡勇从三千裁到一千八百，广兴又继续裁减。XFFL, 152/7b–9a, 160/7b–9a.</li>\n<li>XFFL, 147/49b–51a. 此前不久，嘉庆开始更多谈论乡勇的好处——如吸纳无业流民，使社会少些潜在叛军。更重要的是，他希望乡勇有助于早日收束战役，使雇他们的高昂代价物有所值——因为战争拖长就得调更多正规军，花费更大。XFFL, 142/20b, 143/11a–12b, 143/11a–12a.</li>\n<li>GZDJQ, 4941; XFFL, 149/6b–7a.</li>\n<li>XFFL, 149/13a–17a, 158/18b–19a, 161/20a–b, 162/20a–21b.</li>\n<li>GZDJQ, 10082. 仅重庆府一地，1800年春就迅速雇了五千五百八十名乡勇。XFFL, 164/7a.</li>\n<li>XFFL, 145/24a, 149/37b–38a, 162/1a–5b, 165/17a–19b, 169/9a–12a. 吴熊光对乡勇的不信任，见XFFL, 110/5a–b.</li>\n<li>XFFL, 148/9a, 149/29b–33b, 150/4b–10a, 151/19b–23a, 153/11a–b, 154/41b–42a, 154/43b–44a, 156/5a–b, 162/1a–5b, 162/10b–11a, 174/25b–26a, 192/1a–3b, 202/14b–18b. 实际数字会更大；仅谷城一县就按户抽丁，募了二千七百名乡勇。</li>\n<li>XFFL, 150/24a–25b, 154/44a–b. 1800年夏，台布遣返了六百六十九名伤病士兵。XFFL, 188/22a–25b, 188/27a–28b. 事实上，嘉庆1799年底就开始谈遣返伤病兵以省钱。XFFL, 130/18b–19a.</li>\n<li>文成惠的计划是：把正规军只集中于关键要地，用作机动力量，哪里叛军去哪里，但不疲于追击。这样也便于补给。XFFL, 155/12b–17b, 155/20a–b.</li>\n<li>XFFL, 168/6a–7a, 168/8a–10b, 178/12a–14b, 178/15b–17b, 178/18b–20a. 战役领导人一致认为新兵不顶用。额勒登保1800年初抱怨上年到达的新兵（XFFL, 144/7a–b），陆有仁1801年初也抱怨（XFFL, 235/6b–12b）。</li>\n<li>XFFL, 163/30b–31b, 169/13b–17b.</li>\n<li>初夏（闰月）的几道谕旨——有些很长——中，嘉庆敦促所有战场省份多雇不领饷乡勇、削减受雇乡勇。他强调：给有功者授六、七、八品顶戴与陛见之荣。XFFL, 172/31b–35b, 172/38b–39a, 175/27a–33a, 177/3b–7b, 179/14a–15a.</li>\n<li>嘉庆二年七月二十二日，乾隆号召所有村庄组织乡勇，鼓励士绅招募义勇、协助官军御贼。XFFL, 45/10a. 又见XFFL, 4/67a–8a。</li>\n<li>四川按察使先福1797年初就建议过这一点。他的计划是：乡勇只在征调时领饷领粮，叛军一被击溃逐走，就各归本业、自担费用。XFFL, 126/16b–18a. 该计划显然没有被执行。</li>\n<li>XFFL, 184/25b–26a; QSLJQ, 69/16b. 1800年底，陆有仁对两者的区别作了类似解释，不过他称受雇乡勇为\"官勇\"（guanyong）、自愿乡勇为\"民勇\"（minyong）。XFFL, 216/5a–6a.</li>\n<li>XFFL, 177/5b–6b.</li>\n<li>XFFL, 172/38b–39a, 174/31a–b, 177/5b–6b, 215/9a–b. 此前不久，应松筠之请，嘉庆追赠了南漳一名被杀\"义勇\"官职——此人原有官衔，曾自费组织乡勇。XFFL, 162/1a–5b, 162/8a–b.</li>\n<li>《钦定剿平三省邪匪方略》的编纂者们称赞嘉庆是发起乡勇与筑堡的谋主，并把战役的最后胜利归功于嘉庆\"远见\"而\"英明\"的决定。XFFL, 169/18b.</li>\n<li>龚景瀚\"平贼议\"，《澹静斋文钞》（Danjingzhai wenchao），外篇，1/18a。</li>\n<li>XFFL, 158/16a–b.</li>\n<li>XFFL, 144/8b–9a, 154/40b, 157/7b–8b, 158/16a, 173/3a–5b, 173/6b, 180/4b–6a, 235/6b–12b. 也有少数例外。1800年夏，署理陇州知州率领的五千名自愿乡勇挫败了高马股北渡渭河的企图。XFFL, 198/23a–24b.</li>\n<li>1800年底，姜晟招募了数万名\"义勇\"，协助正规军守郧县、竹山、竹溪边境的关卡。他们只在当值时领口粮。XFFL, 206/12b–18a, 209/15a–17b, 217/16a–20a.</li>\n<li>XFFL, 173/3a–5b; 吴熊光《伊江笔录》（Wu, Yijiang bilu），1/16a–b。</li>\n<li>XFFL, 175/12b–13a.</li>\n<li>嘉庆批准了这一提议。XFFL, 211/4a, 229/6b–14a.</li>\n<li>XFFL, 184/25a–29a; QSLJQ, 69/16a–18b. 关于附加费的更多讨论，见\"结论\"。</li>\n<li>QSLJQ, 70/12a–14b.</li>\n<li>勒保与德楞泰奏报：他们已在一些地方把受雇乡勇转为自愿乡勇，但在另一些地方保留了一半或全部。勒保指出：他从贵州带来约一千名乡勇在夔州、巫山服役，他们必须用军费发饷。XFFL, 203/24a–26a.</li>\n<li>GZDJQ, 7059; XFFL, 228/19b–20a, 231/36b–41a. 但勒保也奏报过自愿乡勇协助作战，赢得嘉庆的一再称赞。XFFL, 189/17b.</li>\n<li>XFFL, 236/8b–9b, 236/15b–16a.</li>\n<li>XFFL, 231/6b–15a. 陆有仁呼应了文成惠的提议，呼吁在要地驻军，以自愿乡勇守川陕边境的关卡。XFFL, 216/4a–7b.</li>\n<li>XFFL, 231/19b–20b.</li>\n<li>XFFL, 232/26a–31b, 232/31b–33a, 241/1a–8a, 241/15b–17b; QSLJQ, 80/4a–b. 书麟还拒绝把二百五十二名河南兵送回家——他们强壮娴熟。XFFL, 234/16a–17a.</li>\n<li>XFFL, 229/30a–32a.</li>\n<li>XFFL, 253/5a–15a.</li>\n<li>XFFL, 253/16b–17a.</li>\n<li>据额勒登保说，投降的叛军也被编为\"新勇\"。XFFL, 328/8b–16a.</li>\n<li>XFFL, 328/16a–19a.</li>\n<li>XFFL, 328/19a–20a.</li>\n<li>嘉庆九年正月二十五日上谕，NGDK, 125650。</li>\n<li>XFFL, 328/20a–21b.</li>\n<li>XFFL, 1/2a–b.</li>\n<li>关于宁陕兵变，见Atwill（艾特威）\"Tyranny of Reasonableness\"及\"Ambivalent\"；关于瓦石坪兵变，见XFFLXB, 36/20b–21b。</li>\n<li>嘉庆同意该镇征募乡勇与无业流民，并指示该镇总兵善待他们。XFFLXB, 17/1a–6a.</li>\n<li>XFFLXB, 17/1a–6a, 22/44a–b. 额勒登保等所请的宁陕镇官兵待遇，包括提高饷银、增加骑驮、赏恤等。XFFLXB, 23/5a–8a.</li>\n<li>XFFLXB, 31/9a–10a.</li>\n<li>XFFLXB, 35/23a–30b, 35/30b–35a, 36/1a–6b, 36/8a–12b; 嘉庆十一年上谕档（SHD），8/29a–30a; 关文发《嘉庆帝》（Guan, Jiaqingdi），320–22。</li>\n<li>XFFLXB, 36/6b–10b, 36/14a–17a.</li>\n<li>XFFLXB, 36/17a–23b.</li>\n<li>第一次兵变发生在1680年，即吴三桂之乱后三藩裁军期间。</li>\n<li>XFFLXB, 35/30b–35a.</li>\n<li>XFFLXB, 36/17a–23b.</li>\n<li>松筠因此被降职。QSLJQ, 208/20a–22b.</li>\n<li>嘉庆在一道关于此事的谕旨中用了这个词。QSLJQ, 207/26a–29a.</li>\n</ol>", "text": "\n官府招募平民充作战兵，还把他们外调他省数年，这算什么道理？朕闻所未闻……军队竟然不能保国安民，反要仰赖从未受过训练的平民上阵作战，那么养常备军还有什么意义？\n——嘉庆皇帝，1804年\n[译者按：原上谕自英文直译，文言原文待核。（出处见章末注释）]\n\n清朝对白莲教叛军的战役是一场灾难，堪称清史上到那时为止最不成功的一场战争。除了空前而不正当的漫长持续时间与巨额耗费外，清朝大规模雇用平民充当作战力量也是前所未有的。这些平民乡勇与正规军并肩作战，或代替正规军作战。起初作为弥补兵力不足的权宜之计，后来成了战役统帅、军官、后勤人员与地方官员侵吞军费的借口，反过来又推高了战争费用。乡勇遣散的一塌糊涂，是延误战役收束的关键因素。最重要的是——尽管既往研究有所忽视——战役中广泛使用平民，在清朝统治精英中引发了一场关于改革清朝军事制度的讨论：或扩大绿营规模，或提升其素质，使之能在任何地方应对叛乱或动荡，而无需调动满洲旗兵或雇用平民。然而，这一改革设想没有实现——嘉庆皇帝最终选择继续使用非常规兵员来了结叛军残部，并长期维持清朝军事制度的现状。嘉庆虽然最终谴责并停用了受雇乡勇，却错失了一次改造过时的清朝军事制度的机会。与乡勇困局及其影响相关的，还有战争中族群士兵的使用，以及\"坚壁清野\"之策——后者历来被认为是对白莲教叛军取得最后胜利的决定性措施。然而，把这一策略置于历史语境中考察，会得出截然不同的结论。\n从权宜之计到自成体系，1796—1799年\n白莲教战争研究的匮乏之外，对战争中受雇乡勇的研究也十分稀少。魏源在《圣武记》中描绘了几位杰出的乡勇，却没有勾勒使用乡勇这一做法的结构与机制，尽管他暗示乡勇可能是镇压教门叛军的关键。^1 魏源说，他所用史料中关于乡勇的信息是零碎的。他的描述不足，使人弄不清乡勇的规模有多大、与作为地方社群自卫力量的传统乡勇有何不同。后者由地方精英——如士人与商人——组织，靠私人资金维持。在关于太平天国时期精英主导地方活动的经典研究中，清史学者孔飞力把白莲教战争中的\"乡勇\"视为太平天国时期士绅主导乡勇的前身。孔飞力虽然指出白莲教战争中有事实上的雇佣兵——受雇乡勇——的存在，却给人留下的印象是：地方精英主导的乡勇在这场战役中比雇佣兵更重要。^2 结果，\"地方精英组织领导的乡勇对清朝战胜白莲教叛军起了关键作用\"这一简化结论，获得了接受与主导地位。\n事实上，与数十万受雇乡勇相比，地方精英主导的乡勇在白莲教战争中只起了边缘作用。18世纪80年代之前，清朝一直避免使用未经训练的平民充当作战力量。满洲统治者珍视尚武精神，一直警惕着：把作战交给平民，会使军事制度丧失职业性。使用平民参战的做法，直到18世纪最后二十年才出现。^3 18世纪晚期，乾隆就边疆战争与国内战争的区别提出了新学说：内部叛乱只要不威胁政权，就不应像边疆战争那样，从北京或满洲调动大批精锐旗兵。同时，朝廷也努力遏制不断攀升的军费——尤其是战时军费——其结晶就是《军需则例》的编纂。新法典使战时请款更难以使用旧借口，则例颁布之后，清军不得不寻找绕开中枢财政机构审计的途径。正是在这一背景下，乾隆朝后期几场叛乱中开创了使用受雇平民作战的做法。\n首先，1784年镇压甘肃石峰堡新教回民起义的战役中，平民被雇用加入军队。主要统帅之一的福康安在二十多个县招募了大量平民协助军事行动。这些被雇平民被标为\"民夫\"（minfu），只承担守城、守要地等军事任务。为支付这些受雇平民，福康安每月花费可能超过十万两——这构成了这场战役开支的大头，且与刚颁布的《军需则例》背道而驰。福康安本人就是编纂《军需则例》委员会的成员，他曾保证要减少乡勇的使用。^4 这场常被忽视的石峰堡战役，其实是平民被大规模征募执行军事任务的第一个先例，它表明：只要将领们敢于试探国家容忍的底线，战争中就存在《军需则例》未载的新先例的空间。\n第一次尝试之后，同一个福康安在他指挥的另外两场战役中再次运用了这一方案。1787—1788年，他在当地雇平民协助镇压台湾林爽文起义。^5 这些人被称为\"义勇\"（yiyong），据称是出于公益之心自愿参战的。中枢政府没有对这一做法皱眉，认为它比从大陆调更多兵到岛上划算。嘉庆皇帝后来把台湾战役视为平民受雇参战的第一例。^6 1795—1796年，福康安主持镇压苗民起义的战役时，他轻而易举地再次运用这一方案，规模却大得多。这一次被称为\"乡勇\"的受雇平民，为将领们向国家索取巨额经费提供了借口之一。^7 他们究竟招募了多少乡勇不完全清楚，但从仅贵州一省申报的乡勇伤亡就超过一万二千这一事实，可以窥见其规模之巨。^8 三案的核心人物都是福康安，这并非巧合——他以追逐财富毫无顾忌、挥霍国家经费臭名昭著，后来被嘉庆严厉而反复地斥为军制腐败丛生的罪魁。^9 尽管战时腐败更是一个结构性问题，福康安确实开创并发展了这一新做法。\n在白莲教战争中，雇用平民补充正规军的方案得到了广泛推行。湖北起事爆发时，湖北绿营的大部分兵力已开赴苗疆战役；捉襟见肘的湖北当局为弥补劣势临机设法。枝江首起事几乎刚爆发，毕沅就号召受波及各县组织乡勇。惠龄赶赴枝江时，既带正规军，也带乡勇。^10 数日后，惠龄奏报：\"现已派兵分往通贼各路远近村镇，雇募乡民，发给器械，设卡盘查。\"（原文待核，见注释11）^11 在许多地方，地方精英——包括文武生员与商人——热情响应号召，建立了地方乡勇。^12 然而，在大多数情形下，主持其事的是府县官员。^13 数月之内，湖北各类乡勇如雨后春笋；所有县份——包括远离起事地点的——都招募了数百到数千名乡勇。此后数月战事起伏，一些县继续招募更多乡勇。^14\n效法湖北，河南与陕西都组织了乡勇。在河南，景安招募乡勇以缓解兵力不足。南阳知府完颜岱鼓励与湖北接壤的邓州、新野、唐县等县雇乡勇，防止湖北叛军渗入。^15 在陕西，秦承恩组织乡勇守卫兴安府境内与湖北郧阳府犬牙交错的关卡。秦承恩派官员从各县挑选一千至两千名乡勇，责令他们随当地军队巡逻、缉捕零散起事者。^16 这些地方举措立即赢得了皇家的认可。三月初，毕沅请求从北京调三千名援军时，乾隆拒绝了请求，但指示毕沅利用地方积极性与资源自卫。他承诺日后奖赏表现突出的地方领导人。^17\n在四川，组织乡勇甚至在起事爆发之前就开始了。湖北起事把难民送到了四川东部边境，而许多地方军队仍在苗疆战役中，四川当局便依靠乡勇维持秩序。^18 达州、通江与巴州起事爆发后，英善加快了这项工作，号召组织自卫乡勇——因为除从苗疆战役遣回五百名四川兵外，北京没有向四川派任何援军。很快，战事波及地区的一个县就招募了数千名乡勇。^19 与湖北一样，地方精英积极参与。^20 然而，当局的介入很快把许多起初由当地居民建立的乡勇转变成了官府发饷的乡勇。从成都赴达州途中，英善招募了两千多名乡勇，加强他那只有五百名士兵的小部队。^21 在达州，英善幕中的石作瑞挑选了一千名精壮乡勇，训练其作战技能。他们很快投入了战斗。后来，石作瑞又挑选装备了一千多名强壮的军事民夫，守卫达州的清军营盘。这些努力为石作瑞赢得了越来越大的名声与皇家的赏赐顶戴，使他跃升为四川有权势的后勤大员。^22\n四川战场使用乡勇作战并非特例。毕沅在当阳招募乡勇时，允许他们在守村与随军作战之间选择。结果，越来越多的乡勇选择参战。当阳围城最后阶段，毕沅与舒亮抱怨兵力不足，许以\"重赏\"、辅以\"教化激励\"，三天内雇了两千多名乡勇；一半守卫清军营盘，一半投入战斗。^23 在河南，1796年九月，完颜岱指挥的乡勇\"自愿\"参加战斗，击退了湖北来的叛军。^24 在陕南，1797年初攻打安康光头山叛军据点的战斗中，秦承恩多雇了乡勇——因为宜绵带走了大批陕西军队入川。\n最终，\"官募乡勇\"（gumu xiangyong）分为两类。更熟练能干的乡勇被编入随清军行动的营队——远离家乡——称为\"随征乡勇\"（suizheng xiangyong）。他们的营队由乡勇同伴或清军军官带领。无论哪种情形，他们都受所附部队军官的指挥。许多乡勇随同一支部队作战多年。留在家乡守卫村庄、城镇与关卡者被称为\"防守乡勇\"（fangshou xiangyong，或fangka xiangyong）；其人数远多于随征乡勇。他们若不同正规军一起守某地，就由自己的头目带领——头目有时称为\"卡首\"（kashou）。同时，知县知府及其他地方官员招募并指挥自己的乡勇。战役后期，一些地方的防守乡勇也被用作军事民夫。^25 两类受雇乡勇合称\"征防乡勇\"（zhengfang xiangyong），或简称\"乡勇\"（xiangyong）。乡勇没有制式服装，但有些人配发了衣帽；或者只佩带标识乡勇身份的标牌。^26 为与正规军区分、并区分不同的乡勇队伍，乡勇使用不同的旗帜——例如，湖北乡勇用红旗，四川乡勇用绘有八卦图案的旗帜。德楞泰的随征乡勇编为三队，使用三面不同的旗帜：阵阵得胜旗（zhenzhendeshengqi）、如意旗（ruyiqi）与花蜈蚣旗（huawugongqi）。^27\n冲突第一年还没结束，受雇乡勇就被调往他省。1796年秋，永保把河南邓州的数千名乡勇调到湖北——他们显然领饷，被永保用作作战人员。乾隆认可了调动，但指示派军官率领他们。^28 1797年春，清军围攻东乡县城时，从四川其他地方与湖北竹溪调去了乡勇。^29 1797年春末，襄阳叛军逼近陕西汉江时，汪新从湖北郧阳府调数千名乡勇入陕。然而，这一次乾隆不赞成，认为此举是\"大错\"——因为乡勇只善于守御家乡，上不得战场。他对湖北已恢复太平、乡勇仍被留用也不满，于是命他们无论走到哪里都返回家乡，并命作此调动的官员自付所费。^30 但这一指示没有被遵守。数月后，明亮与德楞泰离川追击襄阳叛军时，很可能带走了四川乡勇，尽管他们从未奏报。1799年，富成率两千名川豫乡勇在陕西作战。富成被罢免后，这些乡勇移交给了王文雄。^31 1800年初额勒登保撤出四川时，带走了数千名四川乡勇。到那时，随征乡勇是机动力量、可随正规军调往任何地方，已成惯例。\n为与受雇乡勇区分，以社群为基础的自愿乡勇在清朝档案中通常被称为\"团练乡勇\"（tuanlian xiangyong，简称\"团勇\"，tuanyong）。更长的表述解释了两者的区别，称他们为\"民间自行团练之勇\"（minjian zixing tuanlian zhi yong）。总体而言，\"团\"或\"团练\"从不与受雇乡勇关联，而\"乡勇\"一词则含糊，两类皆可指。事实上，两者之间的界限有时是模糊的。前线人手紧缺时，自愿乡勇可能被军队征用。^32 也有自愿乡勇随正规军参加行动、此后随军而行、领取饷银口粮的情形。^33 自愿乡勇一旦开始用军费发饷，就转变为受雇乡勇。自愿乡勇虽从地方精英与富户筹款中获得一些补偿，但与受雇乡勇丰厚的饷银犒赏相比，不值一提。因此，随着战役推进，各地都面临靠私人资金维持社群乡勇的难题。\n起初，受雇乡勇的报酬常常是临机决定的。^34 听说惠龄等人在湖北补偿乡勇的做法后，乾隆于嘉庆元年二月二十一日认可了这一做法：\"帮同守御、协助官军之乡勇，自应奖赏。若实系出力杀贼、擒获贼首者，应给予盐菜口粮，并照官兵一体奖赏。如此，则乡勇知所激励，踊跃出力，于剿捕更为得力。\"（原文待核，见注释35）^35\n这道谕旨虽然不精确，此后却被湖北的战争主持者们用来提高乡勇的待遇。他们在奏折中总是说，乡勇\"遵旨发给盐菜口粮\"。^36 毕沅甚至把这道圣谕抄在黄纸上广为张贴，以招募更多乡勇——惠龄也照做了。^37 确实，报酬激励了很多人。三月，惠龄奏报：湖北一些州县各有七八千名乡勇，其他至少有二三千名，全部\"按兵丁标准\"发饷。^38 由于乡勇的补偿不见于《军需则例》，湖北官员以石峰堡战役与同时进行的苗疆战役为先例作标尺。湖北树立的样板很快被陕西效法。^39 在四川，乡勇起初只按湖北的标准领饷——换言之，与正规军同饷。粮价上涨时，又加发口粮。^40\n渐渐地，乡勇的补偿更加结构化。除\"盐菜银\"外，乡勇还领口粮与其他福利。平均而言，他们的月饷超过二两——高于绿营兵一两半至二两的月饷。乡勇调往他省时，月饷高达三至四两。受雇时，他们还会领五两\"安家银\"（anjiayin）——补偿他们离乡别业造成的经济损失。若调离家乡地区，标准更高。^41 乡勇的饷银在整个战役期间波动。主事官员们往往倾向于请求加薪。1799年秋，由于粮价上涨，松筠请求：无论是否临敌，乡勇的口粮都从每日八十文提高到一钱银子。^42 习惯了优厚待遇的乡勇，很少容忍削减或拖欠。1797年底，由于达州的清军补给线被叛军阻断，四川白岩山前线的乡勇数月领不到饷，就开了小差。^43\n遵照乾隆\"乡勇有功应赏\"的指示，^44 将领们在每次所谓胜利之后都赏乡勇银钱，尽管通常少于赏正规军的。然而，最普遍的做法是授乡勇官帽顶戴。早在1796年三月，惠龄就给有功乡勇授过七八品的官帽顶戴，并承诺：再立新功就为他们请授\"实职\"。授顶戴很快成为湖北战场的标准做法，尽管事先要请得皇帝的认可。^45 在四川，乡勇获授顶戴的第一例出现在1797年初宜绵指挥平定太平三处叛军据点之战后。^46 1797年晚些时候，乾隆在一道谕旨中附上一些花翎（hualing）与蓝翎（lanling）交给将领们，让他们自行授予有功军官以及已有五、六、七品顶戴的乡勇，无需事先奏请。^47\n顶戴授得滥了，将领们便开始给乡勇授低品荣衔。随后，一些荣衔成了实职。1799年秋，接到罗昂\"将领们没有妥善奖赏乡勇\"的批评后，嘉庆皇帝进一步更新了对乡勇的奖赏。他担心荣衔不够——战役结束后，乡勇回乡仍可能被知县蔑视欺辱——于是命将领们为贡献卓著的乡勇奏请实职。^48 回应嘉庆的裁定、也间接回应罗昂的批评，额勒登保奏报说：为普通乡勇及其头目奏请实职早就是惯例。他以桂涵与刘星渠为例——二人分别被任命为都司（dusi）与通判——并说\"众多\"乡勇已被任命为把总（bazong）与千总（qianzong），获蓝翎。^49\n战斗中，乡勇总是被摆在正规军前面，他们的伤亡远比正规军惨重。^50 乾隆并非对此视而不见，曾警告不要拿乡勇当先锋。为表关怀，从1796年中起，乾隆为阵亡的杰出乡勇发放抚恤，并明确表示打算把抚恤推广为整个战区的通则。^51 然而，他的指示没有得到统一执行；阵亡乡勇获得抚恤的记录很少。^52 嘉庆接手后，继续批评正规军躲在乡勇后面，并哀叹：叛军也把被裹挟平民摆在自己前面，结果官军很少与叛军遭遇，杀死的只有平民。^53 1799年夏末，松筠请求：准许对陕南两场战斗中阵亡的九名乡勇头目按绿营最低阶军官\"外委把总\"的标准发放抚恤，并对四百八十多名死伤乡勇发放伤亡抚恤——嘉庆批准了。此外，他命所有阵亡乡勇都获得抚恤，作为通则，而不只是有功者。数日后，在给其他战场将领的谕旨中，嘉庆告知了这一新政策，责成他们不要忽视乡勇的贡献。^54 当然，对受雇乡勇补偿的升级，将进一步推高飞涨的军费，并为腐败提供更多机会——下一章将讨论。\n受雇乡勇虽然随战争推进而制度化，清朝却从未打算让他们正式进入军事制度。相反，遣散他们的呼声出现得很早、很频繁。1796年秋，湖北大多数起事被扑灭、其余被遏制时，御史潘绍经弹劾乡勇滥杀平民、向平民勒索钱粮，请求除仍守关卡要地者外，在湖北解散乡勇。乾隆同意潘绍经的意见，命永保及其部属落实。乾隆说，雇用乡勇只是正规军不足时的权宜之计；他担心叛军肃清之后，乡勇会闹事。^55 毕沅虽然为乡勇辩护、反驳潘绍经的指控，却承诺：一地一旦平靖就遣散他们。^56 这——堪称第一次——遣散乡勇的呼吁之后，每多一处战火平息，乾隆就颁发同样的指示。\n然而，鉴于地方官员的普遍抵制，遣散乡勇注定命途多舛。他们在此地解散乡勇，在彼地又以自卫之名保留，或者把难民编入乡勇或军事民夫队伍，作为安置流民的办法。^57 随着冲突继续，很快证明专注于遣散为时过早。在陕西，秦承恩刚解散兴安的乡勇，达州起事爆发、襄阳队伍又从河南向他逼近，他不得不招募更多乡勇守卫汉江与川豫边境。^58 如上所述，汪新派乡勇入陕协助攻打襄阳队伍时，他正在湖北解散乡勇。\n派其中一些入陕，正是让他们继续受雇的办法。正如魁伦1799年底所说：\"贼匪往来无定，此裁彼增，或裁而复募。\"（原文待核，见注释59）^59 正如嘉庆1800年中承认的，这在所有战场都是反复出现的情形。^60\n事实上，高潮还在后面。主要由于襄阳叛军的流动，中枢政府与省级当局都呼吁多雇乡勇，推动乡勇在整个战区的大扩张——从1796年底到1798年初。^61 在湖北，永保、继而惠龄在与襄阳叛军作战时招募了大量乡勇。为防止起事者裹挟平民，惠龄把襄阳一带的居民迁到汉江东岸，把精壮男子编入乡勇守江。1797年春，胡齐仑率领一支六千人的乡勇大军守卫关卡。^62 1797年秋姚、王队伍返回湖北时，又掀起一波招募乡勇的浪潮。例如，竹山与竹溪各雇了一万多名乡勇。^63 姚、王队伍离开湖北赴陕后，汪新与景安解散了汉江以东鄂豫两省的全部乡勇，但保留了一支三千人的乡勇协助守汉江。然而，郧阳府保留了百分之七十的乡勇。^64 到1798年底，湖北据说累计雇用了三十六万六千七百名乡勇。^65\n在陕南，从1797年底到1798年春，大量乡勇被雇用于地方防务与守卫汉江——尤其是汉中府境内水浅而窄的上游河谷。乡勇大多由地方官员率领，一再挫败了叛军北渡汉江的企图。1798年初，高均德渡过汉江、李述逼近栈道后，秦岭山区——包括栈道沿线——又雇了更多乡勇。^66 陕西乡勇总数从1797年底的一两万迅速增加到四五万甚至更多。^67 1798年春姚、王队伍被消灭后，扩张并未停止。张汉潮在秦岭穿梭，汉江两岸的受雇乡勇大体保留了下来。此外，川鄂边境沿线还雇了更多。仅西乡一县就雇了三万多名乡勇。到1799年底，陕西的受雇乡勇总数可能超过十万。^68\n在四川，1797年同样是雇乡勇的高峰。年初，英善鼓励地方精英组织更多乡勇守卫本社与要地。宜绵到来后——鉴于他在陕南成功使用乡勇——呼吁多雇乡勇。毫不奇怪，只有十几个士绅响应，他们招募了一千多名乡勇，但大多数新乡勇是官员雇用、由军费发饷的。^69 春天激烈的战斗中，明亮与德楞泰使用了数千名乡勇——他们由乡勇头目与军官共同带领，有时与正规军混编。^70 两名乡勇桂涵与罗思举在战斗中表现突出，后来被称颂为乡勇英雄的楷模。^71 同年晚些时候，乡勇队伍至少两次大幅膨胀：先是襄阳队伍从陕西逼近四川时，随后是明亮与德楞泰率清军精锐离川追击襄阳叛军入鄂、使四川成为叛军游击战的最佳场所之后。^72 结果，许多县——包括远离热点的——都雇了乡勇，人数从数千到一万多不等。全省范围，1797年某些时点乡勇总数据说超过三十四万。^73 并非巧合的是，四川当年吞掉了一千万两军费。1798年初勒保与福宁先后到川后，不得不收敛雇用、进行裁减，把远离战场的乡勇移出军饷名册。据勒保说，名册上的乡勇从1798年初的十万至二十万降到1799年的四万左右，^74 但真实数字可能更高。\n受高额报酬、官帽顶戴乃至官职，以及战利品——战役早期起事者财物较多、尤为丰厚——的诱惑，许多人急于受雇。然而，乡勇的构成因地而异，并在漫长战争中不断变化。在河南，大多数乡勇是农民；1803年遣散时他们回了家，惹的麻烦最少。^75 在湖北与陕西，1799年之前，大多数乡勇是本地招募的，也主要是农民。四川冲突早期也是如此。^76 随着战争拖延，四川越来越多的无业流民、有前科者与不法之徒——如啯噜匪徒、私铸钱币者与私盐贩子——加入了乡勇，因为四川此类人比邻省更多；档案印证了这一点：四川阵亡乡勇的绝大多数没有家属领取抚恤——尽管有些名字可能是后勤人员伪造的。^77 四川难以受雇后，许多此类人去了陕西与湖北。战争后期，陕西随征乡勇的很大一部分是四川人。^78 1799年之后，清军把四川、陕西的乡勇带到湖北，一些乡勇被编入绿营——这吸引了许多流民到湖北寻找机会。正如吴熊光一再抱怨的，湖北的外籍乡勇——大多来自四川——在被遣散时是闹事的主力。^79 然而，通过把大量流氓无产者吸纳入乡勇，受雇乡勇方案实际上釜底抽薪，切断了叛乱的兵源。有些地方，连雇作军事民夫的壮丁都没有了——这在18世纪以前的战争中从未发生过。^80\n族群士兵\n除乡勇外，白莲教战争中还有另一类非常规兵员：族群士兵。他们通常被称为\"土兵\"（tubing）、\"番兵\"（fanbing）或\"土练\"（tulian），是帝国边缘非汉土司的武装力量。土司臣服清朝时，常常被允许保留自己的军队。清朝初年有时招募族群士兵协助驻守边疆，但除满洲外，不倾向把他们投入战争。^81 从18世纪初扩张到西藏开始，清朝更多地使用族群士兵。第一次入藏驱逐准噶尔蒙古人——他们1717年侵入西藏、占据拉萨——的远征中，清军从康区（西藏东部）招募了藏人及其他族群的士兵加入行动，其中一些随清军进抵拉萨。^82 此役之后，土兵被招募来充实川藏大道沿线新设的哨所。这是维持清朝在这一新领地军事存在的划算办法。^83\n雍正年间，把青海（Kokonor）与西南土司领地并入的战役，使更多土兵武装处于清朝庇护之下。其中一些族群士兵被编入地方驻防；其头目被授以绿营官衔，但加\"土\"字前缀，如\"土游击\"\"土把总\"。他们被用于镇压当地族群起事的战役，但很少被调出家乡地区。乾隆年间，金川地区的嘉绒士兵被征召参加两次金川之役。1765至1770年间，云南边境的土兵被招募参加清朝对缅甸的入侵。土兵出动时通常领饷，但标准总低于旗兵与绿营兵，^84 尽管皇帝不时随兴赏赐他们。\n征募族群士兵参加边疆战争虽已成为清朝向西、向西南扩张的固定做法，国家却直到《军需则例》才试图把这一做法制度化——则例包含了对参战土兵补偿的具体规则。土兵如今有权获得旗兵与绿营兵几十年来所领的几乎所有战时津贴与犒赏，尽管部分福利的标准降低。口粮与\"盐菜银\"，他们按绿营兵的标准领取（前者每日八合三勺，后者每月一两三钱）。^85 土兵待遇的显著提升，标志着清朝军事战略中一个重要而微妙的变化。清朝不再把他们当作维持家乡秩序方便而廉价的工具，而是可以拿他们当雇佣兵用了。鉴于他们的战斗力与耐力常常超过包括旗兵在内的正规军，即使补偿提高，用他们打仗仍比部署正规军划算。\n确实，18世纪最后二十年里，土兵更多地被调遣，常常离开家乡地区。以勇猛著称的嘉绒士兵在此期间一再被征调。第二次金川之役后，数千名归顺的嘉绒士兵被编入金川设立的军屯。他们由国家发饷，被称为\"屯番\"（tunfan）。^86 18世纪80年代初，他们被派往甘肃镇压两场回民起义。几年后，他们被派往台湾镇压林爽文起义。紧接着，金川兵又参加了平定越南叛乱的战役。1792年清朝最后一次远疆战争——入侵廓尔喀王国——中，乾隆皇帝不愿远调满洲兵与绿营兵。结果，嘉绒与藏兵占所调一万五千至一万六千名军队的一半；只有一千一百名旗兵（巴图鲁一百名、索伦兵一千名）从满洲派出。^87 在所有那些战争中，嘉绒兵都证明了自身的价值，尽管他们有时难以适应当地条件。乾隆为他们的勇猛所动，称赞他们，授衔赏物。^88\n乾隆—嘉庆交接之际，这一做法延续下来。镇压苗民起义的战役中，贵州的仡佬人被征募。^89 白莲教战争中，多种族群士兵被调遣。在鄂西南，毕兹卡士兵被用来攻打长阳的叛军。^90 1797年春，时任陕西按察使的倭什布指示西安的几位穆斯林头人挑选三百名精壮穆斯林，送他们加入清军。倭什布本打算雇更多穆斯林，但乾隆反对从西安穆斯林社群中雇太多。^91 川西的嘉绒与藏兵多次被调遣。第一次是1797年初，绰斯甲的土兵被派往达州。^92 1799年，勒保在他被罢免前不久征调了四百五十名金川兵。那些金川兵被额勒登保带走，追随他约一年，1800年秋被遣返。^93 1799年底，阿迪斯调了两百名金川土兵，把他们带到大宁。^94 叛军渡嘉陵江之后，魁伦下令调三千六百名川西土兵，尽管实际有多少到达前线不清楚。^95 人数虽少，嘉绒与藏兵却备受珍视；他们与吉林来的索伦兵一道，被称赞为最有效的兵员。^96\n一次新的经验是调遣甘肃循化厅的撒拉族穆斯林士兵。他们虽然被清朝用于几场本地战役——包括镇压两场回民起义——撒拉兵此前从未被调出家乡。^97 1797年春，襄阳叛军经陕西入川时，宜绵在达州除其他援军外，调了两千名撒拉兵入陕。将领们焦急地等待着那些撒拉兵。然而，他们直到夏末才到；署理陕甘总督陆有仁因延误被归咎而遭罢免。^98 然而，延误暗示撒拉一方有所抵制。到达后，由\"土游击\"韩光祖率领的撒拉兵立即被派往四川，随后被明亮带往湖北追击襄阳叛军。他们作战勇猛，尤其擅长山地行动。然而，据说他们桀骜难管，造成纪律问题。同时，不适应中原炎热的夏天（循化几乎全年气候宜人），许多人染病，死亡四百多人，包括韩光祖本人。1798年初，远征的余部被送回循化。^99\n1799年春末，两股叛军——蓝号与白号——从四川逼近甘肃南境时，撒拉兵再次被调遣。从官方档案拼合的故事如下：撒拉头目韩四个一再请求赴前线，攻打侵入其本省的叛军。韩四个对撒拉兵前一年的提前返回感到懊悔，立誓这次要挽回声誉。鉴于他们过去的桀骜，广厚拒绝了他的请求。然而，韩四个与其子韩三个率领一队撒拉兵自行开赴前线。得知此事，广厚与松筠都派官员——包括一名穆斯林专家——护送他们。五月中旬，四百九十八名撒拉兵——而不是韩四个所称的一千名——到达广厚大营，参加了阶州之战。^100\n撒拉人是否真的自愿参战无法确知，但到达前线的撒拉兵不足五百这一事实，透露出故事中的裂痕。更可能的是：广厚与松筠怀疑嘉庆未必批准调遣，便造成既成事实。嘉庆向回京改任的陆有仁询问之后，认可了这次调遣——因为这次是为\"保卫本省\"。但他指示松筠与恒瑞认真管束、慷慨犒赏。事实上，松筠与广厚都已赏他们银两，并报销了韩四个垫付的旅费。1799年夏甘肃肃清叛军后，嘉庆命广厚暂时留用他们，并因韩四个及其他撒拉头目作战有功、纪律良好，授他们低阶绿营军官顶戴——尽管广厚已经用银钱与羊、茶等礼物赏过他们。^101\n据说，撒拉人表示愿意暂留，但表示不愿被派往陕西、四川——在那里容易染病。广厚派一名熟悉撒拉事务的地方官员监督他们。^102 数月后，九月，韩四个去见广厚，以甘肃秦州、徽州气候湿热、许多士兵染病为由请求返乡。请求先经广厚、再经朝廷批准；广厚备了盘缠、安排了食宿护送。^103 然而，他们的返程被耽搁了——松筠命他们赶赴陕南守卫汉江。十月初撒拉兵到达汉中时，松筠会见了他们，赏了冬衣冬帽。由于他要前往汉江更远的上游河谷，松筠让被押解来受审的庆成率领那些撒拉兵。^104\n嘉庆对松筠的安排极为恼怒。其一，他认为在已向陕西派了其他援军的情况下，违背撒拉兵意愿强行动员这批桀骜之师并不明智。其二，更重要的是，嘉庆认为让庆成——一个正在受查的罢职官员——率领他们尤其不可接受，因为撒拉兵会轻视庆成。然而，撒拉人既已到陕，嘉庆没有命他们撤回。相反，他告诫不得强迫他们作战，并指示：一旦可能就送他们回家。^105 接到嘉庆的谕旨，松筠立即把撒拉兵召回汉中，随后派官员护送他们回循化。嘉庆再次被松筠的反应激怒，斥责他前后不一。此事进一步败坏了嘉庆对松筠本已日益负面的印象；松筠不久就被罢免了。为安抚撒拉人，他们平安到家后，嘉庆赏了他们银钱礼物，并蠲免了他们所欠的三千两银子。^106\n1800年初，广厚还从西南蒙古调了七百名阿拉善蒙古兵入甘，但嘉庆命他们立即返回，并责备了广厚。^107 唯恐触动西北边疆新的动荡——那里族群间的仇隙并不罕见——乾隆与嘉庆在使用该地区族群士兵上一直谨慎。^108 在战役漫长的收尾阶段，清朝没有再调遣族群士兵。\n与受雇乡勇不同，族群士兵是作为帝国的臣服成员被征召参战的。一旦出动，他们就处于严密监视之下——包括往返前线的途中——尽管他们获得慷慨的补偿与犒赏。过去曾发生过土兵武装一时为清帝国而战、一时又反清而战的情形。有时，他们与清朝边疆官员的关系是其顺从与效力的一个因素。^109 因此，族群士兵是另一类对清朝构成两难的非常规兵员；他们既是宝贵的士兵，又是潜在的麻烦制造者。白莲教战争中，他们人数不多，大多数早早遣返。然而，他们并非孤例，而是延续到19世纪的清朝军事战略变化的一个指标。\n\"坚壁清野\"\n关于白莲教战争的另一个广为流传的陈词滥调，是\"坚壁清野\"（jianbi qingye）之策的神奇效果。断言是：直到战区平民筑起堡寨、藏好粮食、家畜与其他财物，使叛军断了给养，叛乱才被扑灭。关于此策的始作俑者，有两种说法。一种推龚景瀚——陕西知府，1797年撰文倡导此策。^110 他的一些传记声称，他的建议被采纳，成为镇压叛军的关键。这一说法被20世纪的史家们所呼应。^111 另一种说法不如龚景瀚的出名，把勒保当作此策的发明者。然而，战争档案揭示的是另一种图景，不支持二者中的任何一个是此策的发起者。\n事实上，动荡时期在山顶筑堡以庇护民众及其财物，是源远流长的做法，远在这场叛乱之前就已使用。它在中原尤为普遍——那里众多山脉为设防提供了最佳条件。蒙古征服与明清易代期间，平民在秦岭、大巴山与武当山区修筑了众多堡寨——这些山脉在白莲教战争期间全都成了战场。^112 所谓的堡（baozhai或zhaibao）基本上是山顶或其他险要处的石墙。墙内为各家各户建有小屋与储物间；大堡可容纳数千户。堡通常有具体名称——或以所在之地命名，如\"五峰寨\"（Wufengzhai）；或以创建者命名，如\"王家寨\"（Wangjiazhai）；或取吉祥之意，如\"天保寨\"（Tianbaozhai）。白莲教战争时，其中一些堡仍可使用，尤其在川东。^113\n白莲教战争中，筑堡始于湖北。1797年春，襄阳南山的居民登上山顶，筑墙、搭草棚、掘壕。每座山顶堡寨庇护数百至数千户。只用刀矛守堡的居民无力与叛军作战。相反，叛军逼近堡寨索取给养时，他们把粮食牲口给了叛军。应平民之请，惠龄派一名千总率二十名士兵到每座堡寨帮助他们。^114 同年秋天，姚、王队伍返回湖北、企图夺取襄阳时，襄阳人梁友谷——一位在家养病的广西知县——与其子在襄阳城附近的城哨渡发起筑堡，据说庇护了十万多人。梁氏父子还组织乡勇守卫堡寨周围的关卡。^115 幸运的是，明亮与德楞泰很快把姚、王队伍逐离襄阳一带，秩序得以恢复。\n然而，梁氏父子的义举启发了两位将领。赴陕追击叛军途中，明亮与德楞泰上奏朝廷，建议在大城镇与乡村都建立设防聚落，每处可容纳几十个村庄——包括散居附近地区的住户——合计三四万人。他们计划每处派几名官员——由士绅与耆老协助——主持，从每户招募\"壮丁\"，并从难民中雇乡勇守卫。这样，叛军的物资与人力补给都会被切断，居民中的少数教门中人也能置于监视之下。乾隆虽然承认其动议有某些价值，却担心筑堡与迁移会给已受动荡折磨的百姓增加负担。他斥此计划\"窒碍难行\"，批评两位将领越权干预民政，给了他们\"严旨申饬\"。明亮与德楞泰虽已指示汪新与秦承恩在鄂西北与陕东南着手此事，乾隆的不以为然显然使这第一次筑堡呼吁搁浅。^116 然而，在饱受战乱的地方，平民继续筑堡自保，有时从省到县的官员也主动或干预其事。^117\n乾隆驾崩后，嘉庆皇帝对筑堡表现出的前后不一，与他对乡勇的态度并无二致——下文将述。1799年初，一个名叫李积的平民向朝廷呈上三篇关于镇压战役的策论。李积的建议迂阔，复述民间兵书中的陈词滥调，包括并小村为大村。军机处斥其\"窒碍难行\"，全部驳回。^118 直到松筠倡导，嘉庆政府才对筑堡产生兴趣。1799年春末到陕后，松筠大力推动筑堡，认为这是粉碎叛军的关键措施。他认为起事者没有多大潜力，建议组织堡中居民与之作战，以早日取得最后胜利，并奖赏杀贼擒首者。^119 不久，六月初三日，嘉庆向勒保、松筠与吴熊光颁发谕旨，号召在四川、陕西与河南实行\"坚壁清野\"——他使用了这个说法（此时湖北已无起事者）。他说，他受湖北一个故事的启发：襄阳叛军经过随州时，当地居民掘深壕、筑土墙守卫村庄，得以免遭蹂躏。他说，筑堡\"乃守御良法，行之有效\"（原文待核，见注释120），号召凡条件许可之处皆筑堡。^120 官修战役方略的编纂者们称赞嘉庆的决定，称此谕是对叛军取得最后胜利的关键因素：\"此后三省筑堡，大有成效，遂以坚壁清野之法，扫荡数十万强悍之贼。\"（原文待核，见注释121）^121\n如果单独看这道谕旨，它确实支持编纂者们\"嘉庆应被推为此策发起者\"的说法。然而，并不罕见地，嘉庆很快就对此表示怀疑。数月后，十月，那彦成动议：命秦岭山区居民筑墙建堡、掘壕——因为军队不足以守卫广大山区的所有通道，此举也有助于防止新的起事。^122 嘉庆除对此策将信将疑外，还责备那彦成越权——令人想起两年前乾隆对明亮、德楞泰动议的反应：\"至于筑堡掘壕之法，虽为御贼之计，然贼若拼死狂奔，虽峻岭平原亦不能阻，区区壕堑岂能御之？此事由地方官办理则可，将领仍当以剿贼为正务。\"\n勿为此分心。\"（原文待核，见注释123）^123 大约同时，嘉庆还否掉了明兴的一项提议。明兴主持开县城防半年，他建议：订立规章，支持四川居民自发的筑堡；以授衔、赏赐与伤亡抚恤调动乡勇守堡；每堡派一名低级军官与几名士兵协助御贼。但嘉庆认为他的主意\"无益\"、\"劳民\"，并说没有足够的兵可以派往所有这些地方。^124\n然而，不到一个月，嘉庆就转变了态度。1799年底，他对最后胜利更乐观时，对筑堡也热忱起来，称之为削弱起事者的\"最佳办法\"。他指示额勒登保与那彦成鼓励民众筑堡，尽管他并不指望他们参战。^125 然而，不久，又以战争已近尾声为由，他告诉新任陕甘总督长麟：不必过分强调筑堡。^126 1800年春末，嘉庆否掉了台布\"在栈道地区建大堡、让平民在堡内自建住房\"的倡议，称\"非目前急务\"——因为起事者远离陕西西部。他对台布倾向动用军费搞这个工程也不满——台布承诺资助较贫者。^127 直到1800年夏，嘉庆试图赶在冬天前完成战争的新期限时，他才称赞四川的筑堡，敦促陕西效法四川筑堡、组织乡勇守堡。^128\n尽管朝廷的指示自相矛盾，松筠仍在陕甘主持筑堡。他鼓励订立规章，指示地方官员帮助居民选址，提供设备、技术与信息。^129 那彦成与台布到任后，都分享了松筠的热忱。作为陕西巡抚，台布把筑堡列为他的优先事项之一，一年的任期内常在奏折中讨论。尽管嘉庆如前所述并不赞成，那彦成仍敦促秦岭山区居民筑堡，尤其在五郎、孝义与镇安——镇安的一些堡寨至今可见。^130 松筠与台布的继任者长麟与陆有仁继续了这项工作。^131 在甘肃东南部，广厚主持下修筑了许多储粮堡寨，但1800年夏末高马股与伍家营离开本省后，甘肃大体太平。^132\n然而，陕西的筑堡从未成功。没有经费拨给这项工程，地方官员既无手段也无动力实施，当地居民也不热心。台布主持时，设法让一些富户与地方官为筑堡工程出钱，但不受欢迎。到1801年初，陕南干道沿线与汉江以南，以及西安、同州、凤翔各府——通常的战乱范围之外——修了一些堡，但五郎以西的秦岭山区——人口稀少，却是各股起事者常出没之地——几乎没修。^133 更具体地说，山中众多厂坊的厂主不愿参加筑堡。因此，那些厂坊为雇工——大多是所谓的棚民，每个厂坊常有数百人——储存的大量给养，仍可能落入起事者之手。^134 1801年初，陆有仁提议：强迫山中散居人家迁出，由地方官员安置他们，使叛军失去这一补给来源。嘉庆坚决反对——居民会流离失所，衙门的书吏差役则有机会骚扰勒索他们。他质问陆有仁：安置难民已属不易，他如何安置这些人？并告诫：如果安置不当，流离的山民会加入起事者。他给了陆有仁一个\"所奏无益\"的申饬。^135\n在湖北，省级当局直到1800年姜晟出任总督才开始推动筑堡。然而，省里没有余钱支持这项工程，进展缓慢；姜晟估计，鄂西只有约一半居民响应筑堡号召。在西北边境地区，郧西与竹山的堡寨尚属可用——多亏那里两位能干的知县孔继干与范继昌——但竹溪漏洞很多，因为它与陕川的边境漫长。^136 1801年初接替姜晟的书麟似乎对筑堡并不热心，尽管他拨了些钱，并责成地方官员监督工程（他还打算把小堡居民迁入大堡）。然而，据书麟说，人口稀少的地区难以施行。^137 1801年中吴熊光接手时，注意到郧阳府几乎没修什么堡。^138 一年后，吴熊光再次表达对这项工程的悲观，说：郧阳与宜昌的许多居民是佃种山坡地为生的移民，筑不起堡，而政府又无钱支持。^139\n战场诸省中，四川在筑堡上最为突出——主要是因为那里留存着大量旧堡，称为\"山寨\"（shanzhai）或\"寨洞\"（zhaidong）。四川乡民不住村庄，而在田边建屋，因此易受叛军袭击劫掠。战争之初，他们就登上山顶，或利用旧堡，或建新堡。^140 到1798年底，许多居民已据山自固，把粮食家当搬进堡中。有些堡可容纳一万多人。为守堡，居民组织了乡勇，推选了头目。^141 正如魁伦1800年初所奏报的，筑堡使叛军更难获取给养，以致他们不得不前往陕西、湖北。魁伦虽试图炫耀自己在鼓励筑堡上的努力，却也承认：大而设防完善的堡能保住居民的生命财产，小堡中的居民却不敢与叛军作战，只能抛出粮食打发他们，或与之交易。他还抱怨：当局如今很难雇到精壮乡勇——他们得守自己的堡了。^142\n到1800年底，四川只剩几百名起事者，退入与陕鄂交界的山区。四川大体太平，嘉庆接受了\"四川民众自发的筑堡使叛军无法立足、不得不转往湖北或陕西\"的看法。他一再称赞四川，批评陕西筑堡与组织乡勇不力。随后他动了\"把各股起事者全部赶入四川围歼\"的念头。^143 因此，1801与1802年间，嘉庆不断催促陕西与湖北加强筑堡，准备从外地调能干的知府知县来迎接挑战——如果本地官员不胜任的话。他甚至命陕西在秦岭各山口掘壕断路——这正是那彦成一年前所建议、被他斥责过的。^144 长麟提出担心：太平恢复后，堡中武器会成为安全隐患，建议登记造册以便战后裁军；嘉庆同意其见，却不认可这项提议——唯恐激起新的动荡。相反，他告诫长麟把此意藏在心里，同时悄悄控制武器。^145 唯一从未在筑堡上花力气的省是河南——因为吴熊光任河南巡抚时说服了嘉庆：豫西南边境居民太少，难以施行。^146\n随着皇帝越来越相信筑堡的好处、并坚持不懈地推动实施，他有时也忍不住纳闷：胜利在望，还有没有时间做。^147 然而，将领们各有盘算。如第4、5章所述，额勒登保自1800年底起更加消极。他不设法迅速围剿最后的叛军，只是嘴上敷衍。1801年初，额勒登保大谈把所有叛军逼到一处、一鼓聚歼，同时在川陕鄂三省筑堡。他建议从外省挑选地方官主持工程，好让所有战场省份在数月内完成设防。^148 此后数月，额勒登保继续用筑堡作为了结最后叛军进展迟缓的借口之一，尽管嘉庆对战役的迁延沮丧。^149 最终，1803年初额勒登保提出\"以筑堡工程代赈、安置难民与遣散乡勇\"的方案时，愤怒的皇帝倾泻了大堆严斥。除批评额勒登保用此方案为自己拖延时间外，嘉庆再次对设防聚落的效用表示怀疑——叛军从未试图攻取城镇，而居民迁入聚落后，却把家园田地丢给了叛军。^150\n总之，战争中筑堡起初是对动荡的临时反应，战争早期是一场草根运动。据吴熊光说，一些人躲进堡寨，讽刺的是，是为了逃避清军与乡勇的骚扰劫掠——他们以缺乏纪律臭名昭著。^151 几位战争领导人认识到它有助于军事行动，倡导筑堡。1799年以来，松筠、台布与那彦成认真努力在陕西推广这一做法，尽管没有达到最佳效果。与\"此策直到战役后期才被采纳、一旦采纳叛乱即被平定\"的流行看法相反，筑堡几乎伴随了整个战役。嘉庆到1799年中正式号召采纳此策。尽管摇摆不定——这与他主持战役的风格一脉相承——1800年之后，嘉庆推动此策变得坚定不移。然而，战役几年之后才告结束，这反驳了此策的神奇效果。\n筑堡之策主要旨在断叛军补给，对与叛军作战并无多少实质帮助。^152 只在1802年开始的战役最后阶段，平民才鼓起勇气走出堡寨，擒捕零星的起事者。^153 然而，筑堡并没有完全断绝起事者的给养。为获取粮食与其他必需品，叛军袭击清军运输队、破堡、或冲击当地集市。^154 更常见的是，他们威胁攻打堡寨——尤其是小堡——勒索给养。堡内没有水源者，无法承受围困。为换取安全，平民通常抛出粮食或卖给叛军——尤其在四川。有时叛军甚至试图与堡中居民达成互不伤害的交易。^155 堡民下山赶集、营生、下田时，起事者就有机会劫掠他们，或把他们从堡中绑去勒索赎金——这在叛军人数已很少的最后阶段甚至都发生过。^156 对民众向叛军抛粮深恶痛绝，嘉庆指示官员劝诫他们不要这样做，尽管他无意为此惩罚他们。^157 但劝诫无效。1800年初，额勒登保描述了四川的情形：\n\n各厅州县民人自筑之堡，大堡可保身家，小堡不能抵御[贼攻]。虽有以公事为先、杀贼擒贼者，究属少数……坚壁清野之法，徒为纸上良策。然民人须求生计，不能一日废贸。虽于山中筑堡，仍须下山耕作。贼猝至，仍被裹掠。勒保与臣屡次出示晓谕，仍不能禁。至于抛粮与贼，臣每遇一处即当面劝诫。但小堡居民总以恐堡被毁为辞。故此陋习终不能除。^158\n[译者按：原奏自英文直译，文言原文待核，见注释158。]\n\n到1800年底，据一些叛军所报，由于在四川难以获取给养，几股叛军曾试图移往湖北或陕西。这固然可以被当作四川筑堡成功的证据，但吴熊光在1800年春末指出：川东北的粮荒主要应归因于多年战乱对农业的破坏。^159 事实上，叛军在陕南也难以获取粮食——那里1800年筑堡并未充分实施。^160 随后，1801年，一些起事者又回了四川——这证明筑堡并没有使四川无法立足。他们的移动主要受自身战略目标与清军压力支配。^161\n整个战役期间，此策只有前半部分——\"坚壁\"——被采纳；\"清野\"很少受到关注。平民迁入堡寨时，带走了可动的家当，却无法把田地围起来。收获季节，叛军可以轻易劫掠田地与晒场上的庄稼；清方很少采取任何措施阻止。^162 1801年初，嘉庆批评陕甘川鄂四省督抚没有认真\"清野\"。他还斥责地方官与将领们：总是把自己关在城墙之内，听任叛军劫掠焚烧集市村庄、裹挟百姓以补充损耗的队伍。^163 即使筑堡实施之后，也不可能把所有乡民都圈进堡寨。在广阔的大巴山与秦岭中尤其困难——那里居民分散，常常轻易被叛军劫掠。^164 从1800年起，大多数叛军股团大幅缩减，他们的生存反而更容易了——他们不再需要大量给养。有些人在山中密林里靠野生动植物生活了数月。知道荒野中的植被为起事者提供了天然补给，每年春天嘉庆都哀叹：起事者又有办法活下去了，至少再活一年。\n战役档案中没有记录支持\"筑堡始于龚景瀚1797年之文\"的说法。龚景瀚是福建人，家族几代出知县知府。1784年他任甘肃平凉知县，1792年短暂署理循化同知。在循化近十年的任期内，龚景瀚主持了对撒拉人的民族学研究，协助编纂了循化第一部方志《循化厅志》——这是关于撒拉人及其与清朝关系的重要史料。1796年初，他以陕西彬州直隶州知州的身份，因有效查办洛南教众而赢得宜绵的注意。龚景瀚随后被招入宜绵幕府，1797年初随宜绵入川。返回陕西后，龚景瀚留驻陕南，直到1800年赴兰州任新职。两年后，他去世了。^165 战争期间，龚景瀚是个不起眼的人物。整个战役期间，战争领导层上层没有任何人在奏折中提及他的想法——包括他的恩主宜绵与宜绵的继任者松筠。关于龚景瀚的记录，只有宜绵为他请功请赏的几道奏折，但没有一次是因他对战役的建议。^166 龚景瀚很可能是战后时代同侪们反思这场动荡时被称颂为\"儒臣谋士\"的，战役期间却几乎毫无影响。\n档案同样没有证实勒保\"此策发起人\"的说法。第一次任四川总督期间，勒保在往往冗长的奏折中很少提到筑堡。鉴于他特别善于揽功，如果他确实发起了此策，他不会忽视它。1799年初，勒保在被任命为经略大臣后的第一道奏折中说：他将指示各地百姓把粮食藏入\"山寨\"、到那里藏身——这是他为加快战役所计划的事项之一。^167 这里勒保显然指的是利用现存的堡寨；这段话读不出他曾在四川努力实施筑堡。1799年夏——他被罢免逮捕前不久——勒保又奏报说：他已指示地方官员敦促民众上山\"聚险扎寨、团聚而居\"（juxianzhazhai tuanjuerju），为聚落订立规章、推选头目，并供给他们一些武器。^168 这似乎就是他在此事上的全部作为。由于没听到多少四川筑堡的消息，勒保被清除后，嘉庆不得不于1799年秋查问此事。^169 出狱回川后，勒保对自己在筑堡上的努力仍少有奏报，只在1800年夏提到他把小堡居民并入了大堡。^170 直到1800年底嘉庆热衷于筑堡——一再提到四川筑堡实施得如此周密、以致叛军离开四川去了湖北或陕西——勒保才在1801年初的一道奏折中宣称：他1798年就在四川开始筑堡，1800年他与德楞泰又作了更多努力，敦促民众筑堡、并巡视各堡。然而，他承认四川的\"地形\"是一大便利——这暗指叛乱爆发时许多堡寨已经存在。^171\n此外，为三次胜利所颁的谕旨，都没有提到勒保在四川实施筑堡的贡献，也没有把它指为镇压叛军的关键。这条说法直到1805年初夏——最后胜利宣布八个月后、嘉庆召见勒保之后（德楞泰与额勒登保已分别于1803、1804年陛见）——才铸造出来。召见一周后，五月二十五日，嘉庆颁发谕旨，把勒保的世职从太子少保升为太子太保，理由是他最先号召四川百姓实行\"坚壁清野\"之策，而这成了三省最终彻底肃清叛军的原因。^172 尽管战役期间频繁而尖刻地批评勒保，嘉庆愿意翻篇。他既不想让勒保为四川蒸发掉的军费负责，也允许勒保保住四川总督之位。因此，粉饰勒保在这场多次激怒皇帝的战役中的表现，只是政治上的需要。最可能是：召见时，勒保向皇帝提醒了自己这件\"可嘉\"的事迹，并灌输\"这是战役成功关键\"的想法。^173 随后，勒保写了一篇八千字的纪略《平定教匪纪事》（Pingding jiaofei jishi）。文中他把自己塑造为\"坚壁清野\"之策的发明者，试图就此定格：他是白莲教战争胜利的重要贡献者。^174\n夭折的改革\n与数十万受雇乡勇相比，战争中部署的正规军是少数。旗兵更是那些正规军中的一小部分。鉴于乾隆\"对内乱之战不应像边疆战争那样从北京与满洲大规模调遣精锐旗兵\"的新学说，整个战争期间，绿营兵是主要的正规力量。总计超过十万名绿营兵从五个战场省份——湖北、陕西、四川、河南、甘肃——以及其他省份如江西、广东、广西、云南、贵州、湖南、山东、山西与直隶调来。^175 任何时候，三个主要战场通常各有兵一万至三万。整个战争期间，从北京与满洲分批调来的旗兵只有九千五百名（包括两千来名索伦兵）（表6.1），此外还有西安、成都、荆州驻防的数千名旗兵。\n表6.1　北方旗兵的调遣\n\n\n\n调遣时间\n人数\n原驻地\n返回时间\n\n\n\n\n1796年秋\n2,000\n北京\n1799年夏\n\n\n1797年夏\n3,000\n吉林、黑龙江\n1801年秋\n\n\n1799年夏\n2,000\n盛京\n1801年秋\n\n\n1799年夏\n1,000*\n吉林\n1801年秋\n\n\n1800年夏\n1,500\n吉林、黑龙江\n1802年秋至1803年初\n\n\n总计\n9,500\n\n\n\n\n\n\n起初调遣两千名，其中黑龙江的一千名被取消。\n\n战争头三年，乾隆两次派了五千名满洲兵。尽管前线大声而反复地恳请旗兵增援，乾隆直到1796年秋——明亮调往苗疆战役使湖北战场出现空缺时——才派了第一批两千名北京旗兵。那两千人来自北京的两支精锐营：健锐营与火器营。第二次调遣发生在1797年夏末——姚、王队伍返回湖北、威胁襄阳之时。这一次乾隆向湖北派了三千名旗兵（吉林一千、黑龙江两千）。嘉庆接手后，命从三个满洲地区调兵三次。1799年夏末，勒保把第一批北京旗兵大部分送回后不久，嘉庆从盛京调了两千名旗兵，随后又从吉林、黑龙江调两千名（但黑龙江的一千名被留下）。1800年夏，嘉庆命最后一次调遣——从吉林、黑龙江调一千五百名旗兵，替换先前部署中伤病者。\n正如乾隆所坚持的：精锐满洲部队本不该用于镇压内部叛乱；即便不得不调，也不应在战争中滞留过久——延长部署会被视为无能的表现，玷污满洲\"不可战胜\"的名声，损害王朝的威望。^176 如表6.1所示，九千五百名旗兵中的大多数只部署了两三年。1801年深秋，经额勒登保之请，满洲来的旗兵大多被遣返。^177 1802年秋，苟文明刚被杀，额勒登保就送回七百五十名满洲旗兵，留下七百五十名（盛京一百五十、吉林三百、黑龙江三百）与六十多名旗军军官在陕西清剿。^178 剩余旗兵继续被送回；最后数百名吉林、黑龙江旗兵于1803年夏——第二次胜利宣布前不久——撤出。^179 被部署的旗兵大多获得升迁、巴图鲁等名号与众多赏赐礼物。回乡时，他们带走一车车的战利品，有些人还带走战争孤儿。\n按比例而言，旗兵的伤亡很轻。约二十名高级汉族军官丧命，高级旗人却很少阵亡。其一是惠伦——明瑞的养子、1797年吉林黑龙江调兵的特领之一。到达湖北前线才数日，惠伦就在与襄阳叛军的战斗中阵亡。另一位阵亡的高级旗人是安禄——海兰察之子，1799年底在川北被杀。两次，皇帝都动情地表达了悲痛。正如乾隆所解释的：与东突厥斯坦、金川、缅甸、安南、尼泊尔等边疆战争——那里敌军由各自的大首领统领——相比，在与乌合之众的教门叛军作战中失去宝贵的旗兵——更不用说贵族旗兵——是极不值得的。担心别国听说\"显赫旗军将领的后嗣竟不能消灭可憎的起事者、反被后者杀死\"后会轻视大清，安禄死后，嘉庆命：旗兵不再分散于绿营单位中，而单独成队，只在适当时机使用。^180 此后战争余下的时间里，惠伦与安禄之死一直提醒着人们：乾隆\"边疆战争之外少用旗兵\"学说的正确性。^181 1803年初，穆克登布在川北与几十名叛军残部的一场小规模战斗中阵亡时，嘉庆再次认为这太\"不值\"。^182\n傲慢言辞的表象背后，有两个因素很突出。其一，18世纪80年代初《军需则例》颁布后，从满洲或北京调遣旗兵变得更加昂贵、更加费力。除旗兵所享的优厚战时津贴外，《军需则例》还\n规定：每个普通旗兵配三匹马，每三名旗兵配一头骆驼；军官配得更多（将军每人配二十四五匹马、五头骆驼）。^183 为满足这一要求，每次调遣旗兵，都得动员数省供马，还要供给草料、马具、临时马厩与马夫。由于湖北、河南、四川不大量养马，白莲教战争中调遣旗兵时，督抚们弄到足够的马是个挑战。1797年秋，从吉林、黑龙江调遣三千名旗兵时，还从官马厩为他们调了八千匹战马。但这是国家最后一次能做到——马厩里可调的马已不多了。此后几年，每次调遣旗兵都给战区省级官员带来巨大挑战——他们不得不从几个不同来源拼凑足够的马匹：先调当地驻防的马，再买马补缺。^184 万不得已时，他们直接从战区内外的地方市场买马。结果，马价被大幅推高。1800年，魁伦请求中枢政府允许四川后勤按每匹十二两的价格买马——这违反了规则，因为《军需则例》规定每匹八两。嘉庆不得不批准。^185 然而，旗兵仍常常缺马。1799年底，嘉庆指示湖北：不必给每名旗兵配三匹马。^186 结果每人只领到一匹。正如吴熊光1801年所奏报的，湖北的满洲旗兵只有百分之四五十有马。最终，骡子被混进来装备湖北的旗兵与绿营骑兵。^187\n其二，除索伦兵外，旗兵未必是更优秀的战士。^188 战役早期，一些旗军将领与部队作战勇猛——如明亮与恒瑞率领的、主要由西安驻防旗兵组成的军团——但从北方调来的却没有名实相符。^189 战争头几年，战役统帅们一次又一次地奏请调旗兵上前线，指望大批旗兵的到来能最终解救他们。然而，随着战争推进，他们不再热衷于请调，反而急于送走已部署的满洲兵。从健锐营与火器营来的两千名旗兵到川后，大多数在开县城里闲度数月。他们占住民房、茶馆、酒楼，饮酒唱曲、喧哗扰民，同时领取战时津贴与犒赏。1798年底被派去攻打冷天禄时，他们迟迟到不了前线。正如勒保所抱怨的，他们吃不了在川北山地行军作战的苦。请求遣返他们时，勒保说：除浪费经费外，他担心他们留在战区无所事事，会被绿营兵瞧不起。1799年夏，那些旗兵奉嘉庆之命返回北京。^190 1799年，明兴及其来自成都驻防的六百名旗兵也在开城县城里驻扎数月，叛军数次逼近也不出城应战。正如明兴自己所承认的，他的兵力太小，无法作战。^191 到1800年初，1797年从满洲调来的三千名旗兵中，只有约一半活跃在前线，其余或留在某处养伤治病，或因伤残被送回家，另有少数死亡。伤病很可能只是逃避作战或逃避徒步进山的借口——旗兵以厌恶徒步行军臭名昭著。^192 正如那彦成所抱怨的，绿营兵与旗兵都不太顶用。^193\n事实上，对大多为满蒙旗人的前线将领们来说，部队里旗兵太多并不方便——因为克扣或削减旗兵的饷银更难。相反，绿营兵与乡勇是侵吞饷银犒赏的容易目标——这两个群体比精锐旗兵处境不利得多。绿营军官长期普遍虚悬名缺以吞空饷，白莲教战争期间，外省调来的绿营兵实际人数常常远低于纸面人数——这对朝廷不是秘密。^194 到达前线者中，逃亡司空见惯。^195 与旗兵一样，众多绿营兵留在城镇村庄养伤治病，痊愈后不归队，有些人甚至变卖了装备。结果，据额勒登保说，到1800年初，绿营人员一半以上成了\"病废\"。^196\n结果，受雇乡勇成了战役的主要作战力量。然而，过度使用平民从一开始就受到挑战。1796年春末，鄂辉表达了担忧：教门中人可能伪装身份混入乡勇，实则替叛军做事。^197 秦承恩曾暗示：陕西的乡勇可能借机滥杀无辜以报私仇。^198 更有力的批评来自明亮。1796年夏孝感速胜——他只用了正规军，尽管当地招募了大量乡勇——之后，明亮抱怨乡勇纪律涣散得可悲，担心其中一些人可能私下与叛军有联系，并害怕战役结束后他们会成为麻烦制造者：\n\n地方官仓促招募[乡勇]，以为多多益善，于是众多无家流民、老幼充斥其间。加之教匪传教四方，网络广泛，难以察觉。因此，无法确保乡勇中无怀二心之人，也无法辨别良莠——莠者或伪装其间……即便良善村民，持矛挽弓数月之后，也已弃本业而习于杀戮，且以领饷领粮为乐。上司可以赏赐激励他们，却无法管束他们。[臣]恐战后安置稍有疏忽，他们就会酿成更多祸患。^199\n[译者按：原奏自英文直译，文言原文待核，见注释199。]\n\n于是，明亮请求解散孝感的乡勇。他建议给所有乡勇发赏，并为庄稼房屋被毁者提供安家之本。^200 乾隆虽似赞同明亮的所有警告，却不愿放弃这个权宜之计：\"明亮所言甚是。但如今正赖乡勇剿贼。若露出一丝疑心，他们必生疑虑恐惧，事态就严重了……待完全奏凯之后，再设法处置[乡勇]吧。\"（原文待核，见注释201）^201 显然预想着速胜，乾隆或许以为：叛乱一旦平定，与受雇乡勇相关的一切问题都会迎刃而解。\n明亮一直珍视旗军骑兵。战役早期，他主要使用旗兵与旗军军官作战。1797年底三千名吉林、黑龙江旗兵到达时，明亮与德楞泰带走了大部分。明亮后来虽然自己也用了乡勇——或许他抵挡不住乡勇入列带来的经济利益的诱惑——却从未失去对那些前平民的鄙视。有时，他让正规兵扮成乡勇引诱叛军——以为叛军会乐于与他们接仗，因为打他们更容易。^202 或许是为了与乡勇的缺乏纪律形成对照，明亮曾夸耀自己正规军的良好纪律：他们总是按市价购买当地居民的货物与馈赠，从田间摘菜、掰玉米、取秸秆都照价补偿业主。^203 想必，乡勇做的恰恰是这一切的反面。\n明亮之后，战区各地的将领与督抚对乡勇提出了更多批评。与明亮一样，大多数人抱怨乡勇的放荡：他们常常牵涉劫掠、强奸与滥杀；他们也不可靠，常常一见叛军就逃跑。^204 麾下有数千名乡勇的富成1799年中奏报说：乡勇领不到给养时，就劫掠、强征平民财物，为此富成惩处了他们——割耳、当众鞭笞。他甚至处决了几个。^205\n大量未经训练的平民被用于作战、有时还摆在正规军前面，乾隆为此忧心，试图强化战争中主要的正规力量——绿营——尽管他似乎没有清晰的议程，容易从一个主意摇摆到另一个。1797年春末，四月初六日，乾隆命直隶、山东、河南、江西、湖北、四川、陕西、甘肃、云南、贵州各省官员补齐因白莲教战争调兵而出现的绿营空缺的百分之六十至七十。由于在调出部队返回之前补缺非同寻常，乾隆解释说：一些士兵可能回不来了——升了官、战死或伤残；更重要的是，他不想让那些省份的驻防空虚太久。^206 这项决定虽然含糊，却表明了乾隆对正规军规模缩减的关切，为进一步的步骤留了门。^207\n恰在此时，景安提出了一个扩大河南绿营规模的建议。景安呼应其他人对乡勇的抱怨，也认为他们不可靠。此外，他奏报说：乡勇的饷银高于正规军——这是朝廷第一次听说此事。随后，景安奏请允许招募三千名丁男（dingnan）充当战兵（zhanbing）。他计划训练他们，按绿营步兵的标准发饷，然后分到河南的三个镇——包括他直辖的那个。景安论证说：河南驻军不足（官方数字只有九千九百九十九名绿营兵），本地多兵比从外省调兵更经济——他显然打算把这些新兵永久化，这样就不必再向邻省求援了。当然，鉴于他在战役领导层中的孤立，向邻省求援从来都不是令人愉快的经历。^208\n然而，乾隆对景安的提议不悦。其一，他认为景安刚在补缺之令后提出此议，颇为不妥。但他更恼火的是景安暗藏的议程：试图变相增加河南的绿营编制。乾隆警告说：若他省效法河南，将是绿营的\"更易旧制\"（gengyi jiuzhi）。在乾隆看来，湖南苗区有必要设新驻防以守新征服之地，河南却是腹地省份——只因\"几个\"教门叛军闹事就要作如此激进的改变，是没有根据的。乾隆斥景安之议\"实为不当\"，命对他\"严旨申饬\"。然而，他允许景安招募新兵。乾隆不放弃\"编制不可改\"的立场，计划用新兵填补因升迁与伤亡出现的空缺，其余留待出缺。^209 换言之，河南获得了皇家许可，可以进行一些预招——这很可能导致该省绿营规模的扩大。\n1797年晚些时候，乾隆对乡勇的看法转向了有利的一面——他开始在乡勇中看到未来的新兵，战役之后可以补绿营之缺。署理湖广总督姜晟提议为湖北因调兵而出的绿营空缺招募更多士兵时，乾隆拒绝了请求，让他等战事结束、用乡勇补缺。^210 不久，汪新奏报他在湖北整训乡勇的努力——当时湖北已肃清叛军——乾隆表示了兴趣与认可。汪新从鄂西北数县挑选了一万数千名健勇（jianyong），发制服装备，与正规军一起训练。沿湖北西部边境，汪新驻扎了军队与乡勇，让有作战经验的当地士绅率领后者。在竹溪、竹山、房县、归州、巴东、建始、利川这些战场县份，汪新指派地方官员与军官监督乡勇。认可汪新的努力时，乾隆看到了对桀骜乡勇加强控制的益处：它有助于防止他们被叛军拉拢，同时为战后补绿营之缺作准备。^211\n1797年秋，急于看到湖北战场的突破，乾隆指示将领们不要分兵各自追击叛军，而要集结优势兵力，逐股消灭。^212 回应此令，明亮、德楞泰与景安联名上奏，先指出叛军已转向游击战：\n\n[叛乱]之初，贼据险聚处，尚可合兵围剿。近来改为奔走流窜，不据一地，不居一隅。专恃劫掠为生，行不携粮，止不设帐。所过村镇，裹胁居民，从者日众，可分数股横行，官军难以应付。加之鄂北襄阳、郧阳、荆门、宜昌四府犬牙交错，道路众多，歧路纷出。难以一一拦截。^213\n[译者按：原奏自英文直译，文言原文待核，见注释213。]\n\n随后他们讨论了如何应对叛军的高机动性。按照乾隆\"围歼而非分头追击\"的计划，他们建议设立一支四千人的骑兵军团——从旗兵、绿营兵与撒拉兵中挑选吃苦耐劳的骑手。他们自带十天的给养（景安承诺为他们备好肉干炒米），可以快速移动，不依赖笨重的后勤队伍。^214 这个\"由不同族群士兵组成机动军团、以游击战对付叛军游击战\"的提议，指向了一支新野战军的方向。然而，乾隆并不十分动心，认为\"为时已晚\"，尽管他勉强认可了这一提议。^215 然而，战场很快转向了更适于骑兵的陕南多山地区以外……这个计划从未实现。\n宜绵在重振正规军上走得更远。他对陕川两战场的清军与乡勇有第一手信息，担心四川与陕西都已耗尽了正规军——四川已动员一万九千多名绿营兵参战，陕甘已从其驻防调出两万多名。最近向湖北调遣三千名黑龙江、吉林旗兵之后，中枢政府不大可能再向四川或陕西派旗兵。宜绵虽然曾呼吁雇乡勇、自己也用过，却不信任他们作为作战力量。1797年九月——他被解除战役统帅之职前不久——宜绵向朝廷上了一个重要动议。首先，他表达了对受雇乡勇的不满：\"乡勇守御本乡，尚能同心出力。调赴数百里之外，则多迟疑不进，虽有出力之人，究属少数。此辈赏之则骄，惩之则逃。\"（原文待核，见注释216）^216\n因此，宜绵主张扩充正规军，而非倚靠非常规兵员。他建议在战区招募三万备战兵（beizhanbing）（四川一万、陕甘一万、湖北五千、河南五千），在乾隆所命补缺之外。宜绵计划让新兵由文官或绿营军官训练两个月，掌握基本作战技能——如刀矛——宜绵务实，不指望他们精通鸟枪或弓箭——然后派往战场省份填补绿营空缺、协助守御地方。^217 这一次乾隆支持。然而，考虑到从社会上招募三万备战兵可能不现实，乾隆命从受雇乡勇中征募。他希望正规军的身份有助于约束他们，同时乡勇的人数也能减少。^218\n乾隆的修改虽与宜绵的初衷有所偏离，但如果这一动议得到充分实施，将是对那些省份积弱的绿营的相当可观的提升。新血将扩大其规模、稀释绿营半世袭的性质——这可能预示着向职业军人的转变。更重要的是，备战兵可以用作机动野战力量，比北方旗兵更快、更省力地投入前线。然而，很快证明该计划难以实施。战区官员对把乡勇转为正规军三心二意；主要障碍是许多乡勇不愿参军——他们作为受雇乡勇享有更好的待遇与自由。^219 正如嘉庆后来所说：\n\n自剿办邪匪以来，屡次颁发谕旨，令出兵各
