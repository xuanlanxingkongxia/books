（他的奏折通常冗长详尽），勒保奏报：叛军已渡涪江，他刚刚抵达前线。^95\n渡过了涪江，富饶丰裕的成都平原就在叛军脚下。他们没有立即前往甘肃，而是被诱惑着先收割一番。联军分作两路：蓝号与黄号向东南前往安岳与遂宁，张子聪率领的白号前往中江；两路的目标都是成都。成都慌忙布防、安置从城郊涌入的数万难民之际，^96 德楞泰加快了速度。三月二十二日，他在射洪新店子追上了张子聪，据说杀俘数千。^97 与此同时，魁伦与勒保急忙赶往中江，拦截前往成都平原诸县的叛军分遣队。^98 但新店子之战后，起事者放弃了前往成都的计划，决定返回川东。三月二十七日夜，除张子聪一股外，各股叛军都在太和镇涉水东渡涪江。魁伦与勒保次日清晨赶到，正好截住他们的队尾，杀死了江中与西岸的叛军。随后魁伦与勒保分手，前往龙安府对付甘肃来的叛军——两人或许都预料很快就会再见。^99\n张子聪在成都平原只多盘桓了几天。德楞泰在中江富家河一场恶战中击溃了他。四月初，张子聪率其最后的一千人重新渡过涪江，与东岸的其他叛军会合。起事者沿嘉陵江北移，到达剑州江口。他们的斥候泅水到东岸，夺取了一些船只，把他们渡到嘉陵江东岸。前一天刚会过面的勒保与德楞泰，于四月初八日渡江进行到一半时赶到江口。他们杀死数千人、俘获数百——俘获的大多是被裹挟的平民——还有大量牲口。只有两千来名叛军到了东岸，随后进入广元与南江的山区。叛军联盟在嘉陵江以西近三个月的游窜，是这场冲突唯一一次蔓延到成都平原。联盟的迅速崩溃证明：德楞泰允许叛军渡涪江，冒的风险并不太大——他们的核心只有几千人，大多数被裹挟的平民很快就脱逃了。勒保追击叛军到东岸后，与德楞泰分手，西转龙安。朝廷责成他在那里督剿来自甘肃的高马股，更重要的是，逮捕魁伦。^100\n魁伦的倒台并不意外。三月二十九日接到起事者西渡涪江的消息后，嘉庆立即罢免了魁伦，下令将他逮捕审讯。他慌忙收回先前对魁伦江防努力的称赞，如今痛斥他守江失败。勒保再次被命署理魁伦之职；他还奉命逮捕并审讯魁伦。^101 仅仅六个月，勒保与魁伦就互换了被告与主审的角色。仿佛对充当魁伦的主审感到不自在，勒保告诉皇帝，这差事对他而言很为难：\n勒保告诉皇帝，这差事对他而言很为难：从严会被指责报复，从宽又会被指责包庇（他声称自己与魁伦是亲戚，但没有说明是什么亲戚）。然而，勒保并没有回避。相反，他请求与他一同审理此案的是周兴岱——一位奉派赴川陕祭祀名山佛道的钦差。周兴岱是四川人，还负有搜集战役情报的秘密使命。一路上与朝廷书信往还，周兴岱必定知道自己在审理中该怎么做。^102 尽管魁伦的自辩言之成理，勒保与周兴岱还是认定：他应对叛军渡过嘉陵江与涪江以及朱射斗之死负责。此外，周兴岱还指控他：叛军蹂躏绵州一带时拒绝派兵救援，造成重大伤亡。勒保补充说，一名脱队军官被乡勇头目误杀时，魁伦谎报该军官阵亡。然而，精明的勒保没有提出刑罚建议，只说还需要更多证人，而他又要赶赴前线——尽管他们的调查结果已构成重罪。^103\n接办此案的军机大臣们于四月二十七日建议：在成都将魁伦明正典刑。不过，嘉庆虽然批准死刑，却命把魁伦押解北京再审。^104 嘉庆或许需要更多时间来论证死刑的正当性——这场战役还没有任何高级官员被处死。永保与惠龄没有被处决，尽管他们的\"罪行\"造成的损害比魁伦案更严重——到此时，叛军联盟已经瓦解，残部已被赶回嘉陵江以东。\n魁伦在北京复审之后，六月二十三日，军机大臣们维持了原判死刑。嘉庆同意死刑，强调了两江河谷的惨状与百姓的苦难。研究了几个高级官员死刑的先例后，嘉庆选择以杨应琚案——18世纪60年代清朝缅甸战争时的云贵总督——为魁伦量刑的蓝本，因为二人同任总督，同在夸口能胜之后未能把战争引向胜利，又都谎报信息欺骗朝廷（就魁伦而言，嘉庆指的是他谎报军官之死）。仿效乾隆对杨应琚赐自尽的决定，嘉庆把魁伦的判决由处决改为自尽。这是一份恩典——魁伦可以免于当众斩首之辱，尸身得以保全——因为正如皇帝所指出的，他是自愿奔赴前线的。^105\n四十九岁的和珅自缢十六个月后，四十八岁的魁伦以同样的方式死去，成为这场漫长战争中第一个、也是唯一一个被处死的大员。与留下巨额家产的和珅不同，魁伦并不富有，被捕时没有钱像勒保那样赎身。更糟的是，魁伦还欠着福建任上的十万二千多两亏空。^106 魁伦死后，其妻遵夫遗嘱，把全部家产——包括北京的几处房产与私人物品——呈缴官府。然而，总值还不到巨额亏空的十分之一。嘉庆蠲免了余下的债务，允许魁伦之妻保留一处由家中仆人居住的房子。他还裁定：因魁伦案刚被流放伊犁的独子，三年后可以回家。嘉庆再次称赞魁伦的清廉，说魁伦的高尚品行是他决定把刑罚从处决减为自尽的一个因素。他补充说，官员清廉是有好处的——一旦获罪，它可以帮助减轻刑罚。^106\n嘉庆显然对魁伦之死感到某种不安。唯恐被指责处置高级官员轻率，嘉庆在魁伦死前死后都激烈地、反复地为自己的惩处辩护。他论证说：既然他惩处过父亲任命的人——如明亮与勒保——他就不可能偏袒自己任命的魁伦。更重要的是，他试图借魁伦案强化自己\"刚毅之君、可与意志坚强的列祖列宗比肩\"的形象——一个能对高位者施以严惩的君主。^107 就此而言，魁伦不仅是为他所犯的\"罪行\"牺牲，也是为了满足嘉庆的政治戏剧需要。嘉庆之所以挑中正直的魁伦而非别人，还因为——正如嘉庆不止一次说过的——魁伦与他并不亲近，处置起来比较容易。^108\n魁伦之死也被当作对战役领导层的警告。嘉庆立即把对魁伦的最终判决告知额勒登保、德楞泰、明亮与全体督抚。他敦促他们在新期限——秋至冬之间——内完成战役，以免像魁伦那样受罚。^109 然而，魁伦之死事实上帮德楞泰与额勒登保免除了四川溃败的责任。嘉庆清楚地知道，额勒登保与德楞泰撤出四川是叛军渡嘉陵江的关键因素，他曾反复责备二人，使额勒登保一直处于守势。^110 替罪羊既死，案子也就结了。至于渡涪江，嘉庆选择不怪罪德楞泰，说石门寨之战后他松开缰绳，是因为他必须追击四散的叛军。嘉庆为德楞泰初期的胜利而欣喜——他把德楞泰的爵位从三等子升为一等，并正式任命他为成都将军——尽量不与战场上能干的德楞泰对着干。然而，他很快就对德楞泰旧习复发——不彻底了结起事者——警惕起来，尤其恼怒于他未能在叛军联盟渡回嘉陵江东岸之前消灭其残部；他对德楞泰的新\"胜利\"也不再那么兴奋。^111\n既没有钱，又与皇帝没有私交，魁伦似乎是适合牺牲的人选。此外，他讲原则的品格与直率的性情也为他树敌众多。因此，几乎没有人惋惜他的死。^112 只有魁伦的汉族朋友、学者许敬在一首诗里表达了淡淡的同情。许敬把魁伦比作唐朝宰相房琯——安史之乱期间，房琯自请率军收复京城，结果全军覆没，惨败而归。然而，房琯的朋友、诗人杜甫为房琯求情，房琯未受惩处。许敬哀叹自己不是杜甫，只能寄望魁伦死后化作厉鬼，杀尽叛军以自赎：\n\n潼江水浩浩，\n贼马饮于河，贼势方张；\n王师未能及时赶到，\n老弱绝望呼号；\n江水变红，尸体随波而去。\n蒙受如此浩荡皇恩，\n岂能不为己罪担责？\n化作厉鬼，执刀挽弓，\n上报苍天，下遏狂澜；\n扫尽贼寇，血染战袍；\n贼无所逃，如燎毛羽，尽数伏诛。^113\n[译者按：许敬诗自英文直译，中文原文待补，见注释113。]\n\n那彦成蒙羞\n1800年夏末魁伦死去之时，那彦成——那个有望填补和珅空缺的钦差大臣——已经倒台。^114 到陕西以来，那彦成始终未能了结张汉潮的数百名残部，又不顾皇帝的多次命令，拒绝撤出秦岭。正月初，得知高马股、戴家营及其他襄阳出身各股侵入甘肃，嘉庆立即命那彦成火速赶去。但张汉潮的最后人马此时已走出山林，迅速前往陕豫、陕鄂边境。那彦成声称是他的部队把他们赶出去的，嘉庆却怀疑——他认为是他们给养耗尽才出山的。把叛军从边境赶回去的战斗并不顺利。直到嘉庆又给了他一次\"严旨申饬\"，那彦成等人才迫使叛军离开豫鄂边境。那彦成再次被催促赶赴甘肃，并限期三个月完成那里的战役。那彦成把五千名绿营兵留在陕西，带走了全部旗兵。他的岳父恒瑞与他一同前往甘肃。^115（地图4.2）\n在甘肃，起事者一直游荡于成县、秦州、礼县与伏羌，但已被甘肃军队遏制打击。^116 正月下旬，那彦成与恒瑞从宝鸡进入甘肃（他们经栈道追击一支大队叛军），很快取得两场胜利，对付杨开甲一万多人的队伍——其中大多数是被裹挟的平民——先在秦安龙山镇，后在伏羌秀金镇。第二场战斗中，德楞泰赶到，帮助击溃了叛军。那彦成参战以来第一次，嘉庆大加称赞他，并赏其部队一个月饷银。由于嘉陵江之败，嘉庆命德楞泰返回四川，责成那彦成与恒瑞在夏天之前消灭甘肃叛军。^117\n与此同时，额勒登保一直缓慢地向前线移动。直到二月初九日——从达州出发一个多月后——额勒登保才到达秦州与那彦成会合。嘉庆不悦，但听说额勒登保旧病复发，立刻原谅了他。^118 额勒登保或许确实病了，但也可能是不愿与那彦成合作。事实上，嘉庆曾一再警告那彦成不要自傲、不要不服从额勒登保。那彦成虽一再表示二人关系融洽——他小时候，额勒登保在北京当侍卫，他们就相识了——嘉庆仍怀疑：\"贫贱之交，未必能保于富贵之后。\"（原文待核，见注释119）^119 确实，如今平步青云的那彦成几乎按捺不住骄矜之气。甘肃首捷之后，他要求\"参赞大臣\"之衔——这将使他成为额勒登保的副手。嘉庆同意了，却不以为然。二人合兵之后，嘉庆指示那彦成统领甘肃全部军队——包括额勒登保的——因为额勒登保病了。然而，嘉庆不允许那彦成署理额勒登保之职。^120\n不过，他们只合作了很短时间。尽管皇帝有令，额勒登保并没有把部队的指挥权交给那彦成，而且很快亲自返回前线。二月下旬，在广厚率领的两千三百名甘肃兵的增援下，占优的清军在岷州与礼县的数场战斗中击垮了渡过渭河南岸的高马股及其他股团，杀俘数千。随后，额勒登保与那彦成挫败了高马股前往四川松潘的企图，迫使其北转，并在二月底前于礼辛镇将其击溃。^121 此役之后，额勒登保与那彦成分手，率其四千名士兵前往秦州；那彦成与遵旨重新参战的庆成则向南追击高马股。^122 额勒登保与那彦成之间很可能发生了以那彦成旗兵为中心的冲突。嘉庆长期以来认为那彦成兵力过大，指示额勒登保从那彦成那里取得一千名吉林旗兵，而不是增调旗兵。^123 那彦成赴甘时，嘉庆还让他与额勒登保商量如何分兵。那彦成很可能拒绝给额勒登保任何旗兵。结果，两人都请求增援，嘉庆却认为没有必要。^124\n清军精锐开赴甘肃，使陕西暴露。以襄阳老叛军伍金柱为首，正月下旬渡过汉江的几股四川叛军合并，成为\"伍家营\"（Wujiaying）。无法抵达湖北，这支队伍在镇安与旬阳一带游荡，据说通过招募当地教众与裹挟他人，聚众两三万人。二月旬阳三岔河的一场战斗中，这支队伍几乎全歼了一支两千人的清军，杀死了其首领——一位总兵。^125 在汉江以南，苟文明、鲜大川、龙绍周与唐大信率领的各股叛军反复试图从四川突入兴安。为防止他们渡江，数名军官与陕西省级官员驻节紫阳与安康。三月中旬，由于清军压力与甘肃资源匮乏，数千名起事者——包括戴家营、张世龙、张添伦、杨开甲与辛聪——从甘肃返回陕西。回应陕西绝望的求援，嘉庆先命恒瑞率其两千四百人回陕，^126 随后又指示额勒登保回陕，让那彦成留甘了结高马股——甘肃境内唯一被困于该省荒凉的东南一角的叛军股团。^127\n那彦成与庆成冒着冰雪覆盖的群山，追击四千多人的高马股，向文县而去。一些起事者绝望地上吊或投河。三月十六日，那彦成追上了正在围攻卡郎寨的叛军——卡郎寨是一座庇护一万名平民的大堡——将其击溃，杀俘近两千，此外还有许多人在踩踏与坠崖中丧生。但约一千人逃走了，消失在川甘边境的森林里，随后突入四川龙安府。然而，那彦成请求让驻龙安的百祥去对付这些叛军，自己则请求返回陕西。嘉庆勉强同意，同时对那彦成未能全歼此股怒火中烧。因此，他对那彦成肃清甘肃之功分文不赏。^128\n嘉庆命额勒登保回陕时，额勒登保已经在回陕途中。听说那彦成卡郎寨之战，额勒登保在一道奏折中表达了对高马股入川的担忧——这显然是暗地里抱怨那彦成未竟全功。^129 然而，额勒登保自己也受到了严厉而持续的批评。出任统帅半年多仍未能结束战役——事实上，四川与陕西的局势都急剧恶化——嘉庆对额勒登保统率战役的能力产生了怀疑，尽管他对其品格的信赖毫不动摇。他还不断严厉斥责陕西的其他领导人。通过秘密渠道，嘉庆得知：从甘肃返回的起事者已进入秦岭，占据要地，劫掠裹挟平民，阻断商旅与官道，而陕西的将领官员竟一场仗都没打过。他命额勒登保查办有关人员，以处分相威胁。他还设了一个新的——尽管不切实际的——期限：四月底前肃清陕西全部叛军。或许是察觉到额勒登保与那彦成之间的紧张关系，他指示那彦成前往川北。^130\n回到陕西，那彦成于四月初十日在洋县与额勒登保会面。额勒登保此时或许提出了要那彦成旗兵的要求——因为嘉庆再次让额勒登保从那彦成那里取得一两千名旗兵。指望着得到他们，额勒登保拒绝了嘉庆从四川调三千名贵州兵给他的提议。然而，那彦成显然没有照办。与上次一样，两人最终都请求增援。他们声称：除伤病员与不堪用者外，可用之兵不足五千，却要对付十几股叛军，于是要求一万三千名援军，计划编成五路，肃清陕西叛军。^131 他们的请求与嘉庆近来\"多用乡勇、少用正规军\"的倾向相悖，令他不快；但嘉庆还是同意派六千名士兵赴陕、两千名赴豫——因为他非常担心额勒登保与那彦成在陕南会迫使起事者入豫。他严厉斥责二人对河南毫不关心，撤销了那彦成入川的决定，并严正告诫二人务必不遗余力地保障河南。同时，嘉庆让吴熊光加强河南边防，为此甚至愿意提供一些经费。^132\n事实上，吴熊光一直在提醒朝廷注意陕西叛军的动向——它们表明叛军有入豫意图。^133 确实，三月下旬，几股叛军开始东移商州，与清朝边境驻军发生冲突。或许是为了分散清军注意力，伍家营派出分遣队攻打安康与旬阳县城，两次都失败了。嘉庆认为叛军入豫是重大挫折——因为在富庶人口稠密的河南，起事者更容易获得给养与新血——他宁愿他们去川东北或甘肃。^134 嘉庆心神不宁地部署河南防务，命向河南增派援军。同时，他加紧了对陕西领导人的批评。除给每人\"严旨申饬\"外，他还摘去了额勒登保、那彦成、长麟与台布的翎羽顶戴。^135 在皇帝日增的压力下，额勒登保、那彦成与恒瑞急忙赶往陕西东南角，吴熊光则奔赴荆紫关，其部队甚至越界到了洛南与商南。四月底，额勒登保在边境附近两场战斗中击溃杨开甲等人之后，叛军离开了豫陕边境。^136\n河南危机刚一解除，湖北又陷入危险。突入河南不逞之后，起事者采取了新策略。一支合并起来的队伍向西进入秦岭，由冉学胜率领——这位襄阳叛军外号\"青眼窝元帅\"（Qingyanwo Yuanshuai），已成为张汉潮残部的首领。与此同时，闰月初，杨开甲、辛聪与张添伦趁守卡乡勇回乡收割之际，在郧西突入湖北。随后伍家营也转向那个方向。显然，他们打算绕道入豫。恒瑞先赶到那里，却吃了一场败仗，损失数百名士兵，尽管叛军的伤亡也不轻。^137 数日后，额勒登保与那彦成在镇安会面后，率其大军进入湖北。^138 叛军似乎智胜了他的将领们，这令嘉庆震怒。在闰四月十五日的一道长谕中，他指责将领们没有拿出通盘方略，并宣泄了自己从千里之外指挥战役的沮丧。\n对那彦成失去信心的嘉庆，终止了他的使命，命他把全部军队交给额勒登保，返回京城。^139\n嘉庆对那彦成的不满，又因四川的警报而加剧：高马股突入龙安与松潘之后，队伍扩大，对成都构成威胁。嘉庆一再谴责那彦成，勾销了他在甘肃对高马股作战所积的功绩。即使听说那彦成在湖北与伍家营激战终日、杀敌数百、重创伍金柱，他也没有赏赐那彦成或其部队。^140 命那彦成回京后不久，压垮嘉庆对那彦成最后希望的最后一根稻草落了下来：石进等数名军官在龙安与高马股作战时阵亡。嘉庆再次痛斥那彦成，把石进之死归咎于他没有全歼高马股，并再次批评他滞留秦岭，给了叛军入甘的机会。此外，他还指责那彦成试图与额勒登保争功，过早从甘肃返回。嘉庆褫夺了那彦成众多职衔中的大部分，以及紫禁城骑马的资格。然而，他还是给那彦成留下了三个职位——因为他不愿把阿桂的后代全部从高位上除名——他刚刚罢免了那彦成的叔父阿迪斯，将其流放新疆。^141\n接到回京的谕旨后，那彦成并没有如嘉庆所料请求留在前线。他立即收拾行装，从郧西启程返京。他于五月下旬回到北京——距他离京已经十个月。嘉庆连日召见他，希望从那彦成那里听到令人信服的自我辩护，好给皇帝一个把他从彻底垮台中捞出来的借口。然而，被对战役的悲观与自身灾祸压垮的那彦成，没有对战役提出任何有用的分析或想法。相反，他消极、冷漠，有时语无伦次。他告诉皇帝：叛军就像蝗虫，太多太密，人力无法消灭；叛乱是一场注定的劫数，劫数未满，即便最杰出的将领也无能为力。嘉庆告诉他额勒登保在他离开后立即取得的胜利，那彦成耸耸肩，表示不信。皇帝很不高兴。^142\n嘉庆褫夺了那彦成最后三个职位，但阿桂之孙的身份使他免于流放新疆。沦为区区翰林院一员的那彦成，回到了他十年前起步的地方。^143 比个人悲剧更重要的是，那彦成的倒台迫使嘉庆放弃了\"以自己门生填补和珅空缺\"的计划，从而终结了\"依赖一位领班军机大臣\"的做法，为军机处更寡头化的运作方式打开了大门。\n广兴与托津被召回\n嘉庆终止那彦成使命两周后，于闰四月底召回了广兴与托津。正月下旬——听到叛军渡嘉陵江消息前不久——嘉庆曾命广兴留川，与托津共同主持后勤。但好斗的广兴此后继续无情地攻击魁伦，无视嘉庆\"与魁伦相处要有节制\"的告诫。就连魁伦的善意表示——他奏请让广兴留任到托津到来——也没能换来停战。最后，皇帝烦了；二月，他暂停了广兴的职责，但仍让广兴留驻达州听候指示。^144\n托津在川西危机正酣时到达达州，此时人们对战争财政改革已无多少热情。四十五六岁的御史托津，在削减开支上采取了务实的做法。他对地方官员的请款虽然坚决控制，对军队将领却不像广兴那样严厉。起初，托津对四川战场的财政状况颇有信心。三月下旬，他估计手头的经费加上在途经费可以支撑几个月——他相信到那时战役已经结束。^145 然而，仅仅几周，他就改变了看法：抱怨军队、乡勇与后勤人员的开支巨大，担心下个月的经费不足。于是，他向中枢政府请求增拨经费。嘉庆恼了，命托津与广兴一同回京，批评托津胸无成算、广兴好生事端。为论证自己的决定，他说：既然湖北、陕西都没有设后勤钦差，四川也不必特殊。同时，嘉庆任命勒保以署理四川总督的身份监督后勤，并挑选任命地方官员主持达州军需局。^146\n很可能皇帝听到了不利于托津的流言。此外，托津要钱来得不是时候。到1800年，清朝国家在连续数年的巨额亏空后，正艰难地恢复财政平衡。所有政府部门都被动员起来开源节流，嘉庆则在想方设法支撑这场耗资巨大的镇压战役。嘉庆虽然知道勒保与德楞泰都是大手大脚、积习难改的人，还是下了一着狠棋。在闰四月二十八日给勒保、德楞泰——关于把后勤大权交给勒保——的谕旨中，他命他们把伤病兵遣回本省，只留数千精兵，少用受雇乡勇、多招义勇。他从户部与内务府两库为四川战场拨了四十万两，并告诉二人：这笔钱之后，北京不再给钱了；此后勒保应当用四川本省钱款支付战役开支。嘉庆论证说：叛乱起因于地方官的腐败与治理不善，因此，用本省钱款平叛是地方官的责任。只有当他们失职、听任叛乱升级、殃及他省时，中枢政府才不得不介入，挑起财政重担。然而，正如皇帝所哀叹的，这反过来成了战争领导人们自肥的大好机会，叛乱不断扩大，中枢政府的府库随之枯竭。^147\n嘉庆对这场指挥失当的战役动态的剖析，颇有见地。确实，国家过分慷慨的财政支持，助长了战争领导人对越来越多经费的胃口，使他们无意尽快结束军事行动。尽管嘉庆威胁切断现金管道，国家却不太可能与这场战役撇清干系——尤其是勒保回川监督后勤之后。勒保很快着手撤销改革、恢复旧秩序。起初，他与德楞泰试图把石作瑞——被魁伦罢免逮捕的前军需大员——弄回来。由于魁伦没有找到足够的定罪证据，嘉庆释放了石作瑞，发还了被抄没的家产。返回四川时，德楞泰曾请魁伦派石作瑞来主持其部队的后勤。随后，德楞泰奏请恢复石作瑞的原职原衔，称赞他勤勉、老练、高效，尤其善于安置难民、审讯俘虏。但嘉庆只允许石作瑞以革职官员身份在军中效力，把一切恩典推迟到战役结束。^148 两周后，勒保与德楞泰再次请求。除先前的称赞外，他们强调石作瑞是被魁伦诬陷的——这是\"全省官民\"公认的。嘉庆仍然犹豫，但还是恢复了石作瑞的道员之职，这为石作瑞在勒保主持下重掌四川军需大权铺平了道路。^149\n更多的处分\n嘉庆再次对主要战争领导人行使皇权——这一次他瞄准的是自己任命的人——的同时，还对战役中一大批中下级军官官员施以惩处。三月，六十八岁的宁夏总兵吉兰泰与陕西道员常亨因年初未能阻止高马股侵入甘肃而被罢免，尽管额勒登保与那彦成为他们求了情。^150 同月，嘉庆罢免了四川的两名将领七十五与阿迪斯。嘉庆骂二人是\"一对蠢材\"，反复不断地批评他们对川西危机的反应迟缓。七十五的行径或许是故意的——他对改革积怨甚深；阿迪斯则纯属不称职——就连他的父亲阿桂也曾说过，阿迪斯绝不该出任京外之职。1799年底到四川以来，阿迪斯一直在大宁闲居——那里当时几乎没有战事。接到魁伦通报叛军渡嘉陵江的信后，阿迪斯拖了几周才动身。三月下旬到达重庆时，他以左腿残疾为由辞了职。如果说那彦成的火箭式擢升是阿迪斯获任四川的原因，那么一旦那彦成自己失宠，平庸的阿迪斯便几乎没有留任的可能。召回那彦成的次日，嘉庆把阿迪斯流放伊犁，并褫夺了他四个儿子的职位。^151\n春末夏初，嘉庆还惩处了大批其他失职或行为不端的军官，并对那些袖手旁观者进行调查。^152 四月初，嘉庆迈出了更大胆的一步：他下令清查普遍存在的谎报战功行为。他要求调阅父亲主政的头三年战役期间所授全部升赏的档案，重新审核，剔除虚假者。^153 这一举措虽然因不切实际而走得不远，却揭出了1796年的一桩欺诈案：湖北一场从未发生过的战斗被当作胜利奏报朝廷，二十多人因此升官受赏。嘉庆撤销了几乎所有升赏，包括当时湖北巡抚汪新的。^154 这些处分看似严厉，却是1800年上半年嘉庆与这艘危船领导层较量中的最后一搏。从下半年起，嘉庆的决心开始蒸发。最终，在这场漫长战争的其余岁月里，他从鹰派立场退回到放任自流。\n刘之协的被捕\n1800年初秋，刘之协在河南被捕。自叛乱爆发以来，清朝一直在追捕他，但线索很少，且无一可信。^155 事实上，刘之协从未离开河南。襄阳起事前夕藏匿起来后，他一直住在新野与邓州教门中人的家里。清军地方部队挨家挨户搜捕嫌疑人时，他就躲在隔壁邻居的后院。部队一搜到隔壁，他就回到第一家。通过信使，他与王廷诏保持着断断续续的联系。^156 这条联络线很可能是在1797年初襄阳队伍经河南入川之后建立的；否则，襄阳叛军在河南时就会去找刘之协。此后，刘之协留在河南，可能成为叛军入豫计划中的一个重要因素。\n1800年夏，刘之协前往新野以北约一百五十英里的郏县，住在酒铺老板李杰家中——李杰是刘之协1793年引入教门的。刘之协为何去郏县，至今不清楚——他告诉审讯者说他试图向河南省政府自首，这显然不是真的。他也不可能试图在那里组织起事——郏县所在的汝州府教门网络远不如南阳。^157 然而，刘之协的到来可能是李杰决定起事的一个因素。当时，李杰的一名弟子被地方官府逮捕。担心受牵连，李杰与其他教众于六月二十三日举事，与清军冲突。他们的一面旗帜上写着\"天王刘之协\"（Tianwang Liu Zhixie）——看来刘之协曾答应加入他们。然而，看到李杰人少、武器简陋，刘之协决意离开。他告诉李杰，他在新野与邓州还能动员更多人，但他必须亲自去那里动员。李杰的熟人冀大荣——郏县退职衙役，被裹挟加入起事——帮着说服李杰：刘之协必须走这一趟，并自告奋勇充当向导。六月二十八日，两人到达郏县东南约三十英里的叶县县城时，冀大荣哄骗刘之协在朋友开的茶馆歇脚，并让朋友向官府告发。刘之协在茶馆被捕。^158\n刘之协离开后，李杰及其同伙到附近村庄招募更多追随者——或凭说服，或靠胁迫——并劫掠给养。随后他们据守郏县与宝丰交界的一座旧堡翟家寨。七月初七日，南阳援军到达后，按察使马慧裕攻打该堡，次日将其摧毁，据说杀俘一千余名叛军，但李杰与数百人逃往卢氏的蓬山。一周后，吴熊光围攻蓬山，收捕了据守那里的五百人中的大多数。李杰再次逃脱，但数日后被擒。^159 不到三周，河南就在没有借助任何外来精锐的情况下扑灭了这场初起的叛乱。^160\n在河南、继而在北京的多次审讯中，刘之协起初试图撇清自己与叛军的关系，但在北京受刑之后，他最终承认：在龙年龙月龙日龙时的\"四龙之辰\"起事是他提议策划的。然而，刘之协没有透露更多关于叛军——尤其是他们的计划——的信息，对混元教网络也语焉不详。对出卖自己的冀大荣恨之入骨，刘之协声称冀大荣才是郏县起事的首领，但没有奏效。八月十四日——中秋节前一天——刘之协被凌迟处死。^161\n刘之协在囚禁期间与死后，都被清朝利用来瓦解叛乱。嘉庆命战役领导人与地方官广泛传播刘之协被捕与河南起事迅速覆灭的消息。同时，他宣布赦免南阳府所有帮助过刘之协的教众，为他的招抚政策树立样板；并责备郏县、宝丰的地方官——正是他们搜捕教众不遗余力，才激起了起事。^162 嘉庆重申宽容教门的意图，强调处死刘之协不是因为他传教——嘉庆承认，教门教义劝人向善——而是因为他煽动叛乱。刘之协被处决几天后，嘉庆颁布了他著名的《邪教说》（Xiejiaoshuo），再次明确：白莲教是合法的，只要奉公守法，地方官府不应再迫害教众；但任何图谋叛乱者，无论是否教门中人，都应惩处。^163\n正如一些史家所指出的，为瓦解叛军士气，清朝国家夸大了刘之协的角色，在他被捕后把他描绘成教门运动乃至仍在进行中的叛乱的最高领袖。^164 事实上，刘之协对其教门政治事业的忠诚令人怀疑——与许多在囚禁中、面对死亡仍信仰坚定的教众形成鲜明对照。^165 刘之协两次退出起事，证明他机会主义而自私。如果说与收元教的竞争凸显了他的第一次弃离，那么他逃离河南起事则无可辩驳地是一种背信行为。话虽如此，刘之协在起事者中仍享有相当的威望——或许得益于王廷诏等首领对他的抬举。因此，他的被捕与死亡确实是对叛乱内外教门中人的一次打击。襄阳叛军首领之一的张世虎1803年供认：刘之协死后，敢加入叛乱的教众更少了。^166\n甚至在刘之协死前，起事者招募新血就已经困难重重。无论教门中人还是普通百姓，都不再热烈响应他们的事业——尽管许多教众以及一些僧道同情他们，为他们提供食物与情报。^167 除一些地方匪徒外，只有一例当地居民成批加入叛军。1800年春，陕南旬阳的酒铺老板、教门中人庞洪胜据说动员了两千人——包括他的家人与弟子——加入了伍家营。^168 陕西的叛军曾派信使到河南招人，没有收获。^169 冉天元联盟虽然在人口稠密的川西大大扩充了队伍，但大多数是被裹挟者，数日或数周内就脱逃或投降了。\n长期攻不下城镇，起事者如今连白天进村都犹豫了，只在夜间劫掠村庄、裹挟平民。他们移动时只走山间便道，穿过清军关卡时单个通过。他们常常不得不抛弃妇孺，甚至杀死她们。樊人杰、苟文明、龙绍周等几股叛军深藏于川陕交界的群山中，没有大的行动。越来越多的当地居民带着粮食、牲口与家当躲进堡寨，攻打这些堡寨成了叛军的家常便饭。由于叛军可能败于武装平民之手，有时他们选择用银子或其他贵重物品向堡寨换取食物。起事者越来越衣不蔽体、赤足而行，士气低落。^170 马蹄岗被擒前不久，冉天元承认：\"终究难逃一死，只能苟延一日是一日。\"（原文待核，见注释171）^171 尽管高马股与徐天德联军等几股仍有实力，这几点火星已无法重燃垂死的叛乱。\n军事前线\n叛军失去势头之际，皇帝又一次急于奏凯——因为父亲所打的历时最长的战争也只打了五年。五月底，他敦促三个战场的领导人——四川的勒保与德楞泰、陕西的额勒登保、湖北的明亮与倭什布——迅速了结战役。然而，他不愿提供援军——因为没有军队可调，新兵又不顶用，他声称。相反，他指示领导人们遣回伤病兵，以节省开支。^172 然而，现任战争领导人们似乎无意完成战役——尽管他们打胜仗，大大减少了叛军的人数。勒保、德楞泰与额勒登保在作战方式与同朝廷打交道方面越来越相似，成了前线的\"三巨头\"。与此同时，明亮因皇帝的冷落而沮丧，再次故意拖延。\n四川战场\n魁伦被除后，勒保虽然只是署理，却拥有四川总督的全部权力。他立即投身于恢复自己被罢免前建立的关系网，尤其是修补与额勒登保、德楞泰的关系。勒保把嘉陵江渡江之责单独归咎于魁伦，为额勒登保开脱，论证说：额勒登保撤出四川时，叛军离江还远。周兴岱很可能是按勒保的建议，称赞德楞泰是四川最能干的将领，并提到他注意安抚被裹挟的平民，却不提德楞泰大肆屠杀俘虏。^173 勒保还试图搭救刘清。他虽然请求罢免刘清（但让他留前线戴罪立功），却再次把魁伦钉为涪江溃败的首恶——是他把部队调走、又拒绝了刘清的增援请求。不久，嘉庆以刘清素有名望为由恢复了他的职务。^174 勒保试图结交的另一个人是七十五。由于勒保的求情，七十五得以留任前线，夏天又恢复了四川提督之职。^175\n但勒保在战场上出了差错。三月下旬，数千人的高马股渗入四川龙安府。或许是等待贵州援军，勒保没有急着去龙安，声称要先安抚涪江沿岸居民。数周后他终于赶到，却在四月二十八日风雨交加之夜被高马股夜袭——袭击目标是龙安府城附近竹子山山脚的勒保营盘——而措手不及。勒保的门生、总兵石进率领的贵州军队于黎明赶到。勒保得救了，石进却阵亡了，数名试图营救石进的军官也死伤了。^176 勒保把石进之死瞒了数日，直到传来好消息：黑号首领王英在龙安被擒。^177 勒保对石进之死不担任何责任，反而责备贵州兵——他们大多是新兵——没有纪律、缺乏韧性，未能冲上起事者据守的山顶、抵挡敌人的冲锋。能干石进的损失令嘉庆痛心，他把怒火发泄在那彦成身上，认为那彦成过早撤出甘肃应对石进之死负责。这一次放过了勒保，嘉庆责成他歼灭龙安的高马股。^178\n但勒保跟丢了高马股。一个多月里，这支队伍在甘川边境的森林里进进出出。龙安一场持续数日的战斗——勒保打到数日之后才赶到现场——之后不久，这支队伍经松潘返回甘肃。^179 勒保拙劣的表现令嘉庆震怒，但他克制住自己，没有罢免勒保，只摘了他的顶戴——他认为频繁更换领导层会使叛军轻视清朝。相反，嘉庆下令把负责龙安防务的百祥降职，并判处松潘参将增顺死刑。^180\n高马股的离去标志着川西战事的结束。焦点回到了川东北。\n趁春天大部分清军开赴嘉陵江以西之机，鲜大川、龙绍周、苟文明等叛军股团从陕鄂边缘返回，被击溃各股的残部也重新集结。随后，由于德楞泰的压力，张子聪与徐万富率领的联盟余部从广元与南江返回。这些股团——各有数百至数千人——在太平、开县、达州、东乡、通江、巴州之间游荡，常常窜入紫阳与西乡，有些向南远抵重庆府。起事者专注于重组与求生之际，堡寨中的平民拿起武器与零散的叛军作战，而且常常取胜。相比之下，清军正规部队迟缓懈怠，只确保不让叛军攻取城市或逼近嘉陵江。入夏，德楞泰追击一些叛军到通江后停了下来。^181 与此同时，勒保从龙安返回川东北时慢条斯理，说是要视察嘉陵江防务。经过一个多事而紧张的春天，四川战场安静下来，陷入了难耐的酷暑。\n直到夏末，双方才重新活跃起来。六月下旬，初夏从湖北返回四川的樊人杰，在梁山与鲜大川、苟文明会合，再次企图渡过嘉陵江。一场苦战之后，联军在短暂而无功的垫江围城之后，进入邻水、垫江、长寿交界的山区。勒保与德楞泰在山外等七十五与李绍祖，等了好几天。叛军从山中复出、向江移动时，于七月十一日被近两万名清军正规兵与乡勇击溃，随后被追到岳池。据说数千名叛军被杀，两千多人投降。嘉庆认为这一仗保住了川西的安全，欣喜若狂，正式任命勒保为四川总督，赏二品顶戴——尽管勒保在这场战斗中究竟贡献了多少，颇为可疑。^182（地图4.3）\n联盟瓦解后，苟文明回到边境，樊人杰与徐万富退入大宁。其他几股的残部——每股数百或一千人——在通江盘桓。^183 返回家乡巴州时，鲜大川被部下杀死——鲜大川的叔父是地方乡勇头目，拒绝在自己的堡寨里庇护鲜大川及其人马。^184 许多起事者投降了，其他人也在考虑。张子聪藏身家乡东乡的山中，与地方官员接触，但数名刚来投奔张子聪的首领阻止了他，杀死了官员派来的所有信使——只留下一人。汤思蛟与官府的谈判也因同伙的反对而流产。急于与叛军达成受降协议的勒保亲赴东乡。然而，勒保派去与龙绍周接触的信使全部被杀，其中包括龙绍周的一个远亲。^185\n为扭转迅速瓦解的局面，庹向瑶、汤思蛟、刘朝选与赵益英（绰号\"赵麻花\"，Zhao Mahua）——他们大多来自达州与东乡——于八月十二日在东乡、通江一带对德楞泰、勒保与七十五麾下的清军发起了一次协同攻势。激烈的战斗持续了十天，叛军据说损失了两千四五百人，只剩两千余人。此后，清军一个接一个地——常常不费吹灰之力——扫平了各股。庹向瑶与赵益英战死。唐大信去劫掠乡勇堡寨时被当地乡勇杀死。年底，张子聪独自一人在开县被擒。剩下的起事者再次退入边境上或边境附近的山中。^186\n焦虑地关注四川战役的嘉庆，没有放过德楞泰夏天的拖延与闲散。他骂德楞泰与春天在川西有效作战时判若两人，给了他几次严旨申饬，一度几乎将他罢免。^187 他也不赞成勒保招降叛军的努力。四川起事者的迅速崩溃鼓舞了嘉庆，他变得满怀希望，因而更加鹰派，责令将领们专注于作战——叛军只有在被打得致命时才会愿意投降。^188\n但勒保与德楞泰另有盘算。初夏以来就没再收到经费，勒保与德楞泰试图迫使朝廷撤销\"不再给四川拨款\"的决定。为此，他们拒绝裁减乡勇，并要求增调索伦兵。勇猛的满洲军官赛冲阿率七百名索伦兵，被升为固原提督时，勒保与德楞泰恳请朝廷把赛冲阿留在四川。^189 为论证在四川保留大军的正当性，二人积极鼓吹嘉庆提出的一个策略——把陕西与湖北的全部叛军赶向四川——声称在四川更容易对付他们，因为当地居民已普遍筑堡。从陕鄂两省来的叛军或散或小，四川的大部分清军又一直闲置，德楞泰却径直向皇帝请款，声称：如果陕鄂的起事者都被赶向四川，军队就会更多，而四川省库的经费已经用尽。德楞泰一面承诺年内了结叛军、来年春天肃清残部，一面警告说经费短缺会妨碍最后的胜利。^190 不久，勒保与德楞泰又联名上奏，加倍请求拨款——这一次的理由是向太平运粮，以支援赶往那里对付陕鄂起事者的部队。他们还奏报：已向成都、重庆与达州的商人借了一万两，还打算向湖北、陕西借钱——因为他们雇夫的经费早已用完。^191\n皇帝起初对他们愿意把叛军全部赶向四川感到高兴。除口头嘉奖外，他还送去许多礼物，包括皮裘——这是罕见的恩典。然而，他很快怀疑他们年底前结束战争的承诺并不认真，而且勒保与德楞泰已经有些日子没打过一场仗了。一想到战争要拖到明年，嘉庆就心烦意乱，不断地责备他们。然而，他还是屈服于他们关于经费的压力，给了四川六十万两——尽管是以\"善后\"的名义。惦记着新年将至，他命用一万两为士兵置办冬衣。^192 数额或许未达他们的期望，但勒保与德楞泰成功让皇帝撤销了\"不再为四川战役买单\"的决定。\n陕西战场\n那彦成闰月回京后，额勒登保迅速在湖北郧西击溃了杨开甲一股，迫其退回陕西。^193 那彦成不在身边，额勒登保自在了许多，回陕后取得了几场胜利，赢得三等子爵位——尽管大部分仗是杨遇春与杨芳两位汉族将领打的。杨遇春春天升任甘肃提督后，接管了那彦成的精锐部队，编成独立军团。^194 五月下旬，在秦岭深处，额勒登保的部队在毛坪击溃了杨开甲一股，杀死了杨开甲。^195\n这场胜利重新点燃了嘉庆年内结束战役的希望，以至于他提出调一千名黑龙江旗兵（1799年已动员）与五百名吉林兵来替换久役之师。他诉诸将领们的良心，提醒他们：战争早点结束，百姓就少受些苦；同时威胁说，完不成这个期限就严惩。^196\n但局势又出现了转折。戴家营与伍家营突破了栈道沿线的清军防线，前往甘肃。^197 张添伦与辛聪紧随其后。到六月中旬，陕西的大多数起事者都去了甘肃。为援助追击叛军入甘的陕西军队，嘉庆派直隶提督定柱——他曾率援军赴豫——率八百名直隶兵入甘。嘉庆还告诫陕西官员不可懈怠——因为甘肃给养匮乏，起事者很快就会返回——并让额勒登保留陕。然而，额勒登保去了甘肃，留下三万多名士兵守卫陕西要地。^198\n在甘肃秦州，戴家营与从四川返回、却已被甘川清军围困于岷州的高马股会合。由于对下一步去向发生争执，高二与马五分裂，带走了一部分人马。他的堂弟高天德——绰号\"高三\"（Gao San）——走上前台，与马五共同带队，队伍仍称高马股。与戴家营合兵后，高马股回到陕西，在略阳击溃清军，杀死数名军官——包括一位总兵——与两百多名士兵。^199 随后他们沿汉江东进，企图北渡。固原提督王文雄急忙赶到西乡，阻止他们渡江、逼近西乡县城。七月二十五日，王文雄率五千多名士兵与乡勇，攻打掘壕自守于西乡法宝山的起事者。激烈的战斗从清晨打到中午；王文雄阵亡，还有二十多名军官与数百名士兵乡勇战死。王文雄是这场战役中阵亡的最高级别绿营军官，嘉庆闻讯震惊，称高马股为所有叛军股团中最\"狡悍\"者。^200\n其他起事者也没有在甘肃久留。在秦州，伍家营与冉学胜、张世龙、张添伦会合，但因额勒登保、庆成与恒瑞的到来而未能渡过渭河。七月下旬在阶州附近遭受毁灭性打击后，起事者返回略阳，但伍金柱于八月初三日在山沟被杨遇春与格布舍杀死。伍金柱之侄伍怀志与数百名幸存者又一次短暂突入甘肃。数周后返回陕西时，他们分作两股。曾芝秀带走近一千人，其中数百人渡过汉江前往四川（大多数妇女儿童被抛弃）。伍怀志与另外数百人进入秦岭。^201\n到秋天，所有起事者都从甘肃返回了陕南。高马股与戴家营不断尝试渡江——有一次甚至骑牛而渡。^202 随后徐天德率其黑号从湖北到达安康，使他接近了高马股。九月二十一日，徐天德在神沟与王廷诏、马五、高三会面。想必他们讨论了下一步的去向。会面之后，高马股与徐天德一股都经太平前往湖北。他们很可能决定：鉴于在陕西获取给养困难重重，先去湖北，再去河南。在四川，曾芝秀与徐天德合并。而戴家营、张添伦、辛聪等留在四川，分散于太平、通江与南江。^203\n大部分残余叛军在陕南的聚集，本该是额勒登保围剿他们的机会。然而，他似乎没有这个打算。从甘肃返回后，额勒登保留驻城固，把作战交给部将——主要是穆克登布与杨遇春。直到徐天德威胁兴安府城，额勒登保才移驻紫阳。徐天德入川时，额勒登保没有遵嘉庆之命亲赴四川对付徐天德，只把两千名随高马股从四川到陕西的士兵乡勇遣回四川。留驻陕西的额勒登保，其随营部队——由扎克塔尔率领的一千人（扎克塔尔是金川孤儿，在宫中长大）——只进行了几次小规模战斗。与勒保一样，额勒登保定期上奏，报告各条战线。他借用勒保\"先清一股，再剿他股\"的口号，以\"先了结高马股，再肃清湖北，最后对付川陕边境的起事者\"的计划安慰皇帝。^204\n尽管对额勒登保日益不耐烦，嘉庆仍不断称赞他，说只有额勒登保可靠，并利用一切可能的机会赏他礼物。^205 九月二十三日，嘉庆罢免了台布——他1799年派赴战役的最后一位改革派领导人。台布早已失宠，但罢免的时机很可能是对额勒登保的警告。^206 最终，新年只剩两个月时，嘉庆失去了镇定。他告诉额勒登保：与其另任统帅，不如明年乾隆服丧期满后，他亲自率师出征。如果这真的发生——他威胁说——额勒登保将被当作首犯。^207\n在朝廷的催逼下，额勒登保及其部将十月下旬开赴湖北。一场持续数日的战斗之后，他的部队与湖北军队把徐天德与高马股都赶回了陕西。然而，额勒登保在鄂期间，十月二十五日，冉学胜率数百人在西乡白面峡北渡汉江。^208 随后，十一月十日夜，樊人杰、王士虎与冉天泗率领的约一千名冉天元残部——他们最近从四川渗入陕西——在石泉以西数里的茶镇涉水渡过了汉江。^209 十一月初八日听说第一次渡江，额勒登保立即决定自己渡江，并在第二次渡江后不久在安康渡了过去。他把全部近八千名部队带到了江北，包括新到的一千名吉林、黑龙江旗兵。^210\n额勒登保北上后，汉江以北有两万多名清军与乡勇（额勒登保到达前已有一万二千，包括两次渡江事件后的增援），对付的却只有两千来名叛军——包括伍怀志在秦岭的小股。汉江以南，徐天德与高马股被交给了未经战阵的将领庆溥与新任按察使文成惠。庆成与恒瑞忙于对付已移向安康与平利的苟文明、龙绍周。在与四川广元、南江接壤的边境上，长麟手忙脚乱地封锁并击退因大巴山缺粮而涌入陕西的一波叛军。长麟与庆成都抱怨兵力不足，但嘉庆认为不可能给他们任何援军。^211 与年初对他撤出四川的反应相似，嘉庆起初认可了额勒登保的渡江，但很快意识到这是个严重错误。十一月二十六日，在给陕西领导人的一道长谕中，嘉庆直言批评额勒登保故意远离更危险的敌人。他责令额勒登保：或迅速了结北面之敌，或把那里的战事交给杨遇春、立即南返。他斥责穆克登布等人：以一万多人的兵力，竟未能了结伍怀志与冉学胜两股——合计不过一千人——怀疑他们可能是有意拖延，因为不想完事之后又被派去打另一股。^212\n额勒登保本应清楚，汉江以南更加关键。然而，与勒保、德楞泰一样，额勒登保对嘉庆收紧钱袋也心怀不满。夏天之后，陕西获拨三百万两，但大部分还没到。^213 十月二十五日，嘉庆又给陕西五十万两。与在四川一样，嘉庆命长麟用一万两为额勒登保的部队置办新年冬衣，并让额勒登保派后勤官员监督此事，确保每个士兵都领到冬衣。嘉庆虽然指望这份恩典能鼓舞士气、激励他们迅速取得最后胜利，^214 额勒登保却不会满足——这笔钱远远不够。与他年初离开四川一样，他离开汉江以南，或许正是他表达失望乃至愤怒的方式。\n湖北战场\n1800年初徐天德与樊人杰率联军突入竹溪后，它沿武当山南麓谷地东移。徐天德把他的数千人编为\"东\"\"南\"\"西\"\"北\"四路，各设一名\"总兵\"（zongbing）统领。他们在湖北获得了大量马匹，许多战士都骑上了马。^215 在房县被倭什布挡住后，他们北转均州，企图渡汉江入豫。吴熊光立即加强北岸江防，并亲赴南阳督防，倭什布则大声求援。倭什布的无能令嘉庆恼怒，他罢免了倭什布，以湖南巡抚姜晟接任。直到二月初孙清元挫败了叛军的渡江企图，松了一口气的嘉庆才恢复了倭什布的职务。^216 被逼向南，起事者在当阳宋家垭的一处山口伏击，再次露出獠牙，使清军伤亡惨重。^217 然而，对下一步计划发生分歧后，樊人杰离开徐天德，前往远安与兴山；徐天德则返回武当山，再次逼近汉江。^218\n二月初，明亮到达湖北。既无职衔又无俸禄，明亮借口为自己组建一支军队，在襄阳城盘桓了近两个月。明亮渴望旗兵——尤其是额勒登保麾下的——嘉庆却只给了他数千名绿营兵（包括宜昌镇总兵王凯率领的一千名），并指示他多雇乡勇。^219 担心叛军可能扮成难民混入河南——徐天德的到来已驱使许多人逃亡——吴熊光把明亮久留襄阳之事奏报了朝廷。^220 然而，松筠举荐明亮主持湖北战场，理由是他的经验、才能与在湖北的好名声。于是，嘉庆给了明亮两个卑微的职衔，并允许他在万不得已时动用两千名广西兵。^221 明亮迅速把徐天德逐离汉江，由此升为三品侍卫。但他并不满意，不断抱怨兵力不足、请求增援。^222 直到初夏明亮在南漳南部吃了一场败仗——被徐天德的人马伏击，损失众多士兵军官，包括王凯——嘉庆才批准\n他请求从额勒登保处调数百名旗军骑兵。同时，嘉庆任命明亮填补王凯的宜昌镇总兵空缺，并指示他：湖北肃清叛军后前往陕西。^223\n然而，心怀不满的明亮不愿去陕西向额勒登保报到。盛夏来临，他与孙清元在荆门州城附近击溃徐天德后，暂停行动约一个月。但他继续抱怨兵力不够大。^224 趁明亮休整之机，徐天德一股回到武当山区，击溃了均州的五百名清军，杀死了其首领、副将佛宁。随后，六月中旬，徐天德渡过黄龙滩（堵河）——汉江的支流——突入陕西旬阳。借口阴雨连绵，明亮在江边停留了数日。直到两周后徐天德返回湖北，明亮才行动。明亮骑马高速向东追击徐天德，把新到的两千名广西绿营兵甩在后面——他们因腿痛或中暑而行动困难。七月二十二日，明亮在南漳重创徐天德，声称杀敌千余。嘉庆为这场胜利高兴，同意把正赴前线的四百五十名吉林、黑龙江旗兵拨给明亮，并承诺明亮可以留鄂。^225 然而，远安又一场战斗之后——战斗中徐天德的侄儿（徐天德无子，侄儿是可能的继承人）被杀——明亮又松懈下来。无人管束，徐天德一股涉水渡过南沙河与黄龙滩，八月中旬再次侵入陕西。明亮直到两周后才在旬阳追上这股叛军，但只打了一仗就返回湖北。^226 明亮论证说：河水高涨使他无法在陕西继续前进，而湖北又有新的紧急事态——几股叛军合计一万人从四川到了湖北。^227\n明亮过早撤出陕西令嘉庆震怒。他把明亮五个月未能消灭徐天德一股，比作那彦成在甘肃对高马股未竟全功，严厉申斥明亮，骂他\"奸诈\"\"欺饰\"\"取巧\"。他虽让明亮留驻原地对付四川来的叛军，却想让额勒登保或庆成去湖北主持战役、节制明亮。尽管怀疑湖北局势的严重性，嘉庆还是把新调的满洲旗兵从陕西改派湖北。^228\n正如嘉庆所料，明亮夸大了危险。苟文明只有一千人——包括被裹挟的平民。^229 另外四股是冉天元联盟的残部，合计数千人，其中能战者只有一千左右，有数百匹马骡。樊人杰与徐万富率领黄号与数百名线号残部。蓝号由冉天泗与王士虎率领，白号大概由张子聪的一个亲属率领。初秋，他们从大宁移到长江北岸，从巫山进入湖北，在那里击败了总兵德英额率领的清军。联军到达南漳时，一千多名满洲旗兵刚抵襄阳的消息迫使他们折回远安。九月初二日，在县城附近的一场战斗中，他们杀死了从四川一路追击而来的李绍祖。但倭什布及时赶到，把叛军逐出远安，逼向武当山区。^230\n明亮虽然以那些四川叛军为借口提前从陕西返回湖北，却直到九月中旬才到达战场——距他上次在旬阳对徐天德的战斗已两周多。九月二十一日，明亮在房县上龛击溃了叛军联盟，但叛军夜袭其营盘时，他损失了数名军官。^231 战后，联盟残部慌乱地逃向大宁，抛弃了妇女、儿童与老人，却抬着负伤的战士。明亮无视嘉庆命他入川了结那些残部的命令，停在湖北边境的丰溪，只派小队前往大宁。^232 显然，他想待在勒保的辖区之外。嘉庆对明亮迟迟不抵战场本就不快，听说上龛之捷才稍为宽心；自明亮到鄂以来，皇帝第一次赏了他些礼物——一次宗教仪式剩下的糕饼与一些奶酪制品。但明亮拒绝追剿叛军入川，成了最后一根稻草。嘉庆甚至提到死刑（只因为明亮年资深，才免于死刑），褫夺了明亮宜昌镇总兵之衔，并剥夺了他上奏之权。嘉庆让长龄接替此职——长龄是蒙古贵族、惠龄之弟，曾护送满洲旗兵入鄂。^233\n然而，嘉庆似乎对长龄没有信心；他一再命长龄把带到湖北的一千零五十名旗兵交给额勒登保。^234 四十二岁的长龄，履历上是文武历练兼有，却从未有过在战场上出人头地的机会。^235 急于证明自己，长龄在十月份上半月先旬阳、后竹溪，与高马股连续作战。凭借火器与快速运动，长龄的人马在所有这些战斗中压倒了高马股，大大削减了它的规模。^236 长龄令人印象深刻的亮相改变了嘉庆对他的看法。嘉庆对长龄及其部队大加赏赐称赞，撤销了先前的决定，允许长龄保留那些旗兵，并责成他歼灭高马股。^237\n然而，十月下旬额勒登保从陕鄂边境追击徐天德与高马股到湖北时，请求调长龄的旗兵——推翻了此前\"不需要任何援军\"的立场。嘉庆同意了。额勒登保与长龄、明亮会合，击垮徐天德与高马股、把他们逼回平利之后，额勒登保从长龄那里带走了那一千名旗兵。^238 失去精锐部队实际上宣判了这位未来的新贵；长龄随后率其最后的三百名旗兵，与明亮合兵。^239 由于明亮驱逐徐天德与高马股出鄂之功、湖北同僚的防守——额勒登保还奏报明亮悔过、愿意改进——嘉庆的怒气平息了，他允许明亮留鄂，但仍不给他上奏之权。^240\n此时，湖北剩下的叛军只有高二率领的数百人。十月下旬从平利进入竹溪，高二很可能想与高马股重新合并。队伍里没有妇女儿童，他们行动极快。被明亮与倭什布逼回陕西后，他们立即重入竹溪，十一月下旬成功到达房县——这使湖北全部军队都被吸引到房县，阻止他们继续东进。^241 额勒登保在陕南汉江以北，嘉庆决定再次改组湖北领导层。1800年结束前数周，他任命书麟接替姜晟任湖广总督。^242 年近七十的书麟仍然可靠，指望他坐镇湖北战场、管住反复无常的明亮。^243\n作为统帅的嘉庆\n到1800年底，嘉庆皇帝已统治近两年。对许多人而言，他对和珅惊人的一击给人留下的印象是：他的统治将是一个变革的时代。他削减了一些昂贵的宫廷工程。他呼吁更清廉的官场。他对贫困的蔓延表示关切。他考虑帮助旗人摆脱经济困境的办法，同时试图重振明显衰败的贵族。^244 至于镇压战役，嘉庆曾试图让脱轨的战役重回正轨。以勤勉的列祖列宗为楷模，嘉庆长时间批阅前线奏折、写批语、颁谕旨，有时一天颁发数道长谕。三月二十九日，得知叛军在川西渡过涪江后，他花了一整天处理危机，又继续处理其他事务直到将近午夜，不让任何军机大臣回家。^245 整个白莲教战争期间，他写了几十首诗，配以大量注释，详记每一次行动、收获与挫折。^246 嘉庆对战争诸多方面的了解相当充分。他常常用自己渠道获得的情报来交叉核实奏报的信息——一些省级官员（如吴熊光）与特使（如周兴岱）充当他的耳目，向他密报前线同侪的情况。^247\n然而，嘉庆很快就暴露出他缺乏贯彻自己议程所需的坚毅。他频频对战事发表意见，却反复无常、容易动摇，常常随意改变立场。有时，他发出不明智的指示。1799年初，他命战役领导人们追击叛军时不得越过本省边界，否则本省会陷入空虚。^248 尽管他意在让各人对自己辖区负责，这道谕旨却不啻给将领们开了绿灯：把叛军逐出本省即可，不必消灭。即使他知道遥控指挥军事行动可能适得其反，他仍不断向将领们发出具体指示。^249 最关键的是，嘉庆不停地设定、修改、再设定结束战役的期限，以至于他的期限不再有任何权威，没有人害怕违期。\n嘉庆虽然对战争中的人事管理极为用心——他主动任免关键领导人，导致许多职位的高周转率——却很少长期信任任何人。他把松筠、那彦成、魁伦、广兴、托津等新领导人派往前线后不久，就开始对他们形成负面看法。结果，他们谁也没有得到足够的余地与时间去建功立业，就被皇帝无休无止的频繁批评压垮，最终被罢免或调离。诚然，就那彦成对张汉潮及其最后人马徒劳的追剿、明亮故意的拖延而言，嘉庆或许是对的。然而，他对将领们动辄怀疑、过分挑剔的倾向，弊大于利。嘉庆对明亮的不信任——承袭自乾隆——在明亮的消极与拖延战术中起了关键作用。嘉陵江之败压垮了嘉庆，他在川西局势明朗之前就过快地恢复了勒保的职务。他选择魁伦来开创严惩的先例，说得轻些，也是用错了人——他明知额勒登保与德楞泰对这场溃败负有直接责任。勒保复出后，旧班底重掌领导权，标志着他短暂的前线改革告终。此后，唯恐被人指责对战役最高领导人的处置反复无常，嘉庆一直不敢对旧班底采取强硬行动——尽管他知道勒保在王三槐被擒一事上欺骗了朝廷，隐瞒了王三槐实为投降的真相。^250\n在关于白莲教战争的有限学术成果中，似乎存在一种共识：嘉庆对起事者与教门运动的招抚政策对瓦解叛乱至关重要。然而，这项政策很少得到实施，嘉庆对它也摇摆不定。亲掌战役之初，嘉庆热情呼吁受蒙蔽、被裹挟的叛军投降，并许诺赦免他们。然而，整个1799年，前线将领们只对这项政策虚与委蛇，继续滥杀俘虏。1800年初，嘉庆重提这项政策并大幅升级，声明他计划赦免甚至那些与官军作过战的人，更令人惊讶的是，他将容忍教门社团——只要他们奉公守法。然而，此后不久，叛军渡过嘉陵江，在四川战场引发雪崩效应。惊慌失措的嘉庆立即中止了这项政策。他指示周兴岱不要在川陕两省张贴分发这项新政策的谕旨（宣示这项政策本是周兴岱此行的另一项任务）。^251 随后，嘉庆对福宁——他因1796年屠杀投降叛军而受到调查——改变了主意。嘉庆迅速把福宁流放伊犁，但仅仅几个月后又恢复了他，任命他为驻藏帮办大臣。^252 自此，这桩曾在嘉庆心理战话语中占有重要位置的事件，在官方文书中再未被提起。尽管嘉庆坚持\"叛军中被裹挟的平民不应受到伤害\"的立场，^253 他从招抚政策上的退却，却开启了川西对俘虏的普遍暴行——每场大战后屠杀数百名俘虏是家常便饭——而这没有引起嘉庆的皱眉。结果，叛军死战到底的意志被强化了；几乎没有叛军投降，1800年秋四川的几次投降尝试也流产了。\n直到1800年底、三个战场的起事者大多被压制之后，嘉庆才再次呼吁教门起事者悔过投降。为凸显自己宽恕意愿的可信度，嘉庆利用张小元——安徽阜阳的教门师父、王廷诏的亲戚——搞了一场小型宣传。1796年，张小元与其阜阳同教没有起而反清，而是选择了观望——尽管王廷诏与王三槐都曾派信使催促他行动。1800年春，张小元的父亲派张小元与另外三名教众前往喀什噶尔，探望流放中的王法僧。张小元一行到达甘肃时，张小元与同伴分手，前往秦州加入了从四川返回甘肃的高马股。然而，仅仅数月后，张小元就离开了叛军，于九月向额勒登保投降。据他说，叛军残忍的烧杀令他厌恶。劝说王廷诏投降失败后，他设法从叛军中逃了出来。^254 尽管张小元的故事可疑，嘉庆选择了相信。十一月初十日，嘉庆命把张小元护送回阜阳，交给其父——他也赦免了其父派子前往喀什噶尔探望罪犯之罪。^255 仿效祖父雍正利用反满学者曾静来彰显皇恩浩荡、贬斥汉人士大夫民族主义的手法，嘉庆利用张小元来展示自己愿意在赦免与容忍教门中人上走多远。^256\n释放张小元前后，怀疑战区领导人招降工作不力，嘉庆颁发了一连串谕旨，重申他的恩威并施之策。他特别敦促领导人们重视安置脱叛之人——他听说有些人回乡后生计无着，又重新加入了叛乱。他责成省级官员挑选可靠的道府官员随军行动，就地安置被俘或投降者。但他坚持：叛军首领绝不宽赦，必须或杀或擒。^257 然而，此后数月，当胜利在望时，嘉庆将再次把宽大政策抛到一边，恢复杀叛军。因此，他的招抚政策在整个战役期间大体停留在言辞层面。战争最终结束后，《剿平三省邪匪方略》的编纂者们挠着头，仍设法为皇帝的前后不一找到了理由：\n\n自剿办邪匪以来，皇上恫念愚顽，屡申剿抚兼施之谕。继而贼众不知悔罪，投诚者少，皇上又改而主剿。[其故在于]贼匪非经痛剿穷蹙，不肯回心乞命。此即\"义以服人\"（yiyifuren）之道。^258\n[译者按：方略原文自英文直译，文言原文待核，见注释258。]\n\n在关于嘉庆皇帝的少数研究中，他亲政后号召建言批评——用他自己的话说，\"广开言路\"（guangkaiyanlu）——被誉为开明统治的证据。^259 然而，这项开明之举没有走远。正月初五日——乾隆驾崩两天后——嘉庆颁发谕旨，邀请官员——更确切地说，御史——秘密上书揭露官场积弊。^260 响应皇帝的号召，包括广兴在内的数名御史与官员站出来弹劾和珅，这为嘉庆扳倒他提供了借口。此举虽然主要针对和珅，官场内外的许多人却借此机会就广泛的事务向朝廷进言。批评与意见的喷涌很快令嘉庆厌烦，他不止一次抱怨其质量参差不齐。随后1799年秋发生了洪亮吉事件——这位直言而古怪的学者撰写并传抄了一封长信，尖锐批评嘉庆纵容和珅门生与白莲教战争渎职领导人，由此被捕、流放新疆。\n1800年夏，赐魁伦自尽数日后，嘉庆决定赦免洪亮吉出流放地。他说，他担心对洪亮吉的惩处吓住了人们，使大家不敢进言——因为洪亮吉被捕后，他收到的奏折书信少了。此外，嘉庆命把洪亮吉的信在官场传阅，因为他认为信中有些论点值得重视。^261 在新疆只待了几个月，洪亮吉就回了家。直到1809年去世，洪亮吉一直温顺，对皇帝感恩戴德，尽管他仍关心公共事务。^262 与此同时，嘉庆想必心满意足：他最终以处死白莲教战争中一名高级官员，回应了洪亮吉的批评。\n然而，赦免洪亮吉并不意味着重开言路。释放洪亮吉约一个月前，五月二十六日——他褫夺那彦成几乎全部职衔的那天——嘉庆宣布：他已把完成战役的重任托付给前线的三位领导人——额勒登保、德楞泰与明亮。他进一步裁定：\"内外官员，除军机大臣外，俱不得以妄议军务、传播谣言、滋生事端\"，并承诺严惩违令者。^263（原文待核）几天后，他在告知三位将领对那彦成决定的谕旨中重申了这一裁定。\n他说，他所收到的许多意见与建议毫无价值，只会给他把握前线事态添乱；他告诉三位将领：从此以后，关于战役，他只听取他们的奏报，所以他们不得谎报任何信息。^264 这道实际上在官场与社会上禁止讨论战役的命令，正式结束了乾隆驾崩后那段短暂的\"广开言路\"时期。\n1799年底，嘉庆烦躁地否定了用\"改革\"一词来描述他的统治：\"朕以皇考之心为心，以皇考之政为政。遵循皇考所定一切章程，唯恐不能仰承其意。何尝有'维新'（weixin）之举？\"嘉庆这话有多少真诚，值得商榷，^265 但它至少让人窥见他当时的心境：遇到障碍与反弹之后，他意识到改革之难。在前线，他严厉的行动未能带来预期的效果。他对将领们反复的严斥与警告几乎不起作用。大约就在嘉庆说出上面这番话时，周兴岱请他以严厉的口吻对待战争领导层。嘉庆沮丧地回答说，他已经这样做了，次数之多，以至于\"唇焦舌敝\"（原文待核，见注释266）。^266 诚然，制度性障碍与受改革影响的利益集团的集体抵制，被证明是巨大的、乃至压倒性的。然而，嘉庆优柔寡断的性情——具体而言，他自相矛盾的倾向——也是他未能让脱轨战役重回正轨的一个因素。1800年上演的改革逆转，发出了一个明确的信号：他的政府既没有承诺、也没有能力实施它所宣布的一切。战争领导层因这个信号而胆壮权大。尽管嘉庆反复强调他\"1800年秋至冬之间结束战役\"的新期限，这个时间表不会实现。叛乱或许已经死了，但战争还在继续，而且还要持续多久，无法确定。\n注释\n[译者按：文献简称同前各章。]\n题辞：JQSYD, 4:501.\n\n既有研究认为，嘉庆皇帝扭转了局势，其新政策被证明行之有效。参见，例如，铃木中正《清朝中期史》（Shinchō chūkishi），180–211。\n年初车森保押解被俘的高均德进京时，告诉嘉庆：起事者已极度疲惫，缺乏必需品与作战能力，只能凭借地形苦苦求生。XFFL, 136/38b–40a. 托津同年晚些时候从四川回京时，向嘉庆报告了类似的情况。XFFL, 139/35a–b.\nXFFL, 136/31b–33a, 136/38b–40a, 137/1a–3a, 137/20b–25b, 139/32a–35a, 140/9a–10a, 140/23b–24b.\n王登廷独自一人时在南江被乡勇抓获。王登廷可能是叛军派出来联络其他股团的。XFFL, 137/25b–30b.\nJQSYD, 4:501–3. 提出此议的官员是蒙古旗人、国子监祭酒法式善。\nXFFL, 140/23b–26b.\n高均德与高成杰1799年底在北京受审时说：叛军对清朝的招抚政策持怀疑态度，因怕被杀而不敢投降。BLJZL, 5:87–88.\n1799年底魁伦以涉嫌侵吞军费逮捕福宁时，指控福宁屠杀投降起事者。XFFL, 137/8b–11b, 137/32a–35b.\nXFFL, 141/32b–33b, 143/29b–30b.\nXFFL, 142/32b–34a, 144/22a–24b, 146/17b–20a.\nXFFL, 120/16a–17a.\nXFFL, 138/16b–18a.\nQSLJQ, 56/21b–22b.\n然而，在另一道奏折中，额勒登保对战役作了乐观的描述。XFFL, 140/4a–7a.\n交锋中数名清军军官被杀。XFFL, 139/6a–11a, 140/27a–29b, 141/17b–24a.\n渔关渡江之前，叛军曾试图在略阳县城附近渡过嘉陵江，被乡勇挫败。渔关由道员常亨率一千二百名士兵把守。近在咫尺的吉兰泰及其一千名士兵没有驰援。GZDJQ, 4710; XFFL, 142/26a–27b, 143/5a–9a, 143/26b–28b, 155/7b–8b.\n松筠请那彦成拨一半兵力给他。王文雄从西乡急赴勉县。王文雄离开汉江后，陕南的叛军多次试图渡江，都没有成功。GZDJQ, 4710; XFFL, 139/6a–11a, 140/27a–29b, 141/17b–24a.\nQSLJQ, 57/4a–b; XFFL, 141/26a–28a.\nXFFL, 139/13b–14a, 141/28b–29b.\nXFFL, 140/32b–35b.\nXFFL, 139/15a–18b, 141/3a–6b, 141/9b–12b, 141/17a–b; QSLJQ, 57/3a–4a.\n魁伦与额勒登保都没有提过他们的冲突，但广兴奏报了此事。XFFL, 153/31a–33b.\nGZDJQ, 4714, 4715; XFFL, 144/3a–12b.\nXFFL, 139/18b–19b.\nXFFL, 143/1a–4a.\nXFFL, 142/26a–27b, 143/4a–9a, 144/14a–b.\nXFFL, 148/2a–3b, 148/15a–20b.\nXFFL, 140/12b–16a, 143/12b–19b, 145/4a–10a.\n明亮获授低微的\"金顶蓝翎\"之衔，但没有俸禄。XFFL, 143/31a–32b.\nXFFL, 144/1a–3a, 146/1a–3b.\nXFFL, 146/3b–7a, 146/9a–13b.\n额勒登保为七十五辩护，说七十五曾与在川陕之间穿梭的辛聪小股作战。XFFL, 138/18a–19a, 140/2b–3a.\nXFFL, 145/15a–b.\nXFFL, 156/41b–44a.\nXFFL, 140/1a–2b, 140/4a–5a.\n冉天元供词，BLJZL, 5:90; 王英供词，第91页; 张子聪供词，第109–10页。XFFL, 140/1b–2a, 160/29a–b.\nXFFL, 144/15b–16b, 146/36a–37a, 147/16a–17a.\n魁伦认为起事者已近强弩之末，而前线整顿已见成效：将领们不再谎报战功，战争财政的许多漏洞已被堵上。XFFL, 139/19a–23a, 143/19b–22b. 直到他从达州出发与叛军交战时，他才报告自己遇到的困难。XFFL, 144/30b–32b.\n除夕，额勒登保请求增派几名书吏，广兴拒绝了；魁伦则捐出\"养廉银\"，给每名新增书吏每月四两。嘉庆称赞广兴严格，但指示动用军费支付额勒登保新增书吏的工钱——因为魁伦并不宽裕。XFFL, 138/14a–18a.\nXFFL, 143/22b–26b.\nXFFL, 139/19a–22b, 143/19b–22b, 144/24b–26a.\nXFFL, 139/35a–37b, 143/19b–22b, 143/24a–25b. 1799年夏，嘉庆曾警告叛军可能渡江袭击富庶的川西。他曾指示勒保派正规军守御嘉陵江所有渡口。XFFL, 102/21b–22b. 勒保无视了他的指示。\nXFFL, 138/17a, 141/31b–34a.\nXFFL, 142/20b, 143/11a–12b; QSLJQ, 60/12a–13b. 有人弹劾广兴的仆人在广兴第一次入川时向地方官员勒索钱财。吏部虽提议罢免广兴，嘉庆仍让他留任——因为不是广兴本人所为。JQSYD, 4:289–90. 但嘉庆罢免广兴时援引了此事。\nGZDJQ, 19739; XFFL, 142/1a–4b, 146/34b–35a, 152/16a–17a.\nXFFL, 144/15b–16b, 146/25a–b, 146/36a–37a, 147/16a–17a.\n清朝记载没有说明联军在何处渡过渠江。冉天元只提到他们在\"新宁与大竹\"渡江。冉天元供词，BLJZL, 5:90.\n重庆知府石韫玉动员了全部兵力——两千名士兵与一千五百名乡勇——并把所有船只停靠到南岸。江北岸，三百名士兵掘壕据守有城墙的江北厅城；起事者没有试图夺取该城。石韫玉《独学庐五稿》（Shi, Duxuelu wugao），1/23a–24b。\n冉天元供词，BLJZL, 5:90; 王英供词，第91页; 张子聪供词，第110页。XFFL, 152/16a–17a; 177/12a–14a. 定远知县孙熙元与下级军官米广被罢免受罚。XFFL, 152/16a–19b, 160/7b–9a, 160/11b–12b; KJJFSB, 5/1a–b.\n魁伦指示龙安府地方官加强戒备，命驻夔州的穆克登阿赶赴龙安，主持嘉陵江防务。XFFL, 142/7b–8b, 145/17b, 146/20b–27a, 146/38a–39a.\nXFFL, 147/1a–5a.\n嘉庆没有摘去魁伦的顶戴，因为他希望魁伦在这紧要关头能维持权威。XFFL, 147/5b–10b.\nXFFL, 147/13a–b, 147/22a–24a.\n勒保奉命先赴甘肃，与额勒登保会面后再入川。JQQJZ, 5:45–46; QSLJQ, 59/1b–3a.\n但嘉庆要广兴如实奏报他裁减乡勇的情况。XFFL, 145/10b–17a, 145/17a–18a.\nXFFL, 146/35b–37a, 147/29b–34b, 148/21b–25a, 149/25a–34b.\nKJJFSB, 5/1a–2a.\nXFFL, 149/18b–21b.\nXFFL, 150/11a–15b.\n王英供词，BLJZL, 5:92; XFFL, 153/31a–33b, 159/12a.\nXFFL, 152/10b–15b, 153/1a–3b.\n叛军渡嘉陵江一个月后，七十五到达顺庆。但他停在那里，只派李绍祖率四千三百名士兵乡勇向魁伦报到。XFFL, 153/4a–5a, 155/24a–32a, 156/28b–33b.\n《大清历朝实录》雍正朝，108/28b–31b. 又见濮德培（Perdue）China Marches West, 253–54。\nXFFL, 150/15b–22a.\n一位在京的四川籍学者提醒嘉庆：叛军渡嘉陵江后，被两江所困，处境危险。嘉庆责备魁伦既未奏报、也未应对，命勒保直接入川消灭两江之间的叛军，而不必去甘肃与额勒登保会面。QSLJQ, 60/9b–11a; XFFL, 151/18a–b, 152/26a–27a, 153/19b–22b, 153/35a–36b, 154/11a–12a.\nJQQJZ, 5:92–95; QSLJQ, 60/15b–19b.\nXFFL, 104/21b, 109/3b–7a.\n嘉庆认为，乾隆之所以把松筠留在西藏多年，或许就是因为松筠书生气、拘泥固执。XFFL, 132/28a–29a, JQQJZ, 5:275. 松筠奏折的原件似已不存。\n那彦成到任后，又向皇帝奏报了松筠\"处置失当\"的一个例子：松筠命恒瑞留陕协助攻打张汉潮，致使甘肃的叛军未能了结。XFFL, 129/19a–20a, 129/25a–27a, 131/13a–b, 131/21a–23a, 132/11a–12b.\n那些衔职是太子少保与侍卫。XFFL, 132/28a–30b.\nXFFL, 136/5b–6a. 嘉庆曾说：\"那彦成与松筠似乎都无才无运，不能承受我的恩宠。\"XFFL, 138/7b–12a.\n松筠，嘉庆五年正月初八日，GZDJQ, 4708.\n但由于甘肃与陕南的危机，松筠奉命暂时留陕。GZDJQ, 5077; QSLJQ, 57/4b–5a; XFFL, 144/20b–21a, 148/2a–3b, 148/5a–6b, 149/5a–9a, 153/26a–b. 嘉庆五年正月十八日，嘉庆罢免了倭什布的湖广总督之职，以1791年以来的湖南巡抚姜晟接任，但姜晟留驻武昌处理地方事务。因此，松筠留在湖北战场，与明亮共同主持战役。JQQJZ, 5:22–23.\n年近六十的弘丰很快被送回荆州。GZDJQ, 5164; XFFL, 150/4b–10a, 151/19b–23a, 153/11a–b, 155/40b–42b, 156/21b–22b.\nXFFL, 162/3b–4b, 162/5b–8b; QSLJQ, 62/25a–b.\nQSLJQ, 65/16b–20a; JQQJZ, 5:275–77.\n松筠1802年再次被任命为伊犁将军，1809年离开新疆。\nXFFL, 147/34b–35a.\nXFFL, 154/14b–16b.\n嘉庆五年二月十一日，德楞泰在徽县接到额勒登保与魁伦关于嘉陵江渡江的信。他次日动身赴川。GZDJQ, 5094.\nGZDJQ, 5185; XFFL, 157/8b–18a, 157/20b–22b. 嘉庆把此当作胜利，犒赏了全体军机大臣、军机处与兵部章京，以及北京与前线之间的驿传人员。XFFL, 157/21b–22b.\nGZDJQ, 5301.\n嘉庆命在朱射斗灵位前处决冉天元。XFFL, 159/1a–11b, 159/6b–7b.\nGZDJQ, 5351.\n马蹄岗之战后，德楞泰把俘虏全部剐杀（luange）。石门寨之战后，他把十八名叛军首领凌迟处死，处决了五百六十一名俘虏——嘉庆在德楞泰的奏折上批了\"是\"字。XFFL, 159/9a–11a, 161/1a–6a; GZDJQ, 5351.\nXFFL, 156/45b–48b, 157/8b–18a, 157/20b–22b, 161/6a–11a; JQQJZ, 5:130, 155; QSLJQ, 61/19a.\nXFFL, 161/1a–6a.\n勒保在嘉庆五年三月十三日的奏折中提及将与德楞泰会面。GZDJQ, 5348.\n勒保收揽了石进与张良槐——曾在贵州他麾下任职的两位汉族军官——及其四千名贵州兵。勒保还得到了上年秋天救过永保性命的马朝瑞。GZDJQ, 5348; XFFL, 154/32b–37a, 156/8b–14b, 160/28b–31a.\nQSLJQ, 62/4a–5b; XFFL, 160/31a–35b.\nXFFL, 152/22a–25b, 153/19b–22b.\nXFFL, 160/1a–7a, 160/23b–28b, 161/19b–22a. 叛军渡嘉陵江后，一千名旗兵与绿营兵已从成都调往太和镇，但他们似乎没有到达。XFFL, 148/22a–23b, 148/24b–27a, 148/32b–34b.\n王英供词，BLJZL, 5:92; 张子聪供词，第110页。\nXFFL, 161/19b–23b, 163/9b–17b, 165/7a–10b, 177/14a–17a.\nGZDJQ, 5392; XFFL, 161/22a–23b.\n除从金川地区调来的六百名土兵外，魁伦还向成都增派了援军。为打消起事者入成都的念头，嘉庆下令迅速处决冉天元。XFFL, 164/9a–15b, 166/39a–41b.\nXFFL, 163/9b–17b.\n叛军逼近剑州时杀死了剑州知州。XFFL, 164/26a–30a, 166/39a–41b.\nXFFL, 165/1a–7a.\nXFFL, 165/14a–17b, 167/1a–7b; 张子聪供词，BLJZL, 5:110.\n嘉庆免除了勒保对四川溃败的一切责任，包括他1799年夏裁减嘉陵江沿岸乡勇。XFFL, 161/24b–34b.\n勒保请求之前，嘉庆已命周兴岱调查朱射斗之死。GZDJQ, 5035, 5397; XFFL, 167/7b–9b, 167/13a–b.\n魁伦承认自己\"无能\"，但仍为两江防务辩护，强调他不应对裁减嘉陵江沿岸乡勇负责。XFFL, 168/1a–6a, 170/4a–7a. 绵州知州刘印全后来对魁伦的部分指控提出异议，说\"他曾向魁伦请兵\"的说法不实。但勒保补充说：涪江东岸数万平民逃向金山驿时，魁伦只放一条船摆渡，还逐一盘问。XFFL, 177/12a–17a, 184/30b–33b, 184/35b–36b.\n嘉庆担心在成都处决魁伦会使叛军轻视清朝官员——因为冉天元与陈得俸最近刚在成都被处决。JQQJZ, 5:238–40, 242–43; QSLJQ, 62/4a–5b, 62/22b–24b, 63/2b–5a, 64/22a–25b; XFFL, 170/8a–16a.\nJQQJZ, 5:420–23; QSLJQ, 70/14b–19a. 关于缅甸战役中的杨应琚，见戴（Dai）\"Disguised Defeat,\" 157–58。\nJQSYD, 5:337–38; QSLJQ, 71/4b–6b.\nQSLJQ, 62/22b–24b, 70/19a–b; XFFL, 161/24b–33a; XFFL, 163/23a–26a, 164/35a–37b, 165/10b–12a, 187/24a–25a.\n直到1799年初魁伦从福建回京，嘉庆才第一次见到他。QSLJQ, 64/22a–b.\nXFFL, 187/25a–27b. 叛军全部离开川西后，嘉庆设了新期限：闰四月内结束战争。QSLJQ, 64/11a–b; XFFL, 167/9b–11a.\n额勒登保辩称他给魁伦留下了足够的兵力，暗示责任在魁伦无能。XFFL, 147/10b–12b, 147/15b–22a, 150/17b–20b, 151/14b–16b, 152/2b–6a, 152/7a–9a, 153/31a–33b, 156/40a, 156/41b–45b, 170/4a–7a; QSLJQ, 61/18a–19a.\nQSLJQ, 63/7b; XFFL, 163/19b–23a, 164/34a–35a, 165/20b–23b. 为川西平靖，嘉庆只给德楞泰之子升了职，赏新到的六千名贵州兵一个月饷银，并赏其统领石进。QSLJQ, 64/11a–b; XFFL, 167/9b–11a.\n来华的朝鲜人柳得恭提到，他遇到的许多人对魁伦心怀怨恨。柳得恭《燕台再游录》（Yu, Yantai zaiyoulu），19b。\n许敬《雅歌堂文集》（Xu Jing, Yagetang wenji），22/2–3。\n本节部分内容取材于戴（Dai）\"Broken Passage\"。\nXFFL, 卷138–40 各处, 142/18a–26a, 144/12b–13b, 146/29a–31b; GZDJQ, 4736.\nXFFL, 144/18a–20a, 145/18a–20b.\n龙山镇之战前，叛军正忙于劫掠裹挟当地居民，这使那彦成轻松取胜——他声称杀俘数千人，缴获三千多头骡马牛羊，自己的部队只有两三人轻伤。战后，那彦成第一次奏请升赏三十五名军官。GZDJQ, 4859, 4972; XFFL, 147/35a–40a, 151/1a–7b, 152/6b–7a.\n他从达州到褒城用了两周。随后在甘肃陇州停留数日。嘉庆派额勒登保的侄儿与一名御医赴甘照料额勒登保，并赏他一些人参。XFFL, 148/1a–b, 148/9b–15a, 152/2b–6a, 152/7a–9a.\n引文见GZDJQ, 19773. XFFL, 138/7b–12a, 139/13b–14a, 140/8b, 142/28b.\n嘉庆没有给那彦成颁发新的参赞大臣印信，让他继续使用钦差大臣印信。GZDJQ, 5023; XFFL, 147/38b–39a, 147/48b–49b, 152/1a–2b, 152/7a–9a.\nXFFL, 149/9b–13a, 152/1a–2b, 154/1a–3b, 155/1a–7b, 157/1a–6a, 159/13a–14b.\nXFFL, 160/12b–15b.\nXFFL, 144/18a–20a.\nXFFL, 142/18a–20a, 157/6a–8b, 157/18a–20b.\nXFFL, 卷152–54 各处, 158/1a–2b, 164/1a–4a.\nXFFL, 154/46a–48a, 卷155–56、158 各处, 160/20a–23b, 162/8b–11b, 166/1a–5b.\nXFFL, 156/40a–41b, 158/17a–20b, 160/12b–17a, 161/11a–14b.\nXFFL, 163/1a–9b, 163/28a–30a.\nXFFL, 164/15b–19b.\nXFFL, 161/14b–19a, 161/31a–34b, 162/16b–22a, 163/30b–32b, 164/4b–6a, 164/21b–24a, 165/30a–33b, 165/13b–16b, 165/28b–29a, 166/5b–12b.\nGZDJQ, 5376, 5454; XFFL, 164/15b–19b, 167/24a–29b.\n派往陕西的六千名士兵中，两千名来自甘肃，两千名来自山西，两千名是从四川调的贵州兵。派往河南的两千名士兵中，一千名来自直隶，一千名来自山东。嘉庆派曾在河南任职的江南提督定柱统领这两千人。XFFL, 167/29b–34b, 168/6a–10b.\nGZDJQ, 5261, 5345, 5415; XFFL, 150/25b–27b, 150/30a–31b.\nXFFL, 165/20b–23b, 168/16b–18b.\n又从山西向河南派了一千名士兵，同时命直隶与山西保持数千士兵的动员状态。XFFL, 168/18b–27b, 168/30b–32b, 171/15b–26b.\nXFFL, 169/1a–9a, 169/18b–23a, 170/22b–27b. 松了一口气的嘉庆发还了陕西领导人们的翎羽顶戴，并厚赏额勒登保及其部下。杨遇春获授\"云骑尉\"（yunqiwei）世职，杨芳获巴图鲁名号。XFFL, 171/1a–9a, 171/13b–15b, 172/1a–9b, 173/18a–20b.\nXFFL, 176/10b–15b.\nXFFL, 173/22b–29b.\nXFFL, 173/30b–31a.\nXFFL, 165/1a–7a, 165/13b–16b, 165/30a–33b, 166/5b–12b, 166/40a–41a, 167/11a–b, 167/13b–15a, 170/25a–26b; JQQJZ, 5:222.\n被褫夺的职衔包括军机大臣、南书房行走与内务府各职。留给他的三个职位是兵部尚书、汉军镶白旗副都统与经筵讲官。XFFL, 174/6a–13a, 174/19b–23b, 174/32a–34b.\nJQQJZ, 5:368–73; QSLJQ, 68/11b–24b; XFFL, 182/16a–24b.\nJQQJZ, 5:374–75; QSLJQ, 68/24a–25a; XFFL, 182/29a–b. 但同日嘉庆把那彦成的堂兄弟那彦宝升为副都统。QSLJQ, 68/25a–b.\n嘉庆批评广兴试图把魁伦置于死地。GZDJQ, 4974, 5122, 5360; XFFL, 148/23b–24b, 148/26b–27a, 151/12b–14a, 152/22a–25b, 153/31a–35a.\nXFFL, 164/32a–33a.\n嘉庆警告说，托津与广兴都\"平庸\"，不得请求留前线参战。QSLJQ, 66/19a–20a; XFFL, 177/1a–3b.\nXFFL, 177/3b–7b.\nXFFL, 171/12a–13b.\n但嘉庆裁定：如果他表现良好，其原按察使衔与翎羽顶戴以后或战役结束时发还。JQQJZ, 5:283; XFFL, 173/13b–15a, 173/17b–18a.\n吉兰泰起初被降为游击。但他随后又未能阻止杨开甲从甘肃返回陕西，嘉庆遂命把他流放新疆。常亨拟于战争结束后流放新疆。JQQJZ, 5:108, 190–91; QSLJQ, 61/2b, 63/8b; XFFL, 155/7b–8b, 155/22a–b, 156/40a–41b, 164/19b–21a, 164/24a–26a.\nXFFL, 156/45b–48b, 158/20b–26b, 161/23b–24a, 161/31a–34b, 163/17b–19b, 163/26a–28a, 174/17b–19a, 174/24a–25b; QSLJQ, 61/27a–28a, 66/1b–2b; JQQJZ, 5:183–84, 289–90.\n嘉庆罢免了副将七格并把他流放伊犁——七格轻伤后一个月不回营，且只带回其九百五十名士兵中的二百六十七人（有些阵亡了，但许多人被留在各地养伤治病或充当守卫，有些可能开了小差）。XFFL, 175/1a–4a; JQQJZ, 5:294–95. 初夏，嘉庆罢免了陕安镇总兵柯藩——他听任叛军经其防区通过——命将他枷号，若不能赎罪，战后流放伊犁。同时，嘉庆把陕西的两名满洲军官德纯与果林召回北京本旗——前者久病，后者未能拦截逼近商州的杨开甲一股。嘉庆还查问了刘之仁——他被叛军击溃后一直未作战——但在额勒登保与那彦成都为他辩护后，让他留任训练新兵。XFFL, 164/38b–39b, 176/15b–18b, 176/29a–31a. 嘉庆还申斥王文雄久不作战，并核查了1799年出狱、不给俸禄发往四川的四名军官——他们因1796年秋未能阻止叛军从鄂西南资丘突围而受罚。XFFL, 166/29a–30a, 166/31b–32a, 166/43b–44a.\nXFFL, 164/41b–42b.\nXFFL, 182/27b–29a.\n高均德受审时提到\"刘冷\"，嘉庆怀疑刘冷就是刘之协。XFFL, 137/3a–4a. 1800年春末，一名被俘的叛军探子供称：刘之协先派其子到戴家营，让叛军去河南解散，随后又亲自前往，重申此意。但嘉庆不信。XFFL, 175/23b–26b.\n刘之协供词，BLJZL, 5:93–106; XFFL, 197/29a–b.\n嘉庆曾说汝州一直是个\"安静\"的地方。XFFL, 197/29b–30a.\n冀大荣、廖寅（叶县知县）与周季（南阳知府）都获授官职或升迁。刘之协供词、冀大荣供词、李杰供词，BLJZL, 5:93–108; XFFL, 190/1a–3b, 191/10a–15b; JQSYD, 5:355–56, 378.\nJQSYD, 5:329–67, 379, 392–93 各处; XFFL, 190/1a–3b 及卷191 各处; 吴熊光《伊江笔录》（Wu, Yijiang bilu），1/14b–15b。\n嘉庆曾命新近从吉林、黑龙江调来的一千五百名旗兵前往河南，但他们到达之前起事已被平定。XFFL, 190/3b–6b, 191/13b–15b, 190/16b; JQSYD, 5:363–64.\nBLJZL, 5:93–106; QSLJQ, 72/21b–24b.\n嘉庆还赦免了河南官员未能发现刘之协在本省藏身之处的过失。JQSYD, 5:343–44; XFFL, 191/4b–8b, 197/29a–30b, 198/7a–8b.\nXFFL, 198/9a–11b, 199/5a–8a.\n许曾重、林易\"刘之协\"。作者还质疑刘之协作为混元教最高领袖的角色，但论证并不令人信服。\n额勒登保1800年初提到：许多真正的教门叛军不怕死，把死亡视为转世后通往更好处境的必经之路。自己的股团被击垮后，他们会加入任何可加入的队伍。XFFL, 144/5a–b. 张汉潮的弟子周天绪1800年中被俘后，一直不服，直到在数千观众面前被凌迟处死。XFFL, 199/21a–22b.\n张世虎供词，BLJZL, 5:154–55.\nXFFL, 121/1a–5a, 138/25a–b, 142/9b–12a, 170/18a–22b, 174/1a–2b.\n庞洪胜不久战死。XFFL, 173/28b–29a, 181/1a–7a. 明亮与永保1799年奏报：秦岭中的\"红钱\"匪伙大多被叛军吸纳。XFFL, 100/8a–b.\n1800年春，一名这样的叛军探子在陕西蓝田被捕。XFFL, 162/22a–23a.\nXFFL, 100/1a–b, 129/16b–17b, 129/30a, 134/23b–24a, 192/28a.\nXFFL, 140/1b.\nXFFL, 182/35a–38b.\nXFFL, 卷147、150–53、156 各处及168/1a–3a; QSLJQ, 61/18a–19a.\n刘清很快复职，但太和镇的两名官员被处决，另有数人被罢免。XFFL, 165/12b–13b, 170/4a–7a, 177/20a–22b, 186/17a–22a.\n勒保审讯了七十五并查验其伤。他声称其伤属实。XFFL, 156/45b–48b, 164/8a–9a, 177/17a–19a, 177/21b–22a, 189/11b–14b, 189/19a–b.\nXFFL, 165/1a–7a, 166/40a–41a, 170/1a–4a, 170/7a–8a, 172/25b–30a, 172/30a–31b.\n王英是达州人，1796年以来的老叛军。他脱离本队，到龙安一处清军后勤站当挑夫，被一名达州籍军官认出。他在成都被处决。XFFL, 174/13a–16a, 174/21b–23a; 王英供词，BLJZL, 5:91–92.\nXFFL, 174/16a–17b, 174/19b–24a; JQQJZ, 5:289.\nXFFL, 174/3b–5a 及卷177–80、182、184 各处。\n勒保为百祥辩护，对增顺则更严厉。XFFL, 182, 5a–10b, 189/11b–14b.\nXFFL, 160/23b–28b, 171/9a–13a, 183/5a–8b, 191/29b, 197/10a–11a, 及卷173–74、178–79、185、187–89 各处。\nXFFL, 186/17a–20a, 189/1a–6a, 193/1a–7b, 193/11b–13b.\nXFFL, 193/7b–9a, 195/21b–24b, 197/14b–22a, 199/13a–15a.\n鲜大川派两名信使与其叔父接触，叔父说服二人杀死鲜大川。鲜大川的叔父命乡勇攻打鲜大川，随后二人杀死了鲜大川与最后十几名叛军。XFFL, 195/17b–21b, 195/24b–29a.\nXFFL, 195/21b–24b, 199/9a–13a, 201/5b–10b.\n最后的人马全部离他而去之后，张子聪扮成难民乞食为生。XFFL, 201/5b–10b, 202/1a–6b, 203/17b–22b, 207/9a–18a, 208/1a–7a, 208/16b–22a, 210/11a–14a; 张子聪供词，BLJZL, 5:109–11.\nXFFL, 183/13a–15b, 184/2a, 184/6b, 184/7a–10a, 187/34a–35b, 187/38b–40b, 197/22a–25b, 201/10b–14b.\nXFFL, 189/16a–17b, 195/24b–29a, 199/15a–18a, 202/6b–9a, 203/31b–35b, 207/18a–20b.\n嘉庆同意让赛冲阿留下，但驳回了他们增援的请求。XFFL, 189/6a–11b, 197/20b–25b, 203/27a–28b, 203/35a–b.\nXFFL, 207/18a–20b, 208/16b–22a, 210/14a–15a, 214/1a–14a.\nXFFL, 216/24b–31a.\n嘉庆升赏了四川六十多名军官、地方官与乡勇。XFFL, 208/22a–26b, 210/19b–21b, 210/27b–28a, 214/14a–18a, 216/31a–34b, 216/34b–36b.\nXFFL, 176/10b–15b.\nXFFL, 卷176 各处及178/9a–11a, 179/1a–10a.\nXFFL, 卷180–81、183–84 各处。\n但额勒登保告诉嘉庆：战争已近尾声，无需增援。XFFL, 184/37b–39a, 186/1a–5b, 188/12a–16a, 188/17b–19a.\n因未能阻止叛军入甘，嘉庆给了长麟与台布象征性处分，并降职处罚了数名将领官员。XFFL, 172/35b–38a, 179/15a–21a, 180/1a–8b, 及卷183、185、187 各处。\n定柱与一千名直隶兵于嘉庆五年闰四月十五日到达河南卢氏。XFFL, 179/31a–33a, 182/13b–14b, 183/14b–16a, 185/21a–22b.\nXFFL, 185/16a–17b, 186/27a–b, 231/25b–26a, 191/29b–31b. 队内，高姓之人用上书\"高家营\"的黄旗；马姓之众用上书\"马元帅\"的蓝旗。XFFL, 212/1a–5a.\nXFFL, 204/10b. 嘉庆追赠王文雄三等子爵，赏其母一千两。他以赛冲阿接替王文雄之职。XFFL, 192/17b–20b, 192/20b–22a, 194/11a–13b, 196/1a–4b, 196/6a–7b, 196/8a–b, 198/20a–22a.\nXFFL, 卷186、188、190、192–93、195–96、198、201、203、205、207、209、213 各处。\nXFFL, 卷197–201 各处及204/1a–9b, 199/18b–21a.\nXFFL, 205/20a–27a, 209/1a–9a, 211/15b–23a, 212/1a–5a.\nXFFL, 205/20a–30a, 211/15b–23a, 213/8a–12b.\nXFFL, 196/19a–22b, 197/11a–14b, 201/3b–5b, 201/27b–32a, 203/16a–17b, 207/28b–31a, 208/1a–10a, 209/9a–14a, 211/23a–26b.\n嘉庆对台布一直不满：他肃清张汉潮残部迟缓；对投降叛军过于宽大——台布曾以\"不杀\"为号召诱降；供应额勒登保军队不力。XFFL, 149/7a–9a, 181/11a–14a, 及卷183–84 各处。台布被派往西宁任办事大臣。陆有仁被任命为新任陕西巡抚。XFFL, 204/19b–20a, 206/1a–3b.\nXFFL, 213/16a–19b.\n嘉庆给了庆成\"严旨申饬\"——他赶到渡口太晚，只截住了最后一批正在渡江的冉学胜人马。XFFL, 214/22b–31a, 215/16b–24a.\n庆成赶到时，大多数叛军又已渡过。但嘉庆罢免了负责江防的关腾。XFFL, 213/1a–8a, 216/9a–20a, 218/15a–22b, 218/27b–37a.\nXFFL, 217/9b–14b.\nXFFL, 216/1a–4a, 216/9a–17b, 217/1a–3b, 218/15a–24b.\nXFFL, 213/7a, 215/26a–29b, 216/17b–20a, 217/4b–7b, 217/14b–16a, 218/27b–37a.\n台布初秋提到：额勒登保之所以不请援兵，是因为新兵素质低劣、经费短缺。XFFL 191/31b–36b.\nXFFL, 218/27b–37a.\nXFFL, 198/1a–6b. 其他估计在五千至七千之间，弘丰则估计联军只有一两千。XFFL, 147/24a–26b.\nXFFL, 148/15a–20b, 149/29b–38a, 150/32b–34b, 153/5a–10b, 153/11a–b; JQQJZ, 5:80–81; GZDJQ, 4724, 4878, 4927, 5124.\nXFFL, 154/22b–26b, 156/1a–8a, 158/10a–13b.\n据被俘叛军说，樊人杰想回襄阳，徐天德则打算回四川。XFFL, 154/22b–26b. 春末，鲜大川与龙绍周也曾进入湖北，试图与徐天德会合，没有成功。XFFL, 160/17b–19b, 161/36a–37a, 165/17a–19b, 168/10b–15a.\nXFFL, 150/4b–10a, 151/19b–23a, 153/11a–b. 松筠请求从额勒登保处调两三百名索伦骑兵入鄂，嘉庆拒绝了。XFFL, 158/5b–10a.\n嘉庆让吴熊光继续监视明亮与倭什布。XFFL, 162/1a–5b, 169/9a–12a, 165/17a–19b, 171/15b–26b. GZDJQ, 5261, 5345, 5415.\n这两个衔是蓝翎侍卫（lanling shiwei）与领队大臣（lingdui dachen）。XFFL, 162/3b–4b, 162/5b–8b; QSLJQ, 62/25a–b.\n嘉庆批准了明亮\"从广西调两千名士兵、从北京派十名军官\"的请求，但拒绝给他数百名额勒登保的索伦骑兵。XFFL, 169/23a–30b.\nXFFL, 172/14b–25b, 175/4b–10b, 及卷176 各处; JQQJZ, 5:268.\nQSLJQ, 62/25a–b; XFFL, 158/7b–10a, 162/6a–8b, 173/2a–3a, 及卷178–82、186、189 各处。\nXFFL 卷190–95 各处及206/12b–18a.\n叛军渡河当天，明亮赶到南沙河边，却说没有船，在岸边停下——尽管水深只及膝盖。随后，当地士兵与乡勇因无法辨认身份而拦下他的人马，明亮为此大闹一场，导致当地多名官员军官被罢免。XFFL, 196/22b–27b, 197/1a–3b, 198/1a–8b, 200/10b–17b, 200/18b–20, 217/20a–25a, 217/30b.\nXFFL, 202/9a–12a, 201/22a–27b.\n姜晟提议：四百五十名旗兵去房县协助倭什布，其余一千零五十名归明亮。嘉庆同意了。关于旗兵的部署，见XFFL, 卷194、196、197、199、201、202。\nXFFL, 197/3b–4b, 197/5b–6b.\nXFFL, 196/27b–29b, 卷202–5 各处, 207/1a–6b. 德英额避开了这场战斗，自称受伤，返回了驻地。嘉庆将他罢免，命押解勒保与德楞泰处验伤。XFFL, 203/35b–37b.\nXFFL, 卷202–7 各处, 209/16a–17b.\n明亮论证说，留在丰溪可以同时监视川陕两省的叛军；入川则会使湖北空虚。他再次抱怨兵力规模，以及四百五十名骑兵中只有四至五成有马。XFFL, 209/15a–16a, 210/1a–6a, 211/9b–13a, 212/9b–11a.\n明亮被降为蓝翎侍卫。QSLJQ, 75/18a; XFFL, 205/14a–16b, 205/18a–20a, 210/6a–8a, 211/13a–15a.\nXFFL, 205/18a–20a, 208/8b–9a, 208/14a–16b.\nXFFL, 203/9b–10b. 乾隆朝晚期，长龄曾在福康安幕中参加多次战争。\n嘉庆五年十月初二日，长龄在旬阳取得首捷。一周后，长龄在竹溪鲍家店附近再战。数日后，他又进攻高马股，六个小时的战斗后追击叛军一整夜。随后长龄抄近路截住叛军，又打了一仗。XFFL, 卷208、211、212/1a–5a. 十月十七日，明亮与倭什布从丰溪赶往宝丰，攻打高马股余部，取得一场轻松的胜利；明亮声称杀俘一千余名叛军。长龄赶到后，与明亮把该股追入陕西。XFFL, 212/11b–16a, 212/19a–22a, 215/1a–5b.\nXFFL, 208/30a–33a, 211/5a–9a, 212/5a–7b.\nXFFL, 215/24a–29b, 218/1a–5b.\n返回湖北途中，长龄留下一千名广东广西兵及其最后五百名旗兵中的一百多名守卫竹溪县城。XFFL, 118/9b–13a.\n嘉庆还发还了明亮三品侍卫与领队大臣之衔。XFFL, 208/11b–14a, 212/16a–18b, 212/22a–23b, 215/1a–7a, 215/24a–29b.\nXFFL, 215/1a–5b, 217/9b–14b, 218/1a–5b, 218/9b–14a.\n姜晟被调任直隶总督。XFFL, 215/29b–31b.\n书麟是广厚与广兴的同父异母兄。他参加过第二次金川之役，但仕途大部分在文官系统。和珅被清除后，嘉庆先任书麟为吏部尚书，不久又任他为闽浙总督。他还授书麟紫禁城骑马之权——这是保留给最受信任高级官员的殊荣。JQQJZ, 4:140, 164.\n关于嘉庆即位初期所谓改革的讨论，见关文发《嘉庆帝》（Guan, Jiaqingdi），第3–6章。\nXFFL, 162/19b–20a.\n同时，嘉庆对后宫关注更少；直到1805年初他才生育子女。关文发《嘉庆帝》（Guan, Jiaqingdi），539。\n1800年初，吴熊光派密探赴襄阳考察地方防务与民情，随后奏报朝廷。GZDJQ, 5124. 1801年吴熊光被任命为湖广总督时，嘉庆称赞他所报情报准确。XFFL, 256/20a–21a.\nQSLJQ, 37/29b–30b, 38/26b; XFFL, 88/23b–24a, 88/30b–31a, 89/23b–24a, 98/29a.\n嘉庆曾承认：他的指示到达前线时，前线局势常常已经变化，因此遥控指挥十分困难。XFFL, 173/30a–b.\n嘉庆1800年深秋在一道谕旨中提到这一点。XFFL, 199/17a–b.\nXFFL, 144/24b–29b.\n魁伦曾提议把福宁流放新疆，但嘉庆把刑罚改为\"不给俸禄、充兵效力\"。嘉陵江渡江事件之后，嘉庆把裁减嘉陵江沿岸乡勇之责归咎于福宁，把他流放伊犁，但没有追究1796年之事。XFFL, 149/38a–40a, 152/27b, 164/33a–37b; QSG, 11174–75.\nXFFL, 150/22a–23b.\n张小元供词，BLJZL, 5:111–16.\nXFFL, 215/13a–15b.\nXFFL, 215/15b–16a. 关于曾静案，见史景迁（Spence）Treason by the Book。\nXFFL, 213/19b–20a, 215/13a–15b, 215/17b–18b.\nXFFL, 218/24a–25a.\n例如，见关文发《嘉庆帝》（Guan, Jiaqingdi），第3章。\nJQSYD, 4:29–30.\nJQSYD, 5:305–6; QSLJQ, 70/2b–3a. 洪亮吉原信现存于《洪亮吉集》。\n关于洪亮吉的晚年，见Jones, \"Hung Liang-Chi,\" 198–202。\nXFFL, 172/15a–16b.\nQSLJQ, 68/11b–24b.\n嘉庆这句话见于一道答复周兴岱的谕旨，JQQJZ, 5:460–61。\nJQSYD, 5:14.\n", "sections": [{"level": 2, "title": "嘉陵江之败与勒保复出", "id": "ch4-s0"}, {"level": 2, "title": "改革派的淡出", "id": "ch4-s1"}, {"level": 3, "title": "松筠遭斥逐", "id": "ch4-s2"}, {"level": 3, "title": "魁伦获赐自尽", "id": "ch4-s3"}, {"level": 3, "title": "那彦成蒙羞", "id": "ch4-s4"}, {"level": 3, "title": "广兴与托津被召回", "id": "ch4-s5"}, {"level": 3, "title": "更多的处分", "id": "ch4-s6"}, {"level": 3, "title": "刘之协的被捕", "id": "ch4-s7"}, {"level": 2, "title": "军事前线", "id": "ch4-s8"}, {"level": 3, "title": "四川战场", "id": "ch4-s9"}, {"level": 3, "title": "陕西战场", "id": "ch4-s10"}, {"level": 3, "title": "湖北战场", "id": "ch4-s11"}, {"level": 2, "title": "作为统帅的嘉庆", "id": "ch4-s12"}, {"level": 2, "title": "注释", "id": "ch4-s13"}]}, {"id": "c5", "title": "第5章 · 终局，1801—1805年", "kicker": null, "part": "第一卷 · 叙事", "html": "<blockquote>\n<p>将领们之所以未裁尽乡勇，是因为贼匪尚未了结。不应出现这样的情况：因为裁减乡勇困难，将领们就故意把最后几股贼匪留着不了结。</p>\n<p>——方维甸，1804年</p>\n<p>[译者按：原奏自英文直译，文言原文待核。（出处见章末注释）]</p>\n</blockquote>\n<p>1800年之后，白莲教战争又拖了四年。冲突是极不对称的——清军的规模总是起事者股团的许多倍。然而，前者进展缓慢，嘉庆皇帝设下的期限被一次又一次地延长。在嘉庆的催逼下，战役主持者们于1803年初奏报胜利，但军事行动仍在继续。1803年夏末，第二次宣布胜利，但又一次为时过早。此后，直到1804年秋，才再次——也是最后一次——宣布胜利，尽管对叛军残部的搜剿一直持续到1805年。这漫长而痛苦的收尾阶段，一再唤起一种似曾相识之感。</p>\n<p>讽刺的是，过度拖延的主要原因与起事者无关，而是裁撤数万乡勇的任务。大规模雇用平民承担作战与辅助军事任务，堪称这场战役最突出的特征。它的起源、机制与动态将在下一章讨论，它巨大的财政代价与造成的漏洞将在第7章考察。本章勾勒的，是清退这些平民作战人员这一充满麻烦的过程——它大大复杂化并延误了对叛军残部的肃清。将领们不愿及时遣散乡勇，乡勇们也讨价还价以求利益最大化。从1802年底起，一些被遣散的乡勇加入了起事者，进一步加深了镇压者的困境。</p>\n<h2>拖延的战争，1801年</h2>\n<p>1800年底，嘉庆估计仍在逃的起事者只有两三万，其中大多数是被裹挟的平民。^1 新年（1801年2月13日）将至，皇帝再次陷入焦虑。他虽公开说希望在新年庆典上宣布胜利，私下却担心：即便来年春天他去谒陵、为乾隆服丧期满，也未必能报捷。嘉庆责成军事将领们加快行动、文官们协助阻止叛军流动。然而，他不得不现实一点。新年前三周，嘉庆把奏凯的期限从年前延到三月底。^2 新年过后不久，他对起事者强硬起来，宣布不接受五名主要叛军首领——徐天德、王廷诏、高二、高三与马五——的投降，尽管次要首领投降可以免死。他为杀死或擒获这五人设立了重赏，并命官员广为宣示这项新政策，警告说：如果起事者自己擒了首领送官，任何人不得邀功。^3</p>\n<p>然而，他的统帅与他不在一个频道上。额勒登保非但没有筹划结束战役，反而建议：把所有残余起事者赶向襄阳，以便利清军补给；并从全国招募更多地方官来主持陕鄂两省的筑堡工程。^4 额勒登保不承诺结束战争、却大谈可能数月才能见效的计划，令嘉庆震怒，他彻底否决了这两项建议。^5 1801年开局不利。</p>\n<h3>四川战场</h3>\n<p>如上一章所述，到1800年底，四川的战事已大大减弱。1801年开始时，只有数千名起事者分成几股，藏身于广元、南江与太平的大巴山中。^6 然而，数月以来，德楞泰与勒保一直未能消灭他们。新年前数周，嘉庆批评二人多日不战，不久又把德楞泰的爵位降为一等男，把勒保的顶戴降为四品。他相信四川剩的活儿不多了，命德楞泰赴陕，让勒保与七十五在四川清剿。^7 然而，仅仅数日后，听说四川一场\"可观\"的胜利，嘉庆又把德楞泰的爵位升为三等子，把勒保的顶戴升为三品，并各赐一个御笔\"福\"字，尽管他仍坚持德楞泰赴陕。^8</p>\n<p>但德楞泰借口广元出现新的紧急事态，推迟赴陕。^9 然而，到了广元后，德楞泰对七十五大为恼火——七十五驻节广元，有六千多名士兵，却对叛军几乎无所作为，战斗中也帮不上德楞泰。德楞泰向皇帝抱怨七十五的同时，于十二月十日在南江与勒保会面后前往陕西。^10 他的突然离去令嘉庆吃惊——这让他想起一年前额勒登保与德楞泰撤出四川、导致起事者渡嘉陵江的事。^11 随后勒保折回东面，说那里出现了新的起事者。新年将至，勒保却找借口不赶往热点。四川的军事行动陷入了停顿。^12</p>\n<p>直到年后，勒保与七十五才再次上路。他们分了工：勒保负责川东与嘉陵江下游河谷，七十五负责川北与嘉陵江上游河谷的军事行动。七十五——已被皇帝申斥——前往边境与叛军交战，勒保则再次西行，保障嘉陵江安全。^13 由于七十五的军事行动——他杀死了张世龙，击溃了张世龙两千来人的队伍——辛聪、陈朝观、阎胜可、魏棒棒与李彬等几股进入了西乡。然而，听说德楞泰正赶往西乡，他们又返回了四川。在太平，汤思蛟、刘朝选等藏身那里的几股加入了他们。正月初七日，多股叛军——据说总计八九千人——在一场战斗中令镇压者们震惊，杀伤数名军官与数目不详的士兵，随后南下，先到开县，再到云阳。^14</p>\n<p>与此同时，樊人杰、王士虎与冉天泗率数千人从宁羌突入四川。攻取广元城、在苍溪西渡嘉陵江均告失败后，他们移向仪陇，在那里被阿哈保与薛大烈击溃——薛大烈是久经战阵的绿营军官，时任四川总兵——损失两千多人，包括樊人杰的妻子与徐万富。又遭七十五与薛大烈攻击，这支队伍再损数百人，包括在通江一场战斗中阵亡的王士虎。只剩一千人的樊人杰决定南下，与辛聪、陈朝观会合。^15 到二月中旬，合并的起事者到达巫山，准备突入湖北。然而，七十五与罗思举把他们逼回北方。对下一步去向无法达成一致，他们分了手。辛聪、汤思蛟与刘朝选留川，陈朝观、魏棒棒与阎胜可率三千人于三月初进入西乡。大约此时，樊人杰在自己的股团被击溃后从镇压者的雷达上消失了。最可能的是，樊人杰随其他股团去了陕西。^16 显然意在阻止叛军回川，勒保尾随他们到川北边境，让七十五进入陕西与他们交战。直到月底勒保需要七十五对付汤思蛟与刘朝选时，才把他召回。^17</p>\n<p>此时，汤、刘一股是四川唯一的大股。^18 汤思蛟与刘朝选都是东乡起事者，王三槐与冷天禄死后成为\"元帅\"。在四川与竹溪的边境游荡了一段时间后，汤、刘于1801年初合并。^19 藏身太平与开县的山区、劫掠当地居民的堡寨，他们吸纳了其他几个小股，队伍扩大到五六千人。在勒保与七十五的压力下，汤、刘一股先到大宁，在那里与辛聪、王士虎会合，随后在清军发动协同攻击时于初夏越过边境到竹溪。^20 目前，这股叛军离开了四川。</p>\n<p>尽管川北、川东有一万多名作战兵力——还不算守城守卡的正规军与数万乡勇——四川的清剿却没有取得决定性进展，尽管嘉庆一度认为，光凭乡勇就能对付这些匪类般的残部。^21 勒保一如既往地满口应承，不厌其烦地自吹自擂：把当地居民安置进堡寨。至于行动，勒保忙于东奔西跑，却很少打仗。与敌人遭遇时，他不是找个借口离开，就是让随行的两位将领阿哈保与薛大烈承担战斗的重担，自己躲在后面。他虽然口口声声要把陕鄂两省的全部叛军赶向四川加以剿灭——这是他不对付入川叛军、反而放他们深入本省腹地的借口，这令皇帝十分恼火——实际上却把起事者赶向了陕西或湖北，正如他对陈朝观一股与汤、刘一股所做的那样。^22</p>\n<p>这一年里，嘉庆无数次严厉而尖刻地斥责勒保。^23 他认为，勒保1799年因不去前线、坐守达州而被罢免，如今便以来回奔波来显示自己的勤勉。但皇帝不领情：\"你带兵在川，忽而北驰，忽而东驰，一而再、再而三。如此，不仅疲敝士卒，而且虚耗经费。显然，你是有意拖延，坐待事机。\"（原文待核，见注释24）^24</p>\n<p>嘉庆清楚勒保不是能干的将领——他认为叛军之所以入川，是因为他们知道勒保是众将中最弱的一个——还斥责他：惯于去别的将领所到之处，以便分享人家的战功，自己却从未打过一场真正的仗，更别说消灭任何一股叛军了。皇帝一度怀疑，被勒保杀死的人可能都是平民。对勒保的空话与无休止的借口感到厌倦，嘉庆毫不留情地揭穿他的自相矛盾：\"贼入山林，你便说冰雪险径，难以进入；贼出平地，你便说贼势分散，难以合围兜剿——你就是这样自相矛盾。然后每十日上一道奏折应付了事，报称杀死零星贼匪，每次数十或上百。如此，何日方能尽歼贼匪？\"（原文待核，见注释25）^25</p>\n<p>然而，勒保总能设法把局面应付到最好。他知道嘉庆对嘉陵江安全深为关切，于是每当回避赴前线、回避打仗时，就常常用视察江防作借口。此外，他还以守江为名多雇乡勇。^26 如本章稍后所述，裁撤还是保留乡勇之争，将成为中枢当局与战争当局之间旷日持久的冲突。勒保不遗余力地维持乃至扩大乡勇规模，即便叛军人数已大大减少。</p>\n<h3>湖北战场</h3>\n<p>1801年开始时，湖北只有高二率领的一股叛军。1800年底返回湖北后，高二通过裹挟当地居民，把几百人的队伍扩大到三千人，但他南移的企图在十一月二十三日东湖一场激战中被清军挫败。^27 然而，此时徐天德的黑号——六七千人——突入了竹溪。^28 嘉庆震惊而愤怒，严厉斥责倭什布边防失守，把希望寄托在颇受推重的新任湖广总督书麟身上。^29 书麟\"昼夜兼程\"（原文待核，见注释30），于十二月初到达襄阳，随即赶赴武当山区。^30（地图5.1）</p>\n<p>在房县秦口，徐天德与只剩一千人的高二会合。又有从陕西来的一股加入，他们的人数合计可能超过一万。^31 然而，几场小规模冲突之后，合并的起事者于十二月十五日在泉溪被击溃。^32 这场败仗或许警告了起事者：面对占优的清军，不要聚在一起。新年前数日，高二前往平利。^33 徐天德留了下来，但他的人马分成小队，深入竹山、竹溪常常无路可走的深山。这迫使镇压者们以较小的单位在山中跋涉，抛下重型装备与后勤队伍。起事者在武当山以南横行，攻打竹溪与竹山县城，两城都未攻下。尽管在湖北挣扎，徐天德仍坚持前往河南的计划——这个计划或许是他上年秋天在陕西与王廷诏、马五、高三会面时定下的；他派信使到陕西，召唤那里的叛军来鄂。^34</p>\n<p>正月二十三日，在陕西会合的苟文明与李彬——通江起事的老叛军、蓝号首领——率其数千人越过边境到竹溪，随后南下。^35 到二月，苟、李一股与徐天德一股在连遭重创后都到了兴山。^36 在多山的兴山，两股与该地区其他几股——包括戴家营——在山顶筑垒自固。三月初，清军对叛军据点发起协同攻击，迫使徐天德与苟文明分手。^37 书麟与其同僚认为湖北战场的七千名士兵不够，一再恳请朝廷增援；在招募更多乡勇的同时，他们请江西派三千名士兵来。书麟还致信德楞泰，请他赴鄂。嘉庆起初不愿意，三月初二日才命德楞泰前往湖北。^38</p>\n<p>事实上，接到皇帝指示之前，德楞泰已在追击经大宁从陕西入鄂的龙绍周途中到了湖北。二月初，额勒登保派德楞泰对付龙绍周。然而，他等了近两周才出发。^39 在大宁，德楞泰追上了龙绍周，据说杀俘数千。然而，战后他再次暂停，等待朝廷的赏赐与礼物——这给了龙绍周逃脱的机会：龙绍周用一支分遣队把德楞泰引向太平，自己则前往湖北。直到战后十天，德楞泰才于三月初八日到达湖北。龙绍周在鄂停留时间很短。与苟文明短暂会合后，龙绍周经三峡北岸返回四川。德楞泰留鄂对付苟文明。^40 龙绍周离开后，苟文明在兴山再次与徐天德合并。冒着不可徒涉的河流与幽深无路的森林，这两股合计七八千人的队伍使敌人疲于奔命。然而，四月初清军终于追上他们时，他们遭受了巨大损失。^41</p>\n<p>与嘉庆\"数日内即可全歼\"的期望相反（他因此发还了德楞泰被摘去的双眼花翎），两股都活了下来。苟文明返回四川，徐天德前往竹溪，在那里与从平利来的几股会合——包括樊人杰、曾芝秀与陈朝观率领的——合计约有六千人。直到四月二十日，德楞泰才与他们交战，随后追击合并后的起事者到平利。湖北再次解除了大规模冲突。^42</p>\n<p>湖北平静前夕，书麟于四月初九日病逝。短暂的任期内，书麟曾认真努力地迅速结束这场漫长的战役。一到任，他就赶赴前线。有时，他不得不下马，与士兵们一道跋涉在融雪浸湿的山间。^43 书麟对乡勇不以为然，极力主张更多地依靠正规军。他还反对沿多山边境处处驻军，建议把兵力集中到人口较多的地方。^44 书麟与明亮自第二次金川之役起就有交情，一直支持明亮，总是对他评价甚高。经书麟之请，嘉庆把明亮留在湖北，并恢复了明亮上奏之权——这一特权此前被剥夺了。^45 嘉庆二月二十四日设立湖北提督一职、任命长龄为首任提督时，又安排明亮接任长龄原先的宜昌镇总兵。^46</p>\n<p>德楞泰虽然帮助把起事者逐出湖北，却再次施展拖延战术，行动迟缓，常常跟丢敌人。^47 尽管嘉庆因多日听不到他的消息而恼怒，德楞泰还是在两次战斗之间闲度数周。嘉庆知道德楞泰惯于索要过多的经费给养，曾让书麟充分供应德楞泰，并表示愿意从国库拨一些钱。^48 然而，德楞泰对湖北效率低下的后勤大为不满。离开湖北后，他向额勒登保痛诉，导致倭什布被罢免。^49 嘉庆起初打算让倭什布接书麟之位，最终却任命吴熊光为新任湖广总督。^50</p>\n<h3>陕西战场</h3>\n<p>1801年初，陕西的局势更复杂。苟文明、龙绍周与戴四一直在汉江以南穿梭，试图渡江。在川陕边境，藏身林中的小股不断尝试进入陕西——或合伙，或单独。在长麟督率下，陕西军队一直把他们逐回四川。^51 在汉江以北，冉学胜未能到达栈道以西后，在秦岭与樊人杰、王士虎、冉天泗会面。^52 他们一同前往商州，目标是突入河南。额勒登保知道起事者一旦入豫朝廷就会震怒，遂赶赴商州，于新年前两周把这两股逼离边境。^53 折向西后，冉学胜与樊人杰分手。樊人杰一股突入甘肃失败后，年后不久前往四川广元；冉学胜一股则在汉江上游谷地遭受杨遇春与格布舍的毁灭性打击，尽管冉学胜也让镇压者付出了可观的伤亡。此后冉学胜回到秦岭藏身。^54</p>\n<p>尽管清方高度戒备，一些起事者还是到了汉江以北。十二月十八日（1801年2月2日），数千人的高马股在数次失败尝试之后，在安康五块石渡过汉江。^55 十天后，十二月二十八日，刚被逐出湖北的高二在旬阳大棕溪渡过汉江。随后他迅速移向豫陕边境——因为陕西的大部分清军已西去与冉学胜、樊人杰作战。^56 额勒登保立即派杨遇春与格布舍对付已进入秦岭的高马股，命德楞泰对付高二一股（他们以为那是徐天德的队伍）。^57</p>\n<p>与往常一样，德楞泰行动迟缓。然而，正月十三日他终于追上高二时，两场战斗就击溃了这股叛军——先在山阳干沟，后在镇安野猪坪，高二于正月十八日被杀。德楞泰随后放慢了脚步，跟丢了高二的残部，听任数百人加入了高马股。^58 二月初，额勒登保把闲着的德楞泰派到汉江以南对付龙绍周与苟文明，由此引出德楞泰赴鄂之事，如前所述。^59</p>\n<p>到元旦，嘉庆已有十多天没听到陕西战场的消息，连将领们的新年贺表都没收到，这更加深了他的困惑：为什么将领们</p>\n<p>不希望早点结束战役回家。^60 如第4章所述，嘉庆1801年新年没有给部队任何金钱犒赏；他唯一的恩典，是给三个战场各拨一万两置办军衣。或许是意识到没有惯常的年终犒赏可能有害，他试图补救。年后两周，嘉庆拨十万两白银给额勒登保与德楞泰犒军，并派两名朝官倭星额与邱兴健赴陕，押送银两、犒赏该战场将领。^61 与上年周兴岱的使命相似，这两位官员还将搜集关于起事者与镇压者的第一手情报。</p>\n<p>起初为高二被除而欣喜的嘉庆，很快就泄了气——德楞泰与额勒登保似乎都没有动力去了结残破的叛军股团：高二死后近两周，他们又没有上奏。嘉庆给了额勒登保与德楞泰各一次\"申饬\"，再次提醒他们：他希望来年春天谒乾隆陵时能够报捷。然而，他也意识到三月底前奏凯不可企及。他再次延长期限：三月内了结大股——那时他还没脱掉丧服——四月完成清剿，好让额勒登保与德楞泰及时回京，秋天陪他谒陵。^62</p>\n<p>终于，又一条好消息传到了紫禁城：与高马股在一起的王廷诏于二月中旬被擒。冬季山中求生艰难，高马股先试图到达富庶的西安平原，随后又企图经甘肃入川。无法突入甘肃，它转而南向勉县，在那里遭杨遇春伏击溃败。由于与马五发生冲突，老叛军王凌高带走六七百人前往四川广元，主力则沿川陕边境移动。杨遇春追上该股、杀死许多人之后，王廷诏在西乡边境被擒。^63 嘉庆清楚地知道王廷诏的分量，欣喜若狂，举行了自1798年底王三槐被擒——那时还是他父亲主政——以来最盛大的庆祝。^64 遵他之命，王廷诏被押解北京——这是最后一个被解京的叛军。王廷诏先在西乡受额勒登保审讯，随后在北京被反复审讯、受刑，最后被凌迟处死。王廷诏堪称叛军首领中最老辣的一个，回答问题小心而圆滑，不透露任何可能损害残余起事者或教门网络的信息。被擒时，王廷诏随身布袋里装着他祖父的画像、两道咒语与一页教门文书（shu）。他承认祖父是显赫的教门师父、他家与鹿邑王家过从甚密，却坚称自己不识字、并未奉教：1796年他在襄阳被叛军俘获后被迫入伙，叛军尊重他、善待他，只是因为祖父的名望。^65 因此，要从他的审讯记录中提取可信信息，必须谨慎鉴别。^66</p>\n<p>王廷诏被擒后，士气低落的高马股移向宁羌，在那里与其他几股会合——包括离去的王凌高一股——规模增至一千人。但它很快就在三月中旬清军的连续打击下瓦解。四月初一日，杨遇春等人在二郎坝一场伏击中几乎全歼了这支队伍，俘获了高三与马五；幸存者投奔了藏身川陕边境的叛军股团。嘉庆欣喜若狂，命把高、马就地剐磔（luange），在被这支队伍杀死的军官灵位前处决。^67</p>\n<p>不久，徐天德也走向了末日。徐天德与樊人杰从湖北返回平利后，分成小队西移，于四月二十三日在旬阳涉水北渡汉江。然而，尾随该股到北岸的德楞泰（尽管他迟了一天才到江边）很快于五月初七日迫使他们退回汉江以南。一周后，德楞泰与庆成在皮河铺击溃了该股，俘获了徐、樊二人的妻子。逃跑途中，五月十七日，徐天德在紫阳新滩渡河时溺毙——连日暴雨使任河暴涨，徐天德与数百名起事者及其家属挤乘一条船渡河，船覆人亡。该股其余部分被比德楞泰先到江边的赛冲阿击溃；只有一百来人幸存，逃入森林。然而，樊人杰在皮河铺之战后与徐天德分手，最终回到了湖北。^68 徐天德死前不久，陈朝观在旬阳被乡勇擒杀。^69</p>\n<p>尽管五名主要叛军首领在1801年中点之前全部殒命，对陕西次要首领的作战却更加旷日持久、更加费力。在汉江以北，伍怀志吸纳其他股团残部、裹挟当地居民，把队伍扩大到三千多人，在秦岭进进出出。额勒登保派去对付伍怀志的穆克登布与丰绅，数月无所建树。在给皇帝的奏报中，额勒登保不厌其烦地抱怨地形艰险，却无意寻找克服障碍的办法。五月下旬，伍怀志及其最后的数百人被迫逃入宁陕（旧称五郎）无路可走的深山，六月初一日在一处崖顶被了结。伍怀志跳崖后被擒。^70</p>\n<p>江北的另一股是高二的数百名残部，由高二的亲戚、副手高建启率领。^71 这股也数月出没于秦岭，有时逼近甘肃。起初，对付这股的是刘之仁与罗昂率领的当地绿营兵与乡勇。四月下旬，该股窜往甘肃秦州时，长麟急忙赶去，先把它压回陕西，再把它逐向四川。高建启一股沿嘉陵江迅速南下、离陕西越来越远时，长麟把它留给了勒保处理。^72</p>\n<p>可以说，陕西令清朝最沮丧的作战，是对付冉学胜——一个异常顽强的起事者。二月中旬，冉学胜率其一千人的队伍走出秦岭，从凤县侵入甘肃。在甘肃，冉学胜北渡渭河，裹挟了许多当地居民，夺取了数百匹骡马。无法抵达陕西千阳，他再次南渡渭河，返回陕西留坝。追冉学胜入甘的长麟，总是比敌人慢一两步。在留坝，冉学胜裹挟了更多当地居民扩充队伍，还弄到了约两千匹骡马。三月十三日，冉学胜把总兵杨奎猷及其四千名士兵诱入埋伏，杀死至少三百名士兵与二十多名军官；杨奎猷侥幸逃生。^73 然而，长麟在凤县截住冉学胜后，他损失了大量人马与牲口。为补充人手与牲口，冉学胜再次入甘，于三月二十九日再次北渡渭河。^74 听说千阳一个教门社团刚刚发动了一场未遂起事，冉学胜还打算去招募那里幸存的教众。^75 在陇州，冉学胜一场战斗击败了长麟，留下一百多名士兵乡勇的尸体。^76 然而，四月初五日，额勒登保及其亲兵——由扎克塔尔、桑吉斯塔尔（金川人，自幼被带到北京，成为旗军军官）与杨芳率领——与庆成的部队一道，在曹柏峪的一处狭谷给了冉学胜决定性打击，尽管清方也损失了数十名士兵与数名军官，包括额勒登保的弟弟。^77 冉学胜没有听从部下的建议回陕，而是前往固原——那里地势平坦，便于他众多马匹快速行进。直到四月初十日在固原张义堡被额勒登保再次击败，冉学胜才折回，南渡渭河，返回陕西。^78</p>\n<p>在陕西，冉学胜被迫南移，四月二十五日在洋县南渡汉江。额勒登保知道冉学胜已不如从前危险，把战斗交给了杨遇春与扎克塔尔。确实，冉学胜再也没能接近汉江。短暂窜入竹溪与竹山之后，冉学胜在旬阳与其他几股会合，但很快又分手了。^79 失去全部牲口后，冉学胜与其最后的数百人于七月初前往大宁徐家坝。</p>\n<p>1801年上半年，嘉庆一直对陕西迟缓的军事行动怒火中烧，常常斥责额勒登保拖延，给他\"申饬\"。有一次，他警告额勒登保不要重蹈那彦成蒙羞的覆辙。嘉庆对其他将领也不满意：批评穆克登布对伍怀志行动迟缓，责备德楞泰听任徐天德与樊人杰北渡汉江。^80 他尤其对长麟对冉学胜的糟糕作战怒不可遏。怀疑长麟伪造情报，嘉庆让额勒登保与陆有仁秘密监视他。最后，他解除了长麟的军事职责。^81 一直处于守势的额勒登保，在陕西战局转向有利于他时，反应强烈。春末又一轮圣训批评之后，他辩称自己没有任何拖延作战的理由，指出他甚至因战役错过了母亲的葬礼。同时，他向嘉庆保证：军事行动\"数日内\"即可大体了结。^82 显然，额勒登保过于乐观了。</p>\n<h2>1801年底</h2>\n<p>三月初，两位钦差倭星额与邱兴健从陕西启程回京。由于被俘的王廷诏要解京，额勒登保请二位钦差随押解队伍同行，沿途照应。押解队伍由三位旗军将领——他们在战役中效力多年，正返京——与一名陕西知县率领。此外，额勒登保还派自己的后勤大员朱勋随行。^83 人员齐备的押解队伍里放进朱勋，耐人寻味：他或许另有使命。朱勋可能受额勒登保之命，给两位钦差在京的府上送\"礼物\"——因为二人返家时携带超大行李太过显眼。</p>\n<p>倭星额与邱兴健的奏报——他们回京数周后才呈上——令史家失望。他们乐于对在陕西从额勒登保及其部下那里听到的一切\"疑罪从无\"。他们附和将领们的观点，奏报说战役进展迟缓的原因是叛军人数减少，这反而使与之作战更加困难。他们还转述了额勒登保的意见：他不需要援军，但希望把省下的经费用于犒赏已部署的部队。论及战争财政，他们以运输给养的高昂费用为战役的巨额开支辩护。此外，他们说规定的运输工价太低。他们指出的唯一问题并不新鲜，而是朝廷早已知晓的：受雇乡勇的无能。他们称乡勇为\"乌合之众\"，批评他们训练无素、纪律松弛，并把战时腐败归咎于他们。然而，他们很快补充说：额勒登保与德楞泰麾下的乡勇是例外——两位将领已把他们训练成能战的士兵。至于对战争领导层的评价，倭星额与邱兴健只称赞额勒登保，对德楞泰则语带保留：\"我们未与他见面，但听说他谙习军务，确实能战。近来操守亦有改进。\"（原文待核，见注释84）^84 他们点名批评的唯一高级官员是长麟。或许是知道皇帝对长麟的不断批评，他们建议把长麟的部队拨给额勒登保——因为长麟不适合带兵。嘉庆解除了长麟的军事职责，但让额勒登保对两位钦差的其他建议——主要涉及地方防务与地方驻军训练——自行斟酌，不过他让额勒登保认真管理乡勇的饷银。然而，两位钦差确实奏报了一些皇帝想听的话：他们觉得战役已近尾声，奏报说三省在逃起事者只剩两万，比以往任何时候都更残破、更沮丧。于是，他们预言战争将在来年秋天或冬天结束。^85 夏天推进，前线的消息似乎印证了他们的预言。先是冉学胜被逐离汉江，接着徐天德死了。再次看到一线曙光，嘉庆掩饰不住兴奋，期待\"捷音将至\"。他再次设定期限：七月内肃清所有叛军股团。^86 然而，额勒登保提醒皇帝：除十来个主要首领外，还有许多次要首领，而这些次要首领可以轻易把叛军残部重新集结起来。^87</p>\n<p>显然，额勒登保不打算如期完成任务。嘉庆催促他赴鄂协助对付汤、刘一股——因为陕西已无多少事可做。但额勒登保在竹溪待了一个月，没取得什么成果。夏末返回陕西时，陕西最后的两千来名叛军大多已被压入大巴山。额勒登保移近川陕边境，督率山中搜剿，有时也突入四川。与此同时，在陆有仁督率下，陕西军队与乡勇在秦岭清剿叛军残部。尽管额勒登保与陆有仁不断作出乐观的预测，陕西的军事行动到年底仍未结束。^88</p>\n<p>徐天德死后，德楞泰又被额勒登保派去对付龙绍周——龙绍周春末从湖北返回四川（随后去了陕西，但很快被逐回四川），队伍有数千人。德楞泰仲夏到达太平后先休整，闲度数周，近一个月不与北京通信。直到七月初，他才在多山的大宁与龙绍周交战。两周内，德楞泰把龙绍周的人众减到只剩数百。然而，德楞泰又放慢了脚步，听任该股经长江北岸在川鄂之间往返，同时抱怨给养不足、部队艰辛，意在索取更多恩赏。^89 尽管对德楞泰的拖延日益恼怒，嘉庆再次妥协，赏他与他的军队礼物与银牌，并同意他们在消灭龙绍周后休整。^90 最终，龙绍周从竹溪渗入陕西后，德楞泰的部将赛冲阿、文春与马瑜于九月二十七日在平利杀死了龙绍周，全歼了他最后的二百人——而德楞泰当时在别处，据称是在收拢留在各地的伤病员。^91</p>\n<p>川东的夏天很安静；清军只打了为数不多的几仗——或把叛军逐向陕西，或围剿被击溃股团的残部。^92 夏末，勒保宣布川东已肃清叛军。然而，在川北边境，高建启等人从陕西到来，使该地区不得安宁。高建启吸纳小股，把队伍补充到两千人。受皇帝批评催促，勒保终于在夏末离开达州，前往通江。勒保的人马先把高建启追到嘉陵江，又把他追回北部边境的大巴山，但总是比敌人慢。在山中，高建启与藏身那里的其他几股保持着松散的联系。^93 冉学胜在太平与大宁的山中藏身数周后，率其最后的四百人前往通江抢收庄稼时，与高建启走到了一起。八月初六日，四川军队袭击了他们。高建启逃脱，冉学胜被擒。^94 此后，四川军队把剩下的起事者压向陕西，促使陕西军队移向边境，出入四川作战。勒保再次退出，返回达州；陕西军队则取得了一些战果：杨芳与格布舍消灭了辛斗率领的齐家营一支；丰绅与桑吉斯塔尔在西乡擒获高建启、了结了他的股团；被击败的魏棒棒被平民杀死；杨遇春在川北击溃李彬。其中一场战斗中，杨遇春的人马俘获了许多此前被杀叛军首领的亲属。^95 四川剩下的大股只有夏末从湖北返回的汤思蛟、刘朝选一股。在梁山、大竹与垫江裹挟了数千人后，它移向嘉陵江。但勒保直到九月中旬——被嘉庆申斥、甚至提到\"军法\"之后——才出发对付这股。然而，勒保所做的，不过把该股赶向北部边境。直到1801年底德楞泰与勒保会合，刘朝选与汤思蛟才被迫分手，各带数百人离去。^96</p>\n<p>三省之中，湖北最接近完成战事。新任巡抚全保五月到达襄阳时奏报：湖北太平无事。整个夏天，湖北军队不断击退窜入竹溪的叛军。汤、刘一股虽在湖北停留良久，却始终无法接近城镇。^97 汤、刘一股离开湖北前不久，嘉庆把年近七十的明亮召回北京——他认为湖北战役大体已经结束。^98 1801年余下的时间里，湖北军队在长江以北的巴东、兴山陡峭群山中，以及竹溪、竹山、房县南部，搜剿小股与零散叛军。最大的两股是曾芝秀与戴四率领的，各有两千来人。^99 1801年底，嘉庆命一直驻襄阳的吴熊光前往鄂北中部，处理涌入该地区的难民，并让他考虑从湖北撤回军队。^100</p>\n<p>尽管听说叛军首领殒命总是兴奋，这一年接近尾声时，嘉庆的沮丧多于喜悦——他的期限一次又一次落空，而三巨头并不分享他对胜利的热切。七月将近时，他把期限延到八九月，认为干爽宜人的秋天是清剿的最佳时节。然而，他又不得不把它改为十月底。^101 为使三巨头负起责任，嘉庆责成三个战场报告剩余起事者的人数。夏末总数达到两万四千时，嘉庆警告额勒登保：他将从这个总数中扣除已消灭的叛军，如果数字降了、叛军却仍在横行，他要拿额勒登保是问。^102 起初，这个办法似乎奏效；总数不断下降。^103 受鼓舞的嘉庆再次愿意赦免投降的起事者，并指示地方官更积极地协助军队围剿零散叛军。^104 十月底总数降到两千时，嘉庆让三巨头在通江会面时讨论战役的收束，期望他们十一月内\"戡定大局\"（kanding daju），新年前肃清全部残部。^105</p>\n<p>但三巨头并不配合。1801年早些时候，额勒登保得知皇帝的数字已降到一万时，辩称他们奏报的数字历来是估计，低于实际；除一万有组织的起事者外，还有三千多名在股团覆灭中幸存下来的零散叛军。然而，额勒登保承认，没有必要保留已部署的七八万军队，建议在大股叛军被击垮后，遣返外省调来的旗兵与绿营兵，用战场本省军队与乡勇清剿，从而大大降低开支。但他回避了乡勇的费用，更不用说裁减他们了。^106 嘉庆对他们削减军队的意愿感到高兴，把额勒登保与德楞泰都升了爵；给选定的将领、旗兵、绿营军官与地方官升赏；还犒赏了军机大臣们。^107 不久，他估计有组织的起事者只剩两千五百、零散的只有三千，便开始筹划战争结束时让额勒登保回京。^108</p>\n<p>然而，除了围剿起事者，还有更重的利害。额勒登保摊牌了：他先请求升赏十几名参与战役的陕西官员。^109 随后他又请求增拨经费犒赏军民——最近要求平民协助清剿叛军残部——因为他出任统帅时所领的一万五千两犒赏银几个月前就用完了。嘉庆爽快同意了额勒登保的第一个请求，却对\"从军费中犒军\"表示不满。不过，他还是同意从他刚拨给川陕两省的四十万两中拿出十万两作犒赏之用——因为额勒登保承诺十一月内了结主要军事行动。^110 然而，对三省仍在雇用的数万乡勇，额勒登保完全缄口不言——尽管嘉庆一再敦促他裁减乡勇以省钱。^111 勒保与德楞泰也没有触及这个问题。只有庆成奏报说，他正在挑选保留精壮的士兵与乡勇、遣散瘦弱者，如果将来陕西设立新的绿营编制，他会挑选一些乡勇补入名册。接到庆成的奏折，一直纳闷三巨头为何对乡勇保持沉默的嘉庆，于十一月二十日颁发了一道关于解决乡勇问题的谕旨。^112 然而，战役中出现的一个转折，打断了他对此事的追究。</p>\n<p>罪魁是苟文明——四川巴州虔诚的教门中人。他四十五六岁，是罗其清的姻亲，1799年罗其清死后接管了四川白号的领导权。^113 正如倭星额与邱兴健所指出的，镇压者忽视了苟文明——没有任何将领负责与他作战——这使他得以长期藏身大巴山，庇护了许多已故叛军首领的亲属。1801年夏，樊人杰离开徐天德后与苟文明会合。随后他们在四川与湖北、陕西交界的险峻边境游荡，与其他几股——包括汤、刘一股——短暂会合。夏末七十五从湖北追汤、刘一股入川时，德楞泰派他去对付苟文明。十月下旬，樊人杰窜扰西乡之后，在通江与苟文明分手，前往湖北。与此同时，苟文明西移广元。^114 他们很可能是在试图迷惑、分散敌人，好让双方都到达各自计划的目的地。</p>\n<p>尽管此前毫无建树，七十五又被德楞泰派去追击苟文明。然而，出发之前，七十五先到太平厅城为其部队领饷，在那里待了六天。十一月十日三巨头在西乡会面后联名弹劾七十五表现拙劣，嘉庆训斥了七十五，命额勒登保调查他的拖延。然而，嘉庆更担心的是苟文明——他已把队伍扩大到两千多人。^115 嘉庆的担忧并非杞人忧天。十一月十二日到达广元与陕西交界后，苟文明趁夜渡过嘉陵江。数日后，他侵入甘肃。七十五赶到广元时，只截住了苟文明的队尾。^116 嘉庆震怒——苟文明侵入甘肃意味着冲突升级，粉碎了他新年前结束战役的计划。他对额勒登保与德楞泰同样怒不可遏：二人既不对七十五采取任何处分，也无心亲自追剿苟文明，只派庆成去对付他。嘉庆倾泻着沮丧</p>\n<p>嘉庆倾泻着沮丧与愤怒，罢免了七十五，并给了额勒登保与德楞泰各一次\"申饬\"。他还斥责勒保：苟文明入甘数日后，他竟还一无所知。^117</p>\n<p>不过，苟文明在甘肃的停留很短暂。无法经甘肃入川，苟文明被庆成与七十五逼回陕西。十一月二十八日（1802年1月2日），苟文明在宁羌渡过嘉陵江到东岸，返回广元。^118 尽管嘉庆对叛乱蔓延甘肃的担忧消散了，此事的发展对他却不是好兆头。额勒登保与德楞泰都持观望态度，行动迟缓被动，尽管嘉庆一再申饬催促。苟文明入甘十天后，额勒登保才到褒城，且就地驻留，派杨遇春率一万人的军队赴甘。额勒登保还让德楞泰留在川北对付一些叛军残部。直到苟文明返回四川，额勒登保才再次移动，与德楞泰会于广元。^119 显然，将领们并不热心于新年前结束战役。</p>\n<h2>谈判胜利，1802年</h2>\n<p>1801年遭受数次毁灭性打击、又失去了徐天德与王廷诏等关键首领之后，叛军正走向瓦解。1801年底，德楞泰估计在逃叛军还有六七千。^120 给养与弹药常年短缺——有时他们只有石头可用——通常避免与镇压者正面交锋。^121 就连最坚定的人也难免被悲观压倒。苟文明对部下说：\"白莲教的劫数已尽，我们迟早都是一死。\"（原文待核，见注释122）^122 然而，几乎没有坚定的叛军投降。1801年夏，德楞泰派两名投降的起事者去劝龙绍周的人马投降。龙绍周把两人都杀了。^123</p>\n<p>坚定的叛军被镇压者称为\"正贼\"（zhengzei），以区别于倾向逃跑或投降的被裹挟平民。正贼大多是湖北襄阳与四川达州、巴州、通江——1796年起义的发源地——的教门中人，许多人是那些起义已故首领的亲戚与密友。在皇帝的默许乃至鼓励下，清军越来越倚重\"大棒\"而非\"胡萝卜\"。尽管德楞泰保持着纪录，所有清军将领与督抚都大批屠杀俘虏，把首领凌迟处死。^124 鉴于这些杀戮是在一些后来获释的俘虏眼前进行的，真正起事者的可怖下场会远近传开，从而帮助坚定残余起事者死战到底的决心。他们保持着以颜色区分的编制，保留着\"元帅\"\"先锋\"\"总兵\"\"旗手\"之类的名号，打着标识各自首领的旗帜。一名首领被杀或被擒后，幸存者中就会冒出新的。尽管他们试图避开敌人，一旦遭遇清军，就战斗到最后一口气——这常常令镇压者们惊叹。^125</p>\n<h3>与苟文明、樊人杰作战</h3>\n<p>1802年开始时，唯一有实力的叛军股团是苟文明的。返回四川后，苟文明沿途吸纳小股、裹挟平民，把队伍扩充到三千多人。在四川，他攻打当地居民的堡寨，裹挟人口、夺取骡马。随后苟文明东移巴州与通江。德楞泰与额勒登保虽然都赶到了四川，却无意迅速消灭苟文明一股，无视\"正月内了结此股\"的期限，还抱怨各自兵力太少——每人只有两千名士兵。^126</p>\n<p>为警告将领们，嘉庆罢免了七十五。在十二月初九日给额勒登保与德楞泰的一道长谕中，他把七十五在太平滞留六天比作两年前魁伦滞留雷音铺——后者给了冉天元联盟渡嘉陵江的机会。^127 然而，额勒登保与德楞泰为七十五辩护，迫使嘉庆放弃了处决七十五的打算，接受了他们\"只降级、留用军中\"的建议。^128 仿佛要维护自己严厉正直的统帅形象，额勒登保与德楞泰提议对几名下级军官——大多是汉人——处以包括死刑在内的更重惩罚，罪名是在对苟文明作战中的过失。^129</p>\n<p>新年（1802年2月3日）前数周，前线的消息喜忧参半。在陕西，从四川来的数百名叛军于十二月初四日在汉阴北渡汉江，使江北——那里原本只有两三百名起事者——的局势恶化。^130 数日后，德楞泰在通江击溃苟文明，把他的队伍减到不足两千。^131 嘉庆先为渡江震怒，随后又为德楞泰的胜利欣喜。他尤其受额勒登保与德楞泰承诺的鼓舞——他们说苟文明一股十天内可以全歼，这样正月内完成战役仍可实现。^132 然而，新年临近，额勒登保与德楞泰都放慢了脚步。鉴于胜利在望，嘉庆没有给他们任何新年犒赏。即使听说额勒登保号召陕西官员捐出\"养廉银\"为部队购置冬衣，他也没有被打动而打开钱袋。^133</p>\n<p>一个清苦的新年对皇帝并不有利。额勒登保留驻川北，派德楞泰追苟文明到大宁。^134 但德楞泰到达大宁后，把作战交给刚从勒保那里要来的薛大烈。除夕，德楞泰借口一场应时的降雪，停止了所有行动——尽管薛大烈刚在一场战斗中击败苟文明，叛军正陷于绝望：苟文明的人马杀马骡充饥，数十人上吊自尽。^135 趁德楞泰懈怠之机，苟文明逃走，越过边境进入陕西。德楞泰不愿离开大宁——他以前在那里度过的假日与休整——只派薛大烈率五千人的部队追击苟文明，并告诉皇帝自己必须留驻，因为许多叛军残部从湖北来到了四川。震怒的嘉庆点名批评额勒登保与德楞泰不知羞耻，哀叹自己对二人的诸多恩赏竟未能激励他们更努力。^136</p>\n<p>一到陕西，苟文明就迅速向汉江移动。正月十八日黎明前，苟文明一股在西乡涉过冬季水浅的汉江。苟文明渡江三天前——元宵节那天——额勒登保跟丢了敌人。然而，他抱怨起事者跑得太快，雪覆的山路对他的部队太滑。在江北，苟文明的人马再次甩掉额勒登保，消失在秦岭中。^137 嘉庆大为震怒，批评额勒登保及其部下只顾庆祝新年而疏忽了敌人，并降了额勒登保的爵位与顶戴。^138 苟文明进入广阔的秦岭——清军此前在那里已被证明无能为力——可能使那里的叛军残部复活。^139 至少，它使嘉庆正月内完成战役的计划落了空。（地图5.2）</p>\n<p>为扭转局面，嘉庆转向新策略。二月初二日，他向三省全体将领督抚颁发了一连串谕旨，责成他们各自负责肃清本省起事者（他开列了各省仍在世的叛军首领名单）。他敦促府县官员发挥更积极的作用，责令其书吏差役报告叛军行踪。^140 此举意在分散战役指挥，使之成为三省各自的本地事务。两周后，嘉庆又朝这个方向迈了一步。他任命额勒登保为西安将军，以便额勒登保能指挥陕西全体官员。他虽然保留额勒登保\"经略大臣\"之衔，却宣布额勒登保不再是战役统帅——他认为没有必要设经略大臣这一最高临时军职去对付\"贼匪残部\"。^141 这一转变与皇帝对战役的新认识一致。如上一章所述，嘉庆1800年底已经认识到：中枢政府用国库经费支撑战役是个错误，本应把它当作本地事务、用本省资源供给。</p>\n<p>额勒登保性情使然，没有对这次事实上的降职表示不满。然而，手握两万多名士兵与乡勇，额勒登保数月未能消灭苟文明及其包括妇女老人在内的一千五百人。牲口已失，苟文明把队伍分成小队，自己率五百人深入森林。为搜剿分散的起事者，额勒登保也把部队分成小单位。零星杀死几十个或更少的起事者，额勒登保却未能把苟文明赶出森林。每隔十天左右，额勒登保就上一道奏折。无一例外，他抱怨苟文明的游击战术与冰雪、淫雨等天候造成的困难。^142 春末陕西其他叛军股团大多被歼灭后，嘉庆的耐心耗尽了。有一次，他爆发了：\"额勒登保所统之兵，多于贼匪十倍，竟不能攻、不能堵、不能追、不能截，真为尔等羞愧！\"（原文待核，见注释143）^143</p>\n<p>厌倦了皇帝不断的施压与批评，额勒登保转入了守势。^144 初夏的一道奏折中，他坚称自己的将领们都努力工作，有时徒步跋涉于无路的森林。他虽为未能迅速了结苟文明而愧疚，却宣布他无法按皇帝要求的那样在十到二十天内消灭此股。^145 五月二十七日接到这道奏折，被激怒的嘉庆立即下令：额勒登保与扎克塔尔象征性革职留任（gezhiliuren）。他威胁也要惩处杨遇春，但这一次没有。痛斥额勒登保时，嘉庆讥讽他的借口：如果说群山不可进入，山里为什么还有开垦玉米地的居民？叛军——连妇女——都能到达那些地方，部队为什么不能？愤怒的皇帝再给额勒登保一个月期限：消灭苟文明一股或亲手擒获苟文明，否则罢免惩处。同时，嘉庆为杀死或擒获苟文明设下高额赏格。^146 他还指示陕西巡抚陆有仁监视额勒登保与扎克塔尔，奏报他们降职后有无改进。^147</p>\n<p>在一定程度上，嘉庆的怒火也源于四川与湖北局势的恶化。1802年开始时，四川只有几个小股，若未被消灭，每股也从几百人缩减到几十人。^148 新年前不久，勒保甚至奢侈到返回达州城处理司法案件——至少他是这么说的。^149 然而，正月里，夔州府出现了数千名新叛军。勒保刚一宣布已把他们了结，就会奏报又来了更多叛军。嘉庆别无选择，只能延长四川完成战役的期限。^150</p>\n<p>那些\"新\"叛军主要来自湖北。三峡以北，巴东、归州与兴山县境的大山陡峻，为被击败的起事者提供了庇护所；有些股团在那里藏身了一两年。^151 徐天德死前曾号召剩下的叛军退到巴东与四川交界处休整、筹划下一步。^152 到1801年底，各股残部汇聚山中。为获取给养，起事者或攻打平民堡寨，或裹挟居民勒索赎金。整个冬天，清军很难追踪他们，而起事者的蛰伏帮助造成了湖北太平的印象。^153</p>\n<p>1801年底与苟文明分手后，樊人杰也来到了这个庇护所。作为叛乱唯一幸存的谋主，樊人杰用他们经卷中描绘的预言鼓舞起事者：鼠年（1804年）一开始，他们的时运就会扭转——因为这一年将开启一个新的六十年轮回。樊人杰致信他省叛军首领，请他们来鄂。他计划在长江以南的施南府煽动起事——因为他相信，他们的存亡系于新的起事。为隐藏行踪，樊人杰让他的一个弟弟——所谓的\"二掌柜\"（erzhanggui）——带领他一直关联的黄号，同时散布樊人杰已死的谣言。^154</p>\n<p>年后不久，由于给养耗尽，起事者开始走出群山。为告知其他股团自己的动向，叛军把单个的字——如\"川\"（四川）、\"楚\"（湖北）或某首领的姓氏——写在树上或房屋上。沿长江北岸，一些人进入四川夔州，裹挟当地居民、劫掠骡马以扩充队伍。^155 显示出复苏迹象的他们夜袭清营，一次战斗中杀死十四名清军军官，甚至试图攻打巫山县城。留在湖北的樊人杰把自己的黄号与戴四、曾芝秀、王国贤率领的股团合并。无法实现南下长江以南的计划，樊人杰的联军于二月下旬北移房县，目标直指襄阳。但被全保与长龄挡住了。^156</p>\n<p>如果说面对苟文明渡汉江时，嘉庆推迟了二三月内结束战役的期限，那么三峡地区叛军表面上的复苏则迫使他彻底放弃了它。他甚至考虑向湖北增兵。^157 然而，对德楞泰来说，增援不是关键。德楞泰虽然以\"夔州出现新叛军\"为由留川、没有追苟文明入陕，却没做什么实事。随后他宣布将赴鄂对付三峡地区的起事者，赢得了嘉庆的称赞，但他一面拒绝增援，一面要求给些\"犒赏\"以\"激励\"部队。一无所获后，德楞泰把出发推迟了数月，借口与夔州叛军作战——他主要是把他们逐回湖北，其规模可能被夸大了（他还利用夔州可能发生新起事的谣言）。终于准备出发时，他又突然反复更改计划、行动迟缓，不顾皇帝的催促、警告与责骂。直到四月初，吴熊光提出把湖北战场的全部军队指挥权让给他、并保证后勤供应，德楞泰才进入湖北。^158</p>\n<p>此时，樊人杰的联军已被湖北军队从房县逼回三峡北岸。德楞泰抱怨联军北上期间扩大到五六千人、有数百匹骡马，却夸口说自己能迅速把它减半。两场战斗后，他做到了——据德楞泰奏报，此后叛军只剩两千。^159 随后德楞泰让湖北军队追击樊人杰联军，自己则转而对付蒲天宝——通江的老起事者，自封\"元帅\"。蒲天宝藏身三峡以北的群山，1801年底出山，在兴山、归州与东湖一带游荡，试图与樊人杰会合。蒲天宝股团的核心约两千名战士，极其凶悍，战斗中死伤众多也不后退。五月初在房县与竹山的战斗中，德楞泰的人马给了蒲天宝一股沉重的打击，据说把它减到一千四五百。此时，长龄已把樊人杰联军压向竹山（但戴四与其数百人去了兴山）。德楞泰决定与长龄会合先打樊人杰，再对付蒲天宝的余部。^160</p>\n<p>初夏的雨季抬高了河流水位，限制了起事者的机动。^161 五月三十日，被逼到竹山南部暴涨的坪口河岸边，樊人杰、曾芝秀、王国贤及许多部下纵身跳入河中，随即被巨流卷走。数百名其他叛军及其家属或被杀或被俘；只有一小部分逃脱。曾芝秀与王国贤虽然生还，樊人杰却极可能已死。^162 鉴于樊人杰是最后一个在襄阳与四川两派中都享有威望的有远见领袖，他的殒命显然是个分水岭，标志着残余叛军末日的开始。^163 嘉庆认为樊人杰是徐天德死后最危险的叛军首领，闻讯欣喜若狂，对德楞泰及湖北其他领导人——包括吴熊光——大加恩赏，也犒赏了北京的军机大臣们——由于战役久无重大胜利，他已有些时候没有这样做了。^164</p>\n<p>樊人杰既死，嘉庆对额勒登保施加了更大压力——额勒登保似乎无意在夏天之内了结陕西的苟文明。^165 六月十五日，嘉庆给额勒登保颁发了一道清醒的谕旨。他再次批评其进展迟缓，指示他广泛宣示德楞泰在湖北的胜利，尤其是樊人杰之死。他宣布：任何叛军——包括苟文明——只要投降，都可赦免（但苟文明要流放新疆）。^166 此后嘉庆继续催促额勒登保在七月内消灭苟文明。事实上，六月初，额勒登保已把追剿苟文明的任务交给了杨遇春——他此前在对付另一股叛军。杨遇春探明苟文明的藏身之处后，让他的人马从几个方向逼近该地，随后俘获了苟文明的妻子与其他亲属——这促使嘉庆恢复了额勒登保与扎克塔尔的职位。^167</p>\n<p>杨遇春步步逼近，又断了粮，苟文明与长子苟朝九分手，各率一百人。数月前——1802年正月——苟文明自觉可能活不成了，就把两部经卷与自己的入教凭证——都用桐油浸过的（因此防水的）绸布包着——传给了苟朝九。儿子离开数日后，苟文明解散了自己的队伍，让大多数人各自逃生，只留十几人随行。七月十七日，他的人在一间无人的棚屋里找到一些玉米，数日未进食的苟文明生火煮玉米。炊烟使他暴露在杨遇春的部队面前。他的人全被杀死，苟文明跳下悬崖。身负重伤的苟文明被部队找到杀死。^168</p>\n<p>消息于七月二十六日传到皇帝那里——他刚到热河避暑山庄。这是嘉庆即位后第一次赴热河，到木兰围场行围——这是康熙皇帝开创的皇家惯例。^169 事实上，一些汉人朝官曾批评嘉庆在战役进行之际作此之行。苟文明之死想必减轻了他的负罪感——如果有的话——证明战事行将结束、那些批评目光短浅。被喜悦、宽慰与重回避暑山庄唤起的情感压倒，嘉庆向军机大臣们宣布苟文明死讯时，忍不住流下了眼泪。撇开对额勒登保的芥蒂，嘉庆把他的爵位升为一等伯，发还双眼花翎，外加众多礼物。苟文明殒命前几天，额勒登保曾请求把杨遇春从甘肃提督调任陕西提督——庆成被召回北京后空缺的更重要职位。额勒登保第一次大加称赞杨遇春。1800年初就开始注意到杨遇春的嘉庆，批准了这一调动。^170</p>\n<h3>乡勇问题</h3>\n<p>得知樊人杰死讯后，嘉庆立即着手善后（shanhou）——\"收尾与重建\"——他谈过许多次，却一直没能做多少。此时，将领们已开始遣返外省调来的部队。^171 但对嘉庆来说，最要紧的是遣散乡勇——1802年中，湖北、四川、陕西、河南、甘肃五省由军队与地方官雇用的乡勇或许还有六七万。皇帝早就意识到这场战役中使用非常规兵员的潜在危险，并一再表达关切；他担心的是战役结束时如何安置他们——因为许多人既无家庭，又无生计。最坏的情况下，若安置不当，经年军旅生涯惯于暴力的他们，就会沦为盗匪，或加入残余的起事者。同时，继续雇用他们的巨大财政代价，也凸显了嘉庆急于裁减他们的迫切心情。^172</p>\n<p>早在1799年底——各战场起事者人数已大幅减少时——低级官员杰聪就向朝廷呈上了战后重建建议。最吸引嘉庆注意的是杰聪关于为遣散乡勇提供生计的建议：或分给一块无主之地，或编入军队，或转为屯垦。^173 嘉庆虽同意一些乡勇可以补入绿营，却担心：这么多无家可归、无业可做的乡勇，绿营没有足够的位置。于是他征询当时战役主要领导人们——额勒登保、德楞泰、松筠、魁伦与广兴——的意见。^174 然而，1800年初叛军渡嘉陵江打断了这场讨论。直到四川战场稳定之后，嘉庆才重新拾起。在五年三月十五日一道关于战后重建的谕旨中，嘉庆倾向于为无家可归的乡勇寻找可耕地。他显然与廷臣们商议过此事，指示：叛军与死难或流离居民留下的无主之地，以及秦岭等处尚未开垦的土地，都可以分给他们。^175 然而，讨论没有继续下去——皇帝与将领们很快就被1800年余下时间里的事务缠住了。^176</p>\n<p>1801年初，嘉庆再次拾起这个问题。六年二月三十日，在一道关于安置难民与乡勇的谕旨中，他向战场各省的督抚征询意见</p>\n<p>——把起事者的土地分给乡勇的可行方案，同时声明中枢政府不为这项工程提供财政支持。^177 一个多月后，督抚们的答复才到。有意思的是，作出答复的三位督抚——勒保、长麟与陆有仁——都回避了使用起事者土地的问题。相反，他们都主张把乡勇补入绿营，或雇为\"民壮\"（minzhuang）——地方衙门里的武装人员。^178 长麟与陆有仁奏报说，陕西没有多少叛军财产——因为大多数叛军来自湖北与四川。朝廷后来才明白，起事者的土地早已没了踪影。它们是地方官员的猎物，或已被变卖，或已被侵占。长麟与陆有仁试图把问题推回给国家，提议先把所有随军作战的乡勇——所谓的\"随征乡勇\"（suizheng xiangyong）——转为\"余丁\"（yuding，其饷银远低于正式士兵），出缺时再升为正式士兵。但这不是皇帝与中枢政府想要的——它经常性地耗费巨大。经两个月审议，军机大臣与兵部否决了这一提议，要求战场各省督抚另谋方案。嘉庆与他们立场一致。^179 然而，没有一省作出回应。中枢政府与战场省份之间僵持的谈判，突出体现在战役进展的迟缓上。真正阻碍战役结束的，是数万乡勇，而非几千名起事者。整个战役期间，乡勇饷银是最大的军费开支之一，而借发饷之名侵吞军费的行为严重而普遍。尽管所有战场省份长期以来一直在遣散受雇乡勇（到1802年，人数已远少于早先），这项计划在战役接近尾声时陷入了僵局。战役主持者们集体努力，不肯一下子放掉他们。</p>\n<p>受樊人杰之死鼓舞，嘉庆决定不再与战役主持者们取得一致，径直推进。六月十六日，他命额勒登保裁减乡勇，并且要在撤回正规军之前做——因为正规军在，一旦被遣散的乡勇闹事，可以维持秩序。^180 不久，嘉庆派高级旗人兴魁赴陕，向额勒登保当面递交一道关于裁减乡勇及其他奏凯事宜的谕旨。^181 此后数月，嘉庆一再重申：在所有善后事务中，遣散乡勇最为关键。他严厉批评将领与省级官员们制造了这个耗资巨大的方案，决心与他们撇清关系。然而，他对这件\"极为重要\"之事不拨一文钱。相反，他说这是地方事务，责成额勒登保、德楞泰与省级官员设法落实。他唯一的指示是：乡勇应有选择——参军或还乡——而主事官员既不可过于专断，也不可过于宽纵。^182</p>\n<p>如果说朝廷不愿打开钱袋，那么毫不奇怪，前线的任何人都不会在遣散乡勇时慷慨解囊。七月中旬的一道联名奏折中，额勒登保、惠龄（长麟的陕甘总督继任者）与陆有仁提议：陕西籍随征乡勇每人赏银三两（头目与立功者四两），守卫关卡要地的乡勇每人一两；四川、湖北籍者每人二两。钱款由护送的官员在他们抵达家乡时发给他们。沿途地方官负责提供食宿。^183 鉴于所议赏银大致相当于一个月的饷银，这个数额远不足以安身立命。然而，嘉庆并不觉得有什么问题。事实上，他告诉吴熊光：他同意乡勇遣散时应当给些赏银，但不可过于优厚。他更担心的是他们的归途与重新融入地方——因为他听说，返乡之后，前起事者与前乡勇互相寻仇。^184 此后数周，嘉庆密切关注此事，如果军报中没有相关信息，他就频频查问。具体而言，他想知道：他们的归途是否平静，是否到达了家乡，是否得到了妥善安置。^185</p>\n<p>奏报到达时，基本上都是好消息。据1802年秋提及遣散乡勇的五六道奏折，一切都处理得小心周到、一切顺利。在陕西，额勒登保与惠龄任命一名文官朱勋与一名武官王兆梦主持此事。惠龄在一道奏折中详细记述了守备孙荣元麾下一百三十二名乡勇被遣散送归的情形。除八名愿意参军者外，其余一百二十四名乡勇都由官员护送回乡（五十一名去四川，十四名去湖北，五十三名去西乡，五名去陕西其他县）。每批人都发给一面大旗，上书四字\"凯旋乡勇\"（kaixuan xiangyong）。七月十一日从汉中出发前，他们的赏银当着他们的面逐一包封，交给护送官员。那些乡勇欢欣感激，高声欢呼。由于他们声称武器是自己的，收缴武器时每人另给五钱银子。陕西当局还沿途安排食宿运送，并通知湖北、四川当局派员到边境迎接。四川籍乡勇按惠龄之命由朱勋亲自护送。^186 接到惠龄的信后，勒保派广元的知府、道员与知县到广元神宣驿——过省界后的第一站——迎接那些乡勇。与陕西一样，被遣散的乡勇被护送到家乡，沿途供给口粮与草棚。到达目的地后，地方官员把封存的银两发给他们。到十月中旬，广元已接收了九批遣散乡勇。数十名贵州籍者经四川送回贵州。^187 由于湖北不是陕西、四川乡勇的主要来源地，吴熊光奏报说，到八月中旬，只有四批遣散乡勇——每批二十至五十人——从陕西经汉江送到竹溪或郧阳，其中大多数有家可归。^188</p>\n<p>沿汉江北岸，从陕西白河到湖北谷城，三千一百名河南乡勇驻守二十一个关卡——他们大多募自河南邓州、新野与唐县，全都有生计。十月，江防交由从豫陕西部边境撤回的河南绿营兵接防后，他们被遣散了。每人赏银一两五钱。河南当局效法陕西先例，派地方官护送回乡，沿途供给口粮食宿。^189 在湖北，大多数乡勇是本地招募的，大多有产有业。三峡以北，几乎所有乡勇都是巴东知县尹英图从长江以南的施南府募来的。尹英图已升任施南知府，吴熊光便委托他监视那些被遣散的乡勇。苟文明死后，吴熊光裁减了守卫鄂陕边境关卡要地的数千名乡勇。吴熊光给湖北所有被遣散的乡勇发了些银米——尽管他没有说明数额。吴熊光奏报说，他们乐于回乡务农、领取赏银。^190</p>\n<p>尽管奏报大体乐观——这常常令嘉庆高兴——1802年底的官方文书中还是可以察觉一些保留之处。起初，大多数被遣散的乡勇是\"防守乡勇\"（fangshou xiangyong），而非\"随征乡勇\"——后者的报酬更高。据德楞泰说，当时三省的随征乡勇有一万七千五百人（陕西六千九百、湖北四千六百、四川六千）。^191 但实际数字可能高达两万五千以上。尽管嘉庆不断催促，三省都迟迟不裁他们。在陕西，到九月已裁减的七千名乡勇中，只有一千三百名是随征乡勇。正如额勒登保所解释的：正规军分散各部队多年，如今归建原制，造成了一些空缺，乡勇暂时可以补上。他承诺所有部队归建后把他们全部裁掉。当时，他已让朱勋登记所有剩余乡勇，弄清他们是想回乡还是参军。^192 在四川，几乎所有随征乡勇（据勒保说五千多人，但据档案所披露的信息可能约有八千）都被留了下来。为挡开嘉庆对他裁减乡勇迟缓的批评——他的第一份奏报直到九月十九日才到北京——勒保说：他已派两名官员到各军中登记每个乡勇的籍贯、家庭与财产信息及参军意愿，并向皇帝保证会在撤回正规军之前裁掉他们。^193 事实上，吴熊光也没有裁湖北的随征乡勇。同时，到1802年底，三省谁也没有裁撤防守乡勇。^194 总体而言，1803年初第一次宣布胜利时，乡勇总数可能还有四万五千至五万。^195</p>\n<p>另一个障碍是：一些被遣散的乡勇没有回乡。据四川官员说，实际到达广元的乡勇人数与陕西官员移交的花名册不符——这意味着有些乡勇可能在到达省界之前就脱队了——尽管勒保解释说，有些人可能落在后面或出了意外。^196 此外，与将领们预期的相反，大多数乡勇不愿补入绿营。如上所示，陕西首批裁撤的一百三十二名乡勇中，只有八人选择参军。陕西被遣散的一千三百名随征乡勇中，只有二十四人参军。^197 有一段时间，将领与督抚们在论证扩充本省绿营时，都提到这些经验丰富的乡勇可以利用。^198 然而，对那些事实上的雇佣兵来说，当正式士兵并没有吸引力——他们当乡勇时享有更多的自由与更高的报酬。</p>\n<p>总之，到1802年底，乡勇的遣散远未完成。两个主要问题凸显了战场省份对一次性裁撤乡勇的抵制。其一，乡勇有用。多年来，他们在战场上比许多正规军更顶用，使旗兵、绿营兵与军官们得以留在城镇村庄里养伤治病——无论真假。尽管最后的几股起事者人数很少，却常常身处难以到达的地方。因此，那些经验丰富、吃苦耐劳的乡勇仍不可或缺。其二，是钱的问题。对皇帝而言，裁乡勇意味着大幅削减军费。但对前线主事者来说，乡勇一直是索要经费的最重要筹码之一。更重要的是，乡勇的饷银是指挥官、军官与地方官员不义之财的来源。乡勇自己也试图为自己的福祉讨价还价；有时他们集体行动，与上级谈判。没有慷慨的犒赏，很难解散这批训练有素的战士。然而，随着最后胜利临近，嘉庆在钱上越来越紧；他与战役各方几乎没有共同立场。</p>\n<p>事实上，麻烦的预兆已经抬头。由于湖北在1802年更是个热点，从春末起，许多被遣散的乡勇——大多数是四川人——前往湖北，谋求在那里受雇。担心不接纳他们会加入叛军，长龄与吴熊光把一些人编入了湖北乡勇。嘉庆也指示：至少供他们口粮，不许他们生事。不用说，湖北不可能照顾所有人。^199 到秋天，他们中的一些人已出现在湖北的起事者中间。战斗中，他们比起事者更老练、更有效——因为他们熟悉清军。^200 尽管其他地方也发生过类似情形，只有吴熊光提醒了皇帝这一事态。^201 吴熊光1801年春才出任湖广总督，不必为战役早期军费账本上的众多窟窿负责。因此，他的声音常常与三巨头不同。</p>\n<h2>为奏凯收尾</h2>\n<p>与此同时，战役本身并没有像皇帝希望的那样顺利走向尾声。在四川——自春末起就没有像样的叛军股团——清军正清剿只有几十人的小股，包括刘朝选与汤思蛟的。^202 然而，勒保似乎并不急于清剿，把期限一推再推。秋天，陕西与湖北的起事者——许多原籍四川——在额勒登保与德楞泰的压力下渗入四川时，勒保声称四川的起事者总数已回升到一千以上，从边境蔓延到腹地。但嘉庆不太担心，认为入川的不过是些零散残部。他催促勒保加快行动，同时保持对湖北的关注。^203</p>\n<p>在湖北，焦点是对蒲天宝的作战。蒲天宝从房县、竹山返回兴山后，戴四、崔宗和等人重新与他合兵。他们一起在兴山北端陡峭的群山上掘壕自守。尽管德楞泰向皇帝保证决战临近，樊人杰死后他却停了几周。直到六月下旬，他才摧毁叛军的山顶堡寨，把他们减到数百人。然而，德楞泰又放慢了脚步，未能在七月消灭蒲天宝一股——它在三峡以北的群山中穿梭，吸纳其他股团的残部。嘉庆多次申斥德楞泰之后，于七月二十七日——得知苟文明死讯的次日——给德楞泰颁了一道谕旨，告诉他：苟文明已死，四川即将肃清，湖北是唯一还有数千起事者的省份。嘉庆提醒他七十五的前车之鉴，并问他是否打算等额勒登保赴鄂去了结蒲天宝。十天后，嘉庆果然命额勒登保前往湖北。^204 显然对德楞泰的拖延恼怒，吴熊光也请求额勒登保赴鄂，说德楞泰的兵力不足以对付其他几股起事者。^205 或许是不愿让额勒登保接管湖北战事，德楞泰在八月初加快了行动。德楞泰显然想灭哪股就能灭哪股——数日内，他就粉碎了蒲天宝的余部；蒲天宝率其最后的寥寥数人逃往竹溪，八月十二日跳崖而死。嘉庆没有升德楞泰的爵。相反，他以赏给德楞泰之子苏冲阿一件黄马褂表达赞赏——苏冲阿随驾木兰行围时射杀了一头狍子。^206</p>\n<p>蒲天宝死后，德楞泰留鄂肃清蒲天宝的残部与其他几股。九月初，他在鸡心岭——鄂、川、陕三省交界处——击溃了熊翠率领的六七百人，这是剩余股团中最大的一支。^207 额勒登保越过边境到竹溪后，在湖北待了几周，却没有参战。他宣称湖北局势已经好转、而陕西战事进展不够迅速，便返回了陕西。^208 嘉庆派额勒登保赴鄂，本已撤销了他早先\"额勒登保只管陕西战场、不再担任全役统帅\"的决定。然而，没有正式的复职，额勒登保似乎不愿把职权延伸出陕西。此外，他肯定知道德楞泰无意与他在湖北分享舞台。直到第一次宣布胜利前夕，额勒登保一直守在陕鄂边境，拦截被湖北军队赶入陕西的叛军；他再也没有越过边境到湖北。^209</p>\n<h2>宣布胜利，1803—1805年</h2>\n<p>眼看漫长战争行将结束，嘉庆皇帝早在1801年底就讨论过宣布胜利（zoukai）之事。在六年十月十一日给额勒登保与德楞泰的谕旨中，他指示二人开始从战区撤出正规军，或留用部分已部署部队、或用本省军队清剿叛军残部。他计划先让德楞泰进京陛见、谒乾隆陵，待德楞泰返回四川后再召回额勒登保。嘉庆急于把战役的收束抓在自己手里，尽管他强调：他不要一场仓促的胜利，以免给未来留下隐患；并要求两位将领说明——如果他们觉得还不到时候——战役何时可望结束。^210 不久，嘉庆对报捷仪制作了进一步指示。他要一份由全体——两位军事统帅（额勒登保与德楞泰）与三位总督（勒保、惠龄与吴熊光）——联名的奏折，经日行六百里的驿马快递送达。由于战役是对付内部叛军而非外敌，奏折呈进朝廷时不得用红旗。^211</p>\n<p>然而，1802年初三峡地区叛军的再起使讨论搁置。直到苟文明被杀，嘉庆才重提此事。他给额勒登保三周时间完成所有军事行动，以便八月中旬宣布胜利。^212 但这个期限没有实现。蒲天宝被除时，嘉庆再次确信久盼的胜利终于临近——如果叛乱始于湖北，或许也注定终于湖北。他责成额勒登保与德楞泰在九月内消灭所有残余起事者。同时，他对报捷奏折加了一项要求：必须用红绸衬里的黄缎封套。此后数月，他每收到一条令人鼓舞的消息就重申一遍。^213</p>\n<p>鉴于胜利没有明确的标志——叛军没有总部或据点可供镇压者攻克——而且宣布胜利后对叛军残部的清剿仍将继续，\"胜利\"注定是任意的；尺子要由皇帝来定。九月下旬，嘉庆裁定：湖北五名叛军首领（熊翠、熊方青、戴仕杰、崔宗和与胡明远）全部被杀、只剩一百名叛军时，就可以上黄封红衬的报捷折；若还有一两名首领在逃，只能用黄封；若在逃起事者超过一千，他就不认这个胜利。他还坚持：报捷折只能在三省都肃清有组织的叛军之后才上——他否决了额勒登保\"两省肃清、把所有残余叛军赶进第三省即可报捷\"的提议。^214</p>\n<p>鸡心岭附近的战斗之后，德楞泰估计湖北还有两千名起事者。但吴熊光更乐观。蒲天宝死后一直游说出局的吴熊光，向皇帝保证湖北已近尾声。^215 受吴熊光乐观态度的鼓舞，嘉庆坚持九月内结束战役。他甚至愿意在一两名起事者首领在逃的情况下认领胜利。他还宣布：投降的叛军可以赦免。^216 为向将领们施加更大压力，他催促他们继续遣返外省调来的部队。^217 在这种情况下，三巨头很难再把宣布胜利拖下去。九月底，额勒登保奏报说，他认为大约十天内即可确保胜利。十月初五日——他生日前一天——接到这道奏折，嘉庆重申：报捷折不得上，除非只剩少量零散叛军、一两名首领下落不明，使他们绝无可能复活叛乱。^218 事实上，为使自己的生日庆典更圆满，嘉庆同意了这样一个选项：三个战场可以在十月内相隔数日各自呈上黄封红衬的报捷折。但生日过后，他收回了批准，再次要求三省大多肃清起事者后上联名报捷折。^219</p>\n<h3>第一次胜利</h3>\n<p>冬至（dongzhi）将至，嘉庆指示额勒登保确保报捷折在冬至前到达，以便他在北京城南的天坛举行南郊大祀（nanjiaodasi）时，把这胜利的消息禀告列祖列宗，感谢他们在漫长战役中的庇佑。^220 同时，嘉庆给额勒登保加了一个新兼职：蒙古镶蓝旗都统；给三巨头各赏一件驯鹿皮褂；对四川的军官、士兵与乡勇大加恩赏。此外，他指示将领们招降最后的起事者。^221</p>\n<p>十月中旬，德楞泰在房县与兴山摧毁了戴仕杰、崔宗和与胡明远率领的股团。^222 不久，他又在巴东消灭了另一股数百人的队伍——由达州的一名老叛军率领。^223 德楞泰估计湖北只剩几百名零散起事者，嘉庆便催促德楞泰返回四川，并许诺：如果十一月内战役结束，他可以在北京过年。^224 德楞泰离开湖北后，吴熊光主持搜剿叛军残部。十一月初，吴熊光奏报：本省已无叛军。然而，吴熊光很谨慎。他暂停裁减乡勇与遣返部队，认为即便几个坚定的起事者也可能使叛乱复燃。此外，湖北最近因病伤失去了长龄与孙清元两位将领。^225 在庆成到任之前署理湖北提督的吴熊光，想在本省尽可能多地保留军事力量。他的审慎将被证明是明智的。^226</p>\n<p>在陕西，苟文明死后，秦岭中只剩苟文明残部的几个小股。尽管他们仍能给清军造成难堪的伤亡，人数却不断减少。杨遇春与杨芳率领的部队不时杀死几名叛军，但看不到尽头。^227 嘉庆给了惠龄象征性处分，并申饬了兴魁与杨遇春，但不太担心——他认为那些残部可以在胜利之后再处理。^228 在他看来，更关键的地点是陕鄂、陕川边境——因为湖北的叛军在德楞泰的压力下不断试图突入陕西。先是穆克登布与扎克塔尔越境到竹溪、竹山（十月初他们消灭熊方青、熊翠一股时，杀死了熊方青、打伤了熊翠），对付湖北来的叛军。随后，额勒登保与扎克塔尔前往四川太平，杨遇春移向陕西南境，把秦岭的清剿留给杨芳——遵嘉庆之命。^229</p>\n<p>四川虽然久已平静，它与陕西、湖北漫长而多孔的边境却容易遭到渗透。勒保抱怨更多起事者从湖北、陕西被赶入四川，试图以一幅四川告急的图景打动朝廷，尽管他承认只有三股相对可观。嘉庆申斥勒保截击不力，并不断催促德楞泰与额勒登保前往四川。^230 十月下旬，四川最大的一股——由黄号、蓝号与线号一千多名残部组成——移向川北边境，企图入陕渡汉江。但他们先在紫阳被额勒登保伏击，随后又遭穆克登布打击。数日后，十一月初七日，穆克登布在通江与陕西交界处再次将其击溃，把它减到四百人。^231 这消息与额勒登保\"一二十日内可望奏凯\"的预测，使皇帝大为振奋，对额勒登保、穆克登布及其部队大加升赏。此后数日，嘉庆继续向三巨头施压，尽管他没有忘记同时告诫他们要彻底。^232</p>\n<p>十一月二十八日冬至，嘉庆在天坛典礼后回到紫禁城时，一道奏折</p>\n<p>从额勒登保与勒保那里到达——他们在太平会过面——奏报说，他们正计划进入清剿阶段，一旦德楞泰加入，就收束战役。显然是想从皇帝那里求得保证——他确实会允许这场\"胜利\"是不完整的——两人提醒他：三省还有两千来名起事者。^233 嘉庆坚定而明确地表示：只要没有主要叛军首领在逃，报捷折就可以上。鉴于冬至期限已破（但嘉庆论证说：额勒登保与勒保发出这道奏折已十天，此刻\"胜利\"可能已经取得，因而算是赶上了期限），他要求报捷折在中枢政府封印（fengyin）之前送到——封印通常在年前两周开始——以便他在新年庆典上当着蒙古王公与其他宾客的面宣布胜利。为确保奏折赶上这个只剩三周的日子，他责成他们立即发出。他告诉他们：京城已经流传战役即将结束的传言。^234</p>\n<p>这样一来，无论前线情况如何，都难以再拖。十二月初，德楞泰在太平与额勒登保、勒保会合。他们先另上一折，数日后再发出报捷折，^235 尽管军事行动远未结束。在四川，还有几股，各数百人。在陕西，秦岭中仍可见零散叛军，一些人已离开，向西南奔向略阳与勉县。就连湖北也奏报房县、竹山、竹溪有几小股。^236 嘉庆清楚地知道战事将继续，便取消了额勒登保与德楞泰计划中的进京之行，责成额勒登保负责陕西清剿，让德楞泰与勒保主持四川清剿。^237</p>\n<p>封印前几天，七年十二月十六日（1803年1月9日），红绸衬里、黄缎封套的报捷折到达北京；署名者为额勒登保、德楞泰、勒保、惠龄与吴熊光。他们盛赞已故乾隆皇帝与嘉庆皇帝的圣德、睿智、训导与慷慨的财政支持，但对这场\"胜利\"的界定仍小心翼翼。他们虽声称所有知名叛军首领已被消灭、并宣布战事结束——因为所有叛军股团都已被清除——却不肯说三省已肃清叛军。^238 嘉庆不让欢庆时刻蒙尘，把这场\"胜利\"当作货真价实来对待，不仅对三省将领督抚大加升赏，还赏及皇子、军机大臣与京城全体官员军队。他还赦免了战役期间受惩处的人，并准备给受战乱影响的地区蠲免赋税，对全国被革职降职的官员普施恩赦。^239</p>\n<h3>第二次胜利</h3>\n<p>既然宣布的胜利是演出来的，嘉庆立即回到正事上。庆祝次日，他向额勒登保、德楞泰、勒保、吴熊光与惠龄颁发谕旨，责成他们彻底肃清本省叛军残部。他甚至愿意放宽自己最新设的期限——二月内完成所有军事行动。用他的话说，这个阶段就像大病之后的调养，需要时间与努力。他警告他们不要因新爵位或升迁而自满——他随时可以全部收回。^240 同时，他在财务上更严格。他的前任们习惯在战争胜利后蠲免部队出征时所借的全部银两，嘉庆却命部队偿还全部借款——军官四年、士兵八年。^241 军机处驳回勒保所报的显然无理或非法的开支请求时，他支持驳回。^242 毫不奇怪，这种倾向将适得其反。</p>\n<p>1803年头几个月，军事行动疲软，看不到近期结束的迹象。尽管数百名叛军——包括曾芝秀、胡明远、张世虎、姚新佐（姚之富之子）等首领——已被杀或被擒，叛军总数仍维持在几千。^243 随着春天推进，湖北发现的叛军越来越多。^244 在四川，用勒保的话说，起事者\"随剿随增\"。^245 他们在省界间穿梭，一省人数减少，他省人数就增加。许多叛军决心战死而非投降，仍能给镇压者以致命打击。^246 八年闰二月十九日，南江一场战斗中，穆克登布与数名军官士兵被苟文明的几十名旧部杀死，成为这场战役中阵亡的最后一位高级官员。一个月后，同一股在大宁又使清军伤亡。^247（地图5.3）</p>\n<p>困惑的嘉庆先是试图收紧对将领们的缰绳：恢复\"正月内完成\"的旧期限。^248 然而，不仅这个期限被打破，随着新的叛军股团出现，他还不得不一再延期：从二月到三月，再到四月。^249 嘉庆面临两难。他一方面担心清剿不彻底会使叛乱复燃，另一方面同样担心：如果战役拖到秋天——届时蒙古与新疆的王公要随他木兰行围——会玷污朝廷的声誉，因为已向他们通报了胜利。^250 为加快清剿，嘉庆重申愿意接受起事者投降。他还想让知府知县们巡视辖区，如果没有叛军，就签\"甘结\"（ganjie）作保，这样他们会更有动力保持本地清净。^251 三月二十一日，嘉庆为擒获起事者首领设立高达二百两的赏格，尽管他担心这可能招致滥杀无辜邀赏等弊端。^252</p>\n<p>尽管朝廷为收束战役用尽了办法，三巨头却不配合。对清军为何无法了结叛军残部，他们或缄默，或闪烁其词。皇帝问起，他们总是以烟幕与镜子应付。^253 谈到遣散乡勇，他们只报喜，向皇帝保证遣散进展顺利。额勒登保奏报说，到一月底，陕西已裁减一万多人，全都领了赏、平安回乡，没有闹出任何事。^254 在四川，第一次宣布胜利后，随征乡勇的裁减终于开始。^255 随着越来越多的乡勇被裁，更多的叛军股团出现了——它们并不总是由已知股团的残部组成。三巨头把这些新股团称为\"无名\"——因为其首领不为人知——并拒绝讨论其身份。</p>\n<p>又是吴熊光打破了沉默。正月，吴熊光奏报：从湖北护送回川途中，一些被遣散的四川乡勇逃跑了——因为大多数四川乡勇既无家又无业（他坚称湖北乡勇都已返乡、回归了平民生活）。^256 不久，在相隔数日的两道奏折中，吴熊光提醒朝廷：三峡地区出现了一股数百人的队伍，由前乡勇组成，操四川口音，首领是个姓陈的前乡勇头目。他们甚至使用乡勇旗帜，一些人戴着看似清朝官帽的帽子。这些\"乡勇变叛军\"比起事者更会打仗；他们在巴东袭击清军，打伤了一名湖北军官。^257 嘉庆对前乡勇变叛军并不惊讶，却警觉于其规模与实力。他裁定：任何与清军作战的团体都按叛军对待，并敦促战役主持者们密切关注此事。他怀疑前乡勇的赏银被地方官员侵吞了，指示勒保与德楞泰查办。^258</p>\n<p>然而，数日后，吴熊光退了回去。他澄清说：那伙人其实是四川的老起事者，\"伪装\"成乡勇。或许吴熊光不愿因点名四川的前乡勇而同时得罪勒保与德楞泰——尤其嘉庆已命德楞泰赴鄂对付此股。吴熊光还担心：如果清军把前乡勇当叛军打，仍在服役的乡勇会惶恐不安。为修补关系，吴熊光在人流密集处张贴告示安抚乡勇，声明叛军制造谣言污蔑乡勇。他向剩余乡勇保证他们受到信任，同时敦促\"被叛军裹挟\"的前乡勇向清朝投诚，以免受罚。^259 嘉庆选择接受吴熊光的更正。他不赞成吴熊光张贴告示，指示吴熊光悄悄处理此事——变叛军的乡勇杀无赦。^260 然而，吴熊光又换了立场。三月，他确认那伙叛军中确实有前乡勇，这使该股格外危险——因为前乡勇熟悉清军。^261 就连德楞泰入鄂后也承认：那股叛军中可能有被遣散的乡勇，尽管他强调徐天德的残部是其核心。^262 此外，一些前乡勇、被裁的军事民夫与随军贸易的商贩，在湖北与陕西两地成群劫掠。^263 越来越清楚的是：被遣散乡勇的安置并不成功。嘉庆一再指示将领们对\"乡勇变叛军\"绝不手软，但警告他们不要过于严厉，以免疏远剩余乡勇。他还向地方官员施压，命他们密切关注前乡勇，惩办闹事者。^264</p>\n<p>面对朝廷消灭剩余乡勇日益加大的压力，三巨头寻找新办法。闰二月底，额勒登保提出一项新计划：\"以工代赈\"（yigongdaizhen）。他计划雇用被遣散的乡勇与涌入战场省份随军贸易的商贩，在最后起事者出没的地区修城墙、建堡寨民居，并请求四十万两（陕西十万、四川三十万）资助这项工程。同时，额勒登保还请求增拨军费，支援仍在战役中的军队。鉴于额勒登保在此折中声明：一两个月内不可能肃清残余起事者，他计划在来年秋天完成筑堡工程——言下之意是：战役至少得持续到1803年下半年。^265</p>\n<p>这个提议令嘉庆极度震怒。他称之为\"荒谬至极\"，斥责额勒登保越俎代庖、干预民政，制造索款与延长战争的借口。他告诉额勒登保：朝臣中流传着一种说法——最后几百、上千名叛军是被故意留下的，因为战役领导人们需要更多借口来遮掩已非法花掉的军费。他说，他虽一直把这种猜测撇在一边，额勒登保的提议却证实了其中有些道理。除又一次\"严旨申饬\"外，他还褫夺了额勒登保的\"御前大臣\"（yuqian dachen）衔与紫缰（zijiang）——高荣的象征——两者都是第一次宣布胜利时授给他的。^266</p>\n<p>怀疑这个主意是别人塞给额勒登保的——他讥讽额勒登保甚至不懂\"以工代赈\"的中文含义——嘉庆在一连串发往前线的谕旨中，责成德楞泰与督抚们奏报是否知道这提议背后的主使人。^267 他们都说不知道，尽管勒保提到：新年前的一次会面上，他与额勒登保讨论过在四川修城墙——但他补充说，他告诉过额勒登保那不是急务。^268 额勒登保本人的答复来得晚而简短。在详述军事行动的长折末尾，他承认这越入了文官的领地，却坚称是自己的主意。或许是意识到自己反应过度，加上追查徒劳，嘉庆宽恕了他，让此事不了了之。^269 然而，嘉庆或许是对的；勒保很可能是此议的幕后推手——所请经费的四分之三都是给四川的。大约此时，勒保报病，请求到达州休养。^270</p>\n<p>由于朝廷与三巨头未达成一致，战役继续缓慢而零散地进行着。清军以小队在省境拉网式搜剿中，不时杀死或俘获零散叛军。到夏天，陕南大体平静。杨遇春到达湖北西北端后，湖北也在走上正轨。在四川，最后的几百名起事者沉入深山，靠劫掠求生。^271 然而，战役的收束从五月底推迟到六月底。嘉庆知道把残部一网打尽不现实，愿意接受：只要残余起事者被打散、无法复活叛乱，就算胜利。但他要求在撤军之前遣散所有乡勇——总数或许还有两万多人。^272 尽管遣返已部署部队几乎无人抵制，^273 遣散最后一批乡勇却难以达成共识——三省最终提出了三种不同的方案。</p>\n<p>吴熊光承认一些湖北前乡勇曾单独或合伙劫掠——这与他先前的说法相矛盾——提议提高湖北最后三千名乡勇的遣散赏银：湖北籍中无家无产者每人加二两；他计划变卖叛军财产来弥补这笔额外开支。这样，湖北的随征乡勇将得五两，其余得三两。^274 额勒登保入川后，与勒保呈上了一个类似上年长麟与陆有仁联名所提、被中枢政府否决的方案：把愿意参军者作为余丁安插进绿营，但按守兵（shoubing）的标准发饷——高于余丁。他们强调：川陕两省剩余的一万一千名随征乡勇中，只有几千人愿意参军；等他们补了正式士兵的缺，额外饷银就可以减少。^275 大约同时，军机大臣们批准了惠龄的一个四点战后重建方案。建议之一是：秦岭山区各州县增设数十名壮丁（zhuangding），从选定的随征乡勇中充任。军机大臣们计划变卖逃亡、死难者与起事者的财产来支付费用，卖产所得用完后由各县自筹。^276 急于清算最后的乡勇，嘉庆批准了所有这些提议，尽管对其效果将信将疑。^277</p>\n<p>但皇帝没有耐心等所有乡勇裁完。中元节（Zhongyuanjie）——道教祭祀亡灵之节——七月十五日将至，他决定先宣布又一场\"胜利\"。从六月中旬起，嘉庆就一再告诉将领们：再让一份报捷折在七月十五日或之前到京，好让他在中元节那天宣布胜利，使之成为庆典的一部分。同时，他不断告诫他们彻底肃清辖区内的叛军残余，并认真安置被裁乡勇。知道胜利之后军事行动仍将继续，他同意：如果地方军队不够，允许一些已部署部队暂留。^278</p>\n<p>经历过第一次胜利，三巨头再上一道报捷折、然后继续作战，毫无问题。德楞泰奉命在报捷折发出后赴热河，陪皇帝过中元节——他或许对这场胜利格外卖力，尽给朝廷喂喜讯，避开乡勇这个麻烦问题。^279 六月下旬，勒保与德楞泰前往太平的额勒登保大营，联名上了一道奏折，宣布三省叛军残部的清剿已经完成。奏折经六百里加急发出后，德楞泰启程赴热河。在这道没有堆砌第一次报捷那种华丽辞藻的奏折里，三人竭力把这场\"胜利\"描绘得尽量辉煌，指出：自第一次胜利以来的八个月里，十五名叛军首领与数十名叛军军官被除，数千名起事者投降或被杀。然而，他们小心地留足了继续行动的空间。他们声称：陕西与湖北已肃清，四川已无叛军股团，但多山的边境仍可能有一些零散叛军。不过，他们承诺：对付他们不成问题，所有\"客兵\"都可以撤回。谈到乡勇，他们含糊其辞。他们奏报：所有防守乡勇已遣散，剩余的随征乡勇人数不多（但没有给确切数字）。他们强调：最后这批乡勇都是久经沙场的老兵，\"与正规军无异\"，承诺按皇帝所批准的那样把他们转为\"新兵\"（xinbing）。^280</p>\n<p>中元节那天，嘉庆前往北京西北郊的安佑宫，向列祖列宗行礼。典礼之后，他正在父亲、祖父与曾祖父的画像前踱步时，报捷折到了。嘉庆第二次宣布——用一道或许是预先写好的谕旨——所有叛军残部已肃清，战役已胜利结束。然而，他没有再给额勒登保与德楞泰授爵升官。除给所有领导人众多礼物外——无一例外是荷包、玉环、烟管之类的小玩意儿——他只允许吏部考虑对勒保、吴熊光、惠龄以及协助他指挥战役的主要朝官给予奖赏。^281 次日，嘉庆再赴安佑宫感谢列祖列宗。此外，他派朝官赴四川、陕西、湖北、河南祭祀名山，并赏全国旗兵半个月饷银。^282</p>\n<h3>第三次胜利</h3>\n<p>事实上，中元节前几天，陕西巡抚祖之望与吴熊光的几道奏折到达北京，报告陕西与湖北仍有数十名叛军，但这没有阻止皇帝宣布胜利。^283 然而，庆典当天，嘉庆给额勒登保与勒保颁发了一道清醒的谕旨，批评他们第一次胜利后的松懈，敦促他们不遗余力地消灭所有残余起事者。同时，他告诫他们处理俘虏要审慎，确保没有无辜者被急于领赏的士兵或平民杀死。^284</p>\n<p>起初，清剿似乎在正轨上：七月内，起事者总数迅速降到不足二百；对多山省境的搜剿只发现了寥寥数名起事者。八月底，嘉庆已足够自信，告诉额勒登保在十到二十天内结束军事行动。^285 然而，他的乐观很快就蒸发了。八月初在秦岭第一次被发现的一股两三百人的叛军，越来越令人不安。这股有骡有马，正迅速向陕鄂边境移动。突入湖北失败后，它转而向西，于九月二十日夜在西乡七星坝南渡汉江，把一直追击它的杨遇春与杨芳远远甩在身后。嘉庆对两位杨姓将领本已光火——不久前刚摘了二人的顶戴——命额勒登保严厉申饬二人。由于此股与\"湖北叛军似在增多\"的奏报，嘉庆推迟了额勒登保回京。^286</p>\n<p>很快查明：该股大多是前乡勇。他们都是四川人，原属杨遇春部下守备吴廷刚率领的一支乡勇。第二次胜利前不久被遣散时，他们脱逃，在川陕边境加入了苟文明的二十几名旧部。该股中还有一些投降后被编为新兵或乡勇的叛军——他们因不满新处境而脱逃。^287 该股起初由身份不明的李彪率领。李彪被杀后，三个姓王、马、赵的人主事。他们自封\"总管\"（zongguan）——这不是起事者使用的名号——不许部众打听他们的全名。^288 他们极可能是前乡勇。被遣散的乡勇加入残余起事者或自立门户虽然并不新鲜，但这股由数百名久经战阵的前乡勇组成的队伍，与旧雇主作战时格外凶猛有效。^289</p>\n<p>十月中旬德楞泰重返战役时，嘉庆召回额勒登保，让德楞泰接掌指挥权——他又怕额勒登保缺席新年庆典会使蒙古王公等宾客怀疑胜利的真实性。^290 自1795年加入苗疆战役以来，额勒登保离京已八年——几年前他甚至错过了母亲的葬礼——还常年胸痛气短。第二次胜利前不久，额勒登保曾请求辞去经略大臣之衔，嘉庆没有同意。^291 或许是急于回京，额勒登保只报喜讯，回避讨论该股起事者的身份，尽管他提到那些叛军能叫出清军军官的名字。他向皇帝保证：德楞泰可以轻而易举地消灭</p>\n<p>他们——三省还动员着四万五千多名正规军，而该股已逃往太平。^292</p>\n<p>额勒登保离开之前，德楞泰保持沉默，近二十天没有上奏。然而，额勒登保一启程，德楞泰立即向朝廷奏报：该股以及滞留陕西东南角的另一股一百多人的叛军，大多是前乡勇；他们叛乱的原因是上级侵吞了他们的饷银或赏银。^293 德楞泰还说：太平的士兵与乡勇还穿着夏装、赤着脚，口粮也不能按时领到，一些军官只好自掏津贴为他们购置冬衣。由于乡勇遣散是额勒登保主持的，德楞泰或许是在设法撇清自己的责任。新年（1804年2月11日）将至，德楞泰的揭露也是为了提醒朝廷：该给仍在服役者一些恩赏了。^293</p>\n<p>但这一次嘉庆不为所动。他对乡勇的预言成真，心情沮丧。他痛斥地方官员没有妥善安置被遣散的乡勇，尽管他承认：一些前乡勇可能瞬间花光了赏银，或他们的赏银被上级侵吞了。然而，嘉庆不想示以宽大。他指示德楞泰：那些反叛者即便投降，也要流放边疆；而他愿意释放投降的教门起事者。他还让德楞泰审讯新叛军加入起事者的原因，查查有没有地方官员的干系。对剩余的四五千名乡勇更为关切，嘉庆告诫德楞泰：不要让他们知道叛军大多是前乡勇，而且不到最后不要遣散他们。^294</p>\n<p>十二月十日，在平利与那支较大叛军股团的战斗中，德楞泰的九百多名乡勇拒绝作战，甚至与敌人攀谈——对面的许多人正是他们的朋友、结拜兄弟与亲戚。这场遭遇以二十多名清军正规兵与军官被杀告终。战后，乡勇们去见德楞泰。他们跪地哭泣，说不能与自己的亲友作战。为前乡勇加入叛军辩护，他们辩称这些人有冤屈，报了仇就会离开叛军。至于战斗中杀死清军，他们坚称：那些\"乡勇变叛军\"没有进攻，只是在被激怒时才还手。德楞泰不愿惩处所有人，同意了他们的请求：派代表去与前乡勇谈判。以魏忠才为首的七名乡勇——魏忠才是个有功的乡勇，其叔父就在叛军股中——前去与叛军谈判，并递送德楞泰的信。^295</p>\n<p>德楞泰停战一周多，等待结果。然而，七名乡勇到达两天后就被叛军全部杀死。^296 德楞泰承认自己被\"乡勇变叛军\"骗了，但仍为自己的决定辩护，论证说：这些杀戮使打击那些\"乡勇变叛军\"名正言顺，而且仍在服役的乡勇已群情激愤，发誓对所有叛军——包括前乡勇——绝不留情。^297 但嘉庆批评德楞泰：听任自己被乡勇误导，停战数日。他重申立场：反叛并杀害官兵者绝不宽赦——即便投降。他还认为德楞泰的乡勇拒战应受惩处。然而，他试图从这场溃败中榨取最大价值。他给死难者家属丰厚的抚恤，并命德楞泰当着全体乡勇的面，派部属到遗骸发现处致祭——嘉庆与德楞泰一样，希望此事能激励乡勇更努力作战。^298</p>\n<p>这很快被证明是一厢情愿。此后两个月，德楞泰对穿梭于川陕边境的两股叛军未能取得实质性进展。二月中旬，两股在平利合并，前往竹溪。虽然被杨遇春与湖北军队赶回陕西，合并后的队伍通过收拢零散起事者、裹挟当地居民，扩大到近五百人。正月期限已破，二月的新期限又无法实现，德楞泰请求延期到三月。^299 对德楞泰失望，嘉庆决定二月十八日把额勒登保派回战役。任命他为统帅难堪，嘉庆便让额勒登保做钦差大臣——公开任务是检阅鄂陕两省军队，这是每隔几年照例进行的。同时，嘉庆威胁德楞泰：再不尽心就严惩。^300 不久前，他已请新任西安将军赛冲阿带一道谕旨给德楞泰。二月十七日，赛冲阿与德楞泰会面，递交了谕旨。据说德楞泰读后\"悚惧\"\"感激\"。^301</p>\n<p>两周后，三月初二日，杨遇春在平利一场激战中击溃了合并股——战斗中前乡勇直呼杨遇春的名字，想活捉他；叛军损失二百人，清方伤亡一百多。^302 然而，这成了前乡勇唱主角的最后一战。种种迹象表明，前乡勇与老叛军没能融合——老叛军对前乡勇并不友好，行军作战时常把他们用作先锋。此战之后，越来越多的前乡勇离开该股；到夏天，只剩几十人。与此同时，更多零散起事者加入。苟文明的堂弟苟文润成了首领。^303</p>\n<p>\"乡勇变叛军\"大体出局后，最后一批乡勇成了焦点。嘉庆责成途中的额勒登保：在撤回已部署部队之前遣散所有乡勇。^304 第二次胜利后，乡勇遣散起初加速。然而，到1804年春，三省乡勇总数从两万降到六七千（其中四千是随征乡勇）后，几乎再无进展。^305 最后这批乡勇中，许多人无家可归、无业可依。他们既不愿参军，也不愿接受地方衙门\"民壮\"的位置——月饷只有六钱，与他们当乡勇的收入相去甚远。他们放慢甚至拒绝作战，为自己的服役索取更好的补偿、为遣散索取尽可能优厚的待遇。在湖北，许多先前表示愿意参军的乡勇，听说回乡者的赏银更高，就改了主意。^306 在陕西，剩余的乡勇每次听说要裁减就鼓噪，威胁说条件不满意就加入起事者。^307 他们的抗议与罢工实际上瘫痪了军事行动，苟文润一股从太平逃到大宁。夏末，它在大宁一处山顶掘壕自守。在安康，另一个由零散起事者组成的小股由熊翠率领。德楞泰与额勒登保没有奏报乡勇的抵制，而用惯常的借口——叛军机动性强、天候恶劣、地形艰险、给养短缺——来拖延时间，这招来皇帝一再的\"申饬\"。^308</p>\n<p>起初毫不妥协的嘉庆明确表示：乡勇贪婪的要求不应也不能满足，并坚称：安置被遣散乡勇、防止他们生事是地方官员的责任。^309 但战争领导人们持续向他施压。1804年初额勒登保回京陛见时，他把\"遣散乡勇的赏银过低\"列为战役收束的唯一障碍。^310 年后不久，新任陕西巡抚方维甸提出一项新方案：让陕西各衙门雇用那些无生计的乡勇巡逻地方，作为战后治安措施。他们不领遣散赏银，而是月领三两。由于陕西有五十九个衙门，每个只雇二三十人，各衙门的财政负担不会太重。^311 嘉庆以\"二三十名前乡勇聚于一处不安全、且仍按乡勇标准支饷\"为由否决了这一提议，但同意在战役结束时提高遣散赏银，使他们得以安身立命。他请方维甸拟个方案。^312</p>\n<p>方维甸答复之前，德楞泰——或许是听说了嘉庆愿意妥协——呈上了自己的提议。他论证说：第一次胜利后，剩余乡勇又打了两年，于是请求：所有乡勇领十两遣散银，有功者领十五两；归途继续供给口粮；但不再补偿被收缴的武器。德楞泰估计该方案总花费约五万两，建议向文武官员募捐支付。^313 大体以德楞泰的方案为基础，二月初九日，嘉庆颁布新标准：外省乡勇给十两，本省乡勇给五两；有功的外省乡勇十五两、本省十两。他指示动用军费支付，并揶揄德楞泰提官员捐款太过小家子气。^314 鉴于众多乡勇获授过武职顶戴，最后这批乡勇中相当一部分将拿到十至十五两——这是1802年额勒登保、惠龄、陆有仁所议标准（二至三两）的五倍。</p>\n<p>然而，这一让步并没有打动三巨头去裁撤最后的乡勇。相反，将领们如今打算把最后四五千名随征乡勇（陕西一千二、四川三千）留到最终胜利之后，理由是：这些久经战阵的乡勇若一次裁光，可能掉头与旧雇主作战。^315 因此，他们转而把讨价还价的方向放在提高最后这批乡勇的现役饷银上。四月初额勒登保回陕与德楞泰会合后，告诉皇帝：他已决定给乡勇与正规军相同的杀敌擒贼赏格（德楞泰已把正规军的赏格提高到每人头五十两），以激励乡勇——嘉庆没有反对。^316 不久，额勒登保、德楞泰与赛冲阿请求：把最后随征乡勇的月饷提高到二两，与绿营兵相同——因为乡勇一直承担与士兵相同的职责。他们奏报说：由于数月入林搜剿叛军的艰辛，约二百六十名四川乡勇请求遣散。^317 但这一次嘉庆被激怒了。他断然驳回请求，无情地责骂将领们：以一万多人的兵力，竟无法了结两百名叛军，毫无建树。他再次提醒他们：迁延的战役耗资巨大，国家的财政状况已今非昔比。嘉庆命：不愿干者遣散，只留肯干者。^318</p>\n<p>在五月初八日的谕旨中，嘉庆责成额勒登保五月内完成军事行动，六月清剿，然后回京随驾木兰行围——他再次提到：额勒登保若不出现在木兰，蒙古宾客会起疑。^319 然而，将领们看向的是另一个方向。额勒登保、德楞泰与赛冲阿联名奏报：他们已命四川开县、太平、大宁与陕西安康、平利、紫阳的居民迁回较大的堡寨（许多居民已回乡，或迁往靠近农田的较小堡寨），并请求调两三千名四川绿营兵到川东北守御当地，还提到：陕西更多乡勇请求退出，包括杨遇春的一些乡勇，四川也可能出现类似情形。^320 这些举动表明：将领们是在为更长的冲突做规划，而不是在可预见的未来收束它。嘉庆震怒，在又一道措辞强硬的谕旨中倾泻他的沮丧与愤怒，命对三人施以降职与象征性处分。他虽然批准了增兵之请，却怀疑其背后有未明言的原因——要么是替换罢工的乡勇，要么是应对那些地方可能由被遣散乡勇组成的更多叛军。^321 尽管嘉庆震怒，不久，三人再次请求把乡勇月饷提高到二两。毫不奇怪，嘉庆再次驳回。^322</p>\n<p>为查明真相，绝望的皇帝指示方维甸密奏将领们的表现，以及\"将领们为了与他讨价还价而故意留着最后的起事者\"是否属实。^323 毫不奇怪，方维甸为他们辩护：\"将领们之所以未裁尽乡勇，是因为贼匪尚未了结。不应出现这样的情况：因为裁减乡勇困难，将领们就故意把最后几股贼匪留着不了结。\"（原文待核，见注释324）^324 方维甸解释说：将领们担心乡勇一旦裁掉，就会加入最后的起事者。然而，他披露：乡勇已有些时候未被用于作战——战利品机会减少，他们失去了动力。方维甸建议把有家产的与无家产的乡勇分开安置：前者护送回乡，交由地方官员监视；后者——陕西一千二百名乡勇中的百分之三四十——由地方政府与大员衙门雇为守卫或差役数月，然后再裁。这实际上是他此前方案的修订版。但嘉庆认为只雇几个月不是办法。他催促方维甸拿出长期方案。^325</p>\n<p>方维甸上奏两周后，勒保也呈上了他对乡勇僵局的看法。他承认：最后这批乡勇难以管束，以至于拒绝作战——因为他们的一些战友在叛军那边——尽管他把这种局面归咎于正规军思乡松懈、没有管好乡勇。与额勒登保、德楞泰一样，勒保也为正规军与乡勇请求更多恩赏——即提高两方的赏格、乡勇的月饷与遣散银。他嘴上说要裁四川最后的两千名乡勇，却没有说明如何安置无家可归者。^326</p>\n<p>困惑而沮丧的嘉庆，只能诉诸言辞的力量。从五月底起的一个月里，他颁发了众多慷慨激昂的谕旨，不断批评将领们数月没有取得任何实质性成功，敦促他们在六月内设法搜尽最后的起事者。在给三省督抚的谕旨里，他请他们协助遣散安置最后的乡勇。他一面频频给谕旨的接收者们\"申饬\"或\"严旨申饬\"、以更多惩处相威胁，一面劝他们凭良心行事、把国事当作家事，并承诺：如果他们照办，就发还被摘去的顶戴。^327 他颁旨之频繁前所未有，堪称一场对抗\"战争主持者们对他的命令与恳求置若罔闻\"的王室反抗。</p>\n<p>最终，额勒登保屈服了。在这场一塌糊涂的战役中——他漫长生涯中最后、也几乎是最不光彩的一场——他一直是乡勇困局、乃至前线腐败的勉强同谋。他虽试图保持清白，到头来还是忍不住效法同侪在战争财政上的做法。然而，他是三巨头中的薄弱环节。五十六岁、身体欠佳的他，本就不愿重返战役。^328 返回后，他的状况恶化：胸痛、头晕、心悸之外，几乎走不动路。接到上述象征性处分后不久，额勒登保以病为由请求离开战役，但承诺离开前遣散川陕两省剩余的全部乡勇——合计约三千五百人
