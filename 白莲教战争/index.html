。^329</p>\n<p>额勒登保的病假请求给了皇帝打破僵局的机会。六月二十日，嘉庆命额勒登保回西安养病，并把陕西最后的一千二百名乡勇带到西安、就地遣散。同时，嘉庆让德楞泰成为战役唯一统帅，不再让赛冲阿分担责任，并责成德楞泰在七月内了结苟文润一股（另一股只剩十人）。他警告德楞泰：完不成期限就严惩；如期完成则重赏。至于四川最后的两千名乡勇，嘉庆留给德楞泰与勒保去遣散。^330 得到皇帝准许离开的旨意，额勒登保感觉\"好多了\"，能够替腹泻虚弱的德楞泰执掌指挥。七月初九日，德楞泰痊愈后，额勒登保与他相会，把\"钦差大臣\"印信交给了他。^331 二人虽未完全透露所谈内容，极可能是额勒登保说服了德楞泰停止讨价还价、收束战事。嘉庆刚任命那彦成——他再次成为军机大臣——署理陕甘总督（惠龄新近病逝），可能也起了这个作用。熟知那彦成脾性的额勒登保，想必预料到那彦成的到来至少会使局面复杂化，不如趁早了结。^332</p>\n<p>额勒登保启程赴西安时，带走了陕西最后的一千二百三十九名随征乡勇。七月下旬，额勒登保在西安遣散了他们及其他一些乡勇。三百六十六人参了军，其余八百七十三人被送回陕西、四川或湖北的家乡。不过，额勒登保按乡勇们的一再要求提高了遣散赏银。嘉庆这次选择了默认。^333 尽管德楞泰麾下还有一千八百多名随征乡勇，从四川各驻防调来的三千名绿营兵即将到达。额勒登保、德楞泰与赛冲阿联名承诺：新兵一到，所有剩余乡勇都会裁掉。^334</p>\n<p>德楞泰与额勒登保会面三天后，七月十二日，杨遇春、丰绅与田朝贵在平利凤凰寨击溃了苟文润一股，杀俘一百五十人。急于收尾的嘉庆重赏将领士兵，并把被摘去的顶戴发还给额勒登保与德楞泰。^335 此战之后，苟文润失去了对队伍的控制；他的一些部下脱逃了。嘉庆不久前虽在额勒登保与德楞泰的请求下勉强把期限延到八月，如今却确信：结束终于要来了。^336</p>\n<p>八月初一日，苟文润在睡梦中被赵洪周杀死——赵洪周是前乡勇，曾回到清军当斥候，后被叛军俘获。被俘后，赵洪周假装愿意入伙，当了伙夫，却设法接近苟文润。另一名被叛军俘获的人帮助赵洪周杀死了苟文润。随后两人逃回清军。^337 苟文润既死，剩余的叛军分成小队，在平利与太平的山中各自逃生。到八月下半月，德楞泰已收捕了他们中的许多人，但该股的两个头面人物——罗其清的弟子王世贵与教门师父王作经——仍在逃。^338 这次不想错过期限，德楞泰在八月底之前经六百里加急发出了报捷折。</p>\n<p>九月初五日奏折到京时，久盼的最后胜利并没有引起多少兴奋。与上次一样，嘉庆没有给额勒登保与德楞泰授新爵；也没有给三省将领或文官多少升迁。德楞泰的报捷折与嘉庆宣布最后胜利的谕旨，都不像在欢庆，反而听起来满怀歉疚——它们试图为战役的迁延辩护，抹去那个难堪的事实：对付几百名\"叛军\"，竟花了一年多。除惯常的借口外，歉疚竟至于声称：起事者越少，围剿越难。同时，乡勇问题被略去不提——既没有提到一些被遣散的乡勇与最后的叛军合流，也没有提到最后乡勇的遣散曾是胜利的巨大障碍。德楞泰只是含糊地提及：漫长战役最后阶段之所以更难，是因为起事者与\"土匪\"（tufei）合流了——但他没有点破他们究竟是谁。^339 在官修战役方略中，编纂者们选了另一个词——\"杂夫游民\"（zafu youmin）——来冲淡这个令人不快的问题。^340</p>\n<h2>最后的叛军与乡勇</h2>\n<p>在一定程度上，最后这场胜利又是名义上的。德楞泰在报捷折里虽然足够谨慎、没有说叛军残部已全部消灭，嘉庆皇帝却不愿引起任何怀疑，在宣布胜利的谕旨中宣称：三省已不剩一名叛军。然而，在同一天给德楞泰的另一道谕旨中，他责成德楞泰肃清最后的残部，擒拿王作经、王世贵与苟朝九——朝廷所知姓名的最后三名起事者。^341 事实上，\"残部\"包括转为劫掠为生的前乡勇。^342 由于镇压者不愿明确称他们为前乡勇，便继续称他们为\"土匪\"，以区别于老起事者——后者此时被称为\"零匪\"（lingfei）与\"散匪\"（sanfei）。</p>\n<p>按嘉庆指示，德楞泰驻太平城口，督率对三省交界处最后敌人的搜剿。此后数月，由几十人或更少人组成的小股被消灭。有些人上吊自尽。有些人受当地居民庇护。^343 1805年初，嘉庆开始催促在一月底或二月初出局，计划届时撤军、把搜剿移交地方政府，尽管他仍希望此前能擒获他点名的三名叛军。^344 十二月初三日，苟朝九在南郑被擒。闻讯后，嘉庆同意撤出所有部队，但数日后又改了主意，命不擒王世贵不撤军。^345 但德楞泰不同意。或许是思念成都——成都将军的驻所——德楞泰论证说：不值得留两万军队在外搜捕几十名\"匪徒\"；王世贵不过是个\"战手\"，王作经也年近五十。^346</p>\n<p>除二王之外，四川最后一批乡勇是剩下的障碍。在陕西，额勒登保离开后不久，那彦成与方维甸就安置了被遣散的乡勇。在湖北，吴熊光在最后胜利后迅速裁掉了所有剩余乡勇，遣返了已部署部队。^347 只有四川最后乡勇的裁撤拖了近半年。第三次胜利前不久，勒保以小股叛军为借口，请求把部队多留几个月。请求中没有提四川最后的一千八百名乡勇，勒保事实上把他们也留了下来。^348 最后胜利一个月后，勒保与德楞泰又同皇帝谈判。他们请求把四川乡勇的遣散银从五两提高到十两，坚称：额勒登保在裁撤陕西全部乡勇时，实际已把赏银从五两提到七两五钱，兴安府的地方官员还给被遣散乡勇捐了衣鞋。他们还奏报：德楞泰的乡勇当时正在陕西，目睹同侪领取那些恩赏，也恳求德楞泰提高自己的赏银。嘉庆再次屈服了。^349 然而，勒保拖了三个月才执行。直到1805年二月初，四川的乡勇才全部遣散——或送回家乡，或招为新兵与衙门差役。^350</p>\n<p>十年三月初十日，接到德楞泰\"用三省驻军巡守边境\"的提议，嘉庆批准撤出所有已部署部队，德楞泰前往成都就任。^351 五月十九日，王世贵在太平被例行半年演习的四川军队杀死——按战役结束前的计划——之后，嘉庆暗示有意取消对王作经的搜捕。^352 七月中旬，德楞泰奏报：四川军队消灭了一股八人的起事者，其中一人跳崖，坠亡前自称姓\"王\"——这使皇帝安了心。德楞泰随后\"所有叛军残部已肃清\"的结论，被皇帝欣然接受。^353 冲突终于结束了。</p>\n<h2>注释</h2>\n<p>[译者按：文献简称对照——除前章所列外，另有：SHD《上谕档》。]</p>\n<p>题辞：XFFLXB, 27/24b–26a.</p>\n<ol>\n<li>XFFL, 210/21b–25a.</li>\n<li>XFFL, 218/27b–37a, 220/8a–12a, 223/17a–19a, 224/32b–36a, 226/13a–21b, 227/41a–46a, 229/30a–32a.</li>\n<li>除升官或授职外，赏格高达一千至两千两。XFFL, 230/10b–14a. 嘉庆元旦次日刚重申过赦免叛军首领的承诺。XFFL, 227/14b–17a.</li>\n<li>XFFL, 223/24b–30a.</li>\n<li>XFFL, 223/34b–38b.</li>\n<li>XFFL, 219/15a–16b, 220/1a–4b, 222/7b–9b.</li>\n<li>XFFL, 220/4b–8a, 221/20b–23b, 222/10a–12a.</li>\n<li>在渠县与仪陇的这场战斗中，清军据说杀死三四千名叛军，包括杨开第与齐国模两名首领。XFFL, 223/1a–10a, 223/13a–15a. 但此数可疑。</li>\n<li>七十五告诉德楞泰：除边境上一股三四千人的叛军外，还有几股从陕西到达了广元。XFFL, 224/26a–32b.</li>\n<li>XFFL, 224/26a–32b, 226/6b–13a.</li>\n<li>但嘉庆认可了德楞泰赴陕。XFFL, 224/32b–36a, 226/13a–17a.</li>\n<li>XFFL, 224/26a–32b, 226/6b–13a, 226/13a–17a.</li>\n<li>XFFL, 226/13a–17a, 228/18a–24b.</li>\n<li>XFFL, 卷226–33。</li>\n<li>XFFL, 231/33b–36b, 232/11a–12b, 233/29a–40a, 235/3b–8b.</li>\n<li>一些被俘叛军说樊人杰于嘉庆六年二月初六日滚下悬崖。XFFL, 239/3b.</li>\n<li>XFFL, 卷236–47 各处及250/10b–14b。</li>\n<li>三月，薛大烈与阿哈保消灭了一股藏身大巴山数月之久的九百名张汉潮残部。XFFL, 247/12b–18b.</li>\n<li>刘朝选供词，BLJZL, 5:138–39; 汤思蛟供词，第144–45页。</li>\n<li>汤、刘一股在湖北先被阿哈保追击，后被七十五追击。XFFL, 卷243–59 各处。</li>\n<li>XFFL, 226/40a–41b.</li>\n<li>XFFL, 228/18a–24b, 231/36b–41a.</li>\n<li>XFFL, 241/18b–21a, 卷246–58 各处, 及275/10b–12b。</li>\n<li>XFFL, 252/4a.</li>\n<li>XFFL, 228/26b–27a.</li>\n<li>XFFL, 236/8b–9b, 250/15a–16a. 嘉庆的 一等子爵，把他之子苏冲阿升为头等侍卫，并厚赏其军。XFFL, 卷227–33 各处; 马应祥供词，BLJZL, 5:117.</li>\n<li>XFFL, 237/12a–18b.</li>\n<li>XFFL, 227/14b–17a.</li>\n<li>倭星额是大理寺少卿，邱兴健是太仆寺少卿。XFFL, 230/10b–14a, 230/15a–b.</li>\n<li>XFFL, 235/27b–31b, 236/23a–25b, 237/19a–22a.</li>\n<li>XFFL, 卷232–42; 王凌高供词，BLJZL, 5:118; GZDJQ, 19776.</li>\n<li>除赏杨遇春、格布舍与额勒登保外，嘉庆还恩赏领班军机大臣、处理军报的中枢人员与传递喜讯的驿站人员。XFFL, 240/30b–33b, 240/33b–35a, 240/35a–b.</li>\n<li>XFFL, 242/31b–34a; 王廷诏供词，BLJZL, 5:120–27. 王廷诏很可能编造了关于祖父的神话，以抬高自己的分量。</li>\n<li>关于如何使用这些记录，见韩书瑞（Naquin）\"True Confessions\"。</li>\n<li>XFFL, 卷240–53 各处; 王凌高、张深供词，BLJZL, 5:118–19.</li>\n<li>徐天德的尸体后来被德楞泰的部队找到。XFFL, 卷254–61 各处。</li>\n<li>经旬阳知县严如熤鼓励，当地乡勇参加了对陈朝观一股的作战。XFFL, 251/25b–28b, 254/3b–10b, 256/7b–14a.</li>\n<li>XFFL, 卷237、238、240、242–63 各处。</li>\n<li>XFFL, 285/6b–10b.</li>\n<li>XFFL, 卷248–56 各处。</li>\n<li>XFFL, 卷241–45 各处及248/5b–8b。</li>\n<li>XFFL, 247/20a–28a.</li>\n<li>这场起事是三月间由教门社团\"悄悄会\"——字面义为\"秘密会\"——发动的；该会创于乾隆朝晚期，活跃于陕西凤翔府。陕西军队迅速镇压了起事。XFFL, 246/8a–17b. 又见铃木中正Sennen ōkkuteki, 299–300。</li>\n<li>XFFL, 247/28a–29b, 249/15a–21a.</li>\n<li>XFFL, 247/1a–9a, 248/1a–5b, 250/1a–10a, 251/28a–b; 冉学胜供词，BLJZL, 5:130.</li>\n<li>XFFL, 251/11a–14b, 253/17a–22a.</li>\n<li>XFFL, 卷251–66 各处; 冉学胜供词，BLJZL, 5:130.</li>\n<li>XFFL, 254/10b–13a, 254/20b–23b, 及卷237–55 各处。</li>\n<li>XFFL, 241/25a–26b, 243/22b–23b, 244/19a–21a, 247/30a–34a, 250/9b–10a, 254/1a–3a, 255/15b–16a, 256/24a–25a, 259/8a–11b.</li>\n<li>XFFL, 251/14b–17b.</li>\n<li>XFFL, 245/27b–29b.</li>\n<li>XFFL, 253/8a.</li>\n<li>二人的奏报于嘉庆六年五月初二日到达皇帝手中。他们的建议包括：沿栈道及宝鸡、凤翔驻军；审查登记所有乡勇、限制再雇；让西安的满洲与汉军训练；三个战场的所有升迁请求都经额勒登保。XFFL, 253/5a–17a.</li>\n<li>XFFL, 251/21a–22b, 253/24b–28b, 254/20b–23b, 258/15b–17b, 260/23a–26a.</li>\n<li>XFFL, 266/9a–10b.</li>\n<li>其中一场战斗中，杨遇春与格布舍擒获了冉天泗与王士虎。XFFL, 卷245–85 各处; GZDJQ, 5547.</li>\n<li>德楞泰说，他的许多士兵没有鞋穿，六千名士兵中三分之一或病或腿脚肿损，许多人已死。XFFL, 269/8b–11a, 272/15b–26a, 277/22a–24b.</li>\n<li>XFFL, 266/19b–21b, 267/35b–38a, 269/11a–12b, 272/26a–28a, 277/24b–26a.</li>\n<li>XFFL, 253/26b–33b 及卷264–80 各处。</li>\n<li>XFFL, 卷260–66 各处。</li>\n<li>XFFL, 卷260–69 各处; 辛斗供词，BLJZL, 5:131–32.</li>\n<li>因剿灭冉学胜之功，勒保恢复了一品顶戴，获三等男爵。XFFL, 270/22a–32a.</li>\n<li>XFFL, 卷271–75、282–85 各处; 辛斗供词，BLJZL, 5:131–32; 魏洪升供词，第136页; GZDJQ, 5711.</li>\n<li>XFFL, 卷267–84 各处; 刘朝选供词，BLJZL, 5:139; 汤思蛟供词，第145页。</li>\n<li>XFFL, 卷255–56、259–65 各处。</li>\n<li>XFFL, 261/16b; QSLJQ, 83/31b.</li>\n<li>XFFL, 卷268–85 各处。</li>\n<li>XFFL, 280/7b–8a.</li>\n<li>XFFL, 卷264–75 各处。</li>\n<li>XFFL, 266/10b–13a.</li>\n<li>一个月后，据德楞泰说，总数降到一万九千。XFFL, 270/5a–9b. 不久，数字先降到不足一万，再降到七八千。XFFL, 271/12b–15b, 276/11a–12b.</li>\n<li>XFFL, 270/9b–13a, 274/9a–11b, 279/24a–25b.</li>\n<li>XFFL, 284/7a–9a.</li>\n<li>XFFL, 280/12b–17b. 不久，勒保与德楞泰也奏报了遣返军队的计划。XFFL, 283/7b–8b. 两个月前，额勒登保已计划遣返满洲旗兵，嘉庆同意，并给了详细指示。XFFL, 271/10b–12b, 271/14b–15b.</li>\n<li>嘉庆授额勒登保三等伯爵、德楞泰二等伯爵，各赏黄鹿皮褂一件。XFFL, 280/26a–31a.</li>\n<li>XFFL, 283/22a–24a, 283/29b–32a.</li>\n<li>XFFL, 283/24a–27a.</li>\n<li>XFFL, 283/32a–33a, 283/35b–36b, 284/15b–23b.</li>\n<li>最近一次是他批准额勒登保为地方官请升时。XFFL, 283/32a–33a.</li>\n<li>他裁定：无家无业的乡勇可开垦山中荒地，或到铜矿盐场做工。XFFL, 284/27b–28b, 284/38a–40a.</li>\n<li>苟文明的妹妹嫁给了罗其清的弟弟。</li>\n<li>XFFL, 卷267–86 各处。</li>\n<li>XFFL, 284/14b–15b, 285/1a–6b, 285/14a–19a, 289/11b–12b.</li>\n<li>XFFL, 286/2a–14a.</li>\n<li>XFFL, 卷286–89 各处; GZDJQ, 6732, 6780.</li>\n<li>长麟派两千二百名士兵赴甘，并亲往主持后勤。XFFL, 卷288–89 各处。</li>\n<li>他们不去甘肃的理由是：等苟文明被逼回陕西时夹击他。XFFL, 287/1a–7b, 288/15a–18b, 289/1a–14a, 289/24b–30a; GZDJQ, 6874.</li>\n<li>XFFL, 289/89b.</li>\n<li>尽管其中有些人有鸟枪（niaoqian），没有弹药也用不上。他们带着枪只为伪装成清军偷取给养。周世洪供词，BLJZL, 5:161.</li>\n<li>XFFL, 290/9a.</li>\n<li>然而，龙绍周的一些部下因信使而脱逃或投降了。XFFL, 264/13b–14b, 264/16a–18a, 269/6a–b.</li>\n<li>1801年初大宁一场对龙绍周的战斗之后，德楞泰屠杀了近七百名俘虏，其中九人被剐磔处死。XFFL, 244/6b. 不久，湖北兴山一场对徐天德、苟文明的战斗之后，德楞泰与长龄屠杀了四百七十三名叛军，把五名首领凌迟处死。XFFL, 250/26a–b. 1801年初，一场对樊人杰的战斗之后，勒保把七名叛军首领凌迟处死，屠杀三百七十八名叛军。XFFL, 233/34b–35a. 1801年底，达州一场对李彬一股的战斗之后，杨遇春处决了近四百名俘虏。XFFL, 282/6a–b.</li>\n<li>XFFL, 299/8b–9b.</li>\n<li>XFFL, 289/31a–33b, 290/4b–10b, 291/1a–5b, 291/12a–14b, 292/4a–6b.</li>\n<li>XFFL, 289/17b–23a.</li>\n<li>他们以种种借口为七十五的拖延开脱，称赞七十五十几日就把苟文明逐出甘肃，还提到他负伤十五次、被捕时部下为之哭泣。XFFL, 289/30a–31a, 290/12a–13a, 291/6b–9b, 291/14b–16a; GZDJQ, 6953. 夏末，七十五因伤不能视事，被召回北京。XFFL, 327/41b–44a.</li>\n<li>事实上，嘉庆此前曾批评额勒登保包庇属下，敦促他查办七十五、处分未能阻止叛军经其防区通过的王自禄。XFFL, 285/14a–19a. 王自禄再次未能阻止苟文明入川，额勒登保提议对王自禄处死刑、罢免另一军官。额勒登保与德楞泰还请求把一名军官降为士兵。XFFL, 289/24b–30a, 289/33b–36b, 291/9b–12a, 291/16a–b.</li>\n<li>XFFL, 290/24a–b 及卷293 各处。</li>\n<li>XFFL, 292/20b–26b.</li>\n<li>XFFL, 290/26b–28b, 292/27b–30a.</li>\n<li>XFFL, 288/18b–20b, 288/24a–b, 294/16a–19b.</li>\n<li>额勒登保说：他不想用全部兵力追击溃散的叛军，将\"相机缓进\"。XFFL, 293/20b.</li>\n<li>XFFL, 296/1a–5a, 296/7–10a.</li>\n<li>XFFL, 297/6b–18b.</li>\n<li>XFFL, 296/18b–20b, 297/18b–24b; GZDJQ 7471.</li>\n<li>XFFL, 297/24b–27b.</li>\n<li>江北只有两股叛军。一股在秦岭游荡，但其首领之一辛聪于正月初被擒。另一股就是新年前不久渡汉江的那支。XFFL, 卷291–97 各处。</li>\n<li>嘉庆派额勒登保与杨遇春肃清汉江以北，庆成与庆溥负责江南叛军。四川方面，他在德楞泰（川东）与勒保、赛冲阿（川北）之间分了工。必要时，嘉庆甚至愿意批准增援请求。XFFL, 298/14a–25b.</li>\n<li>嘉庆向额勒登保承诺：战役一结束就召回他。XFFL, 300/13a–15b.</li>\n<li>XFFL, 293/5b–8a, 卷299–300、304–5、310–17 各处; GZDJQ, 7546, 7654, 7713, 8003.</li>\n<li>XFFL, 300/28a–30a, 309/7b–10a.</li>\n<li>XFFL, 311/31a–33b, 313/8a–9a, 315/7b–9a, 317/19b–21b.</li>\n<li>XFFL, 319/8b–14a.</li>\n<li>除升赏士兵、叛军免罪外，赏格在五百至两千两之间。XFFL, 319/16b–20b.</li>\n<li>XFFL, 319/20b–21b. 事实上，嘉庆早先就指示陆有仁密奏陕西全体将领的情况。XFFL, 295/40a–b.</li>\n<li>XFFL, 290/10b–12a 及卷292–303 各处。</li>\n<li>XFFL, 290/17a–21a.</li>\n<li>XFFL, 90/21a–24a, 291/21b–23a, 292/17b–19b, 298/14a–16b, 299/24a–25a, 301/12b–15b.</li>\n<li>XFFL, 345/1a–4b.</li>\n<li>胡明远供词，BLJZL, 5:150–51; 赵从官供词，BLJZL, 5:157.</li>\n<li>XFFL, 290/3a–4b, 339/4b–5a.</li>\n<li>XFFL, 292/6b–13a, 295/1a–5a, 295/10b–12b, 311/6a; 赵从官供词，BLJZL, 5:157–59; 张世虎供词，BLJZL, 5:154–55.</li>\n<li>据德楞泰与湖北将领们说，重新集结的叛军有四千人，其中三千是\"矛手\"。但吴熊光认为只有一千是真起事者。XFFL, 309/22b–23b.</li>\n<li>XFFL, 291/5b–6a 及卷297–99、302、305 各处。</li>\n<li>XFFL, 302/9a–11b, 305/16b–18b.</li>\n<li>XFFL, 卷300–12 各处。</li>\n<li>XFFL, 卷307–9、311–12 各处。</li>\n<li>蒲天宝股团的核心是陈朝观蓝号的两百人。陈朝观被杀后，他的两个儿子成为该股名义首领，但蒲天宝是谋主。XFFL, 卷313–16、318 各处。</li>\n<li>嘉庆指示德楞泰及其同僚利用雨季，提醒他们上年夏天徐天德在陕西溺毙之事。XFFL, 320/3a–10b.</li>\n<li>樊人杰的尸体始终未能辨认——江岸尸体损毁严重。XFFL, 321/1a–10b, 及卷322–24 各处。</li>\n<li>1802年夏被捕后，张世虎谈到樊人杰：\"我们皆听其号召。凡有信来，所言皆遵。他与刘之协、王廷诏、李述同为最尊者。\"张世虎供词，BLJZL, 5:155.</li>\n<li>嘉庆把德楞泰的爵位升为三等侯。XFFL, 321/18a–21a.</li>\n<li>XFFL, 319/28a–31b, 320/1a–3a, 320/15a–23b.</li>\n<li>XFFL, 322/24a–26b.</li>\n<li>嘉庆起初以七月二十日为限。额勒登保请求延到七月底，嘉庆勉强同意。XFFL, 卷323–24、326 各处。</li>\n<li>XFFL, 卷327–29、331 各处; 苟朝九供词，BLJZL, 5:164; GZDJQ, 8417, 8553.</li>\n<li>罗友枝（Rawski）Last Emperors, 19–21。</li>\n<li>XFFL, 328/21b–26a, 329/6b–10a. 嘉庆对杨遇春的注意，见XFFL, 173/29b–33b, 181/16b–18b, 191/31b–33b, 191/35a–b, 207/28b–31a.</li>\n<li>在陕西，额勒登保在苟文明死前已开始遣返旗兵与绿营兵。XFFL, 327/8b–11a, 331/18a–21b, 338/34b–36a. 勒保也遣返了山西、广东的绿营兵，但留下了云南、贵州的。XFFL, 326/15b–19b.</li>\n<li>嘉庆1799年初亲政后不久就表达过这些关切。QSLJQ, 79/30a–b.</li>\n<li>XFFL, 134/6a–7a.</li>\n<li>XFFL, 135/15a–16a.</li>\n<li>XFFL, 159/22b–25b.</li>\n<li>1800年底，嘉庆说：他已就此事向战争领导人们颁发过众多谕旨，却没有收到任何详尽可行的方案。XFFL, 217/3b–4b.</li>\n<li>XFFL, 240/35b–38a.</li>\n<li>陆有仁的答复先到。数日后，勒保的提议与长麟、陆有仁的联名奏折也到了。XFFL, 248/16b–20a, 249/8b–12b, 264/18b–25a.</li>\n<li>XFFL, 264/18b–25a, 267/1a–5a.</li>\n<li>XFFL, 323/7b–8a.</li>\n<li>兴魁于嘉庆七年九月初一日把谕旨交给额勒登保。随后兴魁前往汉中，向陆有仁口头\"密传\"嘉庆关于裁减乡勇的指示。XFFL, 340/6b–8b. 不久，嘉庆任命兴魁为西安将军。</li>\n<li>XFFL, 323/29a–32a, 324/17a–20b, 326/11b–12a, 327/16b–17b, 328/26a–27b.</li>\n<li>XFFL, 328/8b–16a.</li>\n<li>XFFL, 324/19a–b, 328/18b–21b.</li>\n<li>XFFL, 329/27a–29a, 331/24a–b, 334/32a–33a, 335/18b–19a.</li>\n<li>XFFL, 335/27b–30a. 额勒登保随后的一道奏折描绘了同样乐观的景象；336/23b–24a。</li>\n<li>XFFL, 336/31b–32a, 339/29b–31a, 346/22b–24b.</li>\n<li>吴熊光派一名道员到竹溪、襄阳知府到郧阳接收被遣散的乡勇。XFFL, 339/5a–6a.</li>\n<li>XFFL, 336/1a–3b, 343/9a–14b, 343/16a–b, 343/18b–21a.</li>\n<li>XFFL, 324/13a–16a, 337/10a–11b.</li>\n<li>德楞泰还声称三省还有两万名防守乡勇。这个数字同样可能大大缩水。XFFL 329/17b–24a.</li>\n<li>被裁的一千三百名乡勇中，大多数人回到秦岭山区的家乡——他们都有产有业。五十三人被送回城固、洋县、西乡的家中；三十三人送回湖北；一百多人送回四川。只有二十四人参军。XFFL, 326/7a–b, 327/8b–11a, 334/24a–25b, 336/5b–6b, 336/13a–16a, 338/34b–37a, 339/9b–10a.</li>\n<li>XFFL, 339/29b–31a, 339/32b.</li>\n<li>勒保声称四川的防守乡勇已全部裁撤，但显然不是事实。在陕西，陆有仁也给人防守乡勇大多已裁的印象。他说到七月只剩百分之十到二十的防守乡勇，且他继续在裁。XFFL, 330/20a–b, 338/3a–b, 341/16b–17a, 343/24a–b. 然而，1802年底——他去世前不久——陆有仁奏报：陕西南部的防守乡勇大多已裁，但本省东南部（如紫阳、平利）的还没有裁。XFFL, 347/26a–27b.</li>\n<li>据德楞泰说，1803年间又裁了三至四万乡勇，还剩四五千。XFFLXB, 22/45b–46a. 因此，1802年底仍雇用的乡勇至少有三万五千至四万五千。实际数字可能更高。</li>\n<li>XFFL, 339/29b–31a, 346/22b–25a.</li>\n<li>见注释192。</li>\n<li>德楞泰论证说：大多数随征乡勇是四川人，要求在四川多设编制安置他们——因为三省新设的一万个绿营编制中，四川只有一千。嘉庆指示额勒登保与三省督抚审议。XFFL 329/17b–24a, 329/27a–29a. 但额勒登保与督抚们都没有下文。</li>\n<li>XFFL, 311/8a–b, 311/11a.</li>\n<li>据吴熊光奏报。XFFL, 333/16a–17b.</li>\n<li>方维甸1804年承认：在陕西，一些被裁乡勇在归途中逃跑，或被送回家后又离乡。XFFLXB, 27/24b–26a.</li>\n<li>嘉庆七年六月二十三日，罗思举在大宁擒获刘朝选，消灭了他四百人的队伍。为此，嘉庆赏勒保一等男爵。XFFL, 325/1a–10b. 汤思蛟于十月被擒。XFFL, 345/19a–24b.</li>\n<li>XFFL, 卷319、321–23、339、342、344–45、347 各处。</li>\n<li>XFFL, 卷322–27、329–33 各处, 329/24a–27a.</li>\n<li>XFFL, 333/9b–12b.</li>\n<li>XFFL, 卷334–36 各处。蒲天宝殒命前不久，四川的老叛军首领唐大信在巴东被追兵所逼，跳崖而死。XFFL, 334/33a–b, 339/1a–3b.</li>\n<li>XFFL, 334/16a–19a 及卷336–39 各处。</li>\n<li>关于额勒登保的湖北之行，见XFFL, 卷336–41、343、346 各处。</li>\n<li>XFFL, 卷339–41 各处。</li>\n<li>XFFL, 279/1a–3a.</li>\n<li>XFFL, 287/18a–20a.</li>\n<li>XFFL, 329/10a–11b, 331/21b–23b.</li>\n<li>XFFL, 334/19a–21a, 334/31a–32a, 335/6b–8a, 335/23a–b, 338/31a–34b.</li>\n<li>XFFL, 339/44a–b, 340/22b–28a, 341/26a–28a, 343/8a–9a.</li>\n<li>XFFL, 335/21b–23a.</li>\n<li>同时，嘉庆对额勒登保与德楞泰大加赏赐，赏其部队数百面银牌。XFFL, 338/31a–34b.</li>\n<li>XFFL, 339/3b–4a.</li>\n<li>XFFL, 342/10b–18b.</li>\n<li>XFFL, 339/44a–b, 340/22b–28a, 341/26a–28a, 343/8a–9a.</li>\n<li>XFFL, 348/29a–32a.</li>\n<li>XFFL, 347/20b–23b, 348/32a, 349/7a–8b, 349/18b–21b.</li>\n<li>戴仕杰被杀，另一首领被擒，但崔宗和与胡明远前夜已离队。数日后，崔宗和在保康被捕。XFFL, 350/22a–b, 350/26b–27b, 351/46b–49b; 崔宗和供词，BLJZL, 5:148.</li>\n<li>XFFL, 348/1a–9b.</li>\n<li>XFFL, 卷341–42、345–46、348–49 各处。</li>\n<li>长龄病重，被召回北京。XFFL, 337/11b–14a, 338/37a–38a, 339/40a–41b, 339/45b–47b. 孙清元被马踢伤。XFFL, 342/20a–27b.</li>\n<li>XFFL, 339/42a–43b, 345/18b–19a, 349/11b–14a, 350/16a–17b, 351/47b–48b; 吴熊光《伊江笔录》（Wu, Yijiang bilu），1/16b–17a。</li>\n<li>XFFL, 卷328、331–32、334–36、348–50 各处。</li>\n<li>嘉庆把惠龄的顶戴降为二品。XFFL, 卷348–51 各处。</li>\n<li>XFFL, 卷344、346–48 各处。熊翠于十一月被杀。XFFL, 351/34a–44b.</li>\n<li>XFFL, 347/20b–23b, 349/1a–8b, 349/14a–18a, 350/19b–25b, 351/16b–17b; 苟朝九供词，BLJZL, 5:163.</li>\n<li>XFFL, 349/27a–33b, 350/1a–5a.</li>\n<li>嘉庆把额勒登保的爵位升为三等侯，授穆克登布两个世职。XFFL, 350/13a–15b, 350/25b–26b, 350/33b–34b.</li>\n<li>XFFL, 350/40a–45b.</li>\n<li>XFFL, 351/13b–15b.</li>\n<li>XFFL, 350/19b–25b, 351/1a–7a, 351/34a–44b.</li>\n<li>XFFL, 卷350–51 各处。</li>\n<li>XFFL, 350/15a–b, 350/45b–48a, 351/13b–15b, 351/44b–46b.</li>\n<li>奏折中，他们开列了整个战役中消灭的一百多名叛军首领，声称数百名次要首领被杀。XFFL, 352/1a–6b.</li>\n<li>额勒登保被升为一等侯，再加两个世职与紫缰。德楞泰也升为一等侯，加一个世职与紫缰。其子苏冲阿升为副都统，奉命携礼赴前线看望父亲与额勒登保。勒保由一等男升为一等伯，加一个世职——嘉庆表示，他的功绩不足以发还被褫夺的公爵。获升赏者还包括明亮、赛冲阿、杨遇春、惠龄、吴熊光、姜晟、倭什布、福宁、英善、文成惠、杨揆与刘清。获赦者包括丰绅殷德（和珅之子）、宜绵（从伊犁获释）与景安（出狱，发往热河当兵）。XFFL, 352/6b–19b; QSLJQ, 106/8b–19a. 次日，嘉庆前往紫禁城北的寿皇殿祭祀列祖列宗。QSLJQ, 106/18b.</li>\n<li>XFFLXB, 1/1a–2b.</li>\n<li>SHD, 嘉庆七年十二月十八日, 7; XFFL, 352/17b–18a; QSLJQ, 106/20b–21a.</li>\n<li>SHD, 嘉庆七年十二月二十七日, 29–30.</li>\n<li>XFFLXB, 卷1–6, 7/26b–28a, 9/34b–35b, 11/26b–27a, 11/30b–32a.</li>\n<li>XFFLXB, 2/17b–19b.</li>\n<li>XFFLXB, 7/6b.</li>\n<li>东乡老叛军刘学礼——绰号\"刘扎胡子\"——率其五六百人在四川巫山击溃清军，杀伤近两百名士兵乡勇。竹山另一场战斗中身负重伤时，刘学礼确实战斗到了最后一口气。XFFLXB, 7/32a–37a, 7/37a–38a. 叛军首领胡元魁被捕时，要求被杀而非投降。胡元魁随后被剐磔处死。XFFLXB, 4/30a–b.</li>\n<li>XFFLXB, 8/1a–4a, 9/39b–40a.</li>\n<li>XFFLXB, 卷2 各处。</li>\n<li>XFFLXB, 3/2b–4a, 3/33a, 6/21a–23a, 6/26a–28a, 6/34b–36b, 8/12b, 9/6b–7a.</li>\n<li>XFFLXB, 4/17a–19b, 8/19b–21a, 9/6b–7a, 9/10b–12b, 11/33b–34a.</li>\n<li>XFFLXB, 卷2–3 各处, 4/27a, 11/38b. 嘉庆指示勒保把投降的叛军首领王国贤放回叛军中劝降。XFFLXB, 3/31a–32a.</li>\n<li>XFFLXB, 9/19a–20a.</li>\n<li>XFFLXB, 卷4–5 各处及9/10b–12b。</li>\n<li>到1802年九月已裁七千名乡勇，到次年正月又裁了三千二百。XFFLXB, 5/14b–15a.</li>\n<li>XFFLXB, 1/12b–14b, 5/34a–35a.</li>\n<li>XFFLXB, 3/29a–30b.</li>\n<li>XFFLXB, 5/1a–5b, 5/24b–26a.</li>\n<li>SHD, 嘉庆八年二月十八日, 55–59; 二月二十二日, 77–80; 二月二十五日, 89–93; 六月初五日, 14; XFFLXB, 5/5b–8a, 5/15a–18b, 5/23a–24b, 5/26a–31a, 5/35b–36a.</li>\n<li>XFFLXB, 5/39b–42b.</li>\n<li>XFFLXB, 5/42b–44b, 5/44b–45b.</li>\n<li>XFFLXB, 6/12b–13b, 9/33a.</li>\n<li>XFFLXB, 7/28b–32a.</li>\n<li>XFFLXB, 8/13a–15b, 9/1a–2a, 10/13b–14a.</li>\n<li>XFFLXB, 6/15b–16a, 9/36b, 13/30a–31a.</li>\n<li>XFFLXB, 8/25b–27b.</li>\n<li>SHD, 嘉庆八年三月初十日, 39–46; 三月初十日, 47–50; XFFLXB, 8/27b–32b.</li>\n<li>XFFLXB, 8/32b–36a.</li>\n<li>XFFLXB, 9/33a–34a, 10/25b–26a, 10/30b–31b.</li>\n<li>XFFLXB, 10/7a–10a. 五月齐国典被除后，嘉庆发还了额勒登保的御前大臣衔与紫缰。XFFLXB, 13/1a–8a.</li>\n<li>勒保抱怨腰腿疼痛、气喘、眩晕、失眠。然而，他并没有真正休息——这赢得嘉庆\"认真任事\"的称赞。XFFLXB, 9/16b–18b, 10/37b–38a, 11/25a.</li>\n<li>XFFLXB, 卷13–15。</li>\n<li>XFFLXB, 12/20b–21b, 13/10b–11b, 13/25b–26a, 13/34b–35a, 14/20a–21b.</li>\n<li>六月，额勒登保提议从战役中撤出所有旗兵与外省兵。XFFLXB, 15/7a–b, 15/23b–24b.</li>\n<li>XFFLXB, 14/12a–13b. 德楞泰的人马俘获八名劫掠的前乡勇时，他们供称：三两赏银不足以安身立命。XFFLXB, 14/25b.</li>\n<li>XFFLXB, 15/23a–26a.</li>\n<li>XFFLXB, 15/18a–19a.</li>\n<li>XFFLXB, 14/13b–15a, 15/19a, 15/31a–b.</li>\n<li>SHD, 嘉庆八年六月十二日, 37–42; 六月二十五日, 75–79; XFFLXB, 15/7b–10b, 15/16b–18a, 16/12a–14a.</li>\n<li>XFFLXB, 16/1a–3b, 16/34b–38b.</li>\n<li>XFFLXB, 16/33a, 16/38b–43a.</li>\n<li>QSLJQ, 116/34b–40a; XFFLXB, 16/43a–48a.</li>\n<li>QSLJQ, 117/1a–4b.</li>\n<li>XFFLXB, 16/10a–11a, 16/16b–17a.</li>\n<li>嘉庆指示对被裹挟平民的惩处定出统一规则：短期从叛者流放，长期从叛者解交督抚或额勒登保审讯，案情呈他裁决。QSLJQ, 116/40b–41b; XFFLXB, 16/48b–51a.</li>\n<li>XFFLXB, 17/8a, 17/47b–49a.</li>\n<li>XFFLXB, 卷18–19。嘉庆还试图把正赴热河途中的德楞泰调回战役。XFFLXB, 16/38b–43a. 显然，这道旨意未能及时送达德楞泰。</li>\n<li>那批乡勇共四五百人，在秦岭搜剿叛军残部时闹事，杨芳命吴廷刚遣散他们。然而，没有人护送他们到汉中、再送回四川。显然，那些乡勇在途中自行散去了。XFFLXB, 16/11a–b, 16/32a–b, 23/3b–4b, 23/17b–18a, 27/1b.</li>\n<li>XFFLXB, 20/35a–36a, 21/36b.</li>\n<li>十月初一个雾蒙蒙的清晨，陕西定远一场战斗中，他们杀死了数名清军军官，并数次冲击杨遇春的部队。XFFLXB, 21/20a–b. 吴熊光指出此股\"异常凶悍\"。XFFLXB, 25/12a.</li>\n<li>XFFLXB, 19/22a–29a, 20/36b, 20/38b–40a.</li>\n<li>XFFLXB, 15/24b, 15/32a–b.</li>\n<li>XFFLXB, 21/21b, 21/23b–24a, 21/35a–42b, 22/6a–9b.</li>\n<li>XFFLXB, 22/11a–16a, 22/25a–28a, 卷21–23 各处。吴熊光奏报：\"乡勇变叛军\"声称额勒登保不公正地遣散了他们，但他补充说，他认为这些指控是编造的，意在诋毁额勒登保与杨遇春。XFFLXB, 25/12a.</li>\n<li>XFFLXB, 22/28a–29b, 22/53b–56a.</li>\n<li>XFFLXB, 22/41a, 22/43b–47b.</li>\n<li>魏忠才的叔父魏四叔推动了七名乡勇之死。1796年，魏忠才曾因叔父奉教而向官府告发他。XFFLXB, 33/17b–18b.</li>\n<li>XFFLXB, 23/1a–6b.</li>\n<li>XFFLXB, 22/48b–53a, 23/8a–11a.</li>\n<li>XFFLXB, 卷23–25 各处。</li>\n<li>QSLJQ, 126/23a–24a; XFFLXB, 24/20a–22a, 24/23b–24b.</li>\n<li>XFFLXB, 24/12a–b, 24/37a–39a, 25/4b–6b, 25/13a–14b, 25/24b–26a.</li>\n<li>嘉庆发还杨遇春被摘的顶戴，赏军官与伤员礼物银牌。XFFLXB, 25/27b–34b.</li>\n<li>周世洪供词，BLJZL, 5:161; XFFLXB, 24/1a–b, 26/20a, 28/26a, 31/12b–13a.</li>\n<li>XFFLXB, 25/39a–b.</li>\n<li>到1803年九月初，陕西已裁两千五百名乡勇。四川在八九月间遣散了五千多名乡勇。湖北方面，吴熊光在十月加快了裁减剩余两三千名乡勇。XFFLXB, 卷17–18、20 各处。但吴熊光1804年初提议：湖北最后一批乡勇到战役结束前不裁，免得他们有讨价还价的机会——嘉庆同意了。XFFLXB, 24/3a–4a.</li>\n<li>XFFLXB, 24/3a–b.</li>\n<li>XFFLXB, 23/17b–18a.</li>\n<li>XFFLXB, 卷25–29 各处。</li>\n<li>他不赞成朱勋用自己\"养廉银\"提高乡勇遣散赏银。XFFLXB, 22/36a–b, 23/17b–18a.</li>\n<li>XFFLXB, 22/53b–56a.</li>\n<li>XFFLXB, 23/17a–19b.</li>\n<li>XFFLXB, 23/20a–21b.</li>\n<li>XFFLXB, 24/10a–12a.</li>\n<li>嘉庆还指示：被遣散乡勇分批护送回乡，每批不超过一百人，批与批之间隔数日。SHD, 嘉庆九年二月初九日, 69–71; XFFLXB, 24/14a–16a.</li>\n<li>XFFLXB, 29/6b.</li>\n<li>XFFLXB, 26/1a–2b, 26/11a–24a.</li>\n<li>XFFLXB, 26/28a–29b.</li>\n<li>XFFLXB, 26/33a–36b, 27/27b–28b.</li>\n<li>XFFLXB, 27/9a–11b.</li>\n<li>XFFLXB, 27/16b–18b.</li>\n<li>他们被褫夺荣衔、顶戴与紫缰。此外，德楞泰被降为二等伯，褫夺参赞大臣之职。嘉庆还指示额勒登保严厉申饬杨遇春及其部属。XFFLXB, 27/18b–23b.</li>\n<li>他指示他们裁掉不顶用的乡勇，只留精壮——剩下的少了，就好管了。XFFLXB, 28/5a–7b, 28/9a–10a.</li>\n<li>XFFLXB, 23/19b–20a, 27/33a–b.</li>\n<li>XFFLXB, 27/24b–26a.</li>\n<li>XFFLXB, 27/24b–26a, 27/28b–29a. 吴熊光不止一次指出：没有劫掠机会，乡勇就失去了作战动力。XFFLXB, 10/13b–14a, 27/27b–28b.</li>\n<li>对勒保不置可否的态度不满，嘉庆让他采用方维甸的办法：把乡勇雇为地方衙门差役。XFFLXB, 28/31a–32b, 28/34a–35a.</li>\n<li>XFFLXB, 27/30a–35a, 28/7b–9a, 28/14a–15b, 28/27a–29b, 28/29b–30a.</li>\n<li>在京期间，他一再拒绝嘉庆重返战争的请求。XFFLXB, 27/19b–20a.</li>\n<li>XFFLXB, 29/6a–7b.</li>\n<li>嘉庆派一名侍卫与一名御医赴前线照料额勒登保，允许他坐轿回京，无需赶上随驾木兰。XFFLXB, 29/1a–5a, 29/7b–12b.</li>\n<li>XFFLXB, 29/17a–22a, 29/24b–33a, 30/1a–3a, 30/7b–8b.</li>\n<li>XFFLXB, 29/8b–9a. 那彦成一到任，就弹劾兴安的两名地方官安置被遣散乡勇不力，请求惩处。XFFLXB, 30/18b–19b, 30/23b–24a.</li>\n<li>对非随征乡勇，额勒登保给外省者七两、陕西者五两。随征乡勇，外省者十两、陕西者七两。参军者中，非随征乡勇得五两，随征乡勇得七两（遣散时二两置衣鞋，到营后五两）。XFFLXB, 31/1a–4a.</li>\n<li>XFFLXB, 29/22a–23b, 29/36a–b, 30/1a–3a.</li>\n<li>XFFLXB, 30/8b–15b. 赴西安途中听说此战，额勒登保停下行程，与杨遇春、丰绅相见，并协助审讯俘虏。XFFLXB, 30/15b–17b, 31/5a–6a.</li>\n<li>XFFLXB, 30/3a–6b, 30/24a–26a, 31/11b–15a.</li>\n<li>因苟文润之死，嘉庆发还了德楞泰、赛冲阿与田朝贵被褫夺的职衔顶戴，包括德楞泰的参赞大臣之职与爵位。XFFLXB, 31/19b–21a, 31/25b–28a.</li>\n<li>XFFLXB, 31/19b–25b, 31/29b–33b, 32/8a–16a.</li>\n<li>除给将领与部队送去许多小礼物与数百面银牌银锭外，嘉庆只让吏部审议对德楞泰、赛冲阿、杨遇春、丰绅、马瑜、庆成、田朝贵、熙明、王兆梦与庆溥的奖赏，并把吴廷刚升为记名总兵。次日，嘉庆发还了方维甸的顶戴。XFFLXB, 32/16a–21b, 33/3b–4a; QSLJQ, 134/3b–6b.</li>\n<li>XFFLXB, 32/24a–25b.</li>\n<li>XFFLXB, 32/16a–20a. 此后，嘉庆定期重申这一指示。XFFLXB, 卷32–33。</li>\n<li>三省都奏报了劫掠。XFFLXB, 18/32b–33a, 18/38b–39b, 19/3b.</li>\n<li>XFFLXB, 卷17–23、30–32 各处。周世洪的供词详述了这种庇护。BLJZL, 5:160–62.</li>\n<li>XFFLXB, 33/5a–6a, 33/8b–10b.</li>\n<li>XFFLXB, 33/28a–31a, 33/35a–36b.</li>\n<li>XFFLXB, 33/35a–36b.</li>\n<li>关于陕西，见XFFLXB, 31/35a–38a, 33/24a–25b. 关于湖北，见XFFLXB, 33/33b, 34/11a.</li>\n<li>XFFLXB, 32/25b–26a.</li>\n<li>XFFLXB, 33/12a–17a.</li>\n<li>XFFLXB, 34/13b–14a, 34/33b–34a.</li>\n<li>XFFLXB, 35/20a–22b.</li>\n<li>XFFLXB, 36/13a–14a.</li>\n<li>XFFLXB, 36/23a–25b, 36/27a–28a.</li>\n</ol>", "text": "\n将领们之所以未裁尽乡勇，是因为贼匪尚未了结。不应出现这样的情况：因为裁减乡勇困难，将领们就故意把最后几股贼匪留着不了结。\n——方维甸，1804年\n[译者按：原奏自英文直译，文言原文待核。（出处见章末注释）]\n\n1800年之后，白莲教战争又拖了四年。冲突是极不对称的——清军的规模总是起事者股团的许多倍。然而，前者进展缓慢，嘉庆皇帝设下的期限被一次又一次地延长。在嘉庆的催逼下，战役主持者们于1803年初奏报胜利，但军事行动仍在继续。1803年夏末，第二次宣布胜利，但又一次为时过早。此后，直到1804年秋，才再次——也是最后一次——宣布胜利，尽管对叛军残部的搜剿一直持续到1805年。这漫长而痛苦的收尾阶段，一再唤起一种似曾相识之感。\n讽刺的是，过度拖延的主要原因与起事者无关，而是裁撤数万乡勇的任务。大规模雇用平民承担作战与辅助军事任务，堪称这场战役最突出的特征。它的起源、机制与动态将在下一章讨论，它巨大的财政代价与造成的漏洞将在第7章考察。本章勾勒的，是清退这些平民作战人员这一充满麻烦的过程——它大大复杂化并延误了对叛军残部的肃清。将领们不愿及时遣散乡勇，乡勇们也讨价还价以求利益最大化。从1802年底起，一些被遣散的乡勇加入了起事者，进一步加深了镇压者的困境。\n拖延的战争，1801年\n1800年底，嘉庆估计仍在逃的起事者只有两三万，其中大多数是被裹挟的平民。^1 新年（1801年2月13日）将至，皇帝再次陷入焦虑。他虽公开说希望在新年庆典上宣布胜利，私下却担心：即便来年春天他去谒陵、为乾隆服丧期满，也未必能报捷。嘉庆责成军事将领们加快行动、文官们协助阻止叛军流动。然而，他不得不现实一点。新年前三周，嘉庆把奏凯的期限从年前延到三月底。^2 新年过后不久，他对起事者强硬起来，宣布不接受五名主要叛军首领——徐天德、王廷诏、高二、高三与马五——的投降，尽管次要首领投降可以免死。他为杀死或擒获这五人设立了重赏，并命官员广为宣示这项新政策，警告说：如果起事者自己擒了首领送官，任何人不得邀功。^3\n然而，他的统帅与他不在一个频道上。额勒登保非但没有筹划结束战役，反而建议：把所有残余起事者赶向襄阳，以便利清军补给；并从全国招募更多地方官来主持陕鄂两省的筑堡工程。^4 额勒登保不承诺结束战争、却大谈可能数月才能见效的计划，令嘉庆震怒，他彻底否决了这两项建议。^5 1801年开局不利。\n四川战场\n如上一章所述，到1800年底，四川的战事已大大减弱。1801年开始时，只有数千名起事者分成几股，藏身于广元、南江与太平的大巴山中。^6 然而，数月以来，德楞泰与勒保一直未能消灭他们。新年前数周，嘉庆批评二人多日不战，不久又把德楞泰的爵位降为一等男，把勒保的顶戴降为四品。他相信四川剩的活儿不多了，命德楞泰赴陕，让勒保与七十五在四川清剿。^7 然而，仅仅数日后，听说四川一场\"可观\"的胜利，嘉庆又把德楞泰的爵位升为三等子，把勒保的顶戴升为三品，并各赐一个御笔\"福\"字，尽管他仍坚持德楞泰赴陕。^8\n但德楞泰借口广元出现新的紧急事态，推迟赴陕。^9 然而，到了广元后，德楞泰对七十五大为恼火——七十五驻节广元，有六千多名士兵，却对叛军几乎无所作为，战斗中也帮不上德楞泰。德楞泰向皇帝抱怨七十五的同时，于十二月十日在南江与勒保会面后前往陕西。^10 他的突然离去令嘉庆吃惊——这让他想起一年前额勒登保与德楞泰撤出四川、导致起事者渡嘉陵江的事。^11 随后勒保折回东面，说那里出现了新的起事者。新年将至，勒保却找借口不赶往热点。四川的军事行动陷入了停顿。^12\n直到年后，勒保与七十五才再次上路。他们分了工：勒保负责川东与嘉陵江下游河谷，七十五负责川北与嘉陵江上游河谷的军事行动。七十五——已被皇帝申斥——前往边境与叛军交战，勒保则再次西行，保障嘉陵江安全。^13 由于七十五的军事行动——他杀死了张世龙，击溃了张世龙两千来人的队伍——辛聪、陈朝观、阎胜可、魏棒棒与李彬等几股进入了西乡。然而，听说德楞泰正赶往西乡，他们又返回了四川。在太平，汤思蛟、刘朝选等藏身那里的几股加入了他们。正月初七日，多股叛军——据说总计八九千人——在一场战斗中令镇压者们震惊，杀伤数名军官与数目不详的士兵，随后南下，先到开县，再到云阳。^14\n与此同时，樊人杰、王士虎与冉天泗率数千人从宁羌突入四川。攻取广元城、在苍溪西渡嘉陵江均告失败后，他们移向仪陇，在那里被阿哈保与薛大烈击溃——薛大烈是久经战阵的绿营军官，时任四川总兵——损失两千多人，包括樊人杰的妻子与徐万富。又遭七十五与薛大烈攻击，这支队伍再损数百人，包括在通江一场战斗中阵亡的王士虎。只剩一千人的樊人杰决定南下，与辛聪、陈朝观会合。^15 到二月中旬，合并的起事者到达巫山，准备突入湖北。然而，七十五与罗思举把他们逼回北方。对下一步去向无法达成一致，他们分了手。辛聪、汤思蛟与刘朝选留川，陈朝观、魏棒棒与阎胜可率三千人于三月初进入西乡。大约此时，樊人杰在自己的股团被击溃后从镇压者的雷达上消失了。最可能的是，樊人杰随其他股团去了陕西。^16 显然意在阻止叛军回川，勒保尾随他们到川北边境，让七十五进入陕西与他们交战。直到月底勒保需要七十五对付汤思蛟与刘朝选时，才把他召回。^17\n此时，汤、刘一股是四川唯一的大股。^18 汤思蛟与刘朝选都是东乡起事者，王三槐与冷天禄死后成为\"元帅\"。在四川与竹溪的边境游荡了一段时间后，汤、刘于1801年初合并。^19 藏身太平与开县的山区、劫掠当地居民的堡寨，他们吸纳了其他几个小股，队伍扩大到五六千人。在勒保与七十五的压力下，汤、刘一股先到大宁，在那里与辛聪、王士虎会合，随后在清军发动协同攻击时于初夏越过边境到竹溪。^20 目前，这股叛军离开了四川。\n尽管川北、川东有一万多名作战兵力——还不算守城守卡的正规军与数万乡勇——四川的清剿却没有取得决定性进展，尽管嘉庆一度认为，光凭乡勇就能对付这些匪类般的残部。^21 勒保一如既往地满口应承，不厌其烦地自吹自擂：把当地居民安置进堡寨。至于行动，勒保忙于东奔西跑，却很少打仗。与敌人遭遇时，他不是找个借口离开，就是让随行的两位将领阿哈保与薛大烈承担战斗的重担，自己躲在后面。他虽然口口声声要把陕鄂两省的全部叛军赶向四川加以剿灭——这是他不对付入川叛军、反而放他们深入本省腹地的借口，这令皇帝十分恼火——实际上却把起事者赶向了陕西或湖北，正如他对陈朝观一股与汤、刘一股所做的那样。^22\n这一年里，嘉庆无数次严厉而尖刻地斥责勒保。^23 他认为，勒保1799年因不去前线、坐守达州而被罢免，如今便以来回奔波来显示自己的勤勉。但皇帝不领情：\"你带兵在川，忽而北驰，忽而东驰，一而再、再而三。如此，不仅疲敝士卒，而且虚耗经费。显然，你是有意拖延，坐待事机。\"（原文待核，见注释24）^24\n嘉庆清楚勒保不是能干的将领——他认为叛军之所以入川，是因为他们知道勒保是众将中最弱的一个——还斥责他：惯于去别的将领所到之处，以便分享人家的战功，自己却从未打过一场真正的仗，更别说消灭任何一股叛军了。皇帝一度怀疑，被勒保杀死的人可能都是平民。对勒保的空话与无休止的借口感到厌倦，嘉庆毫不留情地揭穿他的自相矛盾：\"贼入山林，你便说冰雪险径，难以进入；贼出平地，你便说贼势分散，难以合围兜剿——你就是这样自相矛盾。然后每十日上一道奏折应付了事，报称杀死零星贼匪，每次数十或上百。如此，何日方能尽歼贼匪？\"（原文待核，见注释25）^25\n然而，勒保总能设法把局面应付到最好。他知道嘉庆对嘉陵江安全深为关切，于是每当回避赴前线、回避打仗时，就常常用视察江防作借口。此外，他还以守江为名多雇乡勇。^26 如本章稍后所述，裁撤还是保留乡勇之争，将成为中枢当局与战争当局之间旷日持久的冲突。勒保不遗余力地维持乃至扩大乡勇规模，即便叛军人数已大大减少。\n湖北战场\n1801年开始时，湖北只有高二率领的一股叛军。1800年底返回湖北后，高二通过裹挟当地居民，把几百人的队伍扩大到三千人，但他南移的企图在十一月二十三日东湖一场激战中被清军挫败。^27 然而，此时徐天德的黑号——六七千人——突入了竹溪。^28 嘉庆震惊而愤怒，严厉斥责倭什布边防失守，把希望寄托在颇受推重的新任湖广总督书麟身上。^29 书麟\"昼夜兼程\"（原文待核，见注释30），于十二月初到达襄阳，随即赶赴武当山区。^30（地图5.1）\n在房县秦口，徐天德与只剩一千人的高二会合。又有从陕西来的一股加入，他们的人数合计可能超过一万。^31 然而，几场小规模冲突之后，合并的起事者于十二月十五日在泉溪被击溃。^32 这场败仗或许警告了起事者：面对占优的清军，不要聚在一起。新年前数日，高二前往平利。^33 徐天德留了下来，但他的人马分成小队，深入竹山、竹溪常常无路可走的深山。这迫使镇压者们以较小的单位在山中跋涉，抛下重型装备与后勤队伍。起事者在武当山以南横行，攻打竹溪与竹山县城，两城都未攻下。尽管在湖北挣扎，徐天德仍坚持前往河南的计划——这个计划或许是他上年秋天在陕西与王廷诏、马五、高三会面时定下的；他派信使到陕西，召唤那里的叛军来鄂。^34\n正月二十三日，在陕西会合的苟文明与李彬——通江起事的老叛军、蓝号首领——率其数千人越过边境到竹溪，随后南下。^35 到二月，苟、李一股与徐天德一股在连遭重创后都到了兴山。^36 在多山的兴山，两股与该地区其他几股——包括戴家营——在山顶筑垒自固。三月初，清军对叛军据点发起协同攻击，迫使徐天德与苟文明分手。^37 书麟与其同僚认为湖北战场的七千名士兵不够，一再恳请朝廷增援；在招募更多乡勇的同时，他们请江西派三千名士兵来。书麟还致信德楞泰，请他赴鄂。嘉庆起初不愿意，三月初二日才命德楞泰前往湖北。^38\n事实上，接到皇帝指示之前，德楞泰已在追击经大宁从陕西入鄂的龙绍周途中到了湖北。二月初，额勒登保派德楞泰对付龙绍周。然而，他等了近两周才出发。^39 在大宁，德楞泰追上了龙绍周，据说杀俘数千。然而，战后他再次暂停，等待朝廷的赏赐与礼物——这给了龙绍周逃脱的机会：龙绍周用一支分遣队把德楞泰引向太平，自己则前往湖北。直到战后十天，德楞泰才于三月初八日到达湖北。龙绍周在鄂停留时间很短。与苟文明短暂会合后，龙绍周经三峡北岸返回四川。德楞泰留鄂对付苟文明。^40 龙绍周离开后，苟文明在兴山再次与徐天德合并。冒着不可徒涉的河流与幽深无路的森林，这两股合计七八千人的队伍使敌人疲于奔命。然而，四月初清军终于追上他们时，他们遭受了巨大损失。^41\n与嘉庆\"数日内即可全歼\"的期望相反（他因此发还了德楞泰被摘去的双眼花翎），两股都活了下来。苟文明返回四川，徐天德前往竹溪，在那里与从平利来的几股会合——包括樊人杰、曾芝秀与陈朝观率领的——合计约有六千人。直到四月二十日，德楞泰才与他们交战，随后追击合并后的起事者到平利。湖北再次解除了大规模冲突。^42\n湖北平静前夕，书麟于四月初九日病逝。短暂的任期内，书麟曾认真努力地迅速结束这场漫长的战役。一到任，他就赶赴前线。有时，他不得不下马，与士兵们一道跋涉在融雪浸湿的山间。^43 书麟对乡勇不以为然，极力主张更多地依靠正规军。他还反对沿多山边境处处驻军，建议把兵力集中到人口较多的地方。^44 书麟与明亮自第二次金川之役起就有交情，一直支持明亮，总是对他评价甚高。经书麟之请，嘉庆把明亮留在湖北，并恢复了明亮上奏之权——这一特权此前被剥夺了。^45 嘉庆二月二十四日设立湖北提督一职、任命长龄为首任提督时，又安排明亮接任长龄原先的宜昌镇总兵。^46\n德楞泰虽然帮助把起事者逐出湖北，却再次施展拖延战术，行动迟缓，常常跟丢敌人。^47 尽管嘉庆因多日听不到他的消息而恼怒，德楞泰还是在两次战斗之间闲度数周。嘉庆知道德楞泰惯于索要过多的经费给养，曾让书麟充分供应德楞泰，并表示愿意从国库拨一些钱。^48 然而，德楞泰对湖北效率低下的后勤大为不满。离开湖北后，他向额勒登保痛诉，导致倭什布被罢免。^49 嘉庆起初打算让倭什布接书麟之位，最终却任命吴熊光为新任湖广总督。^50\n陕西战场\n1801年初，陕西的局势更复杂。苟文明、龙绍周与戴四一直在汉江以南穿梭，试图渡江。在川陕边境，藏身林中的小股不断尝试进入陕西——或合伙，或单独。在长麟督率下，陕西军队一直把他们逐回四川。^51 在汉江以北，冉学胜未能到达栈道以西后，在秦岭与樊人杰、王士虎、冉天泗会面。^52 他们一同前往商州，目标是突入河南。额勒登保知道起事者一旦入豫朝廷就会震怒，遂赶赴商州，于新年前两周把这两股逼离边境。^53 折向西后，冉学胜与樊人杰分手。樊人杰一股突入甘肃失败后，年后不久前往四川广元；冉学胜一股则在汉江上游谷地遭受杨遇春与格布舍的毁灭性打击，尽管冉学胜也让镇压者付出了可观的伤亡。此后冉学胜回到秦岭藏身。^54\n尽管清方高度戒备，一些起事者还是到了汉江以北。十二月十八日（1801年2月2日），数千人的高马股在数次失败尝试之后，在安康五块石渡过汉江。^55 十天后，十二月二十八日，刚被逐出湖北的高二在旬阳大棕溪渡过汉江。随后他迅速移向豫陕边境——因为陕西的大部分清军已西去与冉学胜、樊人杰作战。^56 额勒登保立即派杨遇春与格布舍对付已进入秦岭的高马股，命德楞泰对付高二一股（他们以为那是徐天德的队伍）。^57\n与往常一样，德楞泰行动迟缓。然而，正月十三日他终于追上高二时，两场战斗就击溃了这股叛军——先在山阳干沟，后在镇安野猪坪，高二于正月十八日被杀。德楞泰随后放慢了脚步，跟丢了高二的残部，听任数百人加入了高马股。^58 二月初，额勒登保把闲着的德楞泰派到汉江以南对付龙绍周与苟文明，由此引出德楞泰赴鄂之事，如前所述。^59\n到元旦，嘉庆已有十多天没听到陕西战场的消息，连将领们的新年贺表都没收到，这更加深了他的困惑：为什么将领们\n不希望早点结束战役回家。^60 如第4章所述，嘉庆1801年新年没有给部队任何金钱犒赏；他唯一的恩典，是给三个战场各拨一万两置办军衣。或许是意识到没有惯常的年终犒赏可能有害，他试图补救。年后两周，嘉庆拨十万两白银给额勒登保与德楞泰犒军，并派两名朝官倭星额与邱兴健赴陕，押送银两、犒赏该战场将领。^61 与上年周兴岱的使命相似，这两位官员还将搜集关于起事者与镇压者的第一手情报。\n起初为高二被除而欣喜的嘉庆，很快就泄了气——德楞泰与额勒登保似乎都没有动力去了结残破的叛军股团：高二死后近两周，他们又没有上奏。嘉庆给了额勒登保与德楞泰各一次\"申饬\"，再次提醒他们：他希望来年春天谒乾隆陵时能够报捷。然而，他也意识到三月底前奏凯不可企及。他再次延长期限：三月内了结大股——那时他还没脱掉丧服——四月完成清剿，好让额勒登保与德楞泰及时回京，秋天陪他谒陵。^62\n终于，又一条好消息传到了紫禁城：与高马股在一起的王廷诏于二月中旬被擒。冬季山中求生艰难，高马股先试图到达富庶的西安平原，随后又企图经甘肃入川。无法突入甘肃，它转而南向勉县，在那里遭杨遇春伏击溃败。由于与马五发生冲突，老叛军王凌高带走六七百人前往四川广元，主力则沿川陕边境移动。杨遇春追上该股、杀死许多人之后，王廷诏在西乡边境被擒。^63 嘉庆清楚地知道王廷诏的分量，欣喜若狂，举行了自1798年底王三槐被擒——那时还是他父亲主政——以来最盛大的庆祝。^64 遵他之命，王廷诏被押解北京——这是最后一个被解京的叛军。王廷诏先在西乡受额勒登保审讯，随后在北京被反复审讯、受刑，最后被凌迟处死。王廷诏堪称叛军首领中最老辣的一个，回答问题小心而圆滑，不透露任何可能损害残余起事者或教门网络的信息。被擒时，王廷诏随身布袋里装着他祖父的画像、两道咒语与一页教门文书（shu）。他承认祖父是显赫的教门师父、他家与鹿邑王家过从甚密，却坚称自己不识字、并未奉教：1796年他在襄阳被叛军俘获后被迫入伙，叛军尊重他、善待他，只是因为祖父的名望。^65 因此，要从他的审讯记录中提取可信信息，必须谨慎鉴别。^66\n王廷诏被擒后，士气低落的高马股移向宁羌，在那里与其他几股会合——包括离去的王凌高一股——规模增至一千人。但它很快就在三月中旬清军的连续打击下瓦解。四月初一日，杨遇春等人在二郎坝一场伏击中几乎全歼了这支队伍，俘获了高三与马五；幸存者投奔了藏身川陕边境的叛军股团。嘉庆欣喜若狂，命把高、马就地剐磔（luange），在被这支队伍杀死的军官灵位前处决。^67\n不久，徐天德也走向了末日。徐天德与樊人杰从湖北返回平利后，分成小队西移，于四月二十三日在旬阳涉水北渡汉江。然而，尾随该股到北岸的德楞泰（尽管他迟了一天才到江边）很快于五月初七日迫使他们退回汉江以南。一周后，德楞泰与庆成在皮河铺击溃了该股，俘获了徐、樊二人的妻子。逃跑途中，五月十七日，徐天德在紫阳新滩渡河时溺毙——连日暴雨使任河暴涨，徐天德与数百名起事者及其家属挤乘一条船渡河，船覆人亡。该股其余部分被比德楞泰先到江边的赛冲阿击溃；只有一百来人幸存，逃入森林。然而，樊人杰在皮河铺之战后与徐天德分手，最终回到了湖北。^68 徐天德死前不久，陈朝观在旬阳被乡勇擒杀。^69\n尽管五名主要叛军首领在1801年中点之前全部殒命，对陕西次要首领的作战却更加旷日持久、更加费力。在汉江以北，伍怀志吸纳其他股团残部、裹挟当地居民，把队伍扩大到三千多人，在秦岭进进出出。额勒登保派去对付伍怀志的穆克登布与丰绅，数月无所建树。在给皇帝的奏报中，额勒登保不厌其烦地抱怨地形艰险，却无意寻找克服障碍的办法。五月下旬，伍怀志及其最后的数百人被迫逃入宁陕（旧称五郎）无路可走的深山，六月初一日在一处崖顶被了结。伍怀志跳崖后被擒。^70\n江北的另一股是高二的数百名残部，由高二的亲戚、副手高建启率领。^71 这股也数月出没于秦岭，有时逼近甘肃。起初，对付这股的是刘之仁与罗昂率领的当地绿营兵与乡勇。四月下旬，该股窜往甘肃秦州时，长麟急忙赶去，先把它压回陕西，再把它逐向四川。高建启一股沿嘉陵江迅速南下、离陕西越来越远时，长麟把它留给了勒保处理。^72\n可以说，陕西令清朝最沮丧的作战，是对付冉学胜——一个异常顽强的起事者。二月中旬，冉学胜率其一千人的队伍走出秦岭，从凤县侵入甘肃。在甘肃，冉学胜北渡渭河，裹挟了许多当地居民，夺取了数百匹骡马。无法抵达陕西千阳，他再次南渡渭河，返回陕西留坝。追冉学胜入甘的长麟，总是比敌人慢一两步。在留坝，冉学胜裹挟了更多当地居民扩充队伍，还弄到了约两千匹骡马。三月十三日，冉学胜把总兵杨奎猷及其四千名士兵诱入埋伏，杀死至少三百名士兵与二十多名军官；杨奎猷侥幸逃生。^73 然而，长麟在凤县截住冉学胜后，他损失了大量人马与牲口。为补充人手与牲口，冉学胜再次入甘，于三月二十九日再次北渡渭河。^74 听说千阳一个教门社团刚刚发动了一场未遂起事，冉学胜还打算去招募那里幸存的教众。^75 在陇州，冉学胜一场战斗击败了长麟，留下一百多名士兵乡勇的尸体。^76 然而，四月初五日，额勒登保及其亲兵——由扎克塔尔、桑吉斯塔尔（金川人，自幼被带到北京，成为旗军军官）与杨芳率领——与庆成的部队一道，在曹柏峪的一处狭谷给了冉学胜决定性打击，尽管清方也损失了数十名士兵与数名军官，包括额勒登保的弟弟。^77 冉学胜没有听从部下的建议回陕，而是前往固原——那里地势平坦，便于他众多马匹快速行进。直到四月初十日在固原张义堡被额勒登保再次击败，冉学胜才折回，南渡渭河，返回陕西。^78\n在陕西，冉学胜被迫南移，四月二十五日在洋县南渡汉江。额勒登保知道冉学胜已不如从前危险，把战斗交给了杨遇春与扎克塔尔。确实，冉学胜再也没能接近汉江。短暂窜入竹溪与竹山之后，冉学胜在旬阳与其他几股会合，但很快又分手了。^79 失去全部牲口后，冉学胜与其最后的数百人于七月初前往大宁徐家坝。\n1801年上半年，嘉庆一直对陕西迟缓的军事行动怒火中烧，常常斥责额勒登保拖延，给他\"申饬\"。有一次，他警告额勒登保不要重蹈那彦成蒙羞的覆辙。嘉庆对其他将领也不满意：批评穆克登布对伍怀志行动迟缓，责备德楞泰听任徐天德与樊人杰北渡汉江。^80 他尤其对长麟对冉学胜的糟糕作战怒不可遏。怀疑长麟伪造情报，嘉庆让额勒登保与陆有仁秘密监视他。最后，他解除了长麟的军事职责。^81 一直处于守势的额勒登保，在陕西战局转向有利于他时，反应强烈。春末又一轮圣训批评之后，他辩称自己没有任何拖延作战的理由，指出他甚至因战役错过了母亲的葬礼。同时，他向嘉庆保证：军事行动\"数日内\"即可大体了结。^82 显然，额勒登保过于乐观了。\n1801年底\n三月初，两位钦差倭星额与邱兴健从陕西启程回京。由于被俘的王廷诏要解京，额勒登保请二位钦差随押解队伍同行，沿途照应。押解队伍由三位旗军将领——他们在战役中效力多年，正返京——与一名陕西知县率领。此外，额勒登保还派自己的后勤大员朱勋随行。^83 人员齐备的押解队伍里放进朱勋，耐人寻味：他或许另有使命。朱勋可能受额勒登保之命，给两位钦差在京的府上送\"礼物\"——因为二人返家时携带超大行李太过显眼。\n倭星额与邱兴健的奏报——他们回京数周后才呈上——令史家失望。他们乐于对在陕西从额勒登保及其部下那里听到的一切\"疑罪从无\"。他们附和将领们的观点，奏报说战役进展迟缓的原因是叛军人数减少，这反而使与之作战更加困难。他们还转述了额勒登保的意见：他不需要援军，但希望把省下的经费用于犒赏已部署的部队。论及战争财政，他们以运输给养的高昂费用为战役的巨额开支辩护。此外，他们说规定的运输工价太低。他们指出的唯一问题并不新鲜，而是朝廷早已知晓的：受雇乡勇的无能。他们称乡勇为\"乌合之众\"，批评他们训练无素、纪律松弛，并把战时腐败归咎于他们。然而，他们很快补充说：额勒登保与德楞泰麾下的乡勇是例外——两位将领已把他们训练成能战的士兵。至于对战争领导层的评价，倭星额与邱兴健只称赞额勒登保，对德楞泰则语带保留：\"我们未与他见面，但听说他谙习军务，确实能战。近来操守亦有改进。\"（原文待核，见注释84）^84 他们点名批评的唯一高级官员是长麟。或许是知道皇帝对长麟的不断批评，他们建议把长麟的部队拨给额勒登保——因为长麟不适合带兵。嘉庆解除了长麟的军事职责，但让额勒登保对两位钦差的其他建议——主要涉及地方防务与地方驻军训练——自行斟酌，不过他让额勒登保认真管理乡勇的饷银。然而，两位钦差确实奏报了一些皇帝想听的话：他们觉得战役已近尾声，奏报说三省在逃起事者只剩两万，比以往任何时候都更残破、更沮丧。于是，他们预言战争将在来年秋天或冬天结束。^85 夏天推进，前线的消息似乎印证了他们的预言。先是冉学胜被逐离汉江，接着徐天德死了。再次看到一线曙光，嘉庆掩饰不住兴奋，期待\"捷音将至\"。他再次设定期限：七月内肃清所有叛军股团。^86 然而，额勒登保提醒皇帝：除十来个主要首领外，还有许多次要首领，而这些次要首领可以轻易把叛军残部重新集结起来。^87\n显然，额勒登保不打算如期完成任务。嘉庆催促他赴鄂协助对付汤、刘一股——因为陕西已无多少事可做。但额勒登保在竹溪待了一个月，没取得什么成果。夏末返回陕西时，陕西最后的两千来名叛军大多已被压入大巴山。额勒登保移近川陕边境，督率山中搜剿，有时也突入四川。与此同时，在陆有仁督率下，陕西军队与乡勇在秦岭清剿叛军残部。尽管额勒登保与陆有仁不断作出乐观的预测，陕西的军事行动到年底仍未结束。^88\n徐天德死后，德楞泰又被额勒登保派去对付龙绍周——龙绍周春末从湖北返回四川（随后去了陕西，但很快被逐回四川），队伍有数千人。德楞泰仲夏到达太平后先休整，闲度数周，近一个月不与北京通信。直到七月初，他才在多山的大宁与龙绍周交战。两周内，德楞泰把龙绍周的人众减到只剩数百。然而，德楞泰又放慢了脚步，听任该股经长江北岸在川鄂之间往返，同时抱怨给养不足、部队艰辛，意在索取更多恩赏。^89 尽管对德楞泰的拖延日益恼怒，嘉庆再次妥协，赏他与他的军队礼物与银牌，并同意他们在消灭龙绍周后休整。^90 最终，龙绍周从竹溪渗入陕西后，德楞泰的部将赛冲阿、文春与马瑜于九月二十七日在平利杀死了龙绍周，全歼了他最后的二百人——而德楞泰当时在别处，据称是在收拢留在各地的伤病员。^91\n川东的夏天很安静；清军只打了为数不多的几仗——或把叛军逐向陕西，或围剿被击溃股团的残部。^92 夏末，勒保宣布川东已肃清叛军。然而，在川北边境，高建启等人从陕西到来，使该地区不得安宁。高建启吸纳小股，把队伍补充到两千人。受皇帝批评催促，勒保终于在夏末离开达州，前往通江。勒保的人马先把高建启追到嘉陵江，又把他追回北部边境的大巴山，但总是比敌人慢。在山中，高建启与藏身那里的其他几股保持着松散的联系。^93 冉学胜在太平与大宁的山中藏身数周后，率其最后的四百人前往通江抢收庄稼时，与高建启走到了一起。八月初六日，四川军队袭击了他们。高建启逃脱，冉学胜被擒。^94 此后，四川军队把剩下的起事者压向陕西，促使陕西军队移向边境，出入四川作战。勒保再次退出，返回达州；陕西军队则取得了一些战果：杨芳与格布舍消灭了辛斗率领的齐家营一支；丰绅与桑吉斯塔尔在西乡擒获高建启、了结了他的股团；被击败的魏棒棒被平民杀死；杨遇春在川北击溃李彬。其中一场战斗中，杨遇春的人马俘获了许多此前被杀叛军首领的亲属。^95 四川剩下的大股只有夏末从湖北返回的汤思蛟、刘朝选一股。在梁山、大竹与垫江裹挟了数千人后，它移向嘉陵江。但勒保直到九月中旬——被嘉庆申斥、甚至提到\"军法\"之后——才出发对付这股。然而，勒保所做的，不过把该股赶向北部边境。直到1801年底德楞泰与勒保会合，刘朝选与汤思蛟才被迫分手，各带数百人离去。^96\n三省之中，湖北最接近完成战事。新任巡抚全保五月到达襄阳时奏报：湖北太平无事。整个夏天，湖北军队不断击退窜入竹溪的叛军。汤、刘一股虽在湖北停留良久，却始终无法接近城镇。^97 汤、刘一股离开湖北前不久，嘉庆把年近七十的明亮召回北京——他认为湖北战役大体已经结束。^98 1801年余下的时间里，湖北军队在长江以北的巴东、兴山陡峭群山中，以及竹溪、竹山、房县南部，搜剿小股与零散叛军。最大的两股是曾芝秀与戴四率领的，各有两千来人。^99 1801年底，嘉庆命一直驻襄阳的吴熊光前往鄂北中部，处理涌入该地区的难民，并让他考虑从湖北撤回军队。^100\n尽管听说叛军首领殒命总是兴奋，这一年接近尾声时，嘉庆的沮丧多于喜悦——他的期限一次又一次落空，而三巨头并不分享他对胜利的热切。七月将近时，他把期限延到八九月，认为干爽宜人的秋天是清剿的最佳时节。然而，他又不得不把它改为十月底。^101 为使三巨头负起责任，嘉庆责成三个战场报告剩余起事者的人数。夏末总数达到两万四千时，嘉庆警告额勒登保：他将从这个总数中扣除已消灭的叛军，如果数字降了、叛军却仍在横行，他要拿额勒登保是问。^102 起初，这个办法似乎奏效；总数不断下降。^103 受鼓舞的嘉庆再次愿意赦免投降的起事者，并指示地方官更积极地协助军队围剿零散叛军。^104 十月底总数降到两千时，嘉庆让三巨头在通江会面时讨论战役的收束，期望他们十一月内\"戡定大局\"（kanding daju），新年前肃清全部残部。^105\n但三巨头并不配合。1801年早些时候，额勒登保得知皇帝的数字已降到一万时，辩称他们奏报的数字历来是估计，低于实际；除一万有组织的起事者外，还有三千多名在股团覆灭中幸存下来的零散叛军。然而，额勒登保承认，没有必要保留已部署的七八万军队，建议在大股叛军被击垮后，遣返外省调来的旗兵与绿营兵，用战场本省军队与乡勇清剿，从而大大降低开支。但他回避了乡勇的费用，更不用说裁减他们了。^106 嘉庆对他们削减军队的意愿感到高兴，把额勒登保与德楞泰都升了爵；给选定的将领、旗兵、绿营军官与地方官升赏；还犒赏了军机大臣们。^107 不久，他估计有组织的起事者只剩两千五百、零散的只有三千，便开始筹划战争结束时让额勒登保回京。^108\n然而，除了围剿起事者，还有更重的利害。额勒登保摊牌了：他先请求升赏十几名参与战役的陕西官员。^109 随后他又请求增拨经费犒赏军民——最近要求平民协助清剿叛军残部——因为他出任统帅时所领的一万五千两犒赏银几个月前就用完了。嘉庆爽快同意了额勒登保的第一个请求，却对\"从军费中犒军\"表示不满。不过，他还是同意从他刚拨给川陕两省的四十万两中拿出十万两作犒赏之用——因为额勒登保承诺十一月内了结主要军事行动。^110 然而，对三省仍在雇用的数万乡勇，额勒登保完全缄口不言——尽管嘉庆一再敦促他裁减乡勇以省钱。^111 勒保与德楞泰也没有触及这个问题。只有庆成奏报说，他正在挑选保留精壮的士兵与乡勇、遣散瘦弱者，如果将来陕西设立新的绿营编制，他会挑选一些乡勇补入名册。接到庆成的奏折，一直纳闷三巨头为何对乡勇保持沉默的嘉庆，于十一月二十日颁发了一道关于解决乡勇问题的谕旨。^112 然而，战役中出现的一个转折，打断了他对此事的追究。\n罪魁是苟文明——四川巴州虔诚的教门中人。他四十五六岁，是罗其清的姻亲，1799年罗其清死后接管了四川白号的领导权。^113 正如倭星额与邱兴健所指出的，镇压者忽视了苟文明——没有任何将领负责与他作战——这使他得以长期藏身大巴山，庇护了许多已故叛军首领的亲属。1801年夏，樊人杰离开徐天德后与苟文明会合。随后他们在四川与湖北、陕西交界的险峻边境游荡，与其他几股——包括汤、刘一股——短暂会合。夏末七十五从湖北追汤、刘一股入川时，德楞泰派他去对付苟文明。十月下旬，樊人杰窜扰西乡之后，在通江与苟文明分手，前往湖北。与此同时，苟文明西移广元。^114 他们很可能是在试图迷惑、分散敌人，好让双方都到达各自计划的目的地。\n尽管此前毫无建树，七十五又被德楞泰派去追击苟文明。然而，出发之前，七十五先到太平厅城为其部队领饷，在那里待了六天。十一月十日三巨头在西乡会面后联名弹劾七十五表现拙劣，嘉庆训斥了七十五，命额勒登保调查他的拖延。然而，嘉庆更担心的是苟文明——他已把队伍扩大到两千多人。^115 嘉庆的担忧并非杞人忧天。十一月十二日到达广元与陕西交界后，苟文明趁夜渡过嘉陵江。数日后，他侵入甘肃。七十五赶到广元时，只截住了苟文明的队尾。^116 嘉庆震怒——苟文明侵入甘肃意味着冲突升级，粉碎了他新年前结束战役的计划。他对额勒登保与德楞泰同样怒不可遏：二人既不对七十五采取任何处分，也无心亲自追剿苟文明，只派庆成去对付他。嘉庆倾泻着沮丧\n嘉庆倾泻着沮丧与愤怒，罢免了七十五，并给了额勒登保与德楞泰各一次\"申饬\"。他还斥责勒保：苟文明入甘数日后，他竟还一无所知。^117\n不过，苟文明在甘肃的停留很短暂。无法经甘肃入川，苟文明被庆成与七十五逼回陕西。十一月二十八日（1802年1月2日），苟文明在宁羌渡过嘉陵江到东岸，返回广元。^118 尽管嘉庆对叛乱蔓延甘肃的担忧消散了，此事的发展对他却不是好兆头。额勒登保与德楞泰都持观望态度，行动迟缓被动，尽管嘉庆一再申饬催促。苟文明入甘十天后，额勒登保才到褒城，且就地驻留，派杨遇春率一万人的军队赴甘。额勒登保还让德楞泰留在川北对付一些叛军残部。直到苟文明返回四川，额勒登保才再次移动，与德楞泰会于广元。^119 显然，将领们并不热心于新年前结束战役。\n谈判胜利，1802年\n1801年遭受数次毁灭性打击、又失去了徐天德与王廷诏等关键首领之后，叛军正走向瓦解。1801年底，德楞泰估计在逃叛军还有六七千。^120 给养与弹药常年短缺——有时他们只有石头可用——通常避免与镇压者正面交锋。^121 就连最坚定的人也难免被悲观压倒。苟文明对部下说：\"白莲教的劫数已尽，我们迟早都是一死。\"（原文待核，见注释122）^122 然而，几乎没有坚定的叛军投降。1801年夏，德楞泰派两名投降的起事者去劝龙绍周的人马投降。龙绍周把两人都杀了。^123\n坚定的叛军被镇压者称为\"正贼\"（zhengzei），以区别于倾向逃跑或投降的被裹挟平民。正贼大多是湖北襄阳与四川达州、巴州、通江——1796年起义的发源地——的教门中人，许多人是那些起义已故首领的亲戚与密友。在皇帝的默许乃至鼓励下，清军越来越倚重\"大棒\"而非\"胡萝卜\"。尽管德楞泰保持着纪录，所有清军将领与督抚都大批屠杀俘虏，把首领凌迟处死。^124 鉴于这些杀戮是在一些后来获释的俘虏眼前进行的，真正起事者的可怖下场会远近传开，从而帮助坚定残余起事者死战到底的决心。他们保持着以颜色区分的编制，保留着\"元帅\"\"先锋\"\"总兵\"\"旗手\"之类的名号，打着标识各自首领的旗帜。一名首领被杀或被擒后，幸存者中就会冒出新的。尽管他们试图避开敌人，一旦遭遇清军，就战斗到最后一口气——这常常令镇压者们惊叹。^125\n与苟文明、樊人杰作战\n1802年开始时，唯一有实力的叛军股团是苟文明的。返回四川后，苟文明沿途吸纳小股、裹挟平民，把队伍扩充到三千多人。在四川，他攻打当地居民的堡寨，裹挟人口、夺取骡马。随后苟文明东移巴州与通江。德楞泰与额勒登保虽然都赶到了四川，却无意迅速消灭苟文明一股，无视\"正月内了结此股\"的期限，还抱怨各自兵力太少——每人只有两千名士兵。^126\n为警告将领们，嘉庆罢免了七十五。在十二月初九日给额勒登保与德楞泰的一道长谕中，他把七十五在太平滞留六天比作两年前魁伦滞留雷音铺——后者给了冉天元联盟渡嘉陵江的机会。^127 然而，额勒登保与德楞泰为七十五辩护，迫使嘉庆放弃了处决七十五的打算，接受了他们\"只降级、留用军中\"的建议。^128 仿佛要维护自己严厉正直的统帅形象，额勒登保与德楞泰提议对几名下级军官——大多是汉人——处以包括死刑在内的更重惩罚，罪名是在对苟文明作战中的过失。^129\n新年（1802年2月3日）前数周，前线的消息喜忧参半。在陕西，从四川来的数百名叛军于十二月初四日在汉阴北渡汉江，使江北——那里原本只有两三百名起事者——的局势恶化。^130 数日后，德楞泰在通江击溃苟文明，把他的队伍减到不足两千。^131 嘉庆先为渡江震怒，随后又为德楞泰的胜利欣喜。他尤其受额勒登保与德楞泰承诺的鼓舞——他们说苟文明一股十天内可以全歼，这样正月内完成战役仍可实现。^132 然而，新年临近，额勒登保与德楞泰都放慢了脚步。鉴于胜利在望，嘉庆没有给他们任何新年犒赏。即使听说额勒登保号召陕西官员捐出\"养廉银\"为部队购置冬衣，他也没有被打动而打开钱袋。^133\n一个清苦的新年对皇帝并不有利。额勒登保留驻川北，派德楞泰追苟文明到大宁。^134 但德楞泰到达大宁后，把作战交给刚从勒保那里要来的薛大烈。除夕，德楞泰借口一场应时的降雪，停止了所有行动——尽管薛大烈刚在一场战斗中击败苟文明，叛军正陷于绝望：苟文明的人马杀马骡充饥，数十人上吊自尽。^135 趁德楞泰懈怠之机，苟文明逃走，越过边境进入陕西。德楞泰不愿离开大宁——他以前在那里度过的假日与休整——只派薛大烈率五千人的部队追击苟文明，并告诉皇帝自己必须留驻，因为许多叛军残部从湖北来到了四川。震怒的嘉庆点名批评额勒登保与德楞泰不知羞耻，哀叹自己对二人的诸多恩赏竟未能激励他们更努力。^136\n一到陕西，苟文明就迅速向汉江移动。正月十八日黎明前，苟文明一股在西乡涉过冬季水浅的汉江。苟文明渡江三天前——元宵节那天——额勒登保跟丢了敌人。然而，他抱怨起事者跑得太快，雪覆的山路对他的部队太滑。在江北，苟文明的人马再次甩掉额勒登保，消失在秦岭中。^137 嘉庆大为震怒，批评额勒登保及其部下只顾庆祝新年而疏忽了敌人，并降了额勒登保的爵位与顶戴。^138 苟文明进入广阔的秦岭——清军此前在那里已被证明无能为力——可能使那里的叛军残部复活。^139 至少，它使嘉庆正月内完成战役的计划落了空。（地图5.2）\n为扭转局面，嘉庆转向新策略。二月初二日，他向三省全体将领督抚颁发了一连串谕旨，责成他们各自负责肃清本省起事者（他开列了各省仍在世的叛军首领名单）。他敦促府县官员发挥更积极的作用，责令其书吏差役报告叛军行踪。^140 此举意在分散战役指挥，使之成为三省各自的本地事务。两周后，嘉庆又朝这个方向迈了一步。他任命额勒登保为西安将军，以便额勒登保能指挥陕西全体官员。他虽然保留额勒登保\"经略大臣\"之衔，却宣布额勒登保不再是战役统帅——他认为没有必要设经略大臣这一最高临时军职去对付\"贼匪残部\"。^141 这一转变与皇帝对战役的新认识一致。如上一章所述，嘉庆1800年底已经认识到：中枢政府用国库经费支撑战役是个错误，本应把它当作本地事务、用本省资源供给。\n额勒登保性情使然，没有对这次事实上的降职表示不满。然而，手握两万多名士兵与乡勇，额勒登保数月未能消灭苟文明及其包括妇女老人在内的一千五百人。牲口已失，苟文明把队伍分成小队，自己率五百人深入森林。为搜剿分散的起事者，额勒登保也把部队分成小单位。零星杀死几十个或更少的起事者，额勒登保却未能把苟文明赶出森林。每隔十天左右，额勒登保就上一道奏折。无一例外，他抱怨苟文明的游击战术与冰雪、淫雨等天候造成的困难。^142 春末陕西其他叛军股团大多被歼灭后，嘉庆的耐心耗尽了。有一次，他爆发了：\"额勒登保所统之兵，多于贼匪十倍，竟不能攻、不能堵、不能追、不能截，真为尔等羞愧！\"（原文待核，见注释143）^143\n厌倦了皇帝不断的施压与批评，额勒登保转入了守势。^144 初夏的一道奏折中，他坚称自己的将领们都努力工作，有时徒步跋涉于无路的森林。他虽为未能迅速了结苟文明而愧疚，却宣布他无法按皇帝要求的那样在十到二十天内消灭此股。^145 五月二十七日接到这道奏折，被激怒的嘉庆立即下令：额勒登保与扎克塔尔象征性革职留任（gezhiliuren）。他威胁也要惩处杨遇春，但这一次没有。痛斥额勒登保时，嘉庆讥讽他的借口：如果说群山不可进入，山里为什么还有开垦玉米地的居民？叛军——连妇女——都能到达那些地方，部队为什么不能？愤怒的皇帝再给额勒登保一个月期限：消灭苟文明一股或亲手擒获苟文明，否则罢免惩处。同时，嘉庆为杀死或擒获苟文明设下高额赏格。^146 他还指示陕西巡抚陆有仁监视额勒登保与扎克塔尔，奏报他们降职后有无改进。^147\n在一定程度上，嘉庆的怒火也源于四川与湖北局势的恶化。1802年开始时，四川只有几个小股，若未被消灭，每股也从几百人缩减到几十人。^148 新年前不久，勒保甚至奢侈到返回达州城处理司法案件——至少他是这么说的。^149 然而，正月里，夔州府出现了数千名新叛军。勒保刚一宣布已把他们了结，就会奏报又来了更多叛军。嘉庆别无选择，只能延长四川完成战役的期限。^150\n那些\"新\"叛军主要来自湖北。三峡以北，巴东、归州与兴山县境的大山陡峻，为被击败的起事者提供了庇护所；有些股团在那里藏身了一两年。^151 徐天德死前曾号召剩下的叛军退到巴东与四川交界处休整、筹划下一步。^152 到1801年底，各股残部汇聚山中。为获取给养，起事者或攻打平民堡寨，或裹挟居民勒索赎金。整个冬天，清军很难追踪他们，而起事者的蛰伏帮助造成了湖北太平的印象。^153\n1801年底与苟文明分手后，樊人杰也来到了这个庇护所。作为叛乱唯一幸存的谋主，樊人杰用他们经卷中描绘的预言鼓舞起事者：鼠年（1804年）一开始，他们的时运就会扭转——因为这一年将开启一个新的六十年轮回。樊人杰致信他省叛军首领，请他们来鄂。他计划在长江以南的施南府煽动起事——因为他相信，他们的存亡系于新的起事。为隐藏行踪，樊人杰让他的一个弟弟——所谓的\"二掌柜\"（erzhanggui）——带领他一直关联的黄号，同时散布樊人杰已死的谣言。^154\n年后不久，由于给养耗尽，起事者开始走出群山。为告知其他股团自己的动向，叛军把单个的字——如\"川\"（四川）、\"楚\"（湖北）或某首领的姓氏——写在树上或房屋上。沿长江北岸，一些人进入四川夔州，裹挟当地居民、劫掠骡马以扩充队伍。^155 显示出复苏迹象的他们夜袭清营，一次战斗中杀死十四名清军军官，甚至试图攻打巫山县城。留在湖北的樊人杰把自己的黄号与戴四、曾芝秀、王国贤率领的股团合并。无法实现南下长江以南的计划，樊人杰的联军于二月下旬北移房县，目标直指襄阳。但被全保与长龄挡住了。^156\n如果说面对苟文明渡汉江时，嘉庆推迟了二三月内结束战役的期限，那么三峡地区叛军表面上的复苏则迫使他彻底放弃了它。他甚至考虑向湖北增兵。^157 然而，对德楞泰来说，增援不是关键。德楞泰虽然以\"夔州出现新叛军\"为由留川、没有追苟文明入陕，却没做什么实事。随后他宣布将赴鄂对付三峡地区的起事者，赢得了嘉庆的称赞，但他一面拒绝增援，一面要求给些\"犒赏\"以\"激励\"部队。一无所获后，德楞泰把出发推迟了数月，借口与夔州叛军作战——他主要是把他们逐回湖北，其规模可能被夸大了（他还利用夔州可能发生新起事的谣言）。终于准备出发时，他又突然反复更改计划、行动迟缓，不顾皇帝的催促、警告与责骂。直到四月初，吴熊光提出把湖北战场的全部军队指挥权让给他、并保证后勤供应，德楞泰才进入湖北。^158\n此时，樊人杰的联军已被湖北军队从房县逼回三峡北岸。德楞泰抱怨联军北上期间扩大到五六千人、有数百匹骡马，却夸口说自己能迅速把它减半。两场战斗后，他做到了——据德楞泰奏报，此后叛军只剩两千。^159 随后德楞泰让湖北军队追击樊人杰联军，自己则转而对付蒲天宝——通江的老起事者，自封\"元帅\"。蒲天宝藏身三峡以北的群山，1801年底出山，在兴山、归州与东湖一带游荡，试图与樊人杰会合。蒲天宝股团的核心约两千名战士，极其凶悍，战斗中死伤众多也不后退。五月初在房县与竹山的战斗中，德楞泰的人马给了蒲天宝一股沉重的打击，据说把它减到一千四五百。此时，长龄已把樊人杰联军压向竹山（但戴四与其数百人去了兴山）。德楞泰决定与长龄会合先打樊人杰，再对付蒲天宝的余部。^160\n初夏的雨季抬高了河流水位，限制了起事者的机动。^161 五月三十日，被逼到竹山南部暴涨的坪口河岸边，樊人杰、曾芝秀、王国贤及许多部下纵身跳入河中，随即被巨流卷走。数百名其他叛军及其家属或被杀或被俘；只有一小部分逃脱。曾芝秀与王国贤虽然生还，樊人杰却极可能已死。^162 鉴于樊人杰是最后一个在襄阳与四川两派中都享有威望的有远见领袖，他的殒命显然是个分水岭，标志着残余叛军末日的开始。^163 嘉庆认为樊人杰是徐天德死后最危险的叛军首领，闻讯欣喜若狂，对德楞泰及湖北其他领导人——包括吴熊光——大加恩赏，也犒赏了北京的军机大臣们——由于战役久无重大胜利，他已有些时候没有这样做了。^164\n樊人杰既死，嘉庆对额勒登保施加了更大压力——额勒登保似乎无意在夏天之内了结陕西的苟文明。^165 六月十五日，嘉庆给额勒登保颁发了一道清醒的谕旨。他再次批评其进展迟缓，指示他广泛宣示德楞泰在湖北的胜利，尤其是樊人杰之死。他宣布：任何叛军——包括苟文明——只要投降，都可赦免（但苟文明要流放新疆）。^166 此后嘉庆继续催促额勒登保在七月内消灭苟文明。事实上，六月初，额勒登保已把追剿苟文明的任务交给了杨遇春——他此前在对付另一股叛军。杨遇春探明苟文明的藏身之处后，让他的人马从几个方向逼近该地，随后俘获了苟文明的妻子与其他亲属——这促使嘉庆恢复了额勒登保与扎克塔尔的职位。^167\n杨遇春步步逼近，又断了粮，苟文明与长子苟朝九分手，各率一百人。数月前——1802年正月——苟文明自觉可能活不成了，就把两部经卷与自己的入教凭证——都用桐油浸过的（因此防水的）绸布包着——传给了苟朝九。儿子离开数日后，苟文明解散了自己的队伍，让大多数人各自逃生，只留十几人随行。七月十七日，他的人在一间无人的棚屋里找到一些玉米，数日未进食的苟文明生火煮玉米。炊烟使他暴露在杨遇春的部队面前。他的人全被杀死，苟文明跳下悬崖。身负重伤的苟文明被部队找到杀死。^168\n消息于七月二十六日传到皇帝那里——他刚到热河避暑山庄。这是嘉庆即位后第一次赴热河，到木兰围场行围——这是康熙皇帝开创的皇家惯例。^169 事实上，一些汉人朝官曾批评嘉庆在战役进行之际作此之行。苟文明之死想必减轻了他的负罪感——如果有的话——证明战事行将结束、那些批评目光短浅。被喜悦、宽慰与重回避暑山庄唤起的情感压倒，嘉庆向军机大臣们宣布苟文明死讯时，忍不住流下了眼泪。撇开对额勒登保的芥蒂，嘉庆把他的爵位升为一等伯，发还双眼花翎，外加众多礼物。苟文明殒命前几天，额勒登保曾请求把杨遇春从甘肃提督调任陕西提督——庆成被召回北京后空缺的更重要职位。额勒登保第一次大加称赞杨遇春。1800年初就开始注意到杨遇春的嘉庆，批准了这一调动。^170\n乡勇问题\n得知樊人杰死讯后，嘉庆立即着手善后（shanhou）——\"收尾与重建\"——他谈过许多次，却一直没能做多少。此时，将领们已开始遣返外省调来的部队。^171 但对嘉庆来说，最要紧的是遣散乡勇——1802年中，湖北、四川、陕西、河南、甘肃五省由军队与地方官雇用的乡勇或许还有六七万。皇帝早就意识到这场战役中使用非常规兵员的潜在危险，并一再表达关切；他担心的是战役结束时如何安置他们——因为许多人既无家庭，又无生计。最坏的情况下，若安置不当，经年军旅生涯惯于暴力的他们，就会沦为盗匪，或加入残余的起事者。同时，继续雇用他们的巨大财政代价，也凸显了嘉庆急于裁减他们的迫切心情。^172\n早在1799年底——各战场起事者人数已大幅减少时——低级官员杰聪就向朝廷呈上了战后重建建议。最吸引嘉庆注意的是杰聪关于为遣散乡勇提供生计的建议：或分给一块无主之地，或编入军队，或转为屯垦。^173 嘉庆虽同意一些乡勇可以补入绿营，却担心：这么多无家可归、无业可做的乡勇，绿营没有足够的位置。于是他征询当时战役主要领导人们——额勒登保、德楞泰、松筠、魁伦与广兴——的意见。^174 然而，1800年初叛军渡嘉陵江打断了这场讨论。直到四川战场稳定之后，嘉庆才重新拾起。在五年三月十五日一道关于战后重建的谕旨中，嘉庆倾向于为无家可归的乡勇寻找可耕地。他显然与廷臣们商议过此事，指示：叛军与死难或流离居民留下的无主之地，以及秦岭等处尚未开垦的土地，都可以分给他们。^175 然而，讨论没有继续下去——皇帝与将领们很快就被1800年余下时间里的事务缠住了。^176\n1801年初，嘉庆再次拾起这个问题。六年二月三十日，在一道关于安置难民与乡勇的谕旨中，他向战场各省的督抚征询意见\n——把起事者的土地分给乡勇的可行方案，同时声明中枢政府不为这项工程提供财政支持。^177 一个多月后，督抚们的答复才到。有意思的是，作出答复的三位督抚——勒保、长麟与陆有仁——都回避了使用起事者土地的问题。相反，他们都主张把乡勇补入绿营，或雇为\"民壮\"（minzhuang）——地方衙门里的武装人员。^178 长麟与陆有仁奏报说，陕西没有多少叛军财产——因为大多数叛军来自湖北与四川。朝廷后来才明白，起事者的土地早已没了踪影。它们是地方官员的猎物，或已被变卖，或已被侵占。长麟与陆有仁试图把问题推回给国家，提议先把所有随军作战的乡勇——所谓的\"随征乡勇\"（suizheng xiangyong）——转为\"余丁\"（yuding，其饷银远低于正式士兵），出缺时再升为正式士兵。但这不是皇帝与中枢政府想要的——它经常性地耗费巨大。经两个月审议，军机大臣与兵部否决了这一提议，要求战场各省督抚另谋方案。嘉庆与他们立场一致。^179 然而，没有一省作出回应。中枢政府与战场省份之间僵持的谈判，突出体现在战役进展的迟缓上。真正阻碍战役结束的，是数万乡勇，而非几千名起事者。整个战役期间，乡勇饷银是最大的军费开支之一，而借发饷之名侵吞军费的行为严重而普遍。尽管所有战场省份长期以来一直在遣散受雇乡勇（到1802年，人数已远少于早先），这项计划在战役接近尾声时陷入了僵局。战役主持者们集体努力，不肯一下子放掉他们。\n受樊人杰之死鼓舞，嘉庆决定不再与战役主持者们取得一致，径直推进。六月十六日，他命额勒登保裁减乡勇，并且要在撤回正规军之前做——因为正规军在，一旦被遣散的乡勇闹事，可以维持秩序。^180 不久，嘉庆派高级旗人兴魁赴陕，向额勒登保当面递交一道关于裁减乡勇及其他奏凯事宜的谕旨。^181 此后数月，嘉庆一再重申：在所有善后事务中，遣散乡勇最为关键。他严厉批评将领与省级官员们制造了这个耗资巨大的方案，决心与他们撇清关系。然而，他对这件\"极为重要\"之事不拨一文钱。相反，他说这是地方事务，责成额勒登保、德楞泰与省级官员设法落实。他唯一的指示是：乡勇应有选择——参军或还乡——而主事官员既不可过于专断，也不可过于宽纵。^182\n如果说朝廷不愿打开钱袋，那么毫不奇怪，前线的任何人都不会在遣散乡勇时慷慨解囊。七月中旬的一道联名奏折中，额勒登保、惠龄（长麟的陕甘总督继任者）与陆有仁提议：陕西籍随征乡勇每人赏银三两（头目与立功者四两），守卫关卡要地的乡勇每人一两；四川、湖北籍者每人二两。钱款由护送的官员在他们抵达家乡时发给他们。沿途地方官负责提供食宿。^183 鉴于所议赏银大致相当于一个月的饷银，这个数额远不足以安身立命。然而，嘉庆并不觉得有什么问题。事实上，他告诉吴熊光：他同意乡勇遣散时应当给些赏银，但不可过于优厚。他更担心的是他们的归途与重新融入地方——因为他听说，返乡之后，前起事者与前乡勇互相寻仇。^184 此后数周，嘉庆密切关注此事，如果军报中没有相关信息，他就频频查问。具体而言，他想知道：他们的归途是否平静，是否到达了家乡，是否得到了妥善安置。^185\n奏报到达时，基本上都是好消息。据1802年秋提及遣散乡勇的五六道奏折，一切都处理得小心周到、一切顺利。在陕西，额勒登保与惠龄任命一名文官朱勋与一名武官王兆梦主持此事。惠龄在一道奏折中详细记述了守备孙荣元麾下一百三十二名乡勇被遣散送归的情形。除八名愿意参军者外，其余一百二十四名乡勇都由官员护送回乡（五十一名去四川，十四名去湖北，五十三名去西乡，五名去陕西其他县）。每批人都发给一面大旗，上书四字\"凯旋乡勇\"（kaixuan xiangyong）。七月十一日从汉中出发前，他们的赏银当着他们的面逐一包封，交给护送官员。那些乡勇欢欣感激，高声欢呼。由于他们声称武器是自己的，收缴武器时每人另给五钱银子。陕西当局还沿途安排食宿运送，并通知湖北、四川当局派员到边境迎接。四川籍乡勇按惠龄之命由朱勋亲自护送。^186 接到惠龄的信后，勒保派广元的知府、道员与知县到广元神宣驿——过省界后的第一站——迎接那些乡勇。与陕西一样，被遣散的乡勇被护送到家乡，沿途供给口粮与草棚。到达目的地后，地方官员把封存的银两发给他们。到十月中旬，广元已接收了九批遣散乡勇。数十名贵州籍者经四川送回贵州。^187 由于湖北不是陕西、四川乡勇的主要来源地，吴熊光奏报说，到八月中旬，只有四批遣散乡勇——每批二十至五十人——从陕西经汉江送到竹溪或郧阳，其中大多数有家可归。^188\n沿汉江北岸，从陕西白河到湖北谷城，三千一百名河南乡勇驻守二十一个关卡——他们大多募自河南邓州、新野与唐县，全都有生计。十月，江防交由从豫陕西部边境撤回的河南绿营兵接防后，他们被遣散了。每人赏银一两五钱。河南当局效法陕西先例，派地方官护送回乡，沿途供给口粮食宿。^189 在湖北，大多数乡勇是本地招募的，大多有产有业。三峡以北，几乎所有乡勇都是巴东知县尹英图从长江以南的施南府募来的。尹英图已升任施南知府，吴熊光便委托他监视那些被遣散的乡勇。苟文明死后，吴熊光裁减了守卫鄂陕边境关卡要地的数千名乡勇。吴熊光给湖北所有被遣散的乡勇发了些银米——尽管他没有说明数额。吴熊光奏报说，他们乐于回乡务农、领取赏银。^190\n尽管奏报大体乐观——这常常令嘉庆高兴——1802年底的官方文书中还是可以察觉一些保留之处。起初，大多数被遣散的乡勇是\"防守乡勇\"（fangshou xiangyong），而非\"随征乡勇\"——后者的报酬更高。据德楞泰说，当时三省的随征乡勇有一万七千五百人（陕西六千九百、湖北四千六百、四川六千）。^191 但实际数字可能高达两万五千以上。尽管嘉庆不断催促，三省都迟迟不裁他们。在陕西，到九月已裁减的七千名乡勇中，只有一千三百名是随征乡勇。正如额勒登保所解释的：正规军分散各部队多年，如今归建原制，造成了一些空缺，乡勇暂时可以补上。他承诺所有部队归建后把他们全部裁掉。当时，他已让朱勋登记所有剩余乡勇，弄清他们是想回乡还是参军。^192 在四川，几乎所有随征乡勇（据勒保说五千多人，但据档案所披露的信息可能约有八千）都被留了下来。为挡开嘉庆对他裁减乡勇迟缓的批评——他的第一份奏报直到九月十九日才到北京——勒保说：他已派两名官员到各军中登记每个乡勇的籍贯、家庭与财产信息及参军意愿，并向皇帝保证会在撤回正规军之前裁掉他们。^193 事实上，吴熊光也没有裁湖北的随征乡勇。同时，到1802年底，三省谁也没有裁撤防守乡勇。^194 总体而言，1803年初第一次宣布胜利时，乡勇总数可能还有四万五千至五万。^195\n另一个障碍是：一些被遣散的乡勇没有回乡。据四川官员说，实际到达广元的乡勇人数与陕西官员移交的花名册不符——这意味着有些乡勇可能在到达省界之前就脱队了——尽管勒保解释说，有些人可能落在后面或出了意外。^196 此外，与将领们预期的相反，大多数乡勇不愿补入绿营。如上所示，陕西首批裁撤的一百三十二名乡勇中，只有八人选择参军。陕西被遣散的一千三百名随征乡勇中，只有二十四人参军。^197 有一段时间，将领与督抚们在论证扩充本省绿营时，都提到这些经验丰富的乡勇可以利用。^198 然而，对那些事实上的雇佣兵来说，当正式士兵并没有吸引力——他们当乡勇时享有更多的自由与更高的报酬。\n总之，到1802年底，乡勇的遣散远未完成。两个主要问题凸显了战场省份对一次性裁撤乡勇的抵制。其一，乡勇有用。多年来，他们在战场上比许多正规军更顶用，使旗兵、绿营兵与军官们得以留在城镇村庄里养伤治病——无论真假。尽管最后的几股起事者人数很少，却常常身处难以到达的地方。因此，那些经验丰富、吃苦耐劳的乡勇仍不可或缺。其二，是钱的问题。对皇帝而言，裁乡勇意味着大幅削减军费。但对前线主事者来说，乡勇一直是索要经费的最重要筹码之一。更重要的是，乡勇的饷银是指挥官、军官与地方官员不义之财的来源。乡勇自己也试图为自己的福祉讨价还价；有时他们集体行动，与上级谈判。没有慷慨的犒赏，很难解散这批训练有素的战士。然而，随着最后胜利临近，嘉庆在钱上越来越紧；他与战役各方几乎没有共同立场。\n事实上，麻烦的预兆已经抬头。由于湖北在1802年更是个热点，从春末起，许多被遣散的乡勇——大多数是四川人——前往湖北，谋求在那里受雇。担心不接纳他们会加入叛军，长龄与吴熊光把一些人编入了湖北乡勇。嘉庆也指示：至少供他们口粮，不许他们生事。不用说，湖北不可能照顾所有人。^199 到秋天，他们中的一些人已出现在湖北的起事者中间。战斗中，他们比起事者更老练、更有效——因为他们熟悉清军。^200 尽管其他地方也发生过类似情形，只有吴熊光提醒了皇帝这一事态。^201 吴熊光1801年春才出任湖广总督，不必为战役早期军费账本上的众多窟窿负责。因此，他的声音常常与三巨头不同。\n为奏凯收尾\n与此同时，战役本身并没有像皇帝希望的那样顺利走向尾声。在四川——自春末起就没有像样的叛军股团——清军正清剿只有几十人的小股，包括刘朝选与汤思蛟的。^202 然而，勒保似乎并不急于清剿，把期限一推再推。秋天，陕西与湖北的起事者——许多原籍四川——在额勒登保与德楞泰的压力下渗入四川时，勒保声称四川的起事者总数已回升到一千以上，从边境蔓延到腹地。但嘉庆不太担心，认为入川的不过是些零散残部。他催促勒保加快行动，同时保持对湖北的关注。^203\n在湖北，焦点是对蒲天宝的作战。蒲天宝从房县、竹山返回兴山后，戴四、崔宗和等人重新与他合兵。他们一起在兴山北端陡峭的群山上掘壕自守。尽管德楞泰向皇帝保证决战临近，樊人杰死后他却停了几周。直到六月下旬，他才摧毁叛军的山顶堡寨，把他们减到数百人。然而，德楞泰又放慢了脚步，未能在七月消灭蒲天宝一股——它在三峡以北的群山中穿梭，吸纳其他股团的残部。嘉庆多次申斥德楞泰之后，于七月二十七日——得知苟文明死讯的次日——给德楞泰颁了一道谕旨，告诉他：苟文明已死，四川即将肃清，湖北是唯一还有数千起事者的省份。嘉庆提醒他七十五的前车之鉴，并问他是否打算等额勒登保赴鄂去了结蒲天宝。十天后，嘉庆果然命额勒登保前往湖北。^204 显然对德楞泰的拖延恼怒，吴熊光也请求额勒登保赴鄂，说德楞泰的兵力不足以对付其他几股起事者。^205 或许是不愿让额勒登保接管湖北战事，德楞泰在八月初加快了行动。德楞泰显然想灭哪股就能灭哪股——数日内，他就粉碎了蒲天宝的余部；蒲天宝率其最后的寥寥数人逃往竹溪，八月十二日跳崖而死。嘉庆没有升德楞泰的爵。相反，他以赏给德楞泰之子苏冲阿一件黄马褂表达赞赏——苏冲阿随驾木兰行围时射杀了一头狍子。^206\n蒲天宝死后，德楞泰留鄂肃清蒲天宝的残部与其他几股。九月初，他在鸡心岭——鄂、川、陕三省交界处——击溃了熊翠率领的六七百人，这是剩余股团中最大的一支。^207 额勒登保越过边境到竹溪后，在湖北待了几周，却没有参战。他宣称湖北局势已经好转、而陕西战事进展不够迅速，便返回了陕西。^208 嘉庆派额勒登保赴鄂，本已撤销了他早先\"额勒登保只管陕西战场、不再担任全役统帅\"的决定。然而，没有正式的复职，额勒登保似乎不愿把职权延伸出陕西。此外，他肯定知道德楞泰无意与他在湖北分享舞台。直到第一次宣布胜利前夕，额勒登保一直守在陕鄂边境，拦截被湖北军队赶入陕西的叛军；他再也没有越过边境到湖北。^209\n宣布胜利，1803—1805年\n眼看漫长战争行将结束，嘉庆皇帝早在1801年底就讨论过宣布胜利（zoukai）之事。在六年十月十一日给额勒登保与德楞泰的谕旨中，他指示二人开始从战区撤出正规军，或留用部分已部署部队、或用本省军队清剿叛军残部。他计划先让德楞泰进京陛见、谒乾隆陵，待德楞泰返回四川后再召回额勒登保。嘉庆急于把战役的收束抓在自己手里，尽管他强调：他不要一场仓促的胜利，以免给未来留下隐患；并要求两位将领说明——如果他们觉得还不到时候——战役何时可望结束。^210 不久，嘉庆对报捷仪制作了进一步指示。他要一份由全体——两位军事统帅（额勒登保与德楞泰）与三位总督（勒保、惠龄与吴熊光）——联名的奏折，经日行六百里的驿马快递送达。由于战役是对付内部叛军而非外敌，奏折呈进朝廷时不得用红旗。^211\n然而，1802年初三峡地区叛军的再起使讨论搁置。直到苟文明被杀，嘉庆才重提此事。他给额勒登保三周时间完成所有军事行动，以便八月中旬宣布胜利。^212 但这个期限没有实现。蒲天宝被除时，嘉庆再次确信久盼的胜利终于临近——如果叛乱始于湖北，或许也注定终于湖北。他责成额勒登保与德楞泰在九月内消灭所有残余起事者。同时，他对报捷奏折加了一项要求：必须用红绸衬里的黄缎封套。此后数月，他每收到一条令人鼓舞的消息就重申一遍。^213\n鉴于胜利没有明确的标志——叛军没有总部或据点可供镇压者攻克——而且宣布胜利后对叛军残部的清剿仍将继续，\"胜利\"注定是任意的；尺子要由皇帝来定。九月下旬，嘉庆裁定：湖北五名叛军首领（熊翠、熊方青、戴仕杰、崔宗和与胡明远）全部被杀、只剩一百名叛军时，就可以上黄封红衬的报捷折；若还有一两名首领在逃，只能用黄封；若在逃起事者超过一千，他就不认这个胜利。他还坚持：报捷折只能在三省都肃清有组织的叛军之后才上——他否决了额勒登保\"两省肃清、把所有残余叛军赶进第三省即可报捷\"的提议。^214\n鸡心岭附近的战斗之后，德楞泰估计湖北还有两千名起事者。但吴熊光更乐观。蒲天宝死后一直游说出局的吴熊光，向皇帝保证湖北已近尾声。^215 受吴熊光乐观态度的鼓舞，嘉庆坚持九月内结束战役。他甚至愿意在一两名起事者首领在逃的情况下认领胜利。他还宣布：投降的叛军可以赦免。^216 为向将领们施加更大压力，他催促他们继续遣返外省调来的部队。^217 在这种情况下，三巨头很难再把宣布胜利拖下去。九月底，额勒登保奏报说，他认为大约十天内即可确保胜利。十月初五日——他生日前一天——接到这道奏折，嘉庆重申：报捷折不得上，除非只剩少量零散叛军、一两名首领下落不明，使他们绝无可能复活叛乱。^218 事实上，为使自己的生日庆典更圆满，嘉庆同意了这样一个选项：三个战场可以在十月内相隔数日各自呈上黄封红衬的报捷折。但生日过后，他收回了批准，再次要求三省大多肃清起事者后上联名报捷折。^219\n第一次胜利\n冬至（dongzhi）将至，嘉庆指示额勒登保确保报捷折在冬至前到达，以便他在北京城南的天坛举行南郊大祀（nanjiaodasi）时，把这胜利的消息禀告列祖列宗，感谢他们在漫长战役中的庇佑。^220 同时，嘉庆给额勒登保加了一个新兼职：蒙古镶蓝旗都统；给三巨头各赏一件驯鹿皮褂；对四川的军官、士兵与乡勇大加恩赏。此外，他指示将领们招降最后的起事者。^221\n十月中旬，德楞泰在房县与兴山摧毁了戴仕杰、崔宗和与胡明远率领的股团。^222 不久，他又在巴东消灭了另一股数百人的队伍——由达州的一名老叛军率领。^223 德楞泰估计湖北只剩几百名零散起事者，嘉庆便催促德楞泰返回四川，并许诺：如果十一月内战役结束，他可以在北京过年。^224 德楞泰离开湖北后，吴熊光主持搜剿叛军残部。十一月初，吴熊光奏报：本省已无叛军。然而，吴熊光很谨慎。他暂停裁减乡勇与遣返部队，认为即便几个坚定的起事者也可能使叛乱复燃。此外，湖北最近因病伤失去了长龄与孙清元两位将领。^225 在庆成到任之前署理湖北提督的吴熊光，想在本省尽可能多地保留军事力量。他的审慎将被证明是明智的。^226\n在陕西，苟文明死后，秦岭中只剩苟文明残部的几个小股。尽管他们仍能给清军造成难堪的伤亡，人数却不断减少。杨遇春与杨芳率领的部队不时杀死几名叛军，但看不到尽头。^227 嘉庆给了惠龄象征性处分，并申饬了兴魁与杨遇春，但不太担心——他认为那些残部可以在胜利之后再处理。^228 在他看来，更关键的地点是陕鄂、陕川边境——因为湖北的叛军在德楞泰的压力下不断试图突入陕西。先是穆克登布与扎克塔尔越境到竹溪、竹山（十月初他们消灭熊方青、熊翠一股时，杀死了熊方青、打伤了熊翠），对付湖北来的叛军。随后，额勒登保与扎克塔尔前往四川太平，杨遇春移向陕西南境，把秦岭的清剿留给杨芳——遵嘉庆之命。^229\n四川虽然久已平静，它与陕西、湖北漫长而多孔的边境却容易遭到渗透。勒保抱怨更多起事者从湖北、陕西被赶入四川，试图以一幅四川告急的图景打动朝廷，尽管他承认只有三股相对可观。嘉庆申斥勒保截击不力，并不断催促德楞泰与额勒登保前往四川。^230 十月下旬，四川最大的一股——由黄号、蓝号与线号一千多名残部组成——移向川北边境，企图入陕渡汉江。但他们先在紫阳被额勒登保伏击，随后又遭穆克登布打击。数日后，十一月初七日，穆克登布在通江与陕西交界处再次将其击溃，把它减到四百人。^231 这消息与额勒登保\"一二十日内可望奏凯\"的预测，使皇帝大为振奋，对额勒登保、穆克登布及其部队大加升赏。此后数日，嘉庆继续向三巨头施压，尽管他没有忘记同时告诫他们要彻底。^232\n十一月二十八日冬至，嘉庆在天坛典礼后回到紫禁城时，一道奏折\n从额勒登保与勒保那里到达——他们在太平会过面——奏报说，他们正计划进入清剿阶段，一旦德楞泰加入，就收束战役。显然是想从皇帝那里求得保证——他确实会允许这场\"胜利\"是不完整的——两人提醒他：三省还有两千来名起事者。^233 嘉庆坚定而明确地表示：只要没有主要叛军首领在逃，报捷折就可以上。鉴于冬至期限已破（但嘉庆论证说：额勒登保与勒保发出这道奏折已十天，此刻\"胜利\"可能已经取得，因而算是赶上了期限），他要求报捷折在中枢政府封印（fengyin）之前送到——封印通常在年前两周开始——以便他在新年庆典上当着蒙古王公与其他宾客的面宣布胜利。为确保奏折赶上这个只剩三周的日子，他责成他们立即发出。他告诉他们：京城已经流传战役即将结束的传言。^234\n这样一来，无论前线情况如何，都难以再拖。十二月初，德楞泰在太平与额勒登保、勒保会合。他们先另上一折，数日后再发出报捷折，^235 尽管军事行动远未结束。在四川，还有几股，各数百人。在陕西，秦岭中仍可见零散叛军，一些人已离开，向西南奔向略阳与勉县。就连湖北也奏报房县、竹山、竹溪有几小股。^236 嘉庆清楚地知道战事将继续，便取消了额勒登保与德楞泰计划中的进京之行，责成额勒登保负责陕西清剿，让德楞泰与勒保主持四川清剿。^237\n封印前几天，七年十二月十六日（1803年1月9日），红绸衬里、黄缎封套的报捷折到达北京；署名者为额勒登保、德楞泰、勒保、惠龄与吴熊光。他们盛赞已故乾隆皇帝与嘉庆皇帝的圣德、睿智、训导与慷慨的财政支持，但对这场\"胜利\"的界定仍小心翼翼。他们虽声称所有知名叛军首领已被消灭、并宣布战事结束——因为所有叛军股团都已被清除——却不肯说三省已肃清叛军。^238 嘉庆不让欢庆时刻蒙尘，把这场\"胜利\"当作货真价实来对待，不仅对三省将领督抚大加升赏，还赏及皇子、军机大臣与京城全体官员军队。他还赦免了战役期间受惩处的人，并准备给受战乱影响的地区蠲免赋税，对全国被革职降职的官员普施恩赦。^239\n第二次胜利\n既然宣布的胜利是演出来的，嘉庆立即回到正事上。庆祝次日，他向额勒登保、德楞泰、勒保、吴熊光与惠龄颁发谕旨，责成他们彻底肃清本省叛军残部。他甚至愿意放宽自己最新设的期限——二月内完成所有军事行动。用他的话说，这个阶段就像大病之后的调养，需要时间与努力。他警告他们不要因新爵位或升迁而自满——他随时可以全部收回。^240 同时，他在财务上更严格。他的前任们习惯在战争胜利后蠲免部队出征时所借的全部银两，嘉庆却命部队偿还全部借款——军官四年、士兵八年。^241 军机处驳回勒保所报的显然无理或非法的开支请求时，他支持驳回。^242 毫不奇怪，这种倾向将适得其反。\n1803年头几个月，军事行动疲软，看不到近期结束的迹象。尽管数百名叛军——包括曾芝秀、胡明远、张世虎、姚新佐（姚之富之子）等首领——已被杀或被擒，叛军总数仍维持在几千。^243 随着春天推进，湖北发现的叛军越来越多。^244 在四川，用勒保的话说，起事者\"随剿随增\"。^245 他们在省界间穿梭，一省人数减少，他省人数就增加。许多叛军决心战死而非投降，仍能给镇压者以致命打击。^246 八年闰二月十九日，南江一场战斗中，穆克登布与数名军官士兵被苟文明的几十名旧部杀死，成为这场战役中阵亡的最后一位高级官员。一个月后，同一股在大宁又使清军伤亡。^247（地图5.3）\n困惑的嘉庆先是试图收紧对将领们的缰绳：恢复\"正月内完成\"的旧期限。^248 然而，不仅这个期限被打破，随着新的叛军股团出现，他还不得不一再延期：从二月到三月，再到四月。^249 嘉庆面临两难。他一方面担心清剿不彻底会使叛乱复燃，另一方面同样担心：如果战役拖到秋天——届时蒙古与新疆的王公要随他木兰行围——会玷污朝廷的声誉，因为已向他们通报了胜利。^250 为加快清剿，嘉庆重申愿意接受起事者投降。他还想让知府知县们巡视辖区，如果没有叛军，就签\"甘结\"（ganjie）作保，这样他们会更有动力保持本地清净。^251 三月二十一日，嘉庆为擒获起事者首领设立高达二百两的赏格，尽管他担心这可能招致滥杀无辜邀赏等弊端。^252\n尽管朝廷为收束战役用尽了办法，三巨头却不配合。对清军为何无法了结叛军残部，他们或缄默，或闪烁其词。皇帝问起，他们总是以烟幕与镜子应付。^253 谈到遣散乡勇，他们只报喜，向皇帝保证遣散进展顺利。额勒登保奏报说，到一月底，陕西已裁减一万多人，全都领了赏、平安回乡，没有闹出任何事。^254 在四川，第一次宣布胜利后，随征乡勇的裁减终于开始。^255 随着越来越多的乡勇被裁，更多的叛军股团出现了——它们并不总是由已知股团的残部组成。三巨头把这些新股团称为\"无名\"——因为其首领不为人知——并拒绝讨论其身份。\n又是吴熊光打破了沉默。正月，吴熊光奏报：从湖北护送回川途中，一些被遣散的四川乡勇逃跑了——因为大多数四川乡勇既无家又无业（他坚称湖北乡勇都已返乡、回归了平民生活）。^256 不久，在相隔数日的两道奏折中，吴熊光提醒朝廷：三峡地区出现了一股数百人的队伍，由前乡勇组成，操四川口音，首领是个姓陈的前乡勇头目。他们甚至使用乡勇旗帜，一些人戴着看似清朝官帽的帽子。这些\"乡勇变叛军\"比起事者更会打仗；他们在巴东袭击清军，打伤了一名湖北军官。^257 嘉庆对前乡勇变叛军并不惊讶，却警觉于其规模与实力。他裁定：任何与清军作战的团体都按叛军对待，并敦促战役主持者们密切关注此事。他怀疑前乡勇的赏银被地方官员侵吞了，指示勒保与德楞泰查办。^258\n然而，数日后，吴熊光退了回去。他澄清说：那伙人其实是四川的老起事者，\"伪装\"成乡勇。或许吴熊光不愿因点名四川的前乡勇而同时得罪勒保与德楞泰——尤其嘉庆已命德楞泰赴鄂对付此股。吴熊光还担心：如果清军把前乡勇当叛军打，仍在服役的乡勇会惶恐不安。为修补关系，吴熊光在人流密集处张贴告示安抚乡勇，声明叛军制造谣言污蔑乡勇。他向剩余乡勇保证他们受到信任，同时敦促\"被叛军裹挟\"的前乡勇向清朝投诚，以免受罚。^259 嘉庆选择接受吴熊光的更正。他不赞成吴熊光张贴告示，指示吴熊光悄悄处理此事——变叛军的乡勇杀无赦。^260 然而，吴熊光又换了立场。三月，他确认那伙叛军中确实有前乡勇，这使该股格外危险——因为前乡勇熟悉清军。^261 就连德楞泰入鄂后也承认：那股叛军中可能有被遣散的乡勇，尽管他强调徐天德的残部是其核心。^262 此外，一些前乡勇、被裁的军事民夫与随军贸易的商贩，在湖北与陕西两地成群劫掠。^263 越来越清楚的是：被遣散乡勇的安置并不成功。嘉庆一再指示将领们对\"乡勇变叛军\"绝不手软，但警告他们不要过于严厉，以免疏远剩余乡勇。他还向地方官员施压，命他们密切关注前乡勇，惩办闹事者。^264\n面对朝廷消灭剩余乡勇日益加大的压力，三巨头寻找新办法。闰二月底，额勒登保提出一项新计划：\"以工代赈\"（yigongdaizhen）。他计划雇用被遣散的乡勇与涌入战场省份随军贸易的商贩，在最后起事者出没的地区修城墙、建堡寨民居，并请求四十万两（陕西十万、四川三十万）资助这项工程。同时，额勒登保还请求增拨军费，支援仍在战役中的军队。鉴于额勒登保在此折中声明：一两个月内不可能肃清残余起事者，他计划在来年秋天完成筑堡工程——言下之意是：战役至少得持续到1803年下半年。^265\n这个提议令嘉庆极度震怒。他称之为\"荒谬至极\"，斥责额勒登保越俎代庖、干预民政，制造索款与延长战争的借口。他告诉额勒登保：朝臣中流传着一种说法——最后几百、上千名叛军是被故意留下的，因为战役领导人们需要更多借口来遮掩已非法花掉的军费。他说，他虽一直把这种猜测撇在一边，额勒登保的提议却证实了其中有些道理。除又一次\"严旨申饬\"外，他还褫夺了额勒登保的\"御前大臣\"（yuqian dachen）衔与紫缰（zijiang）——高荣的象征——两者都是第一次宣布胜利时授给他的。^266\n怀疑这个主意是别人塞给额勒登保的——他讥讽额勒登保甚至不懂\"以工代赈\"的中文含义——嘉庆在一连串发往前线的谕旨中，责成德楞泰与督抚们奏报是否知道这提议背后的主使人。^267 他们都说不知道，尽管勒保提到：新年前的一次会面上，他与额勒登保讨论过在四川修城墙——但他补充说，他告诉过额勒登保那不是急务。^268 额勒登保本人的答复来得晚而简短。在详述军事行动的长折末尾，他承认这越入了文官的领地，却坚称是自己的主意。或许是意识到自己反应过度，加上追查徒劳，嘉庆宽恕了他，让此事不了了之。^269 然而，嘉庆或许是对的；勒保很可能是此议的幕后推手——所请经费的四分之三都是给四川的。大约此时，勒保报病，请求到达州休养。^270\n由于朝廷与三巨头未达成一致，战役继续缓慢而零散地进行着。清军以小队在省境拉网式搜剿中，不时杀死或俘获零散叛军。到夏天，陕南大体平静。杨遇春到达湖北西北端后，湖北也在走上正轨。在四川，最后的几百名起事者沉入深山，靠劫掠求生。^271 然而，战役的收束从五月底推迟到六月底。嘉庆知道把残部一网打尽不现实，愿意接受：只要残余起事者被打散、无法复活叛乱，就算胜利。但他要求在撤军之前遣散所有乡勇——总数或许还有两万多人。^272 尽管遣返已部署部队几乎无人抵制，^273 遣散最后一批乡勇却难以达成共识——三省最终提出了三种不同的方案。\n吴熊光承认一些湖北前乡勇曾单独或合伙劫掠——这与他先前的说法相矛盾——提议提高湖北最后三千名乡勇的遣散赏银：湖北籍中无家无产者每人加二两；他计划变卖叛军财产来弥补这笔额外开支。这样，湖北的随征乡勇将得五两，其余得三两。^274 额勒登保入川后，与勒保呈上了一个类似上年长麟与陆有仁联名所提、被中枢政府否决的方案：把愿意参军者作为余丁安插进绿营，但按守兵（shoubing）的标准发饷——高于余丁。他们强调：川陕两省剩余的一万一千名随征乡勇中，只有几千人愿意参军；等他们补了正式士兵的缺，额外饷银就可以减少。^275 大约同时，军机大臣们批准了惠龄的一个四点战后重建方案。建议之一是：秦岭山区各州县增设数十名壮丁（zhuangding），从选定的随征乡勇中充任。军机大臣们计划变卖逃亡、死难者与起事者的财产来支付费用，卖产所得用完后由各县自筹。^276 急于清算最后的乡勇，嘉庆批准了所有这些提议，尽管对其效果将信将疑。^277\n但皇帝没有耐心等所有乡勇裁完。中元节（Zhongyuanjie）——道教祭祀亡灵之节——七月十五日将至，他决定先宣布又一场\"胜利\"。从六月中旬起，嘉庆就一再告诉将领们：再让一份报捷折在七月十五日或之前到京，好让他在中元节那天宣布胜利，使之成为庆典的一部分。同时，他不断告诫他们彻底肃清辖区内的叛军残余，并认真安置被裁乡勇。知道胜利之后军事行动仍将继续，他同意：如果地方军队不够，允许一些已部署部队暂留。^278\n经历过第一次胜利，三巨头再上一道报捷折、然后继续作战，毫无问题。德楞泰奉命在报捷折发出后赴热河，陪皇帝过中元节——他或许对这场胜利格外卖力，尽给朝廷喂喜讯，避开乡勇这个麻烦问题。^279 六月下旬，勒保与德楞泰前往太平的额勒登保大营，联名上了一道奏折，宣布三省叛军残部的清剿已经完成。奏折经六百里加急发出后，德楞泰启程赴热河。在这道没有堆砌第一次报捷那种华丽辞藻的奏折里，三人竭力把这场\"胜利\"描绘得尽量辉煌，指出：自第一次胜利以来的八个月里，十五名叛军首领与数十名叛军军官被除，数千名起事者投降或被杀。然而，他们小心地留足了继续行动的空间。他们声称：陕西与湖北已肃清，四川已无叛军股团，但多山的边境仍可能有一些零散叛军。不过，他们承诺：对付他们不成问题，所有\"客兵\"都可以撤回。谈到乡勇，他们含糊其辞。他们奏报：所有防守乡勇已遣散，剩余的随征乡勇人数不多（但没有给确切数字）。他们强调：最后这批乡勇都是久经沙场的老兵，\"与正规军无异\"，承诺按皇帝所批准的那样把他们转为\"新兵\"（xinbing）。^280\n中元节那天，嘉庆前往北京西北郊的安佑宫，向列祖列宗行礼。典礼之后，他正在父亲、祖父与曾祖父的画像前踱步时，报捷折到了。嘉庆第二次宣布——用一道或许是预先写好的谕旨——所有叛军残部已肃清，战役已胜利结束。然而，他没有再给额勒登保与德楞泰授爵升官。除给所有领导人众多礼物外——无一例外是荷包、玉环、烟管之类的小玩意儿——他只允许吏部考虑对勒保、吴熊光、惠龄以及协助他指挥战役的主要朝官给予奖赏。^281 次日，嘉庆再赴安佑宫感谢列祖列宗。此外，他派朝官赴四川、陕西、湖北、河南祭祀名山，并赏全国旗兵半个月饷银。^282\n第三次胜利\n事实上，中元节前几天，陕西巡抚祖之望与吴熊光的几道奏折到达北京，报告陕西与湖北仍有数十名叛军，但这没有阻止皇帝宣布胜利。^283 然而，庆典当天，嘉庆给额勒登保与勒保颁发了一道清醒的谕旨，批评他们第一次胜利后的松懈，敦促他们不遗余力地消灭所有残余起事者。同时，他告诫他们处理俘虏要审慎，确保没有无辜者被急于领赏的士兵或平民杀死。^284\n起初，清剿似乎在正轨上：七月内，起事者总数迅速降到不足二百；对多山省境的搜剿只发现了寥寥数名起事者。八月底，嘉庆已足够自信，告诉额勒登保在十到二十天内结束军事行动。^285 然而，他的乐观很快就蒸发了。八月初在秦岭第一次被发现的一股两三百人的叛军，越来越令人不安。这股有骡有马，正迅速向陕鄂边境移动。突入湖北失败后，它转而向西，于九月二十日夜在西乡七星坝南渡汉江，把一直追击它的杨遇春与杨芳远远甩在身后。嘉庆对两位杨姓将领本已光火——不久前刚摘了二人的顶戴——命额勒登保严厉申饬二人。由于此股与\"湖北叛军似在增多\"的奏报，嘉庆推迟了额勒登保回京。^286\n很快查明：该股大多是前乡勇。他们都是四川人，原属杨遇春部下守备吴廷刚率领的一支乡勇。第二次胜利前不久被遣散时，他们脱逃，在川陕边境加入了苟文明的二十几名旧部。该股中还有一些投降后被编为新兵或乡勇的叛军——他们因不满新处境而脱逃。^287 该股起初由身份不明的李彪率领。李彪被杀后，三个姓王、马、赵的人主事。他们自封\"总管\"（zongguan）——这不是起事者使用的名号——不许部众打听他们的全名。^288 他们极可能是前乡勇。被遣散的乡勇加入残余起事者或自立门户虽然并不新鲜，但这股由数百名久经战阵的前乡勇组成的队伍，与旧雇主作战时格外凶猛有效。^289\n十月中旬德楞泰重返战役时，嘉庆召回额勒登保，让德楞泰接掌指挥权——他又怕额勒登保缺席新年庆典会使蒙古王公等宾客怀疑胜利的真实性。^290 自1795年加入苗疆战役以来，额勒登保离京已八年——几年前他甚至错过了母亲的葬礼——还常年胸痛气短。第二次胜利前不久，额勒登保曾请求辞去经略大臣之衔，嘉庆没有同意。^291 或许是急于回京，额勒登保只报喜讯，回避讨论该股起事者的身份，尽管他提到那些叛军能叫出清军军官的名字。他向皇帝保证：德楞泰可以轻而易举地消灭\n他们——三省还动员着四万五千多名正规军，而该股已逃往太平。^292\n额勒登保离开之前，德楞泰保持沉默，近二十天没有上奏。然而，额勒登保一启程，德楞泰立即向朝廷奏报：该股以及滞留陕西东南角的另一股一百多人的叛军，大多是前乡勇；他们叛乱的原因是上级侵吞了他们的饷银或赏银。^293 德楞泰还说：太平的士兵与乡勇还穿着夏装、赤着脚，口粮也不能按时领到，一些军官只好自掏津贴为他们购置冬衣。由于乡勇遣散是额勒登保主持的，德楞泰或许是在设法撇清自己的责任。新年（1804年2月11日）将至，德楞泰的揭露也是为了提醒朝廷：该给仍在服役者一些恩赏了。^293\n但这一次嘉庆不为所动。他对乡勇的预言成真，心情沮丧。他痛斥地方官员没有妥善安置被遣散的乡勇，尽管他承认：一些前乡勇可能瞬间花光了赏银，或他们的赏银被上级侵吞了。然而，嘉庆不想示以宽大。他指示德楞泰：那些反叛者即便投降，也要流放边疆；而他愿意释放投降的教门起事者。他还让德楞泰审讯新叛军加入起事者的原因，查查有没有地方官员的干系。对剩余的四五千名乡勇更为关切，嘉庆告诫德楞泰：不要让他们知道叛军大多是前乡勇，而且不到最后不要遣散他们。^294\n十二月十日，在平利与那支较大叛军股团的战斗中，德楞泰的九百多名乡勇拒绝作战，甚至与敌人攀谈——对面的许多人正是他们的朋友、结拜兄弟与亲戚。这场遭遇以二十多名清军正规兵与军官被杀告终。战后，乡勇们去见德楞泰。他们跪地哭泣，说不能与自己的亲友作战。为前乡勇加入叛军辩护，他们辩称这些人有冤屈，报了仇就会离开叛军。至于战斗中杀死清军，他们坚称：那些\"乡勇变叛军\"没有进攻，只是在被激怒时才还手。德楞泰不愿惩处所有人，同意了他们的请求：派代表去与前乡勇谈判。以魏忠才为首的七名乡勇——魏忠才是个有功的乡勇，其叔父就在叛军股中——前去与叛军谈判，并递送德楞泰的信。^295\n德楞泰停战一周多，等待结果。然而，七名乡勇到达两天后就被叛军全部杀死。^296 德楞泰承认自己被\"乡勇变叛军\"骗了，但仍为自己的决定辩护，论证说：这些杀戮使打击那些\"乡勇变叛军\"名正言顺，而且仍在服役的乡勇已群情激愤，发誓对所有叛军——包括前乡勇——绝不留情。^297 但嘉庆批评德楞泰：听任自己被乡勇误导，停战数日。他重申立场：反叛并杀害官兵者绝不宽赦——即便投降。他还认为德楞泰的乡勇拒战应受惩处。然而，他试图从这场溃败中榨取最大价值。他给死难者家属丰厚的抚恤，并命德楞泰当着全体乡勇的面，派部属到遗骸发现处致祭——嘉庆与德楞泰一样，希望此事能激励乡勇更努力作战。^298\n这很快被证明是一厢情愿。此后两个月，德楞泰对穿梭于川陕边境的两股叛军未能取得实质性进展。二月中旬，两股在平利合并，前往竹溪。虽然被杨遇春与湖北军队赶回陕西，合并后的队伍通过收拢零散起事者、裹挟当地居民，扩大到近五百人。正月期限已破，二月的新期限又无法实现，德楞泰请求延期到三月。^299 对德楞泰失望，嘉庆决定二月十八日把额勒登保派回战役。任命他为统帅难堪，嘉庆便让额勒登保做钦差大臣——公开任务是检阅鄂陕两省军队，这是每隔几年照例进行的。同时，嘉庆威胁德楞泰：再不尽心就严惩。^300 不久前，他已请新任西安将军赛冲阿带一道谕旨给德楞泰。二月十七日，赛冲阿与德楞泰会面，递交了谕旨。据说德楞泰读后\"悚惧\"\"感激\"。^301\n两周后，三月初二日，杨遇春在平利一场激战中击溃了合并股——战斗中前乡勇直呼杨遇春的名字，想活捉他；叛军损失二百人，清方伤亡一百多。^302 然而，这成了前乡勇唱主角的最后一战。种种迹象表明，前乡勇与老叛军没能融合——老叛军对前乡勇并不友好，行军作战时常把他们用作先锋。此战之后，越来越多的前乡勇离开该股；到夏天，只剩几十人。与此同时，更多零散起事者加入。苟文明的堂弟苟文润成了首领。^303\n\"乡勇变叛军\"大体出局后，最后一批乡勇成了焦点。嘉庆责成途中的额勒登保：在撤回已部署部队之前遣散所有乡勇。^304 第二次胜利后，乡勇遣散起初加速。然而，到1804年春，三省乡勇总数从两万降到六七千（其中四千是随征乡勇）后，几乎再无进展。^305 最后这批乡勇中，许多人无家可归、无业可依。他们既不愿参军，也不愿接受地方衙门\"民壮\"的位置——月饷只有六钱，与他们当乡勇的收入相去甚远。他们放慢甚至拒绝作战，为自己的服役索取更好的补偿、为遣散索取尽可能优厚的待遇。在湖北，许多先前表示愿意参军的乡勇，听说回乡者的赏银更高，就改了主意。^306 在陕西，剩余的乡勇每次听说要裁减就鼓噪，威胁说条件不满意就加入起事者。^307 他们的抗议与罢工实际上瘫痪了军事行动，苟文润一股从太平逃到大宁。夏末，它在大宁一处山顶掘壕自守。在安康，另一个由零散起事者组成的小股由熊翠率领。德楞泰与额勒登保没有奏报乡勇的抵制，而用惯常的借口——叛军机动性强、天候恶劣、地形艰险、给养短缺——来拖延时间，这招来皇帝一再的\"申饬\"。^308\n起初毫不妥协的嘉庆明确表示：乡勇贪婪的要求不应也不能满足，并坚称：安置被遣散乡勇、防止他们生事是地方官员的责任。^309 但战争领导人们持续向他施压。1804年初额勒登保回京陛见时，他把\"遣散乡勇的赏银过低\"列为战役收束的唯一障碍。^310 年后不久，新任陕西巡抚方维甸提出一项新方案：让陕西各衙门雇用那些无生计的乡勇巡逻地方，作为战后治安措施。他们不领遣散赏银，而是月领三两。由于陕西有五十九个衙门，每个只雇二三十人，各衙门的财政负担不会太重。^311 嘉庆以\"二三十名前乡勇聚于一处不安全、且仍按乡勇标准支饷\"为由否决了这一提议，但同意在战役结束时提高遣散赏银，使他们得以安身立命。他请方维甸拟个方案。^312\n方维甸答复之前，德楞泰——或许是听说了嘉庆愿意妥协——呈上了自己的提议。他论证说：第一次胜利后，剩余乡勇又打了两年，于是请求：所有乡勇领十两遣散银，有功者领十五两；归途继续供给口粮；但不再补偿被收缴的武器。德楞泰估计该方案总花费约五万两，建议向文武官员募捐支付。^313 大体以德楞泰的方案为基础，二月初九日，嘉庆颁布新标准：外省乡勇给十两，本省乡勇给五两；有功的外省乡勇十五两、本省十两。他指示动用军费支付，并揶揄德楞泰提官员捐款太过小家子气。^314 鉴于众多乡勇获授过武职顶戴，最后这批乡勇中相当一部分将拿到十至十五两——这是1802年额勒登保、惠龄、陆有仁所议标准（二至三两）的五倍。\n然而，这一让步并没有打动三巨头去裁撤最后的乡勇。相反，将领们如今打算把最后四五千名随征乡勇（陕西一千二、四川三千）留到最终胜利之后，理由是：这些久经战阵的乡勇若一次裁光，可能掉头与旧雇主作战。^315 因此，他们转而把讨价还价的方向放在提高最后这批乡勇的现役饷银上。四月初额勒登保回陕与德楞泰会合后，告诉皇帝：他已决定给乡勇与正规军相同的杀敌擒贼赏格（德楞泰已把正规军的赏格提高到每人头五十两），以激励乡勇——嘉庆没有反对。^316 不久，额勒登保、德楞泰与赛冲阿请求：把最后随征乡勇的月饷提高到二两，与绿营兵相同——因为乡勇一直承担与士兵相同的职责。他们奏报说：由于数月入林搜剿叛军的艰辛，约二百六十名四川乡勇请求遣散。^317 但这一次嘉庆被激怒了。他断然驳回请求，无情地责骂将领们：以一万多人的兵力，竟无法了结两百名叛军，毫无建树。他再次提醒他们：迁延的战役耗资巨大，国家的财政状况已今非昔比。嘉庆命：不愿干者遣散，只留肯干者。^318\n在五月初八日的谕旨中，嘉庆责成额勒登保五月内完成军事行动，六月清剿，然后回京随驾木兰行围——他再次提到：额勒登保若不出现在木兰，蒙古宾客会起疑。^319 然而，将领们看向的是另一个方向。额勒登保、德楞泰与赛冲阿联名奏报：他们已命四川开县、太平、大宁与陕西安康、平利、紫阳的居民迁回较大的堡寨（许多居民已回乡，或迁往靠近农田的较小堡寨），并请求调两三千名四川绿营兵到川东北守御当地，还提到：陕西更多乡勇请求退出，包括杨遇春的一些乡勇，四川也可能出现类似情形。^320 这些举动表明：将领们是在为更长的冲突做规划，而不是在可预见的未来收束它。嘉庆震怒，在又一道措辞强硬的谕旨中倾泻他的沮丧与愤怒，命对三人施以降职与象征性处分。他虽然批准了增兵之请，却怀疑其背后有未明言的原因——要么是替换罢工的乡勇，要么是应对那些地方可能由被遣散乡勇组成的更多叛军。^321 尽管嘉庆震怒，不久，三人再次请求把乡勇月饷提高到二两。毫不奇怪，嘉庆再次驳回。^322\n为查明真相，绝望的皇帝指示方维甸密奏将领们的表现，以及\"将领们为了与他讨价还价而故意留着最后的起事者\"是否属实。^323 毫不奇怪，方维甸为他们辩护：\"将领们之所以未裁尽乡勇，是因为贼匪尚未了结。不应出现这样的情况：因为裁减乡勇困难，将领们就故意把最后几股贼匪留着不了结。\"（原文待核，见注释324）^324 方维甸解释说：将领们担心乡勇一旦裁掉，就会加入最后的起事者。然而，他披露：乡勇已有些时候未被用于作战——战利品机会减少，他们失去了动力。方维甸建议把有家产的与无家产的乡勇分开安置：前者护送回乡，交由地方官员监视；后者——陕西一千二百名乡勇中的百分之三四十——由地方政府与大员衙门雇为守卫或差役数月，然后再裁。这实际上是他此前方案的修订版。但嘉庆认为只雇几个月不是办法。他催促方维甸拿出长期方案。^325\n方维甸上奏两周后，勒保也呈上了他对乡勇僵局的看法。他承认：最后这批乡勇难以管束，以至于拒绝作战——因为他们的一些战友在叛军那边——尽管他把这种局面归咎于正规军思乡松懈、没有管好乡勇。与额勒登保、德楞泰一样，勒保也为正规军与乡勇请求更多恩赏——即提高两方的赏格、乡勇的月饷与遣散银。他嘴上说要裁四川最后的两千名乡勇，却没有说明如何安置无家可归者。^326\n困惑而沮丧的嘉庆，只能诉诸言辞的力量。从五月底起的一个月里，他颁发了众多慷慨激昂的谕旨，不断批评将领们数月没有取得任何实质性成功，敦促他们在六月内设法搜尽最后的起事者。在给三省督抚的谕旨里，他请他们协助遣散安置最后的乡勇。他一面频频给谕旨的接收者们\"申饬\"或\"严旨申饬\"、以更多惩处相威胁，一面劝他们凭良心行事、把国事当作家事，并承诺：如果他们照办，就发还被摘去的顶戴。^327 他颁旨之频繁前所未有，堪称一场对抗\"战争主持者们对他的命令与恳求置若罔闻\"的王室反抗。\n最终，额勒登保屈服了。在这场一塌糊涂的战役中——他漫长生涯中最后、也几乎是最不光彩的一场——他一直是乡勇困局、乃至前线腐败的勉强同谋。他虽试图保持清白，到头来还是忍不住效法同侪在战争财政上的做法。然而，他是三巨头中的薄弱环节。五十六岁、身体欠佳的他，本就不愿重返战役。^328 返回后，他的状况恶化：胸痛、头晕、心悸之外，几乎走不动路。接到上述象征性处分后不久，额勒登保以病为由请求离开战役，但承诺离开前遣散川陕两省剩余的全部乡勇——合计约三千五百人。^329\n额勒登保的病假请求给了皇帝打破僵局的机会。六月二十日，嘉庆命额勒登保回西安养病，并把陕西最后的一千二百名乡勇带到西安、就地遣散。同时，嘉庆让德楞泰成为战役唯一统帅，不再让赛冲阿分担责任，并责成德楞泰在七月内了结苟文润一股（另一股只剩十人）。他警告德楞泰：完不成期限就严惩；如期完成则重赏。至于四川最后的两千名乡勇，嘉庆留给德楞泰与勒保去遣散。^330 得到皇帝准许离开的旨意，额勒登保感觉\"好多了\"，能够替腹泻虚弱的德楞泰执掌指挥。七月初九日，德楞泰痊愈后，额勒登保与他相会，把\"钦差大臣\"印信交给了他。^331 二人虽未完全透露所谈内容，极可能是额勒登保说服了德楞泰停止讨价还价、收束战事。嘉庆刚任命那彦成——他再次成为军机大臣——署理陕甘总督（惠龄新近病逝），可能也起了这个作用。熟知那彦成脾性的额勒登保，想必预料到那彦成的到来至少会使局面复杂化，不如趁早了结。^332\n额勒登保启程赴西安时，带走了陕西最后的一千二百三十九名随征乡勇。七月下旬，额勒登保在西安遣散了他们及其他一些乡勇。三百六十六人参了军，其余八百七十三人被送回陕西、四川或湖北的家乡。不过，额勒登保按乡勇们的一再要求提高了遣散赏银。嘉庆这次选择了默认。^333 尽管德楞泰麾下还有一千八百多名随征乡勇，从四川各驻防调来的三千名绿营兵即将到达。额勒登保、德楞泰与赛冲阿联名承诺：新兵一到，所有剩余乡勇都会裁掉。^334\n德楞泰与额勒登保会面三天后，七月十二日，杨遇春、丰绅与田朝贵在平利凤凰寨击溃了苟文润一股，杀俘一百五十人。急于收尾的嘉庆重赏将领士兵，并把被摘去的顶戴发还给额勒登保与德楞泰。^335 此战之后，苟文润失去了对队伍的控制；他的一些部下脱逃了。嘉庆不久前虽在额勒登保与德楞泰的请求下勉强把期限延到八月，如今却确信：结束终于要来了。^336\n八月初一日，苟文润在睡梦中被赵洪周杀死——赵洪周是前乡勇，曾回到清军当斥候，后被叛军俘获。被俘后，赵洪周假装愿意入伙，当了伙夫，却设法接近苟文润。另一名被叛军俘获的人帮助赵洪周杀死了苟文润。随后两人逃回清军。^337 苟文润既死，剩余的叛军分成小队，在平利与太平的山中各自逃生。到八月下半月，德楞泰已收捕了他们中的许多人，但该股的两个头面人物——罗其清的弟子王世贵与教门师父王作经——仍在逃。^338 这次不想错过期限，德楞泰在八月底之前经六百里加急发出了报捷折。\n九月初五日奏折到京时，久盼的最后胜利并没有引起多少兴奋。与上次一样，嘉庆没有给额勒登保与德楞泰授新爵；也没有给三省将领或文官多少升迁。德楞泰的报捷折与嘉庆宣布最后胜利的谕旨，都不像在欢庆，反而听起来满怀歉疚——它们试图为战役的迁延辩护，抹去那个难堪的事实：对付几百名\"叛军\"，竟花了一年多。除惯常的借口外，歉疚竟至于声称：起事者越少，围剿越难。同时，乡勇问题被略去不提——既没有提到一些被遣散的乡勇与最后的叛军合流，也没有提到最后乡勇的遣散曾是胜利的巨大障碍。德楞泰只是含糊地提及：漫长战役最后阶段之所以更难，是因为起事者与\"土匪\"（tufei）合流了——但他没有点破他们究竟是谁。^339 在官修战役方略中，编纂者们选了另一个词——\"杂夫游民\"（zafu youmin）——来冲淡这个令人不快的问题。^340\n最后的叛军与乡勇\n在一定程度上，最后这场胜利又是名义上的。德楞泰在报捷折里虽然足够谨慎、没有说叛军残部已全部消灭，嘉庆皇帝却不愿引起任何怀疑，在宣布胜利的谕旨中宣称：三省已不剩一名叛军。然而，在同一天给德楞泰的另一道谕旨中，他责成德楞泰肃清最后的残部，擒拿王作经、王世贵与苟朝九——朝廷所知姓名的最后三名起事者。^341 事实上，\"残部\"包括转为劫掠为生的前乡勇。^342 由于镇压者不愿明确称他们为前乡勇，便继续称他们为\"土匪\"，以区别于老起事者——后者此时被称为\"零匪\"（lingfei）与\"散匪\"（sanfei）。\n按嘉庆指示，德楞泰驻太平城口，督率对三省交界处最后敌人的搜剿。此后数月，由几十人或更少人组成的小股被消灭。有些人上吊自尽。有些人受当地居民庇护。^343 1805年初，嘉庆开始催促在一月底或二月初出局，计划届时撤军、把搜剿移交地方政府，尽管他仍希望此前能擒获他点名的三名叛军。^344 十二月初三日，苟朝九在南郑被擒。闻讯后，嘉庆同意撤出所有部队，但数日后又改了主意，命不擒王世贵不撤军。^345 但德楞泰不同意。或许是思念成都——成都将军的驻所——德楞泰论证说：不值得留两万军队在外搜捕几十名\"匪徒\"；王世贵不过是个\"战手\"，王作经也年近五十。^346\n除二王之外，四川最后一批乡勇是剩下的障碍。在陕西，额勒登保离开后不久，那彦成与方维甸就安置了被遣散的乡勇。在湖北，吴熊光在最后胜利后迅速裁掉了所有剩余乡勇，遣返了已部署部队。^347 只有四川最后乡勇的裁撤拖了近半年。第三次胜利前不久，勒保以小股叛军为借口，请求把部队多留几个月。请求中没有提四川最后的一千八百名乡勇，勒保事实上把他们也留了下来。^348 最后胜利一个月后，勒保与德楞泰又同皇帝谈判。他们请求把四川乡勇的遣散银从五两提高到十两，坚称：额勒登保在裁撤陕西全部乡勇时，实际已把赏银从五两提到七两五钱，兴安府的地方官员还给被遣散乡勇捐了衣鞋。他们还奏报：德楞泰的乡勇当时正在陕西，目睹同侪领取那些恩赏，也恳求德楞泰提高自己的赏银。嘉庆再次屈服了。^349 然而，勒保拖了三个月才执行。直到1805年二月初，四川的乡勇才全部遣散——或送回家乡，或招为新兵与衙门差役。^350\n十年三月初十日，接到德楞泰\"用三省驻军巡守边境\"的提议，嘉庆批准撤出所有已部署部队，德楞泰前往成都就任。^351 五月十九日，王世贵在太平被例行半年演习的四川军队杀死——按战役结束前的计划——之后，嘉庆暗示有意取消对王作经的搜捕。^352 七月中旬，德楞泰奏报：四川军队消灭了一股八人的起事者，其中一人跳崖，坠亡前自称姓\"王\"——这使皇帝安了心。德楞泰随后\"所有叛军残部已肃清\"的结论，被皇帝欣然接受。^353 冲突终于结束了。\n注释\n[译者按：文献简称对照——除前章所列外，另有：SHD《上谕档》。]\n题辞：XFFLXB, 27/24b–26a.\n\nXFFL, 210/21b–25a.\nXFFL, 218/27b–37a, 220/8a–12a, 223/17a–19a, 224/32b–36a, 226/13a–21b, 227/41a–46a, 229/30a–32a.\n除升官或授职外，赏格高达一千至两千两。XFFL, 230/10b–14a. 嘉庆元旦次日刚重申过赦免叛军首领的承诺。XFFL, 227/14b–17a.\nXFFL, 223/24b–30a.\nXFFL, 223/34b–38b.\nXFFL, 219/15a–16b, 220/1a–4b, 222/7b–9b.\nXFFL, 220/4b–8a, 221/20b–23b, 222/10a–12a.\n在渠县与仪陇的这场战斗中，清军据说杀死三四千名叛军，包括杨开第与齐国模两名首领。XFFL, 223/1a–10a, 223/13a–15a. 但此数可疑。\n七十五告诉德楞泰：除边境上一股三四千人的叛军外，还有几股从陕西到达了广元。XFFL, 224/26a–32b.\nXFFL, 224/26a–32b, 226/6b–13a.\n但嘉庆认可了德楞泰赴陕。XFFL, 224/32b–36a, 226/13a–17a.\nXFFL, 224/26a–32b, 226/6b–13a, 226/13a–17a.\nXFFL, 226/13a–17a, 228/18a–24b.\nXFFL, 卷226–33。\nXFFL, 231/33b–36b, 232/11a–12b, 233/29a–40a, 235/3b–8b.\n一些被俘叛军说樊人杰于嘉庆六年二月初六日滚下悬崖。XFFL, 239/3b.\nXFFL, 卷236–47 各处及250/10b–14b。\n三月，薛大烈与阿哈保消灭了一股藏身大巴山数月之久的九百名张汉潮残部。XFFL, 247/12b–18b.\n刘朝选供词，BLJZL, 5:138–39; 汤思蛟供词，第144–45页。\n汤、刘一股在湖北先被阿哈保追击，后被七十五追击。XFFL, 卷243–59 各处。\nXFFL, 226/40a–41b.\nXFFL, 228/18a–24b, 231/36b–41a.\nXFFL, 241/18b–21a, 卷246–58 各处, 及275/10b–12b。\nXFFL, 252/4a.\nXFFL, 228/26b–27a.\nXFFL, 236/8b–9b, 250/15a–16a. 嘉庆的警告见XFFL, 228/24b–27b, 231/43b–45a, 232/17a–19b, 236/15b–16a, 239/6b–8a, 243/17a–18b.\n六小时的战斗发生在交仗垭——字面义为\"交战之谷\"——双方伤亡都不轻。高二随后折回房 使用这些记录，见韩书瑞（Naquin）\"True Confessions\"。\nXFFL, 卷240–53 各处; 王凌高、张深供词，BLJZL, 5:118–19.\n徐天德的尸体后来被德楞泰的部队找到。XFFL, 卷254–61 各处。\n经旬阳知县严如熤鼓励，当地乡勇参加了对陈朝观一股的作战。XFFL, 251/25b–28b, 254/3b–10b, 256/7b–14a.\nXFFL, 卷237、238、240、242–63 各处。\nXFFL, 285/6b–10b.\nXFFL, 卷248–56 各处。\nXFFL, 卷241–45 各处及248/5b–8b。\nXFFL, 247/20a–28a.\n这场起事是三月间由教门社团\"悄悄会\"——字面义为\"秘密会\"——发动的；该会创于乾隆朝晚期，活跃于陕西凤翔府。陕西军队迅速镇压了起事。XFFL, 246/8a–17b. 又见铃木中正Sennen ōkkuteki, 299–300。\nXFFL, 247/28a–29b, 249/15a–21a.\nXFFL, 247/1a–9a, 248/1a–5b, 250/1a–10a, 251/28a–b; 冉学胜供词，BLJZL, 5:130.\nXFFL, 251/11a–14b, 253/17a–22a.\nXFFL, 卷251–66 各处; 冉学胜供词，BLJZL, 5:130.\nXFFL, 254/10b–13a, 254/20b–23b, 及卷237–55 各处。\nXFFL, 241/25a–26b, 243/22b–23b, 244/19a–21a, 247/30a–34a, 250/9b–10a, 254/1a–3a, 255/15b–16a, 256/24a–25a, 259/8a–11b.\nXFFL, 251/14b–17b.\nXFFL, 245/27b–29b.\nXFFL, 253/8a.\n二人的奏报于嘉庆六年五月初二日到达皇帝手中。他们的建议包括：沿栈道及宝鸡、凤翔驻军；审查登记所有乡勇、限制再雇；让西安的满洲与汉军训练；三个战场的所有升迁请求都经额勒登保。XFFL, 253/5a–17a.\nXFFL, 251/21a–22b, 253/24b–28b, 254/20b–23b, 258/15b–17b, 260/23a–26a.\nXFFL, 266/9a–10b.\n其中一场战斗中，杨遇春与格布舍擒获了冉天泗与王士虎。XFFL, 卷245–85 各处; GZDJQ, 5547.\n德楞泰说，他的许多士兵没有鞋穿，六千名士兵中三分之一或病或腿脚肿损，许多人已死。XFFL, 269/8b–11a, 272/15b–26a, 277/22a–24b.\nXFFL, 266/19b–21b, 267/35b–38a, 269/11a–12b, 272/26a–28a, 277/24b–26a.\nXFFL, 253/26b–33b 及卷264–80 各处。\nXFFL, 卷260–66 各处。\nXFFL, 卷260–69 各处; 辛斗供词，BLJZL, 5:131–32.\n因剿灭冉学胜之功，勒保恢复了一品顶戴，获三等男爵。XFFL, 270/22a–32a.\nXFFL, 卷271–75、282–85 各处; 辛斗供词，BLJZL, 5:131–32; 魏洪升供词，第136页; GZDJQ, 5711.\nXFFL, 卷267–84 各处; 刘朝选供词，BLJZL, 5:139; 汤思蛟供词，第145页。\nXFFL, 卷255–56、259–65 各处。\nXFFL, 261/16b; QSLJQ, 83/31b.\nXFFL, 卷268–85 各处。\nXFFL, 280/7b–8a.\nXFFL, 卷264–75 各处。\nXFFL, 266/10b–13a.\n一个月后，据德楞泰说，总数降到一万九千。XFFL, 270/5a–9b. 不久，数字先降到不足一万，再降到七八千。XFFL, 271/12b–15b, 276/11a–12b.\nXFFL, 270/9b–13a, 274/9a–11b, 279/24a–25b.\nXFFL, 284/7a–9a.\nXFFL, 280/12b–17b. 不久，勒保与德楞泰也奏报了遣返军队的计划。XFFL, 283/7b–8b. 两个月前，额勒登保已计划遣返满洲旗兵，嘉庆同意，并给了详细指示。XFFL, 271/10b–12b, 271/14b–15b.\n嘉庆授额勒登保三等伯爵、德楞泰二等伯爵，各赏黄鹿皮褂一件。XFFL, 280/26a–31a.\nXFFL, 283/22a–24a, 283/29b–32a.\nXFFL, 283/24a–27a.\nXFFL, 283/32a–33a, 283/35b–36b, 284/15b–23b.\n最近一次是他批准额勒登保为地方官请升时。XFFL, 283/32a–33a.\n他裁定：无家无业的乡勇可开垦山中荒地，或到铜矿盐场做工。XFFL, 284/27b–28b, 284/38a–40a.\n苟文明的妹妹嫁给了罗其清的弟弟。\nXFFL, 卷267–86 各处。\nXFFL, 284/14b–15b, 285/1a–6b, 285/14a–19a, 289/11b–12b.\nXFFL, 286/2a–14a.\nXFFL, 卷286–89 各处; GZDJQ, 6732, 6780.\n长麟派两千二百名士兵赴甘，并亲往主持后勤。XFFL, 卷288–89 各处。\n他们不去甘肃的理由是：等苟文明被逼回陕西时夹击他。XFFL, 287/1a–7b, 288/15a–18b, 289/1a–14a, 289/24b–30a; GZDJQ, 6874.\nXFFL, 289/89b.\n尽管其中有些人有鸟枪（niaoqian），没有弹药也用不上。他们带着枪只为伪装成清军偷取给养。周世洪供词，BLJZL, 5:161.\nXFFL, 290/9a.\n然而，龙绍周的一些部下因信使而脱逃或投降了。XFFL, 264/13b–14b, 264/16a–18a, 269/6a–b.\n1801年初大宁一场对龙绍周的战斗之后，德楞泰屠杀了近七百名俘虏，其中九人被剐磔处死。XFFL, 244/6b. 不久，湖北兴山一场对徐天德、苟文明的战斗之后，德楞泰与长龄屠杀了四百七十三名叛军，把五名首领凌迟处死。XFFL, 250/26a–b. 1801年初，一场对樊人杰的战斗之后，勒保把七名叛军首领凌迟处死，屠杀三百七十八名叛军。XFFL, 233/34b–35a. 1801年底，达州一场对李彬一股的战斗之后，杨遇春处决了近四百名俘虏。XFFL, 282/6a–b.\nXFFL, 299/8b–9b.\nXFFL, 289/31a–33b, 290/4b–10b, 291/1a–5b, 291/12a–14b, 292/4a–6b.\nXFFL, 289/17b–23a.\n他们以种种借口为七十五的拖延开脱，称赞七十五十几日就把苟文明逐出甘肃，还提到他负伤十五次、被捕时部下为之哭泣。XFFL, 289/30a–31a, 290/12a–13a, 291/6b–9b, 291/14b–16a; GZDJQ, 6953. 夏末，七十五因伤不能视事，被召回北京。XFFL, 327/41b–44a.\n事实上，嘉庆此前曾批评额勒登保包庇属下，敦促他查办七十五、处分未能阻止叛军经其防区通过的王自禄。XFFL, 285/14a–19a. 王自禄再次未能阻止苟文明入川，额勒登保提议对王自禄处死刑、罢免另一军官。额勒登保与德楞泰还请求把一名军官降为士兵。XFFL, 289/24b–30a, 289/33b–36b, 291/9b–12a, 291/16a–b.\nXFFL, 290/24a–b 及卷293 各处。\nXFFL, 292/20b–26b.\nXFFL, 290/26b–28b, 292/27b–30a.\nXFFL, 288/18b–20b, 288/24a–b, 294/16a–19b.\n额勒登保说：他不想用全部兵力追击溃散的叛军，将\"相机缓进\"。XFFL, 293/20b.\nXFFL, 296/1a–5a, 296/7–10a.\nXFFL, 297/6b–18b.\nXFFL, 296/18b–20b, 297/18b–24b; GZDJQ 7471.\nXFFL, 297/24b–27b.\n江北只有两股叛军。一股在秦岭游荡，但其首领之一辛聪于正月初被擒。另一股就是新年前不久渡汉江的那支。XFFL, 卷291–97 各处。\n嘉庆派额勒登保与杨遇春肃清汉江以北，庆成与庆溥负责江南叛军。四川方面，他在德楞泰（川东）与勒保、赛冲阿（川北）之间分了工。必要时，嘉庆甚至愿意批准增援请求。XFFL, 298/14a–25b.\n嘉庆向额勒登保承诺：战役一结束就召回他。XFFL, 300/13a–15b.\nXFFL, 293/5b–8a, 卷299–300、304–5、310–17 各处; GZDJQ, 7546, 7654, 7713, 8003.\nXFFL, 300/28a–30a, 309/7b–10a.\nXFFL, 311/31a–33b, 313/8a–9a, 315/7b–9a, 317/19b–21b.\nXFFL, 319/8b–14a.\n除升赏士兵、叛军免罪外，赏格在五百至两千两之间。XFFL, 319/16b–20b.\nXFFL, 319/20b–21b. 事实上，嘉庆早先就指示陆有仁密奏陕西全体将领的情况。XFFL, 295/40a–b.\nXFFL, 290/10b–12a 及卷292–303 各处。\nXFFL, 290/17a–21a.\nXFFL, 90/21a–24a, 291/21b–23a, 292/17b–19b, 298/14a–16b, 299/24a–25a, 301/12b–15b.\nXFFL, 345/1a–4b.\n胡明远供词，BLJZL, 5:150–51; 赵从官供词，BLJZL, 5:157.\nXFFL, 290/3a–4b, 339/4b–5a.\nXFFL, 292/6b–13a, 295/1a–5a, 295/10b–12b, 311/6a; 赵从官供词，BLJZL, 5:157–59; 张世虎供词，BLJZL, 5:154–55.\n据德楞泰与湖北将领们说，重新集结的叛军有四千人，其中三千是\"矛手\"。但吴熊光认为只有一千是真起事者。XFFL, 309/22b–23b.\nXFFL, 291/5b–6a 及卷297–99、302、305 各处。\nXFFL, 302/9a–11b, 305/16b–18b.\nXFFL, 卷300–12 各处。\nXFFL, 卷307–9、311–12 各处。\n蒲天宝股团的核心是陈朝观蓝号的两百人。陈朝观被杀后，他的两个儿子成为该股名义首领，但蒲天宝是谋主。XFFL, 卷313–16、318 各处。\n嘉庆指示德楞泰及其同僚利用雨季，提醒他们上年夏天徐天德在陕西溺毙之事。XFFL, 320/3a–10b.\n樊人杰的尸体始终未能辨认——江岸尸体损毁严重。XFFL, 321/1a–10b, 及卷322–24 各处。\n1802年夏被捕后，张世虎谈到樊人杰：\"我们皆听其号召。凡有信来，所言皆遵。他与刘之协、王廷诏、李述同为最尊者。\"张世虎供词，BLJZL, 5:155.\n嘉庆把德楞泰的爵位升为三等侯。XFFL, 321/18a–21a.\nXFFL, 319/28a–31b, 320/1a–3a, 320/15a–23b.\nXFFL, 322/24a–26b.\n嘉庆起初以七月二十日为限。额勒登保请求延到七月底，嘉庆勉强同意。XFFL, 卷323–24、326 各处。\nXFFL, 卷327–29、331 各处; 苟朝九供词，BLJZL, 5:164; GZDJQ, 8417, 8553.\n罗友枝（Rawski）Last Emperors, 19–21。\nXFFL, 328/21b–26a, 329/6b–10a. 嘉庆对杨遇春的注意，见XFFL, 173/29b–33b, 181/16b–18b, 191/31b–33b, 191/35a–b, 207/28b–31a.\n在陕西，额勒登保在苟文明死前已开始遣返旗兵与绿营兵。XFFL, 327/8b–11a, 331/18a–21b, 338/34b–36a. 勒保也遣返了山西、广东的绿营兵，但留下了云南、贵州的。XFFL, 326/15b–19b.\n嘉庆1799年初亲政后不久就表达过这些关切。QSLJQ, 79/30a–b.\nXFFL, 134/6a–7a.\nXFFL, 135/15a–16a.\nXFFL, 159/22b–25b.\n1800年底，嘉庆说：他已就此事向战争领导人们颁发过众多谕旨，却没有收到任何详尽可行的方案。XFFL, 217/3b–4b.\nXFFL, 240/35b–38a.\n陆有仁的答复先到。数日后，勒保的提议与长麟、陆有仁的联名奏折也到了。XFFL, 248/16b–20a, 249/8b–12b, 264/18b–25a.\nXFFL, 264/18b–25a, 267/1a–5a.\nXFFL, 323/7b–8a.\n兴魁于嘉庆七年九月初一日把谕旨交给额勒登保。随后兴魁前往汉中，向陆有仁口头\"密传\"嘉庆关于裁减乡勇的指示。XFFL, 340/6b–8b. 不久，嘉庆任命兴魁为西安将军。\nXFFL, 323/29a–32a, 324/17a–20b, 326/11b–12a, 327/16b–17b, 328/26a–27b.\nXFFL, 328/8b–16a.\nXFFL, 324/19a–b, 328/18b–21b.\nXFFL, 329/27a–29a, 331/24a–b, 334/32a–33a, 335/18b–19a.\nXFFL, 335/27b–30a. 额勒登保随后的一道奏折描绘了同样乐观的景象；336/23b–24a。\nXFFL, 336/31b–32a, 339/29b–31a, 346/22b–24b.\n吴熊光派一名道员到竹溪、襄阳知府到郧阳接收被遣散的乡勇。XFFL, 339/5a–6a.\nXFFL, 336/1a–3b, 343/9a–14b, 343/16a–b, 343/18b–21a.\nXFFL, 324/13a–16a, 337/10a–11b.\n德楞泰还声称三省还有两万名防守乡勇。这个数字同样可能大大缩水。XFFL 329/17b–24a.\n被裁的一千三百名乡勇中，大多数人回到秦岭山区的家乡——他们都有产有业。五十三人被送回城固、洋县、西乡的家中；三十三人送回湖北；一百多人送回四川。只有二十四人参军。XFFL, 326/7a–b, 327/8b–11a, 334/24a–25b, 336/5b–6b, 336/13a–16a, 338/34b–37a, 339/9b–10a.\nXFFL, 339/29b–31a, 339/32b.\n勒保声称四川的防守乡勇已全部裁撤，但显然不是事实。在陕西，陆有仁也给人防守乡勇大多已裁的印象。他说到七月只剩百分之十到二十的防守乡勇，且他继续在裁。XFFL, 330/20a–b, 338/3a–b, 341/16b–17a, 343/24a–b. 然而，1802年底——他去世前不久——陆有仁奏报：陕西南部的防守乡勇大多已裁，但本省东南部（如紫阳、平利）的还没有裁。XFFL, 347/26a–27b.\n据德楞泰说，1803年间又裁了三至四万乡勇，还剩四五千。XFFLXB, 22/45b–46a. 因此，1802年底仍雇用的乡勇至少有三万五千至四万五千。实际数字可能更高。\nXFFL, 339/29b–31a, 346/22b–25a.\n见注释192。\n德楞泰论证说：大多数随征乡勇是四川人，要求在四川多设编制安置他们——因为三省新设的一万个绿营编制中，四川只有一千。嘉庆指示额勒登保与三省督抚审议。XFFL 329/17b–24a, 329/27a–29a. 但额勒登保与督抚们都没有下文。\nXFFL, 311/8a–b, 311/11a.\n据吴熊光奏报。XFFL, 333/16a–17b.\n方维甸1804年承认：在陕西，一些被裁乡勇在归途中逃跑，或被送回家后又离乡。XFFLXB, 27/24b–26a.\n嘉庆七年六月二十三日，罗思举在大宁擒获刘朝选，消灭了他四百人的队伍。为此，嘉庆赏勒保一等男爵。XFFL, 325/1a–10b. 汤思蛟于十月被擒。XFFL, 345/19a–24b.\nXFFL, 卷319、321–23、339、342、344–45、347 各处。\nXFFL, 卷322–27、329–33 各处, 329/24a–27a.\nXFFL, 333/9b–12b.\nXFFL, 卷334–36 各处。蒲天宝殒命前不久，四川的老叛军首领唐大信在巴东被追兵所逼，跳崖而死。XFFL, 334/33a–b, 339/1a–3b.\nXFFL, 334/16a–19a 及卷336–39 各处。\n关于额勒登保的湖北之行，见XFFL, 卷336–41、343、346 各处。\nXFFL, 卷339–41 各处。\nXFFL, 279/1a–3a.\nXFFL, 287/18a–20a.\nXFFL, 329/10a–11b, 331/21b–23b.\nXFFL, 334/19a–21a, 334/31a–32a, 335/6b–8a, 335/23a–b, 338/31a–34b.\nXFFL, 339/44a–b, 340/22b–28a, 341/26a–28a, 343/8a–9a.\nXFFL, 335/21b–23a.\n同时，嘉庆对额勒登保与德楞泰大加赏赐，赏其部队数百面银牌。XFFL, 338/31a–34b.\nXFFL, 339/3b–4a.\nXFFL, 342/10b–18b.\nXFFL, 339/44a–b, 340/22b–28a, 341/26a–28a, 343/8a–9a.\nXFFL, 348/29a–32a.\nXFFL, 347/20b–23b, 348/32a, 349/7a–8b, 349/18b–21b.\n戴仕杰被杀，另一首领被擒，但崔宗和与胡明远前夜已离队。数日后，崔宗和在保康被捕。XFFL, 350/22a–b, 350/26b–27b, 351/46b–49b; 崔宗和供词，BLJZL, 5:148.\nXFFL, 348/1a–9b.\nXFFL, 卷341–42、345–46、348–49 各处。\n长龄病重，被召回北京。XFFL, 337/11b–14a, 338/37a–38a, 339/40a–41b, 339/45b–47b. 孙清元被马踢伤。XFFL, 342/20a–27b.\nXFFL, 339/42a–43b, 345/18b–19a, 349/11b–14a, 350/16a–17b, 351/47b–48b; 吴熊光《伊江笔录》（Wu, Yijiang bilu），1/16b–17a。\nXFFL, 卷328、331–32、334–36、348–50 各处。\n嘉庆把惠龄的顶戴降为二品。XFFL, 卷348–51 各处。\nXFFL, 卷344、346–48 各处。熊翠于十一月被杀。XFFL, 351/34a–44b.\nXFFL, 347/20b–23b, 349/1a–8b, 349/14a–18a, 350/19b–25b, 351/16b–17b; 苟朝九供词，BLJZL, 5:163.\nXFFL, 349/27a–33b, 350/1a–5a.\n嘉庆把额勒登保的爵位升为三等侯，授穆克登布两个世职。XFFL, 350/13a–15b, 350/25b–26b, 350/33b–34b.\nXFFL, 350/40a–45b.\nXFFL, 351/13b–15b.\nXFFL, 350/19b–25b, 351/1a–7a, 351/34a–44b.\nXFFL, 卷350–51 各处。\nXFFL, 350/15a–b, 350/45b–48a, 351/13b–15b, 351/44b–46b.\n奏折中，他们开列了整个战役中消灭的一百多名叛军首领，声称数百名次要首领被杀。XFFL, 352/1a–6b.\n额勒登保被升为一等侯，再加两个世职与紫缰。德楞泰也升为一等侯，加一个世职与紫缰。其子苏冲阿升为副都统，奉命携礼赴前线看望父亲与额勒登保。勒保由一等男升为一等伯，加一个世职——嘉庆表示，他的功绩不足以发还被褫夺的公爵。获升赏者还包括明亮、赛冲阿、杨遇春、惠龄、吴熊光、姜晟、倭什布、福宁、英善、文成惠、杨揆与刘清。获赦者包括丰绅殷德（和珅之子）、宜绵（从伊犁获释）与景安（出狱，发往热河当兵）。XFFL, 352/6b–19b; QSLJQ, 106/8b–19a. 次日，嘉庆前往紫禁城北的寿皇殿祭祀列祖列宗。QSLJQ, 106/18b.\nXFFLXB, 1/1a–2b.\nSHD, 嘉庆七年十二月十八日, 7; XFFL, 352/17b–18a; QSLJQ, 106/20b–21a.\nSHD, 嘉庆七年十二月二十七日, 29–30.\nXFFLXB, 卷1–6, 7/26b–28a, 9/34b–35b, 11/26b–27a, 11/30b–32a.\nXFFLXB, 2/17b–19b.\nXFFLXB, 7/6b.\n东乡老叛军刘学礼——绰号\"刘扎胡子\"——率其五六百人在四川巫山击溃清军，杀伤近两百名士兵乡勇。竹山另一场战斗中身负重伤时，刘学礼确实战斗到了最后一口气。XFFLXB, 7/32a–37a, 7/37a–38a. 叛军首领胡元魁被捕时，要求被杀而非投降。胡元魁随后被剐磔处死。XFFLXB, 4/30a–b.\nXFFLXB, 8/1a–4a, 9/39b–40a.\nXFFLXB, 卷2 各处。\nXFFLXB, 3/2b–4a, 3/33a, 6/21a–23a, 6/26a–28a, 6/34b–36b, 8/12b, 9/6b–7a.\nXFFLXB, 4/17a–19b, 8/19b–21a, 9/6b–7a, 9/10b–12b, 11/33b–34a.\nXFFLXB, 卷2–3 各处, 4/27a, 11/38b. 嘉庆指示勒保把投降的叛军首领王国贤放回叛军中劝降。XFFLXB, 3/31a–32a.\nXFFLXB, 9/19a–20a.\nXFFLXB, 卷4–5 各处及9/10b–12b。\n到1802年九月已裁七千名乡勇，到次年正月又裁了三千二百。XFFLXB, 5/14b–15a.\nXFFLXB, 1/12b–14b, 5/34a–35a.\nXFFLXB, 3/29a–30b.\nXFFLXB, 5/1a–5b, 5/24b–26a.\nSHD, 嘉庆八年二月十八日, 55–59; 二月二十二日, 77–80; 二月二十五日, 89–93; 六月初五日, 14; XFFLXB, 5/5b–8a, 5/15a–18b, 5/23a–24b, 5/26a–31a, 5/35b–36a.\nXFFLXB, 5/39b–42b.\nXFFLXB, 5/42b–44b, 5/44b–45b.\nXFFLXB, 6/12b–13b, 9/33a.\nXFFLXB, 7/28b–32a.\nXFFLXB, 8/13a–15b, 9/1a–2a, 10/13b–14a.\nXFFLXB, 6/15b–16a, 9/36b, 13/30a–31a.\nXFFLXB, 8/25b–27b.\nSHD, 嘉庆八年三月初十日, 39–46; 三月初十日, 47–50; XFFLXB, 8/27b–32b.\nXFFLXB, 8/32b–36a.\nXFFLXB, 9/33a–34a, 10/25b–26a, 10/30b–31b.\nXFFLXB, 10/7a–10a. 五月齐国典被除后，嘉庆发还了额勒登保的御前大臣衔与紫缰。XFFLXB, 13/1a–8a.\n勒保抱怨腰腿疼痛、气喘、眩晕、失眠。然而，他并没有真正休息——这赢得嘉庆\"认真任事\"的称赞。XFFLXB, 9/16b–18b, 10/37b–38a, 11/25a.\nXFFLXB, 卷13–15。\nXFFLXB, 12/20b–21b, 13/10b–11b, 13/25b–26a, 13/34b–35a, 14/20a–21b.\n六月，额勒登保提议从战役中撤出所有旗兵与外省兵。XFFLXB, 15/7a–b, 15/23b–24b.\nXFFLXB, 14/12a–13b. 德楞泰的人马俘获八名劫掠的前乡勇时，他们供称：三两赏银不足以安身立命。XFFLXB, 14/25b.\nXFFLXB, 15/23a–26a.\nXFFLXB, 15/18a–19a.\nXFFLXB, 14/13b–15a, 15/19a, 15/31a–b.\nSHD, 嘉庆八年六月十二日, 37–42; 六月二十五日, 75–79; XFFLXB, 15/7b–10b, 15/16b–18a, 16/12a–14a.\nXFFLXB, 16/1a–3b, 16/34b–38b.\nXFFLXB, 16/33a, 16/38b–43a.\nQSLJQ, 116/34b–40a; XFFLXB, 16/43a–48a.\nQSLJQ, 117/1a–4b.\nXFFLXB, 16/10a–11a, 16/16b–17a.\n嘉庆指示对被裹挟平民的惩处定出统一规则：短期从叛者流放，长期从叛者解交督抚或额勒登保审讯，案情呈他裁决。QSLJQ, 116/40b–41b; XFFLXB, 16/48b–51a.\nXFFLXB, 17/8a, 17/47b–49a.\nXFFLXB, 卷18–19。嘉庆还试图把正赴热河途中的德楞泰调回战役。XFFLXB, 16/38b–43a. 显然，这道旨意未能及时送达德楞泰。\n那批乡勇共四五百人，在秦岭搜剿叛军残部时闹事，杨芳命吴廷刚遣散他们。然而，没有人护送他们到汉中、再送回四川。显然，那些乡勇在途中自行散去了。XFFLXB, 16/11a–b, 16/32a–b, 23/3b–4b, 23/17b–18a, 27/1b.\nXFFLXB, 20/35a–36a, 21/36b.\n十月初一个雾蒙蒙的清晨，陕西定远一场战斗中，他们杀死了数名清军军官，并数次冲击杨遇春的部队。XFFLXB, 21/20a–b. 吴熊光指出此股\"异常凶悍\"。XFFLXB, 25/12a.\nXFFLXB, 19/22a–29a, 20/36b, 20/38b–40a.\nXFFLXB, 15/24b, 15/32a–b.\nXFFLXB, 21/21b, 21/23b–24a, 21/35a–42b, 22/6a–9b.\nXFFLXB, 22/11a–16a, 22/25a–28a, 卷21–23 各处。吴熊光奏报：\"乡勇变叛军\"声称额勒登保不公正地遣散了他们，但他补充说，他认为这些指控是编造的，意在诋毁额勒登保与杨遇春。XFFLXB, 25/12a.\nXFFLXB, 22/28a–29b, 22/53b–56a.\nXFFLXB, 22/41a, 22/43b–47b.\n魏忠才的叔父魏四叔推动了七名乡勇之死。1796年，魏忠才曾因叔父奉教而向官府告发他。XFFLXB, 33/17b–18b.\nXFFLXB, 23/1a–6b.\nXFFLXB, 22/48b–53a, 23/8a–11a.\nXFFLXB, 卷23–25 各处。\nQSLJQ, 126/23a–24a; XFFLXB, 24/20a–22a, 24/23b–24b.\nXFFLXB, 24/12a–b, 24/37a–39a, 25/4b–6b, 25/13a–14b, 25/24b–26a.\n嘉庆发还杨遇春被摘的顶戴，赏军官与伤员礼物银牌。XFFLXB, 25/27b–34b.\n周世洪供词，BLJZL, 5:161; XFFLXB, 24/1a–b, 26/20a, 28/26a, 31/12b–13a.\nXFFLXB, 25/39a–b.\n到1803年九月初，陕西已裁两千五百名乡勇。四川在八九月间遣散了五千多名乡勇。湖北方面，吴熊光在十月加快了裁减剩余两三千名乡勇。XFFLXB, 卷17–18、20 各处。但吴熊光1804年初提议：湖北最后一批乡勇到战役结束前不裁，免得他们有讨价还价的机会——嘉庆同意了。XFFLXB, 24/3a–4a.\nXFFLXB, 24/3a–b.\nXFFLXB, 23/17b–18a.\nXFFLXB, 卷25–29 各处。\n他不赞成朱勋用自己\"养廉银\"提高乡勇遣散赏银。XFFLXB, 22/36a–b, 23/17b–18a.\nXFFLXB, 22/53b–56a.\nXFFLXB, 23/17a–19b.\nXFFLXB, 23/20a–21b.\nXFFLXB, 24/10a–12a.\n嘉庆还指示：被遣散乡勇分批护送回乡，每批不超过一百人，批与批之间隔数日。SHD, 嘉庆九年二月初九日, 69–71; XFFLXB, 24/14a–16a.\nXFFLXB, 29/6b.\nXFFLXB, 26/1a–2b, 26/11a–24a.\nXFFLXB, 26/28a–29b.\nXFFLXB, 26/33a–36b, 27/27b–28b.\nXFFLXB, 27/9a–11b.\nXFFLXB, 27/16b–18b.\n他们被褫夺荣衔、顶戴与紫缰。此外，德楞泰被降为二等伯，褫夺参赞大臣之职。嘉庆还指示额勒登保严厉申饬杨遇春及其部属。XFFLXB, 27/18b–23b.\n他指示他们裁掉不顶用的乡勇，只留精壮——剩下的少了，就好管了。XFFLXB, 28/5a–7b, 28/9a–10a.\nXFFLXB, 23/19b–20a, 27/33a–b.\nXFFLXB, 27/24b–26a.\nXFFLXB, 27/24b–26a, 27/28b–29a. 吴熊光不止一次指出：没有劫掠机会，乡勇就失去了作战动力。XFFLXB, 10/13b–14a, 27/27b–28b.\n对勒保不置可否的态度不满，嘉庆让他采用方维甸的办法：把乡勇雇为地方衙门差役。XFFLXB, 28/31a–32b, 28/34a–35a.\nXFFLXB, 27/30a–35a, 28/7b–9a, 28/14a–15b, 28/27a–29b, 28/29b–30a.\n在京期间，他一再拒绝嘉庆重返战争的请求。XFFLXB, 27/19b–20a.\nXFFLXB, 29/6a–7b.\n嘉庆派一名侍卫与一名御医赴前线照料额勒登保，允许他坐轿回京，无需赶上随驾木兰。XFFLXB, 29/1a–5a, 29/7b–12b.\nXFFLXB, 29/17a–22a, 29/24b–33a, 30/1a–3a, 30/7b–8b.\nXFFLXB, 29/8b–9a. 那彦成一到任，就弹劾兴安的两名地方官安置被遣散乡勇不力，请求惩处。XFFLXB, 30/18b–19b, 30/23b–24a.\n对非随征乡勇，额勒登保给外省者七两、陕西者五两。随征乡勇，外省者十两、陕西者七两。参军者中，非随征乡勇得五两，随征乡勇得七两（遣散时二两置衣鞋，到营后五两）。XFFLXB, 31/1a–4a.\nXFFLXB, 29/22a–23b, 29/36a–b, 30/1a–3a.\nXFFLXB, 30/8b–15b. 赴西安途中听说此战，额勒登保停下行程，与杨遇春、丰绅相见，并协助审讯俘虏。XFFLXB, 30/15b–17b, 31/5a–6a.\nXFFLXB, 30/3a–6b, 30/24a–26a, 31/11b–15a.\n因苟文润之死，嘉庆发还了德楞泰、赛冲阿与田朝贵被褫夺的职衔顶戴，包括德楞泰的参赞大臣之职与爵位。XFFLXB, 31/19b–21a, 31/25b–28a.\nXFFLXB, 31/19b–25b, 31/29b–33b, 32/8a–16a.\n除给将领与部队送去许多小礼物与数百面银牌银锭外，嘉庆只让吏部审议对德楞泰、赛冲阿、杨遇春、丰绅、马瑜、庆成、田朝贵、熙明、王兆梦与庆溥的奖赏，并把吴廷刚升为记名总兵。次日，嘉庆发还了方维甸的顶戴。XFFLXB, 32/16a–21b, 33/3b–4a; QSLJQ, 134/3b–6b.\nXFFLXB, 32/24a–25b.\nXFFLXB, 32/16a–20a. 此后，嘉庆定期重申这一指示。XFFLXB, 卷32–33。\n三省都奏报了劫掠。XFFLXB, 18/32b–33a, 18/38b–39b, 19/3b.\nXFFLXB, 卷17–23、30–32 各处。周世洪的供词详述了这种庇护。BLJZL, 5:160–62.\nXFFLXB, 33/5a–6a, 33/8b–10b.\nXFFLXB, 33/28a–31a, 33/35a–36b.\nXFFLXB, 33/35a–36b.\n关于陕西，见XFFLXB, 31/35a–38a, 33/24a–25b. 关于湖北，见XFFLXB, 33/33b, 34/11a.\nXFFLXB, 32/25b–26a.\nXFFLXB, 33/12a–17a.\nXFFLXB, 34/13b–14a, 34/33b–34a.\nXFFLXB, 35/20a–22b.\nXFFLXB, 36/13a–14a.\nXFFLXB, 36/23a–25b, 36/27a–28a.\n", "sections": [{"level": 2, "title": "拖延的战争，1801年", "id": "ch5-s0"}, {"level": 3, "title": "四川战场", "id": "ch5-s1"}, {"level": 3, "title": "湖北战场", "id": "ch5-s2"}, {"level": 3, "title": "陕西战场", "id": "ch5-s3"}, {"level": 2, "title": "1801年底", "id": "ch5-s4"}, {"level": 2, "title": "谈判胜利，1802年", "id": "ch5-s5"}, {"level": 3, "title": "与苟文明、樊人杰作战", "id": "ch5-s6"}, {"level": 3, "title": "乡勇问题", "id": "ch5-s7"}, {"level": 2, "title": "为奏凯收尾", "id": "ch5-s8"}, {"level": 2, "title": "宣布胜利，1803—1805年", "id": "ch5-s9"}, {"level": 3, "title": "第一次胜利", "id": "ch5-s10"}, {"level": 3, "title": "第二次胜利", "id": "ch5-s11"}, {"level": 3, "title": "第三次胜利", "id": "ch5-s12"}, {"level": 2, "title": "最后的叛军与乡勇", "id": "ch5-s13"}, {"level": 2, "title": "注释", "id": "ch5-s14"}]}, {"id": "c6", "title": "第6章 · 正规军与非正规军", "kicker": null, "part": "第二卷 · 专题", "html": "<blockquote>\n<p>官府招募平民充作战兵，还把他们外调他省数年，这算什么道理？朕闻所未闻……军队竟然不能保国安民，反要仰赖从未受过训练的平民上阵作战，那么养常备军还有什么意义？</p>\n<p>——嘉庆皇帝，1804年</p>\n<p>[译者按：原上谕自英文直译，文言原文待核。（出处见章末注释）]</p>\n</blockquote>\n<p>清朝对白莲教叛军的战役是一场灾难，堪称清史上到那时为止最不成功的一场战争。除了空前而不正当的漫长持续时间与巨额耗费外，清朝大规模雇用平民充当作战力量也是前所未有的。这些平民乡勇与正规军并肩作战，或代替正规军作战。起初作为弥补兵力不足的权宜之计，后来成了战役统帅、军官、后勤人员与地方官员侵吞军费的借口，反过来又推高了战争费用。乡勇遣散的一塌糊涂，是延误战役收束的关键因素。最重要的是——尽管既往研究有所忽视——战役中广泛使用平民，在清朝统治精英中引发了一场关于改革清朝军事制度的讨论：或扩大绿营规模，或提升其素质，使之能在任何地方应对叛乱或动荡，而无需调动满洲旗兵或雇用平民。然而，这一改革设想没有实现——嘉庆皇帝最终选择继续使用非常规兵员来了结叛军残部，并长期维持清朝军事制度的现状。嘉庆虽然最终谴责并停用了受雇乡勇，却错失了一次改造过时的清朝军事制度的机会。与乡勇困局及其影响相关的，还有战争中族群士兵的使用，以及\"坚壁清野\"之策——后者历来被认为是对白莲教叛军取得最后胜利的决定性措施。然而，把这一策略置于历史语境中考察，会得出截然不同的结论。</p>\n<h2>从权宜之计到自成体系，1796—1799年</h2>\n<p>白莲教战争研究的匮乏之外，对战争中受雇乡勇的研究也十分稀少。魏源在《圣武记》中描绘了几位杰出的乡勇，却没有勾勒使用乡勇这一做法的结构与机制，尽管他暗示乡勇可能是镇压教门叛军的关键。^1 魏源说，他所用史料中关于乡勇的信息是零碎的。他的描述不足，使人弄不清乡勇的规模有多大、与作为地方社群自卫力量的传统乡勇有何不同。后者由地方精英——如士人与商人——组织，靠私人资金维持。在关于太平天国时期精英主导地方活动的经典研究中，清史学者孔飞力把白莲教战争中的\"乡勇\"视为太平天国时期士绅主导乡勇的前身。孔飞力虽然指出白莲教战争中有事实上的雇佣兵——受雇乡勇——的存在，却给人留下的印象是：地方精英主导的乡勇在这场战役中比雇佣兵更重要。^2 结果，\"地方精英组织领导的乡勇对清朝战胜白莲教叛军起了关键作用\"这一简化结论，获得了接受与主导地位。</p>\n<p>事实上，与数十万受雇乡勇相比，地方精英主导的乡勇在白莲教战争中只起了边缘作用。18世纪80年代之前，清朝一直避免使用未经训练的平民充当作战力量。满洲统治者珍视尚武精神，一直警惕着：把作战交给平民，会使军事制度丧失职业性。使用平民参战的做法，直到18世纪最后二十年才出现。^3 18世纪晚期，乾隆就边疆战争与国内战争的区别提出了新学说：内部叛乱只要不威胁政权，就不应像边疆战争那样，从北京或满洲调动大批精锐旗兵。同时，朝廷也努力遏制不断攀升的军费——尤其是战时军费——其结晶就是《军需则例》的编纂。新法典使战时请款更难以使用旧借口，则例颁布之后，清军不得不寻找绕开中枢财政机构审计的途径。正是在这一背景下，乾隆朝后期几场叛乱中开创了使用受雇平民作战的做法。</p>\n<p>首先，1784年镇压甘肃石峰堡新教回民起义的战役中，平民被雇用加入军队。主要统帅之一的福康安在二十多个县招募了大量平民协助军事行动。这些被雇平民被标为\"民夫\"（minfu），只承担守城、守要地等军事任务。为支付这些受雇平民，福康安每月花费可能超过十万两——这构成了这场战役开支的大头，且与刚颁布的《军需则例》背道而驰。福康安本人就是编纂《军需则例》委员会的成员，他曾保证要减少乡勇的使用。^4 这场常被忽视的石峰堡战役，其实是平民被大规模征募执行军事任务的第一个先例，它表明：只要将领们敢于试探国家容忍的底线，战争中就存在《军需则例》未载的新先例的空间。</p>\n<p>第一次尝试之后，同一个福康安在他指挥的另外两场战役中再次运用了这一方案。1787—1788年，他在当地雇平民协助镇压台湾林爽文起义。^5 这些人被称为\"义勇\"（yiyong），据称是出于公益之心自愿参战的。中枢政府没有对这一做法皱眉，认为它比从大陆调更多兵到岛上划算。嘉庆皇帝后来把台湾战役视为平民受雇参战的第一例。^6 1795—1796年，福康安主持镇压苗民起义的战役时，他轻而易举地再次运用这一方案，规模却大得多。这一次被称为\"乡勇\"的受雇平民，为将领们向国家索取巨额经费提供了借口之一。^7 他们究竟招募了多少乡勇不完全清楚，但从仅贵州一省申报的乡勇伤亡就超过一万二千这一事实，可以窥见其规模之巨。^8 三案的核心人物都是福康安，这并非巧合——他以追逐财富毫无顾忌、挥霍国家经费臭名昭著，后来被嘉庆严厉而反复地斥为军制腐败丛生的罪魁。^9 尽管战时腐败更是一个结构性问题，福康安确实开创并发展了这一新做法。</p>\n<p>在白莲教战争中，雇用平民补充正规军的方案得到了广泛推行。湖北起事爆发时，湖北绿营的大部分兵力已开赴苗疆战役；捉襟见肘的湖北当局为弥补劣势临机设法。枝江首起事几乎刚爆发，毕沅就号召受波及各县组织乡勇。惠龄赶赴枝江时，既带正规军，也带乡勇。^10 数日后，惠龄奏报：\"现已派兵分往通贼各路远近村镇，雇募乡民，发给器械，设卡盘查。\"（原文待核，见注释11）^11 在许多地方，地方精英——包括文武生员与商人——热情响应号召，建立了地方乡勇。^12 然而，在大多数情形下，主持其事的是府县官员。^13 数月之内，湖北各类乡勇如雨后春笋；所有县份——包括远离起事地点的——都招募了数百到数千名乡勇。此后数月战事起伏，一些县继续招募更多乡勇。^14</p>\n<p>效法湖北，河南与陕西都组织了乡勇。在河南，景安招募乡勇以缓解兵力不足。南阳知府完颜岱鼓励与湖北接壤的邓州、新野、唐县等县雇乡勇，防止湖北叛军渗入。^15 在陕西，秦承恩组织乡勇守卫兴安府境内与湖北郧阳府犬牙交错的关卡。秦承恩派官员从各县挑选一千至两千名乡勇，责令他们随当地军队巡逻、缉捕零散起事者。^16 这些地方举措立即赢得了皇家的认可。三月初，毕沅请求从北京调三千名援军时，乾隆拒绝了请求，但指示毕沅利用地方积极性与资源自卫。他承诺日后奖赏表现突出的地方领导人。^17</p>\n<p>在四川，组织乡勇甚至在起事爆发之前就开始了。湖北起事把难民送到了四川东部边境，而许多地方军队仍在苗疆战役中，四川当局便依靠乡勇维持秩序。^18 达州、通江与巴州起事爆发后，英善加快了这项工作，号召组织自卫乡勇——因为除从苗疆战役遣回五百名四川兵外，北京没有向四川派任何援军。很快，战事波及地区的一个县就招募了数千名乡勇。^19 与湖北一样，地方精英积极参与。^20 然而，当局的介入很快把许多起初由当地
