热点，他却不肯放过任何挑剔明亮的机会。金峨寺一战的奏报中，明亮把自己的名字置于宜绵之前，乾隆斥责他抢夺宜绵之功，因而赏赐了除明亮之外的所有将领。对明亮更为不利的是，乾隆命他前往湖北\"协助\"惠龄，且不得带兵。对明亮有利的是，宜绵是他的多年老友。二人幼时一同读书，后来都参加了第二次金川之役，此后又在新疆共事。正如宜绵所说：\"我等极为亲近，凡事皆推心置腹。\"（原文待核，见注释187）宜绵恳请乾隆把明亮留在四川，因为明亮的军事才能与经验远胜于自己，而四川的叛军又远比陕西的凶悍。然而，宜绵热切的恳请还没送达朝廷，乾隆已经改了主意。他让明亮留了下来——或许他意识到，没有明亮，四川的战役不知何年何月才能了结。^187</p>\n<p>四月初三日，明亮对金峨寺与清溪场发动总攻。他们摧毁了清溪场据点，俘获了叛军首领之一的王学礼。在金峨寺，王三槐率数千精壮叛军于黄昏时分向清军冲锋，徐天德则率家属从山后悬崖缒下，向重石子据点转移。次日，清军攻占金峨寺，王三槐却脱了身。此后，两万多名叛军主要聚集在东乡的重石子与香炉坪。^188 在巴州，清军于四月中旬荡平了王家寨据点，并击退了罗其清派来的援军。不过，冉文俦率领的幸存起事者转移到了罗其清方山坪的据点，尽管两支队伍并没有合并。^189</p>\n<p>俘虏王学礼的人相信他是达州叛军的智囊，便让他写信召唤同伙投降。起事者佯装被王学礼的说辞打动，派了几个人（他们声称其中一人是王三槐）到清营谈判。双方达成协议：所有叛军首领于四月十八日前往双庙场（意为\"双庙集市\"）投降。到了约定的日子，数千名清军在会面地点附近布下阵势，企图趁叛军首领外出时偷袭叛军总部。与此同时，起事者也在附近的山谷里藏了数千人马，希望找到机会救出王学礼。然而，双方很快都识破了对方的计谋；一场假停战变成了一场战斗。前往会面地点的队伍中的王三槐逃走了，王学礼则事后被处死。^190 王学礼之死令叛军痛心疾首，此后数日，他们发动了猛烈的攻势，一度甚至企图夺取达州城，但这些进攻都被逐一拔除他们哨卡的清军挫败。^191 进入五月，两处据点的给养行将耗尽，起事者试图突围。在一次突围中，王三槐负伤，多亏另一名叛军首领把自己的坐骑让给他，他才侥幸脱身。^192</p>\n<p>苗疆战役结束时，四千名广东、广西士兵按明亮与德楞泰的请求调往四川。^193 五月二十六日，得到增援的清军在东乡发起决战。他们先用火器点燃了重石子的壁垒，数千名叛军及其家属被烧死。在香炉坪，叛军撑了半日，并数次向敌军冲锋，直到明亮率众强行攻上山顶，把燃着火的箭头射入堡寨。大火吞没了整个据点，数千人被烧死。次日，清军又追击溃散的起事者。在这场堪称四川最惨烈的战斗中，据说有一万人被杀——清军还割下了两千多颗首级。^194</p>\n<p>这场惨败之后，幸存的叛军分作两股，在靖忠寺（意为\"忠烈祠\"）附近扎营。六月初，明亮等人击溃了徐天德与王三槐所率的一股，但清方也损失了数名军官，其中包括战功卓著的满洲旗人锡金泰。^195 尽管叛军勇猛——迎着清军炮火枪弹，疯狂地向清军冲锋——他们已陷入混乱，丢弃了装备与家眷；徐天德与王三槐的母亲都在被俘之列。不久，王三槐的妻子与女儿也被俘；徐、王一股只剩下两千人或更少。与此同时，德楞泰歼灭了另一股约一千人，杀死了其首领孙老五。^196 在巴州方山坪，蓝号与白号面临给养短缺。他们试图突围，还多次派人到附近田里收割麦豆，都没有成功。^197 然而，百祥率领的围困方山坪的清军没有给叛军施加足够的压力，叛军得以在山顶耕种——正如其名所示（方山坪意为\"方形的山顶平地\"），山顶平坦而开阔。^198 到1797年夏天，达州、新宁、太平三地为避乱离家的居民纷纷返乡，凭借官府提供的补贴恢复了农作。连东乡、巴州一些地方的人也回了家，因为战事已被限制在山中。^199</p>\n<h2>叛军与镇压者</h2>\n<p>到1797年夏天，叛乱正在退潮。除了正长途跋涉入川的襄阳队伍和游荡于湖北西南角的林之华、覃加耀一股（见下章），湖北的其他起事都已被镇压。在四川，达州叛乱丧失了大多数最初的追随者，已基本被摧毁。蓝号与白号被围于巴州，无力发动任何攻势。在陕西南部，五场起事都在一两个月内被粉碎，堪称清朝镇压战役中最成功的篇章之一。尽管教门首领们利用清朝镇压黔湘苗民之机，颇为巧妙地择时叛乱，并成功地在湖北各地同步举事，领导力的缺失从一开始就注定了他们事业的失败。</p>\n<p>首先也最重要的是，刘之协在叛乱前夕的弃离影响深远。没有别的教门首领拥有堪与刘之协相比的声望，起事者中始终没有产生一个能够号令所有队伍的领袖。与此同时，三省各场起事的首领都未能利用信徒们对武装号召的热情响应，也未能以任何形式阐明并颁布他们的纲领。几乎所有的起事都抛弃了建立新政权的政治抱负——而这正是混元教与收元教预言的核心——只有襄阳与长阳的叛军各自采用了自己的年号，但哪一个也没有真正使用过。^200 同样，他们对异族的满洲统治者缺乏义愤，更不用说用以吸引参与者的民族主义讯息了。正如嘉庆皇帝1800年所评论的：\"所有贼首如姚之富、齐王氏、王三槐、冉天元、高均德、张汉潮等，不过横行劫掠，苟延性命。彼等并不敢僭立年号、占据城池，以图大逆。\"（原文待核，见注释201）^201</p>\n<p>四川的叛军既纲领模糊，战略上又固守本土。尽管他们自认属于以襄阳为中心的教门运动，在早期的一些时刻也渴望与湖北的同党会合，他们却不愿离开家乡地区。湖北的一些同党也表现出这种倾向。^202</p>\n<p>与半个世纪后的太平军不同，白莲教叛军并没有建立一支名副其实的军队。与此前的教门叛乱一样，许多队伍给头目们封授了\"元帅\"（yuanshuai）、\"总兵\"（zongbing）、\"先锋\"（xianfeng）、\"旗手\"（qishou）、\"探马头\"（tanmatou）之类的名号，却没有形成一个与这些职位相配的等级结构。^203 叛军不是把作战部队与家属分开，而只是松散地把精壮男子指定为\"战手\"（zhanshou）或\"矛手\"（maoshou），却不把他们编成任何建制。他们中间总有大量妇女。尽管许多妇女参与作战与领导——如襄阳的王聪儿、陕南的王刘氏——大多数女性起事者都随家属行动；被俘的妇女常常被首领们纳为妻妾。战斗中，家属的伤亡总是远比士兵惨重，在危急关头还容易被抛弃。清军常常先俘获叛军首领的家属，再俘获首领本人。战争后期，男叛军甚至为了加快行军而杀死自己的妻儿。</p>\n<p>除缺乏强有力的领导之外，起事者在与镇压者作战时也没有展现出有远见且可行的战略。他们组织涣散、装备简陋，无力夺取地盘、攻占城镇。房县之围便是一例——守军只有一百人，他们却攻不下来。即便襄阳起事爆发后势头正盛，叛军也未能拿下樊城与襄阳双子城。当阳的叛军虽然据城五个月，围城的旷日持久却更多要归因于清军的无能，而非叛军的力量。^204 其他落入起事者之手的城市（常常是因为城市没有城墙），如武当山区的保康、竹山与四川的东乡，也都只据守了很短时间就被清军收复。事实上，几乎所有的起事从一开始就遭到清军围困。结果，叛军各股不得不为生存而挣扎，而不是采取协调一致的行动去扩大叛乱。^205 除襄阳叛军外，各股叛军通行的生存之道是就近撤上山头，据险自守。讽刺的是，在冲突的第一阶段，\"坚壁\"竟是起事者的主要战术。凭借地理屏障以及他们修筑的精巧而原始的防御工事——通常筑起数层木栅，储放滚木礌石以资投掷，有时在堡寨四周挖掘壕沟，还掘断一切道路或布设地雷——叛军及其家属得以坚守一段时间。清军的拖延有时也延长了他们的存活。但给养短缺——有些地方还有水源短缺——最终会折损山顶战术的优势。此外，他们的堡寨大多由易燃材料建成，易受敌方火攻之害。</p>\n<p>回顾起来，襄阳叛军未能攻克襄阳城，对他们来说并不全然是坏事，因为他们得以避免别处同侪的命运：被围、被困、被征服。无山可守、无城可据，襄阳起事者诉诸机动作战。从1796年夏天起，他们便熟练地运用这一战术。他们不仅不断快速运动，还常常分兵数股，以分散镇压者的注意力。1797年上半年，他们的运动战使他们取得了对追击清军的优势，常常令镇压者晕头转向。此外，正如清朝官员所指出的，他们的运动还帮助他们招兵买马：当他们经过湖北西部、河南南部与陕西南部的教门据点时，得以补充新血，充实不断萎缩的队伍。^206 有些教门中人如果只是听说别处起事，未必会心动行动；但当叛军来到自家门口时，他们更可能被说动。</p>\n<p>除招募教门中人与其他愿意加入者之外，叛军无不诉诸胁迫来扩充队伍。他们有时实行焦土政策，或杀死拒绝入伙的人。^207 来凤起事中，队伍达数万人之众，其中大多数是被裹挟的当地居民。直到1801年，这种裹挟平民的办法一直是叛军人数大幅波动的首要原因。为防止被裹挟的平民逃跑，叛军有时在他们的脸上烙上\"白莲\"（Bailian）或\"白莲教\"（Balianjiao）字样——这是历代叛乱者惯用的老办法。^208 战斗中，这些被裹挟者或被用作先锋，先与清军接战，或充当叛军撤退时的人肉盾牌——这也是前人用过的战术。^209 尽管在战场上受到严密的监视与管束，被裹挟的平民仍更倾向于逃亡或投降，很少转化为死心塌地的叛军——尽管他们在被杀的\"叛军\"中占大多数，而朝廷从战役之初就对此心知肚明。^210</p>\n<p>清朝国家——从皇帝到前线官员——起初都没有把三省的起事当作严重事件。惠龄把宜都—枝江起事的叛军称为\"乌合之众\"（wuhezhizhong）——包括乾隆皇帝在内的许多人都附和这个说法，这也凸显出国家不愿向前线增派旗兵。^211 因此，湖北的大多数起事都是由地方军队在陕西及其他数省有限的增援下平定的。直到1796年底，来自北方与京城的第一批大规模援军——包括两千名精锐旗兵——才被派出。凭借火器——大炮、抬枪、鸟枪、地雷、手雷、喷火器、火箭——远胜于叛军自制的武器，清军地方部队能够轻而易举地摧毁叛军堡寨，尽管他们有时会等叛军疲惫之后才发动决战。明亮在湖北与四川都证明，他依然像清朝开疆拓土的鼎盛时期一样勇猛干练。与此同时，恒瑞率领的派往湖北的陕西军团——包括一千名西安驻防旗兵——也在迅速镇压武当山南麓诸起事的战斗中显示出他们的价值。</p>\n<p>武当山脉。明亮与恒瑞都没有使用湖北的受雇乡勇，恶劣的气候与险阻的地形也都没有使他们却步。</p>\n<p>在陕西南部，清朝军队自开国之初便在这里经年清剿匪徒，陡峭的群山与多雪的季节并未妨碍第二次金川之役的老将宜绵主持的战役——五场起事尽数被粉碎。同样是宜绵主持的太平之战，扫平高崖上叛军堡垒的行动也卓有成效。由于宜绵与明亮的合作，1797年上半年的四川战役对清朝而言进展顺利，把达州叛乱推到了覆灭的边缘。第一阶段镇压战役的结果表明，清军并非软弱无力。在正确的领导下，他们依然能像清初与盛世时期一样强悍，即使地理与气候不利，也能迅速镇压起事。陕西来的清军团一般明显强于其他各省的军队，只有贵州例外。</p>\n<p>清军的战役总体冷酷，有时令人发指。战斗中，清军不分青红皂白地杀死叛军与被裹挟的平民。战后，屠杀俘虏——包括妇女、老人与儿童——更是家常便饭。对被俘的叛军首领，除押送北京进一步审讯者外，各地的清军都不吝使用\"千刀万剐\"乃至更残酷的刑罚来处决。^212 将领们奏报处决俘虏的人数时——往往数以百计——通常以一种例行公事、漫不经心的口吻为自己辩解，声称被屠戮者是顽固不化的起事者。除了福宁在来凤旗鼓寨之战后屠杀近两千名投降叛军一事在嘉庆亲政后遭到调查之外，其他暴行从未受到过审查。^213 事实上，如前所述，宜绵及其陕西同僚在攻取五处叛军据点后屠戮俘虏的行径，比湖北的同侪有过之而无不及。宜绵与英善从叛军手中收复东乡县城后，处决了四百多名被俘叛军，乾隆在奏折上批了一个\"好\"字。^214</p>\n<p>乾隆虽然从不反对屠杀俘虏，但战役之初，他确实曾试图要求将领们区分教门叛军与被裹挟者。他明确表示只有前者才该处死，但对后者的处置却并不始终如一。有时，他提到可以把他们罚作旗人之奴；另一些时候，他又认为只要他们投降并表现出悔意，就不应受罚。^215 然而，乾隆的说教在前线几乎不起作用。他反复呼吁要审慎行事、区分真叛军与受蛊惑、被裹挟者，却几乎无人理会；冷酷屠杀俘虏的行径在此后数年依然继续。结果，许多叛军明知投降也是一死，便选择了不投降。与此同时，皇帝的另一项指示也没有被认真执行。叛乱爆发后不久，乾隆采纳了孙士毅的建议，下令部队放松对湖北、河南、四川教众的搜捕，以争取民众对清方战役的支持。^216 然而，没有参加叛乱的教门成员仍遭地方官府迫害，这反而把其中一些人推向了叛军阵营。^217</p>\n<p>到1797年夏天，清军已经在除追击襄阳队伍（从湖北一路追到陕南，下章将述）以外的所有战场取得了明显的上风。因此，清朝国家相信叛乱可在数月内完全平定，并非不切实际。然而，问题不在于清军是否有能力迅速消灭起事者，而在于他们是否有这样做的动机。正如永保一案所示，将领们宁可不一次全歼叛军，而是把叛军当作钓取更多军费、赏赐与升迁的诱饵。尽管军人——无论军官还是士兵——一经派赴战场，本就有权获得更高的待遇与更多的赏赐，乾隆在白莲教战争的第一阶段还是倾向于额外发放金钱激励，以鼓舞士气，正如他在漫长统治中的其他战争里所做的那样。例如，每逢奏报胜利，他就大方地赏全军一个月的饷银，有时甚至不是大胜，甚至不是真正的胜利。有时，他甚至给战斗中部分乃至全部参与者赏两个月的饷银。或者，在开战之前就把一个月饷银赏了出去。^218 对将领们来说，捞取不正当好处的机会也俯拾皆是：后勤人员与地方官员的贿赂、军费的侵吞，不一而足。</p>\n<p>结果，一些将领没有动力迅速、一次性消灭全部起事者，因为对同一股叛军的持久战役会带来许多邀功请赏的机会。这种心态也助长了虚报战果与滥杀无辜，因为被杀叛军的数目往往是最重要的受赏标准。连乾隆也意识到，不能尽信奏报的数字。^219 在湖北，尤其是在镇压宜都—枝江起事与长阳起事时，清军将领未能迅速攻破叛军的山顶据点，而是把围困拖了数月之久——尽管那里的地形艰险程度远不及陕南。虽然将领们玩忽职守会受到处分——永保的垮台就是明证——但即使在永保被革职之后，将领们仍在继续拖延，试探体制的底线。从1796年底起，中枢政府为湖北战场批准了大笔军费，这进一步刺激了将领们对战时收入——合法与非法的——的胃口。然而，与湖北不同，陕西与四川在第一年没有得到来自北京的任何额外经费。由于镇压叛乱拖延不决的财政代价落到了省级当局的肩上，陕西与四川的清军将领——他们同时是省级督抚，如宜绵与英善——或许更有动力把战役进行到底。然而，情况很快就要改变。1797年春，随着更多军队部署到四川，四川的战争管理当局请求并随后获得了中枢政府的大笔军费；四川很快将在开支上超过湖北，在挪用军费上也将如此。与此同时，效能将被拖延所取代。</p>\n<h2>注释</h2>\n<p>[译者按：文献简称对照——QSLQL《清高宗实录》；QSLJQ《清仁宗实录》；QLSYD《乾隆朝上谕档》；JQSYD《嘉庆朝上谕档》；XFFL《钦定剿平三省邪匪方略》；BLJZL《清代中期五省白莲教起义资料》；GZDJQ《宫中档嘉庆朝奏折》；KJJFSB《军机处剿捕档》；Jiaobudang《剿捕档》；QSG《清史稿》。书名、文章名保留原文（有中译本者附中译名），出版信息与页码按原格式保留。]</p>\n<p>题辞：刘之协供词，《剿捕档》，嘉庆五年八月初七日，第137页。</p>\n<ol>\n<li>樊明德向官府称其教成员不足四十人。QSLQL, 980/10a–12b, 983/26a–27a; Zhuang, Zhenkongjiaxiang, 164. 关于混元教起源的不同看法，见马西沙、韩秉方《中国民间宗教史》（Ma and Han, Zhongguo minjian zongjiao shi），1258–93；Zhuang, Zhenkongjiaxiang, 91–92；郭士达（Gaustad）\"Religious Sectarianism,\" 140–54，及\"Prophets and Pretenders\"。</li>\n<li>凌迟（千刀万剐）是一种极端酷刑，将受刑者身上的肉一片片割尽。明清两代，谋反者适用此刑。卜正民、布尔贡、布鲁《杀千刀》（Brook, Bourgon, and Blue, Death by a Thousand Cuts），55, 68–87。</li>\n<li>QSLQL, 983/26a–27a; QLSYD, 18:272.</li>\n<li>QLSYD, 18:272; Zhuang, Zhenkongjiaxiang, 164–65; Suzuki, Sennen ōkkuteki, 296–99.</li>\n<li>Zhuang, Zhenkongjiaxiang, 165; Gaustad, \"Religious Sectarianism,\" 158–64.</li>\n<li>南阳的夹河洲就是这类据点之一。XFFL, 9/7a.</li>\n<li>QLSYD, 18:252.</li>\n<li>他们把混元教经卷《混元点化经》改题为《三阳了道经》，即\"参透三阳之道之经\"（QLSYD, 18:272）。</li>\n<li>刘之协供词，《剿捕档》，嘉庆五年八月初七日，第137页。</li>\n<li>许曾重、林易在\"刘之协\"一文中提及刘之协的生意动机，195–98。</li>\n<li>QLSYD, 18:272, 274. 关于王怀玉的崇高地位，见Gaustad, \"Religious Sectarianism,\" 154–57。</li>\n<li>郭士达也认为王怀玉在新教门中没有发挥作用。\"Religious Sectarianism,\" 203.</li>\n<li>BLJZL, 1:28; QLSYD, 18:255–56, 271–73.</li>\n<li>张小元供词，BLJZL, 5:113; Zhuang, Zhenkongjiaxiang, 474.</li>\n<li>铃木中正指出，钱财是刘、宋分裂的关键。Sennen ōkkuteki, 302–3.</li>\n<li>收元教由徐国泰、徐佩于1763年创立于山西，承袭了其前身荣华会（Flourishing Flower Assembly）的某些千禧年成分——荣华会于1757年遭到官府查禁。数年后，收元教传入河南与湖北。关于收元教的创立，见Gaustad, \"Religious Sectarianism,\" 122–36; Zhuang, Zhenkongjiaxiang, 147–53.</li>\n<li>关于宋之清与收元教的关系，见Xu and Lin, \"Liu Zhixie,\" 184–87; Gaustad, \"Religious Sectarianism,\" 184–94.</li>\n<li>经樊学鸣的姐夫、教门中人萧贵——他从襄阳迁居陕南——宋之清的教门扩展到陕西南部。QLSYD, 18:151, 273.</li>\n<li>\"王双喜\"本名刘成儿。刘之协供词，BLJZL, 5:103.</li>\n<li>一些教门中人相信\"无影山\"在河南登封。QLSYD, 18:145–47. \"朱红桃\"之名系早期三合会成员为号召反清而造。宋之清是否从三合会借用此名，不得而知。郭士达认为\"朱红桃\"系湖北房县收元教头目王应瑚所造。\"Religious Sectarianism,\" 231.</li>\n<li>1794年底，一名教门中人前往隆德向刘松报知查禁之事时，对刘松说了这番话。QLSYD, 18:273.</li>\n<li>QLSYD, 18:145–47. 在陕西，秦承恩已察觉教门活动，并在乾隆下令查禁之时逮捕了萧贵。QLSYD 18:150–52.</li>\n<li>乾隆五十九年九月初九日，乾隆表示他不相信教门活动仅限于大宁，责成四川官员扩大搜捕。QLSYD, 18:197. 1794年底关于查禁的上谕为数众多，见QLSYD 18:150–282 各处。</li>\n<li>QLSYD, 18:252, 255. 仅四川大宁、太平两县就逮捕了一百二十余人（第268页）。不过，有些被捕者可能并未参与教门活动（第200、210、218–19页）。</li>\n<li>QLSYD, 18:170, 255, 294.</li>\n<li>QLSYD, 18:251, 276. 乾隆批评勒保未能察觉刘松在流放期间的教门活动。QLSYD, 18:308–9. 勒保把王法僧与隆德的另外六名教众解往新疆，给穆斯林头目为奴。《清代农民战争》5:46–48。</li>\n<li>QLSYD, 18:236, 281–82. 关于这场中原查禁的详细记述，见Gaustad, \"Religious Sectarianism,\" 207–316.</li>\n<li>QLSYD, 18:255–56.</li>\n<li>QLSYD, 18:334–35, 563.</li>\n<li>乾隆五十九年十月二十六日，乾隆命将刘之协从扶沟押解襄阳审讯。QLSYD, 18:304–5. 关于刘之协在扶沟脱逃，见第309–11、334、427–32、479–80、493–4页。</li>\n<li>清朝情报显示他去了樊城。QLSYD, 18:444–47.</li>\n<li>与此同时，对刘之协扶沟脱逃一案展开了彻底调查，多名官员受到惩处。QLSYD, 18:311–614 各处。</li>\n<li>XFFL, 8/23a–24a, 11/29–31a; 刘之协供词，BLJZL, 5:104–5.</li>\n<li>刘之协供词，BLJZL, 5:104.</li>\n<li>这场叛乱直到1797年才被平定。萨顿（Sutton）\"Ethnic Revolt\"；马世嘉（McMahon）Rethinking the Decline, 61–85。</li>\n<li>刘之协供词，BLJZL, 5:104–5.</li>\n<li>例如，一名在山东被捕者受审时承认自己就是刘之协——极可能是屈打成招。QLSYD, 18:477–78.</li>\n<li>据刘之协供述，王聪儿曾参加他与姚之富策划叛乱的讨论。刘之协供词，BLJZL, 5:104–5. 叛乱之后，文人撰有数种关于王聪儿的记述，但都在她的故事中掺入了谣传与香艳细节。</li>\n<li>襄阳宜城的教门中人曾氏被处决后，其子曾宪章随王聪儿参加了起事。曾宪章后来成为首领，1802年初在陕西被杀。XFFL, 293/12b–16a.</li>\n<li>1796年初，后来成为襄阳起事关键首领之一的高均德被捕受刑，但他坚称自己是无辜良民，因而获释。XFFL, 137/4a–b.</li>\n<li>关于湖北西南部最初几场起事的详细记述，见麦卡弗里（McCaffrey）\"Living through Rebellion,\" 136–58。</li>\n<li>李犬儿的故事只在宜都—枝江一带流传。长阳起事首领林之华与张正谟同师事白培相，似乎并不知道这个故事。BLJZL, 5:35–41.</li>\n<li>聂杰人、向瑶明、张正谟供词，BLJZL, 5:1–9, 35–41.</li>\n<li>向瑶明供词，BLJZL, 5:4, 6–9; 张正谟供词，BLJZL, 5:35, 37.</li>\n<li>聂杰人供词，BLJZL, 5:1–3, 5–9.</li>\n<li>GZDJQ, 0042; 张正谟供词，BLJZL, 5:35; XFFL, 2/19a–20b.</li>\n<li>GZDJQ, 0042; 聂杰人、向瑶明供词，BLJZL, 5:1–6; 张正谟、刘宏铎供词，BLJZL, 5:35–37.</li>\n<li>XFFL, 2/19a–20b.</li>\n<li>XFFL, 1/1a–10a; QSLJQ, 2/2a–b.</li>\n<li>聂杰人被押送北京，是第一个被解京的叛军首领。聂杰人供词，BLJZL, 5:1–3, 5–9; XFFL, 2/18a–21b; QSLJQ, 2/20a; JQSYD, 1:74.</li>\n<li>张正谟供词，BLJZL, 5:36.</li>\n<li>QSG, 11166–68.</li>\n<li>XFFL, 1/23a–b.</li>\n<li>聂杰人、向瑶明供词，BLJZL, 5:1–9.</li>\n<li>XFFL, 13/33a–35b.</li>\n<li>XFFL, 15/11b–14b.</li>\n<li>GZDJQ, 1399; XFFL, 16/18a–22a.</li>\n<li>GZDJQ, 1246; QSLJQ, 38/23b; XFFL, 88/17a.</li>\n<li>嘉庆元年二月十六日，河南南阳镇的两千名士兵奉调湖北。北京还让湖北留用了二十余名赴苗疆战役途中、带巴图鲁名号的军官。数日后，陕西兴汉镇的两千名士兵也被派往湖北。QSLJQ, 2/8a–b, 2/12a; XFFL, 1/22b–23a.</li>\n<li>陈德本等人供词，BLJZL, 5:28–31; QSLJQ, 2/14b–15a, 2/18b–19a; XFFL, 1/19b–20b, 2/4b, 2/15b, 4/8b–9a.</li>\n<li>XFFL, 2/6b–7b; QSLJQ, 2/15a.</li>\n<li>恒瑞率领西安驻防旗兵一千名及其本标绿营兵一千名。XFFL, 3/10a–11a; QSLJQ, 2/15a.</li>\n<li>QSLJQ, 3/3a–4b; XFFL, 6/25b–26a.</li>\n<li>派往当阳的其他清军主将还有成德、阿克东阿与舒亮，但成德很快被调往来凤战场。</li>\n<li>QSG, 10976–78. 关于甘肃冒赈案，见阿克切廷（Akcetin）\"Corruption at the Frontier\"。关于毕沅与和珅的关系，见琼斯（Jones）\"Hung Liang-Chi,\" 77。琼斯指出，毕沅\"从未被描绘成贪腐之徒，而是被描绘成一个轻信之人\"。</li>\n<li>昭梿《啸亭杂录》（Zhaolian, Xiaoting zalu），342。毕沅因1794年查禁不力被降为山东巡抚，但留任原职直至继任者福宁到任。不过，乾隆对毕沅的总体印象是\"向来尚属能事\"。QLSYD, 18:178–79.</li>\n<li>XFFL, 5/22b–25b, 6/2a–3b, 6/9b–10a, 7/33b–34a, 9/38a–39b, 10/30a–33a, 11/21a.</li>\n<li>彭氏《当阳避难记》（Peng, Dangyang bi'nanji）。</li>\n<li>XFFL, 3/3b–4a, 3/14a–15b, 5/22b–25b, 6/3b, 7/32a–33a, 11/16b–19a, 12/11a–12b.</li>\n<li>XFFL, 12/30a–32b.</li>\n<li>XFFL, 14/1a–4a, 13/20b–25b.</li>\n<li>正如福宁后来所声称的：\"来凤一带，素为邪匪渊薮。\"XFFL, 15/38a.</li>\n<li>据说陈启明有数百佃户，拥有一座以上巨大的楼房与数处茅草房。XFFL, 7/35a.</li>\n<li>QLSYD, 18:246–47.</li>\n<li>QSLJQ, 3/6a; 胡正中供词，BLJZL, 5:32–33; XFFL, 4/17b–18, 5/27a–28b, 6/14a, 9/25b, 15/7b–8a.</li>\n<li>孙士毅先派平浍营二百名士兵前往苗峒，随后亲率五百名士兵赶到。他还从金川屯区调了六百名绿营兵。XFFL, 4/1a–2b.</li>\n<li>BLJZL, 1:83–86. 张永科等人供词，BLJZL, 5:13–17.</li>\n<li>BLJZL, 1:128–29. 五月，孙士毅与福宁开始攻打旗鼓寨。清军俘获了曾领兵作战的女巫周滕氏，将她凌迟处死。XFFL, 12/8b–10b.</li>\n<li>QSLJQ, 6/16b–17b, 7/6b; XFFL, 12/44a–46b.</li>\n<li>XFFL, 12/46a–b.</li>\n<li>BLJZL, 1:154–56. 胡正中供词，BLJZL, 5:32–33.</li>\n<li>邓正基等人供词，BLJZL, 5:18–21; 黄长清等人供词，第22–23页; 胡正中供词，第32–33页; 杨正觉等人供词，第33–35页; 杨自敖供词，第41–42页; XFFL, 5/27a–28b, 9/1b–2a, 9/15a–17a, 13/5a–8b, 13/10b, 15/5a–8a.</li>\n<li>李登鳌供词，BLJZL, 5:43–44; 宋锡文等人供词，第44–47页; XFFL, 17/32a–36b.</li>\n<li>XFFL, 15/35b–36a, 137/5b–8b, 141/14b–16a.</li>\n<li>覃敬忠、覃祖兰供词，BLJZL 5:47–48; 覃加耀、张正朝供词，第59–64页; GZDJQ, 1070; BLJZL, 1:152–54; XFFL, 19/8a–b, 62/2a–3a.</li>\n<li>GZDJQ, 1070, 1105, 1159, 1230, 1280, 1320, 1367, 1404.</li>\n<li>覃加耀、张正朝供词，BLJZL, 5:59–64; GZDJQ, 1320.</li>\n<li>XFFL, 20/40a–41a, 20/43a–50a, 27/18a–19b; QSLJQ, 10/19b–21a.</li>\n<li>QSLJQ, 12/7b–8a.</li>\n<li>XFFL, 21/8a–12b, 24/32b–39b; GZDJQ, 1454.</li>\n<li>XFFL, 27/26b.</li>\n<li>XFFL, 30/36a–37b.</li>\n<li>XFFL, 27/27b.</li>\n<li>QSLJQ, 13/5a; 恒慕义（Hummel）Eminent Chinese, 222–24; 清国史馆传稿（Zhuan'gao），6752 (1–3)。</li>\n<li>XFFL, 32/23a–28a.</li>\n<li>XFFL, 33/10a–13b.</li>\n<li>XFFL, 34/16a–20b.</li>\n<li>XFFL, 34/21a–22a.</li>\n<li>XFFL, 37/3a–7a, 40/4b–6b, 40/23a–27a.</li>\n<li>XFFL, 41/20a–23b, 41/26b–27b, 42/7a–10a.</li>\n<li>曾世兴、齐仲耀供词，BLJZL, 5:23–28; BLJZL, 1:75–77; XFFL, 4/5b–6a, 4/19a–20a, 9/13a–15a; QSLJQ, 3/8b.</li>\n<li>攻城时，起事者匍匐于地，念诵咒语，想使守军的鸟枪火炮失灵。为破解咒语，守军收集妇女经血布，用黑狗血涂抹鸟枪火炮，再让红衣孕妇从枪炮上跨过。《房县志》（Fangxian zhi）6/21b–24b。</li>\n<li>BLJZL, 1:77–81, 86–88, 90–95, 101–2, 107–8; XFFL, 5/35a–36a, 6/3b–4b, 9/21a–22a.</li>\n<li>王全礼供词，BLJZL, 5:17–18; XFFL, 5/36a–37b, 8/15a–18b, 9/27a–28b.</li>\n<li>XFFL, 6/1a–2a.</li>\n<li>嘉庆元年二月十八日，朝廷命明亮赴湖南。QSLJQ, 2/7b–8a.</li>\n<li>GZDJQ, 446, 476; 王全礼供词，BLJZL, 5:17–18; XFFL, 8/16a–18b, 9/27a–28b; 《郧县志》（Yunxian zhi）7/16b–17b。</li>\n<li>QSG, 10928–33; Hummel, Eminent Chinese, 579–80; Zhuan'gao, 6752 (1–3).</li>\n<li>第二次金川之役中，明亮是统帅阿桂的副手，清军在阿桂麾下赢得了战争。</li>\n<li>沃利-科恩（Waley-Cohen）Exile in Mid-Qing, 90–91。</li>\n<li>上谕见宜绵奏折所引，嘉庆元年五月初三日，GZDJQ, 568.</li>\n<li>XFFL, 9/29b–32b.</li>\n<li>刘世珍供词，BLJZL, 5:31–32; XFFL, 10/22a–25a, 12/4a.</li>\n<li>XFFL, 10/33a–36b, 10/38b–39a.</li>\n<li>泥河口之战后，明亮先去了襄阳。GZDJQ, 496.</li>\n<li>明亮带了一千四百名士兵（固原九百、西安满洲兵一百、宁夏四百）。XFFL, 12/7a–b, 13/2a–3b.</li>\n<li>刘世珍供词，BLJZL, 5:31–32; XFFL, 13/25b–31a.</li>\n<li>昭梿《啸亭杂录》（Zhaolian, Xiaoting zalu），89–91。</li>\n<li>XFFL, 26/34b–35a, 28/23b–24a, 32/29b. 高成杰、李述、王廷诏从河南带来了五六千人参加起事。刘起荣供词，BLJZL, 5:54.</li>\n<li>XFFL, 28/21b–22a.</li>\n<li>这些\"元帅\"是王廷诏、李述、张汉潮、张世虎、张世龙、李潮、詹世爵与阮学鹏。XFFL, 54/28b–29a.</li>\n<li>关于王聪儿在叛乱初期并非领袖角色，见许曾重〈试论评价王聪儿〉（Xu Zengzhong, \"Shilun pingjia Wang Conger\"）。</li>\n<li>王廷诏供词，BLJZL, 5:120–27; XFFL, 242/31b–34a.</li>\n<li>据德楞泰1800年初所奏报。XFFL, 139/30b–31a.</li>\n<li>XFFL, 7/34a–b.</li>\n<li>嘉庆元年二月二十九日，襄阳的王一在河南均州与当地教众策划起事时被捕。XFFL, 4/14a–15a. 嘉庆元年三月二十三日，景安请求从自己麾下九百满洲兵中调四百名到南阳。他还请求从山东兖州调一千名士兵到河南。XFFL, 5/16a–17a.</li>\n<li>嘉庆元年三月二十二日，陕西一千名绿营兵到达襄阳。五百名留驻襄阳，另外五百名前往当阳。XFFL, 6/3a–b, 6/22a–b, 7/1a–3b, 7/10b–11a.</li>\n<li>XFFL, 6/1a–2a.</li>\n<li>XFFL, 6/18a–b.</li>\n<li>XFFL, 6/19b–20a; 8/8b–9a.</li>\n<li>XFFL, 6/20a–21b.</li>\n<li>XFFL, 8/9a–10b. 乾隆的建议被采纳了。1796年，一百七十至一百八十名蒙古盗马贼与盗牛贼参加了战争。到1802年，只剩下二十四人。1803年首捷前夕，他们获赦，被允许返回蒙古。XFFL, 344/23b–29a.</li>\n<li>后来披露，遇袭时温福及其许多部下已酩酊大醉。关于这场惨败，见QSG, 10880–82; QSLQL, 1005/21b–23b. 永保的传记见QSG, 11163–66. 清朝设公、侯、伯、子、男五等爵位，授予功勋卓著的官员。</li>\n<li>QSLJQ, 3/4a.</li>\n<li>XFFL, 154/4b–5a.</li>\n<li>BLJZL, 1:95–97, 100–101.</li>\n<li>13世纪，蒙古军队因中国军队的顽强防守，围攻樊城与襄阳达三年之久。1273年破城后，蒙古军迅速横扫长江流域。明末，李自成与张献忠都曾攻占襄阳。帕森斯（Parsons）Peasant Rebellions, 79–80, 106–13。</li>\n<li>嘉庆元年六月初二日，他们吃了一场败仗，随后向东南方向转移。两周后，他们在枣阳以东的张家垱又遭一场恶战，据说损失叛军三四千人，数千被裹挟的平民则获自由。此后数周，他们在随州附近又连吃败仗。XFFL, 9/40b–41a, 10/27a–29b, 10/39a–42a, 11/22a–24a, 12/14a–15b, 12/32b–36a.</li>\n<li>XFFL, 11/21b–22a, 12/46a–b.</li>\n<li>XFFL, 12/14a–15b, 13/53a–54b, 14/28a–31a.</li>\n<li>XFFL, 15/27a–28b, 15/29b–32a, 15/38b–42a, 16/3a–6a, 16/11a–12a.</li>\n<li>BLJZL, 1:199–201; XFFL, 17/1a–3a.</li>\n<li>嘉庆四年七月十五日，嘉庆称：\"永保当年在钟祥纵贼脱逃，贼遂窜往河南，又窜陕西，延至今日。\"XFFL, 109/33b–34a. 此后嘉庆又多次重申此点。XFFL, 122/9b–10a, 154/5a.</li>\n<li>XFFL, 17/13a–15b, 17/18a–20b, 18/1a–8a, 18/11a–13a.</li>\n<li>XFFL, 17/21b–22a.</li>\n<li>吴熊光1799年底提到，他被任命为河南巡抚之前，就听说过明亮与永保在钟祥不和。XFFL, 118/15b. 嘉庆1800年说，乾隆把明亮派往苗疆战役，是因为他与永保的嫌隙。XFFL, 154/5a–b.</li>\n<li>XFFL, 18/12a–13a, 18/13b–16b.</li>\n<li>XFFL, 18/22a–24b.</li>\n<li>健锐营与火器营的两千名士兵由巴克坦布、阿尔萨朗、讷音与硕云保四名满洲将领统领。XFFL, 22/43b–45a, 20/26b–27a.</li>\n<li>XFFL, 21/35b–40a.</li>\n<li>XFFL, 18/34a–35b, 19/5b–7a.</li>\n<li>QSG, 11175–77.</li>\n<li>恒瑞与舒亮直到次日清晨才来解救景安，使景安在险境中过了一夜，而永保则毫无反应。XFFL, 23/28b–30b, 23/31b–32b.</li>\n<li>乾隆虽然立即下令调回，1797年初却只有王文雄率领的九百余名士兵返回河南。除阵亡的三百六十三人外，还有七百零一名河南兵留在湖北。景安要求毕沅把他们放回。XFFL, 23/34a–35b, 24/18b–20b, 24/41b–42a.</li>\n<li>XFFL, 24/46b–47b, 24/48a–51b.</li>\n<li>XFFL, 22/25b–36a, 23/47b–48b, 24/9a–11a, 24/25a–26a; QSLJQ, 11/25b–26a. 乾隆还革去永保两子的官职，发往伊犁效力，不给俸禄。XFFL, 22/48a–49b.</li>\n<li>XFFL, 22/48a–49b, 24/41a, 26/18a–20a.</li>\n<li>关于这桩丑闻的详情，见第3章。</li>\n<li>1796年春，一些湖北叛军来到大宁，试图煽动当地教众起事，但被大宁知县钟莲驱逐。《大宁县志》（Daning xianzhi）5/7a; XFFL, 5/34a, 7/20a.</li>\n<li>徐天德是孙士凤的弟子。因为孙士凤是宋之清的大弟子，铃木中正认为川东北的教门据点是襄阳收元教运动的延伸。Sennen ōkkuteki, 305–6.</li>\n<li>QSLJQ, 10/5a–6a; KJJFSB, 1/4a.</li>\n<li>王三槐供词，BLJZL, 5:65–72; XFFL, 19/15a–17a, 19/30a, 20/23a–b, 35/27a; KJJFSB, 1/3b–4a.</li>\n<li>XFFL, 20/19a.</li>\n<li>XFFL, 20/36b–38a.</li>\n<li>GZDJQ, 1259.</li>\n<li>XFFL, 19/16a–17a.</li>\n<li>巴州起事的其他首领还有苟文明与鲜大川。罗其清供词，BLJZL, 5:72–73, 74–75; 冉天元供词，第89–91页; XFFL, 26/8a–10a, 27/4a–b, 27/31a–b, 28/29a–b, 60/34a–b.</li>\n<li>BLJZL, 1:214–18; 田多级等人供词，BLJZL, 5:48–50; XFFL, 19/30a–b, 21/3a–7a, 22/36a–41b.</li>\n<li>太平起事的其他首领还有龙绍周与王国贤。XFFL, 26/8b–9b, 27/4a–10b, 40/13a.</li>\n<li>陕西各地教门骚乱被地方官府镇压后，官府要求教众与地方衙门签订保证书，悔过自新，承诺永不再犯。GZDJQ, 2077.</li>\n<li>GZDJQ, 1336, 1612; XFFL, 20/12a, 21/1a–3a, 21/14a–17b, 21/30a–33b.</li>\n<li>GZDJQ, 1507.</li>\n<li>GZDJQ, 1548.</li>\n<li>GZDJQ, 1613.</li>\n<li>宜绵推迟了乾隆命他前往陕豫边界的旨意，坚持打完五座云之战。GZDJQ, 1654, 1538.</li>\n<li>XFFL, 28/30b–36a.</li>\n<li>KJJFSB, 1/9b–10a.</li>\n<li>KJJFSB, 1/7b–8a.</li>\n<li>袁国璜是四川人，参加过乾隆朝晚期的多次战争，其画像有两幅陈列于北京紫光阁。QSG, 11242–43. 何元卿也是四川人，因攻克来凤旗鼓寨叛军据点的功劳晋升总兵。QSG, 11242.</li>\n<li>嘉庆元年十二月十九日，观成与五百名士兵到达四川梁山。XFFL, 23/8a–11a, 23/12a–15b, 25/30b.</li>\n<li>XFFL, 26/8b; JQSYD, 8:491; KJJFSB, 1/10a–b. 佛住的先祖是明朝武将，汉化满洲人，后降清。QSG, 9329–32, 11248; 柯娇燕（Crossley）Translucent Mirror, 112–13, 121–22。</li>\n<li>GZDJQ, 846, 1797, 1877; XFFL, 26/8b–9b, 28/27b–30a.</li>\n<li>GZDJQ, 1938, 2013; XFFL, 29/19b–26a.</li>\n<li>GZDJQ, 2294, 2077.</li>\n<li>XFFL, 29/4b–6a, 29/10b–12a, 29/24b–26a. 乾隆起初命明亮、额勒登保与德楞泰前往四川，后来得知惠龄等人不力，又决定派三位将领前往襄阳战场。听说东乡失陷后，他再次改变主意：让明亮与德楞泰去四川，额勒登保去襄阳。XFFL, 26/10a–12a, 26/26a–27b, 28/11a–b.</li>\n<li>明亮、宜绵、德楞泰，嘉庆二年三月二十六日，GZDJQ, 2200. XFFL, 31/16b–20b, 32/10b–16b.</li>\n<li>明亮署名居首的奏折是GZDJQ, 2200. 宜绵的恳请上于嘉庆二年四月初十日。GZDJQ, 2290; XFFL, 32/19a–20a, 33/44a–b, 35/26b, 35/29a–b.</li>\n<li>GZDJQ, 2294; XFFL, 35/21a–26a.</li>\n<li>GZDJQ, 2343; XFFL, 36/31a–36a.</li>\n<li>XFFL, 37/24b–27b.</li>\n<li>GZDJQ, 2382, 2437; XFFL, 37/20b–23b.</li>\n<li>这位把马让给王三槐的叛军首领郑文礼被清军俘获。GZDJQ, 2472; XFFL, 39/9a–12b.</li>\n<li>GZDJQ, 2438; XFFL, 35/43a–44b, 38/26b–30a.</li>\n<li>宜绵、明亮、德楞泰等，嘉庆二年六月初一日，GZDJQ, 2563; XFFL, 40/27a–31a.</li>\n<li>锡金泰也是紫光阁功臣。苗疆战役期间，他晋升副都统、头等侍卫。QSG, 11248–49.</li>\n<li>GZDJQ, 2595; XFFL, 41/9a–14a, 41/30a, 42/5a–b.</li>\n<li>GZDJQ, 2472.</li>\n<li>XFFL, 89/19b–20a.</li>\n<li>XFFL, 35/32a, 39/15b–17a.</li>\n<li>襄阳叛军以\"万利\"为年号，意为\"万般利市\"。</li>\n<li>XFFL, 172/32b.</li>\n<li>谭正启等人供词，BLJZL, 5:17.</li>\n<li>其中一些名号与1774年山东王伦起事所用者相同。韩书瑞（Naquin）Shantung Rebellion, 111–14。</li>\n<li>在当阳，叛军从他们简陋的枪里只能打出铅块、铁钉与石子，对敌军只造成轻微伤害。XFFL, 4/8a–b. 有些叛军甚至向正在朝他们开火的清军士兵鞠躬，因为他们相信自己的宗教法术能挡子弹。XFFL, 4/3b–4a; QSLJQ, 2/18b–19a.</li>\n<li>铃木中正在《清朝中期史》（Shinchō chūkishi）第148页指出了这一点。</li>\n<li>XFFL, 26/16b–17a.</li>\n<li>XFFL, 1/11a–b, 3/7b, 63/25a–28b.</li>\n<li>XFFL, 67/4a. 晚明叛军把本党记号刺在被裹挟平民的脸上。Parsons, Peasant Rebellions, 230. 太平军也这么干。梅尔清（Meyer-Fong）What Remains, 73–81。</li>\n<li>Parsons, Peasant Rebellions, 232.</li>\n<li>XFFL, 9/9b–10a, 51/26a–27b, 57/24a–b.</li>\n<li>XFFL, 1/4a. 乾隆也称他们为\"乌合之众\"。QSLJQ, 2/a–b; XFFL, 20/19a.</li>\n<li>孙士毅攻下小幽的叛军堡寨后俘获了几名叛军首领，他奏报说要把他们碎尸喂狗。BLJZL, 5:85.</li>\n<li>清军攻破枝江灌湾脑的叛军据点后，共俘获二千七百四十九人，惠龄屠杀了其中近二千五百名俘虏，包括据称曾与清军作战的妇女。GZDJQ, 1399. 1796年底，开县黄柏棚也发生了类似的屠杀。XFFL, 22/2b.</li>\n<li>GZDJQ, 2077.</li>\n<li>QSLJQ, 3/2b–3a; XFFL, 3/5b–6a, 8/11b–12b, 9/12b–13a, 18/28a–29b.</li>\n<li>QSLJQ, 3/8b; XFFL, 4/12a–14a, 4/16a.</li>\n<li>孝感起事平定后，祖之望责成地方乡勇搜捕教众，解送官府。但乾隆告诫他不要如此，命他对教众严加监视即可。XFFL, 13/43b–45b. 1796年夏末，襄阳叛军被逐出河南边境后，河南边境地区的大多数居民都回了家。一些教众——尽管其中有些人并未参加起事——被同村人扭送到地方衙门。景安奏报说，他将把那些同村人不愿容留的教众发往新疆或吉林，给旗人为奴。他说自己这样做是依据先前所奉上谕。XFFL, 13/47a–52b.</li>\n<li>嘉庆元年正月十七日，毕沅与惠龄奏报枝江\"大捷\"后，乾隆首次赏全军一个月饷银；XFFL 1/16b–17a. 惠龄率兵前往梁山攻打林之华、覃加耀一支时，尚未建功，乾隆就赏全军一个月饷银；GZDJQ, 1157. 宜绵太平大捷后，乾隆赏率先攻取叛军堡寨的士兵两个月饷银，其余士兵一个月；GZDJQ, 2014. 聂杰人投降时，乾隆又命赏满洲、绿营兵各一个月饷银；XFFL, 2/22a. 此类赏赐更多例子见XFFL, 2/5b–6a, 8/7a, 13/1b, 13/10a, 14/7a, 14/21a, 15/10a–b, 15/41a–b, 16/18a, 21/43b–44b, 23/32b–33a, 27/20b. 当阳失陷时，乾隆赏围攻当阳的满洲、绿营兵各一个月饷银。XFFL, 2/5b–6a.</li>\n<li>XFFL, 6/11b–12a.</li>\n</ol>", "text": "\n自从你离开\"灵山\"，流落迷失在外，\n落在这\"苦海\"尘世，受尽煎熬；\n无生老母传下信来：\n\"诚邀你重返真家。\"\n——刘之协\n[译者按：原歌谣出自刘之协供词，此处自英文直译；文言原文待核，通行引录作\"自从离了灵山，失散迷家；落在苦海，受尽煎熬。无生老母差人传书，请你回真家。\"（教簿档，05/08/07）]\n\n大多数教门的教义并不包含末世论——末世论通常包括一个以暴力毁灭现存世界秩序的阶段——但那些包含末世论的教门，往往对有望入教者特别有吸引力。鉴于教门之间的竞争日益激烈，一些教门师父按捺不住，把直白的末世预言掺入教义之中，尽管他们清楚地知道，这样做的后果可能是杀头之罪。不过，由于官僚网络单薄，基层的监视可能漏洞百出，这就给教门社群留出了时间与空间上的回旋余地，使它们得以在活动被官府察觉之前滋生、扩张、分裂并相互竞争。白莲教战争爆发前二十余年，一个新教门——混元教——的创立，启动了那条漫长而曲折的轨迹，最终导向1796年在\"三重龙时\"举事的决定。\n然而，起事者未能等到预定的日子。吉日之前两个月、嘉庆皇帝即位后仅仅数日，湖北西部便爆发了一波起事，紫禁城为之惊震不安。对清朝而言，在腹心之地同时镇压多股起事，将考验其权威，更具体地说，考验其军事体系的力量与效能。事实表明，湖北的大部分起事都短命而终。半年之内，清军便平定了其中大多数，并把来自襄阳地区的最大一支叛军赶出了省境。到1797年初，湖北大体归于平静。湖北首次起事八个月后，四川东北部又爆发了数起起事，陕西东南部随后也发生了几起。与湖北的同类起事一样，四川与陕西的这些起事似乎并未对清朝构成真正的挑战。陕西的起事迅速全被平定；到1797年夏天，四川的叛军也濒于覆灭。\n尽管如此，冲突还是远远超出了1797年，并演变成清朝入关以来耗费最大的战争。诚然，叛军异常坚韧，湖北、陕西、四川境内广泛的教门网络也是叛乱在这一阶段的重要兵源与供养地。但叛乱之所以迁延不绝，更关键的原因在于清军进行镇压战役的方式。少数清军将领固然颇有成效，大多数却表现出不愿将叛乱迅速了结的倾向。战役的首任统帅永保表现不济，令乾隆皇帝震怒，于1796年底将其革职——这预示着这场战争将祸患重重，了结无期。\n通向叛乱之路\n1774年，河南鹿邑人樊明德皈依了一种染有末世预言的教门教义。樊明德本是农民，也懂些医术。1774年初他自己染病，一位朋友推荐了教门中人杨吉为他治病。杨吉据说治好了樊明德的病，随后便劝樊明德随他一起奉教，以求死后转世投生得好。樊明德接受了杨吉的传教，开始焚香，念诵杨吉传给他的经卷。杨吉不久后去世，樊明德便自立一教，以他从杨吉处得到的两部经卷之一的题名，命名其教为\"混元\"教，即\"混沌之初\"——这部经卷就是《混元点化经》。樊明德定下一年中的几天，让信徒到他家聚会，念诵经文以及他自己编的咒语。与许多其他教门一样，樊明德允许弟子自行收纳徒众。一年之后，这个新生的教门已越过省界，扩展到安徽的亳州。^1（地图1.1）\n然而，1775年春，这个教门进入了地方官府的视野，随之而来的是查禁。上一年王伦起事的余悸未消，乾隆皇帝对樊明德经卷中的末世讯息尤为警觉。经卷中除提及\"末劫年\"（mojienian）外，还有\"换乾坤\"（huan qiankun）、\"换世界\"（huan shijie）、\"反乱年\"（fanluannian）之类的语句。乾隆下令缉拿这一危险教门的全部成员，樊明德与近百人在鹿邑、亳州被捕。不久，樊明德被处以\"千刀万剐\"之刑——凌迟，^2 另有十余人也被处死，其中包括樊明德的几名亲属。杨吉的坟墓奉旨被掘开，尸骨被毁。^3 樊明德的弟子刘松，以及该教另一重要成员王怀玉之子王法僧，都是鹿邑人，被流放到甘肃隆德。王怀玉却逃脱了搜捕。^4\n1777年，亳州的几名混元教成员以丁洪度为谋主，复兴了该教，他们相信官府已不再注意这个教门。在此期间，教门扩展到了山东。1782年，他们的活动再次被地方政府察觉。一场新的查禁随之展开，丁洪度及数十名成员被捕，或被处死，或被流放。^5 查禁之后，混元教在河南鹿邑、安徽亳州与山东西南角交界的边区大体转入沉寂，不过一些信徒仍坚持信仰，暗中活动。丁洪度曾借其名敛钱的王怀玉，再次躲过了迫害，继续藏匿。\n在混元教诞生地及其原有范围之外，维系该教存续的是刘之协。刘之协约生于1740年，是安徽太和人，家乡在鹿邑以南五十余里，以贩棉为业。他是混元教成员，由刘松引入教门（二人同姓，并无亲属关系）；他先后躲过了1775年与1782年的两次查禁，因为1775年刘松未向官府供出之协，而丁洪度主持的复教活动之协也未参与。刘松被捕后，之协继续向信徒念诵经文，并收取服务之费，不过他在教名前加了一个前缀，改称\"清净混元教\"，即\"清静混沌之初教\"。因经商所需而四处奔走，之协多次前往樊城——这是与襄阳隔江相望的市镇，而襄阳是湖北西北部的主要商业枢纽。除襄阳一带外，他还在河南南部传教，在豫鄂交界一带发展信徒，建立了若干据点。^6\n急于进一步扩充信徒，刘之协迈出了冒险的一步。1788年春，他长途跋涉来到隆德，探望已在那里服刑十三年、靠开杂货铺为生的刘松。^7 两位刘姓之人会面时，决定将教名由\"混元\"改为\"三阳\"——\"三个太阳\"——以激起有望入教者的兴趣。此外，他们还改换了一部经卷的题名，并确定在传教中使用更隐晦的咒语与歌谣。^8 最重要的是，之协策划把该教的千禧年纲领加以强化。混元教的经卷虽一再提及世界的\"末日\"与剧烈而暴烈的变革，其讯息却一直含混不明，以至于樊明德受审时坚称，这些词句指的是自然灾害。为使新教更具末日色彩、因而更有吸引力，之协提议，把1783年赴隆德随父服刑的刘松之子刘四儿，指定为弥勒佛的化身。刘四儿在尘世的使命，是辅佐\"牛八\"——据称是明朝皇室的后裔（\"牛\"与\"八\"两字相合，正是明朝皇姓\"朱\"字）。弥勒佛既已降世，那将终结世界的大灾变即将来临、必须立即行动以求生存，便成了不容置疑之事。在两位刘姓之人为新教义打造的整套说辞里，得救的唯一途径就是加入他们的教门。之协传教所用歌谣有一首如下：\n\n自从你离开\"灵山\"，流落迷失在外，\n落在这\"苦海\"尘世，受尽煎熬；\n无生老母传下信来：\n\"诚邀你重返真家。\"^9\n\n\"重返真家\"是一个有力的譬喻，暗示着投生天堂的新生。当它被用力宣讲时，便能把信徒引向那注定的大灾变到来时不可避免的流血厮杀。因此，新教三阳教代表着与旧版混元教的决裂，开启了一个极具颠覆性的纲领。然而，1788年时，两位刘姓之人谁也没有料想到它的滚雪球效应。极有可能，他们当时谁也不曾打算举事叛乱。换言之，新教的政治维度主要源于其末世论，而非对清朝的仇视。与先前的汉人民族主义者或19世纪中期的反满叛乱者不同，刘之协及其同侪没有表现出对清朝的丝毫愤慨。他们也不关心自己时代的政治与社会问题——诸如和珅的专擅、官场的腐败、流民日众——这些问题萦绕在同时代许多忧心国事的官宦士人心中。因此，援引明朝乃是教门千禧年教义所必需，而不是教门创立者政治抱负的产物。\n从此后数年间教门社群所发生的一切来看，之协改造教门的举动，与其说是政治决定，不如说更像商业决定。换言之，他所挂怀的，多半是扩充教门成员——这反过来会为教门和他自己带来更多收入。^10 有趣的是，王法僧1776年被流放隆德后，就住在刘松近旁，却没有获邀参加两位刘姓之人的会面。王法僧的父亲王怀玉躲过了官府的缉捕，是混元教中德高望重的领袖，一直住在樊城，直到1794年中寿终正寝。之协虽然显然知道怀玉的下落，却没有让他卷入此事。相反，之协尊刘松为新教门的最高教主，称其为\"老教主\"（laojiaozhu）。^11 刘松在教众中威望并不甚高，又远离鄂豫交界地带的教门社群，注定只能充当一个挂名的头面人物。他不在场时，之协便可代为行事，拥有全部实权，却不必顶着教主之名——万一官府来查禁，这或许对他有利。王怀玉后来得知这个新教门时，选择了不加入。^12\n返回襄阳一带后，刘之协起初把改头换面的教门经营得有声有色，招募新成员，收取\"入教钱\"。1788年晚些时候，襄阳人、之协新收的弟子之一宋之清前往隆德，向刘松敬献了五十两白银。此后数年（1789—1793），刘松先后六次接待这样的来访。每次收下银钱之后，他都焚化一张黄纸，念诵几段经文，为出资者祈祷。1794年底刘松被捕时，人们在他的卧室里搜出了二千两白银。^13 刘松所收到的，只占教门总收入的一小部分；其余的钱都留在刘之协及其他有权收纳新成员的首领手中。1800年，教门的管事之一（可能是之协雇用的）张小元被捕，他供认，此前数年间仅四川一地的年收入就超过一万两。^14\n钱的流动对宋之清想必是莫大的诱惑。或许是动了自创一教的念头，宋之清不再与刘松或刘之协分享收入。^15 事实上，加入三阳教之前，宋之清于1782年由堂兄宋文高引入襄阳一带活动的另一个教门——收元教。收元教的经卷是《太阳经》，其千禧年色彩不如混元教经卷那样鲜明。^16 1792年，宋之清与另一位襄阳人樊学鸣联手，创立了新教——西天大乘教。新教虽以《太阳经》为主要经卷，却也借用了刘之协注入三阳教义的内容——弥勒佛降世与大灾变将至——并且采用与刘之协三阳教相同的劝化手法，声称躲过大灾变的唯一途径是入教。如今成了自己教门的创立者与领袖，宋之清与刘之协断绝了关系，不再视后者为师为尊。^17 凭借收元教的基层网络与新的末世教义，宋之清很快压过了刘之协：争夺新成员，挖走刘的信徒，还把势力扩展到陕西南部。^18 之协不是襄阳本地人，宋之清的竞争想必使他损失了大批主顾与收入。\n1792年春，刘之协前往甘肃，再次探望刘松。会面的细节不得而知，但刘松允许之协把其子刘四儿——所谓的弥勒佛化身——带到襄阳，试图向宋之清证明，\"弥勒佛转世\"这一教义的归属权在三阳教。然而，宋之清拒绝承认刘四儿是弥勒佛化身，讥讽四儿不像佛。宋之清宣称，弥勒佛已转世为河南南阳的李三瞎子，而牛八则是李三瞎子的儿子毛金刀（\"毛金刀\"三字隐含\"刘\"字，因为卯、金、刀都是\"劉\"字的部件）。宋之清还声称，李三瞎子此时虽双目失明，到了适当的时刻自会复明。宋之清拒不接受刘之协所选的弥勒佛，刘四儿也抱怨在襄阳期间没能见到牛八。于是，之协把刘四儿送回隆德后，回到安徽，请他的一个弟子刘胜洲允许他给其十一岁的侄儿改名\"王双喜\"——意为\"双喜临门\"——随后把男孩和他的叔父一起带往隆德。^19\n1793年初到达隆德后，刘之协把\"王双喜\"作为牛八引见给刘松与刘四儿，但后二人对之协所选牛八作何反应，不得而知。在隆德逗留了约一个月后，来客们在过了旧历新年后动身返乡。就刘松所知，之协想把这位牛八展示给宋之清，试图从宋之清那里夺回一些旧日的信徒。然而，到达湖北后，刘之协付给男孩与其叔父十两银子和五十文钱，打发他们回家，自己却留在了湖北。为反驳刘之协关于弥勒佛与牛八的说法，宋之清修正了自己的说法。如今他宣称，弥勒佛转世在河南\"无影山\"（Wujingshan）一户张姓人家，而牛八实为名叫朱红桃的人，也在河南。^20 直接使用明朝皇室的姓氏，宋之清无意中跨过了红线，把他的教门引入了险境。与此同时，宋之清此举加深了他与刘之协的嫌隙。1793年春至1794年秋，关于二人裂痕的记载很少，但一些教门中人认为，正是这场分裂使他们的活动暴露于官府，招致了一场波及甚广、处置严厉的查禁。^21\n查禁从四川东北部开始。1794年秋，四川即将离任的总督福康安捣毁了与湖北竹溪交界的大宁县一个收元教据点，逮捕了二十余名教众，其中包括他们的首领、大宁本地人谢添绣。谢添绣由竹溪教门中人陈金玉引入教门，此后在家乡收纳新成员。到1794年底，弥勒佛与牛八的故事已在当地教众中广为传布。乾隆一眼就破解了\"牛八\"意指明朝朱家，对这条颠覆性的预言大为警觉。更令他吃惊的消息是：陈金玉在湖北他处被捕后，在押解回竹溪途中，一群教众伏击了地方官府的解差队伍，陈金玉被同教救走，混战中还打死了一名衙役。乾隆对教门运动素有经验，由此意识到，这或许不是一桩寻常的教门案件，背后可能潜伏着一个危险的图谋。乾隆五十九年八月二十日，乾隆颁下一道措辞严厉的上谕，命有关各省督抚将涉案人员一体缉拿。^22\n1794年剩下的时间里，河南、湖北、陕西、四川、安徽、甘肃都展开了搜捕。皇帝对这些省份不断施压，使查禁愈演愈烈，范围愈扩愈大。^23 一两个月内，各省数百人被捕受罚，包括教众与他们的师父，宋之清与樊学鸣也在其中。^24 经审讯，宋之清与另外几名首领——包括襄阳的衙役齐林——被处死。有意思的是，宋之清没有向官府供出刘松与刘之协，而是坚持自己的收元教身份，声称自己是引他入收元教的宋文高的弟子。^25 与此同时，乾隆令陕甘总督勒保在隆德逮捕并处决了年近八十的刘松及其子刘四儿。^26 查禁进行一个月后，乾隆从他最初的强硬立场上退了回来：在得知被捕者的审讯所供不过\"骗钱惑众\"（pianqian huozhong）而已之后，他承认此案并不像他起初所想的那样严重、那样波及广泛。但各省的地方政府仍在继续搜捕。^27\n不可思议的是，刘之协又一次逃脱了。刘松被捕后，向官府供认了他与刘之协、宋之清的关系，以及二人在各自教门中的角色。乾隆五十九年十月初八日，乾隆命安徽当局缉拿刘之协。^28 然而，之协并不在家。查禁之前不久，之协本打算把王怀玉从樊城接到太和，却不知王怀玉已经去世。他派亲戚、同教中人刘起荣给河南的另一名教门中人送去二百两银子，作为王怀玉的路费。^29 然而，起荣到达河南扶沟时发生了一桩窃案，被窃走的恰是二百两。因为起荣身上带着同额的银子，他成了嫌疑人。在扶沟知县面前为自己辩解时，起荣说，这钱是刘之协交给他到河南买棉花用的。于是，扶沟知县请太和的同僚护送之协到扶沟作证。之协动身前往扶沟——他借口要先处理一些私事，把行程拖后了几天——刚一出发，他的兄弟就被捕了，家里也遭到搜查，但没有搜出任何能证明他参与教门活动的东西（很可能之协正是利用这拖延的几天做了安排）。不过，之协的侄儿逃了出来，赶到扶沟向之协示警。之协到扶沟已一周，一直未受严密监视，便于乾隆五十九年十月十五日立刻逃走了。^30\n尽管搜捕十分严密，刘之协还是先回到了太和。他没有回到元乡集的家，而是住在另一个镇上的教门中人家中。1795年初，他动身前往襄阳，此后官府便失去了他的踪迹。^31 1794年剩下的日子以及1795年初，乾隆一直催促中原各省的督抚缉捕他。^32 乾隆推断，刘之协必定藏在河南、湖北、陕西乃至甘肃的同教家中；而之协确实辗转于河南南部与襄阳一带之间，藏在教众家中（在河南，他曾在泌阳县住过一段时间）。尽管刘之协与宋之清有裂痕，宋的弟子们仍敬重刘之协，称他为\"老师父\"（laoshifu）。事实上，宋之清与其他几名收元教首领被处决后，之协在他们中间的地位反而提高了。尤其重要的是，刘之协与姚之富过从甚密。姚之富是竹山人，襄阳一带颇有影响的收元教师父。1794年查禁之后，姚之富走到了前台，接掌了幸存教众的领导权。1795年初逗留湖北期间，之协曾在襄阳城郊姚之富家中藏身了一段时间。他白天躲在夹墙里，夜里才出来与姚之富交谈。^33 极有可能，正是在这些黑暗中的谈话里，作出了在龙年龙月龙日龙时（1796年农历三月初十）举事叛乱的决定。这一决定也很可能是在1795年早春——之协到达湖北后不久——作出的。\n这一决定并不令人意外，也不是什么断裂。正如关于中华帝国晚期教门运动的研究所阐明的：来自国家的压力骤然升高，往往成为扭转局势的关键，促使走投无路的教门中人在诸多选项中选择叛乱。^34 就本案而言，1794年的查禁及其后的持续搜捕，确实是叛乱的催化剂。刘之协1788年对混元教的改头换面虽已预示着暴力阶段的到来，但真正印证\"末世大灾变\"即将来临——正如千禧年末世论所预言的那样——的，是宋之清、刘松、齐林等人被处决，以及数百教众被捕。要想活下去、在新世界中获得重生，就必须抓住时机，起而反抗官府。无独有偶，1795年初，贵州东北部与湖南西北部的苗民把他们对汉人涌入其家乡的持续抗议，发展为公开起义。清朝不得不从其他数省（包括湖北、四川）调兵镇压。到是年秋天，清军首战未能平定叛乱，起义演变成一场大战。乾隆任命福康安为统帅，主持这场战役，并从中枢政府拨出经费，支援日益强化的军事行动。^35 对正在中原策划起事的教门中人来说，苗民起义来得正是时候——西南的战事进一步印证了他们的预言：末日时刻迫在眉睫。从实际层面看，清军开赴苗疆作战，使各原驻省份防卫空虚，这也进一步鼓舞了密谋者。\n举事的决定作出之后，刘之协离开襄阳前往河南，藏匿起来，与姚之富不再联系。1800年被捕后，之协在受审时供认：在龙年龙月龙日龙时起事的主意是他想出来的，因为他认为这些巧合在动员信徒时会有吸引力。^36 之协在这件事上不大可能说谎，因为以他的处境，理性的选择本该是尽量撇清自己与叛乱的关系。然而，之协本人是否曾准备亲自参与行动，则是另一回事。之协自己从来不是真正的信徒，他一直是把教门活动当作一桩生计——一桩有利可图、却也充满危险的营生。1795年初，他面临的却想必是入行以来最危险的处境。中原其他教门头目大多已落网，被安徽当局缺席判处\"凌迟\"的刘之协成了官府搜捕的焦点。在北京的压力下，各省地方衙门屡屡错捕无辜，刑讯逼供。^37\n他选择留在查禁的风暴中心，表面上显得镇定，内心想必时时惴惴不安。在他看来，一场起事或许能帮他摆脱困境，因为官府的注意力会被吸引到对付叛乱者上去。再者，姚之富及其他急于举事的首领大多是宋之清的追随者；一旦叛乱爆发，他们的网络与据点暴露于官府，之协并不在乎——毕竟宋之清阵营是之协长期以来的竞争对手。把他们从舞台上清除掉，就意味着之协的教门有了开阔的市场。这些推测听来冷酷而阴险，但有两件事为这一判断提供了支撑：刘之协在最后关头突然退出了叛乱；河南南部三阳教与混元教的大多数信徒在龙时到来时并未举事——很可能是因为之协没有召唤他们行动。如前所述，叛乱的头几年里，之协的教门在经济上一直经营得不错：仅四川一地，就从信徒那里收取了一万多两。\n归根结底，刘之协帮助策划叛乱的真实动机变得不那么重要了。与之协对其教门信仰那种貌似不诚、机会主义的态度相反，大量其他教门中人——无论师父还是普通教众——都更忠于信仰，准备在命定的时刻到来时赴汤蹈火。对一些人来说，复仇可能也是一个因素。王聪儿（人称齐王氏，即本姓王的齐家之妇）本是流浪杂技艺人，是齐林十八岁的遗孀；丈夫被处决后，她削发为尼，避入佛寺。叛乱一旦酝酿起来，王聪儿立刻挺身而出，不过直到叛乱爆发一年后，她才成为关键首领。^38 其他一些教门中人的经历与此相似。^39\n自1795年春起，姚之富及其在襄阳的同谋者派出信使，携带书信前往湖北西部、河南南部、陕西南部与四川东北部的其他教门据点，煽动各处在龙日同时举事。对许多教门信徒来说，这个简单而不容置疑的预言——举事的时刻即将到来——是无法抗拒的。在有些地方，地方官府对教门中人持续不断的骚扰与勒索，无意中帮了密谋者的忙，把许多人——教众与非教众——都推向响应武装召唤的一边。^40\n湖北的起事\n\"龙日\"计划一经启动，它的任何一位策划者都无法再驾驭其后果。于是，叛乱并不是以一个首领或一个核心领导层所领导的单一举事开始的，而是展开为一簇起事，每一场有数千人参与，多的达一两万人。^41 在湖北，起事主要爆发于两个区域。在湖北西北部，起事从武当山脉东端一直蔓延到湖北的西北端。在湖北西南部，荆州、宜昌、施南三府是数场起事的发源地，其中包括发生在荆州府宜都、枝江两县的第一场起事。清朝对这些起事的反应起初只限于本地，但很快便转变为一场协调一致、全国性的努力，从其他省份调来军队。（地图1.2）\n宜都—枝江起事\n宜都与枝江都位于长江西岸，同属荆州府，与宜昌府往来密切——宜昌府境内居住着许多毕兹卡人。清朝官府称他们为\"土苗\"，今天的中华人民共和国则正式称其为\"土家族\"。毕兹卡人世代居住于长江上游河谷，即湖北西部、四川东南部（今重庆市）与湖南西北部。雍正年间改土归流之后，许多汉人迁入。18世纪晚期，许多毕兹卡人皈依了教门教义，成为热忱的信徒。\n宜都起事的策划者们偏离了混元教与收元教的通行预言——那种预言以据称的明室后裔牛八为主角。他们另造了一个新的预言人物\"李犬儿\"（Li Quaner），据说他是不知何时的天将转世。据说，当命定的龙日到来时，李犬儿将从他的家乡山西出发，前往河南，在那里建立新朝，刘之协将充当他的军师。这个故事极有可能是两位教门师父张正谟与刘盛才编造的，尽管张正谟后来声称，这个预言是他从自己的师父白培相那里得来的。^42\n1795年中，三十五六岁的张正谟从家乡长阳迁到宜都。与宜都本地人刘盛才一道，张正谟开始利用李犬儿的预言，在教门成员内外网罗可能的起事者。为使说辞更具说服力，他们声称张正谟曾亲眼见过这位李犬儿，还从他那里领受了一柄佩剑，常常带在身边。据他们所讲，只有向李犬儿捐了钱、并随他起事的人，才能躲过龙日降临的大灾变。那一刻到来时，湖北西北部的\"武仙\"（wuxian）将下凡来与湖北西南部的\"文仙\"（wenxian）会合，从而开启一场大规模的杀戮。为度过这场大灾变，他们传给信徒一道咒语，令其记诵：\n\n黑风骤起，吹一日一夜，\n吹死多人；\n白骨堆成山，\n血涌而成海。^43\n[译者按：原咒语出自教门供词，此处自英文直译；文言原文待核，通行引录作\"黑风骤起，一日一夜吹死多人，白骨堆山，血水成海。\"]\n\n据说，这道咒语原本藏于李犬儿所住村庄的一块巨石之中，某日巨石忽然开裂，咒语方才显露。刘盛才告诉教众，李犬儿的手掌上可见\"日\"\"月\"二字。^44 日、月相合正是\"明\"字——既可以指明朝，也可以指\"光明\"，暗示着某些教门教义所预言的那个最终太平极乐的世界。然而，策划者们并没有进一步透露改朝换代的计划。\n在宜都，张正谟与刘盛才同另一位教门中人张宗文密切合作。张宗文的儿子娶了聂池的女儿；聂池曾随张宗文习教，他的父亲聂杰人是一位殷实的地主。策划者们与聂池一道，向年近七旬的聂杰人描述了一番万物毁灭的预言景象，又许以新朝高官之位，说服他加入他们的事业。聂杰人捐出了一百两银子，还献出自己深藏山中的大宅作为他们的据点。起事发动时，聂杰人被推为旗手，策划者们则隐于幕后——他们希望这位年长而富有的聂杰人能在乡民中赢得更多的敬重与影响力。^45 从1795年底起，策划者们让铁匠在山洞里锻造兵器，并派出信使——包括刘盛才本人——前往湖北西部其他地方煽动起事，尽管这些信使从此再无回音。与此同时，枝江的教众利用当地教门首领刘盛明的宅子准备起事。^46\n1796年元旦乾隆禅位于嘉庆后约一周，张正谟带着数百名手持白旗、黄符与武器的教众来到聂杰人家中，告诉聂杰人：地方官府已加紧查禁教门，他们必须立即行动。正月初十日，宜都、枝江两县的官员——他们已获悉两县的教门活动——前往聂家与刘家捉拿可能的叛乱者。在聂家，一千余名教众与官员及其兵丁发生冲突，点燃了第一场起事。几天之后，两县的起事者向江家垱山区进发，那里距枝江、宜都县城约二百里。以约两千教众为核心，叛众很快通过劝说或胁迫扩展到一万多人。尽管他们的分遣队曾攻打宜都、枝江县城——两城各仅剩数十名清军——他们却没有表现出夺取县城的强烈意图，而是集中精力掳掠给养，据守江家垱。^47\n接到起事的奏报后，署理湖北巡抚惠龄——一位驻守荆州、为苗疆战役协调后勤的蒙古旗人——火速赶赴现场。然而，他只凑起了一百名士兵，因为该地区的大部分军队已调往苗疆战役。^48 惠龄关于起事的奏折于正月二十五日抵达北京——距第一次冲突已两周——却没有引起紫禁城的严重关切：朝廷正全神贯注于苗疆战役，把它当作一桩地方痞棍的小骚动，一掠而过。得不到北京任何支援，湖北官员只能调度本省有限的兵力。直到起事爆发一个月后，一千四百名清军——包括三百名荆州驻防旗兵——才赶到现场。^49 与此同时，湖北当局号召当地居民武装起来协助正规军作战，由此开启了一个前所未有的现象：此后数年间，战区数十万平民被编为乡勇，与正规军并肩作战。\n随着清军压力的增大，江家垱不宜长期据守，起事者——此时可能已达两万人，包括起事者的家属与许多被裹挟的当地居民——于二月中旬转移到枝江境内更为险峻的灌湾脑。叛军如何在被围之中完成这次转移，未见详报于朝廷。显然，从四面八方赶到那里的湖北军队未能察觉并截击敌方的行动。然而，看不到其他起事者来援的希望，一些起事者变得幻灭。转移到灌湾脑后数日，名义上的首领聂杰人——他的三个儿子中有一个刚刚阵亡——与另外数人向清军投诚。^50\n普通的起事者似乎更为坚定。在灌湾脑，他们以石墙与地雷封锁山顶，制造枪、炮与弓弩（甚至给箭头涂了毒）。数千人挤在堡寨之中，每天为食物、饮水与其他给养而挣扎，卫生也是难题。初夏时节，一场疫病爆发，夺去了数千人的性命。^51 尽管如此，他们在灌湾脑坚守了五个多月。主持围困的惠龄被证明是无能的。他虽然在西宁、伊犁等几个重要边地任过职，还曾以四川总督的身份参与第二次廓尔喀之役的后勤事务，但四十年的仕途中从未有过统兵作战的经验。^52 正如乾隆所评论的，他\"虽曾历戎行，恐未娴军旅\"。（原文待核，见注释53）^53\n在灌湾脑的对峙中，惠龄常常无所事事，进攻时断时续，却更热衷于上报自己与部下遇到的种种困难，诸如兵力不足、天气恶劣、地形险阻之类。围困想必处处漏洞，因为叛军似乎并未遭受粮荒——尽管他们转移时只带了一个月的口粮^54——他们必定找到了办法，为数千人从外面筹措给养。夏末，惠龄发动了一场大规模攻势，炮轰叛军堡寨。清军炮火摧毁外层工事之后，惠龄却没有乘势进攻退入内堡的叛军。^55 当阳于七月中旬被清军收复后，乾隆对惠龄施加了更大压力。七月二十四日，清军诱使叛军出堡攻营，然后设伏俘获了部分出击者，其中包括张宗文。^56 尽管受此挫折，剩下的起事者仍设法坚持了数周。直到八月中旬，在被乾隆一再训斥之后，惠龄才发起一场持续数日的决战。八月十七日，清军使用火弹与喷火器点燃了叛军最后的堡寨。据报道，近一万名叛军及其亲属或在战斗中阵亡，或葬身火海，或逃生时溺毙于壕沟。近三千人被俘，其中包括张正谟与另外几名首领，以及聂杰人的另外两个儿子。惠龄屠杀了近二千五百名俘虏，其中包括妇女（据说她们曾与清军作战），把其余约二百人——大多是妇孺——赏给旗人为奴。^57\n湖北的第一场起事就这样在爆发七个月后走向了终结。此时，其后爆发的大多数其他起事也已被扑灭。惠龄虽然因这场迟到的胜利而获得荣衔，他平庸的表现却没有逃过新君嘉庆的眼睛——嘉庆一直在父亲的影子里密切关注着这场战役。后来，嘉庆这样评论惠龄：\"各路带兵打仗之人，皆可谓之懈怠，而惠龄为尤甚。\"（原文待核，见注释58）^58\n当阳围城\n起初不愿向湖北增兵，北京在宜都起事爆发五周多之后，于二月中旬下令河南、陕西四千军队开赴湖北。^59 这些军队到达之前，又爆发了更多起事。响应襄阳教门首领的武装号召，东湖、远安、当阳的教众相继起事。二月十五日，他们涌向只有数十名兵丁把守的当阳县城。城内的教众——其中许多是衙门书吏——从里面发难，把同教之人放进城来。次日，他们杀死了当阳知县，占据了县城。^60\n当阳是湖北西部重要的商业枢纽，也是整个白莲教战争中叛军一度占据的仅有的两座城市之一（另一座是四川的临江市，下一章将讨论）。当阳陷落加重了叛乱的严重性，使中枢政府确信必须增派军队。朝廷向当阳派出了三位高级满洲将领：鄂辉、恒瑞与永保。鄂辉长期担任福康安的副手，参加过乾隆朝晚期的多次边疆战争，当时任热河避暑山庄总管大臣。^61 恒瑞是西安将军，也是湖北之外距此最近的旗军统帅，他于二月二十九日率两千满洲兵从西安出发。^62 乾隆拒绝了湖广总督毕沅调派京城精锐旗兵的请求，理由是：两千旗兵固然不足以守御湖北各地，但调遣他们会在从北京到湖北的长途上引起太多骚扰，而且他找不到合适的将领来统领这支队伍。\n相反，乾隆又向湖北派出一位满洲将领：永保。永保是乌鲁木齐都统，正进京陛见途中在西安停留，被乾隆改派湖北。此外，乾隆还指定永保与毕沅共同主持湖北的战役。^63 然而，三位将领谁也没能到达当阳——他们都被湖北北部的其他起事缠住了。\n当阳的围城牵动着湖北当局最大的注意力。县城陷落后，毕沅立刻从宜都—枝江前线赶去，亲自指挥围困。^64 毕沅是典型的科举士大夫，乾隆二十五年（1760）殿试一甲第一名进士，尽管在18世纪晚期的几次战争中参与过后勤事务，却没有指挥军事行动的经验。18世纪80年代初，他因卷入甘肃冒赈案而被革职，但很快复职——或许是因为他与和珅关系融洽。^65 出任湖广总督后不久，毕沅就得了个\"毕不管\"的绰号，因为他办起公务来并不卖力。不过，这场战役中，毕沅对战费的态度可一点不随性：他乐于利用机会挪用军费，来取悦来鄂作战的各位将领，或许也中饱私囊——这一点后文再谈。^66\n在毕沅的主持下，围城数月没有进展。清军只是炮轰城池、诱叛军出击、然后加以杀伤，却从不想方设法攻取城池。毕沅与其同僚将领不断抱怨兵力不足，可援兵到了之后，局面几乎原封不动。乾隆对这场没完没了的围城越来越不耐烦，毫不留情地斥责毕沅，指出其奏报中的种种矛盾之处，并把批评扩展到湖北的其他将领，包括惠龄。随着北京压力的增大，毕沅与将领们于五月中旬对县城发动进攻。炮火在城墙上轰开了缺口，但试图登城的士兵被叛军击退，这又招来乾隆的一顿严斥。^67 当阳的一位士人以讽刺的笔调，写下了这样几句诗，讥嘲清军的围城：\n\n将军奉命扫贼寇，\n各路兵马齐会集；\n大军围城攻打急，\n犒赏勇兵不惜钱；\n日上炮台轰城池，\n日日可把赏来领。^68\n[译者按：原诗出自当阳士人之手，此处自英文直译；文言原文待核。]\n\n毕沅或许指望城内的给养耗尽——这并非不切实际的盘算。叛军的作战兵力并不大，尽管他们胁迫了数千当地居民入伙。他们的首领杨起元是远安人，教门师父出身，把两三千名精壮分作五营，但随着伤亡增加，人数不断减少。整个围城期间，叛军多次试图送出文书，与别处的同党联络，都没有成功。外边的同党也曾试图派援军入城接应，也都失败了。孤立无援、深陷重围，从四月起，叛军的给养短缺日益严重，房屋被拆作柴烧。不久，城内饥馑蔓延。从五月下旬起，起事者一再绝望地试图突围，没有一次成功。^69\n最后，在盛夏时节，清军将领设计了一个先除叛军首领的计策。他们派一名乡勇潜入城中，联络他的旧识王志良——杨起元的属下。王志良是四川人，1774年因罪流放当阳，此后卷入教门活动；他同意倒戈。六月二十日拂晓，王志良杀死了杨起元，携其首级，带着六名家眷缒城而下，向清军投降。^70 杨起元既除，毕沅与舒亮——舒亮曾任黑龙江将军，时为正三品侍卫——加强了攻势。但他们先又雇了数千乡勇，因为据他们抱怨，一千四百名士兵兵力太少，不足以破城。从六月二十五日起，清军从几个方向进攻当阳，二十八日凌晨从东门破城而入。数千居民逃出城外，但许多人随即死于饥饿与衰竭。剩下的叛军退入加固的大宅，又坚持战斗了两周。直到七月十一日及次日，清军以炮轰与投掷火弹，才最终摧毁了叛军最后的据点。据报道，三千名叛军在这场决战中被杀，杨起元遇害后成为叛军首领的陈德本被生擒。^71\n来凤起事\n来凤县地处湖北西南端，境内居住着若干少数民族，其中以毕兹卡人为主；到18世纪晚期，这里已成为一处教门据点。^72 与宜都的情形一样，来凤小幽一位名叫陈启明的殷实地主是当地教门社群的招牌人物，尽管陈启明背后是否另有真正的谋主，不得而知。^73 1794年查禁期间，来凤的教众曾以暴力抗争官府，震惊北京。由于来凤与四川酉阳州接壤，酉阳的地方官来到来凤，逮捕了六名教众。被捕教众押解往酉阳途中，来凤教众袭击了押送队伍，救出被捕者，还打伤了衙役。结果，湖广总督福宁派兵前来，逮捕了参与事件的二十余人。^74 这是1794年查禁中唯一一次公开抗法的案例。\n1796年初，龙年将至之际，一名教门信使王子俊从襄阳来到来凤，号召举事。不过，王子俊把行动之日定在二月十五日——比龙日提前了二十五天。很可能，襄阳的密谋者想让这场起事早些发动，把清方的注意力吸引到本省南缘，从而削弱湖北其他地区的清军力量。王子俊在煽动时没有使用任何末世预言，讯息简单得很：举事的时机已经成熟。王子俊过完新年就返回了襄阳。来凤的教众热切地响应了他即将举事的号召；二月十五日起事发动时，数以万计的人加入其中，包括许多来自邻近的龙山及湖南其他县份的人。首领虽有一大批——包括陈启明在内——最受敬重的却是一个名叫胡正中的来凤本地人。叛军称他为\"胡三师父\"（Hu San Shifu），他本是当地巫师，二十五六岁，直到1794年才入教。起事者攻占了来凤县城，杀死了知县。然而，来凤县城没有城墙，难以据守。与其他起事的同侪一样，起事者们撤入山中，筑起了几处堡寨。^75\n此时，署理四川总督孙士毅——一位久历边疆的封疆大吏——刚刚抵达与来凤接壤的四川苗峒，以阻止湖北叛军渗入四川，因为宜都—枝江起事之后，湖北难民正涌入四川。^76 孙士毅立即接下征剿来凤起事者的任务。三月，他攻打了他们在小幽的堡寨，杀敌千余，把其余人打得四散而逃。^77 四月十五日，孙士毅攻破茶园溪的堡寨，接着又破红岩堡的寨子，来凤境内便只剩下旗鼓寨一处叛军据点了。^78 然而，孙士毅很快病重——他已年过七旬——于六月去世。^79 孙士毅死后，带着湖南兵来到来凤的福宁被任命署理四川总督，主持来凤的军事行动。^80\n叛军全部退入旗鼓寨后，给养日渐匮乏，内部摩擦四起。一些人——包括一些首领——盘算着逃跑或向清军投降。六月中旬，福宁对旗鼓寨发动进攻。凭借一名叛军变节者提供的情报，清军俘获了胡正中、他的弟弟和他们的母亲。胡正中供认，他本也打算逃出旗鼓寨，前往邻近的咸丰、宣恩两县组织更多起事。^81 胡正中随即被处死。胡正中被俘三周后，即七月十一日至十六日，在北京日增的压力下，福宁发动了强有力的攻势。清军炮击叛军堡寨，纵火焚烧，夷平了旗鼓寨据点，俘获了胡正中被俘后接任主首领的田谷墩及其他头目。数千人被杀或自杀，另有二三千人——其中包括许多老人、妇女与儿童——向清军投降。^82\n来凤起事行将扑灭之际，宣恩龙马山又爆发了一场起事。初夏时节，旗鼓寨的首领们曾派信使前往宣恩，联络当地教众。当地教门中人李登鳌动员了一千多人，于六月十一日举事，试图声援旗鼓寨的教友。他们击退了当地清军的数次进攻，并多次转移。旗鼓寨陷落之后，福宁率兵前往宣恩，对付这场起事。听说来凤起事已经结束，许多起事者自杀了。八月，李登鳌与另外几名头目下山到田里弄粮时被擒。此后，剩下的四千余人——大多是被裹挟者——于九月向福宁投降。^83\n使来凤起事在白莲教战争此后数年间余响不绝的，是福宁攻克旗鼓寨之后的暴行。一千七百至两千名被认为顽固不化的精壮俘虏，让福宁担心他们可能再度叛乱，于是将他们全部屠杀，手段冷酷。他先是哄骗俘虏，让他们相信自己已被收编入清军，要到与来凤接壤的湖南龙山县城内领取军装与口粮。当俘虏分批进入城门时，埋伏在城墙内的清兵一拥而上，将他们一一砍杀。这一骇人听闻的事件传遍远近，成了阻止叛军向清方投降的一道心理障碍。1799年初，嘉庆皇帝试图整顿误入歧途的战役时，此案被立案调查，福宁因此受到惩处。^84\n长阳起事\n宜都首起事爆发后不久，宜昌府长阳县的榔坪也举行了一场起事。长阳的人口以毕兹卡人居多，教门网络十分稠密。这场起事的谋主是张驯龙，他原住房县，1795年春迁到长阳。张驯龙住在林之华家中——林之华是长阳本地人，曾师从白培相，而白培相也是宜都起事首领张正谟的教门师父。张驯龙很可能是襄阳密谋者派出的信使；张正谟1795年迁居宜都，也很可能是奉张驯龙之命。在长阳，张驯龙与林之华说服了榔坪的教门中人覃加耀——一个二十五六岁的毕兹卡人——加入起事。林之华与覃加耀被推为旗手，张驯龙则像宜都—枝江起事中的张正谟一样隐于幕后。1796年二月，覃加耀先率数千当地人举事，接着林之华也率众起事。两股起事者合计一万余人，在榔坪建立了基地。湖北当局被枝江与当阳的围城缠住，只能调派两千名安徽兵来对付这场起事。围剿行动有气无力，叛军得以派出人马攻打长阳附近地区及其他县份，一度甚至威胁要攻打长阳县城。初秋，来凤起事被镇压、数万起事者被杀的消息传来，使榔坪的叛军警觉到：从来凤战事中腾出手来的清军，随时可能被调来对付他们，于是他们决定分散。八月，他们分作两路撤离榔坪：林之华率一路前往资丘，据守山头；覃加耀率另一路前往巴东县的谭家村。^85\n由于长阳起事是与宜都—枝江起事协同策划的，而张正谟转移到灌湾脑后曾多次派人到长阳求援，长阳的首领们在放弃榔坪基地前不久，派出一支九百人的队伍连同家属，前往长阳与宜都交界的梁山。这支队伍伪装成难民，起初的打算是：如果灌湾脑被围的教友突围而出，就把他们接应到安全地带。当灌湾脑的教友突围无望已显而易见时，长阳的叛军便据守梁山的山头。他们在那里杀死了一座寺庙里的和尚，还胁迫当地几十户人家入伙。惠龄扑灭灌湾脑的叛军后，亲自赶赴梁山，同时派前成都将军成德与陕南兴汉镇总兵文图前往资丘攻打林之华，又派七百名江西兵前往巴东攻打覃加耀。在梁山，惠龄又放慢了节奏，借口下雨、路滑、地势险阻，还说自己的肩膀被石头砸伤。直到十月下旬，多亏几名叛军变节者被派回堡寨纵火，惠龄才攻破他们的山顶营寨，歼灭了数百名叛军及其家属。^86\n离开来凤后，福宁前往巴东对付覃加耀。成德稍早于他被派往那里。得到增援的清军使覃加耀在谭家村战败——覃加耀在战斗中负伤——被迫放弃谭家村的堡寨；面对大批清军，覃加耀从巴东奇迹般脱身，前往资丘与林之华会合。在资丘，会合后的叛军——大概有一万五六千人——进行了一番改组。他们设立了五个营，并给头目们封授了都督、总先锋、先锋、提巡、提点之类的官号。这些官号独一无二，不同于许多其他叛军队伍所用的名目。更重要的是，他们采用了一个新年号\"天运\"——意为\"上天的时运\"——尽管这个年号很快便弃置不用。^87 福宁与成德追着覃加耀来到资丘后，加强了围困，并试图切断叛军的水源，迫使他们谋划撤离。叛军在资丘山南的清江上秘密架了一座桥，于十月中旬从重围中成功突围，令人惊愕。如此众多的人——包括妇女与儿童——从眼皮底下溜走而未被察觉拦截，乾隆对众将勃然大怒，革去了成德与文图的巴图鲁名号与顶戴，但二人把责任推给了一名驻扎在叛军架桥处的小军官。^88\n从资丘奇迹般撤出后，林之华、覃加耀的队伍前往黄柏山——清江以南的一座大山，北面濒江，悬崖陡峭。他们在山顶以及山南的高地四方台修筑堡寨；四方台扼守着通往山顶的唯一道路。在黄柏山，起事者们坚守了五个多月，尽管获取给养困难重重。1796年底，惠龄在扑灭梁山的叛军后赶到，但很快又去了襄阳。随后成德被调往川东，围剿的任务留给了福宁。^89\n离开之前，惠龄曾加强攻势，夺取了几处堡寨，但此后的几个月里，福宁没有取得任何真正的进展。^90 他的围剿松松垮垮，与他在来凤相对迅速的胜利形成鲜明对比——而来凤的胜利是建立在孙士毅病逝前的功业之上的。在黄柏山，福宁只专注于阻止起事者获取给养，而不主动进攻。^91 然而，他奏报起事者给养将尽——尽管山中泉水丰沛——数周之后，仍无法取得任何进展。乾隆尖锐地斥责福宁的围剿三心二意，并一眼看穿其奏报中的荒谬之处：如果叛军弹药不足，他们怎么可能打出\"枪炮如雨\"（qiangpaoruyu）？意识到自己对军队的犒赏可能过于大方，乾隆停止了不论战绩人人有赏的做法，只给伤员加发一个月的饷银。^92\n对福宁失去信心的乾隆，把云贵总督勒保派往黄柏山。然而，勒保于嘉庆二年正月十四日刚到黄柏山，就被派回贵州，去对付仲家苗人的一场起事。^93 乾隆随后把满洲正黄旗的额勒登保派到那里。额勒登保家在吉林，世代以采珠为业，不过他的舅舅福德是朝廷高官。乾隆朝晚期的多次战争中，额勒登保冲锋陷阵，得以擢升到旗制层级的最高层。1792年入侵尼泊尔之后，他升为副都统，很快又晋升都统。他虽然识得满文，汉语却不敷用，凡以汉文写奏折，总要靠幕僚代笔。^94 四十九岁的他身体并不太好，但勇猛一如往昔。不过，在福宁的节制之下，额勒登保在白莲教战争中的首秀有失水准。\n1797年三月初，额勒登保到达黄柏山。他很快加强了攻势，认真地试图与叛军交手。^95 不久，三月二十一日，清军攻占了四方台堡寨，打开了通往山顶主寨的门户。^96 再也撑不下去的林之华与覃加耀再次出逃，在一个雾气弥漫的日子，率部穿过无路可寻的深山离去。他们先向南转移到长乐的白玉寨，随后又前往宜昌与施南交界的芭叶山。^97 芭叶山（Bayeshan，意为\"棕叶山\"）同样险峻，林之华、覃加耀的队伍再次在山顶筑寨自固。\n在黄柏山，清军占领了空荡荡的堡寨，奏报说终于荡平了这一叛军据点。乾隆大为恼怒：他的军队又一次放叛军逃到了又一座山上，因为他太清楚，这可能导致又一场旷日持久、耗费惊人的围困。他讥讽福宁与额勒登保，说他们声称部队受大雾与雨水所阻、须等待给养，而叛军却从一座山迅速转移到另一座山。他对战役奏报的怀疑由来已久，尤其恼火的是：他无数次被告知每战杀死叛军几十甚至几百人，可叛军队伍仍有八九千人之众。^98\n正如乾隆所料，芭叶山的围困持续了数月。起事者深知自己给养有限，多次试图突围，没有一次成功。清军这边，即使攻破了山外围的堡寨，也无法接近山顶的主寨。懊丧的乾隆扣下了给所有部队的犒赏，连伤员也不例外，以此逼迫将领们尽快拿下山头、歼灭叛军。^99 六月，福宁与额勒登保加紧进攻，攻取了更多叛军堡寨。然而，六月二十日，林之华、覃加耀的队伍在突围中击破数座清军堡寨，再次令人惊愕地成功出逃，尽管突围中损失了数百人。幸存的起事者迅速转移到建始，试图突入四川，与那里的同党会合。^100 尽管人数已大为减少，叛乱仍在继续。\n武当山以南的起事\n在湖北西北部，南漳、保康、房县、竹山、竹溪诸县夹处于武当山与大巴山之间，是收元教的渊薮。宜都—枝江首起事之后，姚之富之子、这一地区首屈一指的教门师父姚文学动员了他的信徒。与来凤起事一样，姚文学举事的理由并不复杂，只是告诉教众：劫数到了（jieshu daole），别处的同党已经动手了。不过，姚文学所定的起事日期不是三月的龙日，而是\n二月二十日——比来凤起事的日期晚五天，却比龙日早二十天。\n利用该地区清军兵力单薄，教众们二月下旬一经起事，旗开得胜。二月二十日，叛军攻占了保康县城。两天后，竹山县城也落入他们手中，知县自缢身亡。两座县城都没有城墙，各只有几十名士兵把守。与此同时，竹溪、房县、南漳的教众也相继起事，每处都有几千人被卷入叛乱。^101 房县县城同样空虚，只有百来名士兵和少量鸟枪火炮，但这座有城墙的城市早有准备。在知县与属吏的率领下，居民参与了守城，连妇女儿童也帮着往城墙脚下搬运石头。从二月十九日起，叛军数次攻城，都被击退。^102\n此时，文图正应毕沅之邀，从陕西东南部的驻地赶往湖北西部。他一过边界进入竹溪，便与当地叛军迎面遭遇，被缠住了，但很快恒瑞、永保及两千名陕西兵赶来会合。肃清竹溪的叛军后，文图急赴房县县城，恒瑞与永保则前往竹山。在房县城外，文图先于三月初七日驱逐了围城的叛军，随后在数千名当地受雇乡勇的协助下将其消灭。战斗中，姚文学被乡勇杀死。三月十六日，恒瑞经一夜激战，收复竹山县城。三月二十四日，保康的地方乡勇经数日战斗，收复了县城。到四月底，陕西的军队已经扑灭了武当山以南的全部起事。随后恒瑞前往襄阳（永保已于本月初襄阳城遭叛军进攻时先期赶去），文图则前往资丘，协助攻打长阳起事。^103\n在湖北西北端，山区郧县又爆发了一场起事。郧县教门师父徐良虽然已被县官逮捕处决，他动员起来的教众听说竹山落入起事者之手，便于三月初四日举事。他们以随徐良习教的王全礼及其四兄弟为首，两千名起事者在山头筑起四座堡寨。鉴于郧县毗邻陕西，自湖北叛乱爆发以来一直驻节商州的陕甘总督宜绵立即派出部分军队前去对付这些起事者。在从邻近白河雇来的乡勇协助下，延绥镇署理总兵百祥率领的陕西军队荡平了四座堡寨中的三座。^104 四月初，乾隆命宜绵亲赴郧县，肃清那里的叛军。^105\n于是，宜绵与固原提督柯藩越过边界进入郧县，攻打距郧县县城二百里的最后一处叛军据点泥河口。与他们一同行军的还有另一位满洲将领明亮——新任署理广州将军，正奉旨从伊犁前往苗疆战役。^106 四月十二日，他们抵达泥河口。叛军的堡寨筑于悬崖之顶，只有一条窄径可通，但夺取堡寨的战斗进行得极其迅速。清军先派一支小队去切断叛军的水源，意在转移起事者的注意力。当大批叛军前去保护水源时，一小队精兵匍匐至堡寨脚下，投入火弹（huodan），纵火焚寨。趁乱，清军冲入寨中，杀死或俘获了从火中逃生的全部叛军。王全礼也在被俘之列。^107\n宜绵在奏折中虽未明言，这场胜仗的主将必定是明亮，因为他的作战经验远比宜绵与柯藩丰富。明亮出身于镶黄旗满洲显赫的富察氏——他的姑母是乾隆的第一位皇后，他的伯父傅恒担任乾隆的首席军机大臣二十年，直到1770年去世——军旅生涯漫长而辉煌，参加过乾隆朝晚期的多次战争，历任黑龙江将军、伊犁将军。^108 他的堂兄弟福康安与福长安都是和珅的同伙，他自己又尚了公主，但明亮却无意中被划入了和珅政敌的阵营，因为明亮曾在多次战争中担任阿桂的副手。事实上，1784年明亮因对一名流放新疆的高级官员处置失当（导致后者自杀）而被捕、判处斩监候时，正是阿桂奏请将他释放，让他参加镇压甘肃第二次回民起事的战役。^109 然而，到1796年，阿桂已因年事已高、也出于自己的选择，在朝政中被边缘化了。朝中再无有力靠山，明亮动辄受到乾隆的批评与惩处。1795年，明亮又因多年前的一桩过失被参劾：他任黑龙江将军时，曾听任部队私贩兽皮。他因此被褫夺一切职衔，于1795年流放乌鲁木齐，随后才被起复，派去参加苗疆战役。^110\n泥河口大捷之后，乾隆升赏了宜绵与柯藩，对明亮却只赏了\"头等侍卫\"之衔，并让他出任绿营署理总兵——待有缺出时补用——这个位置比他现任的署理广州将军还低。就连这点吝啬的恩典，也得有个说法。按乾隆的解释，理由是明亮\"曾任大员，久历戎行\"（原文待核，见注释111），且是泥河口之战的统兵将领之一。^111 明亮是六十岁的旧派满洲军人，恪守传统的满洲战法：崇尚骑射，重视旗兵，轻视汉兵，更别说临时招募的乡勇了。然而，他对满洲军事专业主义的固执坚守，反而使他与一些态度不同的同侪隔离开来。尽管明亮很快将证明自己是镇压战役初期唯一的雄狮，一个接一个地荡平起事者的据点，他的贡献却常常被贬低或无视。\n孝感起事\n直到1796年初夏，教门起事还只发生在湖北西部，湖北中部与东部大体未受惊扰。有些教门首领曾计划在首轮起事之后于湖北中部举事，例如京山与随州，但这些计划无一成功；策划者不是被捕，就是自杀。^112 然而初夏时节，湖北中部被孝感的一场起事所惊动——孝感在省城武昌西北三十七英里处。\n1796年初，教门中人刘世珍兄弟——他们是孝感人，但在襄阳住了二十多年——回到了孝感。不久，襄阳的教门师父孙在恭也来到孝感与刘氏兄弟会合。直到四月下旬，当地官府在孝感搜捕教众，他们才开始为起事而动员。他们策划的几次起事都被官府在乡勇与乡绅协助下阻止了，最终在五月初六日成事。以刘氏兄弟与孙在恭为首，数千名起事者聚集起来，在孝感城西二十二英里的胡家寨一处山冈上筑寨自固，并击退了当地军队的几次进攻。^113 由于本府驻军大多已调往湖南参加苗疆战役，湖北布政使祖之望请江西派一千名士兵前来，保障武昌的防务。^114\n鉴于孝感的起事直接威胁武昌——武昌街头已发现叛军揭帖，谣言四起——乾隆把正赶往长阳协助围剿林之华、覃加耀队伍的明亮改派孝感。^115 同时，乾隆又命江西再派一千名士兵增援明亮。六月二十一日到达孝感后，明亮把包括江西兵在内的两千多名清军编为四队，开始在胡家寨附近修筑营垒。^116 六月二十六日，清军还在筑营，叛军三次前来攻打，都被击退。次日，数千叛军再次冲击清营。战斗中，明亮派出两支人马夺取叛军堡寨附近的两处高地。叛军惊慌失措，退入以两层木栅环绕的堡寨。此时，明亮下令用火箭（huojian）与火弹焚烧叛军堡寨。恰逢大风，堡寨大半被烧毁。许多叛军及其家属葬身火海，还有许多人投入壕沟溺死。次日火势自熄，清军俘获了数百名起事者及其亲属，其中包括刘世珍（他的兄长与孙在恭已在堡寨被毁时丧生）；许多人是从壕沟里捞出来的。^117 孝感起事——这场唯一能对湖北政治中心构成直接危险的起事——就这样在明亮到达一周后走向终结。这场速胜日后将有助于明亮在战役中身处逆境之时：每当皇帝需要为他留在战争中找理由时，它就会被一再引用，算作明亮的功绩之一。对明亮本人而言，孝感的成功是一段珍贵的记忆，是他晚年爱讲的故事。^118\n襄阳起事与永保的主帅之任\n襄阳的起事比别处的起事晚了数周，其首领们似乎想恪守预定的龙日。二三月间，几处地方爆发了几场小规模起事，随后起事者聚集到襄阳城与汉江以东的黄龙垱，汇成一支万人的队伍，其中一些人来自河南。^119 起事一开始，首领们就派信使到河南寻找刘之协——刘之协此时藏在南阳——但没有找到。不过，首领们有意对刘之协是否与他们在一起秘而不宣，这使清方一度大惑不解，后来才查明刘之协并不在起事者之中。^120\n刘之协不在，姚之富与另外几人便走上前台，给其中几人封了\"元帅\"（yuanshuai）之号，不过他们之间的等级次序并不清楚。^121 王聪儿离开了1794年丈夫被处决后她所居的尼庵，加入了起事。然而，包括被俘叛军供词在内的各种记载都表明，1796年的她并不拥有任何领导权。^122 在那些\"元帅\"之中，只有王廷诏属于混元教，其余诸人皆与收元教有关。王廷诏五十出头，襄阳教众称他为\"王大叔\"（Wang Dashu）。王廷诏是河南西华人——西华距鹿邑不远——他家与鹿邑王家菜园的王姓教门家族有些渊源。据王廷诏向审讯者供述，他的祖父曾是教门社群中的显要人物，直到1801年被捕，王廷诏一直随身带着祖父的画像。^123 王廷诏可能是在1775年查禁混元教期间离开家乡的。他没有告诉审讯者此后直到1796年他身在何处，并坚称自己不曾从事任何传教活动；但极有可能，他一直活动于南阳与襄阳交界的地区，以教门为业谋生，尽管他同时也可能做点小生意——这是他向审讯者的说法。那些年里，王廷诏想必与刘之协打过交道，尽管他即使在刑讯之下也没有吐露这一点。尽管笼罩在他身上的谜团重重，有一点是清楚的：王廷诏是襄阳教门社群核心领导层的一员，且备受敬重。^124\n武当山以南诸起事的迅速崩溃，断送了襄阳叛军西进的机会。于是，他们转而向北。在襄阳东北的双沟筑垒自固后，他们于四月派出斥候，前往河南邓州与新野之间的边境地区侦察。^125 河南教门网络虽然稠密，湖北西部动荡之时，河南大体保持了秩序，这在某种程度上要归功于河南巡抚景安采取的预防性措施。湖北首起事之后，景安迅速逮捕了他认为可能煽动起事的教众，并加强了襄阳边境沿线的军事力量。^126 襄阳叛军骚扰其边境地区时，景安增派了军队，并在当地招募乡勇，同时恳请朝廷增援。陕西的五百名绿营兵已经到达襄阳，但景安想要的是北京健锐营与火器营的精锐之师。尽管担心叛乱可能蔓延到河南，乾隆对动用这些精锐旗营一直犹豫不决，理由是难以找到统领他们的将领——当阳陷落后他拒绝毕沅调京旗之请时，说的也是这个理由。^127 在乾隆的言辞中，旗兵应当留作与外敌进行的边疆战争之用，让他们去同乌合之众的叛军作战是丢脸的事。\n对乾隆而言，更紧迫也更重要的，是一位得力的统帅。四月初一日，他改派鄂辉去襄阳，而不是去当阳。^128 然而，鄂辉到达襄阳后，并不打算迅速消灭叛军；他只打了一天就收兵了，尽管他兵力充足。失望的景安向朝廷诉苦，说他无法理解鄂辉的道理。^129 鄂辉并不认真与起事者作战，而更专注于请求增援。他执意要求向湖北调派满洲旗兵或索伦兵，理由无非叛军人数众多、绿营兵与受雇乡勇不堪一战。^130 乾隆不为所动，只同意从直隶南部调两千绿营兵，并从北京派二十名带巴图鲁名号的侍卫前往统领。^131 乾隆甚至向鄂辉建议，可以起用流放湖北、河南的蒙古盗马贼——他们骑术高超，又渴望赎罪后重返蒙古，可以成为好兵。^132 然而，乾隆很快决定把襄阳战场的指挥权交给永保。\n永保出身满洲贵族家庭，镶红旗费莫氏。他的父亲温福是第二次金川之役的主帅，1773年在一场夜袭中阵亡。乾隆起初以忠烈褒恤温福，后来又因那场数千清军覆没的败仗而归咎于他，从而褫夺了永保承袭自温福的一等伯爵之位。^133 不过，温福身后之辱并没有影响其子们的仕途。永保是兄弟二人中的弟弟，曾随温福出征金川。那个致命的夜晚，他冒着敌军的飞矢，抢回了父亲的遗体。然而，此后的任官大多是文职。直到乾隆朝最后几年，他才被调任新疆的军职。进京途中听说当阳陷落，永保恳请朝廷准他参加湖北的战役。尽管永保军功寥寥，乾隆却认为他\"于军务尚为谙习\"（原文待核，见注释134）。^134 福康安想必是在第二次金川之役中结识永保的，也举荐他主持襄阳的战役。^135\n永保于夏天接掌襄阳军事指挥权时，起事者在这一带扎下根来的图谋正节节败退。四月初，他们焚毁了没有城墙的樊城，随后试图夺取襄阳城，没有成功。在鄂辉麾下的数千清军凭借火器，击退了大队叛军从三个方向的进攻，叛军方面伤亡数千。^136 历史上，襄阳城因控扼长江上游河谷与中原的战略地位，常常成为交战各方激烈争夺之地。^137 因此，叛军夺城之败并非小事。恒瑞与永保到达后，双沟的叛军陷入了困境。然而，他们很快展示出胜过湖北其他地方同侪的长处：他们不在一处死守，而擅长运动。五月十六日，清军对双沟的叛军总部发动强攻，却发现数以万计的叛军主力早在几天前就已撤离，转移到东面十三英里的官庄。此后数周，襄阳的队伍不断迅速移动，先向东到枣阳，随后陡然折向南。七月初，他们逼近汉江东岸的中等城市钟祥。途中虽然遭受了一些挫折，叛军还是成功击退了清军的拦截，完成了被围的家乡地区之外的第一次长途跋涉。^138 从钟祥出发，他们既可与当阳、枝江的叛军会合，也可与孝感的叛军会合，从而对武昌构成威胁。\n此时，乾隆再也按捺不住对毕沅与惠龄的怒火——他们在当阳、枝江的围城旷日持久。六月初九日，他任命永保为湖北全军统帅，不久又让永保署理湖广总督。^139 然而，永保就任统帅后的第一件事，是停下重大军事行动，同朝廷讨价还价。他声称打算对钟祥的襄阳叛军发动总攻，为此请求从苗疆战役调两三万军队到湖北。当阳最终收复后，永保于七月底赶赴当阳，与毕沅会面。随后他请求让毕沅复任总督、继续主持后勤事务，而自己只保留战役统帅之职，因为他无法同时应付两个职位带来的职责。急切盼望永保在钟祥决战，乾隆批准了永保的全部请求。此外，他还加授永保\"太子太保\"荣衔，并授永保麾下将领庆成\"太子少保\"之衔。同时，乾隆几乎掩饰不住对永保的不满乃至恼怒——永保行动迟缓，拖得太久了。^140\n行动开始之前，永保又提出了一个请求：把正赶往宜都—枝江战场参战的明亮改派钟祥。八月初明亮到达钟祥前线时，那里已经集结了一万多名清军。^141 按照永保的计划，清军将对据守钟祥城北的五至六万名襄阳叛军发起南北夹击。然而，明亮很快发现，永保把九千多名士兵布在北翼，却只在南翼摆了明亮与另一位将领德光所率的四千人。明亮气愤地抱怨之后，乾隆一再批评永保自私，并下令推迟战役，直到各方向都布置好足够的兵力，以便在这场决战中一举歼灭襄阳叛军。\n八月二十四日，清军发动强攻。激烈的战斗直到次日清晨才结束。这对叛军是一场彻底的灾难，数千人被杀，数千人被俘，其中包括许多妇女与儿童。尽管如此，清军未能全歼叛军。叛军及其家属按战前计划分成小队撤离。^142 明亮再次显示出他的干练，从南面一路穷追猛打。永保却没有完成他那一路的夹击，听任叛军向北逃去——尽管北翼配备了最重的兵力。事后，永保在奏报中贬低了明亮的贡献。结果，除明亮之外的所有主将都获得了升迁或奖赏。明亮咽不下这口气，上了一道密折，指控永保纵敌脱逃——这道密折直到1799年才公之于众。\n直到1799年嘉庆皇帝第二次将永保革职时才公之于众。在嘉庆看来，钟祥之战未能全歼襄阳起事者，导致叛乱蔓延到陕西与四川，使之迁延如此之久，永保对此负有责任。^143\n钟祥惨败之后，襄阳起事者分批撤回襄阳，在双沟重新集结。但清军很快赶到，从几个方向进攻，叛军伤亡数千。为打破双沟之围，襄阳队伍兵分两路：姚之富率一路向东，前往枣阳，再入河南唐县；张汉潮率另一路向西北，逼近河南邓州——两路的目标都是进入河南。然而，勤勉的景安在起事者返回襄阳一带后，早已加强了河南边境的戒备。九月初，湖北军队截击了姚之富一路。战斗中，姚之富的母亲、儿媳与孙辈被擒。张汉潮一路渡过了白河，逼近吕堰驿，也未能突入河南，转而南下，与姚之富会合。^144\n八月三十日，苗疆战役的统帅和琳病逝（福康安已于当年早些时候去世）。乾隆急于结束苗疆战役，以便腾出军队对付湖北的教门叛军，决定把明亮与鄂辉从襄阳战场调往苗疆战役。^145 明亮与永保之间的龃龉也是明亮被调走的一个因素——连北京的官员都有所耳闻。^146 明亮的离去削弱了湖北的战役，那里只剩下永保、惠龄之类的平庸将领。不过，这也给了他们要求更多兵力的更强借口；永保、毕沅、景安都恳请朝廷向湖北增派援军。^147 大概确信明亮的空缺只有用更多更好的军队来填补，乾隆让步了。他批准了景安的请求，从山西调一千名士兵到豫鄂边境，阻止叛军窜入河南。对湖北，乾隆不仅同意调派永保所请的四千名绿营兵（直隶、山东各两千），还决定从京城两大精锐营——健锐营与火器营——各派一千名旗兵，而不是湖北将领们所请的五百名吉林旗兵。^148\n这七千名援军是叛乱爆发以来最大规模的一次部署。更重要的是，这是满洲旗兵第一次从战区之外被调派（此前只动用了荆州、西安驻防的数千满洲旗兵）。鉴于湖北西部的大多数起事已被平定——幸存的只有襄阳队伍与被围于长阳的林之华、覃加耀队伍——乾隆一改早先坚决不用旗兵的立场，凸显出他急于尽快了结战役，希望大兵压境能解决问题。这也表明，他开始被前线的将领们所动摇，屈从于他们大声而反复的请求。不可避免的是，从北方调派大批军队会大大推高军费。这次部署之后的数月之内，数百万两白银被解往湖北（其中一小部分解往河南）。湖北的战役由此变成王朝的一场重大而昂贵的行动。同样，战区的腐败也将日益猖獗。\n到1796年底，一万五千至一万六千名清军——包括两千名来自京城的精锐旗兵，全部骑马——已经聚集在襄阳一带。^149 然而，攻势毫无起色；永保及其同伙未能阻止起事者的运动，而起事者的人数——包括家属在内——已减少到也许不足一万。十一月初，叛军渡过滚河，转而向西，目标指向光化与谷城。西进与入豫的图谋都失败后，他们又折回黄龙垱——他们叛乱的发源地。^150 令乾隆大失所望的是，永保没有表现出在可预见的将来消灭叛军的决心，甚至没有这样的打算。相反，他的策略是：以庞大的兵力松松垮垮地围住叛军，零敲碎打地发动攻势，却总是听任叛军破围而出，转移到另一个地方。如果说乾隆此前曾相信，永保在襄阳战场的可怜战绩主要应归咎于兵力不足，那么现在他再也不信永保的借口了。精明的乾隆一眼就看出，永保及其同伙是在拖延。然而，除了严厉而反复地斥责他们不肯全力作战，他也做不了更多。^151\n对清朝国家而言幸运的是，战区里有一位不肯对此类行为视而不见的督抚。景安是和珅的远亲，这或许使他更有胆量揭露同僚们的不端行径。不过，与和珅不同，景安博得了\"不贪财\"的名声。^152 有时，景安关于豫鄂边境战事的奏折比永保等人的还先到北京。景安频频揭露永保及其他将领的欺诈行径，使自己成了他们的眼中钉。景安身陷危局时，他们也不会伸出援手。1796年的最后几天，数千名叛军试图攻打邓州。景安与数百名士兵在邓州附近被叛军围困时，永保与恒瑞虽然都在近旁，却没有派出一兵一卒救援。^153 此事发生后，景安立即奏请朝廷，把调到湖北、隶属永保麾下的两千名河南兵调回——他明白，除了自己，谁都指望不上。^154\n到嘉庆元年年底，乾隆对永保的耐心与信心已荡然无存。他确信，当初选择永保担任统帅是个错误；只要永保留任，镇压战役就不可能很快结束。^155 乾隆先给了襄阳前线的四位将领——永保、恒瑞、庆成、舒亮——一个象征性的处分：摘去他们翎羽顶戴。随后，乾隆命当时正在黄柏山前线攻打林之华、覃加耀队伍的惠龄赶赴襄阳，接替永保出任统帅，从而成为第一位以总督兼任的统帅。不过，他还是给了永保一个将功折罪的机会：如果永保能在惠龄到达之前全歼襄阳叛军，就可以得到宽恕。1797年初，景安奏报永保又未能拦截叛军，乾隆遂下令：惠龄一到，立即将永保革职。1797年新年（1月28日）过后不久，永保被逮捕，押送北京受审。^156\n然而，与乾隆的期望相反，永保的去职——这场战役的第一次更换统帅——没有激励襄阳的其他将领，反而令他们泄气。惠龄于十二月十九日到达襄阳后开始查办永保，恒瑞、庆成、舒亮都不肯配合。惠龄很快掉转立场，为永保辩护，声称永保兵力不足，叛军又更熟悉当地情形。同时，惠龄又试图为那些因永保拖延战事时未曾干预而遭到乾隆严厉批评的将领开脱。^157 后来披露的事实表明，这些将领以及湖北的一些省级官员早已抱成一团，从拨往襄阳的大笔军费中渔利。通过操纵襄阳的军需局主管胡齐仑，将领与官员们——包括明亮与鄂辉——频频以犒赏士兵为名，或者干脆作为馈赠，从胡齐仑那里收取银两（此类馈赠以永保所得最多）。 或许是为了让永保对朝廷此时尚不知情的这些勾当保持沉默，襄阳的小圈子在永保被捕后仍继续讨好他。永保囚禁北京、家产被抄之际，毕沅还从军需库中给他送去数千两银子。毫不奇怪，新任统帅惠龄很快也加入了这个小圈子，从胡齐仑那里收钱。^158 在河南一界之隔的地方，襄阳战役唯一的批评者、与军费丑闻无涉的景安，则彻底孤立了。尽管景安成功揭发并扳倒了永保，战区的那套风气依旧如故——有没有永保都一样。\n四川的起事\n1796年上半年，湖北西部陷入起事浪潮之时，四川却出奇地平静。尽管襄阳的教门中人曾派\"通会人\"（tonghuiren）前往川东，传达他们关于龙日起事的决定，达州直隶州的同党直到秋天才有所行动。^159 那里的许多教门信徒是啯噜匪徒、私盐贩子、伪钱制造者与无业流民，托庇于富有的教门东主家中；他们对混元教、收元教教义中根深蒂固的末世论，未必像虔诚的信徒那样热衷。直到湖北起事的高潮过去、许多湖北叛军投奔达州教众避难之时，达州的叛军才被催逼着行动起来。九月，两场起事在相隔不远的地方相继发生。第一场于九月十五日爆发于距达州州城三十一英里的亭子铺，由达州教首徐天德领导。^160 据说一万多人加入了起事，包括家属与来自湖北的人。^161 由于起事者执黑旗、着黑衣——而不是像湖北那样用白色——他们的队伍被称为\"青号\"（Qinghao，即黑号）。几天之后，王三槐又领导了东乡莲池沟的一场起事。王三槐是算命先生，习教已有数年；地方官员搜捕教众时把他母亲等家人关押起来，使他变得激进了。东乡起事的另一位关键人物是冷天禄，东乡本地人，王三槐的教门师父。他们聚集了约七百人，于九月二十二日率众前往丰城，在那里筑寨自固。^162（地图1.3）\n四川省级当局对起事的应对十分被动。他们的大批驻军虽已调往湘西参加苗疆战役，孙士毅又带着剩余的一千多名士兵去到来凤作战。来凤起事平定后，成都将军观成率领的那些军队又被派往黄柏山。达州城里只剩几十名绿营兵。尽管如此，乾隆于十月初五日听说达州首场起事时，并不太担心，把它当作一桩小事打发了：\"达州匪徒不过乌合之众，无须张皇。\"（原文待核，见注释163）^163 他只是催促福宁与观成把一部分四川军队调回，并同意派一些陕西兵前往达州。^164 与此同时，四川官员也恳请明亮及苗疆战役的其他将领，把重庆镇总兵袁国璜及其五百名士兵放回。这一请求虽获允准，那些四川士兵到达达州前线却需要时间。^165 署理四川总督英善只能拼凑一支五百人的远征军，并在前往达州途中雇了两千名平民充当乡勇。十月初一日抵达达州后，英善号召当地居民组织乡勇，与起事者作战。^166 事实上，一些当地的绅士——文武生员——早已组织乡勇自卫。官员们很快介入，征调了许多乡勇协助正规军，随后给他们发饷银与津贴。尽管湖北开创了收编乡勇为非常规兵员的先例，四川很快就在这一做法的规模与开支上超过了湖北。\n十月，巴州与通江又爆发了两场起事。通江与巴州地处大巴山南麓，多山而耕地匮乏，但教门网络分布极广。达州两场起事之后，地方官府加紧在这两县搜捕教众。经徐天德信使联络，巴州教门首领罗其清——一个织布匠（起义前不久，因近来的旱灾折损了织布手艺，他开了一家饭馆）——聚集了一千多人，在方山坪举事。罗其清用白旗，其队伍被称为\"白号\"（Baihao）。几乎同时，通江的冉文俦与其侄冉天元发动了另一场起事。他们用蓝旗，其队伍被称为\"蓝号\"（Lanhao）。^167 此后的岁月将证明，这两支队伍中的许多叛军，是叛乱中最强悍、最能战的一部分。\n在乡勇的协助下，四川的军队把叛军挡在了外面。到达达州四天后，英善从叛军手中夺回亭子铺，随后接连荡平了叛军的堡寨。徐天德的儿子在守卫一处要地时阵亡，徐天德随后转移到东乡。徐天德的计划是与王三槐会合，退入太平的山中，尽管他们也曾考虑与湖北的同党会师。^168 太平地处四川东北角，多山而人烟稀少。达州、东乡起事之后，来自湖北的教门师父孙士凤——人称孙老五——又在太平发动了一场起事。^169 四川的叛军随后派信使前往陕西的兴安府煽动叛乱。兴安是教门重镇，1796年早些时候曾爆发几场小规模起事，都被迅速扑灭。^170 陕西巡抚秦承恩与柯藩立即赶赴兴安，对付新起的叛乱（二人此前已前往太平，阻止四川的叛乱蔓延到陕西）。与此同时，陕甘总督宜绵计划率二千七百五十人的远征军前往达州，支援四川的同僚，因为那里的动荡威胁着本省的稳定。不过，宜绵很快改变了行程：他不得不在兴安停下，帮助陕西同僚镇压刚刚爆发的几场起事。^171\n陕西的起事\n与湖北、四川的战役相比，兴安的战斗速战速决；五场起事在两个月内全部被平定。与湖北的大多数叛军一样，兴安的叛军撤上山头，修筑堡寨木栅。兴安的山属大巴山系，比湖北西南部的山更高、更陡、更险。宜绵与秦承恩、柯藩会合后，陕西军队先攻打安岭的叛军，因为安岭靠近兴安府城。他们从几个方向发起进攻，用火弹焚毁叛军堡寨。十一月中旬的短短两天里，清军就荡平了这处叛军据点，战斗中杀死数百人，又俘获数百人——俘虏随后也被处死。^172\n这场战斗一结束，陕西军队就转攻将军山的叛军山头。将军山在汉江北岸，靠近一条通往西安的孔道。与安岭之战一样，清军沿着陡峭狭窄的山路强行攻到叛军堡寨前，用火弹与大炮（大炮已运上山）摧毁叛军堡寨。数名叛军首领被炮弹击毙后，剩下的一千名叛军投降了。投降者中有许多人被处死，因为官府认为他们曾与清军作战，只是迫不得已才投降。^173\n宜绵等人攻打将军山堡寨的同时，甘肃肃州镇总兵索费英阿率领的一支人马正在汉江北岸紫阳的米溪与叛军作战——那里的叛军把堡寨筑在四周环绕稻田的山丘上。数日激战之后，幸存的叛军焚毁了堡寨，退到一座山顶作最后的抵抗。清军切断了他们的水源，并击退了汉江南岸派来的一支叛军援军。十一月二十六日，剩下的七百余名叛军投降。投降者中又有许多人被处死。^174\n米溪之战后，宜绵与柯藩前往汉江以南的五座云——米溪之战中叛军曾从这里派兵援救教友。五座云格外险峻：这个山间小镇为五座陡山所环绕，山的东、南、西三面又有三条河流——洞河、汝河与大道河。五座云不仅地处险要，叛军还在通往五山之间山丘总部的一切可能通道上修筑了许多堡寨，构成一套复杂的防御体系。连日的大雪使清军无法发动进攻。然而，他们却选在雪下得更大的十二月十六日发起决战，令叛军措手不及。凭借火器——尤其是随身运上山的大炮——清军得以一个接一个地扫平敌方堡寨。火弹够不到叛军总部，士兵们便用火箭把叛军总部付之一炬。四天之内，陕西军队会同数百名湖北竹溪的乡勇，几乎全歼了这一据点中的起事者，数千人或被烧死，或被杀。只有少数人逃脱，其中包括这场起事的一个首领、四川人王子坚。^175\n这场战斗之后，宜绵与索费英阿前往太平，把对付兴安最后一场起事的战斗留给了秦承恩与柯藩。叛军最后的据点在安康与太平交界的光头山（意为\"光秃的山\"）。在群峰之中，一座高峰四面峭壁，顶部是一块巨大的盆地，叛军在那里修筑了多重防御设施和半地下式的土墙居所。叛军首领是王刘氏——一位姓刘、嫁入王家的女子。\n她的信徒相信她就是\"无生老母\"。由于宜绵已率部分陕西军队入川，秦承恩与柯藩在当地招募了更多乡勇。为降雪所阻，这场战斗持续了约两周。士兵与乡勇先攻取了叛军的哨卡，随后在光头山对面的山丘上架起大炮，轰燃叛军的木制堡寨。嘉庆二年正月二十五日，清军攻破了叛军总部。据报道，两千多名叛军及其家属——包括王刘氏本人——或死于战斗，或葬身火海。另有二百余人被捕，其中包括王刘氏的几名副手，他们随后被凌迟处死。^176 陕西南部由此肃清了起事。\n血腥之春\n与此同时，四川的局势对镇压者而言正日益恶化。在巴州与通江，蓝号与白号轻松地在山顶筑垒自固，因为清方没有多余的兵力去对付他们。1797年初，罗其清率众攻打巴州城。他们未能破城，但杀死了几名下级军官。^177 达州的起事者保持着势头。十一月下旬，他们在东乡的横山子与清军激战数日，随后在一个清晨对清军营垒发动突袭，几乎全歼了营中数百名士兵，并杀死了战功卓著的袁国璜与兴汉镇新任总兵何元卿。^178 二人刚刚抵达川东（袁国璜从苗疆战役归来，何元卿从黄柏山前线赶来），是这场战役中最先阵亡的高级军官。^179\n这场惨败使乾隆警觉到川东北冲突的严重性，也使他意识到需要派一位比英善更有经验的将领。乾隆命在陕西屡战屡胜、深得其赞许的宜绵主持四川的战役，并催促福宁与观成尽快结束黄柏山的围困，随后赶赴四川。不久，乾隆改了主意：他命观成率五百名士兵立即返回四川。^180 然而，援军到达之前，徐天德与王三槐于十二月二十九日——新年前两天——攻占了东乡县城。数名从外省征调来协助战役的清军军官与书吏被杀。最令清朝震惊的是：成都驻防旗兵的前副都统佛住——他在赴新疆新任途中，自请返回四川与叛军作战——被叛军俘获杀害，成为战争中第一位阵亡的高级旗人。^181\n尽管知道东乡失陷，宜绵在元旦次日进入四川时，还是决定先肃清太平的数千名起事者。在太平，孙老五的弟子何如惠所领导的起事者——孙老五听说宜绵从陕西逼近，已前往东乡求援——据守三处相距不远的据点。由于宜绵已派索费英阿率一千名士兵前往东乡，而他所调的甘肃援军尚未到达，他便招募了更多乡勇，并指派幕中的文官统领他们。正月初七日，宜绵同时攻打三处叛军据点。士兵与乡勇炮击叛军筑于陡崖上的壁垒，并向其中投掷火弹。堡寨起火、叛军大乱之际，清军破寨而入。一周之内，三处据点全部被荡平，大多数起事者或被杀，或被俘（何如惠在战斗数日后被擒）。^182 太平暂时恢复了平静。\n二月初五日到达东乡后，宜绵与侍卫明兴——明亮之兄——及其五百名士兵会合。东乡县城没有城墙，叛军已在几处山头筑垒自固。宜绵与明兴逼近时，他们放弃了其中两座堡寨，把主力集中到城附近的三处据点。大约同时，冉文俦率其数千名起事者在王家寨的山顶修筑壁垒；王家寨距罗其清方山坪的据点不远。于是，宜绵派百祥率数千名士兵前往王家寨。为援救教友，徐天德率其数千人马前往王家寨，这削弱了张家观——一处俯瞰东乡的高地——的叛军力量。二月初十日，宜绵攻打张家观，用火箭引燃叛军的弹药库，引发爆炸，迫使叛军弃守这处据点，四散而去。宜绵与明兴随后收复了东乡县城。与此同时，徐天德在驰援冉文俦途中遭清军截击。得知张家观失守，徐天德率部退回东乡的另外两处据点。^183 其中一处据点位于清溪场，可容纳数千人；另一处金峨寺（意为\"金顶之寺\"）更加宽敞，可容纳更多人，且三面悬崖，极难接近。起事者顽强抵抗，有时甚至反攻敌方大营，清军攻取这两处据点因此并不顺利。^184\n此时，由于明亮1796年底的加入，湘黔两省针对苗民叛乱的两年战役已近尾声，那里的军队被调往川东。四川川北镇总兵朱射斗及其两千名士兵率先返回，正好赶上收复东乡之战。三月初，明亮与德楞泰——一位蒙古旗人、宫廷侍卫——率三千名四川兵与三千名云南兵抵达达州。^185 柯藩及其陕西军队在平定陕南最后一场起事后也赶到了。清军合计约两万人，对叛军据点发起决战。^186\n尽管乾隆对明亮委以重任，在两场战役之间让他辗转于各个热点，他却不肯放过任何挑剔明亮的机会。金峨寺一战的奏报中，明亮把自己的名字置于宜绵之前，乾隆斥责他抢夺宜绵之功，因而赏赐了除明亮之外的所有将领。对明亮更为不利的是，乾隆命他前往湖北\"协助\"惠龄，且不得带兵。对明亮有利的是，宜绵是他的多年老友。二人幼时一同读书，后来都参加了第二次金川之役，此后又在新疆共事。正如宜绵所说：\"我等极为亲近，凡事皆推心置腹。\"（原文待核，见注释187）宜绵恳请乾隆把明亮留在四川，因为明亮的军事才能与经验远胜于自己，而四川的叛军又远比陕西的凶悍。然而，宜绵热切的恳请还没送达朝廷，乾隆已经改了主意。他让明亮留了下来——或许他意识到，没有明亮，四川的战役不知何年何月才能了结。^187\n四月初三日，明亮对金峨寺与清溪场发动总攻。他们摧毁了清溪场据点，俘获了叛军首领之一的王学礼。在金峨寺，王三槐率数千精壮叛军于黄昏时分向清军冲锋，徐天德则率家属从山后悬崖缒下，向重石子据点转移。次日，清军攻占金峨寺，王三槐却脱了身。此后，两万多名叛军主要聚集在东乡的重石子与香炉坪。^188 在巴州，清军于四月中旬荡平了王家寨据点，并击退了罗其清派来的援军。不过，冉文俦率领的幸存起事者转移到了罗其清方山坪的据点，尽管两支队伍并没有合并。^189\n俘虏王学礼的人相信他是达州叛军的智囊，便让他写信召唤同伙投降。起事者佯装被王学礼的说辞打动，派了几个人（他们声称其中一人是王三槐）到清营谈判。双方达成协议：所有叛军首领于四月十八日前往双庙场（意为\"双庙集市\"）投降。到了约定的日子，数千名清军在会面地点附近布下阵势，企图趁叛军首领外出时偷袭叛军总部。与此同时，起事者也在附近的山谷里藏了数千人马，希望找到机会救出王学礼。然而，双方很快都识破了对方的计谋；一场假停战变成了一场战斗。前往会面地点的队伍中的王三槐逃走了，王学礼则事后被处死。^190 王学礼之死令叛军痛心疾首，此后数日，他们发动了猛烈的攻势，一度甚至企图夺取达州城，但这些进攻都被逐一拔除他们哨卡的清军挫败。^191 进入五月，两处据点的给养行将耗尽，起事者试图突围。在一次突围中，王三槐负伤，多亏另一名叛军首领把自己的坐骑让给他，他才侥幸脱身。^192\n苗疆战役结束时，四千名广东、广西士兵按明亮与德楞泰的请求调往四川。^193 五月二十六日，得到增援的清军在东乡发起决战。他们先用火器点燃了重石子的壁垒，数千名叛军及其家属被烧死。在香炉坪，叛军撑了半日，并数次向敌军冲锋，直到明亮率众强行攻上山顶，把燃着火的箭头射入堡寨。大火吞没了整个据点，数千人被烧死。次日，清军又追击溃散的起事者。在这场堪称四川最惨烈的战斗中，据说有一万人被杀——清军还割下了两千多颗首级。^194\n这场惨败之后，幸存的叛军分作两股，在靖忠寺（意为\"忠烈祠\"）附近扎营。六月初，明亮等人击溃了徐天德与王三槐所率的一股，但清方也损失了数名军官，其中包括战功卓著的满洲旗人锡金泰。^195 尽管叛军勇猛——迎着清军炮火枪弹，疯狂地向清军冲锋——他们已陷入混乱，丢弃了装备与家眷；徐天德与王三槐的母亲都在被俘之列。不久，王三槐的妻子与女儿也被俘；徐、王一股只剩下两千人或更少。与此同时，德楞泰歼灭了另一股约一千人，杀死了其首领孙老五。^196 在巴州方山坪，蓝号与白号面临给养短缺。他们试图突围，还多次派人到附近田里收割麦豆，都没有成功。^197 然而，百祥率领的围困方山坪的清军没有给叛军施加足够的压力，叛军得以在山顶耕种——正如其名所示（方山坪意为\"方形的山顶平地\"），山顶平坦而开阔。^198 到1797年夏天，达州、新宁、太平三地为避乱离家的居民纷纷返乡，凭借官府提供的补贴恢复了农作。连东乡、巴州一些地方的人也回了家，因为战事已被限制在山中。^199\n叛军与镇压者\n到1797年夏天，叛乱正在退潮。除了正长途跋涉入川的襄阳队伍和游荡于湖北西南角的林之华、覃加耀一股（见下章），湖北的其他起事都已被镇压。在四川，达州叛乱丧失了大多数最初的追随者，已基本被摧毁。蓝号与白号被围于巴州，无力发动任何攻势。在陕西南部，五场起事都在一两个月内被粉碎，堪称清朝镇压战役中最成功的篇章之一。尽管教门首领们利用清朝镇压黔湘苗民之机，颇为巧妙地择时叛乱，并成功地在湖北各地同步举事，领导力的缺失从一开始就注定了他们事业的失败。\n首先也最重要的是，刘之协在叛乱前夕的弃离影响深远。没有别的教门首领拥有堪与刘之协相比的声望，起事者中始终没有产生一个能够号令所有队伍的领袖。与此同时，三省各场起事的首领都未能利用信徒们对武装号召的热情响应，也未能以任何形式阐明并颁布他们的纲领。几乎所有的起事都抛弃了建立新政权的政治抱负——而这正是混元教与收元教预言的核心——只有襄阳与长阳的叛军各自采用了自己的年号，但哪一个也没有真正使用过。^200 同样，他们对异族的满洲统治者缺乏义愤，更不用说用以吸引参与者的民族主义讯息了。正如嘉庆皇帝1800年所评论的：\"所有贼首如姚之富、齐王氏、王三槐、冉天元、高均德、张汉潮等，不过横行劫掠，苟延性命。彼等并不敢僭立年号、占据城池，以图大逆。\"（原文待核，见注释201）^201\n四川的叛军既纲领模糊，战略上又固守本土。尽管他们自认属于以襄阳为中心的教门运动，在早期的一些时刻也渴望与湖北的同党会合，他们却不愿离开家乡地区。湖北的一些同党也表现出这种倾向。^202\n与半个世纪后的太平军不同，白莲教叛军并没有建立一支名副其实的军队。与此前的教门叛乱一样，许多队伍给头目们封授了\"元帅\"（yuanshuai）、\"总兵\"（zongbing）、\"先锋\"（xianfeng）、\"旗手\"（qishou）、\"探马头\"（tanmatou）之类的名号，却没有形成一个与这些职位相配的等级结构。^203 叛军不是把作战部队与家属分开，而只是松散地把精壮男子指定为\"战手\"（zhanshou）或\"矛手\"（maoshou），却不把他们编成任何建制。他们中间总有大量妇女。尽管许多妇女参与作战与领导——如襄阳的王聪儿、陕南的王刘氏——大多数女性起事者都随家属行动；被俘的妇女常常被首领们纳为妻妾。战斗中，家属的伤亡总是远比士兵惨重，在危急关头还容易被抛弃。清军常常先俘获叛军首领的家属，再俘获首领本人。战争后期，男叛军甚至为了加快行军而杀死自己的妻儿。\n除缺乏强有力的领导之外，起事者在与镇压者作战时也没有展现出有远见且可行的战略。他们组织涣散、装备简陋，无力夺取地盘、攻占城镇。房县之围便是一例——守军只有一百人，他们却攻不下来。即便襄阳起事爆发后势头正盛，叛军也未能拿下樊城与襄阳双子城。当阳的叛军虽然据城五个月，围城的旷日持久却更多要归因于清军的无能，而非叛军的力量。^204 其他落入起事者之手的城市（常常是因为城市没有城墙），如武当山区的保康、竹山与四川的东乡，也都只据守了很短时间就被清军收复。事实上，几乎所有的起事从一开始就遭到清军围困。结果，叛军各股不得不为生存而挣扎，而不是采取协调一致的行动去扩大叛乱。^205 除襄阳叛军外，各股叛军通行的生存之道是就近撤上山头，据险自守。讽刺的是，在冲突的第一阶段，\"坚壁\"竟是起事者的主要战术。凭借地理屏障以及他们修筑的精巧而原始的防御工事——通常筑起数层木栅，储放滚木礌石以资投掷，有时在堡寨四周挖掘壕沟，还掘断一切道路或布设地雷——叛军及其家属得以坚守一段时间。清军的拖延有时也延长了他们的存活。但给养短缺——有些地方还有水源短缺——最终会折损山顶战术的优势。此外，他们的堡寨大多由易燃材料建成，易受敌方火攻之害。\n回顾起来，襄阳叛军未能攻克襄阳城，对他们来说并不全然是坏事，因为他们得以避免别处同侪的命运：被围、被困、被征服。无山可守、无城可据，襄阳起事者诉诸机动作战。从1796年夏天起，他们便熟练地运用这一战术。他们不仅不断快速运动，还常常分兵数股，以分散镇压者的注意力。1797年上半年，他们的运动战使他们取得了对追击清军的优势，常常令镇压者晕头转向。此外，正如清朝官员所指出的，他们的运动还帮助他们招兵买马：当他们经过湖北西部、河南南部与陕西南部的教门据点时，得以补充新血，充实不断萎缩的队伍。^206 有些教门中人如果只是听说别处起事，未必会心动行动；但当叛军来到自家门口时，他们更可能被说动。\n除招募教门中人与其他愿意加入者之外，叛军无不诉诸胁迫来扩充队伍。他们有时实行焦土政策，或杀死拒绝入伙的人。^207 来凤起事中，队伍达数万人之众，其中大多数是被裹挟的当地居民。直到1801年，这种裹挟平民的办法一直是叛军人数大幅波动的首要原因。为防止被裹挟的平民逃跑，叛军有时在他们的脸上烙上\"白莲\"（Bailian）或\"白莲教\"（Balianjiao）字样——这是历代叛乱者惯用的老办法。^208 战斗中，这些被裹挟者或被用作先锋，先与清军接战，或充当叛军撤退时的人肉盾牌——这也是前人用过的战术。^209 尽管在战场上受到严密的监视与管束，被裹挟的平民仍更倾向于逃亡或投降，很少转化为死心塌地的叛军——尽管他们在被杀的\"叛军\"中占大多数，而朝廷从战役之初就对此心知肚明。^210\n清朝国家——从皇帝到前线官员——起初都没有把三省的起事当作严重事件。惠龄把宜都—枝江起事的叛军称为\"乌合之众\"（wuhezhizhong）——包括乾隆皇帝在内的许多人都附和这个说法，这也凸显出国家不愿向前线增派旗兵。^211 因此，湖北的大多数起事都是由地方军队在陕西及其他数省有限的增援下平定的。直到1796年底，来自北方与京城的第一批大规模援军——包括两千名精锐旗兵——才被派出。凭借火器——大炮、抬枪、鸟枪、地雷、手雷、喷火器、火箭——远胜于叛军自制的武器，清军地方部队能够轻而易举地摧毁叛军堡寨，尽管他们有时会等叛军疲惫之后才发动决战。明亮在湖北与四川都证明，他依然像清朝开疆拓土的鼎盛时期一样勇猛干练。与此同时，恒瑞率领的派往湖北的陕西军团——包括一千名西安驻防旗兵——也在迅速镇压武当山南麓诸起事的战斗中显示出他们的价值。\n武当山脉。明亮与恒瑞都没有使用湖北的受雇乡勇，恶劣的气候与险阻的地形也都没有使他们却步。\n在陕西南部，清朝军队自开国之初便在这里经年清剿匪徒，陡峭的群山与多雪的季节并未妨碍第二次金川之役的老将宜绵主持的战役——五场起事尽数被粉碎。同样是宜绵主持的太平之战，扫平高崖上叛军堡垒的行动也卓有成效。由于宜绵与明亮的合作，1797年上半年的四川战役对清朝而言进展顺利，把达州叛乱推到了覆灭的边缘。第一阶段镇压战役的结果表明，清军并非软弱无力。在正确的领导下，他们依然能像清初与盛世时期一样强悍，即使地理与气候不利，也能迅速镇压起事。陕西来的清军团一般明显强于其他各省的军队，只有贵州例外。\n清军的战役总体冷酷，有时令人发指。战斗中，清军不分青红皂白地杀死叛军与被裹挟的平民。战后，屠杀俘虏——包括妇女、老人与儿童——更是家常便饭。对被俘的叛军首领，除押送北京进一步审讯者外，各地的清军都不吝使用\"千刀万剐\"乃至更残酷的刑罚来处决。^212 将领们奏报处决俘虏的人数时——往往数以百计——通常以一种例行公事、漫不经心的口吻为自己辩解，声称被屠戮者是顽固不化的起事者。除了福宁在来凤旗鼓寨之战后屠杀近两千名投降叛军一事在嘉庆亲政后遭到调查之外，其他暴行从未受到过审查。^213 事实上，如前所述，宜绵及其陕西同僚在攻取五处叛军据点后屠戮俘虏的行径，比湖北的同侪有过之而无不及。宜绵与英善从叛军手中收复东乡县城后，处决了四百多名被俘叛军，乾隆在奏折上批了一个\"好\"字。^214\n乾隆虽然从不反对屠杀俘虏，但战役之初，他确实曾试图要求将领们区分教门叛军与被裹挟者。他明确表示只有前者才该处死，但对后者的处置却并不始终如一。有时，他提到可以把他们罚作旗人之奴；另一些时候，他又认为只要他们投降并表现出悔意，就不应受罚。^215 然而，乾隆的说教在前线几乎不起作用。他反复呼吁要审慎行事、区分真叛军与受蛊惑、被裹挟者，却几乎无人理会；冷酷屠杀俘虏的行径在此后数年依然继续。结果，许多叛军明知投降也是一死，便选择了不投降。与此同时，皇帝的另一项指示也没有被认真执行。叛乱爆发后不久，乾隆采纳了孙士毅的建议，下令部队放松对湖北、河南、四川教众的搜捕，以争取民众对清方战役的支持。^216 然而，没有参加叛乱的教门成员仍遭地方官府迫害，这反而把其中一些人推向了叛军阵营。^217\n到1797年夏天，清军已经在除追击襄阳队伍（从湖北一路追到陕南，下章将述）以外的所有战场取得了明显的上风。因此，清朝国家相信叛乱可在数月内完全平定，并非不切实际。然而，问题不在于清军是否有能力迅速消灭起事者，而在于他们是否有这样做的动机。正如永保一案所示，将领们宁可不一次全歼叛军，而是把叛军当作钓取更多军费、赏赐与升迁的诱饵。尽管军人——无论军官还是士兵——一经派赴战场，本就有权获得更高的待遇与更多的赏赐，乾隆在白莲教战争的第一阶段还是倾向于额外发放金钱激励，以鼓舞士气，正如他在漫长统治中的其他战争里所做的那样。例如，每逢奏报胜利，他就大方地赏全军一个月的饷银，有时甚至不是大胜，甚至不是真正的胜利。有时，他甚至给战斗中部分乃至全部参与者赏两个月的饷银。或者，在开战之前就把一个月饷银赏了出去。^218 对将领们来说，捞取不正当好处的机会也俯拾皆是：后勤人员与地方官员的贿赂、军费的侵吞，不一而足。\n结果，一些将领没有动力迅速、一次性消灭全部起事者，因为对同一股叛军的持久战役会带来许多邀功请赏的机会。这种心态也助长了虚报战果与滥杀无辜，因为被杀叛军的数目往往是最重要的受赏标准。连乾隆也意识到，不能尽信奏报的数字。^219 在湖北，尤其是在镇压宜都—枝江起事与长阳起事时，清军将领未能迅速攻破叛军的山顶据点，而是把围困拖了数月之久——尽管那里的地形艰险程度远不及陕南。虽然将领们玩忽职守会受到处分——永保的垮台就是明证——但即使在永保被革职之后，将领们仍在继续拖延，试探体制的底线。从1796年底起，中枢政府为湖北战场批准了大笔军费，这进一步刺激了将领们对战时收入——合法与非法的——的胃口。然而，与湖北不同，陕西与四川在第一年没有得到来自北京的任何额外经费。由于镇压叛乱拖延不决的财政代价落到了省级当局的肩上，陕西与四川的清军将领——他们同时是省级督抚，如宜绵与英善——或许更有动力把战役进行到底。然而，情况很快就要改变。1797年春，随着更多军队部署到四川，四川的战争管理当局请求并随后获得了中枢政府的大笔军费；四川很快将在开支上超过湖北，在挪用军费上也将如此。与此同时，效能将被拖延所取代。\n注释\n[译者按：文献简称对照——QSLQL《清高宗实录》；QSLJQ《清仁宗实录》；QLSYD《乾隆朝上谕档》；JQSYD《嘉庆朝上谕档》；XFFL《钦定剿平三省邪匪方略》；BLJZL《清代中期五省白莲教起义资料》；GZDJQ《宫中档嘉庆朝奏折》；KJJFSB《军机处剿捕档》；Jiaobudang《剿捕档》；QSG《清史稿》。书名、文章名保留原文（有中译本者附中译名），出版信息与页码按原格式保留。]\n题辞：刘之协供词，《剿捕档》，嘉庆五年八月初七日，第137页。\n\n樊明德向官府称其教成员不足四十人。QSLQL, 980/10a–12b, 983/26a–27a; Zhuang, Zhenkongjiaxiang, 164. 关于混元教起源的不同看法，见马西沙、韩秉方《中国民间宗教史》（Ma and Han, Zhongguo minjian zongjiao shi），1258–93；Zhuang, Zhenkongjiaxiang, 91–92；郭士达（Gaustad）\"Religious Sectarianism,\" 140–54，及\"Prophets and Pretenders\"。\n凌迟（千刀万剐）是一种极端酷刑，将受刑者身上的肉一片片割尽。明清两代，谋反者适用此刑。卜正民、布尔贡、布鲁《杀千刀》（Brook, Bourgon, and Blue, Death by a Thousand Cuts），55, 68–87。\nQSLQL, 983/26a–27a; QLSYD, 18:272.\nQLSYD, 18:272; Zhuang, Zhenkongjiaxiang, 164–65; Suzuki, Sennen ōkkuteki, 296–99.\nZhuang, Zhenkongjiaxiang, 165; Gaustad, \"Religious Sectarianism,\" 158–64.\n南阳的夹河洲就是这类据点之一。XFFL, 9/7a.\nQLSYD, 18:252.\n他们把混元教经卷《混元点化经》改题为《三阳了道经》，即\"参透三阳之道之经\"（QLSYD, 18:272）。\n刘之协供词，《剿捕档》，嘉庆五年八月初七日，第137页。\n许曾重、林易在\"刘之协\"一文中提及刘之协的生意动机，195–98。\nQLSYD, 18:272, 274. 关于王怀玉的崇高地位，见Gaustad, \"Religious Sectarianism,\" 154–57。\n郭士达也认为王怀玉在新教门中没有发挥作用。\"Religious Sectarianism,\" 203.\nBLJZL, 1:28; QLSYD, 18:255–56, 271–73.\n张小元供词，BLJZL, 5:113; Zh
