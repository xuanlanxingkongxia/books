死所有脸上刺有\"白莲教\"字样的俘虏。他甄别所有投降与被俘者，处死\"真\"叛军，遣返被裹挟的平民。XFFL, 67/4a–5a, 45/18a. 在四川时，宜绵把甄别俘虏的任务交给幕僚龚景瀚。龚景瀚处决了那些自愿参与烧杀者，释放了大多数被裹挟的平民。XFFL, 63/9a–10a.\n一个体现过分残忍的例子：额勒登保把林之华的妻子及其九岁的女儿一并凌迟处死。XFFL, 52/3b–4a.\nQSG, 11317.\n王三槐可能是为保命而编造了这套说辞：他说，若让他活命，其他人就会受到鼓舞而投降。王三槐供词，BLJZL, 5:65–68, 68–72, 73–74; XFFL, 81/20a–21b. 确有几位叛军首领在受审时用\"官逼民反\"这句口头禅作为叛乱的理由。覃加耀与张正谟供词，BLJZL, 5:63; 张正朝供词，第62–64页。\nJQQJZ, 4:60–61. 二月，王三槐与罗其清、罗其书一道被凌迟处死。JQQJZ, 4:91.\nQSLJQ, 38/16a–18a; XFFL, 86/6a–9a, 87/6b–7a, 89/2b–4a; Nivison, \"Ho-shen and His Accusers,\" 216–17.\nJQQJZ, 4:80–81; QSLJQ, 38/23a–b; XFFL, 卷88–89、92–94 各处。同时，嘉庆毫不含糊地表示：任何叛军首领都不得宽赦，应就地正法，以震慑其他叛军。XFFL, 91/25b–26a.\nXFFL, 90/20a–22a, 92/10b–12b.\nXFFL, 91/17a–18b, 92/29a–b, 94/5a–18a, 95/1a–13a.\nQSG, 11316–17.\nJQSYD, 4:62.\n嘉庆听说达州有两个恶官，其一是戴如煌，另一个的名字他想不起来了。XFFL, 93/28b–30a.\nJQSYD, 4:132–35. 事实上，常丹葵参加了当阳围城，当阳收复后还获了升迁。XFFL, 8/35b.\nGZDJQ, 3422; XFFL, 210/15a–19b. 关于清代知县的众多书吏差役，见里德（Reed）《爪牙》（Talons and Teeth），特别是122–59。\n据德楞泰与勒保说，被俘的达州叛军中，除李仕怀外，无人提及受过戴如煌勒索——李仕怀1796年秋曾给戴如煌的两名书吏二十两银子以脱干系。XFFL, 210/16a. 达州的两名叛军只提到1796年有过对教众的迫害。傅月明供词，BLJZL, 5:81; 庹向瑶供词，第137页。尽管德楞泰与勒保为戴如煌辩护，戴如煌后来仍被流放伊犁，其子孙被禁止入仕。XFFL, 195/15b–17a, 210/15a–19b, 210/25a–26a.\n20世纪80年代前中华人民共和国出版的少数几种关于白莲教战争的著作几乎都引用他们。又见铃木中正Sennen ōkkuteki, 306–8。\nQSLJQ, 39/25b–26a.\nQSLJQ, 27/42b.\nQSLJQ, 39/19b–20a.\nQSLJQ, 37/41a–b, 38/29a–b.\n为奖赏谷际岐提供情报之功，嘉庆把他升为\"掌礼科给事中\"。QSG, 11316.\n松筠任命之前，恒瑞奉命署理宜绵之职。QSLJQ, 38/25b–26b, 39/2a. 嘉庆召见宜绵后，命他自费赴乌里雅苏台效力。JQSYD, 4:114.\nJQSYD, 4:142.\nQSLJQ, 38/25a–b, 39/13a–b. 秦承恩后来获释，被抄没的家产也发还——因为查明许多对他的指控并不属实。XFFL, 90/6a–7a, 102/1a–3a, 102/9a–11a; JQSYD, 4:169, 175–76.\nQSLJQ, 41/27b–28a.\nXFFL, 68/15b–16a.\nXFFL, 卷96–98、100–104 各处。\nXFFL, 88/31b, 91/27b–29a, 92/3b–4a, 92/30b–31a; QSLJQ, 40/7b–8b.\nQSLJQ, 40/25a–27a; XFFL, 93/3a–4a; JQSYD, 4:86–87.\n倭什布为景安辩护，反驳\"怯懦\"的指控，并指出广福脾气急躁。连广福本人也不同意景安曾试图避战的说法。XFFL, 96/27b–31b, 101/20b–24b, 110/35b–41a.\nQSG, 11177.\nXFFL, 88/10a–13b, 88/15a–16a, 89/10b–14a, 91/6b–8a, 92/12b–19a.\nXFFL, 89/10a. 他为百祥与朱射斗在方山坪作战迟缓辩护，又为惠龄、德楞泰未能肃清冉文俦全部部众辩护。XFFL, 92/23b–26a.\nQSLJQ, 39/7a; XFFL, 89/9b–10a, 110/35a–b.\n刘清被升为忠州直隶州知州，仍带知府衔。XFFL, 91/8a–9a, 91/11b–12a.\nXFFL, 106/6a–b, 106/11b–12b.\nXFFL, 101/8a–b.\nQSLJQ, 38/15b–16a.\nXFFL 卷92–96 各处, 100/26b–30b; QSLJQ, 39/14a–15a.\nXFFL, 102/3a–5a, 103/27b–29a.\nXFFL, 105/8b–11b, 106/24b–27b, 107/1a–2a.\nXFFL, 卷88–92 各处。\n额勒登保先获二等男爵，消灭冷天禄一股后升为一等。他还被免缴此前因拖延剿灭湖北林、覃队伍而被罚的一万两银子。XFFL, 93/17a–24b, 94/18a–22b, 94/29a–31a; QSLJQ, 41/7b–9b; 41/25b–27a.\nXFFL, 96/1a–5a.\nXFFL, 93/27b–28b, 94/28a.\nQSLJQ, 40/4a. 又见QSLJQ, 38/20a–b.\nQSLJQ, 40/4a–5a; XFFL, 92/1b–2a.\nXFFL, 96/7b, 96/10b–13a; QSLJQ, 44/13b, 44/21b–22a.\nXFFL, 102/23a, 103/1a–8a, 103/12a–13a.\nXFFL, 96/29b–30a, 98/1a–11a, 98/15a, 98/16a, 98/20a, 101/1a–5b, 101/10b–12b, 103/1a–8a.\nXFFL, 99/13a–b.\n勒保说那些旗兵训练无素、纪律松弛。XFFL, 106/7a–b.\nXFFL, 106/7b–15b.\nXFFL, 107/13b–20b.\nXFFL, 107/20b–24b.\n广兴随后由监察御史升为副都御史（fuduyushi）。XFFL, 91/29b–31a; QSLJQ, 407a–b.\nXFFL, 107/23b–24b.\nXFFL, 卷96–100、106–8 各处。\nXFFL, 108/35a–38a.\nXFFL, 108/39b–40a.\nXFFL, 108/38a–41b.\n朱射斗获授世职，其部队赏一个月饷银。XFFL, 109/1a–3b, 109/8b. 勒保在自撰战役纪略中把包正洪列为他自己剿灭的叛军首领之一。勒保《平定教匪纪略》（Pingding jiaofei），157。\n魁伦由四名侍卫陪同，先停陕西，向明亮宣布其新任命，再赴四川罢免勒保。QSLJQ, 49/2b–4b; XFFL, 110/7a–11a, 110/12b–17b.\nXFFL, 110/18a–30b.\nXFFL, 110/30b–35b.\n德楞泰于嘉庆四年七月二十一日接到勒保的信，七月二十六日进入湖北。XFFL, 117/1a–4a.\nXFFL, 113/6b–9b.\nXFFL, 卷88–91 各处, 93/11a–16a, 95/25a–32a, 97/22a–26a.\nXFFL, 卷87–90 各处, 121/14a–b.\nXFFL, 94/22b–26a, 97/5b–8a.\nXFFL, 95/15b–17a, 99/1a–5b, 99/18a–20a. 广兴八月回京时向嘉庆奏报了永保此战败绩。但永保否认败绩，也否认与明亮的冲突。XFFL, 116/9a–10a, 120/19a–b, 122/6a–9b.\nXFFL, 100/6a–10a.\nXFFL, 100/14a–16b, 106/22b–23a.\nXFFL 卷102、104 各处。\n有一次，张汉潮的部下食物中毒；又有一次，张汉潮及其人马喝醉了酒，睡在一个村子里。每次明亮都得到消息，却不行动。还有一次，叛军北上时，明亮故意南下。XFFL, 116/10a–b.\nXFFL, 95/25a–32a, 105/13b, 105/16b–23a; QSLJQ, 46/26b–29a.\nXFFL, 109/12a–15b, 109/29b–31a, 109/32b–34b, 118/14b–20b.\nXFFL, 117/20a–21b, 117/24a–41a.\nXFFL, 111/27a–30a, 114/1a–5b, 114/14b–16a.\nXFFL, 111/30a–32b, 114/11b–14b, 115/8b–13b, 115/29a–35a, 116/27b–29b.\nXFFL, 115/40a–b, 116/8b–9a.\nXFFL, 115/40a–43b, 116/10b–13b.\n嘉庆还把额勒登保升为都统，并指示魁伦把原赏给明亮的经略大臣印信与荷包转交额勒登保。XFFL, 116/13b–15b, 116/17b–19a. 任命前嘉庆对额勒登保的称赞，见XFFL, 103/15a–b, 114/19a, 116/13a–b. 事实上，额勒登保之所以没有收到胡齐仑的\"馈赠\"，是因为他不在鄂北作战，而是一直随福宁在鄂西南；那里的后勤由福宁本人主持。\n张汉潮的招募计划一经泄露，地方官府就逮捕了许多教众。XFFL, 122/4a–6a, 123/7b–8a.\nXFFL, 116/24a–26a, 117/27a–29a, 120/1a–5b.\n吴熊光与松筠看法一致，恳请让永保与明亮都留在前线，调查推迟到战后。XFFL, 117/20a–21b, 117/24a–26b, 118/14b–16a, 120/15b.\nXFFL, 117/34a–41a; QSLJQ, 50/31a. 不久，嘉庆撤掉了当年早些时候给永保两个儿子的任命，并终止了庆成之弟在宫中当差。XFFL, 119/20a–b. 本章及后续各章关于那彦成的讨论，部分取材于戴（Dai）\"Broken Passage\"。\nXFFL, 117/40b–41a, 119/14b–20a.\nXFFL, 77/29a–b.\n嘉庆四年正月初八日，他先被任命为翰林院掌院学士。JQSYD, 4:13. 数日后，正月二十一日，那彦成被任命为工部尚书（第37页）。随后他又加崇文门监督之衔（第40页）。接着奉命署理兵部尚书（第46页）。二月十九日，那彦成被任命为国史馆副总裁（第59页）。五月二十七日，奉命兼管内务府营造司（第182页）。七月二十五日，被任命为内务府总管之一，尽管其翰林院掌院学士被免（第259页）。\n那彦成被任命为蒙古黄旗副都统与汉军镶白旗都统。QSLJQ, 39/4a; NGDK, 62.\nJQSYD, 4:44.\nJQSYD, 4:158–59.\n讷亲因未能速胜被清除后，乾隆派年轻的军机大臣傅恒赴第一次金川之役。傅恒成功把战争带向令人满意的结局，为其擢升领班军机大臣铺平了道路。1781年，和珅被派去主持镇压甘肃回民起事的战役。他未能取胜后，阿桂被派去，帮助和珅赢得了战役。\nXFFL, 120/20a–b.\n永保被罢免后不久，台布被任命为陕西巡抚。XFFL, 117/34a–41a; QSLJQ, 50/31a.\nXFFL, 121/1a–5a.\nQSLJQ, 52/4a–5a; XFFL, 121/5a–9a. 那三千名旗兵起初派往湖北，湖北危机结束后改派陕西。\nXFFL, 120/1a–5b, 120/12a–13a.\nXFFL, 120/9a–11a.\nXFFL, 122/14b–19b, 123/17a–18b, 135/8b–12a.\nXFFL, 122/1a–4a, 122/9b–13a.\n嘉庆还把明亮汉军红旗都统之职降为副都统。XFFL, 123/21b–30b.\nXFFL, 125/7a–9a, 127/4a–10b, 128/3b–8b, 131/13b–14a. 李潮是襄阳的老叛军，声称1797年与张汉潮合并后，他一直是张汉潮一股的实际首领。李潮供词，BLJZL, 5:79–80.\nXFFL, 127/10b–12b.\n嘉庆尤其恼怒的是：他顶着盛夏酷暑披阅批复明亮的奏折，而奏折里报的却全是假仗。XFFL, 120/5b–9a, 122/1a–4a, 122/6a–13b, 122/19b–20b, 125/1a–7a, 125/17a–21b, 125/23a–b. 但他后来对永保指控的真实性产生了怀疑，于是让松筠当面对质，判断谁在说谎。XFFL, 127/16a–17b.\n嘉庆赏了一些官职，并给士兵赏了一个月饷银。XFFL, 127/13a–16a, 127/17b–18a.\nXFFL, 125/10b–11a, 125/12a–13b, 125/28a–30a, 128/1a–8b, 133/44a–45a.\n松筠为明亮挡掉了永保的一些严重指控——如设局陷害永保、捏造三场战斗——并声称永保怯懦拖延。XFFL, 135/1a–14b.\nXFFL, 119/19a, 123/28b–29a.\nQSLJQ, 39/6b–7b; XFFL, 87/8a.\nGZDJQ, 2231; XFFL, 33/41b.\nXFFL, 88/19a. 英善被派往西藏，接替松筠任驻藏大臣。QSLJQ, 38/19a; JQQJZ, 4:71.\nXFFL, 90/15a–18b. 不久，福宁又上了一道奏折，再次试图撇清自己与四川开支过滥的关系。XFFL, 93/4a–7a.\nXFFL, 90/18b–20a.\n昭梿《啸亭杂录》（Zhaolian, Xiaoting zalu），342。\n松筠于嘉庆四年四月二十五日到达陕西，五月初三日前赴甘肃成县，从恒瑞手中接过总督印信。XFFL, 101/26b.\nQSLJQ, 40/3b.\nQSLJQ, 40/29a–b.\n景安离开后，嘉庆命勒保暂时挑一名文官或旗军将领协助福宁。XFFL, 96/29b–31b.\nXFFL, 112/27b–30a; QSLJQ, 40/32a–b.\nXFFL, 14/27a, 14/31b.\nJQSYD 3:139, 186–87.\nJQSYD, 4:58–59, 62. 对胡齐仑的另一项指控是：1797年春，他捏造了一份报告，称襄阳一带返乡的叛军正在密谋新的起事。胡齐仑随后率兵与乡勇攻打那些所谓的叛军，杀死并逮捕了数百人。胡齐仑因此被升为按察使，但后来查明，那些人是难民。XFFL, 32/29a–35b, 32/38a–39a; JQSYD, 4:161–65, 344.\n嘉庆直言斥责倭什布不呈胡齐仑的账册，并警告他不得试图篡改或销毁记录。JQSYD, 4:185–86.\n据胡齐仑被处决后的奏报，总额为83,961两。JQSYD, 4:347–51, 429. 但他的账册记录的馈赠超过99,000两，被捕时家中又搜出50,000两。\n嘉庆命褫夺毕沅两个儿子的世袭职衔。JQSYD, 4:353.\nXFFL, 108/23b.\n此前，魁伦在陕西郿县与广兴会面后，曾就四川后勤问题上过一道奏折。嘉庆的答复是重申指示：到任后彻查勒保与福宁。XFFL, 114/23a–27a.\nXFFL, 116/2b–8b.\nXFFL, 116/8b–16a, 123/12a–14a.\n嘉庆把刘清升为道员，并告诉魁伦：四川一旦有缺，就任命刘清。XFFL, 115/15b–16a, 116/11b, 116/20b–21b; JQSYD, 4:290.\n关于洪亮吉的生平与仕途，见琼斯（Jones）\"Hung Liang-Chi\"。\n信见《洪亮吉集》（Hong Liangji ji），223–30。关于此事，见Jones, \"Hung Liang-Chi,\" 156–202，及艾尔曼（Elman）Classicism, 284–90。\nJones, \"Hung Liang-Chi,\" 139–41.\nJQSYD, 4:305–10. 正如倪德卫（Nivison）所指出的，洪亮吉试图与皇帝沟通的方式——把信的抄本寄给京城权要，而不是直接上奏——加深了嘉庆的不安。Nivison, \"Ho-shen and His Accusers,\" 241–43.\nQSG, 11299.\n乾隆把查弼纳误当成了魁伦的曾祖父。QSLQL, 1297/15b.\nQSG, 11081–84, 11299–300; QLSYD, 18:656–912 各处。\n魁伦于1796年初开始署理总督，数月后正式任命。\n嘉庆把魁伦所欠186,000两中的96,000两蠲免，允许魁伦用养廉银缴还其余90,000两，但把房产还给了他。JQSYD, 4:75–76.\n广兴先揭发了游涵宇的渎职，嘉庆遂责成魁伦进一步查办。除魁伦建议的\"留广元效力、不给俸禄\"外，嘉庆还命将游涵宇枷号三个月。XFFL, 115/28b–29a, 119/23a–26a.\n到达达州之前，魁伦已于嘉庆四年九月初一日接到勒保送来的总督印信。XFFL, 121/16b–18a.\nXFFL, 116/7b–8a. 关于魁伦的画艺，见裕瑞《滦阳录》（Yu, Luanyang lu），2/13a–b。\n嘉庆此前曾让魁伦去攻打达州叛军王登廷所率的一股。XFFL, 118/33a–34a, 122/23b–28b, 123/14b–16b.\nXFFL, 124/1a–7a, 130/21a–22b.\n魁伦留用了刘清与严士鋐。XFFL, 126/18a–b; QSG, 11300.\n魁伦以更同情的口吻奏报：勒保也曾不时作战，击退逼近达州的叛军（因此他并非全然闲居）；勒保关于叛军总数减少的说法也不算错。魁伦还认为，勒保与福宁不大可能串通侵吞经费，尽管二人之间并无嫌隙。XFFL, 124/1a–6a.\nXFFL, 130/22a–23b.\nXFFL, 124/7b–12a, 126/12b.\nXFFL, 127/18a–25a.\nJQSYD, 5:74.\nXFFL, 130/21a–27a.\n他想让吴熊光主持河南的调查，松筠主持陕西的调查。XFFL, 129/28b–29a.\nXFFL, 130/26b–27a.\n遵皇帝之命，福宁于1800年初被捕。QSLJQ, 56/15b–18b.\n曹相业从他所发放的每百两中扣出三两七钱。魁伦、广兴，嘉庆五年正月初八日，GZDJQ, 4712; XFFL, 131/30a–34a.\nXFFL, 126/12b.\nXFFL, 22/36b, 22/42a, 79/31b.\n收礼者把这事告诉了《啸亭杂录》的作者昭梿；见该书258–59。\nXFFL, 131/35b–37b.\nXFFL, 131/28a–30b.\n魁伦到任后，额勒登保试图把四川战场在自己与魁伦之间划分：自己留川北，让魁伦对付川东叛军。九月底，额勒登保提议给魁伦配备两千多名士兵，并派春宁与百祥到魁伦处报到。十月初，额勒登保又指望魁伦在调查结束后参战。XFFL, 123/3b–7b, 126/2b–3a, 126/6a–b, 128/17a.\nXFFL, 122/23b–27a.\n额勒登保命春宁率领四百五十名金川土兵。XFFL, 130/30b–33a.\nXFFL, 130/11a–16b. 关于\"长骡\"的进一步讨论，见第7章。\nXFFL, 130/16b–19b, 133/32a–42b.\nXFFL, 130/16b–19b.\nXFFL, 133/20b–42b.\nXFFL, 133/42b–44a.\nXFFL, 112/12a–15a, 112/27b–30a.\nXFFL, 112/12a–15a.\n那彦成请求预支五年的工部尚书俸禄（每年360两）与他众多\"养廉银\"中的一份（每年600两），共计4,800两。鉴于他兼职众多，4,800两对他的家庭影响不大；而对台布来说，两年的养廉银是一笔可观的数目。XFFL, 131/10a–12a, 133/14b–20a.\nXFFL, 133/45b–46a.\nXFFL, 135/16a–17b.\nXFFL, 114/6a–11b, 128/19b–21a, 129/33b–34b.\n两省各一千名。XFFL, 111/32b–42a, 114/18a–20b. 但倭什布说，不必让明亮与额勒登保来湖北。XFFL, 114/6a–b, 115/16a–21a.\n嘉庆四年八月初九日，徐、李队伍攻占了没有城墙的归州城，但没有据守。XFFL, 121/23b–24a, 122/23b–25a.\n德楞泰获授世职\"骑都尉\"（qiduwei）。该股的另一位首领卜三聘后来被擒。XFFL, 115/1a–5b, 117/1a–3a; 《大宁县志》（Daning xianzhi）5/10b–11a。\nXFFL, 117/1a–4a, 118/1a–6b, 119/1a–5a, 121/19a–23a.\n唯一遭受一些破坏的城市是归州——它被徐、李队伍烧毁了一部分。倭什布没有奏报，但嘉庆从\"另一渠道\"得知。XFFL, 122/21b–22a, 129/33a, 129/34b.\n倭什布获授\"云骑尉\"（yunqiwei）世职，孙清元升为总兵。XFFL, 115/23a–b, 121/24b–30a, 124/9a–b.\nXFFL, 128/20a.\nXFFL, 112/25a–26b, 113/5a–6a, 113/16a–19a, 117/6a–7b, 125/16a–17a.\nXFFL, 116/29b–32b, 117/7b–9b.\n高均德、高成杰供词，BLJZL, 5:82–88.\n崔宗和与胡明远——都是张汉潮的追随者——另立了一股，但随后与戴家营合并。XFFL, 342/25a–b, 346/2b–4b.\nXFFL, 122/23b–25a.\nXFFL, 117/10b–12b.\n额勒登保又获汉军白旗都统之衔。XFFL, 120/29a–35a, 123/1a–3b, 123/6a–b.\nXFFL, 126/1a–5a, 126/21b–22a, 128/11a. 七十五参加过乾隆朝晚期的多次边疆战争，1796年加入白莲教战争，1798年升任四川提督。QSG, 11187–89.\n松筠说这话，是暗示他对德楞泰的其他品质不以为然。XFFL, 120/16a.\n奇怪的是，德楞泰奏报此战只有几名清兵负伤。BLJZL, 1:436–40. XFFL, 122/28b–33b, 124/14a–19b, 129/1a–11b.\n德楞泰声称他的部下在西乡杀死了张世虎，并俘获了襄阳的一名教门师父。XFFL, 131/22a–27a. 随后德楞泰把汉江南岸的一股叛军击退回四川，并追到广元。沿途一系列战斗中，德楞泰杀敌众多、俘获数百，包括东乡叛军首领傅月明。XFFL, 134/19a–25b. 然而，张世虎并未被杀；他1802年才被擒。德楞泰后来为谎报张世虎死讯道歉。XFFLXB, 11/30b–32a.\nXFFL, 129/8a–b, 134/23b–24a.\n额勒登保写这道奏折时还不知道明亮与永保被罢免，他计划让二人留陕守边。XFFL, 128/12b–19b.\n嘉庆曾命明亮、那彦成、魁伦、德楞泰与倭什布各自奏报本处战况，不必经由额勒登保。XFFL, 120/35a–36b.\nXFFL, 128/25a, 129/11b–12b.\nXFFL, 130/8b–9a, 132/27b–28a, 133/45b–48b.\nXFFL, 132/13a–18a, 136/15b.\n安禄1799年初护送军费入川后加入战役。他率数骑追击溃退的起事者时中伏被杀。XFFL, 132/18a–19a, 132/27b, 133/5b–7b; QSG, 11247–48.\nXFFL, 134/25b–31a.\nXFFL, 136/6b–7a.\nXFFL, 137/10b–17a; QSLJQ, 55/6b.\n那彦成在十月初六日的奏折中估计，张汉潮的残部只剩几百人。XFFL, 127/21b–22a.\nXFFL, 128/3b–8b, 129/14b–16b, 130/27b–30b.\nXFFL, 130/3a–8b.\nXFFL, 130/31a–32a, 131/7b–10a.\nXFFL, 130/31a–32a.\nXFFL, 131/10a–11a.\nXFFL, 133/9a–12b.\nXFFL, 135/18a–22b.\nXFFL, 137/1a–6b.\nXFFL, 129/15a–16a.\nXFFL, 131/22b, 132/5b–6a, 134/2b–3b.\nXFFL, 133/1a–9a, 135/26a–28a.\nXFFL, 132/16a, 133/17a, 135/24b–25a, 136/25a–26b.\n", "sections": [{"level": 2, "title": "清除和珅", "id": "ch3-s0"}, {"level": 2, "title": "嘉庆的心理战", "id": "ch3-s1"}, {"level": 2, "title": "向旧班底开刀", "id": "ch3-s2"}, {"level": 2, "title": "勒保的去职", "id": "ch3-s3"}, {"level": 2, "title": "明亮的倒台与那彦成在前线的登场", "id": "ch3-s4"}, {"level": 2, "title": "战争财政的受阻整顿", "id": "ch3-s5"}, {"level": 3, "title": "风暴眼的达州", "id": "ch3-s6"}, {"level": 3, "title": "胡齐仑丑闻", "id": "ch3-s7"}, {"level": 3, "title": "洪亮吉的挑战", "id": "ch3-s8"}, {"level": 3, "title": "清廉的魁伦", "id": "ch3-s9"}, {"level": 2, "title": "未破的僵局", "id": "ch3-s10"}, {"level": 2, "title": "注释", "id": "ch3-s11"}]}, {"id": "c4", "title": "第4章 · 逆转，1800年", "kicker": null, "part": "第一卷 · 叙事", "html": "<blockquote>\n<p>朕以皇考之心为心，以皇考之政为政。遵循皇考所定一切章程，唯恐不能仰承其意。何尝有\"改革\"之举？</p>\n<p>——嘉庆皇帝，1799年</p>\n<p>[译者按：原上谕自英文直译，文言原文待核。（出处见章末注释）]</p>\n</blockquote>\n<p>1799年堪称这场总体懈怠的白莲教战争中最有生气的一年。尽管犹疑不决、判断失当、常常在最后关头改弦更张，嘉庆皇帝还是改组了战争领导层，向战区派去了一批锐意改革的官员，并支持他们整治前线腐败的努力。然而，1800年成了逆转之年。改革派与习惯于挥霍无度的将领们之间的紧张关系加剧，额勒登保与德楞泰在年初制造了四川战场的一场危机，导致起事者渡过嘉陵江，游窜于富庶而迄今未受惊扰的成都平原。四川局势的骤然恶化令嘉庆心神不宁，对新领导人们——他们之间也起了内讧——大失所望，于是恢复了勒保的职务，把改革派一个接一个地打发走。其中，魁伦领受了这场战争中唯一加诸高级官员的死刑。尽管起事者很快在四川及其他战场省份被压制下去，藏匿多年的刘之协也被逮捕，到1800年底，对总计约两万名起事者的战争再次陷入僵局。随着1799年所立的各项改革尽数废弃，嘉庆皇帝褪去了改革者的外衣，退回到他真实的自我：优柔寡断、缺乏自信。^1</p>\n<h2>嘉陵江之败与勒保复出</h2>\n<p>1800年初，新年（1月25日）将至，又是自己亲政一周年，嘉庆对这场拖延了四年的战役更加懊恼——元旦谒陵时，他将无法报捷。不过，他从前线奏报与回京使臣的奏对中捕捉到的积极信号还是鼓舞了他：起事者已被逼入绝境、筋疲力尽，总人数减至约两万，活动范围仅限于川北与陕南。他推断并希望：缺乏统一领导、部众乌合，起事者已处于瓦解的边缘。^2</p>\n<p>然而，最后的胜利既不确定，也非近在眼前。1799年错过了好几个期限，皇帝又定了一个新的：嘉庆五年二月底。新年前数周，嘉庆颁发了众多谕旨，以越来越尖锐的口吻催促众将加快行动。他担心春天的到来与随后的收获季节会使叛军重振，而春雨会妨碍战役。他告诉额勒登保与那彦成：谁再拖延，他就会像处置勒保与明亮那样严惩不贷。嘉庆四年十二月十二日，额勒登保青子垭惨败的消息传到朝廷，嘉庆的悲观更深了。^3 数日后王登廷被擒，他的精神稍稍振作，但他不再相信众将所报的敌人真的已经\"穷蹙\"。^4</p>\n<p>与父亲一样，嘉庆抱怨找不到可以信赖的高级官员来替换现任领导层。然而，有官员提议派一位皇子领兵时，他断然拒绝，理由是这场战役对付的不过是几个\"乱民\"（luanmin），而非外敌；一旦皇子不能取胜，他无法惩处。^5 无计可施之下，他考虑起复明亮与勒保的可能性。事实上，他一直故意推迟审讯明亮。^6 把被罢免的将领（勒保还曾被交付审判定罪）重新派回前线，实属罕见，这个念头必定是朝廷上为两位受责官员游说的结果。此外，勒保既然能花钱减轻刑罚，以他雄厚的家底，也可能为获释与复职花同样的钱。有意思的是，嘉庆曾两次下令搜查明亮的家——因为明亮是个花钱的人，不是攒钱的人，没搜出多少——却一直没对勒保这样做。</p>\n<p>嘉庆还重新检视了他的心理战——它收效甚微。^7 为重申立场，嘉庆选择拿福宁旗鼓寨之战后屠杀两千名投降叛军一事开刀。他反复谴责福宁，命魁伦彻查。^8 大刀阔斧地扩展其恩威并施之策，嘉庆在正月初九日的谕旨中宣布：他将赦免所有叛军——不仅是裹挟从叛的平民，也包括\"真\"的教门起事者——只要他们投降；更重要的是，他将不再迫害和平奉教的教门中人。他一面敦促战区将领督抚广为宣示这些修正，^9 一面对起事者的\"抚\"（fu）作了更详细的指示。他要战争领导人不仅诱使被裹挟、受蒙蔽者脱离叛军队伍，还要妥善安置他们。为保护平民免遭叛军掳掠，他重申了筑堡与组织乡勇的必要性。^10 然而，前线的事态很快使这项新扩展的招抚政策搁浅。</p>\n<p>嘉庆此刻以及此后很长时间都没有意识到：他整顿战争财政的大胆努力，已在前线激起了敌意。松筠上年秋天就警告过：骤然削减军人的战时收入会挫伤士气。^11 然而，嘉庆没有听他的劝告。1800年新年前夕，嘉庆继续催促魁伦与广兴坚持新规章、根除积弊。他满意于自己已取缔了将领们用军费犒军的做法——这是主要的滥行之一。赏给额勒登保一万两、德楞泰五千两犒军专款之后，他进一步收紧了缰绳：责成将领们向军需局申请新的犒赏经费时说明理由，并授权魁伦与广兴：凡认为请求不当，或予驳回，或直接奏闻。^12</p>\n<p>与皇帝的愿望相反，他吝啬的拨款只激起了怨气。起初，额勒登保以青子垭之败为由，请求辞去统帅之职，请皇帝派一位\"福将\"（fujiang）来主持战役。但嘉庆回绝了他，并向额勒登保保证了自己的信任。^13 随后额勒登保公开为将领们犒军的做法辩护。他提醒皇帝：乾隆朝晚期福康安主持多次战争时开创了这一做法——额勒登保参加过那些战争——他不过是效法福康安，对有战功的士兵与平民慷慨犒赏。他辩称，自己的俸禄津贴不足以应付那些犒赏，所以才向达州军需局请款，如他所奏。他感谢皇帝的一万两，因为它将\"激励行间将士于战役紧要关头\"（原文待核，见注释14），并随折附上他所发犒赏的清单；他还暗示，这些赏赐不足以激励部队\"按期蒇事\"。^14 然而，这番往还很快被陕南的一场新危机打断。</p>\n<p>由于食物短缺，马五与高二所率各股、戴家营以及其他队伍——大多是襄阳出身，总数或许有一万——冒着冰雪穿过大巴山，从川北进入陕西。王廷诏随行，此举或许出自他的策划。新年前夕抵达汉江后，他们在勉县击溃清军，涉水渡江。^15 十二月二十七日及次日，他们在略阳渔关——此处江段称白水江——击破清军防线，渡过嘉陵江，侵入甘肃徽县。进入甘肃后，起事者从徽县蔓延到成县、两当、西和、礼县、秦州与巩昌。^16 甘肃再次成为战场。</p>\n<p>起事者在陕西南部的蜂拥而来，压垮了刚刚被罢免的松筠。他赶赴汉中，手忙脚乱地搜罗援军，保卫栈道、封锁起事者入甘之路，同时奏报进入陕西的叛军数目越来越大——从几千人到两万人。^17 嘉庆指示松筠留驻，并按松筠的请求，允许流放伊犁途中已到甘肃的庆成重新加入战役。^18 他还催促那彦成与恒瑞撤出秦岭，前往甘陕边境。他说那彦成\"自取坠路\"（ziquzhuolu，意为\"自入绝境\"；原文待核），再次斥责他数月来深入山林，不顾其他地方——在嘉庆看来，这正是当前危机的成因之一。^19 嘉庆对那彦成没有十足的信心，说他不是老于战阵的将领，而是\"书生\"（shusheng），于是决定派德楞泰赴陕。^20</p>\n<p>甘肃的危机在四川引发了一连串的调动。接到松筠的求援后，刚刚病愈的额勒登保立即决定亲赴陕西，把四川的战事交给德楞泰。嘉庆虽然指示过额勒登保留川（并温和地责备他关于起事者势力衰落的奏报失实），还是认可了他的决定，把旨意改发给德楞泰，让他留川与魁伦配合对付本地叛军。由于魁伦如今负有军事之责，嘉庆命新任布政使杨揆协助广兴主持后勤。^21</p>\n<p>然而，额勒登保没有立即前往陕西。他先从养病的东乡王家寨前往达州城。在达州盘桓数日过年，额勒登保就\"长骡\"问题与魁伦发生了严重冲突。嘉庆砍掉这项开支后，魁伦虽作了一些妥协，额勒登保仍怒气冲冲。^22 离开达州后，他上了一道长折，强调清军面临的困难与部队忍受的艰辛。除伤亡与疾病外，许多部队因连年出征与粮秣价格高昂而疲惫消沉，新调的士兵又缺乏训练、不熟地形。他还抱怨乡勇被裁减，以致人数不足、士气低落。言辞激烈、情绪激动，额勒登保的意思毫不含糊：部队理应得到更好的补偿。^23</p>\n<p>德楞泰接到额勒登保告知其赴陕的信时，正在大宁休整——他追击鲜大川与苟文明到大宁后，为过年暂停了一切军事行动。^24 尽管额勒登保指示他留川，德楞泰还是决定也去陕西，并于年后数日奏报了朝廷。对\"长骡\"被砍愤愤不平，德楞泰痛诉：由于失去\"长骡\"，给养不能按时运送，他的部队不得不在大宁冰雪覆盖的山中长时间扎营，没有帐篷与炊具，许多人冻伤，甚至患了雪盲。^25 嘉庆对他的抱怨置之不理，起初反对德楞泰赴陕的计划。他斥责德楞泰在大宁行动迟缓，命他留驻原地与魁伦配合，并指出：魁伦虽然在四川任绿营军官多年，却不善于打仗。^26</p>\n<p>然而，数日之内，嘉庆就更改了德楞泰的任务，因为起事者再次突入了湖北。趁清军主力开赴陕甘前线之机，徐天德与樊人杰率数股联军，于正月初四日从平利强行突入竹溪。随后他们移向房县与保康，但被倭什布率领的湖北军队挡住。趁德楞泰在大宁按兵不动，鲜大川与苟文明前往陕西，试图突入湖北。然而，攻打湖北边境关卡两周之后，他们未能进入湖北，返回了四川。^27 对湖北的关切甚于甘肃，正月十七日，嘉庆改派德楞泰驰援湖北，并命1797年以来驻扎鄂西北汉江北岸的河南军队加强江防。^28 次日，嘉庆作出了一个出人意料的决定：释放明亮出狱，命他火速赶赴湖北。嘉庆历数明亮自18世纪50年代准噶尔诸役到迅速镇压孝感起事的诸多功劳，为他洗脱了所受指控，甚至宽恕了他收受胡齐仑贿赂一事——因为那些钱是用于犒赏士兵的，而两次抄家也证明他没有聚敛巨额财产。^29</p>\n<p>额勒登保反对德楞泰赴陕。正月初八日到达保宁时得知此事，额勒登保急忙致信德楞泰，试图阻止他离开四川。然而，德楞泰已经上路（很可能他收到了额勒登保的信，却选择了不理）。正月二十日，德楞泰与额勒登保、松筠会于褒城。三人不知道几天前叛军已在四川渡过嘉陵江（详见下文），决定让德楞泰先加入甘肃战役——尽管皇帝已命德楞泰回川（命他赴鄂的旨意尚未到达）。他们奏报：甘肃肃清叛军后，额勒登保与德楞泰都将返回四川。^30 接到他们的联名奏折以及台布\"更多起事者从四川进入陕西、有些已渡过汉江\"的奏报，皇帝再次改变主意；他改派德楞泰赴陕西石泉，保障汉江防线。至于湖北前线，嘉庆让魁伦从四川另挑一位将领——七十五、阿哈保或朱射斗——派往湖北。^31</p>\n<p>额勒登保与德楞泰双双离去之后，四川最可观的一支清军是七十五的五千人。然而，七十五这位四川提督，自1799年底到达夔州拦截湖北叛军以来，已数月按兵不动；嘉庆曾指示额勒登保查清七十五是否故意避战。^32 七十五在福康安麾下服役多年，习惯了慷慨的战时犒赏，对前线的改革想必大为沮丧。新年前没有收到皇帝的任何赏银，七十五便向广兴请求每月三百两作犒军之用。毫不奇怪，广兴拒绝了他，让他有理由犒军时再请款，而非定期领钱。^33 心灰意冷的七十五在追击一股叛军到大宁后停止了军事行动。^34</p>\n<p>清方这些变故为四川的起事者创造了最佳机会。青子垭大捷之后，冉天元东移太平、新宁与梁山。^35 曾与冉天元交手的穆克登布随额勒登保赴陕后，冉天元立即前往临江市，在那里与其他四股会合：张子聪率领的白号——他来自大宁，七十五未能拦住他；徐万富率领的黄号；陈得俸率领的线号；王英率领的黑号。一个联盟就此形成，冉天元任其统帅。由于食物短缺，起事者决定西进，渡过嘉陵江，然后北上与陕甘的高马股及其他队伍会合。^36 与1798年初在临江市从容过年不同，这支联军迅速开拔，直奔嘉陵江。^37</p>\n<p>如今主持四川军事行动的魁伦，对敌情全然懵然。他以为徐天德仍在四川，却不知道冉天元联军的行踪，更不用说他们西进的计划了。他在军事前线与战争财政改革两个方面都只向皇帝报喜，这加深了嘉庆的错误印象：大多数起事者已去了陕西或湖北，四川只剩残部——尽管嘉庆有时也怀疑魁伦的说法。^38 魁伦没有说的是，他在四川越来越孤立。除与将领们的冲突外，在如何削减开支上，他与广兴的分歧也日益加深。广兴更坚定、更理想主义，魁伦则越来越现实、越来越温和。^39</p>\n<p>魁伦态度的转变，最鲜明地体现在他对福宁1796年屠杀投降叛军一案及其可能侵吞军费的调查上。一反常态，魁伦为福宁的屠杀辩护，说那是谨慎自卫——福宁没有足够的兵力控制一千多名凶悍的叛军。在魁伦看来，福宁唯一的过错是没有把情况说清楚。魁伦还为福宁的后勤管理辩护，论证说福宁恪守规章，常常驳回将领们无理的请款，以致他们对他心怀怨恨。魁伦只奏报了福宁的一处违规——他从军需局领取了近五千两，用于犒赏守卫达州及附近关卡的部队——并提议让福宁戴罪赴前线效力、不给俸禄，再缴还那五千两。魁伦立场的惊人转变没有打动皇帝；嘉庆拒绝宽恕福宁，要求更重的惩罚——因为福宁的屠杀产生了恶劣影响，使叛军不敢投降。^40</p>\n<p>魁伦与广兴最严重的分歧，围绕裁减四川庞大的乡勇。广兴很快认定与乡勇相关的开支是战役巨额耗费的主因之一，便投身于裁减工作（广兴到达之前，福宁也已开始缩编乡勇，这曾引起军事领导人的不满）。然而，魁伦态度暧昧。他不仅怕加深与将领们的冲突，还看到了使用乡勇的价值——他手头没有足够的军队。因此，他区别对待：在远离前线的地方裁撤乡勇，在热点地区——如鄂川边境沿线——则多雇。此外，魁伦依靠乡勇防守漫长的嘉陵江——川西的天然屏障。广兴裁撤沿江乡勇时，魁伦设法保住了广元至蓬州之间上游河谷的乡勇。^41</p>\n<p>托津回京后，向皇帝呼应了广兴的看法。托津批评魁伦在叛军失去活力之后仍维持一套浪费的防御体系。他特别点了嘉陵江以西昭化、南部与蓬州三地的驻军与关卡——起事者从未踏足那里。但魁伦激烈地为自己的江防辩护，论证说那里的乡勇挫败了起事者的数次渡江企图。嘉庆起初被托津说动，随后又被魁伦说服——他长期以来一直担心嘉陵江的安全。^42 然而，嘉陵江下游河谷连魁伦也忽略了。</p>\n<p>尽管嘉庆称赞魁伦与广兴都清廉勤勉，他却越来越偏向魁伦而非广兴。^43 显然，广兴大胆的个性与毫不妥协的财务作风得罪了很多人；嘉庆听到了不利于广兴的流言。正月初十日，嘉庆以托津取代广兴任四川军需局主管，托津回京之前由阿迪斯署理。^44</p>\n<p>然而，魁伦将遇到比广兴更大的麻烦。他为征剿川东北几股叛军而拼凑远征军时，发现额勒登保留给他的八千名士兵大多不顶用——只有阿哈保率领的三百名索伦骑兵例外。许文谟率领的部队被额勒登保指派守卫达州。百祥的数千名士兵大多是伤病员，被安排在养伤期间守卫后勤站点，装备也很差。百祥集合部队到达达州后，魁伦花了数日分发他们的津贴、给养与装备。直到正月初八日，魁伦才率军从达州出发。但他又不得不在达州南郊的雷音铺停留数日，为朱射斗的部队补充给养——他们从南江赶来，要求先发给他们拖欠已久的津贴。^45 远征军再次出发时，转向东南——因为魁伦仍相信新宁与梁山只有\"零星\"叛军藏在山中，他们或许想移向湖北。^46（地图4.1）</p>\n<p>魁伦迟缓而错误的行动，使冉天元的联军毫无压力。他们轻松渡过渠江，迅速逼近嘉陵江。^47 正月十一日，一支数千人的分遣队到达江北悦来场——与重庆城隔嘉陵江相望。遭到重庆守军从嘉陵江南岸的炮击后，起事者于次日拂晓离开，前往合州，留下几十具尸体，尽管重庆城的戒严直到初夏才解除。^48 到正月十四日，联军抵达合州，但那里嘉陵江宽逾半英里，令他们却步。冉天元挑选了八百名精壮，火速北上定远。正月十五日元宵节的雨夜，叛军斥候扮成清军，来到利渡场石板沱渡口。大多数船只都停泊在对岸——对岸几名乡勇正在参加灯会（定远的乡勇上年夏天已被福宁裁减）。定远知县孙熙元得知起事者朝自己这边来时，曾请求拨款多雇乡勇，但为时已晚。孙熙元只有一百多名士兵，只能闭守定远县城。在渡口，叛军斥候泅水到对岸，杀死船夫，夺取船只。乡勇全都逃跑了。三天里，数千名起事者与被裹挟者——双方估计总数约一万——渡过江去。</p>\n<p>或乘船，或骑马。^49 战争第一次蔓延到四川嘉陵江以西。</p>\n<p>直到正月十二日听到重庆告急，魁伦才把远征军调往合州。然而，他似乎没有料到起事者会渡过嘉陵江。他更担心甘肃的叛军可能窜入川西，便分兵前往川北边境。嘉庆对魁伦行动迟缓皱眉，却赞同他加强北境防务。与魁伦一样，嘉庆也没有预见四川的危机；他坚持要魁伦派一名将领增援湖北。^50 魁伦到达邻水时得知渡江之事。他立即请德楞泰火速回川，并请求贵州派三千名援军入川。他还急信七十五，请他前来救援。魁伦承认自己措置失当、请求处分，却辩称自己并没有裁减沿江乡勇。^51</p>\n<p>魁伦的奏折于二月初一日到达时，这消息对朝廷犹如晴天霹雳。嘉庆花了一整天处理危机，颁发了众多长谕。他虽然勉强承认自己与军机大臣们负有一定责任，仍毫不留情地斥责魁伦酿此大败，声称他的罪比勒保还重——因为勒保任内叛乱没有扩大。然而，他暂不罢免魁伦——理由是魁伦品行高尚——责成他化解危机：或消灭江西之贼，或把他们赶回东岸。^52 除批准魁伦所请的援军外，嘉庆命正赴湖北途中的明亮改道四川。^53 然而，嘉庆那天作出的最不同寻常的决定，是释放勒保出狱，以\"蓝翎侍卫\"（lanling shiwei）身份派回四川。嘉庆宣布：勒保没有贪腐之罪，他的过错——拖延与不作为——被他苗疆战役的贡献与擒获王三槐之功所抵消。^54</p>\n<p>勒保的复出实际上宣判了魁伦的末日——魁伦的处境已因与广兴冲突的升级而恶化。听说四川危机一周前，嘉庆已决定让广兴留川协助托津主持后勤，因为他接到广兴的自辩与更多前线腐败的揭露后，确信广兴可信。^55 嘉陵江渡江事件之后，广兴上了一道又一道奏折，无情地批评魁伦行动迟缓、未能阻止渡江。在前线途中的魁伦不得不还击。他指责对手处理后勤过分严苛，并向皇帝报告：广兴在他离开达州之前，就向他索要总督令箭（lingjian）——总督职位的信物——在魁伦看来这是僭越。魁伦提议由刑部对广兴提起诉讼、严加惩处。危机正酣之际两人的激烈争吵令嘉庆恼怒，他把两人都训斥了一顿，但对魁伦更重。^56</p>\n<p>渡过嘉陵江后，叛军北上，朝甘肃方向移动。但他们先裹挟当地居民，招募啯噜匪徒及其他愿意入伙者。地方士绅组织乡勇抵抗时，起事者以烧杀回应，沿途留下一片狼藉。^57 正月二十三日，他们攻打蓬溪县城——守军很少，城墙还在修缮中——没有攻下。五天后，魁伦来到这座满目废墟、尸骸未掩的城市。他在涪江（时称\"潼江\"）附近设下临时大营——涪江是嘉陵江之后通往成都平原的第二道屏障——并派朱射斗、阿哈保与百祥向北追击敌人。^58 正月二十九日，朱射斗与阿哈保在西充高院场追上了冉天元。由于百祥朝另一方向追一支叛军分遣队去了，朱、阿二人只有两千名士兵。冉天元兵力更大，又占据了高地，几乎全歼敌军，杀死了朱射斗与十几名清军军官；阿哈保得以脱身——这是他在这场战役中第三次死里逃生。^59</p>\n<p>随后，叛军联盟——据说已膨胀到三四万人——向北移动，在嘉陵江与涪江之间的西充、盐亭、南部一带盘桓。失去朱射斗及其部队后，魁伦除了派小队骚扰敌人外，什么也做不了。起事者放松而得意，甚至在西充唱戏摆酒，为冉天元庆生。^60 然而，夹在两条江之间，德楞泰又从北面逼近，他们处境险恶，唯一的出路是渡过涪江。但斥候们的渡江尝试全都失败了。魁伦对江防下足了功夫：他在漫长的江岸设下众多关卡；提高饷银招募乡勇；让刘清率六百名正规兵逐卡巡逻；还部署了三千六百名川西藏兵与金川屯兵。^61 他还在等待七十五的到来。然而，七十五借口腿伤复发，坐着竹椅，行动迟缓。^62</p>\n<p>这让人想起1731年雍正皇帝听说傅尔丹被准噶尔蒙古人惨败时的做法——他没有责备，而是安慰准噶尔之役清军将领之一的傅尔丹，并把自己的腰带附去，提醒傅尔丹自己的责任所在，免得他自杀^63——嘉庆听说朱射斗之死，也克制住自己，没有过分痛斥魁伦，唯恐魁伦自杀。他允许魁伦暂停行动、等待援军，并命贵州再派两千名士兵入川。^64 然而，嘉庆的低调反应并不是对魁伦的宽恕。他把希望寄托在勒保身上，一再催促勒保火速入川，责成他歼灭两江之间的叛军。二月二十日，他任命勒保署理四川总督，赏三品顶戴。他还授权勒保查办四川几名有问题的将领：阿哈保、七十五与阿迪斯。^65 魁伦由此陷入越来越尴尬、越来越艰难的境地。</p>\n<h2>改革派的淡出</h2>\n<p>嘉陵江之败几乎颠覆了嘉庆皇帝轰轰烈烈却又摇摇欲坠的前线改革。对嘉庆而言，军事上的灾难证实了他对新派前线领导人与日俱增的怀疑。通过恢复勒保，他准备掉头。但撤退起初是以进攻的姿态上演的。二月二十四日，嘉庆重提几桩已结的旧案，对几名被革职受罚的将领督抚施以新的惩处。他褫夺了英善吏部侍郎的兼衔，罢免了宜绵乌里雅苏台参赞大臣与三品侍卫的现职，把宜绵与秦承恩流放伊犁。^66 除其他用意外，这些新处分意在向战役现任领导人们发出警告。嘉庆明确划分了他们的责任（额勒登保与那彦成主持甘肃战役；台布主持陕西；德楞泰、魁伦与勒保主持四川；松筠、明亮与倭什布主持湖北），责成他们在各自辖区内肃清叛军，并阻止叛军进出。^66 当时名单上旧班底与1799年的新班底并列，但此后数月里，新领导人们一个接一个地失宠。到1800年中，嘉庆已完成向旧班底的回归。</p>\n<h3>松筠遭斥逐</h3>\n<p>勤勉而干练的松筠，是和珅被清除后最先获任要职的人之一。一到陕西，松筠就留意叛乱的成因与构成，寻求根本之策。与其他总是描绘战役阴暗图景的前线领导人不同，松筠认为叛军并不危及王朝生存——他们领导力弱、潜力有限，除了登山越岭的本事——尽管他有时可能低估了他们的韧性。松筠没有为陕西请求援军，更倾向于使用撒拉族士兵与阿拉善蒙古骑兵——这比从远方调正规军划算。^67 在前线待了几个月后，松筠似乎确信：维系叛乱的是社会弊病，而非教门信仰——叛军不断吸纳边缘人与匪徒（尤其来自此类人众多的四川），因而每次战败后都能重组。有鉴于此，他建议解除四川对私盐贸易与私铸钱币的禁令，以免私盐贩子与伪造钱币者被逼入叛乱。然而，这个提议令嘉庆极度不安，认为它荒谬而冒犯，以至于他让军机大臣们起草谕旨批评松筠，而不让军机章京代笔。^68</p>\n<p>此事使松筠失去了在朝廷的良好印象。此后，松筠常常被挑出过错。1799年底，他试图延长陕西撒拉族士兵的服役期，遭到嘉庆的严厉批评。松筠奉命审讯被罢免的永保、明亮与庆成时，他对明亮与庆成的宽恕态度再次激怒了嘉庆。^69 1799年临近尾声时，嘉庆已完全失去对松筠的信任。除\"严旨申饬\"外，他还褫夺了松筠的荣衔与翎羽顶戴。只因为找不到合适的人选接替，他才让松筠留任。^70 嘉庆常常把松筠与那彦成一起贬斥，尽管二人从未亲近。或许是对那彦成新贵的做派不自在，松筠一直试图与他保持距离，这又招致嘉庆责备松筠：奏折里从不提那彦成的行踪与战况。^71</p>\n<p>尽管不得不忍受种种批评，松筠仍坚持自己对叛乱迁延原因的看法。书信不能说服皇帝，他就想当面陈述。1800年初，松筠请求短期休假进京面圣。^72 然而，就在松筠写这道奏折的当天——正月初八日——嘉庆罢免了他的总督之职，任命他为伊犁将军。十天后，嘉庆又命松筠赴鄂署理湖广总督——因为湖北局势似乎在恶化。台布与接替松筠的长麟都请求让松筠留陕，嘉庆没有同意。^73 在陕西近十个月的任期内，松筠早就意识到：不危及许多人的既得利益，就不可能根除战争财政的弊病，于是他选择不硬碰硬，从而避免了与陕西其他领导人的紧张关系。然而，他没能让皇帝满意。</p>\n<p>二月初，松筠刚到襄阳，被改派湖北的复职明亮也到了。稍早前，荆州将军弘丰与新任湖广总督姜晟先后到达，各带一千名士兵。^74 明亮坐镇湖北军事、姜晟接任总督，松筠或许觉得自己的存在已无必要。三月下旬，他把部队交给明亮与倭什布，请求进京，抱怨病后体虚。但他也说，想当面奏报战役及战场省份的情况。这一次嘉庆同意他回京。^75</p>\n<p>在四月之后的闰月里连续数日的觐见中，松筠再次陈述了他在四川解除私盐与私铸禁令、设卡征税的提议。他写了一道详陈己见的奏折，当面呈上。嘉庆再次被激怒。他论证说：不允许私人染指这两项重要事业，是本朝成法，他不能更改。他还指出，四川一开私铸之禁，他省必群起效尤，将在经济领域造成大乱。对松筠坚持己见不悦，嘉庆拒绝了松筠重返战役的请求。他把松筠由伊犁将军降为副都统，以最低的旗衔\"领队大臣\"（lingdui dachen）把他发往新疆。^76 松筠虽然未受法律惩处，前往遥远的新疆却不啻流放；他将在那里待将近十年。^77</p>\n<h3>魁伦获赐自尽</h3>\n<p>然而，松筠的结局比魁伦好得多——魁伦没能活过这一年。二月初三日——接到渡江消息、恢复勒保职务两天后——嘉庆命德楞泰火速回川，主持那里的战役。^78 嘉庆虽然把嘉陵江之败归咎于德楞泰，却不得不倚重这位能干的将领，希望他能歼灭两江之间的冉天元联军。鉴于德楞泰惯于故意拖延、从不全歼任何股团，嘉庆许他更高的爵位，同时以严惩相威胁。^79 军权既已交给德楞泰，魁伦被完全晾在一边。</p>\n<p>在警讯频传中返回四川，德楞泰信心十足——他知道敌人夹在两江之间，处境不利。他告诉等候他的地方官员：把所有船只都停泊到城镇附近，但听任叛军在他们待过的地方游荡。^80 二月十八日到达广元后，德楞泰迅速南下，二月二十四日在江油遭遇冉天元。战斗中，冉天元把德楞泰诱至新店子——他在那里设了埋伏。遭到占据高地的冉天元部众的袭击，德楞泰的部队伤亡惨重，一百多名士兵与数十名军官死伤，尽管冉天元也损失了许多人——包括他的弟弟——陈得俸被俘；冉天元本人右手掌负伤。战后，德楞泰暂停行动，向魁伦请求增援。^81</p>\n<p>德楞泰从魁伦那里得到近五千名士兵——包括那三百名索伦兵——后，三月初在江油连续作战。冉天元让自己的队伍不断运动，反复使用他钟爱的伏击战术。然而，三月初六日，他在马蹄岗被德楞泰击溃；冉天元双腿重伤后被擒。^82 三十六岁的冉天元是位天赋过人的叛军统帅，被俘后仍桀骜不驯。他被押送成都，凌迟处死。^83</p>\n<p>叛军联盟的余部——仍有数千人——退入剑州，据守石门寨——当地人修筑的一座大堡。三月十三日，德楞泰赶到，破寨而入，杀死数百人、俘获更多，其中包括陈得俸的妻子——她身着白衣参战，手擎大旗，上书\"替夫报仇\"（Tifubaochou）四字。然而，大多数起事者及其许多家属攀崖逃脱。德楞泰很可能并不打算把他们一次全歼。^84</p>\n<p>德楞泰有效地打断了联军的脊梁。与往常一样，德楞泰的胜利伴随着一场屠杀。除战场上数千人被杀外，德楞泰还随意屠杀俘虏，动辄使用凌迟等残忍手段。^85 嘉庆不为其暴行所扰，对德楞泰的迅速进展欣喜若狂。德楞泰每报一仗，嘉庆就对他及部下赏赐无数：礼物、升迁、加饷。他把德楞泰的爵位从二等男升为三等子，并因七十五拖延被革职，让德楞泰署理四川提督。^86</p>\n<p>然而，德楞泰戛然中止了他的凯歌行进。他奏报：一万多名起事者及其家属从石门寨逃脱，正逼近涪江。然而，他只派了约两百名斥候尾随，说他正指望魁伦的江防。^87 从后来的事态看，德楞泰可能是故意给起事者留出渡涪江的机会。但他或许不是这个计谋的唯一主谋。三月十二日——石门寨之战前夜——勒保到达广元。他可能在战后立即与德楞泰会了面，尽管两人都没有奏报朝廷。^88</p>\n<p>尽管嘉庆一再催促，勒保仍以蜗牛般的速度向四川移动。二月十八日到达西安后，勒保花了三周才到广元；他给的理由是：为确保一批军费经栈道安全转运，他在凤县停留了数日。走得慢，勒保自有好处。他或许在等德楞泰的胜利，同时设法在奔赴前线前集结一支可观的军队。^89 然而，勒保最大的顾虑应当是魁伦还在四川。德楞泰最近的胜利帮了魁伦——四川战场的改善缓解了皇帝对魁伦的怒气。三月二十一日，嘉庆对魁伦保卫涪江的努力表示满意，让他署理四川总督（但把品级从一品降为三品），打算留他在四川主持江防。同时，嘉庆撤销了先前让勒保署理四川总督的决定，任命勒保为四川提督（因德楞泰正署理此职，嘉庆让德楞泰任成都将军）。嘉庆把勒保的品级从三品降为四品，裁定勒保留任观察八年。^90 这道谕旨虽未送达，勒保与德楞泰会面时，二人应当明白把魁伦留在四川的利害所在。颠覆魁伦最有效的办法，是再制造一场危机——眼前这场危机就是叛军渡涪江，因为嘉庆一再重申：守住涪江是魁伦的\"生死关头\"。^91</p>\n<p>事实上，让它发生并不难。魁伦把近五千名士兵拨给德楞泰、一千名拨给阿迪斯（魁伦责令阿迪斯对付川东北的全部叛军），又留下数千人守卫涪江中游河谷附近的重镇——蓬溪、射洪、盐亭、三台、梓潼——之后，兵力已所剩无几。到最后，涪江下游河谷——从绵州金山驿（绵州州城）到射洪太和镇一段——他只有乡勇可用。魁伦与其最后一千余名士兵驻金山驿，让刘清主持下游各段防务。三月十五日，三千名贵州兵到达金山驿，德楞泰立即派他们去守卫潼川城。魁伦担心涪江下游河谷，却以\"叛军还远\"的想法自我安慰。^92</p>\n<p>趁德楞泰停顿之机，幸存的叛军迅速重组。蓝号拥立冉天元的堂弟冉天泗为新首领，损失惨重的线号并入其中。白号首领张子聪成为联军新统帅。仍试图前往甘肃，他们尝试渡过涪江。^93 一次尝试失败后——水很深，对岸乡勇又向他们开火——他们迅速移向射洪。三月十八日夜，他们到达太和镇。张子聪挑选了约一千名精壮，于黎明前在太和镇以北数里的王家嘴涉水渡江——那里因久旱水浅。随后他们击溃了太和镇的一百五十名乡勇，夺取了船只。德楞泰的斥候三月十九日晚些时候赶到时，只截杀了最后一批在岸边等船的一百多人。不久，刘清急忙赶来，德楞泰却直到次日傍晚才到。为撇清责任、把罪责推给魁伦，德楞泰奏报说有些船只留在了东岸。^94 刘清关于渡江的奏报三月十九日刚到金山驿魁伦手中，勒保就到了——他或许盘算好了行程，以免被追究渡江之责。在一道简短的奏折里（他的奏折通常冗长详尽），勒保奏报：叛军已渡涪江，他刚刚抵达前线。^95</p>\n<p>渡过了涪江，富饶丰裕的成都平原就在叛军脚下。他们没有立即前往甘肃，而是被诱惑着先收割一番。联军分作两路：蓝号与黄号向东南前往安岳与遂宁，张子聪率领的白号前往中江；两路的目标都是成都。成都慌忙布防、安置从城郊涌入的数万难民之际，^96 德楞泰加快了速度。三月二十二日，他在射洪新店子追上了张子聪，据说杀俘数千。^97 与此同时，魁伦与勒保急忙赶往中江，拦截前往成都平原诸县的叛军分遣队。^98 但新店子之战后，起事者放弃了前往成都的计划，决定返回川东。三月二十七日夜，除张子聪一股外，各股叛军都在太和镇涉水东渡涪江。魁伦与勒保次日清晨赶到，正好截住他们的队尾，杀死了江中与西岸的叛军。随后魁伦与勒保分手，前往龙安府对付甘肃来的叛军——两人或许都预料很快就会再见。^99</p>\n<p>张子聪在成都平原只多盘桓了几天。德楞泰在中江富家河一场恶战中击溃了他。四月初，张子聪率其最后的一千人重新渡过涪江，与东岸的其他叛军会合。起事者沿嘉陵江北移，到达剑州江口。他们的斥候泅水到东岸，夺取了一些船只，把他们渡到嘉陵江东岸。前一天刚会过面的勒保与德楞泰，于四月初八日渡江进行到一半时赶到江口。他们杀死数千人、俘获数百——俘获的大多是被裹挟的平民——还有大量牲口。只有两千来名叛军到了东岸，随后进入广元与南江的山区。叛军联盟在嘉陵江以西近三个月的游窜，是这场冲突唯一一次蔓延到成都平原。联盟的迅速崩溃证明：德楞泰允许叛军渡涪江，冒的风险并不太大——他们的核心只有几千人，大多数被裹挟的平民很快就脱逃了。勒保追击叛军到东岸后，与德楞泰分手，西转龙安。朝廷责成他在那里督剿来自甘肃的高马股，更重要的是，逮捕魁伦。^100</p>\n<p>魁伦的倒台并不意外。三月二十九日接到起事者西渡涪江的消息后，嘉庆立即罢免了魁伦，下令将他逮捕审讯。他慌忙收回先前对魁伦江防努力的称赞，如今痛斥他守江失败。勒保再次被命署理魁伦之职；他还奉命逮捕并审讯魁伦。^101 仅仅六个月，勒保与魁伦就互换了被告与主审的角色。仿佛对充当魁伦的主审感到不自在，勒保告诉皇帝，这差事对他而言很为难：</p>\n<p>勒保告诉皇帝，这差事对他而言很为难：从严会被指责报复，从宽又会被指责包庇（他声称自己与魁伦是亲戚，但没有说明是什么亲戚）。然而，勒保并没有回避。相反，他请求与他一同审理此案的是周兴岱——一位奉派赴川陕祭祀名山佛道的钦差。周兴岱是四川人，还负有搜集战役情报的秘密使命。一路上与朝廷书信往还，周兴岱必定知道自己在审理中该怎么做。^102 尽管魁伦的自辩言之成理，勒保与周兴岱还是认定：他应对叛军渡过嘉陵江与涪江以及朱射斗之死负责。此外，周兴岱还指控他：叛军蹂躏绵州一带时拒绝派兵救援，造成重大伤亡。勒保补充说，一名脱队军官被乡勇头目误杀时，魁伦谎报该军官阵亡。然而，精明的勒保没有提出刑罚建议，只说还需要更多证人，而他又要赶赴前线——尽管他们的调查结果已构成重罪。^103</p>\n<p>接办此案的军机大臣们于四月二十七日建议：在成都将魁伦明正典刑。不过，嘉庆虽然批准死刑，却命把魁伦押解北京再审。^104 嘉庆或许需要更多时间来论证死刑的正当性——这场战役还没有任何高级官员被处死。永保与惠龄没有被处决，尽管他们的\"罪行\"造成的损害比魁伦案更严重——到此时，叛军联盟已经瓦解，残部已被赶回嘉陵江以东。</p>\n<p>魁伦在北京复审之后，六月二十三日，军机大臣们维持了原判死刑。嘉庆同意死刑，强调了两江河谷的惨状与百姓的苦难。研究了几个高级官员死刑的先例后，嘉庆选择以杨应琚案——18世纪60年代清朝缅甸战争时的云贵总督——为魁伦量刑的蓝本，因为二人同任总督，同在夸口能胜之后未能把战争引向胜利，又都谎报信息欺骗朝廷（就魁伦而言，嘉庆指的是他谎报军官之死）。仿效乾隆对杨应琚赐自尽的决定，嘉庆把魁伦的判决由处决改为自尽。这是一份恩典——魁伦可以免于当众斩首之辱，尸身得以保全——因为正如皇帝所指出的，他是自愿奔赴前线的。^105</p>\n<p>四十九岁的和珅自缢十六个月后，四十八岁的魁伦以同样的方式死去，成为这场漫长战争中第一个、也是唯一一个被处死的大员。与留下巨额家产的和珅不同，魁伦并不富有，被捕时没有钱像勒保那样赎身。更糟的是，魁伦还欠着福建任上的十万二千多两亏空。^106 魁伦死后，其妻遵夫遗嘱，把全部家产——包括北京的几处房产与私人物品——呈缴官府。然而，总值还不到巨额亏空的十分之一。嘉庆蠲免了余下的债务，允许魁伦之妻保留一处由家中仆人居住的房子。他还裁定：因魁伦案刚被流放伊犁的独子，三年后可以回家。嘉庆再次称赞魁伦的清廉，说魁伦的高尚品行是他决定把刑罚从处决减为自尽的一个因素。他补充说，官员清廉是有好处的——一旦获罪，它可以帮助减轻刑罚。^106</p>\n<p>嘉庆显然对魁伦之死感到某种不安。唯恐被指责处置高级官员轻率，嘉庆在魁伦死前死后都激烈地、反复地为自己的惩处辩护。他论证说：既然他惩处过父亲任命的人——如明亮与勒保——他就不可能偏袒自己任命的魁伦。更重要的是，他试图借魁伦案强化自己\"刚毅之君、可与意志坚强的列祖列宗比肩\"的形象——一个能对高位者施以严惩的君主。^107 就此而言，魁伦不仅是为他所犯的\"罪行\"牺牲，也是为了满足嘉庆的政治戏剧需要。嘉庆之所以挑中正直的魁伦而非别人，还因为——正如嘉庆不止一次说过的——魁伦与他并不亲近，处置起来比较容易。^108</p>\n<p>魁伦之死也被当作对战役领导层的警告。嘉庆立即把对魁伦的最终判决告知额勒登保、德楞泰、明亮与全体督抚。他敦促他们在新期限——秋至冬之间——内完成战役，以免像魁伦那样受罚。^109 然而，魁伦之死事实上帮德楞泰与额勒登保免除了四川溃败的责任。嘉庆清楚地知道，额勒登保与德楞泰撤出四川是叛军渡嘉陵江的关键因素，他曾反复责备二人，使额勒登保一直处于守势。^110 替罪羊既死，案子也就结了。至于渡涪江，嘉庆选择不怪罪德楞泰，说石门寨之战后他松开缰绳，是因为他必须追击四散的叛军。嘉庆为德楞泰初期的胜利而欣喜——他把德楞泰的爵位从三等子升为一等，并正式任命他为成都将军——尽量不与战场上能干的德楞泰对着干。然而，他很快就对德楞泰旧习复发——不彻底了结起事者——警惕起来，尤其恼怒于他未能在叛军联盟渡回嘉陵江东岸之前消灭其残部；他对德楞泰的新\"胜利\"也不再那么兴奋。^111</p>\n<p>既没有钱，又与皇帝没有私交，魁伦似乎是适合牺牲的人选。此外，他讲原则的品格与直率的性情也为他树敌众多。因此，几乎没有人惋惜他的死。^112 只有魁伦的汉族朋友、学者许敬在一首诗里表达了淡淡的同情。许敬把魁伦比作唐朝宰相房琯——安史之乱期间，房琯自请率军收复京城，结果全军覆没，惨败而归。然而，房琯的朋友、诗人杜甫为房琯求情，房琯未受惩处。许敬哀叹自己不是杜甫，只能寄望魁伦死后化作厉鬼，杀尽叛军以自赎：</p>\n<blockquote>\n<p>潼江水浩浩，\n贼马饮于河，贼势方张；\n王师未能及时赶到，\n老弱绝望呼号；\n江水变红，尸体随波而去。\n蒙受如此浩荡皇恩，\n岂能不为己罪担责？\n化作厉鬼，执刀挽弓，\n上报苍天，下遏狂澜；\n扫尽贼寇，血染战袍；\n贼无所逃，如燎毛羽，尽数伏诛。^113</p>\n<p>[译者按：许敬诗自英文直译，中文原文待补，见注释113。]</p>\n</blockquote>\n<h3>那彦成蒙羞</h3>\n<p>1800年夏末魁伦死去之时，那彦成——那个有望填补和珅空缺的钦差大臣——已经倒台。^114 到陕西以来，那彦成始终未能了结张汉潮的数百名残部，又不顾皇帝的多次命令，拒绝撤出秦岭。正月初，得知高马股、戴家营及其他襄阳出身各股侵入甘肃，嘉庆立即命那彦成火速赶去。但张汉潮的最后人马此时已走出山林，迅速前往陕豫、陕鄂边境。那彦成声称是他的部队把他们赶出去的，嘉庆却怀疑——他认为是他们给养耗尽才出山的。把叛军从边境赶回去的战斗并不顺利。直到嘉庆又给了他一次\"严旨申饬\"，那彦成等人才迫使叛军离开豫鄂边境。那彦成再次被催促赶赴甘肃，并限期三个月完成那里的战役。那彦成把五千名绿营兵留在陕西，带走了全部旗兵。他的岳父恒瑞与他一同前往甘肃。^115（地图4.2）</p>\n<p>在甘肃，起事者一直游荡于成县、秦州、礼县与伏羌，但已被甘肃军队遏制打击。^116 正月下旬，那彦成与恒瑞从宝鸡进入甘肃（他们经栈道追击一支大队叛军），很快取得两场胜利，对付杨开甲一万多人的队伍——其中大多数是被裹挟的平民——先在秦安龙山镇，后在伏羌秀金镇。第二场战斗中，德楞泰赶到，帮助击溃了叛军。那彦成参战以来第一次，嘉庆大加称赞他，并赏其部队一个月饷银。由于嘉陵江之败，嘉庆命德楞泰返回四川，责成那彦成与恒瑞在夏天之前消灭甘肃叛军。^117</p>\n<p>与此同时，额勒登保一直缓慢地向前线移动。直到二月初九日——从达州出发一个多月后——额勒登保才到达秦州与那彦成会合。嘉庆不悦，但听说额勒登保旧病复发，立刻原谅了他。^118 额勒登保或许确实病了，但也可能是不愿与那彦成合作。事实上，嘉庆曾一再警告那彦成不要自傲、不要不服从额勒登保。那彦成虽一再表示二人关系融洽——他小时候，额勒登保在北京当侍卫，他们就相识了——嘉庆仍怀疑：\"贫贱之交，未必能保于富贵之后。\"（原文待核，见注释119）^119 确实，如今平步青云的那彦成几乎按捺不住骄矜之气。甘肃首捷之后，他要求\"参赞大臣\"之衔——这将使他成为额勒登保的副手。嘉庆同意了，却不以为然。二人合兵之后，嘉庆指示那彦成统领甘肃全部军队——包括额勒登保的——因为额勒登保病了。然而，嘉庆不允许那彦成署理额勒登保之职。^120</p>\n<p>不过，他们只合作了很短时间。尽管皇帝有令，额勒登保并没有把部队的指挥权交给那彦成，而且很快亲自返回前线。二月下旬，在广厚率领的两千三百名甘肃兵的增援下，占优的清军在岷州与礼县的数场战斗中击垮了渡过渭河南岸的高马股及其他股团，杀俘数千。随后，额勒登保与那彦成挫败了高马股前往四川松潘的企图，迫使其北转，并在二月底前于礼辛镇将其击溃。^121 此役之后，额勒登保与那彦成分手，率其四千名士兵前往秦州；那彦成与遵旨重新参战的庆成则向南追击高马股。^122 额勒登保与那彦成之间很可能发生了以那彦成旗兵为中心的冲突。嘉庆长期以来认为那彦成兵力过大，指示额勒登保从那彦成那里取得一千名吉林旗兵，而不是增调旗兵。^123 那彦成赴甘时，嘉庆还让他与额勒登保商量如何分兵。那彦成很可能拒绝给额勒登保任何旗兵。结果，两人都请求增援，嘉庆却认为没有必要。^124</p>\n<p>清军精锐开赴甘肃，使陕西暴露。以襄阳老叛军伍金柱为首，正月下旬渡过汉江的几股四川叛军合并，成为\"伍家营\"（Wujiaying）。无法抵达湖北，这支队伍在镇安与旬阳一带游荡，据说通过招募当地教众与裹挟他人，聚众两三万人。二月旬阳三岔河的一场战斗中，这支队伍几乎全歼了一支两千人的清军，杀死了其首领——一位总兵。^125 在汉江以南，苟文明、鲜大川、龙绍周与唐大信率领的各股叛军反复试图从四川突入兴安。为防止他们渡江，数名军官与陕西省级官员驻节紫阳与安康。三月中旬，由于清军压力与甘肃资源匮乏，数千名起事者——包括戴家营、张世龙、张添伦、杨开甲与辛聪——从甘肃返回陕西。回应陕西绝望的求援，嘉庆先命恒瑞率其两千四百人回陕，^126 随后又指示额勒登保回陕，让那彦成留甘了结高马股——甘肃境内唯一被困于该省荒凉的东南一角的叛军股团。^127</p>\n<p>那彦成与庆成冒着冰雪覆盖的群山，追击四千多人的高马股，向文县而去。一些起事者绝望地上吊或投河。三月十六日，那彦成追上了正在围攻卡郎寨的叛军——卡郎寨是一座庇护一万名平民的大堡——将其击溃，杀俘近两千，此外还有许多人在踩踏与坠崖中丧生。但约一千人逃走了，消失在川甘边境的森林里，随后突入四川龙安府。然而，那彦成请求让驻龙安的百祥去对付这些叛军，自己则请求返回陕西。嘉庆勉强同意，同时对那彦成未能全歼此股怒火中烧。因此，他对那彦成肃清甘肃之功分文不赏。^128</p>\n<p>嘉庆命额勒登保回陕时，额勒登保已经在回陕途中。听说那彦成卡郎寨之战，额勒登保在一道奏折中表达了对高马股入川的担忧——这显然是暗地里抱怨那彦成未竟全功。^129 然而，额勒登保自己也受到了严厉而持续的批评。出任统帅半年多仍未能结束战役——事实上，四川与陕西的局势都急剧恶化——嘉庆对额勒登保统率战役的能力产生了怀疑，尽管他对其品格的信赖毫不动摇。他还不断严厉斥责陕西的其他领导人。通过秘密渠道，嘉庆得知：从甘肃返回的起事者已进入秦岭，占据要地，劫掠裹挟平民，阻断商旅与官道，而陕西的将领官员竟一场仗都没打过。他命额勒登保查办有关人员，以处分相威胁。他还设了一个新的——尽管不切实际的——期限：四月底前肃清陕西全部叛军。或许是察觉到额勒登保与那彦成之间的紧张关系，他指示那彦成前往川北。^130</p>\n<p>回到陕西，那彦成于四月初十日在洋县与额勒登保会面。额勒登保此时或许提出了要那彦成旗兵的要求——因为嘉庆再次让额勒登保从那彦成那里取得一两千名旗兵。指望着得到他们，额勒登保拒绝了嘉庆从四川调三千名贵州兵给他的提议。然而，那彦成显然没有照办。与上次一样，两人最终都请求增援。他们声称：除伤病员与不堪用者外，可用之兵不足五千，却要对付十几股叛军，于是要求一万三千名援军，计划编成五路，肃清陕西叛军。^131 他们的请求与嘉庆近来\"多用乡勇、少用正规军\"的倾向相悖，令他不快；但嘉庆还是同意派六千名士兵赴陕、两千名赴豫——因为他非常担心额勒登保与那彦成在陕南会迫使起事者入豫。他严厉斥责二人对河南毫不关心，撤销了那彦成入川的决定，并严正告诫二人务必不遗余力地保障河南。同时，嘉庆让吴熊光加强河南边防，为此甚至愿意提供一些经费。^132</p>\n<p>事实上，吴熊光一直在提醒朝廷注意陕西叛军的动向——它们表明叛军有入豫意图。^133 确实，三月下旬，几股叛军开始东移商州，与清朝边境驻军发生冲突。或许是为了分散清军注意力，伍家营派出分遣队攻打安康与旬阳县城，两次都失败了。嘉庆认为叛军入豫是重大挫折——因为在富庶人口稠密的河南，起事者更容易获得给养与新血——他宁愿他们去川东北或甘肃。^134 嘉庆心神不宁地部署河南防务，命向河南增派援军。同时，他加紧了对陕西领导人的批评。除给每人\"严旨申饬\"外，他还摘去了额勒登保、那彦成、长麟与台布的翎羽顶戴。^135 在皇帝日增的压力下，额勒登保、那彦成与恒瑞急忙赶往陕西东南角，吴熊光则奔赴荆紫关，其部队甚至越界到了洛南与商南。四月底，额勒登保在边境附近两场战斗中击溃杨开甲等人之后，叛军离开了豫陕边境。^136</p>\n<p>河南危机刚一解除，湖北又陷入危险。突入河南不逞之后，起事者采取了新策略。一支合并起来的队伍向西进入秦岭，由冉学胜率领——这位襄阳叛军外号\"青眼窝元帅\"（Qingyanwo Yuanshuai），已成为张汉潮残部的首领。与此同时，闰月初，杨开甲、辛聪与张添伦趁守卡乡勇回乡收割之际，在郧西突入湖北。随后伍家营也转向那个方向。显然，他们打算绕道入豫。恒瑞先赶到那里，却吃了一场败仗，损失数百名士兵，尽管叛军的伤亡也不轻。^137 数日后，额勒登保与那彦成在镇安会面后，率其大军进入湖北。^138 叛军似乎智胜了他的将领们，这令嘉庆震怒。在闰四月十五日的一道长谕中，他指责将领们没有拿出通盘方略，并宣泄了自己从千里之外指挥战役的沮丧。</p>\n<p>对那彦成失去信心的嘉庆，终止了他的使命，命他把全部军队交给额勒登保，返回京城。^139</p>\n<p>嘉庆对那彦成的不满，又因四川的警报而加剧：高马股突入龙安与松潘之后，队伍扩大，对成都构成威胁。嘉庆一再谴责那彦成，勾销了他在甘肃对高马股作战所积的功绩。即使听说那彦成在湖北与伍家营激战终日、杀敌数百、重创伍金柱，他也没有赏赐那彦成或其部队。^140 命那彦成回京后不久，压垮嘉庆对那彦成最后希望的最后一根稻草落了下来：石进等数名军官在龙安与高马股作战时阵亡。嘉庆再次痛斥那彦成，把石进之死归咎于他没有全歼高马股，并再次批评他滞留秦岭，给了叛军入甘的机会。此外，他还指责那彦成试图与额勒登保争功，过早从甘肃返回。嘉庆褫夺了那彦成众多职衔中的大部分，以及紫禁城骑马的资格。然而，他还是给那彦成留下了三个职位——因为他不愿把阿桂的后代全部从高位上除名——他刚刚罢免了那彦成的叔父阿迪斯，将其流放新疆。^141</p>\n<p>接到回京的谕旨后，那彦成并没有如嘉庆所料请求留在前线。他立即收拾行装，从郧西启程返京。他于五月下旬回到北京——距他离京已经十个月。嘉庆连日召见他，希望从那彦成那里听到令人信服的自我辩护，好给皇帝一个把他从彻底垮台中捞出来的借口。然而，被对战役的悲观与自身灾祸压垮的那彦成，没有对战役提出任何有用的分析或想法。相反，他消极、冷漠，有时语无伦次。他告诉皇帝：叛军就像蝗虫，太多太密，人力无法消灭；叛乱是一场注定的劫数，劫数未满，即便最杰出的将领也无能为力。嘉庆告诉他额勒登保在他离开后立即取得的胜利，那彦成耸耸肩，表示不信。皇帝很不高兴。^142</p>\n<p>嘉庆褫夺了那彦成最后三个职位，但阿桂之孙的身份使他免于流放新疆。沦为区区翰林院一员的那彦成，回到了他十年前起步的地方。^143 比个人悲剧更重要的是，那彦成的倒台迫使嘉庆放弃了\"以自己门生填补和珅空缺\"的计划，从而终结了\"依赖一位领班军机大臣\"的做法，为军机处更寡头化的运作方式打开了大门。</p>\n<h3>广兴与托津被召回</h3>\n<p>嘉庆终止那彦成使命两周后，于闰四月底召回了广兴与托津。正月下旬——听到叛军渡嘉陵江消息前不久——嘉庆曾命广兴留川，与托津共同主持后勤。但好斗的广兴此后继续无情地攻击魁伦，无视嘉庆\"与魁伦相处要有节制\"的告诫。就连魁伦的善意表示——他奏请让广兴留任到托津到来——也没能换来停战。最后，皇帝烦了；二月，他暂停了广兴的职责，但仍让广兴留驻达州听候指示。^144</p>\n<p>托津在川西危机正酣时到达达州，此时人们对战争财政改革已无多少热情。四十五六岁的御史托津，在削减开支上采取了务实的做法。他对地方官员的请款虽然坚决控制，对军队将领却不像广兴那样严厉。起初，托津对四川战场的财政状况颇有信心。三月下旬，他估计手头的经费加上在途经费可以支撑几个月——他相信到那时战役已经结束。^145 然而，仅仅几周，他就改变了看法：抱怨军队、乡勇与后勤人员的开支巨大，担心下个月的经费不足。于是，他向中枢政府请求增拨经费。嘉庆恼了，命托津与广兴一同回京，批评托津胸无成算、广兴好生事端。为论证自己的决定，他说：既然湖北、陕西都没有设后勤钦差，四川也不必特殊。同时，嘉庆任命勒保以署理四川总督的身份监督后勤，并挑选任命地方官员主持达州军需局。^146</p>\n<p>很可能皇帝听到了不利于托津的流言。此外，托津要钱来得不是时候。到1800年，清朝国家在连续数年的巨额亏空后，正艰难地恢复财政平衡。所有政府部门都被动员起来开源节流，嘉庆则在想方设法支撑这场耗资巨大的镇压战役。嘉庆虽然知道勒保与德楞泰都是大手大脚、积习难改的人，还是下了一着狠棋。在闰四月二十八日给勒保、德楞泰——关于把后勤大权交给勒保——的谕旨中，他命他们把伤病兵遣回本省，只留数千精兵，少用受雇乡勇、多招义勇。他从户部与内务府两库为四川战场拨了四十万两，并告诉二人：这笔钱之后，北京不再给钱了；此后勒保应当用四川本省钱款支付战役开支。嘉庆论证说：叛乱起因于地方官的腐败与治理不善，因此，用本省钱款平叛是地方官的责任。只有当他们失职、听任叛乱升级、殃及他省时，中枢政府才不得不介入，挑起财政重担。然而，正如皇帝所哀叹的，这反过来成了战争领导人们自肥的大好机会，叛乱不断扩大，中枢政府的府库随之枯竭。^147</p>\n<p>嘉庆对这场指挥失当的战役动态的剖析，颇有见地。确实，国家过分慷慨的财政支持，助长了战争领导人对越来越多经费的胃口，使他们无意尽快结束军事行动。尽管嘉庆威胁切断现金管道，国家却不太可能与这场战役撇清干系——尤其是勒保回川监督后勤之后。勒保很快着手撤销改革、恢复旧秩序。起初，他与德楞泰试图把石作瑞——被魁伦罢免逮捕的前军需大员——弄回来。由于魁伦没有找到足够的定罪证据，嘉庆释放了石作瑞，发还了被抄没的家产。返回四川时，德楞泰曾请魁伦派石作瑞来主持其部队的后勤。随后，德楞泰奏请恢复石作瑞的原职原衔，称赞他勤勉、老练、高效，尤其善于安置难民、审讯俘虏。但嘉庆只允许石作瑞以革职官员身份在军中效力，把一切恩典推迟到战役结束。^148 两周后，勒保与德楞泰再次请求。除先前的称赞外，他们强调石作瑞是被魁伦诬陷的——这是\"全省官民\"公认的。嘉庆仍然犹豫，但还是恢复了石作瑞的道员之职，这为石作瑞在勒保主持下重掌四川军需大权铺平了道路。^149</p>\n<h3>更多的处分</h3>\n<p>嘉庆再次对主要战争领导人行使皇权——这一次他瞄准的是自己任命的人——的同时，还对战役中一大批中下级军官官员施以惩处。三月，六十八岁的宁夏总兵吉兰泰与陕西道员常亨因年初未能阻止高马股侵入甘肃而被罢免，尽管额勒登保与那彦成为他们求了情。^150 同月，嘉庆罢免了四川的两名将领七十五与阿迪斯。嘉庆骂二人是\"一对蠢材\"，反复不断地批评他们对川西危机的反应迟缓。七十五的行径或许是故意的——他对改革积怨甚深；阿迪斯则纯属不称职——就连他的父亲阿桂也曾说过，阿迪斯绝不该出任京外之职。1799年底到四川以来，阿迪斯一直在大宁闲居——那里当时几乎没有战事。接到魁伦通报叛军渡嘉陵江的信后，阿迪斯拖了几周才动身。三月下旬到达重庆时，他以左腿残疾为由辞了职。如果说那彦成的火箭式擢升是阿迪斯获任四川的原因，那么一旦那彦成自己失宠，平庸的阿迪斯便几乎没有留任的可能。召回那彦成的次日，嘉庆把阿迪斯流放伊犁，并褫夺了他四个儿子的职位。^151</p>\n<p>春末夏初，嘉庆还惩处了大批其他失职或行为不端的军官，并对那些袖手旁观者进行调查。^152 四月初，嘉庆迈出了更大胆的一步：他下令清查普遍存在的谎报战功行为。他要求调阅父亲主政的头三年战役期间所授全部升赏的档案，重新审核，剔除虚假者。^153 这一举措虽然因不切实际而走得不远，却揭出了1796年的一桩欺诈案：湖北一场从未发生过的战斗被当作胜利奏报朝廷，二十多人因此升官受赏。嘉庆撤销了几乎所有升赏，包括当时湖北巡抚汪新的。^154 这些处分看似严厉，却是1800年上半年嘉庆与这艘危船领导层较量中的最后一搏。从下半年起，嘉庆的决心开始蒸发。最终，在这场漫长战争的其余岁月里，他从鹰派立场退回到放任自流。</p>\n<h3>刘之协的被捕</h3>\n<p>1800年初秋，刘之协在河南被捕。自叛乱爆发以来，清朝一直在追捕他，但线索很少，且无一可信。^155 事实上，刘之协从未离开河南。襄阳起事前夕藏匿起来后，他一直住在新野与邓州教门中人的家里。清军地方部队挨家挨户搜捕嫌疑人时，他就躲在隔壁邻居的后院。部队一搜到隔壁，他就回到第一家。通过信使，他与王廷诏保持着断断续续的联系。^156 这条联络线很可能是在1797年初襄阳队伍经河南入川之后建立的；否则，襄阳叛军在河南时就会去找刘之协。此后，刘之协留在河南，可能成为叛军入豫计划中的一个重要因素。</p>\n<p>1800年夏，刘之协前往新野以北约一百五十英里的郏县，住在酒铺老板李杰家中——李杰是刘之协1793年引入教门的。刘之协为何去郏县，至今不清楚——他告诉审讯者说他试图向河南省政府自首，这显然不是真的。他也不可能试图在那里组织起事——郏县所在的汝州府教门网络远不如南阳。^157 然而，刘之协的到来可能是李杰决定起事的一个因素。当时，李杰的一名弟子被地方官府逮捕。担心受牵连，李杰与其他教众于六月二十三日举事，与清军冲突。他们的一面旗帜上写着\"天王刘之协\"（Tianwang Liu Zhixie）——看来刘之协曾答应加入他们。然而，看到李杰人少、武器简陋，刘之协决意离开。他告诉李杰，他在新野与邓州还能动员更多人，但他必须亲自去那里动员。李杰的熟人冀大荣——郏县退职衙役，被裹挟加入起事——帮着说服李杰：刘之协必须走这一趟，并自告奋勇充当向导。六月二十八日，两人到达郏县东南约三十英里的叶县县城时，冀大荣哄骗刘之协在朋友开的茶馆歇脚，并让朋友向官府告发。刘之协在茶馆被捕。^158</p>\n<p>刘之协离开后，李杰及其同伙到附近村庄招募更多追随者——或凭说服，或靠胁迫——并劫掠给养。随后他们据守郏县与宝丰交界的一座旧堡翟家寨。七月初七日，南阳援军到达后，按察使马慧裕攻打该堡，次日将其摧毁，据说杀俘一千余名叛军，但李杰与数百人逃往卢氏的蓬山。一周后，吴熊光围攻蓬山，收捕了据守那里的五百人中的大多数。李杰再次逃脱，但数日后被擒。^159 不到三周，河南就在没有借助任何外来精锐的情况下扑灭了这场初起的叛乱。^160</p>\n<p>在河南、继而在北京的多次审讯中，刘之协起初试图撇清自己与叛军的关系，但在北京受刑之后，他最终承认：在龙年龙月龙日龙时的\"四龙之辰\"起事是他提议策划的。然而，刘之协没有透露更多关于叛军——尤其是他们的计划——的信息，对混元教网络也语焉不详。对出卖自己的冀大荣恨之入骨，刘之协声称冀大荣才是郏县起事的首领，但没有奏效。八月十四日——中秋节前一天——刘之协被凌迟处死。^161</p>\n<p>刘之协在囚禁期间与死后，都被清朝利用来瓦解叛乱。嘉庆命战役领导人与地方官广泛传播刘之协被捕与河南起事迅速覆灭的消息。同时，他宣布赦免南阳府所有帮助过刘之协的教众，为他的招抚政策树立样板；并责备郏县、宝丰的地方官——正是他们搜捕教众不遗余力，才激起了起事。^162 嘉庆重申宽容教门的意图，强调处死刘之协不是因为他传教——嘉庆承认，教门教义劝人向善——而是因为他煽动叛乱。刘之协被处决几天后，嘉庆颁布了他著名的《邪教说》（Xiejiaoshuo），再次明确：白莲教是合法的，只要奉公守法，地方官府不应再迫害教众；但任何图谋叛乱者，无论是否教门中人，都应惩处。^163</p>\n<p>正如一些史家所指出的，为瓦解叛军士气，清朝国家夸大了刘之协的角色，在他被捕后把他描绘成教门运动乃至仍在进行中的叛乱的最高领袖。^164 事实上，刘之协对其教门政治事业的忠诚令人怀疑——与许多在囚禁中、面对死亡仍信仰坚定的教众形成鲜明对照。^165 刘之协两次退出起事，证明他机会主义而自私。如果说与收元教的竞争凸显了他的第一次弃离，那么他逃离河南起事则无可辩驳地是一种背信行为。话虽如此，刘之协在起事者中仍享有相当的威望——或许得益于王廷诏等首领对他的抬举。因此，他的被捕与死亡确实是对叛乱内外教门中人的一次打击。襄阳叛军首领之一的张世虎1803年供认：刘之协死后，敢加入叛乱的教众更少了。^166</p>\n<p>甚至在刘之协死前，起事者招募新血就已经困难重重。无论教门中人还是普通百姓，都不再热烈响应他们的事业——尽管许多教众以及一些僧道同情他们，为他们提供食物与情报。^167 除一些地方匪徒外，只有一例当地居民成批加入叛军。1800年春，陕南旬阳的酒铺老板、教门中人庞洪胜据说动员了两千人——包括他的家人与弟子——加入了伍家营。^168 陕西的叛军曾派信使到河南招人，没有收获。^169 冉天元联盟虽然在人口稠密的川西大大扩充了队伍，但大多数是被裹挟者，数日或数周内就脱逃或投降了。</p>\n<p>长期攻不下城镇，起事者如今连白天进村都犹豫了，只在夜间劫掠村庄、裹挟平民。他们移动时只走山间便道，穿过清军关卡时单个通过。他们常常不得不抛弃妇孺，甚至杀死她们。樊人杰、苟文明、龙绍周等几股叛军深藏于川陕交界的群山中，没有大的行动。越来越多的当地居民带着粮食、牲口与家当躲进堡寨，攻打这些堡寨成了叛军的家常便饭。由于叛军可能败于武装平民之手，有时他们选择用银子或其他贵重物品向堡寨换取食物。起事者越来越衣不蔽体、赤足而行，士气低落。^170 马蹄岗被擒前不久，冉天元承认：\"终究难逃一死，只能苟延一日是一日。\"（原文待核，见注释171）^171 尽管高马股与徐天德联军等几股仍有实力，这几点火星已无法重燃垂死的叛乱。</p>\n<h2>军事前线</h2>\n<p>叛军失去势头之际，皇帝又一次急于奏凯——因为父亲所打的历时最长的战争也只打了五年。五月底，他敦促三个战场的领导人——四川的勒保与德楞泰、陕西的额勒登保、湖北的明亮与倭什布——迅速了结战役。然而，他不愿提供援军——因为没有军队可调，新兵又不顶用，他声称。相反，他指示领导人们遣回伤病兵，以节省开支。^172 然而，现任战争领导人们似乎无意完成战役——尽管他们打胜仗，大大减少了叛军的人数。勒保、德楞泰与额勒登保在作战方式与同朝廷打交道方面越来越相似，成了前线的\"三巨头\"。与此同时，明亮因皇帝的冷落而沮丧，再次故意拖延。</p>\n<h3>四川战场</h3>\n<p>魁伦被除后，勒保虽然只是署理，却拥有四川总督的全部权力。他立即投身于恢复自己被罢免前建立的关系网，尤其是修补与额勒登保、德楞泰的关系。勒保把嘉陵江渡江之责单独归咎于魁伦，为额勒登保开脱，论证说：额勒登保撤出四川时，叛军离江还远。周兴岱很可能是按勒保的建议，称赞德楞泰是四川最能干的将领，并提到他注意安抚被裹挟的平民，却不提德楞泰大肆屠杀俘虏。^173 勒保还试图搭救刘清。他虽然请求罢免刘清（但让他留前线戴罪立功），却再次把魁伦钉为涪江溃败的首恶——是他把部队调走、又拒绝了刘清的增援请求。不久，嘉庆以刘清素有名望为由恢复了他的职务。^174 勒保试图结交的另一个人是七十五。由于勒保的求情，七十五得以留任前线，夏天又恢复了四川提督之职。^175</p>\n<p>但勒保在战场上出了差错。三月下旬，数千人的高马股渗入四川龙安府。或许是等待贵州援军，勒保没有急着去龙安，声称要先安抚涪江沿岸居民。数周后他终于赶到，却在四月二十八日风雨交加之夜被高马股夜袭——袭击目标是龙安府城附近竹子山山脚的勒保营盘——而措手不及。勒保的门生、总兵石进率领的贵州军队于黎明赶到。勒保得救了，石进却阵亡了，数名试图营救石进的军官也死伤了。^176 勒保把石进之死瞒了数日，直到传来好消息：黑号首领王英在龙安被擒。^177 勒保对石进之死不担任何责任，反而责备贵州兵——他们大多是新兵——没有纪律、缺乏韧性，未能冲上起事者据守的山顶、抵挡敌人的冲锋。能干石进的损失令嘉庆痛心，他把怒火发泄在那彦成身上，认为那彦成过早撤出甘肃应对石进之死负责。这一次放过了勒保，嘉庆责成他歼灭龙安的高马股。^178</p>\n<p>但勒保跟丢了高马股。一个多月里，这支队伍在甘川边境的森林里进进出出。龙安一场持续数日的战斗——勒保打到数日之后才赶到现场——之后不久，这支队伍经松潘返回甘肃。^179 勒保拙劣的表现令嘉庆震怒，但他克制住自己，没有罢免勒保，只摘了他的顶戴——他认为频繁更换领导层会使叛军轻视清朝。相反，嘉庆下令把负责龙安防务的百祥降职，并判处松潘参将增顺死刑。^180</p>\n<p>高马股的离去标志着川西战事的结束。焦点回到了川东北。</p>\n<p>趁春天大部分清军开赴嘉陵江以西之机，鲜大川、龙绍周、苟文明等叛军股团从陕鄂边缘返回，被击溃各股的残部也重新集结。随后，由于德楞泰的压力，张子聪与徐万富率领的联盟余部从广元与南江返回。这些股团——各有数百至数千人——在太平、开县、达州、东乡、通江、巴州之间游荡，常常窜入紫阳与西乡，有些向南远抵重庆府。起事者专注于重组与求生之际，堡寨中的平民拿起武器与零散的叛军作战，而且常常取胜。相比之下，清军正规部队迟缓懈怠，只确保不让叛军攻取城市或逼近嘉陵江。入夏，德楞泰追击一些叛军到通江后停了下来。^181 与此同时，勒保从龙安返回川东北时慢条斯理，说是要视察嘉陵江防务。经过一个多事而紧张的春天，四川战场安静下来，陷入了难耐的酷暑。</p>\n<p>直到夏末，双方才重新活跃起来。六月下旬，初夏从湖北返回四川的樊人杰，在梁山与鲜大川、苟文明会合，再次企图渡过嘉陵江。一场苦战之后，联军在短暂而无功的垫江围城之后，进入邻水、垫江、长寿交界的山区。勒保与德楞泰在山外等七十五与李绍祖，等了好几天。叛军从山中复出、向江移动时，于七月十一日被近两万名清军正规兵与乡勇击溃，随后被追到岳池。据说数千名叛军被杀，两千多人投降。嘉庆认为这一仗保住了川西的安全，欣喜若狂，正式任命勒保为四川总督，赏二品顶戴——尽管勒保在这场战斗中究竟贡献了多少，颇为可疑。^182（地图4.3）</p>\n<p>联盟瓦解后，苟文明回到边境，樊人杰与徐万富退入大宁。其他几股的残部——每股数百或一千人——在通江盘桓。^183 返回家乡巴州时，鲜大川被部下杀死——鲜大川的叔父是地方乡勇头目，拒绝在自己的堡寨里庇护鲜大川及其人马。^184 许多起事者投降了，其他人也在考虑。张子聪藏身家乡东乡的山中，与地方官员接触，但数名刚来投奔张子聪的首领阻止了他，杀死了官员派来的所有信使——只留下一人。汤思蛟与官府的谈判也因同伙的反对而流产。急于与叛军达成受降协议的勒保亲赴东乡。然而，勒保派去与龙绍周接触的信使全部被杀，其中包括龙绍周的一个远亲。^185</p>\n<p>为扭转迅速瓦解的局面，庹向瑶、汤思蛟、刘朝选与赵益英（绰号\"赵麻花\"，Zhao Mahua）——他们大多来自达州与东乡——于八月十二日在东乡、通江一带对德楞泰、勒保与七十五麾下的清军发起了一次协同攻势。激烈的战斗持续了十天，叛军据说损失了两千四五百人，只剩两千余人。此后，清军一个接一个地——常常不费吹灰之力——扫平了各股。庹向瑶与赵益英战死。唐大信去劫掠乡勇堡寨时被当地乡勇杀死。年底，张子聪独自一人在开县被擒。剩下的起事者再次退入边境上或边境附近的山中。^186</p>\n<p>焦虑地关注四川战役的嘉庆，没有放过德楞泰夏天的拖延与闲散。他骂德楞泰与春天在川西有效作战时判若两人，给了他几次严旨申饬，一度几乎将他罢免。^187 他也不赞成勒保招降叛军的努力。四川起事者的迅速崩溃鼓舞了嘉庆，他变得满怀希望，因而更加鹰派，责令将领们专注于作战——叛军只有在被打得致命时才会愿意投降。^188</p>\n<p>但勒保与德楞泰另有盘算。初夏以来就没再收到经费，勒保与德楞泰试图迫使朝廷撤销\"不再给四川拨款\"的决定。为此，他们拒绝裁减乡勇，并要求增调索伦兵。勇猛的满洲军官赛冲阿率七百名索伦兵，被升为固原提督时，勒保与德楞泰恳请朝廷把赛冲阿留在四川。^189 为论证在四川保留大军的正当性，二人积极鼓吹嘉庆提出的一个策略——把陕西与湖北的全部叛军赶向四川——声称在四川更容易对付他们，因为当地居民已普遍筑堡。从陕鄂两省来的叛军或散或小，四川的大部分清军又一直闲置，德楞泰却径直向皇帝请款，声称：如果陕鄂的起事者都被赶向四川，军队就会更多，而四川省库的经费已经用尽。德楞泰一面承诺年内了结叛军、来年春天肃清残部，一面警告说经费短缺会妨碍最后的胜利。^190 不久，勒保与德楞泰又联名上奏，加倍请求拨款——这一次的理由是向太平运粮，以支援赶往那里对付陕鄂起事者的部队。他们还奏报：已向成都、重庆与达州的商人借了一万两，还打算向湖北、陕西借钱——因为他们雇夫的经费早已用完。^191</p>\n<p>皇帝起初对他们愿意把叛军全部赶向四川感到高兴。除口头嘉奖外，他还送去许多礼物，包括皮裘——这是罕见的恩典。然而，他很快怀疑他们年底前结束战争的承诺并不认真，而且勒保与德楞泰已经有些日子没打过一场仗了。一想到战争要拖到明年，嘉庆就心烦意乱，不断地责备他们。然而，他还是屈服于他们关于经费的压力，给了四川六十万两——尽管是以\"善后\"的名义。惦记着新年将至，他命用一万两为士兵置办冬衣。^192 数额或许未达他们的期望，但勒保与德楞泰成功让皇帝撤销了\"不再为四川战役买单\"的决定。</p>\n<h3>陕西战场</h3>\n<p>那彦成闰月回京后，额勒登保迅速在湖北郧西击溃了杨开甲一股，迫其退回陕西。^193 那彦成不在身边，额勒登保自在了许多，回陕后取得了几场胜利，赢得三等子爵位——尽管大部分仗是杨遇春与杨芳两位汉族将领打的。杨遇春春天升任甘肃提督后，接管了那彦成的精锐部队，编成独立军团。^194 五月下旬，在秦岭深处，额勒登保的部队在毛坪击溃了杨开甲一股，杀死了杨开甲。^195</p>\n<p>这场胜利重新点燃了嘉庆年内结束战役的希望，以至于他提出调一千名黑龙江旗兵（1799年已动员）与五百名吉林兵来替换久役之师。他诉诸将领们的良心，提醒他们：战争早点结束，百姓就少受些苦；同时威胁说，完不成这个期限就严惩。^196</p>\n<p>但局势又出现了转折。戴家营与伍家营突破了栈道沿线的清军防线，前往甘肃。^197 张添伦与辛聪紧随其后。到六月中旬，陕西的大多数起事者都去了甘肃。为援助追击叛军入甘的陕西军队，嘉庆派直隶提督定柱——他曾率援军赴豫——率八百名直隶兵入甘。嘉庆还告诫陕西官员不可懈怠——因为甘肃给养匮乏，起事者很快就会返回——并让额勒登保留陕。然而，额勒登保去了甘肃，留下三万多名士兵守卫陕西要地。^198</p>\n<p>在甘肃秦州，戴家营与从四川返回、却已被甘川清军围困于岷州的高马股会合。由于对下一步去向发生争执，高二与马五分裂，带走了一部分人马。他的堂弟高天德——绰号\"高三\"（Gao San）——走上前台，与马五共同带队，队伍仍称高马股。与戴家营合兵后，高马股回到陕西，在略阳击溃清军，杀死数名军官——包括一位总兵——与两百多名士兵。^199 随后他们沿汉江东进，企图北渡。固原提督王文雄急忙赶到西乡，阻止他们渡江、逼近西乡县城。七月二十五日，王文雄率五千多名士兵与乡勇，攻打掘壕自守于西乡法宝山的起事者。激烈的战斗从清晨打到中午；王文雄阵亡，还有二十多名军官与数百名士兵乡勇战死。王文雄是这场战役中阵亡的最高级别绿营军官，嘉庆闻讯震惊，称高马股为所有叛军股团中最\"狡悍\"者。^200</p>\n<p>其他起事者也没有在甘肃久留。在秦州，伍家营与冉学胜、张世龙、张添伦会合，但因额勒登保、庆成与恒瑞的到来而未能渡过渭河。七月下旬在阶州附近遭受毁灭性打击后，起事者返回略阳，但伍金柱于八月初三日在山沟被杨遇春与格布舍杀死。伍金柱之侄伍怀志与数百名幸存者又一次短暂突入甘肃。数周后返回陕西时，他们分作两股。曾芝秀带走近一千人，其中数百人渡过汉江前往四川（大多数妇女儿童被抛弃）。伍怀志与另外数百人进入秦岭。^201</p>\n<p>到秋天，所有起事者都从甘肃返回了陕南。高马股与戴家营不断尝试渡江——有一次甚至骑牛而渡。^202 随后徐天德率其黑号从湖北到达安康，使他接近了高马股。九月二十一日，徐天德在神沟与王廷诏、马五、高三会面。想必他们讨论了下一步的去向。会面之后，高马股与徐天德一股都经太平前往湖北。他们很可能决定：鉴于在陕西获取给养困难重重，先去湖北，再去河南。在四川，曾芝秀与徐天德合并。而戴家营、张添伦、辛聪等留在四川，分散于太平、通江与南江。^203</p>\n<p>大部分残余叛军在陕南的聚集，本该是额勒登保围剿他们的机会。然而，他似乎没有这个打算。从甘肃返回后，额勒登保留驻城固，把作战交给部将——主要是穆克登布与杨遇春。直到徐天德威胁兴安府城，额勒登保才移驻紫阳。徐天德入川时，额勒登保没有遵嘉庆之命亲赴四川对付徐天德，只把两千名随高马股从四川到陕西的士兵乡勇遣回四川。留驻陕西的额勒登保，其随营部队——由扎克塔尔率领的一千人（扎克塔尔是金川孤儿，在宫中长大）——只进行了几次小规模战斗。与勒保一样，额勒登保定期上奏，报告各条战线。他借用勒保\"先清一股，再剿他股\"的口号，以\"先了结高马股，再肃清湖北，最后对付川陕边境的起事者\"的计划安慰皇帝。^204</p>\n<p>尽管对额勒登保日益不耐烦，嘉庆仍不断称赞他，说只有额勒登保可靠，并利用一切可能的机会赏他礼物。^205 九月二十三日，嘉庆罢免了台布——他1799年派赴战役的最后一位改革派领导人。台布早已失宠，但罢免的时机很可能是对额勒登保的警告。^206 最终，新年只剩两个月时，嘉庆失去了镇定。他告诉额勒登保：与其另任统帅，不如明年乾隆服丧期满后，他亲自率师出征。如果这真的发生——他威胁说——额勒登保将被当作首犯。^207</p>\n<p>在朝廷的催逼下，额勒登保及其部将十月下旬开赴湖北。一场持续数日的战斗之后，他的部队与湖北军队把徐天德与高马股都赶回了陕西。然而，额勒登保在鄂期间，十月二十五日，冉学胜率数百人在西乡白面峡北渡汉江。^208 随后，十一月十日夜，樊人杰、王士虎与冉天泗率领的约一千名冉天元残部——他们最近从四川渗入陕西——在石泉以西数里的茶镇涉水渡过了汉江。^209 十一月初八日听说第一次渡江，额勒登保立即决定自己渡江，并在第二次渡江后不久在安康渡了过去。他把全部近八千名部队带到了江北，包括新到的一千名吉林、黑龙江旗兵。^210</p>\n<p>额勒登保北上后，汉江以北有两万多名清军与乡勇（额勒登保到达前已有一万二千，包括两次渡江事件后的增援），对付的却只有两千来名叛军——包括伍怀志在秦岭的小股。汉江以南，徐天德与高马股被交给了未经战阵的将领庆溥与新任按察使文成惠。庆成与恒瑞忙于对付已移向安康与平利的苟文明、龙绍周。在与四川广元、南江接壤的边境上，长麟手忙脚乱地封锁并击退因大巴山缺粮而涌入陕西的一波叛军。长麟与庆成都抱怨兵力不足，但嘉庆认为不可能给他们任何援军。^211 与年初对他撤出四川的反应相似，嘉庆起初认可了额勒登保的渡江，但很快意识到这是个严重错误。十一月二十六日，在给陕西领导人的一道长谕中，嘉庆直言批评额勒登保故意远离更危险的敌人。他责令额勒登保：或迅速了结北面之敌，或把那里的战事交给杨遇春、立即南返。他斥责穆克登布等人：以一万多人的兵力，竟未能了结伍怀志与冉学胜两股——合计不过一千人——怀疑他们可能是有意拖延，因为不想完事之后又被派去打另一股。^212</p>\n<p>额勒登保本应清楚，汉江以南更加关键。然而，与勒保、德楞泰一样，额勒登保对嘉庆收紧钱袋也心怀不满。夏天之后，陕西获拨三百万两，但大部分还没到。^213 十月二十五日，嘉庆又给陕西五十万两。与在四川一样，嘉庆命长麟用一万两为额勒登保的部队置办新年冬衣，并让额勒登保派后勤官员监督此事，确保每个士兵都领到冬衣。嘉庆虽然指望这份恩典能鼓舞士气、激励他们迅速取得最后胜利，^214 额勒登保却不会满足——这笔钱远远不够。与他年初离开四川一样，他离开汉江以南，或许正是他表达失望乃至愤怒的方式。</p>\n<h3>湖北战场</h3>\n<p>1800年初徐天德与樊人杰率联军突入竹溪后，它沿武当山南麓谷地东移。徐天德把他的数千人编为\"东\"\"南\"\"西\"\"北\"四路，各设一名\"总兵\"（zongbing）统领。他们在湖北获得了大量马匹，许多战士都骑上了马。^215 在房县被倭什布挡住后，他们北转均州，企图渡汉江入豫。吴熊光立即加强北岸江防，并亲赴南阳督防，倭什布则大声求援。倭什布的无能令嘉庆恼怒，他罢免了倭什布，以湖南巡抚姜晟接任。直到二月初孙清元挫败了叛军的渡江企图，松了一口气的嘉庆才恢复了倭什布的职务。^216 被逼向南，起事者在当阳宋家垭的一处山口伏击，再次露出獠牙，使清军伤亡惨重。^217 然而，对下一步计划发生分歧后，樊人杰离开徐天德，前往远安与兴山；徐天德则返回武当山，再次逼近汉江。^218</p>\n<p>二月初，明亮到达湖北。既无职衔又无俸禄，明亮借口为自己组建一支军队，在襄阳城盘桓了近两个月。明亮渴望旗兵——尤其是额勒登保麾下的——嘉庆却只给了他数千名绿营兵（包括宜昌镇总兵王凯率领的一千名），并指示他多雇乡勇。^219 担心叛军可能扮成难民混入河南——徐天德的到来已驱使许多人逃亡——吴熊光把明亮久留襄阳之事奏报了朝廷。^220 然而，松筠举荐明亮主持湖北战场，理由是他的经验、才能与在湖北的好名声。于是，嘉庆给了明亮两个卑微的职衔，并允许他在万不得已时动用两千名广西兵。^221 明亮迅速把徐天德逐离汉江，由此升为三品侍卫。但他并不满意，不断抱怨兵力不足、请求增援。^222 直到初夏明亮在南漳南部吃了一场败仗——被徐天德的人马伏击，损失众多士兵军官，包括王凯——嘉庆才批准</p>\n<p>他请求从额勒登保处调数百名旗军骑兵。同时，嘉庆任命明亮填补王凯的宜昌镇总兵空缺，并指示他：湖北肃清叛军后前往陕西。^223</p>\n<p>然而，心怀不满的明亮不愿去陕西向额勒登保报到。盛夏来临，他与孙清元在荆门州城附近击溃徐天德后，暂停行动约一个月。但他继续抱怨兵力不够大。^224 趁明亮休整之机，徐天德一股回到武当山区，击溃了均州的五百名清军，杀死了其首领、副将佛宁。随后，六月中旬，徐天德渡过黄龙滩（堵河）——汉江的支流——突入陕西旬阳。借口阴雨连绵，明亮在江边停留了数日。直到两周后徐天德返回湖北，明亮才行动。明亮骑马高速向东追击徐天德，把新到的两千名广西绿营兵甩在后面——他们因腿痛或中暑而行动困难。七月二十二日，明亮在南漳重创徐天德，声称杀敌千余。嘉庆为这场胜利高兴，同意把正赴前线的四百五十名吉林、黑龙江旗兵拨给明亮，并承诺明亮可以留鄂。^225 然而，远安又一场战斗之后——战斗中徐天德的侄儿（徐天德无子，侄儿是可能的继承人）被杀——明亮又松懈下来。无人管束，徐天德一股涉水渡过南沙河与黄龙滩，八月中旬再次侵入陕西。明亮直到两周后才在旬阳追上这股叛军，但只打了一仗就返回湖北。^226 明亮论证说：河水高涨使他无法在陕西继续前进，而湖北又有新的紧急事态——几股叛军合计一万人从四川到了湖北。^227</p>\n<p>明亮过早撤出陕西令嘉庆震怒。他把明亮五个月未能消灭徐天德一股，比作那彦成在甘肃对高马股未竟全功，严厉申斥明亮，骂他\"奸诈\"\"欺饰\"\"取巧\"。他虽让明亮留驻原地对付四川来的叛军，却想让额勒登保或庆成去湖北主持战役、节制明亮。尽管怀疑湖北局势的严重性，嘉庆还是把新调的满洲旗兵从陕西改派湖北。^228</p>\n<p>正如嘉庆所料，明亮夸大了危险。苟文明只有一千人——包括被裹挟的平民。^229 另外四股是冉天元联盟的残部，合计数千人，其中能战者只有一千左右，有数百匹马骡。樊人杰与徐万富率领黄号与数百名线号残部。蓝号由冉天泗与王士虎率领，白号大概由张子聪的一个亲属率领。初秋，他们从大宁移到长江北岸，从巫山进入湖北，在那里击败了总兵德英额率领的清军。联军到达南漳时，一千多名满洲旗兵刚抵襄阳的消息迫使他们折回远安。九月初二日，在县城附近的一场战斗中，他们杀死了从四川一路追击而来的李绍祖。但倭什布及时赶到，把叛军逐出远安，逼向武当山区。^230</p>\n<p>明亮虽然以那些四川叛军为借口提前从陕西返回湖北，却直到九月中旬才到达战场——距他上次在旬阳对徐天德的战斗已两周多。九月二十一日，明亮在房县上龛击溃了叛军联盟，但叛军夜袭其营盘时，他损失了数名军官。^231 战后，联盟残部慌乱地逃向大宁，抛弃了妇女、儿童与老人，却抬着负伤的战士。明亮无视嘉庆命他入川了结那些残部的命令，停在湖北边境的丰溪，只派小队前往大宁。^232 显然，他想待在勒保的辖区之外。嘉庆对明亮迟迟不抵战场本就不快，听说上龛之捷才稍为宽心；自明亮到鄂以来，皇帝第一次赏了他些礼物——一次宗教仪式剩下的糕饼与一些奶酪制品。但明亮拒绝追剿叛军入川，成了最后一根稻草。嘉庆甚至提到死刑（只因为明亮年资深，才免于死刑），褫夺了明亮宜昌镇总兵之衔，并剥夺了他上奏之权。嘉庆让长龄接替此职——长龄是蒙古贵族、惠龄之弟，曾护送满洲旗兵入鄂。^233</p>\n<p>然而，嘉庆似乎对长龄没有信心；他一再命长龄把带到湖北的一千零五十名旗兵交给额勒登保。^234 四十二岁的长龄，履历上是文武历练兼有，却从未有过在战场上出人头地的机会。^235 急于证明自己，长龄在十月份上半月先旬阳、后竹溪，与高马股连续作战。凭借火器与快速运动，长龄的人马在所有这些战斗中压倒了高马股，大大削减了它的规模。^236 长龄令人印象深刻的亮相改变了嘉庆对他的看法。嘉庆对长龄及其部队大加赏赐称赞，撤销了先前的决定，允许长龄保留那些旗兵，并责成他歼灭高马股。^237</p>\n<p>然而，十月下旬额勒登保从陕鄂边境追击徐天德与高马股到湖北时，请求调长龄的旗兵——推翻了此前\"不需要任何援军\"的立场。嘉庆同意了。额勒登保与长龄、明亮会合，击垮徐天德与高马股、把他们逼回平利之后，额勒登保从长龄那里带走了那一千名旗兵。^238 失去精锐部队实际上宣判了这位未来的新贵；长龄随后率其最后的三百名旗兵，与明亮合兵。^239 由于明亮驱逐徐天德与高马股出鄂之功、湖北同僚的防守——额勒登保还奏报明亮悔过、愿意改进——嘉庆的怒气平息了，他允许明亮留鄂，但仍不给他上奏之权。^240</p>\n<p>此时，湖北剩下的叛军只有高二率领的数百人。十月下旬从平利进入竹溪，高二很可能想与高马股重新合并。队伍里没有妇女儿童，他们行动极快。被明亮与倭什布逼回陕西后，他们立即重入竹溪，十一月下旬成功到达房县——这使湖北全部军队都被吸引到房县，阻止他们继续东进。^241 额勒登保在陕南汉江以北，嘉庆决定再次改组湖北领导层。1800年结束前数周，他任命书麟接替姜晟任湖广总督。^242 年近七十的书麟仍然可靠，指望他坐镇湖北战场、管住反复无常的明亮。^243</p>\n<h2>作为统帅的嘉庆</h2>\n<p>到1800年底，嘉庆皇帝已统治近两年。对许多人而言，他对和珅惊人的一击给人留下的印象是：他的统治将是一个变革的时代。他削减了一些昂贵的宫廷工程。他呼吁更清廉的官场。他对贫困的蔓延表示关切。他考虑帮助旗人摆脱经济困境的办法，同时试图重振明显衰败的贵族。^244 至于镇压战役，嘉庆曾试图让脱轨的战役重回正轨。以勤勉的列祖列宗为楷模，嘉庆长时间批阅前线奏折、写批语、颁谕旨，有时一天颁发数道长谕。三月二十九日，得知叛军在川西渡过涪江后，他花了一整天处理危机，又继续处理其他事务直到将近午夜，不让任何军机大臣回家。^245 整个白莲教战争期间，他写了几十首诗，配以大量注释，详记每一次行动、收获与挫折。^246 嘉庆对战争诸多方面的了解相当充分。他常常用自己渠道获得的情报来交叉核实奏报的信息——一些省级官员（如吴熊光）与特使（如周兴岱）充当他的耳目，向他密报前线同侪的情况。^247</p>\n<p>然而，嘉庆很快就暴露出他缺乏贯彻自己议程所需的坚毅。他频频对战事发表意见，却反复无常、容易动摇，常常随意改变立场。有时，他发出不明智的指示。1799年初，他命战役领导人们追击叛军时不得越过本省边界，否则本省会陷入空虚。^248 尽管他意在让各人对自己辖区负责，这道谕旨却不啻给将领们开了绿灯：把叛军逐出本省即可，不必消灭。即使他知道遥控指挥军事行动可能适得其反，他仍不断向将领们发出具体指示。^249 最关键的是，嘉庆不停地设定、修改、再设定结束战役的期限，以至于他的期限不再有任何权威，没有人害怕违期。</p>\n<p>嘉庆虽然对战争中的人事管理极为用心——他主动任免关键领导人，导致许多职位的高周转率——却很少长期信任任何人。他把松筠、那彦成、魁伦、广兴、托津等新领导人派往前线后不久，就开始对他们形成负面看法。结果，他们谁也没有得到足够的余地与时间去建功立业，就被皇帝无休无止的频繁批评压垮，最终被罢免或调离。诚然，就那彦成对张汉潮及其最后人马徒劳的追剿、明亮故意的拖延而言，嘉庆或许是对的。然而，他对将领们动辄怀疑、过分挑剔的倾向，弊大于利。嘉庆对明亮的不信任——承袭自乾隆——在明亮的消极与拖延战术中起了关键作用。嘉陵江之败压垮了嘉庆，他在川西局势明朗之前就过快地恢复了勒保的职务。他选择魁伦来开创严惩的先例，说得轻些，也是用错了人——他明知额勒登保与德楞泰对这场溃败负有直接责任。勒保复出后，旧班底重掌领导权，标志着他短暂的前线改革告终。此后，唯恐被人指责对战役最高领导人的处置反复无常，嘉庆一直不敢对旧班底采取强硬行动——尽管他知道勒保在王三槐被擒一事上欺骗了朝廷，隐瞒了王三槐实为投降的真相。^250</p>\n<p>在关于白莲教战争的有限学术成果中，似乎存在一种共识：嘉庆对起事者与教门运动的招抚政策对瓦解叛乱至关重要。然而，这项政策很少得到实施，嘉庆对它也摇摆不定。亲掌战役之初，嘉庆热情呼吁受蒙蔽、被裹挟的叛军投降，并许诺赦免他们。然而，整个1799年，前线将领们只对这项政策虚与委蛇，继续滥杀俘虏。1800年初，嘉庆重提这项政策并大幅升级，声明他计划赦免甚至那些与官军作过战的人，更令人惊讶的是，他将容忍教门社团——只要他们奉公守法。然而，此后不久，叛军渡过嘉陵江，在四川战场引发雪崩效应。惊慌失措的嘉庆立即中止了这项政策。他指示周兴岱不要在川陕两省张贴分发这项新政策的谕旨（宣示这项政策本是周兴岱此行的另一项任务）。^251 随后，嘉庆对福宁——他因1796年屠杀投降叛军而受到调查——改变了主意。嘉庆迅速把福宁流放伊犁，但仅仅几个月后又恢复了他，任命他为驻藏帮办大臣。^252 自此，这桩曾在嘉庆心理战话语中占有重要位置的事件，在官方文书中再未被提起。尽管嘉庆坚持\"叛军中被裹挟的平民不应受到伤害\"的立场，^253 他从招抚政策上的退却，却开启了川西对俘虏的普遍暴行——每场大战后屠杀数百名俘虏是家常便饭——而这没有引起嘉庆的皱眉。结果，叛军死战到底的意志被强化了；几乎没有叛军投降，1800年秋四川的几次投降尝试也流产了。</p>\n<p>直到1800年底、三个战场的起事者大多被压制之后，嘉庆才再次呼吁教门起事者悔过投降。为凸显自己宽恕意愿的可信度，嘉庆利用张小元——安徽阜阳的教门师父、王廷诏的亲戚——搞了一场小型宣传。1796年，张小元与其阜阳同教没有起而反清，而是选择了观望——尽管王廷诏与王三槐都曾派信使催促他行动。1800年春，张小元的父亲派张小元与另外三名教众前往喀什噶尔，探望流放中的王法僧。张小元一行到达甘肃时，张小元与同伴分手，前往秦州加入了从四川返回甘肃的高马股。然而，仅仅数月后，张小元就离开了叛军，于九月向额勒登保投降。据他说，叛军残忍的烧杀令他厌恶。劝说王廷诏投降失败后，他设法从叛军中逃了出来。^254 尽管张小元的故事可疑，嘉庆选择了相信。十一月初十日，嘉庆命把张小元护送回阜阳，交给其父——他也赦免了其父派子前往喀什噶尔探望罪犯之罪。^255 仿效祖父雍正利用反满学者曾静来彰显皇恩浩荡、贬斥汉人士大夫民族主义的手法，嘉庆利用张小元来展示自己愿意在赦免与容忍教门中人上走多远。^256</p>\n<p>释放张小元前后，怀疑战区领导人招降工作不力，嘉庆颁发了一连串谕旨，重申他的恩威并施之策。他特别敦促领导人们重视安置脱叛之人——他听说有些人回乡后生计无着，又重新加入了叛乱。他责成省级官员挑选可靠的道府官员随军行动，就地安置被俘或投降者。但他坚持：叛军首领绝不宽赦，必须或杀或擒。^257 然而，此后数月，当胜利在望时，嘉庆将再次把宽大政策抛到一边，恢复杀叛军。因此，他的招抚政策在整个战役期间大体停留在言辞层面。战争最终结束后，《剿平三省邪匪方略》的编纂者们挠着头，仍设法为皇帝的前后不一找到了理由：</p>\n<blockquote>\n<p>自剿办邪匪以来，皇上恫念愚顽，屡申剿抚兼施之谕。继而贼众不知悔罪，投诚者少，皇上又改而主剿。[其故在于]贼匪非经痛剿穷蹙，不肯回心乞命。此即\"义以服人\"（yiyifuren）之道。^258</p>\n<p>[译者按：方略原文自英文直译，文言原文待核，见注释258。]</p>\n</blockquote>\n<p>在关于嘉庆皇帝的少数研究中，他亲政后号召建言批评——用他自己的话说，\"广开言路\"（guangkaiyanlu）——被誉为开明统治的证据。^259 然而，这项开明之举没有走远。正月初五日——乾隆驾崩两天后——嘉庆颁发谕旨，邀请官员——更确切地说，御史——秘密上书揭露官场积弊。^260 响应皇帝的号召，包括广兴在内的数名御史与官员站出来弹劾和珅，这为嘉庆扳倒他提供了借口。此举虽然主要针对和珅，官场内外的许多人却借此机会就广泛的事务向朝廷进言。批评与意见的喷涌很快令嘉庆厌烦，他不止一次抱怨其质量参差不齐。随后1799年秋发生了洪亮吉事件——这位直言而古怪的学者撰写并传抄了一封长信，尖锐批评嘉庆纵容和珅门生与白莲教战争渎职领导人，由此被捕、流放新疆。</p>\n<p>1800年夏，赐魁伦自尽数日后，嘉庆决定赦免洪亮吉出流放地。他说，他担心对洪亮吉的惩处吓住了人们，使大家不敢进言——因为洪亮吉被捕后，他收到的奏折书信少了。此外，嘉庆命把洪亮吉的信在官场传阅，因为他认为信中有些论点值得重视。^261 在新疆只待了几个月，洪亮吉就回了家。直到1809年去世，洪亮吉一直温顺，对皇帝感恩戴德，尽管他仍关心公共事务。^262 与此同时，嘉庆想必心满意足：他最终以处死白莲教战争中一名高级官员，回应了洪亮吉的批评。</p>\n<p>然而，赦免洪亮吉并不意味着重开言路。释放洪亮吉约一个月前，五月二十六日——他褫夺那彦成几乎全部职衔的那天——嘉庆宣布：他已把完成战役的重任托付给前线的三位领导人——额勒登保、德楞泰与明亮。他进一步裁定：\"内外官员，除军机大臣外，俱不得以妄议军务、传播谣言、滋生事端\"，并承诺严惩违令者。^263（原文待核）几天后，他在告知三位将领对那彦成决定的谕旨中重申了这一裁定。</p>\n<p>他说，他所收到的许多意见与建议毫无价值，只会给他把握前线事态添乱；他告诉三位将领：从此以后，关于战役，他只听取他们的奏报，所以他们不得谎报任何信息。^264 这道实际上在官场与社会上禁止讨论战役的命令，正式结束了乾隆驾崩后那段短暂的\"广开言路\"时期。</p>\n<p>1799年底，嘉庆烦躁地否定了用\"改革\"一词来描述他的统治：\"朕以皇考之心为心，以皇考之政为政。遵循皇考所定一切章程，唯恐不能仰承其意。何尝有'维新'（weixin）之举？\"嘉庆这话有多少真诚，值得商榷，^265 但它至少让人窥见他当时的心境：遇到障碍与反弹之后，他意识到改革之难。在前线，他严厉的行动未能带来预期的效果。他对将领们反复的严斥与警告几乎不起作用。大约就在嘉庆说出上面这番话时，周兴岱请他以严厉的口吻对待战争领导层。嘉庆沮丧地回答说，他已经这样做了，次数之多，以至于\"唇焦舌敝\"（原文待核，见注释266）。^266 诚然，制度性障碍与受改革影响的利益集团的集体抵制，被证明是巨大的、乃至压倒性的。然而，嘉庆优柔寡断的性情——具体而言，他自相矛盾的倾向——也是他未能让脱轨战役重回正轨的一个因素。1800年上演的改革逆转，发出了一个明确的信号：他的政府既没有承诺、也没有能力实施它所宣布的一切。战争领导层因这个信号而胆壮权大。尽管嘉庆反复强调他\"1800年秋至冬之间结束战役\"的新期限，这个时间表不会实现。叛乱或许已经死了，但战争还在继续，而且还要持续多久，无法确定。</p>\n<h2>注释</h2>\n<p>[译者按：文献简称同前各章。]</p>\n<p>题辞：JQSYD, 4:501.</p>\n<ol>\n<li>既有研究认为，嘉庆皇帝扭转了局势，其新政策被证明行之有效。参见，例如，铃木中正《清朝中期史》（Shinchō chūkishi），180–211。</li>\n<li>年初车森保押解被俘的高均德进京时，告诉嘉庆：起事者已极度疲惫，缺乏必需品与作战能力，只能凭借地形苦苦求生。XFFL, 136/38b–40a. 托津同年晚些时候从四川回京时，向嘉庆报告了类似的情况。XFFL, 139/35a–b.</li>\n<li>XFFL, 136/31b–33a, 136/38b–40a, 137/1a–3a, 137/20b–25b, 139/32a–35a, 140/9a–10a, 140/23b–24b.</li>\n<li>王登廷独自一人时在南江被乡勇抓获。王登廷可能是叛军派出来联络其他股团的。XFFL, 137/25b–30b.</li>\n<li>JQSYD, 4:501–3. 提出此议的官员是蒙古旗人、国子监祭酒法式善。</li>\n<li>XFFL, 140/23b–26b.</li>\n<li>高均德与高成杰1799年底在北京受审时说：叛军对清朝的招抚政策持怀疑态度，因怕被杀而不敢投降。BLJZL, 5:87–88.</li>\n<li>1799年底魁伦以涉嫌侵吞军费逮捕福宁时，指控福宁屠杀投降起事者。XFFL, 137/8b–11b, 137/32a–35b.</li>\n<li>XFFL, 141/32b–33b, 143/29b–30b.</li>\n<li>XFFL, 142/32b–34a, 144/22a–24b, 146/17b–20a.</li>\n<li>XFFL, 120/16a–17a.</li>\n<li>XFFL, 138/16b–18a.</li>\n<li>QSLJQ, 56/21b–22b.</li>\n<li>然而，在另一道奏折中，额勒登保对战役作了乐观的描述。XFFL, 140/4a–7a.</li>\n<li>交锋中数名清军军官被杀。XFFL, 139/6a–11a, 140/27a–29b, 141/17b–24a.</li>\n<li>渔关渡江之前，叛军曾试图在略阳县城附近渡过嘉陵江，被乡勇挫败。渔关由道员常亨率一千二百名士兵把守。近在咫尺的吉兰泰及其一千名士兵没有驰援。GZDJQ, 4710; XFFL, 142/26a–27b, 143/5a–9a, 143/26b–28b, 155/7b–8b.</li>\n<li>松筠请那彦成拨一半兵力给他。王文雄从西乡急赴勉县。王文雄离开汉江后，陕南的叛军多次试图渡江，都没有成功。GZDJQ, 4710; XFFL, 139/6a–11a, 140/27a–29b, 141/17b–24a.</li>\n<li>QSLJQ, 57/4a–b; XFFL, 141/26a–28a.</li>\n<li>XFFL, 139/13b–14a, 141/28b–29b.</li>\n<li>XFFL, 140/32b–35b.</li>\n<li>XFFL, 139/15a–18b, 141/3a–6b, 141/9b–12b, 141/17a–b; QSLJQ, 57/3a–4a.</li>\n<li>魁伦与额勒登保都没有提过他们的冲突，但广兴奏报了此事。XFFL, 153/31a–33b.</li>\n<li>GZDJQ, 4714, 4715; XFFL, 144/3a–12b.</li>\n<li>XFFL, 139/18b–19b.</li>\n<li>XFFL, 143/1a–4a.</li>\n<li>XFFL, 142/26a–27b, 143/4a–9a, 144/14a–b.</li>\n<li>XFFL, 148/2a–3b, 148/15a–20b.</li>\n<li>XFFL, 140/12b–16a, 143/12b–19b, 145/4a–10a.</li>\n<li>明亮获授低微的\"金顶蓝翎\"之衔，但没有俸禄。XFFL, 143/31a–32b.</li>\n<li>XFFL, 144/1a–3a, 146/1a–3b.</li>\n<li>XFFL, 146/3b–7a, 146/9a–13b.</li>\n<li>额勒登保为七十五辩护，说七十五曾与在川陕之间穿梭的辛聪小股作战。XFFL, 138/18a–19a, 140/2b–3a.</li>\n<li>XFFL, 145/15a–b.</li>\n<li>XFFL, 156/41b–44a.</li>\n<li>XFFL, 140/1a–2b, 140/4a–5a.</li>\n<li>冉天元供词，BLJZL, 5:90; 王英供词，第91页; 张子聪供词，第109–10页。XFFL, 140/1b–2a, 160/29a–b.</li>\n<li>XFFL, 144/15b–16b, 146/36a–37a, 147/16a–17a.</li>\n<li>魁伦认为起事者已近强弩之末，而前线整顿已见成效：将领们不再谎报战功，战争财政的许多漏洞已被堵上。XFFL, 139/19a–23a, 143/19b–22b. 直到他从达州出发与叛军交战时，他才报告自己遇到的困难。XFFL, 144/30b–32b.</li>\n<li>除夕，额勒登保请求增派几名书吏，广兴拒绝了；魁伦则捐出\"养廉银\"，给每名新增书吏每月四两。嘉庆称赞广兴严格，但指示动用军费支付额勒登保新增书吏的工钱——因为魁伦并不宽裕。XFFL, 138/14a–18a.</li>\n<li>XFFL, 143/22b–26b.</li>\n<li>XFFL, 139/19a–22b, 143/19b–22b, 144/24b–26a.</li>\n<li>XFFL, 139/35a–37b, 143/19b–22b, 143/24a–25b. 1799年夏，嘉庆曾警告叛军可能渡江袭击富庶的川西。他曾指示勒保派正规军守御嘉陵江所有渡口。XFFL, 102/21b–22b. 勒保无视了他的指示。</li>\n<li>XFFL, 138/17a, 141/31b–34a.</li>\n<li>XFFL, 142/20b, 143/11a–12b; QSLJQ, 60/12a–13b. 有人弹劾广兴的仆人在广兴第一次入川时向地方官员勒索钱财。吏部虽提议罢免广兴，嘉庆仍让他留任——因为不是广兴本人所为。JQSYD, 4:289–90. 但嘉庆罢免广兴时援引了此事。</li>\n<li>GZDJQ, 19739; XFFL, 142/1a–4b, 146/34b–35a, 152/16a–17a.</li>\n<li>XFFL, 144/15b–16b, 146/25a–b, 146/36a–37a, 147/16a–17a.</li>\n<li>清朝记载没有说明联军在何处渡过渠江。冉天元只提到他们在\"新宁与大竹\"渡江。冉天元供词，BLJZL, 5:90.</li>\n<li>重庆知府石韫玉动员了全部兵力——两千名士兵与一千五百名乡勇——并把所有船只停靠到南岸。江北岸，三百名士兵掘壕据守有城墙的江北厅城；起事者没有试图夺取该城。石韫玉《独学庐五稿》（Shi, Duxuelu wugao），1/23a–24b。</li>\n<li>冉天元供词，BLJZL, 5:90; 王英供词，第91页; 张子聪供词，第110页。XFFL, 152/16a–17a; 177/12a–14a. 定远知县孙熙元与下级军官米广被罢免受罚。XFFL, 152/16a–19b, 160/7b–9a, 160/11b–12b; KJJFSB, 5/1a–b.</li>\n<li>魁伦指示龙安府地方官加强戒备，命驻夔州的穆克登阿赶赴龙安，主持嘉陵江防务。XFFL, 142/7b–8b, 145/17b, 146/20b–27a, 146/38a–39a.</li>\n<li>XFFL, 147/1a–5a.</li>\n<li>嘉庆没有摘去魁伦的顶戴，因为他希望魁伦在这紧要关头能维持权威。XFFL, 147/5b–10b.</li>\n<li>XFFL, 147/13a–b, 147/22a–24a.</li>\n<li>勒保奉命先赴甘肃，与额勒登保会面后再入川。JQQJZ, 5:45–46; QSLJQ, 59/1b–3a.</li>\n<li>但嘉庆要广兴如实奏报他裁减乡勇的情况。XFFL, 145/10b–17a, 145/17a–18a.</li>\n<li>XFFL, 146/35b–37a, 147/29b–34b, 148/21b–25a, 149/25a–34b.</li>\n<li>KJJFSB, 5/1a–2a.</li>\n<li>XFFL, 149/18b–21b.</li>\n<li>XFFL, 150/11a–15b.</li>\n<li>王英供词，BLJZL, 5:92; XFFL, 153/31a–33b, 159/12a.</li>\n<li>XFFL, 152/10b–15b, 153/1a–3b.</li>\n<li>叛军渡嘉陵江一个月后，七十五到达顺庆。但他停在那里，只派李绍祖率四千三百名士兵乡勇向魁伦报到。XFFL, 153/4a–5a, 155/24a–32a, 156/28b–33b.</li>\n<li>《大清历朝实录》雍正朝，108/28b–31b. 又见濮德培（Perdue）China Marches West, 253–54。</li>\n<li>XFFL, 150/15b–22a.</li>\n<li>一位在京的四川籍学者提醒嘉庆：叛军渡嘉陵江后，被两江所困，处境危险。嘉庆责备魁伦既未奏报、也未应对，命勒保直接入川消灭两江之间的叛军，而不必去甘肃与额勒登保会面。QSLJQ, 60/9b–11a; XFFL, 151/18a–b, 152/26a–27a, 153/19b–22b, 153/35a–36b, 154/11a–12a.</li>\n<li>JQQJZ, 5:92–95; QSLJQ, 60/15b–19b.</li>\n<li>XFFL, 104/21b, 109/3b–7a.</li>\n<li>嘉庆认为，乾隆之所以把松筠留在西藏多年，或许就是因为松筠书生气、拘泥固执。XFFL, 132/28a–29a, JQQJZ, 5:275. 松筠奏折的原件似已不存。</li>\n<li>那彦成到任后，又向皇帝奏报了松筠\"处置失当\"的一个例子：松筠命恒瑞留陕协助攻打张汉潮，致使甘肃的叛军未能了结。XFFL, 129/19a–20a, 129/25a–27a, 131/13a–b, 131/21a–23a, 132/11a–12b.</li>\n<li>那些衔职是太子少保与侍卫。XFFL, 132/28a–30b.</li>\n<li>XFFL, 136/5b–6a. 嘉庆曾说：\"那彦成与松筠似乎都无才无运，不能承受我的恩宠。\"XFFL, 138/7b–12a.</li>\n<li>松筠，嘉庆五年正月初八日，GZDJQ, 4708.</li>\n<li>但由于甘肃与陕南的危机，松筠奉命暂时留陕。GZDJQ, 5077; QSLJQ, 57/4b–5a; XFFL, 144/20b–21a, 148/2a–3b, 148/5a–6b, 149/5a–9a, 153/26a–b. 嘉庆五年正月十八日，嘉庆罢免了倭什布的湖广总督之职，以1791年以来的湖南巡抚姜晟接任，但姜晟留驻武昌处理地方事务。因此，松筠留在湖北战场，与明亮共同主持战役。JQQJZ, 5:22–23.</li>\n<li>年近六十的弘丰很快被送回荆州。GZDJQ, 5164; XFFL, 150/4b–10a, 151/19b–23a, 153/11a–b, 155/40b–42b, 156/21b–22b.</li>\n<li>XFFL, 162/3b–4b, 162/5b–8b; QSLJQ, 62/25a–b.</li>\n<li>QSLJQ, 65/16b–20a; JQQJZ, 5:275–77.</li>\n<li>松筠1802年再次被任命为伊犁将军，1809年离开新疆。</li>\n<li>XFFL, 147/34b–35a.</li>\n<li>XFFL, 154/14b–16b.</li>\n<li>嘉庆五年二月十一日，德楞泰在徽县接到额勒登保与魁伦关于嘉陵江渡江的信。他次日动身赴川。GZDJQ, 5094.</li>\n<li>GZDJQ, 5185; XFFL, 157/8b–18a, 157/20b–22b. 嘉庆把此当作胜利，犒赏了全体军机大臣、军机处与兵部章京，以及北京与前线之间的驿传人员。XFFL, 157/21b–22b.</li>\n<li>GZDJQ, 5301.</li>\n<li>嘉庆命在朱射斗灵位前处决冉天元。XFFL, 159/1a–11b, 159/6b–7b.</li>\n<li>GZDJQ, 5351.</li>\n<li>马蹄岗之战后，德楞泰把俘虏全部剐杀（luange）。石门寨之战后，他把十八名叛军首领凌迟处死，处决了五百六十一名俘虏——嘉庆在德楞泰的奏折上批了\"是\"字。XFFL, 159/9a–11a, 161/1a–6a; GZDJQ, 5351.</li>\n<li>XFFL, 156/45b–48b, 157/8b–18a, 157/20b–22b, 161/6a–11a; JQQJZ, 5:130, 155; QSLJQ, 61/19a.</li>\n<li>XFFL, 161/1a–6a.</li>\n<li>勒保在嘉庆五年三月十三日的奏折中提及将与德楞泰会面。GZDJQ, 5348.</li>\n<li>勒保收揽了石进与张良槐——曾在贵州他麾下任职的两位汉族军官——及其四千名贵州兵。勒保还得到了上年秋天救过永保性命的马朝瑞。GZDJQ, 5348; XFFL, 154/32b–37a, 156/8b–14b, 160/28b–31a.</li>\n<li>QSLJQ, 62/4a–5b; XFFL, 160/31a–35b.</li>\n<li>XFFL, 152/22a–25b, 153/19b–22b.</li>\n<li>XFFL, 160/1a–7a, 160/23b–28b, 161/19b–22a. 叛军渡嘉陵江后，一千名旗兵与绿营兵已从成都调往太和镇，但他们似乎没有到达。XFFL, 148/22a–23b, 148/24b–27a, 148/32b–34b.</li>\n<li>王英供词，BLJZL, 5:92; 张子聪供词，第110页。</li>\n<li>XFFL, 161/19b–23b, 163/9b–17b, 165/7a–10b, 177/14a–17a.</li>\n<li>GZDJQ, 5392; XFFL, 161/22a–23b.</li>\n<li>除从金川地区调来的六百名土兵外，魁伦还向成都增派了援军。为打消起事者入成都的念头，嘉庆下令迅速处决冉天元。XFFL, 164/9a–15b, 166/39a–41b.</li>\n<li>XFFL, 163/9b–17b.</li>\n<li>叛军逼近剑州时杀死了剑州知州。XFFL, 164/26a–30a, 166/39a–41b.</li>\n<li>XFFL, 165/1a–7a.</li>\n<li>XFFL, 165/14a–17b, 167/1a–7b; 张子聪供词，BLJZL, 5:110.</li>\n<li>嘉庆免除了勒保对四川溃败的一切责任，包括他1799年夏裁减嘉陵江沿岸乡勇。XFFL, 161/24b–34b.</li>\n<li>勒保请求之前，嘉庆已命周兴岱调查朱射斗之死。GZDJQ, 5035, 5397; XFFL, 167/7b–9b, 167/13a–b.</li>\n<li>魁伦承认自己\"无能\"，但仍为两江防务辩护，强调他不应对裁减嘉陵江沿岸乡勇负责。XFFL, 168/1a–6a, 170/4a–7a. 绵州知州刘印全后来对魁伦的部分指控提出异议，说\"他曾向魁伦请兵\"的说法不实。但勒保补充说：涪江东岸数万平民逃向金山驿时，魁伦只放一条船摆渡，还逐一盘问。XFFL, 177/12a–17a, 184/30b–33b, 184/35b–36b.</li>\n<li>嘉庆担心在成都处决魁伦会使叛军轻视清朝官员——因为冉天元与陈得俸最近刚在成都被处决。JQQJZ, 5:238–40, 242–43; QSLJQ, 62/4a–5b, 62/22b–24b, 63/2b–5a, 64/22a–25b; XFFL, 170/8a–16a.</li>\n<li>JQQJZ, 5:420–23; QSLJQ, 70/14b–19a. 关于缅甸战役中的杨应琚，见戴（Dai）\"Disguised Defeat,\" 157–58。</li>\n<li>JQSYD, 5:337–38; QSLJQ, 71/4b–6b.</li>\n<li>QSLJQ, 62/22b–24b, 70/19a–b; XFFL, 161/24b–33a; XFFL, 163/23a–26a, 164/35a–37b, 165/10b–12a, 187/24a–25a.</li>\n<li>直到1799年初魁伦从福建回京，嘉庆才第一次见到他。QSLJQ, 64/22a–b.</li>\n<li>XFFL, 187/25a–27b. 叛军全部离开川西后，嘉庆设了新期限：闰四月内结束战争。QSLJQ, 64/11a–b; XFFL, 167/9b–11a.</li>\n<li>额勒登保辩称他给魁伦留下了足够的兵力，暗示责任在魁伦无能。XFFL, 147/10b–12b, 147/15b–22a, 150/17b–20b, 151/14b–16b, 152/2b–6a, 152/7a–9a, 153/31a–33b, 156/40a, 156/41b–45b, 170/4a–7a; QSLJQ, 61/18a–19a.</li>\n<li>QSLJQ, 63/7b; XFFL, 163/19b–23a, 164/34a–35a, 165/20b–23b. 为川西平靖，嘉庆只给德楞泰之子升了职，赏新到的六千名贵州兵一个月饷银，并赏其统领石进。QSLJQ, 64/11a–b; XFFL, 167/9b–11a.</li>\n<li>来华的朝鲜人柳得恭提到，他遇到的许多人对魁伦心怀怨恨。柳得恭《燕台再游录》（Yu, Yantai zaiyoulu），19b。</li>\n<li>许敬《雅歌堂文集》（Xu Jing, Yagetang wenji），22/2–3。</li>\n<li>本节部分内容取材于戴（Dai）\"Broken Passage\"。</li>\n<li>XFFL, 卷138–40 各处, 142/18a–26a, 144/12b–13b, 146/29a–31b; GZDJQ, 4736.</li>\n<li>XFFL, 144/18a–20a, 145/18a–20b.</li>\n<li>龙山镇之战前，叛军正忙于劫掠裹挟当地居民，这使那彦成轻松取胜——他声称杀俘数千人，缴获三千多头骡马牛羊，自己的部队只有两三人轻伤。战后，那彦成第一次奏请升赏三十五名军官。GZDJQ, 4859, 4972; XFFL, 147/35a–40a, 151/1a–7b, 152/6b–7a.</li>\n<li>他从达州到褒城用了两周。随后在甘肃陇州停留数日。嘉庆派额勒登保的侄儿与一名御医赴甘照料额勒登保，并赏他一些人参。XFFL, 148/1a–b, 148/9b–15a, 152/2b–6a, 152/7a–9a.</li>\n<li>引文见GZDJQ, 19773. XFFL, 138/7b–12a, 139/13b–14a, 140/8b, 142/28b.</li>\n<li>嘉庆没有给那彦成颁发新的参赞大臣印信，让他继续使用钦差大臣印信。GZDJQ, 5023; XFFL, 147/38b–39a, 147/48b–49b, 152/1a–2b, 152/7a–9a.</li>\n<li>XFFL, 149/9b–13a, 152/1a–2b, 154/1a–3b, 155/1a–7b, 157/1a–6a, 159/13a–14b.</li>\n<li>XFFL, 160/12b–15b.</li>\n<li>XFFL, 144/18a–20a.</li>\n<li>XFFL, 142/18a–20a, 157/6a–8b, 157/18a–20b.</li>\n<li>XFFL, 卷152–54 各处, 158/1a–2b, 164/1a–4a.</li>\n<li>XFFL, 154/46a–48a, 卷155–56、158 各处, 160/20a–23b, 162/8b–11b, 166/1a–5b.</li>\n<li>XFFL, 156/40a–41b, 158/17a–20b, 160/12b–17a, 161/11a–14b.</li>\n<li>XFFL, 163/1a–9b, 163/28a–30a.</li>\n<li>XFFL, 164/15b–19b.</li>\n<li>XFFL, 161/14b–19a, 161/31a–34b, 162/16b–22a, 163/30b–32b, 164/4b–6a, 164/21b–24a, 165/30a–33b, 165/13b–16b, 165/28b–29a, 166/5b–12b.</li>\n<li>GZDJQ, 5376, 5454; XFFL, 164/15b–19b, 167/24a–29b.</li>\n<li>派往陕西的六千名士兵中，两千名来自甘肃，两千名来自山西，两千名是从四川调的贵州兵。派往河南的两千名士兵中，一千名来自直隶，一千名来自山东。嘉庆派曾在河南任职的江南提督定柱统领这两千人。XFFL, 167/29b–34b, 168/6a–10b.</li>\n<li>GZDJQ, 5261, 5345, 5415; XFFL, 150/25b–27b, 150/30a–31b.</li>\n<li>XFFL, 165/20b–23b, 168/16b–18b.</li>\n<li>又从山西向河南派了一千名士兵，同时命直隶与山西保持数千士兵的动员状态。XFFL, 168/18b–27b, 168/30b–32b, 171/15b–26b.</li>\n<li>XFFL, 169/1a–9a, 169/18b–23a, 170/22b–27b. 松了一口气的嘉庆发还了陕西领导人们的翎羽顶戴，并厚赏额勒登保及其部下。杨遇春获授\"云骑尉\"（yunqiwei）世职，杨芳获巴图鲁名号。XFFL, 171/1a–9a, 171/13b–15b, 172/1a–9b, 173/18a–20b.</li>\n<li>XFFL, 176/10b–15b.</li>\n<li>XFFL, 173/22b–29b.</li>\n<li>XFFL, 173/30b–31a.</li>\n<li>XFFL, 165/1a–7a, 165/13b–16b, 165/30a–33b, 166/5b–12b, 166/40a–41a, 167/11a–b, 167/13b–15a, 170/25a–26b; JQQJZ, 5:222.</li>\n<li>被褫夺的职衔包括军机大臣、南书房行走与内务府各职。留给他的三个职位是兵部尚书、汉军镶白旗副都统与经筵讲官。XFFL, 174/6a–13a, 174/19b–23b, 174/32a–34b.</li>\n<li>JQQJZ, 5:368–73; QSLJQ, 68/11b–24b; XFFL, 182/16a–24b.</li>\n<li>JQQJZ, 5:374–75; QSLJQ, 68/24a–25a; XFFL, 182/29a–b. 但同日嘉庆把那彦成的堂兄弟那彦宝升为副都统。QSLJQ, 68/25a–b.</li>\n<li>嘉庆批评广兴试图把魁伦置于死地。GZDJQ, 4974, 5122, 5360; XFFL, 148/23b–24b, 148/26b–27a, 151/12b–14a, 152/22a–25b, 153/31a–35a.</li>\n<li>XFFL, 164/32a–33a.</li>\n<li>嘉庆警告说，托津与广兴都\"平庸\"，不得请求留前线参战。QSLJQ, 66/19a–20a; XFFL, 177/1a–3b.</li>\n<li>XFFL, 177/3b–7b.</li>\n<li>XFFL, 171/12a–13b.</li>\n<li>但嘉庆裁定：如果他表现良好，其原按察使衔与翎羽顶戴以后或战役结束时发还。JQQJZ, 5:283; XFFL, 173/13b–15a, 173/17b–18a.</li>\n<li>吉兰泰起初被降为游击。但他随后又未能阻止杨开甲从甘肃返回陕西，嘉庆遂命把他流放新疆。常亨拟于战争结束后流放新疆。JQQJZ, 5:108, 190–91; QSLJQ, 61/2b, 63/8b; XFFL, 155/7b–8b, 155/22a–b, 156/40a–41b, 164/19b–21a, 164/24a–26a.</li>\n<li>XFFL, 156/45b–48b, 158/20b–26b, 161/23b–24a, 161/31a–34b, 163/17b–19b, 163/26a–28a, 174/17b–19a, 174/24a–25b; QSLJQ, 61/27a–28a, 66/1b–2b; JQQJZ, 5:183–84, 289–90.</li>\n<li>嘉庆罢免了副将七格并把他流放伊犁——七格轻伤后一个月不回营，且只带回其九百五十名士兵中的二百六十七人（有些阵亡了，但许多人被留在各地养伤治病或充当守卫，有些可能开了小差）。XFFL, 175/1a–4a; JQQJZ, 5:294–95. 初夏，嘉庆罢免了陕安镇总兵柯藩——他听任叛军经其防区通过——命将他枷号，若不能赎罪，战后流放伊犁。同时，嘉庆把陕西的两名满洲军官德纯与果林召回北京本旗——前者久病，后者未能拦截逼近商州的杨开甲一股。嘉庆还查问了刘之仁——他被叛军击溃后一直未作战——但在额勒登保与那彦成都为他辩护后，让他留任训练新兵。XFFL, 164/38b–39b, 176/15b–18b, 176/29a–31a. 嘉庆还申斥王文雄久不作战，并核查了1799年出狱、不给俸禄发往四川的四名军官——他们因1796年秋未能阻止叛军从鄂西南资丘突围而受罚。XFFL, 166/29a–30a, 166/31b–32a, 166/43b–44a.</li>\n<li>XFFL, 164/41b–42b.</li>\n<li>XFFL, 182/27b–29a.</li>\n<li>高均德受审时提到\"刘冷\"，嘉庆怀疑刘冷就是刘之协。XFFL, 137/3a–4a. 1800年春末，一名被俘的叛军探子供称：刘之协先派其子到戴家营，让叛军去河南解散，随后又亲自前往，重申此意。但嘉庆不信。XFFL, 175/23b–26b.</li>\n<li>刘之协供词，BLJZL, 5:93–106; XFFL, 197/29a–b.</li>\n<li>嘉庆曾说汝州一直是个\"安静\"的地方。XFFL, 197/29b–30a.</li>\n<li>冀大荣、廖寅（叶县知县）与周季（南阳知府）都获授官职或升迁。刘之协供词、冀大荣供词、李杰供词，BLJZL, 5:93–108; XFFL, 190/1a–3b, 191/10a–15b; JQSYD, 5:355–56, 378.</li>\n<li>JQSYD, 5:329–67, 379, 392–93 各处; XFFL, 190/1a–3b 及卷191 各处; 吴熊光《伊江笔录》（Wu, Yijiang bilu），1/14b–15b。</li>\n<li>嘉庆曾命新近从吉林、黑龙江调来的一千五百名旗兵前往河南，但他们到达之前起事已被平定。XFFL, 190/3b–6b, 191/13b–15b, 190/16b; JQSYD, 5:363–64.</li>\n<li>BLJZL, 5:93–106; QSLJQ, 72/21b–24b.</li>\n<li>嘉庆还赦免了河南官员未能发现刘之协在本省藏身之处的过失。JQSYD, 5:343–44; XFFL, 191/4b–8b, 197/29a–30b, 198/7a–8b.</li>\n<li>XFFL, 198/9a–11b, 199/5a–8a.</li>\n<li>许曾重、林易\"刘之协\"。作者还质疑刘之协作为混元教最高领袖的角色，但论证并不令人信服。</li>\n<li>额勒登保1800年初提到：许多真正的教门叛军不怕死，把死亡视为转世后通往更好处境的必经之路。自己的股团被击垮后，他们会加入任何可加入的队伍。XFFL, 144/5a–b. 张汉潮的弟子周天绪1800年中被俘后，一直不服，直到在数千观众面前被凌迟处死。XFFL, 199/21a–22b.</li>\n<li>张世虎供词，BLJZL, 5:154–55.</li>\n<li>XFFL, 121/1a–5a, 138/25a–b, 142/9b–12a, 170/18a–22b, 174/1a–2b.</li>\n<li>庞洪胜不久战死。XFFL, 173/28b–29a, 181/1a–7a. 明亮与永保1799年奏报：秦岭中的\"红钱\"匪伙大多被叛军吸纳。XFFL, 100/8a–b.</li>\n<li>1800年春，一名这样的叛军探子在陕西蓝田被捕。XFFL, 162/22a–23a.</li>\n<li>XFFL, 100/1a–b, 129/16b–17b, 129/30a, 134/23b–24a, 192/28a.</li>\n<li>XFFL, 140/1b.</li>\n<li>XFFL, 182/35a–38b.</li>\n<li>XFFL, 卷147、150–53、156 各处及168/1a–3a; QSLJQ, 61/18a–19a.</li>\n<li>刘清很快复职，但太和镇的两名官员被处决，另有数人被罢免。XFFL, 165/12b–13b, 170/4a–7a, 177/20a–22b, 186/17a–22a.</li>\n<li>勒保审讯了七十五并查验其伤。他声称其伤属实。XFFL, 156/45b–48b, 164/8a–9a, 177/17a–19a, 177/21b–22a, 189/11b–14b, 189/19a–b.</li>\n<li>XFFL, 165/1a–7a, 166/40a–41a, 170/1a–4a, 170/7a–8a, 172/25b–30a, 172/30a–31b.</li>\n<li>王英是达州人，1796年以来的老叛军。他脱离本队，到龙安一处清军后勤站当挑夫，被一名达州籍军官认出。他在成都被处决。XFFL, 174/13a–16a, 174/21b–23a; 王英供词，BLJZL, 5:91–92.</li>\n<li>XFFL, 174/16a–17b, 174/19b–24a; JQQJZ, 5:289.</li>\n<li>XFFL, 174/3b–5a 及卷177–80、182、184 各处。</li>\n<li>勒保为百祥辩护，对增顺则更严厉。XFFL, 182, 5a–10b, 189/11b–14b.</li>\n<li>XFFL, 160/23b–28b, 171/9a–13a, 183/5a–8b, 191/29b, 197/10a–11a, 及卷173–74、178–79、185、187–89 各处。</li>\n<li>XFFL, 186/17a–20a, 189/1a–6a, 193/1a–7b, 193/11b–13b.</li>\n<li>XFFL, 193/7b–9a, 195/21b–24b, 197/14b–22a, 199/13a–15a.</li>\n<li>鲜大川派两名信使与其叔父接触，叔父说服二人杀死鲜大川。鲜大川的叔父命乡勇攻打鲜大川，随后二人杀死了鲜大川与最后十几名叛军。XFFL, 195/17b–21b, 195/24b–29a.</li>\n<li>XFFL, 195/21b–24b, 199/9a–13a, 201/5b–10b.</li>\n<li>最后的人马全部离他而去之后，张子聪扮成难民乞食为生。XFFL, 201/5b–10b, 202/1a–6b, 203/17b–22b, 207/9a–18a, 208/1a–7a, 208/16b–22a, 210/11a–14a; 张子聪供词，BLJZL, 5:109–11.</li>\n<li>XFFL, 183/13a–15b, 184/2a, 184/6b, 184/7a–10a, 187/34a–35b, 187/38b–40b, 197/22a–25b, 201/10b–14b.</li>\n<li>XFFL, 189/16a–17b, 195/24b–29a, 199/15a–18a, 202/6b–9a, 203/31b–35b, 207/18a–20b.</li>\n<li>嘉庆同意让赛冲阿留下，但驳回了他们增援的请求。XFFL, 189/6a–11b, 197/20b–25b, 203/27a–28b, 203/35a–b.</li>\n<li>XFFL, 207/18a–20b, 208/16b–22a, 210/14a–15a, 214/1a–14a.</li>\n<li>XFFL, 216/24b–31a.</li>\n<li>嘉庆升赏了四川六十多名军官、地方官与乡勇。XFFL, 208/22a–26b, 210/19b–21b, 210/27b–28a, 214/14a–18a, 216/31a–34b, 216/34b–36b.</li>\n<li>XFFL, 176/10b–15b.</li>\n<li>XFFL, 卷176 各处及178/9a–11a, 179/1a–10a.</li>\n<li>XFFL, 卷180–81、183–84 各处。</li>\n<li>但额勒登保告诉嘉庆：战争已近尾声，无需增援。XFFL, 184/37b–39a, 186/1a–5b, 188/12a–16a, 188/17b–19a.</li>\n<li>因未能阻止叛军入甘，嘉庆给了长麟与台布象征性处分，并降职处罚了数名将领官员。XFFL, 172/35b–38a, 179/15a–21a, 180/1a–8b, 及卷183、185、187 各处。</li>\n<li>定柱与一千名直隶兵于嘉庆五年闰四月十五日到达河南卢氏。XFFL, 179/31a–33a, 182/13b–14b, 183/14b–16a, 185/21a–22b.</li>\n<li>XFFL, 185/16a–17b, 186/27a–b, 231/25b–26a, 191/29b–31b. 队内，高姓之人用上书\"高家营\"的黄旗；马姓之众用上书\"马元帅\"的蓝旗。XFFL, 212/1a–5a.</li>\n<li>XFFL, 204/10b. 嘉庆追赠王文雄三等子爵，赏其母一千两。他以赛冲阿接替王文雄之职。XFFL, 192/17b–20b, 192/20b–22a, 194/11a–13b, 196/1a–4b, 196/6a–7b, 196/8a–b, 198/20a–22a.</li>\n<li>XFFL, 卷186、188、190、192–93、195–96、198、201、203、205、207、209、213 各处。</li>\n<li>XFFL, 卷197–201 各处及204/1a–9b, 199/18b–21a.</li>\n<li>XFFL, 205/20a–27a, 209/1a–9a, 211/15b–23a, 212/1a–5a.</li>\n<li>XFFL, 205/20a–30a, 211/15b–23a, 213/8a–12b.</li>\n<li>XFFL, 196/19a–22b, 197/11a–14b, 201/3b–5b, 201/27b–32a, 203/16a–17b, 207/28b–31a, 208/1a–10a, 209/9a–14a, 211/23a–26b.</li>\n<li>嘉庆对台布一直不满：他肃清张汉潮残部迟缓；对投降叛军过于宽大——台布曾以\"不杀\"为号召诱降；供应额勒登保军队不力。XFFL, 149/7a–9a, 181/11a–14a, 及卷183–84 各处。台布被派往西宁任办事大臣。陆有仁被任命为新任陕西巡抚。XFFL, 204/19b–20a, 206/1a–3b.</li>\n<li>XFFL, 213/16a–19b.</li>\n<li>嘉庆给了庆成\"严旨申饬\"——他赶到渡口太晚，只截住了最后一批正在渡江的冉学胜人马。XFFL, 214/22b–31a, 215/16b–24a.</li>\n<li>庆成赶到时，大多数叛军又已渡过。但嘉庆罢免了负责江防的关腾。XFFL, 213/1a–8a, 216/9a–20a, 218/15a–22b, 218/27b–37a.</li>\n<li>XFFL, 217/9b–14b.</li>\n<li>XFFL, 216/1a–4a, 216/9a–17b, 217/1a–3b, 218/15a–24b.</li>\n<li>XFFL, 213/7a, 215/26a–29b, 216/17b–20a, 217/4b–7b, 217/14b–16a, 218/27b–37a.</li>\n<li>台布初秋提到：额勒登保之所以不请援兵，是因为新兵素质低劣、经费短缺。XFFL 191/31b–36b.</li>\n<li>XFFL, 218/27b–37a.</li>\n<li>XFFL, 198/1a–6b. 其他估计在五千至七千之间，弘丰则估计联军只有一两千。XFFL, 147/24a–26b.</li>\n<li>XFFL, 148/15a–20b, 149/29b–38a, 150/32b–34b, 153/5a–10b, 153/11a–b; JQQJZ, 5:80–81; GZDJQ, 4724, 4878, 4927, 5124.</li>\n<li>XFFL, 154/22b–26b, 156/1a–8a, 158/10a–13b.</li>\n<li>据被俘叛军说，樊人杰想回襄阳，徐天德则打算回四川。XFFL, 154/22b–26b. 春末，鲜大川与龙绍周也曾进入湖北，试图与徐天德会合，没有成功。XFFL, 160/17b–19b, 161/36a–37a, 165/17a–19b, 168/10b–15a.</li>\n<li>XFFL, 150/4b–10a, 151/19b–23a, 153/11a–b. 松筠请求从额勒登保处调两三百名索伦骑兵入鄂，嘉庆拒绝了。XFFL, 158/5b–10a.</li>\n<li>嘉庆让吴熊光继续监视明亮与倭什布。XFFL, 162/1a–5b, 169/9a–12a, 165/17a–19b, 171/15b–26b. GZDJQ, 5261, 5345, 5415.</li>\n<li>这两个衔是蓝翎侍卫（lanling shiwei）与领队大臣（lingdui dachen）。XFFL, 162/3b–4b, 162/5b–8b; QSLJQ, 62/25a–b.</li>\n<li>嘉庆批准了明亮\"从广西调两千名士兵、从北京派十名军官\"的请求，但拒绝给他数百名额勒登保的索伦骑兵。XFFL, 169/23a–30b.</li>\n<li>XFFL, 172/14b–25b, 175/4b–10b, 及卷176 各处; JQQJZ, 5:268.</li>\n<li>QSLJQ, 62/25a–b; XFFL, 158/7b–10a, 162/6a–8b, 173/2a–3a, 及卷178–82、186、189 各处。</li>\n<li>XFFL 卷190–95 各处及206/12b–18a.</li>\n<li>叛军渡河当天，明亮赶到南沙河边，却说没有船，在岸边停下——尽管水深只及膝盖。随后，当地士兵与乡勇因无法辨认身份而拦下他的人马，明亮为此大闹一场，导致当地多名官员军官被罢免。XFFL, 196/22b–27b, 197/1a–3b, 198/1a–8b, 200/10b–17b, 200/18b–20, 217/20a–25a, 217/30b.</li>\n<li>XFFL, 202/9a–12a, 201/22a–27b.</li>\n<li>姜晟提议：四百五十名旗兵去房县协助倭什布，其余一千零五十名归明亮。嘉庆同意了。关于旗兵的部署，见XFFL, 卷194、196、197、199、201、202。</li>\n<li>XFFL, 197/3b–4b, 197/5b–6b.</li>\n<li>XFFL, 196/27b–29b, 卷202–5 各处, 207/1a–6b. 德英额避开了这场战斗，自称受伤，返回了驻地。嘉庆将他罢免，命押解勒保与德楞泰处验伤。XFFL, 203/35b–37b.</li>\n<li>XFFL, 卷202–7 各处, 209/16a–17b.</li>\n<li>明亮论证说，留在丰溪可以同时监视川陕两省的叛军；入川则会使湖北空虚。他再次抱怨兵力规模，以及四百五十名骑兵中只有四至五成有马。XFFL, 209/15a–16a, 210/1a–6a, 211/9b–13a, 212/9b–11a.</li>\n<li>明亮被降为蓝翎侍卫。QSLJQ, 75/18a; XFFL, 205/14a–16b, 205/18a–20a, 210/6a–8a, 211/13a–15a.</li>\n<li>XFFL, 205/18a–20a, 208/8b–9a, 208/14a–16b.</li>\n<li>XFFL, 203/9b–10b. 乾隆朝晚期，长龄曾在福康安幕中参加多次战争。</li>\n<li>嘉庆五年十月初二日，长龄在旬阳取得首捷。一周后，长龄在竹溪鲍家店附近再战。数日后，他又进攻高马股，六个小时的战斗后追击叛军一整夜。随后长龄抄近路截住叛军，又打了一仗。XFFL, 卷208、211、212/1a–5a. 十月十七日，明亮与倭什布从丰溪赶往宝丰，攻打高马股余部，取得一场轻松的胜利；明亮声称杀俘一千余名叛军。长龄赶到后，与明亮把该股追入陕西。XFFL, 212/11b–16a, 212/19a–22a, 215/1a–5b.</li>\n<li>XFFL, 208/30a–33a, 211/5a–9a, 212/5a–7b.</li>\n<li>XFFL, 215/24a–29b, 218/1a–5b.</li>\n<li>返回湖北途中，长龄留下一千名广东广西兵及其最后五百名旗兵中的一百多名守卫竹溪县城。XFFL, 118/9b–13a.</li>\n<li>嘉庆还发还了明亮三品侍卫与领队大臣之衔。XFFL, 208/11b–14a, 212/16a–18b, 212/22a–23b, 215/1a–7a, 215/24a–29b.</li>\n<li>XFFL, 215/1a–5b, 217/9b–14b, 218/1a–5b, 218/9b–14a.</li>\n<li>姜晟被调任直隶总督。XFFL, 215/29b–31b.</li>\n<li>书麟是广厚与广兴的同父异母兄。他参加过第二次金川之役，但仕途大部分在文官系统。和珅被清除后，嘉庆先任书麟为吏部尚书，不久又任他为闽浙总督。他还授书麟紫禁城骑马之权——这是保留给最受信任高级官员的殊荣。JQQJZ, 4:140, 164.</li>\n<li>关于嘉庆即位初期所谓改革的讨论，见关文发《嘉庆帝》（Guan, Jiaqingdi），第3–6章。</li>\n<li>XFFL, 162/19b–20a.</li>\n<li>同时，嘉庆对后宫关注更少；直到1805年初他才生育子女。关文发《嘉庆帝》（Guan, Jiaqingdi），539。</li>\n<li>1800年初，吴熊光派密探赴襄阳考察地方防务与民情，随后奏报朝廷。GZDJQ, 5124. 1801年吴熊光被任命为湖广总督时，嘉庆称赞他所报情报准确。XFFL, 256/20a–21a.</li>\n<li>QSLJQ, 37/29b–30b, 38/26b; XFFL, 88/23b–24a, 88/30b–31a, 89/23b–24a, 98/29a.</li>\n<li>嘉庆曾承认：他的指示到达前线时，前线局势常常已经变化，因此遥控指挥十分困难。XFFL, 173/30a–b.</li>\n<li>嘉庆1800年深秋在一道谕旨中提到这一点。XFFL, 199/17a–b.</li>\n<li>XFFL, 144/24b–29b.</li>\n<li>魁伦曾提议把福宁流放新疆，但嘉庆把刑罚改为\"不给俸禄、充兵效力\"。嘉陵江渡江事件之后，嘉庆把裁减嘉陵江沿岸乡勇之责归咎于福宁，把他流放伊犁，但没有追究1796年之事。XFFL, 149/38a–40a, 152/27b, 164/33a–37b; QSG, 11174–75.</li>\n<li>XFFL, 150/22a–23b.</li>\n<li>张小元供词，BLJZL, 5:111–16.</li>\n<li>XFFL, 215/13a–15b.</li>\n<li>XFFL, 215/15b–16a. 关于曾静案，见史景迁（Spence）Treason by the Book。</li>\n<li>XFFL, 213/19b–20a, 215/13a–15b, 215/17b–18b.</li>\n<li>XFFL, 218/24a–25a.</li>\n<li>例如，见关文发《嘉庆帝》（Guan, Jiaqingdi），第3章。</li>\n<li>JQSYD, 4:29–30.</li>\n<li>JQSYD, 5:305–6; QSLJQ, 70/2b–3a. 洪亮吉原信现存于《洪亮吉集》。</li>\n<li>关于洪亮吉的晚年，见Jones, \"Hung Liang-Chi,\" 198–202。</li>\n<li>XFFL, 172/15a–16b.</li>\n<li>QSLJQ, 68/11b–24b.</li>\n<li>嘉庆这句话见于一道答复周兴岱的谕旨，JQQJZ, 5:460–61。</li>\n<li>JQSYD, 5:14.</li>\n</ol>", "text": "\n朕以皇考之心为心，以皇考之政为政。遵循皇考所定一切章程，唯恐不能仰承其意。何尝有\"改革\"之举？\n——嘉庆皇帝，1799年\n[译者按：原上谕自英文直译，文言原文待核。（出处见章末注释）]\n\n1799年堪称这场总体懈怠的白莲教战争中最有生气的一年。尽管犹疑不决、判断失当、常常在最后关头改弦更张，嘉庆皇帝还是改组了战争领导层，向战区派去了一批锐意改革的官员，并支持他们整治前线腐败的努力。然而，1800年成了逆转之年。改革派与习惯于挥霍无度的将领们之间的紧张关系加剧，额勒登保与德楞泰在年初制造了四川战场的一场危机，导致起事者渡过嘉陵江，游窜于富庶而迄今未受惊扰的成都平原。四川局势的骤然恶化令嘉庆心神不宁，对新领导人们——他们之间也起了内讧——大失所望，于是恢复了勒保的职务，把改革派一个接一个地打发走。其中，魁伦领受了这场战争中唯一加诸高级官员的死刑。尽管起事者很快在四川及其他战场省份被压制下去，藏匿多年的刘之协也被逮捕，到1800年底，对总计约两万名起事者的战争再次陷入僵局。随着1799年所立的各项改革尽数废弃，嘉庆皇帝褪去了改革者的外衣，退回到他真实的自我：优柔寡断、缺乏自信。^1\n嘉陵江之败与勒保复出\n1800年初，新年（1月25日）将至，又是自己亲政一周年，嘉庆对这场拖延了四年的战役更加懊恼——元旦谒陵时，他将无法报捷。不过，他从前线奏报与回京使臣的奏对中捕捉到的积极信号还是鼓舞了他：起事者已被逼入绝境、筋疲力尽，总人数减至约两万，活动范围仅限于川北与陕南。他推断并希望：缺乏统一领导、部众乌合，起事者已处于瓦解的边缘。^2\n然而，最后的胜利既不确定，也非近在眼前。1799年错过了好几个期限，皇帝又定了一个新的：嘉庆五年二月底。新年前数周，嘉庆颁发了众多谕旨，以越来越尖锐的口吻催促众将加快行动。他担心春天的到来与随后的收获季节会使叛军重振，而春雨会妨碍战役。他告诉额勒登保与那彦成：谁再拖延，他就会像处置勒保与明亮那样严惩不贷。嘉庆四年十二月十二日，额勒登保青子垭惨败的消息传到朝廷，嘉庆的悲观更深了。^3 数日后王登廷被擒，他的精神稍稍振作，但他不再相信众将所报的敌人真的已经\"穷蹙\"。^4\n与父亲一样，嘉庆抱怨找不到可以信赖的高级官员来替换现任领导层。然而，有官员提议派一位皇子领兵时，他断然拒绝，理由是这场战役对付的不过是几个\"乱民\"（luanmin），而非外敌；一旦皇子不能取胜，他无法惩处。^5 无计可施之下，他考虑起复明亮与勒保的可能性。事实上，他一直故意推迟审讯明亮。^6 把被罢免的将领（勒保还曾被交付审判定罪）重新派回前线，实属罕见，这个念头必定是朝廷上为两位受责官员游说的结果。此外，勒保既然能花钱减轻刑罚，以他雄厚的家底，也可能为获释与复职花同样的钱。有意思的是，嘉庆曾两次下令搜查明亮的家——因为明亮是个花钱的人，不是攒钱的人，没搜出多少——却一直没对勒保这样做。\n嘉庆还重新检视了他的心理战——它收效甚微。^7 为重申立场，嘉庆选择拿福宁旗鼓寨之战后屠杀两千名投降叛军一事开刀。他反复谴责福宁，命魁伦彻查。^8 大刀阔斧地扩展其恩威并施之策，嘉庆在正月初九日的谕旨中宣布：他将赦免所有叛军——不仅是裹挟从叛的平民，也包括\"真\"的教门起事者——只要他们投降；更重要的是，他将不再迫害和平奉教的教门中人。他一面敦促战区将领督抚广为宣示这些修正，^9 一面对起事者的\"抚\"（fu）作了更详细的指示。他要战争领导人不仅诱使被裹挟、受蒙蔽者脱离叛军队伍，还要妥善安置他们。为保护平民免遭叛军掳掠，他重申了筑堡与组织乡勇的必要性。^10 然而，前线的事态很快使这项新扩展的招抚政策搁浅。\n嘉庆此刻以及此后很长时间都没有意识到：他整顿战争财政的大胆努力，已在前线激起了敌意。松筠上年秋天就警告过：骤然削减军人的战时收入会挫伤士气。^11 然而，嘉庆没有听他的劝告。1800年新年前夕，嘉庆继续催促魁伦与广兴坚持新规章、根除积弊。他满意于自己已取缔了将领们用军费犒军的做法——这是主要的滥行之一。赏给额勒登保一万两、德楞泰五千两犒军专款之后，他进一步收紧了缰绳：责成将领们向军需局申请新的犒赏经费时说明理由，并授权魁伦与广兴：凡认为请求不当，或予驳回，或直接奏闻。^12\n与皇帝的愿望相反，他吝啬的拨款只激起了怨气。起初，额勒登保以青子垭之败为由，请求辞去统帅之职，请皇帝派一位\"福将\"（fujiang）来主持战役。但嘉庆回绝了他，并向额勒登保保证了自己的信任。^13 随后额勒登保公开为将领们犒军的做法辩护。他提醒皇帝：乾隆朝晚期福康安主持多次战争时开创了这一做法——额勒登保参加过那些战争——他不过是效法福康安，对有战功的士兵与平民慷慨犒赏。他辩称，自己的俸禄津贴不足以应付那些犒赏，所以才向达州军需局请款，如他所奏。他感谢皇帝的一万两，因为它将\"激励行间将士于战役紧要关头\"（原文待核，见注释14），并随折附上他所发犒赏的清单；他还暗示，这些赏赐不足以激励部队\"按期蒇事\"。^14 然而，这番往还很快被陕南的一场新危机打断。\n由于食物短缺，马五与高二所率各股、戴家营以及其他队伍——大多是襄阳出身，总数或许有一万——冒着冰雪穿过大巴山，从川北进入陕西。王廷诏随行，此举或许出自他的策划。新年前夕抵达汉江后，他们在勉县击溃清军，涉水渡江。^15 十二月二十七日及次日，他们在略阳渔关——此处江段称白水江——击破清军防线，渡过嘉陵江，侵入甘肃徽县。进入甘肃后，起事者从徽县蔓延到成县、两当、西和、礼县、秦州与巩昌。^16 甘肃再次成为战场。\n起事者在陕西南部的蜂拥而来，压垮了刚刚被罢免的松筠。他赶赴汉中，手忙脚乱地搜罗援军，保卫栈道、封锁起事者入甘之路，同时奏报进入陕西的叛军数目越来越大——从几千人到两万人。^17 嘉庆指示松筠留驻，并按松筠的请求，允许流放伊犁途中已到甘肃的庆成重新加入战役。^18 他还催促那彦成与恒瑞撤出秦岭，前往甘陕边境。他说那彦成\"自取坠路\"（ziquzhuolu，意为\"自入绝境\"；原文待核），再次斥责他数月来深入山林，不顾其他地方——在嘉庆看来，这正是当前危机的成因之一。^19 嘉庆对那彦成没有十足的信心，说他不是老于战阵的将领，而是\"书生\"（shusheng），于是决定派德楞泰赴陕。^20\n甘肃的危机在四川引发了一连串的调动。接到松筠的求援后，刚刚病愈的额勒登保立即决定亲赴陕西，把四川的战事交给德楞泰。嘉庆虽然指示过额勒登保留川（并温和地责备他关于起事者势力衰落的奏报失实），还是认可了他的决定，把旨意改发给德楞泰，让他留川与魁伦配合对付本地叛军。由于魁伦如今负有军事之责，嘉庆命新任布政使杨揆协助广兴主持后勤。^21\n然而，额勒登保没有立即前往陕西。他先从养病的东乡王家寨前往达州城。在达州盘桓数日过年，额勒登保就\"长骡\"问题与魁伦发生了严重冲突。嘉庆砍掉这项开支后，魁伦虽作了一些妥协，额勒登保仍怒气冲冲。^22 离开达州后，他上了一道长折，强调清军面临的困难与部队忍受的艰辛。除伤亡与疾病外，许多部队因连年出征与粮秣价格高昂而疲惫消沉，新调的士兵又缺乏训练、不熟地形。他还抱怨乡勇被裁减，以致人数不足、士气低落。言辞激烈、情绪激动，额勒登保的意思毫不含糊：部队理应得到更好的补偿。^23\n德楞泰接到额勒登保告知其赴陕的信时，正在大宁休整——他追击鲜大川与苟文明到大宁后，为过年暂停了一切军事行动。^24 尽管额勒登保指示他留川，德楞泰还是决定也去陕西，并于年后数日奏报了朝廷。对\"长骡\"被砍愤愤不平，德楞泰痛诉：由于失去\"长骡\"，给养不能按时运送，他的部队不得不在大宁冰雪覆盖的山中长时间扎营，没有帐篷与炊具，许多人冻伤，甚至患了雪盲。^25 嘉庆对他的抱怨置之不理，起初反对德楞泰赴陕的计划。他斥责德楞泰在大宁行动迟缓，命他留驻原地与魁伦配合，并指出：魁伦虽然在四川任绿营军官多年，却不善于打仗。^26\n然而，数日之内，嘉庆就更改了德楞泰的任务，因为起事者再次突入了湖北。趁清军主力开赴陕甘前线之机，徐天德与樊人杰率数股联军，于正月初四日从平利强行突入竹溪。随后他们移向房县与保康，但被倭什布率领的湖北军队挡住。趁德楞泰在大宁按兵不动，鲜大川与苟文明前往陕西，试图突入湖北。然而，攻打湖北边境关卡两周之后，他们未能进入湖北，返回了四川。^27 对湖北的关切甚于甘肃，正月十七日，嘉庆改派德楞泰驰援湖北，并命1797年以来驻扎鄂西北汉江北岸的河南军队加强江防。^28 次日，嘉庆作出了一个出人意料的决定：释放明亮出狱，命他火速赶赴湖北。嘉庆历数明亮自18世纪50年代准噶尔诸役到迅速镇压孝感起事的诸多功劳，为他洗脱了所受指控，甚至宽恕了他收受胡齐仑贿赂一事——因为那些钱是用于犒赏士兵的，而两次抄家也证明他没有聚敛巨额财产。^29\n额勒登保反对德楞泰赴陕。正月初八日到达保宁时得知此事，额勒登保急忙致信德楞泰，试图阻止他离开四川。然而，德楞泰已经上路（很可能他收到了额勒登保的信，却选择了不理）。正月二十日，德楞泰与额勒登保、松筠会于褒城。三人不知道几天前叛军已在四川渡过嘉陵江（详见下文），决定让德楞泰先加入甘肃战役——尽管皇帝已命德楞泰回川（命他赴鄂的旨意尚未到达）。他们奏报：甘肃肃清叛军后，额勒登保与德楞泰都将返回四川。^30 接到他们的联名奏折以及台布\"更多起事者从四川进入陕西、有些已渡过汉江\"的奏报，皇帝再次改变主意；他改派德楞泰赴陕西石泉，保障汉江防线。至于湖北前线，嘉庆让魁伦从四川另挑一位将领——七十五、阿哈保或朱射斗——派往湖北。^31\n额勒登保与德楞泰双双离去之后，四川最可观的一支清军是七十五的五千人。然而，七十五这位四川提督，自1799年底到达夔州拦截湖北叛军以来，已数月按兵不动；嘉庆曾指示额勒登保查清七十五是否故意避战。^32 七十五在福康安麾下服役多年，习惯了慷慨的战时犒赏，对前线的改革想必大为沮丧。新年前没有收到皇帝的任何赏银，七十五便向广兴请求每月三百两作犒军之用。毫不奇怪，广兴拒绝了他，让他有理由犒军时再请款，而非定期领钱。^33 心灰意冷的七十五在追击一股叛军到大宁后停止了军事行动。^34\n清方这些变故为四川的起事者创造了最佳机会。青子垭大捷之后，冉天元东移太平、新宁与梁山。^35 曾与冉天元交手的穆克登布随额勒登保赴陕后，冉天元立即前往临江市，在那里与其他四股会合：张子聪率领的白号——他来自大宁，七十五未能拦住他；徐万富率领的黄号；陈得俸率领的线号；王英率领的黑号。一个联盟就此形成，冉天元任其统帅。由于食物短缺，起事者决定西进，渡过嘉陵江，然后北上与陕甘的高马股及其他队伍会合。^36 与1798年初在临江市从容过年不同，这支联军迅速开拔，直奔嘉陵江。^37\n如今主持四川军事行动的魁伦，对敌情全然懵然。他以为徐天德仍在四川，却不知道冉天元联军的行踪，更不用说他们西进的计划了。他在军事前线与战争财政改革两个方面都只向皇帝报喜，这加深了嘉庆的错误印象：大多数起事者已去了陕西或湖北，四川只剩残部——尽管嘉庆有时也怀疑魁伦的说法。^38 魁伦没有说的是，他在四川越来越孤立。除与将领们的冲突外，在如何削减开支上，他与广兴的分歧也日益加深。广兴更坚定、更理想主义，魁伦则越来越现实、越来越温和。^39\n魁伦态度的转变，最鲜明地体现在他对福宁1796年屠杀投降叛军一案及其可能侵吞军费的调查上。一反常态，魁伦为福宁的屠杀辩护，说那是谨慎自卫——福宁没有足够的兵力控制一千多名凶悍的叛军。在魁伦看来，福宁唯一的过错是没有把情况说清楚。魁伦还为福宁的后勤管理辩护，论证说福宁恪守规章，常常驳回将领们无理的请款，以致他们对他心怀怨恨。魁伦只奏报了福宁的一处违规——他从军需局领取了近五千两，用于犒赏守卫达州及附近关卡的部队——并提议让福宁戴罪赴前线效力、不给俸禄，再缴还那五千两。魁伦立场的惊人转变没有打动皇帝；嘉庆拒绝宽恕福宁，要求更重的惩罚——因为福宁的屠杀产生了恶劣影响，使叛军不敢投降。^40\n魁伦与广兴最严重的分歧，围绕裁减四川庞大的乡勇。广兴很快认定与乡勇相关的开支是战役巨额耗费的主因之一，便投身于裁减工作（广兴到达之前，福宁也已开始缩编乡勇，这曾引起军事领导人的不满）。然而，魁伦态度暧昧。他不仅怕加深与将领们的冲突，还看到了使用乡勇的价值——他手头没有足够的军队。因此，他区别对待：在远离前线的地方裁撤乡勇，在热点地区——如鄂川边境沿线——则多雇。此外，魁伦依靠乡勇防守漫长的嘉陵江——川西的天然屏障。广兴裁撤沿江乡勇时，魁伦设法保住了广元至蓬州之间上游河谷的乡勇。^41\n托津回京后，向皇帝呼应了广兴的看法。托津批评魁伦在叛军失去活力之后仍维持一套浪费的防御体系。他特别点了嘉陵江以西昭化、南部与蓬州三地的驻军与关卡——起事者从未踏足那里。但魁伦激烈地为自己的江防辩护，论证说那里的乡勇挫败了起事者的数次渡江企图。嘉庆起初被托津说动，随后又被魁伦说服——他长期以来一直担心嘉陵江的安全。^42 然而，嘉陵江下游河谷连魁伦也忽略了。\n尽管嘉庆称赞魁伦与广兴都清廉勤勉，他却越来越偏向魁伦而非广兴。^43 显然，广兴大胆的个性与毫不妥协的财务作风得罪了很多人；嘉庆听到了不利于广兴的流言。正月初十日，嘉庆以托津取代广兴任四川军需局主管，托津回京之前由阿迪斯署理。^44\n然而，魁伦将遇到比广兴更大的麻烦。他为征剿川东北几股叛军而拼凑远征军时，发现额勒登保留给他的八千名士兵大多不顶用——只有阿哈保率领的三百名索伦骑兵例外。许文谟率领的部队被额勒登保指派守卫达州。百祥的数千名士兵大多是伤病员，被安排在养伤期间守卫后勤站点，装备也很差。百祥集合部队到达达州后，魁伦花了数日分发他们的津贴、给养与装备。直到正月初八日，魁伦才率军从达州出发。但他又不得不在达州南郊的雷音铺停留数日，为朱射斗的部队补充给养——他们从南江赶来，要求先发给他们拖欠已久的津贴。^45 远征军再次出发时，转向东南——因为魁伦仍相信新宁与梁山只有\"零星\"叛军藏在山中，他们或许想移向湖北。^46（地图4.1）\n魁伦迟缓而错误的行动，使冉天元的联军毫无压力。他们轻松渡过渠江，迅速逼近嘉陵江。^47 正月十一日，一支数千人的分遣队到达江北悦来场——与重庆城隔嘉陵江相望。遭到重庆守军从嘉陵江南岸的炮击后，起事者于次日拂晓离开，前往合州，留下几十具尸体，尽管重庆城的戒严直到初夏才解除。^48 到正月十四日，联军抵达合州，但那里嘉陵江宽逾半英里，令他们却步。冉天元挑选了八百名精壮，火速北上定远。正月十五日元宵节的雨夜，叛军斥候扮成清军，来到利渡场石板沱渡口。大多数船只都停泊在对岸——对岸几名乡勇正在参加灯会（定远的乡勇上年夏天已被福宁裁减）。定远知县孙熙元得知起事者朝自己这边来时，曾请求拨款多雇乡勇，但为时已晚。孙熙元只有一百多名士兵，只能闭守定远县城。在渡口，叛军斥候泅水到对岸，杀死船夫，夺取船只。乡勇全都逃跑了。三天里，数千名起事者与被裹挟者——双方估计总数约一万——渡过江去。\n或乘船，或骑马。^49 战争第一次蔓延到四川嘉陵江以西。\n直到正月十二日听到重庆告急，魁伦才把远征军调往合州。然而，他似乎没有料到起事者会渡过嘉陵江。他更担心甘肃的叛军可能窜入川西，便分兵前往川北边境。嘉庆对魁伦行动迟缓皱眉，却赞同他加强北境防务。与魁伦一样，嘉庆也没有预见四川的危机；他坚持要魁伦派一名将领增援湖北。^50 魁伦到达邻水时得知渡江之事。他立即请德楞泰火速回川，并请求贵州派三千名援军入川。他还急信七十五，请他前来救援。魁伦承认自己措置失当、请求处分，却辩称自己并没有裁减沿江乡勇。^51\n魁伦的奏折于二月初一日到达时，这消息对朝廷犹如晴天霹雳。嘉庆花了一整天处理危机，颁发了众多长谕。他虽然勉强承认自己与军机大臣们负有一定责任，仍毫不留情地斥责魁伦酿此大败，声称他的罪比勒保还重——因为勒保任内叛乱没有扩大。然而，他暂不罢免魁伦——理由是魁伦品行高尚——责成他化解危机：或消灭江西之贼，或把他们赶回东岸。^52 除批准魁伦所请的援军外，嘉庆命正赴湖北途中的明亮改道四川。^53 然而，嘉庆那天作出的最不同寻常的决定，是释放勒保出狱，以\"蓝翎侍卫\"（lanling shiwei）身份派回四川。嘉庆宣布：勒保没有贪腐之罪，他的过错——拖延与不作为——被他苗疆战役的贡献与擒获王三槐之功所抵消。^54\n勒保的复出实际上宣判了魁伦的末日——魁伦的处境已因与广兴冲突的升级而恶化。听说四川危机一周前，嘉庆已决定让广兴留川协助托津主持后勤，因为他接到广兴的自辩与更多前线腐败的揭露后，确信广兴可信。^55 嘉陵江渡江事件之后，广兴上了一道又一道奏折，无情地批评魁伦行动迟缓、未能阻止渡江。在前线途中的魁伦不得不还击。他指责对手处理后勤过分严苛，并向皇帝报告：广兴在他离开达州之前，就向他索要总督令箭（lingjian）——总督职位的信物——在魁伦看来这是僭越。魁伦提议由刑部对广兴提起诉讼、严加惩处。危机正酣之际两人的激烈争吵令嘉庆恼怒，他把两人都训斥了一顿，但对魁伦更重。^56\n渡过嘉陵江后，叛军北上，朝甘肃方向移动。但他们先裹挟当地居民，招募啯噜匪徒及其他愿意入伙者。地方士绅组织乡勇抵抗时，起事者以烧杀回应，沿途留下一片狼藉。^57 正月二十三日，他们攻打蓬溪县城——守军很少，城墙还在修缮中——没有攻下。五天后，魁伦来到这座满目废墟、尸骸未掩的城市。他在涪江（时称\"潼江\"）附近设下临时大营——涪江是嘉陵江之后通往成都平原的第二道屏障——并派朱射斗、阿哈保与百祥向北追击敌人。^58 正月二十九日，朱射斗与阿哈保在西充高院场追上了冉天元。由于百祥朝另一方向追一支叛军分遣队去了，朱、阿二人只有两千名士兵。冉天元兵力更大，又占据了高地，几乎全歼敌军，杀死了朱射斗与十几名清军军官；阿哈保得以脱身——这是他在这场战役中第三次死里逃生。^59\n随后，叛军联盟——据说已膨胀到三四万人——向北移动，在嘉陵江与涪江之间的西充、盐亭、南部一带盘桓。失去朱射斗及其部队后，魁伦除了派小队骚扰敌人外，什么也做不了。起事者放松而得意，甚至在西充唱戏摆酒，为冉天元庆生。^60 然而，夹在两条江之间，德楞泰又从北面逼近，他们处境险恶，唯一的出路是渡过涪江。但斥候们的渡江尝试全都失败了。魁伦对江防下足了功夫：他在漫长的江岸设下众多关卡；提高饷银招募乡勇；让刘清率六百名正规兵逐卡巡逻；还部署了三千六百名川西藏兵与金川屯兵。^61 他还在等待七十五的到来。然而，七十五借口腿伤复发，坐着竹椅，行动迟缓。^62\n这让人想起1731年雍正皇帝听说傅尔丹被准噶尔蒙古人惨败时的做法——他没有责备，而是安慰准噶尔之役清军将领之一的傅尔丹，并把自己的腰带附去，提醒傅尔丹自己的责任所在，免得他自杀^63——嘉庆听说朱射斗之死，也克制住自己，没有过分痛斥魁伦，唯恐魁伦自杀。他允许魁伦暂停行动、等待援军，并命贵州再派两千名士兵入川。^64 然而，嘉庆的低调反应并不是对魁伦的宽恕。他把希望寄托在勒保身上，一再催促勒保火速入川，责成他歼灭两江之间的叛军。二月二十日，他任命勒保署理四川总督，赏三品顶戴。他还授权勒保查办四川几名有问题的将领：阿哈保、七十五与阿迪斯。^65 魁伦由此陷入越来越尴尬、越来越艰难的境地。\n改革派的淡出\n嘉陵江之败几乎颠覆了嘉庆皇帝轰轰烈烈却又摇摇欲坠的前线改革。对嘉庆而言，军事上的灾难证实了他对新派前线领导人与日俱增的怀疑。通过恢复勒保，他准备掉头。但撤退起初是以进攻的姿态上演的。二月二十四日，嘉庆重提几桩已结的旧案，对几名被革职受罚的将领督抚施以新的惩处。他褫夺了英善吏部侍郎的兼衔，罢免了宜绵乌里雅苏台参赞大臣与三品侍卫的现职，把宜绵与秦承恩流放伊犁。^66 除其他用意外，这些新处分意在向战役现任领导人们发出警告。嘉庆明确划分了他们的责任（额勒登保与那彦成主持甘肃战役；台布主持陕西；德楞泰、魁伦与勒保主持四川；松筠、明亮与倭什布主持湖北），责成他们在各自辖区内肃清叛军，并阻止叛军进出。^66 当时名单上旧班底与1799年的新班底并列，但此后数月里，新领导人们一个接一个地失宠。到1800年中，嘉庆已完成向旧班底的回归。\n松筠遭斥逐\n勤勉而干练的松筠，是和珅被清除后最先获任要职的人之一。一到陕西，松筠就留意叛乱的成因与构成，寻求根本之策。与其他总是描绘战役阴暗图景的前线领导人不同，松筠认为叛军并不危及王朝生存——他们领导力弱、潜力有限，除了登山越岭的本事——尽管他有时可能低估了他们的韧性。松筠没有为陕西请求援军，更倾向于使用撒拉族士兵与阿拉善蒙古骑兵——这比从远方调正规军划算。^67 在前线待了几个月后，松筠似乎确信：维系叛乱的是社会弊病，而非教门信仰——叛军不断吸纳边缘人与匪徒（尤其来自此类人众多的四川），因而每次战败后都能重组。有鉴于此，他建议解除四川对私盐贸易与私铸钱币的禁令，以免私盐贩子与伪造钱币者被逼入叛乱。然而，这个提议令嘉庆极度不安，认为它荒谬而冒犯，以至于他让军机大臣们起草谕旨批评松筠，而不让军机章京代笔。^68\n此事使松筠失去了在朝廷的良好印象。此后，松筠常常被挑出过错。1799年底，他试图延长陕西撒拉族士兵的服役期，遭到嘉庆的严厉批评。松筠奉命审讯被罢免的永保、明亮与庆成时，他对明亮与庆成的宽恕态度再次激怒了嘉庆。^69 1799年临近尾声时，嘉庆已完全失去对松筠的信任。除\"严旨申饬\"外，他还褫夺了松筠的荣衔与翎羽顶戴。只因为找不到合适的人选接替，他才让松筠留任。^70 嘉庆常常把松筠与那彦成一起贬斥，尽管二人从未亲近。或许是对那彦成新贵的做派不自在，松筠一直试图与他保持距离，这又招致嘉庆责备松筠：奏折里从不提那彦成的行踪与战况。^71\n尽管不得不忍受种种批评，松筠仍坚持自己对叛乱迁延原因的看法。书信不能说服皇帝，他就想当面陈述。1800年初，松筠请求短期休假进京面圣。^72 然而，就在松筠写这道奏折的当天——正月初八日——嘉庆罢免了他的总督之职，任命他为伊犁将军。十天后，嘉庆又命松筠赴鄂署理湖广总督——因为湖北局势似乎在恶化。台布与接替松筠的长麟都请求让松筠留陕，嘉庆没有同意。^73 在陕西近十个月的任期内，松筠早就意识到：不危及许多人的既得利益，就不可能根除战争财政的弊病，于是他选择不硬碰硬，从而避免了与陕西其他领导人的紧张关系。然而，他没能让皇帝满意。\n二月初，松筠刚到襄阳，被改派湖北的复职明亮也到了。稍早前，荆州将军弘丰与新任湖广总督姜晟先后到达，各带一千名士兵。^74 明亮坐镇湖北军事、姜晟接任总督，松筠或许觉得自己的存在已无必要。三月下旬，他把部队交给明亮与倭什布，请求进京，抱怨病后体虚。但他也说，想当面奏报战役及战场省份的情况。这一次嘉庆同意他回京。^75\n在四月之后的闰月里连续数日的觐见中，松筠再次陈述了他在四川解除私盐与私铸禁令、设卡征税的提议。他写了一道详陈己见的奏折，当面呈上。嘉庆再次被激怒。他论证说：不允许私人染指这两项重要事业，是本朝成法，他不能更改。他还指出，四川一开私铸之禁，他省必群起效尤，将在经济领域造成大乱。对松筠坚持己见不悦，嘉庆拒绝了松筠重返战役的请求。他把松筠由伊犁将军降为副都统，以最低的旗衔\"领队大臣\"（lingdui dachen）把他发往新疆。^76 松筠虽然未受法律惩处，前往遥远的新疆却不啻流放；他将在那里待将近十年。^77\n魁伦获赐自尽\n然而，松筠的结局比魁伦好得多——魁伦没能活过这一年。二月初三日——接到渡江消息、恢复勒保职务两天后——嘉庆命德楞泰火速回川，主持那里的战役。^78 嘉庆虽然把嘉陵江之败归咎于德楞泰，却不得不倚重这位能干的将领，希望他能歼灭两江之间的冉天元联军。鉴于德楞泰惯于故意拖延、从不全歼任何股团，嘉庆许他更高的爵位，同时以严惩相威胁。^79 军权既已交给德楞泰，魁伦被完全晾在一边。\n在警讯频传中返回四川，德楞泰信心十足——他知道敌人夹在两江之间，处境不利。他告诉等候他的地方官员：把所有船只都停泊到城镇附近，但听任叛军在他们待过的地方游荡。^80 二月十八日到达广元后，德楞泰迅速南下，二月二十四日在江油遭遇冉天元。战斗中，冉天元把德楞泰诱至新店子——他在那里设了埋伏。遭到占据高地的冉天元部众的袭击，德楞泰的部队伤亡惨重，一百多名士兵与数十名军官死伤，尽管冉天元也损失了许多人——包括他的弟弟——陈得俸被俘；冉天元本人右手掌负伤。战后，德楞泰暂停行动，向魁伦请求增援。^81\n德楞泰从魁伦那里得到近五千名士兵——包括那三百名索伦兵——后，三月初在江油连续作战。冉天元让自己的队伍不断运动，反复使用他钟爱的伏击战术。然而，三月初六日，他在马蹄岗被德楞泰击溃；冉天元双腿重伤后被擒。^82 三十六岁的冉天元是位天赋过人的叛军统帅，被俘后仍桀骜不驯。他被押送成都，凌迟处死。^83\n叛军联盟的余部——仍有数千人——退入剑州，据守石门寨——当地人修筑的一座大堡。三月十三日，德楞泰赶到，破寨而入，杀死数百人、俘获更多，其中包括陈得俸的妻子——她身着白衣参战，手擎大旗，上书\"替夫报仇\"（Tifubaochou）四字。然而，大多数起事者及其许多家属攀崖逃脱。德楞泰很可能并不打算把他们一次全歼。^84\n德楞泰有效地打断了联军的脊梁。与往常一样，德楞泰的胜利伴随着一场屠杀。除战场上数千人被杀外，德楞泰还随意屠杀俘虏，动辄使用凌迟等残忍手段。^85 嘉庆不为其暴行所扰，对德楞泰的迅速进展欣喜若狂。德楞泰每报一仗，嘉庆就对他及部下赏赐无数：礼物、升迁、加饷。他把德楞泰的爵位从二等男升为三等子，并因七十五拖延被革职，让德楞泰署理四川提督。^86\n然而，德楞泰戛然中止了他的凯歌行进。他奏报：一万多名起事者及其家属从石门寨逃脱，正逼近涪江。然而，他只派了约两百名斥候尾随，说他正指望魁伦的江防。^87 从后来的事态看，德楞泰可能是故意给起事者留出渡涪江的机会。但他或许不是这个计谋的唯一主谋。三月十二日——石门寨之战前夜——勒保到达广元。他可能在战后立即与德楞泰会了面，尽管两人都没有奏报朝廷。^88\n尽管嘉庆一再催促，勒保仍以蜗牛般的速度向四川移动。二月十八日到达西安后，勒保花了三周才到广元；他给的理由是：为确保一批军费经栈道安全转运，他在凤县停留了数日。走得慢，勒保自有好处。他或许在等德楞泰的胜利，同时设法在奔赴前线前集结一支可观的军队。^89 然而，勒保最大的顾虑应当是魁伦还在四川。德楞泰最近的胜利帮了魁伦——四川战场的改善缓解了皇帝对魁伦的怒气。三月二十一日，嘉庆对魁伦保卫涪江的努力表示满意，让他署理四川总督（但把品级从一品降为三品），打算留他在四川主持江防。同时，嘉庆撤销了先前让勒保署理四川总督的决定，任命勒保为四川提督（因德楞泰正署理此职，嘉庆让德楞泰任成都将军）。嘉庆把勒保的品级从三品降为四品，裁定勒保留任观察八年。^90 这道谕旨虽未送达，勒保与德楞泰会面时，二人应当明白把魁伦留在四川的利害所在。颠覆魁伦最有效的办法，是再制造一场危机——眼前这场危机就是叛军渡涪江，因为嘉庆一再重申：守住涪江是魁伦的\"生死关头\"。^91\n事实上，让它发生并不难。魁伦把近五千名士兵拨给德楞泰、一千名拨给阿迪斯（魁伦责令阿迪斯对付川东北的全部叛军），又留下数千人守卫涪江中游河谷附近的重镇——蓬溪、射洪、盐亭、三台、梓潼——之后，兵力已所剩无几。到最后，涪江下游河谷——从绵州金山驿（绵州州城）到射洪太和镇一段——他只有乡勇可用。魁伦与其最后一千余名士兵驻金山驿，让刘清主持下游各段防务。三月十五日，三千名贵州兵到达金山驿，德楞泰立即派他们去守卫潼川城。魁伦担心涪江下游河谷，却以\"叛军还远\"的想法自我安慰。^92\n趁德楞泰停顿之机，幸存的叛军迅速重组。蓝号拥立冉天元的堂弟冉天泗为新首领，损失惨重的线号并入其中。白号首领张子聪成为联军新统帅。仍试图前往甘肃，他们尝试渡过涪江。^93 一次尝试失败后——水很深，对岸乡勇又向他们开火——他们迅速移向射洪。三月十八日夜，他们到达太和镇。张子聪挑选了约一千名精壮，于黎明前在太和镇以北数里的王家嘴涉水渡江——那里因久旱水浅。随后他们击溃了太和镇的一百五十名乡勇，夺取了船只。德楞泰的斥候三月十九日晚些时候赶到时，只截杀了最后一批在岸边等船的一百多人。不久，刘清急忙赶来，德楞泰却直到次日傍晚才到。为撇清责任、把罪责推给魁伦，德楞泰奏报说有些船只留在了东岸。^94 刘清关于渡江的奏报三月十九日刚到金山驿魁伦手中，勒保就到了——他或许盘算好了行程，以免被追究渡江之责。在一道简短的奏折里
