，汉威克就位于西撒克逊王室中心温彻斯特（其本身即一座古罗马城市）以南不远处；又如在弗里西亚，多雷斯塔德位于罗马堡垒乌得勒支内的晚期墨洛温教会中心附近。\n而且，随着自670年代起某些北海商站开始铸造小型银币，诸王也产生了兴趣，设法通过对其交易征税来分享其财富，并利用为自己获取声望物品以及出售自家庄园剩余产品以增加收入的可能性。王室的关注与鼓励，伴随着教会对财富和奢华的追求；各地大教堂和修道院兴起为财富中心兼政治影响中心，正是七八世纪的典型特征。例如，八世纪晚期，地处内陆的盎格鲁-撒克逊王国麦西亚的统治者们对在伦登威克（Lundenwic）交易的船只征收通行税；伦登威克是“万国商站，各族人等由陆路和海路而来”，位于伦敦古罗马城以西的开阔河滩上。）4 （伦敦的“威克”很可能留存于街名“阿尔德威奇”之中。）特定获免税的是属于肯特若干教会以及伦敦主教和伍斯特主教的船只。尽管这些教会的贸易活动细节无从得知，但这些教会——正如授予其免税特许文书的诸王一样——发现商站对于自身财富与权力的发展至关重要。如此，几个不同群体的利益便交织重叠在一起。\n不列颠东海岸各地点远距离交换的强化，恰与其西海岸一带的衰落同时发生。在古代晚期，贸易经由高卢的大西洋海岸把地中海与布列塔尼、进而与不列颠西南部以及整个爱尔兰海区域连接起来。谷物、葡萄酒和橄榄油由此输出，船只则运回不列颠的锡、银、铅，以及来自爱尔兰的奴隶和猎犬。与地中海的联系延续至六世纪中叶；此后直到约700年，这条路线只有北段仍在使用，从高卢西南部的波尔多和南特向爱尔兰海区域运送数量可观的食盐、葡萄酒、香料和染料。\n商人是否曾经完成从地中海直航爱尔兰乃至苏格兰西南部的全程，抑或货物经由数道中间人之手转运，至今仍有争议。尽管以地中海的标准衡量，这项贸易规模极为有限，但对在爱尔兰海周边竞逐影响力和领土的诸王而言却意义重大。这些统治者以铁器时代建于制高山顶的要塞为基地，这类地点的人口想必以数十计，至多数以百计，其有限的经济作用远远不及它们在政治与象征上的重要性。这些高位阶地点包括不列颠的卡德伯里、迪纳斯波伊斯、邓阿德等中心，以及爱尔兰的纳万堡与阿尔马双重复合体。\n从这些地点进行统治的人们——如滕比的布莱杜德——向臣民征发劳役和兵役义务。他们还豢养金匠、珠宝匠和珐琅匠等专业工匠，这些工匠在山顶要塞居所的安全环境中制作奢侈品，供其炫耀精英身份。此外，通过对来自地中海和高卢西南部货物的获取途径加以调控，他们进一步提升了自己的地位。\n到八世纪初，这些设防山顶居址大多已被废弃。在爱尔兰，手工业生产转移至修道院地点，但其分配（如果确有分配的话）很可能仍处于王室控制之下。假以时日，爱尔兰海区域的经济与政治联系逐渐从高卢和比斯开湾转向，经由北方群岛转向斯堪的纳维亚和波罗的海。尽管原因仍不确定、年代学也只属近似，但在某种程度上，它们与影响整个八世纪欧洲的一场规模大得多的转变相关联：西地中海周围经济活动的暂时衰退与北方水域经济活动的强化。\n获取北海、以及北海之外的波罗的海的财富，只是法兰克人八世纪持续不懈向北扩张的原因之一。在加洛林王朝的领导下，法兰克人到800年成功地建立了一个控制着领土面积的政体，其规模在十六世纪之前无任何后罗马政体可与之相比。其政治核心位于塞纳河与中莱茵河之间的地区，帝国的疆域从埃布罗河延伸到多瑙河，从台伯河延伸到易北河（图8.3）。它囊括了几十个经济上各不相同的区域，从相对城市化的波河流域到人烟稀少的德意志北部森林；它所控制的物质资源无疑远超任何其他中世纪早期政体，尽管远不及罗马国家之水平。事实上，比较也就到此为止，因为加洛林诸王完全缺乏国营指令性经济的机制。精心经营自家庞大庄园的农业剩余；灵巧地对帝国境内各地以及纵横交错、跨越疆界的区域间商路上不断增长的贸易征税；再加上对邻人的掠夺性劫掠，这些都促成了高水平财富积累。持续争取地方贵族与教会效忠的努力，需要将这笔财富的一部分再分配出去，但为国王间接地接触世俗与教会的土地财富，例如在根特就是如此。\n加洛林王朝的国王与皇帝回避其罗马前辈所刻意营造的城市式权力展示。加洛林诸王在亲信贵族扈从的陪伴下于阿登森林中狩猎，而罗马皇帝则是在大都市的圆形竞技场中享受狩猎表演，由数以千计的观众围观。他们宁愿资助大型的乡村修道院——这些修道院充当着额外的权力中心与财宝积聚之所——而不愿在人口稠密的城市中慷慨赞助市民纪念建筑。即便他们的宫殿如亚琛、奈梅亨、法兰克福和雷根斯堡那样坐落在罗马时代的地基上，这些也只是罗马帝国北部边缘的小型半乡村居所或旧军营，而非其腹地的城市。\n加洛林帝国还是多中心的。尽管查理曼在其统治后半期围绕亚琛的温泉发展出一座示范性宫殿，但除了晚年之外，这里从来不是他唯一的居所。它也从来不是唯一的行政中心，因为他及其后继者通常让诸子作为次王或副王统治一个或多个行省，并为每人配备自己的扈从与统治中心。九世纪下半叶，家族内部的争斗将这些临时的行政安排固化为更持久的王国，这些王国的统治者只得为自己另建新宫，或者将自己的扈从强加于修道院的款待之上。尽管亚琛仍是最具威望、最令人艳羡的统治之地，但统治者的众多意味着权力地理中节点的众多。加洛林时代与整个中世纪早期一样，权威始终是个人性的而非制度性的，因此国王身在何处，何处便是政治活动的中枢。\n加洛林王朝成功地将诸多不同的地方政治影响网络与经济资源熔合在一起，而每一张网络都有自己的区域枢纽。如前所述，根特便是其中之一，现在让我们探访一个相当不同的枢纽：美因茨。作为一座古老的罗马边城，它位于莱茵河中游——这条大动脉水道由北海通往阿尔卑斯山口，进而抵达意大利与地中海。此地的主导力量并非王室，因为这里没有宫殿；而是教会势力，因为美因茨大主教区的起源可追溯至罗马时代晚期。统治者、权贵与教会或亲自出面，或更常见地通过其代理人，从这个城市所经手的利润丰厚的贸易中分一杯羹。城市景观是碎片化的：在罗马城墙之内，教会与世俗的居住建筑群各自在农业或葡萄种植区之间形成自己的院落。地方权贵以及各大乡村修道院的院长们都在此建有宅邸，以便他们或他们的庄头进城办理事务或将农产品送往市场时使用。城中有王室铸币厂，既刺激贸易又便于征税，城市因而也成为重要的生产与交换中心。在河岸边，“弗里西亚区”聚集着一个规模可观的弗里西亚商人殖民地的仓库与作坊，他们的船只往来于莱茵河上，输出内陆腹地的葡萄酒和谷物，以及这座城市本身出产的精美金属制品。到十世纪初，美因茨还是翻越阿尔卑斯山运来的货物——包括来自东方的香料——的转运点，并有穆斯林与犹太商人造访。但到那时，加洛林的政治实验已在区域分化和地方利益的礁石上搁浅。由于缺乏快速的通讯手段和可靠的强制方法，即便在地方农业产量上升、区域间贸易日趋 intensifies 之际，有效的政治体通常仍保持较小的规模。在加洛林晚期及之后的欧洲地方，经济活力并未受到政治分裂的影响。\n法兰克沿海商站、乡村修道院、河港与地方市场的财富和不断增长的人口，是吸引维京人注意的众多目标中有据可查最充分者。他们的高度机动部队自八世纪晚期起对加洛林核心地区和不列颠群岛发动进攻，这些袭击的记载尤为详尽。整个九世纪，他们的劫掠愈发频繁且破坏力愈强：他们洗劫教会宝库、袭击市场、向统治者勒索贡金，攫取大量钱币与财宝，有时还有牲畜和人口。随着武装团伙的壮大，维京人也开始寻求可定居的土地，或通过彻底征服，或通过从地方统治者处强取的让步。\n维京人自信善航海、精于贸易、狡黠而富于劫掠，从八世纪晚期直到十一世纪早期，足迹遍布四方。九、十世纪间，斯堪的纳维亚的船只称霸不列颠群岛与北方诸岛的海岸，沿欧洲西部沿海游弋，偶尔还穿越直布罗陀海峡进入地中海。他们横渡大西洋定居冰岛，有时甚至继续航行至格陵兰和纽芬兰。他们纵横波罗的海，沿东欧的河流水道抵达黑海。在那里，维京人接入了穆斯林世界的巨额财富，从而将大量伊斯兰银币吸引西流。受这种贸易的刺激，基辅（第聂伯河畔）等强大的贸易中心于860年代兴起。\n瑞典赫尔戈居址的出土物显示了维京人直接或间接交往的广度：其中包括来自莱茵兰的玻璃器皿、工艺繁复的爱尔兰牧杖头、来自拜占庭的银盘和一批金币、一件产自科普特埃及的长柄勺，以及一尊佛陀青铜小像。关于北方航海活动这一戏剧性（有时被过分渲染）阶段的解释仍存争议。斯堪的纳维亚南部社会在六至八世纪经历了深刻变革，发展为一个等级秩序更加分明的社会，资源逐渐积聚于地方首领控制的中心，例如我们在西福尔的博勒已经遇到过的那种中心。这些强大酋邦的兴起，似乎与其开发并再分配来自贸易以及本地农业和手工业生产之资源的能力密切相关。波罗的海商站——如比尔卡，那里有“许多富商以及大量货物与钱财”5——的财富无疑助长了这些酋邦的成长，正如北海商站滋养了七、八世纪盎格鲁-撒克逊和法兰克诸王一样。在这些酋邦中，丹麦的酋邦最早发展为王朝王国，并确立了延伸至日德兰半岛之外的海上霸权，将南斯堪的纳维亚诸酋邦和波罗的海沿岸的斯拉夫人社区纳入其中。\n丹麦诸王手中权力与资源的日益集中，在其王国内部及周边都受到挑战：政治竞争催生了富有攻击性的武士集团和贵族精英。查理曼向北萨克森的扩张不仅摧毁了丹麦人与易北河以东斯拉夫邻居之间的传统联盟，帝国扶植附庸国王的政策还催生了新近获得地位与影响的强势地方王朝。大范围内的贸易往来、航海旅行的传统，加上政治动荡以及供养武士集团所需资源之无休止的积累压力：这些前提条件足以引发维京人对西欧积聚财宝的劫掠。\n从北方的视角看，“维京时代”既是对西欧和穆斯林土地物质资源的榨取，也是斯堪的纳维亚权力结构的转型。从不列颠和大陆的视角看，它还是既有政治格局的动荡与重塑。这不仅仅是维京劫掠者索要贡物或构成军事挑战的问题。就此而言，评估其影响还相对简单，因为他们的劫掠恰恰证明了加洛林和盎格鲁-撒克逊的农业与手工业经济能够年复一年地持续产出资源。这些劫掠还促进了法兰克和英格兰铸币制度的发展——在严格控制下为王室利益而运营。在这方面，尽管局部破坏往往严重且总是令人创痛，维京劫掠的总体效果是转型性的而非毁灭性的。同样值得注意的是，法兰克人、布列塔尼人、盎格鲁-撒克逊人、威尔士人和盖尔人只要符合自身政治目的，便会毫不犹豫地与维京人联手。游动的维京武装团伙是加洛林家族内斗以及不列颠群岛内部诸王国争斗中颇受欢迎的参与者，其程度之深，令当时的编年史家极力遮掩。维京人的存在使地方政治惯例变得复杂甚至遭到破坏，此外还扰乱了农业生产的常规节奏、侵夺税收，并将教会宝库的财富释放到流通之中。\n维京人的冲击在不列颠群岛尤为深远，那里众多相互竞争的国王随时乐意借助外力来压倒近邻对手。例如，九世纪中叶，昔日强大的皮克特王国被并入盖尔人的达尔里亚达王国，很可能正是盖尔人与维京人战术联盟的成果。或许，维京人在无意间促成了阿尔巴王国从盖尔人对皮克特人的支配中脱胎而出。可以肯定的是，到九世纪晚期，苏格兰东北部和奥克尼群岛兴起了一个 aggressive 而强大的诺斯人统治领地，其权力中心是位于比尔赛的前皮克特人聚落。在爱尔兰，诺斯劫掠者以迅速融入爱尔兰社会而著称。作为爱尔兰诸王之间暴力争斗的积极参与者、若干沿海贸易殖民地的建立者以及这些港口腹地的定居者，他们迅速通婚，在语言、聚落和政治上留下了印记。\n对爱尔兰-诺斯人而言，一如对其他斯堪的纳维亚群体，劫掠与征服只是一系列活动谱系的一部分，这一谱系还包括殖民与贸易。九、十世纪赫布里底群岛密集的爱尔兰-诺斯人定居，几乎抹去了先前文化群体的所有痕迹，并留下了至今犹存于这些岛屿地名中的遗产。在冰岛，爱尔兰-诺斯定居者与来自挪威西部和北部的移民会合，后者发现了一片几乎无人居住的土地，约于870年至930年间在此大量定居。他们在那里复制了其斯堪的纳维亚北部故乡的政治组织——一个由小酋邦拼合而成的格局，各酋邦头人统治着大体自我调节的农耕社区——并因其始终没有王权而独具特色，直到1262年冰岛归于挪威王室控制。\n从十世纪初到十一世纪初，都柏林——爱尔兰最富有、最具影响力的诺斯人殖民地——实际上已是另一个小王国，其政治意义因巨额商业财富的积累而增强。其统治者将劫掠、奴隶贩卖与军事征伐扩展到英格兰北部和苏格兰西南部，以此壮大自身。其居民无疑靠区域内产出的农业剩余维持生计，但跨越爱尔兰海及更远地区的贸易——尤其是奴隶贸易——将这个繁荣的港口纳入横跨北海和波罗的海、并最终与高加索和河中地区的穆斯林商人相连接的斯堪的纳维亚贸易网络。沿这些路线流动的贸易与贡物，多以碎银（被切割成大致均一重量的银项圈、银臂环等）或银币的形式进行；但为了便利其贸易事业，诺斯人先将外国钱币输入爱尔兰，随后开始在都柏林铸造自己的货币。地中海与近东自公元前七世纪以来便已熟悉以金属货币作为交换媒介以及统治者威望与权力的象征：而爱尔兰迟至997年才开始铸币，这正衡量出地中海与非罗马化的欧洲地区之间的文化差异。\n早在那一日期之前，西撒克逊诸王已将维京军阀逐出英格兰，并将深受斯堪的纳维亚影响的东部低地纳入一个重塑后的君主政体，该政体强行宣称对英格兰西部和北部的威尔士人、不列颠人、盖尔人和诺斯人的宗主权。在南部，即其西撒克逊核心地带内外，他们建立起被称为 burhs 的大型防御中心，这些中心不仅在对抗维京人的斗争中服务于战略军事目的，还迅速成为新型城市发展的焦点。尽管与农业腹地保持紧密联系，这些晚期盎格鲁-撒克逊城镇既是复杂而人口稠密的贸易社区，也是王室和教会权力的中心。它们为本地出产的农业剩余和手工制品提供区域市场，并输入日益增多的丝绸和葡萄酒等声望商品，以满足讲究时尚的精英阶层。最重要的是，城镇中设有王室铸币厂和税收官，晚期盎格鲁-撒克逊诸王借此以银便士的形式从繁荣的英格兰经济中汲取巨额税金。\n到1000年，盎格鲁-撒克逊的英格兰是否已成为欧洲最富有的王国？这一观点是有据可辩的。诚然，到十世纪晚期，当伊斯兰白银流入斯堪的纳维亚的供应逐渐枯竭，而复兴的丹麦王权的波罗的海扩张又被奥托帝国所阻时，英格兰成了最诱人的财富来源：大量银币在流通，地方性和区域性的城市市场欣欣向荣。由丹麦国王组织的新一轮对英格兰的进攻，最终于1016年导致西撒克逊统治王朝的覆灭以及克努特的即位，后者不久又兼任了丹麦王位。在此基础上，他建立起一个北海帝国，从都柏林出发，经苏格兰和斯堪的纳维亚，一直延伸到波罗的海；但这种个人霸权并未延续到其1035年去世之后(图8.4)。\n克努特的北海帝国依赖的是此前两百年间丹麦人和挪威人所建立的海上联系与贸易财富。到十一世纪初，这种疆域辽阔的霸权是北欧的特征，而非卢瓦尔河和阿尔卑斯山以南地区的特征——后者正在形成的是区域密集型而非帝国扩张型的政治体。法国分裂为区域性的或地方性的领主领地，正是这一趋势的体现。然而，传统政治版图与新兴物质财富积累之间的脱节，在北意大利表现得最为尖锐。\n到新千年之初，意大利城市正处于迅速扩张的城市经济与商业经济的枢纽，并开始主张自身的自治权。虽然意大利的城市生活从未像阿尔卑斯山以北那样几近消亡，但在约600年至约800年期间，意大利城市作为生产、交换和消费中心的作用却难以评估，尽管生产与交换的加速显然比北海地区要晚得多才出现。随着证据日渐丰富，我们可以 traced 出与罗马晚期及后罗马时代地中海不同的模式，尽管证据性质的改变(无论文献还是考古)可能夸大了经济变革的印象，这一点仍然成立。\n北意大利于774年被并入法兰克王国。加洛林王朝的控制在888年之后瓦解，但到十世纪中叶，加洛林王朝的德意志继承者奥托王朝，从其遥远且经济落后的萨克森的主要权力中心，重新确立了跨阿尔卑斯山的统治权。在莱茵河东北，由于缺乏历史悠久的城镇或市场，也缺乏发达的货币使用经济，统治者不得不依赖其他方式来支撑其统治：巡行王权、庞大的地产、依附民族的贡赋，以及看似无穷无尽的边疆战争掠夺。难怪北意大利会吸引他们，因为这里的城市财富正在迅速发展。\n尤其值得注意的是，九世纪期间，一些意大利沿海新兴城镇的成长，它们地理位置优越，便于发展远程贸易联系，却不利于农业。位于亚得里亚海顶端的威尼斯，利用其处于加洛林帝国与拜占庭帝国边境的位置，至少从840年起便实际独立，只需专注于自身利益。威尼斯人将精力投入贸易经济，使其在西欧、拜占庭与伊斯兰东方之间的商品运输中占据了关键地位，以至于到十世纪晚期，在穆斯林看来，亚得里亚海干脆就是“威尼斯湾”。6 这一认知十分重要，因为威尼斯的显赫地位很可能大部分源于其作为奴隶贸易转口港的角色。在欧欧洲东部边缘俘获的奴隶在此装船运往埃及，再转运至主要的伊斯兰城市——在那里，与基督教世界不同，奴隶制是基本的社会与军事资源。作为回报，威尼斯商人进口“海外东方的全部财富”，并将这些奢侈品沿波河河谷向上贩运。7\n在第勒尼安海多岩石的南意海岸，阿马尔菲同样起源于六世纪晚期抵御陆路入侵者的要塞。九、十世纪时，阿马尔菲人以其舰队支持基督教邻邦对抗撒拉森海盗，或在最符合自身野心时帮助阿拉伯人对抗基督徒，在此过程中与伊斯兰地中海的各港口建立了利润丰厚的贸易联系。通过这些政治手段，精明的商人培育出一个新的、城市化的商业社会，其“富庶与奢华”引人注目。8\n那么，十世纪末那些较为古老的意大利城市状况如何？罗马城市帕维亚自六世纪晚期以来一直是伦巴德王国的首都，其王宫在加洛林王朝继而在奥托王朝统治下仍是意大利的王室政府所在地。出自王室金库的详细条例，记录了十世纪末这座城市——皇帝及其随从经常造访之时——的经济生活。皇帝通过其司库对经过帕维亚的贸易征收通行税，并管理其铸币和市场活动，既为自己牟取财政利益，也维持法律与秩序。该条例还告诉我们城中城市共同体及其工匠的情况——驾着小船的渔民、制革匠、船主、大船的水手、淘金者和制皂者——以及途经此城的商贩。其中有来自阿尔卑斯山以外的盎格鲁-撒克逊人和其他人——可能是法兰西人和德意志人——他们买卖马匹、奴隶、羊毛、亚麻布和帆布、锡和剑。意大利人也会前来：来自卡拉布里亚海岸的阿马尔菲、萨莱诺和加埃塔的商人，尤其是富有的威尼斯人，他们沿波河河谷向上贩运，购买葡萄酒和谷物，同时带来拜占庭和穆斯林世界的货物——香料、象牙梳、银镜之类。因此，帕维亚既是当地农产品的出口地，也是手工业品的生产地、进口奢侈品的集市，还是行政中心和帝国权力的展示场。奥托王朝的君主同一切统治者一样，发现贸易通行税是有利可图的收入来源，他们在帕维亚的金库也不例外。\n但这一切未能持久。从十世纪晚期起，帕维亚市民开始反抗帝国控制，并多次发动叛乱。1024年，当他们听到皇帝亨利二世死讯时，他们将王宫彻底摧毁，以至于其位置如今已无从知晓。他们的起义标志着一个时代的终结。帝国在意大利的中央集权行政实际上已告终结，整个意大利争取城市自治的步伐在十一世纪中不断加快。罗马帝国瓦解后形成的政治格局，已再难以容纳意大利城市财富的新现实。\n宝藏、馈赠与庇护\n帕维亚通行税条例的作者还记录了一系列习惯性支付，它们并不属于十世纪末意大利蓬勃发展的商业经济。国王司库的妻子可以指望来自意大利其他城市的商人向她馈赠东方制成品和精美花纹丝绸。司库本人则须定期向帕维亚的主教座堂捐赠灯油，并向其看守人捐赠衣物。我们在此遇到的是其他形式的交换，女性往往是其中行家，但其目的并非商业利润。向宗教机构馈赠 prestige 礼物或慈善捐赠，代表的是截然不同的交易形式，其社会、政治或宗教维度居于首位。将焦点转向以庇护、馈赠或强制剥夺为特征的社会互动，我们便能更好地理解物质资源如何被转化为象征资本——即转化为荣誉、威望和政治影响。\n这一场景不在罗马，而在帝国的拉文纳。六世纪圣维塔莱教堂中一块华丽的镶嵌画描绘了查士丁尼(527–565年在位)——最后一位在君士坦丁堡统治的操拉丁语的皇帝，他几乎实现了一个梦想：驱逐意大利、西班牙和北非的武士国王，将这些行省收归帝国直接控制。他身着紫金服饰，头戴嵌满宝石的巨大王冠，肩佩相配的胸针，两侧是衣着由奢华到朴素各依其等级的廷臣。他的皇后狄奥多拉在教堂另一侧与他相向而立，装束同样华贵，其随从的衣着也精心强调明确的等级。二人手捧同样华美的礼物：他托着一只巨大的金盘，她捧着一只镶满宝石的金杯。这对帝室伉俪的形象揭示出，在罗马晚期世界，炫耀性的展示与馈赠是权力的外在装饰。通过服饰、贵重物品、艺术与建筑来表达，古代晚期的权力与威望修辞中包含着一种有形财富的语言，男女两性以互补的方式娴熟地运用它。\n那些装饰奢华的教堂——献给基督教上帝的礼物——至今仍矗立着，提醒我们罗马晚期皇帝与贵族所拥有的巨额可支配财富。它们也表明捐赠者的期望：慷慨或许能换来圣徒更多的庇护与保护，因为建造和捐赠教堂，是将支配人际关系的习俗与期望投射到超自然领域。在罗马人中，馈赠巩固个人间的友谊，并为政治恩惠的交换提供便利。在一个获取庇护是政治与社会晋升之关键的文化中，礼物可以巩固庇护人与被庇护人之间的支持流动。礼物之所以居于核心地位，反映了一个基本事实：在罗马晚期世界，真正的权力与影响的润滑剂是个人恩惠和直接接触，而非其笨重的官僚程序。\n古代晚期的皇帝在即位时会向人群抛撒钱币，并向受宠的支持者分发精美的银盘和餐具作为赏赐。他们也常常向邻近的国王和军阀支付巨额款项，以换取和平或使其服从其他政治目标。就这样，罗马的威望物品——金币与金质奖章、奢华的银餐具、标志高级身份的嵌宝胸针——涌过帝国边境。考古学家从斯堪的纳维亚和波罗的海东部到黑海，到处都发现了它们的残余：四、五世纪罗马财富涌入北欧武士首领与多瑙河流域的宝库，提升了这些领袖相对于自身追随者的威望与权力。当这些威望物品流经古代晚期帝国的政治、社会和宗教血脉时，它们将官僚体制包装成直接的个人关系的外表，帮助赢得天上圣徒的支持，赋予合法性，并构建了帝国与其敌人和邻邦的关系。\n中世纪早期西方的后帝国诸王国仍然牢牢处于这一政治秩序之中。国王们从帝国那里获得启示——以及大量宝藏。两个六世纪的事件揭示了其中所涉及的物质丰富性与政治象征意义。第一件关乎克洛维于507年对高卢西南部和西班牙的哥特人及其国王阿拉里克二世的胜利，后者被他所杀。此役使他得以将高卢西南部夺取为法兰克人的领地，从而将哥特人限制在伊比利亚半岛，这令阿拉里克的岳父、意大利国王狄奥多里克大帝(493–526年在位)极为恼怒。克洛维的军队尽可能夺取了阿拉里克的宝藏，但关键在于，未能夺走对其王朝认同至关重要的传家宝。其中包括古老的政治珍宝，是阿拉里克一世率哥特人于410年洗劫罗马时所夺：“其中有大卫和所罗门——希伯来人君王——的珍宝，蔚为奇观……它们大多饰以绿宝石，是古时候罗马人从耶路撒冷掠取的[即公元70年罗马洗劫耶路撒冷]。”9 这些先后属于犹太人、罗马人、继而哥特人的古老政治认同标志，向世人昭示阿拉里克一世的继承者是罗马帝国政治中的合法玩家。这些珍宝太珍贵了，绝不能落入法兰克人之手，于是狄奥多里克将其置于自己的保管之下，待他的外孙阿玛拉里克成年即位时归还于他。无论其作为黄金宝石的价值如何，这些传家宝象征着威望、合法性与王朝的延续。\n在胜利后不久，克洛维便获得了拜占庭皇帝阿纳斯塔修斯(491–518年在位)以传统帝国荣誉与庇护象征形式给予的回报，因为他的胜利也符合后者的政治策略。克洛维随即以一场戏剧性的王者慷慨之举，向其新臣民宣示了自己提升的地位：在一场仿罗马风格的胜利游行中，他将大量战利品赠予图尔的圣马丁教堂，并身着罗马服饰，“骑上马，亲自满怀最大的善意，将金银分发给庭院大门[圣马丁教堂]与城中大教堂之间道路两旁的人群”。10 通过立即重新分配战利品，克洛维确立了自己作为慷慨统治者的声望，与该地区最重要的圣徒之一结成同盟，并将其新臣民置于一种道德义务以支持和忠诚回报他的义务。在这次以及许多其他场合，克洛维都是礼物与财宝象征意义的高明操纵者：通过给予，他有所收获。\n我们的第二个插曲来自六世纪末，涉及克洛维的曾孙希尔佩贝特二世（575–596年在位）。584年，拜占庭皇帝莫里斯（582–602年在位）曾赠送他五万枚金币（索里达），以诱使他入侵意大利。半岛在仅仅一代人之前才被查士丁尼以巨大代价收复，随后又在568年遭到阿尔博因率领的伦巴德人入侵，后者在此后二十年间将其控制扩展到半岛整个北部。莫里斯的策略是由来已久的“花钱让一个武士国王攻打另一个”的伎俩；他希望法兰克人能将伦巴德人赶出意大利。\n外交赠礼要奏效，须以赠受双方都承认其中隐含的道德准则为前提，并且双方在以财宝换取和平的交换中享有对等的政治利益。但在这个特定场合，它失败了。当希尔佩贝特进军意大利时，伦巴德人以臣服避免冲突，并献上他们自己的礼物以劝他离去。莫里斯认为希尔佩贝特违背了这笔酬金的条款，要求归还；但这位法兰克国王对自己的权势如此自信，甚至不屑回复。在这场政治扑克游戏中，希尔佩贝特两度获胜。他在经济上两度获利，因为莫里斯的酬金约重227.5公斤黄金，而伦巴德人的“许多礼物”必然也相当可观。11 但他还在政治地位上两度提升：一次是拒绝了莫里斯礼物所暗含的服从帝国意志的从属关系，一次是接受了伦巴德人随礼物而来的臣服。由此他既增加了物质资本，也增加了象征资本。\n正如507年和584年的事件所示，支撑后帝国时代政治的财宝数额巨大。它们还表明，能否获得并掌控财宝，在竞争的国王、臣民和拜占庭皇帝眼中，与政治合法性密切相关。然而莫里斯的经历提醒我们，发放政治补贴是难以预料且充满困难的：它可能实现、也可能无法实现捐赠者的目标。\n作为达成政治目的的手段，赠礼不必达到整车黄金珠宝的规模：它甚至可以只需一片草地上采来的一束花，或一封用心写就的书信。为说明这一点，让我们在六世纪的高卢再多停留片刻。566年，一位意大利诗人来到西吉贝尔特（561–575年在位）、即希尔佩贝特二世之父的宫廷。维南提乌斯·福图纳图斯以极大的光彩开启了他的生涯：在西吉贝尔特与布伦希尔德成婚之际，他向国王献上了一首精心创作的婚颂。福图纳图斯迷人的拉丁诗歌通常被解读为后帝国时代高卢对古典文学文化持续推崇的标志。但这位意大利人不仅是一位出色的诗人，还相当圆滑机敏，以至于他最终吸引到的庇护为他带来了一顶主教冠。当我们注视他结交朋友、扩大影响时，也能窥见赠礼如何成为沟通个人之间关系的庇护体制的一部分。\n饮食是福图纳图斯时常挂在心上的主题。他靠着宴会的邀请和食物的馈赠兴旺——实际上也是生存。他的回赠则是诗歌与颂词：\n甘露、美酒、食物、衣裳、学识、良机：\n戈戈啊，你以慷慨的馈赠令我心满意足。12\n戈戈是西吉贝尔特宫廷中的资深官员，交游广泛、颇具影响，是这位意大利诗人有用的庇护人。借助这层关系，福图纳图斯得以享受“友谊的果实”。13 有一首诗写给孔达，此人出身寒微，却升至西吉贝尔特扈从中掌管财政与行政的关键人物，这首诗暗示了利益流动背后的政治现实。福图纳图斯评论说，西吉贝尔特已因孔达能干的效劳而赏赐他丰厚的礼物：“远比众人强大的国王恰如其分地给予了更好的酬报，你的情形正表明他更看重什么。”孔达自己的行为也以国王为楷模：“你以慷慨与仁慈向众人广施礼物，并以馈赠将人们凝聚在你身边。”14 国王的榜样是整个社会等级都应效法的，因为在各个层级，慷慨的赠予都会造就义务。像戈戈和孔达这样的权力经纪人若愿意，极有条件操纵王室恩赏的流动：福图纳图斯的颂词可谓瞄准精准。\n最终，福图纳图斯在两位特定的庇护人那里安顿下来。一位是境遇艰难的图尔主教Gregory（都尔的格里高利）。另一位是拉德贡德（卒于587年），她曾是克洛塔尔一世（511–561年在位）的王后，此时已在普瓦捷隐修。身为修女，她继续施展其宫廷技艺，并为了自己的目标，利用了华服与美食的传统女性联想。在图尔，维南提乌斯以特别的“谦卑仆人”身份向格里高利自荐。这位主教对这位写诗门生的支持，从鞋皮礼物直至地产田庄。作为回报，这位意大利人在重大政治危机的时刻运用其文学才华支持格里高利。在普瓦捷，拉德贡德和她的女修道院长艾格尼丝时常从自己的餐桌上给福图纳图斯送去食物——一壶牛奶、深色的李子、精致的点心。无论出自富有的王后、领主之妻，还是献身于修道院清贫的女子之手，食物都是一种滋养的不止是人的肠胃的礼物。福图纳图斯以同样朴素的信物回报——几束紫罗兰、一只手工编织的盛甜栗的篮子——并充分运用其修辞技巧，促成拉德贡德在互相仇杀的国王之间缔造和平以及收集天上不朽者地上圣髑的计划。在精巧的诗歌意象背后，福图纳图斯和格里高利、拉德贡德一样深谙宫廷赠礼游戏的不成文规则。三人都十分清楚，礼物、义务、酬报与影响是密不可分的，因为他们深谙如何将物质资源转化为社会权力、政治影响与圣徒的庇佑。600年前后不久，福图纳图斯如愿以偿——在普瓦捷当上了主教。\n运用财富巩固政治友谊，或维持并更新既有的忠诚、依附与效劳的纽带，并非晚期罗马世界及其直接继承者所独有。事实上，五、六世纪的统治者之所以能如此迅速地将再分配与互惠的政治为己所用，原因之一就是类似的习俗本来就是那些在五世纪改变了罗马西部政治版图的武士集团文化的固有组成部分。莱茵河—多瑙河边境以北以及不列颠诸岛非罗马地区的酋邦组织，无疑远比帝国官僚制国家——连同其众多专业分工和庞大军事机器——简单。这些政体的国王缺乏行政的或强制的统治手段，所能依靠的几乎只有个人影响与义务的纽带。\n他们用物质财富锻造这些纽带。这种纽带最著名的表达见于《贝奥武甫》，但在许多其他语言的早期中世纪史诗中都有密切的平行文本。史诗中贤明的军事领袖或国王对追随者慷慨大方，以丰厚的礼物酬报战场上的英勇，并由此投资于对未来效劳与支持的期待。一位能干的战争领袖会吸引雄心勃勃的年轻武士加入其扈从，在自己的厅堂中款待他们、设宴飨之、为之配备武器：在权力竞争中，互相争雄的领主用财宝、珍贵的武器和自己的声誉来扩充军队、争夺胜利。《贝奥武甫》中，赫尔福德纳之子赫罗斯加就是这样一位统治者：\n后来赫罗斯加赢得了战场上的荣耀，\n对疆场的掌控；于是朋友和族人\n欣然服从他，他的队伍不断壮大，\n成为一支庞大的军旅。15\n来自耶阿特人国土的王族武士贝奥武甫，便是投效赫罗斯加麾下者之一，他的功绩构成了对武术成功、财宝、酬报、荣誉与统治这一社会准则的长篇注解。当贝奥武甫诛杀了袭击鹿厅的怪物归来时，这位丹麦国王宣告：\n你将不缺任何\n我所能赐予的世间财物：\n较低微的功绩也曾获得酬赏，\n我们曾从宝藏中礼遇过不及你英勇的人，\n在战争中远弱于你者。但你已用自己的双手\n确保了不朽的荣誉，\n让你的名字永世长存。\n于是厅堂已为宴席布置停当——“金线绣成的\n挂毯|在墙上熠熠生辉”——赫罗斯加前来入席：\n没有一个民族聚集过更盛大的扈从，\n围绕他们的赐环者举止更为得体。\n以勇武著称的人们来到长凳旁，\n在宴饮中欢欣；他们畅饮\n一杯杯蜜酒，殷勤地舒展身心。\n……\n随后，作为胜利的象征，赫尔福德纳之子\n授予贝奥武甫一面金饰的军旗，\n一面绣纹的战旗，还有胸甲和头盔；\n众人对那柄在英雄面前\n捧持的奇剑赞叹不已。贝奥武甫在厅中\n与众人共饮。他没有理由\n在武士面前为如此精美的礼物感到羞愧！16\n赫罗斯加随后又加上八匹佩有黄金宝石辔头的战马，使礼物更为丰厚；而通过赠礼，二人的声望都得到提升：\n于是这位荣耀的王储、宝藏的守护者，\n以战马和铠甲酬报了这些功绩；\n如此慷慨大方，任何正直的人\n都无从加以贬损。17\n赫罗斯加和贝奥武甫都避免了那种在荣誉与酬报文化中令人畏惧的暗流——耻辱：贝奥武甫通过战斗赢得了财富与声誉，而赫罗斯加则展现了王者的慷慨。当英雄回到耶阿特人那里，珍贵武器的流通仍在继续，因为他随即把它们赠给亲族海格拉克国王，以此彰显自己慷慨的精神。贝奥武甫已证明自己有资格继承王位。\n《贝奥武甫》是一部伟大的文学史诗，其主人公是传说人物。但其社会风气仍是早期中世纪尚武文化中围绕赠礼的仪式与价值观的真实写照——这一点得到来自欧洲各地的广泛史料的有力印证。这些史料以朴实无华的叙述记载劫掠远征，以生动的描述记载宴席及其他礼仪场合交换的礼物，为史诗的价值观提供了历史的具体性。战争、劫掠与宴饮都与其他交换形式并存：它们是领主或王庭据点上农业、手工业或商业财富集中形态的军事与政治补充。\n在《贝奥武甫》篇章中如此显赫的珍宝，并不仅限于精工锻造的武器和镶宝的护身铠甲。它们还包括金制的杯盏与餐具、臂环与颈环。这些个人饰品由女子佩戴和馈赠，与男子无异，因为在塑造所有早期中世纪社会的夺取、再分配与互惠这一环环相扣的传统中，妇女扮演着不可或缺的角色。她们也是赠礼者，运用自己掌控的一切资源，为其选定的政治与宗教目的施行庇护，正如我们所见的狄奥多拉和拉德贡德那样。维护宫廷礼物与款待中的等级与社会位次之精妙，这一任务也常常落在她们肩上。一份九世纪关于查理曼王室家务复杂组织的指南对此有明确说明：“宫廷的妥善管理，尤其是王室尊严，以及每年赠予官员们的礼物（惟马匹的食水除外），主要归于王后，并在其之下归于宫伯。”18 在监督礼物拣选的过程中，王后维护着宫廷仪式赖以运行的荣誉经济。\n女性不仅是慷慨的施与者，也可能成为其对象。赫罗斯加曾将女儿弗雷亚瓦鲁许配给丹麦人的仇敌英格尔德，希望借此终结一切宿怨与致命的战争，凭借这位女子。19\n尽管《贝奥武甫》的作者怀疑联姻和亲的成效，此类做法在早期中世纪的文献史料中却屡见记载。一个早期事例即可说明：作为对507年克洛维击败伊比利亚哥特人的反制，东哥特的狄奥多里克大帝将侄女阿玛尔贝尔加嫁给法兰克人的仇敌、图林根人的赫尔米纳弗里德。狄奥多里克以交换“王室品位所要求的礼物”缔结这门婚事，并向赫尔米纳弗里德宣告：“愿神的眷顾伴随你的婚姻，既然友谊已将我们联结，愿亲族之爱也将我们的后代维系在一起。”20 赫罗斯加定会认得这份情意——但他也会承认，联姻的结果和赠礼一样难以预料。\n来自全欧各地的考古材料证实了早期中世纪金匠与铸剑师的技艺与工艺水平。它也向我们归还了那些界定财富、权力与威望的珍宝中的一小部分。但其中蕴含着一种反讽，因为考古学家发掘出的黄金珠宝大多是被人有意埋藏的，尤其是在欧洲较偏北的地区。撇开众多主人在动荡时期为日后取回而埋藏的窖藏不谈，有意的埋藏可能标记着具有仪式或宗教意义的地点与行为。埋藏的社会功能之一，是提供一种入藏的景观——供有幸观看的群体目睹。另一重功能则在于此后珍宝隐而不见、无形地在场的这一认知。这正是五世纪日德兰和瑞典南部将战利品沉入沼泽献祭的背景，它们间接地反映了交战酋邦纪念战胜敌人的方式。在丹麦菲英岛上一个五至六世纪的政治、宗教权力与贸易中心古姆（意为“诸神之家”）出土的众多黄金窖藏，也具有宇宙论意涵。在这里我们遭遇到财富与超自然之间一系列非罗马、非基督教的关联，由于缺乏揭示其宇宙观的文字证据，其完整的宗教或意识形态意涵已无法完全复原。这些窖藏虽然缄默，却耐人寻味。\n同样出于有意为之的，还有随葬品——无论日常用品还是珍贵之物——的丧葬埋藏。考古学家已在英格兰和地中海以外的欧洲大陆发现（并仍在发现）约400年至700年间成千上万座有随葬品的土葬墓，另有少量出自地中海地区。这类墓葬从极为简朴直至极其豪华不等。以英格兰东南部普里特尔维尔的东撒克逊人墓地为例，那里已发现约20座六至七世纪的墓葬。有些墓中完全没有随葬品；另一些不过一把刀、一枚胸针或一两件陶器。其中一座墓葬包含一座非同寻常的墓室，其发现于2004年2月公布。一位武士于七世纪上半叶被安葬在这一大型墓室中，随葬有他的剑和盾，木构棺室。他下葬时身穿金线织物，系着一条配有巨大金带扣的腰带，脚穿金扣鞋，胸前放着两枚小型金箔十字架。他的墓室中陈设了种类繁多的器物，暗示着远方的联系：一件拜占庭水壶和一把有铭文的银匙；一只大型科普特碗；两枚来自墨洛温高卢的金币；来自爱尔兰或英格兰北部的悬吊碗；以及两对肯特玻璃罐。墓中还有种种器物，显示出一位喜欢以奢华方式款待扈从的统治者的气派：一把可能来自意大利的罗马式折叠座椅；一个高高的火把架（或许也是王旗架）；装饰过的饮酒角杯；配有镀金配件的木酒杯；一把里拉琴；棋子和骰子；此外还有悬吊的釜、木桶和一只匣子。\n如同盎格鲁-撒克逊英格兰所知的少数几座随葬丰厚、可能属于王族的墓葬一样，普里特尔维尔的这座王侯之墓无疑兼具宗教与社会两重背景。一方面，它暗示了基督教传播过程中常见的复杂性与矛盾性。20 另一方面，它呈现出一场体面的葬礼：有“司仪”操办其盛况，在世的亲族争夺遗产，旁观者则为场面所震撼。正如前文所见，随着罗马统治的崩溃与新王国的发展，丧葬仪式往往成为炫耀社会地位的场合——不仅是死者本人的地位，同样重要的是继承人的地位。21 鉴于中世纪早期继承制度的流动性与不确定性，亲族群体中一位显要成员的去世，对其幸存亲属及其更广泛的共同体而言，很可能是一场重大危机，若死者是统治者则尤甚。因此，将哪些武器、珠宝及其他器物放入早期中世纪的墓葬，是对贵重物品用途的刻意抉择。在关键的政治时刻埋葬这些财宝，是对威望与影响力的宣示，而葬礼本身则是重新谈判权力、重构社会关系的合适舞台。\n无论是加工成个人饰物、精美餐具，还是护甲与武器，黄金、白银和珠宝都是中世纪早期最耐久的动产财富形式之一。其他形式的财富则已消亡，只留下间接的痕迹。其中最突出的是欧洲北部和东部边缘地带劫掠与战争的受害者，那些地方掳掠奴隶成风。许多被奴役的人群被维京奴隶贩子从不列颠群岛船运至波罗的海，再转卖至穆斯林东方。另一些队伍则从中欧的斯拉夫地区被押往西方和南方。其中一些人随后在威尼斯和其他地中海港口登船，被运往穆斯林东方；另一些则经由凡尔登，再翻越比利牛斯山，供给科尔多瓦的倭马亚宫廷。这些不幸者存在的唯一物证，是他们被束缚用的颈箍、镣铐和锁链，例如出自喀尔巴阡山西端斯塔雷扎姆基要塞的那些遗物。一支从那里向西行进的奴隶队伍，很可能最终抵达巴伐利亚拉费尔斯泰滕的东法兰克边境税站。在这里，罗斯和波希米亚的奴隶贩子将他们转卖，很可能卖给了在中世纪早期欧洲奴隶贸易中地位显著的犹太人。这些奴隶队伍的商业价值必然相当可观，因为906年在拉费尔斯泰滕征收的关税记录表明，一名女奴与一匹战马等价。她是昂贵的商品，本身就具有威望，在生育方面有价值，以现金计，其价值是男奴（或母马）的四倍。\n女奴的巨大价值在爱尔兰也得到承认，在那里她们构成一种常见的价值单位。例如，一部八世纪的论著估算，一位省级国王的荣誉价格为十四名女奴。然而，在爱尔兰用于支付的最普遍的通货形式是牛。牛是爱尔兰经济的核心，在政治和社会领域同样意义重大。爱尔兰法律文献展现了一个领主通过授予牛只将依附者束缚于自身的世界，这既是经济投资，也是政治投资。这可以通过两种方式之一实现，形成“自由”依附或“基础”依附关系。两者共同之处在于一种制度：将领主的大畜群广泛分散，从而降低营养不良或疾病的风险；并且在若干年间，领主将收回数量等于或大于原授畜群规模的小牛和小母牛。虽然牛只是混合的农耕—畜牧经济中的一个要素，但它们拥有其他牲畜所缺乏的政治意义和象征重要性，依附关系的其他方面也揭示了这一点。就基础佃农而言，其荣誉被并入领主自身的荣誉之中，形成明显的隶属关系。此外，基础依附者每年缴纳食物贡赋，在领主的土地和工事上服劳役，并通过每年冬季一次宴请领主及其扈从、以及在领主军队中为其作战来表明自己的臣服。相反，自由依附者与领主保持着一种体面的关系。他本人很可能具有贵族身份，并且在偿还所借牲畜时，其条件表明他拥有相当数量的自有畜群作为后备，以防领主的牛群繁殖不济。他的地位还有其他迹象可寻。与基础依附者不同，自由依附者不丧失任何独立性。他只需在领主于地方政治大会上起身时随之起立，以标示这种关系，或许还需承担相当轻微的劳役。通过牛只依附制度，领主不仅仅是安排畜牧。他获得食物供养，自己的耕地也有人代为耕种。他获得与其财富和身份相称的依附者和一支军事追随力量。凭借大群牛只，他可以具备“第一等贵族”的特征，享有该地位所蕴含的一切威望与权力。22\n这一切对于以牛为通货等价物、生活在特别适宜畜牧的自然环境中的人口而言是合理的。但法典所提示的这种条理化制度，必然受到其他更严峻现实的制约：席卷爱尔兰的牛瘟事件，领主之间争夺自由依附者的激烈竞争，以及劫牛行动——这是众多领主和小国王之间爱尔兰式的地位竞争所特有的、且往往致命的形式。吊诡的是，劫牛既是维持社会平衡不可或缺的一环，又对生命和肢体构成危险。但这种悖论只是表面的，因为劫牛与械斗一样有其自身的惯例。与械斗相同，同时代的人也将其存在理由视为理所当然。一次成功的袭掠会扩充领主的种牛群，从而可能使其招募更多依附者。它还提供了一个展示勇气与武技这类男子汉伦理的舞台，而引发报复性袭掠的可能性则使赌注升高。若袭掠失败，首领可能丧失威望，甚至可能丧命并导致其追随者群体的瓦解。劫牛使资源保持流通，并要求不断重申武力和内部团结。在此过程中，它们提供了商议荣誉准则、将领主与其追随者联结在一起的机会。\n就现存的证据而言，已无法查明爱尔兰这种以牛为基础的恩庇制度在中世纪早期进程中发生了多大变化。但在其他地方，慷慨政治的显著发展则更容易追寻。其中最重要的，是地产作为恩庇对象——以及竞争对象——日益增长的重要性。其原因有许多已在前面提及：人口的增长；不可转让的教会捐赠的先例；对基督徒灵魂死后归宿的关注；以及从土地中获取可观现金收益的能力的逐渐增强。自七世纪起在欧洲大陆、八世纪起在英格兰，土地授予日益成为重要的酬赏形式。虽然威望物品始终是对另一位统治者的恰当馈赠，但它们在国王与其随从之间的关系中的作用，因获取土地的压力而有所调整。\n不动产是最有力、但也最复杂的馈赠或恩庇形式。正因如此，它对维护荣誉至关重要，却也容易产生特殊的紧张关系。与劫掠品或贡赋不同，它无处不在但数量有限——除非存在招致侵略与夺地的开放边疆。作为收入、领主权和地位的来源，它具有潜在的持久重要性。但它通常附带种种限制，且往往受多重利益支配。若授予俗人，日后可能因行为不端而被没收。若授予教会，则附带祈祷和服军役的相应义务。此外还可能需要应对或顾及原主的继承人的期望，或考虑现有的佃户。而且，捐赠人将土地赠予教会，通常并非出于一时有限的虔诚之举，而是希望与一个宗教团体及其主保圣人建立持久的属灵纽带。世俗与宗教恩惠的交织，以及持续的义务承诺， thus 构成了地产恩庇政治的核心。\n我们再次以艾因哈德为向导，得以罕见而生动地洞察以土地为基础的恩庇制度所固有的不安全感。在814年查理曼去世后的十五年间，精英阶层围绕继承、恩庇与酬赏的矛盾不断加剧，使关于帝国继承权的争端进一步激化，并在830年以及833—834年酿成严重的叛乱。在这种政治不稳定的氛围中，对土地的控制比以往任何时候都更是政治成功的关键：自此以后，对土地资源的竞争以前所未有的方式驱动着政治。这正是艾因哈德的书信如此有效地展示的背景。\n通过他的书信，我们看到他与自己的私人助手和庄头进行交涉，以获取其地产的经济收益。读者立刻会注意到艾因哈德对细节的关注：他谈到诸如宰牛后内脏的分配安排之类的琐事，或蜜蜂连续两年产蜜不多后如何保障蜡烛供应的问题。这种细心是对“在恰当的时间将恰当的资源送达恰当的地方”这一巨大挑战的回应，无论是他前往亚琛宫廷期间供养扈从所需的食物，还是他在塞利根施塔特建造教堂时获取所需建材的困难。与根特圣彼得会牧师的领主权不同，艾因哈德的个人领主权没有单一的行政中心，而是随其庄园而流动。他还须保持警惕，因为他不得不与玩忽职守的庄园管事打交道，确保应得的收入足额收取，且收取的是成色良好的钱币。这类行政事务不可避免地带有政治色彩。加洛林时期的主教、修道院长和领主按传统——实际上是义务——每年向统治者呈献“礼物”，这些礼物通常采取威望物品的形式——马匹、猎鹰和武器，银器、金器和珠宝。这不仅有助于充实王室宝库，还界定了得以接近统治者的精英群体，也标志着他们对统治者的敬意。因此艾因哈德按时致函他的代理人，指示他们准备并向宫廷呈送他的献礼。在为充分利用地产而付出努力方面，他几乎不可能是独一无二的：只是他的书信比大多数其他史料更明确地揭示了这些困难。\n艾因哈德还期望有所回报，通常以政治恩惠的形式。他曾数次致函虔诚者路易或其家族成员，请求他们在建造塞利根施塔特教堂一事上给予恩庇和积极帮助。他通常通过暗示安葬于此的罗马殉道者马塞利努斯和彼得将赐福于其恩庇者来施加额外的压力，因为加洛林时代的恩庇观念与古典晚期一样，将圣徒牢牢纳入其中。另一些时候，在尘世宫廷中建立的交情——“友谊”——也可被援引来达成他的目标，无论是为其建筑工程获取更多资源，还是为其政治追随者谋取恩惠。土地也常常出现在其中，因为在830年代不确定的政治气候下，艾因哈德的追随者害怕失去他们的恩地——他们仅拥有暂时权利的那些地产——而作为他们的恩主，他运用自己的影响力和名望的威望，尽力为其效劳。而且，由于恩庇政治是一种互惠的过程，他的许多书信也表明，他自己也不断受到他人的纠缠，这些人试图将他的影响力用于自己的目的。因此他也致函宫廷官员、修道院长、伯爵和主教，在这里美言几句、在那里陈述案情，或在别处为某一任命求情。\n在这种不确定与任人唯亲的背景下，艾因哈德显现为一个其影响力值得结交的人物：一如既往，个人交情、恩庇与馈赠共同引导着权力和特权的流动，将友谊转化为政治。然而，在这方面，他巨大的政治资本与其相对有限的土地资源之间存在显著的不对称。或许，通过成为他心爱的天上殉道者在尘世的代言人，艾因哈德获得了有助于弥合这一差距的属灵资源。此外，他在宫廷中的漫长岁月，卓越的才华，以及对查理曼、继而对虔诚者路易坚定不移的忠诚，使他受益匪浅，因为这些品质为他在围绕帝国宫廷编织的社会权力之网中赢得了一个核心位置。与殉道圣徒和皇帝的亲近，弥补了他物质资源的匮乏。\n艾因哈德若在宫廷政治的流沙中谨慎周旋，一方面凸显了建立在王室恩宠和封地赏赐之上的世俗生涯之脆弱，另一方面也强调了世俗庇护与超自然庇护之间的相互关联。国王与地位较低的世俗人士共同的主要愿望之一，便是赢得上天的眷顾与代祷。而代表他们获得眷顾、将虔敬愿望付诸实践、把土地化为祈祷的，往往是他们的遗孀。正因如此，阿巴的遗孀埃蕾吉丝将土地遗赠给坎特伯雷的基督堂修道院；也正因如此，吉赛拉将大量精力投入到她与埃贝哈德在西松创建的修道院中。23\n圣徒作为天上的庇护者具有强大力量，因此不仅是大量土地和财富的接受者，其本身也可能成为被奉献的对象。918年末，萨克森公爵亨利被德意志贵族选立为王，并于次年春天正式登基。由于缺乏对王位的世袭主张，亨利将其统治建立在精明的谈判、军事胜利，以及通过王室礼物交换积累圣物的基础之上。921年，他与硕果仅存的加洛林君主——糊涂查理——达成了一项平等条约，后者的承认提升了他的威望，有助于巩固他的地位。然而实际上，查理要弱得多，次年在战斗中战败并被自己的臣民废黜。急切寻求支持的查理送给亨利一件“信仰与真诚的信物”——即加洛林王朝特殊庇护圣徒、殉道者德尼的部分遗体。24 这一举动既是对查理在西法兰克的对手们的示威，同时也等于承认亨利一世是古老加洛林王朝的合法继承人及其宗教传统的保护者。圣德尼的手臂将历代法兰克国王的光辉延续到了这位新的德意志统治者身上。\n比圣徒或殉道者遗骸更为尊贵的，是与基督受难相关的圣物。在这一点上，亨利追随拉德贡德的足迹，获得了一件著名的珍宝。926年，他结束了与勃艮第国王鲁道夫二世（912–937年在位）的敌对关系，劝使其承认自己的宗主权，赠予他丰厚的礼物，并将士瓦本的一部分转让给他。两位国王的盟约以鲁道夫将“那件使上帝将尘世与天界联结起来的圣物”授予亨利而告成——即相传曾在受难时使用的“圣矛”，它曾为第一位基督教罗马皇帝君士坦丁所拥有。这件“对抗一切可见与不可见之敌人的无敌武器”，是鲁道夫短暂涉足意大利王位（922–926年）期间获得的礼物。25 圣矛由他传入亨利之手，亨利又将它传给其子奥托一世，从此成为合法统治权与德意志帝国权威的持久象征，下一章将予以说明。人们携之临阵，视之为圣物和帝国的信物；它一直保存于亚琛，直至1806年德意志帝国终结，才与其余帝国权杖仪物一同被移送至维也纳，至今仍在那里展出。\n古代兵器的象征意义、世俗与神圣的庇护关系，都在亨利一世的圣物搜集中融为一体。经济资本转化为象征资本；世俗领主权通过精神庇护得以表达。王室的赠礼与结盟政治动用了多种“通货”：物质财富、神圣器物、领土控制、威望与合法性，彼此皆可转换。尽管奥托一世的帝国与四百年前查士丁尼的帝国几乎少有相似之处，国王与皇帝们仍继续运用类似的策略，追求类似的目标。成功的统治者娴熟地驾驭着他们所有可转换的资产。\n自十一世纪中叶起，其中某些观念开始发生变化。首先是在商品经济迅速发展的北意大利，随后扩展到其他地区，获取物质资源不再被视为蒙受神恩如此直截了当的标志。尽管中世纪早期的道德家曾谴责对财富的无度贪求，并将贪婪视为万恶之首，但他们从未质疑过有原则地积累财富的必要性，也从未质疑过界定并维系政治共同体的施予与回报之间的互惠关系。然而，在米兰、帕维亚等城市，货币交易与商业利润的激增，打断了礼物与恩惠往来的循环，也侵蚀了维系这种循环的共识。\n教士们开始为那些以忠诚、尤其是以教会职位和利益换取礼物者的灵魂纯洁而担忧。主教与修道院长卷入礼物交换和庇护网络，逐渐被等同于道德败坏：人们察觉到了异端的污点。而后，随着物质财富水平进一步上升，贫穷在某些人眼中开始成为更敬虔的选择。\n这一切在千年之交之前都是难以想象的。在中世纪早期，物质财富与政治权力沿着世俗、神圣、或兼而有之的渠道流动。两者都是多形态的、可变的、不稳定的，需要不断的强化。在面临匮乏之虞的共同体中，尘世的财富意味着上天的眷顾。如同土地一样，作为献给诸神和基督教圣徒的合宜祭品的珍宝，为其拥有者和奉献者带来宗教上与政治上的双重利益。在这个资源得之艰难、失之容易的世界里，拥有财富正是宗教精英与世俗精英的界定性特征之一。他们利用财富彰显地位；维护并强化自己的荣誉；建立并巩固与领主、统治者以及天上圣徒的联系。\n因此，积累资源并慷慨地加以分配，乃是迫切的必需。这要求持续的关注，任何世俗或教会的权力中人都不敢稍有懈怠。满盈的宝库对缺乏能力管理其中财物、并将其象征意义转化为政治与宗教优势的领主而言，用处甚微；而陈设华美的祭坛，对其庇护圣徒只是捐助者利益的怠惰代言人的教会来说，也无多大助益。然而，赠礼与庇护的惯例并无明文规则。它们普遍公认的道德与政治期望始终是隐含的，是一种嵌入社会实践中、并在宫廷权力运作的童年训练中被吸纳为一部分的共识。竞争激烈，尘世荣誉与灵魂命运皆系于此——中世纪早期始终是一个施予与获取的习俗世界。在观察了国王们如何将其资源转化为政治优势之后，我们接下来必须追问：他们如何为这种权力辩护，并使之显得自然而然。", "sections": [{"level": 2, "title": "权力的景观，财富的景观", "id": "ch8-s0"}, {"level": 2, "title": "宝藏、馈赠与庇护", "id": "ch8-s1"}]}, {"id": "c9", "title": "第7章 · 王权与基督教", "kicker": "第四编 · 意识形态", "part": "第四编 · 意识形态", "html": "<p>我们祈求您赐予路易国王永世的昌盛。\n我们祈求您赐予他生命、健康与胜利。垂听我们的祈祷！\n……\n我们祈求您钳制那固守残暴异教的蛮族。垂听我们的祈祷！\n我们祈求您使异教蛮族降卑。垂听我们的祈祷！<sup class=\"fn\" data-note=\"7:1\">1</sup></p>\n<p>首先，我最亲爱的儿子，我如此劝勉、建议并恳求你：如果你想荣耀王冠，就应当以如此勤勉和精心的态度维护使徒传下的公教信仰，为上帝托付给你的一切臣民树立榜样，使教会的众子有理由称你为一位真正践行基督信仰的人。你要确切知道：若没有这一点，你既不能被称为基督徒，也不能被称为教会的儿子。而且，因为没有行为的信仰是死的，那些信心虚假或不以善功实践信仰的人，既不能荣耀地统治，也不能分享永恒的国度及其冠冕。<sup class=\"fn\" data-note=\"7:2\">2</sup></p>\n<p>当洛尔施皇家修道院的修士们为他们的国王日耳曼人路易（840–876年在位）向基督教的上帝祈求“永世的昌盛……生命、健康与胜利”时，他们所呼唤的是一种已经历数百年形成的王权意识形态。君主与臣民共同的繁荣；基督教的保卫与传播；对敌人的胜利；维护法治——这些共同构成了中世纪早期关于国王角色以及基督教在政治与社会中之地位思考的核心。到十一世纪初，欧洲已发展出一种以神圣权力与世俗权力相融合为特色的文化，其特征是：国王与基督教的人员和机构密切合作进行统治，自称“基督自身的代理人”，<sup class=\"fn\" data-note=\"7:3\">3</sup>并主导推进他们各自对基督教社会的特殊愿景。到十一世纪初年已然成熟的基督教王权模式，在上面所引的劝诫手册中得到了生动体现，该书是匈牙利国王斯特凡（997–1038年在位）为其幼子所写。斯特凡向他的继承人提出了一个十点计划：国王本人要身体力行基督教信仰及其道德纲领，支持教会机构，并敬重教会人员。在这部简短而堪称典范的论著中，王权与基督教相互交织，既提供了一种强大的意识形态，也提供了一部实用的行为准则，以将未来的国王塑造成真正基督教的统治者。</p>\n<figure><img src=\"images/fig_7_1.png\" alt=\"第7章所涉主要地点\"><figcaption>第7章所涉主要地点</figcaption></figure>\n<p>这样的劝诫可谓恰逢其时：教皇西尔维斯特二世于1000/1001年将祝祷与王冠赠予斯特凡，使他成为首位加冕的匈牙利人基督教国王。奥托三世也表示了认可，赠予他一柄圣矛的复制品——该圣矛是他的曾祖父从勃艮第的鲁道夫手中获得并作为基督教统治权标志而挥舞的。在那一刻，斯特凡跻身于基督教诸侯的等级秩序之中，而奥托作为皇帝居于其巅，行使着至高无上的权威。<sup class=\"fn\" data-note=\"7:4\">4</sup>然而仅仅一个半世纪之前，匈牙利人（在他们自己的语言中称为马扎尔人）还正是那“固守残暴异教的蛮族”——他们的袭扰曾令日耳曼人路易及其臣民极度恐惧，洛尔施的修士们曾为之祈求他们的败亡。他们从西亚草原上一群信奉萨满教和精灵崇拜的半游牧部落，转变为定居于喀尔巴阡山以西、凝聚成一个基督教王国的单一民族，其转变速度之快令人瞩目。值得注意的是，斯特凡于1000/1001年的加冕与膏立仪式，伴随着埃斯泰尔戈姆大主教区的建立，这种教会权威与基督教王权的共同制度化，常被视为匈牙利基督教王国的奠基时刻。此外，在其后数年间，斯特凡国王不仅为儿子撰写了劝诫手册，还颁布了两部法典，进一步强化王权、建立教会等级制度、推广基督教信仰，并铲除其基督教神职人员所不能接受的社会与宗教习俗。从这个角度看，他本人正是其子应当努力效仿的模范基督教统治者——这样一位国王，通过立法实现对真正基督教社会的愿景，让无数传教主教的梦想有了实现的可能。1083年，即他去世半个世纪后，当斯特凡被匈牙利主教们正式追认为圣人时，他作为国父的角色得以正式确立并被永久纪念。</p>\n<p>在匈牙利人斯特凡身上，我们看到了一种简洁的例证，说明国王如何居于中世纪早期宗教生活的中心，既培育基督教，又得益于这一宗教所反过来推崇的意识形态。本章将探讨将统治者与宗教联系起来的三个主题：国王在促进基督教传播、压制其他宗教认同方面所扮演的角色；基督教与其他中世纪早期宗教形态在实践与认知上的区别，以及统治者对于确保“正确的”基督教信仰实践所做的贡献；还有国王在中世纪早期关于人与神圣世界关系的理解中所处的地位。</p>\n<h2 id=\"ch9-s0\">基督教的传播</h2>\n<p>1038年斯特凡去世时，基督教已历经整整一千年。它在此前数个世纪的传播形成了独特的面貌。基督教在四、五世纪成为罗马世界的主流宗教时，便与帝国、其治理模式及其特有的社会文化形态达成了契合。事实上，它已根基稳固，以至于五世纪西罗马帝国政府的覆亡，也仅使基督教在那些因长期军事动荡与外族入侵而致整个罗马生活方式崩溃的有限区域内衰退或消失。在其他地区，尤其在罗马城本身，教士们接管了原本由国家履行的诸多治理职能。而在那些社会凝聚力和认同原本就越来越不依赖中央政府的行省，基督教团体及其领袖迅速调整自身以适应新王国的建立，在他们尚武的国王身上看到了他们昔日习于享受的帝国庇护下的保护与恩庇的可能。公元500年前后基督教的分布范围见图7.2。</p>\n<figure><img src=\"images/fig_7_2.png\" alt=\"中世纪早期基督教的扩展范围\"><figcaption>中世纪早期基督教的扩展范围</figcaption></figure>\n<p>到五世纪末，基督教的信仰实践已遍布罗马世界内外，以至于它的存在导致了选择的收窄。取古代宗教多元主义而代之的，是一种强制性——甚至是胁迫性——的基督教，其本质在于否认任何其他宗教的合法性。然而，七世纪中叶，阿拉伯征服者将新的伊斯兰教带入拜占庭帝国的亚非行省，这既使宗教间的概念边界更加固化，也极大地改变了其地理边界。面对阿拉伯人的进军，拜占庭帝国在七世纪失去了大部分非欧领土，而711年西班牙的被征服，使半岛只剩多山的北部仍在基督教控制之下。诚然，此后仍有广大的基督教团体处于伊斯兰统治之下，拜占庭也设法保住了小亚细亚的古代基督教城市，但从七世纪后期起，一条宗教边界实际上贯穿了地中海。这条边界既是宗教的，也日益成为文化与政治的边界，除微小波动外，一直保持不变直至十一世纪。它的存在以崭新而更加尖锐的方式界定了各种认同。</p>\n<p>在地中海以北，另一场同样深刻的地理变迁正在发生：帝国沿多瑙河、莱茵河以及横贯不列颠北部的旧边界，不再标志着基督教教会——其组织依照罗马行政模板、将帝国划分为教区与行省——的界限。如图7.2所示，从四世纪到七世纪，基督教传遍不列颠群岛的各个角落；八、九世纪间，它从莱茵河扩展到易北河；十世纪至十一世纪初，又从多瑙河延伸到第聂伯河和波罗的海。事实上，匈牙利只是千年之交新建立的几个基督教王国之一：波兰、波希米亚、丹麦、挪威以及基辅罗斯公国的统治者，都在970年至1030年的数十年间皈依了基督教。在遥远的北大西洋，甚至定居于冰岛的、已由维京人转为农民的社团，也在999/1000年集体决定皈依基督教。在中世纪早期，基督教“赢得了许多王国，战胜了最强大的君王，并以其自身的力量折断了傲慢者与尊贵者的颈项”。当乌得勒支主教拉德博德（899–917年在任）于十世纪初写下这些话时，他不可能知道这些话既是回顾，也是预言。<sup class=\"fn\" data-note=\"7:5\">5</sup></p>\n<p>这一切是如何且为何发生的？中世纪早期基督教的三个显著特征有助于解释：它小规模的组织形式、多元的社会界定以及教义上的灵活性。就第一点而言，到约500年，基督徒已发展出相当标准的组织形式：地区性的崇拜团体（教区）由一位主教监管，主教对服务于地方教会的职业仪式专家（司铎）拥有管辖权。罗马主教——即教皇——被广泛尊为西方基督徒的最高领袖：他受到尊重，是出于敬意，因为正如下一章将说明的，在约1050年之前，他并不拥有管辖性的服从权威。当主教们联合行动时，是在地区层面，有时是在民族层面，而非普世层面。中世纪早期形成惯例：教皇认可新的大主教区（如埃斯泰尔戈姆）作为全国性或地区性的“超级主教区”而设立，但新教区的建立、新乡村教堂的修建与配备人员，均可视需要随处进行，无需教皇授权。此外，过独身生活的男女团体也聚居共处，在基督教扎根之处建立起修院。尽管在中世纪早期……</p>\n<p>中世纪时期，尽管这些形式往往趋于规范化为一种共同模式，大多数修道院仍然保持着自治。因此，就制度而言，基督教的组织方式仍然是分散的，并且很容易在任何地方被复制。</p>\n<p>在社会和教义层面，中世纪早期的基督教表现出相当大的流动性。关于“基督徒”究竟意味着什么，除了指一个通过接受洗礼这一入门仪式公开宣认这一身份的人，或由他人代其作出这种宣认的人之外，尚未形成共识。从神学上讲，这种宣认意味着此人对死后获得永生的可能性持开放态度。正如托莱多主教尤利安（680–90年在任）所断言的：“凡真正为基督徒者，绝不应怀疑一切已出生或将出生、已死亡或将死亡之人的肉体都将复活。”<sup class=\"fn\" data-note=\"7:6\">6</sup> 在这一点上，确实存在一致意见。然而，洗礼宣认的实际含义仍然模糊不清。对作为基督徒的更严格界定强调伦理行为、脱离世俗社会的纽带，以及对信仰的智性理解。在其最完整的意义上，基督教在寻求永恒救赎的过程中，将人类现世存在的所有方面都与神圣者联系起来。而其确切的教义含义也仍然是可以商榷的。在起源于巴勒斯坦之后的五百年里，该宗教的教导并未被系统化为一个意义无可争议的单一、连贯的教义体系。这种情况在中世纪早期也没有发生：辩论和著述其教义的人们在某些问题上观点一致，但在另一些问题上则不然。事实上，很少有人有资格或有意参与这类学术讨论——不过，对于一个出生时就在与世隔绝的乡村社区受洗、偶尔有一位几乎不识字的司铎到访的人来说，这些辩论本来也不会有任何意义。中世纪早期的“基督徒”身份无法用标准化的定义来界定。</p>\n<p>因此，在约1100年之前，基督教的组织方式是地方性的，却可以在任何地方复制。此外，对于作为基督徒意味着什么，存在着一系列不同的定义；对于教义的核心信条，也存在着各种不同的诠释。实际上，中世纪早期的基督教既没有中央集权，也没有系统化。它不是一个可以作为一个整体被采纳或拒斥的单一、统一的文化包裹，而是由一系列信仰、社会实践和组织形式构成的储备库，可以被零散地采纳和改造。因此，基督教从一个文化和政治语境跳到另一个语境，在保持其核心特征的同时，不断地变异和重塑自身。换句话说，一种公开宣称普遍性讯息的宗教，成功地在众多文化语境中实现了本地化。多元性和多种可能性始终是中世纪早期基督教的特征——或者更准确地说，是中世纪早期诸种基督教的特征——并使这一普世宗教得以呈现出无穷变化的本地形态。基督教由此强化了中世纪早期极具特色的地方主义。</p>\n<p>关于基督教传播的传统叙事并没有充分考虑这些地方性差异。它们讲述的是基督教从古代地中海权力中心向外扩散的故事，借助的是著名人物——皇帝、国王、传教士，有时甚至还有教皇——的活动。这种解释中蕴含着一整套关于何为规范基督教的时代错置的假设。当我们从基督教世界的边缘而非其中心出发来观察时，那些地方特殊性就变得明显得多。国王和传教士的问题我们稍后再来讨论。</p>\n<p>作为文化和经济交流地带，中世纪早期的边疆和罗马边疆一样具有渗透性。在旅行、贸易等日常活动中形成的跨境接触，可能成为基督教得以渗入的相遇或传播渠道。接待过往的商人、传教士或政治使节，提供了互动的契机，早在采纳基督教之前就产生了对这一宗教的一定程度的熟悉。因此，当法兰克人和丹麦人于811年在艾德河畔会盟宣誓和平时，双方使团各自“依照自己的仪式和习俗”宣誓，前者采用明确带有基督教色彩的誓词，后者则另有一套做法。<sup class=\"fn\" data-note=\"7:7\">7</sup> 马扎尔人提供了另一个例证：早在拜占庭和日耳曼传教士于十世纪来到他们中间之前，这个民族就已与基督教有过接触，因为在880年代初，希腊传教士美多德沿多瑙河穿过匈牙利领土往返于君士坦丁堡和斯拉夫诸地之间，并在那里受到其首领“以尊荣、隆重的礼节和喜悦”的接待，后者还向他馈赠了大量礼物。<sup class=\"fn\" data-note=\"7:8\">8</sup> 这类相遇属于长途旅行的世界，发生在精英和政治领袖层面。但地方性的跨境接触也可能促使其腹地出现基督徒社团。这或许可以解释为何在五、六世纪时，不列颠罗马边疆以北的怀特恩和阿伯康等地，或墨洛温高卢东部边缘之外的尼尔克海姆在八世纪初，会存在有组织的教会。</p>\n<p>贸易是有充分文献记载的了解另一种宗教的途径。毫无疑问，旅行至基督教世界之外的基督徒商人的祈祷和仪式偶尔会引起议论。然而记载更为清楚的，是非基督教商人在前往基督教地区贸易时的经历。九世纪，来自斯堪的纳维亚各商埠的商人在旅途中接触到了基督教。例如，海泽比这个波罗的海商埠的一些人曾在杜里斯特受洗。还有人记住了法兰克传教士主教安斯加尔（卒于865年）所宣讲教义的大意，以至于当瑞典人试图洗劫波罗的海东岸的阿普利亚定居点、而自己的神明不愿相助时，他们提议向基督教的上帝求助。</p>\n<p>另一种值得注意的基督教相遇与传播形式是跨境劫掠和掠奴。晚期罗马作家十分清楚，基督徒奴隶有时会将基督教传给掳获他们的人：最著名的例子是帕特里克，这位被爱尔兰劫掠者掳为奴隶的罗马—不列颠基督徒逃脱后，于五世纪的某个时候重返爱尔兰，向昔日的主人传教。在这方面，罗马帝国的政治解体并未带来任何改变，因为中世纪早期强权政体边缘普遍存在的掠奴活动，继续充当着宗教互动的渠道。值得注意的是，安斯加尔抵达比尔卡时，发现那里有相当数量的基督徒俘虏。一则840年代的故事揭示了这些人如何在欧洲边缘辗转流徙。芬坦是一名基督徒，是爱尔兰莱金地区一位小统治者的儿子，其亲族正忙于与邻近一位军阀争斗。为阻止进一步的报复，他的对手们施以诡计：他们邀请芬坦到海滩上赴宴，并安排附近的一伙维京人上演一场突袭将他掳走。芬坦被迅速地从一个维京人转卖到另一个维京人手中，直到他成为一名准备返乡者的财产，此人将他与其他俘虏一同装船运走。在返回斯堪的纳维亚途中，船员们在奥克尼群岛一座无人居住的小岛过夜，芬坦在那里设法逃脱。他发誓永不返乡，游到附近一座岛上安全之处，最后于881年在莱瑙阿尔卑斯山麓以隐士身份终老。</p>\n<p>边疆暴力最臭名昭著的形式当然是战争，而战争也以其自身的方式促进了基督教的传播。250年代，居住在克里米亚罗马边疆附近的哥特人经常袭掠黑海南岸的罗马一侧。有时他们带着基督徒俘虏归来，正是从这种不光彩的开端中，哥特人第一次接触到了基督教。一些哥特人皈依了；俘虏社团无疑将他们的信仰保持了好几代，直到340至350年代由帝国支持的乌尔菲拉传教团使哥特人转向当时帝国圈子中流行的基督教阿里乌派。<sup class=\"fn\" data-note=\"7:9\">9</sup> 另一种或许更为常见的情形，是从边疆民族掳获的俘虏和质子在帝国羁押期间接触基督教。查理曼对萨克森人的战争以血腥和坚不妥协地摧毁萨克森社会与宗教、以刀剑强制推行基督教而臭名昭著。<sup class=\"fn\" data-note=\"7:10\">10</sup> 一份805至806年的简短行政备忘录为我们记录了三十七名萨克森质子的姓名，他们被单独或成对地托付给阿拉曼尼亚的主教、修道院长和伯爵看管。他们的命运不得而知，但这些显然是重要到足以被留下一命的人物——为的是把他们改造成征服者皇帝的基督徒臣民。加洛林王朝和奥托王朝对异教敌人的许多其他成功战役，想必也以类似方式告终。</p>\n<p>从四世纪末起，基督教罗马帝国的边缘地带不仅是个体和小群体流动的区域，有时也是军队和整个民族迁移的区域。当军阀及其扈从队伍跨越边疆、在帝国内寻找新家园时，他们便发现自己定居在基督徒中间。有些人，如五世纪初定居于帝国内的哥特人和汪达尔人，原本就已是基督徒，尽管是阿里乌派基督徒。而对另一些人来说，皈依基督教是在迁入帝国之后才发生的。法兰克人在五世纪期间将其政治控制区和定居地扩展到高卢北半部时，必然与该地区根基深厚的城市基督徒社团以及现存的乡村社团有着广泛的接触。在这里，宗教的改变不是经由旅行者或传教士，而是经由日常生活的持续互动而来。通婚便是其中一方面：每当一名法兰克武士迎娶一位基督徒女子，这个家庭就成为宗教改变的焦点。在高卢和其他地方，基督徒妻子和母亲在传播其宗教方面的重要性无论如何估计都不为过。然而，只有王室层面的相关情况，现存证据才使我们能够多少详细地追踪这一过程。法兰克国王克洛维——他在（大概）508年接受基督教，使其成为对同时代人和后世都意义重大的标志性皈依者——早已娶了一位基督徒勃艮第公主。克洛蒂尔德坚持要给孩子们施洗，以及她对克洛维的个人影响，促成了他接受基督教的决定，并使她在后世传说中赢得“法兰西之母”的地位。从农庄到宫廷，家庭是宗教改变与文化涵化最有效的焦点之一——尽管也是文献记载最少的焦点之一。</p>\n<p>除了下莱茵地区之外，法兰克人逐渐适应基督教的过程并未对高卢—罗马基督教造成实质性破坏。如果说有什么影响的话，那反而是增强了教会领袖人物的影响力。然而在其他地方，军队和移民的流动往往造成更具破坏性的后果。到四世纪末，基督教已传遍不列颠，但当盎格鲁—撒克逊移民在五、六世纪跨过北海而来时，其制度组织在不列颠东南部全面崩溃。这里残存的基督教只以几个孤立的小据点形式存在，丧失了教士的领导。十世纪的多瑙河平原或许也发生了同样的情况，因为马扎尔人占据的该地区西部包括了根基稳固的基督徒社团，他们似乎将自己本土语言的宗教词汇传给了征服者。</p>\n<p>与这种缓慢的、几乎不见于史册的文化渗透相反，在新环境中启动基督教的政治冲击在史料中十分醒目。这构成了该宗教传播的第二种截然不同的方式：有权势的男女人物所采取的决定性行动，其影响往往是迅速而广泛的。无论是作为统治者皈依的叙事——追溯到皇帝君士坦丁（306–37年在位）的皈依——还是作为说服其配偶改变权力观念的王后们的叙事，抑或是服从基督诫命“你们要去使万民作我的门徒，奉父、子、圣灵的名给他们施洗”（《马太福音》28:19）的传道者的叙事，基督教的传播同时也是一部高层政治史，也是那些声名被基督徒社团恪尽职守地培育传承的人物的历史。</p>\n<p>作为一种王室行动，接受——或拒绝——新宗教，通常是在霸权政治的背景下发生的。宗主对小统治者施加影响的主张、小邦君主寻求强大邻国的支持，或仅仅是对效仿已被证明行之有效的成功为王之道的渴望，都发挥了各自的作用。传教士无论出于自身主动还是奉王命而行，都循着同样的沟通渠道移动，很少前往与其故乡即便间接也没有关联的地方。他们随身带来的有政治人脉、贵重的礼物、举行盛大仪式的经验，以及——同样重要的是——对成功皈依仪式的权威脚本的既有了解。</p>\n<p>在这种情况下，接受基督教带有精心安排的政治展演的一切特征。597/598年，当肯特国王埃塞尔伯特从奥古斯丁——一位在肯特的法兰克宗主的扶持下开展工作的罗马修士——那里接受基督教时，据称有一万人随之受洗。从人口统计上看这纯属荒谬，但</p>\n<p>富于修辞效果的形象表明，这是一个引人注目、具有直接意义的事件。845年，十四位波希米亚王公及其随从在日耳曼人路易位于雷根斯堡的宫廷接受洗礼，这一场面必定蔚为壮观。有时，宗主国王会为皈依的统治者充当教父，主持其身份的转变，并从洗礼盆前接纳他，借此借助洗礼确立一种尊卑等级。韦塞克斯的阿尔弗雷德在878年为其战败的敌人、维京首领古特鲁姆充当洗礼教父，便是这样的情形。王室的洗礼还可以旨在将未来的统治者纳入联盟：1000年奥托三世访问格涅兹诺期间，他成为基督教波兰王公“勇敢者”波列斯瓦夫（992–1025）新生儿子教父，这场仪式充满象征意义。他还通过赠予波列斯瓦夫一顶王冠和另一件圣矛复制品（至今仍可在克拉科夫看到）来巩固这一纽带。</p>\n<p>追问此类洗礼背后是宗教动机还是政治动机，本就是提错了问题，因为在一个身份认同既属社会又属个人、宗教表达通常更具共同体性质而非个人性质的年代，这种区分毫无意义。无论势微还是强大，统治者都需要以视觉上富有戏剧性的形式展演其与上级和下属之间的政治关系。事实上，国王只有在其显贵们的支持下方能行使职能。因此，对皈依的焦虑，或皈依后复又叛教的现象，乃是统治集团内部冲突的症状。在西北欧，接受或排斥新宗教之间的紧张关系可能反映了对宗主权的选择，或许也反映了统治精英中年长成员与年轻成员之间的冲突。616年肯特的埃塞尔伯特去世后，由其子兼继承者带领出现了一次向异教旧俗的回潮；而一个世纪之后，弗里西亚统治者拉兹博德（卒于719年）在被告知其异教祖先不会陪伴他进入基督教天堂后，竟从洗礼盆前退了出来。在此，集体身份问题是以生者与死者之间的社会凝聚力的方式表达的，但严酷的现实是，法兰克人的侵略在弗里西亚精英内部催生了冲突。</p>\n<p>九、十、十一世纪的中欧统治者在加洛林诸帝及其奥托继承者所支持的基督教与拜占庭皇帝的基督教之间面临抉择的额外困境。如第一章所强调，前者以拉丁语为圣礼语言，以罗马为正统乃至领导之所在；后者则愿意将当地土语用于礼仪用途，其管辖中心设于君士坦丁堡。这一选择必然也关乎政治利益，在东西两大帝国积极争夺盟友与影响力的数十年间，这一两难处境尤为尖锐。在多瑙河下游流域，保加尔人可汗鲍里斯（852–89）既是法兰克人也是拜占庭人的军事威胁和潜在盟友：双方都笼络他，力图对其施加影响。这正是鲍里斯决定皈依基督教并于864/5年受洗的背景。但政治与文化的取向仍是一个问题，鲍里斯与罗马和君士坦丁堡长期谈判之后，才于870年选择希腊基督教。大约一个世纪之后，新兴的匈牙利王国面临类似的压力。十世纪晚期，德意志和拜占庭传教士同时在马扎尔人中间活动：在斯提芬国王于教皇和奥托的主持下加冕之后的很长一段时间里，希腊教士依然活跃。</p>\n<p>我们应当简要回溯斯提芬的统治。他是一位基督教国王，统治着这样一群臣民：在这些人中间，传播基督教的地方性的、不为人注意也不引人注目的传教工作正在逐渐推进，并将长期继续，在随后的几十年里不时被异教暴动所打断。埃斯泰尔戈姆大主教区的建立之后，必须逐步建立起一个全国性基督教的建制性基础设施——一个主教网络、修道院的创建与捐赠（男女修士团体在其中过着有纪律的清修与祈祷生活）、对本地教士进行礼仪专长和拉丁语的培训。传统程序必须重新协商，以满足基督教教士对法律保护、特权地位以及永久保有土地赠予的期待。而且，还必须启动在传统马扎尔社会习俗与基督教教义的伦理要求之间进行漫长而缓慢的调适过程。在这一切之中，匈牙利 斯提芬的特殊之处仅在于其热心推行基督教所产生的文献记载，以及他行事之迅速。他的统治不过是将此前数个世纪中许多皈依国王所面临的问题，浓缩为一个记载详备的高速版本。</p>\n<p>实现这些目标需要时间和政治决心。在基督教的传播仍限于非正式接触的地区，建制化并未发生。在缺乏教士等级体系和完全的读写能力的情况下，我们看到一些即兴式的基督教生活方式，它们以其践行者自有意义的方式蓬勃发展，却往往遭到最终追上这些人群的传教士的怀疑或断然谴责。其中一人是弗里德堡，九世纪中叶生活在以非基督徒为主的瑞典人中间的一位基督教妇女。她知道有一种临终者啜饮葡萄酒的仪式（即临终圣体，由教士向临终者授予祝圣的酒，作为帮助基督徒灵魂升入天堂的仪式的一部分），于是买来葡萄酒备好，并嘱咐女儿在她临终时给她饮下。另一例是 Ørlygr Hrappson，一位挪威人，少年时代曾在赫布里底群岛由一位爱尔兰主教抚养。十世纪初，他前往冰岛，携带着建造教堂的木料、一本礼仪书，以及要埋在教堂角柱之下的“祝圣过的泥土”。这最后一项会使任何受过正确祝圣新教堂程序训练的人大为惊骇。Ørlygr 以盖尔圣徒科伦巴之名命名其教堂，三代之后，他的后裔仍“信仰科伦巴，尽管他们并未受洗”。<sup class=\"fn\" data-note=\"7:11\">11</sup> 这种“自己动手”式的基督教，是在缺乏有组织的教士阶层的情况下，宗教变革经由非正式接触渠道缓慢渗透的伴生物：尽管文献记载稀少，它必定在制度化基督教世界的边缘地带以及偏远的内陆角落蓬勃存在。</p>\n<p>无论我们把注意力集中于基督教以非正式还是正式方式的传播，我们都不断被提醒：宗教变革总是发生在社会情境之中，而这些情境往往也是政治性的。它影响到家庭和家户、宫廷、军队、商人社群，且对各者的影响方式各不相同、各具特色。尽管如此，仍可提出两点概括性意见。第一，如果中世纪早期的男男女女在接受新宗教时，将关于基督教教义“真理”的看法与政治或现实动机相权衡，我们并不会从他们自己的话语中听闻此事。诚然，虔信的基督教作者认为皈依者理应如此，有时也把他们描绘成这样做的，但宗教变革背后实际的理由对我们而言始终隐而不显。然而我们可以确信，对某些人而言，作出决定的必要性远比其他人更为迫切——对统治者（或反叛者）而言比对忠诚的追随者更为迫切，对父母而言比对子女更为迫切。第二，统治者及其随从的受洗，或者家庭层面对某些基督教习俗的采纳，都未必带来迅速而彻底的精神、道德和社会转型。如前几章所述，丧葬仪式、性行为、对疾病的应对以及其他诸多方面的转变确实发生了，但过程缓慢、反复无常，且极难强制推行。无论在地理还是时间维度上，我们都无法察觉一种均匀的推进：基督教的传播循着许多不同的路径与节律。它高度依赖于特定时空情境的不断变化的组合，对不同的人意味着不同的事物。总之，中世纪早期的基督教由地方性知识构成，而非普世的“真理”。</p>\n<h2 id=\"ch9-s1\">异教徒与基督徒</h2>\n<p>尽管中世纪早期欧洲的诸种基督教形态在组织、礼仪和社会实践上地方形式繁多，它们仍有许多共同之处。基督教世界观的中心是这样一种主张：唯有这一宗教提供了关于超自然（或神圣）、自然（或尘世）与人类（或社会）之间关系的唯一可能的真理。这些普世化的观念之所以吸引统治者及其谋士，是因为它们重构了共同体的观念，塑造了新的身份认同，指认了新的敌人，并为王权提供了新的正当性依据。随着反对基督徒与非基督徒对立的思维定式日益固化，在一切可能之处根除“谬误”便成了各地国王和教士的任务。由此，基督教改变了其采纳社会的想象图景。通过提供一套共有的普世价值，它为各社会提供了新的彼此联结的方式。通过许诺尚武的国王们以新的意识形态和交流方式，它鼓励他们走向共同的伦理乃至共同的目标。<sup class=\"fn\" data-note=\"7:12\">12</sup> 事实上，它如此成功地提供了一种包罗万象的伞状身份认同，以至于到十一世纪初，“基督教世界”与“欧洲”实际上已成为同义词。到第一个千年末，散居的犹太人社群构成了欧洲唯一重要的非基督教存在；他们受到忽视、容忍与敌意交织的暧昧对待，这考验着中世纪早期欧洲作为一个强制性基督教共同体的身份认同的边界。</p>\n<p>强制性基督教奠基于承自古代晚期的观念，即基督教不仅是普世宗教，而且还是唯一“正确”的宗教。在这种凯旋主义的视角下，基督教的传播常被描绘为对“错误”宗教的铲除。拉巴努斯 毛鲁斯一语道破：“基督教摧毁一切谬误。”<sup class=\"fn\" data-note=\"7:13\">13</sup> 这一修辞立场否认一切其他宗教的任何有效性。它们的神祇被径直重新定义为魔鬼，其道德教诲与崇拜实践被斥为堕落败坏。</p>\n<p>于是魔鬼及其仆从恶魔们……开始以各种形式向人类显现，与他们交谈，并要求他们向它们献祭，献于高山之上和繁茂的森林之中，并把它们当作上帝来崇拜。……有一个魔鬼自称朱庇特，他曾是一个魔法师，犯下如此多的通奸罪行，竟娶了自己的妹妹朱诺为妻，玷污了自己的女儿密涅瓦和维纳斯，甚至与他的甥女们及所有女性亲属犯下污秽的乱伦之罪。另一个魔鬼自称玛尔斯，他曾四处播撒争斗与不和。……还有一个魔鬼自以为维纳斯；她曾是娼妓，不仅参与无数通奸，甚至与父亲朱庇特和兄弟玛尔斯卖淫苟合。……这些魔鬼甚至诱使人们为他们建造神庙，在其中安放恶人的形象或塑像，并为他们设立祭坛，在坛上为他们倾洒牲畜乃至人的鲜血。<sup class=\"fn\" data-note=\"7:14\">14</sup></p>\n<p>布拉加主教马丁（556–79）就这样颠倒了传统罗马诸神的宗教意涵，使其失去本性，并嘲讽任何宣称它们具有真实性的企图。他的观点在中世纪早期广泛流传，并以各种方式被重申。例如，八世纪末至九世纪，在德国富尔达传教据点附近施行洗礼时，接受基督的新皈依者要承诺“弃绝魔鬼托纳尔、沃坦和萨克森诺特的一切言行，以及所有与它们为伴的邪魔”。<sup class=\"fn\" data-note=\"7:15\">15</sup></p>\n<p>基督徒处理本土神祇的另一种方式是否认其超人的地位。通过将诸神贬低为凡人，基督徒试图使与之竞争的神祇变得无害。温彻斯特主教丹尼尔（约705–44）曾就其在德国的一次布道使命向博尼法斯提出如下建议：“你不应当在诸神的谱系问题上与他们争论，尽管那些神是虚假的，而应任由他们按照自己的信仰宣称一些神由另一些神通过男女交合所生，这样你便至少可以表明，以人类方式诞生的男女神明是人而非神，并且由于他们此前并不存在，故有其开端。”<sup class=\"fn\" data-note=\"7:16\">16</sup> 如此被贬至人的地位后，诸神可能发现自己被放逐到遥远的过去。沃坦是受崇拜最广的日耳曼神祇之一，便遭遇了这一命运，尤其在各个盎格鲁-撒克逊民族之中。在基督教传教士将宗教引入英格兰南部两个半世纪之后，沃坦已从神贬黜为王室王朝的创业始祖，从诸王的原始缔造者降为亚当的后裔——而按照圣经传统，亚当是由犹太-基督教上帝所创造的第一个人类。在别处——尤其是爱尔兰、冰岛和斯堪的纳维亚——史诗、萨迦和神话常常使这些形象在文学的来世中又存活了许多个世纪，透过漫长的基督教经验过滤了对异教过去的呈现。</p>\n<p>从五世纪起，基督教的对抗性修辞还将除犹太人之外的所有非基督徒一概而论，以贬抑的方式将其斥为“异教徒”（pagans）。当然，从来不会有人以此作为自我认同的称谓。这一用语的使用遮蔽了中世纪早期欧洲本土宗教传统的丰富多样性，以及</p>\n<p>蓄意遮蔽了对其实际性质的任何理解。在评估这一点时，我们必须谨慎行事。罗马世界诸非基督教宗教的信奉者的思想和声音，有时以文字形式直接流传至今，而对于中世纪早期那些非基督徒的男女，却不存在任何可与之相比的途径来探知其宗教态度或经验，因为正如第一章已阐明的，除简短刻划的铭文之外，书写文化乃是基督教的引入物。我们只能依赖可能具有宗教意义的物质遗存、语言痕迹（例如地名），或基督教作家所记述的非基督教信仰与习俗。</p>\n<p>尽管如此，只要谨慎从事，我们仍可大致勾勒出基督教传教士在罗马世界以外所遭遇的那些传统宗教形态的轮廓。与犹太教、基督教或伊斯兰教不同，它们无一依赖于圣典文本的集成、先知传统，或对独一普遍神祇的认信。它们没有任何需要捍卫的教义与正统，也没有表达“宗教”这一复杂抽象概念词语。它们并非围绕一位全能的人物、甚至一对对立的二元神祇来安排宇宙，而是认为宇宙中栖居着无数精灵，这些精灵既影响凡间事务，又可为人所操纵。从最深的地底到最遥远的星辰，自然与超自然、形体与精灵无处不在地相互交织、相互作用。在这一框架之内，人类的位置通过神话、仪式、神圣知识的储备，或萨满、占卜者、德鲁伊等从业者的活动而得以确立。它们的仪式还提供了理解和试图掌控生死、生育与疾病、战争与繁荣等根本性力量的途径。通过献祭安抚神灵与精灵、以护符和避邪物对其进行约束或召唤；借助占卜等手段预测未来；以及通过禁忌规约人的行为——这些似乎都是普遍存在的。因此，神圣活动与人类生存的其他方面——家族的、家宅的、农业的、政治的、军事的——如此紧密地纠缠在一起，以致任何把“宗教”视为一种独立经验范畴的尝试都归于徒劳。</p>\n<p>尽管有上述概括，而且尽管存在若干神祇（如日耳曼人的沃坦）表面上广泛流行的崇拜，宗教传统在很大程度上仍然关乎地方认同，无论这种认同属于群体还是地域。许多地域上的具体情形已无从考知，尤其是因为我们对某些地区宗教传统的了解远胜于其他地区。但显而易见的是，一位神祇可能是武士精英的始祖；一棵古树之类的自然景物可能凝结着一个共同体的本质；一处圣地可能是一个政体的礼仪中心或献祭之所。因此，七世纪的伦巴德人相信，当沃坦允诺“长须之人”伦巴德人在战斗中获胜时，他们便得到了自己的族名；而爱尔兰南端则由“牛犊女神之家”科库·洛伊格德（Corcu Loígde）统治。德意志地区的洛马奇（Lommatsch）得名于一处圣泉，当地民众崇奉它，因为它能通过撒出小麦、燕麦和橡子来宣告和平与丰收以预言未来，但“当战争的狂风暴雨威胁时，它便以血与灰烬清楚地预示结局”。<sup class=\"fn\" data-note=\"7:17\">17</sup>八世纪的弗里西亚人栖居于北海沿岸潮汐沼泽之上的人工高丘（terpen）中，他们在涨潮的力量中辨认出一位需要以人祭加以安抚的神。与此形成对照的是，在983年推翻奥托王朝统治之后的那个世纪里，柳蒂齐斯拉夫人将其对德意志统治者及其宗教的抵抗组织起来，围绕其主神殿——里德戈斯特圣区中的斯瓦罗齐茨神祠。</p>\n<p>考古学有助于充实这一粗略的描述。尤其在斯堪的纳维亚和中北欧，人们发现了仪式性献祭的痕迹——动物、人类、武器——有时见于专门的祭祀围场，有时则作为祭品 deposited 于沼泽、湖畔或树木周围。物质遗存与文字记载同样证实，神圣区域内还可以设有木制或石制的柱状偶像，但人形的神像仅发现于斯堪的纳维亚南部和西斯拉夫地区。诸如丹麦尼达姆遗址及其四、五世纪大批武器和船只的祭祀沉积；奥尔登堡（今德国波罗的海沿岸的一座斯拉夫要塞）出土的神祇小像和十世纪马祭的遗存；以及瑞典北部岛屿祭祀中心弗勒瑟岛上堆积在树干周围的十至十一世纪动物遗骸——这些发现都生动地提醒我们，基督教终将摧毁的那些信仰与习俗曾经存在。</p>\n<p>由于现代学者无法通过内部的文字证据来研究这些本土宗教形态，严格说来，它们属于史前状态。但不应因此假定它们是超历史的。它们随时间演变的方式确实可以被察觉，尤其是通过与邻近霸权文化或基督教的互动。前基督教时期爱尔兰人发明的欧甘字母便是已遇到的一个例子。在五、六世纪，定居于不列颠的盎格鲁-撒克逊人可能已开始使用专门的崇拜建筑，或是接管旧的罗马神庙和教堂，或是刻意模仿而自建木构圣所。在十世纪末和十一世纪初的丹麦，如尼石碑有时会以措辞透露出基督教影响的套语召唤雷神托尔的力量。而丹麦人的邻居柳蒂齐人并非一直在神庙中礼拜，其境内也并非一直由某一圣所凌驾于其他圣所之上：随着对德意志统治的反抗日益强硬，他们的本土宗教获得了一种模仿对手宗教的结构与组织。就政治权力与神圣权力的相互强化而言，没有比基督教更好的样板了。</p>\n<p>本土宗教传统回应邻近基督教的影响，本不足为奇，因为中世纪早期边界的可渗透性已有所论述。在实践中，宗教信仰与习俗从来不是密封隔绝的体系，而是在与其更广阔的社会环境的创造性互动、涵化或对抗中发展起来的。因此，无论基督教真理与异教谬误之间凯旋式的对立多么鲜明，这一概念上的二分法通常并不渗透于日常的宗教经验——对于那些被专门鼓动去击败异教徒的基督教军队则属例外。就多数情形而言，个人的现实处境并不符合传教士意识形态所描绘的图景，即皈依基督教是一种彻底的个人转向，伴随着对前基督教过去的完全弃绝。</p>\n<p>关于皈依君主的叙事常常清楚地表明这一点：我们可以回到匈牙利来说明。国王伊什特万的父亲盖萨（约970—997年在位）在匈牙利人正处于拜占庭与德意志两大帝国之间抉择的时刻掌权；在他的统治下，匈牙利人果断地将政治忠诚转向西方。来自巴伐利亚的德意志传教士补充了已在匈牙利人中间活动的希腊传教士，并于972年为盖萨本人施洗。然而，在与其他酋长争战以确立自己对匈牙利人的最高领导权时，他不惜采取一切手段来巩固地位。盖萨是个脾气暴躁的杀人者，如今已皈依基督教的他“将自己的怒火转向那些不情愿皈依的臣民，以强化这一信仰。就这样，他满怀着对上帝的热忱，洗刷了自己的旧罪。他既向全能的上帝献祭，也向各种虚假的神祇献祭。当司铎为此责备他时，他却辩称这种做法给他带来了财富和巨大的权势”。<sup class=\"fn\" data-note=\"7:18\">18</sup>如同许多被传教士纠缠的其他统治者一样，盖萨宁可要宗教的多元并存，也不愿弃绝旧的道路。基督教洗礼补充而非取代了传统崇拜。他似乎已认识到，匈牙利人承袭的宗教信仰与习俗同他们的认同和生活方式紧密相连，若将其抛弃，必将瓦解他所力图建立的一切。因此，盖萨提醒我们：洗礼本身并没有根除传统习俗，也没有改写过去。皈依基督教应被理解为不同宗教与文化体系之间一场漫长的遭遇与互动，而非凯旋式史学所暗示的一种体系对另一种体系的替换。</p>\n<p>在古代晚期，基督教领袖们已逐渐认识到，以洗礼为标志的基督教共同体成员身份不足以将基督徒与异教徒区别开来。他们开始移动标准，主张人类行为的一切形式都必须有独特性。“如果我们不照基督徒的方式行事，仅仅领受基督徒之名是不够的”，阿尔勒的凯撒利乌斯如此告诫他六世纪的听众。<sup class=\"fn\" data-note=\"7:19\">19</sup>于是，基督教逐渐成为一种日常道德的宗教；如前所述，它既关注日常生活的规律节律——劳作与崇拜、宴饮与斋戒、性事与禁欲的时辰——也关注生活中不可预测的危机，如发烧的孩子、瘸腿的马匹或恶劣的天气。因此凯撒利乌斯告诫其信众，面对疾病不可采用基督教以外的方式来应对。普罗旺斯那位农妇——喝草药汤剂以堕胎、带患病的孩子去找占卜者或精通草药的女人、或把书写的符咒挂在孩子脖子上——所依赖的做法，无疑世代相传、久经验效。求助于基督教司铎或圣人圣龛，只是她应对疾病与灾祸的若干治疗策略之一。然而对凯撒利乌斯而言，所有其他策略都是“魔鬼的诱惑”。<sup class=\"fn\" data-note=\"7:20\">20</sup>他要求听众抛弃其传统宇宙观——在那种宇宙观中，超自然与人通过形形色色的人物和场所相聚并互动——转而只寻求主教所认可者：教堂、圣徒和司铎。即便如此，去对的地方也还不够，因为他还告诉会众，在圣人圣龛外手舞足蹈乃是“以基督徒之身进入教堂，却以异教徒之身离开”。<sup class=\"fn\" data-note=\"7:21\">21</sup></p>\n<p>凯撒利乌斯为基督教设置了防疫线，从而在“正确”的基督教与“错误”的基督教之间划出了明确的界限。在界定这一区别时，他把从前针对非基督教习俗的谴责性修辞扩展到其受洗会众所做的任何令他不悦之事上。这种语言便是关于“迷信”与“谬误”的传统论战话语。“迷信”标志教会精英认为有害于其基督教羊群得救的任何行为。随着在人神之间充当媒介的人物、场所、仪式和言语逐渐尽入教会的规管要求之下，“迷信”便成了对任何逃脱此种控制、因而处于正确与错误基督教之间概念边界错误一侧之物的贬称。</p>\n<p>当拉班努斯·毛鲁斯宣称“基督教摧毁谬误”时，他把这些谬误界定为“偶像崇拜、贪婪及其他恶行”，而不屑于区分非基督教习俗与基督徒的不当行为。<sup class=\"fn\" data-note=\"7:22\">22</sup>对于错误的基督教，拉班努斯无疑有着大量直接经验。但对于偶像崇拜及其他非基督教习俗，他至多只有从阅读或与传教司铎的通信中获得的二手或三手知识。他的异教徒全在他心中，但这并未阻止他就如何处置他们高谈阔论。方法很清楚：那是君王的方法。作为美因茨大主教，拉班努斯与他的国王“德意志人”路易密切协作。君王之职在于协助教会人士根除谬误，这一点已由路易的祖父查理曼确立。得益于英语无法再现的一个词源关联，塞维利亚的伊西多尔那部流行的百科全书式手册《词源》将纠正臣民规定为君王的基本职责：Reges a regendo vocati... Non autem regit qui non corrigit（“王因统治而得名……不纠正者不为王”）。<sup class=\"fn\" data-note=\"7:23\">23</sup>这一点远不止于文字游戏：它勾勒出整套道德纲领。这一关于君王负有纠正宗教谬误之责的观念，先由伊西多尔同时代的伊比利亚哥特诸王转化为有力的立法纲领，一个半世纪后为查理曼所采纳，随后又传播到其治世理想所及之处，从而使基督教徒与异教徒之间的区分获得了新的意涵。像“德意志人”路易这样精力充沛的基督教君王，不仅在战场上“令异教蛮族屈膝”，还与其首要主教们紧密合作，向臣民灌输正确的基督教。在这样的环境中，边远地区的自行其是的基督教，无论对其践行者多么真切，都可能显得可疑。“迷信”与“谬误”取决于旁观者而非践行者的眼光，因为在整个中世纪早期，教会精英攫取了规定何为正确基督教的权利。拉班努斯·毛鲁斯的前任美因茨大主教之一，博尼法斯，曾在八世纪的第二个二十五年间旅行并传教于法兰克的莱茵兰、图林根和巴伐利亚。在这里，他遭遇的并非基督教与异教之间截然分明的边界，而是一系列习俗的光谱。其一端是他本人所受训练的那种规整的修道主义；另一端则是一些过于偏远、此前从未与</p>\n<p>基督教世界。然而，大多数人介于这两个极端之间——随和的主教，其价值观念更接近其贵族亲属而非苦修士；受洗的农民向基督教圣徒献祭，或试图从马粪中占卜未来；自行其是的基督徒甚至不知道自己的孩子在受洗时使用的是讹误的仪式祷文。到754年博尼法斯去世时，他已经运用凯撒利乌斯关于“迷信”的观念，将这一模糊的光谱简化为正确与错误基督教之间的鲜明概念对立。</p>\n<p>博尼法斯之所以重要，是因为他在制定正确基督教的规范以及鼓励统治者支持这些规范方面发挥了关键作用。随着八世纪下半叶欧洲广大地区迅速落入加洛林王朝统治之下，这些规范由与国王携手合作的主教们颁布并进一步阐发，而这些国王已将“纠正”的任务铭记于心。查理曼及其继承者竭力推行正确的基督教，而这种理想在晚期盎格鲁-撒克逊英格兰和奥托-萨利安王朝德意志所受到的热烈响应，确保了它长期保持影响力。到十一世纪初，我们发现“纠正”的任务甚至出现在欧洲的东部边缘——它体现在匈牙利国王伊什特万的立法之中。正确的基督教——自博尼法斯以来所界定的——正稳步走向成为唯一被允许的基督教。</p>\n<p>那么欧洲的最西端又如何呢？爱尔兰于五世纪基督教化，始终未受加洛林或奥托王朝政治或文化霸权的影响。爱尔兰的基督教早已使其组织模式适应了小规模王国以及围绕牲畜与亲缘关系的政治，并以对当地有意义的方式改造了圣经诫命。它只是中世纪早期众多基督教形态中的一种，而且证明了极为持久。但是，在那些认为只存在一种正确基督教的人眼中，到了十一世纪后期，爱尔兰的版本已显得十分怪异。1070年，征服者威廉任命了一位新的坎特伯雷大主教。兰弗朗克约于1010年出生于意大利旧都帕维亚，他既熟悉国王对基督教福祉的传统责任，也熟悉自十一世纪中叶以来逐渐形成的关于中央集权化、统一基督教的新理想。约1074年，兰弗朗克主动向爱尔兰至高国王、芒斯特国王托德尔巴赫·乌阿·布赖恩（1063–86年在位）指出，他的基督教是错误的那种。洗礼的施行方式不合兰弗朗克所认定的规范，婚姻不符合大陆教会人士制定的要求，主教的祝圣方式也与其他地方不同。托德尔巴赫必须“纠正”这些“骇人听闻的……做法”和“邪恶习俗”。<sup class=\"fn\" data-note=\"7:24\">24</sup> 爱尔兰人确实做出了回应，但进展缓慢，显然不足以消除他们执迷于谬误的印象。1155年，在十二世纪已然变化的氛围中——其变化源于普世教皇君主制主张的出现，以及此前数世纪众多地方基督教共同体融合为一个同质性更强的单一基督教世界——教皇阿德里安四世授权英格兰国王亨利二世（1154–89年在位）入侵爱尔兰，理由是“扩张教会的疆界，向仍未受教化而野蛮的民族昭示基督教信仰的真理，并将罪恶的杂草从主的田地里连根拔除”，这将使亨利获得永恒的荣光。<sup class=\"fn\" data-note=\"7:25\">25</sup> 由此，爱尔兰人几乎成了彻底的异教徒，被置于教会之外：他们缺乏正确的基督教，这为入侵和征服提供了正当理由。当多元的地方基督教形态在刀剑逼迫下让位于单一的、标准化的、规范化的基督教时，中世纪早期便真正终结了。</p>\n<h2 id=\"ch9-s2\">贤君与暴君</h2>\n<p>961年春，奥托一世准备踏上从德意志翻越阿尔卑斯山前往罗马的危险征程。作为准备的一部分，他让年仅六岁的儿子加冕为王，以确保万一自己不能生还能顺利继承。仪式于5月26日在查理曼在亚琛建造的宫殿礼拜堂中举行——正是二十五年前奥托本人在其统治之初受祝圣的同一地点。幼童——即未来的奥托二世——被涂上圣油，随后被授予象征性的剑、权杖和权杖杆，加冕，最后登基。仪式的言语、礼仪和姿态都有悠久的历史，与地点本身一样散发着传统的气息。在一个层面上，这是一场家族事务，因为主持祝圣的三位大主教中，一位是新王的叔父，另一位是他已成年的异母兄长，第三位则是另一名亲族。在另一个层面上，仪式将年幼与年长的两位奥托都紧密地与王国的显贵们联系在一起，这些人被正式询问是否愿意服从新王的统治、遵行他的命令。更为复杂的是，仪式将国王、王国与基督教上帝联系成一种紧密的纽带，因为奥托被问及：“你是否愿意依照你祖先的正义之道，统治并捍卫上帝赐予你的王国？”他以正式的誓言作答，承诺将在上帝的帮助及所有忠于他者的支持下如此行事。<sup class=\"fn\" data-note=\"7:26\">26</sup> 随着祝圣仪式的进行，它唤起了到十世纪末已发展成熟的基督教王权的一切复杂观念与意识形态。国王的角色应当是最勤勉的君王、敌人的征服者、教会与教士的守护者和保卫者。人们祈求上帝以“正义与虔敬的冠冕”为他加冕，赐他战胜一切有形与无形之敌的胜利，并赐予他丰收、健康、和平以及亲生继承人。人们还祈求上天的护佑，使臣服的民族保持忠诚、使权贵们安分平和。在仪式进行过程中，奥托听到自己被比作古以色列人的统治者——犹太-基督教圣经将这些领袖描绘为奉上帝之名征战、以正义与智慧统治、居间于上帝与人民之间的受膏君王。</p>\n<p>这其中蕴含着多重意义。奥托一世曾花费多年镇压由其至亲——他的兄弟、儿子和女婿——领导的严重叛乱，因此他试图将自己的亲属和臣民与他选定的继承人捆绑在一起。而祝圣仪式通过将一项政治决定转化为别的东西化解了这些紧张关系：它将年幼奥托的王权纳入了上帝所赋予、因而是“自然”的世界秩序之中。通过将新王与其他人分别开来，使他成为一个特别亲近上帝的人，它使人为的选择显得无可置疑。在一个暴力的世界里，它赋予了一个人颁布暴力的合法权利。总而言之，它使王权这一事实本身变得可以接受——即一个人对所有人的至高权力，这正是整个中世纪早期政治组织的基本形式。</p>\n<p>实际上，它不仅使王权变得可以接受，而且使之成为人们所渴望的。在仪式过程中，新统治者被告知等待着他的职责、道德责任与回报。这里有适用于每个人的内容。他应当是一位勇武的战士，教会与教士的护卫者，寡妇与穷人的保护者，王国中一切正义的源泉。为此，他既要通过击败基督教的敌人，又要通过教导和引导其臣民来弘扬基督教信仰。战争的目的在于带来和平——不仅是没有战争的消极意义，更是其更深刻的含义：一种以基督教原则和行动为根基的和谐社会秩序。这正是许多代法兰克统治者所奉行、洛尔施修道院僧侣在为日耳曼人路易祈祷时（见章首引文）所赞颂、并得到有权势者支持的那种尚武的基督教。这里同样是一位誓愿“纠正”其臣民的国王——通过促进上帝教会的福祉，并在“迷信”与“谬误”潜藏之处将其铲除。在这一切之中，主旨是“正义”一词，它超出了在诉讼中作出裁决的司法含义，涵盖实现那种正当社会秩序所必需的道德公平。因此，王权应当是国王与其教俗显贵臣属之间利益的汇聚，以造福王国中所有人——无论权贵还是穷人。于是，祝圣仪式便以宏伟的仪式华彩阐明了这一共识。</p>\n<p>为新国王诵念的祷文还暗示，履行这些职责将为统治者和王国带来和平、繁荣与子嗣这些神圣祝福。因此，尽责的国王——贤君——是那种视人类社会秩序为整个宇宙更大秩序之组成部分的世界观的关键支点。而既然到十世纪后期，这个宇宙早已在基督教的参照框架内被理解，它也要求贤君在这一社会秩序的愿景中发挥作用，其终极目标乃是所有人的永恒救赎。那么，统治者应当怀着为自己赢得“永恒福乐中的永世喜乐”的希望而行事。<sup class=\"fn\" data-note=\"7:27\">27</sup> 国王由此将当下与永恒联系起来。通过明确的圣经类比，他还将《旧约》的过去与奥托王朝的现在联结起来，成为受上帝护佑、以上帝之名施行统治的历代君主中的又一位。于是，祝圣仪式展演了关于人类与神圣、圣俗两界正当秩序的信仰。</p>\n<p>由于承载着浓重的政治、仪式和宇宙论意义，中世纪早期的国王登基典礼是一个高度特定的事件。作为宫廷政治日常纷争之中一场仪式明晰性的戏剧性插曲，它明确昭示：统治既是一项实践事业，也是一项意识形态事业。正因如此，它既使那些往往更为流动不居的观念变得清晰鲜明，又为衡量一位国王的成就设定了标准。让我们再看一眼奥托二世，因为史家梅泽堡的蒂特马尔对其统治所作的评判正说明了这一点。蒂特马尔亲身经历了奥托二世的统治，他将军事上的失败与基督教道德相联系，将臣民的状况与国王的境况相联系，以此作出评价：</p>\n<p>奥托，此名的第二位承继者……\n……被拥立登上其伟大父亲的宝座\n他帮助一切困苦之人，配得称颂。\n……\n他的青年时代幸福而顺遂，但悲哀在他晚年降临\n因我们罪孽的沉重重担。\n于是，这个邪恶的世界为拒斥真理而忏悔。<sup class=\"fn\" data-note=\"7:28\">28</sup></p>\n<p>在蒂特马尔看来，奥托二世因其臣民的罪而受苦：国王失去了好运，社会的正当秩序已然崩坏。</p>\n<p>奥托竭力维护的这些崇高的王权理想，是在查理曼及其直接继承者的统治时期，从更为古老的仪式传统和政治思想传统中臻于成熟的。它们之所以凝结成形，正是因为加洛林王朝所行使的前所未有的权力需要前所未有的正当化论证。查理曼的权力呈现为多种不同的形式——军事上的成功、对日常生活诸多方面进行规制的努力、通过对领地集约的经济开发和对贵族亲缘网络的娴熟操控而展现的强势领主权——所有这些对他的臣民都提出了巨大的要求。基督教王权的意识形态和仪式为此提供了验证，将人们的注意力从权力的严酷现实上转移开。通过强调宇宙秩序而非人的压迫，神圣的认可使臣服于如此强势的统治者变得可以接受。而且，它为国王们提供了一种无论多少财宝或战士都无法带来的权力形式，因为超自然的认可远比单纯的政治共识、父亲的指定或战场上的胜利更为有效的合法性来源。而当九世纪中叶以后，大主教们确立了一项角色——在他们看来是一项特权——即通过教会的膏立仪式向国王传达神圣认可时，基督教与王权的综合便告完成。得益于教士阶层的主动推动，中世纪早期的国王成为一个超越性的、明确的基督教社会秩序的象征中心。</p>\n<p>从九世纪中叶起，这一基督教秩序还明确地将国王的妻子纳入其中。一项缺乏圣经先例的创新——为王后祝圣的新仪式——赋予她在维护这一秩序中的正式角色。除了她有充分记载的宫廷职能——宫廷的内部事务管理不仅包括物资供应，还包括调控宾客与礼物的往来——王后还成为多产、繁荣与良好品行的一尊活的圣像。王后身份恰好在加洛林道德家们坚持对婚姻作出新的、更严格的界定并要求国王在自身生活中加以维护的那几十年里，变得既具有官方性质又明确基督教化，这绝非巧合。通过她作为终身唯一配偶和未来继承人指定母亲的新角色，王后的品行直接关系到其丈夫的名声。她性方面的贞洁提升他的声誉，并体现社会的正当秩序；她的端庄得体表明国王择她为妃的智慧；她的良言善劝使国王趋向仁慈；她的多产则印证丈夫的。反之，她的不育可能威胁政治稳定，并似乎是天谴的征兆；任何不当干政的迹象或性放荡的指控，都会损害并摧毁一位国王掌控局面的声誉、</p>\n<p>自身、家庭乃至整个社会。因此，祝圣赋予王后以公正统治的重任，并使她参与维护超验秩序的角色正式化。</p>\n<p>一旦以这些方式被赋予意识形态权力，便会带来额外的益处。保护教会同时意味着慷慨地资助它们。法兰克人的圣马丁墓、苏格兰人的圣哥伦巴墓、爱尔兰人的圣帕特里克墓——这些以及其他许多圣墓都享有源自王室的地产财富。作为回报，国王和王后获得了他们所供奉圣徒的强大精神庇佑。与此同时，教会和修道院也以其巨额地产财富以各种方式支持王权，如根特的圣彼得教堂的教士们为虔诚者路易所做的那样。皇家修道院在这些网络中也占有一席之地：它们本身是重要的土地所有者，是国王的女儿或寡妇的居所，也是为女赞助人及其家族进行代祷的来源。此外，教会将其可观的 法律与行政专才供王室驱使，从而将至少一部分晚期罗马的官僚技能与司法原则传给了中世纪早期的统治者。王室事务与教会事务的密切共生，正是中世纪早期基督教统治意识形态的实际体现。</p>\n<p>其必然结果之一是教士们乐于对国王训诫其职责。无论应王室之请还是出于自身主动，教士们撰写书信、论著和劝诫致予国王，或鼓励、或告诫、或斥责。而且有足够证据表明，至少有些国王确实听从并铭记这些建议。查理秃头就是这样一位国王，他是查理曼之孙，统治其帝国西部的三分之一。他也确实需要如此：他的统治是一场漫长的斗争，要应对与兄弟、侄子和儿子们的反复冲突、维京人劫掠带来的日益严峻的外部威胁，以及内部资源的日渐匮乏。此外，他还面临强势的贵族和自信的主教。其中最有力、最善表达的是兰斯的欣克马尔，他对国王义务的见解与其对婚姻义务的见解一样清晰。<sup class=\"fn\" data-note=\"7:29\">29</sup> 查理曾读过欣克马尔早先关于王权的一组评论，并就此向他提问，时间大约在873年。这位大主教以一篇题为《论国王之人与王者职分》的论著作答，他猜想其中言辞可能会让国王颇为恼火。其内容可以概括如下：基督教上帝立立国王，既允许恶王存在，也使善王成为可能。善王以正义统治，惩罚罪犯，保卫教会，审判公平，因而为其臣民带来福祉，赐予他们和平、丰饶的土地与富庶。相反，恶王带来的只有苦难、压迫、入侵和饥荒。在另一篇论著中，欣克马尔称这样的国王为暴君：尽管如此，他在宇宙秩序的整体中仍占有一席之地，因为上帝允许他统治，作为对其人民罪恶的惩罚。欣克马尔笔下的善王强大而充满活力，无论在战场上还是在法律上皆是如此。他实行道德上的自我克制，拒绝屈服于谄媚、偏袒或骄傲。谦卑是善治的根本前提，正义则是其日常体现。由此，国王成为臣民良好行为的典范。这完全可能与流血相容——如果战争能够保卫基督教，或者其臣民所犯的滔天罪行足以判处死刑。在欣克马尔看来，善治就是为整个基督教社会秩序的福祉而积极践行的道德。它是一种ministerium，一种职事：一种对他人负责任的服务义务。借助善王的统治，人类社会得以拥抱神启的和谐，国王则作为基督在世上的代理人进行统治。</p>\n<p>《论国王之人与王者职分》标志着中世纪早期王权思想发展的一个晚期且成熟的阶段。在这一传统中，来源各异的思想逐渐融合，但这部论著仍使我们能够确切辨识其构成要素，因为欣克马尔的写作方式是点明其文献来源并大量引用。由此，他揭示了他自己——以及许多其他中世纪早期思想家——关于权力的性质与运用的思想渊源。首先是《圣经》，既包括阐述古代以色列上帝、国王与人民之间关系的旧约诸书，也包括新约中基督及其追随者在罗马帝国境内关于社会与政治义务的教导。其次是古代晚期和中世纪极早期伟大的神学家和道德家。安布罗斯和奥古斯丁写作时，罗马帝国仍是一个强大的政治实体；大格列高利则既经历了东部拜占庭帝国持久的活力，也目睹了意大利稳定的瓦解。这些作者各自以独特的方式，将圣经思想与罗马人关于权力伦理和法律本质的强烈观念相结合。欣克马尔大量借鉴的第四位作者，他误认为是迦太基的居普良（卒于258年）。实际上，他是一位匿名的七世纪爱尔兰人，其思想是圣经、教父与爱尔兰本土智慧文献的迷人混合。</p>\n<p>尽管有过度简化之虞，我们仍可将中世纪早期关于善王与恶王的观念的起源定位于三种不同的文化传统：罗马的、圣经的和爱尔兰的。三篇致国王的劝诫文献，均成文于六世纪末至七世纪，有助于我们厘清它们各自的贡献。第一篇的作者是布拉加的马丁，收件人是苏维汇国王米罗（570—583年在位）。苏维汇人于409年定居伊比利亚西北部，在那里维持着一个独立王国，直到585年被其强大的哥特邻居吞并（见图0.2和8.2）。马丁的《诚实生活之规范》旨在为国王及其“协助其王者职分之人”提供简明的建议，并明确独立于基督教教义之外。他概述了应当指导国王一切行动的四种基本美德：审慎、精神的宽宏、自我克制与正义。如此，马丁强调了自我约束、合乎伦理的行为、为他人服务以及在一切事务中公正行事的必要。国王应避免恶行，成为他人“无可指责的匡正者”和良好行为的典范。所有这些观念都直接源自罗马哲学家塞涅卡（约公元前4年—公元65年）的著作；它们以这样或那样的方式，全部在欣克马尔致查理秃头的建议中重现。马丁这部质朴的论著在整个中世纪广受欢迎，这提醒我们罗马信念的持久遗产：自我克制的道德行为是行使统治他人之权的必要前提。<sup class=\"fn\" data-note=\"7:30\">30</sup></p>\n<p>第二条脉络，即圣经脉络，内容丰富、复杂，且被不断重新诠释。尽管如此，大格列高利601年致肯特国王埃塞尔伯特的信表明了它得以简明表述的一种方式，正如这里所适用的那样——针对一位刚刚接受基督教的军事领袖。格列高利简明的前提将整部圣经历史的要旨凝缩为一条不言自明的真理：“全能上帝兴起某些善人作为列国的统治者，以便借他们之手，将其公义的恩赐赐予他们所治理的众人。”这句话背后是对古代以色列宇宙观的认知：国王被视为神圣人物，受上帝保护，并通过祭司以油膏抹而祝圣。正如格列高利所暗示的，国王是神人之间的管道；他的善治带来上帝的恩赐——丰饶、繁荣与和平。在格列高利的思想中，这一古老前提引出某些必然推论。其一，埃塞尔伯特对上帝负有职责——推进基督教的传播，以身作则示范基督徒的行为，并通过“劝诫、震慑、诱导和纠正”来改变其人民的行为。<sup class=\"fn\" data-note=\"7:31\">31</sup> 其二，如果他这样做，上帝将以荣耀、显赫的名声以及许诺给基督徒的永生报偿他。在这里，国王是基督教政体的枢纽，同时对基督教上帝和自己的臣民负有义务。这是格列高利思想的核心，除这封信之外，他还在许多其他著作中表达了他对统治者职责的看法。这些著作的广泛流传，使他的思想也成为中世纪早期政治思想的共同财富；欣克马尔只是众多承认得益于格列高利贡献者中的一位。</p>\n<p>第三条脉络也许最出乎意料。我们在七世纪的一部论著《莫兰的遗嘱》中遇到它，这是爱尔兰智者、费里（fili）莫兰致国王费拉达赫·芬德·费赫特纳赫的一部训诫之作。两人都是传说人物，但这是以古爱尔兰语写成、面向国王的智慧文献的一个样本。莫兰的目的是向国王传达“正直之德，| 每位统治者必须具备”。<sup class=\"fn\" data-note=\"7:32\">32</sup> 他借其信使之口，向费赫特纳赫讲述fír flathemon，即“王者之正义”，这个词内涵丰富，意指融合了真理与正直的公平。</p>\n<p>告诉他，正是凭借统治者的正义，瘟疫和巨雷才远离人民。\n正是凭借统治者的正义，他审判大部落，裁决大财富。\n正是凭借统治者的正义，他赢得和平、安宁、喜悦、安逸与舒适。\n正是凭借统治者的正义，他派遣大军赴敌对邻邦的边境。\n正是凭借统治者的正义，每位继承人在其公正的继承地上竖起房柱。\n正是凭借统治者的正义，大森林中丰硕的果实得以品尝。\n正是凭借统治者的正义，大牲畜的产奶量得以维持。\n正是凭借统治者的正义，一切高大挺拔的谷物丰茂繁盛。<sup class=\"fn\" data-note=\"7:33\">33</sup></p>\n<p>莫兰进而详细阐明真正的统治者必须如何行事，以维护社会的正当秩序，并为人民赢得这些丰饶。他还提到了其对立面，即“非王”或篡位者，其统治充斥暴力与战争，与之相伴的则是“号角声声长鸣”。<sup class=\"fn\" data-note=\"7:34\">34</sup></p>\n<p>我们再次发现，王者的行为与人民的福祉、土地的丰饶，以及通过对外战争和对内善治维持和平密不可分。善治预设国王的“正义”将有效而公平地调节社会关系。这些观念属于基督教传入之前爱尔兰流行的更广泛传统的一部分，这些传统赋予国王极高的象征价值，视其为社会秩序与超自然秩序的化身。正如在古代以色列一样，国王被视为一种思维方式的核心：这种思维方式认为社会福祉不过是更广大世界——其土地、其气候、其统治者——福祉的一个侧面，并在政治失序与宇宙失谐之间画出紧密的类比。</p>\n<p>不出所料，《莫兰的遗嘱》因其以古爱尔兰语写成而始终不为爱尔兰以外所知。但它关于真王与非王的对照，以及关于国王“正义”之重要性的思想，渗透进一篇同样成文于七世纪爱尔兰的拉丁文论著中。这部论著从八世纪到十二世纪在英格兰和欧洲大陆被广泛阅读，通称《论世界的十二种弊害》。这正是欣克马尔认为是居普良所写的那部著作，他也全文引用了其中关于善王与恶王的界定。</p>\n<p>古代以色列、基督教之前的爱尔兰和九世纪的加洛林帝国当然都是截然不同的社会。然而，它们都拥有众多的国王，并将王制视为唯一可能的政治秩序。它们都以各自的方式假定超自然、尘世与社会之间的相互渗透，这一假定在每个文化中的表现形式各不相同。但它们共享一个前提：国王是这种相互作用的关键节点之一，其行为是神圣、自然与人类彼此影响的管道。正因如此，源自《旧约》和爱尔兰学问的关于王制本质的信念，得以顺利地从罗马帝国废墟中兴起的武士王国所吸收。即便早期讲日耳曼语的民族曾在宇宙论框架下看待其国王，四五世纪的巨大动荡与变革也早已使这种信念难以为继。取而代之的是，罗马基督教的遗产以及关于权力行使的古典伦理标准，提供了一个乐于吸纳其他关于善王与恶王的文本和思想的文化环境。</p>\n<p>这一融合早在罗马皇帝君士坦丁皈依基督教之后便已开始，而欣克马尔所借鉴的教父神学家们在其中功不可没。但关于王者职责的思考从未停滞不前，五世纪西罗马帝国的政治转型又提供了新的推动力。随着帝国让位于诸王国，以及基督教在这些王国中的传播，制定基督教王权规范的冲动变得不可抗拒。欣克马尔的数部关于王权的论著，正是这一漫长而缓慢过程的顶点。</p>\n<p>使欣克马尔如此重要的，不仅是他精深的政治思想和浩繁的著述。他还专长于创制王室礼仪</p>\n<p>以戏剧的形式来演绎他所信奉的政治神学。正是他精明的政治判断，将国王对其人民作出正式承诺的环节引入了加冕典礼；而且，比任何其他人都更重要的是，他规范了为国王和王后行膏油礼的传统。奥托二世以及后世许多以同样的话语和宗教仪式开启统治的中世纪统治者，都参与了一场神圣的戏剧，而这出戏剧在很大程度上是兰斯的辛克马尔丰富心灵的产物。虽然由大主教之手行加冕礼本身并不能造就一位好国王，但它确实造就了一位国王，并且确实教导他如何成为好国王。而对于已经结婚的统治者——不像年幼的奥托二世——他王后的加冕礼也使她卷入了维护良好统治的责任之中。</p>\n<p>这些理想对统治实践究竟产生了什么影响？它们无法取代来之不易的经验，更不是战场上免于失败灵药。毋宁说，它们的重要性在于确立了一种公认的衡量国王表现的标尺，并为批评提供了标准——无论批评者是心怀不满的世俗臣民、教士批评者，还是急于排挤对手的人。中世纪早期的国王之所以恶劣，并不仅仅因为他们狡诈、淫乱、无能或在战争中屡遭失败：当他们失去其世俗与教界主要臣民的尊重与合作时，他们才是恶劣的。简言之，恶劣的统治就是蓄意摧毁使治理得以运转的共识性伙伴关系。从宇宙论的角度看，这是对神圣秩序的败坏。</p>\n<p>恶劣统治可以表现为多种形式。其一是性与性别的层面。统治者的自我约束必须从控制自己的身体开始，以免“受欲望支配，[因]荒淫与通奸之罪[玷污其]荣耀之名于上帝与世人面前”。博尼法斯在746至747年间警告麦西亚国王埃塞尔鲍尔德（716–757年在位）说，这种行为“既是对上帝的羞辱，也毁掉了你在人间的声誉”。然而更为严重的指控是，埃塞尔鲍尔德竟将淫欲发泄在他本应保护的人身上——即他王国中修道院里献给上帝的修女：这种行为是“死亡的罗网、地狱的深坑和毁灭的漩涡”。<sup class=\"fn\" data-note=\"7:35\">35</sup> 相反，好的统治者“首先应以合理而有德行的纪律约束自己；其次约束他的妻子、儿女和家室；再次约束托付给他的人民”，而恶劣的国王则将缺乏自制与放荡的妻子结合在一起。“愚昧的妻子是家庭的毁灭、财富的耗竭、罪行的渊薮，以及一切邪恶与恶德的居所。”<sup class=\"fn\" data-note=\"7:36\">36</sup> 对王后通奸的指控成为攻击国王的武器，正如“虔诚者”路易与他美丽的皇后尤迪丝在830年代共同付出代价后所发现的那样。事实真相无关紧要，因为王后的贞洁已成为良好统治如此不可分割的组成部分，以致针对王后的暗示与指控便足以认定国王的恶劣。</p>\n<p>恶劣统治的另一种形式是采纳不良的忠告，或者根本不听取忠告。最好的建议来自上帝，正如《圣经》所阐明的。此外还有两条箴言：“审慎之人召集其他审慎之人共同商议，没有他们的建议便不采取行动；而愚昧之人独自思量，不经他人商议便仓促行其所欲。……在谋议中应遵守的第三条准则是：公正的统治者不应有奸诈邪恶的谋臣。谁会信任恶人的谋划呢？……善谋使国家上升，恶谋则将它压向毁灭性的灾难。”<sup class=\"fn\" data-note=\"7:37\">37</sup> 如果谋臣阻塞他人接近国王的途径——如“天真者”查理统治时期的哈加诺那样——或者出身于错误的社会阶层——如“胖子”查理的谋臣韦尔切利的柳特瓦德那样——他们便可能被斥为邪恶。其政治后果可能十分严重：洛林国王兹温提博尔德（895–900年在位）之所以被废黜，不仅因为他劫掠教会财产，还因为“他与地位低贱的男女共同处理王国事务，贬抑其较为尊贵高贵的追随者，并剥夺了他们的官职与尊严”。<sup class=\"fn\" data-note=\"7:38\">38</sup></p>\n<p>然而，最危险的恶劣统治形式，早在七世纪就已被伪西普里安所指出：即对正义的漠视。作为“十二种弊政”之一的“不义之王”羞辱其臣民，无视他们的权利与利益。这正是辛克马尔日后将要警告“秃头”查理的那种压迫性的暴政。但查理是以惨痛的代价吸取这一教训的，因为他早年统治过于严厉，以致858年其臣民揭竿而起，抱怨他的统治已沦为“暴政”——据称，他以“邪恶的残暴”摧毁他们的财产，并背弃他对人民立下的誓言与承诺。简言之，“所有人对他是否守信都已绝望”。<sup class=\"fn\" data-note=\"7:39\">39</sup> 他的反对者断言，查理的统治无视共同福祉，忽视了统治者与被统治者之间利益与目标平等一致的原则——而这一原则正是良好统治与成功治理的核心。</p>\n<p>对恶劣统治的指控会催生激烈的政治对抗；而出自史家笔端，则会使被指控者在后世声名扫地。梅泽堡的蒂特马尔——或为其提供消息的人——对丹麦国王“八字胡”斯韦恩（约987–1014年在位）这位基督徒毫无好感。他谴责这个丹麦人不仅因为他进攻英格兰，还因为他糟蹋自己的王国：他“不是统治者而是毁灭者……他以不断漂泊换取安稳，以战争换取和平，以流亡换取王国，以魔鬼换取天地之主上帝”。<sup class=\"fn\" data-note=\"7:40\">40</sup> 实际上，蒂特马尔把斯韦恩塑造成恶劣统治的一个典型形象，他在基督教宇宙论体系的败坏中展示了与好君主品质完全相反的特质。</p>\n<p>恶劣统治提醒我们，良好统治乃是一个极为精致的政治与意识形态建构。作为一种建立在义务、正义与自我约束之上的道德事业，它极大地受益于教会对社会世界正当秩序的构想，但它并非纯粹由教士的要素拼凑而成，因为王权太过根本，不能完全留给教会人士来界定。它始终植根于战争领导权的严酷现实之中，并以世俗精英的同意与合作为前提。没有这些，国王便无法行使职能：他将沦为无用之人，一个“不统治者”。因此，我们应当谨慎，不要以二元对立的方式思考——即认为教士有一套王权准则，俗人另有另一套。教会需要强大的武士国王来保卫他们的土地并传播基督教；贵族也乐于让王权的部分神圣光环沾染到自己身上。正义与自我约束的原则，对渴望提升自身地位的贵族而言，既是一种精明的政治策略，对国王而言，也是一部行为准则。</p>\n<p>毕竟，正如奥尔良的约纳斯、拉昂的阿达尔贝罗等人所强调的，基督教关于权力责任的伦理，已不仅适用于国王，也适用于构成统治精英的“权贵者”（potentes）。<sup class=\"fn\" data-note=\"7:41\">41</sup> 在其意识形态效力最强的时刻，王权预设了国王与其主要臣民之间公正行使权力的互补平衡：良好统治是植根于更广泛意义上的良好领主统治的社会秩序在意识形态与宇宙论上的抽象。没有人比阿达尔贝罗的同时代人、约克的伍尔夫斯坦更明白这一点——他关于市民社会崩溃与盎格鲁-撒克逊人道德堕落之间联系的名言，前文已经引用。<sup class=\"fn\" data-note=\"7:42\">42</sup> 大约在他痛斥盎格鲁-撒克逊精英、阐明自然灾害与社会失序之间关联的同一时期，他也尖锐地阐明了这同一关系中属于国王的那一面：</p>\n<p>为基督教的君王，\n极为相宜的是\n他处于父亲之位\n面对基督教的人民。\n在守望与护卫他们时\n做基督的代表，\n正如他所被称呼的那样。<sup class=\"fn\" data-note=\"7:43\">43</sup></p>\n<p>这些写于约1010年的诗句，总结了对基督教社会中王权的任务与性质长达数个世纪的思考。几年之后，伍尔夫斯坦进一步阐明了其中的基本逻辑：</p>\n<p>借由愚昧的君王，\n人民将变得悲惨，\n不止一次，而是屡屡，\n因其治理之失。\n借由君王的智慧，\n人民将蒙受福佑，\n繁荣昌盛，战无不胜。\n因此智慧的君王\n必须扩展和高举\n基督教与王国，\n而对异教，他当永远\n阻遏与憎恶。<sup class=\"fn\">44</sup></p>\n<p>中世纪早期将国王描绘为“基督代表”的利益汇合，在1020年代的英格兰与德意志达到了顶峰，但此后不久便不再能安然无争。1070年代，一场激烈的意识形态战争首先在德意志帝国爆发，继而蔓延至他处，争论的核心是国王与上帝及教士之间的适当关系。随之而来的是制度变革，到十二世纪末，改变了教士权威的行使方式以及实施王室司法的手段。约克的伍尔夫斯坦若泉下有知，定会觉得“基督代表”的角色竟被专属地归于教皇是何等奇怪；然而司法的行使始终是基督教王权的基石。另一方面，兰斯的辛克马尔则会在任何新君主的即位典礼上感到全然自在，因为用于奥托二世的加冕仪式文辞直接承袭自他的构想，并在之后许多世纪里仍是一个活的传统。</p>\n<p>在古典时代，“欧罗巴”指代已知世界三大洲之一。但在约500年至约1000年间的几个世纪里，这片大陆的大部分地区逐渐采纳了一种新的身份认同——基督教世界（Christendom），即所有受洗信奉基督与基督教上帝的信徒共同体。从地中海到北极圈的男男女女，如今有了共同之处。而且，正如任何群体认同的本质那样，基督教世界既相对于其内部成员、也相对于外部他者来界定自身。凭借有力的言辞与锋利的刀剑共同传播，基督教世界竭力压制关于世界的其他构想。作为信仰与价值观的核心主体，它影响了此后数个世纪欧洲乃至更广阔世界的历史。</p>\n<p>这些都是不言自明的。但中世纪早期出现的国王与基督教之间联盟的意义，比这更为深远。中世纪早期的基督教，与其说是穷人的（pauperes）宗教，不如说更是有权势者（potentes）的宗教。在古典时代，罗马帝国边界以外的欧洲居住着众多小民族及其脆弱易变的联盟。然而到千年纪末期，强大而持久的王国已在那里兴起。前几章已勾勒出其中的一些原因：基督教的影响对此有所补充，因为它提供了资源、基础设施、意识形态，以及——同样重要的是——身份认同。换言之，基督教带来了晚期罗马制度化权力的遗产：资源充足、意识形态上有理据，且具有宇宙论意义。</p>\n<p>在欧洲那些于五世纪从帝国官员手中转入武士国王之手而结构上少有破坏的地中海地区，基督教与统治权的结合早已根深蒂固。世俗与教会生活中行政与官僚体制的延续性助长了这一点。但即便在这里，基督教也为国王的统治带来了新的正当理由、新的任务与义务、新的可行使的权力。而当十世纪末十一世纪初法兰西南部和意大利的有效王权政府崩溃时，伦理性权力的理想与义务由教会加以维护和主张。与此同时，富有战斗性的基督教为西班牙北部的小王国提供了一个现成的正当理由，开始对伊比利亚半岛中部和南部的穆斯林军阀展开稳步的进攻。无论十一世纪末和十二世纪基督教世界的意识形态纷争与司法重组造成了多大的动荡，中世纪早期武士国王与基督教的联盟始终未受撼动。</p>", "text": "我们祈求您赐予路易国王永世的昌盛。\n我们祈求您赐予他生命、健康与胜利。垂听我们的祈祷！\n……\n我们祈求您钳制那固守残暴异教的蛮族。垂听我们的祈祷！\n我们祈求您使异教蛮族降卑。垂听我们的祈祷！1\n首先，我最亲爱的儿子，我如此劝勉、建议并恳求你：如果你想荣耀王冠，就应当以如此勤勉和精心的态度维护使徒传下的公教信仰，为上帝托付给你的一切臣民树立榜样，使教会的众子有理由称你为一位真正践行基督信仰的人。你要确切知道：若没有这一点，你既不能被称为基督徒，也不能被称为教会的儿子。而且，因为没有行为的信仰是死的，那些信心虚假或不以善功实践信仰的人，既不能荣耀地统治，也不能分享永恒的国度及其冠冕。2\n当洛尔施皇家修道院的修士们为他们的国王日耳曼人路易（840–876年在位）向基督教的上帝祈求“永世的昌盛……生命、健康与胜利”时，他们所呼唤的是一种已经历数百年形成的王权意识形态。君主与臣民共同的繁荣；基督教的保卫与传播；对敌人的胜利；维护法治——这些共同构成了中世纪早期关于国王角色以及基督教在政治与社会中之地位思考的核心。到十一世纪初，欧洲已发展出一种以神圣权力与世俗权力相融合为特色的文化，其特征是：国王与基督教的人员和机构密切合作进行统治，自称“基督自身的代理人”，3并主导推进他们各自对基督教社会的特殊愿景。到十一世纪初年已然成熟的基督教王权模式，在上面所引的劝诫手册中得到了生动体现，该书是匈牙利国王斯特凡（997–1038年在位）为其幼子所写。斯特凡向他的继承人提出了一个十点计划：国王本人要身体力行基督教信仰及其道德纲领，支持教会机构，并敬重教会人员。在这部简短而堪称典范的论著中，王权与基督教相互交织，既提供了一种强大的意识形态，也提供了一部实用的行为准则，以将未来的国王塑造成真正基督教的统治者。\n第7章所涉主要地点\n这样的劝诫可谓恰逢其时：教皇西尔维斯特二世于1000/1001年将祝祷与王冠赠予斯特凡，使他成为首位加冕的匈牙利人基督教国王。奥托三世也表示了认可，赠予他一柄圣矛的复制品——该圣矛是他的曾祖父从勃艮第的鲁道夫手中获得并作为基督教统治权标志而挥舞的。在那一刻，斯特凡跻身于基督教诸侯的等级秩序之中，而奥托作为皇帝居于其巅，行使着至高无上的权威。4然而仅仅一个半世纪之前，匈牙利人（在他们自己的语言中称为马扎尔人）还正是那“固守残暴异教的蛮族”——他们的袭扰曾令日耳曼人路易及其臣民极度恐惧，洛尔施的修士们曾为之祈求他们的败亡。他们从西亚草原上一群信奉萨满教和精灵崇拜的半游牧部落，转变为定居于喀尔巴阡山以西、凝聚成一个基督教王国的单一民族，其转变速度之快令人瞩目。值得注意的是，斯特凡于1000/1001年的加冕与膏立仪式，伴随着埃斯泰尔戈姆大主教区的建立，这种教会权威与基督教王权的共同制度化，常被视为匈牙利基督教王国的奠基时刻。此外，在其后数年间，斯特凡国王不仅为儿子撰写了劝诫手册，还颁布了两部法典，进一步强化王权、建立教会等级制度、推广基督教信仰，并铲除其基督教神职人员所不能接受的社会与宗教习俗。从这个角度看，他本人正是其子应当努力效仿的模范基督教统治者——这样一位国王，通过立法实现对真正基督教社会的愿景，让无数传教主教的梦想有了实现的可能。1083年，即他去世半个世纪后，当斯特凡被匈牙利主教们正式追认为圣人时，他作为国父的角色得以正式确立并被永久纪念。\n在匈牙利人斯特凡身上，我们看到了一种简洁的例证，说明国王如何居于中世纪早期宗教生活的中心，既培育基督教，又得益于这一宗教所反过来推崇的意识形态。本章将探讨将统治者与宗教联系起来的三个主题：国王在促进基督教传播、压制其他宗教认同方面所扮演的角色；基督教与其他中世纪早期宗教形态在实践与认知上的区别，以及统治者对于确保“正确的”基督教信仰实践所做的贡献；还有国王在中世纪早期关于人与神圣世界关系的理解中所处的地位。\n基督教的传播\n1038年斯特凡去世时，基督教已历经整整一千年。它在此前数个世纪的传播形成了独特的面貌。基督教在四、五世纪成为罗马世界的主流宗教时，便与帝国、其治理模式及其特有的社会文化形态达成了契合。事实上，它已根基稳固，以至于五世纪西罗马帝国政府的覆亡，也仅使基督教在那些因长期军事动荡与外族入侵而致整个罗马生活方式崩溃的有限区域内衰退或消失。在其他地区，尤其在罗马城本身，教士们接管了原本由国家履行的诸多治理职能。而在那些社会凝聚力和认同原本就越来越不依赖中央政府的行省，基督教团体及其领袖迅速调整自身以适应新王国的建立，在他们尚武的国王身上看到了他们昔日习于享受的帝国庇护下的保护与恩庇的可能。公元500年前后基督教的分布范围见图7.2。\n中世纪早期基督教的扩展范围\n到五世纪末，基督教的信仰实践已遍布罗马世界内外，以至于它的存在导致了选择的收窄。取古代宗教多元主义而代之的，是一种强制性——甚至是胁迫性——的基督教，其本质在于否认任何其他宗教的合法性。然而，七世纪中叶，阿拉伯征服者将新的伊斯兰教带入拜占庭帝国的亚非行省，这既使宗教间的概念边界更加固化，也极大地改变了其地理边界。面对阿拉伯人的进军，拜占庭帝国在七世纪失去了大部分非欧领土，而711年西班牙的被征服，使半岛只剩多山的北部仍在基督教控制之下。诚然，此后仍有广大的基督教团体处于伊斯兰统治之下，拜占庭也设法保住了小亚细亚的古代基督教城市，但从七世纪后期起，一条宗教边界实际上贯穿了地中海。这条边界既是宗教的，也日益成为文化与政治的边界，除微小波动外，一直保持不变直至十一世纪。它的存在以崭新而更加尖锐的方式界定了各种认同。\n在地中海以北，另一场同样深刻的地理变迁正在发生：帝国沿多瑙河、莱茵河以及横贯不列颠北部的旧边界，不再标志着基督教教会——其组织依照罗马行政模板、将帝国划分为教区与行省——的界限。如图7.2所示，从四世纪到七世纪，基督教传遍不列颠群岛的各个角落；八、九世纪间，它从莱茵河扩展到易北河；十世纪至十一世纪初，又从多瑙河延伸到第聂伯河和波罗的海。事实上，匈牙利只是千年之交新建立的几个基督教王国之一：波兰、波希米亚、丹麦、挪威以及基辅罗斯公国的统治者，都在970年至1030年的数十年间皈依了基督教。在遥远的北大西洋，甚至定居于冰岛的、已由维京人转为农民的社团，也在999/1000年集体决定皈依基督教。在中世纪早期，基督教“赢得了许多王国，战胜了最强大的君王，并以其自身的力量折断了傲慢者与尊贵者的颈项”。当乌得勒支主教拉德博德（899–917年在任）于十世纪初写下这些话时，他不可能知道这些话既是回顾，也是预言。5\n这一切是如何且为何发生的？中世纪早期基督教的三个显著特征有助于解释：它小规模的组织形式、多元的社会界定以及教义上的灵活性。就第一点而言，到约500年，基督徒已发展出相当标准的组织形式：地区性的崇拜团体（教区）由一位主教监管，主教对服务于地方教会的职业仪式专家（司铎）拥有管辖权。罗马主教——即教皇——被广泛尊为西方基督徒的最高领袖：他受到尊重，是出于敬意，因为正如下一章将说明的，在约1050年之前，他并不拥有管辖性的服从权威。当主教们联合行动时，是在地区层面，有时是在民族层面，而非普世层面。中世纪早期形成惯例：教皇认可新的大主教区（如埃斯泰尔戈姆）作为全国性或地区性的“超级主教区”而设立，但新教区的建立、新乡村教堂的修建与配备人员，均可视需要随处进行，无需教皇授权。此外，过独身生活的男女团体也聚居共处，在基督教扎根之处建立起修院。尽管在中世纪早期……\n中世纪时期，尽管这些形式往往趋于规范化为一种共同模式，大多数修道院仍然保持着自治。因此，就制度而言，基督教的组织方式仍然是分散的，并且很容易在任何地方被复制。\n在社会和教义层面，中世纪早期的基督教表现出相当大的流动性。关于“基督徒”究竟意味着什么，除了指一个通过接受洗礼这一入门仪式公开宣认这一身份的人，或由他人代其作出这种宣认的人之外，尚未形成共识。从神学上讲，这种宣认意味着此人对死后获得永生的可能性持开放态度。正如托莱多主教尤利安（680–90年在任）所断言的：“凡真正为基督徒者，绝不应怀疑一切已出生或将出生、已死亡或将死亡之人的肉体都将复活。”6 在这一点上，确实存在一致意见。然而，洗礼宣认的实际含义仍然模糊不清。对作为基督徒的更严格界定强调伦理行为、脱离世俗社会的纽带，以及对信仰的智性理解。在其最完整的意义上，基督教在寻求永恒救赎的过程中，将人类现世存在的所有方面都与神圣者联系起来。而其确切的教义含义也仍然是可以商榷的。在起源于巴勒斯坦之后的五百年里，该宗教的教导并未被系统化为一个意义无可争议的单一、连贯的教义体系。这种情况在中世纪早期也没有发生：辩论和著述其教义的人们在某些问题上观点一致，但在另一些问题上则不然。事实上，很少有人有资格或有意参与这类学术讨论——不过，对于一个出生时就在与世隔绝的乡村社区受洗、偶尔有一位几乎不识字的司铎到访的人来说，这些辩论本来也不会有任何意义。中世纪早期的“基督徒”身份无法用标准化的定义来界定。\n因此，在约1100年之前，基督教的组织方式是地方性的，却可以在任何地方复制。此外，对于作为基督徒意味着什么，存在着一系列不同的定义；对于教义的核心信条，也存在着各种不同的诠释。实际上，中世纪早期的基督教既没有中央集权，也没有系统化。它不是一个可以作为一个整体被采纳或拒斥的单一、统一的文化包裹，而是由一系列信仰、社会实践和组织形式构成的储备库，可以被零散地采纳和改造。因此，基督教从一个文化和政治语境跳到另一个语境，在保持其核心特征的同时，不断地变异和重塑自身。换句话说，一种公开宣称普遍性讯息的宗教，成功地在众多文化语境中实现了本地化。多元性和多种可能性始终是中世纪早期基督教的特征——或者更准确地说，是中世纪早期诸种基督教的特征——并使这一普世宗教得以呈现出无穷变化的本地形态。基督教由此强化了中世纪早期极具特色的地方主义。\n关于基督教传播的传统叙事并没有充分考虑这些地方性差异。它们讲述的是基督教从古代地中海权力中心向外扩散的故事，借助的是著名人物——皇帝、国王、传教士，有时甚至还有教皇——的活动。这种解释中蕴含着一整套关于何为规范基督教的时代错置的假设。当我们从基督教世界的边缘而非其中心出发来观察时，那些地方特殊性就变得明显得多。国王和传教士的问题我们稍后再来讨论。\n作为文化和经济交流地带，中世纪早期的边疆和罗马边疆一样具有渗透性。在旅行、贸易等日常活动中形成的跨境接触，可能成为基督教得以渗入的相遇或传播渠道。接待过往的商人、传教士或政治使节，提供了互动的契机，早在采纳基督教之前就产生了对这一宗教的一定程度的熟悉。因此，当法兰克人和丹麦人于811年在艾德河畔会盟宣誓和平时，双方使团各自“依照自己的仪式和习俗”宣誓，前者采用明确带有基督教色彩的誓词，后者则另有一套做法。7 马扎尔人提供了另一个例证：早在拜占庭和日耳曼传教士于十世纪来到他们中间之前，这个民族就已与基督教有过接触，因为在880年代初，希腊传教士美多德沿多瑙河穿过匈牙利领土往返于君士坦丁堡和斯拉夫诸地之间，并在那里受到其首领“以尊荣、隆重的礼节和喜悦”的接待，后者还向他馈赠了大量礼物。8 这类相遇属于长途旅行的世界，发生在精英和政治领袖层面。但地方性的跨境接触也可能促使其腹地出现基督徒社团。这或许可以解释为何在五、六世纪时，不列颠罗马边疆以北的怀特恩和阿伯康等地，或墨洛温高卢东部边缘之外的尼尔克海姆在八世纪初，会存在有组织的教会。\n贸易是有充分文献记载的了解另一种宗教的途径。毫无疑问，旅行至基督教世界之外的基督徒商人的祈祷和仪式偶尔会引起议论。然而记载更为清楚的，是非基督教商人在前往基督教地区贸易时的经历。九世纪，来自斯堪的纳维亚各商埠的商人在旅途中接触到了基督教。例如，海泽比这个波罗的海商埠的一些人曾在杜里斯特受洗。还有人记住了法兰克传教士主教安斯加尔（卒于865年）所宣讲教义的大意，以至于当瑞典人试图洗劫波罗的海东岸的阿普利亚定居点、而自己的神明不愿相助时，他们提议向基督教的上帝求助。\n另一种值得注意的基督教相遇与传播形式是跨境劫掠和掠奴。晚期罗马作家十分清楚，基督徒奴隶有时会将基督教传给掳获他们的人：最著名的例子是帕特里克，这位被爱尔兰劫掠者掳为奴隶的罗马—不列颠基督徒逃脱后，于五世纪的某个时候重返爱尔兰，向昔日的主人传教。在这方面，罗马帝国的政治解体并未带来任何改变，因为中世纪早期强权政体边缘普遍存在的掠奴活动，继续充当着宗教互动的渠道。值得注意的是，安斯加尔抵达比尔卡时，发现那里有相当数量的基督徒俘虏。一则840年代的故事揭示了这些人如何在欧洲边缘辗转流徙。芬坦是一名基督徒，是爱尔兰莱金地区一位小统治者的儿子，其亲族正忙于与邻近一位军阀争斗。为阻止进一步的报复，他的对手们施以诡计：他们邀请芬坦到海滩上赴宴，并安排附近的一伙维京人上演一场突袭将他掳走。芬坦被迅速地从一个维京人转卖到另一个维京人手中，直到他成为一名准备返乡者的财产，此人将他与其他俘虏一同装船运走。在返回斯堪的纳维亚途中，船员们在奥克尼群岛一座无人居住的小岛过夜，芬坦在那里设法逃脱。他发誓永不返乡，游到附近一座岛上安全之处，最后于881年在莱瑙阿尔卑斯山麓以隐士身份终老。\n边疆暴力最臭名昭著的形式当然是战争，而战争也以其自身的方式促进了基督教的传播。250年代，居住在克里米亚罗马边疆附近的哥特人经常袭掠黑海南岸的罗马一侧。有时他们带着基督徒俘虏归来，正是从这种不光彩的开端中，哥特人第一次接触到了基督教。一些哥特人皈依了；俘虏社团无疑将他们的信仰保持了好几代，直到340至350年代由帝国支持的乌尔菲拉传教团使哥特人转向当时帝国圈子中流行的基督教阿里乌派。9 另一种或许更为常见的情形，是从边疆民族掳获的俘虏和质子在帝国羁押期间接触基督教。查理曼对萨克森人的战争以血腥和坚不妥协地摧毁萨克森社会与宗教、以刀剑强制推行基督教而臭名昭著。10 一份805至806年的简短行政备忘录为我们记录了三十七名萨克森质子的姓名，他们被单独或成对地托付给阿拉曼尼亚的主教、修道院长和伯爵看管。他们的命运不得而知，但这些显然是重要到足以被留下一命的人物——为的是把他们改造成征服者皇帝的基督徒臣民。加洛林王朝和奥托王朝对异教敌人的许多其他成功战役，想必也以类似方式告终。\n从四世纪末起，基督教罗马帝国的边缘地带不仅是个体和小群体流动的区域，有时也是军队和整个民族迁移的区域。当军阀及其扈从队伍跨越边疆、在帝国内寻找新家园时，他们便发现自己定居在基督徒中间。有些人，如五世纪初定居于帝国内的哥特人和汪达尔人，原本就已是基督徒，尽管是阿里乌派基督徒。而对另一些人来说，皈依基督教是在迁入帝国之后才发生的。法兰克人在五世纪期间将其政治控制区和定居地扩展到高卢北半部时，必然与该地区根基深厚的城市基督徒社团以及现存的乡村社团有着广泛的接触。在这里，宗教的改变不是经由旅行者或传教士，而是经由日常生活的持续互动而来。通婚便是其中一方面：每当一名法兰克武士迎娶一位基督徒女子，这个家庭就成为宗教改变的焦点。在高卢和其他地方，基督徒妻子和母亲在传播其宗教方面的重要性无论如何估计都不为过。然而，只有王室层面的相关情况，现存证据才使我们能够多少详细地追踪这一过程。法兰克国王克洛维——他在（大概）508年接受基督教，使其成为对同时代人和后世都意义重大的标志性皈依者——早已娶了一位基督徒勃艮第公主。克洛蒂尔德坚持要给孩子们施洗，以及她对克洛维的个人影响，促成了他接受基督教的决定，并使她在后世传说中赢得“法兰西之母”的地位。从农庄到宫廷，家庭是宗教改变与文化涵化最有效的焦点之一——尽管也是文献记载最少的焦点之一。\n除了下莱茵地区之外，法兰克人逐渐适应基督教的过程并未对高卢—罗马基督教造成实质性破坏。如果说有什么影响的话，那反而是增强了教会领袖人物的影响力。然而在其他地方，军队和移民的流动往往造成更具破坏性的后果。到四世纪末，基督教已传遍不列颠，但当盎格鲁—撒克逊移民在五、六世纪跨过北海而来时，其制度组织在不列颠东南部全面崩溃。这里残存的基督教只以几个孤立的小据点形式存在，丧失了教士的领导。十世纪的多瑙河平原或许也发生了同样的情况，因为马扎尔人占据的该地区西部包括了根基稳固的基督徒社团，他们似乎将自己本土语言的宗教词汇传给了征服者。\n与这种缓慢的、几乎不见于史册的文化渗透相反，在新环境中启动基督教的政治冲击在史料中十分醒目。这构成了该宗教传播的第二种截然不同的方式：有权势的男女人物所采取的决定性行动，其影响往往是迅速而广泛的。无论是作为统治者皈依的叙事——追溯到皇帝君士坦丁（306–37年在位）的皈依——还是作为说服其配偶改变权力观念的王后们的叙事，抑或是服从基督诫命“你们要去使万民作我的门徒，奉父、子、圣灵的名给他们施洗”（《马太福音》28:19）的传道者的叙事，基督教的传播同时也是一部高层政治史，也是那些声名被基督徒社团恪尽职守地培育传承的人物的历史。\n作为一种王室行动，接受——或拒绝——新宗教，通常是在霸权政治的背景下发生的。宗主对小统治者施加影响的主张、小邦君主寻求强大邻国的支持，或仅仅是对效仿已被证明行之有效的成功为王之道的渴望，都发挥了各自的作用。传教士无论出于自身主动还是奉王命而行，都循着同样的沟通渠道移动，很少前往与其故乡即便间接也没有关联的地方。他们随身带来的有政治人脉、贵重的礼物、举行盛大仪式的经验，以及——同样重要的是——对成功皈依仪式的权威脚本的既有了解。\n在这种情况下，接受基督教带有精心安排的政治展演的一切特征。597/598年，当肯特国王埃塞尔伯特从奥古斯丁——一位在肯特的法兰克宗主的扶持下开展工作的罗马修士——那里接受基督教时，据称有一万人随之受洗。从人口统计上看这纯属荒谬，但\n富于修辞效果的形象表明，这是一个引人注目、具有直接意义的事件。845年，十四位波希米亚王公及其随从在日耳曼人路易位于雷根斯堡的宫廷接受洗礼，这一场面必定蔚为壮观。有时，宗主国王会为皈依的统治者充当教父，主持其身份的转变，并从洗礼盆前接纳他，借此借助洗礼确立一种尊卑等级。韦塞克斯的阿尔弗雷德在878年为其战败的敌人、维京首领古特鲁姆充当洗礼教父，便是这样的情形。王室的洗礼还可以旨在将未来的统治者纳入联盟：1000年奥托三世访问格涅兹诺期间，他成为基督教波兰王公“勇敢者”波列斯瓦夫（992–1025）新生儿子教父，这场仪式充满象征意义。他还通过赠予波列斯瓦夫一顶王冠和另一件圣矛复制品（至今仍可在克拉科夫看到）来巩固这一纽带。\n追问此类洗礼背后是宗教动机还是政治动机，本就是提错了问题，因为在一个身份认同既属社会又属个人、宗教表达通常更具共同体性质而非个人性质的年代，这种区分毫无意义。无论势微还是强大，统治者都需要以视觉上富有戏剧性的形式展演其与上级和下属之间的政治关系。事实上，国王只有在其显贵们的支持下方能行使职能。因此，对皈依的焦虑，或皈依后复又叛教的现象，乃是统治集团内部冲突的症状。在西北欧，接受或排斥新宗教之间的紧张关系可能反映了对宗主权的选择，或许也反映了统治精英中年长成员与年轻成员之间的冲突。616年肯特的埃塞尔伯特去世后，由其子兼继承者带领出现了一次向异教旧俗的回潮；而一个世纪之后，弗里西亚统治者拉兹博德（卒于719年）在被告知其异教祖先不会陪伴他进入基督教天堂后，竟从洗礼盆前退了出来。在此，集体身份问题是以生者与死者之间的社会凝聚力的方式表达的，但严酷的现实是，法兰克人的侵略在弗里西亚精英内部催生了冲突。\n九、十、十一世纪的中欧统治者在加洛林诸帝及其奥托继承者所支持的基督教与拜占庭皇帝的基督教之间面临抉择的额外困境。如第一章所强调，前者以拉丁语为圣礼语言，以罗马为正统乃至领导之所在；后者则愿意将当地土语用于礼仪用途，其管辖中心设于君士坦丁堡。这一选择必然也关乎政治利益，在东西两大帝国积极争夺盟友与影响力的数十年间，这一两难处境尤为尖锐。在多瑙河下游流域，保加尔人可汗鲍里斯（852–89）既是法兰克人也是拜占庭人的军事威胁和潜在盟友：双方都笼络他，力图对其施加影响。这正是鲍里斯决定皈依基督教并于864/5年受洗的背景。但政治与文化的取向仍是一个问题，鲍里斯与罗马和君士坦丁堡长期谈判之后，才于870年选择希腊基督教。大约一个世纪之后，新兴的匈牙利王国面临类似的压力。十世纪晚期，德意志和拜占庭传教士同时在马扎尔人中间活动：在斯提芬国王于教皇和奥托的主持下加冕之后的很长一段时间里，希腊教士依然活跃。\n我们应当简要回溯斯提芬的统治。他是一位基督教国王，统治着这样一群臣民：在这些人中间，传播基督教的地方性的、不为人注意也不引人注目的传教工作正在逐渐推进，并将长期继续，在随后的几十年里不时被异教暴动所打断。埃斯泰尔戈姆大主教区的建立之后，必须逐步建立起一个全国性基督教的建制性基础设施——一个主教网络、修道院的创建与捐赠（男女修士团体在其中过着有纪律的清修与祈祷生活）、对本地教士进行礼仪专长和拉丁语的培训。传统程序必须重新协商，以满足基督教教士对法律保护、特权地位以及永久保有土地赠予的期待。而且，还必须启动在传统马扎尔社会习俗与基督教教义的伦理要求之间进行漫长而缓慢的调适过程。在这一切之中，匈牙利 斯提芬的特殊之处仅在于其热心推行基督教所产生的文献记载，以及他行事之迅速。他的统治不过是将此前数个世纪中许多皈依国王所面临的问题，浓缩为一个记载详备的高速版本。\n实现这些目标需要时间和政治决心。在基督教的传播仍限于非正式接触的地区，建制化并未发生。在缺乏教士等级体系和完全的读写能力的情况下，我们看到一些即兴式的基督教生活方式，它们以其践行者自有意义的方式蓬勃发展，却往往遭到最终追上这些人群的传教士的怀疑或断然谴责。其中一人是弗里德堡，九世纪中叶生活在以非基督徒为主的瑞典人中间的一位基督教妇女。她知道有一种临终者啜饮葡萄酒的仪式（即临终圣体，由教士向临终者授予祝圣的酒，作为帮助基督徒灵魂升入天堂的仪式的一部分），于是买来葡萄酒备好，并嘱咐女儿在她临终时给她饮下。另一例是 Ørlygr Hrappson，一位挪威人，少年时代曾在赫布里底群岛由一位爱尔兰主教抚养。十世纪初，他前往冰岛，携带着建造教堂的木料、一本礼仪书，以及要埋在教堂角柱之下的“祝圣过的泥土”。这最后一项会使任何受过正确祝圣新教堂程序训练的人大为惊骇。Ørlygr 以盖尔圣徒科伦巴之名命名其教堂，三代之后，他的后裔仍“信仰科伦巴，尽管他们并未受洗”。11 这种“自己动手”式的基督教，是在缺乏有组织的教士阶层的情况下，宗教变革经由非正式接触渠道缓慢渗透的伴生物：尽管文献记载稀少，它必定在制度化基督教世界的边缘地带以及偏远的内陆角落蓬勃存在。\n无论我们把注意力集中于基督教以非正式还是正式方式的传播，我们都不断被提醒：宗教变革总是发生在社会情境之中，而这些情境往往也是政治性的。它影响到家庭和家户、宫廷、军队、商人社群，且对各者的影响方式各不相同、各具特色。尽管如此，仍可提出两点概括性意见。第一，如果中世纪早期的男男女女在接受新宗教时，将关于基督教教义“真理”的看法与政治或现实动机相权衡，我们并不会从他们自己的话语中听闻此事。诚然，虔信的基督教作者认为皈依者理应如此，有时也把他们描绘成这样做的，但宗教变革背后实际的理由对我们而言始终隐而不显。然而我们可以确信，对某些人而言，作出决定的必要性远比其他人更为迫切——对统治者（或反叛者）而言比对忠诚的追随者更为迫切，对父母而言比对子女更为迫切。第二，统治者及其随从的受洗，或者家庭层面对某些基督教习俗的采纳，都未必带来迅速而彻底的精神、道德和社会转型。如前几章所述，丧葬仪式、性行为、对疾病的应对以及其他诸多方面的转变确实发生了，但过程缓慢、反复无常，且极难强制推行。无论在地理还是时间维度上，我们都无法察觉一种均匀的推进：基督教的传播循着许多不同的路径与节律。它高度依赖于特定时空情境的不断变化的组合，对不同的人意味着不同的事物。总之，中世纪早期的基督教由地方性知识构成，而非普世的“真理”。\n异教徒与基督徒\n尽管中世纪早期欧洲的诸种基督教形态在组织、礼仪和社会实践上地方形式繁多，它们仍有许多共同之处。基督教世界观的中心是这样一种主张：唯有这一宗教提供了关于超自然（或神圣）、自然（或尘世）与人类（或社会）之间关系的唯一可能的真理。这些普世化的观念之所以吸引统治者及其谋士，是因为它们重构了共同体的观念，塑造了新的身份认同，指认了新的敌人，并为王权提供了新的正当性依据。随着反对基督徒与非基督徒对立的思维定式日益固化，在一切可能之处根除“谬误”便成了各地国王和教士的任务。由此，基督教改变了其采纳社会的想象图景。通过提供一套共有的普世价值，它为各社会提供了新的彼此联结的方式。通过许诺尚武的国王们以新的意识形态和交流方式，它鼓励他们走向共同的伦理乃至共同的目标。12 事实上，它如此成功地提供了一种包罗万象的伞状身份认同，以至于到十一世纪初，“基督教世界”与“欧洲”实际上已成为同义词。到第一个千年末，散居的犹太人社群构成了欧洲唯一重要的非基督教存在；他们受到忽视、容忍与敌意交织的暧昧对待，这考验着中世纪早期欧洲作为一个强制性基督教共同体的身份认同的边界。\n强制性基督教奠基于承自古代晚期的观念，即基督教不仅是普世宗教，而且还是唯一“正确”的宗教。在这种凯旋主义的视角下，基督教的传播常被描绘为对“错误”宗教的铲除。拉巴努斯 毛鲁斯一语道破：“基督教摧毁一切谬误。”13 这一修辞立场否认一切其他宗教的任何有效性。它们的神祇被径直重新定义为魔鬼，其道德教诲与崇拜实践被斥为堕落败坏。\n于是魔鬼及其仆从恶魔们……开始以各种形式向人类显现，与他们交谈，并要求他们向它们献祭，献于高山之上和繁茂的森林之中，并把它们当作上帝来崇拜。……有一个魔鬼自称朱庇特，他曾是一个魔法师，犯下如此多的通奸罪行，竟娶了自己的妹妹朱诺为妻，玷污了自己的女儿密涅瓦和维纳斯，甚至与他的甥女们及所有女性亲属犯下污秽的乱伦之罪。另一个魔鬼自称玛尔斯，他曾四处播撒争斗与不和。……还有一个魔鬼自以为维纳斯；她曾是娼妓，不仅参与无数通奸，甚至与父亲朱庇特和兄弟玛尔斯卖淫苟合。……这些魔鬼甚至诱使人们为他们建造神庙，在其中安放恶人的形象或塑像，并为他们设立祭坛，在坛上为他们倾洒牲畜乃至人的鲜血。14\n布拉加主教马丁（556–79）就这样颠倒了传统罗马诸神的宗教意涵，使其失去本性，并嘲讽任何宣称它们具有真实性的企图。他的观点在中世纪早期广泛流传，并以各种方式被重申。例如，八世纪末至九世纪，在德国富尔达传教据点附近施行洗礼时，接受基督的新皈依者要承诺“弃绝魔鬼托纳尔、沃坦和萨克森诺特的一切言行，以及所有与它们为伴的邪魔”。15\n基督徒处理本土神祇的另一种方式是否认其超人的地位。通过将诸神贬低为凡人，基督徒试图使与之竞争的神祇变得无害。温彻斯特主教丹尼尔（约705–44）曾就其在德国的一次布道使命向博尼法斯提出如下建议：“你不应当在诸神的谱系问题上与他们争论，尽管那些神是虚假的，而应任由他们按照自己的信仰宣称一些神由另一些神通过男女交合所生，这样你便至少可以表明，以人类方式诞生的男女神明是人而非神，并且由于他们此前并不存在，故有其开端。”16 如此被贬至人的地位后，诸神可能发现自己被放逐到遥远的过去。沃坦是受崇拜最广的日耳曼神祇之一，便遭遇了这一命运，尤其在各个盎格鲁-撒克逊民族之中。在基督教传教士将宗教引入英格兰南部两个半世纪之后，沃坦已从神贬黜为王室王朝的创业始祖，从诸王的原始缔造者降为亚当的后裔——而按照圣经传统，亚当是由犹太-基督教上帝所创造的第一个人类。在别处——尤其是爱尔兰、冰岛和斯堪的纳维亚——史诗、萨迦和神话常常使这些形象在文学的来世中又存活了许多个世纪，透过漫长的基督教经验过滤了对异教过去的呈现。\n从五世纪起，基督教的对抗性修辞还将除犹太人之外的所有非基督徒一概而论，以贬抑的方式将其斥为“异教徒”（pagans）。当然，从来不会有人以此作为自我认同的称谓。这一用语的使用遮蔽了中世纪早期欧洲本土宗教传统的丰富多样性，以及\n蓄意遮蔽了对其实际性质的任何理解。在评估这一点时，我们必须谨慎行事。罗马世界诸非基督教宗教的信奉者的思想和声音，有时以文字形式直接流传至今，而对于中世纪早期那些非基督徒的男女，却不存在任何可与之相比的途径来探知其宗教态度或经验，因为正如第一章已阐明的，除简短刻划的铭文之外，书写文化乃是基督教的引入物。我们只能依赖可能具有宗教意义的物质遗存、语言痕迹（例如地名），或基督教作家所记述的非基督教信仰与习俗。\n尽管如此，只要谨慎从事，我们仍可大致勾勒出基督教传教士在罗马世界以外所遭遇的那些传统宗教形态的轮廓。与犹太教、基督教或伊斯兰教不同，它们无一依赖于圣典文本的集成、先知传统，或对独一普遍神祇的认信。它们没有任何需要捍卫的教义与正统，也没有表达“宗教”这一复杂抽象概念词语。它们并非围绕一位全能的人物、甚至一对对立的二元神祇来安排宇宙，而是认为宇宙中栖居着无数精灵，这些精灵既影响凡间事务，又可为人所操纵。从最深的地底到最遥远的星辰，自然与超自然、形体与精灵无处不在地相互交织、相互作用。在这一框架之内，人类的位置通过神话、仪式、神圣知识的储备，或萨满、占卜者、德鲁伊等从业者的活动而得以确立。它们的仪式还提供了理解和试图掌控生死、生育与疾病、战争与繁荣等根本性力量的途径。通过献祭安抚神灵与精灵、以护符和避邪物对其进行约束或召唤；借助占卜等手段预测未来；以及通过禁忌规约人的行为——这些似乎都是普遍存在的。因此，神圣活动与人类生存的其他方面——家族的、家宅的、农业的、政治的、军事的——如此紧密地纠缠在一起，以致任何把“宗教”视为一种独立经验范畴的尝试都归于徒劳。\n尽管有上述概括，而且尽管存在若干神祇（如日耳曼人的沃坦）表面上广泛流行的崇拜，宗教传统在很大程度上仍然关乎地方认同，无论这种认同属于群体还是地域。许多地域上的具体情形已无从考知，尤其是因为我们对某些地区宗教传统的了解远胜于其他地区。但显而易见的是，一位神祇可能是武士精英的始祖；一棵古树之类的自然景物可能凝结着一个共同体的本质；一处圣地可能是一个政体的礼仪中心或献祭之所。因此，七世纪的伦巴德人相信，当沃坦允诺“长须之人”伦巴德人在战斗中获胜时，他们便得到了自己的族名；而爱尔兰南端则由“牛犊女神之家”科库·洛伊格德（Corcu Loígde）统治。德意志地区的洛马奇（Lommatsch）得名于一处圣泉，当地民众崇奉它，因为它能通过撒出小麦、燕麦和橡子来宣告和平与丰收以预言未来，但“当战争的狂风暴雨威胁时，它便以血与灰烬清楚地预示结局”。17八世纪的弗里西亚人栖居于北海沿岸潮汐沼泽之上的人工高丘（terpen）中，他们在涨潮的力量中辨认出一位需要以人祭加以安抚的神。与此形成对照的是，在983年推翻奥托王朝统治之后的那个世纪里，柳蒂齐斯拉夫人将其对德意志统治者及其宗教的抵抗组织起来，围绕其主神殿——里德戈斯特圣区中的斯瓦罗齐茨神祠。\n考古学有助于充实这一粗略的描述。尤其在斯堪的纳维亚和中北欧，人们发现了仪式性献祭的痕迹——动物、人类、武器——有时见于专门的祭祀围场，有时则作为祭品 deposited 于沼泽、湖畔或树木周围。物质遗存与文字记载同样证实，神圣区域内还可以设有木制或石制的柱状偶像，但人形的神像仅发现于斯堪的纳维亚南部和西斯拉夫地区。诸如丹麦尼达姆遗址及其四、五世纪大批武器和船只的祭祀沉积；奥尔登堡（今德国波罗的海沿岸的一座斯拉夫要塞）出土的神祇小像和十世纪马祭的遗存；以及瑞典北部岛屿祭祀中心弗勒瑟岛上堆积在树干周围的十至十一世纪动物遗骸——这些发现都生动地提醒我们，基督教终将摧毁的那些信仰与习俗曾经存在。\n由于现代学者无法通过内部的文字证据来研究这些本土宗教形态，严格说来，它们属于史前状态。但不应因此假定它们是超历史的。它们随时间演变的方式确实可以被察觉，尤其是通过与邻近霸权文化或基督教的互动。前基督教时期爱尔兰人发明的欧甘字母便是已遇到的一个例子。在五、六世纪，定居于不列颠的盎格鲁-撒克逊人可能已开始使用专门的崇拜建筑，或是接管旧的罗马神庙和教堂，或是刻意模仿而自建木构圣所。在十世纪末和十一世纪初的丹麦，如尼石碑有时会以措辞透露出基督教影响的套语召唤雷神托尔的力量。而丹麦人的邻居柳蒂齐人并非一直在神庙中礼拜，其境内也并非一直由某一圣所凌驾于其他圣所之上：随着对德意志统治的反抗日益强硬，他们的本土宗教获得了一种模仿对手宗教的结构与组织。就政治权力与神圣权力的相互强化而言，没有比基督教更好的样板了。\n本土宗教传统回应邻近基督教的影响，本不足为奇，因为中世纪早期边界的可渗透性已有所论述。在实践中，宗教信仰与习俗从来不是密封隔绝的体系，而是在与其更广阔的社会环境的创造性互动、涵化或对抗中发展起来的。因此，无论基督教真理与异教谬误之间凯旋式的对立多么鲜明，这一概念上的二分法通常并不渗透于日常的宗教经验——对于那些被专门鼓动去击败异教徒的基督教军队则属例外。就多数情形而言，个人的现实处境并不符合传教士意识形态所描绘的图景，即皈依基督教是一种彻底的个人转向，伴随着对前基督教过去的完全弃绝。\n关于皈依君主的叙事常常清楚地表明这一点：我们可以回到匈牙利来说明。国王伊什特万的父亲盖萨（约970—997年在位）在匈牙利人正处于拜占庭与德意志两大帝国之间抉择的时刻掌权；在他的统治下，匈牙利人果断地将政治忠诚转向西方。来自巴伐利亚的德意志传教士补充了已在匈牙利人中间活动的希腊传教士，并于972年为盖萨本人施洗。然而，在与其他酋长争战以确立自己对匈牙利人的最高领导权时，他不惜采取一切手段来巩固地位。盖萨是个脾气暴躁的杀人者，如今已皈依基督教的他“将自己的怒火转向那些不情愿皈依的臣民，以强化这一信仰。就这样，他满怀着对上帝的热忱，洗刷了自己的旧罪。他既向全能的上帝献祭，也向各种虚假的神祇献祭。当司铎为此责备他时，他却辩称这种做法给他带来了财富和巨大的权势”。18如同许多被传教士纠缠的其他统治者一样，盖萨宁可要宗教的多元并存，也不愿弃绝旧的道路。基督教洗礼补充而非取代了传统崇拜。他似乎已认识到，匈牙利人承袭的宗教信仰与习俗同他们的认同和生活方式紧密相连，若将其抛弃，必将瓦解他所力图建立的一切。因此，盖萨提醒我们：洗礼本身并没有根除传统习俗，也没有改写过去。皈依基督教应被理解为不同宗教与文化体系之间一场漫长的遭遇与互动，而非凯旋式史学所暗示的一种体系对另一种体系的替换。\n在古代晚期，基督教领袖们已逐渐认识到，以洗礼为标志的基督教共同体成员身份不足以将基督徒与异教徒区别开来。他们开始移动标准，主张人类行为的一切形式都必须有独特性。“如果我们不照基督徒的方式行事，仅仅领受基督徒之名是不够的”，阿尔勒的凯撒利乌斯如此告诫他六世纪的听众。19于是，基督教逐渐成为一种日常道德的宗教；如前所述，它既关注日常生活的规律节律——劳作与崇拜、宴饮与斋戒、性事与禁欲的时辰——也关注生活中不可预测的危机，如发烧的孩子、瘸腿的马匹或恶劣的天气。因此凯撒利乌斯告诫其信众，面对疾病不可采用基督教以外的方式来应对。普罗旺斯那位农妇——喝草药汤剂以堕胎、带患病的孩子去找占卜者或精通草药的女人、或把书写的符咒挂在孩子脖子上——所依赖的做法，无疑世代相传、久经验效。求助于基督教司铎或圣人圣龛，只是她应对疾病与灾祸的若干治疗策略之一。然而对凯撒利乌斯而言，所有其他策略都是“魔鬼的诱惑”。20他要求听众抛弃其传统宇宙观——在那种宇宙观中，超自然与人通过形形色色的人物和场所相聚并互动——转而只寻求主教所认可者：教堂、圣徒和司铎。即便如此，去对的地方也还不够，因为他还告诉会众，在圣人圣龛外手舞足蹈乃是“以基督徒之身进入教堂，却以异教徒之身离开”。21\n凯撒利乌斯为基督教设置了防疫线，从而在“正确”的基督教与“错误”的基督教之间划出了明确的界限。在界定这一区别时，他把从前针对非基督教习俗的谴责性修辞扩展到其受洗会众所做的任何令他不悦之事上。这种语言便是关于“迷信”与“谬误”的传统论战话语。“迷信”标志教会精英认为有害于其基督教羊群得救的任何行为。随着在人神之间充当媒介的人物、场所、仪式和言语逐渐尽入教会的规管要求之下，“迷信”便成了对任何逃脱此种控制、因而处于正确与错误基督教之间概念边界错误一侧之物的贬称。\n当拉班努斯·毛鲁斯宣称“基督教摧毁谬误”时，他把这些谬误界定为“偶像崇拜、贪婪及其他恶行”，而不屑于区分非基督教习俗与基督徒的不当行为。22对于错误的基督教，拉班努斯无疑有着大量直接经验。但对于偶像崇拜及其他非基督教习俗，他至多只有从阅读或与传教司铎的通信中获得的二手或三手知识。他的异教徒全在他心中，但这并未阻止他就如何处置他们高谈阔论。方法很清楚：那是君王的方法。作为美因茨大主教，拉班努斯与他的国王“德意志人”路易密切协作。君王之职在于协助教会人士根除谬误，这一点已由路易的祖父查理曼确立。得益于英语无法再现的一个词源关联，塞维利亚的伊西多尔那部流行的百科全书式手册《词源》将纠正臣民规定为君王的基本职责：Reges a regendo vocati... Non autem regit qui non corrigit（“王因统治而得名……不纠正者不为王”）。23这一点远不止于文字游戏：它勾勒出整套道德纲领。这一关于君王负有纠正宗教谬误之责的观念，先由伊西多尔同时代的伊比利亚哥特诸王转化为有力的立法纲领，一个半世纪后为查理曼所采纳，随后又传播到其治世理想所及之处，从而使基督教徒与异教徒之间的区分获得了新的意涵。像“德意志人”路易这样精力充沛的基督教君王，不仅在战场上“令异教蛮族屈膝”，还与其首要主教们紧密合作，向臣民灌输正确的基督教。在这样的环境中，边远地区的自行其是的基督教，无论对其践行者多么真切，都可能显得可疑。“迷信”与“谬误”取决于旁观者而非践行者的眼光，因为在整个中世纪早期，教会精英攫取了规定何为正确基督教的权利。拉班努斯·毛鲁斯的前任美因茨大主教之一，博尼法斯，曾在八世纪的第二个二十五年间旅行并传教于法兰克的莱茵兰、图林根和巴伐利亚。在这里，他遭遇的并非基督教与异教之间截然分明的边界，而是一系列习俗的光谱。其一端是他本人所受训练的那种规整的修道主义；另一端则是一些过于偏远、此前从未与\n基督教世界。然而，大多数人介于这两个极端之间——随和的主教，其价值观念更接近其贵族亲属而非苦修士；受洗的农民向基督教圣徒献祭，或试图从马粪中占卜未来；自行其是的基督徒甚至不知道自己的孩子在受洗时使用的是讹误的仪式祷文。到754年博尼法斯去世时，他已经运用凯撒利乌斯关于“迷信”的观念，将这一模糊的光谱简化为正确与错误基督教之间的鲜明概念对立。\n博尼法斯之所以重要，是因为他在制定正确基督教的规范以及鼓励统治者支持这些规范方面发挥了关键作用。随着八世纪下半叶欧洲广大地区迅速落入加洛林王朝统治之下，这些规范由与国王携手合作的主教们颁布并进一步阐发，而这些国王已将“纠正”的任务铭记于心。查理曼及其继承者竭力推行正确的基督教，而这种理想在晚期盎格鲁-撒克逊英格兰和奥托-萨利安王朝德意志所受到的热烈响应，确保了它长期保持影响力。到十一世纪初，我们发现“纠正”的任务甚至出现在欧洲的东部边缘——它体现在匈牙利国王伊什特万的立法之中。正确的基督教——自博尼法斯以来所界定的——正稳步走向成为唯一被允许的基督教。\n那么欧洲的最西端又如何呢？爱尔兰于五世纪基督教化，始终未受加洛林或奥托王朝政治或文化霸权的影响。爱尔兰的基督教早已使其组织模式适应了小规模王国以及围绕牲畜与亲缘关系的政治，并以对当地有意义的方式改造了圣经诫命。它只是中世纪早期众多基督教形态中的一种，而且证明了极为持久。但是，在那些认为只存在一种正确基督教的人眼中，到了十一世纪后期，爱尔兰的版本已显得十分怪异。1070年，征服者威廉任命了一位新的坎特伯雷大主教。兰弗朗克约于1010年出生于意大利旧都帕维亚，他既熟悉国王对基督教福祉的传统责任，也熟悉自十一世纪中叶以来逐渐形成的关于中央集权化、统一基督教的新理想。约1074年，兰弗朗克主动向爱尔兰至高国王、芒斯特国王托德尔巴赫·乌阿·布赖恩（1063–86年在位）指出，他的基督教是错误的那种。洗礼的施行方式不合兰弗朗克所认定的规范，婚姻不符合大陆教会人士制定的要求，主教的祝圣方式也与其他地方不同。托德尔巴赫必须“纠正”这些“骇人听闻的……做法”和“邪恶习俗”。24 爱尔兰人确实做出了回应，但进展缓慢，显然不足以消除他们执迷于谬误的印象。1155年，在十二世纪已然变化的氛围中——其变化源于普世教皇君主制主张的出现，以及此前数世纪众多地方基督教共同体融合为一个同质性更强的单一基督教世界——教皇阿德里安四世授权英格兰国王亨利二世（1154–89年在位）入侵爱尔兰，理由是“扩张教会的疆界，向仍未受教化而野蛮的民族昭示基督教信仰的真理，并将罪恶的杂草从主的田地里连根拔除”，这将使亨利获得永恒的荣光。25 由此，爱尔兰人几乎成了彻底的异教徒，被置于教会之外：他们缺乏正确的基督教，这为入侵和征服提供了正当理由。当多元的地方基督教形态在刀剑逼迫下让位于单一的、标准化的、规范化的基督教时，中世纪早期便真正终结了。\n贤君与暴君\n961年春，奥托一世准备踏上从德意志翻越阿尔卑斯山前往罗马的危险征程。作为准备的一部分，他让年仅六岁的儿子加冕为王，以确保万一自己不能生还能顺利继承。仪式于5月26日在查理曼在亚琛建造的宫殿礼拜堂中举行——正是二十五年前奥托本人在其统治之初受祝圣的同一地点。幼童——即未来的奥托二世——被涂上圣油，随后被授予象征性的剑、权杖和权杖杆，加冕，最后登基。仪式的言语、礼仪和姿态都有悠久的历史，与地点本身一样散发着传统的气息。在一个层面上，这是一场家族事务，因为主持祝圣的三位大主教中，一位是新王的叔父，另一位是他已成年的异母兄长，第三位则是另一名亲族。在另一个层面上，仪式将年幼与年长的两位奥托都紧密地与王国的显贵们联系在一起，这些人被正式询问是否愿意服从新王的统治、遵行他的命令。更为复杂的是，仪式将国王、王国与基督教上帝联系成一种紧密的纽带，因为奥托被问及：“你是否愿意依照你祖先的正义之道，统治并捍卫上帝赐予你的王国？”他以正式的誓言作答，承诺将在上帝的帮助及所有忠于他者的支持下如此行事。26 随着祝圣仪式的进行，它唤起了到十世纪末已发展成熟的基督教王权的一切复杂观念与意识形态。国王的角色应当是最勤勉的君王、敌人的征服者、教会与教士的守护者和保卫者。人们祈求上帝以“正义与虔敬的冠冕”为他加冕，赐他战胜一切有形与无形之敌的胜利，并赐予他丰收、健康、和平以及亲生继承人。人们还祈求上天的护佑，使臣服的民族保持忠诚、使权贵们安分平和。在仪式进行过程中，奥托听到自己被比作古以色列人的统治者——犹太-基督教圣经将这些领袖描绘为奉上帝之名征战、以正义与智慧统治、居间于上帝与人民之间的受膏君王。\n这其中蕴含着多重意义。奥托一世曾花费多年镇压由其至亲——他的兄弟、儿子和女婿——领导的严重叛乱，因此他试图将自己的亲属和臣民与他选定的继承人捆绑在一起。而祝圣仪式通过将一项政治决定转化为别的东西化解了这些紧张关系：它将年幼奥托的王权纳入了上帝所赋予、因而是“自然”的世界秩序之中。通过将新王与其他人分别开来，使他成为一个特别亲近上帝的人，它使人为的选择显得无可置疑。在一个暴力的世界里，它赋予了一个人颁布暴力的合法权利。总而言之，它使王权这一事实本身变得可以接受——即一个人对所有人的至高权力，这正是整个中世纪早期政治组织的基本形式。\n实际上，它不仅使王权变得可以接受，而且使之成为人们所渴望的。在仪式过程中，新统治者被告知等待着他的职责、道德责任与回报。这里有适用于每个人的内容。他应当是一位勇武的战士，教会与教士的护卫者，寡妇与穷人的保护者，王国中一切正义的源泉。为此，他既要通过击败基督教的敌人，又要通过教导和引导其臣民来弘扬基督教信仰。战争的目的在于带来和平——不仅是没有战争的消极意义，更是其更深刻的含义：一种以基督教原则和行动为根基的和谐社会秩序。这正是许多代法兰克统治者所奉行、洛尔施修道院僧侣在为日耳曼人路易祈祷时（见章首引文）所赞颂、并得到有权势者支持的那种尚武的基督教。这里同样是一位誓愿“纠正”其臣民的国王——通过促进上帝教会的福祉，并在“迷信”与“谬误”潜藏之处将其铲除。在这一切之中，主旨是“正义”一词，它超出了在诉讼中作出裁决的司法含义，涵盖实现那种正当社会秩序所必需的道德公平。因此，王权应当是国王与其教俗显贵臣属之间利益的汇聚，以造福王国中所有人——无论权贵还是穷人。于是，祝圣仪式便以宏伟的仪式华彩阐明了这一共识。\n为新国王诵念的祷文还暗示，履行这些职责将为统治者和王国带来和平、繁荣与子嗣这些神圣祝福。因此，尽责的国王——贤君——是那种视人类社会秩序为整个宇宙更大秩序之组成部分的世界观的关键支点。而既然到十世纪后期，这个宇宙早已在基督教的参照框架内被理解，它也要求贤君在这一社会秩序的愿景中发挥作用，其终极目标乃是所有人的永恒救赎。那么，统治者应当怀着为自己赢得“永恒福乐中的永世喜乐”的希望而行事。27 国王由此将当下与永恒联系起来。通过明确的圣经类比，他还将《旧约》的过去与奥托王朝的现在联结起来，成为受上帝护佑、以上帝之名施行统治的历代君主中的又一位。于是，祝圣仪式展演了关于人类与神圣、圣俗两界正当秩序的信仰。\n由于承载着浓重的政治、仪式和宇宙论意义，中世纪早期的国王登基典礼是一个高度特定的事件。作为宫廷政治日常纷争之中一场仪式明晰性的戏剧性插曲，它明确昭示：统治既是一项实践事业，也是一项意识形态事业。正因如此，它既使那些往往更为流动不居的观念变得清晰鲜明，又为衡量一位国王的成就设定了标准。让我们再看一眼奥托二世，因为史家梅泽堡的蒂特马尔对其统治所作的评判正说明了这一点。蒂特马尔亲身经历了奥托二世的统治，他将军事上的失败与基督教道德相联系，将臣民的状况与国王的境况相联系，以此作出评价：\n奥托，此名的第二位承继者……\n……被拥立登上其伟大父亲的宝座\n他帮助一切困苦之人，配得称颂。\n……\n他的青年时代幸福而顺遂，但悲哀在他晚年降临\n因我们罪孽的沉重重担。\n于是，这个邪恶的世界为拒斥真理而忏悔。28\n在蒂特马尔看来，奥托二世因其臣民的罪而受苦：国王失去了好运，社会的正当秩序已然崩坏。\n奥托竭力维护的这些崇高的王权理想，是在查理曼及其直接继承者的统治时期，从更为古老的仪式传统和政治思想传统中臻于成熟的。它们之所以凝结成形，正是因为加洛林王朝所行使的前所未有的权力需要前所未有的正当化论证。查理曼的权力呈现为多种不同的形式——军事上的成功、对日常生活诸多方面进行规制的努力、通过对领地集约的经济开发和对贵族亲缘网络的娴熟操控而展现的强势领主权——所有这些对他的臣民都提出了巨大的要求。基督教王权的意识形态和仪式为此提供了验证，将人们的注意力从权力的严酷现实上转移开。通过强调宇宙秩序而非人的压迫，神圣的认可使臣服于如此强势的统治者变得可以接受。而且，它为国王们提供了一种无论多少财宝或战士都无法带来的权力形式，因为超自然的认可远比单纯的政治共识、父亲的指定或战场上的胜利更为有效的合法性来源。而当九世纪中叶以后，大主教们确立了一项角色——在他们看来是一项特权——即通过教会的膏立仪式向国王传达神圣认可时，基督教与王权的综合便告完成。得益于教士阶层的主动推动，中世纪早期的国王成为一个超越性的、明确的基督教社会秩序的象征中心。\n从九世纪中叶起，这一基督教秩序还明确地将国王的妻子纳入其中。一项缺乏圣经先例的创新——为王后祝圣的新仪式——赋予她在维护这一秩序中的正式角色。除了她有充分记载的宫廷职能——宫廷的内部事务管理不仅包括物资供应，还包括调控宾客与礼物的往来——王后还成为多产、繁荣与良好品行的一尊活的圣像。王后身份恰好在加洛林道德家们坚持对婚姻作出新的、更严格的界定并要求国王在自身生活中加以维护的那几十年里，变得既具有官方性质又明确基督教化，这绝非巧合。通过她作为终身唯一配偶和未来继承人指定母亲的新角色，王后的品行直接关系到其丈夫的名声。她性方面的贞洁提升他的声誉，并体现社会的正当秩序；她的端庄得体表明国王择她为妃的智慧；她的良言善劝使国王趋向仁慈；她的多产则印证丈夫的。反之，她的不育可能威胁政治稳定，并似乎是天谴的征兆；任何不当干政的迹象或性放荡的指控，都会损害并摧毁一位国王掌控局面的声誉、\n自身、家庭乃至整个社会。因此，祝圣赋予王后以公正统治的重任，并使她参与维护超验秩序的角色正式化。\n一旦以这些方式被赋予意识形态权力，便会带来额外的益处。保护教会同时意味着慷慨地资助它们。法兰克人的圣马丁墓、苏格兰人的圣哥伦巴墓、爱尔兰人的圣帕特里克墓——这些以及其他许多圣墓都享有源自王室的地产财富。作为回报，国王和王后获得了他们所供奉圣徒的强大精神庇佑。与此同时，教会和修道院也以其巨额地产财富以各种方式支持王权，如根特的圣彼得教堂的教士们为虔诚者路易所做的那样。皇家修道院在这些网络中也占有一席之地：它们本身是重要的土地所有者，是国王的女儿或寡妇的居所，也是为女赞助人及其家族进行代祷的来源。此外，教会将其可观的 法律与行政专才供王室驱使，从而将至少一部分晚期罗马的官僚技能与司法原则传给了中世纪早期的统治者。王室事务与教会事务的密切共生，正是中世纪早期基督教统治意识形态的实际体现。\n其必然结果之一是教士们乐于对国王训诫其职责。无论应王室之请还是出于自身主动，教士们撰写书信、论著和劝诫致予国王，或鼓励、或告诫、或斥责。而且有足够证据表明，至少有些国王确实听从并铭记这些建议。查理秃头就是这样一位国王，他是查理曼之孙，统治其帝国西部的三分之一。他也确实需要如此：他的统治是一场漫长的斗争，要应对与兄弟、侄子和儿子们的反复冲突、维京人劫掠带来的日益严峻的外部威胁，以及内部资源的日渐匮乏。此外，他还面临强势的贵族和自信的主教。其中最有力、最善表达的是兰斯的欣克马尔，他对国王义务的见解与其对婚姻义务的见解一样清晰。29 查理曾读过欣克马尔早先关于王权的一组评论，并就此向他提问，时间大约在873年。这位大主教以一篇题为《论国王之人与王者职分》的论著作答，他猜想其中言辞可能会让国王颇为恼火。其内容可以概括如下：基督教上帝立立国王，既允许恶王存在，也使善王成为可能。善王以正义统治，惩罚罪犯，保卫教会，审判公平，因而为其臣民带来福祉，赐予他们和平、丰饶的土地与富庶。相反，恶王带来的只有苦难、压迫、入侵和饥荒。在另一篇论著中，欣克马尔称这样的国王为暴君：尽管如此，他在宇宙秩序的整体中仍占有一席之地，因为上帝允许他统治，作为对其人民罪恶的惩罚。欣克马尔笔下的善王强大而充满活力，无论在战场上还是在法律上皆是如此。他实行道德上的自我克制，拒绝屈服于谄媚、偏袒或骄傲。谦卑是善治的根本前提，正义则是其日常体现。由此，国王成为臣民良好行为的典范。这完全可能与流血相容——如果战争能够保卫基督教，或者其臣民所犯的滔天罪行足以判处死刑。在欣克马尔看来，善治就是为整个基督教社会秩序的福祉而积极践行的道德。它是一种ministerium，一种职事：一种对他人负责任的服务义务。借助善王的统治，人类社会得以拥抱神启的和谐，国王则作为基督在世上的代理人进行统治。\n《论国王之人与王者职分》标志着中世纪早期王权思想发展的一个晚期且成熟的阶段。在这一传统中，来源各异的思想逐渐融合，但这部论著仍使我们能够确切辨识其构成要素，因为欣克马尔的写作方式是点明其文献来源并大量引用。由此，他揭示了他自己——以及许多其他中世纪早期思想家——关于权力的性质与运用的思想渊源。首先是《圣经》，既包括阐述古代以色列上帝、国王与人民之间关系的旧约诸书，也包括新约中基督及其追随者在罗马帝国境内关于社会与政治义务的教导。其次是古代晚期和中世纪极早期伟大的神学家和道德家。安布罗斯和奥古斯丁写作时，罗马帝国仍是一个强大的政治实体；大格列高利则既经历了东部拜占庭帝国持久的活力，也目睹了意大利稳定的瓦解。这些作者各自以独特的方式，将圣经思想与罗马人关于权力伦理和法律本质的强烈观念相结合。欣克马尔大量借鉴的第四位作者，他误认为是迦太基的居普良（卒于258年）。实际上，他是一位匿名的七世纪爱尔兰人，其思想是圣经、教父与爱尔兰本土智慧文献的迷人混合。\n尽管有过度简化之虞，我们仍可将中世纪早期关于善王与恶王的观念的起源定位于三种不同的文化传统：罗马的、圣经的和爱尔兰的。三篇致国王的劝诫文献，均成文于六世纪末至七世纪，有助于我们厘清它们各自的贡献。第一篇的作者是布拉加的马丁，收件人是苏维汇国王米罗（570—583年在位）。苏维汇人于409年定居伊比利亚西北部，在那里维持着一个独立王国，直到585年被其强大的哥特邻居吞并（见图0.2和8.2）。马丁的《诚实生活之规范》旨在为国王及其“协助其王者职分之人”提供简明的建议，并明确独立于基督教教义之外。他概述了应当指导国王一切行动的四种基本美德：审慎、精神的宽宏、自我克制与正义。如此，马丁强调了自我约束、合乎伦理的行为、为他人服务以及在一切事务中公正行事的必要。国王应避免恶行，成为他人“无可指责的匡正者”和良好行为的典范。所有这些观念都直接源自罗马哲学家塞涅卡（约公元前4年—公元65年）的著作；它们以这样或那样的方式，全部在欣克马尔致查理秃头的建议中重现。马丁这部质朴的论著在整个中世纪广受欢迎，这提醒我们罗马信念的持久遗产：自我克制的道德行为是行使统治他人之权的必要前提。30\n第二条脉络，即圣经脉络，内容丰富、复杂，且被不断重新诠释。尽管如此，大格列高利601年致肯特国王埃塞尔伯特的信表明了它得以简明表述的一种方式，正如这里所适用的那样——针对一位刚刚接受基督教的军事领袖。格列高利简明的前提将整部圣经历史的要旨凝缩为一条不言自明的真理：“全能上帝兴起某些善人作为列国的统治者，以便借他们之手，将其公义的恩赐赐予他们所治理的众人。”这句话背后是对古代以色列宇宙观的认知：国王被视为神圣人物，受上帝保护，并通过祭司以油膏抹而祝圣。正如格列高利所暗示的，国王是神人之间的管道；他的善治带来上帝的恩赐——丰饶、繁荣与和平。在格列高利的思想中，这一古老前提引出某些必然推论。其一，埃塞尔伯特对上帝负有职责——推进基督教的传播，以身作则示范基督徒的行为，并通过“劝诫、震慑、诱导和纠正”来改变其人民的行为。31 其二，如果他这样做，上帝将以荣耀、显赫的名声以及许诺给基督徒的永生报偿他。在这里，国王是基督教政体的枢纽，同时对基督教上帝和自己的臣民负有义务。这是格列高利思想的核心，除这封信之外，他还在许多其他著作中表达了他对统治者职责的看法。这些著作的广泛流传，使他的思想也成为中世纪早期政治思想的共同财富；欣克马尔只是众多承认得益于格列高利贡献者中的一位。\n第三条脉络也许最出乎意料。我们在七世纪的一部论著《莫兰的遗嘱》中遇到它，这是爱尔兰智者、费里（fili）莫兰致国王费拉达赫·芬德·费赫特纳赫的一部训诫之作。两人都是传说人物，但这是以古爱尔兰语写成、面向国王的智慧文献的一个样本。莫兰的目的是向国王传达“正直之德，| 每位统治者必须具备”。32 他借其信使之口，向费赫特纳赫讲述fír flathemon，即“王者之正义”，这个词内涵丰富，意指融合了真理与正直的公平。\n告诉他，正是凭借统治者的正义，瘟疫和巨雷才远离人民。\n正是凭借统治者的正义，他审判大部落，裁决大财富。\n正是凭借统治者的正义，他赢得和平、安宁、喜悦、安逸与舒适。\n正是凭借统治者的正义，他派遣大军赴敌对邻邦的边境。\n正是凭借统治者的正义，每位继承人在其公正的继承地上竖起房柱。\n正是凭借统治者的正义，大森林中丰硕的果实得以品尝。\n正是凭借统治者的正义，大牲畜的产奶量得以维持。\n正是凭借统治者的正义，一切高大挺拔的谷物丰茂繁盛。33\n莫兰进而详细阐明真正的统治者必须如何行事，以维护社会的正当秩序，并为人民赢得这些丰饶。他还提到了其对立面，即“非王”或篡位者，其统治充斥暴力与战争，与之相伴的则是“号角声声长鸣”。34\n我们再次发现，王者的行为与人民的福祉、土地的丰饶，以及通过对外战争和对内善治维持和平密不可分。善治预设国王的“正义”将有效而公平地调节社会关系。这些观念属于基督教传入之前爱尔兰流行的更广泛传统的一部分，这些传统赋予国王极高的象征价值，视其为社会秩序与超自然秩序的化身。正如在古代以色列一样，国王被视为一种思维方式的核心：这种思维方式认为社会福祉不过是更广大世界——其土地、其气候、其统治者——福祉的一个侧面，并在政治失序与宇宙失谐之间画出紧密的类比。\n不出所料，《莫兰的遗嘱》因其以古爱尔兰语写成而始终不为爱尔兰以外所知。但它关于真王与非王的对照，以及关于国王“正义”之重要性的思想，渗透进一篇同样成文于七世纪爱尔兰的拉丁文论著中。这部论著从八世纪到十二世纪在英格兰和欧洲大陆被广泛阅读，通称《论世界的十二种弊害》。这正是欣克马尔认为是居普良所写的那部著作，他也全文引用了其中关于善王与恶王的界定。\n古代以色列、基督教之前的爱尔兰和九世纪的加洛林帝国当然都是截然不同的社会。然而，它们都拥有众多的国王，并将王制视为唯一可能的政治秩序。它们都以各自的方式假定超自然、尘世与社会之间的相互渗透，这一假定在每个文化中的表现形式各不相同。但它们共享一个前提：国王是这种相互作用的关键节点之一，其行为是神圣、自然与人类彼此影响的管道。正因如此，源自《旧约》和爱尔兰学问的关于王制本质的信念，得以顺利地从罗马帝国废墟中兴起的武士王国所吸收。即便早期讲日耳曼语的民族曾在宇宙论框架下看待其国王，四五世纪的巨大动荡与变革也早已使这种信念难以为继。取而代之的是，罗马基督教的遗产以及关于权力行使的古典伦理标准，提供了一个乐于吸纳其他关于善王与恶王的文本和思想的文化环境。\n这一融合早在罗马皇帝君士坦丁皈依基督教之后便已开始，而欣克马尔所借鉴的教父神学家们在其中功不可没。但关于王者职责的思考从未停滞不前，五世纪西罗马帝国的政治转型又提供了新的推动力。随着帝国让位于诸王国，以及基督教在这些王国中的传播，制定基督教王权规范的冲动变得不可抗拒。欣克马尔的数部关于王权的论著，正是这一漫长而缓慢过程的顶点。\n使欣克马尔如此重要的，不仅是他精深的政治思想和浩繁的著述。他还专长于创制王室礼仪\n以戏剧的形式来演绎他所信奉的政治神学。正是他精明的政治判断，将国王对其人民作出正式承诺的环节引入了加冕典礼；而且，比任何其他人都更重要的是，他规范了为国王和王后行膏油礼的传统。奥托二世以及后世许多以同样的话语和宗教仪式开启统治的中世纪统治者，都参与了一场神圣的戏剧，而这出戏剧在很大程度上是兰斯的辛克马尔丰富心灵的产物。虽然由大主教之手行加冕礼本身并不能造就一位好国王，但它确实造就了一位国王，并且确实教导他如何成为好国王。而对于已经结婚的统治者——不像年幼的奥托二世——他王后的加冕礼也使她卷入了维护良好统治的责任之中。\n这些理想对统治实践究竟产生了什么影响？它们无法取代来之不易的经验，更不是战场上免于失败灵药。毋宁说，它们的重要性在于确立了一种公认的衡量国王表现的标尺，并为批评提供了标准——无论批评者是心怀不满的世俗臣民、教士批评者，还是急于排挤对手的人。中世纪早期的国王之所以恶劣，并不仅仅因为他们狡诈、淫乱、无能或在战争中屡遭失败：当他们失去其世俗与教界主要臣民的尊重与合作时，他们才是恶劣的。简言之，恶劣的统治就是蓄意摧毁使治理得以运转的共识性伙伴关系。从宇宙论的角度看，这是对神圣秩序的败坏。\n恶劣统治可以表现为多种形式。其一是性与性别的层面。统治者的自我约束必须从控制自己的身体开始，以免“受欲望支配，[因]荒淫与通奸之罪[玷污其]荣耀之名于上帝与世人面前”。博尼法斯在746至747年间警告麦西亚国王埃塞尔鲍尔德（716–757年在位）说，这种行为“既是对上帝的羞辱，也毁掉了你在人间的声誉”。然而更为严重的指控是，埃塞尔鲍尔德竟将淫欲发泄在他本应保护的人身上——即他王国中修道院里献给上帝的修女：这种行为是“死亡的罗网、地狱的深坑和毁灭的漩涡”。35 相反，好的统治者“首先应以合理而有德行的纪律约束自己；其次约束他的妻子、儿女和家室；再次约束托付给他的人民”，而恶劣的国王则将缺乏自制与放荡的妻子结合在一起。“愚昧的妻子是家庭的毁灭、财富的耗竭、罪行的渊薮，以及一切邪恶与恶德的居所。”36 对王后通奸的指控成为攻击国王的武器，正如“虔诚者”路易与他美丽的皇后尤迪丝在830年代共同付出代价后所发现的那样。事实真相无关紧要，因为王后的贞洁已成为良好统治如此不可分割的组成部分，以致针对王后的暗示与指控便足以认定国王的恶劣。\n恶劣统治的另一种形式是采纳不良的忠告，或者根本不听取忠告。最好的建议来自上帝，正如《圣经》所阐明的。此外还有两条箴言：“审慎之人召集其他审慎之人共同商议，没有他们的建议便不采取行动；而愚昧之人独自思量，不经他人商议便仓促行其所欲。……在谋议中应遵守的第三条准则是：公正的统治者不应有奸诈邪恶的谋臣。谁会信任恶人的谋划呢？……善谋使国家上升，恶谋则将它压向毁灭性的灾难。”37 如果谋臣阻塞他人接近国王的途径——如“天真者”查理统治时期的哈加诺那样——或者出身于错误的社会阶层——如“胖子”查理的谋臣韦尔切利的柳特瓦德那样——他们便可能被斥为邪恶。其政治后果可能十分严重：洛林国王兹温提博尔德（895–900年在位）之所以被废黜，不仅因为他劫掠教会财产，还因为“他与地位低贱的男女共同处理王国事务，贬抑其较为尊贵高贵的追随者，并剥夺了他们的官职与尊严”。38\n然而，最危险的恶劣统治形式，早在七世纪就已被伪西普里安所指出：即对正义的漠视。作为“十二种弊政”之一的“不义之王”羞辱其臣民，无视他们的权利与利益。这正是辛克马尔日后将要警告“秃头”查理的那种压迫性的暴政。但查理是以惨痛的代价吸取这一教训的，因为他早年统治过于严厉，以致858年其臣民揭竿而起，抱怨他的统治已沦为“暴政”——据称，他以“邪恶的残暴”摧毁他们的财产，并背弃他对人民立下的誓言与承诺。简言之，“所有人对他是否守信都已绝望”。39 他的反对者断言，查理的统治无视共同福祉，忽视了统治者与被统治者之间利益与目标平等一致的原则——而这一原则正是良好统治与成功治理的核心。\n对恶劣统治的指控会催生激烈的政治对抗；而出自史家笔端，则会使被指控者在后世声名扫地。梅泽堡的蒂特马尔——或为其提供消息的人——对丹麦国王“八字胡”斯韦恩（约987–1014年在位）这位基督徒毫无好感。他谴责这个丹麦人不仅因为他进攻英格兰，还因为他糟蹋自己的王国：他“不是统治者而是毁灭者……他以不断漂泊换取安稳，以战争换取和平，以流亡换取王国，以魔鬼换取天地之主上帝”。40 实际上，蒂特马尔把斯韦恩塑造成恶劣统治的一个典型形象，他在基督教宇宙论体系的败坏中展示了与好君主品质完全相反的特质。\n恶劣统治提醒我们，良好统治乃是一个极为精致的政治与意识形态建构。作为一种建立在义务、正义与自我约束之上的道德事业，它极大地受益于教会对社会世界正当秩序的构想，但它并非纯粹由教士的要素拼凑而成，因为王权太过根本，不能完全留给教会人士来界定。它始终植根于战争领导权的严酷现实之中，并以世俗精英的同意与合作为前提。没有这些，国王便无法行使职能：他将沦为无用之人，一个“不统治者”。因此，我们应当谨慎，不要以二元对立的方式思考——即认为教士有一套王权准则，俗人另有另一套。教会需要强大的武士国王来保卫他们的土地并传播基督教；贵族也乐于让王权的部分神圣光环沾染到自己身上。正义与自我约束的原则，对渴望提升自身地位的贵族而言，既是一种精明的政治策略，对国王而言，也是一部行为准则。\n毕竟，正如奥尔良的约纳斯、拉昂的阿达尔贝罗等人所强调的，基督教关于权力责任的伦理，已不仅适用于国王，也适用于构成统治精英的“权贵者”（potentes）。41 在其意识形态效力最强的时刻，王权预设了国王与其主要臣民之间公正行使权力的互补平衡：良好统治是植根于更广泛意义上的良好领主统治的社会秩序在意识形态与宇宙论上的抽象。没有人比阿达尔贝罗的同时代人、约克的伍尔夫斯坦更明白这一点——他关于市民社会崩溃与盎格鲁-撒克逊人道德堕落之间联系的名言，前文已经引用。42 大约在他痛斥盎格鲁-撒克逊精英、阐明自然灾害与社会失序之间关联的同一时期，他也尖锐地阐明了这同一关系中属于国王的那一面：\n为基督教的君王，\n极为相宜的是\n他处于父亲之位\n面对基督教的人民。\n在守望与护卫他们时\n做基督的代表，\n正如他所被称呼的那样。43\n这些写于约1010年的诗句，总结了对基督教社会中王权的任务与性质长达数个世纪的思考。几年之后，伍尔夫斯坦进一步阐明了其中的基本逻辑：\n借由愚昧的君王，\n人民将变得悲惨，\n不止一次，而是屡屡，\n因其治理之失。\n借由君王的智慧，\n人民将蒙受福佑，\n繁荣昌盛，战无不胜。\n因此智慧的君王\n必须扩展和高举\n基督教与王国，\n而对异教，他当永远\n阻遏与憎恶。44\n中世纪早期将国王描绘为“基督代表”的利益汇合，在1020年代的英格兰与德意志达到了顶峰，但此后不久便不再能安然无争。1070年代，一场激烈的意识形态战争首先在德意志帝国爆发，继而蔓延至他处，争论的核心是国王与上帝及教士之间的适当关系。随之而来的是制度变革，到十二世纪末，改变了教士权威的行使方式以及实施王室司法的手段。约克的伍尔夫斯坦若泉下有知，定会觉得“基督代表”的角色竟被专属地归于教皇是何等奇怪；然而司法的行使始终是基督教王权的基石。另一方面，兰斯的辛克马尔则会在任何新君主的即位典礼上感到全然自在，因为用于奥托二世的加冕仪式文辞直接承袭自他的构想，并在之后许多世纪里仍是一个活的传统。\n在古典时代，“欧罗巴”指代已知世界三大洲之一。但在约500年至约1000年间的几个世纪里，这片大陆的大部分地区逐渐采纳了一种新的身份认同——基督教世界（Christendom），即所有受洗信奉基督与基督教上帝的信徒共同体。从地中海到北极圈的男男女女，如今有了共同之处。而且，正如任何群体认同的本质那样，基督教世界既相对于其内部成员、也相对于外部他者来界定自身。凭借有力的言辞与锋利的刀剑共同传播，基督教世界竭力压制关于世界的其他构想。作为信仰与价值观的核心主体，它影响了此后数个世纪欧洲乃至更广阔世界的历史。\n这些都是不言自明的。但中世纪早期出现的国王与基督教之间联盟的意义，比这更为深远。中世纪早期的基督教，与其说是穷人的（pauperes）宗教，不如说更是有权势者（potentes）的宗教。在古典时代，罗马帝国边界以外的欧洲居住着众多小民族及其脆弱易变的联盟。然而到千年纪末期，强大而持久的王国已在那里兴起。前几章已勾勒出其中的一些原因：基督教的影响对此有所补充，因为它提供了资源、基础设施、意识形态，以及——同样重要的是——身份认同。换言之，基督教带来了晚期罗马制度化权力的遗产：资源充足、意识形态上有理据，且具有宇宙论意义。\n在欧洲那些于五世纪从帝国官员手中转入武士国王之手而结构上少有破坏的地中海地区，基督教与统治权的结合早已根深蒂固。世俗与教会生活中行政与官僚体制的延续性助长了这一点。但即便在这里，基督教也为国王的统治带来了新的正当理由、新的任务与义务、新的可行使的权力。而当十世纪末十一世纪初法兰西南部和意大利的有效王权政府崩溃时，伦理性权力的理想与义务由教会加以维护和主张。与此同时，富有战斗性的基督教为西班牙北部的小王国提供了一个现成的正当理由，开始对伊比利亚半岛中部和南部的穆斯林军阀展开稳步的进攻。无论十一世纪末和十二世纪基督教世界的意识形态纷争与司法重组造成了多大的动荡，中世纪早期武士国王与基督教的联盟始终未受撼动。", "sections": [{"level": 2, "title": "基督教的传播", "id": "ch
