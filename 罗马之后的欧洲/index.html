证的风气更加剧了这一限制。\n他人的交易行为。除了少数几位著名的统治者妻子之外，特许状证人名单表明，那些完成土地交易、解决纠纷、处理社区事务的集会，基本上都是男性的聚会。\n由此可见，当时的文化将男性目击证人的口头证词与特许状的书面记录视为证明所有权或解决纠纷的两种相互重叠的方式。在欧洲各地，地方社区可能更偏重其中一种。即使在爱尔兰——源自罗马的文书形式（如雷东地区的那些）似乎影响甚微——“虔诚的古老文字”也与有效证人、担保人以及刻有欧甘文的界石一道，被承认为一种证明形式。33 而在法国南部，高度重视书面文书的罗马法律程序贯穿整个中世纪早期，证人宣誓作出的口头证词始终是对遗失、伪造、销毁或存在争议的特许状的重要补充：法官只有在“亲见亲闻”证据之后才作出裁决。34 无论是朗读有争议的特许状，还是记录证人的誓言，文书意识总是以口头言说的环境为前提，从不预设所有参与者都具备个人读写能力。\n只要有少数人具备以规范方式起草文书的必要技能，那么无论是对温饱有余的自由持有者，还是对坐拥广大田产的世俗或教会业主而言，广泛依赖文书实践都是可能的。这种文书意识是小型社会精英的特征：他们要么是拥有足够财富和地位持有土地、支配他人服务的世俗人士，要么是代表座堂和修道院机构利益的 bishop、修道院院长（abbot）与女修道院院长（abbess）。这一普遍事实抵消了各地读写能力之间的巨大差异。然而，这里涉及的问题远不止富足的生活方式那么简单，因为书写是政治权力在地方和基督教欧洲各王室宫廷运作的组成部分。无论作为交流的媒介、表达意识形态的手段、传递专门法律知识的工具，还是用于维护国王世系录、宣示王室谱系或保管财政记录，读写能力都广泛参与了中世纪早期欧洲基督教地区权威的阐明与维护。对那些积极寻求一定程度中央集权控制的政体而言尤其如此，但无论何处，读写能力都具有增强合法性、凝聚共识和传递强烈象征意义的潜能。35 习惯于处理文书并理解其使用所附带社会惯例的人，能够提供统治者所需要的东西。正如身边有私人公证人或村庄书吏的地主一样，擅长起草书信、特许状或田产备忘录的教士，也为地方和中央层面的权力运作作出了贡献。\n尤其当拉丁语是权力的语言之一——或唯一语言——而地区社群讲的是凯尔特语或日耳曼语时，唯有精英才具备参与统治、并在宫廷与地方之间充当中介所必需的专门技能或技术协助。因此，无论是个人的还是参与性的文书意识，既是跻身权力斡旋精英的前提，也是其结果。\n中世纪早期的读写文化除了文书层面，还具有宗教层面。到五世纪时，基督教崇拜的惯例已结晶为书面形式，再现于礼拜仪式书中，这些书编码了礼仪实践在各地相当大的差异。凡基督教信仰被正式组织为由正式任命的男性司铎领导的地方会众之处，崇拜都需要这类书籍的存在，以及一名能够朗读书中经文的人。正如十世纪晚期一位盎格鲁-撒克逊布道者所言，在崇拜中“我们聆听上帝之书的讲解与诵读，聆听福音的宣示，祂的荣耀得以昭示于人”。36 基督教礼仪是一场口头与视觉的戏剧，而上帝之书居于其中心。\n为完成全年完整的礼仪周期，一名司铎需要若干不同的书籍来满足社群的圣事需求，若他还从事牧灵工作，则还需额外的书籍。在这一时期，有多少乡村小堂——有别于座堂、修道院及其他地区中心——真正拥有全套经籍，尚存疑问，但这一不确定性并不能减损参加教堂礼拜对每个社会阶层的人都意味着的与书面文字的相遇。这种相遇的形式无疑部分取决于崇拜语言在当地是否可理解、主礼司铎受训的成效如何，以及他是否与信众之间隔着屏隔。然而，这里所牵涉的远不止言语内容的传达。书籍在基督教仪式的言辞与姿态中的核心地位，将宗教权威与真理奠基于书写之上。这 thereby 贬低了不成文的意见与口传传统，并给予男性而非女性将其读写技能运用于公共场合的机会。\n对基督教书面文字传统的强调，其最充分的表现不在于分散的地方教堂，而在于修道院社群。中世纪早期修道院传统的根源深植于遥远的过去，即早期基督徒弃绝土地、财富、性欲与家庭、转而过践行圣经训诫之生活的冲动，有时伴随着惊人的苦修形式和行奇迹的声誉。这一运动在基督教获得信徒的任何地方都有所表现，无论当地的社会和政治状况如何。到五世纪时，遁入苦修社群的人常常发现，自己需要在苦修所要求的自我约束和与社会保持距离之间，与其名声所吸引的田产馈赠之盛与流之间求得平衡。深入投入圣经文化要求群体中至少某些成员能够阅读并理解拉丁文——但这可能也意味着接触浩瀚的非基督教拉丁文学传统，以及四、五世纪圣经诠释的权威著作。到七世纪时——有些地方更早——修道院社群发现自己已成为古代教育传统与文学遗产的主要守护者。\n苦修生活围绕着上帝之道展开——书写于以黄金和宝石装帧的华丽装饰圣经之中，在崇拜中咏唱与宣讲，高声诵读、众人聆听，或默读低吟以沉思其内在意涵。修道院的组织与意识形态有时以书面形式编纂成典，但修道院会规始终作为口头文本发挥作用。“吾儿，请聆听你导师的教诲，倾你心之耳”，37 这是最流行、且到九世纪时最具权威的一部书面会规的开篇，其作者是努西亚的本笃（约480年生，560年卒）。在修道院文化中，文字在口头与书面形式之间无休止地来回转换，但固定的参照点始终是神圣经文，即以羊皮纸页上的文字所传递的基督的口头教导。\n“明辨之根基、形式与圆满，在于圣经理性的知识。”38 拉巴努斯·毛鲁斯（约780年生，856年卒）于819年如此写道。他是博尼法斯在中德意志森林地带的富尔达所建修道院中颇具影响力的教师。他的父母和兄长是中莱茵河地区典型的使用特许状的地方贵族，但与他们的参与型读写方式不同，拉巴努斯成为其时代最有学问的人之一，是圣经注释、修道院指导著作以及复杂拉丁韵文的多产作者。后来他出任富尔达修道院院长（822–842年），执掌阿尔卑斯山以北最大的修道院社群（约600人）。在任内，他将该院图书馆发展为基督教与古典文本的重要收藏，并监管修士们超过8000处农庄的庞大田产捐赠的经营管理，最终以美因茨大主教、诸王顾问的身份（847–856年）结束其生涯。无论出于诗学、教学、灵修、行政还是政治的目的，拉巴努斯始终以娴熟的拉丁文表达自己。这一切之所以可能，是因为他的父母在他7岁时便将他送入修道院——年纪足够小，使多年的学校教育得以培养他的才能，并灌输对“神圣语言”的完全掌握。\n在拉巴努斯的护佑下，富尔达形成了独特的文学文化。尽管修道院学术的共同源头促使各修道院收藏类似的拉丁文法与圣经诠释基础文本，但即便是修道院的读写文化也呈现出鲜明的地方性或区域性形态。这只部分源于从远方获取书籍的巨大困难；同样重要的是，文本为了适应当地需求和偏好而被不断地重述、修订和改动。然而，富尔达还表现出额外的独特之处，因为其院长们也推动了古高地德语书面文学的形成，主要但不完全是为了牧灵用途。他们的勤勉搜求还积累了一批独特的珍稀古典著作收藏，其中若干种得以传世，全赖该修道院九世纪抄写员的活动。尽管与修道院生活的共同理想完全一致，富尔达仍然拥有一种带有自身地方品质的文学文化。\n富尔达并非孤例。无论《本笃会规》到九、十世纪时已如何普及，各修道院都保持着地方传统的礼仪风格。它们还在地区文化规范的语境中，尽其所能利用各种资源、机会与人脉，营造自身的知识生活。在西班牙北部的基督教诸王国中，诸如加泰罗尼亚的里波尔与圣米良德拉科戈利亚等修道院，因相对邻近十世纪科尔多瓦哈里发宫廷辉煌的知识文化而受益，获得了拉丁西方其他地方无从获取的科学和数学论著，其中包括一些从阿拉伯文译出的作品。与此同时，在十、十一世纪的英格兰，埃克塞特、温彻斯特、拉姆齐等地的修士和教士抄写和收集古英语书籍的热情不亚于拉丁文著作，既追求圣经注释，也追求古英语英雄诗歌等驳杂的趣味。当欧里亚克的年轻修士热尔贝于967年翻越比利牛斯山前往里波尔，而法国中部弗勒里的修道院教师阿博于985至987年间赴英格兰拉姆齐执教时，两人都遇到了熟悉的修道院生活方式和礼仪，同时也遇到了新奇的学习资源。即便是修道院图书馆这种精英读写文化，也显示出地方特色。\n这一切都代价高昂。书籍需要熟练的抄写员和大量优质兽皮以制作羊皮纸。以八世纪诺森布里亚最著名的两部著作为例：今天以290页平装本面世的比德的《英吉利教会史》，制作一册副本约需三十张兽皮，而宏伟巨大的林迪斯法恩福音书则用了超过150张小牛皮。科尔比的希尔德马尔（约850年卒）透露，他的修道院可以60第纳里（银便士）出售一部用三十张皮制成的书，此数约相当于四只长毛绵羊或十五头小猪的价值：科尔比自身的图书馆拥有300多个书目的藏书，其中大多是新近抄写的。维持如此规模的图书馆极为昂贵——这也有助于解释拉巴努斯为何精心组织装订成册的登记簿，以保存见证富尔达土地与收益权利的数千份单份特许状的副本。这还不包括富尔达在九、十世纪也制作的插图礼仪书，其中任何一册可能就要耗费六十多张皮，外加昂贵的进口颜料和贴金。\n尽管富尔达社群规模庞大、学校闻名、维系修士及其图书馆的资源雄厚，但在其九、十世纪的修士中，以拉丁文或古高地德语著述的人寥寥无几，且无一人的多产可与拉巴努斯相比。在任何修道院，无论男修院还是女修院，充分参与修道生活都要求具备阅读能力。若有少数修士或修女能抄书和起草特许状，将有助于社群事务。但创作型的读写能力在整个中世纪早期始终罕见，这是一种既需要非凡资源又需要非凡才智的智识成就。难怪这类才能局限于精英阶层，也难怪拉巴努斯及其同类人物为统治者宫廷增光添彩。特权的地位与特权的声音：正是他们的声音最好地穿越了数个世纪而存留至今。\n“凡人手所造之物，无不困于疲惫岁月，\n终为其所围困攻陷，厄运之日终将来临：\n唯书面文字蔑视命运，\n复活往昔，戳破死亡的谎言。”39\n拉巴努斯自己的文字也蔑视了命运。若非一位十七世纪印刷商的努力，这些诗行早已失传，与富尔达中世纪图书馆中大多数写本一同毁于久远。在这些诗句中，拉巴努斯表达了一种继承自古代晚期基督教作家的观点，并肯定了许多对加洛林帝国的基督教拉丁文化而言居于核心地位的东西：对过去的承续、对拉丁书籍学问文化的尊崇，以及一种深切的信念——即没有任何其他媒介、任何其他语言能够传达权威与真理。但我们不应让他诱使我们永续中的偏见，或重复其拉丁文字能力必然代表更高文化成就水平的预设。相反，我们应当将其视为政治变革的推动力量。正如本章所论证的，书写及其带来的文字能力深度卷入了权力的行使之中，它强化、塑造并证成了社会等级、教会控制和王权统治。获释奴隶会收到一份确认其释奴身份的文书，这并非偶然，因为书写建构了各种权力关系，并确保这些关系被铭记。我们也不应让赫拉班的声音淹没来自其他地方的其他声音。虽然基督教无疑为书面文字提供了强大的推动力，但在基督教的文字形式传入之后，古老的碑刻体卢恩文字和欧甘文字的传统在大西洋沿岸和北欧又延续了好几个世纪。我们还看到，在实践中，中世纪早期的共同体在选择将什么付诸书写、使用何种文字和何种语言方面极其多样。只有对拉丁文《圣经》和礼拜仪式的共同依恋，才帮助创造了一定程度的共同身份认同，并使通晓拉丁语的人在基督教欧洲的任何地方旅行时都能进行交流。\n诚然，如果要寻求概括性的结论，我们可以说，正是在中世纪早期，拉丁语首次成为遍及欧洲大部分地区的国际性“官话”语言；同样，正是在这几个世纪里，教育、书本学问和文字能力成了基督教教会独占的领域。但本章还强调了其他一些结论。它提请注意拉丁语与其他语言之间的互动。它展示了世俗土地贵族如何娴熟地运用书面文书传统，无论使用本族语还是拉丁语。在概述统治者依靠书写进行立法、治理和彰显权威的若干方式时，本章引入了一些主题，本书最后两章将再次回到这些主题。\n最后，本章强调了早期中世纪欧洲以千变万化的地方性言说和书写文化为特征。尽管由于过去千年间书籍与文书的散佚无序，我们对这些文化的理解受到限制，但毫无疑问，它们的特征既取决于各地的资源和先例，也同样取决于个人的偏好与需求。例外情况下，统治者会出面兴办学校和推动书本学问，以期培养正统的基督教行为方式并强化王室行政。但中世纪早期的书面遗存把我们引向地方社会，与引向王室宫廷的程度不相上下。下一章我们将继续关注这些地方社会，转而考察与言说同样关乎人类存在的根本问题——生与死。", "sections": [{"level": 2, "title": "巴别塔", "id": "ch3-s0"}, {"level": 2, "title": "权威的语言", "id": "ch3-s1"}, {"level": 2, "title": "地方性读写能力与精英读写能力", "id": "ch3-s2"}]}, {"id": "c4", "title": "第2章 · 生存与死亡", "kicker": null, "part": "第一编 · 基础", "html": "<figure><img src=\"images/fig_2_1.png\" alt=\"第2章所涉主要地点\"><figcaption>第2章所涉主要地点</figcaption></figure>\n<p>风暴压弯的枫树，\n我为我的儿子悲恸，\n我的孩子，他已把\n身躯俯向大地：\n不幸的人啊，\n他的亲族被砍伐，\n还须从床上\n扛走骸骨。</p>\n<p>父亲哀悼溺亡的儿子，婴儿吮吸着饥馁母亲尚有余温的尸体：中世纪早期的欧洲人在匮乏与死亡之中亲密地生活。面对间歇性的气候灾害、周期性的流行病和严酷的日常生活条件，欧洲的人口艰难地靠土地谋生，并抚养子女以延续其劳作。大多数人生活在生存线或其边缘；另一些人则在猝然死亡的恐怖和饥荒的可能之中，思索人类存在的意义及其道德品质。正如所有文化一样，生与死的基本节律构成了人类经验的框架，不仅塑造着任何共同体的年龄结构、成员的预期寿命及其对安全的追求，也影响着政治，滋养着对自然界的理解，并把人类安置于宇宙之中。</p>\n<p>本章探讨人类与其自然环境之间的互动，并反思他们对这一环境的理解。它提出的一些问题并非都能通过文本研究解决，却可以借助对物质遗存的考古发掘与科学分析加以探讨。不过，先须作一些提醒。要通过追踪气候、土地利用和人口水平的变化来回答环境与人口问题，所需的考古研究既繁琐又昂贵。它只在有限的若干遗址上进行过：由此向外推衍便有过分概括之虞。虽然新发现中世纪早期前所未知的文献证据之事罕见，但新的考古发掘与调查却经常开展，新的科学分析技术也不断涌现：基于现有数据的结论仍有可能随后的修订。</p>\n<p>鉴于上述限定，本章将考古证据与现存文献记录结合起来，以便把中世纪早期男女的感知与社会回应置于他们所居住的景观及其所享有的寿命的背景之中。因此，它把生与死既视为生物现象，也视为文化现象。第一节讨论环境：气候、景观与聚落分布。在此背景之下，第二节转向人口问题，估算人口水平，并试图解释似乎为中世纪早期所特有的生育率与死亡率的波动。最后一部分追问人们如何应对匮乏、疾病与死亡，并在一系列宇宙观念和医疗策略中寻求答案。在所有这些方面，浮现出的是一种强烈的地方性模式。</p>\n<h2 id=\"ch4-s0\">栖居地</h2>\n<p>中世纪早期的人们在其间生活、劳作与死亡的环境，不仅受自然资源和气候的影响，也受漫长的聚居与开发史前史的塑造。千百年来，人类活动从欧洲复杂的自然地理中造就了众多景观。这一互动始终是一个动态过程，贯穿中世纪早期，从自然界中塑造出人类的栖居地，并赋予中世纪早期生活以鲜明的异质性面貌。</p>\n<p>让我们粗略一瞥那个自然世界的丰富与多样。它的某些差异面貌在今天一如在中世纪那样显而易见——例如，不列颠东南角低地的农业潜力与北部和西部山区的山地经济之间的对比，或地中海沿岸的橄榄和葡萄与法国北部谷物种植之间的对比。此类差异反映了地质构造与土壤类型同相关地区特有气候模式的相互作用。在城市的无序蔓延和机械化集约农业的时代，细微的地方性差异——如这块田与相邻田地间土壤的差别，或山谷两侧日照的不同——已不再那么明显。但在中世纪早期，一个微小地方相对于另一个小地方的独特性质，往往与整个地区之间的差异同样重要，因为每个共同体都与其周遭环境的潜力和限制紧密协调。农耕、饮食、纺织、衣着、陶器、建筑材料：在这个微观区域的世界里，一切都因应本地可得的资源而形成。各处之间的联系来自社会、经济和政治的纽带——后续章节将对此加以探讨——也来自河流与海岸、道路与小径，它们使各个聚落得以彼此往来。</p>\n<p>中世纪早期景观多样性的其他方面，则反映了人类对自然环境不断演变的影响。其中一个标志是将新土地开垦为耕地的推进。在波河沿岸，古代末期意大利北部平原大部分仍覆盖着橡树林，砍伐森林只是从九世纪起才在此产生重大影响。同样，莱茵河与多瑙河以东的土地仍然林木繁密，虽然新来的移民从八世纪起便开始在这些林区开辟空地，大规模的砍伐直到十二世纪之前尚未推进到易北河以东。到十世纪，排水与河流渠化正在改变那些海岸线迅速变动、地势低洼的盐沼占主导地位的景观，如弗里西亚的圩田、东盎格利亚的沼泽地以及波河三角洲。尽管一位匿名的九世纪作家声称，弗里西亚人“几乎像水中的鱼一样生活，四面八方皆被水环绕”，<sup class=\"fn\" data-note=\"2:3\">3</sup> 但考古证据证实，中世纪早期的弗里西亚沿海地区支撑着人口稠密的共同体。居民住在人工堆高的土丘（terpen）上，将集约农业与对周围盐沼和水道的广泛开发相结合。从这些聚落出发，他们开始向紧邻潮汐泛滥平原之上的泥炭沼泽推进，自九世纪起开掘排水沟渠，从沼泽中开辟出小块的耕地，并在新近干燥的土地上建立新聚落。早在十一世纪晚期大规模排水工程开始之前，弗里西亚景观的改造便已进行良久。在这类地区，需要特别发挥想象力，才能设想中世纪早期景观不断变化的面貌。</p>\n<p>在另一些情况下，变化源于新作物与新技术的传播。伊比利亚半岛在这方面尤为显著，因为随711年穆斯林征服而来此定居的阿拉伯人和柏柏尔人引进了新的植物与灌溉技术。750年倭马亚王朝在大马士革被推翻后，该家族的重要成员逃往科尔多瓦，并于756年在西班牙建立了独立的政权——安达卢斯。在倭马亚诸埃米尔（如据说曾派人从其叙利亚故乡取来石榴籽和椰枣树的阿卜杜勒-拉赫曼一世，756–788年在位）的鼓励下，西班牙南部呈现出新的面貌，这不仅是由于引进了新的栽培植物，也是由于建立了在伊斯兰世界其他地方广泛实行的集约灌溉体系。在穆斯林统治下，安达卢斯诸城市周围的灌溉田带使得甘蔗、稻米和棉花之类依赖水源的作物得以种植，到十一世纪晚期，这些作物在西班牙南部已被广泛栽种。随着十世纪橙子的引入——它在规整园林中因其观赏价值而备受珍视——科尔多瓦、塞维利亚以及中世纪早期安达卢斯的其他城市令到访者联想起叙利亚的景观。</p>\n<p>景观的变迁还须置于气候与天气的背景中加以评估。中世纪早期的作者无疑对气象的正常状态有直觉的认识，极端的反常天气会引起评论。748年，爱尔兰遭受“异常深厚的积雪，以致全爱尔兰的牲畜几乎全部死亡，此后世界又为异常的干旱所炙烤”。874年在法国北部，“漫长而严酷的冬天”带来了“如此巨大的降雪，以致无人记得见过类似景象”。<sup class=\"fn\" data-note=\"2:4\">4</sup> 评论者还注意到气候与疾病或歉收之间的联系。据说820年的异常大雨导致了人畜的广泛疾病，使谷物和蔬菜在田间腐烂，并使那一年的葡萄收获量少而味苦。最糟糕的——其记录之精确也Certainly罕见——或许是838年12月26日淹没弗里西亚的“远超寻常沿海潮汐的大洪水”，它冲毁全部沙丘，使泥沙四溢，卷走了房屋、牲畜和2,437人。<sup class=\"fn\" data-note=\"2:5\">5</sup></p>\n<p>然而，无论这些中世纪早期的观察者多么敏锐，他们不可能知道此类突如其来的危机标志着长期气候变迁循环的开端，而这一循环极其缓慢地改变了他们所生活的世界。只有将文献见证与现代科学技术相结合，才能大致重构公元后第一个千纪欧洲的气候史。在这个千纪的中段（大约公元400–600年间），整个北半球平均气温显著下降约1.5°C，导致降雨和洪水增多。其他的表现还包括北海低洼海岸线的海平面上升，爱尔兰西南部泥炭沼泽的扩张，阿尔卑斯山冰川的推进，以及冬季多雨的大西洋气候模式向地中海地区的延伸——这与本千年前期特征不同。到约700年，一种更为大陆性的气候模式——炎热干燥的夏季和严寒的冬季——开始留下印记。（九世纪西北欧冬季频繁的大雪和河流封冻即是其表征之一。）直到本千年的最后一个世纪，气温才重新升至长期平均水平之上，并逐渐在十二世纪形成另一个气候最适宜期，北欧的气温比约500年时高出近2摄氏度。</p>\n<p>气候变化可能影响边缘土地维持耕作的能力，也无疑促成了中世纪早期聚落遗址的一些明显变迁。弗里西亚早期人造居住丘（terpen）的废弃与异地重建，与海水进退的各个阶段相对应。同样，随着中世纪早期爱尔兰西南部和不列颠西北部高地地区泥炭沼泽的扩张，当地社群停止耕种山坡田地，任其重新变为灌木丛和林地。在爱尔兰，肥沃的中部和东部低地谷物生产与畜牧活动增加的考古证据表明，人口向这些地区重新分布。一个研究得尤为透彻的例子是英格兰南部的白垩丘陵。在这里，七至八世纪地下水位逐渐下降，似乎促成了温彻斯特东南部山顶聚落的废弃。加之山坡土壤的持续侵蚀，这可能促使社群迁往沿海低地较黏重但更肥沃的土壤地带。相反，第一个千年最后三分之一时段的气候改善，或许有助于解释苏格兰谷物耕作的显著增加，以及谷物耕作传入北大西洋岛屿——尤其是设德兰群岛和外赫布里底群岛。</p>\n<p>土地使用和乡村聚落的变化也常常源于社群之间及社群内部政治经济关系的改变。例如，考古证据表明，在斯堪的纳维亚南部部分地区，七世纪农业生产集约化伴随着广泛的政治变革。一个研究充分的例子涉及西福尔德郡的博雷，在那里，更大的田块和新作物标志着耕作的加强，这与一个精英聚居中心的兴起相关联，其证据是规模宏大、随葬品丰富的墓葬冢。显然，强大的首领们通过将自身意志强加于该地区的下层农民，正在打造更大的王国，其榨取产物或贡赋的方式我们只能猜测，但他们留下了景观的改变，作为其新获权力的见证。</p>\n<p>类似但规模较小的结构调整，也促成了著名的“游动聚落”现象，这一现象影响了西北欧广大地区的许多乡村居住遗址。直到约700年，盎格鲁-撒克逊聚落往往或在其领地范围内逐渐迁移，或整体搬迁；在丹麦，聚落以这种方式持续游移，直至十一或十二世纪。在所有这些情形中，等级性减弱、剥削性增强的社会关系的出现，与不断变化的生态条件相结合，体现为空间重组和农业变革。</p>\n<p>在我们所论时期的末期，意大利半岛为这一主题提供了一个研究尤为透彻的变体。文献与考古证据一致表明，从托斯卡纳以南几乎整个意大利乡村在十至十一世纪经历了居住地的重新分布。在一个通常称为“筑堡聚居”（incastellamento）的过程中，分散的农户聚集为单一的设防村落。这些村落通常建在先前无人居住、地势高于原先居所的地点。迁往设防地点，只是部分对十世纪意大利乡村日益加剧的不安全状况的回应——当时的乡村正持续遭受撒拉森人（来自北非的阿拉伯海盗）和机动性极强的马扎尔劫掠队的袭击。王公权威的削弱也是原因之一，因为它使地主得以自筑堡垒并驻兵其上，从中威吓邻里。然而，与暴力威胁至少同等重要的是农业经济性质与组织的转变，它们推动了筑堡聚居。在人口增长的时期，沉重的新地租和劳役强化了地主对乡村劳动力的支配，使得将佃户迁置于领主的直接监视之下成为有利之事。</p>\n<p>人口流动的另一个方面是移民，无论自愿还是被迫。人口的暂时或永久迁移很可能伴随着中世纪早期的大部分族群间暴力。例如，我们听说易北河上游迈森附近的达莱明齐斯拉夫人，在906年屡遭马扎尔人攻击。这一地区“沦为如此悲惨的赤贫境地，以致达莱明齐人抛弃了自己的土地，投靠其他民族以求糊口”。<sup class=\"fn\" data-note=\"2:6\">6</sup> 这类苦难因缺乏政治意义而大多未见记载，其实际发生频率必然远高于证据所明确显示的。我们也偶尔得知蓄意的种族清洗，它同样必然对聚落和土地使用产生过暂时影响。易北河以东撒克逊人的命运是最广为人知的案例：804年，查理曼通过大规模驱逐成千上万的男女和儿童巩固了他对萨克森的征服，将他们迁往帝国的内地。</p>\n<p>诸如此类的迁移是聚落流动性悲哀而直接的体现。争议要大得多的是，五世纪罗马边防体系崩溃时，北欧长距离移民的程度。整个民族南迁寻找新家园的观念，最早由法兰克人、哥特人、伦巴德人和盎格鲁-撒克逊人在成功于原帝国行省境内建立自己王国之后所讲述的起源传说中提出。然而，正如我们所见，对于五、六世纪的社会与文化变迁，还存在其他有力的解释。<sup class=\"fn\" data-note=\"2:7\">7</sup> 虽然聚落考古确实表明，五至七世纪之间日德兰半岛根部周围和今德国北海沿岸的人口有所减少，且某些地方森林相应扩张，但移民未必是其唯一原因，甚至未必是主要原因。</p>\n<p>如果将注意力转向帝国边境内诸行省所发生的事情，我们的立论就更为稳妥，因为有组织的撤退是帝国公认的施政手段，并补充了难民逃离冲突地带前往帝国较安全地区的自发流亡。多瑙河边防的逐渐瓦解伴随着城镇的有组织撤退：先是五世纪最后二十年间沿该河上游南岸开始，然后约一个世纪之后沿其下游的巴尔干河段展开。480年代，来自诺里库姆的镇民、教士和圣徒圣髑被重新安置于意大利；随后在580至590年代，因斯拉夫人进攻而撤离巴尔干的撤退者和难民在希腊、爱琴海诸岛、意大利南部和西西里找到了更安全的家园。</p>\n<p>意大利东北部也未能幸免于这种动荡。来自巴尔干和多瑙河流域、反复翻越东阿尔卑斯山的入侵与劫掠，造成了一种不安全的氛围，一直持续到七世纪后期。亚得里亚海顶端上方旱地上的城市和聚落因易受攻击而日益衰落。其居民在亚得里亚海环礁湖的岛屿上找到了更安全的避难所，新的社群在那里发展起来，最初是临时避难地，继而是永久定居点。从约800年起，位于里亚托岛上独立且日益强大的贸易定居点威尼斯迅速成长：它的兴起标志着该地区岛屿定居点对人口流失的大陆地区的新的主导地位。</p>\n<p>在将中世纪早期的男男女女和儿童置于其栖息环境之中时，有两点浮现出来。第一，我们必须将乡村和城市聚落视为动态的、不断变化的，而非静止的、超时间的。居住遗址很少是稳定或永久的：它们坐落于一片遍布前代和前古遗迹的景观之中，无论是建筑物、田埂、墓地还是纪念物。随着人们迁移居所、改变耕作方式，他们在持续演变的欧洲景观上留下了印记。气候、自然资源的开发、可耕地的可得性、作物选择、居住地点、聚落形态和开发方式都在逐渐变化，各自促成了我们今日熟悉的欧洲环境。这种演变的一部分可以通过书面文献记录的逐年事件加以探察，但其大部分经历了数十年乃至数世纪的缓慢过程，唯有通过密集的区域考古才能辨识。我们如今对欧洲景观演变有如此多的了解，是历史学家与环境科学家密切合作的成果，也是历史视野从政治史或教会史事件扩展到对人类社会长期结构性变化的互补关注的成果。</p>\n<p>第二，无论我们看向何处，都会遇到构成中世纪早期主导特征的地域性乃至地方性。景观、自然资源、气候、农耕体系、聚落分布和人口密度不仅随时间变化，也因欧洲各地区、各地方而异。栖息环境的差异性和多样性具有根本意义：尽管后续章节将探讨人类为克服微观区域生活的局限而构筑社会联系、经济交往和政治效忠网络所作的努力，但本章下一节将展示人类经验在整个中世纪早期如何仍受地方条件制约。以地方性的而非概括性的视角思考，我们才能理解中世纪早期生存与死亡的动态。</p>\n<h2 id=\"ch4-s1\">生与死</h2>\n<p>经过三年婚姻，达高尔夫的妻子维莉图塔于约590年去世。年仅17岁的她死于分娩，“身怀自己的厄运”。她的孩子“生于死亡之口”，与她一同死去；她悲伤的丈夫“在一次死亡中……哀悼着两位的安葬”。我们对维莉图塔短暂一生和达高尔夫的悲恸的了解，仅来自她的死所引发的一组慰悼诗，但这首诗仍然提醒我们：尽管生死密不可分，二者既是个人生存与死亡的文化经验，也是人类集体存在随时间延续的生物学基础。<sup class=\"fn\" data-note=\"2:8\">8</sup> 维莉图塔和达高尔夫的案例引导我们思考关于500年至1000年间生与死的广泛人口学问题。本节探讨中世纪早期人口变化的性质，继而考察预期寿命和性别比例，以勾勒出本书研究对象诸社群的人口概况：维莉图塔的人生故事原来并不罕见。在上述区域和微观区域景观的背景下，本节还主张，生与死最好在地方情境中加以理解。</p>\n<p>由于生与死既是文化现象又是生物现象，原则上可以通过文化证据和生物证据——即文献记载和人类遗骸——加以研究。然而在实践中，这两类证据无论单独使用还是结合使用，都难以轻易解答历史学家想要提出的问题。我们立即发现，在我们看来重要的事情，在中世纪早期很少以同样的方式受到重视。以年龄问题为例。意大利、高卢、西班牙和巴尔干的识字城市精英保持至约700年的一项晚期罗马习惯，是立墓志铭以纪念死者。这些墓碑中有许多注明死者年龄。所载年龄有时全然不可能，有时明确标注为约数——“德米提乌斯在世约三十七年”<sup class=\"fn\" data-note=\"2:9\">9</sup>——且常常被凑成整齐得可疑的数字，那是符合社会惯例而非事实准确的年龄。看来很少有人确切知道自己多大年纪，年龄更多是一种社会角色问题，而非精确的时间长度。骨骼遗骸分析提供了另一种途径，但即便如此，对于已发掘的个体遗骸，也只能提供死亡年龄的近似值。</p>\n<p>也没有人在意统计人口，因为一个地方住着多少人的问题在中世纪早期从未出现，即便出现了，也没有人有手段精确回答。因此，估算欧洲中世纪早期人口的证据从根本上缺失——但这并未阻止各种猜测的尝试。姑且信之，从斯堪的纳维亚到巴尔干，约1000年的人口估计值在4000万上下浮动。最接近人口普查的，是九世纪加洛林帝国少数几份地产清册和对大教会地产上劳动者状况的描述。如后文所示，若谨慎使用，这些材料可以为相关特定聚落的人口密度、性别比例和年龄结构提供近似估算。即便如此，这些证据仍然稀少而不可靠。</p>\n<p>因为编纂者的目的并非人口普查，而是记录财政摊派和劳役，其中个人通常只有在负有赋税或劳役义务时才会被记载。这就是现有证据的核心问题：关于人口及其义务的统计记录，是既具有精细文书文化又拥有强势政府的社会的产物。如上一章所述，此类环境下留存至今的文献仅见于9世纪加洛林帝国的部分地区和10世纪末的英格兰，而来自al-Andalus（安达卢斯）埃米尔高度官僚化政权的文献则完全没有留存。在斯堪的纳维亚，11世纪之前没有任何书面文献，除了从墓葬考古学提供的间接证据进行推论外——且仅限于此类墓地证据得以保存并被分析的程度——别无他法可循。爱尔兰的情况也是如此，因为即使爱尔兰人的书写确实延伸到了某种记录形式，其痕迹也没有留存下来。至于斯拉夫人，至少直到10世纪晚期他们普遍以火葬而非土葬处置死者，对人口问题的考古评估必然无法进行骨骼分析。最好承认：我们无法说出中世纪早期欧洲的人口数量是多少。</p>\n<p>虽然我们无法测量人口数量，但我们能够推知中世纪早期人口水平的某些相对变化。追踪这些变化要从6世纪地中海的城市开始：它们无疑很拥挤，但其中许多已不如两个世纪前那样拥挤。每座城镇不仅是其乡村腹地的焦点，也是跨区域贸易网络的枢纽。<sup class=\"fn\" data-note=\"2:10\">10</sup> 因此，541年在尼罗河三角洲的珀路修姆爆发的腺鼠疫能够迅速从一个海港传播到另一个海港。这场瘟疫在6世纪余下的时间里频繁复发，此后间隔逐渐拉长，其人口影响在地中海东部尤为严重，因为持续的远程谷物运输助长了它的持续存在。该病于542年抵达西地中海盆地，在随后的两个世纪中反复蹂躏意大利、法兰西和西班牙沿海的城市以及北非，直到767年在南意大利最后一次爆发。但西地中海的远程航运比东部衰落得更早，这可能减轻了瘟疫在此地影响的严重程度。瘟疫偶尔也会沿罗讷河、埃布罗河和波河等主要贸易路线深入内陆，但其毒性随传播而减弱；它只有一次越过卢瓦尔河谷以北。</p>\n<p>腺鼠疫症状明显且致死迅速。“那是一种即死。腹股沟或腋下肿起如蛇咬般的疮伤，感染者被其毒素如此吞噬，以至于第二或第三天便死去。毒素的力量夺走了患者的神志。”<sup class=\"fn\" data-note=\"2:11\">11</sup> 在毒性最烈之时，疫情可能造成戏剧性后果：棺材短缺、集体掩埋、逃亡、城市崩溃。654年夏，瘟疫袭击了意大利多座城市。近150年后，教会史家执事保罗仍视这场浩劫如末日降临。“死者之多，以至于在罗马城，父母与子女、兄弟与姐妹两两并置于灵床，被送往坟墓。同样，这场瘟疫也使提基努姆〔即帕维亚〕人口灭绝，以致全体市民逃往山区和其他地方，集市和全城街道上长满了青草和灌木。”<sup class=\"fn\" data-note=\"2:12\">12</sup> 无论实际死亡人数多少，这样的爆发留下了创伤性记忆和持久的社会失序感受。</p>\n<p>从人口学角度看，瘟疫的影响无疑因地区和城市而异。它在罗马和马赛数度造成局部重创，在特里尔和托莱多只是一时之痛，而在南特或巴黎则完全没有出现——这些流行病造成了区域性的而非全局性的人口下降。事实上，腺鼠疫很少超出地中海繁忙的贸易港口及其紧邻腹地的范围，只有那里才具备其传播的前提条件。尽管如此，剧烈的疾病痉挛肯定也曾光顾大西洋欧洲和不列颠群岛更为乡村化和人口稀疏的地区。6、7世纪的爱尔兰和盎格鲁-撒克逊史料中出现过“黄瘟”、“儿童死亡”、“大死亡”和“痘疫”等提法，但这些措辞无法可靠地转换为现代医学术语。无论其确切性质如何，这些流行病都造成了严重后果。数位国王死于疾病，其死亡不可避免地使脆弱的王国陷入动荡。有时，整个地区似乎也遭到毁灭，如664年，其中一次疫情先蹂躏英格兰南部，继而北上，最终蔓延至爱尔兰。据比德记载，在诺森布里亚，“这场极其惨烈的瘟疫……带来了如此严重的毁灭，以至于一些曾经人口稠密的大村庄和庄园，只剩下一小撮流散的幸存者，有时甚至一个不剩”。<sup class=\"fn\" data-note=\"2:13\">13</sup></p>\n<p>在评估流行病是否对欧洲人口水平产生重大影响时，我们无法超越比德式灾难的文学印象，去衡量究竟有多少人死亡或逃往未受感染之地。我们也无法确定人口水平是否在超过两三代人的时间内有所下降。我们应避免过度概括的诱惑，与其假设人口总体下降，不如将流行病引起的衰退与失序解释为短期性和局部性的，因地点而异，这才是最合理的解读。</p>\n<p>同样的道理也适用于约800年起在史料中如此显著的粮食短缺。整个9世纪，饥荒平均每四年发生一次，10世纪降至每十年一次，但11世纪再次上升。其中许多属区域性影响：例如850年的莱茵兰、853年的萨克森、882年的巴伐利亚、889年的“各地”。<sup class=\"fn\" data-note=\"2:14\">14</sup> 相比之下，爱尔兰这个以畜牧业特别著称的国家，在中世纪早期经历了反复的牛瘟爆发，对粮食供应和人类抗病能力产生深远影响。700年，“牛群死亡”在年初爆发，后果极为严重：“爱尔兰饥荒与瘟疫横行三年，以致人食人。”<sup class=\"fn\" data-note=\"2:15\">15</sup> 然而，只有一次可以明确看出整个欧洲同时受灾。1005年的饥荒如此严重，“无人记得曾有过如此残酷的饥荒”，<sup class=\"fn\" data-note=\"2:16\">16</sup> 又有食人报告：这场饥荒从不列颠群岛肆虐到巴伐利亚。但1005年可怕的饥荒毕竟是例外。总体而言，匮乏与灾难今年在此处，明年在彼处。没有任何远程食品贸易来平滑匮乏与丰裕之间的波动；同样，也没有一场普遍的苦难周期折磨整个中世纪早期的欧洲。</p>\n<p>同样强调区域性的观点也适用于那些可能有利于人口增长的条件。维持人口增长的关键前提是定期而充足的食物供应。扩大耕种面积或强化农业技术都可以增加食物的可得性——其程度受气候和土壤肥力、劳动力供给和农业技术的限制。农业变革是否使中世纪早期的耕作更为集约，从而促进了人口增长？最恰当的回答仍然是强调区域差异。以法国的一小块地区为例：至少从8世纪晚期起，巴黎以西地区遍布水力磨坊，而向南仅50公里处，直到11世纪磨坊仍然罕见，因为不同的地质条件和土地持有模式延迟了其引入。无论是重犁的使用还是新作物的引进——二者都在许多不同地方得到印证——都呈现出相同的图景：变革是局部化的，且除技术知识外还依赖于诸多因素。至少，正如第五章将要论证的，一位新的、精力充沛的地主的到来可能带来相当大的变化。唯一似乎在任何地方都没有改变的是极低的谷物产量，即使在最肥沃的土壤上也是如此。尽管收成的质量无疑极不稳定，收获量仅为播种量的两到三倍似乎很常见：而且这批收成中还须留出明年的种子。如果中世纪早期乡村人口有所增长，更集约的粮食生产并非主要原因。</p>\n<p>相比之下，欧洲许多不同地区提供的证据表明，开垦土地相当普遍，肯定从8世纪起，某些地方或许从7世纪就开始了。新定居点的考古遗迹、花粉沉积的古植物学分析，以及关于耕种向林地扩展的文献记载，都指向同一方向。无论证据来自爱尔兰、英格兰南部、苏格兰、法国中部、加泰罗尼亚、意大利北部和中部、阿登、黑森、巴伐利亚东部，还是波兰西部的核心地带，都一致表明耕种的扩展，尤其是谷物种植的扩展。无论是个人主动进行的小规模开垦，还是领主、教会甚至国王以充沛精力推动的更大工程，砍伐灌木或森林构成了中世纪早期农业变革的主要形式。可耕地的扩展或许应当与欧洲乡村人口的增长联系起来，因为它既预设了足以胜任此任务的劳动力供给，又带来了粮食供应的增加。当然，少数提供了特定时刻劳动力状况快照的9世纪庄园清册也强化了这样一种观点：到这个时期，土地资源已承受相当大的压力。9世纪中叶，属于圣贝尔坦修道院的南佛兰德土地，人口密度可能达到平均每平方公里二十人。巴黎塞纳河盆地圣日耳曼德普雷修道院的领地，平均密度更高，某些领地高达每平方公里四十人。</p>\n<p>除了北欧谷物种植低地在9世纪已支持密集定居这一说法之外，地中海多山边缘地带还提供了更多线索。事实上，在加泰罗尼亚的高地山谷中，乡村人口可能已达到19世纪的水平。唯一容许对人口增长作出估算的文献，来自813–814年马赛圣维克多修道院在普罗旺斯的领地。这份庄园清册的证据表明，该地区某些地产上的人口增长比其他地产更快。据推算，圣维克多领地的总体增长率相当于一个世纪内人口翻了一番。如果这些计算多少可靠，它们意味着至少在9世纪欧洲的某些地区，人口能够以接近工业革命前夕英格兰所维持的速度实现短暂的增长激增。总之，从9世纪起，欧洲部分地区的不同时期都有明确的、虽属短期但相当可观的人口增长迹象。</p>\n<p>8、9世纪的总体图景是：农业方法与技术的零散区域性变革、广泛的土地开垦，以及实现可观人口增长的能力。然而这些发展的累积影响有限，因为直到约950–1050年才有广泛而持续的人口增长的明确证据。中世纪欧洲持续的人口回升大约始于千年之交。在此之前的两三个世纪里，土地开垦和人口增长受到疾病爆发、频繁饥荒和气候恶化效应的抑制。</p>\n<p>对中世纪早期缺乏稳定人口增长最可能的解释是：以粮食短缺和自然灾害为标志的生存危机的反复发作，打断了增长与扩张的时期。由于饥荒很少普遍发生，又由于暴雨、干旱和其他气候灾害的影响同样具有区域性或地方性，人口增长与停滞（甚至短期下降）之间的波动很可能也是区域性的且不连贯的。这一切表明，在中世纪早期，并不普遍具备支撑长时期稳定人口增长所需的资源。一个濒临生存危机边缘的人口，很难抵御歉收之年或牛瘟流行之时。虽然确实存在人口稠密的聚居区，但那种密度既不均匀也不稳定。简言之，整个中世纪早期，人口水平的变化率在各处都不可预测地波动。如果匮乏与灾难的影响是反复无常且不均衡的，那么人口增长也是如此。</p>\n<p>人口要增长，需要持续的出生超过死亡的盈余。在评估生育率和死亡率时，墓地证据极为宝贵，因为细致的分析可以促使中世纪早期的死者遗骸提供大量有价值的信息，包括特定社群中的性别比例、预期寿命、疾病模式和流行的死亡形式。但须附带说明：骨骼分析并非精密科学，而且一座墓地理所当然未必容纳所有人（或即使是某一社区死者的哪怕是具有代表性的）样本，墓葬证据仍然鲜明地揭示出当时的男女生活、繁衍和死亡的具体境况。两处在时空上相距甚远的墓地说明了这种证据的潜力。</p>\n<p>第一处是英格兰东南部的一处遗址，使用时间从五世纪末延续至八世纪中叶。在巴克兰（Buckland），至少有20%的社区成员在年满18岁之前便已死亡，而活到60岁或以上者仅约6%。在成年人口中，女性与男性之比为3:2，但女性的预期寿命明显较短：成年女性的平均死亡年龄为31岁，而男性为38岁。这些数字虽属粗略估算，却表明当时的人口面临着极为沉重的儿童死亡率、育龄期女性死亡率高企、女性过剩（这可能意味着男性经常离家在外死亡——死于战争或狩猎），以及老年人远较近几个世纪更少、更年轻的社会状况。此外，既然巴克兰附近的居民将5岁以下的婴幼儿另行埋葬于公共墓地之外，实际的儿童死亡率必然要高得多。位于不列颠西南部坎宁顿（Cannington）的六世纪墓地提供了一个更可信的数字：在那里，全部人口的64%在年满18岁之前死亡，且确实有15%未能活过一岁。</p>\n<p>第二个例子是苏黎世市中心的明斯特霍夫（Münsterhof）墓地。它用作853年建立的圣母修道院（Frauenmünster）周边形成的早期城市聚落的葬地，并一直使用至十二世纪末。图2.2展示了其总体人口结构。</p>\n<figure><img src=\"images/fig_2_2.png\" alt=\"苏黎世明斯特霍夫墓地墓葬的年龄构成\"><figcaption>苏黎世明斯特霍夫墓地墓葬的年龄构成</figcaption></figure>\n<p>与巴克兰不同，年幼儿童及部分婴儿埋葬于此，但似乎在十一世纪之前，死胎和出生数周内夭折的婴儿仍被安葬在别处。在埋葬于明斯特霍夫者中，近50%未能活到18岁，至少30%死于生命的前五年，其中三分之二死于一岁之内。就围产期、婴儿及儿童死亡率而言，九、十世纪苏黎世人口的损耗率与巴克兰或坎宁顿大体相当。相比之下，苏黎世的成年人口则颇为不同。男女比例更为均衡，为五男六女之比，这与中世纪盛期的许多其他墓地一致。此外，成年人口的平均死亡年龄表明，苏黎世的生存保障明显优于巴克兰：大多数成年人死于50至60岁之间，少数人活到60岁以上。尽管如此，图2.3所揭示的男女之间仍存在明显差异：20岁男性的平均预期寿命为57岁，而同龄女性仅为49岁。在这种环境中，分娩始终是一个不容忽视的危险，因为超过三分之一的成年女性死于育龄期。</p>\n<figure><img src=\"images/fig_2_3.png\" alt=\"苏黎世明斯特霍夫墓地人口的平均寿命\"><figcaption>苏黎世明斯特霍夫墓地人口的平均寿命</figcaption></figure>\n<p>这些数字虽然只是近似值，却仍可引出几点一般性观察。首先，地区和时间上的差异再次值得注意：人口总体水平的显著波动反映了各地不同的生育率和死亡率。其次，如果平均而言有一半人口死于婴幼儿期或儿童期，这就意味着每一个长大成人的孩子，女性都要经历两次怀孕和分娩。为使人口水平保持稳定，每对夫妇必须生育四个子女，其中两个存活；若要人口增长，则须更多。还有一个不可避免的观察结论：出生与死亡紧密相连。死亡的风险在生命的最初一年——很可能甚至是最初几周——始终最大，而对成年女性而言，则集中在分娩前后。在这一点上，中世纪早期的欧洲与当今缺乏现代卫生条件和医疗的那些社区并无太大区别。因此，这一人口结构与当代西欧形成鲜明对照，如图2.4所强调的那样。</p>\n<figure><img src=\"images/fig_2_4.png\" alt=\"中世纪早期与现代苏黎世的人口构成\"><figcaption>中世纪早期与现代苏黎世的人口构成</figcaption></figure>\n<p>来自巴克兰、苏黎世等地的墓地证据揭示了中世纪早期生活质量的某些方面。骨骼遗骸所暴露的症状包括：龋齿磨损严重和脓肿等牙齿问题；愈合后弯曲或缩短的断肢；关节部位长期炎症和感染，患者因疼痛而终生畸形；以及困扰中老年人生活的关节炎、骨质疏松或脊椎病等令人痛苦的骨骼疾患。墓地有时还暗示某些疾病（如肺结核）在社区中长期流行，并揭示出 otherwise 无从知晓的个人生命故事：图特林根（Tuttlingen）的一位成年女性，其罗圈腿源于童年营养不良；格里赛姆（Griesheim）的一名男子，左腿在膝下截肢，却靠装有一只带防锈青铜盖的木腿活到了50多岁；苏黎世的一名先天畸形儿童，出生时脊柱严重扭曲；肯特郡的一名男子，左眼被刺伤，随后颅后又遭三记斩首打击。骨骼遗骸唤起了一个被疾病、疼痛和畸形所笼罩的世界，而私人仇恨与战争的暴力又不时使之加剧。</p>\n<p>然而，单凭墓地证据并不能完全解释中世纪早期的生育和死亡模式，因为二者也受到一种无法通过考古探究的社会习俗的影响。例如，考古学无法阐明生育率是否受到刻意限制家庭规模的影响。从基督教时代之初起，教士们就一直徒劳地抨击避孕和堕胎，无疑，具有有效避孕和堕胎功效的常见草药在整个中世纪早期的欧洲广为人知。杀婴的个别事例也无法完全排除，尽管关于某些九世纪农民社群和维京时代斯堪的纳维亚存在系统性杀害女婴的说法仍然颇难令人信服。</p>\n<p>这里有两个相互关联的问题。第一，与许多显示女性占优势的性别比的墓地不同，九世纪的地产清册一致报告男性多于女性。以杀害女婴来解释这一点，等于忽视了在农业地产劳工清册中女性往往被少记的充分理由。第二，刻意限制家庭规模的措施，与其说与性别相关，不如说更可能与贫困的束缚相关。就目前能够估算每对夫妇存活子女的数量而言，只有在王室世系或九、十世纪最富有、最有权势的大陆贵族中，超过三四个子女的家庭才较为常见。一项反复重申的反对堕胎的法令，为有意识地限制家庭规模与贫困之间的关联提供了重要证据：在对怀孕头六周内终止妊娠与胎动之后终止妊娠规定不同处罚之后，该条文继续写道：“但贫妇因抚养孩子之艰难而行此事，与娼妓为掩盖其罪行而行此事，其间大有区别。”<sup class=\"fn\" data-note=\"2:17\">17</sup> 其他文本也对杀害孩子的贫妇规定了轻得多的刑罚。贫困可能迫使妇女堕胎甚至杀婴这一认识，逐渐成为教会法的既定内容，但墓地证据永远无法揭示这种现象实际发生的程度。</p>\n<p>如果说贫困在社会光谱的一端抑制了生育，那么生活方式则可能影响了另一端的死亡率。对高等地位遗址出土动物骨骼的分析表明，中世纪早期的精英享用富含家畜肉的饮食，这些家畜被饲养至肉质最佳的早期即行屠宰，辅以野禽及野猪、鹿等猎物。而农民遗址的食物残余则表明他们食用的是老得多的牲畜之肉，这些牲畜的主要功能可能是提供羊毛、奶或畜力，而非肉类。更好的饮食以及获得当时有限的医疗资源的机会，或许使精英女性比其他妇女更容易挺过分娩的创伤，但她们的男性亲属却可能比其他社会群体的男子更容易早逝。十世纪德意志贵族为此提供了一个经充分研究且极端的例子。狩猎、战争、仇杀和司法决斗使奥托王朝贵族的男子锐减，他们的女性亲属——无论是献身基督教独身生活的姐妹，还是守寡的妻子和母亲——往往远比他们长寿。在这种背景下，死亡可能产生严重的政治后果。当统治王朝本身涉及其中时，其结果往往是激烈的继承纠纷，或由幼主继位——通常由其母亲监护。</p>\n<p>在任何社会中，人口变化都反映了气候灾害和饥荒等外部因素，与家庭规模限制、避孕和堕胎观念、医疗知识以及某些社会群体中危险生活方式的盛行等内部社会习俗之间的复杂互动。中世纪早期的证据虽然零碎而印象化，却足以清晰地展示生育和死亡的主要模式。慢性疾病带来的身体痛苦可能影响大多数人；地方性疾病不时因传染病疫情而加剧，瘟疫只是其中之一。在这些困境之中，婴幼儿、临产的妇女和贵族男子都面临着更高的死亡风险，然而欧洲人口仍在中世纪早期的进程中实现了增长。尽管各个社区经历了起伏不定的生育和死亡模式，但总体上升的曲线是清晰的。</p>\n<p>此外，随着千禧年临近，人口变化的无常态势正让位于更为稳定的增长率，因为增长的束缚正在缓解。可以肯定，到公元1000年前后，气候总体上正在改善。文献证据表明，土地开垦工程正以更大的规模展开。地方性和区域性贸易网络不断强化，将粮食运往城镇，而这些城镇的发展——尤其在意大利北部和低地国家——必然依赖于农村剩余人口。<sup class=\"fn\" data-note=\"2:18\">18</sup> 到十一世纪初年，欧洲的人口与经济正进入一个持续增长的时代，这一增长将延续至十三世纪。中世纪盛期的发展并非凭空突然出现，但它确实巩固了此前一直踌躇不前或断断续续的变化。</p>\n<h2 id=\"ch4-s2\">面对灾难的回应</h2>\n<p>对任何中世纪早期的共同体而言，日常生活都意味着面对死亡与灾难。在这种无时不在的威胁下，男男女女不仅要抚养子女、勉强维持生计，还要努力理解他们所生活的世界，并尽其所能改善自身的处境。他们的回应受制于种种观念与假设：关于祸福的成因、人在宇宙中的位置、以及死后会发生什么。然而，要重现这些心态几乎是不可能的，一方面因为从物质文化推断态度、信仰和仪式存在困难，另一方面因为基督教的传播伴随着对旧有人类命运解释的压制。如后文所见，尽管基督教宇宙观在文献记录中占据主导地位，我们仍能捕捉到那些其他观念的一些痕迹。这一考察所揭示的，是中世纪早期的人们在面对制约其生存的种种灾难时回应方式的多样性与灵活性。</p>\n<p>关于应对病痛、残疾与疾病的种种方式，证据尤为充分。我们可以将治疗技术与资源作如下分类：研习承自古代世界的书本医学的职业医生；掌握本地草药知识的民间从业者；活着的与已逝的基督教信仰治疗者；擅长运用教会仪式进行治疗的神职专家；以及护身符、符箓、祷文和咒语等传统做法。然而在实践中，这些界限并不分明，因为一些圣人拥有医学知识，而神职人员有时会仔细抄录草药方剂，将其与基督教祈祷及咒语式的念诵混合使用。这些证据通常无法呈现作为实践而非文本策略的治疗，这尤其是因为大多数方法实际应用的直接证据极为匮乏。不过似乎可以认为，专业性较强的资源分布稀疏且不均，因此任何一地所能获得的治疗选择很可能都十分有限。除了少数富人之外，对所有人而言，仅费用一项就足以排除几乎一切形式的外部帮助：职业医生为其服务或稀有药物收取费用；最近的圣髑所可能路途遥远、难以抵达，其看守者还往往期待可观的馈赠。大多数人只能依靠当地可获得且免费的技术。</p>\n<p>然而，在诸多治疗方式中，人们对其中一种的了解远远超过其他所有形式，即基督教圣徒圣髑所提供的治疗。其中一些是二三世纪殉教者的坟墓；另一些则是圣男——较少情况下是圣女——的墓葬，这些人生前即以自身的虔敬缓解人间苦难而闻名，其事迹通常包括以祈祷和仪式治愈病人，有时还辨认并驱除基督徒认为居于受苦者体内的魔鬼。无论是否殉教，所有圣徒都被认为有能力成功地代求于基督教传统的上帝，为人类事务赢得有益的干预：其重要性反映了一种明确阐述的宇宙观，即认定某些人在生前与死后是超自然助力的特殊渠道。</p>\n<p>随着基督教的传播，神职人员建立了新的圣髑所，或是将既有圣徒的圣髑迁往新的地点，或是推动人们将新近去世的宗教领袖尊为圣徒。在某些地方，这些圣髑所延续了前基督教时代曾寄于灵泉与树木之中或归于当地神明圣所的治疗力量；在另一些地方，则出现了全新的宗教景观，与先前的仪式场所竞争并最终取而代之。由于神职人员有记录圣徒所施治愈、驱魔（驱逐魔鬼）及其他代求事迹的习惯，基督教圣髑所的治疗成为中世纪早期各种治疗可能中文献记录最为完备的。</p>\n<p>我们已经遇到过多位圣徒中的一位——马丁，以及通过他的代求而实现的诸多治愈中的一例。在作为图尔主教（371–397）、治疗者和行奇迹者度过了辉煌而富有争议的一生之后，他成为中世纪早期文献记录最完备、最受广泛崇敬的圣徒，其崇拜从苏格兰、爱尔兰一直延伸到西班牙和德意志。尽管位于图尔城外那座装饰华美的五世纪教堂中的陵墓始终是他崇拜的中心，但在约872年至885年间，出于防范来自海上的斯堪的纳维亚劫掠者维京人的威胁，马丁的圣髑曾被转移到沙布利的一座教堂中妥善保管。<sup class=\"fn\" data-note=\"2:19\">19</sup> 热纳沃法正是在那里治愈了先天性的失聪与失语：她与其他朝圣者一同聚集在教堂门外，彻夜静默祈祷。记录她造访细节的神职作者，在描述她的治愈时借用了常见的宗教母题，将其表现为一个喷火的魔鬼与白发闪耀的圣徒之间的对峙，而后者轻而易举地取得了胜利。作者如此写作，依赖于基督徒中广泛流传的对于世界的理解：善恶之间的宇宙斗争体现于人体所显现的症状之中，而在这种斗争里，基督徒的救赎与肉体的治愈是同义的。基督教信仰的基本信条——救赎来自对基督的信仰——轻松地将圣徒纳入其中，使其成为神圣恩泽或惩罚流经的渠道。当他的治愈之手作用于热纳沃法时，圣徒宣告：“我是马丁，主耶稣基督藉着我乐意恢复你们的健康。”<sup class=\"fn\" data-note=\"2:20\">20</sup></p>\n<p>基督教教义所依赖的宇宙观所解释的远不止个人的肉体疾苦：它也为死亡与灾难提供了解释。首先，《圣经》提供了一个参照与比较的框架。873年，“埃及人的古老瘟疫”席卷欧洲大部——那是一场蝗灾。蝗群飞起时，翅膀的嗡鸣充斥空中：“人们几乎看不见天空，仿佛隔着一面筛子观望。”神职人员抬着十字架和圣徒圣髑在受灾地区游行，“恳求上帝护佑他们免遭此灾”。<sup class=\"fn\" data-note=\"2:21\">21</sup> 然而最重要的是，《圣经》呈现了一个典范：苦难与毁灭是上帝因个人道德败坏或社会失序而震怒的表征。在以基督教教义诠释现世苦难方面，无人比格里高利一世贡献更大。他一生大部分时间饱受病痛折磨，从《旧约》约伯的故事中汲取灵感与慰藉——约伯是虽遭疾病与苦难而信仰不移的典范。对格里高利私人生活适用的道理，也同样适用于他周围的世界。590年，当瘟疫肆虐罗马、连其前任佩拉吉乌斯也罹难时，当选教皇的格里高利向会众解释了这场瘟疫的缘由与补救之道：</p>\n<p>看哪！上天震怒之剑正击打整个基督徒共同体，他们接连死于突然的杀戮。没有病症预示死亡的临近；正如你们所见，死亡赶在疾病发作之前降临。遭打击者来不及流泪悔改便被击倒。试想，那没有时间为自己行为悔改的人，将如何面对【末日审判时】严厉的审判者。我们的市民并非被零星带走，而是成批倒下：房屋空无一人，父母参加子女的葬礼，继承者先于他们进入坟墓。因此，让我们每个人趁死亡降临之前尚有流泪之时，投身于悔罪与哀恸之中吧。让我们在心中回想自己如何误入歧途、犯下何种恶行，并以泪水惩罚自己。“让我们以忏悔来到上帝面前”，并如先知所劝勉的，“让我们举起双手，将心向主仰望”。<sup class=\"fn\" data-note=\"2:22\">22</sup></p>\n<p>无论苦难源于瘟疫、饥荒、维京人的袭击还是任何其他灾难，恰当的回应都是斋戒、祈祷与忏悔。从罗马到爱尔兰，凡基督教信仰找到信众之处，基督徒都会本能地通过忏悔游行与代求祈祷来安抚他们的上帝，正如873年蝗灾肆虐地区的地方神职人员所为。这类措施既可以是地方性的，也可以是普世性的。面对792–793年冬严重而广泛的饥荒，查理曼命令法兰克全境所有主教、司铎、修士、修女和神职人员举行弥撒、咏唱诗篇，命令所有人斋戒，并要求所有世俗与教会的土地所有者施舍赈济、供养其佃户直至下一个收获季节。同样，1009年当其王国因维京入侵而面临迫在眉睫的崩溃时，盎格鲁-撒克逊国王埃塞尔雷德二世（978–1016）命令“全体国民”采取相同的行动，以便“我们得以获得上帝的怜悯与慈悲，并倚靠他的帮助抵御我们的敌人”。<sup class=\"fn\" data-note=\"2:23\">23</sup> 祈祷、忏悔与施舍是一种心态的实际体现：这种心态将人类的苦难归于灵性的亏缺，并在人与神之间关系的重新平衡中寻求对生理、环境与政治失序的救治。</p>\n<p>在中世纪早期共同体面临的各种危机中，有一种特别引发了大量道德与实践问题：饥荒。一个问题是何为合法的食物。基督教教义倡导一种由多种标记界定社会边界的共同体观念，其中之一便是食物法规——一旦违犯便会污染个人与群体的行为规约。几类动物的肉通常被禁为不洁：与人共居的动物，如猫、狗和老鼠；因不正当接触血液或精液而受污染的动物；吃过腐尸或人尸的动物；以及被发现时已然死去的动物。然而，当食物匮乏时，饥饿的人们中很少有人还会按这些条目思考。例如869年夏，饥荒对法兰西中部的打击尤为严重。“无数人悲惨死去，以至于据说有人吃了人的尸体。据说还有一些人吃了狗肉。”<sup class=\"fn\" data-note=\"2:24\">24</sup> 一个颇为不同的道德问题是谷物的公平价格。585年春，谷仓中的存粮远在下次收获之前便已耗尽，商人们“残酷地盘剥民众”，以暴涨的价格出售仅存的酒和谷物。挣扎求生的家庭靠晒干并研磨葡萄籽、榛树柔荑花序、蕨根或田中玉米的幼苗，来勉强补充所剩无几的面粉。我们也知道那些完全买不起谷物的人的境遇：“另有许多毫无面粉之人采集各种草类充饥，结果腹胀而死……穷困者将自己卖身为奴，只为换取一点食物。”<sup class=\"fn\" data-note=\"2:25\">25</sup> 正是为了缓解此类境况，查理曼在792–793年对粮价进行了管制，以防止地主追逐暴利而背弃其施舍义务。正如这项立法所表明的，价格与利润更多是宗教关切的对象而非经济规划的事务，但施舍至少起到了向最需要者重新分配食物的作用。</p>\n<p>然而，基督教既未垄断对灾难的解释，也未垄断可行的补救之道。在基督教传入未久的地区，新宗教本身的有效性可能成为问题。英格兰南部的政治精英在664年瘟疫之前不过一代人左右才接受新信仰：作为对疫病蔓延的反应，东撒克逊人“背弃了基督教信仰的圣事而叛教……他们开始修复荒废的庙宇、崇拜偶像，仿佛如此便能保护自己免于瘟疫”。<sup class=\"fn\" data-note=\"2:26\">26</sup> 数世纪之后，德国传教主教奎德林堡的布鲁诺（1002–1009）向东欧的马扎尔人、波兰人和佩切涅格人传教。他还撰写了布拉格的传教士阿达尔伯特的传记，以自身经历来揭示阿达尔伯特于997年在格但斯克附近殉教之前所遭遇的困境。在描述最终导致阿达尔伯特死于其手的普鲁士人的敌意时，布鲁诺将他们对基督教的抵制表现为将传教士的到来与土地的贫瘠相等同：“‘由于这些人，’普鲁士人说，‘我们的土地将不再有收成，我们的果树将不结果实，新牲畜不能出生，老牲畜死亡。’”<sup class=\"fn\" data-note=\"2:27\">27</sup> 像布鲁诺这样敏锐的传教士明白，在争取丰饶的斗争中，宗教与灾难对非基督徒而言正如对基督徒一样密不可分。</p>\n<p>然而，中世纪早期欧洲的许多男女，既不具备格里高利大帝那样博学的世界观，也不生活在非基督教共同体之中。毋宁说，他们的基督教在对世界的理解与回应上呈现出丰富的多样性，因为基督教的传播是一个漫长的文化接触过程，其日常内容在数百年间始终处于协商之中。如第七章将要论证的，高级教士固然对应对挣扎于生存线上的乡村人口所关切的紧迫问题——牲畜与田地的丰产、孩子的健康、风调雨顺——有自己坚定的基督教实践主张，但他们在推行这些主张方面收效有限：地方共同体及其乡村司铎坚持使用更为多样的解决办法，以应对严酷生存的种种困难。当我们思考天气问题，尤其是可能毁坏收成的夏季冰雹时，这一点表现得十分清楚。整个中世纪早期普遍存在两种相辅相成的信仰：其一，恶魔是多余的降雨和冰雹的罪魁祸首；其二，存在“制造风暴者”——男人，偶尔也有女人——人们可以求他们转移恶劣天气，或者让冰雹降落在遭人憎恨的邻居的土地上。为实现所期望的天气而采用的方法，包括向圣徒、“制造风暴者”及其他被认为有能力干预者祈祷和念咒；口头的和书写的符咒、勒令和祷文；支付保护费，以及种种其他手段。</p>\n<p>其中许多做法主要因教士的一再谴责而为人所知，但西班牙西北部一份特殊的文献确实让我们看到，一个人实际上做了什么来抵御冰雹。在八世纪末或九世纪初，一位“上帝的仆人”奥里奥卢斯撰写——或请人代为书写——了一道护符，以使冰雹远离他和邻居们的田地。他将两片写有文字的石板对折并用文字朝内的方式系紧；在念了九道确保其效力的咒语之后，他将其埋在卡里奥附近自己的田里，直到1926年才被农民挖出。奥里奥卢斯勒令“众族长米迦勒、加百列、塞西铁尔、奥列尔、拉斐尔、阿纳尼埃尔、马尔莫尼埃尔，你们手握云彩者”，要他们“翻越群山而去，无论公鸡啼叫还是母鸡咯咯，无论犁田人犁地还是播种人播种，皆不得返回”。他还勒令撒旦不得伤害树木、庄稼、葡萄藤和果树，并加上了归于圣克里斯托弗名下的向上帝的祈祷文，最后以“以圣父、圣子和圣灵之名，阿门，阿门，永远阿门，哈利路亚”结束。<sup class=\"fn\" data-note=\"2:28\">28</sup> 奥里奥卢斯的石板不仅表明了持久的地区性文字习惯的延续；<sup class=\"fn\" data-note=\"2:29\">29</sup> 还显示出一种广谱式的消除冰雹的方法：同时呼唤大天使、圣徒和撒旦，将祈祷、咒语和勒令混合成一种由多样的传统做法和地方智慧调制的强力鸡尾酒。</p>\n<p>奥里奥卢斯所关心的是实际事务，但对许多中世纪早期的人来说，恶劣天气、瘟疫以及自然的其他反复无常，在人的经验中也占有预兆性的位置。例如，彗星的出现“预示着饥荒或瘟疫或战争或大地的毁灭或可怕的暴风雨”。<sup class=\"fn\" data-note=\"2:30\">30</sup> 天文学方面的专家——以及关乎王国罪孽方面的专家——随后会对彗星的意义作出论断，而怀有政治意图的编年史家和评论者也会就彗星的含义发表自己的见解，对蝗虫、疾病和其他此类征兆同样如此。事实上，九世纪加洛林宫廷的作者们如此频繁地将天灾报道为叛乱、维京人进攻或国王死亡的直接先兆，以致其中某些“灾难”很可能是修辞性的信号而非实际的苦难。自然界的失序已成为人类社会衰败的标志，是动荡与混乱的镜像。对于一些思考人间事务应有秩序的博学之士而言，这也是一个可能的迹象，表明善与恶的宇宙斗争可能正按照《圣经·启示录》预言式异象的方式接近终局。</p>\n<p>在公元1000年前后的几十年间，对末世的思考（末世论）以及对可能暗示其临近的种种征兆的审视都增强了。约克大主教伍尔夫斯坦（1002–1023年在任）对这一切并不陌生。他在1005年严酷饥荒之后、并在1014年英格兰面临极端政治动荡之际，散发了一篇布道文，总结了中世纪早期关于天灾、社会秩序与世界末日之间关系的思想。</p>\n<p>亲爱的人们，请认清真相：这个世界行色匆匆，末日临近；因此在世间，事情每况愈下，而且因民众的罪孽，在敌基督来临之前，情况必然大大恶化，届时全世界四方上下都将充满恐怖与可怕。</p>\n<p>……</p>\n<p>因为我们所有人都清楚明白，我们以往所犯的罪远多于我们的悔改，所以许多灾祸正侵袭这个民族。无论国内还是国外，长期以来情况都不好，毁灭和饥荒、焚烧和流血在每一个地区一再发生；偷窃和杀戮、叛乱和瘟疫、牲畜疫病和疾病、恶意和仇恨以及强盗的劫掠给我们造成了极大的伤害，苛重的赋税使我们备受煎熬，恶劣的季节也屡屡使我们颗粒无收。因为如今多年来，看来在这个国家里，到处都有许多不义和摇摆不定的忠诚。</p>\n<p>伍尔夫斯坦以经过时间检验的药方结束其训诫：“转向正道，在某种程度上停止作恶，并为我们的过犯热忱赎罪。”<sup class=\"fn\" data-note=\"2:31\">31</sup> 无论世界末日看起来多么临近，总还有时间忏悔。</p>\n<p>关于千禧年究竟何时到来虽有学术分歧，但千禧年来了又去，世界并未终结。这并未推翻灾难自有其意义——无论是作为预兆还是惩罚——这一观点，因为人的行为与自然元素的行为之间的关联实在太过根本，无法如此轻易地切断。无论是探讨博学精英的神学化思考，还是试图理解那些视皈依基督教为招灾引祸之人的心态，抑或考察困顿的农民借以控制充满敌意的自然力量的种种手段，我们处处都发现一种根深蒂固的假设：人间事务不过是远为宏大的宇宙秩序的一个方面，这一秩序可能因错误的行为而紊乱，也可通过适当的精神努力和行动而恢复平衡。据此，本章所考察的对灾难的实际和智识回应在我们看来都是可以理解的，尽管其中许多曾遭到高傲的主教和立法者的否定甚至讥讽。</p>\n<p>1002年1月24日，皇帝奥托三世在罗马以北的帕泰尔诺死于突发高烧，年仅21岁，未婚且无子嗣。同时代人将他的死归因于“意大利病”，很可能是疟疾。<sup class=\"fn\" data-note=\"2:32\">32</sup> 他自己的早逝以及十八年前他的父亲奥托二世28岁早逝，都尖锐地提醒我们：即使是中世纪早期最强大的统治者，也和常人一样容易死于疾病和猝死。奥托二世至少在六个月前通过让襁褓中的儿子当选共治者而确保了继承，但奥托三世对继承问题毫无安排：他的英年早逝使其帝国——一个从波罗的海延伸到意大利中部的庞杂聚合体——陷入动荡。事实上，在中世纪早期的这一次以及无数次其他场合中，死亡和灾难的政治影响不可低估，因为饥荒和疾病可以像猝死引发继承危机一样，轻易地使一场重要的军事远征半途而废。也许是出于对这种脆弱性的认识，也许是幼年时师傅们灌输的世界观所致，奥托三世将他的统治诠释为对正确的政治、宗教和社会秩序的复兴，以此推迟末日的开启。为此目的，他的行动果断坚决。他使永恒之城罗马成为其阿尔卑斯山以北帝国的首都，成为自四世纪以来第一位在那里停留超过匆匆一瞥的统治者。<sup class=\"fn\" data-note=\"2:33\">33</sup> 1000年，他前往格涅兹诺，在那里开创了对新近显圣行奇迹的圣徒——布拉格的阿达尔伯特——的崇拜。而作为对《圣经》预言所说的世界终结时将会发生之事的提醒，他让自己置身于启示录式的意象之中。996年在罗马举行皇帝加冕礼时，他甚至身披一件“其上用金线绣着整部《启示录》”的斗篷。<sup class=\"fn\">34</sup></p>\n<p>奥托的统治浓缩了本章的许多主题。他因高烧猝死是典型的意大利式死亡——在那个时代，疾病和饥荒一样，几乎总是局部性的而非普遍性的发作，而且发病形式因地区和栖息环境而异。从他在奈梅亨附近的出生到他在帕泰尔诺的去世，他往返跋涉于阿尔卑斯山南北的辽阔地域，亲身经历了构成欧洲的由各种景观和地方拼合而成的马赛克，其范围从今天的荷兰一直到波兰和意大利。他对末世论的关注，是试图以基督教宇宙论赋予其统治以意义，并将自身置于人类历史——过去、现在与未来——的宏大叙事之中。他对布拉格的阿达尔伯特圣髑的分发，表达了普遍的基督教观念：治愈及其他形式的神圣恩泽从受封圣徒的遗骨中流出。然而，尽管他敏锐地意识到自己肩负着引导帝国走向基督教扩张和罗马复兴的使命，奥托不可能知道他统治的人口——正如欧洲其他地方一样——正在稳步增长，也不知道欧洲的气候正在改善。在其短暂的一生中，他也不太可能注意到景观面貌的变化，如森林被砍伐、新定居点建立、旧定居点迁址。而且，尽管罗马是其政治和世界观的核心，奥托不可能意识到，在他与最后几位西罗马皇帝相隔的几个世纪里，这座城市已经发生了何等程度的转变。当我们在第八章造访罗马时，将会看到其人口只剩昔日的零头，城市景观已经乡村化，地貌已经改观。罗马比任何其他城市都更能集中体现那些高度地方性的变化——正是这些变化使得中世纪早期欧洲人生活与死亡于其中的世界如此复杂，同时又如此充满活力。</p>", "text": "第2章所涉主要地点\n风暴压弯的枫树，\n我为我的儿子悲恸，\n我的孩子，他已把\n身躯俯向大地：\n不幸的人啊，\n他的亲族被砍伐，\n还须从床上\n扛走骸骨。\n父亲哀悼溺亡的儿子，婴儿吮吸着饥馁母亲尚有余温的尸体：中世纪早期的欧洲人在匮乏与死亡之中亲密地生活。面对间歇性的气候灾害、周期性的流行病和严酷的日常生活条件，欧洲的人口艰难地靠土地谋生，并抚养子女以延续其劳作。大多数人生活在生存线或其边缘；另一些人则在猝然死亡的恐怖和饥荒的可能之中，思索人类存在的意义及其道德品质。正如所有文化一样，生与死的基本节律构成了人类经验的框架，不仅塑造着任何共同体的年龄结构、成员的预期寿命及其对安全的追求，也影响着政治，滋养着对自然界的理解，并把人类安置于宇宙之中。\n本章探讨人类与其自然环境之间的互动，并反思他们对这一环境的理解。它提出的一些问题并非都能通过文本研究解决，却可以借助对物质遗存的考古发掘与科学分析加以探讨。不过，先须作一些提醒。要通过追踪气候、土地利用和人口水平的变化来回答环境与人口问题，所需的考古研究既繁琐又昂贵。它只在有限的若干遗址上进行过：由此向外推衍便有过分概括之虞。虽然新发现中世纪早期前所未知的文献证据之事罕见，但新的考古发掘与调查却经常开展，新的科学分析技术也不断涌现：基于现有数据的结论仍有可能随后的修订。\n鉴于上述限定，本章将考古证据与现存文献记录结合起来，以便把中世纪早期男女的感知与社会回应置于他们所居住的景观及其所享有的寿命的背景之中。因此，它把生与死既视为生物现象，也视为文化现象。第一节讨论环境：气候、景观与聚落分布。在此背景之下，第二节转向人口问题，估算人口水平，并试图解释似乎为中世纪早期所特有的生育率与死亡率的波动。最后一部分追问人们如何应对匮乏、疾病与死亡，并在一系列宇宙观念和医疗策略中寻求答案。在所有这些方面，浮现出的是一种强烈的地方性模式。\n栖居地\n中世纪早期的人们在其间生活、劳作与死亡的环境，不仅受自然资源和气候的影响，也受漫长的聚居与开发史前史的塑造。千百年来，人类活动从欧洲复杂的自然地理中造就了众多景观。这一互动始终是一个动态过程，贯穿中世纪早期，从自然界中塑造出人类的栖居地，并赋予中世纪早期生活以鲜明的异质性面貌。\n让我们粗略一瞥那个自然世界的丰富与多样。它的某些差异面貌在今天一如在中世纪那样显而易见——例如，不列颠东南角低地的农业潜力与北部和西部山区的山地经济之间的对比，或地中海沿岸的橄榄和葡萄与法国北部谷物种植之间的对比。此类差异反映了地质构造与土壤类型同相关地区特有气候模式的相互作用。在城市的无序蔓延和机械化集约农业的时代，细微的地方性差异——如这块田与相邻田地间土壤的差别，或山谷两侧日照的不同——已不再那么明显。但在中世纪早期，一个微小地方相对于另一个小地方的独特性质，往往与整个地区之间的差异同样重要，因为每个共同体都与其周遭环境的潜力和限制紧密协调。农耕、饮食、纺织、衣着、陶器、建筑材料：在这个微观区域的世界里，一切都因应本地可得的资源而形成。各处之间的联系来自社会、经济和政治的纽带——后续章节将对此加以探讨——也来自河流与海岸、道路与小径，它们使各个聚落得以彼此往来。\n中世纪早期景观多样性的其他方面，则反映了人类对自然环境不断演变的影响。其中一个标志是将新土地开垦为耕地的推进。在波河沿岸，古代末期意大利北部平原大部分仍覆盖着橡树林，砍伐森林只是从九世纪起才在此产生重大影响。同样，莱茵河与多瑙河以东的土地仍然林木繁密，虽然新来的移民从八世纪起便开始在这些林区开辟空地，大规模的砍伐直到十二世纪之前尚未推进到易北河以东。到十世纪，排水与河流渠化正在改变那些海岸线迅速变动、地势低洼的盐沼占主导地位的景观，如弗里西亚的圩田、东盎格利亚的沼泽地以及波河三角洲。尽管一位匿名的九世纪作家声称，弗里西亚人“几乎像水中的鱼一样生活，四面八方皆被水环绕”，3 但考古证据证实，中世纪早期的弗里西亚沿海地区支撑着人口稠密的共同体。居民住在人工堆高的土丘（terpen）上，将集约农业与对周围盐沼和水道的广泛开发相结合。从这些聚落出发，他们开始向紧邻潮汐泛滥平原之上的泥炭沼泽推进，自九世纪起开掘排水沟渠，从沼泽中开辟出小块的耕地，并在新近干燥的土地上建立新聚落。早在十一世纪晚期大规模排水工程开始之前，弗里西亚景观的改造便已进行良久。在这类地区，需要特别发挥想象力，才能设想中世纪早期景观不断变化的面貌。\n在另一些情况下，变化源于新作物与新技术的传播。伊比利亚半岛在这方面尤为显著，因为随711年穆斯林征服而来此定居的阿拉伯人和柏柏尔人引进了新的植物与灌溉技术。750年倭马亚王朝在大马士革被推翻后，该家族的重要成员逃往科尔多瓦，并于756年在西班牙建立了独立的政权——安达卢斯。在倭马亚诸埃米尔（如据说曾派人从其叙利亚故乡取来石榴籽和椰枣树的阿卜杜勒-拉赫曼一世，756–788年在位）的鼓励下，西班牙南部呈现出新的面貌，这不仅是由于引进了新的栽培植物，也是由于建立了在伊斯兰世界其他地方广泛实行的集约灌溉体系。在穆斯林统治下，安达卢斯诸城市周围的灌溉田带使得甘蔗、稻米和棉花之类依赖水源的作物得以种植，到十一世纪晚期，这些作物在西班牙南部已被广泛栽种。随着十世纪橙子的引入——它在规整园林中因其观赏价值而备受珍视——科尔多瓦、塞维利亚以及中世纪早期安达卢斯的其他城市令到访者联想起叙利亚的景观。\n景观的变迁还须置于气候与天气的背景中加以评估。中世纪早期的作者无疑对气象的正常状态有直觉的认识，极端的反常天气会引起评论。748年，爱尔兰遭受“异常深厚的积雪，以致全爱尔兰的牲畜几乎全部死亡，此后世界又为异常的干旱所炙烤”。874年在法国北部，“漫长而严酷的冬天”带来了“如此巨大的降雪，以致无人记得见过类似景象”。4 评论者还注意到气候与疾病或歉收之间的联系。据说820年的异常大雨导致了人畜的广泛疾病，使谷物和蔬菜在田间腐烂，并使那一年的葡萄收获量少而味苦。最糟糕的——其记录之精确也Certainly罕见——或许是838年12月26日淹没弗里西亚的“远超寻常沿海潮汐的大洪水”，它冲毁全部沙丘，使泥沙四溢，卷走了房屋、牲畜和2,437人。5\n然而，无论这些中世纪早期的观察者多么敏锐，他们不可能知道此类突如其来的危机标志着长期气候变迁循环的开端，而这一循环极其缓慢地改变了他们所生活的世界。只有将文献见证与现代科学技术相结合，才能大致重构公元后第一个千纪欧洲的气候史。在这个千纪的中段（大约公元400–600年间），整个北半球平均气温显著下降约1.5°C，导致降雨和洪水增多。其他的表现还包括北海低洼海岸线的海平面上升，爱尔兰西南部泥炭沼泽的扩张，阿尔卑斯山冰川的推进，以及冬季多雨的大西洋气候模式向地中海地区的延伸——这与本千年前期特征不同。到约700年，一种更为大陆性的气候模式——炎热干燥的夏季和严寒的冬季——开始留下印记。（九世纪西北欧冬季频繁的大雪和河流封冻即是其表征之一。）直到本千年的最后一个世纪，气温才重新升至长期平均水平之上，并逐渐在十二世纪形成另一个气候最适宜期，北欧的气温比约500年时高出近2摄氏度。\n气候变化可能影响边缘土地维持耕作的能力，也无疑促成了中世纪早期聚落遗址的一些明显变迁。弗里西亚早期人造居住丘（terpen）的废弃与异地重建，与海水进退的各个阶段相对应。同样，随着中世纪早期爱尔兰西南部和不列颠西北部高地地区泥炭沼泽的扩张，当地社群停止耕种山坡田地，任其重新变为灌木丛和林地。在爱尔兰，肥沃的中部和东部低地谷物生产与畜牧活动增加的考古证据表明，人口向这些地区重新分布。一个研究得尤为透彻的例子是英格兰南部的白垩丘陵。在这里，七至八世纪地下水位逐渐下降，似乎促成了温彻斯特东南部山顶聚落的废弃。加之山坡土壤的持续侵蚀，这可能促使社群迁往沿海低地较黏重但更肥沃的土壤地带。相反，第一个千年最后三分之一时段的气候改善，或许有助于解释苏格兰谷物耕作的显著增加，以及谷物耕作传入北大西洋岛屿——尤其是设德兰群岛和外赫布里底群岛。\n土地使用和乡村聚落的变化也常常源于社群之间及社群内部政治经济关系的改变。例如，考古证据表明，在斯堪的纳维亚南部部分地区，七世纪农业生产集约化伴随着广泛的政治变革。一个研究充分的例子涉及西福尔德郡的博雷，在那里，更大的田块和新作物标志着耕作的加强，这与一个精英聚居中心的兴起相关联，其证据是规模宏大、随葬品丰富的墓葬冢。显然，强大的首领们通过将自身意志强加于该地区的下层农民，正在打造更大的王国，其榨取产物或贡赋的方式我们只能猜测，但他们留下了景观的改变，作为其新获权力的见证。\n类似但规模较小的结构调整，也促成了著名的“游动聚落”现象，这一现象影响了西北欧广大地区的许多乡村居住遗址。直到约700年，盎格鲁-撒克逊聚落往往或在其领地范围内逐渐迁移，或整体搬迁；在丹麦，聚落以这种方式持续游移，直至十一或十二世纪。在所有这些情形中，等级性减弱、剥削性增强的社会关系的出现，与不断变化的生态条件相结合，体现为空间重组和农业变革。\n在我们所论时期的末期，意大利半岛为这一主题提供了一个研究尤为透彻的变体。文献与考古证据一致表明，从托斯卡纳以南几乎整个意大利乡村在十至十一世纪经历了居住地的重新分布。在一个通常称为“筑堡聚居”（incastellamento）的过程中，分散的农户聚集为单一的设防村落。这些村落通常建在先前无人居住、地势高于原先居所的地点。迁往设防地点，只是部分对十世纪意大利乡村日益加剧的不安全状况的回应——当时的乡村正持续遭受撒拉森人（来自北非的阿拉伯海盗）和机动性极强的马扎尔劫掠队的袭击。王公权威的削弱也是原因之一，因为它使地主得以自筑堡垒并驻兵其上，从中威吓邻里。然而，与暴力威胁至少同等重要的是农业经济性质与组织的转变，它们推动了筑堡聚居。在人口增长的时期，沉重的新地租和劳役强化了地主对乡村劳动力的支配，使得将佃户迁置于领主的直接监视之下成为有利之事。\n人口流动的另一个方面是移民，无论自愿还是被迫。人口的暂时或永久迁移很可能伴随着中世纪早期的大部分族群间暴力。例如，我们听说易北河上游迈森附近的达莱明齐斯拉夫人，在906年屡遭马扎尔人攻击。这一地区“沦为如此悲惨的赤贫境地，以致达莱明齐人抛弃了自己的土地，投靠其他民族以求糊口”。6 这类苦难因缺乏政治意义而大多未见记载，其实际发生频率必然远高于证据所明确显示的。我们也偶尔得知蓄意的种族清洗，它同样必然对聚落和土地使用产生过暂时影响。易北河以东撒克逊人的命运是最广为人知的案例：804年，查理曼通过大规模驱逐成千上万的男女和儿童巩固了他对萨克森的征服，将他们迁往帝国的内地。\n诸如此类的迁移是聚落流动性悲哀而直接的体现。争议要大得多的是，五世纪罗马边防体系崩溃时，北欧长距离移民的程度。整个民族南迁寻找新家园的观念，最早由法兰克人、哥特人、伦巴德人和盎格鲁-撒克逊人在成功于原帝国行省境内建立自己王国之后所讲述的起源传说中提出。然而，正如我们所见，对于五、六世纪的社会与文化变迁，还存在其他有力的解释。7 虽然聚落考古确实表明，五至七世纪之间日德兰半岛根部周围和今德国北海沿岸的人口有所减少，且某些地方森林相应扩张，但移民未必是其唯一原因，甚至未必是主要原因。\n如果将注意力转向帝国边境内诸行省所发生的事情，我们的立论就更为稳妥，因为有组织的撤退是帝国公认的施政手段，并补充了难民逃离冲突地带前往帝国较安全地区的自发流亡。多瑙河边防的逐渐瓦解伴随着城镇的有组织撤退：先是五世纪最后二十年间沿该河上游南岸开始，然后约一个世纪之后沿其下游的巴尔干河段展开。480年代，来自诺里库姆的镇民、教士和圣徒圣髑被重新安置于意大利；随后在580至590年代，因斯拉夫人进攻而撤离巴尔干的撤退者和难民在希腊、爱琴海诸岛、意大利南部和西西里找到了更安全的家园。\n意大利东北部也未能幸免于这种动荡。来自巴尔干和多瑙河流域、反复翻越东阿尔卑斯山的入侵与劫掠，造成了一种不安全的氛围，一直持续到七世纪后期。亚得里亚海顶端上方旱地上的城市和聚落因易受攻击而日益衰落。其居民在亚得里亚海环礁湖的岛屿上找到了更安全的避难所，新的社群在那里发展起来，最初是临时避难地，继而是永久定居点。从约800年起，位于里亚托岛上独立且日益强大的贸易定居点威尼斯迅速成长：它的兴起标志着该地区岛屿定居点对人口流失的大陆地区的新的主导地位。\n在将中世纪早期的男男女女和儿童置于其栖息环境之中时，有两点浮现出来。第一，我们必须将乡村和城市聚落视为动态的、不断变化的，而非静止的、超时间的。居住遗址很少是稳定或永久的：它们坐落于一片遍布前代和前古遗迹的景观之中，无论是建筑物、田埂、墓地还是纪念物。随着人们迁移居所、改变耕作方式，他们在持续演变的欧洲景观上留下了印记。气候、自然资源的开发、可耕地的可得性、作物选择、居住地点、聚落形态和开发方式都在逐渐变化，各自促成了我们今日熟悉的欧洲环境。这种演变的一部分可以通过书面文献记录的逐年事件加以探察，但其大部分经历了数十年乃至数世纪的缓慢过程，唯有通过密集的区域考古才能辨识。我们如今对欧洲景观演变有如此多的了解，是历史学家与环境科学家密切合作的成果，也是历史视野从政治史或教会史事件扩展到对人类社会长期结构性变化的互补关注的成果。\n第二，无论我们看向何处，都会遇到构成中世纪早期主导特征的地域性乃至地方性。景观、自然资源、气候、农耕体系、聚落分布和人口密度不仅随时间变化，也因欧洲各地区、各地方而异。栖息环境的差异性和多样性具有根本意义：尽管后续章节将探讨人类为克服微观区域生活的局限而构筑社会联系、经济交往和政治效忠网络所作的努力，但本章下一节将展示人类经验在整个中世纪早期如何仍受地方条件制约。以地方性的而非概括性的视角思考，我们才能理解中世纪早期生存与死亡的动态。\n生与死\n经过三年婚姻，达高尔夫的妻子维莉图塔于约590年去世。年仅17岁的她死于分娩，“身怀自己的厄运”。她的孩子“生于死亡之口”，与她一同死去；她悲伤的丈夫“在一次死亡中……哀悼着两位的安葬”。我们对维莉图塔短暂一生和达高尔夫的悲恸的了解，仅来自她的死所引发的一组慰悼诗，但这首诗仍然提醒我们：尽管生死密不可分，二者既是个人生存与死亡的文化经验，也是人类集体存在随时间延续的生物学基础。8 维莉图塔和达高尔夫的案例引导我们思考关于500年至1000年间生与死的广泛人口学问题。本节探讨中世纪早期人口变化的性质，继而考察预期寿命和性别比例，以勾勒出本书研究对象诸社群的人口概况：维莉图塔的人生故事原来并不罕见。在上述区域和微观区域景观的背景下，本节还主张，生与死最好在地方情境中加以理解。\n由于生与死既是文化现象又是生物现象，原则上可以通过文化证据和生物证据——即文献记载和人类遗骸——加以研究。然而在实践中，这两类证据无论单独使用还是结合使用，都难以轻易解答历史学家想要提出的问题。我们立即发现，在我们看来重要的事情，在中世纪早期很少以同样的方式受到重视。以年龄问题为例。意大利、高卢、西班牙和巴尔干的识字城市精英保持至约700年的一项晚期罗马习惯，是立墓志铭以纪念死者。这些墓碑中有许多注明死者年龄。所载年龄有时全然不可能，有时明确标注为约数——“德米提乌斯在世约三十七年”9——且常常被凑成整齐得可疑的数字，那是符合社会惯例而非事实准确的年龄。看来很少有人确切知道自己多大年纪，年龄更多是一种社会角色问题，而非精确的时间长度。骨骼遗骸分析提供了另一种途径，但即便如此，对于已发掘的个体遗骸，也只能提供死亡年龄的近似值。\n也没有人在意统计人口，因为一个地方住着多少人的问题在中世纪早期从未出现，即便出现了，也没有人有手段精确回答。因此，估算欧洲中世纪早期人口的证据从根本上缺失——但这并未阻止各种猜测的尝试。姑且信之，从斯堪的纳维亚到巴尔干，约1000年的人口估计值在4000万上下浮动。最接近人口普查的，是九世纪加洛林帝国少数几份地产清册和对大教会地产上劳动者状况的描述。如后文所示，若谨慎使用，这些材料可以为相关特定聚落的人口密度、性别比例和年龄结构提供近似估算。即便如此，这些证据仍然稀少而不可靠。\n因为编纂者的目的并非人口普查，而是记录财政摊派和劳役，其中个人通常只有在负有赋税或劳役义务时才会被记载。这就是现有证据的核心问题：关于人口及其义务的统计记录，是既具有精细文书文化又拥有强势政府的社会的产物。如上一章所述，此类环境下留存至今的文献仅见于9世纪加洛林帝国的部分地区和10世纪末的英格兰，而来自al-Andalus（安达卢斯）埃米尔高度官僚化政权的文献则完全没有留存。在斯堪的纳维亚，11世纪之前没有任何书面文献，除了从墓葬考古学提供的间接证据进行推论外——且仅限于此类墓地证据得以保存并被分析的程度——别无他法可循。爱尔兰的情况也是如此，因为即使爱尔兰人的书写确实延伸到了某种记录形式，其痕迹也没有留存下来。至于斯拉夫人，至少直到10世纪晚期他们普遍以火葬而非土葬处置死者，对人口问题的考古评估必然无法进行骨骼分析。最好承认：我们无法说出中世纪早期欧洲的人口数量是多少。\n虽然我们无法测量人口数量，但我们能够推知中世纪早期人口水平的某些相对变化。追踪这些变化要从6世纪地中海的城市开始：它们无疑很拥挤，但其中许多已不如两个世纪前那样拥挤。每座城镇不仅是其乡村腹地的焦点，也是跨区域贸易网络的枢纽。10 因此，541年在尼罗河三角洲的珀路修姆爆发的腺鼠疫能够迅速从一个海港传播到另一个海港。这场瘟疫在6世纪余下的时间里频繁复发，此后间隔逐渐拉长，其人口影响在地中海东部尤为严重，因为持续的远程谷物运输助长了它的持续存在。该病于542年抵达西地中海盆地，在随后的两个世纪中反复蹂躏意大利、法兰西和西班牙沿海的城市以及北非，直到767年在南意大利最后一次爆发。但西地中海的远程航运比东部衰落得更早，这可能减轻了瘟疫在此地影响的严重程度。瘟疫偶尔也会沿罗讷河、埃布罗河和波河等主要贸易路线深入内陆，但其毒性随传播而减弱；它只有一次越过卢瓦尔河谷以北。\n腺鼠疫症状明显且致死迅速。“那是一种即死。腹股沟或腋下肿起如蛇咬般的疮伤，感染者被其毒素如此吞噬，以至于第二或第三天便死去。毒素的力量夺走了患者的神志。”11 在毒性最烈之时，疫情可能造成戏剧性后果：棺材短缺、集体掩埋、逃亡、城市崩溃。654年夏，瘟疫袭击了意大利多座城市。近150年后，教会史家执事保罗仍视这场浩劫如末日降临。“死者之多，以至于在罗马城，父母与子女、兄弟与姐妹两两并置于灵床，被送往坟墓。同样，这场瘟疫也使提基努姆〔即帕维亚〕人口灭绝，以致全体市民逃往山区和其他地方，集市和全城街道上长满了青草和灌木。”12 无论实际死亡人数多少，这样的爆发留下了创伤性记忆和持久的社会失序感受。\n从人口学角度看，瘟疫的影响无疑因地区和城市而异。它在罗马和马赛数度造成局部重创，在特里尔和托莱多只是一时之痛，而在南特或巴黎则完全没有出现——这些流行病造成了区域性的而非全局性的人口下降。事实上，腺鼠疫很少超出地中海繁忙的贸易港口及其紧邻腹地的范围，只有那里才具备其传播的前提条件。尽管如此，剧烈的疾病痉挛肯定也曾光顾大西洋欧洲和不列颠群岛更为乡村化和人口稀疏的地区。6、7世纪的爱尔兰和盎格鲁-撒克逊史料中出现过“黄瘟”、“儿童死亡”、“大死亡”和“痘疫”等提法，但这些措辞无法可靠地转换为现代医学术语。无论其确切性质如何，这些流行病都造成了严重后果。数位国王死于疾病，其死亡不可避免地使脆弱的王国陷入动荡。有时，整个地区似乎也遭到毁灭，如664年，其中一次疫情先蹂躏英格兰南部，继而北上，最终蔓延至爱尔兰。据比德记载，在诺森布里亚，“这场极其惨烈的瘟疫……带来了如此严重的毁灭，以至于一些曾经人口稠密的大村庄和庄园，只剩下一小撮流散的幸存者，有时甚至一个不剩”。13\n在评估流行病是否对欧洲人口水平产生重大影响时，我们无法超越比德式灾难的文学印象，去衡量究竟有多少人死亡或逃往未受感染之地。我们也无法确定人口水平是否在超过两三代人的时间内有所下降。我们应避免过度概括的诱惑，与其假设人口总体下降，不如将流行病引起的衰退与失序解释为短期性和局部性的，因地点而异，这才是最合理的解读。\n同样的道理也适用于约800年起在史料中如此显著的粮食短缺。整个9世纪，饥荒平均每四年发生一次，10世纪降至每十年一次，但11世纪再次上升。其中许多属区域性影响：例如850年的莱茵兰、853年的萨克森、882年的巴伐利亚、889年的“各地”。14 相比之下，爱尔兰这个以畜牧业特别著称的国家，在中世纪早期经历了反复的牛瘟爆发，对粮食供应和人类抗病能力产生深远影响。700年，“牛群死亡”在年初爆发，后果极为严重：“爱尔兰饥荒与瘟疫横行三年，以致人食人。”15 然而，只有一次可以明确看出整个欧洲同时受灾。1005年的饥荒如此严重，“无人记得曾有过如此残酷的饥荒”，16 又有食人报告：这场饥荒从不列颠群岛肆虐到巴伐利亚。但1005年可怕的饥荒毕竟是例外。总体而言，匮乏与灾难今年在此处，明年在彼处。没有任何远程食品贸易来平滑匮乏与丰裕之间的波动；同样，也没有一场普遍的苦难周期折磨整个中世纪早期的欧洲。\n同样强调区域性的观点也适用于那些可能有利于人口增长的条件。维持人口增长的关键前提是定期而充足的食物供应。扩大耕种面积或强化农业技术都可以增加食物的可得性——其程度受气候和土壤肥力、劳动力供给和农业技术的限制。农业变革是否使中世纪早期的耕作更为集约，从而促进了人口增长？最恰当的回答仍然是强调区域差异。以法国的一小块地区为例：至少从8世纪晚期起，巴黎以西地区遍布水力磨坊，而向南仅50公里处，直到11世纪磨坊仍然罕见，因为不同的地质条件和土地持有模式延迟了其引入。无论是重犁的使用还是新作物的引进——二者都在许多不同地方得到印证——都呈现出相同的图景：变革是局部化的，且除技术知识外还依赖于诸多因素。至少，正如第五章将要论证的，一位新的、精力充沛的地主的到来可能带来相当大的变化。唯一似乎在任何地方都没有改变的是极低的谷物产量，即使在最肥沃的土壤上也是如此。尽管收成的质量无疑极不稳定，收获量仅为播种量的两到三倍似乎很常见：而且这批收成中还须留出明年的种子。如果中世纪早期乡村人口有所增长，更集约的粮食生产并非主要原因。\n相比之下，欧洲许多不同地区提供的证据表明，开垦土地相当普遍，肯定从8世纪起，某些地方或许从7世纪就开始了。新定居点的考古遗迹、花粉沉积的古植物学分析，以及关于耕种向林地扩展的文献记载，都指向同一方向。无论证据来自爱尔兰、英格兰南部、苏格兰、法国中部、加泰罗尼亚、意大利北部和中部、阿登、黑森、巴伐利亚东部，还是波兰西部的核心地带，都一致表明耕种的扩展，尤其是谷物种植的扩展。无论是个人主动进行的小规模开垦，还是领主、教会甚至国王以充沛精力推动的更大工程，砍伐灌木或森林构成了中世纪早期农业变革的主要形式。可耕地的扩展或许应当与欧洲乡村人口的增长联系起来，因为它既预设了足以胜任此任务的劳动力供给，又带来了粮食供应的增加。当然，少数提供了特定时刻劳动力状况快照的9世纪庄园清册也强化了这样一种观点：到这个时期，土地资源已承受相当大的压力。9世纪中叶，属于圣贝尔坦修道院的南佛兰德土地，人口密度可能达到平均每平方公里二十人。巴黎塞纳河盆地圣日耳曼德普雷修道院的领地，平均密度更高，某些领地高达每平方公里四十人。\n除了北欧谷物种植低地在9世纪已支持密集定居这一说法之外，地中海多山边缘地带还提供了更多线索。事实上，在加泰罗尼亚的高地山谷中，乡村人口可能已达到19世纪的水平。唯一容许对人口增长作出估算的文献，来自813–814年马赛圣维克多修道院在普罗旺斯的领地。这份庄园清册的证据表明，该地区某些地产上的人口增长比其他地产更快。据推算，圣维克多领地的总体增长率相当于一个世纪内人口翻了一番。如果这些计算多少可靠，它们意味着至少在9世纪欧洲的某些地区，人口能够以接近工业革命前夕英格兰所维持的速度实现短暂的增长激增。总之，从9世纪起，欧洲部分地区的不同时期都有明确的、虽属短期但相当可观的人口增长迹象。\n8、9世纪的总体图景是：农业方法与技术的零散区域性变革、广泛的土地开垦，以及实现可观人口增长的能力。然而这些发展的累积影响有限，因为直到约950–1050年才有广泛而持续的人口增长的明确证据。中世纪欧洲持续的人口回升大约始于千年之交。在此之前的两三个世纪里，土地开垦和人口增长受到疾病爆发、频繁饥荒和气候恶化效应的抑制。\n对中世纪早期缺乏稳定人口增长最可能的解释是：以粮食短缺和自然灾害为标志的生存危机的反复发作，打断了增长与扩张的时期。由于饥荒很少普遍发生，又由于暴雨、干旱和其他气候灾害的影响同样具有区域性或地方性，人口增长与停滞（甚至短期下降）之间的波动很可能也是区域性的且不连贯的。这一切表明，在中世纪早期，并不普遍具备支撑长时期稳定人口增长所需的资源。一个濒临生存危机边缘的人口，很难抵御歉收之年或牛瘟流行之时。虽然确实存在人口稠密的聚居区，但那种密度既不均匀也不稳定。简言之，整个中世纪早期，人口水平的变化率在各处都不可预测地波动。如果匮乏与灾难的影响是反复无常且不均衡的，那么人口增长也是如此。\n人口要增长，需要持续的出生超过死亡的盈余。在评估生育率和死亡率时，墓地证据极为宝贵，因为细致的分析可以促使中世纪早期的死者遗骸提供大量有价值的信息，包括特定社群中的性别比例、预期寿命、疾病模式和流行的死亡形式。但须附带说明：骨骼分析并非精密科学，而且一座墓地理所当然未必容纳所有人（或即使是某一社区死者的哪怕是具有代表性的）样本，墓葬证据仍然鲜明地揭示出当时的男女生活、繁衍和死亡的具体境况。两处在时空上相距甚远的墓地说明了这种证据的潜力。\n第一处是英格兰东南部的一处遗址，使用时间从五世纪末延续至八世纪中叶。在巴克兰（Buckland），至少有20%的社区成员在年满18岁之前便已死亡，而活到60岁或以上者仅约6%。在成年人口中，女性与男性之比为3:2，但女性的预期寿命明显较短：成年女性的平均死亡年龄为31岁，而男性为38岁。这些数字虽属粗略估算，却表明当时的人口面临着极为沉重的儿童死亡率、育龄期女性死亡率高企、女性过剩（这可能意味着男性经常离家在外死亡——死于战争或狩猎），以及老年人远较近几个世纪更少、更年轻的社会状况。此外，既然巴克兰附近的居民将5岁以下的婴幼儿另行埋葬于公共墓地之外，实际的儿童死亡率必然要高得多。位于不列颠西南部坎宁顿（Cannington）的六世纪墓地提供了一个更可信的数字：在那里，全部人口的64%在年满18岁之前死亡，且确实有15%未能活过一岁。\n第二个例子是苏黎世市中心的明斯特霍夫（Münsterhof）墓地。它用作853年建立的圣母修道院（Frauenmünster）周边形成的早期城市聚落的葬地，并一直使用至十二世纪末。图2.2展示了其总体人口结构。\n苏黎世明斯特霍夫墓地墓葬的年龄构成\n与巴克兰不同，年幼儿童及部分婴儿埋葬于此，但似乎在十一世纪之前，死胎和出生数周内夭折的婴儿仍被安葬在别处。在埋葬于明斯特霍夫者中，近50%未能活到18岁，至少30%死于生命的前五年，其中三分之二死于一岁之内。就围产期、婴儿及儿童死亡率而言，九、十世纪苏黎世人口的损耗率与巴克兰或坎宁顿大体相当。相比之下，苏黎世的成年人口则颇为不同。男女比例更为均衡，为五男六女之比，这与中世纪盛期的许多其他墓地一致。此外，成年人口的平均死亡年龄表明，苏黎世的生存保障明显优于巴克兰：大多数成年人死于50至60岁之间，少数人活到60岁以上。尽管如此，图2.3所揭示的男女之间仍存在明显差异：20岁男性的平均预期寿命为57岁，而同龄女性仅为49岁。在这种环境中，分娩始终是一个不容忽视的危险，因为超过三分之一的成年女性死于育龄期。\n苏黎世明斯特霍夫墓地人口的平均寿命\n这些数字虽然只是近似值，却仍可引出几点一般性观察。首先，地区和时间上的差异再次值得注意：人口总体水平的显著波动反映了各地不同的生育率和死亡率。其次，如果平均而言有一半人口死于婴幼儿期或儿童期，这就意味着每一个长大成人的孩子，女性都要经历两次怀孕和分娩。为使人口水平保持稳定，每对夫妇必须生育四个子女，其中两个存活；若要人口增长，则须更多。还有一个不可避免的观察结论：出生与死亡紧密相连。死亡的风险在生命的最初一年——很可能甚至是最初几周——始终最大，而对成年女性而言，则集中在分娩前后。在这一点上，中世纪早期的欧洲与当今缺乏现代卫生条件和医疗的那些社区并无太大区别。因此，这一人口结构与当代西欧形成鲜明对照，如图2.4所强调的那样。\n中世纪早期与现代苏黎世的人口构成\n来自巴克兰、苏黎世等地的墓地证据揭示了中世纪早期生活质量的某些方面。骨骼遗骸所暴露的症状包括：龋齿磨损严重和脓肿等牙齿问题；愈合后弯曲或缩短的断肢；关节部位长期炎症和感染，患者因疼痛而终生畸形；以及困扰中老年人生活的关节炎、骨质疏松或脊椎病等令人痛苦的骨骼疾患。墓地有时还暗示某些疾病（如肺结核）在社区中长期流行，并揭示出 otherwise 无从知晓的个人生命故事：图特林根（Tuttlingen）的一位成年女性，其罗圈腿源于童年营养不良；格里赛姆（Griesheim）的一名男子，左腿在膝下截肢，却靠装有一只带防锈青铜盖的木腿活到了50多岁；苏黎世的一名先天畸形儿童，出生时脊柱严重扭曲；肯特郡的一名男子，左眼被刺伤，随后颅后又遭三记斩首打击。骨骼遗骸唤起了一个被疾病、疼痛和畸形所笼罩的世界，而私人仇恨与战争的暴力又不时使之加剧。\n然而，单凭墓地证据并不能完全解释中世纪早期的生育和死亡模式，因为二者也受到一种无法通过考古探究的社会习俗的影响。例如，考古学无法阐明生育率是否受到刻意限制家庭规模的影响。从基督教时代之初起，教士们就一直徒劳地抨击避孕和堕胎，无疑，具有有效避孕和堕胎功效的常见草药在整个中世纪早期的欧洲广为人知。杀婴的个别事例也无法完全排除，尽管关于某些九世纪农民社群和维京时代斯堪的纳维亚存在系统性杀害女婴的说法仍然颇难令人信服。\n这里有两个相互关联的问题。第一，与许多显示女性占优势的性别比的墓地不同，九世纪的地产清册一致报告男性多于女性。以杀害女婴来解释这一点，等于忽视了在农业地产劳工清册中女性往往被少记的充分理由。第二，刻意限制家庭规模的措施，与其说与性别相关，不如说更可能与贫困的束缚相关。就目前能够估算每对夫妇存活子女的数量而言，只有在王室世系或九、十世纪最富有、最有权势的大陆贵族中，超过三四个子女的家庭才较为常见。一项反复重申的反对堕胎的法令，为有意识地限制家庭规模与贫困之间的关联提供了重要证据：在对怀孕头六周内终止妊娠与胎动之后终止妊娠规定不同处罚之后，该条文继续写道：“但贫妇因抚养孩子之艰难而行此事，与娼妓为掩盖其罪行而行此事，其间大有区别。”17 其他文本也对杀害孩子的贫妇规定了轻得多的刑罚。贫困可能迫使妇女堕胎甚至杀婴这一认识，逐渐成为教会法的既定内容，但墓地证据永远无法揭示这种现象实际发生的程度。\n如果说贫困在社会光谱的一端抑制了生育，那么生活方式则可能影响了另一端的死亡率。对高等地位遗址出土动物骨骼的分析表明，中世纪早期的精英享用富含家畜肉的饮食，这些家畜被饲养至肉质最佳的早期即行屠宰，辅以野禽及野猪、鹿等猎物。而农民遗址的食物残余则表明他们食用的是老得多的牲畜之肉，这些牲畜的主要功能可能是提供羊毛、奶或畜力，而非肉类。更好的饮食以及获得当时有限的医疗资源的机会，或许使精英女性比其他妇女更容易挺过分娩的创伤，但她们的男性亲属却可能比其他社会群体的男子更容易早逝。十世纪德意志贵族为此提供了一个经充分研究且极端的例子。狩猎、战争、仇杀和司法决斗使奥托王朝贵族的男子锐减，他们的女性亲属——无论是献身基督教独身生活的姐妹，还是守寡的妻子和母亲——往往远比他们长寿。在这种背景下，死亡可能产生严重的政治后果。当统治王朝本身涉及其中时，其结果往往是激烈的继承纠纷，或由幼主继位——通常由其母亲监护。\n在任何社会中，人口变化都反映了气候灾害和饥荒等外部因素，与家庭规模限制、避孕和堕胎观念、医疗知识以及某些社会群体中危险生活方式的盛行等内部社会习俗之间的复杂互动。中世纪早期的证据虽然零碎而印象化，却足以清晰地展示生育和死亡的主要模式。慢性疾病带来的身体痛苦可能影响大多数人；地方性疾病不时因传染病疫情而加剧，瘟疫只是其中之一。在这些困境之中，婴幼儿、临产的妇女和贵族男子都面临着更高的死亡风险，然而欧洲人口仍在中世纪早期的进程中实现了增长。尽管各个社区经历了起伏不定的生育和死亡模式，但总体上升的曲线是清晰的。\n此外，随着千禧年临近，人口变化的无常态势正让位于更为稳定的增长率，因为增长的束缚正在缓解。可以肯定，到公元1000年前后，气候总体上正在改善。文献证据表明，土地开垦工程正以更大的规模展开。地方性和区域性贸易网络不断强化，将粮食运往城镇，而这些城镇的发展——尤其在意大利北部和低地国家——必然依赖于农村剩余人口。18 到十一世纪初年，欧洲的人口与经济正进入一个持续增长的时代，这一增长将延续至十三世纪。中世纪盛期的发展并非凭空突然出现，但它确实巩固了此前一直踌躇不前或断断续续的变化。\n面对灾难的回应\n对任何中世纪早期的共同体而言，日常生活都意味着面对死亡与灾难。在这种无时不在的威胁下，男男女女不仅要抚养子女、勉强维持生计，还要努力理解他们所生活的世界，并尽其所能改善自身的处境。他们的回应受制于种种观念与假设：关于祸福的成因、人在宇宙中的位置、以及死后会发生什么。然而，要重现这些心态几乎是不可能的，一方面因为从物质文化推断态度、信仰和仪式存在困难，另一方面因为基督教的传播伴随着对旧有人类命运解释的压制。如后文所见，尽管基督教宇宙观在文献记录中占据主导地位，我们仍能捕捉到那些其他观念的一些痕迹。这一考察所揭示的，是中世纪早期的人们在面对制约其生存的种种灾难时回应方式的多样性与灵活性。\n关于应对病痛、残疾与疾病的种种方式，证据尤为充分。我们可以将治疗技术与资源作如下分类：研习承自古代世界的书本医学的职业医生；掌握本地草药知识的民间从业者；活着的与已逝的基督教信仰治疗者；擅长运用教会仪式进行治疗的神职专家；以及护身符、符箓、祷文和咒语等传统做法。然而在实践中，这些界限并不分明，因为一些圣人拥有医学知识，而神职人员有时会仔细抄录草药方剂，将其与基督教祈祷及咒语式的念诵混合使用。这些证据通常无法呈现作为实践而非文本策略的治疗，这尤其是因为大多数方法实际应用的直接证据极为匮乏。不过似乎可以认为，专业性较强的资源分布稀疏且不均，因此任何一地所能获得的治疗选择很可能都十分有限。除了少数富人之外，对所有人而言，仅费用一项就足以排除几乎一切形式的外部帮助：职业医生为其服务或稀有药物收取费用；最近的圣髑所可能路途遥远、难以抵达，其看守者还往往期待可观的馈赠。大多数人只能依靠当地可获得且免费的技术。\n然而，在诸多治疗方式中，人们对其中一种的了解远远超过其他所有形式，即基督教圣徒圣髑所提供的治疗。其中一些是二三世纪殉教者的坟墓；另一些则是圣男——较少情况下是圣女——的墓葬，这些人生前即以自身的虔敬缓解人间苦难而闻名，其事迹通常包括以祈祷和仪式治愈病人，有时还辨认并驱除基督徒认为居于受苦者体内的魔鬼。无论是否殉教，所有圣徒都被认为有能力成功地代求于基督教传统的上帝，为人类事务赢得有益的干预：其重要性反映了一种明确阐述的宇宙观，即认定某些人在生前与死后是超自然助力的特殊渠道。\n随着基督教的传播，神职人员建立了新的圣髑所，或是将既有圣徒的圣髑迁往新的地点，或是推动人们将新近去世的宗教领袖尊为圣徒。在某些地方，这些圣髑所延续了前基督教时代曾寄于灵泉与树木之中或归于当地神明圣所的治疗力量；在另一些地方，则出现了全新的宗教景观，与先前的仪式场所竞争并最终取而代之。由于神职人员有记录圣徒所施治愈、驱魔（驱逐魔鬼）及其他代求事迹的习惯，基督教圣髑所的治疗成为中世纪早期各种治疗可能中文献记录最为完备的。\n我们已经遇到过多位圣徒中的一位——马丁，以及通过他的代求而实现的诸多治愈中的一例。在作为图尔主教（371–397）、治疗者和行奇迹者度过了辉煌而富有争议的一生之后，他成为中世纪早期文献记录最完备、最受广泛崇敬的圣徒，其崇拜从苏格兰、爱尔兰一直延伸到西班牙和德意志。尽管位于图尔城外那座装饰华美的五世纪教堂中的陵墓始终是他崇拜的中心，但在约872年至885年间，出于防范来自海上的斯堪的纳维亚劫掠者维京人的威胁，马丁的圣髑曾被转移到沙布利的一座教堂中妥善保管。19 热纳沃法正是在那里治愈了先天性的失聪与失语：她与其他朝圣者一同聚集在教堂门外，彻夜静默祈祷。记录她造访细节的神职作者，在描述她的治愈时借用了常见的宗教母题，将其表现为一个喷火的魔鬼与白发闪耀的圣徒之间的对峙，而后者轻而易举地取得了胜利。作者如此写作，依赖于基督徒中广泛流传的对于世界的理解：善恶之间的宇宙斗争体现于人体所显现的症状之中，而在这种斗争里，基督徒的救赎与肉体的治愈是同义的。基督教信仰的基本信条——救赎来自对基督的信仰——轻松地将圣徒纳入其中，使其成为神圣恩泽或惩罚流经的渠道。当他的治愈之手作用于热纳沃法时，圣徒宣告：“我是马丁，主耶稣基督藉着我乐意恢复你们的健康。”20\n基督教教义所依赖的宇宙观所解释的远不止个人的肉体疾苦：它也为死亡与灾难提供了解释。首先，《圣经》提供了一个参照与比较的框架。873年，“埃及人的古老瘟疫”席卷欧洲大部——那是一场蝗灾。蝗群飞起时，翅膀的嗡鸣充斥空中：“人们几乎看不见天空，仿佛隔着一面筛子观望。”神职人员抬着十字架和圣徒圣髑在受灾地区游行，“恳求上帝护佑他们免遭此灾”。21 然而最重要的是，《圣经》呈现了一个典范：苦难与毁灭是上帝因个人道德败坏或社会失序而震怒的表征。在以基督教教义诠释现世苦难方面，无人比格里高利一世贡献更大。他一生大部分时间饱受病痛折磨，从《旧约》约伯的故事中汲取灵感与慰藉——约伯是虽遭疾病与苦难而信仰不移的典范。对格里高利私人生活适用的道理，也同样适用于他周围的世界。590年，当瘟疫肆虐罗马、连其前任佩拉吉乌斯也罹难时，当选教皇的格里高利向会众解释了这场瘟疫的缘由与补救之道：\n看哪！上天震怒之剑正击打整个基督徒共同体，他们接连死于突然的杀戮。没有病症预示死亡的临近；正如你们所见，死亡赶在疾病发作之前降临。遭打击者来不及流泪悔改便被击倒。试想，那没有时间为自己行为悔改的人，将如何面对【末日审判时】严厉的审判者。我们的市民并非被零星带走，而是成批倒下：房屋空无一人，父母参加子女的葬礼，继承者先于他们进入坟墓。因此，让我们每个人趁死亡降临之前尚有流泪之时，投身于悔罪与哀恸之中吧。让我们在心中回想自己如何误入歧途、犯下何种恶行，并以泪水惩罚自己。“让我们以忏悔来到上帝面前”，并如先知所劝勉的，“让我们举起双手，将心向主仰望”。22\n无论苦难源于瘟疫、饥荒、维京人的袭击还是任何其他灾难，恰当的回应都是斋戒、祈祷与忏悔。从罗马到爱尔兰，凡基督教信仰找到信众之处，基督徒都会本能地通过忏悔游行与代求祈祷来安抚他们的上帝，正如873年蝗灾肆虐地区的地方神职人员所为。这类措施既可以是地方性的，也可以是普世性的。面对792–793年冬严重而广泛的饥荒，查理曼命令法兰克全境所有主教、司铎、修士、修女和神职人员举行弥撒、咏唱诗篇，命令所有人斋戒，并要求所有世俗与教会的土地所有者施舍赈济、供养其佃户直至下一个收获季节。同样，1009年当其王国因维京入侵而面临迫在眉睫的崩溃时，盎格鲁-撒克逊国王埃塞尔雷德二世（978–1016）命令“全体国民”采取相同的行动，以便“我们得以获得上帝的怜悯与慈悲，并倚靠他的帮助抵御我们的敌人”。23 祈祷、忏悔与施舍是一种心态的实际体现：这种心态将人类的苦难归于灵性的亏缺，并在人与神之间关系的重新平衡中寻求对生理、环境与政治失序的救治。\n在中世纪早期共同体面临的各种危机中，有一种特别引发了大量道德与实践问题：饥荒。一个问题是何为合法的食物。基督教教义倡导一种由多种标记界定社会边界的共同体观念，其中之一便是食物法规——一旦违犯便会污染个人与群体的行为规约。几类动物的肉通常被禁为不洁：与人共居的动物，如猫、狗和老鼠；因不正当接触血液或精液而受污染的动物；吃过腐尸或人尸的动物；以及被发现时已然死去的动物。然而，当食物匮乏时，饥饿的人们中很少有人还会按这些条目思考。例如869年夏，饥荒对法兰西中部的打击尤为严重。“无数人悲惨死去，以至于据说有人吃了人的尸体。据说还有一些人吃了狗肉。”24 一个颇为不同的道德问题是谷物的公平价格。585年春，谷仓中的存粮远在下次收获之前便已耗尽，商人们“残酷地盘剥民众”，以暴涨的价格出售仅存的酒和谷物。挣扎求生的家庭靠晒干并研磨葡萄籽、榛树柔荑花序、蕨根或田中玉米的幼苗，来勉强补充所剩无几的面粉。我们也知道那些完全买不起谷物的人的境遇：“另有许多毫无面粉之人采集各种草类充饥，结果腹胀而死……穷困者将自己卖身为奴，只为换取一点食物。”25 正是为了缓解此类境况，查理曼在792–793年对粮价进行了管制，以防止地主追逐暴利而背弃其施舍义务。正如这项立法所表明的，价格与利润更多是宗教关切的对象而非经济规划的事务，但施舍至少起到了向最需要者重新分配食物的作用。\n然而，基督教既未垄断对灾难的解释，也未垄断可行的补救之道。在基督教传入未久的地区，新宗教本身的有效性可能成为问题。英格兰南部的政治精英在664年瘟疫之前不过一代人左右才接受新信仰：作为对疫病蔓延的反应，东撒克逊人“背弃了基督教信仰的圣事而叛教……他们开始修复荒废的庙宇、崇拜偶像，仿佛如此便能保护自己免于瘟疫”。26 数世纪之后，德国传教主教奎德林堡的布鲁诺（1002–1009）向东欧的马扎尔人、波兰人和佩切涅格人传教。他还撰写了布拉格的传教士阿达尔伯特的传记，以自身经历来揭示阿达尔伯特于997年在格但斯克附近殉教之前所遭遇的困境。在描述最终导致阿达尔伯特死于其手的普鲁士人的敌意时，布鲁诺将他们对基督教的抵制表现为将传教士的到来与土地的贫瘠相等同：“‘由于这些人，’普鲁士人说，‘我们的土地将不再有收成，我们的果树将不结果实，新牲畜不能出生，老牲畜死亡。’”27 像布鲁诺这样敏锐的传教士明白，在争取丰饶的斗争中，宗教与灾难对非基督徒而言正如对基督徒一样密不可分。\n然而，中世纪早期欧洲的许多男女，既不具备格里高利大帝那样博学的世界观，也不生活在非基督教共同体之中。毋宁说，他们的基督教在对世界的理解与回应上呈现出丰富的多样性，因为基督教的传播是一个漫长的文化接触过程，其日常内容在数百年间始终处于协商之中。如第七章将要论证的，高级教士固然对应对挣扎于生存线上的乡村人口所关切的紧迫问题——牲畜与田地的丰产、孩子的健康、风调雨顺——有自己坚定的基督教实践主张，但他们在推行这些主张方面收效有限：地方共同体及其乡村司铎坚持使用更为多样的解决办法，以应对严酷生存的种种困难。当我们思考天气问题，尤其是可能毁坏收成的夏季冰雹时，这一点表现得十分清楚。整个中世纪早期普遍存在两种相辅相成的信仰：其一，恶魔是多余的降雨和冰雹的罪魁祸首；其二，存在“制造风暴者”——男人，偶尔也有女人——人们可以求他们转移恶劣天气，或者让冰雹降落在遭人憎恨的邻居的土地上。为实现所期望的天气而采用的方法，包括向圣徒、“制造风暴者”及其他被认为有能力干预者祈祷和念咒；口头的和书写的符咒、勒令和祷文；支付保护费，以及种种其他手段。\n其中许多做法主要因教士的一再谴责而为人所知，但西班牙西北部一份特殊的文献确实让我们看到，一个人实际上做了什么来抵御冰雹。在八世纪末或九世纪初，一位“上帝的仆人”奥里奥卢斯撰写——或请人代为书写——了一道护符，以使冰雹远离他和邻居们的田地。他将两片写有文字的石板对折并用文字朝内的方式系紧；在念了九道确保其效力的咒语之后，他将其埋在卡里奥附近自己的田里，直到1926年才被农民挖出。奥里奥卢斯勒令“众族长米迦勒、加百列、塞西铁尔、奥列尔、拉斐尔、阿纳尼埃尔、马尔莫尼埃尔，你们手握云彩者”，要他们“翻越群山而去，无论公鸡啼叫还是母鸡咯咯，无论犁田人犁地还是播种人播种，皆不得返回”。他还勒令撒旦不得伤害树木、庄稼、葡萄藤和果树，并加上了归于圣克里斯托弗名下的向上帝的祈祷文，最后以“以圣父、圣子和圣灵之名，阿门，阿门，永远阿门，哈利路亚”结束。28 奥里奥卢斯的石板不仅表明了持久的地区性文字习惯的延续；29 还显示出一种广谱式的消除冰雹的方法：同时呼唤大天使、圣徒和撒旦，将祈祷、咒语和勒令混合成一种由多样的传统做法和地方智慧调制的强力鸡尾酒。\n奥里奥卢斯所关心的是实际事务，但对许多中世纪早期的人来说，恶劣天气、瘟疫以及自然的其他反复无常，在人的经验中也占有预兆性的位置。例如，彗星的出现“预示着饥荒或瘟疫或战争或大地的毁灭或可怕的暴风雨”。30 天文学方面的专家——以及关乎王国罪孽方面的专家——随后会对彗星的意义作出论断，而怀有政治意图的编年史家和评论者也会就彗星的含义发表自己的见解，对蝗虫、疾病和其他此类征兆同样如此。事实上，九世纪加洛林宫廷的作者们如此频繁地将天灾报道为叛乱、维京人进攻或国王死亡的直接先兆，以致其中某些“灾难”很可能是修辞性的信号而非实际的苦难。自然界的失序已成为人类社会衰败的标志，是动荡与混乱的镜像。对于一些思考人间事务应有秩序的博学之士而言，这也是一个可能的迹象，表明善与恶的宇宙斗争可能正按照《圣经·启示录》预言式异象的方式接近终局。\n在公元1000年前后的几十年间，对末世的思考（末世论）以及对可能暗示其临近的种种征兆的审视都增强了。约克大主教伍尔夫斯坦（1002–1023年在任）对这一切并不陌生。他在1005年严酷饥荒之后、并在1014年英格兰面临极端政治动荡之际，散发了一篇布道文，总结了中世纪早期关于天灾、社会秩序与世界末日之间关系的思想。\n亲爱的人们，请认清真相：这个世界行色匆匆，末日临近；因此在世间，事情每况愈下，而且因民众的罪孽，在敌基督来临之前，情况必然大大恶化，届时全世界四方上下都将充满恐怖与可怕。\n……\n因为我们所有人都清楚明白，我们以往所犯的罪远多于我们的悔改，所以许多灾祸正侵袭这个民族。无论国内还是国外，长期以来情况都不好，毁灭和饥荒、焚烧和流血在每一个地区一再发生；偷窃和杀戮、叛乱和瘟疫、牲畜疫病和疾病、恶意和仇恨以及强盗的劫掠给我们造成了极大的伤害，苛重的赋税使我们备受煎熬，恶劣的季节也屡屡使我们颗粒无收。因为如今多年来，看来在这个国家里，到处都有许多不义和摇摆不定的忠诚。\n伍尔夫斯坦以经过时间检验的药方结束其训诫：“转向正道，在某种程度上停止作恶，并为我们的过犯热忱赎罪。”31 无论世界末日看起来多么临近，总还有时间忏悔。\n关于千禧年究竟何时到来虽有学术分歧，但千禧年来了又去，世界并未终结。这并未推翻灾难自有其意义——无论是作为预兆还是惩罚——这一观点，因为人的行为与自然元素的行为之间的关联实在太过根本，无法如此轻易地切断。无论是探讨博学精英的神学化思考，还是试图理解那些视皈依基督教为招灾引祸之人的心态，抑或考察困顿的农民借以控制充满敌意的自然力量的种种手段，我们处处都发现一种根深蒂固的假设：人间事务不过是远为宏大的宇宙秩序的一个方面，这一秩序可能因错误的行为而紊乱，也可通过适当的精神努力和行动而恢复平衡。据此，本章所考察的对灾难的实际和智识回应在我们看来都是可以理解的，尽管其中许多曾遭到高傲的主教和立法者的否定甚至讥讽。\n1002年1月24日，皇帝奥托三世在罗马以北的帕泰尔诺死于突发高烧，年仅21岁，未婚且无子嗣。同时代人将他的死归因于“意大利病”，很可能是疟疾。32 他自己的早逝以及十八年前他的父亲奥托二世28岁早逝，都尖锐地提醒我们：即使是中世纪早期最强大的统治者，也和常人一样容易死于疾病和猝死。奥托二世至少在六个月前通过让襁褓中的儿子当选共治者而确保了继承，但奥托三世对继承问题毫无安排：他的英年早逝使其帝国——一个从波罗的海延伸到意大利中部的庞杂聚合体——陷入动荡。事实上，在中世纪早期的这一次以及无数次其他场合中，死亡和灾难的政治影响不可低估，因为饥荒和疾病可以像猝死引发继承危机一样，轻易地使一场重要的军事远征半途而废。也许是出于对这种脆弱性的认识，也许是幼年时师傅们灌输的世界观所致，奥托三世将他的统治诠释为对正确的政治、宗教和社会秩序的复兴，以此推迟末日的开启。为此目的，他的行动果断坚决。他使永恒之城罗马成为其阿尔卑斯山以北帝国的首都，成为自四世纪以来第一位在那里停留超过匆匆一瞥的统治者。33 1000年，他前往格涅兹诺，在那里开创了对新近显圣行奇迹的圣徒——布拉格的阿达尔伯特——的崇拜。而作为对《圣经》预言所说的世界终结时将会发生之事的提醒，他让自己置身于启示录式的意象之中。996年在罗马举行皇帝加冕礼时，他甚至身披一件“其上用金线绣着整部《启示录》”的斗篷。34\n奥托的统治浓缩了本章的许多主题。他因高烧猝死是典型的意大利式死亡——在那个时代，疾病和饥荒一样，几乎总是局部性的而非普遍性的发作，而且发病形式因地区和栖息环境而异。从他在奈梅亨附近的出生到他在帕泰尔诺的去世，他往返跋涉于阿尔卑斯山南北的辽阔地域，亲身经历了构成欧洲的由各种景观和地方拼合而成的马赛克，其范围从今天的荷兰一直到波兰和意大利。他对末世论的关注，是试图以基督教宇宙论赋予其统治以意义，并将自身置于人类历史——过去、现在与未来——的宏大叙事之中。他对布拉格的阿达尔伯特圣髑的分发，表达了普遍的基督教观念：治愈及其他形式的神圣恩泽从受封圣徒的遗骨中流出。然而，尽管他敏锐地意识到自己肩负着引导帝国走向基督教扩张和罗马复兴的使命，奥托不可能知道他统治的人口——正如欧洲其他地方一样——正在稳步增长，也不知道欧洲的气候正在改善。在其短暂的一生中，他也不太可能注意到景观面貌的变化，如森林被砍伐、新定居点建立、旧定居点迁址。而且，尽管罗马是其政治和世界观的核心，奥托不可能意识到，在他与最后几位西罗马皇帝相隔的几个世纪里，这座城市已经发生了何等程度的转变。当我们在第八章造访罗马时，将会看到其人口只剩昔日的零头，城市景观已经乡村化，地貌已经改观。罗马比任何其他城市都更能集中体现那些高度地方性的变化——正是这些变化使得中世纪早期欧洲人生活与死亡于其中的世界如此复杂，同时又如此充满活力。", "sections": [{"level": 2, "title": "栖居地", "id": "ch4-s0"}, {"level": 2, "title": "生与死", "id": "ch4-s1"}, {"level": 2, "title": "面对灾难的回应", "id": "ch4-s2"}]}, {"id": "c5", "title": "第3章 · 亲族与朋友", "kicker": "第二编 · 亲和", "part": "第二编 · 亲和", "html": "<p>幸福时光里，一个人的近亲会喜爱他；然而每个人终将彼此分离，因为主的旨意是要把这可怜的躯体交付尘土。<sup class=\"fn\" data-note=\"3:1\">1</sup></p>\n<p>凡自然所结合之物，皆宜和谐相处——正是自然将亲属之间的友爱联结起来。<sup class=\"fn\" data-note=\"3:2\">2</sup></p>\n<p>诚然，在任何共同体中，一个人的亲属喜爱他，便是幸福时光；但正如一位匿名的盎格鲁-撒克逊诗人所认识到的，死亡会割断并重构家庭关系。同样，亲属之间的情感，尤其是他们彼此间的友谊，或许是合宜的，但现实很少符合所谓“自然的”神话，因为尽管父母与子女、兄弟与姐妹、叔伯与侄甥之间的纽带是人类任何社会中最为有力的联系之一，它们也可能是最令人忧虑的关系之一。因此，探究亲属关系在中世纪早期的意义，就是考察男女构建人际关系、对其社会世界作出选择、表达情感与理想的最重要途径之一。对这些纽带的思考也能阐明个人身份、亲缘形式以及根深蒂固的思维习惯。</p>\n<p>本章贯穿三个主题：亲属关系在当地多变的社会形式与文化表达；它们作为宣示——或争夺——权力与权威的普遍框架；以及血缘亲缘与友谊亲缘之间的平衡。每一节探讨不同的侧面。第一节运用命名模式、宗教追思方式以及谱系记录，论证家庭传统有助于构建个体的社会身份意识，并强调父系传统往往优先于母系传统的倾向。第二节转向男女原则上可以期望从亲属处获得支持的种种情境，但同时指出，在实践中，在给予与获取帮助方面，友谊纽带至少与家庭纽带同等重要。最后一部分探讨男女各自不同的荣誉行为规范，论证女性规范比男性规范更加植根于家庭关系。这三节都摒弃将亲属关系作为一种社会过程的运作方式加以笼统假设的做法，而是强调个人选择与具体情境以及更广泛的权力关系的重要性。</p>\n<p>然而，我们必须一开始就意识到，“亲属关系”有两种不同但并非无关的含义：其一，是个人与以血缘——即共同的血统——界定的群体的隶属关系；其二，是通过婚姻或其他结合策略在血亲群体之间建立的联盟。在中世纪早期，两者都很重要。此外，我们必须注意，这些亲缘关系既可客观界定，也可主观界定——一方面是依据明确陈述的社会规则被认为与某人有亲属关系的人；另一方面则是个人在特定时刻选择承认为亲属的人。正如将变得显而易见的那样，中世纪早期的男女两者兼用，且往往出于不同目的。研究中世纪早期社会的大部分困难，正源于后一类人通常比前一类人更为重要这一事实。</p>\n<p>由此可见，“亲属关系”显然是一种社会建构的相互关系，而非单纯由生物因素决定的关系。这一事实在“谁是你的亲属”这一问题之外的若干层面上同样成立。收养在罗马法下十分常见，但在除爱尔兰之外的其他中世纪早期文化中并不存在，它是生身父亲与法律上承认的父亲身份不相吻合的一个尤为明显的例证。寄养——在中世纪早期的威尔士、爱尔兰和斯堪的纳维亚尤为重要——创造了另一种“人为的”亲属关系：男孩与抚养他长大的成年人之间的情感纽带，并不与他同父母的关系相吻合，而他日后正是从后者继承财产、法定权利与义务。基督教逐渐高度重视在洗礼中所创造的精神亲属关系，即教父母与教子之间、以及孩子的生身父母与精神父母之间的关系。教会认为前一种纽带与孩子同生身父母的纽带一样牢固；而后一种——“共同父母”之间的关系——则被视为等同于亲兄弟姐妹之间的关系。可见，“自然”对中世纪早期的“亲属关系”贡献相对有限，这种关系实际上远比初看之下更为复杂和灵活。</p>\n<p>现存史料的性质妨碍了我们充分领会所有这些细微差别。法学家与立法者关注财产、暴力以及对无自卫能力者的保护，因而对亲属之间的互动远比对朋友之间的互动更感兴趣。尽管关于亲属事务的丰富指导得以留存——或由国王颁布，或汇编于法学家的法典之中——但无论在地理上还是年代上，其分布都不均匀。尽管如此，对于某些地区和时期，如六世纪的高卢、七世纪的爱尔兰或十世纪的韦塞克斯，这些史料使我们得以构建一个关于亲属关系（以及社会关系的其他形式）在理想状态下应如何运作的概略模型。然而，要超越规范与期望、深入社会习俗与惯例，则需要截然不同的文本记录。文献形式的证据往往是轶事性的，只能提供一幅宏大图景中的狭窄一瞥。其他史料或是经过戏剧化处理、对貌似可信却非历史情境的诗歌式追忆，或是浸透着作者偏见与狭隘认知的教士谩骂——这些独身精英被训练得蔑视家庭与性爱的一切方面。朋友与亲属之间互动的历史现实极难确切把握，尤其因为即便我们能够把握这种现实，通常也仅限于社会上层——地方权贵、贵族、王室——而对农民则几乎完全无从知晓。</p>\n<p>我们可以以七八世纪的伦巴第意大利为例，说明其中的某些困难。涉及家庭互动的王室立法大量留存，其中最著名的是国王罗塔里（Rothari，636—652年在位）于643年颁布的《敕令》。在就自由伦巴第人事务中国王深切关注的问题立法时——如财产继承、订婚与婚姻的正当程序，或指控谋害亲属——罗塔里的法律条条都以与当事人之间的关系来表述：父亲、母亲、继母、兄弟、姐妹、叔伯、堂表亲、侄甥均有提及。法律还频繁提及其他“近亲”，却未具体指明这些人的身份。因此，正如立法者所设想的那样，伦巴第人的亲属关系不仅以个人为参照点，而且顾及具体情境的需要。然而有时，远得多的亲缘关系也可能至关重要，尤其是在涉及财产继承之时。罗塔里颁布法令规定，凡主张财产权利者，必须能够说出七代以内所有祖先的名字，并且必须提供愿在王室法庭法官面前就其亲缘关系的确切性质起誓的亲属。因此，在确保土地仅由能证明有血缘请求权者继承这一至关重要的事务上，伦巴第法将“亲属”界定为一个七代的世系群体。有多少伦巴第人能够说出自己七代以内的世系，追溯到从同一位高祖之父（远至第六代祖先）传下来的亲族，而且——至关重要的是——使自己的说法与亲属们的故事相一致呢？可见，在主张土地所有权时，法律理论将权利界限定在七代之内，尽管有记载的法庭案例表明，亲属关系的主张在实践中可能以截然不同的方式运作。</p>\n<p>罗塔里的《敕令》清楚地表明，在同一个共同体中，多重亲属观念可以依据情境与目的同时发挥作用。伦巴第意大利并非孤例：对中世纪早期的所有文化都可以得出类似的结论。但我们不妨暂时停留在伦巴第法律上，因为它例证了另一个一般性观点。罗塔里假定自由伦巴第人居住在包括家内奴隶和半自由的男女以及自由成员在内的家庭之中。国王虽然当然设想这些家庭可能以丈夫、妻子及其子女为核心，但他的法律也将其他家庭模式视为理所当然。例如，一个家庭可能由一个兄弟、他守寡的姐妹以及若干未婚姐妹组成，此外还有奴隶和其他依附者。它也可能是一群兄弟在父亲死后继续同住于父亲家中，或者是父亲与孙子们——已故儿子的儿子们——也可能是父亲与尚未成家的儿子。罗塔里提及的另一种组合是父亲、前妻所生的子女以及他们的继母。最后这种模式可能尤为常见：鉴于我们对中世纪早期死亡率的认识，许多儿童很可能是在缺少生身父母一方或双方的家庭中长大的。</p>\n<p>简而言之，罗塔里的《敕令》清楚地表明，中世纪的主要社会单位并非核心家庭，而是家庭户。现代思维将同住户居的世系群体视为一个由父母和子女构成的独立社会单元，偶尔加上第三代的近亲（祖父母）或旁系亲属（例如一个兄弟及其妻子和子女）。但这种思维方式只是从十八世纪起才成为习惯。中世纪的词汇familia最贴切的译法是“家庭户”，而且没有任何术语与现代的“核心家庭”相对应。尽管在实践中一个familia通常以夫妻单元为核心，但这个词及其社会群体都涵盖了仆役、依附者，有时还包括其他近亲。其确切成员是流动不定的：年长者死去，守寡的姐妹回到娘家亲族那里，养子来而复去，或者新购入奴隶、依附者被重新调往别处任职。因此在实践中，一个familia包括任何一个时期处于男性家长权威之下并在其产业上居住的所有人——即便不住在他本人的宅邸，也住在他的地产上的其他地方。</p>\n<p>只要我们考察中世纪早期男女老幼的居住模式，就清楚我们必须以家庭户而非核心家庭来思考。即便是王室宫廷也不过是放大了的家庭户。想想查理曼那异常庞大的帝国。其家庭与政治中心是当时的王后或宠妾，他的女儿们（但不含儿子们，因为儿子们度过幼年后便被送往远离父母宫廷的地方去治理副王国），晚年时还有若干孙辈，以及一大批官员、家仆、管事、教士、文书、猎手、厨师，以及维持如此庞大的家庭户和治理庞大帝国所必需的其他人等。而在另一端，中世纪早期的农民也生活在家庭户中，通常与妻子以及或许若干子女同住，有时还包括奴隶或其他半自由的依附者。如果他们是大地产上的佃户，其家庭户甚至可能包括领主或其管家拨给他们的大批或年老的农奴。</p>\n<p>因此，现代人对“家庭”一词含义的假设并不容易套用于中世纪；以下各页使用“家庭”一词，仅作为一个宽泛而定义模糊的简称，指个人承认为与之共享血统、祖先、抚养关系或婚姻关系的所有人。</p>\n<p>尽管“家庭”在“爸爸、妈妈和孩子”的意义上并非一个被承认的社会单位，但这一群体在所有社会层面上，无论就情感还是法律而言，都构成了大多数家庭户的核心。在这一狭小的群体之内，孩子们在母爱与父权塑造的环境中成长，因为男性家长对其依附者所享有的权利，与家庭生活复杂的情感现实相互交织。中世纪早期的史料展现了一个父母、子女与兄弟姐妹之间情感强烈的世界——一个为平安健康的分娩而欢喜、为孩子的夭折而悲痛的世界，一个充满夫妻恩爱、母亲对踏上自己人生道路的成年儿子安康的牵挂、兄弟间的帮助与友谊的世界。同样，这些史料也表明，同样强烈的失望、竞争与嫉妒，可能导致父母遗弃残疾的婴儿、丈夫抛弃妻子、兄弟之间结仇争斗，或儿子弑父。那时与现在一样，父母、子女、兄弟、姐妹、叔伯、姑姨是亲属，却不一定是朋友。</p>\n<h2 id=\"ch5-s0\">身份</h2>\n<p>……“或者你出身何种世系？\n只需说出一位，其余的我便都知道；\n年轻人，所有王国的各个族系我都了如指掌。”<sup class=\"fn\" data-note=\"3:3\">3</sup></p>\n<p>在这部九世纪的叙事诗中，英雄希尔德布兰德（Hildebrand）如此向他的年轻对手发难。他表达了一种普遍的情感，因为在中世纪早期，除了像比德或拉巴努斯·毛鲁斯（Hrabanus Maurus）那样在幼年即被送入修道院的人之外，所有人终生都与社会身份紧密地同亲属联系在一起。既然社会人的塑造始于父母为新生儿取名之时，对亲属关系意义的探究就应当从命名开始。影响中世纪早期命名的习俗与偏好因时代和地区而异，但其大致轮廓相当清楚。当然没有必须遵循的硬性规则；相反，父母的决定往往反映了根深蒂固的文化习惯。除了某些王室婴儿的命名——其名字具有至关重要的政治意义——之外，我们通常无法确切得知父母为何选择某个特定的名字。尽管如此，显而易见的是，为婴儿取名赋予了新生儿一种身份，使其置身于一个亲属圈子之中，甚至可能预示着这个孩子未来将成为教士，或将成为祖传土地的继承人。另一种较为罕见但确实被采用的策略，尤其在爱尔兰和苏格兰，是以某位特定的圣人或宗教庇护者为孩子命名。</p>\n<p>亲属关系与命名之间的紧密关联值得特别关注。在帝国早期（公元一至二世纪），正式的罗马命名程序使用三个名字来标明每个公民属于特定父系氏族——即一种由父亲而非母亲向后代传递成员资格与身份的世系群体——中的一个分支。为应对社会与政治变迁，更为灵活的用法到四世纪已取代了这些僵化的惯例，使名字不仅能够标示社会等级，而且至少在精英阶层中还能标示母系与父系两方面的世系。在罗马帝国晚期的西部，四、五、六世纪的贵族通常拥有两个、三个甚至更多的名字，其选取旨在传达对显赫祖先的自豪感以及对近亲的强烈身份认同。六世纪史家、图尔主教（573—594年在任）格里高利正是这些做法的典型。他的全名是格奥尔吉乌斯·弗洛伦提乌斯·格里高利乌斯（Georgius Florentius Gregorius），父系与母系双方都是富有而有势力的高卢贵族的后裔。他的名，乔治乌斯，是他祖父的名字（卒于502/6年），此人几乎可以肯定是五世纪高卢最富有、最显赫的贵族世系之一的成员。第二个名字取自他的父亲，而第三个名字——他选择以此为人所知——则是他外祖父的名字。图尔的格列高利以这位母系亲属的名字行世，绝非巧合。</p>\n<figure><img src=\"images/fig_3_1.png\" alt=\"第3章所涉主要地点\"><figcaption>第3章所涉主要地点</figcaption></figure>\n<p>格雷戈里乌斯·阿塔卢斯曾任欧坦伯爵，506年成为朗格勒主教；他卒于539年，距其曾孙出生不过一年或至多十八个月，死后立即被尊为圣人。图尔的格列高利通过自己的名字回溯母系三代之前的一位圣徒祖先，以此强调自己的血统、与圣徒的亲近，以及他对母系一方的认同强于对父系亲族的认同。</p>\n<p>图尔的格列高利的多个名字表明，父母可以通过为孩子取名来确定其在家族中的位置。但这也代表了一种日渐衰微的传统，因为即便人们仍自视为“罗马人”，到格列高利的时代，单一名字已渐成习俗，至七世纪末，即使在拜占庭世界也已普遍化。然而，古老罗马精英家族中命名习惯的改变，只是我们这一时期开端时名字与身份之间关系的若干重要变化之一。五世纪间，罗马统治结构的解体以及新兴王国围绕日耳曼语精英的凝聚，凸显了所有日耳曼语言共有的独特命名模式。然而，这两个名字库并未长久地保持分离。在六世纪的高卢，名字反映了旧精英对新政治环境的适应，因为一些罗马血统的个人放弃了传统的命名习惯，转而采用其新法兰克主人的命名方式；相比之下，在西班牙和意大利，哥特人和伦巴德人有时也为自己的后代选取罗马名字。当取罗马名字的父母为孩子起日耳曼名字时（反之亦然），他们是在就文化威望和社会身份做出地方性的决定——这些决定完全出于融入统治群体的愿望，与口头语言毫无关系。</p>\n<p>值得稍作停顿，考察一下日耳曼语言中名字是如何构成的。因为尽管“名字将新生儿与其祖先和亲族联系起来”这一惯例，在日耳曼语社群及其后裔中与在罗马人中间同样根深蒂固，但其中起作用的却是不同的语言和社会原则。日耳曼名字（非王室与王室皆然）通常由两个成分构成：词根和后缀。二者以各种方式传承和重新组合，并借此标示血统、族群属性和社会身份。其中一些成分见于所有日耳曼语言，但另一些为某一语言所特有的成分则成为备受重视的族群身份标志。</p>\n<p>我们这一时期末尾的一个例子既说明了日耳曼名字的构成方式，也说明了一个名字可能承载的复杂意涵。约1008年，一对富裕的盎格鲁—撒克逊夫妇——教士埃塞尔斯坦及其妻武尔夫吉芙——生下一个儿子，可能是他们的第一个孩子。这个孩子后来成为主教和圣徒，其传记作者记载道：“他被命名为武尔夫斯坦，前半部分取自母亲之名，后半部分取自父亲之名。这孩子有美好的前程，为他取名于双亲的兆头同样美好，因为他注定要将双双方的圣洁汇于一身，或许还将超越之，无可比拟。”<sup class=\"fn\" data-note=\"3:4\">4</sup> 这一对未来圣德的预兆强调了父母名字的成分如何被用来构成新名字，但这个孩子似乎也是以其舅父——约克大主教那位名人——命名的。这个名字大概预示了年幼的武尔夫斯坦将走上教会生涯。在为未来主教的两个弟弟取名时，埃塞尔斯坦和武尔夫吉芙再次标示了孩子们的父系出身——为他们取名埃尔夫斯坦和比尔克斯坦——但选取了其他成分来与父系后缀-stan组合。这些关于孩子名字的决定，可概括为围绕共同家族主题而自由选择的变体。</p>\n<p>年幼的武尔夫斯坦确实成为了主教（伍斯特主教，1062–95年在任）。他的名字例证了名字成分如何被重新组合成一个新名字，同时又把孩子与父母联系起来；它也强调名字成分是双向传承的——换言之，它们可以同样轻易地取自母亲或母系亲属，正如取自父亲或父系亲属。尽管如此，凡在保存下来的名字样本足以进行统计分析之处，都清楚地表明，父母通常更愿意将孩子与其父系而非母系亲族联系起来。诚然，在加洛林帝国的贵族中，几乎所有孩子都以近亲（父母、叔伯姑姨、祖父母）命名，但可证实以母系亲属之名为名者不足五分之一。法兰克人的命名习惯并非完全排斥其他名字，但偏好近亲之名，而在近亲范围内，又更常标示父系而非母系关联。只有当母系世系拥有更显赫的祖先时，父母才倾向于选取将孩子与其母系亲族联系起来的名字。</p>\n<p>到未来的伍斯特主教武尔夫斯坦出生之时，通过变换两个成分来创造名字的习俗已显陈旧。六世纪时，欧洲大陆的统治王朝已开始通过完整重复某位已故亲属的全名而非变换名字成分来为后代命名。这一习俗逐渐从国王传播到贵族，至十世纪末，越过英吉利海峡，开始影响盎格鲁—撒克逊的命名惯例。到约1000年，大陆精英普遍使用一个有限的名字库来标识家族成员，且对名字父系传承的强调愈发突出。当“卡佩”于格在旧加洛林统治王朝覆灭后于987年在法国加冕为王时，他继承的名字清楚地标识了他作为至少自九世纪中叶以来就在法国声名显赫的顶尖贵族家族之一的成员身份。他的男性祖先都名为于格、罗贝尔或厄德；其姊妹通常名为埃玛或阿德拉。到千年之交，名字仍是身份的标志，因为父母继续选取将后代与近亲和直系祖先联系起来的名字。但名字将孩子与父系亲属——而非母系亲属——联系起来的程度，更甚于以往。</p>\n<p>如果说在孩子出生时命名将新生儿置于一个狭窄的家族圈子之内——扩展至堂表兄弟姊妹、祖父母，偶尔还有曾祖父母——那么死亡则为亲缘关系和社会身份的模式注入了新的因素。在八世纪及以后的基督教社群中，对灵魂来世福祉的关注促使许多人在修道院名册上登记其生者与死者的亲属之名，为他们请求代祷。这样的祈祷将生者与死者联结于一个礼仪共同体之中，通过在生者中间呼唤死者之名来召唤他们的临在。在法国、德意志和英格兰的数座九、十世纪修道院中登记的大规模名单留存至今，为我们考察个人与亲族关联的方式提供了另一重视角。德意志国王捕鸟者亨利（919–36年在位）即为典型：932年，他请求圣加仑修道院为他本人、他的妻子、他们的三子二女，以及其中一个女儿的丈夫、他妻子的父母及其三个姊妹祈祷。亨利对亲族灵魂福祉的关怀涵盖了三代人，并超出自己的妻子和子女之外，扩展到通过各种婚姻与他产生关联的人。在宗教纪念的语境下，“家庭”超出了个人的出生家庭以及他或她所属的婚姻单元，囊括了一个宽泛但仍具选择性的亲属群体。由于所关涉的是灵魂在来世的命运而非土地或世俗职位的传承，这种亲缘形式毫不迟疑地承认女性——母亲、妻子、女儿——享有与男性同等的地位。</p>\n<p>在获取宗教纪念和为孩子命名的过程中，关于亲族纽带的观念各有不同。二者最重要的共同特征，一是承认亲缘关系涵盖两三代人，至多四代；二是接受女性有时可能对家族身份的界定做出重要贡献。这两个特征在个人利用亲缘关联建构社会身份的第三种主要方式——世系谱——中均不成立。世系谱是以《圣经》先例为范本的血统陈述。它们通常采取“X是Y之子，Y是Z之子”的形式，且与本章迄今讨论的大多数史料不同，它们照亮了不列颠群岛——尤其是威尔士和爱尔兰——的文化。大陆上留存下来若干王室的世系谱，但十世纪末之前没有一部追溯非王室人物的祖先；相比之下，在爱尔兰，自八至十世纪留存下来的数以千计的世系谱，不仅涉及国王，也涉及基督教圣徒和贵族。这些世系谱呈现了一种纵向的亲缘形式（可以延伸自数代至三十余代不等），几乎毫无例外地完全是男性的，并且全然无视兄弟姊妹或旁系亲属。</p>\n<p>尽管许多此类世系谱中的某些部分所宣称的亲属关系可被证明在历史上属实，但它们更重要的是其所做出的文化和政治宣示。在所有中世纪早期社会中，对世俗权力、财富和地位的主张在很大程度上依赖于血统：世系谱使这些主张合法化。所呈现的亲族纽带是那些具有直接政治意义的纽带，因而只要政治需要，便可能被重塑和重排。这种操纵可能涉及对世系长度及其旁系分支的删削或增补。加洛林王朝（751–987）不仅将自己挂靠到其最终取代的墨洛温王朝（约480–751）之上，还通过一部世系谱将罗马的过去纳入自己的祖先谱系，宣称其圣徒化（且有史可考）的创始人梅斯的阿尔努夫（卒于约643年）是（虚构的）墨洛温公主布莉希尔德与其（同样虚构的）被尊为罗马元老的丈夫安斯贝尔特的外孙。其中有两点值得注意。其一，一位虚构的女性构成了这部原本纯男性的血统陈述中的关键环节。刻意省略王朝在现实中借以确立地位的有史可考的女性，确认了女性被排除在正式权威之外；而纳入一位神话中的女性祖先，却又承认了女性对王朝延续和家族记忆传承的根本贡献。其二，在准确的人类记忆所能及的范围之外，七、八世纪的历史事实渐次融入了创造性的意识形态乐观主义，并借助文本传承的关于遥远罗马过去的知识而得以强化。以任何最适合时机的方式操纵世系谱陈述的政治动机清晰可见。不过，作为一种利用过去宣示当代政治主张的方式，这部加洛林世系谱还算是相对克制的。在爱尔兰，强调世系古老悠长的需要，导致欧莱恩人与达尔·菲亚塔赫人的共同祖先被命名为“极老之子老者、极强之子强者”。<sup class=\"fn\" data-note=\"3:5\">5</sup> 至此，我们达到了生物虚构服务于政治合法性的顶峰。</p>\n<p>世系谱表明，亲缘关系既可以关乎基因意义上的父母血统，也可以同样关乎社会建构的关系——以生物血统的虚构和神话祖先的形式表达出来。而且，它们比任何其他东西都更清楚地表达了所有中世纪早期文化的父系倾向：被删削为一连串强者相继传承的赤裸陈述后，它们强调唯一重要的是从“父”到“子”的延续。但这些男性规范运作于一个从未有过单一、稳定的亲缘观念的世界之中。命名习俗和纪念仪式提醒我们，在这些情境下，被承认为亲族的包括男系和女系双方的近亲属圈子。实际上，亲缘关系在不同情境下意味着不同的东西。</p>\n<h2 id=\"ch5-s1\">血缘之友</h2>\n<p>现在是时候转向亲缘关系的更广泛意涵了，因为种类繁多的史料——法律的、文献的、叙事的、诗歌的、圣徒传的——都证实，与亲属的交往通常具有重大的社会和政治意义。这些史料还坚称，亲缘关系无法与友谊相剥离。然而，这些亲缘纽带的实际表现形式极为多样，其成因有助于解释亲属——以及朋友——在彼此生活中可能扮演的众多角色。</p>\n<p>中世纪早期欧洲文化异质性的一个表现，便是多元社会规范的并存。我们在这方面的许多具体认识来源于法律记录，其内容与文本形式和权威来源一样纷繁多样。大体而言，可以辨认出三种法律文化，它们对亲缘关系的期待大相径庭。</p>\n<p>社会关系，包括亲属之间的关系。在地中海欧洲，只要人口的延续和行政的延续使人们得以继续自视为罗曼人（Romani），晚罗马帝国的法典编纂便仍然有效。在北方，讲日耳曼语的移民带来了他们自己的社会习俗，这些习俗自六世纪起开始采取规范性的成文形式。这两种法律文化之间并没有泾渭分明的界限，因为后帝国时代的诸王所颁布的所有法典，都或多或少地透露出罗马法的影响，这一点在那些源于罗马势力持久存在的较南部地区的法典中尤为明显，特别是勃艮第、伦巴德和伊比利亚哥特诸王国。第三种法律文化——即濒临大西洋欧洲的操凯尔特语地区的法律文化——在形式和内容上都远不易受罗马影响，因为在那里，罗马的直接影响是有限的或根本不存在的。这三种传统各自对亲属关系的社会意涵提出了不同的看法。</p>\n<p>需要说明的是，法律始终只能以间接且高度图式化的方式反映社会现实，就此而言，可以说每一种法律文化都大致对应于一种独特的社会组织形式。正如公元五世纪所编纂的那样，罗马法极为关注婚姻的规范以及确认男性家长对妻子和子女的权威；但它明确否定了成年男性的法律身份与其亲属相关联的任何观念。与此相反，世俗的爱尔兰法律论著清楚地表明，亲族集团是最基本的社会组织形式；这些论著对规范和程序的规定如此详尽，以至于可以对亲属之间理想的互动方式进行精细的重构。<sup class=\"fn\" data-note=\"3:6\">6</sup> 晚罗马法和爱尔兰法对于亲属在彼此生活中应扮演之角色的预期都清晰可见。然而，在这两个极端之间，关于日耳曼语社会中亲属关系之意义的讨论却众说纷纭。</p>\n<p>十九世纪的历史学家构建了关于早期日耳曼社会（一至七世纪）的宏大体系，将其组织为作为政治实体、维持和平与司法机构、征兵单位和聚居群体而运作的大型氏族。他们赋予这些亲族集团（通常以德语术语 Sippe 称之）以宪制上的重要性，并将其置于欧洲社会从氏族到核心家庭、从部落到国家——换言之，从“原始”到“文明”——的进化论进程中的显要位置。这一文化进步的范式早已崩溃，但关于早期日耳曼民族社会组织形式的这一基本观念却瓦解得较为迟缓：它同样必须被彻底抛弃。取而代之的应当是个体：每个人都拥有一张只与其同父母兄弟姐妹共享的血亲关系之网，以及因婚姻而与姻亲发生的一系列略有不同的互动。</p>\n<p>在实践中，亲族从未作为一个持久的群体而存在。毋宁说，他们处处以一类人的形式存在，是一张潜在的亲和关系之网，随各个具体情境的需要而被激活和动员。婚姻习俗与继承策略这两个方面将留待下一章讨论。在此，我们将利用诗歌、文书和法律证据，来强调亲属关系在其他一系列情境中所固有的模糊性与不确定性。</p>\n<p>现存于约公元1000年的一份抄本中、但起源可能要早得多的古英语史诗《贝奥武甫》（Beowulf），其故事背景设定在神话般的斯堪的纳维亚过去。然而，它的理想和价值观与其盎格鲁-撒克逊听众产生了共鸣，并在中世纪早期西方其他地区的方言诗歌中——例如爱尔兰、威尔士和德意志——也有密切的类似之处。《贝奥武甫》的戏剧张力很大程度上来自亲属之间理论上的义务与实际上的不可靠之间的冲突。虽然“对于一个思想正直的人，亲属的纽带|无论如何都不可割断”，但诗人也十分清楚，终有一天“血仇将再度掀起|誓约亲族间的刀剑之恨”。<sup class=\"fn\" data-note=\"3:7\">7</sup> 要洞察亲属之间义务与敌意之间的紧张关系如何上演，我们可以求助于法兰克的《萨利克法典汇编》（Pactus Legis Salicae）。此书大约编纂于克洛维在位期间（约481–511年），是为居住在莱茵河三角洲与卢瓦尔河之间、但其文化尚未过度受罗马规范和法律程序影响的法兰克人所编纂的一部习惯程序与王室法令汇编。《汇编》清楚地表明，亲属应当在多种方面相互提供支持。如果一个人需要以宣誓来确立自己的身份，或证明自己的无偿还能力，他就必须找到与他共同宣誓的人：这些“宣誓助誓人”从他的男性亲属中招募。此外，如果有人被杀，凶手必须为所夺的生命支付金钱赔偿，否则就要冒血亲复仇（本章最后一节将讨论）的风险，而赔偿金要在死者的子女以及父方和母方的亲属之间分配。反之，如果凶手本人无力筹足全部款项，其亲属就必须帮助：首先是他的父亲和兄弟，若义务仍无法履行，则是他的母方和父方亲属。</p>\n<p>这里涉及的是哪些亲属？当然有子女和父母——这个紧密团结的婚姻家庭群体，对身份、继承乃至生存都至关重要。除此之外，法律并未明言，只是笼统地提到父方和母方的“亲属”。因此，任何个体都与父母和子女处于特别紧密的关系之中，但也不得不进行协商，以便从更广泛的、双向的亲属圈子中获取所需的任何支持。这个圈子的构成不太可能一成不变，因为死亡会夺走父母和叔伯，而婚姻则在个体生命的不同阶段引入姻亲。此外，《萨利克法典汇编》设想个人可以正式切断亲属纽带，并概述了实现这一点的办法：</p>\n<p>凡欲脱离其亲族者，应前往法庭，在郡官（thuningus）或百户官面前，在其头上折断四根桤木棍，将其分作四束掷向法庭的四角，并当场声明他脱离他们的宣誓相助，脱离他们的继承，以及与他们的一切亲缘关系。<sup class=\"fn\" data-note=\"3:8\">8</sup></p>\n<p>凡经此程序者，即免除了为亲属提供现金（或以土地和牲畜折算的等价物）、宣誓或其他任何支持的义务，但也会发现此后既无援助亦无继承可得；此人将孤身一人、毫无助力地面对世界。由此证据可见，法兰克的亲属关系并非在特定人群之间的一种凝聚性纽带，使他们在一切情况下都作为一个群体运作。毋宁说，在直接的亲子关系之外，它是一张由潜在支持者构成的、界限不明的网络，需要在需要时加以说服而付诸行动。在其最惨淡的一面，它是一张由不受欢迎的义务和社会尴尬构成的网，需要周旋应对，甚至在万不得已时予以拒绝。</p>\n<p>在危难之时，其他潜在的支持者可能是一个人的邻人、领主以及其家内（familia）中的依附者。由于这些人中有些很可能与他有亲缘关系，亲属关系常常与其他高度地方化的关系相互重叠并彼此强化。因此，在危机中可以指望挺身而出的人，都是这一困顿个体的“朋友”，而史料中不加区分地提及“朋友与亲属”的频率之高，令人瞩目。事实上，在盎格鲁-撒克逊英格兰，这种区分有时完全消失，因为在众多意为“亲族”的古英语词汇中，最常用的一个——尤其在法律法令中——是 freond，即现代英语\"friend\"一词的直接来源。真正要紧的亲属关系，不是精确谱系关系的技术性细节，而是在实践中能够发挥作用的亲属关系。正如十一世纪末梅斯主教狄奥德里克（963–984年在位）的传记作者所断言：“没有善意，亲缘只是一句空话；而友谊与善意密不可分”。<sup class=\"fn\" data-note=\"3:9\">9</sup> 用马克·布洛赫的难忘说法，可以依靠的亲属是“血脉上的朋友”。<sup class=\"fn\" data-note=\"3:10\">10</sup></p>\n<p>与带有“自然”关系光环的亲属关系不同，友谊完全是社会建构的。正如第五章将要论证的，中世纪早期的社会关系主要以等级方式组织；友谊则提供了横向的团结纽带，缓和了支配与服从的严酷轮廓。《贝奥武甫》的诗人也深知这一点；他让丹麦国王赫罗斯加如此描述他被害的朋友艾什赫尔：</p>\n<p>“他是我最亲近的谋士，我心事的守护者，\n当我们为性命搏杀、步卒队伍轰然相撞、\n枪矛如雨点般落在野猪纹盾上时，他伫立在我的肩旁。\n凡出身尊贵、德才兼备者，\n都应如艾什赫尔一般！”<sup class=\"fn\" data-note=\"3:11\">11</sup></p>\n<p>因此，在中世纪早期，朋友是那些在需要时相互提供忠告和支持、表明忠诚并以适当行动——甚至在战斗中——予以践行的人。他们可能是邻人、姻亲、同侪群体的成员，甚至是亲属。尤其在精英阶层中，友谊可能带来巨大的社会利益，而失去友谊则后果最为严重。赫罗斯加的王厅鹿厅曾经历过欢乐时光，而《贝奥武甫》记述了其终结；正如诗人所预言的，友谊并不比亲属关系更可靠：</p>\n<p>鹿厅的地板上\n满是朋友：那时虚假\n在丹麦人的交往中还无处容身。<sup class=\"fn\" data-note=\"3:12\">12</sup></p>\n<p>亲属间的友谊可能具有相当的政治重要性，其后果无法与权力和权威的形式相割裂。这里可以指出两个极端。一方面，五至六世纪的爱尔兰拥有数百个小领地和小王国，其统治者只有有限的行政影响力。在这里，古爱尔兰语的 fine 一词兼有“亲族”和“朋友”之意，亲属的忠诚往往强化领主忠诚，两者共同促进了社会凝聚与秩序。另一方面，在王权强健且大体有效的地区，如加洛林时代的法兰克亚以及到十世纪的盎格鲁-撒克逊英格兰，亲属间的相互支持可能有损于国王所期望的法律与秩序。英格兰国王埃塞尔斯坦只是几位为罪犯所困扰的统治者之一，这些罪犯的亲属保护他们使其免受王室司法的严惩。他面对的难题是盗贼受到“如此强大、如此庞大”的亲族庇护，以致王室官吏无力触及。显然，地方豪强通过将盗牛贼之流收编入自己的扈从和家内，来强化对地方的掌控；埃塞尔斯坦的解决办法是授权由武装人员组成的骑马队去威慑并摧毁这些以亲族为基础的地方保护网。<sup class=\"fn\" data-note=\"3:13\">13</sup></p>\n<p>同样地，亲属之间友谊的破裂可能产生严重的政治后果，尤其当裂痕出现在统治家族内部时。德意志皇帝亨利二世于1024年去世，未留子嗣或其他指定的继承人。德意志精英成员相互协商，数周后商定有两名最合适的王位候选人，两人都叫康拉德，且是堂兄弟。在两人之间紧张的讨价还价中，年长的康拉德——他最终获胜并如期加冕为康拉德二世（1024–1039年在位）——据说曾对其亲族言道：“凡是自然所结合的事物都应当和谐一致——自然将亲属间的友谊结合于一身”。<sup class=\"fn\" data-note=\"3:14\">14</sup> 然而这一协议十分脆弱，因此当小康拉德在不到一年后成为反叛者之一、并在此后长期对其已加冕的堂兄弟构成威胁时，没有人会感到意外。细察之下，中世纪早期许多最激烈的政治对抗皆是如此，因为没有什么比亲属关系更能滋生竞争了。</p>\n<p>那么，那些亲属权利和义务已被切断、实际上变得无亲无族的个人又如何呢？这些人最可能是男性，他们或因惯常偷盗、斗殴、挑起仇杀而耗尽了亲属的善意，或因背叛和暴行转向至亲，犯下弑父、弑兄，甚至与自己母亲乱伦的罪行。在盎格鲁-撒克逊英格兰和欧洲大陆，那些亲属不再愿意通过共同宣誓或分担巨额赔偿金来支持他们的人，只能以他们仅剩的东西——性命——来承担后果，或服苦役，或受绞刑。在爱尔兰，犯有背叛、盗窃或杀害亲族之罪的人被贴上狼的标签，并被如此对待：他被放逐流浪，成为遭人憎恨的弃儿、令人畏惧的局外人，丧失了身份、援助——乃至人性。</p>\n<p>归根结底，无亲无族使自由人的社会处境沦落到与奴隶相差无几的卑贱地步，既无权利，亦无亲属。在一个基督教社会中，这是比死亡更悲惨的命运，因为与亲属保持友好关系的人尚可指望体面的葬礼和为其灵魂的祈祷。社会弃民死后被抛上粪堆；无亲可依的流亡者则承受着其在生时的等价境遇。这种彻底的沉沦凸显了亲属关系的核心重要性——不在于其谱系归属，而在于其作为维系共同体之“友谊”的社会意义。</p>\n<p>任何地方的亲族都未曾形成一个具有明确成员标准和固定行为规则的明确群体；在任何地方，一个人的亲属都是一种可资援引的社会资源，是随情境需要而提供身份认同与支持的源泉。然而，亲属关系以不确定性为前提，因为支持必须经过协商、恳请方付诸行动。这样一种对亲属关系的解释不做太多理所当然的假设，因为它以不可预测性来平衡互惠，以拒斥来平衡亲和。它承认，原则上，一个人的忠诚和义务同时延伸至父方和母方亲属；它认识到，亲属关系除血统外，还可通过婚姻、教父关系或寄养而建立。它还有助于解释，尽管中世纪早期欧洲在文化和社会上如此异质，亲属纽带为何仍始终是社会凝聚的根本源泉，无论在孤立的村落还是在广布的帝国精英之中。然而，同理，这种纽带的破裂则威胁着社会结构的根本。难怪地狱被描绘成一个“在那里任何至亲都互不相认……在那里母亲不爱其子女，儿子不敬其父”的地方。<sup class=\"fn\" data-note=\"3:15\">15</sup></p>\n<h2 id=\"ch5-s2\">荣誉与复仇</h2>\n<p>正如《萨利克法典汇编》所详述的，亲属相互扶助的方式之一，是代凶手及其亲族向被害者的亲属支付应付的赔偿金。除罗马法原则仍然行之有效的地区外，所有中世纪早期的共同体都为赎回一条性命规定了金钱价值，在日耳曼诸语言中称为“人命金”（wergeld）。其数额随等级而异，明确宣示了国王或贵族远高于农民或奴隶的价值；妇女和儿童一般享有其父亲的人命金。然而，人命金并不仅仅适用于杀人案件。杀人固然解释了为何人命金是一条性命的代价，但在未致命而遭受伤害的情况下，也须支付人命金或其一定比例。伤害可以是身体的，也可以是言语的：罗塔里（Rothari）的伦巴德法典列出了从砍断小脚趾到挖出眼睛等五花八门伤害所应付的赔偿，而法兰克的《萨利克法典汇编》则规定了从一百零⁰——不，规定了从一百到一千不等的言语侮辱。其中包括指控一名女子为娼妓，以及通过指控一名男子“浑身是粪”、称他为“狐狸”或“野兔”来诋毁他的作战勇气与忠诚——换言之，就是指控他因恐惧而失禁、行为奸诈或临阵脱逃。<sup class=\"fn\" data-note=\"3:16\">16</sup> 因此，我们需要评估赋予人的生命的价值如何同时涵盖了社会自我与肉体自我，并探讨对男女行为的不同期待如何影响了亲友的行为。正如我们将看到的，这些侮辱揭示了一个敏感而自尊的世界，其核心在于女性的性贞洁与男性的勇武好斗。</p>\n<p>既然伤人的言语与有害的殴打都攻击了社会地位，偿命金就远不止是对肉体损害的赔偿。它以货币形式表达了对家族自豪感、名誉与尊严的冒犯：支付偿命金的义务使加害者及其亲属承受了同等的贬损。实际上，偿命金是对一个人的家族所受集体社会尊严损害的补偿。它兼具损失赔偿与恢复尊严手段的双重性质，通过与爱尔兰的双重离散支付程序相比较而更加清晰：一项支付补偿死者、伤者或受辱者的父系亲属所受的损失或损害；另一项称为“面孔的价值”或“净面”之金，用以抵偿对父系和母系双方亲属的侮辱。“洗净”被玷污的面孔可以消除损失、伤害与侮辱的污点，这暗示了一种将名誉与人身紧密相连的文化：恢复个人的社会地位就是“挽回面子”。偿命金与爱尔兰的“面孔价值”都按等级递增，这一事实表明，社会地位高的人比社会下层的人面临更大的丢脸风险。以下讨论即聚焦于这些记载翔实的高价值精英。</p>\n<p>八世纪中叶的巴伐利亚法典让我们更进一步。它列举了五个位列公爵家族之下的精英家族，他们有权获得“双倍补偿”，因为他们被授予了“双倍尊荣”。<sup class=\"fn\" data-note=\"3:17\">17</sup> “尊荣”难以简短定义——只是它不同于赔偿金，并不遵循任何价目表。人类学家用这个词作为一整套复杂的个人社会属性的简称，这些属性共同促成政治影响力和物质财富的积累。其本质将个人的自尊与他人的敬重结合在一起。它既关乎自我，也关乎他人，若不通过日常品行和具体行动不断重申和再确认，便趋于消散。因此，推而广之，它从不稳定，也无法囤积。此外，它与赔偿金的关联暗示，中世纪早期的尊荣既是家族的，也是个人的：它内在于群体之中的人，将个体牢牢置于由亲属、朋友、领主和国王构成的社会关系之网的中心。而且，由于某些行为形式比其他行为更易于肯定或恢复尊严，中世纪早期的精英男女对那些可能玷污乃至彻底摧毁尊严的形形色色的言行后果有着敏锐的意识。大量关于羞耻、恶名、羞辱与耻辱的词汇表明，不光彩的行为如何在他人眼中导致声名狼藉。在社会价值谱系的消极一端，羞耻与损害个人和家族自豪感及名誉的行为相连。而当涉及的家庭是王室时，尊荣的侵蚀可能在政治上是灾难性的。</p>\n<p>中世纪早期的作家很少用一个词来概括这一抽象概念。他们更倾向于从行动来思考——尊崇、向某人表示敬意。有尊严的行为强调慷慨、财富的展示、忠诚、性、武勇与复仇。贯穿这些看似互不相关的行为方面的，是两个相互交织的主题：一个涉及人体的正确处置，无论是在性事、军事事务中，还是通过华丽的服饰；另一个涉及对他人的义务，无论是慷慨、忠诚还是复仇。将社会展示与慷慨分别留待第五章和第六章讨论，我们可以利用其他形式的有尊严行为，进一步探讨中世纪早期亲友之间互动这一主题。</p>\n<p>性行为最直接地显示了个人活动如何影响其亲族的集体地位。这里涉及的是性贞洁的观念，以及对违反根深蒂固的习俗和禁忌者的责任追究。例如，《萨利克法典汇编》将私生子视为“蒙受耻辱者”。<sup class=\"fn\" data-note=\"3:18\">18</sup> 不过总体而言，独身的基督教教士是我们了解中世纪早期性观念最重要的信息来源。虽然世俗的社会行为与那些急于谴责一切不合自身伦理观念之物的教士的抱怨确实难以剥离，但显而易见的是，中世纪早期的严格性行为规范更多针对女性而非男性。“在老萨克森（即仍属异教的德国北部）”，盎格鲁-撒克逊传教士博尼法斯在746/7年报告说：</p>\n<p>如果一名少女以通奸玷污她的父家，或者一名已婚妇女背弃婚姻纽带而与人通奸，人们有时会强迫她亲手结束自己的生命，用绳索自缢；当她被焚烧火化之后，人们把玷污她的男子吊在她的火葬堆上。有时会聚集一群妇女，由女眷们鞭打她，带着她走遍整个地区，用棍棒殴打她，把她的衣服割到腰带；并用刀在她全身切割刺扎，留下伤口，把她血肉模糊、遍体鳞伤地从一个村庄赶到另一个村庄。而出于对贞洁的热忱，总有新的鞭打者加入进来，直到她们把她打死，或打得奄奄一息；以便使其他人畏惧通奸与淫乱。<sup class=\"fn\" data-note=\"3:19\">19</sup></p>\n<p>诚然，博尼法斯是要向他的基督徒听众说明一个问题——他认为他们的道德过于松弛——但他的话仍然暗示了一种将通奸等同于玷污家族完整性的心态。</p>\n<p>并非只有前基督教时代的家族才会以处死有罪女子或施加极端惩罚来回应未经许可的女性性行为。勒芒早已是一座基督教城市，584年，一位出身高贵的女子女扮男装与她的情人——一名教士——私奔。当她的亲属发现后，他们立刻“为家族所受的羞辱复仇”，将那女子活活烧死，并囚禁了那名教士。<sup class=\"fn\" data-note=\"3:20\">20</sup> 她的行为损害了所有亲族的名誉，亲族们采取了他们唯一可行的手段来挽回名誉。大体而言，中世纪早期社会把对失范女子的惩罚交由其男性亲属——无论是父亲、兄弟还是丈夫——处置。对女子公然侵害其亲属尊严行为的家族即时报复，与将一名男子逐出亲族并令其沦为被放逐者的程序互为对应。</p>\n<p>“如果一名女子在丈夫在世时与另一名男子通奸，并且此事败露，那么她此后将自取其辱，成为公开的耻辱，其合法丈夫应获得她所有的一切，而她将被割去鼻子和耳朵。”<sup class=\"fn\" data-note=\"3:21\">21</sup> 女性在被认可的婚姻关系之外的性行为，会招致羞耻、丢脸（无论是字面意义还是比喻意义）、家族蒙羞，甚至死亡。这些构成了规范女性行为的大体不成文的制裁，也标示出家族名誉与控制女性性欲之间的紧密联系。女性与性交对任何亲族的繁衍都至关重要，以致男性亲属的荣誉与其姐妹、妻子和女儿的性贞洁与自我节制密不可分地等同起来。而且，正如通奸通过女子使用身体的方式带来耻辱，报复也同样施加于她的身体之上——石击、毁容或处死。</p>\n<p>女性的性过失挑战了一个男子继承人的父系血统，从而威胁其整个家族的社会地位。但女性也可以通过节制自身的性欲作出积极贡献。“一个贞洁而贤慧的妻子，以谦逊的仪态和欢愉的言辞勤勉地打理有益的事务，”一位九世纪的作家如此评述，“会平和地管理她的子女和家庭；并且，为了丈夫的福祉，必要时她会以生命抗衡死亡，以清誉捍卫他的财产”。<sup class=\"fn\" data-note=\"3:22\">22</sup> 如果女性的清誉有助于其亲族所受的敬重，那么她的男性亲属也有责任保护她免于风险，捍卫她的好名声。这一点体现在733年伦巴德国王柳特普兰德（712–744年在位）过目的一桩诉讼中。一名女子独自在河中沐浴，将衣服放在岸边。“某个邪恶之徒”拿走了衣服，她被迫赤身裸体走回家，“羞得满脸通红”。但羞辱并非她的过错，柳特普兰德裁定，窃贼必须为如此“可耻”的行为支付其全额偿命金作为赔偿，理由是，如果女子的父亲、丈夫或其他男性亲属在场，他们必定会扑上去杀死他。既然窃贼已隐匿逃脱、毫发无损，他便须提供与其性命等值的金钱。<sup class=\"fn\" data-note=\"3:23\">23</sup> 国王裁决中隐含的，是承认女子的亲属既有义务也有权利——必要时以暴力——捍卫她的贞洁，从而捍卫她的清誉。</p>\n<p>女子的行为集中体现了尊荣居于家庭成员关系核心的方式。她犯下的任何性行为失当都给她自己和亲属带来耻辱；她贞洁的品行则维系着丈夫、父亲和兄弟的社会尊严。作为维护她——以及他们——荣誉的回报，她可以指望他们保护她免受可耻对待和诬告。维护尊荣、避免羞耻，指示了有助于维系近亲之间融洽关系的行为方式。</p>\n<p>在保护妻子、姐妹和女儿免受言语或人身攻击时，中世纪早期的男子会迅速诉诸暴力。的确，男性尊荣与好斗、勇气和武艺的展示紧密相连，正如女性尊荣与性贞洁密不可分。然而相比之下，男性尊荣与家族荣誉的绑定并不那么排他，至少在精英阶层中是如此。它也是内在于武士与其所事奉领主之间正确关系的一种品质，是对将男子与其家族相连的荣誉的补充而非取代。正因如此，它成为社会晋升和政治影响力的途径。</p>\n<p>843年，一位名叫杜奥达的阿基坦母亲写信给她深受疼爱的15岁儿子。儿子当时住在西法兰克国王秃头查理（840–877年在位）的宫廷中，学习宫廷社会的处世之道。杜奥达在向纪尧姆倾吐道德与宗教教诲时，触及了尊荣这一主题，及其与家族和领主的关系。在论述如何在九世纪中叶紧张的政局氛围中获得成功的教导章节开篇，她告诫纪尧姆“应当在一切事上敬畏、热爱并忠于［他的］领主和父亲贝尔纳”，继而将对其父的尊崇与对基督教上帝的顺服联系起来，杜奥达阐发了这样一个观点：世俗世界中的尊荣与敬重可以通过这种双重忠诚而获得。她期望儿子忠于其领主查理国王，但也强调其他忠诚同样会给纪尧姆带来尊荣：“我劝勉你，务必在与你共事之人、同侪及忠实朋友之间努力行事，使你的人生持守正道，毫无对领主不忠之耻，而以热忱行善，方式可嘉，得体合宜。”<sup class=\"fn\" data-note=\"3:24\">24</sup> 纪尧姆的任务是通过他对父亲、国王以及廷臣的忠诚与行为赢得敬重。如今与家人分离的纪尧姆，必须在宫廷的竞争环境中维护自己和家族的荣誉。杜奥达对其教诲的总结，将尊荣的施予与获取置于她认为应支配这一动荡政局世界中正直行为的训诫之中心。“因此，我的儿子纪尧姆，敬爱和尊重一切你希望其尊重你的人，无论是一人还是多人。爱、敬、扶持并尊崇所有的人，使你配得上在世事变迁之中从每个人那里获得应有的回报及其相应的尊荣。”<sup class=\"fn\" data-note=\"3:25\">25</sup></p>\n<p>杜奥达并未详述如何通过武勇赢得敬重。要探究男性尊荣与军事技艺之间的联系，我们最好求助于中世纪早期的史诗。在忠于亲族与忠于领主相冲突的情境中确定有尊严的行为道路，以及主人公面对敌人时展现的无畏勇气，是贯穿中世纪早期各种语言的诗人和听众反复萦怀的双重主题。在《瓦尔特拉里乌斯》这部可能写于九世纪末或十世纪的拉丁语史诗中，尊荣与耻辱、亲缘与领主效忠的焦虑交织在一起，生动地展现了中世纪早期男性气质的诸般律令。诗中所叙述的是传说而非史实，讲的是一位名叫瓦尔特的英雄的事迹，他与杜奥达的儿子纪尧姆一样，是阿基坦人。瓦尔特从少年成长为成人……</p>\n<p>在异国宫廷——匈奴王阿提拉的宫廷——充当人质。阿提拉还劫持了勃艮第的女继承人、瓦尔特的未婚妻希尔德贡德，以及法兰克贵族哈根，后者是代替尚在襁褓中的法兰克王子贡纳尔被送来作抵押的。三人共享阿提拉的款待，并逐渐在他的宫廷中位居显要：希尔德贡德成为匈奴王后的侍伴，瓦尔特和哈根则是阿提拉军队战功赫赫的统帅。但当贡纳尔成为法兰克国王后，哈根逃回去为他效力。较晚之后，瓦尔特和希尔德贡德也设法逃走，尽可能带走了匈奴人的财宝。要到达阿基坦，他们必须穿越贡纳尔的王国，但这位法兰克国王得知他们出现在自己的国土上，便率领一队十二名久经考验、勇猛无畏的武士出征，意图夺取瓦尔特和希尔德贡德携带的财宝。哈根被迫随同贡纳尔前往。瓦尔特据守一处狭窄的峡谷，当贡纳尔逐一派出他的十二名武士时，瓦尔特将其一一斩杀。随着贡纳尔怒火渐炽，只剩下一直拒绝与朋友为敌的哈根。哈根在这一抉择中痛苦万分，最终同意协助贡纳尔对付瓦尔特，而在最后这场二对一的决斗中，三位武士皆负重伤，却无一人丧命。</p>\n<p>在瓦尔特逐一经历这十二场单打独斗的过程中，有几条主题萦绕在诗人心中。其一是瓦尔特的英雄气概、英勇无畏和似乎无穷的力量，因为他是一个“久经沙场的勇士”，“对任何恐惧全然不为所动”。<sup class=\"fn\" data-note=\"3:26\">26</sup> 其二是当武士们接连倒下时寻求复仇的本能，尤其是为亲属之死复仇的冲动。其三是夸耀武艺与勇气的口头豪言所起的作用，以及向对手投掷的讥讽与侮辱；其四则是荣誉与男子气概的强制要求。当十二名武士尽数被杀、只剩下哈根和贡纳尔国王面对瓦尔特时，所有这些线索汇聚到了一起。</p>\n<p>在战斗开始之前，贡纳尔就曾试图通过羞辱哈根本人、他的家族，以及——言外之意——他作为一个男人的名誉，来激他出战：</p>\n<p>“正如我所见，你酷似你的父亲；\n哈加提奥胸中也藏着一颗怯懦的心，\n在冰冷的胸腔里，用许多托词回避战争。”<sup class=\"fn\" data-note=\"3:27\">27</sup></p>\n<p>但哈根并未被这些讥讽激怒，而是始终在一旁观望，只看战斗而不参与，即便当他的侄子倒在瓦尔特剑下时也是如此。然而当只剩下他们两人时，贡纳尔加紧了奚落：</p>\n<p>“这么多朋友和亲族被杀，\n你竟不羞于抛弃你的男儿本色吗？”<sup class=\"fn\" data-note=\"3:28\">28</sup></p>\n<p>其中的含义十分清楚。如果哈根不肯出战，未能为侄子和战友复仇的代价便是懦夫的耻辱。只有女人才不战斗，因而在这份耻辱中，哈根将被贬低到女人的地位。然而，</p>\n<p>哈根仍然犹豫不决，在心中反复思量\n曾无数次对瓦尔特许下的信义，他细细掂量\n事情的来龙去脉与前因后果。\n但如今那位不幸的国王愈发急切地哀求。\n在他恳切哀告的感动之下，他避开\n君主的目光，思忖自己的\n勇武名声，倘若在这件事上\n有丝毫退缩保全，名声恐将蒙污。<sup class=\"fn\" data-note=\"3:29\">29</sup></p>\n<p>在此，全诗的道德关键之处，所有相互冲突的价值观暴露无遗。哈根勉为其难地作出的决定是：男子汉的荣誉要求他维护自己作为勇武战士的名声，甘愿在追求荣耀的过程中冒生命危险。只有同意与瓦尔特交战，他才能免于耻辱、为侄子复仇、保住国王的恩宠，并保持男人的身份。归根结底，防止自己名誉崩塌这一明白无误的迫切需要，为哈根指明了必须采取的行动。</p>\n<p>991年，一队盎格鲁-撒克逊人在埃塞克斯海岸马尔登一场有明确记载的战斗中被维京人击败。首领阵亡后，一些盎格鲁-撒克逊人逃离了战场。一位同时代的古英语诗人以传统史诗价值观重述了这场败绩，强调的不是盎格鲁-撒克逊人的挫败，而是那些选择留下来战斗到底者的英雄气概：</p>\n<p>武士们昂然向前推进，\n毫无惧色的战士们蜂拥而上，\n人人渴求两件事之一：或报那杀戮之仇，\n或舍弃自己的生命。<sup class=\"fn\" data-note=\"3:30\">30</sup></p>\n<p>剥离其政治上的含混之处后，马尔登的事件提供了一个重申熟悉主题的机会——荣誉、勇气、复仇以及至死不渝的忠诚密不可分——从而提醒这个急速变迁的世界勿忘古老的价值。在现实生活中，不同于诗歌的表现，这种行为既带来了赞誉，也带来了加剧的危险。801年，阿尔昆曾为诺森布里亚贵族托特蒙德——一位“我们的朋友”——向查理曼说情。796年，诺森布里亚国王埃塞尔雷德一世遇刺身亡；阿尔昆为托特蒙德辩护，称他是“埃塞尔雷德国王的忠实仆人，一位忠诚得到证明、武艺勤勉的人，他勇敢地为主公的血复仇”。<sup class=\"fn\" data-note=\"3:31\">31</sup> 托特蒙德的复仇行为想必使他别无选择，只能逃亡国外，以躲避进一步的报复。阿尔昆显然确信，查理曼不仅会将这个身处险境的人纳入自己的保护之下，还会把他复仇的勇武视为值得嘉许的品质。</p>\n<p>一则爱尔兰的凶兆预言曾预告社会将崩解为一个“女人不知廉耻、男人毫无勇武”的世界。<sup class=\"fn\" data-note=\"3:32\">32</sup> 为了维护社会秩序，中世纪早期的男人们依据一种伦理来选择自己的行动方针，这种伦理不同于——但又补充着——施加于妇女的性贞洁约束。男性荣誉不仅是避免耻辱，它还意味着对武艺的积极追求，以及在言语和行动中不断重申男子气概。那些失败者，那些逃离战场的人，其行为“如同女人”。<sup class=\"fn\" data-note=\"3:33\">33</sup> 而且，与女性荣誉不同，它并非仅以亲属为中心，因为它要求更广泛的公众——朋友以及亲属、领主以及同侪——的认可。然而它同样最关心在他人眼中的名声，并且与言语、姿态、行动和身体紧密相连，一如女性的荣誉。此外，男性气质常常表现为夸大的自吹自擂和相互辱骂的交锋。有时，尤其在宴饮酣醉的气氛中，言语上的攻击竟成为肉体殴打乃至杀戮之前的前奏。当荣誉要求必须回敬羞辱性的侮辱、伤害或杀人之罪时，世仇的威胁便可能在地平线上隐现。</p>\n<p>撇开罗马法中个人须独自且唯一对自己的行为负责这一司法原则在地中海某些地区可能仍然可以执行这一点不论，中世纪早期的欧洲是一个世仇文化，因为世仇是一种将男子气概与复仇联系在一起的荣誉观念的体现。它同时浓缩了亲属之间的道德义务及其脆弱性；因此值得在此加以考察。必须立刻说明的是，世仇既不是一种无政府状态——无论是暂时的还是持续的——也不是一种无休止的血腥杀戮。毋宁说，它是群体之间一种潜在的、隐伏的或实际的敌对状态，在这种状态下，复仇杀戮的威胁本身反而可能有助于遏制暴力，并促成更有序的冲突解决方式。只有当流血似乎比接受体面提出的赎杀金更为荣耀时——或当明智的劝告无法遏制头脑发热的年轻人时——中世纪早期的世仇才变成血腥的报应正义。然而在大多数时候，支付赎杀金似乎正是为了化解仇杀的风险。有时土地被明确变卖以筹措支付赎杀金所需的巨款，这一事实表明，杀人者的亲属常常看到以金钱补偿来安抚死者怨愤亲属的好处。在小型共同体中——其中多数邻人可能同时也是亲属——暴力的威胁想必可怕得令人不敢设想。</p>\n<p>因此，世仇是一种管理冲突的形式。它遵循的惯例更多地嵌入于社会实践之中，而非被明确表述为行动原则。世仇既是一种心态，也是一种行为准则，只有在其他修复受损荣誉的方法失败之后，才会导致流血。书面史料很少能让我们追溯一桩仇杀的开端、经过和解决，或对更广泛的社会背景作出充分的评估，但它们确实清楚地揭示出：世仇是敌意的相互交换；而一旦血仇形成，报复的欲望便助长了它的延续，使之难以轻易化解。托特蒙德在寻求查理曼庇护时深知这一点。正因如此，仇杀可能历时短暂，也可能断断续续地爆发多年，有时甚至绵延数代。变卖家族土地以金钱了结的决定不会成为编年史或英雄史诗的素材，只在土地转让文书中得到一笔带过，而那些升级为暴力的冲突却吸引了我们的注意——一如它们吸引了中世纪早期编年史家的注意——因为它们具有非凡的叙事魅力。</p>\n<p>两起大致同时发生、却来自截然不同文化环境的事件，浓缩了荣誉、补偿与复仇的复杂性。两者都发生在公元590年前后，一起在爱尔兰西部，另一起在高卢北部。先讲康诺特人利布兰的自述：</p>\n<p>在我仍住在自己的家乡时，我杀了一个人。此后我作为罪人被戴上镣铐。但我的一位亲戚——实际上是我的直系亲族——非常富有，在紧要关头前来搭救我。他付出了使我脱罪所需的代价，尽管我身戴镣铐，他救了我这个罪人免于一死。在他买下我的获释之后，我以约束性的誓言向他承诺，我一生都将服侍他。<sup class=\"fn\" data-note=\"3:34\">34</sup></p>\n<p>利布兰犯下杀人罪，想必是自首认罪的。他被关押未在外自由活动，最大限度降低了死者亲族外出复仇杀戮的风险，但同样明显的是，利布兰无力筹措爱尔兰法律所要求的补偿及挽回颜面的偿金。因此他的性命掌握在死者亲族手中，他们可以杀死他，也可以将他卖为奴隶。利布兰被一位富有的亲族救出，表明亲族彼此对对方继续生存所抱有的关切。然而，获救的代价却是依附于自己的亲族。事实上，他违背了誓言，几天后便逃亡他乡，最后需要圣徒科伦巴的干预才找到一个既能满足利布兰所有亲族的荣誉、又能涤除利布兰因杀人及背誓而产生的负罪感的解决之道。</p>\n<p>在这个事例中，一次杀戮并未引发连锁的报复性杀戮。相反，各种导向和平解决的合力共同作用，在不大扰乱社会秩序的前提下恢复了荣誉。但在另一起事件中，最初的冒犯根本未涉及流血，却升级为一场旷日持久、手段狠毒的世仇。图尔的格雷戈里的记述值得全文引录：</p>\n<p>图尔奈的名门法兰克人之间爆发了一场争端，因为其中一人的儿子不断指责另一人的儿子——后者娶了他的姐姐——愤怒地斥责他抛弃妻子、另狎娼妓。由于被告者恶行不改，这位兄长[因姐姐受辱而生的]怒火愈燃愈烈，以至于这年轻人扑向他的姐夫，连同自己的随从一起杀死了他。随后他本人和随他前来的人也都被砍倒，双方无一人存活，只剩一个人，因为无人杀他。结果，双方的亲族彼此结下仇怨。王后弗雷德贡德一再敦促他们终止敌意、缔结和约，以免他们的争斗继续下去，酿成更大的动乱。<sup class=\"fn\" data-note=\"3:35\">35</sup></p>\n<p>在此，家族荣誉、恶言相向和头脑发热这一醉人的混合物引发了一连串的复仇杀戮，直到弗雷德贡德趁三名闹事首领酒醉时将他们斩首，才最终了结。</p>\n<p>这一事件的戏剧性使我们得以注意世仇的若干复杂性。首先，尽管直接的起因是一个女人被丈夫羞辱，这场仇杀——如同所有仇杀一样——是由男人进行的。妇女的参与至多是间接的，或如本例那样作为引发事端的缘由，或在激起自家男人采取行动方面扮演工具性角色，这一点在冰岛和爱尔兰的记载中尤为翔实。世仇是男人的事务，且由群体而非个人进行。若要实施复仇杀戮，这些群体必须临时召集。正如这个图尔奈的例子再次表明的，在世仇中表现出来的宿怨涉及同一社会网络中的男人，是彼此熟识的邻人。在图尔奈，兄长与妹夫结仇，争端迫使男人们在自家的亲属圈子里选边站队。事实上，发生在彼此有亲属关系的男人之间的世仇，与发生在两个不同亲族群体之间的世仇一样多。此外，可能被卷入世仇的亲属圈子，无论在六世纪晚期的图尔奈还是其他任何地方，都不是由社会实践或明文规则界定的。它取决于主要的争斗者劝说他人加入的成功程度，也取决于那些未直接涉入者的荣誉可能在多大程度上受到质疑。而每当有人被杀，受波及者的圈子就会重新组合。图尔奈事件中从宿怨到暴力的转变，是一个头脑发热的未婚青年所为，他能够动员一批支持者——他们并非明确意义上的亲族。在第一轮厮杀中，他和他的姐夫连同各自所有随从，除一人外全部丧命。至此，结仇者的圈子扩大了，争斗双方的其他（或更年长的？）亲族被卷入其中，暴力程度也随之升级。这一事件完全类似于其他引起中世纪早期编年史家注意的世仇：它似乎不仅涉及亲族，还涉及两位连襟的其他追随者。友谊、情谊、邻里关系或对领主的忠诚，与亲属义务一样轻易地将男人卷入世仇。但正如世仇可能使亲族彼此为敌，它也可能使誓友反目，正如瓦尔特和哈根最终被贡纳尔迫使相对。因此，世仇的爆发催生了一个群体，在这个群体中，亲属关系的强制要求可能与其他形式的联结和义务相互融合，也可能彼此冲突。</p>\n<p>最后，这场因一名妇女的荣誉被视为受辱而起的冲突表明，世仇与其他形式的社会规制——在此即王命——是并存的。把世仇视为必然与王权对立是错误的；事实上，关于世仇程序的一些最佳证据恰恰来自特别强势的国王的立法，例如西撒克森国王埃德蒙（939–946年在位）颁布的关于世仇的法令。所有中世纪早期的国王都接受世仇的原则：他们关注的是防止仇杀升级到造成严重政治动荡的地步，并通过就违反相应程序者处以罚金而为自己谋取财政利益。他们并不禁止世仇，而是试图将复仇的冲动收归己用，使之有利于王室。为此，王室立法使接受补偿和解既有利又体面。例如，罗萨里大幅提高了各类伤害的补偿数额，“以使faida，即血仇，得以……为偿金收讫后即可避免，并不得再另行索求，亦不得心怀怨恨。故此案就此了结，双方之间应保持友谊。”<sup class=\"fn\" data-note=\"3:36\">36</sup></p>\n<p>一位意志坚定的强大国王能够充分调动王室愤怒的力量，迫使敌对各方彼此和解，从而使双方的荣誉与王权同时得到提升。在王权薄弱的地方（如十世纪的法国南部），或在国王自身卷入世仇之争的地方（如十世纪的德意志），血亲复仇便成为政治运作的一个组成部分，成为在高度竞争且不稳定的环境中宣示支配地位、攫取权力的一种手段。对某些人而言，对资源、追随者、地位——亦即荣誉——的追求助长了世仇之争；而对另一些人来说，仍抱有希望，指望世仇能够削弱地方豪强的权力，重塑当地支配与臣服的现实格局。</p>\n<p>最后一句话留给法兰克国王贡特拉姆（561–592年在位），他在584年为兄弟希尔佩里克国王遇刺而哀悼时说：“若今年我不能为他复仇，我就不配被视为一个人。”<sup class=\"fn\">37</sup> 中世纪早期的国王与其他人一样，同样需要维护自己的男子气概、家族和声誉，复仇既可能是王室政策的原动力，也可能是追求个人或家族荣誉的原动力。在中世纪早期，男性置身于一种鼓励他们通过夸耀、辱骂、殴斗和杀戮来证明自己的文化之中。通过捍卫荣誉，个人宣示了自己在成年武士共同体中的位置；由此，他的声誉也为整个家族增光。反之，他的行为也可能使家族陷入与其他亲族、邻人乃至统治者的紧张关系。利害攸关如此，男性的荣誉便具有易变、好斗和复仇的特点。它必须如此：“血脉之谊”的本质，就是甘愿为家族——或许还有领主——献出生命。没有亲族，一个人便无人协助捍卫自己的荣誉；没有荣誉，他便缺乏男子气概；没有男子气概，他便没有社会存在。</p>\n<p>在最基本的层面上，亲缘关系关乎父母与子女、丈夫与妻子，关乎这些根本的人际结合所带来的亲昵、紧张、仇恨与义务。然而，它的意义远不止于此。正如本章反复表明的，把亲缘关系作为一种亲缘纽带（affinity）形式加以讨论，实际上就是在讨论从地方到帝国各个层面的政治。这种契合使我们得以避免把中世纪早期的亲缘关系简单地归入“社会史”的 pigeonhole，而是让我们认识到，它是权力得以分配和争夺、社会控制得以维持或挑战、合法性得以主张和确立的根本方式之一。</p>\n<p>显赫的祖先提供了一种极具说服力的合法性言说。亲属之间的关系提供了身份认同、支持和法律地位。在精英阶层中，防止荣誉流失并加以增进的冲动，支配着他们与朋友和亲戚、领主和邻人的一切交往。归根结底，所有这些都是政治与权力的问题，无论国王是否直接参与其中。</p>\n<p>然而，自始至终我们都没有给出中世纪早期亲缘关系的简单定义，这是有充分理由的。在命名、“血脉之谊”、荣誉或世仇等事务上，并没有一成不变的规则。毋宁说，亲缘关系是特定文化群体的惯例、当时的形势压力以及个人策略和选择的习惯性混合体。它是一种可供利用的资源，一种有待确认的身份，一种需要遵循的习俗，一种可以挑战的规范。它的具体意义取决于具体的语境。</p>\n<p>其社会实践既非千篇一律，也非一成不变。在罗马法延续的地中海地区，个人没有向亲族寻求支持的正式权利。他们唯一被认可的求助途径是司法体系，而这一体系让个人独自面对国家的强制力、孤立无援——但这并不能阻止人们以自己偏好的任何手段，无论是和平的还是暴力的，去追求个人和家族的利益。在其他地方，习惯法则设想由亲缘关系来承担罗马国家昔日曾专擅的部分职能，特别是在约束群体成员行为方面，以及提供解决怨愤与争端的手段方面。在阿尔卑斯山以北和盎格鲁-撒克逊英格兰，亲缘纽带有时与王权和正式的法律程序相竞争，有时又与之相辅相成：在这里，贵族亲缘关系与王权处于一种不稳定的均衡之中，这种均衡既可能造就像查理曼那样权力非凡的统治者，也可能为巩固埃塞尔斯坦或奥托一世的权威的努力设置强大的障碍。在讲凯尔特语的地区，那里几乎没有或完全没有罗马遗产的直接传承，没有日耳曼人定居的贡献，也没有稳定、强大、疆域辽阔的君主政体，紧密亲缘关系的自我约束压力——很可能又因比邻而居而得到强化——提供了有序生活所需的大部分凝聚力。</p>\n<p>有人有时主张，王权在中世纪早期的成长，是通过攻击和削弱亲缘纽带而实现的。这种尖锐的对立是站不住脚的，因为亲缘纽带是中世纪早期所有不同文化在一切社会层面上的根本要素：它们从来不是强大王政的对立面。毋宁说，最成功的统治者通常是那些能够化解自己近亲之间的紧张关系、笼络广泛亲属圈子的支持，并把亲缘关系的一切策略转化为自身优势的人。一个有效的国王，就是懂得如何把自己的亲属变成朋友的人。</p>", "text": "幸福时光里，一个人的近亲会喜爱他；然而每个人终将彼此分离，因为主的旨意是要把这可怜的躯体交付尘土。1\n凡自然所结合之物，皆宜和谐相处——正是自然将亲属之间的友爱联结起来。2\n诚然，在任何共同体中，一个人的亲属喜爱他，便是幸福时光；但正如一位匿名的盎格鲁-撒克逊诗人所认识到的，死亡会割断并重构家庭关系。同样，亲属之间的情感，尤其是他们彼此间的友谊，或许是合宜的，但现实很少符合所谓“自然的”神话，因为尽管父母与子女、兄弟与姐妹、叔伯与侄甥之间的纽带是人类任何社会中最为有力的联系之一，它们也可能是最令人忧虑的关系之一。因此，探究亲属关系在中世纪早期的意义，就是考察男女构建人际关系、对其社会世界作出选择、表达情感与理想的最重要途径之一。对这些纽带的思考也能阐明个人身份、亲缘形式以及根深蒂固的思维习惯。\n本章贯穿三个主题：亲属关系在当地多变的社会形式与文化表达；它们作为宣示——或争夺——权力与权威的普遍框架；以及血缘亲缘与友谊亲缘之间的平衡。每一节探讨不同的侧面。第一节运用命名模式、宗教追思方式以及谱系记录，论证家庭传统有助于构建个体的社会身份意识，并强调父系传统往往优先于母系传统的倾向。第二节转向男女原则上可以期望从亲属处获得支持的种种情境，但同时指出，在实践中，在给予与获取帮助方面，友谊纽带至少与家庭纽带同等重要。最后一部分探讨男女各自不同的荣誉行为规范，论证女性规范比男性规范更加植根于家庭关系。这三节都摒弃将亲属关系作为一种社会过程的运作方式加以笼统假设的做法，而是强调个人选择与具体情境以及更广泛的权力关系的重要性。\n然而，我们必须一开始就意识到，“亲属关系”有两种不同但并非无关的含义：其一，是个人与以血缘——即共同的血统——界定的群体的隶属关系；其二，是通过婚姻或其他结合策略在血亲群体之间建立的联盟。在中世纪早期，两者都很重要。此外，我们必须注意，这些亲缘关系既可客观界定，也可主观界定——一方面是依据明确陈述的社会规则被认为与某人有亲属关系的人；另一方面则是个人在特定时刻选择承认为亲属的人。正如将变得显而易见的那样，中世纪早期的男女两者兼用，且往往出于不同目的。研究中世纪早期社会的大部分困难，正源于后一类人通常比前一类人更为重要这一事实。\n由此可见，“亲属关系”显然是一种社会建构的相互关系，而非单纯由生物因素决定的关系。这一事实在“谁是你的亲属”这一问题之外的若干层面上同样成立。收养在罗马法下十分常见，但在除爱尔兰之外的其他中世纪早期文化中并不存在，它是生身父亲与法律上承认的父亲身份不相吻合的一个尤为明显的例证。寄养——在中世纪早期的威尔士、爱尔兰和斯堪的纳维亚尤为重要——创造了另一种“人为的”亲属关系：男孩与抚养他长大的成年人之间的情感纽带，并不与他同父母的关系相吻合，而他日后正是从后者继承财产、法定权利与义务。基督教逐渐高度重视在洗礼中所创造的精神亲属关系，即教父母与教子之间、以及孩子的生身父母与精神父母之间的关系。教会认为前一种纽带与孩子同生身父母的纽带一样牢固；而后一种——“共同父母”之间的关系——则被视为等同于亲兄弟姐妹之间的关系。可见，“自然”对中世纪早期的“亲属关系”贡献相对有限，这种关系实际上远比初看之下更为复杂和灵活。\n现存史料的性质妨碍了我们充分领会所有这些细微差别。法学家与立法者关注财产、暴力以及对无自卫能力者的保护，因而对亲属之间的互动远比对朋友之间的互动更感兴趣。尽管关于亲属事务的丰富指导得以留存——或由国王颁布，或汇编于法学家的法典之中——但无论在地理上还是年代上，其分布都不均匀。尽管如此，对于某些地区和时期，如六世纪的高卢、七世纪的爱尔兰或十世纪的韦塞克斯，这些史料使我们得以构建一个关于亲属关系（以及社会关系的其他形式）在理想状态下应如何运作的概略模型。然而，要超越规范与期望、深入社会习俗与惯例，则需要截然不同的文本记录。文献形式的证据往往是轶事性的，只能提供一幅宏大图景中的狭窄一瞥。其他史料或是经过戏剧化处理、对貌似可信却非历史情境的诗歌式追忆，或是浸透着作者偏见与狭隘认知的教士谩骂——这些独身精英被训练得蔑视家庭与性爱的一切方面。朋友与亲属之间互动的历史现实极难确切把握，尤其因为即便我们能够把握这种现实，通常也仅限于社会上层——地方权贵、贵族、王室——而对农民则几乎完全无从知晓。\n我们可以以七八世纪的伦巴第意大利为例，说明其中的某些困难。涉及家庭互动的王室立法大量留存，其中最著名的是国王罗塔里（Rothari，636—652年在位）于643年颁布的《敕令》。在就自由伦巴第人事务中国王深切关注的问题立法时——如财产继承、订婚与婚姻的正当程序，或指控谋害亲属——罗塔里的法律条条都以与当事人之间的关系来表述：父亲、母亲、继母、兄弟、姐妹、叔伯、堂表亲、侄甥均有提及。法律还频繁提及其他“近亲”，却未具体指明这些人的身份。因此，正如立法者所设想的那样，伦巴第人的亲属关系不仅以个人为参照点，而且顾及具体情境的需要。然而有时，远得多的亲缘关系也可能至关重要，尤其是在涉及财产继承之时。罗塔里颁布法令规定，凡主张财产权利者，必须能够说出七代以内所有祖先的名字，并且必须提供愿在王室法庭法官面前就其亲缘关系的确切性质起誓的亲属。因此，在确保土地仅由能证明有血缘请求权者继承这一至关重要的事务上，伦巴第法将“亲属”界定为一个七代的世系群体。有多少伦巴第人能够说出自己七代以内的世系，追溯到从同一位高祖之父（远至第六代祖先）传下来的亲族，而且——至关重要的是——使自己的说法与亲属们的故事相一致呢？可见，在主张土地所有权时，法律理论将权利界限定在七代之内，尽管有记载的法庭案例表明，亲属关系的主张在实践中可能以截然不同的方式运作。\n罗塔里的《敕令》清楚地表明，在同一个共同体中，多重亲属观念可以依据情境与目的同时发挥作用。伦巴第意大利并非孤例：对中世纪早期的所有文化都可以得出类似的结论。但我们不妨暂时停留在伦巴第法律上，因为它例证了另一个一般性观点。罗塔里假定自由伦巴第人居住在包括家内奴隶和半自由的男女以及自由成员在内的家庭之中。国王虽然当然设想这些家庭可能以丈夫、妻子及其子女为核心，但他的法律也将其他家庭模式视为理所当然。例如，一个家庭可能由一个兄弟、他守寡的姐妹以及若干未婚姐妹组成，此外还有奴隶和其他依附者。它也可能是一群兄弟在父亲死后继续同住于父亲家中，或者是父亲与孙子们——已故儿子的儿子们——也可能是父亲与尚未成家的儿子。罗塔里提及的另一种组合是父亲、前妻所生的子女以及他们的继母。最后这种模式可能尤为常见：鉴于我们对中世纪早期死亡率的认识，许多儿童很可能是在缺少生身父母一方或双方的家庭中长大的。\n简而言之，罗塔里的《敕令》清楚地表明，中世纪的主要社会单位并非核心家庭，而是家庭户。现代思维将同住户居的世系群体视为一个由父母和子女构成的独立社会单元，偶尔加上第三代的近亲（祖父母）或旁系亲属（例如一个兄弟及其妻子和子女）。但这种思维方式只是从十八世纪起才成为习惯。中世纪的词汇familia最贴切的译法是“家庭户”，而且没有任何术语与现代的“核心家庭”相对应。尽管在实践中一个familia通常以夫妻单元为核心，但这个词及其社会群体都涵盖了仆役、依附者，有时还包括其他近亲。其确切成员是流动不定的：年长者死去，守寡的姐妹回到娘家亲族那里，养子来而复去，或者新购入奴隶、依附者被重新调往别处任职。因此在实践中，一个familia包括任何一个时期处于男性家长权威之下并在其产业上居住的所有人——即便不住在他本人的宅邸，也住在他的地产上的其他地方。\n只要我们考察中世纪早期男女老幼的居住模式，就清楚我们必须以家庭户而非核心家庭来思考。即便是王室宫廷也不过是放大了的家庭户。想想查理曼那异常庞大的帝国。其家庭与政治中心是当时的王后或宠妾，他的女儿们（但不含儿子们，因为儿子们度过幼年后便被送往远离父母宫廷的地方去治理副王国），晚年时还有若干孙辈，以及一大批官员、家仆、管事、教士、文书、猎手、厨师，以及维持如此庞大的家庭户和治理庞大帝国所必需的其他人等。而在另一端，中世纪早期的农民也生活在家庭户中，通常与妻子以及或许若干子女同住，有时还包括奴隶或其他半自由的依附者。如果他们是大地产上的佃户，其家庭户甚至可能包括领主或其管家拨给他们的大批或年老的农奴。\n因此，现代人对“家庭”一词含义的假设并不容易套用于中世纪；以下各页使用“家庭”一词，仅作为一个宽泛而定义模糊的简称，指个人承认为与之共享血统、祖先、抚养关系或婚姻关系的所有人。\n尽管“家庭”在“爸爸、妈妈和孩子”的意义上并非一个被承认的社会单位，但这
