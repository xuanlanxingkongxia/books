一群体在所有社会层面上，无论就情感还是法律而言，都构成了大多数家庭户的核心。在这一狭小的群体之内，孩子们在母爱与父权塑造的环境中成长，因为男性家长对其依附者所享有的权利，与家庭生活复杂的情感现实相互交织。中世纪早期的史料展现了一个父母、子女与兄弟姐妹之间情感强烈的世界——一个为平安健康的分娩而欢喜、为孩子的夭折而悲痛的世界，一个充满夫妻恩爱、母亲对踏上自己人生道路的成年儿子安康的牵挂、兄弟间的帮助与友谊的世界。同样，这些史料也表明，同样强烈的失望、竞争与嫉妒，可能导致父母遗弃残疾的婴儿、丈夫抛弃妻子、兄弟之间结仇争斗，或儿子弑父。那时与现在一样，父母、子女、兄弟、姐妹、叔伯、姑姨是亲属，却不一定是朋友。\n身份\n……“或者你出身何种世系？\n只需说出一位，其余的我便都知道；\n年轻人，所有王国的各个族系我都了如指掌。”3\n在这部九世纪的叙事诗中，英雄希尔德布兰德（Hildebrand）如此向他的年轻对手发难。他表达了一种普遍的情感，因为在中世纪早期，除了像比德或拉巴努斯·毛鲁斯（Hrabanus Maurus）那样在幼年即被送入修道院的人之外，所有人终生都与社会身份紧密地同亲属联系在一起。既然社会人的塑造始于父母为新生儿取名之时，对亲属关系意义的探究就应当从命名开始。影响中世纪早期命名的习俗与偏好因时代和地区而异，但其大致轮廓相当清楚。当然没有必须遵循的硬性规则；相反，父母的决定往往反映了根深蒂固的文化习惯。除了某些王室婴儿的命名——其名字具有至关重要的政治意义——之外，我们通常无法确切得知父母为何选择某个特定的名字。尽管如此，显而易见的是，为婴儿取名赋予了新生儿一种身份，使其置身于一个亲属圈子之中，甚至可能预示着这个孩子未来将成为教士，或将成为祖传土地的继承人。另一种较为罕见但确实被采用的策略，尤其在爱尔兰和苏格兰，是以某位特定的圣人或宗教庇护者为孩子命名。\n亲属关系与命名之间的紧密关联值得特别关注。在帝国早期（公元一至二世纪），正式的罗马命名程序使用三个名字来标明每个公民属于特定父系氏族——即一种由父亲而非母亲向后代传递成员资格与身份的世系群体——中的一个分支。为应对社会与政治变迁，更为灵活的用法到四世纪已取代了这些僵化的惯例，使名字不仅能够标示社会等级，而且至少在精英阶层中还能标示母系与父系两方面的世系。在罗马帝国晚期的西部，四、五、六世纪的贵族通常拥有两个、三个甚至更多的名字，其选取旨在传达对显赫祖先的自豪感以及对近亲的强烈身份认同。六世纪史家、图尔主教（573—594年在任）格里高利正是这些做法的典型。他的全名是格奥尔吉乌斯·弗洛伦提乌斯·格里高利乌斯（Georgius Florentius Gregorius），父系与母系双方都是富有而有势力的高卢贵族的后裔。他的名，乔治乌斯，是他祖父的名字（卒于502/6年），此人几乎可以肯定是五世纪高卢最富有、最显赫的贵族世系之一的成员。第二个名字取自他的父亲，而第三个名字——他选择以此为人所知——则是他外祖父的名字。图尔的格列高利以这位母系亲属的名字行世，绝非巧合。\n第3章所涉主要地点\n格雷戈里乌斯·阿塔卢斯曾任欧坦伯爵，506年成为朗格勒主教；他卒于539年，距其曾孙出生不过一年或至多十八个月，死后立即被尊为圣人。图尔的格列高利通过自己的名字回溯母系三代之前的一位圣徒祖先，以此强调自己的血统、与圣徒的亲近，以及他对母系一方的认同强于对父系亲族的认同。\n图尔的格列高利的多个名字表明，父母可以通过为孩子取名来确定其在家族中的位置。但这也代表了一种日渐衰微的传统，因为即便人们仍自视为“罗马人”，到格列高利的时代，单一名字已渐成习俗，至七世纪末，即使在拜占庭世界也已普遍化。然而，古老罗马精英家族中命名习惯的改变，只是我们这一时期开端时名字与身份之间关系的若干重要变化之一。五世纪间，罗马统治结构的解体以及新兴王国围绕日耳曼语精英的凝聚，凸显了所有日耳曼语言共有的独特命名模式。然而，这两个名字库并未长久地保持分离。在六世纪的高卢，名字反映了旧精英对新政治环境的适应，因为一些罗马血统的个人放弃了传统的命名习惯，转而采用其新法兰克主人的命名方式；相比之下，在西班牙和意大利，哥特人和伦巴德人有时也为自己的后代选取罗马名字。当取罗马名字的父母为孩子起日耳曼名字时（反之亦然），他们是在就文化威望和社会身份做出地方性的决定——这些决定完全出于融入统治群体的愿望，与口头语言毫无关系。\n值得稍作停顿，考察一下日耳曼语言中名字是如何构成的。因为尽管“名字将新生儿与其祖先和亲族联系起来”这一惯例，在日耳曼语社群及其后裔中与在罗马人中间同样根深蒂固，但其中起作用的却是不同的语言和社会原则。日耳曼名字（非王室与王室皆然）通常由两个成分构成：词根和后缀。二者以各种方式传承和重新组合，并借此标示血统、族群属性和社会身份。其中一些成分见于所有日耳曼语言，但另一些为某一语言所特有的成分则成为备受重视的族群身份标志。\n我们这一时期末尾的一个例子既说明了日耳曼名字的构成方式，也说明了一个名字可能承载的复杂意涵。约1008年，一对富裕的盎格鲁—撒克逊夫妇——教士埃塞尔斯坦及其妻武尔夫吉芙——生下一个儿子，可能是他们的第一个孩子。这个孩子后来成为主教和圣徒，其传记作者记载道：“他被命名为武尔夫斯坦，前半部分取自母亲之名，后半部分取自父亲之名。这孩子有美好的前程，为他取名于双亲的兆头同样美好，因为他注定要将双双方的圣洁汇于一身，或许还将超越之，无可比拟。”4 这一对未来圣德的预兆强调了父母名字的成分如何被用来构成新名字，但这个孩子似乎也是以其舅父——约克大主教那位名人——命名的。这个名字大概预示了年幼的武尔夫斯坦将走上教会生涯。在为未来主教的两个弟弟取名时，埃塞尔斯坦和武尔夫吉芙再次标示了孩子们的父系出身——为他们取名埃尔夫斯坦和比尔克斯坦——但选取了其他成分来与父系后缀-stan组合。这些关于孩子名字的决定，可概括为围绕共同家族主题而自由选择的变体。\n年幼的武尔夫斯坦确实成为了主教（伍斯特主教，1062–95年在任）。他的名字例证了名字成分如何被重新组合成一个新名字，同时又把孩子与父母联系起来；它也强调名字成分是双向传承的——换言之，它们可以同样轻易地取自母亲或母系亲属，正如取自父亲或父系亲属。尽管如此，凡在保存下来的名字样本足以进行统计分析之处，都清楚地表明，父母通常更愿意将孩子与其父系而非母系亲族联系起来。诚然，在加洛林帝国的贵族中，几乎所有孩子都以近亲（父母、叔伯姑姨、祖父母）命名，但可证实以母系亲属之名为名者不足五分之一。法兰克人的命名习惯并非完全排斥其他名字，但偏好近亲之名，而在近亲范围内，又更常标示父系而非母系关联。只有当母系世系拥有更显赫的祖先时，父母才倾向于选取将孩子与其母系亲族联系起来的名字。\n到未来的伍斯特主教武尔夫斯坦出生之时，通过变换两个成分来创造名字的习俗已显陈旧。六世纪时，欧洲大陆的统治王朝已开始通过完整重复某位已故亲属的全名而非变换名字成分来为后代命名。这一习俗逐渐从国王传播到贵族，至十世纪末，越过英吉利海峡，开始影响盎格鲁—撒克逊的命名惯例。到约1000年，大陆精英普遍使用一个有限的名字库来标识家族成员，且对名字父系传承的强调愈发突出。当“卡佩”于格在旧加洛林统治王朝覆灭后于987年在法国加冕为王时，他继承的名字清楚地标识了他作为至少自九世纪中叶以来就在法国声名显赫的顶尖贵族家族之一的成员身份。他的男性祖先都名为于格、罗贝尔或厄德；其姊妹通常名为埃玛或阿德拉。到千年之交，名字仍是身份的标志，因为父母继续选取将后代与近亲和直系祖先联系起来的名字。但名字将孩子与父系亲属——而非母系亲属——联系起来的程度，更甚于以往。\n如果说在孩子出生时命名将新生儿置于一个狭窄的家族圈子之内——扩展至堂表兄弟姊妹、祖父母，偶尔还有曾祖父母——那么死亡则为亲缘关系和社会身份的模式注入了新的因素。在八世纪及以后的基督教社群中，对灵魂来世福祉的关注促使许多人在修道院名册上登记其生者与死者的亲属之名，为他们请求代祷。这样的祈祷将生者与死者联结于一个礼仪共同体之中，通过在生者中间呼唤死者之名来召唤他们的临在。在法国、德意志和英格兰的数座九、十世纪修道院中登记的大规模名单留存至今，为我们考察个人与亲族关联的方式提供了另一重视角。德意志国王捕鸟者亨利（919–36年在位）即为典型：932年，他请求圣加仑修道院为他本人、他的妻子、他们的三子二女，以及其中一个女儿的丈夫、他妻子的父母及其三个姊妹祈祷。亨利对亲族灵魂福祉的关怀涵盖了三代人，并超出自己的妻子和子女之外，扩展到通过各种婚姻与他产生关联的人。在宗教纪念的语境下，“家庭”超出了个人的出生家庭以及他或她所属的婚姻单元，囊括了一个宽泛但仍具选择性的亲属群体。由于所关涉的是灵魂在来世的命运而非土地或世俗职位的传承，这种亲缘形式毫不迟疑地承认女性——母亲、妻子、女儿——享有与男性同等的地位。\n在获取宗教纪念和为孩子命名的过程中，关于亲族纽带的观念各有不同。二者最重要的共同特征，一是承认亲缘关系涵盖两三代人，至多四代；二是接受女性有时可能对家族身份的界定做出重要贡献。这两个特征在个人利用亲缘关联建构社会身份的第三种主要方式——世系谱——中均不成立。世系谱是以《圣经》先例为范本的血统陈述。它们通常采取“X是Y之子，Y是Z之子”的形式，且与本章迄今讨论的大多数史料不同，它们照亮了不列颠群岛——尤其是威尔士和爱尔兰——的文化。大陆上留存下来若干王室的世系谱，但十世纪末之前没有一部追溯非王室人物的祖先；相比之下，在爱尔兰，自八至十世纪留存下来的数以千计的世系谱，不仅涉及国王，也涉及基督教圣徒和贵族。这些世系谱呈现了一种纵向的亲缘形式（可以延伸自数代至三十余代不等），几乎毫无例外地完全是男性的，并且全然无视兄弟姊妹或旁系亲属。\n尽管许多此类世系谱中的某些部分所宣称的亲属关系可被证明在历史上属实，但它们更重要的是其所做出的文化和政治宣示。在所有中世纪早期社会中，对世俗权力、财富和地位的主张在很大程度上依赖于血统：世系谱使这些主张合法化。所呈现的亲族纽带是那些具有直接政治意义的纽带，因而只要政治需要，便可能被重塑和重排。这种操纵可能涉及对世系长度及其旁系分支的删削或增补。加洛林王朝（751–987）不仅将自己挂靠到其最终取代的墨洛温王朝（约480–751）之上，还通过一部世系谱将罗马的过去纳入自己的祖先谱系，宣称其圣徒化（且有史可考）的创始人梅斯的阿尔努夫（卒于约643年）是（虚构的）墨洛温公主布莉希尔德与其（同样虚构的）被尊为罗马元老的丈夫安斯贝尔特的外孙。其中有两点值得注意。其一，一位虚构的女性构成了这部原本纯男性的血统陈述中的关键环节。刻意省略王朝在现实中借以确立地位的有史可考的女性，确认了女性被排除在正式权威之外；而纳入一位神话中的女性祖先，却又承认了女性对王朝延续和家族记忆传承的根本贡献。其二，在准确的人类记忆所能及的范围之外，七、八世纪的历史事实渐次融入了创造性的意识形态乐观主义，并借助文本传承的关于遥远罗马过去的知识而得以强化。以任何最适合时机的方式操纵世系谱陈述的政治动机清晰可见。不过，作为一种利用过去宣示当代政治主张的方式，这部加洛林世系谱还算是相对克制的。在爱尔兰，强调世系古老悠长的需要，导致欧莱恩人与达尔·菲亚塔赫人的共同祖先被命名为“极老之子老者、极强之子强者”。5 至此，我们达到了生物虚构服务于政治合法性的顶峰。\n世系谱表明，亲缘关系既可以关乎基因意义上的父母血统，也可以同样关乎社会建构的关系——以生物血统的虚构和神话祖先的形式表达出来。而且，它们比任何其他东西都更清楚地表达了所有中世纪早期文化的父系倾向：被删削为一连串强者相继传承的赤裸陈述后，它们强调唯一重要的是从“父”到“子”的延续。但这些男性规范运作于一个从未有过单一、稳定的亲缘观念的世界之中。命名习俗和纪念仪式提醒我们，在这些情境下，被承认为亲族的包括男系和女系双方的近亲属圈子。实际上，亲缘关系在不同情境下意味着不同的东西。\n血缘之友\n现在是时候转向亲缘关系的更广泛意涵了，因为种类繁多的史料——法律的、文献的、叙事的、诗歌的、圣徒传的——都证实，与亲属的交往通常具有重大的社会和政治意义。这些史料还坚称，亲缘关系无法与友谊相剥离。然而，这些亲缘纽带的实际表现形式极为多样，其成因有助于解释亲属——以及朋友——在彼此生活中可能扮演的众多角色。\n中世纪早期欧洲文化异质性的一个表现，便是多元社会规范的并存。我们在这方面的许多具体认识来源于法律记录，其内容与文本形式和权威来源一样纷繁多样。大体而言，可以辨认出三种法律文化，它们对亲缘关系的期待大相径庭。\n社会关系，包括亲属之间的关系。在地中海欧洲，只要人口的延续和行政的延续使人们得以继续自视为罗曼人（Romani），晚罗马帝国的法典编纂便仍然有效。在北方，讲日耳曼语的移民带来了他们自己的社会习俗，这些习俗自六世纪起开始采取规范性的成文形式。这两种法律文化之间并没有泾渭分明的界限，因为后帝国时代的诸王所颁布的所有法典，都或多或少地透露出罗马法的影响，这一点在那些源于罗马势力持久存在的较南部地区的法典中尤为明显，特别是勃艮第、伦巴德和伊比利亚哥特诸王国。第三种法律文化——即濒临大西洋欧洲的操凯尔特语地区的法律文化——在形式和内容上都远不易受罗马影响，因为在那里，罗马的直接影响是有限的或根本不存在的。这三种传统各自对亲属关系的社会意涵提出了不同的看法。\n需要说明的是，法律始终只能以间接且高度图式化的方式反映社会现实，就此而言，可以说每一种法律文化都大致对应于一种独特的社会组织形式。正如公元五世纪所编纂的那样，罗马法极为关注婚姻的规范以及确认男性家长对妻子和子女的权威；但它明确否定了成年男性的法律身份与其亲属相关联的任何观念。与此相反，世俗的爱尔兰法律论著清楚地表明，亲族集团是最基本的社会组织形式；这些论著对规范和程序的规定如此详尽，以至于可以对亲属之间理想的互动方式进行精细的重构。6 晚罗马法和爱尔兰法对于亲属在彼此生活中应扮演之角色的预期都清晰可见。然而，在这两个极端之间，关于日耳曼语社会中亲属关系之意义的讨论却众说纷纭。\n十九世纪的历史学家构建了关于早期日耳曼社会（一至七世纪）的宏大体系，将其组织为作为政治实体、维持和平与司法机构、征兵单位和聚居群体而运作的大型氏族。他们赋予这些亲族集团（通常以德语术语 Sippe 称之）以宪制上的重要性，并将其置于欧洲社会从氏族到核心家庭、从部落到国家——换言之，从“原始”到“文明”——的进化论进程中的显要位置。这一文化进步的范式早已崩溃，但关于早期日耳曼民族社会组织形式的这一基本观念却瓦解得较为迟缓：它同样必须被彻底抛弃。取而代之的应当是个体：每个人都拥有一张只与其同父母兄弟姐妹共享的血亲关系之网，以及因婚姻而与姻亲发生的一系列略有不同的互动。\n在实践中，亲族从未作为一个持久的群体而存在。毋宁说，他们处处以一类人的形式存在，是一张潜在的亲和关系之网，随各个具体情境的需要而被激活和动员。婚姻习俗与继承策略这两个方面将留待下一章讨论。在此，我们将利用诗歌、文书和法律证据，来强调亲属关系在其他一系列情境中所固有的模糊性与不确定性。\n现存于约公元1000年的一份抄本中、但起源可能要早得多的古英语史诗《贝奥武甫》（Beowulf），其故事背景设定在神话般的斯堪的纳维亚过去。然而，它的理想和价值观与其盎格鲁-撒克逊听众产生了共鸣，并在中世纪早期西方其他地区的方言诗歌中——例如爱尔兰、威尔士和德意志——也有密切的类似之处。《贝奥武甫》的戏剧张力很大程度上来自亲属之间理论上的义务与实际上的不可靠之间的冲突。虽然“对于一个思想正直的人，亲属的纽带|无论如何都不可割断”，但诗人也十分清楚，终有一天“血仇将再度掀起|誓约亲族间的刀剑之恨”。7 要洞察亲属之间义务与敌意之间的紧张关系如何上演，我们可以求助于法兰克的《萨利克法典汇编》（Pactus Legis Salicae）。此书大约编纂于克洛维在位期间（约481–511年），是为居住在莱茵河三角洲与卢瓦尔河之间、但其文化尚未过度受罗马规范和法律程序影响的法兰克人所编纂的一部习惯程序与王室法令汇编。《汇编》清楚地表明，亲属应当在多种方面相互提供支持。如果一个人需要以宣誓来确立自己的身份，或证明自己的无偿还能力，他就必须找到与他共同宣誓的人：这些“宣誓助誓人”从他的男性亲属中招募。此外，如果有人被杀，凶手必须为所夺的生命支付金钱赔偿，否则就要冒血亲复仇（本章最后一节将讨论）的风险，而赔偿金要在死者的子女以及父方和母方的亲属之间分配。反之，如果凶手本人无力筹足全部款项，其亲属就必须帮助：首先是他的父亲和兄弟，若义务仍无法履行，则是他的母方和父方亲属。\n这里涉及的是哪些亲属？当然有子女和父母——这个紧密团结的婚姻家庭群体，对身份、继承乃至生存都至关重要。除此之外，法律并未明言，只是笼统地提到父方和母方的“亲属”。因此，任何个体都与父母和子女处于特别紧密的关系之中，但也不得不进行协商，以便从更广泛的、双向的亲属圈子中获取所需的任何支持。这个圈子的构成不太可能一成不变，因为死亡会夺走父母和叔伯，而婚姻则在个体生命的不同阶段引入姻亲。此外，《萨利克法典汇编》设想个人可以正式切断亲属纽带，并概述了实现这一点的办法：\n凡欲脱离其亲族者，应前往法庭，在郡官（thuningus）或百户官面前，在其头上折断四根桤木棍，将其分作四束掷向法庭的四角，并当场声明他脱离他们的宣誓相助，脱离他们的继承，以及与他们的一切亲缘关系。8\n凡经此程序者，即免除了为亲属提供现金（或以土地和牲畜折算的等价物）、宣誓或其他任何支持的义务，但也会发现此后既无援助亦无继承可得；此人将孤身一人、毫无助力地面对世界。由此证据可见，法兰克的亲属关系并非在特定人群之间的一种凝聚性纽带，使他们在一切情况下都作为一个群体运作。毋宁说，在直接的亲子关系之外，它是一张由潜在支持者构成的、界限不明的网络，需要在需要时加以说服而付诸行动。在其最惨淡的一面，它是一张由不受欢迎的义务和社会尴尬构成的网，需要周旋应对，甚至在万不得已时予以拒绝。\n在危难之时，其他潜在的支持者可能是一个人的邻人、领主以及其家内（familia）中的依附者。由于这些人中有些很可能与他有亲缘关系，亲属关系常常与其他高度地方化的关系相互重叠并彼此强化。因此，在危机中可以指望挺身而出的人，都是这一困顿个体的“朋友”，而史料中不加区分地提及“朋友与亲属”的频率之高，令人瞩目。事实上，在盎格鲁-撒克逊英格兰，这种区分有时完全消失，因为在众多意为“亲族”的古英语词汇中，最常用的一个——尤其在法律法令中——是 freond，即现代英语\"friend\"一词的直接来源。真正要紧的亲属关系，不是精确谱系关系的技术性细节，而是在实践中能够发挥作用的亲属关系。正如十一世纪末梅斯主教狄奥德里克（963–984年在位）的传记作者所断言：“没有善意，亲缘只是一句空话；而友谊与善意密不可分”。9 用马克·布洛赫的难忘说法，可以依靠的亲属是“血脉上的朋友”。10\n与带有“自然”关系光环的亲属关系不同，友谊完全是社会建构的。正如第五章将要论证的，中世纪早期的社会关系主要以等级方式组织；友谊则提供了横向的团结纽带，缓和了支配与服从的严酷轮廓。《贝奥武甫》的诗人也深知这一点；他让丹麦国王赫罗斯加如此描述他被害的朋友艾什赫尔：\n“他是我最亲近的谋士，我心事的守护者，\n当我们为性命搏杀、步卒队伍轰然相撞、\n枪矛如雨点般落在野猪纹盾上时，他伫立在我的肩旁。\n凡出身尊贵、德才兼备者，\n都应如艾什赫尔一般！”11\n因此，在中世纪早期，朋友是那些在需要时相互提供忠告和支持、表明忠诚并以适当行动——甚至在战斗中——予以践行的人。他们可能是邻人、姻亲、同侪群体的成员，甚至是亲属。尤其在精英阶层中，友谊可能带来巨大的社会利益，而失去友谊则后果最为严重。赫罗斯加的王厅鹿厅曾经历过欢乐时光，而《贝奥武甫》记述了其终结；正如诗人所预言的，友谊并不比亲属关系更可靠：\n鹿厅的地板上\n满是朋友：那时虚假\n在丹麦人的交往中还无处容身。12\n亲属间的友谊可能具有相当的政治重要性，其后果无法与权力和权威的形式相割裂。这里可以指出两个极端。一方面，五至六世纪的爱尔兰拥有数百个小领地和小王国，其统治者只有有限的行政影响力。在这里，古爱尔兰语的 fine 一词兼有“亲族”和“朋友”之意，亲属的忠诚往往强化领主忠诚，两者共同促进了社会凝聚与秩序。另一方面，在王权强健且大体有效的地区，如加洛林时代的法兰克亚以及到十世纪的盎格鲁-撒克逊英格兰，亲属间的相互支持可能有损于国王所期望的法律与秩序。英格兰国王埃塞尔斯坦只是几位为罪犯所困扰的统治者之一，这些罪犯的亲属保护他们使其免受王室司法的严惩。他面对的难题是盗贼受到“如此强大、如此庞大”的亲族庇护，以致王室官吏无力触及。显然，地方豪强通过将盗牛贼之流收编入自己的扈从和家内，来强化对地方的掌控；埃塞尔斯坦的解决办法是授权由武装人员组成的骑马队去威慑并摧毁这些以亲族为基础的地方保护网。13\n同样地，亲属之间友谊的破裂可能产生严重的政治后果，尤其当裂痕出现在统治家族内部时。德意志皇帝亨利二世于1024年去世，未留子嗣或其他指定的继承人。德意志精英成员相互协商，数周后商定有两名最合适的王位候选人，两人都叫康拉德，且是堂兄弟。在两人之间紧张的讨价还价中，年长的康拉德——他最终获胜并如期加冕为康拉德二世（1024–1039年在位）——据说曾对其亲族言道：“凡是自然所结合的事物都应当和谐一致——自然将亲属间的友谊结合于一身”。14 然而这一协议十分脆弱，因此当小康拉德在不到一年后成为反叛者之一、并在此后长期对其已加冕的堂兄弟构成威胁时，没有人会感到意外。细察之下，中世纪早期许多最激烈的政治对抗皆是如此，因为没有什么比亲属关系更能滋生竞争了。\n那么，那些亲属权利和义务已被切断、实际上变得无亲无族的个人又如何呢？这些人最可能是男性，他们或因惯常偷盗、斗殴、挑起仇杀而耗尽了亲属的善意，或因背叛和暴行转向至亲，犯下弑父、弑兄，甚至与自己母亲乱伦的罪行。在盎格鲁-撒克逊英格兰和欧洲大陆，那些亲属不再愿意通过共同宣誓或分担巨额赔偿金来支持他们的人，只能以他们仅剩的东西——性命——来承担后果，或服苦役，或受绞刑。在爱尔兰，犯有背叛、盗窃或杀害亲族之罪的人被贴上狼的标签，并被如此对待：他被放逐流浪，成为遭人憎恨的弃儿、令人畏惧的局外人，丧失了身份、援助——乃至人性。\n归根结底，无亲无族使自由人的社会处境沦落到与奴隶相差无几的卑贱地步，既无权利，亦无亲属。在一个基督教社会中，这是比死亡更悲惨的命运，因为与亲属保持友好关系的人尚可指望体面的葬礼和为其灵魂的祈祷。社会弃民死后被抛上粪堆；无亲可依的流亡者则承受着其在生时的等价境遇。这种彻底的沉沦凸显了亲属关系的核心重要性——不在于其谱系归属，而在于其作为维系共同体之“友谊”的社会意义。\n任何地方的亲族都未曾形成一个具有明确成员标准和固定行为规则的明确群体；在任何地方，一个人的亲属都是一种可资援引的社会资源，是随情境需要而提供身份认同与支持的源泉。然而，亲属关系以不确定性为前提，因为支持必须经过协商、恳请方付诸行动。这样一种对亲属关系的解释不做太多理所当然的假设，因为它以不可预测性来平衡互惠，以拒斥来平衡亲和。它承认，原则上，一个人的忠诚和义务同时延伸至父方和母方亲属；它认识到，亲属关系除血统外，还可通过婚姻、教父关系或寄养而建立。它还有助于解释，尽管中世纪早期欧洲在文化和社会上如此异质，亲属纽带为何仍始终是社会凝聚的根本源泉，无论在孤立的村落还是在广布的帝国精英之中。然而，同理，这种纽带的破裂则威胁着社会结构的根本。难怪地狱被描绘成一个“在那里任何至亲都互不相认……在那里母亲不爱其子女，儿子不敬其父”的地方。15\n荣誉与复仇\n正如《萨利克法典汇编》所详述的，亲属相互扶助的方式之一，是代凶手及其亲族向被害者的亲属支付应付的赔偿金。除罗马法原则仍然行之有效的地区外，所有中世纪早期的共同体都为赎回一条性命规定了金钱价值，在日耳曼诸语言中称为“人命金”（wergeld）。其数额随等级而异，明确宣示了国王或贵族远高于农民或奴隶的价值；妇女和儿童一般享有其父亲的人命金。然而，人命金并不仅仅适用于杀人案件。杀人固然解释了为何人命金是一条性命的代价，但在未致命而遭受伤害的情况下，也须支付人命金或其一定比例。伤害可以是身体的，也可以是言语的：罗塔里（Rothari）的伦巴德法典列出了从砍断小脚趾到挖出眼睛等五花八门伤害所应付的赔偿，而法兰克的《萨利克法典汇编》则规定了从一百零⁰——不，规定了从一百到一千不等的言语侮辱。其中包括指控一名女子为娼妓，以及通过指控一名男子“浑身是粪”、称他为“狐狸”或“野兔”来诋毁他的作战勇气与忠诚——换言之，就是指控他因恐惧而失禁、行为奸诈或临阵脱逃。16 因此，我们需要评估赋予人的生命的价值如何同时涵盖了社会自我与肉体自我，并探讨对男女行为的不同期待如何影响了亲友的行为。正如我们将看到的，这些侮辱揭示了一个敏感而自尊的世界，其核心在于女性的性贞洁与男性的勇武好斗。\n既然伤人的言语与有害的殴打都攻击了社会地位，偿命金就远不止是对肉体损害的赔偿。它以货币形式表达了对家族自豪感、名誉与尊严的冒犯：支付偿命金的义务使加害者及其亲属承受了同等的贬损。实际上，偿命金是对一个人的家族所受集体社会尊严损害的补偿。它兼具损失赔偿与恢复尊严手段的双重性质，通过与爱尔兰的双重离散支付程序相比较而更加清晰：一项支付补偿死者、伤者或受辱者的父系亲属所受的损失或损害；另一项称为“面孔的价值”或“净面”之金，用以抵偿对父系和母系双方亲属的侮辱。“洗净”被玷污的面孔可以消除损失、伤害与侮辱的污点，这暗示了一种将名誉与人身紧密相连的文化：恢复个人的社会地位就是“挽回面子”。偿命金与爱尔兰的“面孔价值”都按等级递增，这一事实表明，社会地位高的人比社会下层的人面临更大的丢脸风险。以下讨论即聚焦于这些记载翔实的高价值精英。\n八世纪中叶的巴伐利亚法典让我们更进一步。它列举了五个位列公爵家族之下的精英家族，他们有权获得“双倍补偿”，因为他们被授予了“双倍尊荣”。17 “尊荣”难以简短定义——只是它不同于赔偿金，并不遵循任何价目表。人类学家用这个词作为一整套复杂的个人社会属性的简称，这些属性共同促成政治影响力和物质财富的积累。其本质将个人的自尊与他人的敬重结合在一起。它既关乎自我，也关乎他人，若不通过日常品行和具体行动不断重申和再确认，便趋于消散。因此，推而广之，它从不稳定，也无法囤积。此外，它与赔偿金的关联暗示，中世纪早期的尊荣既是家族的，也是个人的：它内在于群体之中的人，将个体牢牢置于由亲属、朋友、领主和国王构成的社会关系之网的中心。而且，由于某些行为形式比其他行为更易于肯定或恢复尊严，中世纪早期的精英男女对那些可能玷污乃至彻底摧毁尊严的形形色色的言行后果有着敏锐的意识。大量关于羞耻、恶名、羞辱与耻辱的词汇表明，不光彩的行为如何在他人眼中导致声名狼藉。在社会价值谱系的消极一端，羞耻与损害个人和家族自豪感及名誉的行为相连。而当涉及的家庭是王室时，尊荣的侵蚀可能在政治上是灾难性的。\n中世纪早期的作家很少用一个词来概括这一抽象概念。他们更倾向于从行动来思考——尊崇、向某人表示敬意。有尊严的行为强调慷慨、财富的展示、忠诚、性、武勇与复仇。贯穿这些看似互不相关的行为方面的，是两个相互交织的主题：一个涉及人体的正确处置，无论是在性事、军事事务中，还是通过华丽的服饰；另一个涉及对他人的义务，无论是慷慨、忠诚还是复仇。将社会展示与慷慨分别留待第五章和第六章讨论，我们可以利用其他形式的有尊严行为，进一步探讨中世纪早期亲友之间互动这一主题。\n性行为最直接地显示了个人活动如何影响其亲族的集体地位。这里涉及的是性贞洁的观念，以及对违反根深蒂固的习俗和禁忌者的责任追究。例如，《萨利克法典汇编》将私生子视为“蒙受耻辱者”。18 不过总体而言，独身的基督教教士是我们了解中世纪早期性观念最重要的信息来源。虽然世俗的社会行为与那些急于谴责一切不合自身伦理观念之物的教士的抱怨确实难以剥离，但显而易见的是，中世纪早期的严格性行为规范更多针对女性而非男性。“在老萨克森（即仍属异教的德国北部）”，盎格鲁-撒克逊传教士博尼法斯在746/7年报告说：\n如果一名少女以通奸玷污她的父家，或者一名已婚妇女背弃婚姻纽带而与人通奸，人们有时会强迫她亲手结束自己的生命，用绳索自缢；当她被焚烧火化之后，人们把玷污她的男子吊在她的火葬堆上。有时会聚集一群妇女，由女眷们鞭打她，带着她走遍整个地区，用棍棒殴打她，把她的衣服割到腰带；并用刀在她全身切割刺扎，留下伤口，把她血肉模糊、遍体鳞伤地从一个村庄赶到另一个村庄。而出于对贞洁的热忱，总有新的鞭打者加入进来，直到她们把她打死，或打得奄奄一息；以便使其他人畏惧通奸与淫乱。19\n诚然，博尼法斯是要向他的基督徒听众说明一个问题——他认为他们的道德过于松弛——但他的话仍然暗示了一种将通奸等同于玷污家族完整性的心态。\n并非只有前基督教时代的家族才会以处死有罪女子或施加极端惩罚来回应未经许可的女性性行为。勒芒早已是一座基督教城市，584年，一位出身高贵的女子女扮男装与她的情人——一名教士——私奔。当她的亲属发现后，他们立刻“为家族所受的羞辱复仇”，将那女子活活烧死，并囚禁了那名教士。20 她的行为损害了所有亲族的名誉，亲族们采取了他们唯一可行的手段来挽回名誉。大体而言，中世纪早期社会把对失范女子的惩罚交由其男性亲属——无论是父亲、兄弟还是丈夫——处置。对女子公然侵害其亲属尊严行为的家族即时报复，与将一名男子逐出亲族并令其沦为被放逐者的程序互为对应。\n“如果一名女子在丈夫在世时与另一名男子通奸，并且此事败露，那么她此后将自取其辱，成为公开的耻辱，其合法丈夫应获得她所有的一切，而她将被割去鼻子和耳朵。”21 女性在被认可的婚姻关系之外的性行为，会招致羞耻、丢脸（无论是字面意义还是比喻意义）、家族蒙羞，甚至死亡。这些构成了规范女性行为的大体不成文的制裁，也标示出家族名誉与控制女性性欲之间的紧密联系。女性与性交对任何亲族的繁衍都至关重要，以致男性亲属的荣誉与其姐妹、妻子和女儿的性贞洁与自我节制密不可分地等同起来。而且，正如通奸通过女子使用身体的方式带来耻辱，报复也同样施加于她的身体之上——石击、毁容或处死。\n女性的性过失挑战了一个男子继承人的父系血统，从而威胁其整个家族的社会地位。但女性也可以通过节制自身的性欲作出积极贡献。“一个贞洁而贤慧的妻子，以谦逊的仪态和欢愉的言辞勤勉地打理有益的事务，”一位九世纪的作家如此评述，“会平和地管理她的子女和家庭；并且，为了丈夫的福祉，必要时她会以生命抗衡死亡，以清誉捍卫他的财产”。22 如果女性的清誉有助于其亲族所受的敬重，那么她的男性亲属也有责任保护她免于风险，捍卫她的好名声。这一点体现在733年伦巴德国王柳特普兰德（712–744年在位）过目的一桩诉讼中。一名女子独自在河中沐浴，将衣服放在岸边。“某个邪恶之徒”拿走了衣服，她被迫赤身裸体走回家，“羞得满脸通红”。但羞辱并非她的过错，柳特普兰德裁定，窃贼必须为如此“可耻”的行为支付其全额偿命金作为赔偿，理由是，如果女子的父亲、丈夫或其他男性亲属在场，他们必定会扑上去杀死他。既然窃贼已隐匿逃脱、毫发无损，他便须提供与其性命等值的金钱。23 国王裁决中隐含的，是承认女子的亲属既有义务也有权利——必要时以暴力——捍卫她的贞洁，从而捍卫她的清誉。\n女子的行为集中体现了尊荣居于家庭成员关系核心的方式。她犯下的任何性行为失当都给她自己和亲属带来耻辱；她贞洁的品行则维系着丈夫、父亲和兄弟的社会尊严。作为维护她——以及他们——荣誉的回报，她可以指望他们保护她免受可耻对待和诬告。维护尊荣、避免羞耻，指示了有助于维系近亲之间融洽关系的行为方式。\n在保护妻子、姐妹和女儿免受言语或人身攻击时，中世纪早期的男子会迅速诉诸暴力。的确，男性尊荣与好斗、勇气和武艺的展示紧密相连，正如女性尊荣与性贞洁密不可分。然而相比之下，男性尊荣与家族荣誉的绑定并不那么排他，至少在精英阶层中是如此。它也是内在于武士与其所事奉领主之间正确关系的一种品质，是对将男子与其家族相连的荣誉的补充而非取代。正因如此，它成为社会晋升和政治影响力的途径。\n843年，一位名叫杜奥达的阿基坦母亲写信给她深受疼爱的15岁儿子。儿子当时住在西法兰克国王秃头查理（840–877年在位）的宫廷中，学习宫廷社会的处世之道。杜奥达在向纪尧姆倾吐道德与宗教教诲时，触及了尊荣这一主题，及其与家族和领主的关系。在论述如何在九世纪中叶紧张的政局氛围中获得成功的教导章节开篇，她告诫纪尧姆“应当在一切事上敬畏、热爱并忠于［他的］领主和父亲贝尔纳”，继而将对其父的尊崇与对基督教上帝的顺服联系起来，杜奥达阐发了这样一个观点：世俗世界中的尊荣与敬重可以通过这种双重忠诚而获得。她期望儿子忠于其领主查理国王，但也强调其他忠诚同样会给纪尧姆带来尊荣：“我劝勉你，务必在与你共事之人、同侪及忠实朋友之间努力行事，使你的人生持守正道，毫无对领主不忠之耻，而以热忱行善，方式可嘉，得体合宜。”24 纪尧姆的任务是通过他对父亲、国王以及廷臣的忠诚与行为赢得敬重。如今与家人分离的纪尧姆，必须在宫廷的竞争环境中维护自己和家族的荣誉。杜奥达对其教诲的总结，将尊荣的施予与获取置于她认为应支配这一动荡政局世界中正直行为的训诫之中心。“因此，我的儿子纪尧姆，敬爱和尊重一切你希望其尊重你的人，无论是一人还是多人。爱、敬、扶持并尊崇所有的人，使你配得上在世事变迁之中从每个人那里获得应有的回报及其相应的尊荣。”25\n杜奥达并未详述如何通过武勇赢得敬重。要探究男性尊荣与军事技艺之间的联系，我们最好求助于中世纪早期的史诗。在忠于亲族与忠于领主相冲突的情境中确定有尊严的行为道路，以及主人公面对敌人时展现的无畏勇气，是贯穿中世纪早期各种语言的诗人和听众反复萦怀的双重主题。在《瓦尔特拉里乌斯》这部可能写于九世纪末或十世纪的拉丁语史诗中，尊荣与耻辱、亲缘与领主效忠的焦虑交织在一起，生动地展现了中世纪早期男性气质的诸般律令。诗中所叙述的是传说而非史实，讲的是一位名叫瓦尔特的英雄的事迹，他与杜奥达的儿子纪尧姆一样，是阿基坦人。瓦尔特从少年成长为成人……\n在异国宫廷——匈奴王阿提拉的宫廷——充当人质。阿提拉还劫持了勃艮第的女继承人、瓦尔特的未婚妻希尔德贡德，以及法兰克贵族哈根，后者是代替尚在襁褓中的法兰克王子贡纳尔被送来作抵押的。三人共享阿提拉的款待，并逐渐在他的宫廷中位居显要：希尔德贡德成为匈奴王后的侍伴，瓦尔特和哈根则是阿提拉军队战功赫赫的统帅。但当贡纳尔成为法兰克国王后，哈根逃回去为他效力。较晚之后，瓦尔特和希尔德贡德也设法逃走，尽可能带走了匈奴人的财宝。要到达阿基坦，他们必须穿越贡纳尔的王国，但这位法兰克国王得知他们出现在自己的国土上，便率领一队十二名久经考验、勇猛无畏的武士出征，意图夺取瓦尔特和希尔德贡德携带的财宝。哈根被迫随同贡纳尔前往。瓦尔特据守一处狭窄的峡谷，当贡纳尔逐一派出他的十二名武士时，瓦尔特将其一一斩杀。随着贡纳尔怒火渐炽，只剩下一直拒绝与朋友为敌的哈根。哈根在这一抉择中痛苦万分，最终同意协助贡纳尔对付瓦尔特，而在最后这场二对一的决斗中，三位武士皆负重伤，却无一人丧命。\n在瓦尔特逐一经历这十二场单打独斗的过程中，有几条主题萦绕在诗人心中。其一是瓦尔特的英雄气概、英勇无畏和似乎无穷的力量，因为他是一个“久经沙场的勇士”，“对任何恐惧全然不为所动”。26 其二是当武士们接连倒下时寻求复仇的本能，尤其是为亲属之死复仇的冲动。其三是夸耀武艺与勇气的口头豪言所起的作用，以及向对手投掷的讥讽与侮辱；其四则是荣誉与男子气概的强制要求。当十二名武士尽数被杀、只剩下哈根和贡纳尔国王面对瓦尔特时，所有这些线索汇聚到了一起。\n在战斗开始之前，贡纳尔就曾试图通过羞辱哈根本人、他的家族，以及——言外之意——他作为一个男人的名誉，来激他出战：\n“正如我所见，你酷似你的父亲；\n哈加提奥胸中也藏着一颗怯懦的心，\n在冰冷的胸腔里，用许多托词回避战争。”27\n但哈根并未被这些讥讽激怒，而是始终在一旁观望，只看战斗而不参与，即便当他的侄子倒在瓦尔特剑下时也是如此。然而当只剩下他们两人时，贡纳尔加紧了奚落：\n“这么多朋友和亲族被杀，\n你竟不羞于抛弃你的男儿本色吗？”28\n其中的含义十分清楚。如果哈根不肯出战，未能为侄子和战友复仇的代价便是懦夫的耻辱。只有女人才不战斗，因而在这份耻辱中，哈根将被贬低到女人的地位。然而，\n哈根仍然犹豫不决，在心中反复思量\n曾无数次对瓦尔特许下的信义，他细细掂量\n事情的来龙去脉与前因后果。\n但如今那位不幸的国王愈发急切地哀求。\n在他恳切哀告的感动之下，他避开\n君主的目光，思忖自己的\n勇武名声，倘若在这件事上\n有丝毫退缩保全，名声恐将蒙污。29\n在此，全诗的道德关键之处，所有相互冲突的价值观暴露无遗。哈根勉为其难地作出的决定是：男子汉的荣誉要求他维护自己作为勇武战士的名声，甘愿在追求荣耀的过程中冒生命危险。只有同意与瓦尔特交战，他才能免于耻辱、为侄子复仇、保住国王的恩宠，并保持男人的身份。归根结底，防止自己名誉崩塌这一明白无误的迫切需要，为哈根指明了必须采取的行动。\n991年，一队盎格鲁-撒克逊人在埃塞克斯海岸马尔登一场有明确记载的战斗中被维京人击败。首领阵亡后，一些盎格鲁-撒克逊人逃离了战场。一位同时代的古英语诗人以传统史诗价值观重述了这场败绩，强调的不是盎格鲁-撒克逊人的挫败，而是那些选择留下来战斗到底者的英雄气概：\n武士们昂然向前推进，\n毫无惧色的战士们蜂拥而上，\n人人渴求两件事之一：或报那杀戮之仇，\n或舍弃自己的生命。30\n剥离其政治上的含混之处后，马尔登的事件提供了一个重申熟悉主题的机会——荣誉、勇气、复仇以及至死不渝的忠诚密不可分——从而提醒这个急速变迁的世界勿忘古老的价值。在现实生活中，不同于诗歌的表现，这种行为既带来了赞誉，也带来了加剧的危险。801年，阿尔昆曾为诺森布里亚贵族托特蒙德——一位“我们的朋友”——向查理曼说情。796年，诺森布里亚国王埃塞尔雷德一世遇刺身亡；阿尔昆为托特蒙德辩护，称他是“埃塞尔雷德国王的忠实仆人，一位忠诚得到证明、武艺勤勉的人，他勇敢地为主公的血复仇”。31 托特蒙德的复仇行为想必使他别无选择，只能逃亡国外，以躲避进一步的报复。阿尔昆显然确信，查理曼不仅会将这个身处险境的人纳入自己的保护之下，还会把他复仇的勇武视为值得嘉许的品质。\n一则爱尔兰的凶兆预言曾预告社会将崩解为一个“女人不知廉耻、男人毫无勇武”的世界。32 为了维护社会秩序，中世纪早期的男人们依据一种伦理来选择自己的行动方针，这种伦理不同于——但又补充着——施加于妇女的性贞洁约束。男性荣誉不仅是避免耻辱，它还意味着对武艺的积极追求，以及在言语和行动中不断重申男子气概。那些失败者，那些逃离战场的人，其行为“如同女人”。33 而且，与女性荣誉不同，它并非仅以亲属为中心，因为它要求更广泛的公众——朋友以及亲属、领主以及同侪——的认可。然而它同样最关心在他人眼中的名声，并且与言语、姿态、行动和身体紧密相连，一如女性的荣誉。此外，男性气质常常表现为夸大的自吹自擂和相互辱骂的交锋。有时，尤其在宴饮酣醉的气氛中，言语上的攻击竟成为肉体殴打乃至杀戮之前的前奏。当荣誉要求必须回敬羞辱性的侮辱、伤害或杀人之罪时，世仇的威胁便可能在地平线上隐现。\n撇开罗马法中个人须独自且唯一对自己的行为负责这一司法原则在地中海某些地区可能仍然可以执行这一点不论，中世纪早期的欧洲是一个世仇文化，因为世仇是一种将男子气概与复仇联系在一起的荣誉观念的体现。它同时浓缩了亲属之间的道德义务及其脆弱性；因此值得在此加以考察。必须立刻说明的是，世仇既不是一种无政府状态——无论是暂时的还是持续的——也不是一种无休止的血腥杀戮。毋宁说，它是群体之间一种潜在的、隐伏的或实际的敌对状态，在这种状态下，复仇杀戮的威胁本身反而可能有助于遏制暴力，并促成更有序的冲突解决方式。只有当流血似乎比接受体面提出的赎杀金更为荣耀时——或当明智的劝告无法遏制头脑发热的年轻人时——中世纪早期的世仇才变成血腥的报应正义。然而在大多数时候，支付赎杀金似乎正是为了化解仇杀的风险。有时土地被明确变卖以筹措支付赎杀金所需的巨款，这一事实表明，杀人者的亲属常常看到以金钱补偿来安抚死者怨愤亲属的好处。在小型共同体中——其中多数邻人可能同时也是亲属——暴力的威胁想必可怕得令人不敢设想。\n因此，世仇是一种管理冲突的形式。它遵循的惯例更多地嵌入于社会实践之中，而非被明确表述为行动原则。世仇既是一种心态，也是一种行为准则，只有在其他修复受损荣誉的方法失败之后，才会导致流血。书面史料很少能让我们追溯一桩仇杀的开端、经过和解决，或对更广泛的社会背景作出充分的评估，但它们确实清楚地揭示出：世仇是敌意的相互交换；而一旦血仇形成，报复的欲望便助长了它的延续，使之难以轻易化解。托特蒙德在寻求查理曼庇护时深知这一点。正因如此，仇杀可能历时短暂，也可能断断续续地爆发多年，有时甚至绵延数代。变卖家族土地以金钱了结的决定不会成为编年史或英雄史诗的素材，只在土地转让文书中得到一笔带过，而那些升级为暴力的冲突却吸引了我们的注意——一如它们吸引了中世纪早期编年史家的注意——因为它们具有非凡的叙事魅力。\n两起大致同时发生、却来自截然不同文化环境的事件，浓缩了荣誉、补偿与复仇的复杂性。两者都发生在公元590年前后，一起在爱尔兰西部，另一起在高卢北部。先讲康诺特人利布兰的自述：\n在我仍住在自己的家乡时，我杀了一个人。此后我作为罪人被戴上镣铐。但我的一位亲戚——实际上是我的直系亲族——非常富有，在紧要关头前来搭救我。他付出了使我脱罪所需的代价，尽管我身戴镣铐，他救了我这个罪人免于一死。在他买下我的获释之后，我以约束性的誓言向他承诺，我一生都将服侍他。34\n利布兰犯下杀人罪，想必是自首认罪的。他被关押未在外自由活动，最大限度降低了死者亲族外出复仇杀戮的风险，但同样明显的是，利布兰无力筹措爱尔兰法律所要求的补偿及挽回颜面的偿金。因此他的性命掌握在死者亲族手中，他们可以杀死他，也可以将他卖为奴隶。利布兰被一位富有的亲族救出，表明亲族彼此对对方继续生存所抱有的关切。然而，获救的代价却是依附于自己的亲族。事实上，他违背了誓言，几天后便逃亡他乡，最后需要圣徒科伦巴的干预才找到一个既能满足利布兰所有亲族的荣誉、又能涤除利布兰因杀人及背誓而产生的负罪感的解决之道。\n在这个事例中，一次杀戮并未引发连锁的报复性杀戮。相反，各种导向和平解决的合力共同作用，在不大扰乱社会秩序的前提下恢复了荣誉。但在另一起事件中，最初的冒犯根本未涉及流血，却升级为一场旷日持久、手段狠毒的世仇。图尔的格雷戈里的记述值得全文引录：\n图尔奈的名门法兰克人之间爆发了一场争端，因为其中一人的儿子不断指责另一人的儿子——后者娶了他的姐姐——愤怒地斥责他抛弃妻子、另狎娼妓。由于被告者恶行不改，这位兄长[因姐姐受辱而生的]怒火愈燃愈烈，以至于这年轻人扑向他的姐夫，连同自己的随从一起杀死了他。随后他本人和随他前来的人也都被砍倒，双方无一人存活，只剩一个人，因为无人杀他。结果，双方的亲族彼此结下仇怨。王后弗雷德贡德一再敦促他们终止敌意、缔结和约，以免他们的争斗继续下去，酿成更大的动乱。35\n在此，家族荣誉、恶言相向和头脑发热这一醉人的混合物引发了一连串的复仇杀戮，直到弗雷德贡德趁三名闹事首领酒醉时将他们斩首，才最终了结。\n这一事件的戏剧性使我们得以注意世仇的若干复杂性。首先，尽管直接的起因是一个女人被丈夫羞辱，这场仇杀——如同所有仇杀一样——是由男人进行的。妇女的参与至多是间接的，或如本例那样作为引发事端的缘由，或在激起自家男人采取行动方面扮演工具性角色，这一点在冰岛和爱尔兰的记载中尤为翔实。世仇是男人的事务，且由群体而非个人进行。若要实施复仇杀戮，这些群体必须临时召集。正如这个图尔奈的例子再次表明的，在世仇中表现出来的宿怨涉及同一社会网络中的男人，是彼此熟识的邻人。在图尔奈，兄长与妹夫结仇，争端迫使男人们在自家的亲属圈子里选边站队。事实上，发生在彼此有亲属关系的男人之间的世仇，与发生在两个不同亲族群体之间的世仇一样多。此外，可能被卷入世仇的亲属圈子，无论在六世纪晚期的图尔奈还是其他任何地方，都不是由社会实践或明文规则界定的。它取决于主要的争斗者劝说他人加入的成功程度，也取决于那些未直接涉入者的荣誉可能在多大程度上受到质疑。而每当有人被杀，受波及者的圈子就会重新组合。图尔奈事件中从宿怨到暴力的转变，是一个头脑发热的未婚青年所为，他能够动员一批支持者——他们并非明确意义上的亲族。在第一轮厮杀中，他和他的姐夫连同各自所有随从，除一人外全部丧命。至此，结仇者的圈子扩大了，争斗双方的其他（或更年长的？）亲族被卷入其中，暴力程度也随之升级。这一事件完全类似于其他引起中世纪早期编年史家注意的世仇：它似乎不仅涉及亲族，还涉及两位连襟的其他追随者。友谊、情谊、邻里关系或对领主的忠诚，与亲属义务一样轻易地将男人卷入世仇。但正如世仇可能使亲族彼此为敌，它也可能使誓友反目，正如瓦尔特和哈根最终被贡纳尔迫使相对。因此，世仇的爆发催生了一个群体，在这个群体中，亲属关系的强制要求可能与其他形式的联结和义务相互融合，也可能彼此冲突。\n最后，这场因一名妇女的荣誉被视为受辱而起的冲突表明，世仇与其他形式的社会规制——在此即王命——是并存的。把世仇视为必然与王权对立是错误的；事实上，关于世仇程序的一些最佳证据恰恰来自特别强势的国王的立法，例如西撒克森国王埃德蒙（939–946年在位）颁布的关于世仇的法令。所有中世纪早期的国王都接受世仇的原则：他们关注的是防止仇杀升级到造成严重政治动荡的地步，并通过就违反相应程序者处以罚金而为自己谋取财政利益。他们并不禁止世仇，而是试图将复仇的冲动收归己用，使之有利于王室。为此，王室立法使接受补偿和解既有利又体面。例如，罗萨里大幅提高了各类伤害的补偿数额，“以使faida，即血仇，得以……为偿金收讫后即可避免，并不得再另行索求，亦不得心怀怨恨。故此案就此了结，双方之间应保持友谊。”36\n一位意志坚定的强大国王能够充分调动王室愤怒的力量，迫使敌对各方彼此和解，从而使双方的荣誉与王权同时得到提升。在王权薄弱的地方（如十世纪的法国南部），或在国王自身卷入世仇之争的地方（如十世纪的德意志），血亲复仇便成为政治运作的一个组成部分，成为在高度竞争且不稳定的环境中宣示支配地位、攫取权力的一种手段。对某些人而言，对资源、追随者、地位——亦即荣誉——的追求助长了世仇之争；而对另一些人来说，仍抱有希望，指望世仇能够削弱地方豪强的权力，重塑当地支配与臣服的现实格局。\n最后一句话留给法兰克国王贡特拉姆（561–592年在位），他在584年为兄弟希尔佩里克国王遇刺而哀悼时说：“若今年我不能为他复仇，我就不配被视为一个人。”37 中世纪早期的国王与其他人一样，同样需要维护自己的男子气概、家族和声誉，复仇既可能是王室政策的原动力，也可能是追求个人或家族荣誉的原动力。在中世纪早期，男性置身于一种鼓励他们通过夸耀、辱骂、殴斗和杀戮来证明自己的文化之中。通过捍卫荣誉，个人宣示了自己在成年武士共同体中的位置；由此，他的声誉也为整个家族增光。反之，他的行为也可能使家族陷入与其他亲族、邻人乃至统治者的紧张关系。利害攸关如此，男性的荣誉便具有易变、好斗和复仇的特点。它必须如此：“血脉之谊”的本质，就是甘愿为家族——或许还有领主——献出生命。没有亲族，一个人便无人协助捍卫自己的荣誉；没有荣誉，他便缺乏男子气概；没有男子气概，他便没有社会存在。\n在最基本的层面上，亲缘关系关乎父母与子女、丈夫与妻子，关乎这些根本的人际结合所带来的亲昵、紧张、仇恨与义务。然而，它的意义远不止于此。正如本章反复表明的，把亲缘关系作为一种亲缘纽带（affinity）形式加以讨论，实际上就是在讨论从地方到帝国各个层面的政治。这种契合使我们得以避免把中世纪早期的亲缘关系简单地归入“社会史”的 pigeonhole，而是让我们认识到，它是权力得以分配和争夺、社会控制得以维持或挑战、合法性得以主张和确立的根本方式之一。\n显赫的祖先提供了一种极具说服力的合法性言说。亲属之间的关系提供了身份认同、支持和法律地位。在精英阶层中，防止荣誉流失并加以增进的冲动，支配着他们与朋友和亲戚、领主和邻人的一切交往。归根结底，所有这些都是政治与权力的问题，无论国王是否直接参与其中。\n然而，自始至终我们都没有给出中世纪早期亲缘关系的简单定义，这是有充分理由的。在命名、“血脉之谊”、荣誉或世仇等事务上，并没有一成不变的规则。毋宁说，亲缘关系是特定文化群体的惯例、当时的形势压力以及个人策略和选择的习惯性混合体。它是一种可供利用的资源，一种有待确认的身份，一种需要遵循的习俗，一种可以挑战的规范。它的具体意义取决于具体的语境。\n其社会实践既非千篇一律，也非一成不变。在罗马法延续的地中海地区，个人没有向亲族寻求支持的正式权利。他们唯一被认可的求助途径是司法体系，而这一体系让个人独自面对国家的强制力、孤立无援——但这并不能阻止人们以自己偏好的任何手段，无论是和平的还是暴力的，去追求个人和家族的利益。在其他地方，习惯法则设想由亲缘关系来承担罗马国家昔日曾专擅的部分职能，特别是在约束群体成员行为方面，以及提供解决怨愤与争端的手段方面。在阿尔卑斯山以北和盎格鲁-撒克逊英格兰，亲缘纽带有时与王权和正式的法律程序相竞争，有时又与之相辅相成：在这里，贵族亲缘关系与王权处于一种不稳定的均衡之中，这种均衡既可能造就像查理曼那样权力非凡的统治者，也可能为巩固埃塞尔斯坦或奥托一世的权威的努力设置强大的障碍。在讲凯尔特语的地区，那里几乎没有或完全没有罗马遗产的直接传承，没有日耳曼人定居的贡献，也没有稳定、强大、疆域辽阔的君主政体，紧密亲缘关系的自我约束压力——很可能又因比邻而居而得到强化——提供了有序生活所需的大部分凝聚力。\n有人有时主张，王权在中世纪早期的成长，是通过攻击和削弱亲缘纽带而实现的。这种尖锐的对立是站不住脚的，因为亲缘纽带是中世纪早期所有不同文化在一切社会层面上的根本要素：它们从来不是强大王政的对立面。毋宁说，最成功的统治者通常是那些能够化解自己近亲之间的紧张关系、笼络广泛亲属圈子的支持，并把亲缘关系的一切策略转化为自身优势的人。一个有效的国王，就是懂得如何把自己的亲属变成朋友的人。", "sections": [{"level": 2, "title": "身份", "id": "ch5-s0"}, {"level": 2, "title": "血缘之友", "id": "ch5-s1"}, {"level": 2, "title": "荣誉与复仇", "id": "ch5-s2"}]}, {"id": "c6", "title": "第4章 · 男人与女人", "kicker": null, "part": "第二编 · 亲和", "html": "<p>“男人”一词指任何意志坚定、有判断力的人，而“女人”则指心智软弱、缺乏判断力的人。<sup class=\"fn\" data-note=\"4:1\">1</sup></p>\n<p>两人结为伴侣。一个男人和一个女人通过生育将一个孩子带到世上。<sup class=\"fn\" data-note=\"4:2\">2</sup></p>\n<p>“心智软弱、缺乏判断力”之人很少出现在记述伟大功业与政治成就的文字中。按照传统叙述，中世纪早期的历史是男性的政治、经济与宗教史，女性在很大程度上缺席于政治与经济领域，在宗教领域中也处于边缘地位。这种呈现方式不仅建立在前几代学者的预设与偏见之上，也反映了早期中世纪编年史、年鉴和史书的总体基调。但如今情况已大为改观。历史学家们现已认识到，与叙事性史料相比，女性更可能出现在其他类型的中世纪文献中，例如圣徒行传、记录土地交易的特许状以及法典。此外，当研究视野扩展至人们生活的地域与家族背景时，女性便与男性一道，成为历史学与考古学研究的核心对象。开展这项工作，不仅仅是关注编年史中占有显著地位的国王、诸侯、主教与武士们的妻子、母亲和女儿。这种方法要求我们探究男女社会角色之间的差异，并揭示其背后的预设、价值观念与偏见。换言之，它要求我们关注性别，将其视为中世纪早期社会组织与文化表达的一个内在要素。</p>\n<p>当我们这样做时，我们会发现自己在研究各种支配与从属的形式——它们存在于日常生活的方方面面，从农民的茅屋到帝王的宫殿皆然。这正是本章的任务。</p>\n<p>本章有两个前提。第一个前提已在前面确立：读写能力为神圣与世俗权威提供了辩护、促进与保障。<sup class=\"fn\" data-note=\"4:3\">3</sup> 由此可知，中世纪早期的抄写员和作者绝非对周围世界毫无利害关系、中立或纯真的记录者。他们在服务于利益攸关最深者的既得利益时，对报道内容有所取舍，浸透着其所处时代与地域的普遍态度，并善于将注意力从那些部分或完全被排除在权利、资源、声望和权力之外的人身上转移开。这些修辞策略轻而易举地使女性与儿童、奴隶和农民一道，陷入部分或完全的不可见状态；本章将着重揭示中世纪早期作者所玩弄的某些性别把戏。</p>\n<p>第二个前提在前一章中已有所暗示，但现在必须予以明确：尽管大多数中世纪早期文本将女性边缘化，她们对于任何共同体的繁衍却至关重要。她们的角色不仅是怀孕与分娩这种生物学意义上的再生产，还包括将文化预设、行为模式与道德规范代代相传的社会性再生产。家族姓氏以及母亲对儿子的训诫，便是我们已遇到过的这方面的例子。<sup class=\"fn\" data-note=\"4:4\">4</sup> 同样根本的是，女性以自己的劳动维系着共同体的运转，生产衣物、食物及其他许多物品。目前，只需指出女性的经济贡献与其文化和社会角色相辅相成，就已足够。</p>\n<p>因此，本章以前一章所开始的男女行为模式探讨为基础，进一步以性别差异为焦点展开考察。本章的论点是：尽管中世纪早期的性别关系因地域而异、并在所讨论的数个世纪中发生了巨大变化，但在整个中世纪早期，人们在心态和社会实践方面仍存在着根本的共同性。无论我们把目光投向何处，这些共同性都围绕着一个核心：女性之于男性的从属地位。我们将从对男女社会价值差异的明确表述与表现入手，继而考察两性差异尤为显著的两大主题：其一是性伴侣关系与婚姻的缔结，其二是对土地财产的获取。在这三个领域中，罗马遗产都显得至关重要。</p>\n<h2 id=\"ch6-s0\">性别差异</h2>\n<p>在社会区分可能采取的所有形式中，性别只是其中之一。阶级或等级、年龄、族裔与宗教，同样可以是规范群体成员资格、决定资源获取和构建身份认同的重要范畴。换言之，这些都是使一些人享有特权而限制和贬抑另一些人的方式。在中世纪早期，性别可以说是其中最变幻不定、最普遍存在、也最难以在一生中加以改变的一种。社会、宗教与族裔身份的流动性将更容易</p>\n<figure><img src=\"images/fig_4_1.png\" alt=\"第4章所涉主要地点\"><figcaption>第4章所涉主要地点</figcaption></figure>\n<p>……一旦确立中世纪早期性别秩序的僵化性，这一点便显而易见了。<sup class=\"fn\" data-note=\"4:5\">5</sup> 由于性别差异通常以多种方式表现出来，本节讨论将从最明显到最不明显的层面依次展开：先考察可见的差异标志，再转向明确的社会规范表述，最后论及顽固存在的刻板印象与偏见。我们将看到，一张密集而细致的社会区隔与文化意义之网，笼罩着中世纪早期男女的生活。</p>\n<p>在任何社会中，最显著的差异莫过于服饰。服装的样式、首饰与个人装饰的形式、剪裁、遮掩或展示头发的方式，都强烈地传达着有关等级、财富、年龄与性别的信息。它们还可能传递有关族群身份、宗教圣召或政治忠诚的信号。所有这些都很容易改变，既可用于宣告个人处境的变化，也可作为刻意的伪装。考古与艺术史的证据表明，虽然中世纪早期的服装呈现出诸多地方性和区域性差异，并且（尤其对富裕精英而言）随时间不断演变，但男女有别的着装规范却始终普遍存在。到公元500年前后，短上衣和长裤早已摆脱了作为“蛮族”服装的恶名，取代古典托加袍成为罗马男性的首选服装；在整个中世纪早期的西方，它们始终是男装的普遍基础，只有教士除外，还有大约800年以后的王室礼仪服装。相反，女性始终穿着长及小腿或脚踝的长袍，对少数负担得起的人而言，丝绸、精纺羊毛织物以及不断变化的展示性首饰时尚则增添了更多的变化。</p>\n<p>服装的性别区分无法与个人装饰和衣着所蕴含的其他意义割裂开来。如果我们停下来考察塑造了几乎所有中世纪早期男女经历的生命周期，这一点就会变得清楚。与大多数前工业社会一样，中世纪早期各社会阶层的女性，其一生都由从童年到青春期或青春期稍后出嫁的过程主导：她们离开父母之家，迁往丈夫的居所，无论远近。此后，若未死于难产，便迎来从为人母到老年的又一次转变。如果作为年轻的新娘和母亲而守寡，她们通常会再嫁，甚至三嫁，迁居到新丈夫所在之地。晚年的守寡往往意味着另一种迁移：年迈的农妇很可能被领主迁往其庄园边远处的一处简陋住所，而精英阶层的寡妇则常常进入宗教团体，那里能提供保护和陪伴。只有那些在幼年时就被父母献身于宗教生活的女孩，才可能几乎终生居住在同一地方。</p>\n<p>无论社会地位如何，男性的生命节奏则有所不同。早年他们习得与其等级相称的身体技能，无论是使用武器还是农艺，但与姐妹们不同，他们达到身体成熟后并不会立即结婚。此时已具性活跃能力的他们，通常享有一段完全成年却不婚的阶段。在社会上层，他们作为武士效力于领主的扈从队伍，住在领主家中，接受宫廷礼仪与武艺的训练，如乌得勒支的格里高利就曾在王室宫廷中如此。<sup class=\"fn\" data-note=\"4:6\">6</sup> 在社会底层，年轻的未婚劳工是领主农业劳动力的重要成员，往往被派往庄园的主要田地劳作，有时则被送往遥远的地方开垦新地。他们结婚的年龄比姐妹们更晚，此后增添了家主和父亲的角色。若妻子早逝，男子很可能会娶一位明显比自己年轻的女人：对他而言，老年带来的是身体的衰老，却很少意味着孤独的鳏夫生活。即便到了老年，男性仍能发挥重要的社会作用，因为“老人知晓最多的事情，岁月使其智慧，往昔经验丰富”。<sup class=\"fn\" data-note=\"4:7\">7</sup> 他们是“长者”，在管理社区事务时，人们常常寻求他们的知识和建议。</p>\n<p>带着这些性别化的生命周期观念，我们可以回到服饰与个人装束的话题。对中世纪早期众多不识字的社群而言，墓葬考古为这些生命周期以及服饰样式的变迁提供了至关重要的证据。五、六世纪的男子、女子和儿童死后，有时会被葬于随葬品丰富多样的墓葬中，这些随葬品通常极为华美、辉煌、贵重。随葬墓尤其典型地体现了法兰克人、伦巴德人、哥特人和盎格鲁-撒克逊人等民族进入罗马帝国时所伴随的社会失序与流动。较晚的例子则出现在虽远离原罗马领土却正经历深刻政治与社会重组的地区，如九世纪的西斯拉夫诸地和十世纪的丹麦。必须强调的是，这并非一种异教前基督教社会的产物——那种社会的信仰假定死者来世需要日常生活用品——因为基督徒曾小心地将其中一些最著名的墓葬安置于教堂之中。毋宁说，它们是动荡不定的共同体的症候：在那里，经济、文化和军事压力正催生着充满张力的社会变革，以及对地位与合法性的竞争。</p>\n<p>在这种情况下，生者常常选择通过这种丧葬形式来确认自身及死去亲属的社会价值。尤其在整片随葬墓墓地被发掘之处，这些墓葬揭示了个人在共同体中的地位如何不仅随等级、也随年龄和性别而波动——换言之，随个体死于性别特定生命周期的哪个阶段而波动。</p>\n<p>高卢东北部梅斯周围地区的六世纪墓地便是一个经过充分研究的典型例证。它们展现了一个这样的世界：当一位正值青春期或育龄的女性去世时，家人会以奢华的随葬品予以厚葬，其中包括特定的女性物品—— notably 项链、手镯、耳环和胸针，有时还有纺轮和成串的家宅钥匙。这些随葬品的放置既反映了死者的社会地位及其对家庭的价值，也毫不含糊地表明她的社会价值源自其女性的、生育的能力。相比之下，儿童和约四十岁以上的女性，下葬时要么完全没有随葬品，要么只有几件非性别特定的物品。另一方面，男性直到约二十岁才会获得随葬品的厚葬，此时他们已达到体力的顶峰，并已在成年男性社会中完全立足。他们的随葬品通常是一套武器，如投掷斧、剑或矛；较年长的男性（四十岁以上）随葬品通常少得多，但仍具典型的男性特征。实际上，这些墓葬表明，适婚或育龄的女性以及作为武士的男性家主，在某些意义上比幼者和老者对家庭与共同体更有价值。它们也证实了服饰和个人装束在区分男女、标示社会角色方面的重要性。</p>\n<p>如前所述，中世纪早期的法典是社会规范与意识形态的又一重要指标。它们明示了物质记录所暗示的某些差异，并赋予其持久的、权威性的力量。这些法律条款许多涉及等级，但在涉及年龄与性别区分的条款中，有两项与本文尤为相关：命价和法律行为能力。首先是命价。除了按社会等级明确标定一个人的生命价值外，命价还可依年龄和性别而变化。<sup class=\"fn\" data-note=\"4:8\">8</sup> 这在《萨利克法典汇编》中尤为清楚：它与上述东北法兰克墓葬大致同时，呈现出惊人相似的图景，并以后期罗马帝国铸币的重金币（索里达，复数solidi）作为价值单位。一名自由的法兰克男子或女子的标准命价为200索里达，但若女子已怀孕或处于育龄，则增至三倍，即600索里达。生育期结束后，女子的命价又回落至200索里达。相反，男子的命价在其十二岁以下或成年后服务于王室时增至600索里达。从法律角度看，一条生命的价值在个体生命周期中变化显著；从性别角度看，一位姐妹的社会价值有时高于、有时低于其孪生兄弟。</p>\n<p>在此语境中的第二项重要区分是法律行为能力。中世纪早期法典以自由的成年男性为规范标准，并规定适用于其他群体的变通，包括女性、儿童、半自由人和不自由人。在此语境下，若干法典区分了成年人与儿童、男性与女性的法律行为能力。罗马法赋予成年男性远比未成年人和女性更充分的起诉和作证的权利，而在施加类似限制的后罗马时代法律中，罗塔里《敕令》对女性行动自由的限制最为严苛，尤其是在财产交易方面。罗塔里要求有一名男性保护人或法定代理人——通常是父亲、兄弟或儿子——来规范女性与更广泛共同体的交往，尤其是在任何财产交易中。如无男性亲属，则由国王承担此责——而且无疑会借此机会干预家庭事务。他宣称：“凡依伦巴德人之法居住于我国管辖范围内的自由女性，均不得处于自身的法律支配之下……而应始终处于某个男子或国王的支配之下。女性亦不得在拥有其对之享有mundium者［即对其享有法律管辖权者］同意的情况下，让与或转让其任何动产或不动产。”<sup class=\"fn\" data-note=\"4:9\">9</sup> 尽管罗塔里使早期伦巴德意大利的女性承受了比其他任何地方都更重的法律无能力，但存世的八世纪早期文书表明，他的立法并未使伦巴德女性完全陷于被动。在实践中，她们保有比法律条文所示可能的更大的行动自由，对自己的地产也握有更多的控制权。与其他早期中世纪立法者一样，罗塔里视女性的地位为在保护她们的幌子下扩张自身权力范围的机会：女性事务为王家干预提供了有用的借口。孤立地看，罗塔里《敕令》或许会让人以为僵化的性别区分渗透于伦巴德女性生活的方方面面。但置于文书证据所呈现的更为细致的图景之中，它再次提醒我们：法律是对意识形态的宣告，而非对社会现实的描述。</p>\n<p>当我们转向农民劳动时，规范与实践之间出现了类似的落差。教会将星期日定为休息日的努力始于六世纪末；随着规定逐渐具体化，其中纳入了关于男女角色不同但互补的明确表述。这些努力的顶点是查理曼那被频繁抄录的宣告：</p>\n<p>主日不得从事体力劳动——即男子不得从事乡村劳作：不得耕作葡萄园、犁地、收割、割晒干草、修筑篱笆、开垦荒地、伐木、采石、建造房屋或从事园艺……女子不得从事纺织工作，不得裁衣、缝纫或刺绣；不得梳理羊毛、捶打亚麻、当众浣洗衣物或剪羊毛，以便主日的尊荣［敬重］与安宁得以在各方面得到维护。<sup class=\"fn\" data-note=\"4:10\">10</sup></p>\n<p>尽管女性与纺织生产的一切环节——无论以羊毛还是亚麻为原料——的关联在中世纪早期欧洲各地均得到证实，但在实践中，农活的分工因地方传统和不断变化的技术而异。在有些地方，制作面包是男子的事，在另一些地方则是女子的事；而凡是为磨谷而修建村用水磨之处，家用石磨的废弃必将影响家务劳动的分配。同样，收获在某些庄园似乎是男子的工作，但在另一些庄园，女子也下田劳作，有时还被明确指派捆扎麦束并将其堆成麦垛。因此，乡村劳动在实践中是有性别之分的，但既非僵化不变，也非整齐划一。</p>\n<p>即便是罗塔里和查理曼这样有权势的中世纪早期君主，也无法使社会现实与规范性准则完全一致。在实践中，女性的生活往往处于意识形态与习俗的夹缝之中。我们将看到，这一鸿沟往往相当可观，对一些人意味着脆弱，对另一些人则意味着机会。那么，基督教的传播在多大程度上影响了这一切？指陈其制度性后果是容易的：对独身生活的推崇颠倒了世俗的男女行为规范；为男性与女性生命周期的某些或全部阶段提供了修道院的替代选择；使男性对神圣权力的独占在司铎圣职中正式化。即将 discussed 的婚姻性质的变迁也与此相关。然而同样重要的是，基督教与罗马文学遗产的互动使根深蒂固的刻板印象重新焕发活力，而育识字率的提升为原本不识字的社群提供了一种表达偏见的新途径。教皇格里高利一世曾评论说：“『男人』(man)一词指的是任何意志坚定、有判断力的人，而『女人』(woman)则指心智软弱、缺乏判断力者”，这番话便是典型代表。<sup class=\"fn\" data-note=\"4:11\">11</sup> 他做出此番评论的那部鸿篇巨制被中世纪的抄写员大量抄录，现存抄本约有五百部，使得这一警句获得了持久性和普遍性，掩盖了它的本来来源。实际上，这一评论不过是在重复罗马传统中的老生常谈。</p>\n<p>塞维利亚的伊西多尔是我们了解这些老生常谈的最佳向导。他借助一种在翻译中失落的拉丁语双关，将古人对男女特质的传统看法概括如下：</p>\n<p>男人[vir]之所以得名，是因为他比女人更有力量[vis]，因此“勇德”[virtus——该词既指体力也指道德正直]一词亦由此而来；或者说，因为他以力量统治女人。而女人[mulier]则得名于柔弱[mollities]，仿佛把“更柔软”[mollier]改一个字母、去掉一个字母便成了“女人”[mulier]。二者在身体的强弱上互有差异：男人的力量最强，女人的力量较弱，因此她应当服从于男人。<sup class=\"fn\" data-note=\"4:12\">12</sup></p>\n<p>伊西多尔教导中世纪早期的读者，要把人体视为道德品性的关键，正如古典伦理学所做的。既然女人比男人更柔软、更弱，她们的道德力量便不及男人——因此她们要服从男人。</p>\n<p>这一立场通过将男女之间的道德差异论证为自然生理差异的结果而发挥作用。而且，从基督教的视角来看，整个自然界都是神的造物，古代思想便很容易被移植到基督教框架之中。社会分化和性别秩序同样源自上帝与“自然”。米兰主教安布罗斯（374–397年在任）围绕一连串圣经引文展开论述，宣称：</p>\n<p>经上这样写道：“妇女不可穿戴男子所穿戴的，男子也不可穿妇女的衣服，因为这样行的是耶和华你神所憎恶的。”倘若细想便会明白，凡是天性本身所厌恶的，便是不和谐的。男人为何不愿以他生来的样子示人？为何要装扮成陌生的模样？男人为何要佯装成女人，而你，女人，又要佯装成男人？自然为两性各自披上了属于自己的衣装。男女在习惯、肤色、举止、步态、力量和声音上都各不相同。其他动物物种中亦是如此：雄狮与母狮外形不同，力量不同，声音也不同……雄孔雀美丽，雌孔雀却没有同样华丽的羽衣。……它们从不改变自己的外形，不是吗？我们又为何要改变自己的呢？</p>\n<p>……</p>\n<p>但我认为，与其说在于衣着，不如说在于举止、习性和行为，男应有男之为宜，女应有女之为宜。因此，作为[神圣]律法的解释者，使徒保罗说：“妇女在会中要闭口不言，因为不准她们说话。她们总要顺服，正如律法所说的。她们若要学什么，可以在家里问自己的丈夫。”又说：“女人要沉静学道，一味地顺服。我不许女人讲道，也不许她辖管男人，只要沉静。”男人做女人的活计是多么可憎啊！<sup class=\"fn\" data-note=\"4:13\">13</sup></p>\n<p>安布罗斯巧妙地将神的诫命与动物世界混为一谈，以此论证衣着与行为上的性别区分不容变通。他与伊西多尔的话语在中世纪早期回响不绝，被众多读者抄录或引用。从古代晚期的基督教作家那里，早期中世纪的学者继承了一套现成的规范性性别关系观念，颠覆这套观念便会威胁神圣秩序，而他们也认为没有什么必要进一步发展它。</p>\n<p>但现实生活并不像早期中世纪的道德家们所希望的那样简单分明。有一年春天，神圣的欧里亚克的热拉尔（约855年生，909年卒）遇到一个正在犁地的女人。被问及为何要做这种“男人的活计”时，她解释说丈夫久病在身，她若不播种，便无人代劳。热拉尔的回应是给了她足够的钱雇一个劳工完成这项工作。然而，为他作传的克吕尼修道院院长奥多（927–942年在任）深谙安布罗斯的著作，并从这个故事中提炼出寓意。“正如安布罗斯所说，天性逃避一切人为造作，而自然的创造者上帝憎恶一切违背自然之事。”<sup class=\"fn\" data-note=\"4:14\">14</sup> 一个农妇的困境给了虔诚的基督徒一次施舍的机会；而一位修道院的道德家则向读者呈现了一个神圣钦定的性别秩序得以恢复的故事。</p>\n<p>诉诸“自然”是中世纪早期乃至其后数百年间教士作者们常用的修辞性性别把戏之一。另一种，我们将会看到，是在文本中不向读者或听众说出女人的名字，因为匿名会抹除身份。诉诸这类文字花招的人无疑是出于习惯势力。但这种习惯本身极具启示意义——它揭示了对女性边缘性、软弱性或劣等性的根深蒂固的预设。作为强大的文化反射，女性天性柔弱的观念服务于多种目的——政治的、法律的、宗教的、文学的。它既能助长剥削，也能促进保护；既可随意用来赞誉，也可随意用来诋毁。它使名声与美誉难以获得而易于失去。最重要的是，它强化了年龄、等级或财富等其他社会差异，使得那些确实凭借各种手段在世上闯出一条路来的女性，始终处于易受伤害的境地，被困在一张并非由自己编织的意义之网中。</p>\n<h2 id=\"ch6-s1\">生育的结合</h2>\n<p>性伴侣关系对人类社会的繁衍至关重要，不仅是生育的手段，还因为由父母与子女构成的亲密群体正是文化预设与价值观代际相传最常见的形式。然而，不加限定地谈论中世纪早期的“婚姻”过于简单化。这个词不足以完整描述男女自行结成的各种被认可的性伴侣关系。到千年之交，某种与我们现代婚姻观念——即一男一女之间持久的结合关系——可辨识地相似的婚姻形态已在欧洲部分地区形成，但并非没有争议。对这些问题的考察将阐明性别关系的社会组织，并引领我们深入早期中世纪性道德观念的核心。在上一章亲属关系讨论的基础上，本章将进一步审视男女经验的其他形态。</p>\n<p>然而，在早期中世纪文化多样性的底层，存在着一种持久而普遍的不平衡。女性获得的法律权利或经济资源越少，她就越处于较高地位男性的性支配之下：各地精英男性都可按自己的条件与地位低下的女性发生性关系。这些非正式的私情与那些用以传递财产和文化价值的伴侣关系无关，也与正式伴侣关系所能带来的情感纽带和家族认同无关；因此它们在史料中很少显露踪迹。由于缺乏政治意义或意识形态价值，这类关系很少进入法学家和立法者的视野，而后者所构建的社会关系模式在婚姻与性行为方面——正如在其他许多方面一样——表达着占主导地位的价值观。</p>\n<p>在上一章概述的三种法律文化中，继承下来的罗马传统是我们的出发点，因为它被证明是最根本的。罗马法承认两种互相排斥的性伴侣形式：纳妾与婚姻。前者不涉及任何财产交易，只是高地位男性与地位远为低下的女性之间被承认的长期性伴侣关系；妾所生的子女不享有任何继承权。纳妾是婚姻的替代而非附属，是未婚的年轻男子或不愿再婚的鳏夫的性出路。按照罗马法的界定，婚姻要求夫妻地位平等，需要婚约、双方的正式同意，以及新娘父母对新婚夫妇的嫁资。由此，男性的继承人便被限定为只有妻子所生的子女。四五世纪的帝国立法史无前例地强调婚姻是持久的伴侣关系，只有在配偶一方犯下盗墓亵渎之罪、施行巫术，或妻子与人通奸的情况下方可解除。尽管被理想化为建立在相互爱慕与尊重基础上的自愿伴侣关系，这些法律条文在整个地中海地区的中世纪早期西方一直沿用。我们将看到，这些规定还影响了一代代主教的观点，从而左右了整个中世纪的教会学说。</p>\n<p>在这一晚期罗马世界中，讲日耳曼语的移民在婚姻和亲属关系方面都引入了颇为不同的价值观与习俗。值得注意的是，与罗马法的单一界定相反，成文法和社会习俗都承认数种婚姻类型。其中只有一种涉及财产转让并由此产生继承权。新郎的家庭通常要向新娘的父亲支付聘金，新郎还会在完婚次日追加一份“晨礼”。此外，最迟到九世纪，新郎在订婚时从自己的财产中指定一份婚姻赠与已成为惯例。新娘尤其是当她们没有兄弟时，也可以将继承自父母的财产带入婚姻。这份婚事由心怀期望的新郎与女孩的父亲和亲属协商，并在亲友参与的公开仪式上庆贺，它是两个亲族群体之间的交易，不仅为新家庭提供资财，还可能缔结互利的政治联盟，甚至终结仇怨。因此，这种婚姻一般只能由男方解除，且会给双方带来严重的经济后果。<sup class=\"fn\" data-note=\"4:15\">15</sup> 这种第一类的结合被恰当地称为“配偶支配”，<sup class=\"fn\" data-note=\"4:15\">15</sup>它还有另外两个特征。第一，它还要求父亲将其对女儿的监护权移交给丈夫，使丈夫获得代表其法律利益并对其行使权威的权利。其次，新娘须迁居到丈夫的庄园，无论那里离她的娘家是近是远。就其财产交易的性质而言，这种伴侣关系是富有精英阶层的特征。</p>\n<p>另一种同样被认可、同样持久并有公开庆典的婚姻形式中，女子迁居男家并不伴随任何监护权的转让，即使她可能拥有自己的财产。男人们无须在这两种结合形式之间做选择：富人和权贵完全有能力供养不止一个女性，事实上，多重伴侣关系成为身份地位的象征，也是积累社会声望资源的一种方式。这类人中的一个便是莱茵兰富有而有影响力的地主、埃斯塔尔的丕平（约650年生，714年卒），据知他与三个女人生有儿子。他的两位同时并存的妻子普莱克特鲁德与阿尔派达都来自阿登地区势力强大的家族，尽管可能只有极为富有的普莱克特鲁德被移交给了丕平的监护之下。后来，她们的儿子们为争夺父亲的遗产而相争。关于丕平的第三位伴侣我们所知甚少，但她的名字不见于任何记载，她的儿子又被排除在丕平遗产的任何份额之外，这两点都强烈暗示这是一种远为非正式的伴侣关系。</p>\n<p>这篇简略的概述并未穷尽男性借吸引女性以争夺地位的所有方式，因为早期中世纪的法律汇编还承认一系列补充性的关系。女性可以在违背父母意愿的情况下被抢婚，也可以在她们自己甘愿配合的诱拐中被带走。虽然父母必须就失去女儿获得补偿，但这种结合仍然得到承认，并且可以通过其后的财产安排而变得更加正式。最后，在社会等级的底层，则由领主自行决定允许其奴隶和农奴之间缔结何种婚姻，以最适合高效庄园管理的需要。</p>\n<p>总而言之，日耳曼语族的后裔在融入后罗马行省生活的诸多其他方面之后，仍长期倾向于维持他们传统的性结合谱系。这些结合因其持久程度而有所区别；因女子从娘家亲族转入丈夫之家的方式而有所区别；因随附的财产交易（如果有的话）的性质而有所区别；还因对女子的法律权威与保护的安排而有所区别。虽然女孩是否有多少机会对拟议的婚约发表意见仍不得而知，但高地位男性无疑可以通过策略性婚姻增进自身利益，并在性满足和生育继承人方面找到充分的余地。当不莱梅的亚当（约1083年卒）在十一世纪末评论说，在瑞典人中间，“一个男子依其财力可同时拥有两三个乃至更多的妻子，富人和王侯则不限数目，而且他们也认为这种结合所生的儿子是合法的”，他不过是——或许略有夸张地——报告了一个延续数百年之久的模式：有权势的男性利用这些机会“囤积”女性，从而不仅确认自己对女性的优越地位，也确认自己对那些不那么成功的男性的优越。<sup class=\"fn\" data-note=\"4:16\">16</sup></p>\n<p>第三，我们应当回到爱尔兰，在那里，法学家的论著将基督教与晚期罗马婚姻法的要素与本土的……</p>\n<p>实践被用来界定各种类型的性结合。七八世纪的爱尔兰学者将九种“生育结合”加以分类，并按其尊贵程度由高到低排序。<sup class=\"fn\" data-note=\"4:17\">17</sup> 在最尊贵的结合形式中，女方亲属将女子交给新郎，新组建的家庭由丰厚的财产赠予支持。其中最重要的是双方亲属都出资并贡献牲畜的结合，由此确立新娘作为“共同权威之妻”的地位。<sup class=\"fn\" data-note=\"4:18\">18</sup> 较不利于提升地位的方式是，财产仅由男方或女方一方的亲属提供。这三种结合的构成要素是一份契约，用以规范财产条款及管理财产的责任划分。尽管此类契约内容复杂，但仍可解除。与其他早期中世纪文化不同，爱尔兰法律允许种类繁多的分居理由。至少在理论上，如果妻子背叛丈夫、损害他的名誉、持续通奸、杀死他们的子女，或疏于家务，丈夫便可以与她分离。如果丈夫阳痿、不育或是同性恋、肥胖到无法行房、散布关于妻子性表现的闲言碎语、纳妾、传播讽刺她的诗文，或者在行使训斥妻子的权利时出手打伤她致其留下伤痕，妻子也可以离开他。遗憾的是，我们缺乏能够揭示爱尔兰社会现实是否与这些理想化方案大体相符的证据。</p>\n<p>在爱尔兰的性结合等级中，其次是女方亲属接受但未积极参与谈判的那些结合。男子经女方父母同意在其家中与该女子“生育结合”，其形式化程度较低，尊贵程度也较低；更不体面的是女子随男子私奔——既无亲属参与亦无亲属同意——或男子偷偷与她相会。等级最末的是女子本人未曾同意的“生育结合”（即强奸），或两个精神失常者的结合。所有这些规定都可能对财产分配产生重要影响，因为只有当女方的亲属不承认该结合时，这种联盟所生之子才丧失从父亲那里继承的权利，但若父亲选择承认他们，这些儿子仍可继承。</p>\n<p>这种关系谱系比在继承诸王国中更容易容许多重并存的性关系，因为爱尔兰法区分了“正妻”与地位较低的诸妻。<sup class=\"fn\" data-note=\"4:19\">19</sup> “正妻”缔结了其亲属充分参与的婚约，这一婚约使她与夫家而非娘家的关系更为紧密。因此她受丈夫支配，其法律责任的三分之二由她的儿子承担，仅三分之一由娘家亲属承担；她的儿子与她的亲属按同等比例继承她的财产。而其他妻子在法律责任方面则大部分或完全留在娘家亲属之内，并且仅享有正妻一半的地位与权利。对一位地位显赫的男子而言，拥有一位正妻，再娶第二位妻子（在此附加结合的头三天里，正妻有权对她施加非致命的伤害），同时还探访一位或多位居于娘家的女子，是完全可接受的做法。面对基督教教士的非议，爱尔兰法学家转向《旧约》为传统习惯辩护。“爱尔兰法中存在争议：多重性结合与单一性结合何者更为正当？因为上帝的选民曾生活在多重结合之中，故谴责它并不比赞美它更容易。”<sup class=\"fn\" data-note=\"4:20\">20</sup> 对于负担得起的人来说，多重性伴侣关系是常态。</p>\n<p>在爱尔兰及其他地方，谴责多重结合的是教士。基督教婚姻学说牢牢建立于晚期罗马帝国的实践之上，正如教皇大良（440—461年在位）的一项裁决所概括的：合法婚姻是自由男子与门第相当的自由女子之间的结合，须由女方亲属通过正式订婚将她交付男方，缔结的婚姻须有财产资助并公开庆祝。大良的观点——“并非每个与男子结合的女子都是‘妻子’，正如并非每个儿子都是其父的继承人”——主张在两种女子之间作出区分：一种是罗马财产法所承认的唯一性结合形式即婚姻中的伴侣，另一种则处于任何其他形式的性关系之中，如妾或情妇。<sup class=\"fn\" data-note=\"4:21\">21</sup> 在这一源自罗马的法律定义之上，四五世纪的道德家又加上了浓厚的、主要基于《新约》的严格性伦理。大数人保罗（卒于约65年）宣告：“倘若不能自制，男子当各有自己的妻子，女子当各有自己的丈夫”；又说：“你们岂不知不义的人不能承受神的国吗？不要自欺：无论是淫乱的、拜偶像的、奸淫的、作娈童的、亲男色的、偷窃的、贪婪的、醉酒的、辱骂的、勒索的，都不能承受神的国。”诸如此类的宣告成为基督教男女节欲道德的基础，这一道德将异性婚姻承认为唯一合法的、可以发生性交的关系。<sup class=\"fn\" data-note=\"4:22\">22</sup> 由教士宣讲的这种罗马法律前提与毫不妥协的基督教道德的结合，冲击了各地的本土习俗。</p>\n<p>然而，教会的意见在多大程度上改变了社会实践？在爱尔兰，指女子非法性交的拉丁词adultrix为古爱尔兰语中“次妻”一词adaltrach提供了来源。然而，词汇的借用绝不意味着多重性伴侣关系的终结。将博学的诗人、教士和法官阶层限制为仅有一妻的种种尝试是否成功已无从查考，而“领主、诗人和平民皆因非法同居而受损害”的观点似乎收效甚微。<sup class=\"fn\" data-note=\"4:23\">23</sup> 系谱资料确凿地表明，多重伴侣关系至少在诸王之中依然常见，而当成体系的大陆高调教士改革于十二世纪全面抵达爱尔兰时，改革者们对其在当地发现的婚姻习俗进行了猛烈的谴责。<sup class=\"fn\" data-note=\"4:24\">24</sup></p>\n<p>在爱尔兰之外，本土习惯与教会的期望同样存在分歧，七世纪一个名叫巴龙图斯的男子的经历便说明了这一点。他是来自法国中部隆雷的贵族，决定以僧侣身份度过余生。进入当地修道院后，他参与每日的祈祷与诵诗。随后，据记载，他在678/9年经历了一次濒死体验。当他完全恢复知觉后，他讲述了自己如何被魔鬼押着灵魂游历天堂与地狱。在天堂的一重门前，使徒彼得问众魔鬼对巴龙图斯有何指控。“他们答道：‘他有过三个妻子，这是不被允许的。他还犯下了其他通奸行为以及许多我们诱使他犯下的其他罪。’”<sup class=\"fn\" data-note=\"4:25\">25</sup> 在退隐修道院之前，巴龙图斯的行为与他同时代的埃尔斯特尔的丕平并无二致。区别只在于，我们是从一位持批判态度的修道院作者的角度得知巴龙图斯的多重婚姻，从这位作者崇高的道德制高点来看，富人的寻常行为俨然是魔鬼的作为。</p>\n<p>然而，幻象文学并非唯一的谴责手段，老年男子也并非唯一的目标。当教会的不满指向国王时，利害关系便极为重大，因为王朝继承可能因此受到威胁。“当知这些孩子永不能执掌王权，因他们是在罪恶中受孕的”——爱尔兰苦修士科伦巴努斯于610年如此预言，猛烈抨击墨洛温王朝国王提乌德里克二世（596—613年在位）的婚姻习惯。<sup class=\"fn\" data-note=\"4:26\">26</sup> 高卢的许多墨洛温国王，包括提乌德里克在内，都拥有多个性伴侣，并承认其大部分乃至全部儿子为继承人。像科伦巴努斯那样敢于批评的人，矛头所向的正是那些有助于王朝延续的做法。</p>\n<p>在八九世纪，利害关系进一步升级，当时意大利和法兰克地区的主教会议发起了一场协调一致的运动，以重新定义婚姻并将其确立为一种宗教的、神圣的事业。从721年罗马的一次宗教会议开始，教会会议逐渐在大良的观念之上增加了三项内容：强调婚姻的永久性与不可解除性；拒绝容许同时存在多于一段的性关系；以及对乱伦禁忌婚姻远为宽泛的定义。在此背景下，主教们极力主张，通过洗礼建立的灵魂亲属关系和通过婚姻产生的姻亲关系均构成婚姻障碍。教父、教兄弟姐妹、共同父母以及一切姻亲由此都落入这个庞大的禁婚对象之列。此外，一些主教还试图强加一项额外的限制条件——血缘禁忌一直上溯至七代以内的共同祖先，远远超出了广为接受的四代限度。</p>\n<p>某些加洛林教士为何要将乱伦关系的圈子扩展到如此极端的地步，至今仍有争议，尤其是因为没有证据表明近亲通婚在八世纪中叶之前普遍存在，更遑论成为常态。无论其深层动机如何，结果是在721年起的一个半世纪里，婚姻及各类性关系以一种新的方式被政治化了。这主要有两个原因。其一，到八世纪后期，善治意味着促进基督教行为规范。<sup class=\"fn\" data-note=\"4:27\">27</sup> 因此查理曼及其继承者支持教会推行修订后的婚姻道德的努力，同时却也发现自身的性行为与婚姻联盟被置于新的审视之下。事实上，正如洛泰尔二世（855—869年在位）付出惨重代价所发现的那样，主教们可以反过来利用这些禁令对付国王，使其后嗣断绝。其二，在国王寝榻政治这一直接语境之外，主教们若要与统治者结盟，才是改变婚姻习俗的唯一真正机会：他们因此把一件有效武器交到了狡黠的国王手中，使国王得以对其势力强大的臣属施加控制。</p>\n<p>860年法兰克主教会议处理的一桩案件，使我们得以罕见地一窥订婚与婚姻所牵涉的社会复杂性、情感纠葛以及相互冲突的政治利益。此案涉及奥弗涅伯爵斯蒂芬，事发的阿基坦正是他的君主秃头查理苦于难以建立稳定忠诚政权之地。此事被称为“对教会之极大丑闻、对王国之严重损害”。用斯蒂芬自己的话说：“在年少轻狂之时，如习俗所然，我与一名年轻女子发生了关系。”随后，大约在857年，“经我的家人与朋友同意”，他与阿基坦另一位显赫伯爵雷吉蒙德谈判，获准娶后者的女儿为妻。双方就斯蒂芬将提供的婚姻财产赠予达成协议，两人正式订婚。但在雷吉蒙德公开交付其女儿之前、亦即斯蒂芬完成财产转移之前，斯蒂芬发现自己的未婚妻与他先前的性伴侣有亲缘关系。他随即咨询了自己的司铎，后者告知他所提议的婚姻将属乱伦，因而为教法所禁。斯蒂芬随后试图退出婚约，激起了国王与雷吉蒙德双方的震怒。由于害怕遭到放逐与倾覆，斯蒂芬感到“为形势所迫”，不得不在公开仪式上娶雷吉蒙德之女为妻，并交付原本为她准备的赠予财产。但他仍拒绝圆房，而他的顽固使他与雷吉蒙德的对抗愈演愈烈。雷吉蒙德因女儿所受的对待而愤怒并深感羞辱，最终于860年向主教们提出控诉。<sup class=\"fn\" data-note=\"4:28\">28</sup></p>\n<p>面对这桩牵涉荣誉、财产、契约义务、性及叛乱倾向的复杂案件，会议裁定此案应同时由两个法庭审理：一个是由国王主持的世俗会议，处理财产与政治问题；另一个是由斯蒂芬与雷吉蒙德产业所在两省的大主教领导的教会会议，处理婚姻的性质问题。会议还责成兰斯大主教欣克马尔（845—882年在任）就此案准备一份报告。欣克马尔是整个中世纪最活跃的精通法律的 bishop 之一，而在此事上，一如在许多其他事务上，他同时也是秃头查理的代理人。大主教们的裁决未能留存下来，因此我们无从得知最终结果。但倘若他们听从了欣克马尔的建议，其解决方案对斯蒂芬和雷吉蒙德而言将是一个保全颜面的方案，却极少顾及那位不受欢迎的新娘的福祉——简报甚至懒得提及她的名字。欣克马尔关注的并非婚外之性，而是婚内之性。他建议省教会人士讯问那位女子：如果婚姻确已圆房，那它便属乱伦，因而无效；但由于圆房是完成婚姻的必要条件，若两人未曾性交，它便不是一桩正当的婚姻。无论哪种情形，斯蒂芬都获解脱，而王室会议则必须处理被撕毁的婚约、对雷吉蒙德的侮辱以及政治动荡的威胁。</p>\n<p>斯蒂芬为何如此行事？他声称是害怕丢面子并招致国王震怒，但其中似乎另有隐情。他可能是近来针对与先前性伴侣有亲缘关系者结婚的严厉禁令的无辜受害者，也可能是狡猾地操纵法律，以摆脱一桩在政治上已不再有利的婚姻联盟。无论实情如何，秃头查理对阿基坦的控制已成了问题。无论我们如何评判斯蒂芬的行为，这样的冲突在一个世纪之前几乎是难以想象的。无论这个故事讲的是一个倒霉的受害者还是一位机敏的阴谋家，此案都至关重要。</p>\n<p>以下几个原因。首先，它提醒我们精英婚姻作为政治谈判手段的重要性。其次，在一个通常把适婚少女当作棋子而非主动策略家的社会中，女性的意见和福祉无足轻重。事实上，对辛克马尔而言，这些与她的名字一样无足轻重。第三，它证明了亲属关系定义被重新表述，以服务于一种不断变化的性伦理和婚姻伦理。</p>\n<p>最后，奥弗涅的斯蒂芬是一位地位显赫的人物，是国王扈从中的一员，这并非巧合。他的显赫地位使他的婚姻伎俩暴露在宫廷主教们和一位急于寻找任何手段来控制其追随者的国王的审视目光之下。在远南方，比利牛斯山之外，与他同时代的加泰罗尼亚人、恩普里亚斯伯爵德拉（862–94）娶了他的堂姑母基克西洛娜，即他父亲的兄弟的女儿。堂表亲联姻是九世纪晚期和十世纪初加泰罗尼亚伯爵们的常态，因为它强化了家族对权力的掌控。如果加洛林宫廷的主教们知晓此事，或许会感到不安——但加泰罗尼亚从未与加洛林权力中心保持密切接触，而且到九世纪晚期，它正迅速失去与北方土地的一切联系。当加泰罗尼亚伯爵们在十世纪中叶开始到更远的地方寻找新娘时，那是出于政治利益的考量，而非任何道德压力的结果。同样，在威塞克斯，长者国王爱德华（899–924）通过娶他的堂兄弟兼对手埃塞尔海姆的女儿埃尔弗莱德来确保自己的王位继承权。此后又过了大约五十年，加洛林关于近亲婚姻是不可逾越的婚姻障碍的观念才开始改变英格兰的做法。而且之所以如此，只是因为十世纪晚期的盎格鲁-撒克逊诸国王发现，支持那些熟悉严苛的大陆理想的道德化主教，具有战略性的政治利益。实际上，加洛林对婚姻的重新界定——不可解除、排除任何其他同时存在的性伴侣关系、禁止至少四代以内的亲属之间通婚——只有在国王与教会的全部资源联合起来力图强制推行时，才开始影响人们的行为。</p>\n<p>在加洛林权限范围之外，或者在缺乏变革意志和手段的地方，婚姻的定义长期以来保持着更大的灵活性。斯堪的纳维亚便是一个例子，不来梅的亚当为我们提供了可靠的记载。<sup class=\"fn\" data-note=\"4:29\">29</sup> 丹麦人克努特于1016年征服英格兰并夺取王位，此后不久又登上丹麦王位：他同时拥有两位妻子——埃尔fgifu和艾玛——维持了较古老的斯堪的纳维亚方式，却仍然屈从于教会人员的压力，立法对那些与近亲结婚或不把性行为局限于婚姻之内的盎格鲁-撒克逊人处以罚金。在更遥远的地方，完全超出加洛林影响范围之外，爱尔兰直到十一世纪末都未受大陆规范的影响。事实上，一位作为父亲唯一继承人的爱尔兰女子很可能被嫁给其最近的男性亲属，恰恰是为了防止她的财产流出亲族；而且，尽管口头上尊奉教父关于四代以内禁止通婚的禁令，爱尔兰教士们显然承认女继承人需要堂表亲联姻。</p>\n<p>要改变婚姻习俗，既需要政治上的坚持，也需要强势的国王与主教协同行动时的一致规范。但在加洛林道德说教的高潮过后很长一段时间里，这种联盟和行动的意愿都不太明显。相反，至少在政治精英阶层中，婚姻长期以来一直是政治需要与分歧规范之间的一种不安平衡，只是偶尔被个人道德所调和。一个发生在本时期末尾的中世纪早期动人爱情故事凸显了这些矛盾。哈默尔施泰因伯爵奥托和他的妻子伊尔门加德有远亲关系——伊尔门加德的曾祖父母是奥托的高祖父母。他们长久的婚姻被中断了，因为心怀报复之心的德意志皇帝亨利二世（1002–24）害怕奥托成为一个权势过大的臣属，决意毁灭他。亨利通过鼓励德意志主教们重新兴起道德严苛之风来实现这一目的，其中一些主教正试图为九世纪提出的以七代来界定乱伦的方案注入新的力量。1018年，亨利二世主持了一次教会会议，将这对夫妇绝罚并命令他们分居。然而，奥托“燃烧着盲目的爱”，仍与伊尔门加德在一起，并于1020年袭击了他主要的教会对手美因茨大主教。<sup class=\"fn\" data-note=\"4:30\">30</sup> 亨利二世进行报复，围攻奥托在哈默尔施泰因的城堡，将其夷为平地，然后夺取了奥托全部广袤的土地。这对夫妇仍然相依不离，直到1023年，另一次教会会议再次对他们作出不利裁决。奥托因畏惧皇帝而终于屈服，但伊尔门加德依然不从。德意志主教们拒绝让她向教皇申诉，她却于1023年动身前往罗马，并成功地为她的案件进行了申辩。本笃八世（1012–24）确认了她婚姻的有效性，并谴责那些宣告其婚姻无效的德意志主教，因这一干预而引发了一场抗议风暴。次年，国王和教皇双双去世，这场争议也随之消散：奥托和伊尔门加德维持了婚姻，并受到新国王康拉德二世的恩宠，而康拉德本人的婚姻曾招致教士们的强烈批评。</p>\n<p>奥托和伊尔门加德的磨难揭示了公元千年之交婚姻的许多情况。首先，他们本人接受婚姻是永久性和一夫一妻制的，表明了在中世纪早期欧洲大部分地区于基督教影响下发生的漫长而缓慢的社会观念转变。他们体现了教会教导所提倡的理想：婚姻是平等者之间的排他性伴侣关系。其次，尽管在婚姻应缔结于毫无亲缘关系的伴侣之间这一原则上存在共识，但关于亲属关系的界限应设在哪里，不确定性依然存在。第三，国王、主教和教皇争夺仲裁婚姻的权利。一种独特的婚姻观念发轫于加洛林道德理想主义的蓬勃时代，其前提对关于可容忍的性伴侣关系的性质和数量的地方惯例，以及对女性抚养其子女的社会单位，都具有巨大的影响。这一观念有时通过王室颁布得以强化，凡是加洛林教会立法手册被抄写之处便传播开来，主要在大陆，到十世纪晚期也传入英格兰。但是，正如我们所见，这一观念的形成是一回事，其贯彻实施则完全是另一回事，而在1050年之后的很长一段时间里，将愿望变为现实的努力仍然是断断续续、争议重重且前后不一的。</p>\n<h2 id=\"ch6-s2\">女性、家庭与继承</h2>\n<p>如果说婚姻长期以来更多地是一件政治事务而非基督教道德事务，那是因为它所牵涉的远不止是对性行为的规范。至少，妻子和儿媳进入一个男人的家中，扩大了女性劳动力的储备——即各社会阶层的女性倾注精力的纺纱、织布、缝纫、刺绣，以及奴隶和农妇所从事的食物准备和其他工作。在精英阶层中，婚姻还涉及对家族财产的保存、分配和增殖的盘算，以便安排其在代际之间的处置。有了土地，便有了生存的手段，而对于所有高于仅能维持生计的小农的财产所有者来说，也有了产生盈余的可能。下一章将强调对土地财产的权利如何开启通向地位、政治权力和影响之路；此处则聚焦于作为协商性别差异手段的祖产继承。本节的分析认为，虽然资源在继承人之间的分配强化了男性和女性在财富、影响力和权力获取上的差异，但女性获得财产的途径对于中世纪早期的家族互动仍然至关重要。</p>\n<p>中世纪早期的继承习俗受政治压力、教会意见、不断演变的地方法律程序以及变化中的家族观念的影响，各地差异极大。然而，尽管存在广泛的地域和时间上的差异，一些总体要点是清楚的。第一，性伴侣关系将财产（动产和土地）从父母传给子女，而继承权通常与父母伴侣关系的性质密切相关。在早期爱尔兰，正式且公开承认的结合所生的儿子比非正式结合所生的儿子对父亲财产拥有更大的权利；在其他地方，不断发展的基督教婚姻观念强化了一个男子与其妻子所生子女相对于非正式结合所生子女的继承权。第二，继承土地的正常模式不同于继承诸如牲畜、奴隶或珠宝等动产的模式，而继承政治职位的程序可能又有所不同。第三，父母的财产原则上是可以分割的——换言之，由部分或全部子女共享，尽管份额通常不均。然而，到十一世纪，随着家族和身份观念的继续演变，一些家族开始发展出将大部分或全部祖产传给单一儿子的策略。第四，财产由一代向下一代的传承，很少只是父母与子女双方的事务。国王们密切关注，急于寻找干预的借口；而且，除罗马财产法持续存在的地方外，更广泛的亲族群体也参与其中。因此，本节的讨论将男性与女性置于其亲属之中加以考察，同时也关注他们生活于其中的更广泛的政治环境。最后，也是最根本的一点：男性继承土地的权利是所有中世纪早期文化的共同特征之一；而另一方面，女性获得家族祖产的途径则因地区和世代而有很大差异。通过考察女性相对于其兄弟在土地获取上的差异，一种具有重大政治意义的性别模式便浮现出来。</p>\n<p>确认继承策略不可避免地依赖于存世的文献。在此背景下，重申前文提到的几点是切题的。一方面，法典中阐述的关于财产传承的规范并不是人们实际行为的充分指南：要了解这一点，我们必须将其与记录具体、有名有姓的地产转让的文献并列考察，如捐赠特许状、遗嘱和遗赠。此外，不仅文书意识的程度因地区而异，而且文献保存率在某些地方也远比其他地方好。最后要记住的一点是，起源于罗马的遗嘱 practices 在北欧的逐渐采用，这些做法影响了财产所有权的传承和记录方法。<sup class=\"fn\" data-note=\"4:31\">31</sup> 总体而言，详细记载土地转让的记录，通常只有在意大利和法兰克地区的七世纪晚期以后、西班牙北部的九世纪晚期、英格兰的十世纪中叶以后，以及其他地方更晚的时期，才有相当数量的存世。</p>\n<p>尽管如此，我们仍可以勾勒出继承习俗中一些最明显的地区差异。如往常一样，两个极端是一方面的爱尔兰，和另一方面的欧洲大陆南部持久保留罗马传统的地区。在爱尔兰，父系土地在所有被承认的儿子之间平均分配，但女儿有权获得动产的均等份额，尤其是奴隶和牲畜。如果一个男人去世时只留下女儿而无儿子，她可能对其地产享有终身权益，但在她死后，财产将归还给她父系的男性亲属。这些习俗运作于一种强调土地属于四代亲族群体（称为derbfine）的文化之中，在这种文化中，土地脱离derbfine而让渡是不被鼓励且难以实现的。女性继承将对亲族群体及其土地构成威胁，因为被承认的儿子属于其父亲的derbfine而非母亲的：如果一名女子继承了土地并将其传给她的儿子，土地就会从一个derbfine转移到另一个。这就是为什么女继承人会受到压力，被迫嫁给其父亲最近的男性亲属。<sup class=\"fn\" data-note=\"4:32\">32</sup> 相比之下，五、六世纪的罗马财产法建立在两个截然不同的原则之上，这些原则在整个中世纪早期乃至更久之后都保持不变。首先，土地只能由个人完全和绝对地拥有：不存在对土地的任何集体利益或权利的概念。其次，晚期罗马帝国的法律基于这样一种假设：在无遗嘱继承的情况下，女儿有权与其兄弟享有平等的继承权。总体而言，罗马法对女性不受任何监护人约束而完全控制和自由处置财产，没有设置任何法律障碍。在诸如意大利南部的卡拉布里亚和卢卡尼亚，或法国南部的阿基坦和普罗旺斯等罗马习俗贯穿整个中世纪早期的地区，女性获得财产的权利原则上赋予了她们相当程度的经济独立，这在早期爱尔兰是完全不可想象的。</p>\n<p>那么，在爱尔兰和意大利南部之间的那些地区，换言之，在日耳曼语系的定居者及其后裔坚持自身习俗的诸王国中，情况又如何呢？在这里，重要的是要承认各地存在广泛的差异，但也有两个重要的共同因素。首先，私人个人财产所有权与亲族的利益相互平衡，亲族可能希望主张财产，或在所有者欲向任何人出售或捐赠土地时须征询他们的意见。</p>\n<p>除了自己的后代之外。其次，这些传统明显地优先将土地传给男性继承人，只有在缺少儿子的情况下，才普遍承认女儿或姐妹的继承权。八世纪中叶编纂的图林根法典对女性拥有土地的敌意甚于任何其他法典，明确规定：在没有儿子的情况下，财产将归父亲最近的男性亲属。图林根法典还有一大用处：它比任何其他法典都更明确地规定了动产与土地截然不同的传承途径——它规定，尽管土地归父亲最近的男性亲属，但牲畜和奴隶则归女儿们所有，而女儿们同时也是母亲衣物、首饰和个人饰品继承人。</p>\n<p>然而，为继承订立成文规则、为确认个别土地交易而制作文书，这两者都是从罗马传统中采纳的做法。其结果是，从书面记录最早使我们得以一窥后帝国时代诸王国继承策略之时起，这些策略就已经带上了罗马规范的印记。这一趋势在七、八、九世纪才逐渐加强。北意大利的伦巴德王国是一个格外清晰的例证：在罗马邻人习俗的强大压力下，伦巴德妇女的继承权发生了显著变化；到八世纪末，伦巴德女儿继承父亲一部分财产的机会远大于生活在罗塔里统治下的前辈。实际上，只要文书材料尚存、能够揭示财产交易的具体细节，在诸继承王国中，妇女都既能且确实继承了土地和动产。</p>\n<p>然而，这并不是说妇女获得财产的机会曾与男子同等或同样稳固。相反，她们的权利始终有限、不稳固，且容易受到质疑。尽管统计推断在前中世纪素来不可靠，但几个粗略的估算有助于聚焦本讨论。有人乐观地提出，罗马晚期的妇女可能拥有帝国全部土地财产的30%至45%。诚然，这几乎只是猜测，但可以将其与后世几个世纪由不同类型材料得出的数字相对照。首先，对欧洲大陆自八世纪起特许状的分析表明，妇女获得土地的机会存在显著的地区差异。在罗马法律传统影响仍然强大的地区，妇女可能控制着大量土地——十世纪西班牙北部约为17%，相邻的法国南部地区约为13%。在卢瓦尔河以北、德意志以及伦巴德意大利，妇女拥有不足10%、很可能不足5%的土地。就英格兰而言，证据类型颇为不同：这是为征服者威廉（1066–1087年在位）编制的全国土地清册《末日审判书》。《末日审判书》除了报告1086年的土地持有状况外，还记载了“爱德华国王生而复死之日”（即1066年）盎格鲁-撒克逊英格兰的土地所有权格局，为诺曼征服前夕的财产权利提供了一幅快照。盎格鲁-撒克逊习俗强烈偏好土地由男传男，总体而言，妇女的获得权是有条件的、受限制的。《末日审判书》记载，1066年英格兰全部土地中仅有约5%为妇女所有；而且有充分理由相信，到1066年，掌握在妇女手中的土地比公元1000年前后略有增加。这些数字——无论多么粗略地——表明：在法律文化和地方传统的影响之下，女性财产权利差异极大；即使就在最有利 于女性财产权利的地区作最乐观的估计，绝大部分土地仍处于男性的控制之下。</p>\n<p>获得土地财富不仅受到地方社会惯例或法律限制的制约。具体的家庭境况同样重要，对男女的影响可能一样大。首先，出身的偶然性或猝死的无常，甚至能使最精心规划的财产分配陷入混乱。肯特的王室总管阿巴（Abba）婚后无子。在833年至839年间，他立下一份遗嘱，为若干种可能的未来作了安排。“我的心愿是”，他开宗明义地说，“如果上帝赐我一子，他将在我之后继承这片土地，与我的妻子共同享用；同样，在他之后，只要上帝愿意，只要他的后裔中还有人有能力、有资格持有土地，他们应继续持有它。”但阿巴也设想过无子的晚年：“然而，如果我命中注定没有子女，那么我希望我的妻子在她的有生之年拥有它〔我的土地〕，只要她愿意不再改嫁而保有它。”<sup class=\"fn\" data-note=\"4:33\">33</sup> 另一种可能的未来是他的遗孀埃里吉丝（Heregyth）再婚。在这种情况下，土地将归还他自己的亲族，她只保留自己带入婚姻的财产。最后，他还为埃里吉丝可能入修道院作了安排，以确保她有足够的财富被修院团体接纳，而土地则仍归他的亲族。阿巴还考虑过，如果他确实无子而终，他的哪些亲属可以期望受益。他的兄弟们若有继承人，则将财产传给自己的继承人；若无，则由一位名为弗蕾欧松德者（表亲？叔伯？）在尚在人世时继承；若其已亡故，则阿巴姐妹的儿子之一可以主张这片土地。如果他的家族完全断绝，土地将归当地的主座教堂——坎特伯雷的基督堂。阿巴凝视着一个不确定的未来，不知道妻子是否会怀孕，也不知道哪些亲属可能先他而去。</p>\n<p>事情究竟如何发展？我们确实知道，寡居的埃里吉丝将阿巴的土地交还给了他的亲族，但以某种方式将其中一部分产出转给了坎特伯雷基督堂，以便他们夫妇二人的亡故都能在那里得到恰当的纪念，并通过定期的代祷为其灵魂祈福。她自己可能退居修道院，或许也可能隐居回娘家。这种寡妇的归宿绝非罕见。阿巴留给她的是土地的终身用益权，但规定所有权应仅限于他的男性血亲。阿巴的安排体现了一种在盎格鲁-撒克逊英格兰尤为普遍（但并不局限于该地）的做法：通过妇女将财产由男传男。埃里吉丝和阿巴的姐妹们能够传递产权，却不能以自己的权利持有它。</p>\n<p>偶尔，家庭境况也可能非常有利于遗孀。早期中世纪社群特有的人口结构必然意味着，成年子女先于父母而亡并非罕见。<sup class=\"fn\" data-note=\"4:34\">34</sup> 每当没有子女的后代先于父母去世时，其继承人通常是兄弟姐妹或父母。由子女向父母的逆向继承有充分的证据，可能也并非那么罕见。瑞典希勒舍的一处十一世纪如尼铭文反映了此前两个世纪北欧普遍流行的惯例。铭文如下：</p>\n<p>读吧！耶尔蒙德娶了处女耶尔勒格为妻。在他（耶尔蒙德）溺水而死之前，他们生有一子，随后其子也夭亡。此后她以古德里克为夫。……他们生有子女，但只有一个女孩存活，名叫英加。斯诺茨塔的拉格法斯特娶她为妻。此后他去世，然后是儿子。于是母亲（英加）从儿子那里继承了遗产。随后她以埃里克为夫。之后她去世。于是耶尔勒格从她的女儿英加那里继承了遗产。吟游诗人托尔比约恩刻下这些如尼文。<sup class=\"fn\" data-note=\"4:35\">35</sup></p>\n<p>耶尔勒格送别了她的第一任丈夫（耶尔蒙德）、她与他的儿子、她的第二任丈夫（古德里克）、她与第二任丈夫唯一存活的孩子（女儿英加）、她的女婿（拉格法斯特）以及她未具名的外孙。她直接或间接地是他们所有人的继承人。在她漫长的一生中，她通过子女的逆向继承，累积了第一任丈夫、第二任丈夫和女婿的土地。婚姻通常将财产由上一代传给下一代，没有人会计划让祖母成为家族年青一代全部财富的唯一继承人。但在早期中世纪死亡率的种种不确定因素下，这种事可能发生——而这一次确实发生了。</p>\n<p>更常见的是，寡妇们发现她们对丈夫遗留财产的获得权——无论是终身用益权还是完全所有权——都受到亡夫亲属的质疑。阿巴肯定预见到了他的兄弟们会围绕他的遗孀埃里吉丝打主意，并曾设法争取他们对她支持。但有时，反对并非来自夫家亲族，而是来自妇女自己的儿子，他急于立即掌控父系遗产而不必等待母亲去世。克努特在位期间（1016–1035年），赫里福德郡的艾尔斯通发生了一场著名的争讼：一个名叫埃德温的人对他未具名的母亲提起诉讼。文书抄写员虽使这位母亲隐没于无名，却记录了她成功地捍卫了自己的权利，得以将“我的土地和我的金子、我的衣物和我的饰物，以及我拥有的一切”遗赠给她的女亲族莱奥弗莱德。<sup class=\"fn\" data-note=\"4:36\">36</sup> 寡妇与继承人之间的这类冲突并不罕见，但寡妇获胜的可能性大概不大。在本案中，很可能正是莱奥弗莱德作为当地重要的土地权势人物的妻子这一事实，使母亲得以抵挡住儿子。</p>\n<p>诸子析产继承并不要求父母在继承人之间——无论是子女都分还是只分给儿子——平分土地。因此争执的可能性很高。兄弟姐妹可能会争夺父母一方或双方更优厚的待遇；堂表亲也可能觊觎原属共同祖父的土地；死者的兄弟也可能与死者的成年儿子争夺土地控制权。这类紧张关系可能演变为敌意甚至家族仇杀，在奥托王朝的德意志尤其臭名昭著。虽然编年史可能记述这些家族仇恨，但特许状通常只含蓄地暗示。一个坦率的罕见例子——同时也是罕见地揭示父母可采取的策略——来自意大利中南部斯波莱托。潘多曾授予妻子塔内尔迪丝其齐基利亚努斯庄园的终身用益权，并指示若儿子本尼迪克特在其寡居期间善待母亲，则由他继承。但塔内尔迪丝宣布，本尼迪克特“侮辱我、敌视我、加诸我许多恶行，此为众人所知”，于是在768年，她把父亲的土地全部赠给了法尔法修道院。<sup class=\"fn\" data-note=\"4:37\">37</sup> 她这样做，与其说是出于对儿子的怨恨，不如说是为了保障自己寡居期间的生活来源，因为她仍保留了她所捐赠土地的终身用益权。与许多通过某种方式依附于修道院而获得相对安稳寡居生活的妇女一样，塔内尔迪丝可以安度余年，确保有足够的收入，并得到法尔法修道院院长这一有势力的庇护人的协助。</p>\n<p>尽管安排精英婚姻始终涉及为妇女指定维持生计的具体资源，但通常只有在寡居时，她才获得对其中土地部分的直接控制。与她的婚姻嫁资和晨赠礼物一样，她以自己的权利继承的任何土地，在婚姻存续期间都与丈夫的财产合并管理。寡居终结了“夫妻支配”，开启了她对土地资源的直接支配——无论她享有的是完全所有权还是终身用益权。对塔内尔迪丝而言，正如对所有可考的其他早期中世纪有产妇女而言，获得土地——随之而来的还有独立财富与影响力的可能——出现在女性生命周期的重大转折点。事实上，凡是妇女以自己的名义通过书面文件转让财产的情形——如塔内尔迪丝所做——她们从来都是以修女或寡妇的身份行事，从不以妻子或女儿的身份。<sup class=\"fn\">38</sup> 然而寡居也可能带来社会孤立，并且无疑使妇女容易受到咄咄逼人者或不择手段者的挑战。难怪塔内尔迪丝要为自己获取强有力而有效的利益保障。</p>\n<p>塔内尔迪丝的例子说明，早期中世纪妇女获得财产受到一个复杂的文化矩阵的制约，每位妇女都必须在其中尽力周旋。一方面，这个矩阵受到地方法律传统、王权和教会压力的影响；另一方面，它又坚定地以家族为根基。男子除了继承之外，还有机会从领主或国王那里获得财产，而妇女一般只能通过父母的继承（有时来自亡故的子女）或婚姻财产安排获得土地。其实际结果是，妇女成为土地由一代传向下一代、或由家族转向教会的通道，却几乎没有机会以自己的名义、不受任何他人利益或权利主张的束缚，稳固地拥有土地。因此，妇女的财产获得权本质上乃是男子财产这一更宏大问题的组成部分。</p>\n<p>继承策略的种种安排：再次强调，对女性的讨论无法脱离她们所属的家庭——无论是娘家还是夫家——来单独进行。尽管任何一个具体的家庭都有其独特之处——没有两个家庭在构成、血统、身份或情感上完全相同——但所有家庭在将土地代代相传时，都怀有大致相似的目标。其中两个目标占据主导地位。首先，家庭力求世代维持其地位。由于地位在很大程度上取决于对财富的获取，维护地位便要求保护祖传家产。然而，对于那些不止一个子女长大成人的家庭来说，诸子分产的习俗及其所引发的家庭摩擦必须得到审慎的处理。与这一目标相辅相成且同等重要的是，一旦为死者祈祷的基督教习俗变得普遍，为自己和家族安排身后的追思纪念便成为必需。礼仪性的追思纪念使财富的分散成为必然，无论是通过慈善施舍还是对修道院的捐赠。因此，必须制定继承策略，以平衡各种相互竞争的优先事项。</p>\n<p>至少从九世纪起，我们便可以窥见其中的一些做法以及女性在其中的位置。一种显而易见的方法是限制继承人的人数。除了使用唾手可得的草药避孕或堕胎手段之外，是否还实行了性节制，这一点无从得知。然而明确的是，父母会做出决定，引导其子女要么进入世俗生活——婚姻、继承和家族的延续——要么献身于宗教生活——恪守独身与禁欲。梅泽堡主教蒂特马尔(1009–1018年在任)生于975年，是瓦尔贝克伯爵西格弗里德与妻子库尼贡德的五个儿子中的第三个。前两个儿子被培养以备婚姻和贵族武士的生活：长子于991年继承父亲的伯爵之位，次子则获得了一份较为平庸的政治生涯。蒂特马尔和他的两个弟弟都被送入教会，并且最终都成为了主教。瓦尔贝克伯爵由此做出了一次精心计算的赌博：即使他的一个世俗儿子在留下继承人之前死去，另一个仍会延续家族血脉。而将三个儿子送入教会，他也同时关照了家族的精神需求。</p>\n<p>女儿们在家族规划中同样占有不可或缺的位置。大约一个世纪之前，即864年，年迈的弗留利藩侯埃贝哈德与他年轻得多的妻子吉塞拉立下遗嘱，将他们在意大利北部、阿拉曼尼亚和法兰德斯的巨额财富分配给子女。这对夫妇引起我们关注的原因很多——尤其是他们的遗嘱为细致考察家族策略提供了机会。在他们的五个儿子和四个女儿中，长子(以其父亲命名)夭折。在幸存的八个孩子中，两个儿子乌恩鲁赫和贝伦加尔以及一个女儿海尔维希被安排了婚姻。另外两个儿子阿达尔阿尔德和鲁道夫被送入宗教生活，成为法兰德斯宗教团体的修道院院长。一个以母亲命名的女儿也被奉献给上帝，在意大利北部作为修女抚养长大。第三个和第四个女儿的命运不得而知，但有理由怀疑她们终身未嫁。在规划子女前程时，埃贝哈德和吉塞拉早在子女继承之时到来之前，就已经塑造了家族的形态。</p>\n<p>他们对财产的遗嘱处置同样体现出坚定的父母策略。根据遗嘱条款，所有八个幸存的子女都将继承父母的珍贵物件和书籍；除一个女儿(下一页将详述)之外，所有人都还获得了土地。家产的最大份额，包括父亲在意大利和阿拉曼尼亚的全部土地，归于乌恩鲁赫。作为在世的最年长的儿子，他被期望继承父亲的政治地位和影响力：作为象征，他获得了父亲华美的镶珠宝镀金武器和金线刺绣的服饰——高等地位和帝国官职的标志。另外三个儿子(其中两个已入教团)都在法兰德斯获得了小得多的土地份额，唯一已婚的女儿海尔维希也是如此。她的继承从间接意义上是为了孙辈——事实上，她确实是三个已婚子女中唯一幸运地成功抚养出下一代成人的人。</p>\n<p>三个被送入宗教生活的孩子同样为家族的未来做出了贡献，因为他们所分得的土地遗产份额有助于满足家族对宗教追思的需求。将孩子献给教会，通过这个孩子建立起父母与宗教机构之间的密切联系；经由这个孩子转移的财产则巩固了这一联系，并为代祷以及基督教对全体家族成员的纪念做了安排。这类安排很少将土地完全排除在家族的影响范围之外：恰恰相反，它们建立起了往往延续数代的强大的互惠利益。这一切都体现在埃贝哈德和吉塞拉的规划之中。由于女儿的发修道愿按惯例伴随着向相应女修道院的土地赠予，对从事宗教生活的女儿吉塞拉的安排必定早于其父母的遗嘱，而遗嘱中分配给阿达尔阿尔德和鲁道夫的财产只是需要更长时间才进入教会管理。所涉的三座教堂中，一座与埃贝哈德的家族渊源深厚，另一座与吉塞拉的家族关系密切；第三座则是他们二人于法兰德斯的锡苏安共同创建的。埃贝哈德和吉塞拉会将随之进入阿达尔阿尔德、鲁道夫和小吉塞拉各自宗教团体的土地，视为与其分给其他子女的地产同等有效的对家族未来的投资。最后，我们还应注意年长的吉塞拉在其丈夫于866年去世后的处境。寡居的她动用自己的遗产，将锡苏安建成一个其家族成员可以安葬并得到祈祷纪念的场所，并先后任命阿达尔阿尔德、随后是鲁道夫为该院院长。她的部分土地由儿子们先行持有，待他们去世后转归这座家族修道院，从而再次兼顾了即时的经济供养与长期的祈祷纪念这两个目标。</p>\n<p>在埃贝哈德和吉塞拉去世之后的几代人中，一些贵族家庭开始发展出另一种策略，以限制财产在日益增多的后代之间被分割。有些家庭试探性地、断断续续地尝试只指定单一继承人，使家产代代保持完整。在这一点上，888年之后加洛林王朝衰落之际崛起为诸侯乃至王族权力的那些贵族家庭走在了前列。与其墨洛温 predecessors 一样，加洛林诸王也倾向于将王国视为可分割的家族遗产。但最后几位加洛林国王——从898年至987年统治西法兰西亚——掌握的权力和土地都太少，不敢冒险将其分割。他们与继之而成为东法兰克人统治者的奥托诸王一道，开创了指定单一继承人的传统，让较年轻的儿子们到教会中或为兄长效力以寻求前程。这是一种高风险的策略，使长子暴露在兄弟们的挑战与叛乱之下。</p>\n<p>国王与诸侯率先垂范，贵族纷纷效仿，尤其是在前加洛林帝国的核心地带。在这里，自九世纪起，在人口和经济增长的推动下，家族与土地之间的关系开始逐渐重构。到十二世纪，西北欧的精英家族普遍将土地不加分割地由父亲传给一个儿子，通常是在世最年长的儿子。然而这种做法从未普及开来，因为直到中世纪末期乃至更晚，诸子分产的习俗在欧洲的广大地区仍然普遍存在。</p>\n<p>有一点从未改变：获得土地便带来地位与影响的机会。对男性而言，这意味着参与王国政治生活的可能，并在领主或国王麾下效力以寻求进一步的奖赏。对女性而言，作为女继承人或寡妇获得土地固然可能带来影响力，但同时也加深了她们的脆弱性。中世纪早期，女性无论多么富有，都永远无法将自身的影响力与王室政府中的正式官职相结合。伯爵、公爵、郡守或管家之类的制度性职位只授予或由男性继承，王位亦然，而女性只能是这些职位从一个男人传递到另一个男人的渠道，是其地位与合法性的保证人。即使从十世纪晚期起，伯爵之妻越来越多地被称为“伯爵夫人”，其中那些因寡居而须替幼年继承人执政的女性开始将其用作正式的公开头衔，这一头衔的转变也并不意味着她们获得了任何以自身权利被任命为官职的新能力。相反，它确认了婚姻和母性作为其威望与影响力之源泉的地位。正如王后或许可以在体弱多病或昏庸无能的国王之妻或幼年君主之母的身份下行使巨大的政治影响力，却不能以自己的名义继承王位或被选为王位继承人一样，在整个贵族阶层中，女性获取权力的途径是作为妻子、母亲或寡妇。因此，土地财富或许能给女性带来财富和影响力，却无法带来制度化的权力与权威。</p>\n<p>近年来，人们对十一世纪早期家庭结构转变的强调有些过头了——即从中世纪早期松散的双边亲族群体，转变为中世纪盛期高度聚焦于父系的家族，财产由长子传给长子，使女儿和幼子日益处于不利境地。就实际发生的变迁而言，它们既非突然出现，也非普遍推行，而且始终只是积累土地的诸多方式之一。幼子可以通过迎娶女继承人、接受在世亲属的赠予、受益于王室恩庇或以其他方式获取财产——例如移民他乡——来维持自身地位。意外死亡在十二世纪对父亲土地分配计划的扰乱，与八世纪同样容易。从女性在家族策略中的位置这一视角来看，她们始终是财产在代际之间、在亲族群体之间流动的渠道。作为女儿，她们在十二世纪因无兄弟而获得继承的机会与九世纪时一样大。作为妻子，她们的婚姻仍然需要其父亲与丈夫之间经过精心计算的、双方同意的财产交易。作为寡妇，她们仍然掌控着家族土地的相当大部分，虽易受他人觊觎，却是财产传递的核心。</p>\n<p>家庭、性伴侣关系，以及(若富有)财产继承：这些构成了中世纪早期男女生活于其中的基本框架。尽管婚姻观念不断变化、继承策略有所转移、社会实践存在广泛的地区差异，但本章始终贯穿着两个主题。第一个是女性在其家族事务中的核心地位。幼年便被献身宗教生活的女孩；盛年早逝、葬于随葬品丰厚之墓中的母亲；为迎合父亲的政治需要而被订婚、随后又被抛弃的权贵之女；继承被母亲阻断的儿子；为挽救婚姻而骑马远赴罗马的妻子；在丈夫亲属的要求与修道院的庇护之间犹豫不决的寡妇：这一切都凸显了女性生活的家族语境，以及塑造这种生活的亲缘纽带。第二个主题是女性的经历与男性的机会之间的种种差距——有时可以协商，有时则不然。尽管每个家庭各有其独特性，个人气质各异，长寿或早逝难以预料，男性却几乎总是占据优势。无论是就与女性发生性关系的权利和继承土地的权利而言，还是就支配妻子和女儿的权威而言，默契的社会成见和明文的法律原则都对他们有利。尤为重要的是，当一个男孩被送去 influential 亲戚、其父亲的领主乃至国王的家中时，他离开了直接的家族圈子，开始在一个朋友与亲族同等重要的世界里寻找自己的道路。对他而言，婚姻和为人之父只是对其他同样重要的亲缘纽带和政治关系的补充。</p>\n<p>作为国王、诸侯和主教，立法、修订社会规范、作出判决的都是男性。抄录特许状、撰写历史与编年史、撰写道德论著、描绘理想社会关系的，也大多是他们或其下属。从罗马世界继承而来的法律、思想和宗教传统，为这个向男性倾斜的世界提供了强有力的正当性论证。难怪他们的声音最为响亮，也难怪许多世代的历史学家都轻易地将中世纪早期视为一个男人的世界，或者至少是从男性的视角来看待它。在某种程度上，这确实准确地反映了男性远比女性更有可能拥有巨大财富和权力的社会。但是，正如本章所强调的，意识形态的期待与社会现实之间往往存在相当大的脱节：我们切不可将二者混淆或混为一谈。当中世纪早期的男女偶尔发现自己撞上严苛的法律要求或僵化的道德期待时，日常塑造他们相互关系的，乃是习俗性的期待和未曾言明的成见。</p>", "text": "“男人”一词指任何意志坚定、有判断力的人，而“女人”则指心智软弱、缺乏判断力的人。1\n两人结为伴侣。一个男人和一个女人通过生育将一个孩子带到世上。2\n“心智软弱、缺乏判断力”之人很少出现在记述伟大功业与政治成就的文字中。按照传统叙述，中世纪早期的历史是男性的政治、经济与宗教史，女性在很大程度上缺席于政治与经济领域，在宗教领域中也处于边缘地位。这种呈现方式不仅建立在前几代学者的预设与偏见之上，也反映了早期中世纪编年史、年鉴和史书的总体基调。但如今情况已大为改观。历史学家们现已认识到，与叙事性史料相比，女性更可能出现在其他类型的中世纪文献中，例如圣徒行传、记录土地交易的特许状以及法典。此外，当研究视野扩展至人们生活的地域与家族背景时，女性便与男性一道，成为历史学与考古学研究的核心对象。开展这项工作，不仅仅是关注编年史中占有显著地位的国王、诸侯、主教与武士们的妻子、母亲和女儿。这种方法要求我们探究男女社会角色之间的差异，并揭示其背后的预设、价值观念与偏见。换言之，它要求我们关注性别，将其视为中世纪早期社会组织与文化表达的一个内在要素。\n当我们这样做时，我们会发现自己在研究各种支配与从属的形式——它们存在于日常生活的方方面面，从农民的茅屋到帝王的宫殿皆然。这正是本章的任务。\n本章有两个前提。第一个前提已在前面确立：读写能力为神圣与世俗权威提供了辩护、促进与保障。3 由此可知，中世纪早期的抄写员和作者绝非对周围世界毫无利害关系、中立或纯真的记录者。他们在服务于利益攸关最深者的既得利益时，对报道内容有所取舍，浸透着其所处时代与地域的普遍态度，并善于将注意力从那些部分或完全被排除在权利、资源、声望和权力之外的人身上转移开。这些修辞策略轻而易举地使女性与儿童、奴隶和农民一道，陷入部分或完全的不可见状态；本章将着重揭示中世纪早期作者所玩弄的某些性别把戏。\n第二个前提在前一章中已有所暗示，但现在必须予以明确：尽管大多数中世纪早期文本将女性边缘化，她们对于任何共同体的繁衍却至关重要。她们的角色不仅是怀孕与分娩这种生物学意义上的再生产，还包括将文化预设、行为模式与道德规范代代相传的社会性再生产。家族姓氏以及母亲对儿子的训诫，便是我们已遇到过的这方面的例子。4 同样根本的是，女性以自己的劳动维系着共同体的运转，生产衣物、食物及其他许多物品。目前，只需指出女性的经济贡献与其文化和社会角色相辅相成，就已足够。\n因此，本章以前一章所开始的男女行为模式探讨为基础，进一步以性别差异为焦点展开考察。本章的论点是：尽管中世纪早期的性别关系因地域而异、并在所讨论的数个世纪中发生了巨大变化，但在整个中世纪早期，人们在心态和社会实践方面仍存在着根本的共同性。无论我们把目光投向何处，这些共同性都围绕着一个核心：女性之于男性的从属地位。我们将从对男女社会价值差异的明确表述与表现入手，继而考察两性差异尤为显著的两大主题：其一是性伴侣关系与婚姻的缔结，其二是对土地财产的获取。在这三个领域中，罗马遗产都显得至关重要。\n性别差异\n在社会区分可能采取的所有形式中，性别只是其中之一。阶级或等级、年龄、族裔与宗教，同样可以是规范群体成员资格、决定资源获取和构建身份认同的重要范畴。换言之，这些都是使一些人享有特权而限制和贬抑另一些人的方式。在中世纪早期，性别可以说是其中最变幻不定、最普遍存在、也最难以在一生中加以改变的一种。社会、宗教与族裔身份的流动性将更容易\n第4章所涉主要地点\n……一旦确立中世纪早期性别秩序的僵化性，这一点便显而易见了。5 由于性别差异通常以多种方式表现出来，本节讨论将从最明显到最不明显的层面依次展开：先考察可见的差异标志，再转向明确的社会规范表述，最后论及顽固存在的刻板印象与偏见。我们将看到，一张密集而细致的社会区隔与文化意义之网，笼罩着中世纪早期男女的生活。\n在任何社会中，最显著的差异莫过于服饰。服装的样式、首饰与个人装饰的形式、剪裁、遮掩或展示头发的方式，都强烈地传达着有关等级、财富、年龄与性别的信息。它们还可能传递有关族群身份、宗教圣召或政治忠诚的信号。所有这些都很容易改变，既可用于宣告个人处境的变化，也可作为刻意的伪装。考古与艺术史的证据表明，虽然中世纪早期的服装呈现出诸多地方性和区域性差异，并且（尤其对富裕精英而言）随时间不断演变，但男女有别的着装规范却始终普遍存在。到公元500年前后，短上衣和长裤早已摆脱了作为“蛮族”服装的恶名，取代古典托加袍成为罗马男性的首选服装；在整个中世纪早期的西方，它们始终是男装的普遍基础，只有教士除外，还有大约800年以后的王室礼仪服装。相反，女性始终穿着长及小腿或脚踝的长袍，对少数负担得起的人而言，丝绸、精纺羊毛织物以及不断变化的展示性首饰时尚则增添了更多的变化。\n服装的性别区分无法与个人装饰和衣着所蕴含的其他意义割裂开来。如果我们停下来考察塑造了几乎所有中世纪早期男女经历的生命周期，这一点就会变得清楚。与大多数前工业社会一样，中世纪早期各社会阶层的女性，其一生都由从童年到青春期或青春期稍后出嫁的过程主导：她们离开父母之家，迁往丈夫的居所，无论远近。此后，若未死于难产，便迎来从为人母到老年的又一次转变。如果作为年轻的新娘和母亲而守寡，她们通常会再嫁，甚至三嫁，迁居到新丈夫所在之地。晚年的守寡往往意味着另一种迁移：年迈的农妇很可能被领主迁往其庄园边远处的一处简陋住所，而精英阶层的寡妇则常常进入宗教团体，那里能提供保护和陪伴。只有那些在幼年时就被父母献身于宗教生活的女孩，才可能几乎终生居住在同一地方。\n无论社会地位如何，男性的生命节奏则有所不同。早年他们习得与其等级相称的身体技能，无论是使用武器还是农艺，但与姐妹们不同，他们达到身体成熟后并不会立即结婚。此时已具性活跃能力的他们，通常享有一段完全成年却不婚的阶段。在社会上层，他们作为武士效力于领主的扈从队伍，住在领主家中，接受宫廷礼仪与武艺的训练，如乌得勒支的格里高利就曾在王室宫廷中如此。6 在社会底层，年轻的未婚劳工是领主农业劳动力的重要成员，往往被派往庄园的主要田地劳作，有时则被送往遥远的地方开垦新地。他们结婚的年龄比姐妹们更晚，此后增添了家主和父亲的角色。若妻子早逝，男子很可能会娶一位明显比自己年轻的女人：对他而言，老年带来的是身体的衰老，却很少意味着孤独的鳏夫生活。即便到了老年，男性仍能发挥重要的社会作用，因为“老人知晓最多的事情，岁月使其智慧，往昔经验丰富”。7 他们是“长者”，在管理社区事务时，人们常常寻求他们的知识和建议。\n带着这些性别化的生命周期观念，我们可以回到服饰与个人装束的话题。对中世纪早期众多不识字的社群而言，墓葬考古为这些生命周期以及服饰样式的变迁提供了至关重要的证据。五、六世纪的男子、女子和儿童死后，有时会被葬于随葬品丰富多样的墓葬中，这些随葬品通常极为华美、辉煌、贵重。随葬墓尤其典型地体现了法兰克人、伦巴德人、哥特人和盎格鲁-撒克逊人等民族进入罗马帝国时所伴随的社会失序与流动。较晚的例子则出现在虽远离原罗马领土却正经历深刻政治与社会重组的地区，如九世纪的西斯拉夫诸地和十世纪的丹麦。必须强调的是，这并非一种异教前基督教社会的产物——那种社会的信仰假定死者来世需要日常生活用品——因为基督徒曾小心地将其中一些最著名的墓葬安置于教堂之中。毋宁说，它们是动荡不定的共同体的症候：在那里，经济、文化和军事压力正催生着充满张力的社会变革，以及对地位与合法性的竞争。\n在这种情况下，生者常常选择通过这种丧葬形式来确认自身及死去亲属的社会价值。尤其在整片随葬墓墓地被发掘之处，这些墓葬揭示了个人在共同体中的地位如何不仅随等级、也随年龄和性别而波动——换言之，随个体死于性别特定生命周期的哪个阶段而波动。\n高卢东北部梅斯周围地区的六世纪墓地便是一个经过充分研究的典型例证。它们展现了一个这样的世界：当一位正值青春期或育龄的女性去世时，家人会以奢华的随葬品予以厚葬，其中包括特定的女性物品—— notably 项链、手镯、耳环和胸针，有时还有纺轮和成串的家宅钥匙。这些随葬品的放置既反映了死者的社会地位及其对家庭的价值，也毫不含糊地表明她的社会价值源自其女性的、生育的能力。相比之下，儿童和约四十岁以上的女性，下葬时要么完全没有随葬品，要么只有几件非性别特定的物品。另一方面，男性直到约二十岁才会获得随葬品的厚葬，此时他们已达到体力的顶峰，并已在成年男性社会中完全立足。他们的随葬品通常是一套武器，如投掷斧、剑或矛；较年长的男性（四十岁以上）随葬品通常少得多，但仍具典型的男性特征。实际上，这些墓葬表明，适婚或育龄的女性以及作为武士的男性家主，在某些意义上比幼者和老者对家庭与共同体更有价值。它们也证实了服饰和个人装束在区分男女、标示社会角色方面的重要性。\n如前所述，中世纪早期的法典是社会规范与意识形态的又一重要指标。它们明示了物质记录所暗示的某些差异，并赋予其持久的、权威性的力量。这些法律条款许多涉及等级，但在涉及年龄与性别区分的条款中，有两项与本文尤为相关：命价和法律行为能力。首先是命价。除了按社会等级明确标定一个人的生命价值外，命价还可依年龄和性别而变化。8 这在《萨利克法典汇编》中尤为清楚：它与上述东北法兰克墓葬大致同时，呈现出惊人相似的图景，并以后期罗马帝国铸币的重金币（索里达，复数solidi）作为价值单位。一名自由的法兰克男子或女子的标准命价为200索里达，但若女子已怀孕或处于育龄，则增至三倍，即600索里达。生育期结束后，女子的命价又回落至200索里达。相反，男子的命价在其十二岁以下或成年后服务于王室时增至600索里达。从法律角度看，一条生命的价值在个体生命周期中变化显著；从性别角度看，一位姐妹的社会价值有时高于、有时低于其孪生兄弟。\n在此语境中的第二项重要区分是法律行为能力。中世纪早期法典以自由的成年男性为规范标准，并规定适用于其他群体的变通，包括女性、儿童、半自由人和不自由人。在此语境下，若干法典区分了成年人与儿童、男性与女性的法律行为能力。罗马法赋予成年男性远比未成年人和女性更充分的起诉和作证的权利，而在施加类似限制的后罗马时代法律中，罗塔里《敕令》对女性行动自由的限制最为严苛，尤其是在财产交易方面。罗塔里要求有一名男性保护人或法定代理人——通常是父亲、兄弟或儿子——来规范女性与更广泛共同体的交往，尤其是在任何财产交易中。如无男性亲属，则由国王承担此责——而且无疑会借此机会干预家庭事务。他宣称：“凡依伦巴德人之法居住于我国管辖范围内的自由女性，均不得处于自身的法律支配之下……而应始终处于某个男子或国王的支配之下。女性亦不得在拥有其对之享有mundium者［即对其享有法律管辖权者］同意的情况下，让与或转让其任何动产或不动产。”9 尽管罗塔里使早期伦巴德意大利的女性承受了比其他任何地方都更重的法律无能力，但存世的八世纪早期文书表明，他的立法并未使伦巴德女性完全陷于被动。在实践中，她们保有比法律条文所示可能的更大的行动自由，对自己的地产也握有更多的控制权。与其他早期中世纪立法者一样，罗塔里视女性的地位为在保护她们的幌子下扩张自身权力范围的机会：女性事务为王家干预提供了有用的借口。孤立地看，罗塔里《敕令》或许会让人以为僵化的性别区分渗透于伦巴德女性生活的方方面面。但置于文书证据所呈现的更为细致的图景之中，它再次提醒我们：法律是对意识形态的宣告，而非对社会现实的描述。\n当我们转向农民劳动时，规范与实践之间出现了类似的落差。教会将星期日定为休息日的努力始于六世纪末；随着规定逐渐具体化，其中纳入了关于男女角色不同但互补的明确表述。这些努力的顶点是查理曼那被频繁抄录的宣告：\n主日不得从事体力劳动——即男子不得从事乡村劳作：不得耕作葡萄园、犁地、收割、割晒干草、修筑篱笆、开垦荒地、伐木、采石、建造房屋或从事园艺……女子不得从事纺织工作，不得裁衣、缝纫或刺绣；不得梳理羊毛、捶打亚麻、当众浣洗衣物或剪羊毛，以便主日的尊荣［敬重］与安宁得以在各方面得到维护。10\n尽管女性与纺织生产的一切环节——无论以羊毛还是亚麻为原料——的关联在中世纪早期欧洲各地均得到证实，但在实践中，农活的分工因地方传统和不断变化的技术而异。在有些地方，制作面包是男子的事，在另一些地方则是女子的事；而凡是为磨谷而修建村用水磨之处，家用石磨的废弃必将影响家务劳动的分配。同样，收获在某些庄园似乎是男子的工作，但在另一些庄园，女子也下田劳作，有时还被明确指派捆扎麦束并将其堆成麦垛。因此，乡村劳动在实践中是有性别之分的，但既非僵化不变，也非整齐划一。\n即便是罗塔里和查理曼这样有权势的中世纪早期君主，也无法使社会现实与规范性准则完全一致。在实践中，女性的生活往往处于意识形态与习俗的夹缝之中。我们将看到，这一鸿沟往往相当可观，对一些人意味着脆弱，对另一些人则意味着机会。那么，基督教的传播在多大程度上影响了这一切？指陈其制度性后果是容易的：对独身生活的推崇颠倒了世俗的男女行为规范；为男性与女性生命周期的某些或全部阶段提供了修道院的替代选择；使男性对神圣权力的独占在司铎圣职中正式化。即将 discussed 的婚姻性质的变迁也与此相关。然而同样重要的是，基督教与罗马文学遗产的互动使根深蒂固的刻板印象重新焕发活力，而育识字率的提升为原本不识字的社群提供了一种表达偏见的新途径。教皇格里高利一世曾评论说：“『男人』(man)一词指的是任何意志坚定、有判断力的人，而『女人』(woman)则指心智软弱、缺乏判断力者”，这番话便是典型代表。11 他做出此番评论的那部鸿篇巨制被中世纪的抄写员大量抄录，现存抄本约有五百部，使得这一警句获得了持久性和普遍性，掩盖了它的本来来源。实际上，这一评论不过是在重复罗马传统中的老生常谈。\n塞维利亚的伊西多尔是我们了解这些老生常谈的最佳向导。他借助一种在翻译中失落的拉丁语双关，将古人对男女特质的传统看法概括如下：\n男人[vir]之所以得名，是因为他比女人更有力量[vis]，因此“勇德”[virtus——该词既指体力也指道德正直]一词亦由此而来；或者说，因为他以力量统治女人。而女人[mulier]则得名于柔弱[mollities]，仿佛把“更柔软”[mollier]改一个字母、去掉一个字母便成了“女人”[mulier]。二者在身体的强弱上互有差异：男人的力量最强，女人的力量较弱，因此她应当服从于男人。12\n伊西多尔教导中世纪早期的读者，要把人体视为道德品性的关键，正如古典伦理学所做的。既然女人比男人更柔软、更弱，她们的道德力量便不及男人——因此她们要服从男人。\n这一立场通过将男女之间的道德差异论证为自然生理差异的结果而发挥作用。而且，从基督教的视角来看，整个自然界都是神的造物，古代思想便很容易被移植到基督教框架之中。社会分化和性别秩序同样源自上帝与“自然”。米兰主教安布罗斯（374–397年在任）围绕一连串圣经引文展开论述，宣称：\n经上这样写道：“妇女不可穿戴男子所穿戴的，男子也不可穿妇女的衣服，因为这样行的是耶和华你神所憎恶的。”倘若细想便会明白，凡是天性本身所厌恶的，便是不和谐的。男人为何不愿以他生来的样子示人？为何要装扮成陌生的模样？男人为何要佯装成女人，而你，女人，又要佯装成男人？自然为两性各自披上了属于自己的衣装。男女在习惯、肤色、举止、步态、力量和声音上都各不相同。其他动物物种中亦是如此：雄狮与母狮外形不同，力量不同，声音也不同……雄孔雀美丽，雌孔雀却没有同样华丽的羽衣。……它们从不改变自己的外形，不是吗？我们又为何要改变自己的呢？\n……\n但我认为，与其说在于衣着，不如说在于举止、习性和行为，男应有男之为宜，女应有女之为宜。因此，作为[神圣]律法的解释者，使徒保罗说：“妇女在会中要闭口不言，因为不准她们说话。她们总要顺服，正如律法所说的。她们若要学什么，可以在家里问自己的丈夫。”又说：“女人要沉静学道，一味地顺服。我不许女人讲道，也不许她辖管男人，只要沉静。”男人做女人的活计是多么可憎啊！13\n安布罗斯巧妙地将神的诫命与动物世界混为一谈，以此论证衣着与行为上的性别区分不容变通。他与伊西多尔的话语在中世纪早期回响不绝，被众多读者抄录或引用。从古代晚期的基督教作家那里，早期中世纪的学者继承了一套现成的规范性性别关系观念，颠覆这套观念便会威胁神圣秩序，而他们也认为没有什么必要进一步发展它。\n但现实生活并不像早期中世纪的道德家们所希望的那样简单分明。有一年春天，神圣的欧里亚克的热拉尔（约855年生，909年卒）遇到一个正在犁地的女人。被问及为何要做这种“男人的活计”时，她解释说丈夫久病在身，她若不播种，便无人代劳。热拉尔的回应是给了她足够的钱雇一个劳工完成这项工作。然而，为他作传的克吕尼修道院院长奥多（927–942年在任）深谙安布罗斯的著作，并从这个故事中提炼出寓意。“正如安布罗斯所说，天性逃避一切人为造作，而自然的创造者上帝憎恶一切违背自然之事。”14 一个农妇的困境给了虔诚的基督徒一次施舍的机会；而一位修道院的道德家则向读者呈现了一个神圣钦定的性别秩序得以恢复的故事。\n诉诸“自然”是中世纪早期乃至其后数百年间教士作者们常用的修辞性性别把戏之一。另一种，我们将会看到，是在文本中不向读者或听众说出女人的名字，因为匿名会抹除身份。诉诸这类文字花招的人无疑是出于习惯势力。但这种习惯本身极具启示意义——它揭示了对女性边缘性、软弱性或劣等性的根深蒂固的预设。作为强大的文化反射，女性天性柔弱的观念服务于多种目的——政治的、法律的、宗教的、文学的。它既能助长剥削，也能促进保护；既可随意用来赞誉，也可随意用来诋毁。它使名声与美誉难以获得而易于失去。最重要的是，它强化了年龄、等级或财富等其他社会差异，使得那些确实凭借各种手段在世上闯出一条路来的女性，始终处于易受伤害的境地，被困在一张并非由自己编织的意义之网中。\n生育的结合\n性伴侣关系对人类社会的繁衍至关重要，不仅是生育的手段，还因为由父母与子女构成的亲密群体正是文化预设与价值观代际相传最常见的形式。然而，不加限定地谈论中世纪早期的“婚姻”过于简单化。这个词不足以完整描述男女自行结成的各种被认可的性伴侣关系。到千年之交，某种与我们现代婚姻观念——即一男一女之间持久的结合关系——可辨识地相似的婚姻形态已在欧洲部分地区形成，但并非没有争议。对这些问题的考察将阐明性别关系的社会组织，并引领我们深入早期中世纪性道德观念的核心。在上一章亲属关系讨论的基础上，本章将进一步审视男女经验的其他形态。\n然而，在早期中世纪文化多样性的底层，存在着一种持久而普遍的不平衡。女性获得的法律权利或经济资源越少，她就越处于较高地位男性的性支配之下：各地精英男性都可按自己的条件与地位低下的女性发生性关系。这些非正式的私情与那些用以传递财产和文化价值的伴侣关系无关，也与正式伴侣关系所能带来的情感纽带和家族认同无关；因此它们在史料中很少显露踪迹。由于缺乏政治意义或意识形态价值，这类关系很少进入法学家和立法者的视野，而后者所构建的社会关系模式在婚姻与性行为方面——正如在其他许多方面一样——表达着占主导地位的价值观。\n在上一章概述的三种法律文化中，继承下来的罗马传统是我们的出发点，因为它被证明是最根本的。罗马法承认两种互相排斥的性伴侣形式：纳妾与婚姻。前者不涉及任何财产交易，只是高地位男性与地位远为低下的女性之间被承认的长期性伴侣关系；妾所生的子女不享有任何继承权。纳妾是婚姻的替代而非附属，是未婚的年轻男子或不愿再婚的鳏夫的性出路。按照罗马法的界定，婚姻要求夫妻地位平等，需要婚约、双方的正式同意，以及新娘父母对新婚夫妇的嫁资。由此，男性的继承人便被限定为只有妻子所生的子女。四五世纪的帝国立法史无前例地强调婚姻是持久的伴侣关系，只有在配偶一方犯下盗墓亵渎之罪、施行巫术，或妻子与人通奸的情况下方可解除。尽管被理想化为建立在相互爱慕与尊重基础上的自愿伴侣关系，这些法律条文在整个地中海地区的中世纪早期西方一直沿用。我们将看到，这些规定还影响了一代代主教的观点，从而左右了整个中世纪的教会学说。\n在这一晚期罗马世界中，讲日耳曼语的移民在婚姻和亲属关系方面都引入了颇为不同的价值观与习俗。值得注意的是，与罗马法的单一界定相反，成文法和社会习俗都承认数种婚姻类型。其中只有一种涉及财产转让并由此产生继承权。新郎的家庭通常要向新娘的父亲支付聘金，新郎还会在完婚次日追加一份“晨礼”。此外，最迟到九世纪，新郎在订婚时从自己的财产中指定一份婚姻赠与已成为惯例。新娘尤其是当她们没有兄弟时，也可以将继承自父母的财产带入婚姻。这份婚事由心怀期望的新郎与女孩的父亲和亲属协商，并在亲友参与的公开仪式上庆贺，它是两个亲族群体之间的交易，不仅为新家庭提供资财，还可能缔结互利的政治联盟，甚至终结仇怨。因此，这种婚姻一般只能由男方解除，且会给双方带来严重的经济后果。15 这种第一类的结合被恰当地称为“配偶支配”，15它还有另外两个特征。第一，它还要求父亲将其对女儿的监护权移交给丈夫，使丈夫获得代表其法律利益并对其行使权威的权利。其次，新娘须迁居到丈夫的庄园，无论那里离她的娘家是近是远。就其财产交易的性质而言，这种伴侣关系是富有精英阶层的特征。\n另一种同样被认可、同样持久并有公开庆典的婚姻形式中，女子迁居男家并不伴随任何监护权的转让，即使她可能拥有自己的财产。男人们无须在这两种结合形式之间做选择：富人和权贵完全有能力供养不止一个女性，事实上，多重伴侣关系成为身份地位的象征，也是积累社会声望资源的一种方式。这类人中的一个便是莱茵兰富有而有影响力的地主、埃斯塔尔的丕平（约650年生，714年卒），据知他与三个女人生有儿子。他的两位同时并存的妻子普莱克特鲁德与阿尔派达都来自阿登地区势力强大的家族，尽管可能只有极为富有的普莱克特鲁德被移交给了丕平的监护之下。后来，她们的儿子们为争夺父亲的遗产而相争。关于丕平的第三位伴侣我们所知甚少，但她的名字不见于任何记载，她的儿子又被排除在丕平遗产的任何份额之外，这两点都强烈暗示这是一种远为非正式的伴侣关系。\n这篇简略的概述并未穷尽男性借吸引女性以争夺地位的所有方式，因为早期中世纪的法律汇编还承认一系列补充性的关系。女性可以在违背父母意愿的情况下被抢婚，也可以在她们自己甘愿配合的诱拐中被带走。虽然父母必须就失去女儿获得补偿，但这种结合仍然得到承认，并且可以通过其后的财产安排而变得更加正式。最后，在社会等级的底层，则由领主自行决定允许其奴隶和农奴之间缔结何种婚姻，以最适合高效庄园管理的需要。\n总而言之，日耳曼语族的后裔在融入后罗马行省生活的诸多其他方面之后，仍长期倾向于维持他们传统的性结合谱系。这些结合因其持久程度而有所区别；因女子从娘家亲族转入丈夫之家的方式而有所区别；因随附的财产交易（如果有的话）的性质而有所区别；还因对女子的法律权威与保护的安排而有所区别。虽然女孩是否有多少机会对拟议的婚约发表意见仍不得而知，但高地位男性无疑可以通过策略性婚姻增进自身利益，并在性满足和生育继承人方面找到充分的余地。当不莱梅的亚当（约1083年卒）在十一世纪末评论说，在瑞典人中间，“一个男子依其财力可同时拥有两三个乃至更多的妻子，富人和王侯则不限数目，而且他们也认为这种结合所生的儿子是合法的”，他不过是——或许略有夸张地——报告了一个延续数百年之久的模式：有权势的男性利用这些机会“囤积”女性，从而不仅确认自己对女性的优越地位，也确认自己对那些不那么成功的男性的优越。16\n第三，我们应当回到爱尔兰，在那里，法学家的论著将基督教与晚期罗马婚姻法的要素与本土的……\n实践被用来界定各种类型的性结合。七八世纪的爱尔兰学者将九种“生育结合”加以分类，并按其尊贵程度由高到低排序。17 在最尊贵的结合形式中，女方亲属将女子交给新郎，新组建的家庭由丰厚的财产赠予支持。其中最重要的是双方亲属都出资并贡献牲畜的结合，由此确立新娘作为“共同权威之妻”的地位。18 较不利于提升地位的方式是，财产仅由男方或女方一方的亲属提供。这三种结合的构成要素是一份契约，用以规范财产条款及管理财产的责任划分。尽管此类契约内容复杂，但仍可解除。与其他早期中世纪文化不同，爱尔兰法律允许种类繁多的分居理由。至少在理论上，如果妻子背叛丈夫、损害他的名誉、持续通奸、杀死他们的子女，或疏于家务，丈夫便可以与她分离。如果丈夫阳痿、不育或是同性恋、肥胖到无法行房、散布关于妻子性表现的闲言碎语、纳妾、传播讽刺她的诗文，或者在行使训斥妻子的权利时出手打伤她致其留下伤痕，妻子也可以离开他。遗憾的是，我们缺乏能够揭示爱尔兰社会现实是否与这些理想化方案大体相符的证据。\n在爱尔兰的性结合等级中，其次是女方亲属接受但未积极参与谈判的那些结合。男子经女方父母同意在其家中与该女子“生育结合”，其形式化程度较低，尊贵程度也较低；更不体面的是女子随男子私奔——既无亲属参与亦无亲属同意——或男子偷偷与她相会。等级最末的是女子本人未曾同意的“生育结合”（即强奸），或两个精神失常者的结合。所有这些规定都可能对财产分配产生重要影响，因为只有当女方的亲属不承认该结合时，这种联盟所生之子才丧失从父亲那里继承的权利，但若父亲选择承认他们，这些儿子仍可继承。\n这种关系谱系比在继承诸王国中更容易容许多重并存的性关系，因为爱尔兰法区分了“正妻”与地位较低的诸妻。19 “正妻”缔结了其亲属充分参与的婚约，这一婚约使她与夫家而非娘家的关系更为紧密。因此她受丈夫支配，其法律责任的三分之二由她的儿子承担，仅三分之一由娘家亲属承担；她的儿子与她的亲属按同等比例继承她的财产。而其他妻子在法律责任方面则大部分或完全留在娘家亲属之内，并且仅享有正妻一半的地位与权利。对一位地位显赫的男子而言，拥有一位正妻，再娶第二位妻子（在此附加结合的头三天里，正妻有权对她施加非致命的伤害），同时还探访一位或多位居于娘家的女子，是完全可接受的做法。面对基督教教士的非议，爱尔兰法学家转向《旧约》为传统习惯辩护。“爱尔兰法中存在争议：多重性结合与单一性结合何者更为正当？因为上帝的选民曾生活在多重结合之中，故谴责它并不比赞美它更容易。”20 对于负担得起的人来说，多重性伴侣关系是常态。\n在爱尔兰及其他地方，谴责多重结合的是教士。基督教婚姻学说牢牢建立于晚期罗马帝国的实践之上，正如教皇大良（440—461年在位）的一项裁决所概括的：合法婚姻是自由男子与门第相当的自由女子之间的结合，须由女方亲属通过正式订婚将她交付男方，缔结的婚姻须有财产资助并公开庆祝。大良的观点——“并非每个与男子结合的女子都是‘妻子’，正如并非每个儿子都是其父的继承人”——主张在两种女子之间作出区分：一种是罗马财产法所承认的唯一性结合形式即婚姻中的伴侣，另一种则处于任何其他形式的性关系之中，如妾或情妇。21 在这一源自罗马的法律定义之上，四五世纪的道德家又加上了浓厚的、主要基于《新约》的严格性伦理。大数人保罗（卒于约65年）宣告：“倘若不能自制，男子当各有自己的妻子，女子当各有自己的丈夫”；又说：“你们岂不知不义的人不能承受神的国吗？不要自欺：无论是淫乱的、拜偶像的、奸淫的、作娈童的、亲男色的、偷窃的、贪婪的、醉酒的、辱骂的、勒索的，都不能承受神的国。”诸如此类的宣告成为基督教男女节欲道德的基础，这一道德将异性婚姻承认为唯一合法的、可以发生性交的关系。22 由教士宣讲的这种罗马法律前提与毫不妥协的基督教道德的结合，冲击了各地的本土习俗。\n然而，教会的意见在多大程度上改变了社会实践？在爱尔兰，指女子非法性交的拉丁词adultrix为古爱尔兰语中“次妻”一词adaltrach提供了来源。然而，词汇的借用绝不意味着多重性伴侣关系的终结。将博学的诗人、教士和法官阶层限制为仅有一妻的种种尝试是否成功已无从查考，而“领主、诗人和平民皆因非法同居而受损害”的观点似乎收效甚微。23 系谱资料确凿地表明，多重伴侣关系至少在诸王之中依然常见，而当成体系的大陆高调教士改革于十二世纪全面抵达爱尔兰时，改革者们对其在当地发现的婚姻习俗进行了猛烈的谴责。24\n在爱尔兰之外，本土习惯与教会的期望同样存在分歧，七世纪一个名叫巴龙图斯的男子的经历便说明了这一点。他是来自法国中部隆雷的贵族，决定以僧侣身份度过余生。进入当地修道院后，他参与每日的祈祷与诵诗。随后，据记载，他在678/9年经历了一次濒死体验。当他完全恢复知觉后，他讲述了自己如何被魔鬼押着灵魂游历天堂与地狱。在天堂的一重门前，使徒彼得问众魔鬼对巴龙图斯有何指控。“他们答道：‘他有过三个妻子，这是不被允许的。他还犯下了其他通奸行为以及许多我们诱使他犯下的其他罪。’”25 在退隐修道院之前，巴龙图斯的行为与他同时代的埃尔斯特尔的丕平并无二致。区别只在于，我们是从一位持批判态度的修道院作者的角度得知巴龙图斯的多重婚姻，从这位作者崇高的道德制高点来看，富人的寻常行为俨然是魔鬼的作为。\n然而，幻象文学并非唯一的谴责手段，老年男子也并非唯一的目标。当教会的不满指向国王时，利害关系便极为重大，因为王朝继承可能因此受到威胁。“当知这些孩子永不能执掌王权，因他们是在罪恶中受孕的”——爱尔兰苦修士科伦巴努斯于610年如此预言，猛烈抨击墨洛温王朝国王提乌德里克二世（596—613年在位）的婚姻习惯。26 高卢的许多墨洛温国王，包括提乌德里克在内，都拥有多个性伴侣，并承认其大部分乃至全部儿子为继承人。像科伦巴努斯那样敢于批评的人，矛头所向的正是那些有助于王朝延续的做法。\n在八九世纪，利害关系进一步升级，当时意大利和法兰克地区的主教会议发起了一场协调一致的运动，以重新定义婚姻并将其确立为一种宗教的、神圣的事业。从721年罗马的一次宗教会议开始，教会会议逐渐在大良的观念之上增加了三项内容：强调婚姻的永久性与不可解除性；拒绝容许同时存在多于一段的性关系；以及对乱伦禁忌婚姻远为宽泛的定义。在此背景下，主教们极力主张，通过洗礼建立的灵魂亲属关系和通过婚姻产生的姻亲关系均构成婚姻障碍。教父、教兄弟姐妹、共同父母以及一切姻亲由此都落入这个庞大的禁婚对象之列。此外，一些主教还试图强加一项额外的限制条件——血缘禁忌一直上溯至七代以内的共同祖先，远远超出了广为接受的四代限度。\n某些加洛林教士为何要将乱伦关系的圈子扩展到如此极端的地步，至今仍有争议，尤其是因为没有证据表明近亲通婚在八世纪中叶之前普遍存在，更遑论成为常态。无论其深层动机如何，结果是在721年起的一个半世纪里，婚姻及各类性关系以一种新的方式被政治化了。这主要有两个原因。其一，到八世纪后期，善治意味着促进基督教行为规范。27 因此查理曼及其继承者支持教会推行修订后的婚姻道德的努力，同时却也发现自身的性行为与婚姻联盟被置于新的审视之下。事实上，正如洛泰尔二世（855—869年在位）付出惨重代价所发现的那样，主教们可以反过来利用这些禁令对付国王，使其后嗣断绝。其二，在国王寝榻政治这一直接语境之外，主教们若要与统治者结盟，才是改变婚姻习俗的唯一真正机会：他们因此把一件有效武器交到了狡黠的国王手中，使国王得以对其势力强大的臣属施加控制。\n860年法兰克主教会议处理的一桩案件，使我们得以罕见地一窥订婚与婚姻所牵涉的社会复杂性、情感纠葛以及相互冲突的政治利益。此案涉及奥弗涅伯爵斯蒂芬，事发的阿基坦正是他的君主秃头查理苦于难以建立稳定忠诚政权之地。此事被称为“对教会之极大丑闻、对王国之严重损害”。用斯蒂芬自己的话说：“在年少轻狂之时，如习俗所然，我与一名年轻女子发生了关系。”随后，大约在857年，“经我的家人与朋友同意”，他与阿基坦另一位显赫伯爵雷吉蒙德谈判，获准娶后者的女儿为妻。双方就斯蒂芬将提供的婚姻财产赠予达成协议，两人正式订婚。但在雷吉蒙德公开交付其女儿之前、亦即斯蒂芬完成财产转移之前，斯蒂芬发现自己的未婚妻与他先前的性伴侣有亲缘关系。他随即咨询了自己的司铎，后者告知他所提议的婚姻将属乱伦，因而为教法所禁。斯蒂芬随后试图退出婚约，激起了国王与雷吉蒙德双方的震怒。由于害怕遭到放逐与倾覆，斯蒂芬感到“为形势所迫”，不得不在公开仪式上娶雷吉蒙德之女为妻，并交付原本为她准备的赠予财产。但他仍拒绝圆房，而他的顽固使他与雷吉蒙德的对抗愈演愈烈。雷吉蒙德因女儿所受的对待而愤怒并深感羞辱，最终于860年向主教们提出控诉。28\n面对这桩牵涉荣誉、财产、契约义务、性及叛乱倾向的复杂案件，会议裁定此案应同时由两个法庭审理：一个是由国王主持的世俗会议，处理财产与政治问题；另一个是由斯蒂芬与雷吉蒙德产业所在两省的大主教领导的教会会议，处理婚姻的性质问题。会议还责成兰斯大主教欣克马尔（845—882年在任）就此案准备一份报告。欣克马尔是整个中世纪最活跃的精通法律的 bishop 之一，而在此事上，一如在许多其他事务上，他同时也是秃头查理的代理人。大主教们的裁决未能留存下来，因此我们无从得知最终结果。但倘若他们听从了欣克马尔的建议，其解决方案对斯蒂芬和雷吉蒙德而言将是一个保全颜面的方案，却极少顾及那位不受欢迎的新娘的福祉——简报甚至懒得提及她的名字。欣克马尔关注的并非婚外之性，而是婚内之性。他建议省教会人士讯问那位女子：如果婚姻确已圆房，那它便属乱伦，因而无效；但由于圆房是完成婚姻的必要条件，若两人未曾性交，它便不是一桩正当的婚姻。无论哪种情形，斯蒂芬都获解脱，而王室会议则必须处理被撕毁的婚约、对雷吉蒙德的侮辱以及政治动荡的威胁。\n斯蒂芬为何如此行事？他声称是害怕丢面子并招致国王震怒，但其中似乎另有隐情。他可能是近来针对与先前性伴侣有亲缘关系者结婚的严厉禁令的无辜受害者，也可能是狡猾地操纵法律，以摆脱一桩在政治上已不再有利的婚姻联盟。无论实情如何，秃头查理对阿基坦的控制已成了问题。无论我们如何评判斯蒂芬的行为，这样的冲突在一个世纪之前几乎是难以想象的。无论这个故事讲的是一个倒霉的受害者还是一位机敏的阴谋家，此案都至关重要。\n以下几个原因。首先，它提醒我们精英婚姻作为政治谈判手段的重要性。其次，在一个通常把适婚少女当作棋子而非主动策略家的社会中，女性的意见和福祉无足轻重。事实上，对辛克马尔而言，这些与她的名字一样无足轻重。第三，它证明了亲属关系定义被重新表述，以服务于一种不断变化的性伦理和婚姻伦理。\n最后，奥弗涅的斯蒂芬是一位地位显赫的人物，是国王扈从中的一员，这并非巧合。他的显赫地位使他的婚姻伎俩暴露在宫廷主教们和一位急于寻找任何手段来控制其追随者的国王的审视目光之下。在远南方，比利牛斯山之外，与他同时代的加泰罗尼亚人、恩普里亚斯伯爵德拉（862–94）娶了他的堂姑母基克西洛娜，即他父亲的兄弟的女儿。堂表亲联姻是九世纪晚期和十世纪初加泰罗尼亚伯爵们的常态，因为它强化了家族对权力的掌控。如果加洛林宫廷的主教们知晓此事，或许会感到不安——但加泰罗尼亚从未与加洛林权力中心保持密切接触，而且到九世纪晚期，它正迅速失去与北方土地的一切联系。当加泰罗尼亚伯爵们在十世纪中叶开始到更远的地方寻找新娘时，那是出于政治利益的考量，而非任何道德压力的结果。同样，在威塞克斯，长者国王爱德华（899–924）通过娶他的堂兄弟兼对手埃塞尔海姆的女儿埃尔弗莱德来确保自己的王位继承权。此后又过了大约五十年，加洛林关于近亲婚姻是不可逾越的婚姻障碍的观念才开始改变英格兰的做法。而且之所以如此，只是因为十世纪晚期的盎格鲁-撒克逊诸国王发现，支持那些熟悉严苛的大陆理想的道德化主教，具有战略性的政治利益。实际上，加洛林对婚姻的重新界定——不可解除、排除任何其他同时存在的性伴侣关系、禁止至少四代以内的亲属之间通婚——只有在国王与教会的全部资源联合起来力图强制推行时，才开始影响人们的行为。\n在加洛林权限范围之外，或者在缺乏变革意志和手段的地方，婚姻的定义长期以来保持着更大的灵活性。斯堪的纳维亚便是一个例子，不来梅的亚当为我们提供了可靠的记载。29 丹麦人克努特于1016年征服英格兰并夺取王位，此后不久又登上丹麦王位：他同时拥有两位妻子——埃尔fgifu和艾玛——维持了较古老的斯堪的纳维亚方式，却仍然屈从于教会人员的压力，立法对那些与近亲结婚或不把性行为局限于婚姻之内的盎格鲁-撒克逊人处以罚金。在更遥远的地方，完全超出加洛林影响范围之外，爱尔兰直到十一世纪末都未受大陆规范的影响。事实上，一位作为父亲唯一继承人的爱尔兰女子很可能被嫁给其最近的男性亲属，恰恰是为了防止她的财产流出亲族；而且，尽管口头上尊奉教父关于四代以内禁止通婚的禁令，爱尔兰教士们显然承认女继承人需要堂表亲联姻。\n要改变婚姻习俗，既需要政治上的坚持，也需要强势的国王与主教协同行动时的一致规范。但在加洛林道德说教的高潮过后很长一段时间里，这种联盟和行动的意愿都不太明显。相反，至少在政治精英阶层中，婚姻长期以来一直是政治需要与分歧规范之间的一种不安平衡，只是偶尔被个人道德所调和。一个发生在本时期末尾的中世纪早期动人爱情故事凸显了这些矛盾。哈默尔施泰因伯爵奥托和他的妻子伊尔门加德有远亲关系——伊尔门加德的曾祖父母是奥托的高祖父母。他们长久的婚姻被中断了，因为心怀报复之心的德意志皇帝亨利二世（1002–24）害怕奥托成为一个权势过大的臣属，决意毁灭他。亨利通过鼓励德意志主教们重新兴起道德严苛之风来实现这一目的，其中一些主教正试图为九世纪提出的以七代来界定乱伦的方案注入新的力量。1018年，亨利二世主持了一次教会会议，将这对夫妇绝罚并命令他们分居。然而，奥托“燃烧着盲目的爱”，仍与伊尔门加德在一起，并于1020年袭击了他主要的教会对手美因茨大主教。30 亨利二世进行报复，围攻奥托在哈默尔施泰因的城堡，将其夷为平地，然后夺取了奥托全部广袤的土地。这对夫妇仍然相依不离，直到1023年，另一次教会会议再次对他们作出不利裁决。奥托因畏惧皇帝而终于屈服，但伊尔门加德依然不从。德意志主教们拒绝让她向教皇申诉，她却于1023年动身前往罗马，并成功地为她的案件进行了申辩。本笃八世（1012–24）确认了她婚姻的有效性，并谴责那些宣告其婚姻无效的德意志主教，因这一干预而引发了一场抗议风暴。次年，国王和教皇双双去世，这场争议也随之消散：奥托和伊尔门加德维持了婚姻，并受到新国王康拉德二世的恩宠，而康拉德本人的婚姻曾招致教士们的强烈批评。\n奥托和伊尔门加德的磨难揭示了公元千年之交婚姻的许多情况。首先，他们本人接受婚姻是永久性和一夫一妻制的，表明了在中世纪早期欧洲大部分地区于基督教影响下发生的漫长而缓慢的社会观念转变。他们体现了教会教导所提倡的理想：婚姻是平等者之间的排他性伴侣关系。其次，尽管在婚姻应缔结于毫无亲缘关系的伴侣之间这一原则上存在共识，但关于亲属关系的界限应设在哪里，不确定性依然存在。第三，国王、主教和教皇争夺仲裁婚姻的权利。一种独特的婚姻观念发轫于加洛林道德理想主义的蓬勃时代，其前提对关于可容忍的性伴侣关系的性质和数量的地方惯例，以及对女性抚养其子女的社会单位，都具有巨大的影响。这一观念有时通过王室颁布得以强化，凡是加洛林教会立法手册被抄写之处便传播开来，主要在大陆，到十世纪晚期也传入英格兰。但是，正如我们所见，这一观念的形成是一回事，其贯彻实施则完全是另一回事，而在1050年之后的很长一段时间里，将愿望变为现实的努力仍然是断断续续、争议重重且前后不一的。\n女性、家庭与继承\n如果说婚姻长期以来更多地是一件政治事务而非基督教道德事务，那是因为它所牵涉的远不止是对性行为的规范。至少，妻子和儿媳进入一个男人的家中，扩大了女性劳动力的储备——即各社会阶层的女性倾注精力的纺纱、织布、缝纫、刺绣，以及奴隶和农妇所从事的食物准备和其他工作。在精英阶层中，婚姻还涉及对家族财产的保存、分配和增殖的盘算，以便安排其在代际之间的处置。有了土地，便有了生存的手段，而对于所有高于仅能维持生计的小农的财产所有者来说，也有了产生盈余的可能。下一章将强调对土地财产的权利如何开启通向地位、政治权力和影响之路；此处则聚焦于作为协商性别差异手段的祖产继承。本节的分析认为，虽然资源在继承人之间的分配强化了男性和女性在财富、影响力和权力获取上的差异，但女性获得财产的途径对于中世纪早期的家族互动仍然至关重要。\n中世纪早期的继承习俗受政治压力、教会意见、不断演变的地方法律程序以及变化中的家族观念的影响，各地差异极大。然而，尽管存在广泛的地域和时间上的差异，一些总体要点是清楚的。第一，性伴侣关系将财产（动产和土地）从父母传给子女，而继承权通常与父母伴侣关系的性质密切相关。在早期爱尔兰，正式且公开承认的结合所生的儿子比非正式结合所生的儿子对父亲财产拥有更大的权利；在其他地方，不断发展的基督教婚姻观念强化了一个男子与其妻子所生子女相对于非正式结合所生子女的继承权。第二，继承土地的正常模式不同于继承诸如牲畜、奴隶或珠宝等动产的模式，而继承政治职位的程序可能又有所不同。第三，父母的财产原则上是可以分割的——换言之，由部分或全部子女共享，尽管份额通常不均。然而，到十一世纪，随着家族和身份观念的继续演变，一些家族开始发展出将大部分或全部祖产传给单一儿子的策略。第四，财产由一代向下一代的传承，很少只是父母与子女双方的事务。国王们密切关注，急于寻找干预的借口；而且，除罗马财产法持续存在的地方外，更广泛的亲族群体也参与其中。因此，本节的讨论将男性与女性置于其亲属之中加以考察，同时也关注他们生活于其中的更广泛的政治环境。最后，也是最根本的一点：男性继承土地的权利是所有中世纪早期文化的共同特征之一；而另一方面，女性获得家族祖产的途径则因地区和世代而有很大差异。通过考察女性相对于其兄弟在土地获取上的差异，一种具有重大政治意义的性别模式便浮现出来。\n确认继承策略不可避免地依赖于存世的文献。在此背景下，重申前文提到的几点是切题的。一方面，法典中阐述的关于财产传承的规范并不是人们实际行为的充分指南：要了解这一点，我们必须将其与记录具体、有名有姓的地产转让的文献并列考察，如捐赠特许状、遗嘱和遗赠。此外，不仅文书意识的程度因地区而异，而且文献保存率在某些地方也远比其他地方好。最后要记住的一点是，起源于罗马的遗嘱 practices 在北欧的逐渐采用，这些做法影响了财产所有权的传承和记录方法。31 总体而言，详细记载土地转让的记录，通常只有在意大利和法兰克地区的七世纪晚期以后、西班牙北部的九世纪晚期、英格兰的十世纪中叶以后，以及其他地方更晚的时期，才有相当数量的存世。\n尽管如此，我们仍可以勾勒出继承习俗中一些最明显的地区差异。如往常一样，两个极端是一方面的爱尔兰，和另一方面的欧洲大陆南部持久保留罗马传统的地区。在爱尔兰，父系土地在所有被承认的儿子之间平均分配，但女儿有权获得动产的均等份额，尤其是奴隶和牲畜。如果一个男人去世时只留下女儿而无儿子，她可能对其地产享有终身权益，但在她死后，财产将归还给她父系的男性亲属。这些习俗运作于一种强调土地属于四代亲族群体（称为derbfine）的文化之中，在这种文化中，土地脱离derbfine而让渡是不被鼓励且难以实现的。女性继承将对亲族群体及其土地构成威胁，因为被承认的儿子属于其父亲的derbfine而非母亲的：如果一名女子继承了土地并将其传给她的儿子，土地就会从一个derbfine转移到另一个。这就是为什么女继承人会受到压力，被迫嫁给其父亲最近的男性亲属。32 相比之下，五、六世纪的罗马财产法建立在两个截然不同的原则之上，这些原则在整个中世纪早期乃至更久之后都保持不变。首先，土地只能由个人完全和绝对地拥有：不存在对土地的任何集体利益或权利的概念。其次，晚期罗马帝国的法律基于这样一种假设：在无遗嘱继承的情况下，女儿有权与其兄弟享有平等的继承权。总体而言，罗马法对女性不受任何监护人约束而完全控制和自由处置财产，没有设置任何法律障碍。在诸如意大利南部的卡拉布里亚和卢卡尼亚，或法国南部的阿基坦和普罗旺斯等罗马习俗贯穿整个中世纪早期的地区，女性获得财产的权利原则上赋予了她们相当程度的经济独立，这在早期爱尔兰是完全不可想象的。\n那么，在爱尔兰和意大利南部之间的那些地区，换言之，在日耳曼语系的定居者及其后裔坚持自身习俗的诸王国中，情况又如何呢？在这里，重要的是要承认各地存在广泛的差异，但也有两个重要的共同因素。首先，私人个人财产所有权与亲族的利益相互平衡，亲族可能希望主张财产，或在所有者欲向任何人出售或捐赠土地时须征询他们的意见。\n除了自己的后代之外。其次，这些传统明显地优先将土地传给男性继承人，只有在缺少儿子的情况下，才普遍承认女儿或姐妹的继承权。八世纪中叶编纂的图林根法典对女性拥有土地的敌意甚于任何其他法典，明确规定：在没有儿子的情况下，财产将归父亲最近的男性亲属。图林根法典还有一大用处：它比任何其他法典都更明确地规定了动产与土地截然不同的传承途径——它规定，尽管土地归父亲最近的男性亲属，但牲畜和奴隶则归女儿们所有，而女儿们同时也是母亲衣物、首饰和个人饰品继承人。\n然而，为继承订立成文规则、为确认个别土地交易而制作文书，这两者都是从罗马传统中采纳的做法。其结果是，从书面记录最早使我们得以一窥后帝国时代诸王国继承策略之时起，这些策略就已经带上了罗马规范的印记。这一趋势在七、八、九世纪才逐渐加强。北意大利的伦巴德王国是一个格外清晰的例证：在罗马邻人习俗的强大压力下，伦巴德妇女的继承权发生了显著变化；到八世纪末，伦巴德女儿继承父亲一部分财产的机会远大于生活在罗塔里统治下的前辈。实际上，只要文书材料尚存、能够揭示财产交易的具体细节，在诸继承王国中，妇女都既能且确实继承了土地和动产。\n然而，这并不是说妇女获得财产的机会曾与男子同等或同样稳固。相反，她们的权利始终有限、不稳固，且容易受到质疑。尽管统计推断在前中世纪素来不可靠，但几个粗略的估算有助于聚焦本讨论。有人乐观地提出，罗马晚期的妇女可能拥有帝国全部土地财产的30%至45%。诚然，这几乎只是猜测，但可以将其与后世几个世纪由不同类型材料得出的数字相对照。首先，对欧洲大陆自八世纪起特许状的分析表明，妇女获得土地的机会存在显著的地区差异。在罗马法律传统影响仍然强大的地区，妇女可能控制着大量土地——十世纪西班牙北部约为17%，相邻的法国南部地区约为13%。在卢瓦尔河以北、德意志以及伦巴德意大利，妇女拥有不足10%、很可能不足5%的土地。就英格兰而言，证据类型颇为不同：这是为征服者威廉（1066–1087年在位）编制的全国土地清册《末日审判书》。《末日审判书》除了报告1086年的土地持有状况外，还记载了“爱德华国王生而复死之日”（即1066年）盎格鲁-撒克逊英格兰的土地所有权格局，为诺曼征服前夕的财产权利提供了一幅快照。盎格鲁-撒克逊习俗强烈偏好土地由男传男，总体而言，妇女的获得权是有条件的、受限制的。《末日审判书》记载，1066年英格兰全部土地中仅有约5%为妇女所有；而且有充分理由相信，到1066年，掌握在妇女手中的土地比公元1000年前后略有增加。这些数字——无论多么粗略地——表明：在法律文化和地方传统的影响之下，女性财产权利差异极大；即使就在最有利 于女性财产权利的地区作最乐观的估计，绝大部分土地仍处于男性的控制之下。\n获得土地财富不仅受到地方社会惯例或法律限制的制约。具体的家庭境况同样重要，对男女的影响可能一样大。首先，出身的偶然性或猝死的无常，甚至能使最精心规划的财产分配陷入混乱。肯特的王室总管阿巴（Abba）婚后无子。在833年至839年间，他立下一份遗嘱，为若干种可能的未来作了安排。“我的心愿是”，他开宗明义地说，“如果上帝赐我一子，他将在我之后继承这片土地，与我的妻子共同享用；同样，在他之后，只要上帝愿意，只要他的后裔中还有人有能力、有资格持有土地，他们应继续持有它。”但阿巴也设想过无子的晚年：“然而，如果我命中注定没有子女，那么我希望我的妻子在她的有生之年拥有它〔我的土地〕，只要她愿意不再改嫁而保有它。”33 另一种可能的未来是他的遗孀埃里吉丝（Heregyth）再婚。在这种情况下，土地将归还他自己的亲族，她只保留自己带入婚姻的财产。最后，他还为埃里吉丝可能入修道院作了安排，以确保她有足够的财富被修院团体接纳，而土地则仍归他的亲族。阿巴还考虑过，如果他确实无子而终，他的哪些亲属可以期望受益。他的兄弟们若有继承人，则将财产传给自己的继承人；若无，则由一位名为弗蕾欧松德者（表亲？叔伯？）在尚在人世时继承；若其已亡故，则阿巴姐妹的儿子之一可以主张这片土地。如果他的家族完全断绝，土地将归当地的主座教堂——坎特伯雷的基督堂。阿巴凝视着一个不确定的未来，不知道妻子是否会怀孕，也不知道哪些亲属可能先他而去。\n事情究竟如何发展？我们确实知道，寡居的埃里吉丝将阿巴的土地交还给了他的亲族，但以某种方式将其中一部分产出转给了坎特伯雷基督堂，以便他们夫妇二人的亡故都能在那里得到恰当的纪念，并通过定期的代祷为其灵魂祈福。她自己可能退居修道院，或许也可能隐居回娘家。这种寡妇的归宿绝非罕见。阿巴留给她的是土地的终身用益权，但规定所有权应仅限于他的男性血亲。阿巴的安排体现了一种在盎格鲁-撒克逊英格兰尤为普遍（但并不局限于该地）的做法：通过妇女将财产由男传男。埃里吉丝和阿巴的姐妹们能够传递产权，却不能以自己的权利持有它。\n偶尔，家庭境况也可能非常有利于遗孀。早期中世纪社群特有的人口结构必然意味着，成年子女先于父母而亡并非罕见。34 每当没有子女的后代先于父母去世时，其继承人通常是兄弟姐妹或父母。由子女向父母的逆向继承有充分的证据，可能也并非那么罕见。瑞典希勒舍的一处十一世纪如尼铭文反映了此前两个世纪北欧普遍流行的惯例。铭文如下：\n读吧！耶尔蒙德娶了处女耶尔勒格为妻。在他（耶尔蒙德）溺水而死之前，他们生有一子，随后其子也夭亡。此后她以古德里克为夫。……他们生有子女，但只有一个女孩存活，名叫英加。斯诺茨塔的拉格法斯特娶她为妻。此后他去世，然后是儿子。于是母亲（英加）从儿子那里继承了遗产。随后她以埃里克为夫。之后她去世。于是耶尔勒格从她的女儿英加那里继承了遗产。吟游诗人托尔比约恩刻下这些如尼文。35\n耶尔勒格送别了她的第一任丈夫（耶尔蒙德）、她与他的儿子、她的第二任丈夫（古德里克）、她与第二任丈夫唯一存活的孩子（女儿英加）、她的女婿（拉格法斯特）以及她未具名的外孙。她直接或间接地是他们所有人的继承人。在她漫长的一生中，她通过子女的逆向继承，累积了第一任丈夫、第二任丈夫和女婿的土地。婚姻通常将财产由上一代传给下一代，没有人会计划让祖母成为家族年青一代全部财富的唯一继承人。但在早期中世纪死亡率的种种不确定因素下，这种事可能发生——而这一次确实发生了。\n更常见的是，寡妇们发现她们对丈夫遗留财产的获得权——无论是终身用益权还是完全所有权——都受到亡夫亲属的质疑。阿巴肯定预见到了他的兄弟们会围绕他的遗孀埃里吉丝打主意，并曾设法争取他们对她支持。但有时，反对并非来自夫家亲族，而是来自妇女自己的儿子，他急于立即掌控父系遗产而不必等待母亲去世。克努特在位期间（1016–1035年），赫里福德郡的艾尔斯通发生了一场著名的争讼：一个名叫埃德温的人对他未具名的母亲提起诉讼。文书抄写员虽使这位母亲隐没于无名，却记录了她成功地捍卫了自己的权利，得以将“我的土地和我的金子、我的衣物和我的饰物，以及我拥有的一切”遗赠给她的女亲族莱奥弗莱德。36 寡妇与继承人之间的这类冲突并不罕见，但寡妇获胜的可能性大概不大。在本案中，很可能正是莱奥弗莱德作为当地重要的土地权势人物的妻子这一事实，使母亲得以抵挡住儿子。\n诸子析产继承并不要求父母在继承人之间——无论是子女都分还是只分给儿子——平分土地。因此争执的可能性很高。兄弟姐妹可能会争夺父母一方或双方更优厚的待遇；堂表亲也可能觊觎原属共同祖父的土地；死者的兄弟也可能与死者的成年儿子争夺土地控制权。这类紧张关系可能演变为敌意甚至家族仇杀，在奥托王朝的德意志尤其臭名昭著。虽然编年史可能记述这些家族仇恨，但特许状通常只含蓄地暗示。一个坦率的罕见例子——同时也是罕见地揭示父母可采取的策略——来自意大利中南部斯波莱托。潘多曾授予妻子塔内尔迪丝其齐基利亚努斯庄园的终身用益权，并指示若儿子本尼迪克特在其寡居期间善待母亲，则由他继承。但塔内尔迪丝宣布，本尼迪克特“侮辱我、敌视我、加诸我许多恶行，此为众人所知”，于是在768年，她把父亲的土地全部赠给了法尔法修道院。37 她这样做，与其说是出于对儿子的怨恨，不如说是为了保障自己寡居期间的生活来源，因为她仍保留了她所捐赠土地的终身用益权。与许多通过某种方式依附于修道院而获得相对安稳寡居生活的妇女一样，塔内尔迪丝可以安度余年，确保有足够的收入，并得到法尔法修道院院长这一有势力的庇护人的协助。\n尽管安排精英婚姻始终涉及为妇女指定维持生计的具体资源，但通常只有在寡居时，她才获得对其中土地部分的直接控制。与她的婚姻嫁资和晨赠礼物一样，她以自己的权利继承的任何土地，在婚姻存续期间都与丈夫的财产合并管理。寡居终结了“夫妻支配”，开启了她对土地资源的直接支配——无论她享有的是完全所有权还是终身用益权。对塔内尔迪丝而言，正如对所有可考的其他早期中世纪有产妇女而言，获得土地——随之而来的还有独立财富与影响力的可能——出现在女性生命周期的重大转折点。事实上，凡是妇女以自己的名义通过书面文件转让财产的情形——如塔内尔迪丝所做——她们从来都是以修女或寡妇的身份行事，从不以妻子或女儿的身份。38 然而寡居也可能带来社会孤立，并且无疑使妇女容易受到咄咄逼人者或不择手段者的挑战。难怪塔内尔迪丝要为自己获取强有力而有效的利益保障。\n塔内尔迪丝的例子说明，早期中世纪妇女获得财产受到一个复杂的文化矩阵的制约，每位妇女都必须在其中尽力周旋。一方面，这个矩阵受到地方法律传统、王权和教会压力的影响；另一方面，它又坚定地以家族为根基。男子除了继承之外，还有机会从领主或国王那里获得财产，而妇女一般只能通过父母的继承（有时来自亡故的子女）或婚姻财产安排获得土地。其实际结果是，妇女成为土地由一代传向下一代、或由家族转向教会的通道，却几乎没有机会以自己的名义、不受任何他人利益或权利主张的束缚，稳固地拥有土地。因此，妇女的财产获得权本质上乃是男子财产这一更宏大问题的组成部分。\n继承策略的种种安排：再次强调，对女性的讨论无法脱离她们所属的家庭——无论是娘家还是夫家——来单独进行。尽管任何一个具体的家庭都有其独特之处——没有两个家庭在构成、血统、身份或情感上完全相同——但所有家庭在将土地代代相传时，都怀有大致相似的目标。其中两个目标占据主导地位。首先，家庭力求世代维持其地位。由于地位在很大程度上取决于对财富的获取，维护地位便要求保护祖传家产。然而，对于那些不止一个子女长大成人的家庭来说，诸子分产的习俗及其所引发的家庭摩擦必须得到审慎的处理。与这一目标相辅相成且同等重要的是，一旦为死者祈祷的基督教习俗变得普遍，为自己和家族安排身后的追思纪念便成为必需。礼仪性的追思纪念使财富的分散成为必然，无论是通过慈善施舍还是对修道院的捐赠。因此，必须制定继承策略，以平衡各种相互竞争的优先事项。\n至少从九世纪起，我们便可以窥见其中的一些做法以及女性在其中的位置。一种显而易见的方法是限制继承人的人数。除了使用唾手可得的草药避孕或堕胎手段之外，是否还实行了性节制，这一点无从得知。然而明确的是，父母会做出决定，引导其子女要么进入世俗生活——婚姻、继承和家族的延续——要么献身于宗教生活——恪守独身与禁欲。梅泽堡主教蒂特马尔(1009–1018年在任)生于975年，是瓦尔贝克伯爵西格弗里德与妻子库尼贡德的五个儿子中的第三个。前两个儿子被培养以备婚姻和贵族武士的生活：长子于991年继承父亲的伯爵之位，次子则获得了一份较为平庸的政治生涯。蒂特马尔和他的两个弟弟都被送入教会，并且最终都成为了主教。瓦尔贝克伯爵由此做出了一次精心计算的赌博：即使他的一个世俗儿子在留下继承人之前死去，另一个仍会延续家族血脉。而将三个儿子送入教会，他也同时关照了家族的精神需求。\n女儿们在家族规划中同样占有不可或缺的位置。大约一个世纪之前，即864年，年迈的弗留利藩侯埃贝哈德与他年轻得多的妻子吉塞拉立下遗嘱，将他们在意大利北部、阿拉曼尼亚和法兰德斯的巨额财富分配给子女。这对夫妇引起我们关注的原因很多——尤其是他们的遗嘱为细致考察家族策略提供了机会。在他们的五个儿子和四个女儿中，长子(以其父亲命名)夭折。在幸存的八个孩子中，两个儿子乌恩鲁赫和贝伦加尔以及一个女儿海尔维希被安排了婚姻。另外两个儿子阿达尔阿尔德和鲁道夫被送入宗教生活，成为法兰德斯宗教团体的修道院院长。一个以母亲命名的女儿也被奉献给上帝，在意大利北部作为修女抚养长大。第三个和第四个女儿的命运不得而知，但有理由怀疑她们终身未嫁。在规划子女前程时，埃贝哈德和吉塞拉早在子女继承之时到来之前，就已经塑造了家族的形态。\n他们对财产的遗嘱处置同样体现出坚定的父母策略。根据遗嘱条款，所有八个幸存的子女都将继承父母的珍贵物件和书籍；除一个女儿(下一页将详述)之外，所有人都还获得了土地。家产的最大份额，包括父亲在意大利和阿拉曼尼亚的全部土地，归于乌恩鲁赫。作为在世的最年长的儿子，他被期望继承父亲的政治地位和影响力：作为象征，他获得了父亲华美的镶珠宝镀金武器和金线刺绣的服饰——高等地位和帝国官职的标志。另外三个儿子(其中两个已入教团)都在法兰德斯获得了小得多的土地份额，唯一已婚的女儿海尔维希也是如此。她的继承从间接意义上是为了孙辈——事实上，她确实是三个已婚子女中唯一幸运地成功抚养出下一代成人的人。\n三个被送入宗教生活的孩子同样为家族的未来做出了贡献，因为他们所分得的土地遗产份额有助于满足家族对宗教追思的需求。将孩子献给教会，通过这个孩子建立起父母与宗教机构之间的密切联系；经由这个孩子转移的财产则巩固了这一联系，并为代祷以及基督教对全体家族成员的纪念做了安排。这类安排很少将土地完全排除在家族的影响范围之外：恰恰相反，它们建立起了往往延续数代的强大的互惠利益。这一切都体现在埃贝哈德和吉塞拉的规划之中。由于女儿的发修道愿按惯例伴随着向相应女修道院的土地赠予，对从事宗教生活的女儿吉塞拉的安排必定早于其父母的遗嘱，而遗嘱中分配给阿达尔阿尔德和鲁道夫的财产只是需要更长时间才进入教会管理。所涉的三座教堂中，一座与埃贝哈德的家族渊源深厚，另一座与吉塞拉的家族关系密切；第三座则是他们二人于法兰德斯的锡苏安共同创建的。埃贝哈德和吉塞拉会将随之进入阿达尔阿尔德、鲁道夫和小吉塞拉各自宗教团体的土地，视为与其分给其他子女的地产同等有效的对家族未来的投资。最后，我们还应注意年长的吉塞拉在其丈夫于866年去世后的处境。寡居的她动用自己的遗产，将锡苏安建成一个其家族成员可以安葬并得到祈祷纪念的场所，并先后任命阿达尔阿尔德、随后是鲁道夫为该院院长。她的部分土地由儿子们先行持有，待他们去世后转归这座家族修道院，从而再次兼顾了即时的经济供养与长期的祈祷纪念这两个目标。\n在埃贝哈德和吉塞拉去世之后的几代人中，一些贵族家庭开始发展出另一种策略，以限制财产在日益增多的后代之间被分割。有些家庭试探性地、断断续续地尝试只指定单一继承人，使家产代代保持完整。在这一点上，888年之后加洛林王朝衰落之际崛起为诸侯乃至王族权力的那些贵族家庭走在了前列。与其墨洛温 predecessors 一样，加洛林诸王也倾向于将王国视为可分割的家族遗产。但最后几位加洛林国王——从898年至987年统治西法兰西亚——掌握的权力和土地都太少，不敢冒险将其分割。他们与继之而成为东法兰克人统治者的奥托诸王一道，开创了指定单一继承人的传统，让较年轻的儿子们到教会中或为兄长效力以寻求前程。这是一种高风险的策略，使长子暴露在兄弟们的挑战与叛乱之下。\n国王与诸侯率先垂范，贵族纷纷效仿，尤其是在前加洛林帝国的核心地带。在这里，自九世纪起，在人口和经济增长的推动下，家族与土地之间的关系开始逐渐重构。到十二世纪，西北欧的精英家族普遍将土地不加分割地由父亲传给一个儿子，通常是在世最年长的儿子。然而这种做法从未普及开来，因为直到中世纪末期乃至更晚，诸子分产的习俗在欧洲的广大地区仍然普遍存在。\n有一点从未改变：获得土地便带来地位与影响的机会。对男性而言，这意味着参与王国政治生活的可能，并在领主或国王麾下效力以寻求进一步的奖赏。对女性而言，作为女继承人或寡妇获得土地固然可能带来影响力，但同时也加深了她们的脆弱性。中世纪早期，女性无论多么富有，都永远无法将自身的影响力与王室政府中的正式官职相结合。伯爵、公爵、郡守或管家之类的制度性职位只授予或由男性继承，王位亦然，而女性只能是这些职位从一个男人传递到另一个男人的渠道，是其地位与合法性的保证人。即使从十世纪晚期起，伯爵之妻越来越多地被称为“伯爵夫人”，其中那些因寡居而须替幼年继承人执政的女性开始将其用作正式的公开头衔，这一头衔的转变也并不意味着她们获得了任何以自身权利被任命为官职的新能力。相反，它确认了婚姻和母性作为其威望与影响力之源泉的地位。正如王后或许可以在体弱多病或昏庸无能的国王之妻或幼年君主之母的身份下行使巨大的政治影响力，却不能以自己的名义继承王位或被选为王位继承人一样，在整个贵族阶层中，女性获取权力的途径是作为妻子、母亲或寡妇。因此，土地财富或许能给女性带来财富和影响力，却无法带来制度化的权力与权威。\n近年来，人们对十一世纪早期家庭结构转变的强调有些过头了——即从中世纪早期松散的双边亲族群体，转变为中世纪盛期高度聚焦于父系的家族，财产由长子传给长子，使女儿和幼子日益处于不利境地。就实际发生的变迁而言，它们既非突然出现，也非普遍推行，而且始终只是积累土地的诸多方式之一。幼子可以通过迎娶女继承人、接受在世亲属的赠予、受益于王室恩庇或以其他方式获取财产——例如移民他乡——来维持自身地位。意外死亡在十二世纪对父亲土地分配计划的扰乱，与八世纪同样容易。从女性在家族策略中的位置这一视角来看，她们始终是财产在代际之间、在亲族群体之间流动的渠道。作为女儿，她们在十二世纪因无兄弟而获得继承的机会与九世纪时一样大。作为妻子，她们的婚姻仍然需要其父亲与丈夫之间经过精心计算的、双方同意的财产交易。作为寡妇，她们仍然掌控着家族土地的相当大部分，虽易受他人觊觎，却是财产传递的核心。\n家庭、性伴侣关系，以及(若富有)财产继承：这些构成了中世纪早期男女生活于其中的基本框架。尽管婚姻观念不断变化、继承策略有所转移、社会实践存在广泛的地区差异，但本章始终贯穿着两个主题。第一个是女性在其家族事务中的核心地位。幼年便被献身宗教生活的女孩；盛年早逝、葬于随葬品丰厚之墓中的母亲；为迎合父亲的政治需要而被订婚、随后又被抛弃的权贵之女；继承被母亲阻断的儿子；为挽救婚姻而骑马远赴罗马的妻子；在丈夫亲属的要求与修道院的庇护之间犹豫不决的寡妇：这一切都凸显了女性生活的家族语境，以及塑造这种生活的亲缘纽带。第二个主题是女性的经历与男性的机会之间的种种差距——有时可以协商，有时则不然。尽管每个家庭各有其独特性，个人气质各异，长寿或早逝难以预料，男性却几乎总是占据优势。无论是就与女性发生性关系的权利和继承土地的权利而言，还是就支配妻子和女儿的权威而言，默契的社会成见和明文的法律原则都对他们有利。尤为重要的是，当一个男孩被送去 influential 亲戚、其父亲的领主乃至国王的家中时，他离开了直接的家族圈子，开始在一个朋友与亲族同等重要的世界里寻找自己的道路。对他而言，婚姻和为人之父只是对其他同样重要的亲缘纽带和政治关系的补充。\n作为国王、诸侯和主教，立法、修订社会规范、作出判决的都是男性。抄录特许状、撰写历史与编年史、撰写道德论著、描绘理想社会关系的，也大多是他们或其下属。从罗马世界继承而来的法律、思想和宗教传统，为这个向男性倾斜的世界提供了强有力的正当性论证。难怪他们的声音最为响亮，也难怪许多世代的历史学家都轻易地将中世纪早期视为一个男人的世界，或者至少是从男性的视角来看待它。在某种程度上，这确实准确地反映了男性远比女性更有可能拥有巨大财富和权力的社会。但是，正如本章所强调的，意识形态的期待与社会现实之间往往存在相当大的脱节：我们切不可将二者混淆或混为一谈。当中世纪早期的男女偶尔发现自己撞上严苛的法律要求或僵化的道德期待时，日常塑造他们相互关系的，乃是习俗性的期待和未曾言明的成见。", "sections": [{"level": 2, "title": "性别差异", "id": "ch6-s0"}, {"level": 2, "title": "生育的结合", "id": "ch6-s1"}, {"level": 2, "title": "女性、家庭与继承", "id": "ch6-s2"}]}, {"id": "c7", "title": "第5章 · 劳役与领主权", "kicker": "第三编 · 资源", "part": "第三编 · 资源", "html": "<p>“耕夫，你说什么？你是怎样干你的活儿的？”</p>\n<p>“哦，老爷，我干活儿极为辛苦。天一亮我就出门，赶着牛去田里，把它们套在犁上。无论冬天多么严酷，我都不敢赖在家里，因为惧怕我的老爷……是的，活儿苦得很，因为我不是自由人。”<sup class=\"fn\" data-note=\"5:1\">1</sup></p>\n<p>人人当依附其领主；\n人人当守护其领地。\n人之顶为领主；\n人之根为领地。<sup class=\"fn\" data-note=\"5:2\">2</sup></p>\n<p>土地、在土地上劳作的人，以及对这些人施行统治的人，这些主题将我们引向社会、经济与政治关系的核心。约公元500年至1000年间，欧洲居民的绝大多数都生活于土地之上并直接耕作：他们的生活方式受到维持农业年节律所需的体力劳作的制约。同样重要的是，对地产的控制和对剩余产品的攫取，是个人与群体之间关系的核心。上一章已表明，中世纪早期的男女社会差别往往取决于对土地的不同权利；本章则承接社会分层的主题，探讨土地持有如何支撑起杂乱不齐的不平等等级。</p>\n<p>本章的核心论点是：对人的控制与对土地的控制无法截然分开。这种结合几乎是所有中世纪早期共同体政治组织的基本要素，因为领主权同时涵盖了二者，或分或合。牲畜、奴隶或土地的所有者，凭其行使于其上的权力而为领主。家长亦然，凭其对于家中从最卑微到最显贵的所有成员的权威而为领主。</p>\n<p>因此，领主权本质上是一种社会权力，根植于人际关系和对资源的控制，尤其是土地和牲畜。作为对主人、酋领、国王、皇帝或基督教上帝的称谓，“领主”一词承认了这种权力，暗含恭顺，并表达对居首位者的尊敬。因此，女性也可以是领主，只要她控制着庄园或以自己的名义进行统治。简言之，中世纪早期的不平等不仅是物质财富及其带来的生活方式上的不平等，也是社会影响力和政治权力上的不平等。</p>\n<p>我们的出发点是一个直截了当的观察：中世纪早期人们所形成的各种群体——无论是孤立的村落共同体，还是大型王国与帝国——都显示出资源、财富、法律权利和身份上的差异。这些不平等并不彼此整齐对应，因为法律权利并不保证物质财富，正如司法等级并不反映人们对身份的主观认知一样。尽管男女生活在一个支配与从属的世界里，这一梯度却从来不是井然有序或系统化的，除非在某些法典和条理化法律论著条分缕析的措辞之中。毋宁说，它源于支配他人的现实：居于底层者通过习俗与传统、法律约束与制裁、形形色色的依附与庇护关系、威吓行为与实际暴力，或仅仅出于恐惧，而屈从于居于上层者。</p>\n<p>“活儿苦得很，因为我不是自由人”：耕夫的哀叹提醒我们，土地、社会等级和权力的历史也牵动着自由与奴役这一动人心弦的问题。正因如此，这段历史常常引发争议。历史学作为一门学科，兴起于一个充斥着关于现代适当政治秩序之激烈论辩的环境中——绝对主义还是贵族政治，自由派还是保守派，资产阶级还是马克思主义。社会理论家、论战家与历史学家都在中世纪早期的过去中寻找他们所渴望的自由之先声、他们所反抗的压迫之根源，或他们所辩护的特权之正当性。在这种氛围中，他们构建出中世纪早期数个世纪的图式化、笼统化的概观，并轻易地将其视为农民自由的黄金时代，或是剥削与压迫的熔炉——也就是说，是此后人类生存“更好”或“更坏”阶段的前奏：这些旧日激情的阴影至今仍笼罩着关于中世纪早期农民的论辩。</p>\n<p>本书采取的进路有所不同。它假定经验的多样性是中世纪早期的特征。它不寻求关于土地、劳役与领主关系的统一叙事，而是循着中世纪早期史料本身流动的术语和多元视角，去探寻各种各样的地方性形态。通过考察广泛的政治结构——大帝国、小酋领、紧凑而集约的政体、发展中的王国——本章论证，地区差异与历时变化是所有中世纪早期社会等级的标志。本章从阶梯的底层开始，探讨奴隶制与农奴制以及自由的意涵。第一节论证，尽管自由与不自由之别具有根本性的法律意义，社会现实却远比这一整齐的对立所暗示的更为复杂。中间一节聚焦于围绕土地控制组织起来的社会不平等。通过考察触及农民生活的形形色色的领主权形式，它主张应对变化的局部情势与政治语境保持敏感。最后一节转向社会的上层，探讨高等级身份如何被认知、维系或受到挑战，以及领主权如何也体现政治关系。</p>\n<h2 id=\"ch7-s0\">奴役与自由</h2>\n<p>“除了自由人和奴隶之外别无他类”：这是一句罗马法律格言，查理曼在裁决父母一方自由、一方不自由的子女的身份时发现它颇为有用。<sup class=\"fn\" data-note=\"5:3\">3</sup> 与古代世界一样，自由与奴役之别仍是所有中世纪早期共同体中根本的法律分界。这是一对相反之物，是司法两极的彻底表述。最简单地说，它区分了生命与肢体不可侵犯之人，与身体安危及生存仍操于他人之手的另一类人。</p>\n<p>然而在实践中，奴役与自由并不构成两极对立。毋宁说，它们构成一个光谱的两端。依附有程度之分，自由及其带来的好处亦有程度之分，因为奴役与自由都是相对的概念。一条支配与从属的滑动标尺贯穿整个光谱：在其顶端，各种依附形式组织着精英与其统治者之间的政治关系；在其底端，则构建着对乡村劳动力的剥削。强加于不自由者身上的屈辱义务没有任何荣耀可言，而权贵为国王所尽的服务却增进地位与荣耀。二者都向上级提供servitium（服务）。在社会梯度的每一点上，服务与领主权都是一枚硬币的两面：不同的只是其形式与社会价值。无论如何，依附与自由与其说是单一的概念，不如说是一束束限制与特权，可以以许多不同的方式组合在一起。其中突出的有：迁徙自由；对自己身体及其劳动的控制；携带武器的权利；诉诸法庭的权利；财产所有权；结婚或继承的权利；对自己子女的承认；以及追求荣耀。每一项都可通过司法程序、习俗或社会评价，以不止一种方式被剥夺或被承认。</p>\n<p>然而，关键在于，其中一项欠缺并不意味着所有欠缺都随之而来。无论我们看向何处，都会发现大量的中间身份，将自由的某些方面与不同程度的依附结合在一起。这些身份无法归类；正如在许多其他方面一样，最好还是承认本地实践的无比多样性。出身奴仆却可身居高位，这是可能的，例如八世纪巴伐利亚的adalschalks（“高贵的非自由人”），以及十世纪末、十一世纪初德意志的ministeriales（仆役骑士）。这两个群体都缺乏法律上的自由，却为其领主履行荣耀而需要技艺的服务。自由却处于依附地位，这也是可能的；我们稍后将会见到一些自由人的例子，他们每年向大教堂或修道院缴纳款项，以承认其领主权。<sup class=\"fn\" data-note=\"5:4\">4</sup> 这类情况的一个变体是十、十一世纪英格兰西部的骑行者（radcnihts、geneats）。这些是有财产的依附者，富裕到足以拥有马匹，例如蒂德纳姆巴斯修道院地产上的那些人，其义务包括“骑马、提供运送服务、供给运输、驱赶畜群以及做许多其他事情”。<sup class=\"fn\" data-note=\"5:5\">5</sup> 他们与那个女奴的境况相去甚远——那个女奴的领主本人是个不自由的农民，却对她进行性剥削——这暗示了女性所遭受的从属处境甚至比
