bensformen (Sigmaringen, 1990), 211–20，以及 Il Matrimonio nella società altomedioevale, Settimane, 24, 2 vols. (1977) 中收录的论文。晚罗马时期的背景由 Judith Evans Grubb, Law and Family in Late Antiquity: The Emperor Constantine’s Marriage Legislation (Oxford, 1995) 加以评述。关于盎格鲁-撒克逊英格兰，Margaret Clunies Ross, ‘Concubinage in Anglo-Saxon England’, Past and Present, 108 (1985), 1–34 至关重要；就爱尔兰而言，Donnchadh Ó Corráin 的文章 ‘Marriage in Early Ireland’, in Art Cosgrove (ed.), Marriage in Ireland (Dublin, 1985), 5–24，以及 ‘Women and the Law in Early Ireland’, in Mary O’Dowd and Sabine Wichert (eds.), Chattel, Servant or Citizen: Women’s Status in Church, State and Society (Belfast, 1995), 45–57，是 Charles-Edwards, Early Irish and Welsh Kinship (见本书第325页) 的有益补充。另见 Ruth Mazo Karras, ‘Concubinage and Slavery in the Viking Age’, Scandinavian Studies, 62 (1990), 141–62。\nMayke de Jong, ‘To the Limits of Kinship: Anti-Incest Legislation in the Early Medieval West’, in Jan Bremmer (ed.), From Sappho to de Sade: Moments in the History of Sexuality (London, 1989), 36–59，介绍了限制婚姻对象选择的种种尝试；Patrick Corbet, Autour de Burchard de Worms: L’Église allemande et les interdits de parenté (IXe–XIIe siècle) (Frankfurt, 2001) 对这一主题作了更为详细的考察。比较研究包括：Bart Jaski, ‘Marriage Laws in Ireland and on the Continent in the Early Middle Ages’, in Christine Meek and Katharine Simms (eds.), ‘The Fragility of her Sex’? Medieval Irishwomen in their European Context (Dublin, 1996), 16–42，以及 Daffyd Walters, The Comparative Legal Method: Marriage and Divorce and the Spouses’ Property Rights in Early Medieval European Law and in Cyfraith Howel (Aberystwyth, 1982)。\nCarl I. Hammer 的两项研究探讨了涉及奴隶的两性关系与婚姻以及奴隶之间的婚姻问题：‘The Handmaid’s Tale: Morganatic Relationships in Early-Mediaeval Bavaria’, Continuity and Change, 19 (1995), 345–68，以及 ‘A Slave Marriage Ceremony from Early Medieval Germany: A Note and a Document in Translation’, Slavery and Abolition, 16 (1995), 243–9。加泰罗尼亚伯爵的婚姻实践见于 Martin Aurell, Les Noces du comte: Mariage et pouvoir en Catalogne (785–1213) (Paris, 1995)。\n女性、财产与继承已不再是法律史学家的专属领域。关于晚罗马时期的背景及继立诸王国直至7世纪的立法，Antti Arjava, Women and Law in Late Antiquity (Oxford, 1996) 论述详尽，并可辅以 Karl Kroeschell, ‘Söhne und Töchter im germanischen Erbrecht’, in Götz Landwehr (ed.), Studien zu den germanischen Volksrechte: Gedächtnisschrift für W. Ebel (Frankfurt, 1982), 87–116。\n关于婚姻财产转让、女性获取财产的途径及其在家族继承策略中的作用，现已出现重要成果。两部新近的会议论文集以专题方式考察了诸多不同地区：‘Les Transferts patrimoniaux en Europe occidentale, VIIIe–Xe siècle: Actes de la table ronde de Rome, Mai 1999’，刊于 Mélanges de l’École Française de Rome—Moyen Age, 111 (1999), pt. 2；以及 François Bougard, Laurent Feller, and Régine Le Jan (eds.), Dots et douaires dans le haut moyen âge, Collection de l’École Française de Rome, 295 (Rome, 2002)。\n补充研究包括：Cristina La Rocca, ‘Pouvoirs des femmes, pouvoirs de la loi dans l’Italie lombarde’, in Lebecq et al. (eds.), Femmes et pouvoirs des femmes, 37–50 (见本书第327页)；Brigitte Pohl-Resl, ‘“Quod me legibus contanget auere”: Rechtsfähigkeit und Landbesitz langobardischer Frauen’, Mitteilungen des Instituts für Österreichische Geschichtsforschung, 101 (1993), 201–27；Ingrid Heidrich, ‘Besitz und Besitzverfügung verheirateter und verwitweter freier Frauen im Merowingischen Frankenreich’, in Goetz (ed.), Weibliche Lebensgestaltung, 119–38 (见本书第327页)。10至11世纪斯堪的纳维亚的铭文史料由 Birgit Sawyer, Property and Inheritance in Viking Scandinavia: The Runic Evidence (Alingsås, 1988) 加以分析。关于晚盎格鲁-撒克逊时期的英格兰，Pauline Stafford 的研究至关重要：参见 Queen Emma and Queen Edith: Queenship and Women’s Power in Eleventh-Century England (Oxford, 1997)，及其所引她此前关于广泛议题的著述。\n关于家族、纪念与继承策略之间联系的关键研究是 Barbara Rosenwein, To be the Neighbor of Saint Peter: The Social Meaning of Cluny’s Property, 909–1049 (Ithaca, NY, 1989)。女性在盎格鲁-撒克逊英格兰的纪念与继承中的核心作用，见于 Julia Crick 的两篇论文：‘Women, Posthumous Benefaction, and Family Strategy in Pre-Conquest England’, Journal of British Studies, 38 (1999), 399–422，以及 ‘Posthumous Obligation and Family Identity’, in William O. Frazer and Andrew Tyrrell (eds.), Social Identity in Early Medieval Britain (Leicester, 2000), 194–208。Brigitte Pohl-Resl, ‘Vorsorge, Memoria und soziales Ereignis: Frauen als Schenkerinnen in den bayerischen und alemannischen Urkunden des 8. und 9. Jahrhunderts’, Mitteilungen des Instituts für Österreichische Geschichtsforschung, 103 (1995), 265–87，提出了类似的论点。\n近期研究表明，寡妇是理解上述诸多问题的关键：参见 Janet L. Nelson, ‘The Wary Widow’, in Wendy Davies and Paul Fouracre (eds.), Property and Power in the Early Middle Ages (Cambridge, 1995), 82–113；Rolf H. Bremmer, ‘Widows in Anglo-Saxon England’, in Jan Bremmer and Lourens van den Bosch (eds.), Between Poverty and the Pyre: Moments in the History of Widowhood (London, 1995), 58–88，以及 Emmanuelle Santinelli, Des Femmes éplorées? Les Veuves dans la société aristocratique du haut moyen âge (Villeneuve-d’Ascq, 2003)。\n关于继承策略在11世纪发生转变、从而使家族全部财产得以由长子传至长子的论点，由 Georges Duby 在20世纪60至70年代的一系列著名文章中提出；其英文版本见 The Chivalrous Society, trans. Cynthia Postan (London, 1977) 第3章和第6章。对这一过时正统观念的批评有：Theodore Evergates, ‘Nobles and Knights in Twelfth-Century France’, in T. N. Bisson (ed.), Cultures of Power: Lordship, Status and Process in Twelfth-Century Europe (Philadelphia, 1995), 11–35，以及 Pauline Stafford, ‘La Mutation familiale: A Suitable Case for Caution’, in Joyce Hill and Mary Swan (eds.), The Community, the Family and the Saint: Patterns of Power in Early Medieval Europe (Turnhout, 1998), 103–25。\n本书第138–139页关于女性所拥有财产比例的数据源自以下研究：Arjava, Women and Law in Late Antiquity (见本书第328页)；David Herlihy, ‘Land, Family and Women in Continental Europe, 701–1200’, Traditio, 18 (1962), 89–120，以及 Marc A. Meyer, ‘Women’s Estates in Later Anglo-Saxon England: The Politics of Possession’, Haskins Society Journal, 3 (1991), 111–29。\n本书第143–145页所用的埃伯哈德与吉斯拉的遗嘱及相关特许状，由 Ignace de Coussemaker 刊布于 Cartulaire de l’abbaye de Cysoing et ses dependences, 2 vols. (Lille, 1880), i. 1–11；另见 Cristina La Rocca and Luigi Provero, ‘The Dead and their Gifts: The Will of Eberhard, Count of Friuli and his Wife Gisela, Daughter of Louis the Pious (863–864)’, in Frans Theuws and Janet L. Nelson (eds.), Rituals of Power from Late Antiquity to the Early Middle Ages (Leiden, 2000), 225–80 中的详细分析。\n第五章 劳动与领主权\n关于早期中世纪社会等级的文献较为零散，且仍受各国民族史学的局限。几乎唯一的例外是 Werner Rösener, The Peasantry of Europe (Oxford, 1994)。关于盎格鲁-撒克逊英格兰，参见 Pauline Stafford, Unification and Conquest: A Political and Social History of England in the Tenth and Eleventh Centuries (London, 1989)；W. G. Runciman, ‘Accelerating Social Mobility: The Case for Anglo-Saxon England’, Past and Present, 104 (1984), 3–30；以及 Rosamond Faith, The English Peasantry and the Growth of Lordship (Leicester, 1997)。David Pelteret, Slavery in Early Medieval England from the Reign of Alfred to the Twelfth Century (Woodbridge, 1995) 十分重要。关于爱尔兰，N. B. Aitchison, ‘Kingship, Society and Sacralisation: Rank, Power and Ideology in Early Medieval Ireland’, Traditio, 49 (1994), 45–75，以及 Paul Holm, ‘The Slave Trade of Dublin, 9th–12th Centuries’, Peritia, 5 (1986), 317–45，均颇具新意且富有启发。\n就欧洲大陆而言，关于奴隶制的标准性著作（现已过时）是 Charles Verlinden, L’Esclavage dans l’Europe médiévale, 2 vols. (Bruges, 1955; Ghent, 1977)。关于从奴隶制向农奴制过渡的讨论有时相当激烈，但总体上仍以 Marc Bloch, ‘How and Why Ancient Slavery Came to an End’, in Slavery and Serfdom in the Middle Ages: Selected Essays by Marc Bloch, trans. William R. Beer (Berkeley, 1975), 1–31 为出发点。一项最初于1985年以法文发表的重要论战性成果是 Pierre Bonnassie, ‘The Survival and Extinction of the Slave System in the Early Medieval West (Fourth to Eleventh Centuries)’, in id., From Slavery to Serfdom in South-Western Europe, trans. Jean Birrell (Cambridge, 1991), 1–59。Carl I. Hammer, A Large-Scale Slave Society of the Early Middle Ages: Slaves and their Families in Early Medieval Bavaria (Woodbridge, 2002) 延续了这一争论。Wendy Davies, ‘On Servile Status in the Early Middle Ages’, in M. L. Bush (ed.), Serfdom and Slavery: Studies in Legal Bondage (London, 1996), 225–46，既是清醒的分析，也是将大陆社会与岛屿社会并置讨论的独特尝试。\n贵族问题则尚无此类比较性研究。大陆的相关议题已由英语的综合性综述讨论很好地覆盖，可引导读者查阅所有相关的外文文献。参见 Timothy Reuter, ‘The Medieval Nobility in Twentieth-Century Historiography’, in Bentley (ed.), Companion to Historiography, 177–202 (见本书第314页)；J. B. Freed, ‘Reflections on the Medieval German Nobility’, American Historical Review, 91 (1986), 553–75；以及 Jane Martindale, ‘The French Aristocracy in the Early Middle Ages: A Reappraisal’, Past and Present, 75 (1977), 5–45 (重刊于同氏， Status, Authority and Regional Power: Aquitaine and France, 9th to 12th Centuries (Aldershot, 1997), ch. IV)。Paul Fouracre, ‘The Origins of the Nobility in Francia’, in Anne J. Duggan (ed.), Nobles and Nobility in Medieval Europe: Concepts, Origins, Transformations (Woodbridge, 2000), 17–24，是简明的最新综述。\nLe Jan, Famille et pouvoir dans le monde franc (见本书第325页)，对大陆贵族的各个方面都很重要。Karl Ferdinand Werner, Naissance de la noblesse (Paris, 1998)，在文化层面颇具启发性，在制度层面则引起争议。另见 Hans-Werner Goetz, ‘“Nobilis”: Der Adel im Selbstverständnis der Karolingerzeit’, Vierteljahrschrift für Sozial- und Wirtschaftsgeschichte, 70 (1983), 153–91；Karl Bosl, ‘Potens und pauper: Begriffsgeschichtliche Studien zur gesellschaftlichen Differenzierung im frühen Mittelalter und zum “Pauperismus” des Hochmittelalters’, in id., Frühformen der Gesellschaft im mittelalterlichen Europa (Munich, 1964), 106–34；Karl Leyser, ‘Early Medieval Canon Law and 骑士制度的起源’，载于卢茨·芬斯克、维尔纳·勒泽纳和托马斯·措茨(编)，《中世纪的制度、文化与社会：纪念约瑟夫·弗莱肯施泰因65岁寿辰纪念文集》(西格马林根，1984年)，第549–566页(重印于同作者，《中世纪欧洲的交往与权力，第一卷：加洛林与奥托时代》，蒂莫西·罗伊特编，伦敦，1994年，第189–213页)。\n关于精英生活方式的重要论文有蒂莫西·罗伊特，《贵族与其他人：中世纪权力关系的社会与文化表达》，载于达根(编)，《贵族与贵族身份》，第85–98页(见上文第330页)，以及罗宾·弗莱明，《晚期盎格鲁-撒克逊英格兰的新财富、新富人与新政治风格》，《盎格鲁-诺曼研究》，第23期(2000年)，第1–22页。\n领主权在中世纪早期大陆方面产生了大量文献。就总体而言，可参见乔治·杜比的分析，敏感但如今略显过时，《中世纪西方的农村经济与乡村生活》(伦敦，1968年)。菲利普·孔塔米纳、马克·邦佩尔、斯特凡·勒贝克和让-吕克·萨拉赞的《中世纪经济》(巴黎，1993年)以及德夫罗伊的《农村经济与社会》(见上文第321页)对其作了很好的更新。大卫·赫利希，《欧洲大陆的教会财产，701–1200年》，《镜报》，第36期(1961年)，第81–105页，试图逐个地区评估教会掌握的土地数量，而戴维斯和富拉克(编)，《中世纪早期的财产与权力》(见上文第329页)则探讨了土地如何维系政治权威。\n关于庄园组织的大多数文献仅涉及法兰克帝国；让-皮埃尔·德夫罗伊的《法兰克王国的大庄园：一个尝试性的动态定义》(载于同作者，《加洛林大庄园研究》，奥尔德肖特，1993年，第一章)是一部出色的导论。阿德里安·费尔胡尔斯特的《加洛林经济》(剑桥，2002年)是一部有用的概览，附有关于大量专业性文献的详细书目。以下几篇讨论尤为启人深思：卢道夫·库兴布赫，《中世纪早期的修道院领地制：一项阶段性总结》，载于弗里德里希·普林茨(编)，《统治与教会：论主教制与修道制组织形式的形成及其运作方式》(斯图加特，1988年)，第297–343页；弗雷德·施温德，《论加洛林时代的修道院作为经济实体与手工业活动场所》，载于芬斯克等(编)，《中世纪的制度、文化与社会》，第101–123页(见前)；皮埃尔·图贝尔，《庄园制体系：八、九、十世纪意大利的内部生产与交换》，载于《意大利史：年鉴，第6卷：自然经济与货币经济》(都灵，1983年)，第5–63页(重印于同作者，《中世纪早期史与中世纪意大利史》，伦敦，1987年，第八章)；威克姆，《中世纪早期的欧洲森林》(见上文第320页)。\n关于领主权的军事方面，迪克·惠特克，《地主与军阀》，载于约翰·里奇和格雷厄姆·希普利(编)，《罗马世界的战争与社会》(伦敦，1993年)，第277–302页，对整个帝国晚期罗马社会的军事化颇有助益。关于中世纪早期兵员征募争论的简明概述，参见蒂莫西·罗伊特，《中世纪早期的军队征募：我们能知道什么？》，载于安妮·诺高·约恩森和比尔莎·L·克劳森(编)，《欧洲视野下的斯堪的纳维亚社会的军事面向，公元1–1300年》(哥本哈根，1997年)，第32–37页。另见爱德华·詹姆斯，《罗马社会的军事化，400–700年》，同上书，第19–24页；伯纳德·S·巴赫拉赫，《墨洛温军事组织，481–751年》(明尼阿波利斯，1972年)；同作者，《早期加洛林战争：帝国的序幕》(费城，2000年)；理查德·阿贝尔斯，《盎格鲁-撒克逊英格兰的领主权与军事义务》(伯克利，1988年)；F·普林茨，《中世纪早期的教士与战争：关于教会在王权建构中之作用的研究》(斯图加特，1971年)；盖伊·霍尔索尔，《蛮族西方的战争与社会，450–900年》(伦敦，2003年)。\n联结地方与各个区域、继而汇聚于加洛林政治体的各种领主权网络，近来在英语学术界受到大量关注。温迪·戴维斯的《小世界：中世纪早期布列塔尼的乡村共同体》(伦敦，1988年)、保罗·富拉克的《查理·马特的时代》(哈洛，2000年)、马修·英尼斯的《中世纪早期的国家与社会：中莱茵河谷，400–1000年》(剑桥，2000年)以及西蒙·麦克莱恩的《九世纪末的王权与政治：胖子查理与加洛林帝国的终结》(剑桥，2003年)呈现了各不相同的架构，均附有大量外语文献。苏珊·雷诺兹的《封地与封臣：对中世纪证据的重新解读》(牛津，1994年)，在中世纪早期恩地问题上引人入胜地提出了争议性观点。\n围绕十世纪末和十一世纪初 currently 激烈争议纷纭。骑士、城堡和地方领主权的兴起，只是关于社会秩序与政治秩序关系这一更大争论——尤其是在法国——中的若干具体主题。其大致风貌可从《辩论中世纪》(利特尔和罗森韦恩编，第105–210页，见上文第314页)中窥见。皮埃尔·博纳西和皮埃尔·图贝尔(编)，《千年前后的欧洲的人与社会》(图卢兹，2004年)中的论文是富有思辨性的评估。\n正文第164–172页所讨论的根特圣彼得修道院在艾恩哈德和阿努尔夫一世时期的地产详情，取自M·吉塞林和A. C. F. 科赫(编)，《公元1100年前比利时文献汇编》，第1卷(布鲁塞尔，1950年)，第49–56号文书，第123–149页。另见阿德里安·费尔胡尔斯特，《论根特圣彼得修道院与圣巴夫修道院的创建及其最早的历史》，《根特历史与古物学会刊》，新辑，第7期(1953年)，第3–53页；乔治·德克勒克，《艾恩哈德与加洛林时代的根特》，载于赫尔曼·舍费尔斯(编)，《艾恩哈德：生平与著作研究》(达姆施塔特，1997年)，第223–246页。\n关于根特城，见阿德里安·费尔胡尔斯特和乔治·德克勒克，《两大修道院与伯爵城堡之间的中世纪早期根特》，载于G·德卡韦莱(编)，《根特：为一座反叛之城辩护》(安特卫普，1989年)，第1–52页(重印于费尔胡尔斯特，《中世纪早期西北欧的乡村与城市面向》，奥尔德肖特，1992年，第十二章)；就更广阔的背景而言，见大卫·尼古拉斯，《中世纪佛兰德尔》(伦敦，1992年)。\n以上所有这些不过是浩瀚书海中冰山之一角，其背后深深 embedded 着一个史学难题。对后者感兴趣的读者可从以下著作中领略相关论争的风貌：奥托·布伦纳，《封建主义：一个概念的历史》，载于弗雷德里克·L·谢耶特(编)，《中世纪欧洲的领主权与共同体：文选》(纽约，1968年)，第32–61页；J. W. 伯罗，《“乡村共同体”与十九世纪英格兰对历史的运用》，载于尼尔·麦肯德里克(编)，《历史视角：纪念J. H. 普拉姆的英国思想与社会研究》(伦敦，1974年)，第255–284页；以及瓦尔特·波尔，《统治》，《日耳曼古代学百科辞典》，第14卷(1999年)，第445–457页。\n第六章 获取与给予\n关于中世纪早期贸易与交换的文献仍分成许多分支领域：考古的或历史的、城市的或乡村的、晚古的或中世纪的。作为构建总体图景的一种尝试，理查德·霍奇斯和大卫·怀特豪斯的《穆罕默德、查理曼与欧洲的起源：考古学与皮朗命题》(伦敦，1983年)既启人深思又始终充满争议。关于重要的新研究进路，可结合英奇·吕丝·汉森和克里斯·威克姆(编)，《漫长的八世纪：生产、分配与需求》(莱顿，2000年)，参看理查德·霍奇斯和威廉·鲍登(编)，《六世纪：生产、分配与需求》(莱顿，1998年)。\n关于西罗马帝国终结的社会经济方面，我借鉴了克里斯·威克姆的《另一种转型：从古代世界到封建主义》，《过去与现在》，第113期(1984年)，第3–36页，以及《意大利与中世纪早期》，载于克劳斯·兰兹堡(编)，《欧洲的诞生：公元第一个千年的考古学与社会发展》(罗马，1989年)，第140–151页(两者均重印于威克姆，《土地与权力》，见上文第320页)。另见迈克尔·亨迪，《从公共到私人：西方蛮族铸币作为晚期罗马国家结构解体的镜像》，《旅行者》，第19期(1988年)，第29–78页。对立立场见让·迪尔利亚，《从戴克里先到加洛林王朝的公共财政(284–889)》(西格马林根，1990年)。\n迈克尔·麦考密克的《欧洲经济的起源：交往与商业，公元300–900年》(剑桥，2001年)将关于地中海地区的重要研究与关于奴隶贸易在经济变迁中之核心地位这一争议性论点结合在一起。关于它引发的若干问题，见爱德华·詹姆斯等，《〈欧洲经济的起源〉：与迈克尔·麦考密克的商榷》，《中世纪早期欧洲》，第12期(2003年)，第259–323页。佩里格林·霍登和尼古拉斯·珀塞尔的《腐化之海：地中海史研究》(牛津，2000年)强调地中海的微观经济和地方性“连通性”网络。迪特里希·克劳德的较早研究至今仍然关键：《中欧与北欧史前及早期历史时期的贸易与交通研究，第2卷：中世纪早期西地中海的贸易》(哥廷根，1985年)。\n北方贸易网络是《中欧与北欧史前及早期历史时期的贸易与交通研究》第3卷《中世纪早期的贸易》和第4卷《加洛林与维京时代的贸易》的主题，两卷均由克劳斯·迪维尔、赫伯特·扬库恩、哈拉尔·西姆斯和迪特·廷佩(编)(哥廷根，1985年和1987年)。弗里斯兰商人的重要贡献由斯特凡·勒贝克予以文献记录，《中世纪早期的弗里斯兰商人与航海家》，2卷(里尔，1983年)。奥利维·布吕昂，《加洛林时代的旅行者与商人：八、九世纪卢瓦尔河与默兹河之间的交通网络》(布鲁塞尔，2002年)强调地方、区域与远程贸易之间的互动。\n关于爱尔兰海地带，可见两种对立的解读：乔纳森·M·伍丁，《西航道上的交通与商业，公元400–800年》，《英国考古报告国际系列》，第654号(牛津，1996年)；以及尤安·坎贝尔，《外部接触的考古证据：公元400–800年凯尔特不列颠的进口、贸易与经济》，载于肯尼思·R·达克(编)，《外部接触与晚期罗马及后罗马不列颠的经济》(伍德布里奇，1996年)，第83–96页。玛丽·A·瓦兰特，《重新评估爱尔兰的“修道院城镇”》，《爱尔兰历史研究》，第31期(1998年)，第1–18页，对维京时代之前爱尔兰的交换持审慎评估。萨莉·福斯特、阿伦·麦金尼斯和罗纳德·麦金尼斯(编)，《从中世纪早期到二十世纪的苏格兰权力中心》(格拉斯哥，1998年)，以及斯蒂芬·T·德里斯科尔和玛格丽特·R·尼克(编)，《中世纪早期不列颠与爱尔兰的权力与政治》(爱丁堡，1988年)，对山堡及其他高级地位遗址给予了应有的关注。\n城镇——如何定义城镇、罗马城市的命运、非罗马欧洲的城市起源——是激烈争论的主题。J. H. W. G. 利贝斯许茨的《罗马城市的衰落与灭亡》(牛津，2001年)汇集了大量专门文献；与之相对的简明概述见S. J. B. 巴尼什，《古典城市的转型与皮朗争论》，《罗马考古杂志》，第2期(1989年)，第385–400页。理查德·霍奇斯的《查理曼时代的城镇与贸易》(伦敦，2000年)热情地为一种新的加洛林经济秩序辩护。意大利城市有自己特殊的争论：布赖恩·沃德-珀金斯，《延续论者、灾难论者与后罗马北意大利的城镇》，《罗马不列颠学校学刊》，第65期(1997年)，第157–176页；以及罗斯·巴尔扎雷蒂，《中世纪早期的城市与市场》，载于G·奥森达(编)，《帝国之后：走向欧洲蛮族的民族学》(伍德布里奇，1995年)，第113–142页。\n《剑桥英国城市史》，第1卷：600–1540年(剑桥，2000年)，大卫·帕利泽编，对盎格鲁-撒克逊城镇的大量文献收有审慎的概述；关于城镇与区域经济的关系，见克里斯托弗·斯卡尔，《维京时代之前的英格兰存在城市中心吗？》，载于约翰·海恩斯(编)，《从迁徙时代到八世纪的盎格鲁-撒克逊人：一个民族志视角》(伍德布里奇，1998年)，第269–310页；以及罗宾·弗莱明，《晚期撒克逊英格兰的乡村精英与城市共同体》，《过去与现在》，第141期(1993年)，第3–37页。伦敦的贸易特权由苏珊·凯利讨论，《八世纪英格兰颁发的贸易特权》，《中世纪早期欧洲》，第1期(1992年)，第3–28页。\n阿德里安·费尔胡尔斯特的《西北欧城市的兴起》(剑桥，1999年)评述了关于整个低地国家城镇与商埠的最新研究。斯堪的纳维亚商埠的详情可参见海伦·克拉克和比约恩·安布罗西亚尼，《维京时代的城镇》(莱斯特，1991年)，或约翰·卡尔默，《斯堪的纳维亚与波罗的海地区的城市化，700–1100年：贸易地、中心与早期城市遗址》，载于海伦·克拉克和比约恩·安布罗西亚尼(编)，《第十二届维京大会会议论文集：维京时代围绕波罗的海与北海的发展》，《比尔卡研究》，第3卷(斯德哥尔摩，1994年)，第50–90页。关于非罗马欧洲，见H. B. 克拉克和安格丽特·西姆斯(编)，《非罗马欧洲城市起源的比较史：九至十三世纪的爱尔兰、威尔士、丹麦、德国、波兰与俄罗斯》，《英国考古报告国际系列》，第255号，2卷(牛津，1985年)。\n关于铸币的广泛专门文献，最好通过彼得·斯帕福德，《中世纪欧洲的货币及其用途》(剑桥，1988年)，以及菲利普·格里尔森和马克·布莱克本，《中世纪欧洲铸币，附剑桥菲茨威廉博物馆藏币目录，第1卷：中世纪早期(五至十世纪)》(剑桥，1986年)来了解。\n一切关于给予与获取的讨论都以不同方式回溯到菲利普·格里尔森，《黑暗时代的商业：对证据的批判》，《皇家历史学会会刊》，第5辑，第9卷(1959年)，第123–140页(重印于格里尔森，《黑暗时代钱币学》，伦敦，1979年)。关于礼物交换，另见于尔根·汉尼希，《给予之术：论中世纪早期的赠予经济》，载于理查德·范·迪尔门(编)，《贫困、爱与荣誉》(法兰克福，1988年)，第11–37页；以及阿瑙-扬·拜斯特费尔德，《作为社会纽带与政治权力媒介的中世纪礼物：一种比较研究进路》，载于埃丝特·科恩和迈克·德·容(编)，《中世纪的转型：语境中的文本、权力与礼物》(莱顿，2001年)，第123–156页。\n对宝藏的批判性研究进路见绍罗·杰利基和克里斯蒂娜·拉·罗卡(编)，《宝藏：中世纪早期(五至十一世纪)财富积累的形式》(罗马，2004年)。E. M. 泰勒(编)，《中世纪西方的宝藏》(约克，2000年)中的部分论文亦有相关。马蒂亚斯·哈特评估了广泛的文本与实物证据，《中世纪早期的王室宝藏与权力表征》，载于瓦尔特·波尔和赫尔穆特·赖米茨(编)，《区隔的策略：族群共同体的建构，300–800年》(莱顿，1998年)，第255–280页。关于物质财富的形式与用途的变化，见克里斯蒂娜·拉·罗卡，《区隔的标志：伦巴德王国中从随葬品到“死后”捐赠》，载于L·帕罗利(编)，《伦巴德时代的中北部意大利》(佛罗伦萨，1997年)，第31–54页。蒂莫西·罗伊特，《加洛林帝国的劫掠与贡赋》，《皇家历史学会会刊》，第5辑，第35卷(1985年)，第75–94页，如今已成经典。\n关于女性对赠礼的参与，见迈克尔·J·恩赖特，《持蜜酒杯的夫人》，《中世纪早期研究》，第22期(1988年)，第170–203页；另见邦妮·埃弗罗斯，《以饮食缔造共同体：墨洛温高卢》(纽约，2002年)，以及第七章关于王后的延伸阅读。唐纳德·A·布洛补充了社会语境的其他方面，《朋友、邻里与同饮者：论中世纪早期西方的共同体与冲突》，《H. M. 查德威克纪念讲座》(剑桥，1990年)。\n武器的社会与象征价值由蕾吉娜·勒让讨论，《法兰克人的授械与权力仪式：加洛林时代的延续与变革》，以及海因里希·哈尔克（Heinrich Härke）《盎格鲁-撒克逊社会中的武器流通》，均载于泰乌斯与纳尔逊（主编）《权力仪式》，第281–309、377–399页（见上文第329页）。另见夏洛特·法贝赫（Charlotte Fabech）《南斯堪的纳维亚的战利品祭祀：一次重新评估》，载P. 加伍德、D. 詹宁斯、R. 斯克内茨与J. 汤姆斯（主编）《神圣与世俗：1989年牛津考古学、仪式与宗教会议论文集》（牛津，1991年），第88–99页。\n爱尔兰的牛只依附关系在涅里斯·帕特森（Nerys Patterson）富有启发性且引起争议的《牛群领主与氏族民：早期爱尔兰的社会结构》（第2版，圣母大学，印第安纳州，1994年）中有所分析。A. T. 卢卡斯《古代爱尔兰的牛群》（基尔肯尼，1989年）与弗格斯·凯利《早期爱尔兰农业》（都柏林，1998年）均为详尽而专业的研究。\n关于上文第197–198页所述十世纪末帕维亚王室财库的细节，记载于《王室仪典》（Instituta Regalia），后并入《帕维亚城义务条例》（Honorantiae Civitatis Papiae），由卡尔里夏德·布吕尔与钦齐奥·维奥兰特编辑，Die ‘Honorantie Civitatis Papie’（科隆，1983年）。\n关于上文第206–207页描述的“普里特尔维尔亲王”，参见专题报道《普里特尔维尔：一位埃塞克斯国王的宝藏》，《当代考古学》16/10（2004年2月），第430–436页；至于发掘后整理工作持续推进的最新消息，可查阅伦敦博物馆考古服务处定期维护的网站：http://www.molas.org.uk。\n上文第210–212页关于艾因哈德的概述，取材于其书信，译文见保罗·爱德华·达顿编译《查理曼的廷臣：艾因哈德全集》（彼得伯勒，安大略省，1998年），第131–164页；校勘本见K. 哈姆佩编，MGH Epp. V，第105–142页。另见朱莉娅·M. H. 史密斯《艾因哈德：罪人与圣徒》，《皇家历史学会会刊》第6辑，13（2003年），第55–77页。\n上文第212–213页讨论的圣枪，由佩尔西·恩斯特·施拉姆在其《“圣枪”：圣物与统治象征及其克拉科夫复制品》一文中研究，载其《统治象征与国家象征》，MGH Schriften 13，共3卷（斯图加特，1954–1956年），第2卷，第492–537页。\n第七章 王权与基督教\n鉴于基督教和基督教君主制在塑造中世纪及现代民族认同方面影响巨大，这一专题的文献数量浩繁。有价值的综述包括理查德·弗莱彻《欧洲的皈依：从异教到基督教，公元371–1386年》（伦敦，1997年），以及阿诺德·安根特《中世纪早期：400至900年的西方基督教世界》（斯图加特，1990年）。彼得·布朗《西方基督教世界的兴起：公元200–1000年的胜利与多样性》（第2版，牛津，2003年），是从文化史角度作出的权威总结。\n前基督教时期的宗教传统难以把握，且不应与十二世纪及以后文学文献所呈现的追溯性神话相混淆。爱尔兰及其他凯语地区的信仰与习俗尤其难以捉摸，原因在于紧邻基督教化之前的时期缺乏关于祭祀活动的考古证据。关于欧洲中北部的斯拉夫地区，见莱谢克·帕韦·苏佩茨基（Lleszek Pawe Supecki）《斯拉夫诸神的衰落》，载米歇尔·鲁什（主编）《克洛维：历史与记忆·克洛维的洗礼及其在历史上的回响》，兰斯国际历史研讨会论文集，共2卷（巴黎，1997年），第2卷，第289–314页；同氏《斯拉夫异教圣所》（华沙，1994年）。米夏埃尔·米勒-维勒《日耳曼人与斯拉夫人的祭祀崇拜》（斯图加特，1999年），是关于祭祀场所与献祭的优异图录并附简要讨论。\n日耳曼宗教传统自十九世纪初以来便得到深入研究。在近期成果中，见格林《语言与历史》第1、15章（见上文第317页），伊恩·伍德《五至九世纪莱茵河以东的异教信仰与迷信》，载奥森达（主编）《帝国之后》，第253–279页（见上文第334页），以及海因里希·贝克、德特勒夫·埃尔默斯与库尔特·希尔（主编）《日耳曼宗教史：史料与史料问题》（柏林，1992年）。对盎格鲁-撒克逊文本材料的审慎综述见J. D. 奈尔斯《异教的存续与民间信仰》，载戈登与拉皮奇（主编）《剑桥古英语文学指南》，第124–141页（见上文第317页）。\n伊恩·伍德《传教生涯：圣徒与欧洲的福音化，400–1050年》（哈洛，2001年），探讨了中世纪早期文学对传教成就的呈现。另见理查德·E. 沙利文《中世纪早期的基督教传教活动》（奥尔德肖特，1994年），以及克努特·舍费尔迪克（主编）《教会史即传教史》，第2卷：《中世纪前期的教会》（慕尼黑，1978年）。家族内部的皈依以及女性更广泛的贡献，是科杜拉·诺尔特《Conversio与Christianitas：五至八世纪基督教化中的女性》（斯图加特，1995年）的主题。该书部分论点可见于同氏《墨洛温时代的性别与皈依》，载詹姆斯·马尔登（主编）《中世纪宗教皈依的多样性》（盖恩斯维尔，佛罗里达州，1997年），第81–99页。\n关于基督教传播的区域与国别研究路径如下：\n不列颠群岛：查尔斯·托马斯《公元500年前罗马不列颠的基督教》（伦敦，1981年）；T. M. 查尔斯-爱德华兹《早期基督教爱尔兰》（剑桥，2000年）；理查德·甘姆森（主编）《圣奥古斯丁与英格兰的皈依》（斯特劳德，1999年）；约翰·布莱尔《盎格鲁-撒克逊社会中的教会》（牛津，2005年）；芭芭拉·E. 克劳福德（主编）《北海世界的皈依与基督教》（圣安德鲁斯，1998年）。\n法兰克地区：关于克洛维受洗的大量文献中，达努塔·尚泽尔《克洛维受洗的年代：维埃纳主教对图尔主教》，《早期中世纪欧洲》7（1998年），第29–57页，至关重要，并附有对先前文献的大量征引。J. M. 华莱士-哈德里尔《法兰克教会》（牛津，1983年），综述了墨洛温与加洛林时期的基督教。另一种研究路径见卢茨·E. 冯·帕德贝格《传教与基督教化：七、八世纪盎格鲁-撒克逊人与法兰克人的形式与后果》（斯图加特，1995年）。关于弗里西亚与萨克森，分别见斯特凡·勒贝克《异教与基督教之间的弗里西亚人》，载《基督教化与非基督教化》，宗教史与思想史研究中心出版物，9（昂热，1986年），第19–45页；以及鲁思·马佐·卡拉斯《萨克森皈依中的异教存续与融合》，《天主教历史评论》72（1986年），第553–572页。\n北欧世界：比吉特·索耶、彼得·索耶与伊恩·伍德（主编）《斯堪的纳维亚的基督教化》（阿灵索斯，1987年），如今可辅之以比吉特·索耶《维京时代的如尼石刻：中世纪早期斯堪的纳维亚的习俗与纪念》（牛津，2000年），第6章《皈依》。关于冰岛，珍妮·约肯斯《迟到而平和：公元1000年经仲裁实现的冰岛皈依》，《Speculum》74（1999年），第621–655页，颇具启发。\n中欧：最好的综述见J.-M. 马耶尔、C. 皮特里、L. 皮特里、A. 沃谢与M. 维纳尔（主编）《基督教史》，第4卷：《主教、修士与皇帝，610–1054年》（巴黎，1993年），第四部分，第1–2章。另见普热梅斯瓦夫·乌尔班奇克《中欧与东欧的早期基督教》（华沙，1997年），以及米夏埃尔·米勒-维勒（主编）《北方的罗马与拜占庭：8至14世纪波罗的海地区的传教与信仰转变》，共2卷（美因茨，1997–1998年）。\n正确基督教规范自晚期古代起源以来的演变，可通过威廉·克林什恩《阿尔勒的凯撒利亚：晚期古代高卢基督教共同体的形成》（剑桥，1994年），以及罗伯特·马库斯《从凯撒利亚到博尼法斯：高卢的基督教与异教》，载雅克·方丹与J. N. 希尔加思（主编）《第七世纪：变迁与延续》（伦敦，1992年），第154–172页加以追踪。关于自博尼法斯以降加洛林时期对这些规范的推行，见罗萨蒙德·麦基特里克《法兰克教会与加洛林改革，789–895年》（伦敦，1977年）。迪特尔·哈梅宁《Superstitio：中世纪教会神学迷信文献的传承史与理论史研究》（柏林，1979年），对“迷信”概念的研究至关重要。\n中世纪早期政治思想最好的入门读物是《剑桥中世纪政治思想史，约350–约1450年》，J. H. 伯恩斯主编（剑桥，1988年）。侧重王权的研究，见J. M. 华莱士-哈德里尔《英格兰及欧陆的早期日耳曼王权》（牛津，1971年），马克·雷德莱《从西多尼乌斯·阿波利纳里斯到伊西多尔的拉丁文学中的王权》（罗马，1981年），以及汉斯·胡贝特·安东《加洛林时代的君王镜鉴与统治者伦理》（波恩，1986年）。关于中世纪早期王权是否在某种意义上具有“神圣性”，已有很多讨论。华莱士-哈德里尔《早期日耳曼王权》第1章谨慎地重申了传统观点，但现可参见格林《语言与历史》第7章（见上文第317页），以及伊芙·皮卡尔《日耳曼神圣王权？——关于塔西佗〈日耳曼尼亚志〉与古北欧传承的史料批判研究》（海德堡，1991年）。关于国王祝圣仪式的高度专业化文献，最好通过珍妮特·L. 纳尔逊的论文入手，收录其《中世纪早期欧洲的政治与仪式》（伦敦，1996年），尤其是第12章《即位仪式》。\n关于王后与后权，见波琳·斯塔福德《威塞克斯的王妻，800–1066年》，《过去与现在》91（1981年），第3–27页；同氏《王后、女修道院与改革派教士：十、十一世纪英格兰的性别、宗教身份与改革》，同刊163（1999年），第3–35页；珍妮特·L. 纳尔逊《中世纪早期册立王后的仪式与中世纪后权的塑造》，载安妮·达根（主编）《中世纪欧洲的王后与后权》（伍德布里奇，1997年），第301–315页；热纳维耶芙·比雷-蒂埃里《通奸的王后》，《中世纪文明学刊》35（1992年），第299–312页。\n意识形态与政治之间的联系，由波琳·斯塔福德《克努特之法与盎格鲁-撒克逊王室承诺的历史》，《盎格鲁-撒克逊英格兰》10（1981年），第173–190页，以及珍妮特·L. 纳尔逊《中世纪前期的劣政》，《哈斯金斯学会学报》8（1996年），第1–26页予以强调。关于兰斯主教欣克马尔，见纳尔逊《政治与仪式》第7章《欣克马尔政治思想中的王权、法律与礼拜仪式》，以及让·德维斯《欣克马尔，兰斯大主教，845–882年》，共3卷（日内瓦，1975–1976年）。关于《圣经》对政治思想的影响，见雷蒙德·科蒂耶《旧约对中世纪早期法律与礼拜仪式影响之研究》（波恩，1970年），以及较新的《圣言的力量：圣经对中世纪早期政治的影响》，《早期中世纪欧洲》7（1998年）上的专题论文集。\n凯尔语地区王权的概述，见温迪·戴维斯《中世纪早期的凯尔特王权》，载安妮·达根（主编）《中世纪欧洲的国王与王权》（伦敦，1993年），第101–124页。对爱尔兰观念的简明评述，见菲利普·奥利里《旧战车的有远见驭手：早期爱尔兰文学中的王者中道》，《剑桥中世纪凯尔特研究》11（1986年），第1–16页；更详尽的讨论见巴特·雅克西《早期爱尔兰王权与继位》（都柏林，2000年）。关于爱尔兰与日耳曼诸王的异同，帕特里克·沃默尔德《凯尔特与盎格鲁-撒克逊王权：进一步思考》，载保罗·E. 萨尔马赫（主编）《盎格鲁-撒克逊文化的源泉》（卡拉马祖，密歇根州，1986年），第151–183页，是基础性文献。\n上文第243–244页讨论的欣克马尔论文《论国王的人格与王家职分》，校勘本见PL 125，栏833–856。欣克马尔另一篇论王权的著作有英译本：《论宫廷的治理》，见于大卫·赫利希《封建制史》（纽约，1970年），第209–227页，或保罗·爱德华·达顿《加洛林文明：文选》（彼得伯勒，安大略省，1993年），第485–499页。\n上文第247和249页提及的伪西普里安，由西格蒙德·赫尔曼校勘，De duodecim abusivis saeculi，古代基督教文献文本与研究，第3辑，4（莱比锡，1909年），罗布·梅恩斯对其作了精当评述：《政治、君王镜鉴与圣经：国王与王国的福祉》，《早期中世纪欧洲》7（1998年），第345–357页。\n上文第218页提及的匈牙利国王斯蒂芬的法典，译本见《中世纪匈牙利王国法律汇编》，G. 博尼什、J. M. 巴克与J. R. 斯威尼编译，共2卷（贝克斯菲尔德，加利福尼亚州，1985–1990年）；哈特维克的《圣斯蒂芬传》收录于《中世纪圣徒传文选》，托马斯·黑德主编（纽约，2000年）。\n第八章 罗马与欧洲诸族\n近年来，对早期中世纪诸王国形成的研究已因关注族性而发生了转变——族性被视为一种复杂、流动的社会现象，涉及自我与他者观念的文化与政治投射。在尚无全新综合论述的情况下，英语中最好的入门读物是瓦尔特·波尔短小而富有启发性的论文《蛮族继承国家》，载莱斯利·韦伯斯特与米歇尔·布朗（主编）《罗马世界的转型，公元400–900年》（伦敦，1997年），第33–47页。关于“蛮族”的形象，见彼得·希瑟《晚期古代的蛮族：形象、现实与转型》，载理查德·迈尔斯（主编）《晚期古代的身份建构》（伦敦，1999年），第234–258页，以及伊夫-阿尔贝·多热《蛮族：罗马人对野蛮与文明观念的研究》（布鲁塞尔，1981年）。\n关于早期中世纪族性的形成，近期的争论在很大程度上得益于德国与奥地利学者的概念建构，且通常以欧陆的“日耳曼”诸族为参照框架。所有近期研究的起点是赖因哈德·文斯库斯《部落形成与政制：中世纪早期诸Gentes的形成》（科隆，1961年）。文斯库斯的路径如今已发展为民族发生学理论；见帕特里克·格里《族性作为中世纪早期的情境性建构》，《维也纳人类学会通报》113（1983年），第15–26页；更精微的论述见瓦尔特·波尔《传统、民族发生与文学塑造：一项阶段性总结》，载卡尔·布伦纳与布里吉特·梅尔塔（主编）《民族发生与传承：中世纪早期研究的应用方法》，奥地利历史研究所出版物，31（维也纳，1994年），第9–26页。赫尔维希·沃尔夫拉姆《Origo et religio：中世纪早期文献中的族群传统与文学》，《早期中世纪欧洲》3（1994年），第19–38页，是民族发生学理论主要代表人物观点的简明英文表述。沃尔夫拉姆的路径也影响了帕特里克·格里近期的总体性（尽管有争议）概述《民族的神话：欧洲的中世纪起源》（普林斯顿，2001年）。关于加洛林时期的族性，见瓦尔特·波尔《论加洛林早期族群区分的意义》，《萨克森研究》12（1999年），第193–208页。\n欲了解围绕“民族发生学”路径的争论与批评，以下论文集颇有助益：波尔与赖米茨（主编）《区分的策略》（见上文第335页）；安德鲁·吉列特（主编）《论蛮族身份：中世纪早期族性研究的批判性路径》（图尔恩豪特，2002年）；以及汉斯-维尔纳·格茨、耶尔格·雅尔努特与瓦尔特·波尔（主编）《Regna与Gentes：诸王国与诸族》《罗马世界转型中的古代晚期与中世纪早期民族及王国的关系》（莱顿，2003年）。\n一条传统上十分重要的研究路径是语文学——正是现代语言学的分类，才将欧洲的入侵者统一归为“日耳曼人”：参见格林，《语言与历史》（见上文第317页），以及瓦尔特·波尔，《日耳曼人》（慕尼黑，2000年）。关于身份认同的文学呈现与起源传说，参见瓦尔特·戈法特，《蛮族历史的叙事者（公元550—800年）》（普林斯顿，1988年）；关于约达尼斯的专门讨论，参见彼得·希瑟，《哥特人与罗马人，332—489》（牛津，1991年），第3—67页，此书取代了此前的相关论述。\n考古学家的研究提供了互补的方法，这对北欧而言至关重要。洛特·赫德阿格，《铁器时代社会：北欧从部落到国家，公元前500年至公元700年》（牛津，1992年）开风气之先；另可参见霍华德·B. 克拉克、莫伊拉·尼·维纳和拉格纳尔·奥弗林主编，《爱尔兰与斯堪的纳维亚：早期维京时代》（都柏林，1998年），以及塔妮亚·迪金森和戴维·格里菲斯主编，《王国的形成》（牛津，1999年）。\n岛屿世界在考古学文献中有充分的呈现，但在“族群生成”的争论中却大多缺席。从盎格鲁—撒克逊视角出发的例外包括约翰·莫兰德的《族群、权力与英格兰人》，载威廉·O. 弗雷泽和安德鲁·蒂雷尔主编，《中世纪早期不列颠的社会认同》（伦敦，2000年），第23—51页；尼古拉斯·布鲁克斯的《英格兰起源神话》，载其《盎格鲁—撒克逊神话：国家与教会，400—1066》（伦敦，2000年），第79—89页；以及帕特里克·沃尔姆斯利的《Engla Lond：一种效忠的形成》，《历史社会学杂志》第7期（1994年），第1—24页。对苏格兰、威尔士和爱尔兰材料的研究方法仍以文本—历史为主，其概念建构参照的是不列颠群岛不断变化的史学书写，以及英格兰在其中所施加的沉重霸权。关于爱尔兰，参见唐纳哈·奥科兰的《诺曼征服前爱尔兰的民族性与王权》，载T. W. 穆迪主编，《民族性与独立的追求》（贝尔法斯特，1978年），第1—35页；以及约翰·凯里，《爱尔兰民族起源传说：综合性的伪历史》，《中世纪盖尔史料奎金小丛书》第1种（剑桥，1994年）。关于威尔士，P. P. 西姆斯—威廉姆斯的《中世纪早期威尔士起源故事的一些功能》，载托雷·尼贝里、约恩·皮、普雷本·默伦格拉赫特·瑟伦森和奥格·特罗默主编，《历史与英雄传说：专题研讨会论文集》（欧登塞，1985年），第97—131页，其中有很有价值的评论；关于苏格兰，近期的重要成果是多维特·布朗的《苏格兰认同的起源》，载克劳斯·比约恩、亚历山大·格兰特和基思·斯特林格主编，《欧洲过去中的民族、民族主义与爱国主义》（哥本哈根，1994年），第34—55页。\n除第七章所引关于政治思想的扩展阅读书目之外，关于“帝国”概念，参见卡尔·费迪南德·维尔纳的《加洛林帝国与神圣帝国》，载莫里斯·迪韦尔热主编，《帝国的概念》（巴黎，1980年），第151—202页。史蒂文·范宁的三篇文章有益地考察了imperium一词的用法：《哲罗姆的帝国概念》，载洛芙迪·亚历山大主编，《帝国的形象》（谢菲尔德，1991年），第239—250页；《比德、imperium与不列颠诸王》，《镜刊》第66期（1991年），第1—26页；《克洛维·奥古斯都与墨洛温王朝的imperatio之模仿》，载凯瑟琳·米切尔和伊恩·伍德主编，《图尔的格雷戈里的世界》（莱顿，2002年），第321—335页。关于继承诸王国对帝国词汇与统治仪式的借用，参见迈克尔·麦考密克，《永恒的凯旋：古代晚期、拜占庭与中世纪早期西方的凯旋式统治》（剑桥，1986年）。\n关于查理曼及其加冕称帝的大量文献中，最佳综述仍是唐纳德·布洛，《查理曼时代》（伦敦，1965年）。1999年帕德博恩展览的精美图录附有许多涉及广泛主题的重要论文：克里斯托夫·斯蒂格曼和马蒂亚斯·韦姆霍夫主编，《799：加洛林时代的艺术与文化。查理曼与教皇利奥三世在帕德博恩》，3卷（美因茨，1999年）。关于奥托一世及其帝国的文化世界，参见2001年马格德堡展览同样恢宏的图录与论文集：马蒂亚斯·普勒主编，《奥托大帝：马格德堡与欧洲》，2卷（美因茨，2001年）。关于奥托三世，格德·阿尔托夫的《奥托三世》（达姆施塔特，1996年）现已出版英译本（宾夕法尼亚州大学园区，2003年）。奥托三世在中欧的帝国建设，被置于宏阔的文化背景之中，这体现于近年第三个重要的国际展览图录：阿尔弗里德·维佐雷克和汉斯—马丁·欣茨主编，《公元1000年前后的欧洲中部》，3卷（达姆施塔特，2000年）；《公元1000年前后的欧洲中心》，2卷（斯图加特，2000年），为其中论文的英译本，但缺少插图。斯特凡·瓦因富特的《萨利安世纪：转型时代的主要潮流》，芭芭拉·M. 鲍勒斯英译（费城，1999年），将叙述推进到十一世纪的德意志。关于克努特与康拉德二世均有详细的专门研究：M. K. 劳森，《克努特：十一世纪早期英格兰的丹麦人》（哈洛，1993年）；以及赫里维格·沃尔弗拉姆，《康拉德二世，990—1039：三个帝国的皇帝》（慕尼黑，2000年）。\n罗马在中世纪想象中的地位是安德里亚·贾尔迪纳和安德烈·沃谢《罗马：从中世纪至今的观念与神话》（巴黎，2000年）一书的主题；就岛屿世界而言，还应补充 Éamon Ó Carragáin 的重要论文《罗马城与比德的世界》（贾罗，1994年）。理查德·克劳特海默对罗马城本身的经典论述，《罗马：城市肖像，312—1308》（普林斯顿，1980年），如今已被近年的考古与建筑研究大幅修正。若干论文集使这一研究及其他诸多成果得以便于利用：朱莉娅·M. H. 史密斯主编，《中世纪早期的罗马与基督教西方》（莱顿，2000年）；《中世纪早期的罗马》，《斯波莱托学术周论文集》第48种，2卷（斯波莱托，2001年）；以及《东西方之间的罗马》，《斯波莱托学术周论文集》第49种，2卷（斯波莱托，2002年）。这些论文集都包含关于罗马朝圣的有用材料；另参见克莱尔·斯坦克利夫的《选择退隐的诸王》，载帕特里克·沃尔姆斯利、唐纳德·布洛和罗杰·柯林斯主编，《法兰克与盎格鲁—撒克逊社会的理想与现实：献给J. M. 华莱士—哈德里尔的论文集》（牛津，1983年），第154—176页；以及凯瑟琳·休斯的《凯尔特教会与教皇》，载C. H. 劳伦斯主编，《中世纪的英格兰教会与教皇》（伦敦，1965年），第3—28页（重印于休斯《爱尔兰的教会与社会，公元400—1200年》，戴维·邓维尔编，伦敦，1987年，第十五章）。\n没有哪个论题比教皇制度更深受“为后世发展寻找线性前身”之害，即便是最佳的近期概览，伯恩哈德·希梅尔普芬尼希的《教皇制度》，詹姆斯·西弗特英译（纽约，1992年），也未能免于此弊。托马斯·F. X. 诺布尔的《中世纪早期教皇史中的病态与活力》，《天主教历史评论》第81期（1995年），第505—540页，勾勒了一种不同的研究路径；而米凯莱·马卡罗内主编的《千禧年之际罗马主教的首席地位：研究与见证》（梵蒂冈城，1991年）中的论文，则对教皇的意识形态与实践作出了结合具体语境的评价。彼得·莱韦林，《黑暗时代的罗马》（伦敦，1971年），至今仍有参考价值。关于具体问题的重要近期研究包括：费德里科·马拉齐，《拉齐奥的圣罗马教会“产业”（四至十世纪）：行政结构与经营实践》（罗马，1998年）；托马斯·F. X. 诺布尔，《圣彼得的共和国：教皇国家的诞生，680—825》（费城，1984年）；阿诺德·安根特与鲁道夫·席费尔，《Roma—caput et fons：关于处于古代与中世纪之间的教皇罗马的两篇演讲》（奥普拉登，1989年）；格德·特伦巴赫的《十世纪及十一世纪早期教皇史若干问题》，载芬斯克等主编，《中世纪的制度、文化与社会》，第165—177页（见上文第331页）。\n图8.4所绘约翰十九世书信与特许状受件人的详细情况，可参见哈拉尔德·齐默尔曼主编，《教皇文书，896—1046》，2卷，奥地利科学院哲学—历史学类，第174、177种（维也纳，1984—1985年），第2卷，第1043—126页。", "sections": [{"level": 3, "title": "面向英语读者的入门指引", "id": "ch14-s0"}, {"level": 3, "title": "电子资源", "id": "ch14-s1"}, {"level": 3, "title": "区域研究", "id": "ch14-s2"}, {"level": 2, "title": "第一章 口述与书写", "id": "ch14-s3"}, {"level": 2, "title": "第二章 生与死", "id": "ch14-s4"}, {"level": 2, "title": "第三章 亲友与亲族", "id": "ch14-s5"}, {"level": 2, "title": "第四章 男性与女性", "id": "ch14-s6"}, {"level": 2, "title": "第五章 劳动与领主权", "id": "ch14-s7"}, {"level": 2, "title": "第六章 获取与给予", "id": "ch14-s8"}, {"level": 2, "title": "第七章 王权与基督教", "id": "ch14-s9"}, {"level": 2, "title": "第八章 罗马与欧洲诸族", "id": "ch14-s10"}]}, {"id": "c15", "title": "索引", "kicker": null, "part": "附卷", "html": "<p>页码为斜体者指正文中的地图与图表。</p>\n<p>Ælfstan，伍斯特的伍尔夫斯坦之弟 91\nÆthelweard，盎格鲁-撒克逊显贵 36\n埃涅阿斯，特洛伊英雄 262, 291\nÆthelbald， the Welsh Annals（伦敦，1980年），第21页，拉丁文见第62页。", "8:19": "《科马克词典》（Sanas Cormaic），第1162行，Kuno Meyer 编辑，Anecdota from Irish Manuscripts, 4（哈勒，1912年），第102页。", "8:20": "http://www.ucl.ac.uk/archaeology/cisp/database/site/ltysl.html。另见“埃利塞格石柱”（The Pillar of Eliseg），Early Welsh Genealogical Tracts，P. C. Bartrum 编辑并翻译（加的夫，1966年），第1–3页。", "8:21": "见前注1。", "8:22": "《约达尼斯哥特史》，Mierow 翻译，第60页（Getica, V.38，Mommsen 编辑，第64页）。", "8:23": "《约达尼斯哥特史》，Mierow 翻译，第62页（Getica, V.43，Mommsen 编辑，第65页）。", "8:24": "《论查理国王与教皇利奥》（De Karolo rege et Leone papa），第12、27–9、92–6行，Franz Brunhölzl 编辑，Studien und Quellen zur westfälischen Geschichte, 36, Beiheft（帕德博恩，1999年），第10、16页。参见该诗前三分之一的译文，见 Peter Godman, Poetry of the Carolingian Renaissance（伦敦，1985年），第25号，第196–207页。", "8:25": "《论查理国王与教皇利奥》，第495–6、504行，第44页。", "8:26": "参见第226页。", "8:27": "《佩塔维安编年史》（Annales Petaviani），公元776年；《洛尔施编年史》（Annales Laureshamenses），公元799年，G. H. Pertz 编辑，MGH SS I，第16、38页。", "8:28": "《查理传》（Vita Karoli），7，O. Holder-Egger 编辑，MGH SRG（汉诺威，1911年），第9页。", "8:29": "同上，第9–10页。", "8:30": "莫多安《牧歌》（Ecloga），第24–7行，Godman 编辑并翻译，Poetry of the Carolingian Renaissance，第192–3页。", "8:31": "《词源》（Etymologiae），IX.iii.2–3，W. M. Lindsay 编辑，2卷（牛津，1911年），第1卷，第362页。", "8:32": "同上，IX.iii.14，Lindsay 编辑，第1卷，第364页。", "8:33": "比德《英吉利教会史》，II.5，Bertram Colgrave 与 R. A. B. Mynors 编辑并翻译（牛津，1969年），第148–9页。", "8:34": "同上，V.10，Colgrave 与 Mynors 编辑并翻译，第480–1页。译文略有调整。", "8:35": "爱奥那岛的阿多姆南《圣科伦巴传》，I.1，Richard Sharpe 翻译（哈蒙兹沃思，1995年），第110–11页（Adomnan's Life of Columba，A. O. Anderson 与 M. O. Anderson 编辑（爱丁堡，1961年），第198–200页）。", "8:36": "维杜金德《萨克森人事迹》（Res gestae Saxonicae），III.46，P. Hirsch 与 H.-E. Lohmann 编辑，MGH SRG（汉诺威，1935年），第127–8页。", "8:37": "《阿尔马书》（Liber Ardmachanus: The Book of Armagh），John Gwynn 编辑并撰写导言与附录（都柏林，1913年），第32页。", "8:38": "卡西奥多鲁斯《书信集》，I.1，Mommsen 编辑，第10页。", "8:39": "见前注2。", "8:40": "克努特致英格兰人书信，见马姆斯伯里的威廉《英格兰国王事迹》（Gesta regum Anglorum），II.183，R. A. B. Mynors、R. M. Thomson 与 M. Winterbottom 编辑并翻译，2卷（牛津，1998–9年），第2卷，第326–7页。", "8:41": "参见第29–30页。", "8:42": "克努特致英格兰人书信，Mynors、Thomson 与 Winterbottom 编辑并翻译，第326–7页。", "8:43": "同上，第324–5页。", "8:45": "《库米安“复活节日期之争书信”及相关爱尔兰计算学论丛》，Maura Walsh 与 Dáibhí Ó Cróinín 编辑（多伦多，1988年），第93–5页。", "8:46": "《罗马城诸教堂纪要》（Notitia ecclesiarum urbis Romae），Roberto Valentini 与 Giuseppe Zucchetti 编辑，Codice topografico della città di Roma，4卷，Fonti per la Storia d'Italia, 80、88、90、91（罗马，1940–53年），第2卷，第78–9页。", "8:47": "同上，第2卷，第94、97页。", "8:48": "克努特致英格兰人书信，Mynors、Thomson 与 Winterbottom 编辑并翻译，第324–7页。", "8:49": "《彼得之歌》（Petruslied），Cyril Edwards 翻译，见其“德语方言文学”，载 Rosamond McKitterick（编），Carolingian Culture: Emulation and Innovation（剑桥，1994年），第162页（Wilhelm Braune 编辑，Althochdeutsches Lesebuch，第16版（蒂宾根，1979年），第131页）。", "8:50": "伪阿尔昆《论圣职》（De divinis officiis），17，PL 101，第1209栏。", "8:51": "《圣贝拉赫传》（Vita Berachi），25，C. Plummer 编辑，Vitae Sanctorum Hiberniae，2卷（牛津，1910年；都柏林重印，1997年），第1卷，第85–6页。", "8:52": "《奥恩古斯殉教者名录》（Félire Óengusso Céli Dé: The Martyrology of Oengus the Culdee），Whitley Stokes 编辑（伦敦，1905年），第206–7页。", "8:53": "《兰达夫书》（The Text of the Book of Llan Dâv），J. G. Evans 与 J. Rhys 编辑（牛津，1893年），第83–4页。", "8:54": "比德《韦尔茅斯与贾罗修道院院长传》，J. F. Webb 翻译，The Age of Bede（修订版，哈蒙兹沃思，1988年），第191页（Historia abbatum, 5，C. Plummer 编辑，Venerabilis Bedae opera historica，2卷（牛津，1896年），第1卷，第368页）。", "8:55": "比德《英吉利教会史》，V.21，Colgrave 与 Mynors 编辑并翻译，第532–3页，略有调整。", "8:56": "《圣格布哈德传》（Vita Gebhardi），13，W. Wattenbach 编辑，MGH SS X，第587页。", "8:57": "《帕德博恩主教迈因维尔克传》（Vita Meinwerci episcopi Patherbrunensis），218，F. Tenckhoff 编辑，MGH SRG（汉诺威，1921年），第131页。"}}</script>
<script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('book-data').textContent);
  var chapters = DATA.chapters, parts = DATA.parts, notes = DATA.notes;
  var cur = -1, results = [], searchTerm = '', marks = [], markIdx = 0;
  var $ = function (id) { return document.getElementById(id); };
  var toc = $('toc'), content = $('content'), fnPop = $('fn-pop');

  /* ---------- 偏好 ---------- */
  var THEMES = ['sepia', 'light', 'green', 'dark'];
  function applyPrefs() {
    var t = localStorage.getItem('lxr.theme');
    if (t && THEMES.indexOf(t) >= 0) document.body.dataset.theme = t;
    var fs = parseInt(localStorage.getItem('lxr.fs'), 10);
    if (fs >= 14 && fs <= 32) document.documentElement.style.setProperty('--fs', fs + 'px');
    if (window.innerWidth < 860) document.body.classList.add('side-hide');
  }
  function setFs(delta) {
    var fs = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'), 10) || 19;
    fs = Math.max(14, Math.min(32, fs + delta));
    document.documentElement.style.setProperty('--fs', fs + 'px');
    localStorage.setItem('lxr.fs', String(fs));
  }
  function cycleTheme() {
    var i = THEMES.indexOf(document.body.dataset.theme);
    document.body.dataset.theme = THEMES[(i + 1) % THEMES.length];
    localStorage.setItem('lxr.theme', document.body.dataset.theme);
  }

  /* ---------- 目录 ---------- */
  function renderToc() {
    toc.innerHTML = '';
    parts.forEach(function (p) {
      var pl = document.createElement('div');
      pl.className = 'part-label';
      pl.textContent = p.name;
      toc.appendChild(pl);
      p.chapters.forEach(function (cid) {
        var i = parseInt(cid.slice(1), 10);
        var btn = document.createElement('button');
        btn.className = 'ch-item' + (i === cur ? ' active' : '');
        btn.textContent = chapters[i].title;
        if (localStorage.getItem('lxr.last') === cid) {
          var dot = document.createElement('span');
          dot.className = 'ch-read-dot';
          dot.textContent = '●';
          btn.appendChild(dot);
        }
        btn.onclick = function () { clearSearch(); loadChapter(i); };
        toc.appendChild(btn);
        var sec = document.createElement('div');
        sec.className = 'sec-list' + (i === cur ? ' open' : '');
        chapters[i].sections.forEach(function (s, si) {
          var a = document.createElement('div');
          a.className = 'sec-link';
          a.textContent = s.title;
          a.onclick = function () {
            clearSearch(); loadChapter(i, false);
            var el = content.querySelector('#' + s.id);
            if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
          };
          sec.appendChild(a);
        });
        if (chapters[i].sections.length) toc.appendChild(sec);
      });
    });
  }

  /* ---------- 章节加载 ---------- */
  function loadChapter(i, doScroll) {
    if (i < 0 || i >= chapters.length) return;
    if (cur >= 0) savePos();
    cur = i;
    var c = chapters[i];
    content.innerHTML = c.html;
    $('chapter-title').textContent = c.title;
    $('kicker').textContent = c.kicker || '';
    $('ch-pos').textContent = (i + 1) + ' / ' + chapters.length;
    document.title = c.title + ' — 罗马之后的欧洲';
    $('prev-ch').disabled = $('prev-top').disabled = $('prev-bottom').disabled = (i === 0);
    $('next-ch').disabled = $('next-top').disabled = $('next-bottom').disabled = (i === chapters.length - 1);
    localStorage.setItem('lxr.last', 'c' + i);
    clearMarks();
    renderToc();
    window.scrollTo(0, 0);
    if (doScroll !== false) {
      var y = parseInt(localStorage.getItem('lxr.pos.c' + i), 10) || 0;
      requestAnimationFrame(function () { window.scrollTo(0, y); });
    }
  }
  function savePos() {
    if (cur < 0) return;
    localStorage.setItem('lxr.pos.c' + cur, String(window.scrollY));
  }
  function go(d) {
    clearSearch();
    loadChapter(cur + d);
  }

  /* ---------- 进度条 / 回顶 ---------- */
  var saveTimer = null;
  window.addEventListener('scroll', function () {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    $('progress-bar').style.width = (max > 0 ? (window.scrollY / max * 100) : 0) + '%';
    $('top-btn').classList.toggle('hidden', window.scrollY < 600);
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(savePos, 400);
    hideFn();
    spySections();
  }, { passive: true });

  function spySections() {
    var best = null, bestTop = -1;
    content.querySelectorAll('h2[id],h3[id]').forEach(function (el) {
      var top = el.getBoundingClientRect().top;
      if (top <= 120 && top > bestTop) { bestTop = top; best = el.id; }
    });
    toc.querySelectorAll('.sec-link').forEach(function (l) { l.classList.remove('active'); });
    if (best && cur >= 0) {
      var sec = null;
      for (var i = 0; i < chapters[cur].sections.length; i++) {
        if (chapters[cur].sections[i].id === best) sec = chapters[cur].sections[i];
      }
      if (sec) {
        toc.querySelectorAll('.sec-link').forEach(function (l) {
          if (l.textContent === sec.title) l.classList.add('active');
        });
      }
    }
  }

  /* ---------- 注释浮窗 ---------- */
  content.addEventListener('click', function (e) {
    var sup = e.target.closest ? e.target.closest('sup.fn') : null;
    if (!sup || !sup.dataset.note) return;
    var txt = notes[sup.dataset.note];
    if (!txt) return;
    e.stopPropagation();
    var r = sup.getBoundingClientRect();
    var left = Math.min(r.left + 10, window.innerWidth - 460);
    fnPop.innerHTML = '<b>注释 ' + sup.textContent + '</b><br>' + txt;
    fnPop.style.display = 'block';
    fnPop.style.left = left + 'px';
    if (r.bottom + 40 > window.innerHeight) {
      fnPop.style.bottom = (window.innerHeight - r.top + 8) + 'px';
      fnPop.style.top = 'auto';
    } else {
      fnPop.style.top = (r.bottom + 8) + 'px';
      fnPop.style.bottom = 'auto';
    }
  });
  function hideFn() { fnPop.style.display = 'none'; }
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('#fn-pop')) hideFn();
  });

  /* ---------- 插图灯箱 ---------- */
  var viewer = $('img-viewer'), viewerImg = $('img-viewer-img');
  content.addEventListener('click', function (e) {
    var img = e.target.closest ? e.target.closest('article img') : null;
    if (!img) return;
    viewerImg.src = img.src;
    viewerImg.alt = img.alt || '';
    viewer.classList.add('open');
  });
  viewer.addEventListener('click', function () { viewer.classList.remove('open'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && viewer.classList.contains('open')) viewer.classList.remove('open');
  });

  /* ---------- 检索 ---------- */
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  $('search').addEventListener('input', function () {
    var q = this.value.trim();
    searchTerm = q;
    clearMarks();
    if (!q) { renderToc(); $('search-nav').style.display = 'none'; return; }
    results = [];
    for (var i = 0; i < chapters.length && results.length < 120; i++) {
      var idx = 0, text = chapters[i].text;
      while (idx < text.length && results.length < 120) {
        var p = text.indexOf(q, idx);
        if (p < 0) break;
        results.push({ ch: i, pos: p });
        idx = p + q.length;
      }
    }
    toc.innerHTML = '';
    var div = document.createElement('div');
    div.id = 'results';
    var shown = 0, qEsc = escapeHtml(q), qRe = new RegExp(escapeRegExp(qEsc), 'g');
    for (var r = 0; r < results.length && shown < 100; r++) {
      var it = results[r], c = chapters[it.ch];
      var p0 = Math.max(0, it.pos - 30), p1 = Math.min(c.text.length, it.pos + q.length + 30);
      var snipText = escapeHtml(c.text.slice(p0, p1));
      var snip = (p0 > 0 ? '…' : '') + snipText.replace(qRe, '<mark>' + qEsc + '</mark>') + (p1 < c.text.length ? '…' : '');
      var item = document.createElement('div');
      item.className = 'res-item';
      item.innerHTML = '<div class="res-ch">' + c.title + '</div><div class="res-snip">' + snip + '</div>';
      item.onclick = (function (i2, pos) {
        return function () {
          loadChapter(i2, false);
          highlightAndGo(pos);
        };
      })(it.ch, it.pos);
      div.appendChild(item);
      shown++;
    }
    if (!shown) div.innerHTML = '<div class="part-label">未找到相关内容</div>';
    toc.appendChild(div);
    $('search-nav').style.display = 'none';
  });
  $('search').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && results.length) {
      var it = results[0];
      loadChapter(it.ch, false);
      highlightAndGo(it.pos);
    }
    if (e.key === 'Escape') { this.value = ''; this.dispatchEvent(new Event('input')); this.blur(); }
  });

  function highlightAndGo(charPos) {
    clearMarks();
    var q = searchTerm;
    if (!q) return;
    var found = [];
    var pos = { p: 0 };
    (function walk(node) {
      if (node.nodeType === 3) {
        var t = node.nodeValue;
        var local = -1;
        while ((local = t.indexOf(q, local + 1)) >= 0) {
          found.push({ node: node, local: local, global: pos.p + local });
        }
        pos.p += t.length;
        return;
      }
      if (node.nodeType !== 1) return;
      for (var c = node.firstChild; c; c = c.nextSibling) {
        if (c.nodeType === 1 && c.tagName === 'MARK') { pos.p += c.textContent.length; continue; }
        walk(c);
      }
    })(content);
    if (!found.length) { $('search-nav').style.display = 'none'; return; }
    var byNode = new Map();
    found.forEach(function (f) {
      if (!byNode.has(f.node)) byNode.set(f.node, []);
      byNode.get(f.node).push(f);
    });
    byNode.forEach(function (list, node) {
      list.sort(function (a, b) { return b.local - a.local; });
      list.forEach(function (f) {
        var range = document.createRange();
        range.setStart(f.node, f.local);
        range.setEnd(f.node, f.local + q.length);
        try {
          var mark = document.createElement('mark');
          mark.dataset.pos = String(f.global);
          range.surroundContents(mark);
          marks.push(mark);
        } catch (err) { /* 忽略跨节点情况 */ }
      });
    });
    marks.sort(function (a, b) { return parseInt(a.dataset.pos, 10) - parseInt(b.dataset.pos, 10); });
    markIdx = 0;
    for (var i = 0; i < marks.length; i++) {
      if (parseInt(marks[i].dataset.pos, 10) >= charPos) { markIdx = i; break; }
    }
    $('sn-info').textContent = (markIdx + 1) + ' / ' + marks.length + ' 处';
    $('search-nav').style.display = 'flex';
    goMark(markIdx);
  }
  function goMark(i) {
    if (!marks.length) return;
    markIdx = (i + marks.length) % marks.length;
    marks.forEach(function (m, k) { m.classList.toggle('cur', k === markIdx); });
    marks[markIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
    $('sn-info').textContent = (markIdx + 1) + ' / ' + marks.length + ' 处';
  }
  function clearMarks() {
    marks.forEach(function (m) {
      var p = m.parentNode;
      while (m.firstChild) p.insertBefore(m.firstChild, m);
      p.removeChild(m);
    });
    marks = [];
    markIdx = 0;
    $('search-nav').style.display = 'none';
  }
  function clearSearch() {
    $('search').value = '';
    searchTerm = '';
    clearMarks();
    if (toc.querySelector('#results')) renderToc();
  }
  $('sn-prev').onclick = function () { goMark(markIdx - 1); };
  $('sn-next').onclick = function () { goMark(markIdx + 1); };
  $('sn-close').onclick = clearSearch;

  /* ---------- 按钮与键盘 ---------- */
  $('prev-ch').onclick = $('prev-top').onclick = $('prev-bottom').onclick = function () { go(-1); };
  $('next-ch').onclick = $('next-top').onclick = $('next-bottom').onclick = function () { go(1); };
  $('fs-dec').onclick = function () { setFs(-1); };
  $('fs-inc').onclick = function () { setFs(1); };
  $('theme-btn').onclick = cycleTheme;
  $('top-btn').onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('toc-btn').onclick = toggleSide;
  $('scrim').onclick = toggleSide;
  function toggleSide() {
    if (window.innerWidth < 860) {
      document.body.classList.toggle('side-open-mobile');
      document.body.classList.toggle('side-hide');
    } else {
      document.body.classList.toggle('side-hide');
    }
  }

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 's' || e.key === 'S') { e.preventDefault(); $('search').focus(); }
    else if (e.key === 't' || e.key === 'T') toggleSide();
    else if (e.key === 'Escape') clearSearch();
  });

  /* ---------- 启动 ---------- */
  applyPrefs();
  var start = parseInt((localStorage.getItem('lxr.last') || 'c0').slice(1), 10);
  loadChapter(isNaN(start) ? 0 : start);
})();
</script>
</body>
