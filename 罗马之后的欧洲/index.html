亚东部，902年夺取摩拉维亚；马扎尔人对东法兰克王国的侵袭日益频繁\n899年 韦塞克斯的阿尔弗雷德去世；其子“长者”爱德华即位，开始从维京人手中征服东盎格利亚与麦西亚东部\n909年 欧里亚克的伯爵、圣人热拉尔去世；其生平与神迹后由克吕尼修道院院长奥多（927—942年在任）记述\n911年 康拉德一世即位，为东法兰克人（日耳曼人）首位非加洛林王朝国王\n911年 西法兰克国王“糊涂”查理（898—922年在位）将鲁昂及邻近地区割让给维京首领罗洛，由此建立诺曼底公国\n918年 康拉德一世去世\n919年 萨克森公爵亨利一世即位为日耳曼人的国王\n921年 “糊涂”查理将圣德尼的圣臂遗骨赠予亨利一世\n922年 “糊涂”查理战败被废\n924年 “长者”爱德华去世，已将韦塞克斯统治扩展至亨伯河以北；埃塞尔斯坦即位\n926年 亨利一世将士瓦本授予勃艮第国王鲁道夫二世（912—937年在位），换得“圣枪”\n927年 埃塞尔斯坦确立对不列颠北半部的宗主权，934年远征阿尔巴；此后韦塞克斯诸王通常称为英格兰人的国王\n936年 亨利一世去世；其子奥托一世即位为德意志国王\n939年 埃塞尔斯坦去世；埃德蒙即位为英格兰国王\n941年 佛兰德伯爵阿努尔夫一世（918—965年在位）开始改革根特圣彼得教堂，并向教士团捐赠巨资\n946年 埃德蒙去世；埃德雷德即位为英格兰国王\n951年 奥托入侵意大利，在帕维亚被立为国王\n953年 戈尔兹的约翰使团出使科尔多瓦阿卜杜勒-拉赫曼三世（912—961年在位）宫廷\n954年 埃德雷德王攻占约克，终结维京人在英格兰境内的统治\n955年 埃德雷德去世；埃德加即位为麦西亚与诺森布里亚国王，957年又即位为韦塞克斯国王\n955年 奥托一世在莱希河战役中击败马扎尔人；此后马扎尔人的进攻渐趋减少\n961年 奥托一世在亚琛为其6岁的儿子奥托二世行加冕礼，立为德意志国王，随后翻越阿尔卑斯山进入意大利\n962年 奥托一世在罗马加冕称帝\n967年 欧里亚克的热贝尔造访里波尔\n967年 奥托二世加冕称帝\n972年 匈牙利国王盖萨（约970—997年在位）受洗\n973年 奥托一世去世；奥托二世独掌大权\n975年 英格兰国王埃德加去世（957年起在位），他曾在英格兰推行加洛林式“正统基督教”；“殉道者”爱德华即位\n978年 “殉道者”爱德华遇刺；埃塞尔雷德二世“决策无方者”即英格兰王位\n980年 维京人对英格兰的侵袭再起\n980年 奥托二世会见于格·卡佩\n983年 奥托二世去世；3岁的奥托三世即位\n983年 柳蒂齐斯拉夫人反抗日耳曼人的统治，拒绝基督教\n985—987年 弗勒里的阿博在拉姆齐讲学\n987年 西法兰克末代加洛林王朝国王去世；于格·卡佩加冕为西法兰克人（法兰西人）的国王\n约988年 基辅大公弗拉基米尔及罗斯人接受基督教\n991年 盎格鲁-撒克逊人在埃塞克斯海岸马尔登被维京人击败；后以史诗《马尔登之战》纪念之\n996年 奥托三世于994年成年后，在罗马加冕称帝\n997年 布拉格的阿达尔伯特在格但斯克被普鲁士人殉难\n997年 匈牙利的斯德望即位\n997—1016年 古英语史诗《贝奥武甫》唯一抄本的年代\n998年 奥托三世重修罗马前帝国宫殿，试图使罗马成为其永久都城\n999年 首位德意志教皇格里高利五世去世\n999/1000年 冰岛人接受基督教\n1000年 奥托三世造访格涅兹诺，开创布拉格的阿达尔伯特的崇拜，向博莱斯瓦夫·霍布里（992—1025年在位）授予王冠及“圣枪”复制品，并为其子担任教父；在格涅兹诺设立波兰大主教区\n1000/1001年 教皇西尔维斯特二世向匈牙利的斯德望赐赠王冠，奥托三世赠“圣枪”复制品；在埃斯泰尔戈姆设立匈牙利大主教区\n1001年 奥托三世被逐出罗马\n1002年 奥托三世去世；亨利二世当选德意志国王，继承危机结束\n1004年 亨利二世当选意大利国王\n1005年 欧洲大饥荒\n1005年 布莱恩·博鲁（976—1014年在位）造访阿马，向圣帕特里克圣龛献礼\n1009年 奎尔福特的布鲁诺被普鲁士人殉难\n1013年 丹麦国王“八字胡”斯韦恩征服泰晤士河以北的英格兰全境；埃塞尔雷德二世被放逐\n1014年 “八字胡”斯韦恩去世；在英格兰的丹麦军队拥立其子克努特为王，但盎格鲁-撒克逊人将埃塞尔雷德二世从放逐中迎回\n1014 克隆塔夫战役战败，布莱恩·博鲁对爱尔兰的统治终结\n1014 亨利二世加冕为皇帝\n1016 八字胡斯韦恩之子克努特征服英格兰；埃塞尔雷德二世去世\n1018 梅泽堡主教（自1009年起）、编年史家蒂特马尔去世\n1018–1023 哈默斯坦婚姻争端\n1023 约克大主教（自1002年起）、布道家与国王顾问伍尔夫斯坦去世\n1024 亨利二世去世，无嗣；康拉德二世当选\n1024 教皇本笃八世（自1012年起）去世；其弟约翰十九世继位\n1026 克努特在瑞典南部的圣河战役中与挪威人和瑞典人作战\n1027 康拉德二日在罗马加冕为皇帝，克努特与勃艮第的鲁道夫三世出席\n1032 勃艮第国王（自993年起）鲁道夫三世去世\n1033 约翰十九世去世\n1035 英格兰、丹麦与挪威国王克努特去世\n1036 帕德博恩主教（自1009年起）迈恩韦克去世，其帕德博恩重建工程未竟\n1038 匈牙利的斯德望去世；1083年被封圣\n1039 康拉德二世去世", "sections": []}, {"id": "c13", "title": "注释", "kicker": null, "part": "附卷", "html": "<ol>\n<li>大格里高利，《约伯记伦理诠释》 ，XI.xlv.61及XXXIII.iii.7，M. Adriaen编校，共3卷，页码连续编排，CCSL 143、143A、143B（图尔奈，1979–1985年），第620页；另见第1675页。</li>\n<li>《布利克林布道集》，10（祈祷星期三），Richard J. Kelly编校并翻译（伦敦，2003年），第78–79页。</li>\n<li>见前注1。</li>\n<li>M. Coens，《圣马丁的一个死后奇迹》，《博兰德文献集》，50（1932年），第284–294页，引文见第291、293、294页。关于其宗教背景，参见本书第73页。</li>\n<li>《创世记甲篇》，第1684–1690行，A. N. Doane编校，《创世记甲篇：新版本》（威斯康星州麦迪逊，1978年），第161页；参见《创世记》11:7。</li>\n<li>伊西多尔，《词源》，IX.i.1，另参IX.i.14，W. M. Lindsay编校，2卷（牛津，1911年），第1卷，第343、345页。</li>\n<li>《阿梅斯·普里德因》，第172–174行，Ifor Williams编校，Rachel Bromwich翻译（都柏林，1982年），第12–13页。</li>\n<li>《兰达夫之书文本》，J. G. Evans与J. Rhys编校（牛津，1893年），第181页。</li>\n<li>爱奥那的阿多姆南，《圣哥伦巴传》，II.32，Richard Sharpe翻译（哈蒙兹沃思，1995年），第179页（Adomnan's Life of Columba，A. O. Anderson与M. O. Anderson编校（爱丁堡，1961年），第396页）。</li>\n<li>执事保罗，《伦巴德人史》，I.27，William Dudley Foulke翻译（费城，1974年），第52页（Historia Langobardorum，G. Waitz编校，MGH SRL（汉诺威，1878年），第70页）。</li>\n<li>《第一语法论》，Hreinn Benediktsson编校并翻译（雷克雅未克，1972年），第208–209页。</li>\n<li>《戈尔泽修道院院长让传》，119，Michel Parisse编校（巴黎，1999年），第146页。</li>\n<li>都灵的克劳狄乌斯，《编年史》，见Michael Idomir Allen所引，《都灵的克劳狄乌斯编年史》，载Alexander Callander Murray编，《罗马陷落之后：中世纪早期历史的叙述者与史料》（多伦多，1998年），第288–319页，引文见第305页。此处对Allen的译文略作调整。</li>\n<li>MGH Poetae V，第2部分，第337页，第11–12行。</li>\n<li>克韦尔夫特的布鲁诺，《五兄弟传》，9、10、13，MGH SS XV，第2部分，第725、727、729页。</li>\n<li>科尔比的拉特拉姆努斯，《致里姆伯特书》，MGH Epp. VI，第155–157页。</li>\n<li>普鲁登修斯，《驳西门马库斯》，II.816–817，Maurice P. Cunningham编校，Aurelii Prudentii Carmina，CCSL 126（图尔奈，1966年），第239页。</li>\n<li>萨尔维安，《论上帝的统治》，V.ii.8，G. Larrigue编校，Salvien de Marseille: Œuvres，2卷，SC 176、220（巴黎，1971–1975年），第2卷，第316页。参见Eva M. Sanford英译本，On the Government of God（纽约，1930年）。</l rbis Romae），Roberto Valentini 与 Giuseppe Zucchetti 编辑，Codice topografico della città di Roma，4卷，Fonti per la Storia d'Italia, 80、88、90、91（罗马，1940–53年），第2卷，第78–9页。\n同上，第2卷，第94、97页。\n克努特致英格兰人书信，Mynors、Thomson 与 Winterbottom 编辑并翻译，第324–7页。\n《彼得之歌》（Petruslied），Cyril Edwards 翻译，见其“德语方言文学”，载 Rosamond McKitterick（编），Carolingian Culture: Emulation and Innovation（剑桥，1994年），第162页（Wilhelm Braune 编辑，Althochdeutsches Lesebuch，第16版（蒂宾根，1979年），第131页）。\n伪阿尔昆《论圣职》（De divinis officiis），17，PL 101，第1209栏。\n《圣贝拉赫传》（Vita Berachi），25，C. Plummer 编辑，Vitae Sanctorum Hiberniae，2卷（牛津，1910年；都柏林重印，1997年），第1卷，第85–6页。\n《奥恩古斯殉教者名录》（Félire Óengusso Céli Dé: The Martyrology of Oengus the Culdee），Whitley Stokes 编辑（伦敦，1905年），第206–7页。\n《兰达夫书》（The Text of the Book of Llan Dâv），J. G. Evans 与 J. Rhys 编辑（牛津，1893年），第83–4页。\n比德《韦尔茅斯与贾罗修道院院长传》，J. F. Webb 翻译，The Age of Bede（修订版，哈蒙兹沃思，1988年），第191页（Historia abbatum, 5，C. Plummer 编辑，Venerabilis Bedae opera historica，2卷（牛津，1896年），第1卷，第368页）。\n比德《英吉利教会史》，V.21，Colgrave 与 Mynors 编辑并翻译，第532–3页，略有调整。\n《圣格布哈德传》（Vita Gebhardi），13，W. Wattenbach 编辑，MGH SS X，第587页。\n《帕德博恩主教迈因维尔克传》（Vita Meinwerci episcopi Patherbrunensis），218，F. Tenckhoff 编辑，MGH SRG（汉诺威，1921年），第131页。\n", "sections": [{"level": 2, "title": "第2章 生存与死亡", "id": "ch13-s0"}, {"level": 2, "title": "第3章 亲族与朋友", "id": "ch13-s1"}, {"level": 2, "title": "第4章 男人与女人", "id": "ch13-s2"}, {"level": 2, "title": "第5章 劳役与领主权", "id": "ch13-s3"}, {"level": 2, "title": "第6章 获取与给予", "id": "ch13-s4"}, {"level": 2, "title": "第7章 王权与基督教", "id": "ch13-s5"}, {"level": 2, "title": "第8章 罗马与欧洲诸民族", "id": "ch13-s6"}]}, {"id": "c14", "title": "延伸阅读", "kicker": null, "part": "附卷", "html": "<h3 id=\"ch14-s0\">面向英语读者的入门指引</h3>\n<h4>总论</h4>\n<p>英语读者如今已有大量涵盖本书全部或部分时期的著作可供参考。概述性著作包括彼得·加恩西与卡罗琳·汉弗莱斯合著的《晚期古代世界的演变》（剑桥，2001年）；罗莎蒙德·麦基特里克主编的《早期中世纪：欧洲400—1000年》（牛津，2001年）；以及海因里希·菲希特瑙的《生活在十世纪：心态与社会秩序》，帕特里克·J.格里译（芝加哥，1991年）。《剑桥古代史》与《新编剑桥中世纪史》由一流专家撰写，权威且规模宏大，既包含政治叙事，又对广泛的专题提供了细致的分析方法，并附有详细的文献指南。约500—1000年这一时期由以下各卷涵盖：《剑桥古代史》第14卷：《晚期古代：帝国与继承者，公元425—600年》，埃弗里尔·卡梅伦、布赖恩·沃德-珀金斯与迈克尔·惠特比主编（剑桥，2000年）；《新编剑桥中世纪史》第1卷：约500—700年，保罗·福拉克主编（即将出版）；第2卷：约700—900年，罗莎蒙德·麦基特里克主编（剑桥，1995年）；第3卷：约900—1024年，蒂莫西·罗伊特主编（剑桥，1999年）。</p>\n<p>由于“晚期古代”与“早期中世纪”之间并无明确的年代界分，关于早期中世纪在欧洲前现代史整体框架中的地位存在相当多的争论。可参见彼得·希瑟《晚期古代与中世纪早期西方》，载迈克尔·本特利主编《史学史指南》（伦敦，1997年），第69—87页；莱斯特·K.利特尔与芭芭拉·H.罗森温主编《中世纪之争：议题与读本》（马萨诸塞州莫尔登，1998年）；R.I.穆尔《第一次欧洲革命，约970—1215年》（牛津，2000年）。</p>\n<h4>史料</h4>\n<p>史料校勘本已列于上述《剑桥古代史》和《新编剑桥中世纪史》各卷之中。现有英译本的便捷目录可参见麦基特里克主编的《早期中世纪》。</p>\n<h3 id=\"ch14-s1\">电子资源</h3>\n<p>如今互联网上有大量有用的资料。早期中世纪博物馆和图书馆藏品的图像可在多个主要机构的网站上找到，包括大英图书馆、大英博物馆、敦巴顿橡树园博物馆以及大都会艺术博物馆的修道院分馆。</p>\n<p>此外还有许多由大学建立的网站，专门提供中世纪资源，尤其是文献译本、专题书目以及部分地图。以下网站维护良好，是可靠的访问入口：</p>\n<p>http://www.fordham.edu/halsall/sbook.html</p>\n<p>该公共访问网站设在福特汉姆大学，即“互联网中世纪史料库”，收录了大量晚期古代和中世纪早期文献的在线英译本，并提供指向许多其他有用站点的链接。</p>\n<p>http://labyrinth.georgetown.edu</p>\n<p>该网站设在乔治敦大学，是访问在线中世纪资源的历史最悠久、功能最完善的门户网站。</p>\n<p>http://www.netserf.org</p>\n<p>一个链接索引，指向数千个其他包含中世纪资源的网站。</p>\n<p>http://www.wmich.edu/medieval/research/rawl/index.html</p>\n<p>西密歇根大学的罗林森中心提供范围广泛的有用研究工具（书目、文献等），用于盎格鲁-撒克逊英格兰和古英语研究。</p>\n<p>http://www.medievalsources.co.uk</p>\n<p>提供曼彻斯特大学出版社所出版译本的电子版（仅限订户访问），另设公共访问门户，链接至其他一系列中世纪网站。</p>\n<p>http://www.itergateway.org</p>\n<p>由多伦多大学建立的中世纪与文艺复兴书目数据库，部分内容向公众开放。</p>\n<h3 id=\"ch14-s2\">区域研究</h3>\n<p>区域史和国别史在中世纪早期研究中占有重要地位，许多著作专门论述现代政体的中世纪渊源。以下是少量英文著作选目。凡相关之处，这些著作均提供外文文献的书目指引。</p>\n<h4>不列颠群岛（包括爱尔兰）</h4>\n<p>《罗马之后》，托马斯·查尔斯-爱德华兹主编（牛津，2003年）；《从维京人到诺曼人》，温迪·戴维斯主编（牛津，2003年），二者均属“牛津不列颠群岛简史”丛书；《牛津苏格兰史指南》，迈克尔·林奇编，《牛津苏格兰历史指南》（Oxford Companion to Scottish History）（牛津，2001）；S. J. 康纳利编，《牛津爱尔兰历史指南》（Oxford Companion to Irish History），第2版（牛津，2002）；迈克尔·拉皮奇、约翰·布莱尔、西蒙·凯恩斯与唐纳德·斯克拉格编，《布莱克威尔盎格鲁-撒克逊英格兰百科全书》（Blackwell Encyclopaedia of Anglo-Saxon England）（牛津，1999）；戴维·希尔，《盎格鲁-撒克逊英格兰地图集》（An Atlas of Anglo-Saxon England）（牛津，1981）。</p>\n<h4>法兰西</h4>\n<p>爱德华·詹姆斯，《法兰西的起源：从克洛维到卡佩王朝，500—1000》（The Origins of France: From Clovis to the Capetians, 500–1000）（伦敦，1982）；伊恩·伍德，《墨洛温王国，450—751》（The Merovingian Kingdoms 450–751）（哈洛，1994）；皮埃尔·里谢，《加洛林家族：锻造欧洲的家族》（The Carolingians: A Family who Forged Europe），M. I. 艾伦译（费城，1993）；琼·邓巴宾，《法兰西的形成，843—1180》（France in the Making, 843–1180），第2版（牛津，2000）。</p>\n<h4>西班牙</h4>\n<p>罗杰·柯林斯，《中世纪早期西班牙：多样性中的统一，400—1000》（Early Medieval Spain: Unity in Diversity, 400–1000），第2版（贝辛斯托克，1995）；托马斯·F. 格利克，《中世纪早期的伊斯兰与基督教西班牙》（Islamic and Christian Spain in the Early Middle Ages）（普林斯顿，1979）。</p>\n<h4>意大利</h4>\n<p>克里斯·威克姆，《中世纪早期意大利：中央权力与地方社会，400—1000》（Early Medieval Italy: Central Power and Local Society, 400–1000）（伦敦，1981）；克里斯蒂娜·拉·罗卡编，《476—1000年中世纪早期的意大利》（Italy in the Early Middle Ages, 476–1000）（牛津，2002）；克里斯托弗·克莱因亨茨编，《中世纪意大利百科全书》（Medieval Italy: An Encyclopedia），两卷本（纽约，2004）。</p>\n<h4>德意志</h4>\n<p>蒂莫西·罗伊特，《800—1056年中世纪早期的德意志》（Germany in the Early Middle Ages, 800–1056）（伦敦，1991）；本杰明·阿诺德，《500—1300年的中世纪德意志：一种政治阐释》（Medieval Germany 500–1300: A Political Interpretation）（贝辛斯托克，1997）；约翰·M. 吉普编，《中世纪德意志百科全书》（Medieval Germany: An Encyclopedia）（纽约，2001）。</p>\n<h4>斯堪的纳维亚</h4>\n<p>比吉特·索耶与彼得·索耶，《中世纪斯堪的纳维亚：约800—1500年从皈依到宗教改革》（Medieval Scandinavia: From Conversion to Reformation, circa 800–1500）（明尼阿波利斯，1993）；克努特·赫勒编，《剑桥斯堪的纳维亚史》第一卷：《史前至1520年》（The Cambridge History of Scandinavia, i: Prehistory to 1520）（剑桥，2003）；詹姆斯·格雷厄姆-坎贝尔编，《维京世界文化地图集》（Cultural Atlas of the Viking World）（纽约，1994）；威廉·菲茨休与伊丽莎白·沃德编，《维京人：北大西洋传奇》（Vikings: The North Atlantic Saga）（华盛顿，2000）。</p>\n<h4>中欧</h4>\n<p>小约翰·V. A. 法恩，《中世纪早期的巴尔干：六世纪至十二世纪后期的批判性考察》（The Early Medieval Balkans: A Critical Survey from the Sixth to the Late Twelfth Century）（安阿伯，1983）；P. M. 巴福德，《早期斯拉夫人》（The Early Slavs）（伦敦，2001）；帕尔·恩格尔，《圣伊什特万之国：895—1526年中世纪匈牙利史》（The Realm of St Stephen: A History of Medieval Hungary, 895–1526），陶马什·帕洛什法尔维译（伦敦，2001）；保罗·R. 马戈西，《从五世纪初至今的东中欧历史地图集》（Historical Atlas of East Central Europe from the Early Fifth Century to the Present），第2版（西雅图，2002）。</p>\n<h2 id=\"ch14-s3\">第一章 口述与书写</h2>\n<p>马尔科·莫斯特特编，《中世纪传播的新取径》（New Approaches to Medieval Communication）（图尔恩豪特，1999），提供了有益的方法论思考，以及与本章主题相关的极为详尽的参考文献目录。</p>\n<p>中世纪早期的语言史与非拉丁语文学史自然吸引了大量关注；一个易于入门的概览是菲利普·沃尔夫，《西方语言，公元100—1500年》（Western Languages, AD 100–1500），弗朗西丝·帕特里奇译（伦敦，1971）。薇薇安·劳，《从柏拉图到1600年的欧洲语言学史》（The History of Linguistics in Europe from Plato to 1600）（剑桥，2003），以平易而富有启发性的方式考察了人们如何理解与研究语言。</p>\n<p>关于古英语的推荐入门读物有阿尔伯特·C. 鲍与托马斯·凯布尔，《英语语言史》（A History of the English Language），第4版（伦敦，1993），以及马尔科姆·戈登与迈克尔·拉皮奇编，《剑桥古英语文学指南》（The Cambridge Companion to Old English Literature）（剑桥，1991）。凯瑟琳·希尔斯，《英格兰人的起源》（Origins of the English）（伦敦，2003），概述了围绕拉丁语和不列颠语让位于古英语的历史情境所引发的争议。</p>\n<p>J. 奈特·博斯托克，《古高地德语文学手册》（A Handbook of Old High German Literature），第2版（牛津，1976），仍是英语世界对这一文献群的唯一论述，沃尔夫冈·豪布里希斯，《德意志文学史》第一卷第一部分：《开端：中世纪早期本土语言书写的尝试（约700—1050/60年）》（Geschichte der deutschen Literatur, vol. 1 pt. 1, Die Anfänge: Versuche volkssprachiger Schriftlichkeit im frühen Mittelalter (ca. 700–1050/60)）（法兰克福，1988），可对其作有益的补充。D. H. 格林，《早期日耳曼世界中的语言与历史》（Language and History in the Early Germanic World）（剑桥，1998），提供了比较研究的进路。关于斯拉夫语，参见亚历山大·M. 申克，《斯拉夫人的黎明》（The Dawn of Slavic）（纽黑文，1995）。</p>\n<p>托马斯·查尔斯-爱德华兹在《海岛凯尔特人中的语言与社会，400—1000年》（“Language and Society among the Insular Celts, 400–1000”，载米兰达·J. 格林编，《凯尔特世界》（The Celtic World）（伦敦，1995），第703—736页）中综述了凯尔特地区的情况。关于欧甘文字，参见达米安·麦克马纳斯，《欧甘文字指南》（A Guide to Ogam）（梅努斯，1991）；关于如尼文字，参见拉尔夫·W. V. 埃利奥特，《如尼文字导论》（Runes: An Introduction），第2版（曼彻斯特，1989），以及戴维·N. 帕森斯，《重铸如尼文：盎格鲁-撒克逊弗托尔克字母的改革》（Recasting the Runes: The Reform of the Anglo-Saxon futhorc）（乌普萨拉，1999）。</p>\n<p>关于拉丁语，米歇尔·班亚尔，《口耳相传：四至九世纪拉丁西方的书面交流与口头交流》（Viva voce: Communication écrite et communication orale du IVe au IXe siècle en Occident latin）（巴黎，1992）与罗杰·赖特，《晚期拉丁语的社会语言学—语文学研究》（A Sociophilological Study of Late Latin）（图尔恩豪特，2002）是两种对历史颇为敏感的诠释，二者都为拉丁语向罗曼语转变背后的语文学问题提供了技术性指导。</p>\n<p>近来学界高度重视围绕“口头性”与“文字性”对立、并以“记忆”作为两者桥梁的一系列问题。争论的标志性两极由迈克尔·里希特，《中世纪西方的形成：蛮族口头文化研究》（The Formation of the Medieval West: Studies in the Oral Culture of the Barbarians）（都柏林，1994）、罗莎蒙德·麦基特里克，《加洛林王朝与书面文字》（The Carolingians and the Written Word）（剑桥，1989）以及帕特里克·J. 吉尔里，《记忆的幽灵：第一个千年之末的记忆与遗忘》（Phantoms of Remembrance: Memory and Oblivion at the End of the First Millennium）（普林斯顿，1994）划定。1990年代的数部论文集具有核心的方法论意义，首推罗莎蒙德·麦基特里克编，《中世纪早期欧洲识字之用》（The Uses of Literacy in Early Medieval Europe）（剑桥，1990）。艾伦·K. 鲍曼与格雷格·伍尔夫编，《古代世界的识字与权力》（Literacy and Power in the Ancient World）（剑桥，1994），涵盖了古代晚期及继承王国；而休·普赖斯编，《中世纪凯尔特社会的识字》（Literacy in Medieval Celtic Societies）（剑桥，1998），对那些在相关讨论中过于轻易被忽视的地区有不少论述。</p>\n<p>其他有用的论文集包括：A. N. 多恩与卡罗尔·布劳恩·帕斯捷尔纳克编，《互文之声：中世纪的口头性与文本性》（Vox Intertexta: Orality and Textuality in the Middle Ages）（麦迪逊，1992）；乌尔苏拉·舍费尔编，《中世纪早期的书写文化》（Schriftlichkeit im frühen Mittelalter）（图宾根，1993）；鲁道夫·席费尔编，《加洛林王朝的书写文化与帝国行政》（Schriftkultur und Reichsverwaltung unter den Karolingern）（奥普拉登，1996）；瓦尔特·波尔与保罗·赫罗尔德编，《书写的功用：中世纪的社会记忆、统治与财产》（Vom Nutzen des Schreibens: Soziales Gedächtnis, Herrschaft und Besitz im Mittelalter）（维也纳，2002）。专题研究包括：塞斯·勒雷尔，《盎格鲁-撒克逊文学中的识字与权力》（Literacy and Power in Anglo-Saxon Literature）（林肯，内布拉斯加，1991）；尼古拉斯·埃弗雷特，《伦巴第意大利的识字，约568—774年》（Literacy in Lombard Italy, c.568–774）（剑桥，2003）；米歇尔·齐默尔曼，《九至十二世纪加泰罗尼亚的书写与阅读》（Écrire et lire en Catalogne du IXe au XIIe siècle）（马德里，2003）。关于女性的识字问题，参见罗莎蒙德·麦基特里克《中世纪早期的女性与识字》（“Women and literacy in the early Middle Ages”），载同氏《六至九世纪法兰克王国的书籍、抄工与学问》（Books, Scribes and Learning in the Frankish Kingdoms, 6th–9th Centuries）（奥尔德肖特，1994），第十三章。</p>\n<p>伯恩哈德·比朔夫《中世纪早期拉丁注释史上的转折点》（“Wendepunkte in der Geschichte der lateinischen Exegese im Frühmittelalter”），载同氏《中世纪研究：文字学与文学史论文选》（Mittelalterliche Studien: Ausgewählte Aufsätze zur Schriftkunde und Literaturgeschichte）第一卷（斯图加特，1966），第205—273页，为海岛世界中基督教拉丁识字所带来的挑战奠定了新的研究基础；而G. 哈丁·布朗《盎格鲁-撒克逊英格兰识字的动力》（“The Dynamics of Literacy in Anglo-Saxon England”，《约翰·莱兰兹图书馆馆刊》77（1995），第109—142页）与罗伊·柳扎《谁在阅读古英语福音书？》（“Who Read the Gospels in Old English?”，载彼得·S. 贝克与尼古拉斯·豪编，《言与行：纪念弗雷德·C. 罗宾逊的中世纪英语语言与文学研究》（Words and Works: Studies in Medieval English Language and Literature in Honour of Fred C. Robinson）（多伦多，1998），第3—24页）则以颇为不同的方式探讨了这一问题。</p>\n<p>关于阅读，乔纳森·博亚林编，《阅读的民族志》（The Ethnography of Reading）（伯克利，1993）与古列尔莫·卡瓦洛与罗歇·沙尔捷编，《西方阅读史》（A History of Reading in the West），莉迪娅·科克伦译（剑桥，1999）中有颇具洞见的贡献。D. H. 格林，《聆听与阅读：800—1300年德意志文学的最初接受》（Listening and Reading: The Primary Reception of German Literature, 800–1300）（剑桥，1994）、阿曼多·彼得鲁奇，《中世纪意大利的作者与读者：书写文化史研究》（Writers and Readers in Medieval Italy: Studies in the History of Written Culture），查尔斯·拉丁译（纽黑文，1995）以及西蒙·富兰克林，《约950—1300年早期罗斯的书写、社会与文化》（Writing, Society and Culture in Early Rus, c.950–1300）（剑桥，2002），其意义均超出了书名所示的范围。</p>\n<p>关于修道院阅读，让·勒克莱尔，《对学问的热爱与对上帝的渴求》（The Love of Learning and the Desire for God），凯瑟琳·米斯拉希译（纽约，1961），仍保持其经典地位。皮埃尔·里谢，《蛮族西方的教育与文化，六至八世纪》（Education and Culture in the Barbarian West, 6th–8th Centuries），约翰·J. 孔特雷尼译（哥伦比亚，南卡罗来纳，1975），以及同氏《中世纪早期的学校与教育：五世纪末至十一世纪中叶》（Écoles et enseignement dans le haut moyen âge, fin du Ve siècle–milieu du XIe siècle），第3版（巴黎，1999），综述了学校与课程。伯恩哈德·比朔夫，《查理曼时代的抄本与图书馆》（Manuscripts and Libraries in the Age of Charlemagne），迈克尔·戈尔曼译（剑桥，1994），在古典文本的传承及其他诸多方面都很重要。</p>\n<p>虽然法律与行政传统上被视为宪法史和制度史的组成部分，但较新的研究取径将它们置于本章所论主题的核心。尤其参见帕特里克·沃默德《成文法与王者之言：从尤里克到克努特的立法与日耳曼王权》（“Lex scriptum and verbum regis: Legislation and Germanic Kingship from Euric to Cnut”），载P. H. 索耶与伊恩·N. 伍德编，《中世纪早期王权》（Early Medieval Kingship）（利兹，1977），第105—138页；罗宾·查普曼·斯泰西《极古老西方的法律与秩序：中世纪早期的英格兰与爱尔兰》（“Law and Order in the Very Old West: England and Ireland in the Early Middle Ages”），载B. T. 哈德森与V. 齐格勒编，《交错的路径：欧洲中世纪凯尔特面向的方法论取径》（Crossed Paths: Methodological Approaches to the Celtic Aspect of the European Middle Ages）（拉纳姆，马里兰，1991），第39—60页；以及T. M. 查尔斯-爱德华兹《五至七世纪西方诸王国的法律》（“Law in the Western Kingdoms between the Fifth and the Seventh Century”），载《剑桥古代史》（The Cambridge Ancient History）第十四卷，第260—287页。罗马法及相关文书形式对继承王国社会习俗的调适是一个复杂的课题，但有两篇与本课题及第三、四章内容密切相关的易读文章：帕特里克·沃默德《蛮族法典：后罗马西方的法律与族群性》（“The Leges barbarorum: Law and Ethnicity in the Post-Roman West”），载H.-W. 格茨、J. 雅尔努特与W. 波尔编，《王国与族群：罗马世界转型中古代晚期与中世纪早期的民族与王国之关系》（Regna and Gentes: The Relationship between Late Antique and Early Medieval Peoples and Kingdoms in the Transformation of the Roman World）（莱顿，2003），第21—53页；以及安蒂·阿尔雅瓦《蛮族定居后罗马家庭法的存续》（“The Survival of Roman Family Law after the Barbarian Settlements”），载拉尔夫·W. 马西森编，《古代晚期的法律、社会与权威》（Law, Society, and Authority in Late Antiquity）（牛津，2001），第33—51页。帕特里克·沃默德，《英格兰法的形成：从阿尔弗雷德王到十二世纪》（The Making of English Law: King Alfred to the Twelfth Century）（牛津，1999），对大陆法系以及盎格鲁-撒克逊法律都有很多论述。</p>\n<p>在社会政治语境中研究宪章，是由温迪·戴维斯与保罗·富拉克编的开创性论文集《中世纪早期欧洲的争端解决》（The Settlement of Disputes in Early Medieval Europe）（剑桥，1986）开启的；卡尔·海德克尔编，《中世纪社会中的宪章与书面文字的使用》（Charters and the Use of the Written Word in Medieval Society）（图尔恩豪特，2000），收录了数篇关于中世纪早期的宝贵文章。关于文书意识的有益研究有：凯瑟琳·A. 洛《盎格鲁-撒克逊英格兰的世俗识字与划押契据的发展》（“Lay Literacy in Anglo-Saxon England and the Development of the Chirograph”），载菲利普·普尔西亚诺与伊莱恩·M. 特雷汉编，《盎格鲁-撒克逊抄本及其遗产》（Anglo-Saxon Manuscripts and their Heritage）（奥尔德肖特，1998），第161—204页；克里斯蒂娜·拉·罗卡《法律与实践：八世纪意大利的权力与社会关系》（“La legge e la pratica: Potere e rapporti sociali nell’Italia dell’VIII secolo”），载卡洛·贝尔泰利与詹·彼得罗·布罗焦洛编，《伦巴第人的未来：意大利与查理曼欧洲的构建》（Il futuro dei Longobardi: L’Italia e la costruzione dell’Europa di Carlo Magno: Saggi）（米兰，2000），第45—69页。另参见沃伦·布朗《当文书被毁或遗失时：中世纪早期的世俗民众与档案》（“When Documents are Destroyed or Lost: Lay People and Archives in the Early Middle Ages”），《早期中世纪欧洲》11（2002），第337—366页。帕特里克·J. 吉尔里《700—1100年欧洲的土地、语言与记忆》（“Land, Language and Memory in Europe, 700–1100”，《皇家历史学会会刊》第6辑第9卷（1999），第168—184页），以及罗宾·查普曼·斯泰西《文本与社会》（“Texts and Society”），载查尔斯-爱德华兹编，《罗马之后》（After Rome），第221—257页（见本书上文第315页），都恰当地强调了文本的口头的、展演性的性质。</p>\n<p>本书第42—43页所讨论的石板文书，由伊莎贝尔·贝拉斯克斯·索里亚诺刊布：《写在石板上的西哥特时代文书（六至八世纪）》（Documentos de época visigoda escritos en pizarra (siglos VI–VIII)），《中世纪古文书学文献》（Monumenta Palaeographica Medii Aevi）西班牙系列，两卷本（图尔恩豪特，2000）。第43—44页所讨论的红隆宪章，由奥雷利安·德·库尔松编：《布列塔尼红隆修道院宪章集》（Cartulaire de l’Abbaye de Redon en Bretagne）（巴黎，1863）。关于赫拉班与富尔达，参见雷蒙德·科特耶与哈拉尔德·齐默尔曼编，《赫拉班·毛鲁斯：教师、修道院院长与主教》（Hrabanus Maurus: Lehrer, Abt und Bischof）（美因茨，1982），以及冈戈尔夫·施林普夫编，《加洛林与奥托世界中的富尔达修道院》（Kloster Fulda in der Welt der Karolinger und Ottonen）（法兰克福，1996）。</p>\n<h2 id=\"ch14-s4\">第二章 生与死</h2>\n<p>E. L. 琼斯，《欧洲经济奇迹：欧洲与亚洲历史中的环境、经济与地缘政治》（The European Economic Miracle: Environments, Economies and Geopolitics in the History of Europe and Asia）（剑桥，1981），是一部审慎的导论，将此处讨论的诸多问题置于广阔的视野之中。克劳斯·兰兹堡，《欧洲与地中海的公元第一个千年：一篇考古学论文》（The First Millennium AD in Europe and the Mediterranean: An Archaeological Essay）（剑桥，1991），充斥着图表、地图与平面图，虽富有启发性但不尽准确。</p>\n<p>关于人类境况的鲜明速写，参见卡尔·莱瑟《十世纪的境况》（“The Tenth-Century Condition”），载同氏《中世纪德意志及其邻邦，900—1250年》（Medieval Germany and its Neighbours, 900–1250）（伦敦，1982），第1—9页。菲利普·德普勒，《六世纪中叶至九世纪末的西方社会》（Les Sociétés occidentales du milieu du VIe à la fin du IXe siècle）（雷恩，2002），是一部广泛的综述，吸收了有关第二至六章主题的最新学术成果。</p>\n<p>中世纪早期的环境史尚处于起步阶段，不过聚落研究与景观史往往涉及许多相同的问题。关于科学方法的易读导论，参见佩特拉·达克，《英国的公元第一个千年环境》（The Environment of Britain in the First Millennium AD）（伦敦，2000）。马修·斯托特《早期基督教爱尔兰：聚落与环境》（“Early Christian Ireland: Settlement and Environment”），载特里·巴里编，《爱尔兰聚落史》（A History of Settlement in Ireland）（伦敦，2000），第80—109页，评述了爱尔兰的相关问题与证据。一种对比鲜明的取径见保罗·斯夸特里蒂，《中世纪早期意大利的水与社会，公元400—1000年》（Water and Society in Early Medieval Italy, AD 400–1000）（剑桥，1998）。另参见斯夸特里蒂编，《中世纪欧洲的用水：技术与资源利用》（Working with Water in Medieval Europe: Technology and Resource-Use）（莱顿，2000）。关于欧洲的气候，可参阅休伯特·H. 兰姆，《气候、历史与现代世界》（Climate, History and the Modern World）（伦敦，1982），尤其是第九章；另见同氏《公元前1000年至公元1000年的气候》（“Climate from 1000 bc to 1000 ad”），载马丁·琼斯与杰弗里·丁布尔比编，《人类的环境：从铁器时代到盎格鲁-撒克逊时期》（The Environment of Man: The Iron Age to the Anglo-Saxon Period），《英国考古报告》英国系列87（牛津，1981），第53—65页。</p>\n<p>聚落史有多种研究进路。海伦娜·哈默罗，《中世纪早期聚落：西北欧400—900年乡村社群的考古学》（Early Medieval Settlements: The Archaeology of Rural Communities in North-West Europe, 400–900）（牛津，2002），综述了大陆与盎格鲁-撒克逊的聚落遗址。关于单一遗址的插图丰富的研究，参见《查理曼时代的一个村庄：从七世纪到公元一千年的圣但尼修道院的僧侣与农民》（Un Village au temps de Charlemagne: Moines et paysans de l’abbaye de Saint-Denis du VIIe siècle à l’an Mil）（巴黎，1988）。克里斯·威克姆《中世纪早期的欧洲森林：景观与土地开垦》（“European Forests in the Early Middle Ages: Landscape and Land Clearance”，《中世纪早期的植物环境》（L’ambiente vegetale nell’alto medioevo），两卷本，《中世纪研究周丛刊》37（1990），第二卷，第479—545页）甚为重要（重印于同氏《土地与权力：意大利研究》（Land and Power: Studies in Italian……</p>\n<p>以及《欧洲社会史，400–1200》（伦敦，1994），第155–200页）；关于安达卢斯，参见托马斯·F·格里克《中世纪早期的伊斯兰教与基督教西班牙》（普林斯顿，1979），尤其是第2章，以及安德鲁·M·沃森《早期伊斯兰世界的农业革新：作物与农耕技术的传播，700–1100》（剑桥，1983）。虽然已成旧作，让·夏普洛与罗贝尔·福西耶合著、H. 克利尔英译的《中世纪的村庄与房屋》（伦敦，1985）仍具参考价值。</p>\n<p>关于中世纪早期人口问题，尚无令人满意的综述性著作。读者应查阅一系列关键论文。关于瘟疫，J.-N. 比拉邦与J. 勒高夫合著的《中世纪早期的瘟疫》，载罗伯·福斯特与奥雷斯特·拉努姆主编《历史中的人类生物学：〈年鉴〉选集》（巴尔的摩，1975），第48–80页，具有核心重要性。围绕瘟疫的地理范围及其人口学意义的争论，可从迪克·哈里森《中世纪黎明时期的瘟疫、定居点与结构变迁》，载《Scandia》第59卷（1993），第15–48页，以及J. R. 马迪科特《七世纪英格兰的瘟疫》，载《过去与现在》第156卷（1997），第7–54页中清楚看出。彼得·萨里斯《查士丁尼瘟疫：起源与影响》，载《延续与变迁》第17卷（2002），第169–182页，则主张其影响是灾难性的。</p>\n<p>罗马之后西方的铭文证据由马克·A·汉德利整理呈现，见其《死亡、社会与文化：公元300–750年高卢与西班牙的铭文与墓志铭》，英国考古报告国际系列第1135种（牛津，2003），其中对人口学意义有所评论；关于750年之后的人口状况，最好通过皮埃尔·图贝尔敏锐的综述《加洛林时代》来了解，该文载安德烈·布尔吉埃、克里斯蒂亚娜·克拉皮施-祖贝尔、马丁·塞加朗与弗朗索瓦兹·佐纳邦主编《家庭史》第1卷《遥远的世界，古代的世界》，莎拉·汉伯里·特尼森、罗斯玛丽·莫里斯与安德鲁·威尔逊英译（剑桥，1996），第379–406页；另见让-皮埃尔·德夫罗伊《法兰克欧洲（6–9世纪）的农村经济与社会》（巴黎，2003），两书均提供了进一步的文献指引。G. M. 施瓦茨《根据圣贝尔坦修道院财产清册看村庄人口》，载《中世纪史杂志》第11卷（1985），第31–41页，是关于如何处理九世纪庄园调查证据这一辩论的少数英文贡献之一。由于在1086年《末日审判书》之前缺乏任何可供研究的文献基础，不列颠群岛任何地区的中世纪早期人口研究均付阙如。</p>\n<p>关于杀婴的辩论由埃米莉·科尔曼《中世纪早期的杀婴》引发，该文载苏珊·莫舍·斯图尔德主编《中世纪社会中的妇女》（费城，1976），第47–70页，并得到卡罗尔·克洛弗《稀缺的政治：关于早期斯堪的纳维亚性别比的札记》，载《斯堪的纳维亚研究》第60卷（1988），第147–188页的支持。详细的反驳论证大多以法语发表：莫妮克·泽尔纳《根据圣日耳曼昂莱财产清册看九世纪维勒讷沃圣乔治与马恩河畔诺让的人口》，载《尼斯文学院与人文学科学院年鉴》第37卷（1979），第17–24页；以及让-皮埃尔·德夫罗伊《中世纪早期财产清册的分析方法》，载《布鲁塞尔历史学报》第4卷（1981），第71–88页。关于杀婴问题有清醒的评论，并对避孕与堕胎实践有极为重要的讨论，见约翰·M·里德尔《从古代世界到文艺复兴的避孕与堕胎》（马萨诸塞州剑桥，1992）。教会教导由J. T. 努南阐述，见其《避孕：天主教神学家与教会法学家对其论述的历史》（马萨诸塞州剑桥，1986）。九世纪蓄意或意外的杀婴事件是格哈德·施米茨《罪与罚：科尔比修道院拉特拉姆努斯关于杀婴的一段不为人知的论述》一文的主题，载《德国中世纪研究档案》第38卷（1982），第363–387页。</p>\n<p>关于中世纪早期农业与生产力的讨论往往过于纠缠于技术变革的年代断限之争；欲获清晰简明的评价，可参见阿德里安·费尔胡尔斯特《再论中世纪的“农业革命”》，载B. S. 巴赫拉赫与D. 尼古拉斯主编《中世纪的法律、习俗与社会结构：纪念布莱斯·莱昂论文集》（卡拉马祖，1990），第17–28页。此文的补充资料为弗拉朗修道院文化中心出版的《中世纪早期的农业增长：年代、方式与地理》（欧什，1990）。中世纪早期农业对营养与健康的影响，就意大利而言由M. 蒙塔纳里探讨，见其《中世纪早期的农民饮食》（那不勒斯，1979）；就西北欧而言，见凯西·L·皮尔逊《营养与中世纪早期饮食》，载《镜报》第72卷（1997），第1–32页。</p>\n<p>关于饥荒的奠基性著作仍是F. 库尔希曼《中世纪的饥荒：8至13世纪德国经济史论集》（莱比锡，1900）；不过，阿德里安·费尔胡尔斯特对其统治时期查理曼对饥荒的应对有详细讨论，见《加洛林农业政策：〈庄园敕令〉与792/793年及805/806年的饥荒》，载《农业史与农村社会学杂志》第13卷（1965），第175–189页。食物禁忌由皮埃尔·博纳西考察，见《中世纪早期西方对污秽食物的消费与求生食人行为》，载《年鉴：经济、社会、文明》第44卷（1989），第1035–1056页。</p>\n<p>关于疾病与病害的考古证据，参见K. 曼彻斯特《唤醒死者：古病理学的潜力》，载E. 索斯沃思主编《盎格鲁-撒克逊墓地：重新评估》（斯特劳德，1990），第87–96页；更详细的论述见A. 查尔内茨基、C. 乌利希与R. 沃尔夫《人类学与医学视野下的中世纪早期人类》第2版（斯图加特，1983）。关于疾病的社会与文化史，佩雷格林·霍登《疾病、龙与圣徒：黑暗时代的疫病应对》，载特伦斯·兰杰与保罗·斯莱克主编《疫病与观念：关于瘟疫之历史认知的论文集》（剑桥，1992），第45–76页，颇具启发性。另见佩雷格林·霍登与埃米莉·萨维奇-史密斯主编《医学社会史》“公元1000年”专号（第13卷第2期，2000），第197–321页，其中收录了涉及中世纪早期医学史诸多方面的论文。M. L. 卡梅伦《盎格鲁-撒克逊医学》（剑桥，1993）亦有价值。</p>\n<p>在中世纪早期圣徒崇拜的大量文献中，彼得·布朗《圣徒崇拜：其在拉丁基督教中的兴起与功能》（芝加哥，1981）已成经典；两部论文集显示了较新的研究取向：詹姆斯·霍华德-约翰斯顿与保罗·安东尼·海沃德主编《古代晚期与中世纪早期的圣徒崇拜》（牛津，1999），以及艾伦·撒克与理查德·夏普主编《中世纪早期西方的地方圣徒与地方教会》（牛津，2002）。</p>\n<p>中世纪早期的宇宙观也引起了关注。莫妮卡·布勒克尔《天气巫术：论中世纪早期的一种信仰复合体》，载《Francia》第9卷（1981），第117–131页，为必读之作。瓦莱丽·弗林特《魔法在中世纪早期欧洲的兴起》（普林斯顿，1991），是对处理疾病、坏天气及其他诸多问题的广泛策略的一次有力而具争议性的探索。关于末日论思想，参见理查德·兰德斯、安德鲁·高与戴维·C·范·米特主编的论文集《启示录式的公元1000年：宗教期待与社会变迁，950–1050》（纽约，2003）。</p>\n<p>第66–68页的人口学细节来自唐·布罗思韦尔《古人口学与不列颠早期居民》，载《世界考古学》第4卷（1972），第75–87页；薇拉·I·埃维森《多佛：巴克兰盎格鲁-撒克逊墓地》（伦敦，1987）；以及于尔格·施奈德、达尼埃尔·古彻、汉苏埃利·埃特尔与于尔格·汉瑟《苏黎世的明斯特霍夫》两卷本（奥尔滕，1982）。</p>\n<h2 id=\"ch14-s5\">第三章 亲友与亲族</h2>\n<p>第三、四章主题的最佳入门读物是布尔吉埃等主编的《家庭史》（见前文第321页），尤其是第8–9章“蛮族欧洲”与“加洛林时代”。杰弗里·S·内森《古代晚期的家庭：基督教的兴起与传统的延续》（伦敦，2000），引导读者了解晚期罗马的遗产。戴维·赫利希《中世纪家庭》（马萨诸塞州剑桥，1985）与杰克·古迪《欧洲家庭与婚姻的发展》（剑桥，1983）均甚重要而具争议性。较为关注家庭内部互动的新取向，见卡特琳·海内《天堂的遗产：加洛林训诫文学中的婚姻、母性与妇女》（法兰克福，1997）、萨莉·克劳福德《盎格鲁-撒克逊英格兰的童年》（斯特劳德，1999），以及保利娜·斯塔福德《中世纪早期的父母与子女》，载《早期中世纪欧洲》第10卷（2001），第257–271页。</p>\n<p>古代世界的命名习俗由B. 索尔韦概述，见《名字里有什么？约公元前700年至公元700年罗马命名实践的考察》，载《罗马研究杂志》第84卷（1994），第124–145页；晚期罗马的命名惯例由马丁·海因策尔曼详细探讨，见《古代晚期拉丁人名的变迁》，载G. 迪比与J. 勒高夫主编《中世纪西方的家庭与亲族》，法兰西罗马学院丛刊第30种（罗马，1977），第19–24页。</p>\n<p>关于日耳曼人名最易获取的入门著作仍是H. B. 伍尔夫《古日耳曼命名原则》（巴尔的摩，1939），现由蕾吉娜·勒让的论文加以补充，见《中世纪早期社会（6–10世纪）的人名与亲族关系转型》，载G. T. 比奇、M. 布兰与P. 沙雷耶主编《中世纪欧洲人名研究：社会认同与家族结构》（密歇根州卡拉马祖，2002），第31–50页。迪特尔·格伊尼希、沃尔夫冈·豪布里希斯与耶尔格·亚尔努特主编《名与人：论中世纪早期人名的史料价值》（柏林，1997），呈现了人名学研究的一系列新取向。妇女的名字由汉斯-维尔纳·格茨详尽分析，见《女性之名：中世纪早期妇女的名字与命名》，载《Francia》第23卷第1期（1996），第99–134页；农民的名字见卡尔·I·哈默《中世纪早期巴伐利亚的农奴姓名与领主组织》，载《中世纪研究》第3辑第36卷（1995），第917–928页；以及J. 贝斯梅尔尼《九世纪法兰西乡村中农民家庭的结构》，载《中世纪》第90卷（1984），第165–193页。</p>\n<p>关于爱尔兰人名（与亲族模式缺乏明确联系者），参见布赖恩·奥·基夫《爱尔兰人名的若干方面》（都柏林，1986）。</p>\n<p>墓葬考古学的入门著作有盖伊·霍尔索尔《中世纪早期墓地：罗马之后世界的墓葬考古学导论》（格拉斯哥，1995），以及爱德华·詹姆斯《墓葬与地位：中世纪早期西方》，载《皇家历史学会会刊》第5辑第39卷（1989），第23–40页。梅根·麦克劳克林《与圣徒为伴：中世纪早期为亡者祈祷》（纽约州伊萨卡，1994）第2章概述了纪念亡者的基督教仪式。关于此背景下的亲族关系，参见C. 布沙尔《9至11世纪贵族的家庭结构与家庭意识》，载《Francia》第14卷（1986），第639–658页。</p>\n<p>L. 热尼科《系谱》，载《中世纪西方史料类型学》第15种（图尔奈，1975），提供了系谱学的一般性导论；更详细的讨论见肯尼思·赛瑟姆《盎格鲁-撒克逊王族系谱》，载《英国学术院院刊》第39卷（1953），第287–348页；D. N. 邓维尔《王权、系谱与列王名录》，载P. H. 索耶与I. N. 伍德主编《中世纪早期王权》（利兹，1977），第72–104页；以及戴维·桑顿《中世纪早期威尔士与爱尔兰的口传、书写与系谱》，载普赖斯主编《中世纪凯尔特社会的读写能力》，第83–98页（见前文第318页）。关于纪念、记忆与认同的性别问题，见马修·因尼斯《家族内传承：妇女与贵族记忆，700–1200》，载伊丽莎白·范·豪茨主编《中世纪的记忆：男人、女人与过去，700–1300》（哈洛，2001），第17–35页；以及伊恩·伍德《由女性界定的系谱：丕平诸族之例》，载莱斯利·布鲁贝克与朱莉娅·M. H. 史密斯主编《中世纪早期世界的性别：东方与西方，300–900》（剑桥，2004），第234–256页。</p>\n<p>关于中世纪早期亲族关系的论著甚多，但往往受陈旧或不当的法律与人类学模型影响：阿妮塔·盖罗-雅拉贝尔关于方法与概念化的清醒评论应予重视，见《论中世纪欧洲的亲族结构》，载《年鉴：经济、社会、文明》第36卷（1981），第1028–1049页，以及《中世纪拉丁语中亲缘关系与亲族群体的称谓》，载《中世纪拉丁语文献集》第66–67卷（1988），第65–108页。皮埃尔·吉夏尔在其《从古代到中世纪：大家庭与小家庭》中抨击了关于中世纪早期“氏族”的陈旧观念，载《历史手册》第24卷（1979），第45–60页；而亚历山大·C·默里《日耳曼亲族结构：古代与中世纪早期的法律与社会研究》（多伦多，1983）则对其作了决定性的驳斥。</p>\n<p>对本书的研究取向与议题而言，以下著作具有根本意义：伊莎贝尔·雷阿尔《圣徒传记与家庭生活：根据圣徒传记史料看墨洛温王国（481–751）的亲族表征与体系》（图尔奈，2001）；蕾吉娜·勒让《法兰克世界（7–10世纪）的家庭与权力：社会人类学论集》（巴黎，1995）；以及卡尔·莱瑟《9至12世纪初的日耳曼贵族：历史文化概貌》，载《过去与现在》第41卷（1968），第25–53页。关于深度罗马化文化的佳例，参见P. D. 金《西哥特王国的法律与社会》（剑桥，1972）第8章“家庭”。</p>\n<p>关于盎格鲁-撒克逊英格兰，洛兰·兰开斯特《盎格鲁-撒克逊社会中的亲族关系》，载《英国社会学杂志》第9卷（1958），第230–250、359–377页，具有核心地位；H. R. 洛因《盎格鲁-撒克逊英格兰的亲族关系》，载《盎格鲁-撒克逊英格兰》第3卷（1974），第197–209页，仍具参考价值。T. M. 查尔斯-爱德华兹《早期爱尔兰与威尔士的亲族关系》（牛津，1993）值得细读。</p>\n<p>关于农民家庭与亲族关系，参见T. M. 查尔斯-爱德华兹《亲族、身份与海德之起源》，载《过去与现在》第56卷（1972），第3–33页；补充资料见卡尔·I·哈默《中世纪早期巴伐利亚的family与familia》，载R. 沃尔、J. 罗宾与P. 拉斯利特主编《历史欧洲的家庭形态》（剑桥，1983），第217–248页。</p>\n<p>关于基督教化所促成的拟制亲族形态的重要研究，有约瑟夫·H·林奇《中世纪早期欧洲的教父与亲族关系》（普林斯顿，1986），以及同氏《亲族关系的基督教化：盎格鲁-撒克逊英格兰的仪式担保》（纽约州伊萨卡，1998）。关于无亲族者，T. M. 查尔斯-爱德华兹《爱尔兰peregrinatio的社会背景》，载《Celtica》第11卷（1976），第43–59页，甚为重要。</p>\n<p>关于友谊，见维雷娜·埃普《Amicitia：论中世纪早期个人、社会、政治与教士关系史》（斯图加特，1999）。格尔德·阿尔托夫《家庭、朋友与追随者：中世纪早期欧洲的政治与社会纽带》，克里斯托弗·卡罗尔英译（剑桥，2004），以及同氏《Amicitiae与Pacta：10世纪初的结盟、联合、政治与代祷思想》，中世纪史料汇编丛书第37种（汉诺威，1992），均甚有价值。</p>\n<p>除凯尔特学者外，中世纪早期史家一直不愿涉猎荣誉与耻辱问题，而这些问题通常仍属文学分析之领域；参见T. M. 查尔斯-爱德华兹《若干爱尔兰与威尔士散文故事中的荣誉与地位》，载《Eriu》第29卷（1978），第123–141页；以及M. E. 欧文《耻辱与赔偿：妇女在亲族中的地位》，载D. 詹金斯与M. E. 欧文主编《威尔士妇女法》（加的夫，1980），第40–68页。凯瑟琳·奥布赖恩·奥基夫《英雄价值观与基督教伦理》中对过于简单化地使用诗歌史料提出了审慎的告诫，该文载戈登与拉皮奇主编《剑桥古英语文学指南》，第107–125页（见前文第317页）。妮拉·潘瑟《无所惧亦无所耻：墨洛温王朝早期关于荣誉与妇女的研究》（巴黎，2001），是唯一试图将此类分析扩展至欧陆的详细著作，且仅限于六世纪。</p>\n<p>关于早期中世纪血亲复仇的开创性研究至今仍是必读之作：J. M. Wallace-Hadrill, ‘The Blood-Feud of the Franks’, in his The Long-Haired Kings (London, 1962), 121–47。此外还应补充 W. I. Miller, ‘Choosing the Avenger: Some Aspects of the Bloodfeud in Medieval Iceland and England’, Law and History Review, 1 (1983), 159–204, 以及 Bloodtaking and Peacemaking: Feud, Law and Society in Saga Iceland (Chicago, 1990)，后者虽然主要讨论的是12至13世纪的冰岛，但对早期中世纪研究者而言仍具有普遍的价值。Guy Halsall, ‘Violence and Society in the Early Medieval West: An Introductory Survey’, in Halsall (ed.), Violence and Society in the Early Medieval West (Woodbridge, 1998), 1–45，对“复仇”的理解过于狭隘。Richard Fletcher, Bloodfeud: Murder and Revenge in Anglo-Saxon England (London, 2002)，是一部通俗易懂、生动有趣且聚焦于11世纪的微观史著作。</p>\n<h2 id=\"ch14-s6\">第四章 男性与女性</h2>\n<p>对早期中世纪社会的性别分析主要是英语学界学者的成果。关于相关议题，参见 Janet L. Nelson, ‘Family, Gender and Sexuality in the Middle Ages’, in Bentley (ed.), Companion to Historiography, 153–76 (见本书第314页)；Pauline Stafford and Anneke Mulder-Bakker (eds.), Gendering the Middle Ages (Oxford, 2001), 以及 Brubaker and Smith (eds.), Gender in the Early Medieval World: East and West, 300–900 (见本书第324页)，三者均附有详尽的补充书目。对比性的研究路径可参见 Julia M. H. Smith, ‘Did Women have a Transformation of the Roman World?’, in Stafford and Mulder-Bakker (eds.), Gendering the Middle Ages, 22–41，以及 Guy Halsall, ‘Gender and the End of Empire’, Journal of Medieval and Early Modern Studies, 34 (2004), 17–39。</p>\n<p>有几部专门论述早期中世纪女性的著作，但没有一部完全可靠；其中包括 Suzanne F. Wemple, Women in Frankish Society: Marriage and the Cloister 500–900 (Philadelphia, 1981)；Christine Fell, Women in Anglo-Saxon England (London, 1984)；Lisa M. Bitel, Land of Women: Tales of Sex and Gender from Early Ireland (Ithaca, NY, 1996)；同氏， Women in Early Medieval Europe, 400–1100 (Cambridge, 2002)，以及 Patricia Skinner, Women in Medieval Italian Society, 500–1200 (Harlow, 2001)。Hans-Werner Goetz, Frauen im frühen Mittelalter (Cologne, 1995) 中有许多有价值的内容。</p>\n<p>关于男性，参见 J. J. Cohen and B. Wheeler (eds.), Becoming Male in the Middle Ages (New York, 1997)、D. M. Hadley (ed.), Masculinity in Medieval Europe (London, 1999)，以及 Mathew Kuefler, The Manly Eunuch: Masculinity, Gender Ambiguity and Christian Ideology in Late Antiquity (Chicago, 2001)。Carol Clover, ‘Regardless of Sex: Men, Women and Power in Early Northern Europe’, Speculum, 68 (1993), 363–87 (重刊于 Nancy Partner (ed.), Studying Medieval Women: Sex, Gender, Feminism (Cambridge, MA, 1993))，基于早期冰岛史料提出了富有启发的比较视角。</p>\n<p>关于墓葬、性别与生命周期的关键研究有：Guy Halsall, ‘Female Status and Power in Early Merovingian Austrasia: The Burial Evidence’, EME 5 (1996), 1–24；同氏， Settlement and Social Organization: The Merovingian Region of Metz (Cambridge, 1995)，以及 N. Stoodley, The Spindle and the Spear: A Critical Enquiry into the Construction and Meaning of Gender in the Early Anglo-Saxon Burial Rite, British Archaeological Reports British Series, 288 (Oxford, 1999)。</p>\n<p>家务劳动与农业劳动的性别层面由 Ludolf Kuchenbuch, ‘Opus feminile: Das Geschlechtsverhältnis im Spiegel von Frauenarbeit im früheren Mittelalter’, in H.-W. Goetz (ed.), Weibliche Lebensgestaltung im frühen Mittelalter (Cologne, 1991), 139–75 进行分析；另见 Jean-Pierre Devroey, ‘Femmes au miroir des polyptyques: Une approche des rapports du couple dans l’exploitation rurale dépendante entre Seine et Rhin au IXe siècle’, in Stéphane Lebecq, Alain Dierkens, Régine Le Jan, and Jean-Marie Sansterre (eds.), Femmes et pouvoirs des femmes à Byzance et en Occident (VIe–XIe siècles) (Villeneuve-d’Ascq, 1999), 227–49。</p>\n<p>婚姻与两性关系从法律史料视角的综合考察见 James A. Brundage, Law, Sex and Society in Medieval Europe (Chicago, 1987)。关于婚姻形式的关键讨论有 Raymund Kottje, ‘Eherechtliche Bestimmungen der germanischen Volksrechte (5.–8. Jh.)’, in Werner Affeldt (ed.), Frauen in Spätantike und Frühmittelalter: Lebensbedingungen, Lebensnormen, Lebensformen (Sigmaringen, 1990), 211–20，以及 Il Matrimonio nella società altomedioevale, Settimane, 24, 2 vols. (1977) 中收录的论文。晚罗马时期的背景由 Judith Evans Grubb, Law and Family in Late Antiquity: The Emperor Constantine’s Marriage Legislation (Oxford, 1995) 加以评述。关于盎格鲁-撒克逊英格兰，Margaret Clunies Ross, ‘Concubinage in Anglo-Saxon England’, Past and Present, 108 (1985), 1–34 至关重要；就爱尔兰而言，Donnchadh Ó Corráin 的文章 ‘Marriage in Early Ireland’, in Art Cosgrove (ed.), Marriage in Ireland (Dublin, 1985), 5–24，以及 ‘Women and the Law in Early Ireland’, in Mary O’Dowd and Sabine Wichert (eds.), Chattel, Servant or Citizen: Women’s Status in Church, State and Society (Belfast, 1995), 45–57，是 Charles-Edwards, Early Irish and Welsh Kinship (见本书第325页) 的有益补充。另见 Ruth Mazo Karras, ‘Concubinage and Slavery in the Viking Age’, Scandinavian Studies, 62 (1990), 141–62。</p>\n<p>Mayke de Jong, ‘To the Limits of Kinship: Anti-Incest Legislation in the Early Medieval West’, in Jan Bremmer (ed.), From Sappho to de Sade: Moments in the History of Sexuality (London, 1989), 36–59，介绍了限制婚姻对象选择的种种尝试；Patrick Corbet, Autour de Burchard de Worms: L’Église allemande et les interdits de parenté (IXe–XIIe siècle) (Frankfurt, 2001) 对这一主题作了更为详细的考察。比较研究包括：Bart Jaski, ‘Marriage Laws in Ireland and on the Continent in the Early Middle Ages’, in Christine Meek and Katharine Simms (eds.), ‘The Fragility of her Sex’? Medieval Irishwomen in their European Context (Dublin, 1996), 16–42，以及 Daffyd Walters, The Comparative Legal Method: Marriage and Divorce and the Spouses’ Property Rights in Early Medieval European Law and in Cyfraith Howel (Aberystwyth, 1982)。</p>\n<p>Carl I. Hammer 的两项研究探讨了涉及奴隶的两性关系与婚姻以及奴隶之间的婚姻问题：‘The Handmaid’s Tale: Morganatic Relationships in Early-Mediaeval Bavaria’, Continuity and Change, 19 (1995), 345–68，以及 ‘A Slave Marriage Ceremony from Early Medieval Germany: A Note and a Document in Translation’, Slavery and Abolition, 16 (1995), 243–9。加泰罗尼亚伯爵的婚姻实践见于 Martin Aurell, Les Noces du comte: Mariage et pouvoir en Catalogne (785–1213) (Paris, 1995)。</p>\n<p>女性、财产与继承已不再是法律史学家的专属领域。关于晚罗马时期的背景及继立诸王国直至7世纪的立法，Antti Arjava, Women and Law in Late Antiquity (Oxford, 1996) 论述详尽，并可辅以 Karl Kroeschell, ‘Söhne und Töchter im germanischen Erbrecht’, in Götz Landwehr (ed.), Studien zu den germanischen Volksrechte: Gedächtnisschrift für W. Ebel (Frankfurt, 1982), 87–116。</p>\n<p>关于婚姻财产转让、女性获取财产的途径及其在家族继承策略中的作用，现已出现重要成果。两部新近的会议论文集以专题方式考察了诸多不同地区：‘Les Transferts patrimoniaux en Europe occidentale, VIIIe–Xe siècle: Actes de la table ronde de Rome, Mai 1999’，刊于 Mélanges de l’École Française de Rome—Moyen Age, 111 (1999), pt. 2；以及 François Bougard, Laurent Feller, and Régine Le Jan (eds.), Dots et douaires dans le haut moyen âge, Collection de l’École Française de Rome, 295 (Rome, 2002)。</p>\n<p>补充研究包括：Cristina La Rocca, ‘Pouvoirs des femmes, pouvoirs de la loi dans l’Italie lombarde’, in Lebecq et al. (eds.), Femmes et pouvoirs des femmes, 37–50 (见本书第327页)；Brigitte Pohl-Resl, ‘“Quod me legibus contanget auere”: Rechtsfähigkeit und Landbesitz langobardischer Frauen’, Mitteilungen des Instituts für Österreichische Geschichtsforschung, 101 (1993), 201–27；Ingrid Heidrich, ‘Besitz und Besitzverfügung verheirateter und verwitweter freier Frauen im Merowingischen Frankenreich’, in Goetz (ed.), Weibliche Lebensgestaltung, 119–38 (见本书第327页)。10至11世纪斯堪的纳维亚的铭文史料由 Birgit Sawyer, Property and Inheritance in Viking Scandinavia: The Runic Evidence (Alingsås, 1988) 加以分析。关于晚盎格鲁-撒克逊时期的英格兰，Pauline Stafford 的研究至关重要：参见 Queen Emma and Queen Edith: Queenship and Women’s Power in Eleventh-Century England (Oxford, 1997)，及其所引她此前关于广泛议题的著述。</p>\n<p>关于家族、纪念与继承策略之间联系的关键研究是 Barbara Rosenwein, To be the Neighbor of Saint Peter: The Social Meaning of Cluny’s Property, 909–1049 (Ithaca, NY, 1989)。女性在盎格鲁-撒克逊英格兰的纪念与继承中的核心作用，见于 Julia Crick 的两篇论文：‘Women, Posthumous Benefaction, and Family Strategy in Pre-Conquest England’, Journal of British Studies, 38 (1999), 399–422，以及 ‘Posthumous Obligation and Family Identity’, in William O. Frazer and Andrew Tyrrell (eds.), Social Identity in Early Medieval Britain (Leicester, 2000), 194–208。Brigitte Pohl-Resl, ‘Vorsorge, Memoria und soziales Ereignis: Frauen als Schenkerinnen in den bayerischen und alemannischen Urkunden des 8. und 9. Jahrhunderts’, Mitteilungen des Instituts für Österreichische Geschichtsforschung, 103 (1995), 265–87，提出了类似的论点。</p>\n<p>近期研究表明，寡妇是理解上述诸多问题的关键：参见 Janet L. Nelson, ‘The Wary Widow’, in Wendy Davies and Paul Fouracre (eds.), Property and Power in the Early Middle Ages (Cambridge, 1995), 82–113；Rolf H. Bremmer, ‘Widows in Anglo-Saxon England’, in Jan Bremmer and Lourens van den Bosch (eds.), Between Poverty and the Pyre: Moments in the History of Widowhood (London, 1995), 58–88，以及 Emmanuelle Santinelli, Des Femmes éplorées? Les Veuves dans la société aristocratique du haut moyen âge (Villeneuve-d’Ascq, 2003)。</p>\n<p>关于继承策略在11世纪发生转变、从而使家族全部财产得以由长子传至长子的论点，由 Georges Duby 在20世纪60至70年代的一系列著名文章中提出；其英文版本见 The Chivalrous Society, trans. Cynthia Postan (London, 1977) 第3章和第6章。对这一过时正统观念的批评有：Theodore Evergates, ‘Nobles and Knights in Twelfth-Century France’, in T. N. Bisson (ed.), Cultures of Power: Lordship, Status and Process in Twelfth-Century Europe (Philadelphia, 1995), 11–35，以及 Pauline Stafford, ‘La Mutation familiale: A Suitable Case for Caution’, in Joyce Hill and Mary Swan (eds.), The Community, the Family and the Saint: Patterns of Power in Early Medieval Europe (Turnhout, 1998), 103–25。</p>\n<p>本书第138–139页关于女性所拥有财产比例的数据源自以下研究：Arjava, Women and Law in Late Antiquity (见本书第328页)；David Herlihy, ‘Land, Family and Women in Continental Europe, 701–1200’, Traditio, 18 (1962), 89–120，以及 Marc A. Meyer, ‘Women’s Estates in Later Anglo-Saxon England: The Politics of Possession’, Haskins Society Journal, 3 (1991), 111–29。</p>\n<p>本书第143–145页所用的埃伯哈德与吉斯拉的遗嘱及相关特许状，由 Ignace de Coussemaker 刊布于 Cartulaire de l’abbaye de Cysoing et ses dependences, 2 vols. (Lille, 1880), i. 1–11；另见 Cristina La Rocca and Luigi Provero, ‘The Dead and their Gifts: The Will of Eberhard, Count of Friuli and his Wife Gisela, Daughter of Louis the Pious (863–864)’, in Frans Theuws and Janet L. Nelson (eds.), Rituals of Power from Late Antiquity to the Early Middle Ages (Leiden, 2000), 225–80 中的详细分析。</p>\n<h2 id=\"ch14-s7\">第五章 劳动与领主权</h2>\n<p>关于早期中世纪社会等级的文献较为零散，且仍受各国民族史学的局限。几乎唯一的例外是 Werner Rösener, The Peasantry of Europe (Oxford, 1994)。关于盎格鲁-撒克逊英格兰，参见 Pauline Stafford, Unification and Conquest: A Political and Social History of England in the Tenth and Eleventh Centuries (London, 1989)；W. G. Runciman, ‘Accelerating Social Mobility: The Case for Anglo-Saxon England’, Past and Present, 104 (1984), 3–30；以及 Rosamond Faith, The English Peasantry and the Growth of Lordship (Leicester, 1997)。David Pelteret, Slavery in Early Medieval England from the Reign of Alfred to the Twelfth Century (Woodbridge, 1995) 十分重要。关于爱尔兰，N. B. Aitchison, ‘Kingship, Society and Sacralisation: Rank, Power and Ideology in Early Medieval Ireland’, Traditio, 49 (1994), 45–75，以及 Paul Holm, ‘The Slave Trade of Dublin, 9th–12th Centuries’, Peritia, 5 (1986), 317–45，均颇具新意且富有启发。</p>\n<p>就欧洲大陆而言，关于奴隶制的标准性著作（现已过时）是 Charles Verlinden, L’Esclavage dans l’Europe médiévale, 2 vols. (Bruges, 1955; Ghent, 1977)。关于从奴隶制向农奴制过渡的讨论有时相当激烈，但总体上仍以 Marc Bloch, ‘How and Why Ancient Slavery Came to an End’, in Slavery and Serfdom in the Middle Ages: Selected Essays by Marc Bloch, trans. William R. Beer (Berkeley, 1975), 1–31 为出发点。一项最初于1985年以法文发表的重要论战性成果是 Pierre Bonnassie, ‘The Survival and Extinction of the Slave System in the Early Medieval West (Fourth to Eleventh Centuries)’, in id., From Slavery to Serfdom in South-Western Europe, trans. Jean Birrell (Cambridge, 1991), 1–59。Carl I. Hammer, A Large-Scale Slave Society of the Early Middle Ages: Slaves and their Families in Early Medieval Bavaria (Woodbridge, 2002) 延续了这一争论。Wendy Davies, ‘On Servile Status in the Early Middle Ages’, in M. L. Bush (ed.), Serfdom and Slavery: Studies in Legal Bondage (London, 1996), 225–46，既是清醒的分析，也是将大陆社会与岛屿社会并置讨论的独特尝试。</p>\n<p>贵族问题则尚无此类比较性研究。大陆的相关议题已由英语的综合性综述讨论很好地覆盖，可引导读者查阅所有相关的外文文献。参见 Timothy Reuter, ‘The Medieval Nobility in Twentieth-Century Historiography’, in Bentley (ed.), Companion to Historiography, 177–202 (见本书第314页)；J. B. Freed, ‘Reflections on the Medieval German Nobility’, American Historical Review, 91 (1986), 553–75；以及 Jane Martindale, ‘The French Aristocracy in the Early Middle Ages: A Reappraisal’, Past and Present, 75 (1977), 5–45 (重刊于同氏， Status, Authority and Regional Power: Aquitaine and France, 9th to 12th Centuries (Aldershot, 1997), ch. IV)。Paul Fouracre, ‘The Origins of the Nobility in Francia’, in Anne J. Duggan (ed.), Nobles and Nobility in Medieval Europe: Concepts, Origins, Transformations (Woodbridge, 2000), 17–24，是简明的最新综述。</p>\n<p>Le Jan, Famille et pouvoir dans le monde franc (见本书第325页)，对大陆贵族的各个方面都很重要。Karl Ferdinand Werner, Naissance de la noblesse (Paris, 1998)，在文化层面颇具启发性，在制度层面则引起争议。另见 Hans-Werner Goetz, ‘“Nobilis”: Der Adel im Selbstverständnis der Karolingerzeit’, Vierteljahrschrift für Sozial- und Wirtschaftsgeschichte, 70 (1983), 153–91；Karl Bosl, ‘Potens und pauper: Begriffsgeschichtliche Studien zur gesellschaftlichen Differenzierung im frühen Mittelalter und zum “Pauperismus” des Hochmittelalters’, in id., Frühformen der Gesellschaft im mittelalterlichen Europa (Munich, 1964), 106–34；Karl Leyser, ‘Early Medieval Canon Law and 骑士制度的起源’，载于卢茨·芬斯克、维尔纳·勒泽纳和托马斯·措茨(编)，《中世纪的制度、文化与社会：纪念约瑟夫·弗莱肯施泰因65岁寿辰纪念文集》(西格马林根，1984年)，第549–566页(重印于同作者，《中世纪欧洲的交往与权力，第一卷：加洛林与奥托时代》，蒂莫西·罗伊特编，伦敦，1994年，第189–213页)。</p>\n<p>关于精英生活方式的重要论文有蒂莫西·罗伊特，《贵族与其他人：中世纪权力关系的社会与文化表达》，载于达根(编)，《贵族与贵族身份》，第85–98页(见上文第330页)，以及罗宾·弗莱明，《晚期盎格鲁-撒克逊英格兰的新财富、新富人与新政治风格》，《盎格鲁-诺曼研究》，第23期(2000年)，第1–22页。</p>\n<p>领主权在中世纪早期大陆方面产生了大量文献。就总体而言，可参见乔治·杜比的分析，敏感但如今略显过时，《中世纪西方的农村经济与乡村生活》(伦敦，1968年)。菲利普·孔塔米纳、马克·邦佩尔、斯特凡·勒贝克和让-吕克·萨拉赞的《中世纪经济》(巴黎，1993年)以及德夫罗伊的《农村经济与社会》(见上文第321页)对其作了很好的更新。大卫·赫利希，《欧洲大陆的教会财产，701–1200年》，《镜报》，第36期(1961年)，第81–105页，试图逐个地区评估教会掌握的土地数量，而戴维斯和富拉克(编)，《中世纪早期的财产与权力》(见上文第329页)则探讨了土地如何维系政治权威。</p>\n<p>关于庄园组织的大多数文献仅涉及法兰克帝国；让-皮埃尔·德夫罗伊的《法兰克王国的大庄园：一个尝试性的动态定义》(载于同作者，《加洛林大庄园研究》，奥尔德肖特，1993年，第一章)是一部出色的导论。阿德里安·费尔胡尔斯特的《加洛林经济》(剑桥，2002年)是一部有用的概览，附有关于大量专业性文献的详细书目。以下几篇讨论尤为启人深思：卢道夫·库兴布赫，《中世纪早期的修道院领地制：一项阶段性总结》，载于弗里德里希·普林茨(编)，《统治与教会：论主教制与修道制组织形式的形成及其运作方式》(斯图加特，1988年)，第297–343页；弗雷德·施温德，《论加洛林时代的修道院作为经济实体与手工业活动场所》，载于芬斯克等(编)，《中世纪的制度、文化与社会》，第101–123页(见前)；皮埃尔·图贝尔，《庄园制体系：八、九、十世纪意大利的内部生产与交换》，载于《意大利史：年鉴，第6卷：自然经济与货币经济》(都灵，1983年)，第5–63页(重印于同作者，《中世纪早期史与中世纪意大利史》，伦敦，1987年，第八章)；威克姆，《中世纪早期的欧洲森林》(见上文第320页)。</p>\n<p>关于领主权的军事方面，迪克·惠特克，《地主与军阀》，载于约翰·里奇和格雷厄姆·希普利(编)，《罗马世界的战争与社会》(伦敦，1993年)，第277–302页，对整个帝国晚期罗马社会的军事化颇有助益。关于中世纪早期兵员征募争论的简明概述，参见蒂莫西·罗伊特，《中世纪早期的军队征募：我们能知道什么？》，载于安妮·诺高·约恩森和比尔莎·L·克劳森(编)，《欧洲视野下的斯堪的纳维亚社会的军事面向，公元1–1300年》(哥本哈根，1997年)，第32–37页。另见爱德华·詹姆斯，《罗马社会的军事化，400–700年》，同上书，第19–24页；伯纳德·S·巴赫拉赫，《墨洛温军事组织，481–751年》(明尼阿波利斯，1972年)；同作者，《早期加洛林战争：帝国的序幕》(费城，2000年)；理查德·阿贝尔斯，《盎格鲁-撒克逊英格兰的领主权与军事义务》(伯克利，1988年)；F·普林茨，《中世纪早期的教士与战争：关于教会在王权建构中之作用的研究》(斯图加特，1971年)；盖伊·霍尔索尔，《蛮族西方的战争与社会，450–900年》(伦敦，2003年)。</p>\n<p>联结地方与各个区域、继而汇聚于加洛林政治体的各种领主权网络，近来在英语学术界受到大量关注。温迪·戴维斯的《小世界：中世纪早期布列塔尼的乡村共同体》(伦敦，1988年)、保罗·富拉克的《查理·马特的时代》(哈洛，2000年)、马修·英尼斯的《中世纪早期的国家与社会：中莱茵河谷，400–1000年》(剑桥，2000年)以及西蒙·麦克莱恩的《九世纪末的王权与政治：胖子查理与加洛林帝国的终结》(剑桥，2003年)呈现了各不相同的架构，均附有大量外语文献。苏珊·雷诺兹的《封地与封臣：对中世纪证据的重新解读》(牛津，1994年)，在中世纪早期恩地问题上引人入胜地提出了争议性观点。</p>\n<p>围绕十世纪末和十一世纪初 currently 激烈争议纷纭。骑士、城堡和地方领主权的兴起，只是关于社会秩序与政治秩序关系这一更大争论——尤其是在法国——中的若干具体主题。其大致风貌可从《辩论中世纪》(利特尔和罗森韦恩编，第105–210页，见上文第314页)中窥见。皮埃尔·博纳西和皮埃尔·图贝尔(编)，《千年前后的欧洲的人与社会》(图卢兹，2004年)中的论文是富有思辨性的评估。</p>\n<p>正文第164–172页所讨论的根特圣彼得修道院在艾恩哈德和阿努尔夫一世时期的地产详情，取自M·吉塞林和A. C. F. 科赫(编)，《公元1100年前比利时文献汇编》，第1卷(布鲁塞尔，1950年)，第49–56号文书，第123–149页。另见阿德里安·费尔胡尔斯特，《论根特圣彼得修道院与圣巴夫修道院的创建及其最早的历史》，《根特历史与古物学会刊》，新辑，第7期(1953年)，第3–53页；乔治·德克勒克，《艾恩哈德与加洛林时代的根特》，载于赫尔曼·舍费尔斯(编)，《艾恩哈德：生平与著作研究》(达姆施塔特，1997年)，第223–246页。</p>\n<p>关于根特城，见阿德里安·费尔胡尔斯特和乔治·德克勒克，《两大修道院与伯爵城堡之间的中世纪早期根特》，载于G·德卡韦莱(编)，《根特：为一座反叛之城辩护》(安特卫普，1989年)，第1–52页(重印于费尔胡尔斯特，《中世纪早期西北欧的乡村与城市面向》，奥尔德肖特，1992年，第十二章)；就更广阔的背景而言，见大卫·尼古拉斯，《中世纪佛兰德尔》(伦敦，1992年)。</p>\n<p>以上所有这些不过是浩瀚书海中冰山之一角，其背后深深 embedded 着一个史学难题。对后者感兴趣的读者可从以下著作中领略相关论争的风貌：奥托·布伦纳，《封建主义：一个概念的历史》，载于弗雷德里克·L·谢耶特(编)，《中世纪欧洲的领主权与共同体：文选》(纽约，1968年)，第32–61页；J. W. 伯罗，《“乡村共同体”与十九世纪英格兰对历史的运用》，载于尼尔·麦肯德里克(编)，《历史视角：纪念J. H. 普拉姆的英国思想与社会研究》(伦敦，1974年)，第255–284页；以及瓦尔特·波尔，《统治》，《日耳曼古代学百科辞典》，第14卷(1999年)，第445–457页。</p>\n<h2 id=\"ch14-s8\">第六章 获取与给予</h2>\n<p>关于中世纪早期贸易与交换的文献仍分成许多分支领域：考古的或历史的、城市的或乡村的、晚古的或中世纪的。作为构建总体图景的一种尝试，理查德·霍奇斯和大卫·怀特豪斯的《穆罕默德、查理曼与欧洲的起源：考古学与皮朗命题》(伦敦，1983年)既启人深思又始终充满争议。关于重要的新研究进路，可结合英奇·吕丝·汉森和克里斯·威克姆(编)，《漫长的八世纪：生产、分配与需求》(莱顿，2000年)，参看理查德·霍奇斯和威廉·鲍登(编)，《六世纪：生产、分配与需求》(莱顿，1998年)。</p>\n<p>关于西罗马帝国终结的社会经济方面，我借鉴了克里斯·威克姆的《另一种转型：从古代世界到封建主义》，《过去与现在》，第113期(1984年)，第3–36页，以及《意大利与中世纪早期》，载于克劳斯·兰兹堡(编)，《欧洲的诞生：公元第一个千年的考古学与社会发展》(罗马，1989年)，第140–151页(两者均重印于威克姆，《土地与权力》，见上文第320页)。另见迈克尔·亨迪，《从公共到私人：西方蛮族铸币作为晚期罗马国家结构解体的镜像》，《旅行者》，第19期(1988年)，第29–78页。对立立场见让·迪尔利亚，《从戴克里先到加洛林王朝的公共财政(284–889)》(西格马林根，1990年)。</p>\n<p>迈克尔·麦考密克的《欧洲经济的起源：交往与商业，公元300–900年》(剑桥，2001年)将关于地中海地区的重要研究与关于奴隶贸易在经济变迁中之核心地位这一争议性论点结合在一起。关于它引发的若干问题，见爱德华·詹姆斯等，《〈欧洲经济的起源〉：与迈克尔·麦考密克的商榷》，《中世纪早期欧洲》，第12期(2003年)，第259–323页。佩里格林·霍登和尼古拉斯·珀塞尔的《腐化之海：地中海史研究》(牛津，2000年)强调地中海的微观经济和地方性“连通性”网络。迪特里希·克劳德的较早研究至今仍然关键：《中欧与北欧史前及早期历史时期的贸易与交通研究，第2卷：中世纪早期西地中海的贸易》(哥廷根，1985年)。</p>\n<p>北方贸易网络是《中欧与北欧史前及早期历史时期的贸易与交通研究》第3卷《中世纪早期的贸易》和第4卷《加洛林与维京时代的贸易》的主题，两卷均由克劳斯·迪维尔、赫伯特·扬库恩、哈拉尔·西姆斯和迪特·廷佩(编)(哥廷根，1985年和1987年)。弗里斯兰商人的重要贡献由斯特凡·勒贝克予以文献记录，《中世纪早期的弗里斯兰商人与航海家》，2卷(里尔，1983年)。奥利维·布吕昂，《加洛林时代的旅行者与商人：八、九世纪卢瓦尔河与默兹河之间的交通网络》(布鲁塞尔，2002年)强调地方、区域与远程贸易之间的互动。</p>\n<p>关于爱尔兰海地带，可见两种对立的解读：乔纳森·M·伍丁，《西航道上的交通与商业，公元400–800年》，《英国考古报告国际系列》，第654号(牛津，1996年)；以及尤安·坎贝尔，《外部接触的考古证据：公元400–800年凯尔特不列颠的进口、贸易与经济》，载于肯尼思·R·达克(编)，《外部接触与晚期罗马及后罗马不列颠的经济》(伍德布里奇，1996年)，第83–96页。玛丽·A·瓦兰特，《重新评估爱尔兰的“修道院城镇”》，《爱尔兰历史研究》，第31期(1998年)，第1–18页，对维京时代之前爱尔兰的交换持审慎评估。萨莉·福斯特、阿伦·麦金尼斯和罗纳德·麦金尼斯(编)，《从中世纪早期到二十世纪的苏格兰权力中心》(格拉斯哥，1998年)，以及斯蒂芬·T·德里斯科尔和玛格丽特·R·尼克(编)，《中世纪早期不列颠与爱尔兰的权力与政治》(爱丁堡，1988年)，对山堡及其他高级地位遗址给予了应有的关注。</p>\n<p>城镇——如何定义城镇、罗马城市的命运、非罗马欧洲的城市起源——是激烈争论的主题。J. H. W. G. 利贝斯许茨的《罗马城市的衰落与灭亡》(牛津，2001年)汇集了大量专门文献；与之相对的简明概述见S. J. B. 巴尼什，《古典城市的转型与皮朗争论》，《罗马考古杂志》，第2期(1989年)，第385–400页。理查德·霍奇斯的《查理曼时代的城镇与贸易》(伦敦，2000年)热情地为一种新的加洛林经济秩序辩护。意大利城市有自己特殊的争论：布赖恩·沃德-珀金斯，《延续论者、灾难论者与后罗马北意大利的城镇》，《罗马不列颠学校学刊》，第65期(1997年)，第157–176页；以及罗斯·巴尔扎雷蒂，《中世纪早期的城市与市场》，载于G·奥森达(编)，《帝国之后：走向欧洲蛮族的民族学》(伍德布里奇，1995年)，第113–142页。</p>\n<p>《剑桥英国城市史》，第1卷：600–1540年(剑桥，2000年)，大卫·帕利泽编，对盎格鲁-撒克逊城镇的大量文献收有审慎的概述；关于城镇与区域经济的关系，见克里斯托弗·斯卡尔，《维京时代之前的英格兰存在城市中心吗？》，载于约翰·海恩斯(编)，《从迁徙时代到八世纪的盎格鲁-撒克逊人：一个民族志视角》(伍德布里奇，1998年)，第269–310页；以及罗宾·弗莱明，《晚期撒克逊英格兰的乡村精英与城市共同体》，《过去与现在》，第141期(1993年)，第3–37页。伦敦的贸易特权由苏珊·凯利讨论，《八世纪英格兰颁发的贸易特权》，《中世纪早期欧洲》，第1期(1992年)，第3–28页。</p>\n<p>阿德里安·费尔胡尔斯特的《西北欧城市的兴起》(剑桥，1999年)评述了关于整个低地国家城镇与商埠的最新研究。斯堪的纳维亚商埠的详情可参见海伦·克拉克和比约恩·安布罗西亚尼，《维京时代的城镇》(莱斯特，1991年)，或约翰·卡尔默，《斯堪的纳维亚与波罗的海地区的城市化，700–1100年：贸易地、中心与早期城市遗址》，载于海伦·克拉克和比约恩·安布罗西亚尼(编)，《第十二届维京大会会议论文集：维京时代围绕波罗的海与北海的发展》，《比尔卡研究》，第3卷(斯德哥尔摩，1994年)，第50–90页。关于非罗马欧洲，见H. B. 克拉克和安格丽特·西姆斯(编)，《非罗马欧洲城市起源的比较史：九至十三世纪的爱尔兰、威尔士、丹麦、德国、波兰与俄罗斯》，《英国考古报告国际系列》，第255号，2卷(牛津，1985年)。</p>\n<p>关于铸币的广泛专门文献，最好通过彼得·斯帕福德，《中世纪欧洲的货币及其用途》(剑桥，1988年)，以及菲利普·格里尔森和马克·布莱克本，《中世纪欧洲铸币，附剑桥菲茨威廉博物馆藏币目录，第1卷：中世纪早期(五至十世纪)》(剑桥，1986年)来了解。</p>\n<p>一切关于给予与获取的讨论都以不同方式回溯到菲利普·格里尔森，《黑暗时代的商业：对证据的批判》，《皇家历史学会会刊》，第5辑，第9卷(1959年)，第123–140页(重印于格里尔森，《黑暗时代钱币学》，伦敦，1979年)。关于礼物交换，另见于尔根·汉尼希，《给予之术：论中世纪早期的赠予经济》，载于理查德·范·迪尔门(编)，《贫困、爱与荣誉》(法兰克福，1988年)，第11–37页；以及阿瑙-扬·拜斯特费尔德，《作为社会纽带与政治权力媒介的中世纪礼物：一种比较研究进路》，载于埃丝特·科恩和迈克·德·容(编)，《中世纪的转型：语境中的文本、权力与礼物》(莱顿，2001年)，第123–156页。</p>\n<p>对宝藏的批判性研究进路见绍罗·杰利基和克里斯蒂娜·拉·罗卡(编)，《宝藏：中世纪早期(五至十一世纪)财富积累的形式》(罗马，2004年)。E. M. 泰勒(编)，《中世纪西方的宝藏》(约克，2000年)中的部分论文亦有相关。马蒂亚斯·哈特评估了广泛的文本与实物证据，《中世纪早期的王室宝藏与权力表征》，载于瓦尔特·波尔和赫尔穆特·赖米茨(编)，《区隔的策略：族群共同体的建构，300–800年》(莱顿，1998年)，第255–280页。关于物质财富的形式与用途的变化，见克里斯蒂娜·拉·罗卡，《区隔的标志：伦巴德王国中从随葬品到“死后”捐赠》，载于L·帕罗利(编)，《伦巴德时代的中北部意大利》(佛罗伦萨，1997年)，第31–54页。蒂莫西·罗伊特，《加洛林帝国的劫掠与贡赋》，《皇家历史学会会刊》，第5辑，第35卷(1985年)，第75–94页，如今已成经典。</p>\n<p>关于女性对赠礼的参与，见迈克尔·J·恩赖特，《持蜜酒杯的夫人》，《中世纪早期研究》，第22期(1988年)，第170–203页；另见邦妮·埃弗罗斯，《以饮食缔造共同体：墨洛温高卢》(纽约，2002年)，以及第七章关于王后的延伸阅读。唐纳德·A·布洛补充了社会语境的其他方面，《朋友、邻里与同饮者：论中世纪早期西方的共同体与冲突》，《H. M. 查德威克纪念讲座》(剑桥，1990年)。</p>\n<p>武器的社会与象征价值由蕾吉娜·勒让讨论，《法兰克人的授械与权力仪式：加洛林时代的延续与变革》，以及海因里希·哈尔克（Heinrich Härke）《盎格鲁-撒克逊社会中的武器流通》，均载于泰乌斯与纳尔逊（主编）《权力仪式》，第281–309、377–399页（见上文第329页）。另见夏洛特·法贝赫（Charlotte Fabech）《南斯堪的纳维亚的战利品祭祀：一次重新评估》，载P. 加伍德、D. 詹宁斯、R. 斯克内茨与J. 汤姆斯（主编）《神圣与世俗：1989年牛津考古学、仪式与宗教会议论文集》（牛津，1991年），第88–99页。</p>\n<p>爱尔兰的牛只依附关系在涅里斯·帕特森（Nerys Patterson）富有启发性且引起争议的《牛群领主与氏族民：早期爱尔兰的社会结构》（第2版，圣母大学，印第安纳州，1994年）中有所分析。A. T. 卢卡斯《古代爱尔兰的牛群》（基尔肯尼，1989年）与弗格斯·凯利《早期爱尔兰农业》（都柏林，1998年）均为详尽而专业的研究。</p>\n<p>关于上文第197–198页所述十世纪末帕维亚王室财库的细节，记载于《王室仪典》（Instituta Regalia），后并入《帕维亚城义务条例》（Honorantiae Civitatis Papiae），由卡尔里夏德·布吕尔与钦齐奥·维奥兰特编辑，Die ‘Honorantie Civitatis Papie’（科隆，1983年）。</p>\n<p>关于上文第206–207页描述的“普里特尔维尔亲王”，参见专题报道《普里特尔维尔：一位埃塞克斯国王的宝藏》，《当代考古学》16/10（2004年2月），第430–436页；至于发掘后整理工作持续推进的最新消息，可查阅伦敦博物馆考古服务处定期维护的网站：http://www.molas.org.uk。</p>\n<p>上文第210–212页关于艾因哈德的概述，取材于其书信，译文见保罗·爱德华·达顿编译《查理曼的廷臣：艾因哈德全集》（彼得伯勒，安大略省，1998年），第131–164页；校勘本见K. 哈姆佩编，MGH Epp. V，第105–142页。另见朱莉娅·M. H. 史密斯《艾因哈德：罪人与圣徒》，《皇家历史学会会刊》第6辑，13（2003年），第55–77页。</p>\n<p>上文第212–213页讨论的圣枪，由佩尔西·恩斯特·施拉姆在其《“圣枪”：圣物与统治象征及其克拉科夫复制品》一文中研究，载其《统治象征与国家象征》，MGH Schriften 13，共3卷（斯图加特，1954–1956年），第2卷，第492–537页。</p>\n<h2 id=\"ch14-s9\">第七章 王权与基督教</h2>\n<p>鉴于基督教和基督教君主制在塑造中世纪及现代民族认同方面影响巨大，这一专题的文献数量浩繁。有价值的综述包括理查德·弗莱彻《欧洲的皈依：从异教到基督教，公元371–1386年》（伦敦，1997年），以及阿诺德·安根特《中世纪早期：400至900年的西方基督教世界》（斯图加特，1990年）。彼得·布朗《西方基督教世界的兴起：公元200–1000年的胜利与多样性》（第2版，牛津，2003年），是从文化史角度作出的权威总结。</p>\n<p>前基督教时期的宗教传统难以把握，且不应与十二世纪及以后文学文献所呈现的追溯性神话相混淆。爱尔兰及其他凯语地区的信仰与习俗尤其难以捉摸，原因在于紧邻基督教化之前的时期缺乏关于祭祀活动的考古证据。关于欧洲中北部的斯拉夫地区，见莱谢克·帕韦·苏佩茨基（Lleszek Pawe Supecki）《斯拉夫诸神的衰落》，载米歇尔·鲁什（主编）《克洛维：历史与记忆·克洛维的洗礼及其在历史上的回响》，兰斯国际历史研讨会论文集，共2卷（巴黎，1997年），第2卷，第289–314页；同氏《斯拉夫异教圣所》（华沙，1994年）。米夏埃尔·米勒-维勒《日耳曼人与斯拉夫人的祭祀崇拜》（斯图加特，1999年），是关于祭祀场所与献祭的优异图录并附简要讨论。</p>\n<p>日耳曼宗教传统自十九世纪初以来便得到深入研究。在近期成果中，见格林《语言与历史》第1、15章（见上文第317页），伊恩·伍德《五至九世纪莱茵河以东的异教信仰与迷信》，载奥森达（主编）《帝国之后》，第253–279页（见上文第334页），以及海因里希·贝克、德特勒夫·埃尔默斯与库尔特·希尔（主编）《日耳曼宗教史：史料与史料问题》（柏林，1992年）。对盎格鲁-撒克逊文本材料的审慎综述见J. D. 奈尔斯《异教的存续与民间信仰》，载戈登与拉皮奇（主编）《剑桥古英语文学指南》，第124–141页（见上文第317页）。</p>\n<p>伊恩·伍德《传教生涯：圣徒与欧洲的福音化，400–1050年》（哈洛，2001年），探讨了中世纪早期文学对传教成就的呈现。另见理查德·E. 沙利文《中世纪早期的基督教传教活动》（奥尔德肖特，1994年），以及克努特·舍费尔迪克（主编）《教会史即传教史》，第2卷：《中世纪前期的教会》（慕尼黑，1978年）。家族内部的皈依以及女性更广泛的贡献，是科杜拉·诺尔特《Conversio与Christianitas：五至八世纪基督教化中的女性》（斯图加特，1995年）的主题。该书部分论点可见于同氏《墨洛温时代的性别与皈依》，载詹姆斯·马尔登（主编）《中世纪宗教皈依的多样性》（盖恩斯维尔，佛罗里达州，1997年），第81–99页。</p>\n<p>关于基督教传播的区域与国别研究路径如下：</p>\n<p><strong>不列颠群岛</strong>：查尔斯·托马斯《公元500年前罗马不列颠的基督教》（伦敦，1981年）；T. M. 查尔斯-爱德华兹《早期基督教爱尔兰》（剑桥，2000年）；理查德·甘姆森（主编）《圣奥古斯丁与英格兰的皈依》（斯特劳德，1999年）；约翰·布莱尔《盎格鲁-撒克逊社会中的教会》（牛津，2005年）；芭芭拉·E. 克劳福德（主编）《北海世界的皈依与基督教》（圣安德鲁斯，1998年）。</p>\n<p><strong>法兰克地区</strong>：关于克洛维受洗的大量文献中，达努塔·尚泽尔《克洛维受洗的年代：维埃纳主教对图尔主教》，《早期中世纪欧洲》7（1998年），第29–57页，至关重要，并附有对先前文献的大量征引。J. M. 华莱士-哈德里尔《法兰克教会》（牛津，1983年），综述了墨洛温与加洛林时期的基督教。另一种研究路径见卢茨·E. 冯·帕德贝格《传教与基督教化：七、八世纪盎格鲁-撒克逊人与法兰克人的形式与后果》（斯图加特，1995年）。关于弗里西亚与萨克森，分别见斯特凡·勒贝克《异教与基督教之间的弗里西亚人》，载《基督教化与非基督教化》，宗教史与思想史研究中心出版物，9（昂热，1986年），第19–45页；以及鲁思·马佐·卡拉斯《萨克森皈依中的异教存续与融合》，《天主教历史评论》72（1986年），第553–572页。</p>\n<p><strong>北欧世界</strong>：比吉特·索耶、彼得·索耶与伊恩·伍德（主编）《斯堪的纳维亚的基督教化》（阿灵索斯，1987年），如今可辅之以比吉特·索耶《维京时代的如尼石刻：中世纪早期斯堪的纳维亚的习俗与纪念》（牛津，2000年），第6章《皈依》。关于冰岛，珍妮·约肯斯《迟到而平和：公元1000年经仲裁实现的冰岛皈依》，《Speculum》74（1999年），第621–655页，颇具启发。</p>\n<p><strong>中欧</strong>：最好的综述见J.-M. 马耶尔、C. 皮特里、L. 皮特里、A. 沃谢与M. 维纳尔（主编）《基督教史》，第4卷：《主教、修士与皇帝，610–1054年》（巴黎，1993年），第四部分，第1–2章。另见普热梅斯瓦夫·乌尔班奇克《中欧与东欧的早期基督教》（华沙，1997年），以及米夏埃尔·米勒-维勒（主编）《北方的罗马与拜占庭：8至14世纪波罗的海地区的传教与信仰转变》，共2卷（美因茨，1997–1998年）。</p>\n<p>正确基督教规范自晚期古代起源以来的演变，可通过威廉·克林什恩《阿尔勒的凯撒利亚：晚期古代高卢基督教共同体的形成》（剑桥，1994年），以及罗伯特·马库斯《从凯撒利亚到博尼法斯：高卢的基督教与异教》，载雅克·方丹与J. N. 希尔加思（主编）《第七世纪：变迁与延续》（伦敦，1992年），第154–172页加以追踪。关于自博尼法斯以降加洛林时期对这些规范的推行，见罗萨蒙德·麦基特里克《法兰克教会与加洛林改革，789–895年》（伦敦，1977年）。迪特尔·哈梅宁《Superstitio：中世纪教会神学迷信文献的传承史与理论史研究》（柏林，1979年），对“迷信”概念的研究至关重要。</p>\n<p>中世纪早期政治思想最好的入门读物是《剑桥中世纪政治思想史，约350–约1450年》，J. H. 伯恩斯主编（剑桥，1988年）。侧重王权的研究，见J. M. 华莱士-哈德里尔《英格兰及欧陆的早期日耳曼王权》（牛津，1971年），马克·雷德莱《从西多尼乌斯·阿波利纳里斯到伊西多尔的拉丁文学中的王权》（罗马，1981年），以及汉斯·胡贝特·安东《加洛林时代的君王镜鉴与统治者伦理》（波恩，1986年）。关于中世纪早期王权是否在某种意义上具有“神圣性”，已有很多讨论。华莱士-哈德里尔《早期日耳曼王权》第1章谨慎地重申了传统观点，但现可参见格林《语言与历史》第7章（见上文第317页），以及伊芙·皮卡尔《日耳曼神圣王权？——关于塔西佗〈日耳曼尼亚志〉与古北欧传承的史料批判研究》（海德堡，1991年）。关于国王祝圣仪式的高度专业化文献，最好通过珍妮特·L. 纳尔逊的论文入手，收录其《中世纪早期欧洲的政治与仪式》（伦敦，1996年），尤其是第12章《即位仪式》。</p>\n<p>关于王后与后权，见波琳·斯塔福德《威塞克斯的王妻，800–1066年》，《过去与现在》91（1981年），第3–27页；同氏《王后、女修道院与改革派教士：十、十一世纪英格兰的性别、宗教身份与改革》，同刊163（1999年），第3–35页；珍妮特·L. 纳尔逊《中世纪早期册立王后的仪式与中世纪后权的塑造》，载安妮·达根（主编）《中世纪欧洲的王后与后权》（伍德布里奇，1997年），第301–315页；热纳维耶芙·比雷-蒂埃里《通奸的王后》，《中世纪文明学刊》35（1992年），第299–312页。</p>\n<p>意识形态与政治之间的联系，由波琳·斯塔福德《克努特之法与盎格鲁-撒克逊王室承诺的历史》，《盎格鲁-撒克逊英格兰》10（1981年），第173–190页，以及珍妮特·L. 纳尔逊《中世纪前期的劣政》，《哈斯金斯学会学报》8（1996年），第1–26页予以强调。关于兰斯主教欣克马尔，见纳尔逊《政治与仪式》第7章《欣克马尔政治思想中的王权、法律与礼拜仪式》，以及让·德维斯《欣克马尔，兰斯大主教，845–882年》，共3卷（日内瓦，1975–1976年）。关于《圣经》对政治思想的影响，见雷蒙德·科蒂耶《旧约对中世纪早期法律与礼拜仪式影响之研究》（波恩，1970年），以及较新的《圣言的力量：圣经对中世纪早期政治的影响》，《早期中世纪欧洲》7（1998年）上的专题论文集。</p>\n<p>凯尔语地区王权的概述，见温迪·戴维斯《中世纪早期的凯尔特王权》，载安妮·达根（主编）《中世纪欧洲的国王与王权》（伦敦，1993年），第101–124页。对爱尔兰观念的简明评述，见菲利普·奥利里《旧战车的有远见驭手：早期爱尔兰文学中的王者中道》，《剑桥中世纪凯尔特研究》11（1986年），第1–16页；更详尽的讨论见巴特·雅克西《早期爱尔兰王权与继位》（都柏林，2000年）。关于爱尔兰与日耳曼诸王的异同，帕特里克·沃默尔德《凯尔特与盎格鲁-撒克逊王权：进一步思考》，载保罗·E. 萨尔马赫（主编）《盎格鲁-撒克逊文化的源泉》（卡拉马祖，密歇根州，1986年），第151–183页，是基础性文献。</p>\n<p>上文第243–244页讨论的欣克马尔论文《论国王的人格与王家职分》，校勘本见PL 125，栏833–856。欣克马尔另一篇论王权的著作有英译本：《论宫廷的治理》，见于大卫·赫利希《封建制史》（纽约，1970年），第209–227页，或保罗·爱德华·达顿《加洛林文明：文选》（彼得伯勒，安大略省，1993年），第485–499页。</p>\n<p>上文第247和249页提及的伪西普里安，由西格蒙德·赫尔曼校勘，De duodecim abusivis saeculi，古代基督教文献文本与研究，第3辑，4（莱比锡，1909年），罗布·梅恩斯对其作了精当评述：《政治、君王镜鉴与圣经：国王与王国的福祉》，《早期中世纪欧洲》7（1998年），第345–357页。</p>\n<p>上文第218页提及的匈牙利国王斯蒂芬的法典，译本见《中世纪匈牙利王国法律汇编》，G. 博尼什、J. M. 巴克与J. R. 斯威尼编译，共2卷（贝克斯菲尔德，加利福尼亚州，1985–1990年）；哈特维克的《圣斯蒂芬传》收录于《中世纪圣徒传文选》，托马斯·黑德主编（纽约，2000年）。</p>\n<h2 id=\"ch14-s10\">第八章 罗马与欧洲诸族</h2>\n<p>近年来，对早期中世纪诸王国形成的研究已因关注族性而发生了转变——族性被视为一种复杂、流动的社会现象，涉及自我与他者观念的文化与政治投射。在尚无全新综合论述的情况下，英语中最好的入门读物是瓦尔特·波尔短小而富有启发性的论文《蛮族继承国家》，载莱斯利·韦伯斯特与米歇尔·布朗（主编）《罗马世界的转型，公元400–900年》（伦敦，1997年），第33–47页。关于“蛮族”的形象，见彼得·希瑟《晚期古代的蛮族：形象、现实与转型》，载理查德·迈尔斯（主编）《晚期古代的身份建构》（伦敦，1999年），第234–258页，以及伊夫-阿尔贝·多热《蛮族：罗马人对野蛮与文明观念的研究》（布鲁塞尔，1981年）。</p>\n<p>关于早期中世纪族性的形成，近期的争论在很大程度上得益于德国与奥地利学者的概念建构，且通常以欧陆的“日耳曼”诸族为参照框架。所有近期研究的起点是赖因哈德·文斯库斯《部落形成与政制：中世纪早期诸Gentes的形成》（科隆，1961年）。文斯库斯的路径如今已发展为民族发生学理论；见帕特里克·格里《族性作为中世纪早期的情境性建构》，《维也纳人类学会通报》113（1983年），第15–26页；更精微的论述见瓦尔特·波尔《传统、民族发生与文学塑造：一项阶段性总结》，载卡尔·布伦纳与布里吉特·梅尔塔（主编）《民族发生与传承：中世纪早期研究的应用方法》，奥地利历史研究所出版物，31（维也纳，1994年），第9–26页。赫尔维希·沃尔夫拉姆《Origo et religio：中世纪早期文献中的族群传统与文学》，《早期中世纪欧洲》3（1994年），第19–38页，是民族发生学理论主要代表人物观点的简明英文表述。沃尔夫拉姆的路径也影响了帕特里克·格里近期的总体性（尽管有争议）概述《民族的神话：欧洲的中世纪起源》（普林斯顿，2001年）。关于加洛林时期的族性，见瓦尔特·波尔《论加洛林早期族群区分的意义》，《萨克森研究》12（1999年），第193–208页。</p>\n<p>欲了解围绕“民族发生学”路径的争论与批评，以下论文集颇有助益：波尔与赖米茨（主编）《区分的策略》（见上文第335页）；安德鲁·吉列特（主编）《论蛮族身份：中世纪早期族性研究的批判性路径》（图尔恩豪特，2002年）；以及汉斯-维尔纳·格茨、耶尔格·雅尔努特与瓦尔特·波尔（主编）《Regna与Gentes：诸王国与诸族》《罗马世界转型中的古代晚期与中世纪早期民族及王国的关系》（莱顿，2003年）。</p>\n<p>一条传统上十分重要的研究路径是语文学——正是现代语言学的分类，才将欧洲的入侵者统一归为“日耳曼人”：参见格林，《语言与历史》（见上文第317页），以及瓦尔特·波尔，《日耳曼人》（慕尼黑，2000年）。关于身份认同的文学呈现与起源传说，参见瓦尔特·戈法特，《蛮族历史的叙事者（公元550—800年）》（普林斯顿，1988年）；关于约达尼斯的专门讨论，参见彼得·希瑟，《哥特人与罗马人，332—489》（牛津，1991年），第3—67页，此书取代了此前的相关论述。</p>\n<p>考古学家的研究提供了互补的方法，这对北欧而言至关重要。洛特·赫德阿格，《铁器时代社会：北欧从部落到国家，公元前500年至公元700年》（牛津，1992年）开风气之先；另可参见霍华德·B. 克拉克、莫伊拉·尼·维纳和拉格纳尔·奥弗林主编，《爱尔兰与斯堪的纳维亚：早期维京时代》（都柏林，1998年），以及塔妮亚·迪金森和戴维·格里菲斯主编，《王国的形成》（牛津，1999年）。</p>\n<p>岛屿世界在考古学文献中有充分的呈现，但在“族群生成”的争论中却大多缺席。从盎格鲁—撒克逊视角出发的例外包括约翰·莫兰德的《族群、权力与英格兰人》，载威廉·O. 弗雷泽和安德鲁·蒂雷尔主编，《中世纪早期不列颠的社会认同》（伦敦，2000年），第23—51页；尼古拉斯·布鲁克斯的《英格兰起源神话》，载其《盎格鲁—撒克逊神话：国家与教会，400—1066》（伦敦，2000年），第79—89页；以及帕特里克·沃尔姆斯利的《Engla Lond：一种效忠的形成》，《历史社会学杂志》第7期（1994年），第1—24页。对苏格兰、威尔士和爱尔兰材料的研究方法仍以文本—历史为主，其概念建构参照的是不列颠群岛不断变化的史学书写，以及英格兰在其中所施加的沉重霸权。关于爱尔兰，参见唐纳哈·奥科兰的《诺曼征服前爱尔兰的民族性与王权》，载T. W. 穆迪主编，《民族性与独立的追求》（贝尔法斯特，1978年），第1—35页；以及约翰·凯里，《爱尔兰民族起源传说：综合性的伪历史》，《中世纪盖尔史料奎金小丛书》第1种（剑桥，1994年）。关于威尔士，P. P. 西姆斯—威廉姆斯的《中世纪早期威尔士起源故事的一些功能》，载托雷·尼贝里、约恩·皮、普雷本·默伦格拉赫特·瑟伦森和奥格·特罗默主编，《历史与英雄传说：专题研讨会论文集》（欧登塞，1985年），第97—131页，其中有很有价值的评论；关于苏格兰，近期的重要成果是多维特·布朗的《苏格兰认同的起源》，载克劳斯·比约恩、亚历山大·格兰特和基思·斯特林格主编，《欧洲过去中的民族、民族主义与爱国主义》（哥本哈根，1994年），第34—55页。</p>\n<p>除第七章所引关于政治思想的扩展阅读书目之外，关于“帝国”概念，参见卡尔·费迪南德·维尔纳的《加洛林帝国与神圣帝国》，载莫里斯·迪韦尔热主编，《帝国的概念》（巴黎，1980年），第151—202页。史蒂文·范宁的三篇文章有益地考察了imperium一词的用法：《哲罗姆的帝国概念》，载洛芙迪·亚历山大主编，《帝国的形象》（谢菲尔德，1991年），第239—250页；《比德、imperium与不列颠诸王》，《镜刊》第66期（1991年），第1—26页；《克洛维·奥古斯都与墨洛温王朝的imperatio之模仿》，载凯瑟琳·米切尔和伊恩·伍德主编，《图尔的格雷戈里的世界》（莱顿，2002年），第321—335页。关于继承诸王国对帝国词汇与统治仪式的借用，参见迈克尔·麦考密克，《永恒的凯旋：古代晚期、拜占庭与中世纪早期西方的凯旋式统治》（剑桥，1986年）。</p>\n<p>关于查理曼及其加冕称帝的大量文献中，最佳综述仍是唐纳德·布洛，《查理曼时代》（伦敦，1965年）。1999年帕德博恩展览的精美图录附有许多涉及广泛主题的重要论文：克里斯托夫·斯蒂格曼和马蒂亚斯·韦姆霍夫主编，《799：加洛林时代的艺术与文化。查理曼与教皇利奥三世在帕德博恩》，3卷（美因茨，1999年）。关于奥托一世及其帝国的文化世界，参见2001年马格德堡展览同样恢宏的图录与论文集：马蒂亚斯·普勒主编，《奥托大帝：马格德堡与欧洲》，2卷（美因茨，2001年）。关于奥托三世，格德·阿尔托夫的《奥托三世》（达姆施塔特，1996年）现已出版英译本（宾夕法尼亚州大学园区，2003年）。奥托三世在中欧的帝国建设，被置于宏阔的文化背景之中，这体现于近年第三个重要的国际展览图录：阿尔弗里德·维佐雷克和汉斯—马丁·欣茨主编，《公元1000年前后的欧洲中部》，3卷（达姆施塔特，2000年）；《公元1000年前后的欧洲中心》，2卷（斯图加特，2000年），为其中论文的英译本，但缺少插图。斯特凡·瓦因富特的《萨利安世纪：转型时代的主要潮流》，芭芭拉·M. 鲍勒斯英译（费城，1999年），将叙述推进到十一世纪的德意志。关于克努特与康拉德二世均有详细的专门研究：M. K. 劳森，《克努特：十一世纪早期英格兰的丹麦人》（哈洛，1993年）；以及赫里维格·沃尔弗拉姆，《康拉德二世，990—1039：三个帝国的皇帝》（慕尼黑，2000年）。</p>\n<p>罗马在中世纪想象中的地位是安德里亚·贾尔迪纳和安德烈·沃谢《罗马：从中世纪至今的观念与神话》（巴黎，2000年）一书的主题；就岛屿世界而言，还应补充 Éamon Ó Carragáin 的重要论文《罗马城与比德的世界》（贾罗，1994年）。理查德·克劳特海默对罗马城本身的经典论述，《罗马：城市肖像，312—1308》（普林斯顿，1980年），如今已被近年的考古与建筑研究大幅修正。若干论文集使这一研究及其他诸多成果得以便于利用：朱莉娅·M. H. 史密斯主编，《中世纪早期的罗马与基督教西方》（莱顿，2000年）；《中世纪早期的罗马》，《斯波莱托学术周论文集》第48种，2卷（斯波莱托，2001年）；以及《东西方之间的罗马》，《斯波莱托学术周论文集》第49种，2卷（斯波莱托，2002年）。这些论文集都包含关于罗马朝圣的有用材料；另参见克莱尔·斯坦克利夫的《选择退隐的诸王》，载帕特里克·沃尔姆斯利、唐纳德·布洛和罗杰·柯林斯主编，《法兰克与盎格鲁—撒克逊社会的理想与现实：献给J. M. 华莱士—哈德里尔的论文集》（牛津，1983年），第154—176页；以及凯瑟琳·休斯的《凯尔特教会与教皇》，载C. H. 劳伦斯主编，《中世纪的英格兰教会与教皇》（伦敦，1965年），第3—28页（重印于休斯《爱尔兰的教会与社会，公元400—1200年》，戴维·邓维尔编，伦敦，1987年，第十五章）。</p>\n<p>没有哪个论题比教皇制度更深受“为后世发展寻找线性前身”之害，即便是最佳的近期概览，伯恩哈德·希梅尔普芬尼希的《教皇制度》，詹姆斯·西弗特英译（纽约，1992年），也未能免于此弊。托马斯·F. X. 诺布尔的《中世纪早期教皇史中的病态与活力》，《天主教历史评论》第81期（1995年），第505—540页，勾勒了一种不同的研究路径；而米凯莱·马卡罗内主编的《千禧年之际罗马主教的首席地位：研究与见证》（梵蒂冈城，1991年）中的论文，则对教皇的意识形态与实践作出了结合具体语境的评价。彼得·莱韦林，《黑暗时代的罗马》（伦敦，1971年），至今仍有参考价值。关于具体问题的重要近期研究包括：费德里科·马拉齐，《拉齐奥的圣罗马教会“产业”（四至十世纪）：行政结构与经营实践》（罗马，1998年）；托马斯·F. X. 诺布尔，《圣彼得的共和国：教皇国家的诞生，680—825》（费城，1984年）；阿诺德·安根特与鲁道夫·席费尔，《Roma—caput et fons：关于处于古代与中世纪之间的教皇罗马的两篇演讲》（奥普拉登，1989年）；格德·特伦巴赫的《十世纪及十一世纪早期教皇史若干问题》，载芬斯克等主编，《中世纪的制度、文化与社会》，第165—177页（见上文第331页）。</p>\n<p>图8.4所绘约翰十九世书信与特许状受件人的详细情况，可参见哈拉尔德·齐默尔曼主编，《教皇文书，896—1046》，2卷，奥地利科学院哲学—历史学类，第174、177种（维也纳，1984—1985年），第2卷，第1043—126页。</p>", "text": "面向英语读者的入门指引\n总论\n英语读者如今已有大量涵盖本书全部或部分时期的著作可供参考。概述性著作包括彼得·加恩西与卡罗琳·汉弗莱斯合著的《晚期古代世界的演变》（剑桥，2001年）；罗莎蒙德·麦基特里克主编的《早期中世纪：欧洲400—1000年》（牛津，2001年）；以及海因里希·菲希特瑙的《生活在十世纪：心态与社会秩序》，帕特里克·J.格里译（芝加哥，1991年）。《剑桥古代史》与《新编剑桥中世纪史》由一流专家撰写，权威且规模宏大，既包含政治叙事，又对广泛的专题提供了细致的分析方法，并附有详细的文献指南。约500—1000年这一时期由以下各卷涵盖：《剑桥古代史》第14卷：《晚期古代：帝国与继承者，公元425—600年》，埃弗里尔·卡梅伦、布赖恩·沃德-珀金斯与迈克尔·惠特比主编（剑桥，2000年）；《新编剑桥中世纪史》第1卷：约500—700年，保罗·福拉克主编（即将出版）；第2卷：约700—900年，罗莎蒙德·麦基特里克主编（剑桥，1995年）；第3卷：约900—1024年，蒂莫西·罗伊特主编（剑桥，1999年）。\n由于“晚期古代”与“早期中世纪”之间并无明确的年代界分，关于早期中世纪在欧洲前现代史整体框架中的地位存在相当多的争论。可参见彼得·希瑟《晚期古代与中世纪早期西方》，载迈克尔·本特利主编《史学史指南》（伦敦，1997年），第69—87页；莱斯特·K.利特尔与芭芭拉·H.罗森温主编《中世纪之争：议题与读本》（马萨诸塞州莫尔登，1998年）；R.I.穆尔《第一次欧洲革命，约970—1215年》（牛津，2000年）。\n史料\n史料校勘本已列于上述《剑桥古代史》和《新编剑桥中世纪史》各卷之中。现有英译本的便捷目录可参见麦基特里克主编的《早期中世纪》。\n电子资源\n如今互联网上有大量有用的资料。早期中世纪博物馆和图书馆藏品的图像可在多个主要机构的网站上找到，包括大英图书馆、大英博物馆、敦巴顿橡树园博物馆以及大都会艺术博物馆的修道院分馆。\n此外还有许多由大学建立的网站，专门提供中世纪资源，尤其是文献译本、专题书目以及部分地图。以下网站维护良好，是可靠的访问入口：\nhttp://www.fordham.edu/halsall/sbook.html\n该公共访问网站设在福特汉姆大学，即“互联网中世纪史料库”，收录了大量晚期古代和中世纪早期文献的在线英译本，并提供指向许多其他有用站点的链接。\nhttp://labyrinth.georgetown.edu\n该网站设在乔治敦大学，是访问在线中世纪资源的历史最悠久、功能最完善的门户网站。\nhttp://www.netserf.org\n一个链接索引，指向数千个其他包含中世纪资源的网站。\nhttp://www.wmich.edu/medieval/research/rawl/index.html\n西密歇根大学的罗林森中心提供范围广泛的有用研究工具（书目、文献等），用于盎格鲁-撒克逊英格兰和古英语研究。\nhttp://www.medievalsources.co.uk\n提供曼彻斯特大学出版社所出版译本的电子版（仅限订户访问），另设公共访问门户，链接至其他一系列中世纪网站。\nhttp://www.itergateway.org\n由多伦多大学建立的中世纪与文艺复兴书目数据库，部分内容向公众开放。\n区域研究\n区域史和国别史在中世纪早期研究中占有重要地位，许多著作专门论述现代政体的中世纪渊源。以下是少量英文著作选目。凡相关之处，这些著作均提供外文文献的书目指引。\n不列颠群岛（包括爱尔兰）\n《罗马之后》，托马斯·查尔斯-爱德华兹主编（牛津，2003年）；《从维京人到诺曼人》，温迪·戴维斯主编（牛津，2003年），二者均属“牛津不列颠群岛简史”丛书；《牛津苏格兰史指南》，迈克尔·林奇编，《牛津苏格兰历史指南》（Oxford Companion to Scottish History）（牛津，2001）；S. J. 康纳利编，《牛津爱尔兰历史指南》（Oxford Companion to Irish History），第2版（牛津，2002）；迈克尔·拉皮奇、约翰·布莱尔、西蒙·凯恩斯与唐纳德·斯克拉格编，《布莱克威尔盎格鲁-撒克逊英格兰百科全书》（Blackwell Encyclopaedia of Anglo-Saxon England）（牛津，1999）；戴维·希尔，《盎格鲁-撒克逊英格兰地图集》（An Atlas of Anglo-Saxon England）（牛津，1981）。\n法兰西\n爱德华·詹姆斯，《法兰西的起源：从克洛维到卡佩王朝，500—1000》（The Origins of France: From Clovis to the Capetians, 500–1000）（伦敦，1982）；伊恩·伍德，《墨洛温王国，450—751》（The Merovingian Kingdoms 450–751）（哈洛，1994）；皮埃尔·里谢，《加洛林家族：锻造欧洲的家族》（The Carolingians: A Family who Forged Europe），M. I. 艾伦译（费城，1993）；琼·邓巴宾，《法兰西的形成，843—1180》（France in the Making, 843–1180），第2版（牛津，2000）。\n西班牙\n罗杰·柯林斯，《中世纪早期西班牙：多样性中的统一，400—1000》（Early Medieval Spain: Unity in Diversity, 400–1000），第2版（贝辛斯托克，1995）；托马斯·F. 格利克，《中世纪早期的伊斯兰与基督教西班牙》（Islamic and Christian Spain in the Early Middle Ages）（普林斯顿，1979）。\n意大利\n克里斯·威克姆，《中世纪早期意大利：中央权力与地方社会，400—1000》（Early Medieval Italy: Central Power and Local Society, 400–1000）（伦敦，1981）；克里斯蒂娜·拉·罗卡编，《476—1000年中世纪早期的意大利》（Italy in the Early Middle Ages, 476–1000）（牛津，2002）；克里斯托弗·克莱因亨茨编，《中世纪意大利百科全书》（Medieval Italy: An Encyclopedia），两卷本（纽约，2004）。\n德意志\n蒂莫西·罗伊特，《800—1056年中世纪早期的德意志》（Germany in the Early Middle Ages, 800–1056）（伦敦，1991）；本杰明·阿诺德，《500—1300年的中世纪德意志：一种政治阐释》（Medieval Germany 500–1300: A Political Interpretation）（贝辛斯托克，1997）；约翰·M. 吉普编，《中世纪德意志百科全书》（Medieval Germany: An Encyclopedia）（纽约，2001）。\n斯堪的纳维亚\n比吉特·索耶与彼得·索耶，《中世纪斯堪的纳维亚：约800—1500年从皈依到宗教改革》（Medieval Scandinavia: From Conversion to Reformation, circa 800–1500）（明尼阿波利斯，1993）；克努特·赫勒编，《剑桥斯堪的纳维亚史》第一卷：《史前至1520年》（The Cambridge History of Scandinavia, i: Prehistory to 1520）（剑桥，2003）；詹姆斯·格雷厄姆-坎贝尔编，《维京世界文化地图集》（Cultural Atlas of the Viking World）（纽约，1994）；威廉·菲茨休与伊丽莎白·沃德编，《维京人：北大西洋传奇》（Vikings: The North Atlantic Saga）（华盛顿，2000）。\n中欧\n小约翰·V. A. 法恩，《中世纪早期的巴尔干：六世纪至十二世纪后期的批判性考察》（The Early Medieval Balkans: A Critical Survey from the Sixth to the Late Twelfth Century）（安阿伯，1983）；P. M. 巴福德，《早期斯拉夫人》（The Early Slavs）（伦敦，2001）；帕尔·恩格尔，《圣伊什特万之国：895—1526年中世纪匈牙利史》（The Realm of St Stephen: A History of Medieval Hungary, 895–1526），陶马什·帕洛什法尔维译（伦敦，2001）；保罗·R. 马戈西，《从五世纪初至今的东中欧历史地图集》（Historical Atlas of East Central Europe from the Early Fifth Century to the Present），第2版（西雅图，2002）。\n第一章 口述与书写\n马尔科·莫斯特特编，《中世纪传播的新取径》（New Approaches to Medieval Communication）（图尔恩豪特，1999），提供了有益的方法论思考，以及与本章主题相关的极为详尽的参考文献目录。\n中世纪早期的语言史与非拉丁语文学史自然吸引了大量关注；一个易于入门的概览是菲利普·沃尔夫，《西方语言，公元100—1500年》（Western Languages, AD 100–1500），弗朗西丝·帕特里奇译（伦敦，1971）。薇薇安·劳，《从柏拉图到1600年的欧洲语言学史》（The History of Linguistics in Europe from Plato to 1600）（剑桥，2003），以平易而富有启发性的方式考察了人们如何理解与研究语言。\n关于古英语的推荐入门读物有阿尔伯特·C. 鲍与托马斯·凯布尔，《英语语言史》（A History of the English Language），第4版（伦敦，1993），以及马尔科姆·戈登与迈克尔·拉皮奇编，《剑桥古英语文学指南》（The Cambridge Companion to Old English Literature）（剑桥，1991）。凯瑟琳·希尔斯，《英格兰人的起源》（Origins of the English）（伦敦，2003），概述了围绕拉丁语和不列颠语让位于古英语的历史情境所引发的争议。\nJ. 奈特·博斯托克，《古高地德语文学手册》（A Handbook of Old High German Literature），第2版（牛津，1976），仍是英语世界对这一文献群的唯一论述，沃尔夫冈·豪布里希斯，《德意志文学史》第一卷第一部分：《开端：中世纪早期本土语言书写的尝试（约700—1050/60年）》（Geschichte der deutschen Literatur, vol. 1 pt. 1, Die Anfänge: Versuche volkssprachiger Schriftlichkeit im frühen Mittelalter (ca. 700–1050/60)）（法兰克福，1988），可对其作有益的补充。D. H. 格林，《早期日耳曼世界中的语言与历史》（Language and History in the Early Germanic World）（剑桥，1998），提供了比较研究的进路。关于斯拉夫语，参见亚历山大·M. 申克，《斯拉夫人的黎明》（The Dawn of Slavic）（纽黑文，1995）。\n托马斯·查尔斯-爱德华兹在《海岛凯尔特人中的语言与社会，400—1000年》（“Language and Society among the Insular Celts, 400–1000”，载米兰达·J. 格林编，《凯尔特世界》（The Celtic World）（伦敦，1995），第703—736页）中综述了凯尔特地区的情况。关于欧甘文字，参见达米安·麦克马纳斯，《欧甘文字指南》（A Guide to Ogam）（梅努斯，1991）；关于如尼文字，参见拉尔夫·W. V. 埃利奥特，《如尼文字导论》（Runes: An Introduction），第2版（曼彻斯特，1989），以及戴维·N. 帕森斯，《重铸如尼文：盎格鲁-撒克逊弗托尔克字母的改革》（Recasting the Runes: The Reform of the Anglo-Saxon futhorc）（乌普萨拉，1999）。\n关于拉丁语，米歇尔·班亚尔，《口耳相传：四至九世纪拉丁西方的书面交流与口头交流》（Viva voce: Communication écrite et communication orale du IVe au IXe siècle en Occident latin）（巴黎，1992）与罗杰·赖特，《晚期拉丁语的社会语言学—语文学研究》（A Sociophilological Study of Late Latin）（图尔恩豪特，2002）是两种对历史颇为敏感的诠释，二者都为拉丁语向罗曼语转变背后的语文学问题提供了技术性指导。\n近来学界高度重视围绕“口头性”与“文字性”对立、并以“记忆”作为两者桥梁的一系列问题。争论的标志性两极由迈克尔·里希特，《中世纪西方的形成：蛮族口头文化研究》（The Formation of the Medieval West: Studies in the Oral Culture of the Barbarians）（都柏林，1994）、罗莎蒙德·麦基特里克，《加洛林王朝与书面文字》（The Carolingians and the Written Word）（剑桥，1989）以及帕特里克·J. 吉尔里，《记忆的幽灵：第一个千年之末的记忆与遗忘》（Phantoms of Remembrance: Memory and Oblivion at the End of the First Millennium）（普林斯顿，1994）划定。1990年代的数部论文集具有核心的方法论意义，首推罗莎蒙德·麦基特里克编，《中世纪早期欧洲识字之用》（The Uses of Literacy in Early Medieval Europe）（剑桥，1990）。艾伦·K. 鲍曼与格雷格·伍尔夫编，《古代世界的识字与权力》（Literacy and Power in the Ancient World）（剑桥，1994），涵盖了古代晚期及继承王国；而休·普赖斯编，《中世纪凯尔特社会的识字》（Literacy in Medieval Celtic Societies）（剑桥，1998），对那些在相关讨论中过于轻易被忽视的地区有不少论述。\n其他有用的论文集包括：A. N. 多恩与卡罗尔·布劳恩·帕斯捷尔纳克编，《互文之声：中世纪的口头性与文本性》（Vox Intertexta: Orality and Textuality in the Middle Ages）（麦迪逊，1992）；乌尔苏拉·舍费尔编，《中世纪早期的书写文化》（Schriftlichkeit im frühen Mittelalter）（图宾根，1993）；鲁道夫·席费尔编，《加洛林王朝的书写文化与帝国行政》（Schriftkultur und Reichsverwaltung unter den Karolingern）（奥普拉登，1996）；瓦尔特·波尔与保罗·赫罗尔德编，《书写的功用：中世纪的社会记忆、统治与财产》（Vom Nutzen des Schreibens: Soziales Gedächtnis, Herrschaft und Besitz im Mittelalter）（维也纳，2002）。专题研究包括：塞斯·勒雷尔，《盎格鲁-撒克逊文学中的识字与权力》（Literacy and Power in Anglo-Saxon Literature）（林肯，内布拉斯加，1991）；尼古拉斯·埃弗雷特，《伦巴第意大利的识字，约568—774年》（Literacy in Lombard Italy, c.568–774）（剑桥，2003）；米歇尔·齐默尔曼，《九至十二世纪加泰罗尼亚的书写与阅读》（Écrire et lire en Catalogne du IXe au XIIe siècle）（马德里，2003）。关于女性的识字问题，参见罗莎蒙德·麦基特里克《中世纪早期的女性与识字》（“Women and literacy in the early Middle Ages”），载同氏《六至九世纪法兰克王国的书籍、抄工与学问》（Books, Scribes and Learning in the Frankish Kingdoms, 6th–9th Centuries）（奥尔德肖特，1994），第十三章。\n伯恩哈德·比朔夫《中世纪早期拉丁注释史上的转折点》（“Wendepunkte in der Geschichte der lateinischen Exegese im Frühmittelalter”），载同氏《中世纪研究：文字学与文学史论文选》（Mittelalterliche Studien: Ausgewählte Aufsätze zur Schriftkunde und Literaturgeschichte）第一卷（斯图加特，1966），第205—273页，为海岛世界中基督教拉丁识字所带来的挑战奠定了新的研究基础；而G. 哈丁·布朗《盎格鲁-撒克逊英格兰识字的动力》（“The Dynamics of Literacy in Anglo-Saxon England”，《约翰·莱兰兹图书馆馆刊》77（1995），第109—142页）与罗伊·柳扎《谁在阅读古英语福音书？》（“Who Read the Gospels in Old English?”，载彼得·S. 贝克与尼古拉斯·豪编，《言与行：纪念弗雷德·C. 罗宾逊的中世纪英语语言与文学研究》（Words and Works: Studies in Medieval English Language and Literature in Honour of Fred C. Robinson）（多伦多，1998），第3—24页）则以颇为不同的方式探讨了这一问题。\n关于阅读，乔纳森·博亚林编，《阅读的民族志》（The Ethnography of Reading）（伯克利，1993）与古列尔莫·卡瓦洛与罗歇·沙尔捷编，《西方阅读史》（A History of Reading in the West），莉迪娅·科克伦译（剑桥，1999）中有颇具洞见的贡献。D. H. 格林，《聆听与阅读：800—1300年德意志文学的最初接受》（Listening and Reading: The Primary Reception of German Literature, 800–1300）（剑桥，1994）、阿曼多·彼得鲁奇，《中世纪意大利的作者与读者：书写文化史研究》（Writers and Readers in Medieval Italy: Studies in the History of Written Culture），查尔斯·拉丁译（纽黑文，1995）以及西蒙·富兰克林，《约950—1300年早期罗斯的书写、社会与文化》（Writing, Society and Culture in Early Rus, c.950–1300）（剑桥，2002），其意义均超出了书名所示的范围。\n关于修道院阅读，让·勒克莱尔，《对学问的热爱与对上帝的渴求》（The Love of Learning and the Desire for God），凯瑟琳·米斯拉希译（纽约，1961），仍保持其经典地位。皮埃尔·里谢，《蛮族西方的教育与文化，六至八世纪》（Education and Culture in the Barbarian West, 6th–8th Centuries），约翰·J. 孔特雷尼译（哥伦比亚，南卡罗来纳，1975），以及同氏《中世纪早期的学校与教育：五世纪末至十一世纪中叶》（Écoles et enseignement dans le haut moyen âge, fin du Ve siècle–milieu du XIe siècle），第3版（巴黎，1999），综述了学校与课程。伯恩哈德·比朔夫，《查理曼时代的抄本与图书馆》（Manuscripts and Libraries in the Age of Charlemagne），迈克尔·戈尔曼译（剑桥，1994），在古典文本的传承及其他诸多方面都很重要。\n虽然法律与行政传统上被视为宪法史和制度史的组成部分，但较新的研究取径将它们置于本章所论主题的核心。尤其参见帕特里克·沃默德《成文法与王者之言：从尤里克到克努特的立法与日耳曼王权》（“Lex scriptum and verbum regis: Legislation and Germanic Kingship from Euric to Cnut”），载P. H. 索耶与伊恩·N. 伍德编，《中世纪早期王权》（Early Medieval Kingship）（利兹，1977），第105—138页；罗宾·查普曼·斯泰西《极古老西方的法律与秩序：中世纪早期的英格兰与爱尔兰》（“Law and Order in the Very Old West: England and Ireland in the Early Middle Ages”），载B. T. 哈德森与V. 齐格勒编，《交错的路径：欧洲中世纪凯尔特面向的方法论取径》（Crossed Paths: Methodological Approaches to the Celtic Aspect of the European Middle Ages）（拉纳姆，马里兰，1991），第39—60页；以及T. M. 查尔斯-爱德华兹《五至七世纪西方诸王国的法律》（“Law in the Western Kingdoms between the Fifth and the Seventh Century”），载《剑桥古代史》（The Cambridge Ancient History）第十四卷，第260—287页。罗马法及相关文书形式对继承王国社会习俗的调适是一个复杂的课题，但有两篇与本课题及第三、四章内容密切相关的易读文章：帕特里克·沃默德《蛮族法典：后罗马西方的法律与族群性》（“The Leges barbarorum: Law and Ethnicity in the Post-Roman West”），载H.-W. 格茨、J. 雅尔努特与W. 波尔编，《王国与族群：罗马世界转型中古代晚期与中世纪早期的民族与王国之关系》（Regna and Gentes: The Relationship between Late Antique and Early Medieval Peoples and Kingdoms in the Transformation of the Roman World）（莱顿，2003），第21—53页；以及安蒂·阿尔雅瓦《蛮族定居后罗马家庭法的存续》（“The Survival of Roman Family Law after the Barbarian Settlements”），载拉尔夫·W. 马西森编，《古代晚期的法律、社会与权威》（Law, Society, and Authority in Late Antiquity）（牛津，2001），第33—51页。帕特里克·沃默德，《英格兰法的形成：从阿尔弗雷德王到十二世纪》（The Making of English Law: King Alfred to the Twelfth Century）（牛津，1999），对大陆法系以及盎格鲁-撒克逊法律都有很多论述。\n在社会政治语境中研究宪章，是由温迪·戴维斯与保罗·富拉克编的开创性论文集《中世纪早期欧洲的争端解决》（The Settlement of Disputes in Early Medieval Europe）（剑桥，1986）开启的；卡尔·海德克尔编，《中世纪社会中的宪章与书面文字的使用》（Charters and the Use of the Written Word in Medieval Society）（图尔恩豪特，2000），收录了数篇关于中世纪早期的宝贵文章。关于文书意识的有益研究有：凯瑟琳·A. 洛《盎格鲁-撒克逊英格兰的世俗识字与划押契据的发展》（“Lay Literacy in Anglo-Saxon England and the Development of the Chirograph”），载菲利普·普尔西亚诺与伊莱恩·M. 特雷汉编，《盎格鲁-撒克逊抄本及其遗产》（Anglo-Saxon Manuscripts and their Heritage）（奥尔德肖特，1998），第161—204页；克里斯蒂娜·拉·罗卡《法律与实践：八世纪意大利的权力与社会关系》（“La legge e la pratica: Potere e rapporti sociali nell’Italia dell’VIII secolo”），载卡洛·贝尔泰利与詹·彼得罗·布罗焦洛编，《伦巴第人的未来：意大利与查理曼欧洲的构建》（Il futuro dei Longobardi: L’Italia e la costruzione dell’Europa di Carlo Magno: Saggi）（米兰，2000），第45—69页。另参见沃伦·布朗《当文书被毁或遗失时：中世纪早期的世俗民众与档案》（“When Documents are Destroyed or Lost: Lay People and Archives in the Early Middle Ages”），《早期中世纪欧洲》11（2002），第337—366页。帕特里克·J. 吉尔里《700—1100年欧洲的土地、语言与记忆》（“Land, Language and Memory in Europe, 700–1100”，《皇家历史学会会刊》第6辑第9卷（1999），第168—184页），以及罗宾·查普曼·斯泰西《文本与社会》（“Texts and Society”），载查尔斯-爱德华兹编，《罗马之后》（After Rome），第221—257页（见本书上文第315页），都恰当地强调了文本的口头的、展演性的性质。\n本书第42—43页所讨论的石板文书，由伊莎贝尔·贝拉斯克斯·索里亚诺刊布：《写在石板上的西哥特时代文书（六至八世纪）》（Documentos de época visigoda escritos en pizarra (siglos VI–VIII)），《中世纪古文书学文献》（Monumenta Palaeographica Medii Aevi）西班牙系列，两卷本（图尔恩豪特，2000）。第43—44页所讨论的红隆宪章，由奥雷利安·德·库尔松编：《布列塔尼红隆修道院宪章集》（Cartulaire de l’Abbaye de Redon en Bretagne）（巴黎，1863）。关于赫拉班与富尔达，参见雷蒙德·科特耶与哈拉尔德·齐默尔曼编，《赫拉班·毛鲁斯：教师、修道院院长与主教》（Hrabanus Maurus: Lehrer, Abt und Bischof）（美因茨，1982），以及冈戈尔夫·施林普夫编，《加洛林与奥托世界中的富尔达修道院》（Kloster Fulda in der Welt der Karolinger und Ottonen）（法兰克福，1996）。\n第二章 生与死\nE. L. 琼斯，《欧洲经济奇迹：欧洲与亚洲历史中的环境、经济与地缘政治》（The European Economic Miracle: Environments, Economies and Geopolitics in the History of Europe and Asia）（剑桥，1981），是一部审慎的导论，将此处讨论的诸多问题置于广阔的视野之中。克劳斯·兰兹堡，《欧洲与地中海的公元第一个千年：一篇考古学论文》（The First Millennium AD in Europe and the Mediterranean: An Archaeological Essay）（剑桥，1991），充斥着图表、地图与平面图，虽富有启发性但不尽准确。\n关于人类境况的鲜明速写，参见卡尔·莱瑟《十世纪的境况》（“The Tenth-Century Condition”），载同氏《中世纪德意志及其邻邦，900—1250年》（Medieval Germany and its Neighbours, 900–1250）（伦敦，1982），第1—9页。菲利普·德普勒，《六世纪中叶至九世纪末的西方社会》（Les Sociétés occidentales du milieu du VIe à la fin du IXe siècle）（雷恩，2002），是一部广泛的综述，吸收了有关第二至六章主题的最新学术成果。\n中世纪早期的环境史尚处于起步阶段，不过聚落研究与景观史往往涉及许多相同的问题。关于科学方法的易读导论，参见佩特拉·达克，《英国的公元第一个千年环境》（The Environment of Britain in the First Millennium AD）（伦敦，2000）。马修·斯托特《早期基督教爱尔兰：聚落与环境》（“Early Christian Ireland: Settlement and Environment”），载特里·巴里编，《爱尔兰聚落史》（A History of Settlement in Ireland）（伦敦，2000），第80—109页，评述了爱尔兰的相关问题与证据。一种对比鲜明的取径见保罗·斯夸特里蒂，《中世纪早期意大利的水与社会，公元400—1000年》（Water and Society in Early Medieval Italy, AD 400–1000）（剑桥，1998）。另参见斯夸特里蒂编，《中世纪欧洲的用水：技术与资源利用》（Working with Water in Medieval Europe: Technology and Resource-Use）（莱顿，2000）。关于欧洲的气候，可参阅休伯特·H. 兰姆，《气候、历史与现代世界》（Climate, History and the Modern World）（伦敦，1982），尤其是第九章；另见同氏《公元前1000年至公元1000年的气候》（“Climate from 1000 bc to 1000 ad”），载马丁·琼斯与杰弗里·丁布尔比编，《人类的环境：从铁器时代到盎格鲁-撒克逊时期》（The Environment of Man: The Iron Age to the Anglo-Saxon Period），《英国考古报告》英国系列87（牛津，1981），第53—65页。\n聚落史有多种研究进路。海伦娜·哈默罗，《中世纪早期聚落：西北欧400—900年乡村社群的考古学》（Early Medieval Settlements: The Archaeology of Rural Communities in North-West Europe, 400–900）（牛津，2002），综述了大陆与盎格鲁-撒克逊的聚落遗址。关于单一遗址的插图丰富的研究，参见《查理曼时代的一个村庄：从七世纪到公元一千年的圣但尼修道院的僧侣与农民》（Un Village au temps de Charlemagne: Moines et paysans de l’abbaye de Saint-Denis du VIIe siècle à l’an Mil）（巴黎，1988）。克里斯·威克姆《中世纪早期的欧洲森林：景观与土地开垦》（“European Forests in the Early Middle Ages: Landscape and Land Clearance”，《中世纪早期的植物环境》（L’ambiente vegetale nell’alto medioevo），两卷本，《中世纪研究周丛刊》37（1990），第二卷，第479—545页）甚为重要（重印于同氏《土地与权力：意大利研究》（Land and Power: Studies in Italian……\n以及《欧洲社会史，400–1200》（伦敦，1994），第155–200页）；关于安达卢斯，参见托马斯·F·格里克《中世纪早期的伊斯兰教与基督教西班牙》（普林斯顿，1979），尤其是第2章，以及安德鲁·M·沃森《早期伊斯兰世界的农业革新：作物与农耕技术的传播，700–1100》（剑桥，1983）。虽然已成旧作，让·夏普洛与罗贝尔·福西耶合著、H. 克利尔英译的《中世纪的村庄与房屋》（伦敦，1985）仍具参考价值。\n关于中世纪早期人口问题，尚无令人满意的综述性著作。读者应查阅一系列关键论文。关于瘟疫，J.-N. 比拉邦与J. 勒高夫合著的《中世纪早期的瘟疫》，载罗伯·福斯特与奥雷斯特·拉努姆主编《历史中的人类生物学：〈年鉴〉选集》（巴尔的摩，1975），第48–80页，具有核心重要性。围绕瘟疫的地理范围及其人口学意义的争论，可从迪克·哈里森《中世纪黎明时期的瘟疫、定居点与结构变迁》，载《Scandia》第59卷（1993），第15–48页，以及J. R. 马迪科特《七世纪英格兰的瘟疫》，载《过去与现在》第156卷（1997），第7–54页中清楚看出。彼得·萨里斯《查士丁尼瘟疫：起源与影响》，载《延续与变迁》第17卷（2002），第169–182页，则主张其影响是灾难性的。\n罗马之后西方的铭文证据由马克·A·汉德利整理呈现，见其《死亡、社会与文化：公元300–750年高卢与西班牙的铭文与墓志铭》，英国考古报告国际系列第1135种（牛津，2003），其中对人口学意义有所评论；关于750年之后的人口状况，最好通过皮埃尔·图贝尔敏锐的综述《加洛林时代》来了解，该文载安德烈·布尔吉埃、克里斯蒂亚娜·克拉皮施-祖贝尔、马丁·塞加朗与弗朗索瓦兹·佐纳邦主编《家庭史》第1卷《遥远的世界，古代的世界》，莎拉·汉伯里·特尼森、罗斯玛丽·莫里斯与安德鲁·威尔逊英译（剑桥，1996），第379–406页；另见让-皮埃尔·德夫罗伊《法兰克欧洲（6–9世纪）的农村经济与社会》（巴黎，2003），两书均提供了进一步的文献指引。G. M. 施瓦茨《根据圣贝尔坦修道院财产清册看村庄人口》，载《中世纪史杂志》第11卷（1985），第31–41页，是关于如何处理九世纪庄园调查证据这一辩论的少数英文贡献之一。由于在1086年《末日审判书》之前缺乏任何可供研究的文献基础，不列颠群岛任何地区的中世纪早期人口研究均付阙如。\n关于杀婴的辩论由埃米莉·科尔曼《中世纪早期的杀婴》引发，该文载苏珊·莫舍·斯图尔德主编《中世纪社会中的妇女》（费城，1976），第47–70页，并得到卡罗尔·克洛弗《稀缺的政治：关于早期斯堪的纳维亚性别比的札记》，载《斯堪的纳维亚研究》第60卷（1988），第147–188页的支持。详细的反驳论证大多以法语发表：莫妮克·泽尔纳《根据圣日耳曼昂莱财产清册看九世纪维勒讷沃圣乔治与马恩河畔诺让的人口》，载《尼斯文学院与人文学科学院年鉴》第37卷（1979），第17–24页；以及让-皮埃尔·德夫罗伊《中世纪早期财产清册的分析方法》，载《布鲁塞尔历史学报》第4卷（1981），第71–88页。关于杀婴问题有清醒的评论，并对避孕与堕胎实践有极为重要的讨论，见约翰·M·里德尔《从古代世界到文艺复兴的避孕与堕胎》（马萨诸塞州剑桥，1992）。教会教导由J. T. 努南阐述，见其《避孕：天主教神学家与教会法学家对其论述的历史》（马萨诸塞州剑桥，1986）。九世纪蓄意或意外的杀婴事件是格哈德·施米茨《罪与罚：科尔比修道院拉特拉姆努斯关于杀婴的一段不为人知的论述》一文的主题，载《德国中世纪研究档案》第38卷（1982），第363–387页。\n关于中世纪早期农业与生产力的讨论往往过于纠缠于技术变革的年代断限之争；欲获清晰简明的评价，可参见阿德里安·费尔胡尔斯特《再论中世纪的“农业革命”》，载B. S. 巴赫拉赫与D. 尼古拉斯主编《中世纪的法律、习俗与社会结构：纪念布莱斯·莱昂论文集》（卡拉马祖，1990），第17–28页。此文的补充资料为弗拉朗修道院文化中心出版的《中世纪早期的农业增长：年代、方式与地理》（欧什，1990）。中世纪早期农业对营养与健康的影响，就意大利而言由M. 蒙塔纳里探讨，见其《中世纪早期的农民饮食》（那不勒斯，1979）；就西北欧而言，见凯西·L·皮尔逊《营养与中世纪早期饮食》，载《镜报》第72卷（1997），第1–32页。\n关于饥荒的奠基性著作仍是F. 库尔希曼《中世纪的饥荒：8至13世纪德国经济史论集》（莱比锡，1900）；不过，阿德里安·费尔胡尔斯特对其统治时期查理曼对饥荒的应对有详细讨论，见《加洛林农业政策：〈庄园敕令〉与792/793年及805/806年的饥荒》，载《农业史与农村社会学杂志》第13卷（1965），第175–189页。食物禁忌由皮埃尔·博纳西考察，见《中世纪早期西方对污秽食物的消费与求生食人行为》，载《年鉴：经济、社会、文明》第44卷（1989），第1035–1056页。\n关于疾病与病害的考古证据，参见K. 曼彻斯特《唤醒死者：古病理学的潜力》，载E. 索斯沃思主编《盎格鲁-撒克逊墓地：重新评估》（斯特劳德，1990），第87–96页；更详细的论述见A. 查尔内茨基、C. 乌利希与R. 沃尔夫《人类学与医学视野下的中世纪早期人类》第2版（斯图加特，1983）。关于疾病的社会与文化史，佩雷格林·霍登《疾病、龙与圣徒：黑暗时代的疫病应对》，载特伦斯·兰杰与保罗·斯莱克主编《疫病与观念：关于瘟疫之历史认知的论文集》（剑桥，1992），第45–76页，颇具启发性。另见佩雷格林·霍登与埃米莉·萨维奇-史密斯主编《医学社会史》“公元1000年”专号（第13卷第2期，2000），第197–321页，其中收录了涉及中世纪早期医学史诸多方面的论文。M. L. 卡梅伦《盎格鲁-撒克逊医学》（剑桥，1993）亦有价值。\n在中世纪早期圣徒崇拜的大量文献中，彼得·布朗《圣徒崇拜：其在拉丁基督教中的兴起与功能》（芝加哥，1981）已成经典；两部论文集显示了较新的研究取向：詹姆斯·霍华德-约翰斯顿与保罗·安东尼·海沃德主编《古代晚期与中世纪早期的圣徒崇拜》（牛津，1999），以及艾伦·撒克与理查德·夏普主编《中世纪早期西方的地方圣徒与地方教会》（牛津，2002）。\n中世纪早期的宇宙观也引起了关注。莫妮卡·布勒克尔《天气巫术：论中世纪早期的一种信仰复合体》，载《Francia》第9卷（1981），第117–131页，为必读之作。瓦莱丽·弗林特《魔法在中世纪早期欧洲的兴起》（普林斯顿，1991），是对处理疾病、坏天气及其他诸多问题的广泛策略的一次有力而具争议性的探索。关于末日论思想，参见理查德·兰德斯、安德鲁·高与戴维·C·范·米特主编的论文集《启示录式的公元1000年：宗教期待与社会变迁，950–1050》（纽约，2003）。\n第66–68页的人口学细节来自唐·布罗思韦尔《古人口学与不列颠早期居民》，载《世界考古学》第4卷（1972），第75–87页；薇拉·I·埃维森《多佛：巴克兰盎格鲁-撒克逊墓地》（伦敦，1987）；以及于尔格·施奈德、达尼埃尔·古彻、汉苏埃利·埃特尔与于尔格·汉瑟《苏黎世的明斯特霍夫》两卷本（奥尔滕，1982）。\n第三章 亲友与亲族\n第三、四章主题的最佳入门读物是布尔吉埃等主编的《家庭史》（见前文第321页），尤其是第8–9章“蛮族欧洲”与“加洛林时代”。杰弗里·S·内森《古代晚期的家庭：基督教的兴起与传统的延续》（伦敦，2000），引导读者了解晚期罗马的遗产。戴维·赫利希《中世纪家庭》（马萨诸塞州剑桥，1985）与杰克·古迪《欧洲家庭与婚姻的发展》（剑桥，1983）均甚重要而具争议性。较为关注家庭内部互动的新取向，见卡特琳·海内《天堂的遗产：加洛林训诫文学中的婚姻、母性与妇女》（法兰克福，1997）、萨莉·克劳福德《盎格鲁-撒克逊英格兰的童年》（斯特劳德，1999），以及保利娜·斯塔福德《中世纪早期的父母与子女》，载《早期中世纪欧洲》第10卷（2001），第257–271页。\n古代世界的命名习俗由B. 索尔韦概述，见《名字里有什么？约公元前700年至公元700年罗马命名实践的考察》，载《罗马研究杂志》第84卷（1994），第124–145页；晚期罗马的命名惯例由马丁·海因策尔曼详细探讨，见《古代晚期拉丁人名的变迁》，载G. 迪比与J. 勒高夫主编《中世纪西方的家庭与亲族》，法兰西罗马学院丛刊第30种（罗马，1977），第19–24页。\n关于日耳曼人名最易获取的入门著作仍是H. B. 伍尔夫《古日耳曼命名原则》（巴尔的摩，1939），现由蕾吉娜·勒让的论文加以补充，见《中世纪早期社会（6–10世纪）的人名与亲族关系转型》，载G. T. 比奇、M. 布兰与P. 沙雷耶主编《中世纪欧洲人名研究：社会认同与家族结构》（密歇根州卡拉马祖，2002），第31–50页。迪特尔·格伊尼希、沃尔夫冈·豪布里希斯与耶尔格·亚尔努特主编《名与人：论中世纪早期人名的史料价值》（柏林，1997），呈现了人名学研究的一系列新取向。妇女的名字由汉斯-维尔纳·格茨详尽分析，见《女性之名：中世纪早期妇女的名字与命名》，载《Francia》第23卷第1期（1996），第99–134页；农民的名字见卡尔·I·哈默《中世纪早期巴伐利亚的农奴姓名与领主组织》，载《中世纪研究》第3辑第36卷（1995），第917–928页；以及J. 贝斯梅尔尼《九世纪法兰西乡村中农民家庭的结构》，载《中世纪》第90卷（1984），第165–193页。\n关于爱尔兰人名（与亲族模式缺乏明确联系者），参见布赖恩·奥·基夫《爱尔兰人名的若干方面》（都柏林，1986）。\n墓葬考古学的入门著作有盖伊·霍尔索尔《中世纪早期墓地：罗马之后世界的墓葬考古学导论》（格拉斯哥，1995），以及爱德华·詹姆斯《墓葬与地位：中世纪早期西方》，载《皇家历史学会会刊》第5辑第39卷（1989），第23–40页。梅根·麦克劳克林《与圣徒为伴：中世纪早期为亡者祈祷》（纽约州伊萨卡，1994）第2章概述了纪念亡者的基督教仪式。关于此背景下的亲族关系，参见C. 布沙尔《9至11世纪贵族的家庭结构与家庭意识》，载《Francia》第14卷（1986），第639–658页。\nL. 热尼科《系谱》，载《中世纪西方史料类型学》第15种（图尔奈，1975），提供了系谱学的一般性导论；更详细的讨论见肯尼思·赛瑟姆《盎格鲁-撒克逊王族系谱》，载《英国学术院院刊》第39卷（1953），第287–348页；D. N. 邓维尔《王权、系谱与列王名录》，载P. H. 索耶与I. N. 伍德主编《中世纪早期王权》（利兹，1977），第72–104页；以及戴维·桑顿《中世纪早期威尔士与爱尔兰的口传、书写与系谱》，载普赖斯主编《中世纪凯尔特社会的读写能力》，第83–98页（见前文第318页）。关于纪念、记忆与认同的性别问题，见马修·因尼斯《家族内传承：妇女与贵族记忆，700–1200》，载伊丽莎白·范·豪茨主编《中世纪的记忆：男人、女人与过去，700–1300》（哈洛，2001），第17–35页；以及伊恩·伍德《由女性界定的系谱：丕平诸族之例》，载莱斯利·布鲁贝克与朱莉娅·M. H. 史密斯主编《中世纪早期世界的性别：东方与西方，300–900》（剑桥，2004），第234–256页。\n关于中世纪早期亲族关系的论著甚多，但往往受陈旧或不当的法律与人类学模型影响：阿妮塔·盖罗-雅拉贝尔关于方法与概念化的清醒评论应予重视，见《论中世纪欧洲的亲族结构》，载《年鉴：经济、社会、文明》第36卷（1981），第1028–1049页，以及《中世纪拉丁语中亲缘关系与亲族群体的称谓》，载《中世纪拉丁语文献集》第66–67卷（1988），第65–108页。皮埃尔·吉夏尔在其《从古代到中世纪：大家庭与小家庭》中抨击了关于中世纪早期“氏族”的陈旧观念，载《历史手册》第24卷（1979），第45–60页；而亚历山大·C·默里《日耳曼亲族结构：古代与中世纪早期的法律与社会研究》（多伦多，1983）则对其作了决定性的驳斥。\n对本书的研究取向与议题而言，以下著作具有根本意义：伊莎贝尔·雷阿尔《圣徒传记与家庭生活：根据圣徒传记史料看墨洛温王国（481–751）的亲族表征与体系》（图尔奈，2001）；蕾吉娜·勒让《法兰克世界（7–10世纪）的家庭与权力：社会人类学论集》（巴黎，1995）；以及卡尔·莱瑟《9至12世纪初的日耳曼贵族：历史文化概貌》，载《过去与现在》第41卷（1968），第25–53页。关于深度罗马化文化的佳例，参见P. D. 金《西哥特王国的法律与社会》（剑桥，1972）第8章“家庭”。\n关于盎格鲁-撒克逊英格兰，洛兰·兰开斯特《盎格鲁-撒克逊社会中的亲族关系》，载《英国社会学杂志》第9卷（1958），第230–250、359–377页，具有核心地位；H. R. 洛因《盎格鲁-撒克逊英格兰的亲族关系》，载《盎格鲁-撒克逊英格兰》第3卷（1974），第197–209页，仍具参考价值。T. M. 查尔斯-爱德华兹《早期爱尔兰与威尔士的亲族关系》（牛津，1993）值得细读。\n关于农民家庭与亲族关系，参见T. M. 查尔斯-爱德华兹《亲族、身份与海德之起源》，载《过去与现在》第56卷（1972），第3–33页；补充资料见卡尔·I·哈默《中世纪早期巴伐利亚的family与familia》，载R. 沃尔、J. 罗宾与P. 拉斯利特主编《历史欧洲的家庭形态》（剑桥，1983），第217–248页。\n关于基督教化所促成的拟制亲族形态的重要研究，有约瑟夫·H·林奇《中世纪早期欧洲的教父与亲族关系》（普林斯顿，1986），以及同氏《亲族关系的基督教化：盎格鲁-撒克逊英格兰的仪式担保》（纽约州伊萨卡，1998）。关于无亲族者，T. M. 查尔斯-爱德华兹《爱尔兰peregrinatio的社会背景》，载《Celtica》第11卷（1976），第43–59页，甚为重要。\n关于友谊，见维雷娜·埃普《Amicitia：论中世纪早期个人、社会、政治与教士关系史》（斯图加特，1999）。格尔德·阿尔托夫《家庭、朋友与追随者：中世纪早期欧洲的政治与社会纽带》，克里斯托弗·卡罗尔英译（剑桥，2004），以及同氏《Amicitiae与Pacta：10世纪初的结盟、联合、政治与代祷思想》，中世纪史料汇编丛书第37种（汉诺威，1992），均甚有价值。\n除凯尔特学者外，中世纪早期史家一直不愿涉猎荣誉与耻辱问题，而这些问题通常仍属文学分析之领域；参见T. M. 查尔斯-爱德华兹《若干爱尔兰与威尔士散文故事中的荣誉与地位》，载《Eriu》第29卷（1978），第123–141页；以及M. E. 欧文《耻辱与赔偿：妇女在亲族中的地位》，载D. 詹金斯与M. E. 欧文主编《威尔士妇女法》（加的夫，1980），第40–68页。凯瑟琳·奥布赖恩·奥基夫《英雄价值观与基督教伦理》中对过于简单化地使用诗歌史料提出了审慎的告诫，该文载戈登与拉皮奇主编《剑桥古英语文学指南》，第107–125页（见前文第317页）。妮拉·潘瑟《无所惧亦无所耻：墨洛温王朝早期关于荣誉与妇女的研究》（巴黎，2001），是唯一试图将此类分析扩展至欧陆的详细著作，且仅限于六世纪。\n关于早期中世纪血亲复仇的开创性研究至今仍是必读之作：J. M. Wallace-Hadrill, ‘The Blood-Feud of the Franks’, in his The Long-Haired Kings (London, 1962), 121–47。此外还应补充 W. I. Miller, ‘Choosing the Avenger: Some Aspects of the Bloodfeud in Medieval Iceland and England’, Law and History Review, 1 (1983), 159–204, 以及 Bloodtaking and Peacemaking: Feud, Law and Society in Saga Iceland (Chicago, 1990)，后者虽然主要讨论的是12至13世纪的冰岛，但对早期中世纪研究者而言仍具有普遍的价值。Guy Halsall, ‘Violence and Society in the Early Medieval West: An Introductory Survey’, in Halsall (ed.), Violence and Society in the Early Medieval West (Woodbridge, 1998), 1–45，对“复仇”的理解过于狭隘。Richard Fletcher, Bloodfeud: Murder and Revenge in Anglo-Saxon England (London, 2002)，是一部通俗易懂、生动有趣且聚焦于11世纪的微观史著作。\n第四章 男性与女性\n对早期中世纪社会的性别分析主要是英语学界学者的成果。关于相关议题，参见 Janet L. Nelson, ‘Family, Gender and Sexuality in the Middle Ages’, in Bentley (ed.), Companion to Historiography, 153–76 (见本书第314页)；Pauline Stafford and Anneke Mulder-Bakker (eds.), Gendering the Middle Ages (Oxford, 2001), 以及 Brubaker and Smith (eds.), Gender in the Early Medieval World: East and West, 300–900 (见本书第324页)，三者均附有详尽的补充书目。对比性的研究路径可参见 Julia M. H. Smith, ‘Did Women have a Transformation of the Roman World?’, in Stafford and Mulder-Bakker (eds.), Gendering the Middle Ages, 22–41，以及 Guy Halsall, ‘Gender and the End of Empire’, Journal of Medieval and Early Modern Studies, 34 (2004), 17–39。\n有几部专门论述早期中世纪女性的著作，但没有一部完全可靠；其中包括 Suzanne F. Wemple, Women in Frankish Society: Marriage and the Cloister 500–900 (Philadelphia, 1981)；Christine Fell, Women in Anglo-Saxon England (London, 1984)；Lisa M. Bitel, Land of Women: Tales of Sex and Gender from Early Ireland (Ithaca, NY, 1996)；同氏， Women in Early Medieval Europe, 400–1100 (Cambridge, 2002)，以及 Patricia Skinner, Women in Medieval Italian Society, 500–1200 (Harlow, 2001)。Hans-Werner Goetz, Frauen im frühen Mittelalter (Cologne, 1995) 中有许多有价值的内容。\n关于男性，参见 J. J. Cohen and B. Wheeler (eds.), Becoming Male in the Middle Ages (New York, 1997)、D. M. Hadley (ed.), Masculinity in Medieval Europe (London, 1999)，以及 Mathew Kuefler, The Manly Eunuch: Masculinity, Gender Ambiguity and Christian Ideology in Late Antiquity (Chicago, 2001)。Carol Clover, ‘Regardless of Sex: Men, Women and Power in Early Northern Europe’, Speculum, 68 (1993), 363–87 (重刊于 Nancy Partner (ed.), Studying Medieval Women: Sex, Gender, Feminism (Cambridge, MA, 1993))，基于早期冰岛史料提出了富有启发的比较视角。\n关于墓葬、性别与生命周期的关键研究有：Guy Halsall, ‘Female Status and Power in Early Merovingian Austrasia: The Burial Evidence’, EME 5 (1996), 1–24；同氏， Settlement and Social Organization: The Merovingian Region of Metz (Cambridge, 1995)，以及 N. Stoodley, The Spindle and the Spear: A Critical Enquiry into the Construction and Meaning of Gender in the Early Anglo-Saxon Burial Rite, British Archaeological Reports British Series, 288 (Oxford, 1999)。\n家务劳动与农业劳动的性别层面由 Ludolf Kuchenbuch, ‘Opus feminile: Das Geschlechtsverhältnis im Spiegel von Frauenarbeit im früheren Mittelalter’, in H.-W. Goetz (ed.), Weibliche Lebensgestaltung im frühen Mittelalter (Cologne, 1991), 139–75 进行分析；另见 Jean-Pierre Devroey, ‘Femmes au miroir des polyptyques: Une approche des rapports du couple dans l’exploitation rurale dépendante entre Seine et Rhin au IXe siècle’, in Stéphane Lebecq, Alain Dierkens, Régine Le Jan, and Jean-Marie Sansterre (eds.), Femmes et pouvoirs des femmes à Byzance et en Occident (VIe–XIe siècles) (Villeneuve-d’Ascq, 1999), 227–49。\n婚姻与两性关系从法律史料视角的综合考察见 James A. Brundage, Law, Sex and Society in Medieval Europe (Chicago, 1987)。关于婚姻形式的关键讨论有 Raymund Kottje, ‘Eherechtliche Bestimmungen der germanischen Volksrechte (5.–8. Jh.)’, in Werner Affeldt (ed.), Frauen in Spätantike und Frühmittelalter: Lebensbedingungen, Lebensnormen, Le
