男性更为悲惨。</p>\n<p>查理曼致其官员的备忘录使用了自由人与奴隶的传统用语：liber与servus。前者相对直白：liber享有各种自由权（liberties），即行使某些权利的自由，无论其经济状况如何。后一个词则是出了名的难以界定。servus在古代的意义是 chattel slave，即财产奴隶，是主人占有之物，通常在战争中被俘并从远方贩运而来，当其劳作生涯结束时，会被另一个人类“进口品”所取代。在中世纪早期的进程中，它逐渐意指不自由的农奴：虽被承认为人，但权利极为有限，且通常世袭地束缚于其劳作的土地之上，其后代日后也将在这土地上劳作。然而在这一时期的大部分时间里，这个词既可以指前者，也可以指后者，或兼指两者。新的意义并未取代旧的意义，而各个作者对这个词语的确切用法也并不总是前后一致。语境也并非总是可靠的指南。造成这种语言上的不精确有两个主要原因：第一，其古代意义规定的是一种司法身份，而中世纪早期的文本通常用这个词描述一种社会经济状况而非法律状况。其次，其意义的转变与领主使用依附劳力耕作其地产的方式的变化密切相关。基于这两个原因，它留下了关于中世纪早期经济能否被归类为“奴隶经济”的争议残余。</p>\n<p>这场论辩并无助益，原因有几个。重要的是，它有可能把这几个世纪的社会关系与农业经济化约为单一的、范式化的模式，并且妨碍人们领会即使在一个局部地区也并存的依附与不自由的多种形态。它还使人们的注意力从一群在许多地方无疑十分重要的人身上移开——即自由农民所有者，他们在史料中往往难以追踪，除非在他们把土地或部分自由让渡给领主的那一刻。此外，它倾向于抹去拉丁语和各地方言中通常用来指依附劳动者的许多其他词语——这些词或者单独使用，或者与servus连用，并各有其流动的含义。</p>\n<p>但最重要的一点是：尽管奴役的词汇几乎未曾变动，其社会与政治维度在中世纪早期却与古代世界大不相同。罗马帝国在意大利及其他地中海行省的一些庞大农业庄园，曾由大批输入的奴隶成队耕作，他们被安置在兵营般的条件下，被剥夺了一切家庭生活，但这种剥削与人格贬损的方式在四世纪之前已然消失。被安置在各自地块上的四、五世纪奴隶，在两个方面日益类似于被束缚的依附农民：他们被承认为人而非物；以及他们贫困的经济状况、社会屈从地位和可继承的身份。然而，一套陈旧的司法词汇依然存在，散发着昔日气息，与较新的社会经济现实并不相符。</p>\n<p>当中世纪早期的记载开始较为详细地向我们展示领主权与从属关系的典型形式时，农业奴隶制在后帝国时代的诸行省已成往事。在大陆的基督教地区，唯一能见到的奴隶是在贵族家庭和高等级的城市宅邸中，他们充当家仆或 skilled craftsman（技艺工匠）。相比之下，在英格兰，农业奴隶制与其他形式的奴役并存，社会实践与古英语词汇都表明了这一点。在不列颠群岛的其他地方及斯堪的纳维亚，奴隶制构成了非自由劳动力的主要来源，其供给靠劫掠与购买来补充。这种制度一直延续到1066年之后法国北部的征服者把他们自己的农业剥削传统和长期以来反对贩卖人口的道德约束带到英格兰，到该世纪末带到威尔士，最后在1169年之后带到爱尔兰。奴隶贸易的终结指出了中世纪早期农奴与奴隶之间的一个实际差别：尽管二者都可在田间劳作，但前者通常仍被束缚在其出生的特定地产上，并随土地一同被转让。而后者也可以在市场上被买卖，并被驱使到远离出生地的地方劳作。</p>\n<p>无论是奴隶还是农奴，不自由的人口以各种方式进入领主的支配之下。这些方式不仅揭示了臣服的严酷现实，也让我们得以了解中世纪早期生活中的某些不安定与不确定因素。许多人从出生起就隶属于某位领主，仅仅因为他们的父母也是如此：从领主的角度来看，当跨越法律鸿沟的性关系或婚姻——这是常有的事——产生出必须确定其身份的后代时，自由与奴役的区分才最为重要。对领主而言，问题的关键在于保持对劳动力的控制。有些人因犯罪而丧失自由，因为他们无力凑足应缴的赔偿金；我们还遇到过另一些人，在极度的困苦和饥荒之下，他们将自身卖为奴役，把沦为奴隶当作换取少许粮食乃至某种庇护的可接受的代价。<sup class=\"fn\" data-note=\"5:6\">6</sup></p>\n<p>在战争中站错一方可能导致被俘和奴役；事实上，在基督教欧洲的周边地区，战争与掳掠奴隶是不可分的。“我在边境之外俘虏了这个奴隶，当时公爵正率军出征”：这份声明在八世纪的巴伐利亚足以作为所有权的证据。<sup class=\"fn\" data-note=\"5:7\">7</sup></p>\n<p>一个人可以在自由与奴役之间来回变动，有时一生中不止一次。身份的改变也会波及后世，正如这份十世纪末英格兰北部的感人文献所见证的：“ Geatfleda 为了对上帝之爱和她灵魂的缘故，[给予]铁匠 Ecceard、Ælstan 及其妻和所有他们已生与未生的子女，以及 Arkil、Cole、Ecferth [和] Aldhun 之女，还有在那邪恶的日子里她曾以自己的名义供给食物的所有人，以自由。”<sup class=\"fn\" data-note=\"5:8\">8</sup> 这些忍饥挨饿的男男女女曾俯下身来，把头置于 Geatfleda 的双手之间，象征他们臣服于她的领主权；作为回报，她供养了他们。后来，她在达勒姆大教堂的祭坛前，以另一种同样具有象征意义的仪式解放了他们。</p>\n<p>解放奴隶（manumission）在整个基督教欧洲都有实行，并受到神职人员作为一种虔诚行为的鼓励，这可能是个人法律身份被改变的最常见方式。然而，解放仍是一种领主权力的行为，在宗教意义上，受益的是主动发起解放的领主本人。在法律意义上，它免除了不自由者所承受的若干不利待遇。在欧陆，罗马的文书格式广泛可得，新获自由的人手握特许状，或可被称为“特许状之民”。相反，在不列颠诸岛，解放的记录通常写入福音书中，并诉诸神明的制裁来维护其效力。九世纪初，Bleddri 的四个儿子就是这样做的，他们授予 Bleiddudd ap Sulien 及其后裔“永久”自由。在威尔士大兰代洛（Llandeilo Fawr）圣泰洛教堂所藏的一部古老福音书的页边，他们声明：“凡维护此项授予 Bleiddudd 及其诸子之自由者，愿他蒙福。凡不维护此权利者，愿他被上帝和圣泰洛诅咒——本声明正是写于圣泰洛的这部福音书中。”<sup class=\"fn\" data-note=\"5:9\">9</sup></p>\n<p>另一些时候，自由身份并非来自领主，而是源于农奴自身的行动。关于起义的记载极为罕见，但关于个人逃亡的提及则常见得多。有时，当地教会提供庇护——在这种情况下，逃亡很可能是与领主重新谈判的前奏。另一些时候，附近的边境提供了机会，而规范王国边界的协定有时明文规定归还逃亡者。此外，任何协助和唆使逃亡男女之人都要受到严厉惩罚。既然迁徙自由本身就是自由人的标志之一，成功地迁往新的地区就可能改变一个人的身份。较少见的是，人烟稀少地区的有魄力的领主会向所有前来定居的人提供自由：例如，880 年，塞尔达尼亚伯爵威弗雷德向所有能够逃离主人、前来比利牛斯山以南边境地区卡多纳定居的奴隶或农奴提供了自由。</p>\n<p>赢得自由值得付出毕生积蓄，或冒逃亡的危险。捍卫自由甚至可能值得杀死一个可能否认自己身份的不自由亲属：查理曼规定，凡是采取如此极端手段者一律处以死刑，并进一步命令其自由亲属也一并沦为奴役。但自由也可以通过诉讼来捍卫，尤其因为自由人的特权之一就是能够进入王室法庭。自由还赋予携带武器的权利。然而，自由并非全是好处。它很可能带来更大的不安全感，而非生活条件的任何改善，因为灾荒之年，独立的自由农民几乎不可能从领主的粮仓中得到施舍。因此，获得法律自由的农民常常重新谈判出另一种形式的从属关系，以换取领主的持续庇护。自由在法律上的好处与经济上的不利可谓势均力敌，因为自由与奴役之间的区分按某些标准来说是轻微的，按另一些标准来说却是巨大的，这使得两种身份之间的社会屏障是可渗透的。</p>\n<p>原则上，获得自由降低了遭受伴随从属地位而来的暴力的风险。法律常常规定，农奴或奴隶因偷窃、毁坏财物或破坏和平而被处以截肢、鞭笞甚至死刑，而自由人则相应地处以金钱赔偿，尽管若无力支付，他们也可能被降为奴役。然而，在法律条文的遥远世界之外，还存在着一种更为切近的习惯性暴力文化。偶尔，法典本身也会提及这种暴力，如巴伐利亚的这一条款：“若有奴隶妇女人任何人残害而致流产，若胎儿尚未胎动，应赔偿四索里达；若胎儿已经胎动，则应赔偿十索里达。”<sup class=\"fn\" data-note=\"5:10\">10</sup> 不过，更常见的是，基督教道德家的疾呼让我们意识到这种暴力的普遍存在。奥尔良主教约纳斯（818–843年在任）在约820年提醒马特弗里德伯爵：只有人类社会才在人与人之间制造不平等，而所有人在出生之时都是一样的。“那些因奴隶的过失而被激怒、勃然大怒、狂怒不止，或者以野蛮的殴打惩戒他们，或者砍断其肢体致残的领主们”，不应误以为自己可以逍遥法外——而应记着天上只有一位上帝。<sup class=\"fn\" data-note=\"5:11\">11</sup> 这样的主人很可能不太在意不自由的农奴与他所解放但仍依附于他的人之间的法律区分的细微之处。当极端的臣服生活意味着生活在暴力的阴影之下——对妇女而言，还有性剥削的阴影——时，法律身份的精确界定恐怕意义不大。</p>\n<p>为了缓解等级世界较为残酷的现实，古代晚期的教士们宣扬负责任的权力伦理，并将其与精英获得基督教救赎的希望联系起来。其中一个方面是强调慈善捐赠的救赎效果。贝尔特希迪斯（Bertechildis）是莱茵河畔宾根一位显贵的妻子，生活于六或七世纪的某个未知时期。她汲取了这种精神，当她年仅二十岁、婚后仅一年便去世时，人们在她墓上刻下了铭文。铭文纪念她虔诚的慷慨：“深受民众爱戴的她，为了自身罪孽的缘故，向寡妇、孤儿和穷人施舍赈济。”<sup class=\"fn\" data-note=\"5:12\">12</sup> 这类关于俗人施舍的直接见证十分罕见，但它揭示了我们已知普遍存在的现象：一种赋予穷人帮助富人得救之角色的观念。通过接受施舍，穷人帮助将救赎的天平向富人倾斜。</p>\n<p>中世纪早期主教和道德家们继续想当然地接受 pauperes（“穷人”）的存在，这里不仅指寡妇、孤儿和贫困者，也包括所有容易受权势者剥削、缺乏领主权资源以维护自身利益的人。从九世纪起，他们扩大了所劝勉的 potentes（有权势者）对穷人应负的责任。后者虽无法消除社会不平等，却可以保护穷人；以公平价格、不作量器舞弊地购买农民的葡萄酒和谷物；并向赤贫者施舍——如此，便可拯救自己的灵魂。</p>\n<p>于是，奴役与自由之间的区分具有社会的和道德的维度，其重要性不亚于任何法律上的差异或经济现实。它在法律理论上是分明的，但在社会实践中却是高度可渗透的，一方蕴含着成为另一方的可能。领主权处于这种关系的核心，因为奴役以支配为前提，而臣服并不限于法律上不自由的人。所有中世纪早期的道德家都接受权势者与穷人之间的鸿沟。他们只是劝勉各方各尽其被指定的角色，并尊重每一等级的权利。在理想世界中，不自由者劳作以供养自由者，领主则保护并捍卫所有人：</p>\n<p>因为没有不自由者，自由人无法生存。\n当人们真正指望某项工作完成时，\n国王和主教们似乎在为他们的农奴服务。\n领主由农奴供养，而本应是他供养农奴。</p>\n<p>在基督教的道德经济中，领主权建立在对权力的审慎运用之上，因为它在带来权利、特权和财富的同时，也带来了社会责任。但写下这些诗行的年迈的拉昂主教阿达尔贝罗（977–约1031年在任）在十一世纪初也心知肚明。他紧接着补充道：</p>\n<p>不自由者的呻吟与泪水没有尽头。<sup class=\"fn\" data-note=\"5:13\">13</sup></p>\n<p>在隆冬严寒中不敢在家中逗留片刻的耕农想必会深表赞同；而且，既然在农业经济中，领主权依赖于对土地的开发利用，我们现在就转向这个问题。</p>\n<h2 id=\"ch7-s1\">农民与领主</h2>\n<p>那么，围绕生产农业剩余产品的需要，社会关系是如何组织的？在实际操作上，农民的劳动如何支撑领主的地位？领主权的社会和经济现实又是怎样的？四世纪作家帕拉迪乌斯的一句话提供了有益的起点：“既然土地类型如此繁多，便不可能有单一的劳作组织方式。”<sup class=\"fn\" data-note=\"5:14\">14</sup> 帕拉迪乌斯以不同的土壤和气候来解释这种多样性；我们还应当补充：做法因大地产与小地产而异，而且随时间推移也在变化。古代晚期和中世纪早期的土地保有制的特征是区域性和地方性现实的纷繁多样，我们应当时刻牢记这一点。</p>\n<p>多样性的一个方面是规模。小规模土地占有十分普遍但分布极不均衡，在文献中大多只在教会机构接管小土地持有者的部分或全部财产时才可见。大规模土地占有只有在大型政治体之内才有可能，而帕拉迪乌斯此语的背景正是罗马晚期精英土地占有的巨大规模。五世纪初，帝国西半部元老院贵族的某些成员在地中海各地拥有大片分散的地产，但随着那个世纪中日益加剧的不安全和西部帝国统一罗马统治的逐渐瓦解，他们的地产财富受到侵蚀：后帝国诸王国的建立伴随着财产占有规模的萎缩。</p>\n<p>罗马在西部的统治终结还产生了其他影响。在古代晚期，各地区的城市土地寡头（库里亚勒斯，curiales）负责向小地产所有者和独立小农征税，并将其税款上缴国家。他们作为中间人的角色使其得以通过敲诈勒索、威胁或虚假的慷慨来扩展自己的影响。阿尔勒的凯撒利亚如此描述六世纪初普罗旺斯发生的事情：</p>\n<p>如果[富人的]邻人是个穷人，被迫到了非卖不可的地步，或者可以被施压强逼出卖，他的目光便转向那个方向，指望能夺走其穷邻人的地产或佃农。于是他给对方制造麻烦。例如，他暗中说服当权者让税吏纠缠此人，或指派他担任某种足以倾家荡产的公职。……在必需品的驱使下，[穷人]去找那个因其恶行而正在压迫、折磨他的富人，却不知道自己正是因他的所作所为而受苦，对他说：“主啊，我求你借给我几枚索里达，我急需用钱；我正被债主围困。”</p>\n<p>在试图借贷未果之后，穷人最终被迫变卖一切。“富人则表示愿意帮助他这位所谓的朋友”，并以远低于土地真实价值的价格买下了穷人的产业。<sup class=\"fn\" data-note=\"5:15\">15</sup></p>\n<p>当有势力的地主将自己插在地方民众与国家之间时，自由农民和所有者都发现他们的独立性受到侵蚀。他们的缴纳逐渐演变为习惯性贡赋，而在此基础上，大地主得以逐渐把他们拉入更为严格界定、更为从属的依附地位。从小自由农到依附农民的转变几乎不可逆转；六至十一世纪间，大地产处处扩张，而小人物纷纷败落。</p>\n<p>这一进程还以另一种方式加速。五、六世纪的不安全模糊了四世纪并行的文职与军事职业队伍之间的差别。常备驻军让位于农民民兵，土地所有者开始在入侵和不安全时期向佃户提供武装保护——或者自己干起保护费的勾当。为确保自身地位，地主变成了军阀。而且，继418年哥特武装队伍在阿基坦定居的先例（图0.2）之后，几支源自帝国边境以北的军队在各自首领的率领下被安置到西部罗马行省的乡村，起初或许只是抽取乡村地产所产生的一部分税收，但迟早会发展成拥有土地的军事精英。这进一步强化了领主对依附者和邻人的控制。 thus，贯穿整个中世纪乃至以后欧洲社会特征的社会精英与军事领导权之间的结合，便是在罗马政治秩序解体所带来的迅速变革中确立起来的。</p>\n<p>农民与领主之间的关系总是隐含着一个更广阔的政治环境。兵役、王室恩庇，以及有时额外的财政摊派，对进入统治者随从行列的显贵们有直接影响。间接地，农民也感受到其冲击，因为领主权的压力以各种方式向下传导至他们身上。七、八世纪西北欧定居模式的变迁暗示了更严密的领主控制，可能伴随着对更多产品缴纳和更高捐税的要求，以及专业手工业品生产的增长。农民必然受到不利影响，尽管细节已难以考明。到八世纪末，领主普遍开始要求直接的劳役，在加洛林核心地带固然如此，在其他地区或许也是。虽然农民始终承受着生产超出自身温饱所需之物的压力，以便领主能从剩余产品中获利，但地产管理的趋势仍有变化，到十、十一世纪，许多领主似乎更偏好实物地租和实物缴纳而非直接劳役。</p>\n<p>除了这些概括性的情况之外，我们对中世纪早期世俗土地占有的细节所知令人沮丧地少，因为没有任何俗人的或王室的产权契据、特许状、地籍册或地产备忘录合集完整保存下来。俗人签发的文件通常只有在当人们向教会捐赠财产时，凭据文书便随之产生。得以留存至今的档案都属于大教堂和修道院：正如下文所表明的，我们对于土地所有权和土地开发所拥有的最全面的视角，本质上是一种教会的视角。不过，在论述过程中，我们仍可留意世俗领主与其农民之间的关系。</p>\n<p>凡是基督教得以确立的地方，各大教会自四世纪起便不断获得土地。早期阶段极难详细追溯，部分原因是纸草——晚期古代主要的记录材料——极易损毁。然而可以确定的是，虔诚捐赠的比率自八世纪初急剧上升，这是因为家族资源处置策略发生了转变，而对身后宗教纪念的追求也变得更加迫切。伴随这股高潮而来的文书意识的普及，恰逢基督教欧洲许多地区转用极为耐久的羊皮纸作为书写材料，因此，从八世纪开始，尤其是欧洲大陆上，世俗捐赠与教会土地持有变得远远更易察见。</p>\n<p>到九世纪，加洛林帝国大约三分之一的耕地属于教会，尽管各地区差异很大，而且并非所有这些地产都被长期保留。在英格兰，诺曼征服前夕的比例与之相近——约占全部土地的四分之一。这些虽不精确却仍令人瞩目的数字，有几层值得注意的含义。</p>\n<p>首先，随着教会土地财富的增长，教会成为景观经济组织及其居民的核心。教会地产上的区域专业化——例如葡萄酒、盐或羊毛，以及布匹、陶器等手工业制造——极大地推动了区域和跨区域贸易。教会从其财产中获得的财富也使其政治影响力日益增长。任何对领主权的研究都无法忽视这一制度性维度。</p>\n<p>其次，世俗地产在每一任所有者死后往往面临重新分割、重新分配和争夺，而教会地产则通常享有持久的制度性所有权。诚然，国王和地方权贵偶发的、零敲碎打的掠夺造成过损失，但即便如此，一个因侵占某座教会土地而声名狼藉的领主，往往会被另一座教会作为慷慨的恩主加以纪念。另一种较轻的损耗来自租佃权世袭化的倾向；要遏制这种悄然的侵蚀，需要持续的管理警惕和坚定的意志。然而尽管如此，教会地产总体上仍是租佃关系流动性之海中相对稳定的孤岛。依靠精心保存的地契档案所形成的长久的制度记忆，教会土地的持久性远超中世纪早期的世俗地产。</p>\n<p>最后，由于教会是在帝国的庇护下发展成有产的制度的，它们按照晚期罗马财产法运作。中世纪早期，基督教传教士无论走到哪里，都携带着罗马法关于完全所有权的个人产权预设、书面文件形式和专业术语。这些往往与传统财产关系相冲突，尤其是在土地权利与亲族成员身份紧密相连、并通过口述传统保存于社会记忆之中的地方。从罗马城本身的山地腹地到爱尔兰起伏的丘陵，中世纪早期文书中罗马化的语言常常掩盖了那些已大大适应本土惯例的租佃习俗。</p>\n<p>因此，出于种种原因，领主与依附劳动者——无论奴隶、农奴还是自由人——之间的关系并不遵循任何单一模式。有些习俗相当普遍，但不存在某种规范或典范制度。多样性、流动性和演变是中世纪早期地产的标志，我们必须认识到这一点。由于这一系列实践既难以概括呈现，也难以找到代表性实例，以下将选取一个单独个案研究来说明这种多样性。</p>\n<p>所涉及的地区是佛兰德斯北部，详见图5.2。该地区恰好位于前罗马边境线之内，横跨中世纪早期（以及现代）日耳曼语与罗马语之间的语言边界地带。目前我们关注的是一个约创建于629至639年间、奉献给圣彼得的宗教团体。其所在地名为布兰迪尼乌姆的山丘，俯瞰斯海尔德河与莱厄河交汇处的古老罗马定居点根特，靠近后来在九世纪发展出贸易中心的地点。</p>\n<figure><img src=\"images/fig_5_1.png\" alt=\"第5章所涉主要地点\"><figcaption>第5章所涉主要地点</figcaption></figure>\n<p>……即第九世纪将出现贸易中心之处。与大多数修道院一样，它经历了产业积累的时期，也经历了停滞或流失的时期。这些波动通常与“改革”周期相伴出现——即对教会礼仪和其成员行为规范的全面整顿，旨在拉大宗教生活与世俗生活之间的差距。几个世纪以来，根特的圣彼得修道院经历了数次这样的改革；从留存下来的文献中，我们可以追溯佛兰德斯这一隅领主权模式的变迁。</p>\n<figure><img src=\"images/fig_5_2.png\" alt=\"9世纪佛兰德斯的土地所有者\"><figcaption>9世纪佛兰德斯的土地所有者</figcaption></figure>\n<p>圣彼得修道院最初由国王达戈贝尔特（623–639年在位）捐赠了其附近的一块土地，之后逐渐在斯海尔德河和莱厄河上游获得其他地产，并在北面的森林以及更远处的沿海盐沼中获得产业。如图5.2所示，其土地规模不大，而且几乎全部位于修道院教堂30公里范围之内——这与许多地产散布极广的其他修道院不同。此后的墨洛温王朝诸王似乎对这座新教会失去了兴趣。到八世纪，当相互角逐的权贵势力争夺对高卢北部的控制时，圣彼得修道院曾试图保持中立，但未能成功。或许不可避免地，它被卷入了其中一方的庇护之下，但似乎因此失去了部分土地。</p>\n<p>王权控制在查理曼统治时期得以重新确立。对根特的圣彼得修道院而言，一如对许多其他修道院和大教堂而言，加洛林领主权使其在任何诉讼中都能直接诉诸宫廷。此外，在其自身领地内，修道院院长取代了地方帝国行政和司法官员：实际上，他成为了国王在此的代理人。同样地，加洛林的控制也意味着脆弱性与义务，这在虔诚者路易于815年任命一位新院长时便显现出来，其任务是“改革”这个团体。此人就是艾因哈德——忠实的廷臣、著名的查理曼传记作者，而且是位在俗者。他代表着王室在这一宗教团体内部的领主权，是皇帝汲取修道院财富的渠道。尽管艾因哈德为个人或帝国利益经营着修道院的部分地产，他仍专门划出特定土地，用以维持居住在圣彼得修道院的二十四名教士的生计。他仔细登记了他们的份额，相关文献揭示了这一特定教会团体是如何组织和开发其土地的。</p>\n<p>虽然艾因哈德或其九世纪的某位继任院长向教士兄弟们划拨了一处位于南方近50公里外的田庄，但他们的土地大部分紧邻修道院本身，是一个由耕地、割草草甸、养猪的林地以及一小块葡萄园的一部分组成的适度产业。与此相连的是沿海盐沼中的偏远牧羊场。所有这些被称为 terra indominicata，即直领地，意指它将被直接耕种以为其领主谋利，在这里即圣彼得修道院团体。教士们还被划拨了更大的一块土地，紧邻其直领地，这块地原本属于七世纪最初的捐赠。它当时如何组织经营已不得而知，但显然到九世纪初，租佃安排已发生了相当大的演变。到那时，它已被划分为若干单位，每个单位由一名依附劳动者耕种，此人须履行特定义务。</p>\n<p>让我们来看一个特定的依附者——福尔克里克，他持有一份土地，即一个曼苏斯。每年他须向修道院缴纳定量的面包、啤酒、猪、木柴、屋顶木瓦、亚麻、鸡蛋和谷物。此外，每隔第三年，他在收获季节缴纳两索里达（合24便士），以替代他为直领地出劳役；在间隔的其中一年，他另行缴纳两索里达以资助修道院的军事开支；在另一年，他无须缴纳现金，只须缝制一件衬衣。由于我们既不知道福尔克里克曼苏斯的面积，也不知道他是否有妻子儿女帮忙，我们无法估计这些义务的沉重程度，也无法计算会有多少产品剩余下来供养他自己和家人。但我们可以肯定，管家会确保教士兄弟们获得稳定的面包、啤酒和其他产品的供应；而他们的管理手段会包括欺诈、勒索和鞭打。</p>\n<p>福尔克里克的日常劳作必然局限于他耕种的田地、他前往砍伐和运送木柴的树林，以及他收割的亚麻——（大概）由他的妻子织成亚麻布再制成衣物，但他仍然是一个更大、更复杂的经济体的一部分。在查理曼时代，他的前辈可能曾被课以直领地上的劳役，但即使如此，到福尔克里克的时代，这些劳役已被折算成现金缴纳。在八世纪末和九世纪，依附农民常常须在地产的直领地上服劳役（繁重程度不一），从而将地产的各部分整合起来，但这远非普遍现象。领主可能改而索要现金，以更有效地开发其土地并提供更灵活的收入。但只有当农民能够进入市场、以少量剩余产品换取银便士时，他们才能这样做。由于居住在日益繁荣的市场中心根特附近，圣彼得修道院的依附者显然对此毫无困难，尤其是在840年后那里设立王室铸币厂之后。</p>\n<p>在福尔克里克的田地之外，在地方市场之外，在修道院对他生活的控制之外，王权也发挥着自己的影响。通过每三年缴纳两索里达以支持圣彼得修道院的军事义务，福尔克里克为法兰克军队的开支作出了贡献。尽管九世纪征兵方式的细节仍有争议，但大型教会土地所有者和世俗贵族都必须提供分队。每支队伍的核心大概都是土地所有者（就教会而言则是其在俗代表）及其重装骑兵扈从。军事义务的影响在圣彼得修道院可见一斑。直领地草甸每年生产的五十车干草足以供马匹过冬，直领地部分田地种植的燕麦也是如此。从佃户处收取的部分木材，可能被用于维护810年在根特建造的沿海防御舰队。那么，院长是否将修道院众多依附者各自缴纳的小额款项汇集起来，用所得购置所需的装备、驮兽和战马，以便派遣重装骑兵出征？抑或他与王室约定定期缴纳一笔整款，以代替实际派兵？从福尔克里克的角度看，这无关紧要：他只须照章缴纳。以这样或那样的方式，修道院的领主权在他与统治者之间充当了中介。</p>\n<p>另有约二十四名依附者各持有一个曼苏斯，条件与福尔克里克相同或相似。在艾因哈德任院长期间及其后，圣彼得修道院又为教士自用获得了若干土地，它们按同样的直领地加依附租佃的基础加以组织。这些捐赠的记录表明，随土地一同转让的还有其上的劳动力，农民从捐赠者的领主权转归受赠者。这些男女只能被描述为处于奴役状态。他们的子女随其而来，并继承其身份。到九世纪末，他们对修道院极度从属的标志更加清晰：除了每年的义务外，他们还须在结婚时缴纳一笔款项，在死亡时再缴纳一笔。因此，圣彼得修道院的支配具有三个主要特征：它是家父长制的，因为它触及修道院大家庭的所有成员；它是家产制的，因为它施于修道院的全部土地产业；它是强制性的，因为它无可回避。无论领主是教会、世俗领主还是国王，这些都是中世纪早期一切领主权的三个主要特征。</p>\n<p>其他男男女女与圣彼得修道院的关系则截然不同。直领地由二十九名未婚者耕作——年轻的男女以及几名挤奶女工，他们未被分派单独的地块，想必住宿在修道院的附属建筑中。无论我们称之为农奴还是奴隶……并不影响他们完全依附的地位。而在另一个极端，有些人则与修道院保持着松散得多的、也更体面的关系。若干“自由人”只需缴纳可观的现金款项，外加有限的实物贡赋，通常是啤酒。他们可能以某种我们无从得知细节的方式持有佃地；也可能是小自由地产的所有者，其土地原先处于对国王的松散从属之下，如今改为向修道院缴纳习惯性贡赋。教会的领主权对这些人的束缚相当轻微，但圣彼得修道院仍然主张对其土地及其收益的权利。</p>\n<p>教士与某些近期捐赠者之间的关系则又不同。诺德贝特便是一例：他购买了一份地产并将其赠予圣彼得修道院，但随后在830年，他与艾因哈德达成安排，继续占有并从该土地中获利，只需每年象征性地缴纳两便士，以示承认修道院的领主权。只有在他死后，教士们才能取得直接控制权：在那之前，诺德贝特与教士们对该地产拥有重叠的权利。这样一种安排是对教会有利的，即所谓“恩惠”，此类土地通常也被称为“恩地”（benefice）。这些好处应是社会性和政治性的，而非经济性的。诺德贝特是否充当过艾因哈德院长的武装护卫，或在圣彼得修道院的部队中作战？他是否在地方事务中运用影响力来保护并扶持修道院的利益？艾因哈德是否曾利用自己的地位帮助过诺德贝特？我们将在下一章看到，他确实曾这样帮助过自己的其他亲随。这些推测只是反映了我们对九世纪其他地区类似恩地的了解，但同时也提醒我们：领主权不仅关乎土地经营，也关乎个人忠诚与政治服务。它构成一个连续的光谱，从经济剥削，经过社会纽带，延伸到政治庇护。</p>\n<p>因此，根特的圣彼得修道院团体与其依附者之间的关系并不符合任何单一的简单模式。土地及其劳动力的组织方式多种多样。像艾因哈德这样精明的院长行事灵活，在追求效率与尊重地方惯例之间寻求平衡。可得的自然资源提供了一系列机遇与限制，市场之可达——或偏远——则提供了另一系列。对修道院而言，对某些男男女女课以沉重的贡赋和义务，而对另一些人则宽松得多，这都是合宜的。有效的领主会随经济、人口或政治形势的变化而调整应对之策；领主们的决策，无论是个人的还是集体的，都参与塑造着一个不断变化的社会。</p>\n<p>圣彼得修道院的土地在整体上如何融入北佛兰德斯的土地占有格局？附近还有其他大土地所有者，尤其是位于根特城内、富裕得多的圣巴沃修道院，其土地沿斯海尔德河和莱斯河上下游延伸，与圣彼得修道院的土地犬牙交错。不过，当地大部分地区由小地产者主导，每个男人或女人只拥有几块小块田地，依靠一两个依附者、至多五六个依附者的协助耕作。土地的零散化是常态：较富有的所有者的地产散布于多处。总体效果是，从林地中开垦出的小块田地和草场拼缀而成，河流沿岸则分布着水草场。而这些农民地产者向圣彼得修道院作出小额捐赠时，修道院在这里得一田、那里得一地的累积，也为不断变化的景观增添了新的要素。</p>\n<p>莱斯河与斯海尔德河谷极宜种植亚麻，并以其高度集中的亚麻布生产而著称。在佛兰德斯的其他地区，自然环境及其开发方式则有所不同，如图5.2所示。在北面的沿海盐沼、泥炭沼泽以及斯海尔德河口各岛屿上，圣巴沃修道院拥有的领地规模之大，每处足以养活上千只羊。也许像更北面沿海弗里西亚一带经营牧羊业的修道院一样，他们对这里的农民要求甚少，只要求每年缴纳成品的布匹，因为畜牧经济通常催生截然不同的领主权形式。</p>\n<p>在东北方向，以及南面沿斯海尔德河而上图尔奈周围的地区，分布着埃贝哈德与吉塞拉将在遗嘱中分配的部分土地。<sup class=\"fn\" data-note=\"5:16\">16</sup> 这些是大规模、精耕细作的农业地产，极有可能数百年间一直属于王室领地，直到吉塞拉的父亲虔诚者路易将其划归她作为嫁妆。它们实行混合农业制度，生产多种谷物，同时饲养牛、大量猪和若干羊，还有家禽——甚至孔雀。</p>\n<p>同样在西南方向，圣贝尔坦修道院是另一大土地所有者。在佛兰德斯南部起伏和缓的乡野，圣贝尔坦拥有庞大的谷物种植地产，其租佃制度在九世纪上半叶已得到系统化。这座修道院的农民与领主的关系比根特圣彼得修道院的农民更为沉重。除了规定的款项和贡赋外，每一份曼苏斯（mansus）的持有者还须在修道院的自营地上服劳役：身份为奴者每周三天，自由者每周两天。这是耕种大面积谷田最有效率的方式。即使这里曾有独立农民地产者的农庄，到九世纪中叶也已消失，被其强大的教会邻邦吞并了。</p>\n<p>我们可以让佛兰德斯的这一隅作为早期中世纪乡村社会整体的缩影。它展示了农耕经济与畜牧经济的相互作用：虽然二者在整个欧洲范围内互为补充，但很少有哪些地区像佛兰德斯和弗里西亚沿海那样高度专注于养羊，或像从佛兰德斯向南延伸至巴黎盆地的谷物种植地产那样专注于种粮。区域间贸易重新分配了各地的盈余；在其他地方，酒或盐等其他区域性特产也被运往相当遥远的市场。佛兰德斯还提醒我们林地——在这里既出木材又为猪提供饲料——的经济重要性。而最重要的是，它展示了租佃制度如何适应不同环境。在这一特定地区，对依附劳动的控制形式依畜牧与耕作的不同需要而各异；在地中海欧洲，葡萄和橄榄的种植则以其他更适宜的租佃形式为特征，而在下一章，我们还将在爱尔兰的牧牛之乡遇到截然不同的形式。</p>\n<p>在整个欧洲，领主们尽其所能地开发利用当地的自然环境，通过在本地可能性与自身不断变化的优先事项之间取得平衡来控制农民及其他依附者。但我们也应记住，他们同样回应着更广阔的政治环境。艾因哈德对根特圣彼得修道院的管理是加洛林帝国鼎盛时期的典型写照：当时王室庇护是台发电机，暂时将流动的区域性领主网络转化为一个异常庞大的政治体。然而到九世纪末，法兰克政治体陷入危机，其原因是王室王朝内部对权力的争夺，随后又迅速出现男性继承人的匮乏。九世纪中叶，国王之子太多，人人都觊觎一个王国；而到世纪末，却又少到不足以维持现有的次王国。随着这台发电机运转失灵，区域精英转而寻求别的权力经纪人，并重新组合成多个更小的政治体。</p>\n<p>佛兰德斯便是其中之一，其伯爵与最后的加洛林人——十世纪的西法兰克国王——有姻亲关系和共同的政治利益。到九世纪末，根特崛起为中央要塞，伯爵们以此为根基统治一个新兴的政治体，其权力建立在当地一座新建的木制城堡之上。在其势力范围之内，他们的行事方式与加洛林人在其帝国内的权力经纪做派如出一辙，并成功地在其区域内对庇护——土地、官职和荣誉——的涨落保持了有效掌控，直至十二世纪。</p>\n<p>牢记这一点，我们可以回到圣彼得修道院的教士、附近的世俗土地所有者和农民，考察变化的政治环境如何影响农民与领主之间的关系。940年代的又一轮“改革”留下了一批文献，不仅表明有待收回的失地，也昭示着一个迅速变化的世界。此时圣彼得修道院由阿努尔夫一世伯爵（918–965年在位）以保护人和俗人院长的身份执掌，而根特已成为迅速发展的城镇。例如在941年，阿努尔夫伯爵对圣彼得修道院的捐助就包括城中房屋的收益和对经过港口货船征收的税金。城外，景观也在变化，领主权获得了一种新的、商业性的维度。磨坊不断兴建，羊只在整个佛兰德斯大量饲养：圣彼得修道院从中兼获其利。随着十、十一世纪的推进，阿努尔夫的继任者大力推动林地的开垦和沿海洪泛平原的排水。</p>\n<p>我们可以推知这对佛兰德斯农民的意涵。他们发现自己参与到一个日益扩张的货币经济之中，因为领主此时更偏好金钱缴纳而非劳役或实物贡赋。磨坊意味着家庭磨谷的终结，也意味着农民劳动力——通常是女性劳动力——得以解放去从事其他工作。但磨坊也意味着使用须付费的义务，这是领主“习惯权”扩散的一个例证，造就了新的依附形式。土地开垦意味着人口增长、与领主交往方式的改变，以及一定程度的乡村流动性。必定还有其他农民干脆离开了乡村，因为根特及其他佛兰德斯城镇的迅速增长只能源于乡村移民，伴随着移民带来的种种失序效应。留在乡村的人则须参与生产足够的粮食，以养活城镇居民，同时也养活自己的家庭和领主。最后，城市手工纺织业的出现引入了新的劳动与领主权形式。</p>\n<p>通过这种种方式，佛兰德斯农民受到更广泛的经济潮流，以及圣彼得修道院和佛兰德斯伯爵们不断变化的领主权的影响。尽管这些发展为根特周边地区所特有，但各地的农民都被卷入并受制于领主“习惯权”的扩散以及精英之间不断变动的政治权力网络。我们不能在此之外再作概括而无视这些习惯权的巨大多样性，因为所有领主，无论世俗还是教会的，都推行各自偏好的技术，从土地上榨取剩余以维系其领主地位。殊途同归这一点，对同时代人来说并不足为奇。毕竟，一位十一世纪早期的盎格鲁-撒克逊庄园管理论者在概述了某一特定产业的组织之后，曾援引帕拉迪乌斯的话写道：“这一庄园法存在于某些庄园；如我所说，在有些地方它较重，在有些地方也较轻；因为各处的庄园习惯并不相同。……主持管理之人须留意，要始终明了该庄园的旧有安排以及民众的习惯是什么。”<sup class=\"fn\" data-note=\"5:17\">17</sup> 变化世界中的地方习惯：这正是农民应对领主支配所依存的基质。</p>\n<h2 id=\"ch7-s2\">寻求地位</h2>\n<p>“告诉我，你的财富何在？”十世纪的道德家韦罗切利的拉特尔（卒于974年）在一篇文学对话中问一位虚构的富人。“在于我拥有的地产、农奴和女奴、马匹、牛和其他牲畜，在于我的追随者的服从，在于我对猎犬和猎鹰的喜爱，在于我丰裕的衣物、精美餐具、谷物、酒和油，以及武器、白银、黄金和珠宝。”<sup class=\"fn\" data-note=\"5:18\">18</sup> 土地财产、奴役性的劳动力、忠诚的扈从、昂贵的财物和炫耀性的展示：富人的回答表明了获得崇高社会地位的复杂性。他被问及财富，其回答却将对他人的权力与物质资源结合在一起，正如我们所见，这正是领主权的典型方式。他提及自己如此享受的生活方式——狩猎、宴饮、个人服饰的奢华，以及其他种种使之凌驾于他人之上的炫耀性消费。自然，他的言辞预设了一种等级式的人际关系观，从奴隶到最富有、最有权势的领主。本节将探讨这种自我认知对早期中世纪社会秩序顶端者的若干意涵。</p>\n<p>在上层同样存在巨大的多样性。那些以各种泛指领袖人物、大人物、有权者、最优秀者的名号（拉丁语中的primores、potentes、optimates；古英语及其他语言中也有类似的词汇系列）相称的人，享有最大限度的自由集群，但即便如此仍效忠于一位亲王、国王或皇帝。较低层级的显贵——享有区域性特权、家境殷实的自由人——有时自愿、有时被迫为其服务。在某些地方，紧密的等级制度将各群体牢固地束缚于其上与其下；在另一些地方，交往、义务和服务形式则较为松散和轻微。此外，效力于一位以领土扩张闻名的领主的人，与效力于统治一个稳定甚至正在萎缩的领地之领主的人，所面临的机会截然不同。就政体而言，因为王室或诸侯的恩庇在一定程度上取决于可动用的资源。</p>\n<p>以我们前面遇到过的四位人物为例，他们都生活在830年代：阿巴、埃贝哈德、里瓦尔和诺德贝特。<sup class=\"fn\" data-note=\"5:19\">19</sup> 里瓦尔和诺德贝特都是地方上的实力人物，却选择与当地的重要教会建立往来——里瓦尔与雷东修道院，诺德贝特与根特的圣彼得教堂。在布列塔尼，任何领主权对里瓦尔这类地方土地所有者来说都形同虚设；但正如我们刚刚看到的，在诺德贝特的时代，日益严密的领主义务正影响着佛兰德斯。阿巴和埃贝哈德都直接为国王效力——前者任肯特郡长，后者任弗留利藩侯——但两人在土地、财富和政治影响力上的规模毫无可比性。以肯特的标准衡量，阿巴虽有权有势，但与弗留利的埃贝哈德相比则微不足道。埃贝哈德的家族跻身加洛林超级精英之列，这使得他的父亲和他本人得以从查理曼治下法兰克人的领土扩张中获益，其地产从佛兰德斯一直延伸到意大利。</p>\n<p>除了土地所有权之外，这四位精英人物及其家族之间几乎没有什么共同点——唯一的共同点是他们都利用土地与教会建立联系，而这正是我们得以了解他们的原因。这种多样性提示我们，应当仔细考察中世纪早期还可能存在哪些身份标志。我们将看到，资源上的悬殊差异和称谓上的多变，反映了上层社会的社会流动性，以及精英成员资格缺乏任何固定标准。由于获得或丧失高贵地位没有任何明确的成规，我们只能从多个方面去探寻。而中世纪早期的人们也正是这样做的，我们接下来就会看到。</p>\n<p>首先，高贵身份是外人可见的。伊比利亚哥特人的国王莱奥维吉尔德（568–586年在位）将梅里达附近的一处地产赐给一位名叫南克图斯的修道院长，以供养其修道团体。修道团的居民前去拜见新主人，却大为震惊：“当他们前去见到他衣衫褴褛、头发蓬乱未剪时，便鄙视他，彼此说：‘我们宁可死，也不愿侍奉这样的主人’”——于是几天后他们把他杀了。<sup class=\"fn\" data-note=\"5:20\">20</sup> 对南克图斯而言，不修边幅是苦修的标志，但他的佃户们不愿侍奉一个看起来像卑贱奴隶的主人，无论他多么圣洁。主人必须有主人的样子。</p>\n<p>除了外表之外，举止和谈吐也彰显高贵身份，七世纪诺森布里亚人伊玛的经历便说明了这一点。679年他在战场上被麦西亚人俘虏，谎称自己不是国王的侍从，只是一个穷苦农民。俘虏他的人密切监视着他，过了一阵子，“从他的外貌、举止和谈吐中看出，他并非如他所说的出身平民，而是出身贵族之家”。<sup class=\"fn\" data-note=\"5:21\">21</sup> 显然，在宫廷的历练使人养成优雅的仪态和文雅的谈吐，以及将精英与农民区分开来的着装规范。</p>\n<p>宫廷气派还以其他方式塑造出独特的外表。最迟至查理曼时代，王室扈从的衣着已讲究时髦炫耀，购置昂贵的丝绸和毛皮，男性佩戴镶宝镀金的武器，女性则佩戴胸针、臂环、腰带和项链。虔诚者路易不得不劝说他的主教和修道院长们——他们几乎都出身高门——不要穿得像世俗贵族一样。他敦促他们舍弃“世俗荣耀的饰物”，即“缀有金剑饰和镶宝匕首的腰带、华美的衣裳以及装饰着马刺的精美鞋履”。<sup class=\"fn\" data-note=\"5:22\">22</sup> 这些恰恰是弗留利的埃贝哈德遗赠给子女的那些彰显声望的物品，而且正如我们在下一章将看到的，它们被用来巩固恩庇与恩宠的纽带。这一切都标志着精英身份，其中剑带尤具特殊意义，因为无论镶宝还是素面，它们同时也是官职的徽记。这种宫廷风尚还颇具感染力：始于加洛林帝国宫廷的潮流在奥托王朝宫廷进一步发展，两者都树立起奢华高贵服饰的风尚，为各地人士所效仿。最迟至十世纪末，盎格鲁–撒克逊的国王、王后连同贵族及其妻子们也纷纷效仿，身着织花丝绸，饰以大量金线刺绣、珠宝和厚重的毛皮。</p>\n<p>对排场的讲究还延伸到骏马及其马具上，饰以“雕花圆牌”。<sup class=\"fn\" data-note=\"5:23\">23</sup> 教皇哈德良一世（772–795年在位）游行时所骑的，非“最负盛名的骏马”不可——膘肥体壮、“各方面都值得称道”。<sup class=\"fn\" data-note=\"5:24\">24</sup> 而当（1036至1038年间）年届五十的卡诺萨的博尼法乔斯翻越阿尔卑斯山去迎娶约十八岁的新娘贝亚特丽斯时，他给马钉上了银掌。他故意把马掌钉得松松的，好让它们在途中脱落，供当地百姓拾取：“这样人们就能知道他是谁了。”<sup class=\"fn\" data-note=\"5:25\">25</sup> 绝不放过任何彰显身份的机会。</p>\n<p>精美的饮食是精英生活方式的另一个方面，正如我们前面所见。<sup class=\"fn\" data-note=\"5:26\">26</sup> 除了猎物以及专门饲养以供宰杀的家畜的鲜美肉食之外，丰盛的餐桌上还有海鱼，如鼠海豚和鲱鱼，以及用进口香料烹制的菜肴。这些东西应有尽有、数量庞大：从布道者的抱怨来判断，大人物们喜欢大吃大喝、纵酒过度。尽管如此，饮食在原则上仍可区分身份的高低，因为当虔诚者路易为其办理帝国事务的代办规定口粮时，他精确地规定“按各人等级应给予多少”，无论其为 Bishop、修道院长、伯Count还是扈从。<sup class=\"fn\" data-note=\"5:27\">27</sup></p>\n<p>精英成员资格还意味着社会距离。其表现之一是拥有由武装人员、家务官员和随从组成的私人扈从队伍。另一个表现可能是设防的宅邸，例如戈尔索十至十一世纪的盎格鲁–撒克逊大厅建筑群，其中主厅、附属建筑和庭院由土垒和壕沟环绕。它还要求他人毕恭毕敬，避免威胁性的举动。“仆人向主人递刀时，习惯上要[握着]刀尖。”<sup class=\"fn\" data-note=\"5:28\">28</sup> 精心的策略可以强化等级秩序：马格德堡大主教塔吉诺（1004–1012年在位）就只看重“出身高贵和举止得体”，拒绝接纳出身低微者进入自己的随从行列。<sup class=\"fn\" data-note=\"5:29\">29</sup> 然而，社会攀附者却力图消蚀这种距离，因为效仿贵族就是在博取贵族应得的礼敬。于是，圣加仑修道院的庄园管事们“学会了吹号角，其声与其他农民的不同”，并开始佩带擦得锃亮的武器，带着猎狗去打猎——起初只猎野兔，后来甚至猎狼、熊和野猪。“‘管田地和草场的事让膳房总管去操心吧，’他们说，‘我们必须顾及自身的好处，纵情狩猎，这才配得上真正的男子汉。’”<sup class=\"fn\" data-note=\"5:30\">30</sup></p>\n<p>由此可见，精英身份意味着一种以个人炫耀和挥霍性消费为特征的生活方式与行为规范。一部八世纪的爱尔兰论著对此作了总结——它固然过分系统化，却忠实于其精神实质。一个拥有二十七名依附者随扈、一座29英尺长的主宅和一座19英尺长的附属房屋、陈设奢华——包括八张床和带坐垫毛毯的躺椅、厨房里有一口足以炖下一整头牛的大锅、十二副镀金马笼头和猎犬——而其妻子还养着一只宠物哈巴狗的人，便是“头等贵族”。<sup class=\"fn\" data-note=\"5:31\">31</sup></p>\n<p>照此标准，我们开篇提到的那位虚构的富人有充分的资格被视为精英。他拥有必要的财富、生活方式和扈从。但是，巨额财富和得体的行为就足够了吗？未必。在中世纪早期的观念中，界定精英的是“高贵”。一份十一世纪初关于身份等级的盎格鲁–撒克逊论著承认：“如果一个商人生意兴隆，曾三次自费横渡公海，那么他此后便有资格享有塞恩的权利[即在盎格鲁–撒克逊语境中的贵族：见下文]”。<sup class=\"fn\" data-note=\"5:32\">32</sup> 或许确有一些中世纪早期的商人成功跻身塞恩之列，但我们没有证据证明这一点。然而我们确有很多迹象表明，成为“高贵者”所涉及的远不止像那位富人那样坐拥财富。</p>\n<p>“高贵”又是一个含义灵活的词语。它通常描述一个人的显赫等级及其权力与特权地位，但也可以指在当时的宗教和社会期待范围内高尚端正的品行。在特定语境中，这两种含义可能取其一，也可能兼而有之：它们共同蕴含着“显赫知名”之意。那位富人固然有资格在第一种意义上被称作高贵，但并非所有与他地位相当的人都必然如此看待他。这有一个根本原因：尽管“高贵”在欧洲中世纪和近代早期的社会等级体系中占据关键位置，但在中世纪早期，它并不是一个由客观、公认的标准所界定的等级。</p>\n<p>毋宁说，它是一种品质。品行往往至关重要，“高贵”一词本身就暗示了这一点。此外，血统也举足轻重，原因有二。其一，世袭身份存在强烈的预设：知晓某人的父母出身即可确认其高贵身份。女性尤其如此——她继承父亲的等级，并且往往充当家族谱系资料的保管者。其二，除了偶有发迹的商人之外，获得支撑高贵生活方式所需资源的主要途径是继承。由于只有贵族才有机会积聚或继承超过极小规模的资源，拥有财富本身并不能自动使人成为贵族，毋宁说它确认了贵族身份。品行、血统、财富——所有这些都有助于一个人被公认为高贵。</p>\n<p>想想奥里亚克的杰拉尔吧，他作为圣徒声名远扬，部分原因正在于他拒绝过贵族同侪那种奢华炫耀的生活方式。尽管如此，他却是货真价实的名门之后：“他的出身如此显赫，以至于在高卢诸家族中，他的家系无论在产业还是生活品德上都卓尔不群。……而散布各地、附有农奴的大量庄园，凭继承权归于杰拉尔，也见证了[其祖先]财富之巨。”“谦逊与虔敬”这种形式的“生活品德”同样是家传的。<sup class=\"fn\" data-note=\"5:33\">33</sup> 不过，杰拉尔把高贵的生活推向了新的极端。一般而言，贵族被期待的行为方式要为自己、家族和领主带来荣耀：世俗男子须勇敢尚武，女子则须贞洁端方、善于持家。<sup class=\"fn\" data-note=\"5:34\">34</sup> 而奥里亚克伯爵放弃复仇、不动干戈、保持贞洁，简直是颠覆了传统的性别行为范式。因此，杰拉尔拥有一切高贵的标志：家世、庞大的地产，以及另一项难以捉摸的标准——卓越的品行，尽管是颇为奇特的一种。他高贵到了这种程度，其传记作者暗示道，以至于无需靠炫耀财富来证明这一点。</p>\n<p>通往高贵或提升高贵身份还有一条重要途径需要考虑：为王室效力。许多后来用以指称显赫等级的词原本意为仆人或家内扈从，这绝非偶然：“塞恩”/“塞恩勋爵”（分别是盎格鲁–撒克逊英格兰和苏格兰的主要精英等级）、“骑士”（古英语cniht）和“封臣”（古法语vassallus）的词根含义都是仆从。至少可以说，由于这种服务往往带有军事性质，一个人战死沙场可能为另一人在宫廷中晋升铺平道路；反之，战功卓著也可能带来奖赏、恩庇和更高的社会声望。服务也可能是较为和平的，即在支撑中世纪早期诸王国与帝国的世俗和教会行政体系中担任重任。而其回报——声望、影响力、地产，甚至是王室新娘——可以极为丰厚，弗留利的埃贝哈德对此深有体会。</p>\n<p>接近这些职位造就了一批圈内人，他们得以利用与国王的亲近为自己和家族谋取好处。此外，虽然贵族血统传递贵族等级（前提是家族记忆得以延续、高贵的生活方式得以维持），但它未必是跻身高位的前提。维尔切利主教柳特瓦德（880–900年在位）同时例证了这两点。他出身低微，却凭才干晋升，在胖子查理（876–887年在位）的宫廷中身居最高的教会职位，“受到所有人的尊崇与畏惧，甚于皇帝本人”。他还成功地提携家族，“他毫无阻碍地夺走阿勒曼尼亚和意大利最高贵人家们的女儿，把她们嫁给自己的亲戚”。<sup class=\"fn\" data-note=\"5:35\">35</sup> 与地位更高的女性通婚是既定的社会晋升途径，因为女性可以将身份连同资源一起代代相传。然而我们应当记住，特权、财富以及因接近统治者而产生的权力，绝非总是相伴而行。大贵族常常有不显达的兄弟：他们出身同样高贵、财富相当，却缺乏政治地位和影响力。</p>\n<p>受宠于君王的近臣，也未必获得同侪的信任。570年代，勒达斯特任图尔伯爵。他获得这一职位靠的是赢得希贝王（561–567年在位）继而是其兄弟希尔佩里克王（561–584年在位）的垂青。该职位肩负代表国王管理财政、军事和司法的职责，并隐含贵族身份，但关于勒达斯特，我们只能透过其图尔城中影响力对手——主教格雷戈里的眼光来了解。后者宣称，勒达斯特是王室葡萄园一名奴隶的儿子，曾被派到御厨房做工。格雷戈里断言，作为一名厨房杂役，勒达斯特因企图逃跑而被割掉耳朵，但他最终还是设法在宫廷中博得欢宠，引起了夏里贝尔王后马尔科菲娃的注意。一旦被任命为伯爵，勒达斯特便“趾高气扬地四处招摇，身居高位使他愈发骄傲自负。他表明自己是一个贪婪的掠夺者、一个争吵不休的吹牛者、一个肮脏的通奸者。他四处挑拨离间、煽动恶念，聚敛了不小的财富。”<sup class=\"fn\" data-note=\"5:36\">36</sup> 这或许是一个社会向上流动异常成功的故事；这无疑也是都尔的格雷戈里企图抹黑一个危险政敌的绝望之举——尽管此人无疑拥有财富、权力和王室恩宠，格雷戈里却全然否认他的贵族身份。这同时也是一场较量：一边是凭借为王室效力而发迹的暴发户，另一边则是地位古老、靠世袭获得、且常常与勒达斯特的王室庇护人相抵触的贵族。<sup class=\"fn\" data-note=\"5:37\">37</sup></p>\n<p>由于整个中世纪早期任何时期都不存在明确而严格的贵族标准，新血与旧血之间的紧张关系几乎始终是王室宫廷的特色。毕竟，贵族身份是被严密守护的，须防范企图染指的新来者。“皇帝使你成为自由人，却不能使你成为贵族，因为那是不可能的”——这是九世纪的一位论战者向他憎恨的一个人抛出的指控，此人是一位大主教，出身卑微，却忠诚效力于其君主“虔诚者”路易。<sup class=\"fn\" data-note=\"5:38\">38</sup> “出身卑微”的指控也可以用来攻击那些虽为贵族却不属于“正统”类型的人，如哈加诺在十世纪初的遭遇所表明的那样。哈加诺出身于洛塔林基亚的一个重要地产家族——洛塔林基亚是东法兰克王国的一部分，于911年被西法兰克国王“天真汉”查理（898–922年在位）夺取——他很快赢得了这位新君主的信任。在他的本土圈子里，哈加诺无疑会因显赫的贵族出身而备受尊敬。但在“天真汉”查理的宫廷中，他遭遇了那些在西法兰克权力网络中拥有既得利益者的敌视，他们怨恨这个外来者闯入其间——这个“被国王扶植起来的中等人家的家伙”。旧精英们向查理抱怨他私下与哈加诺讨论王室事务的习惯，将其余那些合法的谋臣排除在外。他们威胁说，除非查理抛弃“这个出身晦暗不明的人——他仿佛世上没有贵族一般向国王进言，极大地损害了国王的尊严”，否则他们便拒绝再参与政务。<sup class=\"fn\" data-note=\"5:39\">39</sup> 查理坚持信任哈加诺——结果在920年，批评者们终于反叛，并在不久后废黜了国王。</p>\n<p>通过这些案例，我们触及了问题的核心。无论有多么显赫的品行或家系，无论有多少王室恩宠、财富、社会攀升或权力，都未必能使一个人在其对手眼中成为贵族。贵族身份的本质在于来自同侪的社会承认。没有任何法律公式量化其构成要素的相对比例：由于缺乏公认的、明确的身份资格，贵族身份始终是见仁见智之事。正因如此，它可能是脆弱的，甚至是转瞬即逝的。它需要通过复用祖先的名字来宣告家系。它需要通过财富、影响力和合宜举止的显赫展示来不断重申，并须防范被社会攀爬者取而代之的风险。精心经营朋友与亲族关系；时刻留意提升荣誉的途径；为自己和子孙安排战略性的联姻；以慷慨对待教会而博得名声；审慎处置家族祖产；在变幻莫测的恩宠体系中周旋：这些都是提升贵族身份的手段，或者至少是努力遏制其侵蚀的手段。</p>\n<p>贵族身份在很大程度上取决于社会认知，这一点对于影响中世纪精英的最重要变革之一——骑士阶层的兴起——至关重要。尽管这一渐进过程的根源可以追溯到九、十世纪，但直到十二世纪，或某些地方直到十三世纪，它才宣告完成。这一过程有三条主要脉络：一条是意识形态的，一条是社会学的，一条是语义学的。</p>\n<p>首先，加洛林帝国的武士贵族接纳了一种特有的基督教军事价值观的意识形态。在那些骑马披甲与基督教敌人作战的九世纪贵族中，形成了一种颂扬战争并为战争辩护的修辞。他们通过授予武器的仪式来划定这一精英群体的成员资格，这种仪式有时伴随宗教典礼。其次，随着十世纪的领主开始修建城堡并以武装随从驻守，一个以战争为生计方式、自由但非贵族的阶层日益引人注目。这些人被称为\"milites\"，按照该词的古典用法，其意不过是“士兵”。第三，在一场始于十世纪末法兰西部分地区、但在其他地方只能追溯到更晚时期的复杂语义转变中，贵族精英开始自视为\"milites\"，并被他人如此看待。与此同时，驻防的\"milites\"也开始为自己要求贵族身份。于是，\"miles\"从一个带有非贵族色彩的词，变成了一种贵族们乐于采用的体面身份。这三条发展线索只是逐渐融合，才形成了十二世纪及以后的骑士群体。如果说骑士制是中世纪盛期贵族最显著的特色之一，那么它的根源便在于中世纪早期的功能、流动性与主观认知之中。</p>\n<p>因此，虽然某种精英的存在始终是社会事实，但其成员资格却没有任何严格界定的标准。它也不可能有这样的标准，因为统治者并非按照客观标准分配恩宠，而是随一时的情势而动——政治需要、忠诚、才能与友谊。所能作出的最概括的论断是：贵族身份是相对性的，既相对于社会等级中地位更高者，也相对于地位更低者。那些自称贵族并被同侪承认为贵族的人，从家境优渥但并不奢华之辈，到坐拥巨额地产的富豪，无所不包。他们既包括贵族身份可上溯多代的家族，也包括资历较新的家族，后者最常见的社会流动阶梯是为王室效力。精心挑选的婚姻对象和对家族祖产的精明处置，使妇女成为在无定形的亲缘网络之内及其相互之间、将祖先、土地和贵族身份主张世代传承的重要纽带。然而，对许多人而言，最重要的关系是与统治者的关系。那些没有机会直接引起国王注意的人，至少可以希望自己或自己的儿子能在国王某位朝臣的扈从中觅得一席之地。而且，随着恩庇与效力将人们引向王室宫廷，奢华生活的时尚与趣味也从宫廷向外、向下扩散。</p>\n<p>如此看来，对身份地位的追求需要精力、努力，也需要花费。它既依赖继承的资源，也依赖友谊的力量，并且需要灵巧的政治运作，以维护声誉、提升荣誉、赢得高位和土地赏赐。当维罗纳的拉瑟在他的牧灵对话中虚构出一个富人时，他并不关心这个人物的野心或成功，只关心如此贪婪之人的灵魂将面临的命运。从拉瑟的观点看，没有什么比灵魂更珍贵。他暗示，对尘世地位的追求充满了灵性上的危险。</p>\n<p>约在890年前后，威塞克斯国王阿尔弗雷德接待了一位访客，此人给他带来了一些精美的海象象牙。奥泰雷生活在挪威，位于定居农业活动的最北限。某年夏天，他的狩猎远行甚至比捕鲸者走得更远，沿斯堪的纳维亚的北极海岸一路航行，直抵白海，想看看那里是否有人居住。他献上的最上等的象牙便来自那些地方——那里除了芬纳斯人（即斯堪的纳维亚北极地区的萨米猎人和渔民）偶尔扎营之外，荒无人烟。奥泰雷对北方地理的详尽描述令西撒克逊人着迷。他们也询问了他本人的情况，得知“他是那个国家的主要首领之一，但他只有二十头牛、二十只羊和二十头猪，他耕种的那点土地是用马犁的”。他们起初惊讶于如此显赫的人物竟只有如此少的耕地和如此微薄的家畜，随即又意识到奥泰雷“在其财富所在之处，即野鹿……（他们称之为驯鹿）方面，是个非常富有的人”，惊讶之情便随之消减。奥泰雷报告说，该地区之人财富的主要来源，是从萨米人那里收取的贡赋——貂皮、驯鹿皮、熊皮大衣、成袋的羽毛、鲸骨和生皮绳，每个萨米人“各按其等级”缴纳。<sup class=\"fn\">40</sup></p>\n<p>无论是驯鹿群，还是纳贡者的个人依附关系，都不承认精确的领土边界。奥泰雷这类“驯鹿豪强”的财富更多来自游牧和征贡而非农业，这反映出可耕地稀少、土地贫瘠，以及如此遥远的北方缺乏严密组织的领主权。这里是一个不以土地控制为轴心的经济，维系上层等级的是猎人的劳动而非农夫的耕作。它与北法兰德斯高度规范化农耕、地块分明、严格臣服于王室、伯爵领和教会领主权、且交换迅速商业化的农业经济，形成了最大的反差。它们构成了中世纪早期劳动与领主权的两种极端模式，但尽管如此，两者仍有重要的共同特征。两者都是为了开发利用所在地区的自然资源而精心组织的——无论是海象长牙和熊皮，还是亚麻、燕麦和羊毛。两者都显示出财富与等级的地方性分层，虽然在绝对数量上差异极大，却都以区域规模显著的社会与政治不平等的形式表现出来。两者都贡献了国王及其扈从所珍视的资源：珍稀毛皮；用于珠宝、精巧小匣和珍贵书籍封面的象牙；喂马的燕麦；建造战船和城堡的木材。两者都表明，有权势者和统治者获取维系其领主权之资源的途径多种多样，以及他们在获得这些不同资源之后如何加以利用。下一章将更详细地讨论这些问题。</p>", "text": "“耕夫，你说什么？你是怎样干你的活儿的？”\n“哦，老爷，我干活儿极为辛苦。天一亮我就出门，赶着牛去田里，把它们套在犁上。无论冬天多么严酷，我都不敢赖在家里，因为惧怕我的老爷……是的，活儿苦得很，因为我不是自由人。”1\n人人当依附其领主；\n人人当守护其领地。\n人之顶为领主；\n人之根为领地。2\n土地、在土地上劳作的人，以及对这些人施行统治的人，这些主题将我们引向社会、经济与政治关系的核心。约公元500年至1000年间，欧洲居民的绝大多数都生活于土地之上并直接耕作：他们的生活方式受到维持农业年节律所需的体力劳作的制约。同样重要的是，对地产的控制和对剩余产品的攫取，是个人与群体之间关系的核心。上一章已表明，中世纪早期的男女社会差别往往取决于对土地的不同权利；本章则承接社会分层的主题，探讨土地持有如何支撑起杂乱不齐的不平等等级。\n本章的核心论点是：对人的控制与对土地的控制无法截然分开。这种结合几乎是所有中世纪早期共同体政治组织的基本要素，因为领主权同时涵盖了二者，或分或合。牲畜、奴隶或土地的所有者，凭其行使于其上的权力而为领主。家长亦然，凭其对于家中从最卑微到最显贵的所有成员的权威而为领主。\n因此，领主权本质上是一种社会权力，根植于人际关系和对资源的控制，尤其是土地和牲畜。作为对主人、酋领、国王、皇帝或基督教上帝的称谓，“领主”一词承认了这种权力，暗含恭顺，并表达对居首位者的尊敬。因此，女性也可以是领主，只要她控制着庄园或以自己的名义进行统治。简言之，中世纪早期的不平等不仅是物质财富及其带来的生活方式上的不平等，也是社会影响力和政治权力上的不平等。\n我们的出发点是一个直截了当的观察：中世纪早期人们所形成的各种群体——无论是孤立的村落共同体，还是大型王国与帝国——都显示出资源、财富、法律权利和身份上的差异。这些不平等并不彼此整齐对应，因为法律权利并不保证物质财富，正如司法等级并不反映人们对身份的主观认知一样。尽管男女生活在一个支配与从属的世界里，这一梯度却从来不是井然有序或系统化的，除非在某些法典和条理化法律论著条分缕析的措辞之中。毋宁说，它源于支配他人的现实：居于底层者通过习俗与传统、法律约束与制裁、形形色色的依附与庇护关系、威吓行为与实际暴力，或仅仅出于恐惧，而屈从于居于上层者。\n“活儿苦得很，因为我不是自由人”：耕夫的哀叹提醒我们，土地、社会等级和权力的历史也牵动着自由与奴役这一动人心弦的问题。正因如此，这段历史常常引发争议。历史学作为一门学科，兴起于一个充斥着关于现代适当政治秩序之激烈论辩的环境中——绝对主义还是贵族政治，自由派还是保守派，资产阶级还是马克思主义。社会理论家、论战家与历史学家都在中世纪早期的过去中寻找他们所渴望的自由之先声、他们所反抗的压迫之根源，或他们所辩护的特权之正当性。在这种氛围中，他们构建出中世纪早期数个世纪的图式化、笼统化的概观，并轻易地将其视为农民自由的黄金时代，或是剥削与压迫的熔炉——也就是说，是此后人类生存“更好”或“更坏”阶段的前奏：这些旧日激情的阴影至今仍笼罩着关于中世纪早期农民的论辩。\n本书采取的进路有所不同。它假定经验的多样性是中世纪早期的特征。它不寻求关于土地、劳役与领主关系的统一叙事，而是循着中世纪早期史料本身流动的术语和多元视角，去探寻各种各样的地方性形态。通过考察广泛的政治结构——大帝国、小酋领、紧凑而集约的政体、发展中的王国——本章论证，地区差异与历时变化是所有中世纪早期社会等级的标志。本章从阶梯的底层开始，探讨奴隶制与农奴制以及自由的意涵。第一节论证，尽管自由与不自由之别具有根本性的法律意义，社会现实却远比这一整齐的对立所暗示的更为复杂。中间一节聚焦于围绕土地控制组织起来的社会不平等。通过考察触及农民生活的形形色色的领主权形式，它主张应对变化的局部情势与政治语境保持敏感。最后一节转向社会的上层，探讨高等级身份如何被认知、维系或受到挑战，以及领主权如何也体现政治关系。\n奴役与自由\n“除了自由人和奴隶之外别无他类”：这是一句罗马法律格言，查理曼在裁决父母一方自由、一方不自由的子女的身份时发现它颇为有用。3 与古代世界一样，自由与奴役之别仍是所有中世纪早期共同体中根本的法律分界。这是一对相反之物，是司法两极的彻底表述。最简单地说，它区分了生命与肢体不可侵犯之人，与身体安危及生存仍操于他人之手的另一类人。\n然而在实践中，奴役与自由并不构成两极对立。毋宁说，它们构成一个光谱的两端。依附有程度之分，自由及其带来的好处亦有程度之分，因为奴役与自由都是相对的概念。一条支配与从属的滑动标尺贯穿整个光谱：在其顶端，各种依附形式组织着精英与其统治者之间的政治关系；在其底端，则构建着对乡村劳动力的剥削。强加于不自由者身上的屈辱义务没有任何荣耀可言，而权贵为国王所尽的服务却增进地位与荣耀。二者都向上级提供servitium（服务）。在社会梯度的每一点上，服务与领主权都是一枚硬币的两面：不同的只是其形式与社会价值。无论如何，依附与自由与其说是单一的概念，不如说是一束束限制与特权，可以以许多不同的方式组合在一起。其中突出的有：迁徙自由；对自己身体及其劳动的控制；携带武器的权利；诉诸法庭的权利；财产所有权；结婚或继承的权利；对自己子女的承认；以及追求荣耀。每一项都可通过司法程序、习俗或社会评价，以不止一种方式被剥夺或被承认。\n然而，关键在于，其中一项欠缺并不意味着所有欠缺都随之而来。无论我们看向何处，都会发现大量的中间身份，将自由的某些方面与不同程度的依附结合在一起。这些身份无法归类；正如在许多其他方面一样，最好还是承认本地实践的无比多样性。出身奴仆却可身居高位，这是可能的，例如八世纪巴伐利亚的adalschalks（“高贵的非自由人”），以及十世纪末、十一世纪初德意志的ministeriales（仆役骑士）。这两个群体都缺乏法律上的自由，却为其领主履行荣耀而需要技艺的服务。自由却处于依附地位，这也是可能的；我们稍后将会见到一些自由人的例子，他们每年向大教堂或修道院缴纳款项，以承认其领主权。4 这类情况的一个变体是十、十一世纪英格兰西部的骑行者（radcnihts、geneats）。这些是有财产的依附者，富裕到足以拥有马匹，例如蒂德纳姆巴斯修道院地产上的那些人，其义务包括“骑马、提供运送服务、供给运输、驱赶畜群以及做许多其他事情”。5 他们与那个女奴的境况相去甚远——那个女奴的领主本人是个不自由的农民，却对她进行性剥削——这暗示了女性所遭受的从属处境甚至比男性更为悲惨。\n查理曼致其官员的备忘录使用了自由人与奴隶的传统用语：liber与servus。前者相对直白：liber享有各种自由权（liberties），即行使某些权利的自由，无论其经济状况如何。后一个词则是出了名的难以界定。servus在古代的意义是 chattel slave，即财产奴隶，是主人占有之物，通常在战争中被俘并从远方贩运而来，当其劳作生涯结束时，会被另一个人类“进口品”所取代。在中世纪早期的进程中，它逐渐意指不自由的农奴：虽被承认为人，但权利极为有限，且通常世袭地束缚于其劳作的土地之上，其后代日后也将在这土地上劳作。然而在这一时期的大部分时间里，这个词既可以指前者，也可以指后者，或兼指两者。新的意义并未取代旧的意义，而各个作者对这个词语的确切用法也并不总是前后一致。语境也并非总是可靠的指南。造成这种语言上的不精确有两个主要原因：第一，其古代意义规定的是一种司法身份，而中世纪早期的文本通常用这个词描述一种社会经济状况而非法律状况。其次，其意义的转变与领主使用依附劳力耕作其地产的方式的变化密切相关。基于这两个原因，它留下了关于中世纪早期经济能否被归类为“奴隶经济”的争议残余。\n这场论辩并无助益，原因有几个。重要的是，它有可能把这几个世纪的社会关系与农业经济化约为单一的、范式化的模式，并且妨碍人们领会即使在一个局部地区也并存的依附与不自由的多种形态。它还使人们的注意力从一群在许多地方无疑十分重要的人身上移开——即自由农民所有者，他们在史料中往往难以追踪，除非在他们把土地或部分自由让渡给领主的那一刻。此外，它倾向于抹去拉丁语和各地方言中通常用来指依附劳动者的许多其他词语——这些词或者单独使用，或者与servus连用，并各有其流动的含义。\n但最重要的一点是：尽管奴役的词汇几乎未曾变动，其社会与政治维度在中世纪早期却与古代世界大不相同。罗马帝国在意大利及其他地中海行省的一些庞大农业庄园，曾由大批输入的奴隶成队耕作，他们被安置在兵营般的条件下，被剥夺了一切家庭生活，但这种剥削与人格贬损的方式在四世纪之前已然消失。被安置在各自地块上的四、五世纪奴隶，在两个方面日益类似于被束缚的依附农民：他们被承认为人而非物；以及他们贫困的经济状况、社会屈从地位和可继承的身份。然而，一套陈旧的司法词汇依然存在，散发着昔日气息，与较新的社会经济现实并不相符。\n当中世纪早期的记载开始较为详细地向我们展示领主权与从属关系的典型形式时，农业奴隶制在后帝国时代的诸行省已成往事。在大陆的基督教地区，唯一能见到的奴隶是在贵族家庭和高等级的城市宅邸中，他们充当家仆或 skilled craftsman（技艺工匠）。相比之下，在英格兰，农业奴隶制与其他形式的奴役并存，社会实践与古英语词汇都表明了这一点。在不列颠群岛的其他地方及斯堪的纳维亚，奴隶制构成了非自由劳动力的主要来源，其供给靠劫掠与购买来补充。这种制度一直延续到1066年之后法国北部的征服者把他们自己的农业剥削传统和长期以来反对贩卖人口的道德约束带到英格兰，到该世纪末带到威尔士，最后在1169年之后带到爱尔兰。奴隶贸易的终结指出了中世纪早期农奴与奴隶之间的一个实际差别：尽管二者都可在田间劳作，但前者通常仍被束缚在其出生的特定地产上，并随土地一同被转让。而后者也可以在市场上被买卖，并被驱使到远离出生地的地方劳作。\n无论是奴隶还是农奴，不自由的人口以各种方式进入领主的支配之下。这些方式不仅揭示了臣服的严酷现实，也让我们得以了解中世纪早期生活中的某些不安定与不确定因素。许多人从出生起就隶属于某位领主，仅仅因为他们的父母也是如此：从领主的角度来看，当跨越法律鸿沟的性关系或婚姻——这是常有的事——产生出必须确定其身份的后代时，自由与奴役的区分才最为重要。对领主而言，问题的关键在于保持对劳动力的控制。有些人因犯罪而丧失自由，因为他们无力凑足应缴的赔偿金；我们还遇到过另一些人，在极度的困苦和饥荒之下，他们将自身卖为奴役，把沦为奴隶当作换取少许粮食乃至某种庇护的可接受的代价。6\n在战争中站错一方可能导致被俘和奴役；事实上，在基督教欧洲的周边地区，战争与掳掠奴隶是不可分的。“我在边境之外俘虏了这个奴隶，当时公爵正率军出征”：这份声明在八世纪的巴伐利亚足以作为所有权的证据。7\n一个人可以在自由与奴役之间来回变动，有时一生中不止一次。身份的改变也会波及后世，正如这份十世纪末英格兰北部的感人文献所见证的：“ Geatfleda 为了对上帝之爱和她灵魂的缘故，[给予]铁匠 Ecceard、Ælstan 及其妻和所有他们已生与未生的子女，以及 Arkil、Cole、Ecferth [和] Aldhun 之女，还有在那邪恶的日子里她曾以自己的名义供给食物的所有人，以自由。”8 这些忍饥挨饿的男男女女曾俯下身来，把头置于 Geatfleda 的双手之间，象征他们臣服于她的领主权；作为回报，她供养了他们。后来，她在达勒姆大教堂的祭坛前，以另一种同样具有象征意义的仪式解放了他们。\n解放奴隶（manumission）在整个基督教欧洲都有实行，并受到神职人员作为一种虔诚行为的鼓励，这可能是个人法律身份被改变的最常见方式。然而，解放仍是一种领主权力的行为，在宗教意义上，受益的是主动发起解放的领主本人。在法律意义上，它免除了不自由者所承受的若干不利待遇。在欧陆，罗马的文书格式广泛可得，新获自由的人手握特许状，或可被称为“特许状之民”。相反，在不列颠诸岛，解放的记录通常写入福音书中，并诉诸神明的制裁来维护其效力。九世纪初，Bleddri 的四个儿子就是这样做的，他们授予 Bleiddudd ap Sulien 及其后裔“永久”自由。在威尔士大兰代洛（Llandeilo Fawr）圣泰洛教堂所藏的一部古老福音书的页边，他们声明：“凡维护此项授予 Bleiddudd 及其诸子之自由者，愿他蒙福。凡不维护此权利者，愿他被上帝和圣泰洛诅咒——本声明正是写于圣泰洛的这部福音书中。”9\n另一些时候，自由身份并非来自领主，而是源于农奴自身的行动。关于起义的记载极为罕见，但关于个人逃亡的提及则常见得多。有时，当地教会提供庇护——在这种情况下，逃亡很可能是与领主重新谈判的前奏。另一些时候，附近的边境提供了机会，而规范王国边界的协定有时明文规定归还逃亡者。此外，任何协助和唆使逃亡男女之人都要受到严厉惩罚。既然迁徙自由本身就是自由人的标志之一，成功地迁往新的地区就可能改变一个人的身份。较少见的是，人烟稀少地区的有魄力的领主会向所有前来定居的人提供自由：例如，880 年，塞尔达尼亚伯爵威弗雷德向所有能够逃离主人、前来比利牛斯山以南边境地区卡多纳定居的奴隶或农奴提供了自由。\n赢得自由值得付出毕生积蓄，或冒逃亡的危险。捍卫自由甚至可能值得杀死一个可能否认自己身份的不自由亲属：查理曼规定，凡是采取如此极端手段者一律处以死刑，并进一步命令其自由亲属也一并沦为奴役。但自由也可以通过诉讼来捍卫，尤其因为自由人的特权之一就是能够进入王室法庭。自由还赋予携带武器的权利。然而，自由并非全是好处。它很可能带来更大的不安全感，而非生活条件的任何改善，因为灾荒之年，独立的自由农民几乎不可能从领主的粮仓中得到施舍。因此，获得法律自由的农民常常重新谈判出另一种形式的从属关系，以换取领主的持续庇护。自由在法律上的好处与经济上的不利可谓势均力敌，因为自由与奴役之间的区分按某些标准来说是轻微的，按另一些标准来说却是巨大的，这使得两种身份之间的社会屏障是可渗透的。\n原则上，获得自由降低了遭受伴随从属地位而来的暴力的风险。法律常常规定，农奴或奴隶因偷窃、毁坏财物或破坏和平而被处以截肢、鞭笞甚至死刑，而自由人则相应地处以金钱赔偿，尽管若无力支付，他们也可能被降为奴役。然而，在法律条文的遥远世界之外，还存在着一种更为切近的习惯性暴力文化。偶尔，法典本身也会提及这种暴力，如巴伐利亚的这一条款：“若有奴隶妇女人任何人残害而致流产，若胎儿尚未胎动，应赔偿四索里达；若胎儿已经胎动，则应赔偿十索里达。”10 不过，更常见的是，基督教道德家的疾呼让我们意识到这种暴力的普遍存在。奥尔良主教约纳斯（818–843年在任）在约820年提醒马特弗里德伯爵：只有人类社会才在人与人之间制造不平等，而所有人在出生之时都是一样的。“那些因奴隶的过失而被激怒、勃然大怒、狂怒不止，或者以野蛮的殴打惩戒他们，或者砍断其肢体致残的领主们”，不应误以为自己可以逍遥法外——而应记着天上只有一位上帝。11 这样的主人很可能不太在意不自由的农奴与他所解放但仍依附于他的人之间的法律区分的细微之处。当极端的臣服生活意味着生活在暴力的阴影之下——对妇女而言，还有性剥削的阴影——时，法律身份的精确界定恐怕意义不大。\n为了缓解等级世界较为残酷的现实，古代晚期的教士们宣扬负责任的权力伦理，并将其与精英获得基督教救赎的希望联系起来。其中一个方面是强调慈善捐赠的救赎效果。贝尔特希迪斯（Bertechildis）是莱茵河畔宾根一位显贵的妻子，生活于六或七世纪的某个未知时期。她汲取了这种精神，当她年仅二十岁、婚后仅一年便去世时，人们在她墓上刻下了铭文。铭文纪念她虔诚的慷慨：“深受民众爱戴的她，为了自身罪孽的缘故，向寡妇、孤儿和穷人施舍赈济。”12 这类关于俗人施舍的直接见证十分罕见，但它揭示了我们已知普遍存在的现象：一种赋予穷人帮助富人得救之角色的观念。通过接受施舍，穷人帮助将救赎的天平向富人倾斜。\n中世纪早期主教和道德家们继续想当然地接受 pauperes（“穷人”）的存在，这里不仅指寡妇、孤儿和贫困者，也包括所有容易受权势者剥削、缺乏领主权资源以维护自身利益的人。从九世纪起，他们扩大了所劝勉的 potentes（有权势者）对穷人应负的责任。后者虽无法消除社会不平等，却可以保护穷人；以公平价格、不作量器舞弊地购买农民的葡萄酒和谷物；并向赤贫者施舍——如此，便可拯救自己的灵魂。\n于是，奴役与自由之间的区分具有社会的和道德的维度，其重要性不亚于任何法律上的差异或经济现实。它在法律理论上是分明的，但在社会实践中却是高度可渗透的，一方蕴含着成为另一方的可能。领主权处于这种关系的核心，因为奴役以支配为前提，而臣服并不限于法律上不自由的人。所有中世纪早期的道德家都接受权势者与穷人之间的鸿沟。他们只是劝勉各方各尽其被指定的角色，并尊重每一等级的权利。在理想世界中，不自由者劳作以供养自由者，领主则保护并捍卫所有人：\n因为没有不自由者，自由人无法生存。\n当人们真正指望某项工作完成时，\n国王和主教们似乎在为他们的农奴服务。\n领主由农奴供养，而本应是他供养农奴。\n在基督教的道德经济中，领主权建立在对权力的审慎运用之上，因为它在带来权利、特权和财富的同时，也带来了社会责任。但写下这些诗行的年迈的拉昂主教阿达尔贝罗（977–约1031年在任）在十一世纪初也心知肚明。他紧接着补充道：\n不自由者的呻吟与泪水没有尽头。13\n在隆冬严寒中不敢在家中逗留片刻的耕农想必会深表赞同；而且，既然在农业经济中，领主权依赖于对土地的开发利用，我们现在就转向这个问题。\n农民与领主\n那么，围绕生产农业剩余产品的需要，社会关系是如何组织的？在实际操作上，农民的劳动如何支撑领主的地位？领主权的社会和经济现实又是怎样的？四世纪作家帕拉迪乌斯的一句话提供了有益的起点：“既然土地类型如此繁多，便不可能有单一的劳作组织方式。”14 帕拉迪乌斯以不同的土壤和气候来解释这种多样性；我们还应当补充：做法因大地产与小地产而异，而且随时间推移也在变化。古代晚期和中世纪早期的土地保有制的特征是区域性和地方性现实的纷繁多样，我们应当时刻牢记这一点。\n多样性的一个方面是规模。小规模土地占有十分普遍但分布极不均衡，在文献中大多只在教会机构接管小土地持有者的部分或全部财产时才可见。大规模土地占有只有在大型政治体之内才有可能，而帕拉迪乌斯此语的背景正是罗马晚期精英土地占有的巨大规模。五世纪初，帝国西半部元老院贵族的某些成员在地中海各地拥有大片分散的地产，但随着那个世纪中日益加剧的不安全和西部帝国统一罗马统治的逐渐瓦解，他们的地产财富受到侵蚀：后帝国诸王国的建立伴随着财产占有规模的萎缩。\n罗马在西部的统治终结还产生了其他影响。在古代晚期，各地区的城市土地寡头（库里亚勒斯，curiales）负责向小地产所有者和独立小农征税，并将其税款上缴国家。他们作为中间人的角色使其得以通过敲诈勒索、威胁或虚假的慷慨来扩展自己的影响。阿尔勒的凯撒利亚如此描述六世纪初普罗旺斯发生的事情：\n如果[富人的]邻人是个穷人，被迫到了非卖不可的地步，或者可以被施压强逼出卖，他的目光便转向那个方向，指望能夺走其穷邻人的地产或佃农。于是他给对方制造麻烦。例如，他暗中说服当权者让税吏纠缠此人，或指派他担任某种足以倾家荡产的公职。……在必需品的驱使下，[穷人]去找那个因其恶行而正在压迫、折磨他的富人，却不知道自己正是因他的所作所为而受苦，对他说：“主啊，我求你借给我几枚索里达，我急需用钱；我正被债主围困。”\n在试图借贷未果之后，穷人最终被迫变卖一切。“富人则表示愿意帮助他这位所谓的朋友”，并以远低于土地真实价值的价格买下了穷人的产业。15\n当有势力的地主将自己插在地方民众与国家之间时，自由农民和所有者都发现他们的独立性受到侵蚀。他们的缴纳逐渐演变为习惯性贡赋，而在此基础上，大地主得以逐渐把他们拉入更为严格界定、更为从属的依附地位。从小自由农到依附农民的转变几乎不可逆转；六至十一世纪间，大地产处处扩张，而小人物纷纷败落。\n这一进程还以另一种方式加速。五、六世纪的不安全模糊了四世纪并行的文职与军事职业队伍之间的差别。常备驻军让位于农民民兵，土地所有者开始在入侵和不安全时期向佃户提供武装保护——或者自己干起保护费的勾当。为确保自身地位，地主变成了军阀。而且，继418年哥特武装队伍在阿基坦定居的先例（图0.2）之后，几支源自帝国边境以北的军队在各自首领的率领下被安置到西部罗马行省的乡村，起初或许只是抽取乡村地产所产生的一部分税收，但迟早会发展成拥有土地的军事精英。这进一步强化了领主对依附者和邻人的控制。 thus，贯穿整个中世纪乃至以后欧洲社会特征的社会精英与军事领导权之间的结合，便是在罗马政治秩序解体所带来的迅速变革中确立起来的。\n农民与领主之间的关系总是隐含着一个更广阔的政治环境。兵役、王室恩庇，以及有时额外的财政摊派，对进入统治者随从行列的显贵们有直接影响。间接地，农民也感受到其冲击，因为领主权的压力以各种方式向下传导至他们身上。七、八世纪西北欧定居模式的变迁暗示了更严密的领主控制，可能伴随着对更多产品缴纳和更高捐税的要求，以及专业手工业品生产的增长。农民必然受到不利影响，尽管细节已难以考明。到八世纪末，领主普遍开始要求直接的劳役，在加洛林核心地带固然如此，在其他地区或许也是。虽然农民始终承受着生产超出自身温饱所需之物的压力，以便领主能从剩余产品中获利，但地产管理的趋势仍有变化，到十、十一世纪，许多领主似乎更偏好实物地租和实物缴纳而非直接劳役。\n除了这些概括性的情况之外，我们对中世纪早期世俗土地占有的细节所知令人沮丧地少，因为没有任何俗人的或王室的产权契据、特许状、地籍册或地产备忘录合集完整保存下来。俗人签发的文件通常只有在当人们向教会捐赠财产时，凭据文书便随之产生。得以留存至今的档案都属于大教堂和修道院：正如下文所表明的，我们对于土地所有权和土地开发所拥有的最全面的视角，本质上是一种教会的视角。不过，在论述过程中，我们仍可留意世俗领主与其农民之间的关系。\n凡是基督教得以确立的地方，各大教会自四世纪起便不断获得土地。早期阶段极难详细追溯，部分原因是纸草——晚期古代主要的记录材料——极易损毁。然而可以确定的是，虔诚捐赠的比率自八世纪初急剧上升，这是因为家族资源处置策略发生了转变，而对身后宗教纪念的追求也变得更加迫切。伴随这股高潮而来的文书意识的普及，恰逢基督教欧洲许多地区转用极为耐久的羊皮纸作为书写材料，因此，从八世纪开始，尤其是欧洲大陆上，世俗捐赠与教会土地持有变得远远更易察见。\n到九世纪，加洛林帝国大约三分之一的耕地属于教会，尽管各地区差异很大，而且并非所有这些地产都被长期保留。在英格兰，诺曼征服前夕的比例与之相近——约占全部土地的四分之一。这些虽不精确却仍令人瞩目的数字，有几层值得注意的含义。\n首先，随着教会土地财富的增长，教会成为景观经济组织及其居民的核心。教会地产上的区域专业化——例如葡萄酒、盐或羊毛，以及布匹、陶器等手工业制造——极大地推动了区域和跨区域贸易。教会从其财产中获得的财富也使其政治影响力日益增长。任何对领主权的研究都无法忽视这一制度性维度。\n其次，世俗地产在每一任所有者死后往往面临重新分割、重新分配和争夺，而教会地产则通常享有持久的制度性所有权。诚然，国王和地方权贵偶发的、零敲碎打的掠夺造成过损失，但即便如此，一个因侵占某座教会土地而声名狼藉的领主，往往会被另一座教会作为慷慨的恩主加以纪念。另一种较轻的损耗来自租佃权世袭化的倾向；要遏制这种悄然的侵蚀，需要持续的管理警惕和坚定的意志。然而尽管如此，教会地产总体上仍是租佃关系流动性之海中相对稳定的孤岛。依靠精心保存的地契档案所形成的长久的制度记忆，教会土地的持久性远超中世纪早期的世俗地产。\n最后，由于教会是在帝国的庇护下发展成有产的制度的，它们按照晚期罗马财产法运作。中世纪早期，基督教传教士无论走到哪里，都携带着罗马法关于完全所有权的个人产权预设、书面文件形式和专业术语。这些往往与传统财产关系相冲突，尤其是在土地权利与亲族成员身份紧密相连、并通过口述传统保存于社会记忆之中的地方。从罗马城本身的山地腹地到爱尔兰起伏的丘陵，中世纪早期文书中罗马化的语言常常掩盖了那些已大大适应本土惯例的租佃习俗。\n因此，出于种种原因，领主与依附劳动者——无论奴隶、农奴还是自由人——之间的关系并不遵循任何单一模式。有些习俗相当普遍，但不存在某种规范或典范制度。多样性、流动性和演变是中世纪早期地产的标志，我们必须认识到这一点。由于这一系列实践既难以概括呈现，也难以找到代表性实例，以下将选取一个单独个案研究来说明这种多样性。\n所涉及的地区是佛兰德斯北部，详见图5.2。该地区恰好位于前罗马边境线之内，横跨中世纪早期（以及现代）日耳曼语与罗马语之间的语言边界地带。目前我们关注的是一个约创建于629至639年间、奉献给圣彼得的宗教团体。其所在地名为布兰迪尼乌姆的山丘，俯瞰斯海尔德河与莱厄河交汇处的古老罗马定居点根特，靠近后来在九世纪发展出贸易中心的地点。\n第5章所涉主要地点\n……即第九世纪将出现贸易中心之处。与大多数修道院一样，它经历了产业积累的时期，也经历了停滞或流失的时期。这些波动通常与“改革”周期相伴出现——即对教会礼仪和其成员行为规范的全面整顿，旨在拉大宗教生活与世俗生活之间的差距。几个世纪以来，根特的圣彼得修道院经历了数次这样的改革；从留存下来的文献中，我们可以追溯佛兰德斯这一隅领主权模式的变迁。\n9世纪佛兰德斯的土地所有者\n圣彼得修道院最初由国王达戈贝尔特（623–639年在位）捐赠了其附近的一块土地，之后逐渐在斯海尔德河和莱厄河上游获得其他地产，并在北面的森林以及更远处的沿海盐沼中获得产业。如图5.2所示，其土地规模不大，而且几乎全部位于修道院教堂30公里范围之内——这与许多地产散布极广的其他修道院不同。此后的墨洛温王朝诸王似乎对这座新教会失去了兴趣。到八世纪，当相互角逐的权贵势力争夺对高卢北部的控制时，圣彼得修道院曾试图保持中立，但未能成功。或许不可避免地，它被卷入了其中一方的庇护之下，但似乎因此失去了部分土地。\n王权控制在查理曼统治时期得以重新确立。对根特的圣彼得修道院而言，一如对许多其他修道院和大教堂而言，加洛林领主权使其在任何诉讼中都能直接诉诸宫廷。此外，在其自身领地内，修道院院长取代了地方帝国行政和司法官员：实际上，他成为了国王在此的代理人。同样地，加洛林的控制也意味着脆弱性与义务，这在虔诚者路易于815年任命一位新院长时便显现出来，其任务是“改革”这个团体。此人就是艾因哈德——忠实的廷臣、著名的查理曼传记作者，而且是位在俗者。他代表着王室在这一宗教团体内部的领主权，是皇帝汲取修道院财富的渠道。尽管艾因哈德为个人或帝国利益经营着修道院的部分地产，他仍专门划出特定土地，用以维持居住在圣彼得修道院的二十四名教士的生计。他仔细登记了他们的份额，相关文献揭示了这一特定教会团体是如何组织和开发其土地的。\n虽然艾因哈德或其九世纪的某位继任院长向教士兄弟们划拨了一处位于南方近50公里外的田庄，但他们的土地大部分紧邻修道院本身，是一个由耕地、割草草甸、养猪的林地以及一小块葡萄园的一部分组成的适度产业。与此相连的是沿海盐沼中的偏远牧羊场。所有这些被称为 terra indominicata，即直领地，意指它将被直接耕种以为其领主谋利，在这里即圣彼得修道院团体。教士们还被划拨了更大的一块土地，紧邻其直领地，这块地原本属于七世纪最初的捐赠。它当时如何组织经营已不得而知，但显然到九世纪初，租佃安排已发生了相当大的演变。到那时，它已被划分为若干单位，每个单位由一名依附劳动者耕种，此人须履行特定义务。\n让我们来看一个特定的依附者——福尔克里克，他持有一份土地，即一个曼苏斯。每年他须向修道院缴纳定量的面包、啤酒、猪、木柴、屋顶木瓦、亚麻、鸡蛋和谷物。此外，每隔第三年，他在收获季节缴纳两索里达（合24便士），以替代他为直领地出劳役；在间隔的其中一年，他另行缴纳两索里达以资助修道院的军事开支；在另一年，他无须缴纳现金，只须缝制一件衬衣。由于我们既不知道福尔克里克曼苏斯的面积，也不知道他是否有妻子儿女帮忙，我们无法估计这些义务的沉重程度，也无法计算会有多少产品剩余下来供养他自己和家人。但我们可以肯定，管家会确保教士兄弟们获得稳定的面包、啤酒和其他产品的供应；而他们的管理手段会包括欺诈、勒索和鞭打。\n福尔克里克的日常劳作必然局限于他耕种的田地、他前往砍伐和运送木柴的树林，以及他收割的亚麻——（大概）由他的妻子织成亚麻布再制成衣物，但他仍然是一个更大、更复杂的经济体的一部分。在查理曼时代，他的前辈可能曾被课以直领地上的劳役，但即使如此，到福尔克里克的时代，这些劳役已被折算成现金缴纳。在八世纪末和九世纪，依附农民常常须在地产的直领地上服劳役（繁重程度不一），从而将地产的各部分整合起来，但这远非普遍现象。领主可能改而索要现金，以更有效地开发其土地并提供更灵活的收入。但只有当农民能够进入市场、以少量剩余产品换取银便士时，他们才能这样做。由于居住在日益繁荣的市场中心根特附近，圣彼得修道院的依附者显然对此毫无困难，尤其是在840年后那里设立王室铸币厂之后。\n在福尔克里克的田地之外，在地方市场之外，在修道院对他生活的控制之外，王权也发挥着自己的影响。通过每三年缴纳两索里达以支持圣彼得修道院的军事义务，福尔克里克为法兰克军队的开支作出了贡献。尽管九世纪征兵方式的细节仍有争议，但大型教会土地所有者和世俗贵族都必须提供分队。每支队伍的核心大概都是土地所有者（就教会而言则是其在俗代表）及其重装骑兵扈从。军事义务的影响在圣彼得修道院可见一斑。直领地草甸每年生产的五十车干草足以供马匹过冬，直领地部分田地种植的燕麦也是如此。从佃户处收取的部分木材，可能被用于维护810年在根特建造的沿海防御舰队。那么，院长是否将修道院众多依附者各自缴纳的小额款项汇集起来，用所得购置所需的装备、驮兽和战马，以便派遣重装骑兵出征？抑或他与王室约定定期缴纳一笔整款，以代替实际派兵？从福尔克里克的角度看，这无关紧要：他只须照章缴纳。以这样或那样的方式，修道院的领主权在他与统治者之间充当了中介。\n另有约二十四名依附者各持有一个曼苏斯，条件与福尔克里克相同或相似。在艾因哈德任院长期间及其后，圣彼得修道院又为教士自用获得了若干土地，它们按同样的直领地加依附租佃的基础加以组织。这些捐赠的记录表明，随土地一同转让的还有其上的劳动力，农民从捐赠者的领主权转归受赠者。这些男女只能被描述为处于奴役状态。他们的子女随其而来，并继承其身份。到九世纪末，他们对修道院极度从属的标志更加清晰：除了每年的义务外，他们还须在结婚时缴纳一笔款项，在死亡时再缴纳一笔。因此，圣彼得修道院的支配具有三个主要特征：它是家父长制的，因为它触及修道院大家庭的所有成员；它是家产制的，因为它施于修道院的全部土地产业；它是强制性的，因为它无可回避。无论领主是教会、世俗领主还是国王，这些都是中世纪早期一切领主权的三个主要特征。\n其他男男女女与圣彼得修道院的关系则截然不同。直领地由二十九名未婚者耕作——年轻的男女以及几名挤奶女工，他们未被分派单独的地块，想必住宿在修道院的附属建筑中。无论我们称之为农奴还是奴隶……并不影响他们完全依附的地位。而在另一个极端，有些人则与修道院保持着松散得多的、也更体面的关系。若干“自由人”只需缴纳可观的现金款项，外加有限的实物贡赋，通常是啤酒。他们可能以某种我们无从得知细节的方式持有佃地；也可能是小自由地产的所有者，其土地原先处于对国王的松散从属之下，如今改为向修道院缴纳习惯性贡赋。教会的领主权对这些人的束缚相当轻微，但圣彼得修道院仍然主张对其土地及其收益的权利。\n教士与某些近期捐赠者之间的关系则又不同。诺德贝特便是一例：他购买了一份地产并将其赠予圣彼得修道院，但随后在830年，他与艾因哈德达成安排，继续占有并从该土地中获利，只需每年象征性地缴纳两便士，以示承认修道院的领主权。只有在他死后，教士们才能取得直接控制权：在那之前，诺德贝特与教士们对该地产拥有重叠的权利。这样一种安排是对教会有利的，即所谓“恩惠”，此类土地通常也被称为“恩地”（benefice）。这些好处应是社会性和政治性的，而非经济性的。诺德贝特是否充当过艾因哈德院长的武装护卫，或在圣彼得修道院的部队中作战？他是否在地方事务中运用影响力来保护并扶持修道院的利益？艾因哈德是否曾利用自己的地位帮助过诺德贝特？我们将在下一章看到，他确实曾这样帮助过自己的其他亲随。这些推测只是反映了我们对九世纪其他地区类似恩地的了解，但同时也提醒我们：领主权不仅关乎土地经营，也关乎个人忠诚与政治服务。它构成一个连续的光谱，从经济剥削，经过社会纽带，延伸到政治庇护。\n因此，根特的圣彼得修道院团体与其依附者之间的关系并不符合任何单一的简单模式。土地及其劳动力的组织方式多种多样。像艾因哈德这样精明的院长行事灵活，在追求效率与尊重地方惯例之间寻求平衡。可得的自然资源提供了一系列机遇与限制，市场之可达——或偏远——则提供了另一系列。对修道院而言，对某些男男女女课以沉重的贡赋和义务，而对另一些人则宽松得多，这都是合宜的。有效的领主会随经济、人口或政治形势的变化而调整应对之策；领主们的决策，无论是个人的还是集体的，都参与塑造着一个不断变化的社会。\n圣彼得修道院的土地在整体上如何融入北佛兰德斯的土地占有格局？附近还有其他大土地所有者，尤其是位于根特城内、富裕得多的圣巴沃修道院，其土地沿斯海尔德河和莱斯河上下游延伸，与圣彼得修道院的土地犬牙交错。不过，当地大部分地区由小地产者主导，每个男人或女人只拥有几块小块田地，依靠一两个依附者、至多五六个依附者的协助耕作。土地的零散化是常态：较富有的所有者的地产散布于多处。总体效果是，从林地中开垦出的小块田地和草场拼缀而成，河流沿岸则分布着水草场。而这些农民地产者向圣彼得修道院作出小额捐赠时，修道院在这里得一田、那里得一地的累积，也为不断变化的景观增添了新的要素。\n莱斯河与斯海尔德河谷极宜种植亚麻，并以其高度集中的亚麻布生产而著称。在佛兰德斯的其他地区，自然环境及其开发方式则有所不同，如图5.2所示。在北面的沿海盐沼、泥炭沼泽以及斯海尔德河口各岛屿上，圣巴沃修道院拥有的领地规模之大，每处足以养活上千只羊。也许像更北面沿海弗里西亚一带经营牧羊业的修道院一样，他们对这里的农民要求甚少，只要求每年缴纳成品的布匹，因为畜牧经济通常催生截然不同的领主权形式。\n在东北方向，以及南面沿斯海尔德河而上图尔奈周围的地区，分布着埃贝哈德与吉塞拉将在遗嘱中分配的部分土地。16 这些是大规模、精耕细作的农业地产，极有可能数百年间一直属于王室领地，直到吉塞拉的父亲虔诚者路易将其划归她作为嫁妆。它们实行混合农业制度，生产多种谷物，同时饲养牛、大量猪和若干羊，还有家禽——甚至孔雀。\n同样在西南方向，圣贝尔坦修道院是另一大土地所有者。在佛兰德斯南部起伏和缓的乡野，圣贝尔坦拥有庞大的谷物种植地产，其租佃制度在九世纪上半叶已得到系统化。这座修道院的农民与领主的关系比根特圣彼得修道院的农民更为沉重。除了规定的款项和贡赋外，每一份曼苏斯（mansus）的持有者还须在修道院的自营地上服劳役：身份为奴者每周三天，自由者每周两天。这是耕种大面积谷田最有效率的方式。即使这里曾有独立农民地产者的农庄，到九世纪中叶也已消失，被其强大的教会邻邦吞并了。\n我们可以让佛兰德斯的这一隅作为早期中世纪乡村社会整体的缩影。它展示了农耕经济与畜牧经济的相互作用：虽然二者在整个欧洲范围内互为补充，但很少有哪些地区像佛兰德斯和弗里西亚沿海那样高度专注于养羊，或像从佛兰德斯向南延伸至巴黎盆地的谷物种植地产那样专注于种粮。区域间贸易重新分配了各地的盈余；在其他地方，酒或盐等其他区域性特产也被运往相当遥远的市场。佛兰德斯还提醒我们林地——在这里既出木材又为猪提供饲料——的经济重要性。而最重要的是，它展示了租佃制度如何适应不同环境。在这一特定地区，对依附劳动的控制形式依畜牧与耕作的不同需要而各异；在地中海欧洲，葡萄和橄榄的种植则以其他更适宜的租佃形式为特征，而在下一章，我们还将在爱尔兰的牧牛之乡遇到截然不同的形式。\n在整个欧洲，领主们尽其所能地开发利用当地的自然环境，通过在本地可能性与自身不断变化的优先事项之间取得平衡来控制农民及其他依附者。但我们也应记住，他们同样回应着更广阔的政治环境。艾因哈德对根特圣彼得修道院的管理是加洛林帝国鼎盛时期的典型写照：当时王室庇护是台发电机，暂时将流动的区域性领主网络转化为一个异常庞大的政治体。然而到九世纪末，法兰克政治体陷入危机，其原因是王室王朝内部对权力的争夺，随后又迅速出现男性继承人的匮乏。九世纪中叶，国王之子太多，人人都觊觎一个王国；而到世纪末，却又少到不足以维持现有的次王国。随着这台发电机运转失灵，区域精英转而寻求别的权力经纪人，并重新组合成多个更小的政治体。\n佛兰德斯便是其中之一，其伯爵与最后的加洛林人——十世纪的西法兰克国王——有姻亲关系和共同的政治利益。到九世纪末，根特崛起为中央要塞，伯爵们以此为根基统治一个新兴的政治体，其权力建立在当地一座新建的木制城堡之上。在其势力范围之内，他们的行事方式与加洛林人在其帝国内的权力经纪做派如出一辙，并成功地在其区域内对庇护——土地、官职和荣誉——的涨落保持了有效掌控，直至十二世纪。\n牢记这一点，我们可以回到圣彼得修道院的教士、附近的世俗土地所有者和农民，考察变化的政治环境如何影响农民与领主之间的关系。940年代的又一轮“改革”留下了一批文献，不仅表明有待收回的失地，也昭示着一个迅速变化的世界。此时圣彼得修道院由阿努尔夫一世伯爵（918–965年在位）以保护人和俗人院长的身份执掌，而根特已成为迅速发展的城镇。例如在941年，阿努尔夫伯爵对圣彼得修道院的捐助就包括城中房屋的收益和对经过港口货船征收的税金。城外，景观也在变化，领主权获得了一种新的、商业性的维度。磨坊不断兴建，羊只在整个佛兰德斯大量饲养：圣彼得修道院从中兼获其利。随着十、十一世纪的推进，阿努尔夫的继任者大力推动林地的开垦和沿海洪泛平原的排水。\n我们可以推知这对佛兰德斯农民的意涵。他们发现自己参与到一个日益扩张的货币经济之中，因为领主此时更偏好金钱缴纳而非劳役或实物贡赋。磨坊意味着家庭磨谷的终结，也意味着农民劳动力——通常是女性劳动力——得以解放去从事其他工作。但磨坊也意味着使用须付费的义务，这是领主“习惯权”扩散的一个例证，造就了新的依附形式。土地开垦意味着人口增长、与领主交往方式的改变，以及一定程度的乡村流动性。必定还有其他农民干脆离开了乡村，因为根特及其他佛兰德斯城镇的迅速增长只能源于乡村移民，伴随着移民带来的种种失序效应。留在乡村的人则须参与生产足够的粮食，以养活城镇居民，同时也养活自己的家庭和领主。最后，城市手工纺织业的出现引入了新的劳动与领主权形式。\n通过这种种方式，佛兰德斯农民受到更广泛的经济潮流，以及圣彼得修道院和佛兰德斯伯爵们不断变化的领主权的影响。尽管这些发展为根特周边地区所特有，但各地的农民都被卷入并受制于领主“习惯权”的扩散以及精英之间不断变动的政治权力网络。我们不能在此之外再作概括而无视这些习惯权的巨大多样性，因为所有领主，无论世俗还是教会的，都推行各自偏好的技术，从土地上榨取剩余以维系其领主地位。殊途同归这一点，对同时代人来说并不足为奇。毕竟，一位十一世纪早期的盎格鲁-撒克逊庄园管理论者在概述了某一特定产业的组织之后，曾援引帕拉迪乌斯的话写道：“这一庄园法存在于某些庄园；如我所说，在有些地方它较重，在有些地方也较轻；因为各处的庄园习惯并不相同。……主持管理之人须留意，要始终明了该庄园的旧有安排以及民众的习惯是什么。”17 变化世界中的地方习惯：这正是农民应对领主支配所依存的基质。\n寻求地位\n“告诉我，你的财富何在？”十世纪的道德家韦罗切利的拉特尔（卒于974年）在一篇文学对话中问一位虚构的富人。“在于我拥有的地产、农奴和女奴、马匹、牛和其他牲畜，在于我的追随者的服从，在于我对猎犬和猎鹰的喜爱，在于我丰裕的衣物、精美餐具、谷物、酒和油，以及武器、白银、黄金和珠宝。”18 土地财产、奴役性的劳动力、忠诚的扈从、昂贵的财物和炫耀性的展示：富人的回答表明了获得崇高社会地位的复杂性。他被问及财富，其回答却将对他人的权力与物质资源结合在一起，正如我们所见，这正是领主权的典型方式。他提及自己如此享受的生活方式——狩猎、宴饮、个人服饰的奢华，以及其他种种使之凌驾于他人之上的炫耀性消费。自然，他的言辞预设了一种等级式的人际关系观，从奴隶到最富有、最有权势的领主。本节将探讨这种自我认知对早期中世纪社会秩序顶端者的若干意涵。\n在上层同样存在巨大的多样性。那些以各种泛指领袖人物、大人物、有权者、最优秀者的名号（拉丁语中的primores、potentes、optimates；古英语及其他语言中也有类似的词汇系列）相称的人，享有最大限度的自由集群，但即便如此仍效忠于一位亲王、国王或皇帝。较低层级的显贵——享有区域性特权、家境殷实的自由人——有时自愿、有时被迫为其服务。在某些地方，紧密的等级制度将各群体牢固地束缚于其上与其下；在另一些地方，交往、义务和服务形式则较为松散和轻微。此外，效力于一位以领土扩张闻名的领主的人，与效力于统治一个稳定甚至正在萎缩的领地之领主的人，所面临的机会截然不同。就政体而言，因为王室或诸侯的恩庇在一定程度上取决于可动用的资源。\n以我们前面遇到过的四位人物为例，他们都生活在830年代：阿巴、埃贝哈德、里瓦尔和诺德贝特。19 里瓦尔和诺德贝特都是地方上的实力人物，却选择与当地的重要教会建立往来——里瓦尔与雷东修道院，诺德贝特与根特的圣彼得教堂。在布列塔尼，任何领主权对里瓦尔这类地方土地所有者来说都形同虚设；但正如我们刚刚看到的，在诺德贝特的时代，日益严密的领主义务正影响着佛兰德斯。阿巴和埃贝哈德都直接为国王效力——前者任肯特郡长，后者任弗留利藩侯——但两人在土地、财富和政治影响力上的规模毫无可比性。以肯特的标准衡量，阿巴虽有权有势，但与弗留利的埃贝哈德相比则微不足道。埃贝哈德的家族跻身加洛林超级精英之列，这使得他的父亲和他本人得以从查理曼治下法兰克人的领土扩张中获益，其地产从佛兰德斯一直延伸到意大利。\n除了土地所有权之外，这四位精英人物及其家族之间几乎没有什么共同点——唯一的共同点是他们都利用土地与教会建立联系，而这正是我们得以了解他们的原因。这种多样性提示我们，应当仔细考察中世纪早期还可能存在哪些身份标志。我们将看到，资源上的悬殊差异和称谓上的多变，反映了上层社会的社会流动性，以及精英成员资格缺乏任何固定标准。由于获得或丧失高贵地位没有任何明确的成规，我们只能从多个方面去探寻。而中世纪早期的人们也正是这样做的，我们接下来就会看到。\n首先，高贵身份是外人可见的。伊比利亚哥特人的国王莱奥维吉尔德（568–586年在位）将梅里达附近的一处地产赐给一位名叫南克图斯的修道院长，以供养其修道团体。修道团的居民前去拜见新主人，却大为震惊：“当他们前去见到他衣衫褴褛、头发蓬乱未剪时，便鄙视他，彼此说：‘我们宁可死，也不愿侍奉这样的主人’”——于是几天后他们把他杀了。20 对南克图斯而言，不修边幅是苦修的标志，但他的佃户们不愿侍奉一个看起来像卑贱奴隶的主人，无论他多么圣洁。主人必须有主人的样子。\n除了外表之外，举止和谈吐也彰显高贵身份，七世纪诺森布里亚人伊玛的经历便说明了这一点。679年他在战场上被麦西亚人俘虏，谎称自己不是国王的侍从，只是一个穷苦农民。俘虏他的人密切监视着他，过了一阵子，“从他的外貌、举止和谈吐中看出，他并非如他所说的出身平民，而是出身贵族之家”。21 显然，在宫廷的历练使人养成优雅的仪态和文雅的谈吐，以及将精英与农民区分开来的着装规范。\n宫廷气派还以其他方式塑造出独特的外表。最迟至查理曼时代，王室扈从的衣着已讲究时髦炫耀，购置昂贵的丝绸和毛皮，男性佩戴镶宝镀金的武器，女性则佩戴胸针、臂环、腰带和项链。虔诚者路易不得不劝说他的主教和修道院长们——他们几乎都出身高门——不要穿得像世俗贵族一样。他敦促他们舍弃“世俗荣耀的饰物”，即“缀有金剑饰和镶宝匕首的腰带、华美的衣裳以及装饰着马刺的精美鞋履”。22 这些恰恰是弗留利的埃贝哈德遗赠给子女的那些彰显声望的物品，而且正如我们在下一章将看到的，它们被用来巩固恩庇与恩宠的纽带。这一切都标志着精英身份，其中剑带尤具特殊意义，因为无论镶宝还是素面，它们同时也是官职的徽记。这种宫廷风尚还颇具感染力：始于加洛林帝国宫廷的潮流在奥托王朝宫廷进一步发展，两者都树立起奢华高贵服饰的风尚，为各地人士所效仿。最迟至十世纪末，盎格鲁–撒克逊的国王、王后连同贵族及其妻子们也纷纷效仿，身着织花丝绸，饰以大量金线刺绣、珠宝和厚重的毛皮。\n对排场的讲究还延伸到骏马及其马具上，饰以“雕花圆牌”。23 教皇哈德良一世（772–795年在位）游行时所骑的，非“最负盛名的骏马”不可——膘肥体壮、“各方面都值得称道”。24 而当（1036至1038年间）年届五十的卡诺萨的博尼法乔斯翻越阿尔卑斯山去迎娶约十八岁的新娘贝亚特丽斯时，他给马钉上了银掌。他故意把马掌钉得松松的，好让它们在途中脱落，供当地百姓拾取：“这样人们就能知道他是谁了。”25 绝不放过任何彰显身份的机会。\n精美的饮食是精英生活方式的另一个方面，正如我们前面所见。26 除了猎物以及专门饲养以供宰杀的家畜的鲜美肉食之外，丰盛的餐桌上还有海鱼，如鼠海豚和鲱鱼，以及用进口香料烹制的菜肴。这些东西应有尽有、数量庞大：从布道者的抱怨来判断，大人物们喜欢大吃大喝、纵酒过度。尽管如此，饮食在原则上仍可区分身份的高低，因为当虔诚者路易为其办理帝国事务的代办规定口粮时，他精确地规定“按各人等级应给予多少”，无论其为 Bishop、修道院长、伯Count还是扈从。27\n精英成员资格还意味着社会距离。其表现之一是拥有由武装人员、家务官员和随从组成的私人扈从队伍。另一个表现可能是设防的宅邸，例如戈尔索十至十一世纪的盎格鲁–撒克逊大厅建筑群，其中主厅、附属建筑和庭院由土垒和壕沟环绕。它还要求他人毕恭毕敬，避免威胁性的举动。“仆人向主人递刀时，习惯上要[握着]刀尖。”28 精心的策略可以强化等级秩序：马格德堡大主教塔吉诺（1004–1012年在位）就只看重“出身高贵和举止得体”，拒绝接纳出身低微者进入自己的随从行列。29 然而，社会攀附者却力图消蚀这种距离，因为效仿贵族就是在博取贵族应得的礼敬。于是，圣加仑修道院的庄园管事们“学会了吹号角，其声与其他农民的不同”，并开始佩带擦得锃亮的武器，带着猎狗去打猎——起初只猎野兔，后来甚至猎狼、熊和野猪。“‘管田地和草场的事让膳房总管去操心吧，’他们说，‘我们必须顾及自身的好处，纵情狩猎，这才配得上真正的男子汉。’”30\n由此可见，精英身份意味着一种以个人炫耀和挥霍性消费为特征的生活方式与行为规范。一部八世纪的爱尔兰论著对此作了总结——它固然过分系统化，却忠实于其精神实质。一个拥有二十七名依附者随扈、一座29英尺长的主宅和一座19英尺长的附属房屋、陈设奢华——包括八张床和带坐垫毛毯的躺椅、厨房里有一口足以炖下一整头牛的大锅、十二副镀金马笼头和猎犬——而其妻子还养着一只宠物哈巴狗的人，便是“头等贵族”。31\n照此标准，我们开篇提到的那位虚构的富人有充分的资格被视为精英。他拥有必要的财富、生活方式和扈从。但是，巨额财富和得体的行为就足够了吗？未必。在中世纪早期的观念中，界定精英的是“高贵”。一份十一世纪初关于身份等级的盎格鲁–撒克逊论著承认：“如果一个商人生意兴隆，曾三次自费横渡公海，那么他此后便有资格享有塞恩的权利[即在盎格鲁–撒克逊语境中的贵族：见下文]”。32 或许确有一些中世纪早期的商人成功跻身塞恩之列，但我们没有证据证明这一点。然而我们确有很多迹象表明，成为“高贵者”所涉及的远不止像那位富人那样坐拥财富。\n“高贵”又是一个含义灵活的词语。它通常描述一个人的显赫等级及其权力与特权地位，但也可以指在当时的宗教和社会期待范围内高尚端正的品行。在特定语境中，这两种含义可能取其一，也可能兼而有之：它们共同蕴含着“显赫知名”之意。那位富人固然有资格在第一种意义上被称作高贵，但并非所有与他地位相当的人都必然如此看待他。这有一个根本原因：尽管“高贵”在欧洲中世纪和近代早期的社会等级体系中占据关键位置，但在中世纪早期，它并不是一个由客观、公认的标准所界定的等级。\n毋宁说，它是一种品质。品行往往至关重要，“高贵”一词本身就暗示了这一点。此外，血统也举足轻重，原因有二。其一，世袭身份存在强烈的预设：知晓某人的父母出身即可确认其高贵身份。女性尤其如此——她继承父亲的等级，并且往往充当家族谱系资料的保管者。其二，除了偶有发迹的商人之外，获得支撑高贵生活方式所需资源的主要途径是继承。由于只有贵族才有机会积聚或继承超过极小规模的资源，拥有财富本身并不能自动使人成为贵族，毋宁说它确认了贵族身份。品行、血统、财富——所有这些都有助于一个人被公认为高贵。\n想想奥里亚克的杰拉尔吧，他作为圣徒声名远扬，部分原因正在于他拒绝过贵族同侪那种奢华炫耀的生活方式。尽管如此，他却是货真价实的名门之后：“他的出身如此显赫，以至于在高卢诸家族中，他的家系无论在产业还是生活品德上都卓尔不群。……而散布各地、附有农奴的大量庄园，凭继承权归于杰拉尔，也见证了[其祖先]财富之巨。”“谦逊与虔敬”这种形式的“生活品德”同样是家传的。33 不过，杰拉尔把高贵的生活推向了新的极端。一般而言，贵族被期待的行为方式要为自己、家族和领主带来荣耀：世俗男子须勇敢尚武，女子则须贞洁端方、善于持家。34 而奥里亚克伯爵放弃复仇、不动干戈、保持贞洁，简直是颠覆了传统的性别行为范式。因此，杰拉尔拥有一切高贵的标志：家世、庞大的地产，以及另一项难以捉摸的标准——卓越的品行，尽管是颇为奇特的一种。他高贵到了这种程度，其传记作者暗示道，以至于无需靠炫耀财富来证明这一点。\n通往高贵或提升高贵身份还有一条重要途径需要考虑：为王室效力。许多后来用以指称显赫等级的词原本意为仆人或家内扈从，这绝非偶然：“塞恩”/“塞恩勋爵”（分别是盎格鲁–撒克逊英格兰和苏格兰的主要精英等级）、“骑士”（古英语cniht）和“封臣”（古法语vassallus）的词根含义都是仆从。至少可以说，由于这种服务往往带有军事性质，一个人战死沙场可能为另一人在宫廷中晋升铺平道路；反之，战功卓著也可能带来奖赏、恩庇和更高的社会声望。服务也可能是较为和平的，即在支撑中世纪早期诸王国与帝国的世俗和教会行政体系中担任重任。而其回报——声望、影响力、地产，甚至是王室新娘——可以极为丰厚，弗留利的埃贝哈德对此深有体会。\n接近这些职位造就了一批圈内人，他们得以利用与国王的亲近为自己和家族谋取好处。此外，虽然贵族血统传递贵族等级（前提是家族记忆得以延续、高贵的生活方式得以维持），但它未必是跻身高位的前提。维尔切利主教柳特瓦德（880–900年在位）同时例证了这两点。他出身低微，却凭才干晋升，在胖子查理（876–887年在位）的宫廷中身居最高的教会职位，“受到所有人的尊崇与畏惧，甚于皇帝本人”。他还成功地提携家族，“他毫无阻碍地夺走阿勒曼尼亚和意大利最高贵人家们的女儿，把她们嫁给自己的亲戚”。35 与地位更高的女性通婚是既定的社会晋升途径，因为女性可以将身份连同资源一起代代相传。然而我们应当记住，特权、财富以及因接近统治者而产生的权力，绝非总是相伴而行。大贵族常常有不显达的兄弟：他们出身同样高贵、财富相当，却缺乏政治地位和影响力。\n受宠于君王的近臣，也未必获得同侪的信任。570年代，勒达斯特任图尔伯爵。他获得这一职位靠的是赢得希贝王（561–567年在位）继而是其兄弟希尔佩里克王（561–584年在位）的垂青。该职位肩负代表国王管理财政、军事和司法的职责，并隐含贵族身份，但关于勒达斯特，我们只能透过其图尔城中影响力对手——主教格雷戈里的眼光来了解。后者宣称，勒达斯特是王室葡萄园一名奴隶的儿子，曾被派到御厨房做工。格雷戈里断言，作为一名厨房杂役，勒达斯特因企图逃跑而被割掉耳朵，但他最终还是设法在宫廷中博得欢宠，引起了夏里贝尔王后马尔科菲娃的注意。一旦被任命为伯爵，勒达斯特便“趾高气扬地四处招摇，身居高位使他愈发骄傲自负。他表明自己是一个贪婪的掠夺者、一个争吵不休的吹牛者、一个肮脏的通奸者。他四处挑拨离间、煽动恶念，聚敛了不小的财富。”36 这或许是一个社会向上流动异常成功的故事；这无疑也是都尔的格雷戈里企图抹黑一个危险政敌的绝望之举——尽管此人无疑拥有财富、权力和王室恩宠，格雷戈里却全然否认他的贵族身份。这同时也是一场较量：一边是凭借为王室效力而发迹的暴发户，另一边则是地位古老、靠世袭获得、且常常与勒达斯特的王室庇护人相抵触的贵族。37\n由于整个中世纪早期任何时期都不存在明确而严格的贵族标准，新血与旧血之间的紧张关系几乎始终是王室宫廷的特色。毕竟，贵族身份是被严密守护的，须防范企图染指的新来者。“皇帝使你成为自由人，却不能使你成为贵族，因为那是不可能的”——这是九世纪的一位论战者向他憎恨的一个人抛出的指控，此人是一位大主教，出身卑微，却忠诚效力于其君主“虔诚者”路易。38 “出身卑微”的指控也可以用来攻击那些虽为贵族却不属于“正统”类型的人，如哈加诺在十世纪初的遭遇所表明的那样。哈加诺出身于洛塔林基亚的一个重要地产家族——洛塔林基亚是东法兰克王国的一部分，于911年被西法兰克国王“天真汉”查理（898–922年在位）夺取——他很快赢得了这位新君主的信任。在他的本土圈子里，哈加诺无疑会因显赫的贵族出身而备受尊敬。但在“天真汉”查理的宫廷中，他遭遇了那些在西法兰克权力网络中拥有既得利益者的敌视，他们怨恨这个外来者闯入其间——这个“被国王扶植起来的中等人家的家伙”。旧精英们向查理抱怨他私下与哈加诺讨论王室事务的习惯，将其余那些合法的谋臣排除在外。他们威胁说，除非查理抛弃“这个出身晦暗不明的人——他仿佛世上没有贵族一般向国王进言，极大地损害了国王的尊严”，否则他们便拒绝再参与政务。39 查理坚持信任哈加诺——结果在920年，批评者们终于反叛，并在不久后废黜了国王。\n通过这些案例，我们触及了问题的核心。无论有多么显赫的品行或家系，无论有多少王室恩宠、财富、社会攀升或权力，都未必能使一个人在其对手眼中成为贵族。贵族身份的本质在于来自同侪的社会承认。没有任何法律公式量化其构成要素的相对比例：由于缺乏公认的、明确的身份资格，贵族身份始终是见仁见智之事。正因如此，它可能是脆弱的，甚至是转瞬即逝的。它需要通过复用祖先的名字来宣告家系。它需要通过财富、影响力和合宜举止的显赫展示来不断重申，并须防范被社会攀爬者取而代之的风险。精心经营朋友与亲族关系；时刻留意提升荣誉的途径；为自己和子孙安排战略性的联姻；以慷慨对待教会而博得名声；审慎处置家族祖产；在变幻莫测的恩宠体系中周旋：这些都是提升贵族身份的手段，或者至少是努力遏制其侵蚀的手段。\n贵族身份在很大程度上取决于社会认知，这一点对于影响中世纪精英的最重要变革之一——骑士阶层的兴起——至关重要。尽管这一渐进过程的根源可以追溯到九、十世纪，但直到十二世纪，或某些地方直到十三世纪，它才宣告完成。这一过程有三条主要脉络：一条是意识形态的，一条是社会学的，一条是语义学的。\n首先，加洛林帝国的武士贵族接纳了一种特有的基督教军事价值观的意识形态。在那些骑马披甲与基督教敌人作战的九世纪贵族中，形成了一种颂扬战争并为战争辩护的修辞。他们通过授予武器的仪式来划定这一精英群体的成员资格，这种仪式有时伴随宗教典礼。其次，随着十世纪的领主开始修建城堡并以武装随从驻守，一个以战争为生计方式、自由但非贵族的阶层日益引人注目。这些人被称为\"milites\"，按照该词的古典用法，其意不过是“士兵”。第三，在一场始于十世纪末法兰西部分地区、但在其他地方只能追溯到更晚时期的复杂语义转变中，贵族精英开始自视为\"milites\"，并被他人如此看待。与此同时，驻防的\"milites\"也开始为自己要求贵族身份。于是，\"miles\"从一个带有非贵族色彩的词，变成了一种贵族们乐于采用的体面身份。这三条发展线索只是逐渐融合，才形成了十二世纪及以后的骑士群体。如果说骑士制是中世纪盛期贵族最显著的特色之一，那么它的根源便在于中世纪早期的功能、流动性与主观认知之中。\n因此，虽然某种精英的存在始终是社会事实，但其成员资格却没有任何严格界定的标准。它也不可能有这样的标准，因为统治者并非按照客观标准分配恩宠，而是随一时的情势而动——政治需要、忠诚、才能与友谊。所能作出的最概括的论断是：贵族身份是相对性的，既相对于社会等级中地位更高者，也相对于地位更低者。那些自称贵族并被同侪承认为贵族的人，从家境优渥但并不奢华之辈，到坐拥巨额地产的富豪，无所不包。他们既包括贵族身份可上溯多代的家族，也包括资历较新的家族，后者最常见的社会流动阶梯是为王室效力。精心挑选的婚姻对象和对家族祖产的精明处置，使妇女成为在无定形的亲缘网络之内及其相互之间、将祖先、土地和贵族身份主张世代传承的重要纽带。然而，对许多人而言，最重要的关系是与统治者的关系。那些没有机会直接引起国王注意的人，至少可以希望自己或自己的儿子能在国王某位朝臣的扈从中觅得一席之地。而且，随着恩庇与效力将人们引向王室宫廷，奢华生活的时尚与趣味也从宫廷向外、向下扩散。\n如此看来，对身份地位的追求需要精力、努力，也需要花费。它既依赖继承的资源，也依赖友谊的力量，并且需要灵巧的政治运作，以维护声誉、提升荣誉、赢得高位和土地赏赐。当维罗纳的拉瑟在他的牧灵对话中虚构出一个富人时，他并不关心这个人物的野心或成功，只关心如此贪婪之人的灵魂将面临的命运。从拉瑟的观点看，没有什么比灵魂更珍贵。他暗示，对尘世地位的追求充满了灵性上的危险。\n约在890年前后，威塞克斯国王阿尔弗雷德接待了一位访客，此人给他带来了一些精美的海象象牙。奥泰雷生活在挪威，位于定居农业活动的最北限。某年夏天，他的狩猎远行甚至比捕鲸者走得更远，沿斯堪的纳维亚的北极海岸一路航行，直抵白海，想看看那里是否有人居住。他献上的最上等的象牙便来自那些地方——那里除了芬纳斯人（即斯堪的纳维亚北极地区的萨米猎人和渔民）偶尔扎营之外，荒无人烟。奥泰雷对北方地理的详尽描述令西撒克逊人着迷。他们也询问了他本人的情况，得知“他是那个国家的主要首领之一，但他只有二十头牛、二十只羊和二十头猪，他耕种的那点土地是用马犁的”。他们起初惊讶于如此显赫的人物竟只有如此少的耕地和如此微薄的家畜，随即又意识到奥泰雷“在其财富所在之处，即野鹿……（他们称之为驯鹿）方面，是个非常富有的人”，惊讶之情便随之消减。奥泰雷报告说，该地区之人财富的主要来源，是从萨米人那里收取的贡赋——貂皮、驯鹿皮、熊皮大衣、成袋的羽毛、鲸骨和生皮绳，每个萨米人“各按其等级”缴纳。40\n无论是驯鹿群，还是纳贡者的个人依附关系，都不承认精确的领土边界。奥泰雷这类“驯鹿豪强”的财富更多来自游牧和征贡而非农业，这反映出可耕地稀少、土地贫瘠，以及如此遥远的北方缺乏严密组织的领主权。这里是一个不以土地控制为轴心的经济，维系上层等级的是猎人的劳动而非农夫的耕作。它与北法兰德斯高度规范化农耕、地块分明、严格臣服于王室、伯爵领和教会领主权、且交换迅速商业化的农业经济，形成了最大的反差。它们构成了中世纪早期劳动与领主权的两种极端模式，但尽管如此，两者仍有重要的共同特征。两者都是为了开发利用所在地区的自然资源而精心组织的——无论是海象长牙和熊皮，还是亚麻、燕麦和羊毛。两者都显示出财富与等级的地方性分层，虽然在绝对数量上差异极大，却都以区域规模显著的社会与政治不平等的形式表现出来。两者都贡献了国王及其扈从所珍视的资源：珍稀毛皮；用于珠宝、精巧小匣和珍贵书籍封面的象牙；喂马的燕麦；建造战船和城堡的木材。两者都表明，有权势者和统治者获取维系其领主权之资源的途径多种多样，以及他们在获得这些不同资源之后如何加以利用。下一章将更详细地讨论这些问题。", "sections": [{"level": 2, "title": "奴役与自由", "id": "ch7-s0"}, {"level": 2, "title": "农民与领主", "id": "ch7-s1"}, {"level": 2, "title": "寻求地位", "id": "ch7-s2"}]}, {"id": "c8", "title": "第6章 · 获取与给予", "kicker": null, "part": "第三编 · 资源", "html": "<p>海岬上矗立着一座雄伟的堡垒，\n每人都在那里慷慨地获得自己的一份。\n·····\n高地上矗立着一座雄伟的堡垒，\n盛宴奢华，欢声喧腾，\n四周美景环绕，那勇士的堡垒，\n飞溅的浪花如翼：其翼何其长！<sup class=\"fn\" data-note=\"6:1\">1</sup></p>\n<p>查理曼喜爱外国人，并悉心款待他们，以至于他们人数之众，可以说毫不冤枉地不仅成了宫廷的负担，甚至成了整个王国的负担。但由于查理曼天性宽宏，他不以此为虑，因为他以慷慨之名与良好声誉的回报，补偿了种种巨大不便。<sup class=\"fn\" data-note=\"6:2\">2</sup></p>\n<p>查理曼深知统治者需要慷慨的名声。他的宫廷，如同威尔士“雄伟堡垒”滕比之主布莱杜德的宫廷一样，回荡着盛宴与欢宴之声，这是成功统治所需的奢华排场与炫耀性消费的一部分。根据当时人的一项估计，968年奥托一世的宫廷每日消耗“猪羊各一千头，酒十车，啤酒又十车，谷物一千斗，牛八头，此外还有大量的鸡、乳猪、鱼、蛋、蔬菜及其他食物”。<sup class=\"fn\" data-note=\"6:3\">3</sup> 即使这一记载有所夸大，它也表明了统治所需资源的规模。查理曼的慷慨（尽管布莱杜德的并非如此）必定也达到了类似的规模：招致批评也就不足为奇了。真正慷慨的统治者可以无视这些抱怨，并期待从其奢靡开支中收获政治回报。</p>\n<p>展示慷慨的盛况与维持精英的生活方式，只是领主和统治者动用其物质资源的两种方式。捐赠教会、赏赐追随者、支持王国行政、进行战争、修建宅邸、宫殿或城堡、从事外交、供养亲属：这一切都在消耗资源。因此，本章将探讨积累与分配各种形态物质资产的方式。本章以查理曼通过款待众多外国人来提升声誉这一事例为线索，聚焦于经济资本向象征资本的转化——即把财宝、货币、牲畜和农产品转化为荣誉、政治成功与神的嘉许。</p>\n<p>从一种形态向另一种形态的转化充满困难。土地及其出产仍是所有中世纪早期精英最主要的支持来源，然而即便是国王，也仍受制于恶劣天气与疾病爆发的无常变幻，因为食物短缺可能使征战无法进行，而疾病的爆发则可能使军队十不存一。以易腐食品形式获得的收入无法储藏于宝库之中，必须转化为更为持久的东西。当然还有其他财富来源，但它们同样往往不稳定。战利品可在战斗中赢得，也可能失去。不加节制的慷慨可能耗尽资源与声誉。继承与联姻可能带来财富的增加；供养子女则可能使其耗竭。统治者可能以外交礼品的形式积累大量财宝——但同样地，也必须以某种方式慷慨回赠。因此，尽管成功君王的标志之一是装满的宝库，尽管其合法性部分建立在对珍贵祖传宝物的守护之上，我们却不应对着静态的窖藏黄金图景进行思考。毋宁说，财富向政治权力的转化是一个流通与再分配的动态过程，是持续不断的流入与流出。国王囤积是为了能够支出；他们给予是为了获取。</p>\n<p>将物质资产转化为社会与政治优势，往往集中于特定的节点。本章第一部分将确定财富与权力趋于聚集的地点，将它们置于地理网络之中，并评述它们与所在政治体的关系。因此，这一部分将探讨在中世纪早期经济中积累与分配财富的方式，并考察国王及其他人如何利用这些方式。它还将考察商业模式的变迁及其与其他交换形式的关系。本章第二部分将焦点从地点转向人物，从地形网络转向社会网络。它将讨论馈赠与庇护作为策略，对于理解中世纪早期领主和统治者如何运用其资源以建立并维系权力至关重要。最后，本章认为物质财富有助于组织人界与超自然世界之间的关系，而对财富运用的考察也为我们洞察中世纪早期的宇宙观提供了途径。</p>\n<figure><img src=\"images/fig_6_1.png\" alt=\"第6章所涉主要地点\"><figcaption>第6章所涉主要地点</figcaption></figure>\n<h2 id=\"ch8-s0\">权力的景观，财富的景观</h2>\n<p>在等级制组织的农业社会中，物质资源、政治领导权和超自然力量在地理上的不均衡分布，与在社会层面的不均衡分布同样显著。将文本与考古证据绘制成图，会呈现出一种复杂的景观：经济、宗教和政治功能在某些地点高度聚集，而其他地点则职能较少。为中世纪早期绘制若干此类 mental 草图，正是本节的任务。它揭示了巨大的变迁：绘制这些景观图是探索中世纪早期动态人文地理的有效方式。</p>\n<p>我们必须从古代地中海世界谈起。在那里，罗马帝国将城市及其附属领地组成的镶嵌体编织成一个庞大且异常持久的政治经济体系。任何一幅相关地图都会凸显城市共同体作为政治、宗教和经济焦点的支配地位。细察之下则会发现，这些城市之所以重要，还在于它们是地方利益与帝国利益交汇、重叠或竞争的场所。农业、战争、贡赋以及国家组织的生产与供应，维持这个帝国所需的庞大资源由此而生。事实上，罗马国家的需求如此巨大，以致它从政治疆界之外极远的地方汲取资源，到处寻求金、铁等矿物，香料、毛皮等声望物品，以及奴隶或士兵等人力资源。其内部经济是一种指令性经济，由帝国征发驱动，运输体系专为军队各部提供给养，并为罗马和君士坦丁堡的稠密城市输送粮食。四至五世纪庞大的官僚机构与军队使资源紧张到极限，然而帝国与贵族在精致城市建筑和典礼仪式上的奢华支出仍持续美化着城市环境，并在此背景之下昭示帝国的意识形态。在古代晚期，城市依然是财富消费与展示以及政治活动的中心，这一点在地中海地区最为显著。尤为突出的是，罗马城本身将物质财富与政治影响集中于一处；即便324年在博斯普鲁斯海峡边的君士坦丁堡建立了第二座帝国都城，罗马的这种优势地位仍延续了很长时间。<sup class=\"fn\" data-note=\"6:4\">4</sup> 即使四世纪西部宫廷先后迁往特里尔、米兰，并最终于408年迁至拉文纳，也无损于罗马作为首要权力舞台的突出地位。476年之后西部帝号的中断同样未能立即动摇其地位。尽管环绕地中海的城市在许多情况下人口与建成区面积都在缩减，但约500年时，它们仍构成了欧洲迄今最富庶的地带。国家驱动的交换仍定期将大量谷物、葡萄酒和橄榄油以及奢侈品从地中海一端运往另一端，补充帝国粮仓，维系城市的壮丽景象。</p>\n<p>帝国在西部的控制土崩瓦解，一切都随之改变。帝国统治的终结意味着其庞大的军事与官僚体制以及维系这套体制的征敛、赋税和铸币体系逐渐解体——有时则是被蓄意肢解。城市公益捐赠与帝国纪念性建筑的传统也随之衰败，在某些地方迅速消亡，在另一些地方则较为缓慢。在这一变化了的环境中，边缘行省的城市艰难求生；而离地中海较近的大多数城市得以延续，尽管规模缩减。当武士精英从罗马领土上划出新的政体时，他们以乡村地产所有者的身份立足，但总体上对作为权力舞台的城市保持尊重的态度，即使这些城市中心已残破不堪、部分被废弃、经济凋敝。</p>\n<p>五、六、七世纪的整体后果可以概述如下。世俗精英日益乡村化和军事化；各地城市里的公共展示、城市生活方式与文官意识形态充其量遭到严重削弱，而在西部的大部分地区（与东部不同）则完全崩溃。只有主教和教士继续在城市中兴建建筑；在他们的主导下，教堂的增殖改变了城市环境的面貌与性质。与此同时，昔日远距离贩运货物的交换体系走向瓦解。到七世纪中叶，连地中海经济也解体为若干大体自治的区域性活动圈，圈内有少量货物流通，各圈之间仅靠无规律的港口间航运相连。各个地中海微观区域的运转水平已不复相同；尤其在西地中海盆地，经济活动跌至远低于东端的水平。这也波及罗马：到八世纪，这座萎缩的城市仅靠其紧邻的腹地供养，城市公共展示也让位于教会的慷慨营造。</p>\n<p>罗马国家驱动经济的终结是一个渐进而曲折的过程，无法精确断代，但其结果显而易见。虽然政治需要与资源需求曾促使帝国到遥远疆界之外寻求原料与珍稀物品，但军事边疆始终是罗马财政体系及其货币经济的明确界限。税收国家的终结和钱币规律性铸造的停止，实际上模糊了边疆内外经济体系之间的分野。此外，出现的并非一种新的统一经济，而是一系列相互重叠的地方性和区域性经济。除意大利外，这些经济的特征和节点更多是乡村性的而非城市性的，其货币也从黄金转向白银。</p>\n<p>尽管这些变化大致与后帝国时期诸王国的形成同时发生，但新的政治与经济版图绝不相重合。这在高卢尤为明显：法兰克诸王向南谋求利用地中海贸易，直到七世纪，东方物品仍经由商贸城市马赛源源北流；但与此同时，他们也把目光投向北方，即莱茵河口及其以外地区。在这里，迅速扩张的弗里西亚人至迟在六世纪晚期已享有黄金富足的社会，并共享北海沿岸各地的共同文化；到七世纪初，弗里西亚成为把法兰克人愈益吸引进欧洲北部竞技场的磁石。因此，法兰克王国横跨地中海与北海两大经济区域。</p>\n<p>在北海周围，新的交通与交换模式将昔日被罗马政治边疆所切分的各地区重新整合起来。其轮廓到七世纪初已清晰可见。从塞纳河口到大陆上日德兰半岛根部，以及在不列颠从索伦特到亨伯河流域，一批新的沿海或河口的生产与交换中心发展起来，即所谓“商站”（emporia）或“威克”（wics）。这些中心仅繁盛于七、八、九三个世纪，是滨水的手工业生产与贸易中心，将来自区域腹地的货物转运至海外其他领土和王国。例如，在特里尔以北的艾费尔山区开采的玄武岩磨石就这样运抵莱茵三角洲，向北穿越丹麦半岛进入波罗的海南部，又跨越海峡到达英格兰南部海岸——这种流通全然不受政治疆界的限制。</p>\n<p>约800年时，商站已遍布斯堪的纳维亚南部和波罗的海地区，那里的琥珀、毛皮和象牙出口换取羊毛布匹、葡萄酒、陶器、陶瓷器和武器的输入。即使某些商站确实位于前罗马帝国领土之内，其选址也不是古老的罗马城市，而是一种新型的货物集散节点。它们没有防御工事，往往只在特定季节有人居住，居民多为不携妻儿的男子。其典型特征是，商站本身并非王室或贵族领权的中心，但通常与这类中心保持着紧密且很可能是直接的关系：如在索伦特，汉威克就位于西撒克逊王室中心温彻斯特（其本身即一座古罗马城市）以南不远处；又如在弗里西亚，多雷斯塔德位于罗马堡垒乌得勒支内的晚期墨洛温教会中心附近。</p>\n<p>而且，随着自670年代起某些北海商站开始铸造小型银币，诸王也产生了兴趣，设法通过对其交易征税来分享其财富，并利用为自己获取声望物品以及出售自家庄园剩余产品以增加收入的可能性。王室的关注与鼓励，伴随着教会对财富和奢华的追求；各地大教堂和修道院兴起为财富中心兼政治影响中心，正是七八世纪的典型特征。例如，八世纪晚期，地处内陆的盎格鲁-撒克逊王国麦西亚的统治者们对在伦登威克（Lundenwic）交易的船只征收通行税；伦登威克是“万国商站，各族人等由陆路和海路而来”，位于伦敦古罗马城以西的开阔河滩上。）<sup class=\"fn\" data-note=\"6:4\">4</sup> （伦敦的“威克”很可能留存于街名“阿尔德威奇”之中。）特定获免税的是属于肯特若干教会以及伦敦主教和伍斯特主教的船只。尽管这些教会的贸易活动细节无从得知，但这些教会——正如授予其免税特许文书的诸王一样——发现商站对于自身财富与权力的发展至关重要。如此，几个不同群体的利益便交织重叠在一起。</p>\n<p>不列颠东海岸各地点远距离交换的强化，恰与其西海岸一带的衰落同时发生。在古代晚期，贸易经由高卢的大西洋海岸把地中海与布列塔尼、进而与不列颠西南部以及整个爱尔兰海区域连接起来。谷物、葡萄酒和橄榄油由此输出，船只则运回不列颠的锡、银、铅，以及来自爱尔兰的奴隶和猎犬。与地中海的联系延续至六世纪中叶；此后直到约700年，这条路线只有北段仍在使用，从高卢西南部的波尔多和南特向爱尔兰海区域运送数量可观的食盐、葡萄酒、香料和染料。</p>\n<p>商人是否曾经完成从地中海直航爱尔兰乃至苏格兰西南部的全程，抑或货物经由数道中间人之手转运，至今仍有争议。尽管以地中海的标准衡量，这项贸易规模极为有限，但对在爱尔兰海周边竞逐影响力和领土的诸王而言却意义重大。这些统治者以铁器时代建于制高山顶的要塞为基地，这类地点的人口想必以数十计，至多数以百计，其有限的经济作用远远不及它们在政治与象征上的重要性。这些高位阶地点包括不列颠的卡德伯里、迪纳斯波伊斯、邓阿德等中心，以及爱尔兰的纳万堡与阿尔马双重复合体。</p>\n<p>从这些地点进行统治的人们——如滕比的布莱杜德——向臣民征发劳役和兵役义务。他们还豢养金匠、珠宝匠和珐琅匠等专业工匠，这些工匠在山顶要塞居所的安全环境中制作奢侈品，供其炫耀精英身份。此外，通过对来自地中海和高卢西南部货物的获取途径加以调控，他们进一步提升了自己的地位。</p>\n<p>到八世纪初，这些设防山顶居址大多已被废弃。在爱尔兰，手工业生产转移至修道院地点，但其分配（如果确有分配的话）很可能仍处于王室控制之下。假以时日，爱尔兰海区域的经济与政治联系逐渐从高卢和比斯开湾转向，经由北方群岛转向斯堪的纳维亚和波罗的海。尽管原因仍不确定、年代学也只属近似，但在某种程度上，它们与影响整个八世纪欧洲的一场规模大得多的转变相关联：西地中海周围经济活动的暂时衰退与北方水域经济活动的强化。</p>\n<p>获取北海、以及北海之外的波罗的海的财富，只是法兰克人八世纪持续不懈向北扩张的原因之一。在加洛林王朝的领导下，法兰克人到800年成功地建立了一个控制着领土面积的政体，其规模在十六世纪之前无任何后罗马政体可与之相比。其政治核心位于塞纳河与中莱茵河之间的地区，帝国的疆域从埃布罗河延伸到多瑙河，从台伯河延伸到易北河（图8.3）。它囊括了几十个经济上各不相同的区域，从相对城市化的波河流域到人烟稀少的德意志北部森林；它所控制的物质资源无疑远超任何其他中世纪早期政体，尽管远不及罗马国家之水平。事实上，比较也就到此为止，因为加洛林诸王完全缺乏国营指令性经济的机制。精心经营自家庞大庄园的农业剩余；灵巧地对帝国境内各地以及纵横交错、跨越疆界的区域间商路上不断增长的贸易征税；再加上对邻人的掠夺性劫掠，这些都促成了高水平财富积累。持续争取地方贵族与教会效忠的努力，需要将这笔财富的一部分再分配出去，但为国王间接地接触世俗与教会的土地财富，例如在根特就是如此。</p>\n<p>加洛林王朝的国王与皇帝回避其罗马前辈所刻意营造的城市式权力展示。加洛林诸王在亲信贵族扈从的陪伴下于阿登森林中狩猎，而罗马皇帝则是在大都市的圆形竞技场中享受狩猎表演，由数以千计的观众围观。他们宁愿资助大型的乡村修道院——这些修道院充当着额外的权力中心与财宝积聚之所——而不愿在人口稠密的城市中慷慨赞助市民纪念建筑。即便他们的宫殿如亚琛、奈梅亨、法兰克福和雷根斯堡那样坐落在罗马时代的地基上，这些也只是罗马帝国北部边缘的小型半乡村居所或旧军营，而非其腹地的城市。</p>\n<p>加洛林帝国还是多中心的。尽管查理曼在其统治后半期围绕亚琛的温泉发展出一座示范性宫殿，但除了晚年之外，这里从来不是他唯一的居所。它也从来不是唯一的行政中心，因为他及其后继者通常让诸子作为次王或副王统治一个或多个行省，并为每人配备自己的扈从与统治中心。九世纪下半叶，家族内部的争斗将这些临时的行政安排固化为更持久的王国，这些王国的统治者只得为自己另建新宫，或者将自己的扈从强加于修道院的款待之上。尽管亚琛仍是最具威望、最令人艳羡的统治之地，但统治者的众多意味着权力地理中节点的众多。加洛林时代与整个中世纪早期一样，权威始终是个人性的而非制度性的，因此国王身在何处，何处便是政治活动的中枢。</p>\n<p>加洛林王朝成功地将诸多不同的地方政治影响网络与经济资源熔合在一起，而每一张网络都有自己的区域枢纽。如前所述，根特便是其中之一，现在让我们探访一个相当不同的枢纽：美因茨。作为一座古老的罗马边城，它位于莱茵河中游——这条大动脉水道由北海通往阿尔卑斯山口，进而抵达意大利与地中海。此地的主导力量并非王室，因为这里没有宫殿；而是教会势力，因为美因茨大主教区的起源可追溯至罗马时代晚期。统治者、权贵与教会或亲自出面，或更常见地通过其代理人，从这个城市所经手的利润丰厚的贸易中分一杯羹。城市景观是碎片化的：在罗马城墙之内，教会与世俗的居住建筑群各自在农业或葡萄种植区之间形成自己的院落。地方权贵以及各大乡村修道院的院长们都在此建有宅邸，以便他们或他们的庄头进城办理事务或将农产品送往市场时使用。城中有王室铸币厂，既刺激贸易又便于征税，城市因而也成为重要的生产与交换中心。在河岸边，“弗里西亚区”聚集着一个规模可观的弗里西亚商人殖民地的仓库与作坊，他们的船只往来于莱茵河上，输出内陆腹地的葡萄酒和谷物，以及这座城市本身出产的精美金属制品。到十世纪初，美因茨还是翻越阿尔卑斯山运来的货物——包括来自东方的香料——的转运点，并有穆斯林与犹太商人造访。但到那时，加洛林的政治实验已在区域分化和地方利益的礁石上搁浅。由于缺乏快速的通讯手段和可靠的强制方法，即便在地方农业产量上升、区域间贸易日趋 intensifies 之际，有效的政治体通常仍保持较小的规模。在加洛林晚期及之后的欧洲地方，经济活力并未受到政治分裂的影响。</p>\n<p>法兰克沿海商站、乡村修道院、河港与地方市场的财富和不断增长的人口，是吸引维京人注意的众多目标中有据可查最充分者。他们的高度机动部队自八世纪晚期起对加洛林核心地区和不列颠群岛发动进攻，这些袭击的记载尤为详尽。整个九世纪，他们的劫掠愈发频繁且破坏力愈强：他们洗劫教会宝库、袭击市场、向统治者勒索贡金，攫取大量钱币与财宝，有时还有牲畜和人口。随着武装团伙的壮大，维京人也开始寻求可定居的土地，或通过彻底征服，或通过从地方统治者处强取的让步。</p>\n<p>维京人自信善航海、精于贸易、狡黠而富于劫掠，从八世纪晚期直到十一世纪早期，足迹遍布四方。九、十世纪间，斯堪的纳维亚的船只称霸不列颠群岛与北方诸岛的海岸，沿欧洲西部沿海游弋，偶尔还穿越直布罗陀海峡进入地中海。他们横渡大西洋定居冰岛，有时甚至继续航行至格陵兰和纽芬兰。他们纵横波罗的海，沿东欧的河流水道抵达黑海。在那里，维京人接入了穆斯林世界的巨额财富，从而将大量伊斯兰银币吸引西流。受这种贸易的刺激，基辅（第聂伯河畔）等强大的贸易中心于860年代兴起。</p>\n<p>瑞典赫尔戈居址的出土物显示了维京人直接或间接交往的广度：其中包括来自莱茵兰的玻璃器皿、工艺繁复的爱尔兰牧杖头、来自拜占庭的银盘和一批金币、一件产自科普特埃及的长柄勺，以及一尊佛陀青铜小像。关于北方航海活动这一戏剧性（有时被过分渲染）阶段的解释仍存争议。斯堪的纳维亚南部社会在六至八世纪经历了深刻变革，发展为一个等级秩序更加分明的社会，资源逐渐积聚于地方首领控制的中心，例如我们在西福尔的博勒已经遇到过的那种中心。这些强大酋邦的兴起，似乎与其开发并再分配来自贸易以及本地农业和手工业生产之资源的能力密切相关。波罗的海商站——如比尔卡，那里有“许多富商以及大量货物与钱财”<sup class=\"fn\" data-note=\"6:5\">5</sup>——的财富无疑助长了这些酋邦的成长，正如北海商站滋养了七、八世纪盎格鲁-撒克逊和法兰克诸王一样。在这些酋邦中，丹麦的酋邦最早发展为王朝王国，并确立了延伸至日德兰半岛之外的海上霸权，将南斯堪的纳维亚诸酋邦和波罗的海沿岸的斯拉夫人社区纳入其中。</p>\n<p>丹麦诸王手中权力与资源的日益集中，在其王国内部及周边都受到挑战：政治竞争催生了富有攻击性的武士集团和贵族精英。查理曼向北萨克森的扩张不仅摧毁了丹麦人与易北河以东斯拉夫邻居之间的传统联盟，帝国扶植附庸国王的政策还催生了新近获得地位与影响的强势地方王朝。大范围内的贸易往来、航海旅行的传统，加上政治动荡以及供养武士集团所需资源之无休止的积累压力：这些前提条件足以引发维京人对西欧积聚财宝的劫掠。</p>\n<p>从北方的视角看，“维京时代”既是对西欧和穆斯林土地物质资源的榨取，也是斯堪的纳维亚权力结构的转型。从不列颠和大陆的视角看，它还是既有政治格局的动荡与重塑。这不仅仅是维京劫掠者索要贡物或构成军事挑战的问题。就此而言，评估其影响还相对简单，因为他们的劫掠恰恰证明了加洛林和盎格鲁-撒克逊的农业与手工业经济能够年复一年地持续产出资源。这些劫掠还促进了法兰克和英格兰铸币制度的发展——在严格控制下为王室利益而运营。在这方面，尽管局部破坏往往严重且总是令人创痛，维京劫掠的总体效果是转型性的而非毁灭性的。同样值得注意的是，法兰克人、布列塔尼人、盎格鲁-撒克逊人、威尔士人和盖尔人只要符合自身政治目的，便会毫不犹豫地与维京人联手。游动的维京武装团伙是加洛林家族内斗以及不列颠群岛内部诸王国争斗中颇受欢迎的参与者，其程度之深，令当时的编年史家极力遮掩。维京人的存在使地方政治惯例变得复杂甚至遭到破坏，此外还扰乱了农业生产的常规节奏、侵夺税收，并将教会宝库的财富释放到流通之中。</p>\n<p>维京人的冲击在不列颠群岛尤为深远，那里众多相互竞争的国王随时乐意借助外力来压倒近邻对手。例如，九世纪中叶，昔日强大的皮克特王国被并入盖尔人的达尔里亚达王国，很可能正是盖尔人与维京人战术联盟的成果。或许，维京人在无意间促成了阿尔巴王国从盖尔人对皮克特人的支配中脱胎而出。可以肯定的是，到九世纪晚期，苏格兰东北部和奥克尼群岛兴起了一个 aggressive 而强大的诺斯人统治领地，其权力中心是位于比尔赛的前皮克特人聚落。在爱尔兰，诺斯劫掠者以迅速融入爱尔兰社会而著称。作为爱尔兰诸王之间暴力争斗的积极参与者、若干沿海贸易殖民地的建立者以及这些港口腹地的定居者，他们迅速通婚，在语言、聚落和政治上留下了印记。</p>\n<p>对爱尔兰-诺斯人而言，一如对其他斯堪的纳维亚群体，劫掠与征服只是一系列活动谱系的一部分，这一谱系还包括殖民与贸易。九、十世纪赫布里底群岛密集的爱尔兰-诺斯人定居，几乎抹去了先前文化群体的所有痕迹，并留下了至今犹存于这些岛屿地名中的遗产。在冰岛，爱尔兰-诺斯定居者与来自挪威西部和北部的移民会合，后者发现了一片几乎无人居住的土地，约于870年至930年间在此大量定居。他们在那里复制了其斯堪的纳维亚北部故乡的政治组织——一个由小酋邦拼合而成的格局，各酋邦头人统治着大体自我调节的农耕社区——并因其始终没有王权而独具特色，直到1262年冰岛归于挪威王室控制。</p>\n<p>从十世纪初到十一世纪初，都柏林——爱尔兰最富有、最具影响力的诺斯人殖民地——实际上已是另一个小王国，其政治意义因巨额商业财富的积累而增强。其统治者将劫掠、奴隶贩卖与军事征伐扩展到英格兰北部和苏格兰西南部，以此壮大自身。其居民无疑靠区域内产出的农业剩余维持生计，但跨越爱尔兰海及更远地区的贸易——尤其是奴隶贸易——将这个繁荣的港口纳入横跨北海和波罗的海、并最终与高加索和河中地区的穆斯林商人相连接的斯堪的纳维亚贸易网络。沿这些路线流动的贸易与贡物，多以碎银（被切割成大致均一重量的银项圈、银臂环等）或银币的形式进行；但为了便利其贸易事业，诺斯人先将外国钱币输入爱尔兰，随后开始在都柏林铸造自己的货币。地中海与近东自公元前七世纪以来便已熟悉以金属货币作为交换媒介以及统治者威望与权力的象征：而爱尔兰迟至997年才开始铸币，这正衡量出地中海与非罗马化的欧洲地区之间的文化差异。</p>\n<p>早在那一日期之前，西撒克逊诸王已将维京军阀逐出英格兰，并将深受斯堪的纳维亚影响的东部低地纳入一个重塑后的君主政体，该政体强行宣称对英格兰西部和北部的威尔士人、不列颠人、盖尔人和诺斯人的宗主权。在南部，即其西撒克逊核心地带内外，他们建立起被称为 burhs 的大型防御中心，这些中心不仅在对抗维京人的斗争中服务于战略军事目的，还迅速成为新型城市发展的焦点。尽管与农业腹地保持紧密联系，这些晚期盎格鲁-撒克逊城镇既是复杂而人口稠密的贸易社区，也是王室和教会权力的中心。它们为本地出产的农业剩余和手工制品提供区域市场，并输入日益增多的丝绸和葡萄酒等声望商品，以满足讲究时尚的精英阶层。最重要的是，城镇中设有王室铸币厂和税收官，晚期盎格鲁-撒克逊诸王借此以银便士的形式从繁荣的英格兰经济中汲取巨额税金。</p>\n<p>到1000年，盎格鲁-撒克逊的英格兰是否已成为欧洲最富有的王国？这一观点是有据可辩的。诚然，到十世纪晚期，当伊斯兰白银流入斯堪的纳维亚的供应逐渐枯竭，而复兴的丹麦王权的波罗的海扩张又被奥托帝国所阻时，英格兰成了最诱人的财富来源：大量银币在流通，地方性和区域性的城市市场欣欣向荣。由丹麦国王组织的新一轮对英格兰的进攻，最终于1016年导致西撒克逊统治王朝的覆灭以及克努特的即位，后者不久又兼任了丹麦王位。在此基础上，他建立起一个北海帝国，从都柏林出发，经苏格兰和斯堪的纳维亚，一直延伸到波罗的海；但这种个人霸权并未延续到其1035年去世之后(图8.4)。</p>\n<p>克努特的北海帝国依赖的是此前两百年间丹麦人和挪威人所建立的海上联系与贸易财富。到十一世纪初，这种疆域辽阔的霸权是北欧的特征，而非卢瓦尔河和阿尔卑斯山以南地区的特征——后者正在形成的是区域密集型而非帝国扩张型的政治体。法国分裂为区域性的或地方性的领主领地，正是这一趋势的体现。然而，传统政治版图与新兴物质财富积累之间的脱节，在北意大利表现得最为尖锐。</p>\n<p>到新千年之初，意大利城市正处于迅速扩张的城市经济与商业经济的枢纽，并开始主张自身的自治权。虽然意大利的城市生活从未像阿尔卑斯山以北那样几近消亡，但在约600年至约800年期间，意大利城市作为生产、交换和消费中心的作用却难以评估，尽管生产与交换的加速显然比北海地区要晚得多才出现。随着证据日渐丰富，我们可以 traced 出与罗马晚期及后罗马时代地中海不同的模式，尽管证据性质的改变(无论文献还是考古)可能夸大了经济变革的印象，这一点仍然成立。</p>\n<p>北意大利于774年被并入法兰克王国。加洛林王朝的控制在888年之后瓦解，但到十世纪中叶，加洛林王朝的德意志继承者奥托王朝，从其遥远且经济落后的萨克森的主要权力中心，重新确立了跨阿尔卑斯山的统治权。在莱茵河东北，由于缺乏历史悠久的城镇或市场，也缺乏发达的货币使用经济，统治者不得不依赖其他方式来支撑其统治：巡行王权、庞大的地产、依附民族的贡赋，以及看似无穷无尽的边疆战争掠夺。难怪北意大利会吸引他们，因为这里的城市财富正在迅速发展。</p>\n<p>尤其值得注意的是，九世纪期间，一些意大利沿海新兴城镇的成长，它们地理位置优越，便于发展远程贸易联系，却不利于农业。位于亚得里亚海顶端的威尼斯，利用其处于加洛林帝国与拜占庭帝国边境的位置，至少从840年起便实际独立，只需专注于自身利益。威尼斯人将精力投入贸易经济，使其在西欧、拜占庭与伊斯兰东方之间的商品运输中占据了关键地位，以至于到十世纪晚期，在穆斯林看来，亚得里亚海干脆就是“威尼斯湾”。<sup class=\"fn\" data-note=\"6:6\">6</sup> 这一认知十分重要，因为威尼斯的显赫地位很可能大部分源于其作为奴隶贸易转口港的角色。在欧欧洲东部边缘俘获的奴隶在此装船运往埃及，再转运至主要的伊斯兰城市——在那里，与基督教世界不同，奴隶制是基本的社会与军事资源。作为回报，威尼斯商人进口“海外东方的全部财富”，并将这些奢侈品沿波河河谷向上贩运。<sup class=\"fn\" data-note=\"6:7\">7</sup></p>\n<p>在第勒尼安海多岩石的南意海岸，阿马尔菲同样起源于六世纪晚期抵御陆路入侵者的要塞。九、十世纪时，阿马尔菲人以其舰队支持基督教邻邦对抗撒拉森海盗，或在最符合自身野心时帮助阿拉伯人对抗基督徒，在此过程中与伊斯兰地中海的各港口建立了利润丰厚的贸易联系。通过这些政治手段，精明的商人培育出一个新的、城市化的商业社会，其“富庶与奢华”引人注目。<sup class=\"fn\" data-note=\"6:8\">8</sup></p>\n<p>那么，十世纪末那些较为古老的意大利城市状况如何？罗马城市帕维亚自六世纪晚期以来一直是伦巴德王国的首都，其王宫在加洛林王朝继而在奥托王朝统治下仍是意大利的王室政府所在地。出自王室金库的详细条例，记录了十世纪末这座城市——皇帝及其随从经常造访之时——的经济生活。皇帝通过其司库对经过帕维亚的贸易征收通行税，并管理其铸币和市场活动，既为自己牟取财政利益，也维持法律与秩序。该条例还告诉我们城中城市共同体及其工匠的情况——驾着小船的渔民、制革匠、船主、大船的水手、淘金者和制皂者——以及途经此城的商贩。其中有来自阿尔卑斯山以外的盎格鲁-撒克逊人和其他人——可能是法兰西人和德意志人——他们买卖马匹、奴隶、羊毛、亚麻布和帆布、锡和剑。意大利人也会前来：来自卡拉布里亚海岸的阿马尔菲、萨莱诺和加埃塔的商人，尤其是富有的威尼斯人，他们沿波河河谷向上贩运，购买葡萄酒和谷物，同时带来拜占庭和穆斯林世界的货物——香料、象牙梳、银镜之类。因此，帕维亚既是当地农产品的出口地，也是手工业品的生产地、进口奢侈品的集市，还是行政中心和帝国权力的展示场。奥托王朝的君主同一切统治者一样，发现贸易通行税是有利可图的收入来源，他们在帕维亚的金库也不例外。</p>\n<p>但这一切未能持久。从十世纪晚期起，帕维亚市民开始反抗帝国控制，并多次发动叛乱。1024年，当他们听到皇帝亨利二世死讯时，他们将王宫彻底摧毁，以至于其位置如今已无从知晓。他们的起义标志着一个时代的终结。帝国在意大利的中央集权行政实际上已告终结，整个意大利争取城市自治的步伐在十一世纪中不断加快。罗马帝国瓦解后形成的政治格局，已再难以容纳意大利城市财富的新现实。</p>\n<h2 id=\"ch8-s1\">宝藏、馈赠与庇护</h2>\n<p>帕维亚通行税条例的作者还记录了一系列习惯性支付，它们并不属于十世纪末意大利蓬勃发展的商业经济。国王司库的妻子可以指望来自意大利其他城市的商人向她馈赠东方制成品和精美花纹丝绸。司库本人则须定期向帕维亚的主教座堂捐赠灯油，并向其看守人捐赠衣物。我们在此遇到的是其他形式的交换，女性往往是其中行家，但其目的并非商业利润。向宗教机构馈赠 prestige 礼物或慈善捐赠，代表的是截然不同的交易形式，其社会、政治或宗教维度居于首位。将焦点转向以庇护、馈赠或强制剥夺为特征的社会互动，我们便能更好地理解物质资源如何被转化为象征资本——即转化为荣誉、威望和政治影响。</p>\n<p>这一场景不在罗马，而在帝国的拉文纳。六世纪圣维塔莱教堂中一块华丽的镶嵌画描绘了查士丁尼(527–565年在位)——最后一位在君士坦丁堡统治的操拉丁语的皇帝，他几乎实现了一个梦想：驱逐意大利、西班牙和北非的武士国王，将这些行省收归帝国直接控制。他身着紫金服饰，头戴嵌满宝石的巨大王冠，肩佩相配的胸针，两侧是衣着由奢华到朴素各依其等级的廷臣。他的皇后狄奥多拉在教堂另一侧与他相向而立，装束同样华贵，其随从的衣着也精心强调明确的等级。二人手捧同样华美的礼物：他托着一只巨大的金盘，她捧着一只镶满宝石的金杯。这对帝室伉俪的形象揭示出，在罗马晚期世界，炫耀性的展示与馈赠是权力的外在装饰。通过服饰、贵重物品、艺术与建筑来表达，古代晚期的权力与威望修辞中包含着一种有形财富的语言，男女两性以互补的方式娴熟地运用它。</p>\n<p>那些装饰奢华的教堂——献给基督教上帝的礼物——至今仍矗立着，提醒我们罗马晚期皇帝与贵族所拥有的巨额可支配财富。它们也表明捐赠者的期望：慷慨或许能换来圣徒更多的庇护与保护，因为建造和捐赠教堂，是将支配人际关系的习俗与期望投射到超自然领域。在罗马人中，馈赠巩固个人间的友谊，并为政治恩惠的交换提供便利。在一个获取庇护是政治与社会晋升之关键的文化中，礼物可以巩固庇护人与被庇护人之间的支持流动。礼物之所以居于核心地位，反映了一个基本事实：在罗马晚期世界，真正的权力与影响的润滑剂是个人恩惠和直接接触，而非其笨重的官僚程序。</p>\n<p>古代晚期的皇帝在即位时会向人群抛撒钱币，并向受宠的支持者分发精美的银盘和餐具作为赏赐。他们也常常向邻近的国王和军阀支付巨额款项，以换取和平或使其服从其他政治目标。就这样，罗马的威望物品——金币与金质奖章、奢华的银餐具、标志高级身份的嵌宝胸针——涌过帝国边境。考古学家从斯堪的纳维亚和波罗的海东部到黑海，到处都发现了它们的残余：四、五世纪罗马财富涌入北欧武士首领与多瑙河流域的宝库，提升了这些领袖相对于自身追随者的威望与权力。当这些威望物品流经古代晚期帝国的政治、社会和宗教血脉时，它们将官僚体制包装成直接的个人关系的外表，帮助赢得天上圣徒的支持，赋予合法性，并构建了帝国与其敌人和邻邦的关系。</p>\n<p>中世纪早期西方的后帝国诸王国仍然牢牢处于这一政治秩序之中。国王们从帝国那里获得启示——以及大量宝藏。两个六世纪的事件揭示了其中所涉及的物质丰富性与政治象征意义。第一件关乎克洛维于507年对高卢西南部和西班牙的哥特人及其国王阿拉里克二世的胜利，后者被他所杀。此役使他得以将高卢西南部夺取为法兰克人的领地，从而将哥特人限制在伊比利亚半岛，这令阿拉里克的岳父、意大利国王狄奥多里克大帝(493–526年在位)极为恼怒。克洛维的军队尽可能夺取了阿拉里克的宝藏，但关键在于，未能夺走对其王朝认同至关重要的传家宝。其中包括古老的政治珍宝，是阿拉里克一世率哥特人于410年洗劫罗马时所夺：“其中有大卫和所罗门——希伯来人君王——的珍宝，蔚为奇观……它们大多饰以绿宝石，是古时候罗马人从耶路撒冷掠取的[即公元70年罗马洗劫耶路撒冷]。”<sup class=\"fn\" data-note=\"6:9\">9</sup> 这些先后属于犹太人、罗马人、继而哥特人的古老政治认同标志，向世人昭示阿拉里克一世的继承者是罗马帝国政治中的合法玩家。这些珍宝太珍贵了，绝不能落入法兰克人之手，于是狄奥多里克将其置于自己的保管之下，待他的外孙阿玛拉里克成年即位时归还于他。无论其作为黄金宝石的价值如何，这些传家宝象征着威望、合法性与王朝的延续。</p>\n<p>在胜利后不久，克洛维便获得了拜占庭皇帝阿纳斯塔修斯(491–518年在位)以传统帝国荣誉与庇护象征形式给予的回报，因为他的胜利也符合后者的政治策略。克洛维随即以一场戏剧性的王者慷慨之举，向其新臣民宣示了自己提升的地位：在一场仿罗马风格的胜利游行中，他将大量战利品赠予图尔的圣马丁教堂，并身着罗马服饰，“骑上马，亲自满怀最大的善意，将金银分发给庭院大门[圣马丁教堂]与城中大教堂之间道路两旁的人群”。<sup class=\"fn\" data-note=\"6:10\">10</sup> 通过立即重新分配战利品，克洛维确立了自己作为慷慨统治者的声望，与该地区最重要的圣徒之一结成同盟，并将其新臣民置于一种道德义务以支持和忠诚回报他的义务。在这次以及许多其他场合，克洛维都是礼物与财宝象征意义的高明操纵者：通过给予，他有所收获。</p>\n<p>我们的第二个插曲来自六世纪末，涉及克洛维的曾孙希尔佩贝特二世（575–596年在位）。584年，拜占庭皇帝莫里斯（582–602年在位）曾赠送他五万枚金币（索里达），以诱使他入侵意大利。半岛在仅仅一代人之前才被查士丁尼以巨大代价收复，随后又在568年遭到阿尔博因率领的伦巴德人入侵，后者在此后二十年间将其控制扩展到半岛整个北部。莫里斯的策略是由来已久的“花钱让一个武士国王攻打另一个”的伎俩；他希望法兰克人能将伦巴德人赶出意大利。</p>\n<p>外交赠礼要奏效，须以赠受双方都承认其中隐含的道德准则为前提，并且双方在以财宝换取和平的交换中享有对等的政治利益。但在这个特定场合，它失败了。当希尔佩贝特进军意大利时，伦巴德人以臣服避免冲突，并献上他们自己的礼物以劝他离去。莫里斯认为希尔佩贝特违背了这笔酬金的条款，要求归还；但这位法兰克国王对自己的权势如此自信，甚至不屑回复。在这场政治扑克游戏中，希尔佩贝特两度获胜。他在经济上两度获利，因为莫里斯的酬金约重227.5公斤黄金，而伦巴德人的“许多礼物”必然也相当可观。<sup class=\"fn\" data-note=\"6:11\">11</sup> 但他还在政治地位上两度提升：一次是拒绝了莫里斯礼物所暗含的服从帝国意志的从属关系，一次是接受了伦巴德人随礼物而来的臣服。由此他既增加了物质资本，也增加了象征资本。</p>\n<p>正如507年和584年的事件所示，支撑后帝国时代政治的财宝数额巨大。它们还表明，能否获得并掌控财宝，在竞争的国王、臣民和拜占庭皇帝眼中，与政治合法性密切相关。然而莫里斯的经历提醒我们，发放政治补贴是难以预料且充满困难的：它可能实现、也可能无法实现捐赠者的目标。</p>\n<p>作为达成政治目的的手段，赠礼不必达到整车黄金珠宝的规模：它甚至可以只需一片草地上采来的一束花，或一封用心写就的书信。为说明这一点，让我们在六世纪的高卢再多停留片刻。566年，一位意大利诗人来到西吉贝尔特（561–575年在位）、即希尔佩贝特二世之父的宫廷。维南提乌斯·福图纳图斯以极大的光彩开启了他的生涯：在西吉贝尔特与布伦希尔德成婚之际，他向国王献上了一首精心创作的婚颂。福图纳图斯迷人的拉丁诗歌通常被解读为后帝国时代高卢对古典文学文化持续推崇的标志。但这位意大利人不仅是一位出色的诗人，还相当圆滑机敏，以至于他最终吸引到的庇护为他带来了一顶主教冠。当我们注视他结交朋友、扩大影响时，也能窥见赠礼如何成为沟通个人之间关系的庇护体制的一部分。</p>\n<p>饮食是福图纳图斯时常挂在心上的主题。他靠着宴会的邀请和食物的馈赠兴旺——实际上也是生存。他的回赠则是诗歌与颂词：</p>\n<p>甘露、美酒、食物、衣裳、学识、良机：\n戈戈啊，你以慷慨的馈赠令我心满意足。<sup class=\"fn\" data-note=\"6:12\">12</sup></p>\n<p>戈戈是西吉贝尔特宫廷中的资深官员，交游广泛、颇具影响，是这位意大利诗人有用的庇护人。借助这层关系，福图纳图斯得以享受“友谊的果实”。<sup class=\"fn\" data-note=\"6:13\">13</sup> 有一首诗写给孔达，此人出身寒微，却升至西吉贝尔特扈从中掌管财政与行政的关键人物，这首诗暗示了利益流动背后的政治现实。福图纳图斯评论说，西吉贝尔特已因孔达能干的效劳而赏赐他丰厚的礼物：“远比众人强大的国王恰如其分地给予了更好的酬报，你的情形正表明他更看重什么。”孔达自己的行为也以国王为楷模：“你以慷慨与仁慈向众人广施礼物，并以馈赠将人们凝聚在你身边。”<sup class=\"fn\" data-note=\"6:14\">14</sup> 国王的榜样是整个社会等级都应效法的，因为在各个层级，慷慨的赠予都会造就义务。像戈戈和孔达这样的权力经纪人若愿意，极有条件操纵王室恩赏的流动：福图纳图斯的颂词可谓瞄准精准。</p>\n<p>最终，福图纳图斯在两位特定的庇护人那里安顿下来。一位是境遇艰难的图尔主教Gregory（都尔的格里高利）。另一位是拉德贡德（卒于587年），她曾是克洛塔尔一世（511–561年在位）的王后，此时已在普瓦捷隐修。身为修女，她继续施展其宫廷技艺，并为了自己的目标，利用了华服与美食的传统女性联想。在图尔，维南提乌斯以特别的“谦卑仆人”身份向格里高利自荐。这位主教对这位写诗门生的支持，从鞋皮礼物直至地产田庄。作为回报，这位意大利人在重大政治危机的时刻运用其文学才华支持格里高利。在普瓦捷，拉德贡德和她的女修道院长艾格尼丝时常从自己的餐桌上给福图纳图斯送去食物——一壶牛奶、深色的李子、精致的点心。无论出自富有的王后、领主之妻，还是献身于修道院清贫的女子之手，食物都是一种滋养的不止是人的肠胃的礼物。福图纳图斯以同样朴素的信物回报——几束紫罗兰、一只手工编织的盛甜栗的篮子——并充分运用其修辞技巧，促成拉德贡德在互相仇杀的国王之间缔造和平以及收集天上不朽者地上圣髑的计划。在精巧的诗歌意象背后，福图纳图斯和格里高利、拉德贡德一样深谙宫廷赠礼游戏的不成文规则。三人都十分清楚，礼物、义务、酬报与影响是密不可分的，因为他们深谙如何将物质资源转化为社会权力、政治影响与圣徒的庇佑。600年前后不久，福图纳图斯如愿以偿——在普瓦捷当上了主教。</p>\n<p>运用财富巩固政治友谊，或维持并更新既有的忠诚、依附与效劳的纽带，并非晚期罗马世界及其直接继承者所独有。事实上，五、六世纪的统治者之所以能如此迅速地将再分配与互惠的政治为己所用，原因之一就是类似的习俗本来就是那些在五世纪改变了罗马西部政治版图的武士集团文化的固有组成部分。莱茵河—多瑙河边境以北以及不列颠诸岛非罗马地区的酋邦组织，无疑远比帝国官僚制国家——连同其众多专业分工和庞大军事机器——简单。这些政体的国王缺乏行政的或强制的统治手段，所能依靠的几乎只有个人影响与义务的纽带。</p>\n<p>他们用物质财富锻造这些纽带。这种纽带最著名的表达见于《贝奥武甫》，但在许多其他语言的早期中世纪史诗中都有密切的平行文本。史诗中贤明的军事领袖或国王对追随者慷慨大方，以丰厚的礼物酬报战场上的英勇，并由此投资于对未来效劳与支持的期待。一位能干的战争领袖会吸引雄心勃勃的年轻武士加入其扈从，在自己的厅堂中款待他们、设宴飨之、为之配备武器：在权力竞争中，互相争雄的领主用财宝、珍贵的武器和自己的声誉来扩充军队、争夺胜利。《贝奥武甫》中，赫尔福德纳之子赫罗斯加就是这样一位统治者：</p>\n<p>后来赫罗斯加赢得了战场上的荣耀，\n对疆场的掌控；于是朋友和族人\n欣然服从他，他的队伍不断壮大，\n成为一支庞大的军旅。<sup class=\"fn\" data-note=\"6:15\">15</sup></p>\n<p>来自耶阿特人国土的王族武士贝奥武甫，便是投效赫罗斯加麾下者之一，他的功绩构成了对武术成功、财宝、酬报、荣誉与统治这一社会准则的长篇注解。当贝奥武甫诛杀了袭击鹿厅的怪物归来时，这位丹麦国王宣告：</p>\n<p>你将不缺任何\n我所能赐予的世间财物：\n较低微的功绩也曾获得酬赏，\n我们曾从宝藏中礼遇过不及你英勇的人，\n在战争中远弱于你者。但你已用自己的双手\n确保了不朽的荣誉，\n让你的名字永世长存。\n于是厅堂已为宴席布置停当——“金线绣成的\n挂毯|在墙上熠熠生辉”——赫罗斯加前来入席：\n没有一个民族聚集过更盛大的扈从，\n围绕他们的赐环者举止更为得体。\n以勇武著称的人们来到长凳旁，\n在宴饮中欢欣；他们畅饮\n一杯杯蜜酒，殷勤地舒展身心。\n……\n随后，作为胜利的象征，赫尔福德纳之子\n授予贝奥武甫一面金饰的军旗，\n一面绣纹的战旗，还有胸甲和头盔；\n众人对那柄在英雄面前\n捧持的奇剑赞叹不已。贝奥武甫在厅中\n与众人共饮。他没有理由\n在武士面前为如此精美的礼物感到羞愧！<sup class=\"fn\" data-note=\"6:16\">16</sup></p>\n<p>赫罗斯加随后又加上八匹佩有黄金宝石辔头的战马，使礼物更为丰厚；而通过赠礼，二人的声望都得到提升：</p>\n<p>于是这位荣耀的王储、宝藏的守护者，\n以战马和铠甲酬报了这些功绩；\n如此慷慨大方，任何正直的人\n都无从加以贬损。<sup class=\"fn\" data-note=\"6:17\">17</sup></p>\n<p>赫罗斯加和贝奥武甫都避免了那种在荣誉与酬报文化中令人畏惧的暗流——耻辱：贝奥武甫通过战斗赢得了财富与声誉，而赫罗斯加则展现了王者的慷慨。当英雄回到耶阿特人那里，珍贵武器的流通仍在继续，因为他随即把它们赠给亲族海格拉克国王，以此彰显自己慷慨的精神。贝奥武甫已证明自己有资格继承王位。</p>\n<p>《贝奥武甫》是一部伟大的文学史诗，其主人公是传说人物。但其社会风气仍是早期中世纪尚武文化中围绕赠礼的仪式与价值观的真实写照——这一点得到来自欧洲各地的广泛史料的有力印证。这些史料以朴实无华的叙述记载劫掠远征，以生动的描述记载宴席及其他礼仪场合交换的礼物，为史诗的价值观提供了历史的具体性。战争、劫掠与宴饮都与其他交换形式并存：它们是领主或王庭据点上农业、手工业或商业财富集中形态的军事与政治补充。</p>\n<p>在《贝奥武甫》篇章中如此显赫的珍宝，并不仅限于精工锻造的武器和镶宝的护身铠甲。它们还包括金制的杯盏与餐具、臂环与颈环。这些个人饰品由女子佩戴和馈赠，与男子无异，因为在塑造所有早期中世纪社会的夺取、再分配与互惠这一环环相扣的传统中，妇女扮演着不可或缺的角色。她们也是赠礼者，运用自己掌控的一切资源，为其选定的政治与宗教目的施行庇护，正如我们所见的狄奥多拉和拉德贡德那样。维护宫廷礼物与款待中的等级与社会位次之精妙，这一任务也常常落在她们肩上。一份九世纪关于查理曼王室家务复杂组织的指南对此有明确说明：“宫廷的妥善管理，尤其是王室尊严，以及每年赠予官员们的礼物（惟马匹的食水除外），主要归于王后，并在其之下归于宫伯。”<sup class=\"fn\" data-note=\"6:18\">18</sup> 在监督礼物拣选的过程中，王后维护着宫廷仪式赖以运行的荣誉经济。</p>\n<p>女性不仅是慷慨的施与者，也可能成为其对象。赫罗斯加曾将女儿弗雷亚瓦鲁许配给丹麦人的仇敌英格尔德，希望借此终结一切宿怨与致命的战争，凭借这位女子。<sup class=\"fn\" data-note=\"6:19\">19</sup></p>\n<p>尽管《贝奥武甫》的作者怀疑联姻和亲的成效，此类做法在早期中世纪的文献史料中却屡见记载。一个早期事例即可说明：作为对507年克洛维击败伊比利亚哥特人的反制，东哥特的狄奥多里克大帝将侄女阿玛尔贝尔加嫁给法兰克人的仇敌、图林根人的赫尔米纳弗里德。狄奥多里克以交换“王室品位所要求的礼物”缔结这门婚事，并向赫尔米纳弗里德宣告：“愿神的眷顾伴随你的婚姻，既然友谊已将我们联结，愿亲族之爱也将我们的后代维系在一起。”<sup class=\"fn\" data-note=\"6:20\">20</sup> 赫罗斯加定会认得这份情意——但他也会承认，联姻的结果和赠礼一样难以预料。</p>\n<p>来自全欧各地的考古材料证实了早期中世纪金匠与铸剑师的技艺与工艺水平。它也向我们归还了那些界定财富、权力与威望的珍宝中的一小部分。但其中蕴含着一种反讽，因为考古学家发掘出的黄金珠宝大多是被人有意埋藏的，尤其是在欧洲较偏北的地区。撇开众多主人在动荡时期为日后取回而埋藏的窖藏不谈，有意的埋藏可能标记着具有仪式或宗教意义的地点与行为。埋藏的社会功能之一，是提供一种入藏的景观——供有幸观看的群体目睹。另一重功能则在于此后珍宝隐而不见、无形地在场的这一认知。这正是五世纪日德兰和瑞典南部将战利品沉入沼泽献祭的背景，它们间接地反映了交战酋邦纪念战胜敌人的方式。在丹麦菲英岛上一个五至六世纪的政治、宗教权力与贸易中心古姆（意为“诸神之家”）出土的众多黄金窖藏，也具有宇宙论意涵。在这里我们遭遇到财富与超自然之间一系列非罗马、非基督教的关联，由于缺乏揭示其宇宙观的文字证据，其完整的宗教或意识形态意涵已无法完全复原。这些窖藏虽然缄默，却耐人寻味。</p>\n<p>同样出于有意为之的，还有随葬品——无论日常用品还是珍贵之物——的丧葬埋藏。考古学家已在英格兰和地中海以外的欧洲大陆发现（并仍在发现）约400年至700年间成千上万座有随葬品的土葬墓，另有少量出自地中海地区。这类墓葬从极为简朴直至极其豪华不等。以英格兰东南部普里特尔维尔的东撒克逊人墓地为例，那里已发现约20座六至七世纪的墓葬。有些墓中完全没有随葬品；另一些不过一把刀、一枚胸针或一两件陶器。其中一座墓葬包含一座非同寻常的墓室，其发现于2004年2月公布。一位武士于七世纪上半叶被安葬在这一大型墓室中，随葬有他的剑和盾，木构棺室。他下葬时身穿金线织物，系着一条配有巨大金带扣的腰带，脚穿金扣鞋，胸前放着两枚小型金箔十字架。他的墓室中陈设了种类繁多的器物，暗示着远方的联系：一件拜占庭水壶和一把有铭文的银匙；一只大型科普特碗；两枚来自墨洛温高卢的金币；来自爱尔兰或英格兰北部的悬吊碗；以及两对肯特玻璃罐。墓中还有种种器物，显示出一位喜欢以奢华方式款待扈从的统治者的气派：一把可能来自意大利的罗马式折叠座椅；一个高高的火把架（或许也是王旗架）；装饰过的饮酒角杯；配有镀金配件的木酒杯；一把里拉琴；棋子和骰子；此外还有悬吊的釜、木桶和一只匣子。</p>\n<p>如同盎格鲁-撒克逊英格兰所知的少数几座随葬丰厚、可能属于王族的墓葬一样，普里特尔维尔的这座王侯之墓无疑兼具宗教与社会两重背景。一方面，它暗示了基督教传播过程中常见的复杂性与矛盾性。<sup class=\"fn\" data-note=\"6:20\">20</sup> 另一方面，它呈现出一场体面的葬礼：有“司仪”操办其盛况，在世的亲族争夺遗产，旁观者则为场面所震撼。正如前文所见，随着罗马统治的崩溃与新王国的发展，丧葬仪式往往成为炫耀社会地位的场合——不仅是死者本人的地位，同样重要的是继承人的地位。<sup class=\"fn\" data-note=\"6:21\">21</sup> 鉴于中世纪早期继承制度的流动性与不确定性，亲族群体中一位显要成员的去世，对其幸存亲属及其更广泛的共同体而言，很可能是一场重大危机，若死者是统治者则尤甚。因此，将哪些武器、珠宝及其他器物放入早期中世纪的墓葬，是对贵重物品用途的刻意抉择。在关键的政治时刻埋葬这些财宝，是对威望与影响力的宣示，而葬礼本身则是重新谈判权力、重构社会关系的合适舞台。</p>\n<p>无论是加工成个人饰物、精美餐具，还是护甲与武器，黄金、白银和珠宝都是中世纪早期最耐久的动产财富形式之一。其他形式的财富则已消亡，只留下间接的痕迹。其中最突出的是欧洲北部和东部边缘地带劫掠与战争的受害者，那些地方掳掠奴隶成风。许多被奴役的人群被维京奴隶贩子从不列颠群岛船运至波罗的海，再转卖至穆斯林东方。另一些队伍则从中欧的斯拉夫地区被押往西方和南方。其中一些人随后在威尼斯和其他地中海港口登船，被运往穆斯林东方；另一些则经由凡尔登，再翻越比利牛斯山，供给科尔多瓦的倭马亚宫廷。这些不幸者存在的唯一物证，是他们被束缚用的颈箍、镣铐和锁链，例如出自喀尔巴阡山西端斯塔雷扎姆基要塞的那些遗物。一支从那里向西行进的奴隶队伍，很可能最终抵达巴伐利亚拉费尔斯泰滕的东法兰克边境税站。在这里，罗斯和波希米亚的奴隶贩子将他们转卖，很可能卖给了在中世纪早期欧洲奴隶贸易中地位显著的犹太人。这些奴隶队伍的商业价值必然相当可观，因为906年在拉费尔斯泰滕征收的关税记录表明，一名女奴与一匹战马等价。她是昂贵的商品，本身就具有威望，在生育方面有价值，以现金计，其价值是男奴（或母马）的四倍。</p>\n<p>女奴的巨大价值在爱尔兰也得到承认，在那里她们构成一种常见的价值单位。例如，一部八世纪的论著估算，一位省级国王的荣誉价格为十四名女奴。然而，在爱尔兰用于支付的最普遍的通货形式是牛。牛是爱尔兰经济的核心，在政治和社会领域同样意义重大。爱尔兰法律文献展现了一个领主通过授予牛只将依附者束缚于自身的世界，这既是经济投资，也是政治投资。这可以通过两种方式之一实现，形成“自由”依附或“基础”依附关系。两者共同之处在于一种制度：将领主的大畜群广泛分散，从而降低营养不良或疾病的风险；并且在若干年间，领主将收回数量等于或大于原授畜群规模的小牛和小母牛。虽然牛只是混合的农耕—畜牧经济中的一个要素，但它们拥有其他牲畜所缺乏的政治意义和象征重要性，依附关系的其他方面也揭示了这一点。就基础佃农而言，其荣誉被并入领主自身的荣誉之中，形成明显的隶属关系。此外，基础依附者每年缴纳食物贡赋，在领主的土地和工事上服劳役，并通过每年冬季一次宴请领主及其扈从、以及在领主军队中为其作战来表明自己的臣服。相反，自由依附者与领主保持着一种体面的关系。他本人很可能具有贵族身份，并且在偿还所借牲畜时，其条件表明他拥有相当数量的自有畜群作为后备，以防领主的牛群繁殖不济。他的地位还有其他迹象可寻。与基础依附者不同，自由依附者不丧失任何独立性。他只需在领主于地方政治大会上起身时随之起立，以标示这种关系，或许还需承担相当轻微的劳役。通过牛只依附制度，领主不仅仅是安排畜牧。他获得食物供养，自己的耕地也有人代为耕种。他获得与其财富和身份相称的依附者和一支军事追随力量。凭借大群牛只，他可以具备“第一等贵族”的特征，享有该地位所蕴含的一切威望与权力。<sup class=\"fn\" data-note=\"6:22\">22</sup></p>\n<p>这一切对于以牛为通货等价物、生活在特别适宜畜牧的自然环境中的人口而言是合理的。但法典所提示的这种条理化制度，必然受到其他更严峻现实的制约：席卷爱尔兰的牛瘟事件，领主之间争夺自由依附者的激烈竞争，以及劫牛行动——这是众多领主和小国王之间爱尔兰式的地位竞争所特有的、且往往致命的形式。吊诡的是，劫牛既是维持社会平衡不可或缺的一环，又对生命和肢体构成危险。但这种悖论只是表面的，因为劫牛与械斗一样有其自身的惯例。与械斗相同，同时代的人也将其存在理由视为理所当然。一次成功的袭掠会扩充领主的种牛群，从而可能使其招募更多依附者。它还提供了一个展示勇气与武技这类男子汉伦理的舞台，而引发报复性袭掠的可能性则使赌注升高。若袭掠失败，首领可能丧失威望，甚至可能丧命并导致其追随者群体的瓦解。劫牛使资源保持流通，并要求不断重申武力和内部团结。在此过程中，它们提供了商议荣誉准则、将领主与其追随者联结在一起的机会。</p>\n<p>就现存的证据而言，已无法查明爱尔兰这种以牛为基础的恩庇制度在中世纪早期进程中发生了多大变化。但在其他地方，慷慨政治的显著发展则更容易追寻。其中最重要的，是地产作为恩庇对象——以及竞争对象——日益增长的重要性。其原因有许多已在前面提及：人口的增长；不可转让的教会捐赠的先例；对基督徒灵魂死后归宿的关注；以及从土地中获取可观现金收益的能力的逐渐增强。自七世纪起在欧洲大陆、八世纪起在英格兰，土地授予日益成为重要的酬赏形式。虽然威望物品始终是对另一位统治者的恰当馈赠，但它们在国王与其随从之间的关系中的作用，因获取土地的压力而有所调整。</p>\n<p>不动产是最有力、但也最复杂的馈赠或恩庇形式。正因如此，它对维护荣誉至关重要，却也容易产生特殊的紧张关系。与劫掠品或贡赋不同，它无处不在但数量有限——除非存在招致侵略与夺地的开放边疆。作为收入、领主权和地位的来源，它具有潜在的持久重要性。但它通常附带种种限制，且往往受多重利益支配。若授予俗人，日后可能因行为不端而被没收。若授予教会，则附带祈祷和服军役的相应义务。此外还可能需要应对或顾及原主的继承人的期望，或考虑现有的佃户。而且，捐赠人将土地赠予教会，通常并非出于一时有限的虔诚之举，而是希望与一个宗教团体及其主保圣人建立持久的属灵纽带。世俗与宗教恩惠的交织，以及持续的义务承诺， thus 构成了地产恩庇政治的核心。</p>\n<p>我们再次以艾因哈德为向导，得以罕见而生动地洞察以土地为基础的恩庇制度所固有的不安全感。在814年查理曼去世后的十五年间，精英阶层围绕继承、恩庇与酬赏的矛盾不断加剧，使关于帝国继承权的争端进一步激化，并在830年以及833—834年酿成严重的叛乱。在这种政治不稳定的氛围中，对土地的控制比以往任何时候都更是政治成功的关键：自此以后，对土地资源的竞争以前所未有的方式驱动着政治。这正是艾因哈德的书信如此有效地展示的背景。</p>\n<p>通过他的书信，我们看到他与自己的私人助手和庄头进行交涉，以获取其地产的经济收益。读者立刻会注意到艾因哈德对细节的关注：他谈到诸如宰牛后内脏的分配安排之类的琐事，或蜜蜂连续两年产蜜不多后如何保障蜡烛供应的问题。这种细心是对“在恰当的时间将恰当的资源送达恰当的地方”这一巨大挑战的回应，无论是他前往亚琛宫廷期间供养扈从所需的食物，还是他在塞利根施塔特建造教堂时获取所需建材的困难。与根特圣彼得会牧师的领主权不同，艾因哈德的个人领主权没有单一的行政中心，而是随其庄园而流动。他还须保持警惕，因为他不得不与玩忽职守的庄园管事打交道，确保应得的收入足额收取，且收取的是成色良好的钱币。这类行政事务不可避免地带有政治色彩。加洛林时期的主教、修道院长和领主按传统——实际上是义务——每年向统治者呈献“礼物”，这些礼物通常采取威望物品的形式——马匹、猎鹰和武器，银器、金器和珠宝。这不仅有助于充实王室宝库，还界定了得以接近统治者的精英群体，也标志着他们对统治者的敬意。因此艾因哈德按时致函他的代理人，指示他们准备并向宫廷呈送他的献礼。在为充分利用地产而付出努力方面，他几乎不可能是独一无二的：只是他的书信比大多数其他史料更明确地揭示了这些困难。</p>\n<p>艾因哈德还期望有所回报，通常以政治恩惠的形式。他曾数次致函虔诚者路易或其家族成员，请求他们在建造塞利根施塔特教堂一事上给予恩庇和积极帮助。他通常通过暗示安葬于此的罗马殉道者马塞利努斯和彼得将赐福于其恩庇者来施加额外的压力，因为加洛林时代的恩庇观念与古典晚期一样，将圣徒牢牢纳入其中。另一些时候，在尘世宫廷中建立的交情——“友谊”——也可被援引来达成他的目标，无论是为其建筑工程获取更多资源，还是为其政治追随者谋取恩惠。土地也常常出现在其中，因为在830年代不确定的政治气候下，艾因哈德的追随者害怕失去他们的恩地——他们仅拥有暂时权利的那些地产——而作为他们的恩主，他运用自己的影响力和名望的威望，尽力为其效劳。而且，由于恩庇政治是一种互惠的过程，他的许多书信也表明，他自己也不断受到他人的纠缠，这些人试图将他的影响力用于自己的目的。因此他也致函宫廷官员、修道院长、伯爵和主教，在这里美言几句、在那里陈述案情，或在别处为某一任命求情。</p>\n<p>在这种不确定与任人唯亲的背景下，艾因哈德显现为一个其影响力值得结交的人物：一如既往，个人交情、恩庇与馈赠共同引导着权力和特权的流动，将友谊转化为政治。然而，在这方面，他巨大的政治资本与其相对有限的土地资源之间存在显著的不对称。或许，通过成为他心爱的天上殉道者在尘世的代言人，艾因哈德获得了有助于弥合这一差距的属灵资源。此外，他在宫廷中的漫长岁月，卓越的才华，以及对查理曼、继而对虔诚者路易坚定不移的忠诚，使他受益匪浅，因为这些品质为他在围绕帝国宫廷编织的社会权力之网中赢得了一个核心位置。与殉道圣徒和皇帝的亲近，弥补了他物质资源的匮乏。</p>\n<p>艾因哈德若在宫廷政治的流沙中谨慎周旋，一方面凸显了建立在王室恩宠和封地赏赐之上的世俗生涯之脆弱，另一方面也强调了世俗庇护与超自然庇护之间的相互关联。国王与地位较低的世俗人士共同的主要愿望之一，便是赢得上天的眷顾与代祷。而代表他们获得眷顾、将虔敬愿望付诸实践、把土地化为祈祷的，往往是他们的遗孀。正因如此，阿巴的遗孀埃蕾吉丝将土地遗赠给坎特伯雷的基督堂修道院；也正因如此，吉赛拉将大量精力投入到她与埃贝哈德在西松创建的修道院中。<sup class=\"fn\" data-note=\"6:23\">23</sup></p>\n<p>圣徒作为天上的庇护者具有强大力量，因此不仅是大量土地和财富的接受者，其本身也可能成为被奉献的对象。918年末，萨克森公爵亨利被德意志贵族选立为王，并于次年春天正式登基。由于缺乏对王位的世袭主张，亨利将其统治建立在精明的谈判、军事胜利，以及通过王室礼物交换积累圣物的基础之上。921年，他与硕果仅存的加洛林君主——糊涂查理——达成了一项平等条约，后者的承认提升了他的威望，有助于巩固他的地位。然而实际上，查理要弱得多，次年在战斗中战败并被自己的臣民废黜。急切寻求支持的查理送给亨利一件“信仰与真诚的信物”——即加洛林王朝特殊庇护圣徒、殉道者德尼的部分遗体。<sup class=\"fn\" data-note=\"6:24\">24</sup> 这一举动既是对查理在西法兰克的对手们的示威，同时也等于承认亨利一世是古老加洛林王朝的合法继承人及其宗教传统的保护者。圣德尼的手臂将历代法兰克国王的光辉延续到了这位新的德意志统治者身上。</p>\n<p>比圣徒或殉道者遗骸更为尊贵的，是与基督受难相关的圣物。在这一点上，亨利追随拉德贡德的足迹，获得了一件著名的珍宝。926年，他结束了与勃艮第国王鲁道夫二世（912–937年在位）的敌对关系，劝使其承认自己的宗主权，赠予他丰厚的礼物，并将士瓦本的一部分转让给他。两位国王的盟约以鲁道夫将“那件使上帝将尘世与天界联结起来的圣物”授予亨利而告成——即相传曾在受难时使用的“圣矛”，它曾为第一位基督教罗马皇帝君士坦丁所拥有。这件“对抗一切可见与不可见之敌人的无敌武器”，是鲁道夫短暂涉足意大利王位（922–926年）期间获得的礼物。<sup class=\"fn\">25</sup> 圣矛由他传入亨利之手，亨利又将它传给其子奥托一世，从此成为合法统治权与德意志帝国权威的持久象征，下一章将予以说明。人们携之临阵，视之为圣物和帝国的信物；它一直保存于亚琛，直至1806年德意志帝国终结，才与其余帝国权杖仪物一同被移送至维也纳，至今仍在那里展出。</p>\n<p>古代兵器的象征意义、世俗与神圣的庇护关系，都在亨利一世的圣物搜集中融为一体。经济资本转化为象征资本；世俗领主权通过精神庇护得以表达。王室的赠礼与结盟政治动用了多种“通货”：物质财富、神圣器物、领土控制、威望与合法性，彼此皆可转换。尽管奥托一世的帝国与四百年前查士丁尼的帝国几乎少有相似之处，国王与皇帝们仍继续运用类似的策略，追求类似的目标。成功的统治者娴熟地驾驭着他们所有可转换的资产。</p>\n<p>自十一世纪中叶起，其中某些观念开始发生变化。首先是在商品经济迅速发展的北意大利，随后扩展到其他地区，获取物质资源不再被视为蒙受神恩如此直截了当的标志。尽管中世纪早期的道德家曾谴责对财富的无度贪求，并将贪婪视为万恶之首，但他们从未质疑过有原则地积累财富的必要性，也从未质疑过界定并维系政治共同体的施予与回报之间的互惠关系。然而，在米兰、帕维亚等城市，货币交易与商业利润的激增，打断了礼物与恩惠往来的循环，也侵蚀了维系这种循环的共识。</p>\n<p>教士们开始为那些以忠诚、尤其是以教会职位和利益换取礼物者的灵魂纯洁而担忧。主教与修道院长卷入礼物交换和庇护网络，逐渐被等同于道德败坏：人们察觉到了异端的污点。而后，随着物质财富水平进一步上升，贫穷在某些人眼中开始成为更敬虔的选择。</p>\n<p>这一切在千年之交之前都是难以想象的。在中世纪早期，物质财富与政治权力沿着世俗、神圣、或兼而有之的渠道流动。两者都是多形态的、可变的、不稳定的，需要不断的强化。在面临匮乏之虞的共同体中，尘世的财富意味着上天的眷顾。如同土地一样，作为献给诸神和基督教圣徒的合宜祭品的珍宝，为其拥有者和奉献者带来宗教上与政治上的双重利益。在这个资源得之艰难、失之容易的世界里，拥有财富正是宗教精英与世俗精英的界定性特征之一。他们利用财富彰显地位；维护并强化自己的荣誉；建立并巩固与领主、统治者以及天上圣徒的联系。</p>\n<p>因此，积累资源并慷慨地加以分配，乃是迫切的必需。这要求持续的关注，任何世俗或教会的权力中人都不敢稍有懈怠。满盈的宝库对缺乏能力管理其中财物、并将其象征意义转化为政治与宗教优势的领主而言，用处甚微；而陈设华美的祭坛，对其庇护圣徒只是捐助者利益的怠惰代言人的教会来说，也无多大助益。然而，赠礼与庇护的惯例并无明文规则。它们普遍公认的道德与政治期望始终是隐含的，是一种嵌入社会实践中、并在宫廷权力运作的童年训练中被吸纳为一部分的共识。竞争激烈，尘世荣誉与灵魂命运皆系于此——中世纪早期始终是一个施予与获取的习俗世界。在观察了国王们如何将其资源转化为政治优势之后，我们接下来必须追问：他们如何为这种权力辩护，并使之显得自然而然。</p>", "text": "海岬上矗立着一座雄伟的堡垒，\n每人都在那里慷慨地获得自己的一份。\n·····\n高地上矗立着一座雄伟的堡垒，\n盛宴奢华，欢声喧腾，\n四周美景环绕，那勇士的堡垒，\n飞溅的浪花如翼：其翼何其长！1\n查理曼喜爱外国人，并悉心款待他们，以至于他们人数之众，可以说毫不冤枉地不仅成了宫廷的负担，甚至成了整个王国的负担。但由于查理曼天性宽宏，他不以此为虑，因为他以慷慨之名与良好声誉的回报，补偿了种种巨大不便。2\n查理曼深知统治者需要慷慨的名声。他的宫廷，如同威尔士“雄伟堡垒”滕比之主布莱杜德的宫廷一样，回荡着盛宴与欢宴之声，这是成功统治所需的奢华排场与炫耀性消费的一部分。根据当时人的一项估计，968年奥托一世的宫廷每日消耗“猪羊各一千头，酒十车，啤酒又十车，谷物一千斗，牛八头，此外还有大量的鸡、乳猪、鱼、蛋、蔬菜及其他食物”。3 即使这一记载有所夸大，它也表明了统治所需资源的规模。查理曼的慷慨（尽管布莱杜德的并非如此）必定也达到了类似的规模：招致批评也就不足为奇了。真正慷慨的统治者可以无视这些抱怨，并期待从其奢靡开支中收获政治回报。\n展示慷慨的盛况与维持精英的生活方式，只是领主和统治者动用其物质资源的两种方式。捐赠教会、赏赐追随者、支持王国行政、进行战争、修建宅邸、宫殿或城堡、从事外交、供养亲属：这一切都在消耗资源。因此，本章将探讨积累与分配各种形态物质资产的方式。本章以查理曼通过款待众多外国人来提升声誉这一事例为线索，聚焦于经济资本向象征资本的转化——即把财宝、货币、牲畜和农产品转化为荣誉、政治成功与神的嘉许。\n从一种形态向另一种形态的转化充满困难。土地及其出产仍是所有中世纪早期精英最主要的支持来源，然而即便是国王，也仍受制于恶劣天气与疾病爆发的无常变幻，因为食物短缺可能使征战无法进行，而疾病的爆发则可能使军队十不存一。以易腐食品形式获得的收入无法储藏于宝库之中，必须转化为更为持久的东西。当然还有其他财富来源，但它们同样往往不稳定。战利品可在战斗中赢得，也可能失去。不加节制的慷慨可能耗尽资源与声誉。继承与联姻可能带来财富的增加；供养子女则可能使其耗竭。统治者可能以外交礼品的形式积累大量财宝——但同样地，也必须以某种方式慷慨回赠。因此，尽管成功君王的标志之一是装满的宝库，尽管其合法性部分建立在对珍贵祖传宝物的守护之上，我们却不应对着静态的窖藏黄金图景进行思考。毋宁说，财富向政治权力的转化是一个流通与再分配的动态过程，是持续不断的流入与流出。国王囤积是为了能够支出；他们给予是为了获取。\n将物质资产转化为社会与政治优势，往往集中于特定的节点。本章第一部分将确定财富与权力趋于聚集的地点，将它们置于地理网络之中，并评述它们与所在政治体的关系。因此，这一部分将探讨在中世纪早期经济中积累与分配财富的方式，并考察国王及其他人如何利用这些方式。它还将考察商业模式的变迁及其与其他交换形式的关系。本章第二部分将焦点从地点转向人物，从地形网络转向社会网络。它将讨论馈赠与庇护作为策略，对于理解中世纪早期领主和统治者如何运用其资源以建立并维系权力至关重要。最后，本章认为物质财富有助于组织人界与超自然世界之间的关系，而对财富运用的考察也为我们洞察中世纪早期的宇宙观提供了途径。\n第6章所涉主要地点\n权力的景观，财富的景观\n在等级制组织的农业社会中，物质资源、政治领导权和超自然力量在地理上的不均衡分布，与在社会层面的不均衡分布同样显著。将文本与考古证据绘制成图，会呈现出一种复杂的景观：经济、宗教和政治功能在某些地点高度聚集，而其他地点则职能较少。为中世纪早期绘制若干此类 mental 草图，正是本节的任务。它揭示了巨大的变迁：绘制这些景观图是探索中世纪早期动态人文地理的有效方式。\n我们必须从古代地中海世界谈起。在那里，罗马帝国将城市及其附属领地组成的镶嵌体编织成一个庞大且异常持久的政治经济体系。任何一幅相关地图都会凸显城市共同体作为政治、宗教和经济焦点的支配地位。细察之下则会发现，这些城市之所以重要，还在于它们是地方利益与帝国利益交汇、重叠或竞争的场所。农业、战争、贡赋以及国家组织的生产与供应，维持这个帝国所需的庞大资源由此而生。事实上，罗马国家的需求如此巨大，以致它从政治疆界之外极远的地方汲取资源，到处寻求金、铁等矿物，香料、毛皮等声望物品，以及奴隶或士兵等人力资源。其内部经济是一种指令性经济，由帝国征发驱动，运输体系专为军队各部提供给养，并为罗马和君士坦丁堡的稠密城市输送粮食。四至五世纪庞大的官僚机构与军队使资源紧张到极限，然而帝国与贵族在精致城市建筑和典礼仪式上的奢华支出仍持续美化着城市环境，并在此背景之下昭示帝国的意识形态。在古代晚期，城市依然是财富消费与展示以及政治活动的中心，这一点在地中海地区最为显著。尤为突出的是，罗马城本身将物质财富与政治影响集中于一处；即便324年在博斯普鲁斯海峡边的君士坦丁堡建立了第二座帝国都城，罗马的这种优势地位仍延续了很长时间。4 即使四世纪西部宫廷先后迁往特里尔、米兰，并最终于408年迁至拉文纳，也无损于罗马作为首要权力舞台的突出地位。476年之后西部帝号的中断同样未能立即动摇其地位。尽管环绕地中海的城市在许多情况下人口与建成区面积都在缩减，但约500年时，它们仍构成了欧洲迄今最富庶的地带。国家驱动的交换仍定期将大量谷物、葡萄酒和橄榄油以及奢侈品从地中海一端运往另一端，补充帝国粮仓，维系城市的壮丽景象。\n帝国在西部的控制土崩瓦解，一切都随之改变。帝国统治的终结意味着其庞大的军事与官僚体制以及维系这套体制的征敛、赋税和铸币体系逐渐解体——有时则是被蓄意肢解。城市公益捐赠与帝国纪念性建筑的传统也随之衰败，在某些地方迅速消亡，在另一些地方则较为缓慢。在这一变化了的环境中，边缘行省的城市艰难求生；而离地中海较近的大多数城市得以延续，尽管规模缩减。当武士精英从罗马领土上划出新的政体时，他们以乡村地产所有者的身份立足，但总体上对作为权力舞台的城市保持尊重的态度，即使这些城市中心已残破不堪、部分被废弃、经济凋敝。\n五、六、七世纪的整体后果可以概述如下。世俗精英日益乡村化和军事化；各地城市里的公共展示、城市生活方式与文官意识形态充其量遭到严重削弱，而在西部的大部分地区（与东部不同）则完全崩溃。只有主教和教士继续在城市中兴建建筑；在他们的主导下，教堂的增殖改变了城市环境的面貌与性质。与此同时，昔日远距离贩运货物的交换体系走向瓦解。到七世纪中叶，连地中海经济也解体为若干大体自治的区域性活动圈，圈内有少量货物流通，各圈之间仅靠无规律的港口间航运相连。各个地中海微观区域的运转水平已不复相同；尤其在西地中海盆地，经济活动跌至远低于东端的水平。这也波及罗马：到八世纪，这座萎缩的城市仅靠其紧邻的腹地供养，城市公共展示也让位于教会的慷慨营造。\n罗马国家驱动经济的终结是一个渐进而曲折的过程，无法精确断代，但其结果显而易见。虽然政治需要与资源需求曾促使帝国到遥远疆界之外寻求原料与珍稀物品，但军事边疆始终是罗马财政体系及其货币经济的明确界限。税收国家的终结和钱币规律性铸造的停止，实际上模糊了边疆内外经济体系之间的分野。此外，出现的并非一种新的统一经济，而是一系列相互重叠的地方性和区域性经济。除意大利外，这些经济的特征和节点更多是乡村性的而非城市性的，其货币也从黄金转向白银。\n尽管这些变化大致与后帝国时期诸王国的形成同时发生，但新的政治与经济版图绝不相重合。这在高卢尤为明显：法兰克诸王向南谋求利用地中海贸易，直到七世纪，东方物品仍经由商贸城市马赛源源北流；但与此同时，他们也把目光投向北方，即莱茵河口及其以外地区。在这里，迅速扩张的弗里西亚人至迟在六世纪晚期已享有黄金富足的社会，并共享北海沿岸各地的共同文化；到七世纪初，弗里西亚成为把法兰克人愈益吸引进欧洲北部竞技场的磁石。因此，法兰克王国横跨地中海与北海两大经济区域。\n在北海周围，新的交通与交换模式将昔日被罗马政治边疆所切分的各地区重新整合起来。其轮廓到七世纪初已清晰可见。从塞纳河口到大陆上日德兰半岛根部，以及在不列颠从索伦特到亨伯河流域，一批新的沿海或河口的生产与交换中心发展起来，即所谓“商站”（emporia）或“威克”（wics）。这些中心仅繁盛于七、八、九三个世纪，是滨水的手工业生产与贸易中心，将来自区域腹地的货物转运至海外其他领土和王国。例如，在特里尔以北的艾费尔山区开采的玄武岩磨石就这样运抵莱茵三角洲，向北穿越丹麦半岛进入波罗的海南部，又跨越海峡到达英格兰南部海岸——这种流通全然不受政治疆界的限制。\n约800年时，商站已遍布斯堪的纳维亚南部和波罗的海地区，那里的琥珀、毛皮和象牙出口换取羊毛布匹、葡萄酒、陶器、陶瓷器和武器的输入。即使某些商站确实位于前罗马帝国领土之内，其选址也不是古老的罗马城市，而是一种新型的货物集散节点。它们没有防御工事，往往只在特定季节有人居住，居民多为不携妻儿的男子。其典型特征是，商站本身并非王室或贵族领权的中心，但通常与这类中心保持着紧密且很可能是直接的关系：如在索伦特
